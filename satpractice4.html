<script>
const D={"t":"SATPractice4","q":[{"i":"c14daa3c","c":"vocab","d":"H","s":"Close analysis of the painting Girl with a Flute, long attributed to the seventeenth-century Dutch painter Johannes Vermeer, has revealed subtle deviations from the artist’s signature techniques. These variations suggest that the work may be that of a student under Vermeer’s tutelage— potentially ______ our understanding of Vermeer as a solitary artist.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["negating","prefiguring","entrenching","substantiating"],"a":0,"r":"Choice A is the best answer. \"Negating\" means \"reversing\" or \"making invalid.\" Proving that Vermeer worked with students would reverse the view of him as a solitary artist. Choice B is incorrect. \"Prefiguring\" means \"being an early indicator of.\" There already existed views of Vermeer as a solitary painter, so a new painting would not be an early indicator of those views. Rather, a painting proving that Vermeer had a student would contradict those earlier views. Choice C is incorrect. \"Entrenching\" means \"solidifying.\" A painting proving that Vermeer had a student would not solidify views of him as solitary, but would rather contradict those views. Choice D is incorrect. \"Substantiating\" means \"supporting with proof.\" A painting proving that Vermeer had a student would not support views of him as solitary, but would rather contradict those views."},{"i":"6017ae31","c":"vocab","d":"H","s":"In 2016, Gabriela González and team announced that a chirping sound captured by Laser Interferometer Gravitational-Wave Observatory antennas was direct evidence of gravitational waves, which skeptics had argued would be too faint for detection. Detailed statistical analysis helped preclude claims of the event’s ______, confirming the signal at a confidence level of over 99%.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["inconspicuousness","discretion","ambiguity","probability"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Gabriela González and team’s detection of gravitational waves. In this context, \"ambiguity\" means uncertainty or doubtfulness. The text explains that although skeptics had thought that direct evidence of gravitational waves would be too faint to be detected, researchers led by González claimed that a chirping sound captured by Laser Interferometer Gravitational-Wave Observatory antennas nevertheless provided such evidence. The text goes on to say that detailed statistical analysis confirmed the observation of gravitational waves with a high degree of confidence—that is, with near certainty—a finding that helped to preclude, or rule out, any claims that the signal’s attribution to gravitational waves might be ambiguous or doubtful. Choice A is incorrect. In this context, \"inconspicuousness\" would mean the quality of being unnoticeable or difficult to detect. Although the text indicates that skeptics had doubted whether gravitational waves could be observed directly because of their presumed faintness (which suggests that gravitational waves were expected to be difficult to detect), the blank portion of the text isn’t referring to the possibility that gravitational waves are unnoticeable or undetectable. Instead, the focus of the last sentence is González’s team’s observation of a chirping sound that they attributed to gravitational waves, and it wouldn’t make sense to say that through statistical analysis, they ruled out the possibility that the sound they observed was undetectable. Rather, the skeptical view presented in the text suggests that there could be some ambiguity about the source of the chirping, but statistical analysis virtually eliminated this uncertainty. Choice B is incorrect because in this context, \"discretion\" would mean good judgment, and it wouldn’t make sense to say that an event, such as the detection of gravitational waves, would show judgment, much less that the event’s capacity to exercise good judgment would be precluded by statistical analysis confirming its attribution. Choice D is incorrect because in this context, \"probability\" would mean likelihood, and the text states that statistical analysis, which confirmed the signal with a high degree of confidence, suggests the likelihood that the chirping sound was produced by gravitational waves, not that the analysis helped to preclude this likelihood."},{"i":"995358b4","c":"vocab","d":"M","s":"In a 2022 study, Nicolás M. Morato and colleagues attempted to resolve a long-standing paradox: although water is critical to most reactions that enable life, during the earliest stages of Earth’s history—when most of the planet’s surface was covered by oceans—the presence of water likely ______ the formation of proteins and other biomolecules that are found in all living organisms.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["reflected","hampered","imitated","exploited"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of a scientific paradox regarding water and life during Earth’s early history. In this context, “hampered” means hindered or impeded. The text discusses a paradox, or a situation that seems to contradict itself, and indicates that one half of the paradox is that the presence of water is necessary to support most biochemical reactions that enable life. The contradictory idea, then, would be a case of the presence of water not supporting such reactions; this context suggests that the other half of the paradox is that when oceans covered most of the planet, the water likely hindered or impeded a biochemical process (the formation of biomolecules) that is important for all living organisms. Choice A is incorrect. In this context, “reflected” would mean showed or gave an indication. The text focuses on a paradox, or a seemingly self- contradictory situation, having to do with the role of water in supporting life; since the first part of the paradox has to do with water usually being essential for enabling life, the second part of the paradox should have to do with water having a negative effect on life, and water being an indication of a biomolecular process important for life wouldn’t be a negative thing. Choice C is incorrect. In this context, “imitated” would mean mimicked or copied, and it isn’t clear what it would mean to say that water being present on early Earth’s surface somehow copied the creation of biomolecules in living organisms. Choice D is incorrect. In this context, “exploited” would mean used or took advantage of, and it isn’t clear what it would mean to say that the presence of water—the fact of water being present—on early Earth’s surface somehow took advantage of a biomolecular process occurring in living organisms."},{"i":"3118ca93","c":"vocab","d":"E","s":"The fashion resale market, in which consumers purchase secondhand clothing from stores and online sellers, generated nearly $30 billion globally in 2019. Expecting to see continued growth, some analysts ______ that revenues will more than double by 2028.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["produced","denied","worried","predicted"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the fashion resale market’s continued growth. As used in this context, “predicted” means forecast, or indicated that something would happen in the future. The text indicates that the fashion resale market made a lot of money in 2019 and that some analysts expected the market to continue to grow. This context suggests that the analysts believed that the fashion resale market was going to make more money than it had already made, with the analysts indicating that revenues would more than double by 2028. Choice A is incorrect because it wouldn’t make sense in context to say that some analysts “produced,” or manufactured or brought about, the increase in future revenues of the fashion resale market. The analysts themselves couldn’t have brought about the future revenue growth, since, as the text suggests, they were merely in the position of drawing conclusions about future fashion resale market revenue based on 2019 revenue. Choice B is incorrect because the text indicates that some analysts expected the fashion resale market to continue to grow in the future, not that they “denied,” or rejected, this notion. Nothing in the text supports the idea that these analysts thought the revenues wouldn’t grow. Choice C is incorrect because the text indicates that some analysts expected the fashion resale market to continue to grow in the future, not that they “worried,” or felt concerned, that revenue would significantly increase by 2028. Nothing in the text suggests that the analysts felt concerned about the increase; rather, the text suggests that the increase would represent a favorable outcome, since it would mean that the fashion resale market grew to generate even more revenue."},{"i":"fb8b56bc","c":"purpose","d":"E","s":"The following text is adapted from George Bernard Shaw’s 1912 play Pygmalion. Henry Higgins has just arrived at the house of his mother (Mrs. Higgins). She is expecting her friends to visit soon. MRS. HIGGINS: I’m serious, Henry. You offend all my friends: they stop coming whenever they meet you. HIGGINS: Nonsense! I know I have no small talk; but people don’t mind. MRS. HIGGINS: Oh! don’t they? Small talk indeed! What about your large talk? Really, dear, you mustn’t stay.\n\nWhich choice best states the main purpose of the text?","o":["To describe what Henry’s mother does when she goes out with her friends","To show that Henry’s mother wants him to leave","To present a detailed account of what Henry’s home looks like","To explain why Henry often visits his mother"],"a":1,"r":"Choice B is the best answer because it most accurately states the main purpose of the text, which is to show that Henry’s mother, Mrs. Higgins, wants Henry to leave her house. In the text, Mrs. Higgins complains that Henry offends all her friends and that they stop coming when he’s also visiting. She then tells him directly, \"you mustn’t stay.\" The overall exchange conveys Mrs. Higgins’s intention for Henry to leave so as not to drive away her friends with his behavior. Choice A is incorrect because the text doesn’t indicate what Henry’s mother does when she’s out with her friends. Instead, it focuses on what goes on when Henry and her friends visit her at the same time, indicating that since her friends find Henry’s company disagreeable, she wishes him to leave before they arrive. Choice C is incorrect because the text doesn’t contain an account of what Henry’s home looks like. The setting is established as the house of Henry’s mother, and the dialogue focuses solely on her wish that Henry should depart before her friends arrive. Choice D is incorrect because the text doesn’t mention how often Henry visits his mother nor does it provide any explanation for why he visits his mother. Instead, it indicates that she thinks her friends dislike Henry and that she therefore wants him to depart before they arrive."},{"i":"1090b367","c":"purpose","d":"M","s":"Today composer Scott Joplin is mainly celebrated for his catchy ragtime pieces “Maple Leaf Rag” and “The Entertainer.” However, by overlooking his less famous works, listeners will miss the full range of Joplin’s creativity. For instance, his waltz “Pleasant Moments” and his opera Treemonisha skillfully blend ragtime and classical music. These masterpieces deserve as much fame as Joplin’s biggest hits.\n\nWhich choice best states the main purpose of the text?","o":["To describe the similarities and differences between ragtime music and opera","To argue that more attention should be given to Joplin’s lesser-known works","To encourage music lovers to listen to music by many different composers","To explain how Joplin learned to compose and perform ragtime music"],"a":1,"r":"Choice B is the best answer because it best states the main purpose of the text, which is to make a case for the importance of Scott Joplin’s less famous works. The text begins by introducing Joplin’s most popular works and then goes on to assert that gaining a full understanding of Joplin’s creativity requires a consideration of his lesser-known pieces as well. The text concludes by characterizing the lesser-known works \"Pleasant Moments\" and Treemonisha as masterpieces that deserve to be famous. These details indicate that the text’s main purpose is to argue that more attention should be given to Joplin’s lesser-known works. Choice A is incorrect. Although the text discusses some of the ragtime music and an opera that Joplin composed, it does not compare the two types of music in general. Instead, the text argues that Joplin’s lesser-known works, including his opera, deserve as much attention as his more famous ragtime pieces receive. Choice C is incorrect because the text discusses only Joplin’s music and does not ask music lovers to listen to a variety of composers. Instead, the text encourages listeners to pay attention to Joplin’s lesser-known works in order to gain a full understanding of his creativity. Choice D is incorrect because the text does not discuss how Joplin learned to compose and perform ragtime music. Instead, the text focuses on Joplin’s less famous works and makes a case for their importance."},{"i":"a70cbc53","c":"func","d":"H","s":"Raymond Antrobus, an accomplished poet and writer of prose, recently released his debut spoken word poetry album, The First Time I Wore Hearing Aids, in collaboration with producer Ian Brennan. The album contains both autobiographical and reflective pieces combining Antrobus’s spoken words with Brennan’s fragmented audio elements and pieces of music to convey how people who are deaf may experience sound, both its presence and absence. Some critics suggest that the album questions the function of sound in the world, highlighting that the experience of sound is multifaceted.\n\nWhich choice best describes the overall structure of the text?","o":["It introduces a collaborative spoken word poetry project, details the approach taken to produce the work, and then provides an example of critique the album received upon release.","It mentions a collection of spoken word poems, distinguishes one poem as being an exemplar on the album, and then offers a summary of the subject matter of the whole collection.","It summarizes the efforts to produce a collection of spoken word poems, presents biographies of two people who worked on the album, and speculates about the meaning behind the poetry.","It connects two artists to the same spoken word poetry project, explains the extent of their collaboration on each poem, and then provides an overview of the technique used to produce the work."],"a":0,"r":"Choice A is the best answer. The text first introduces the album as being a collaboration between Antrobus and Brennan, then describes the approach taken to produce it, then mentions how critics have said that it calls into question the function of sound. Choice B is incorrect. While the text does mention a collection of spoken word poems, it doesn’t single out one poem as being particularly noteworthy. Additionally, the text doesn’t simply summarize the subject matter—it goes into detail about the content and production of the album. Choice C is incorrect. The text doesn’t provide biographical information about the two artists, and the text doesn’t speculate about the meaning behind the poetry—instead, it relays what some critics have said about the album. Choice D is incorrect. The text doesn’t provide just an overview of the production techniques used but instead goes into more detail about the content and audio elements of the album, as well as critical response to the album."},{"i":"ca50de52","c":"func","d":"H","s":"<u>“How lifelike are they?”<\/u> Many computer animators prioritize this question as they strive to create ever more realistic environments and lighting. Generally, while characters in computer-animated films appear highly exaggerated, environments and lighting are carefully engineered to mimic reality. But some animators, such as Pixar’s Sanjay Patel, are focused on a different question. Rather than asking first whether the environments and lighting they’re creating are convincingly lifelike, Patel and others are asking whether these elements reflect their films’ unique stories.\n\nWhich choice best describes the function of the underlined question in the text as a whole?","o":["It reflects a primary goal that many computer animators have for certain components of the animations they produce.","It represents a concern of computer animators who are more interested in creating unique backgrounds and lighting effects than realistic ones.","It conveys the uncertainty among many computer animators about how to create realistic animations using current technology.","It illustrates a reaction that audiences typically have to the appearance of characters created by computer animators."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined question in the text as a whole. The text begins with the underlined question, “How lifelike are they?” The text then explains that many computer animators pose this question about the environments and lighting that they create for animated films, striving for realistic animation of those components even if the characters themselves aren’t portrayed in realistic terms. The focus of the text then shifts to describe how some animators strive to create environments and lighting that reflect the film’s unique stories rather than making them appear realistic. Therefore, the function of the underlined question is to reflect a primary goal that many computer animators have for certain components of the animations they produce. Choice B is incorrect because, as the text makes clear, the underlined question is one posed by computer animators who wish to create realistic backgrounds and lighting effects, not by those who, instead, wish to create effects that reflect films’ unique stories and aren’t necessarily realistic; this latter group of animators is discussed later in the text. Choice C is incorrect. As the text explains, many computer animators strive for realistic environments and lighting, while others do not; this difference of approach relates to whether these components should be realistic, not to how realism can be achieved using current technology, and the text never suggests that animators are uncertain how to achieve it. Choice D is incorrect because the underlined question pertains to the perspective of computer animators, not the audience, and the text never considers audience’s reactions to characters in animated films."},{"i":"70612a79","c":"structure","d":"E","s":"Following the eradication of the gray wolf in Yellowstone National Park in 1926, the population of elk—a primary prey of the gray wolf—exceeded a healthy size for the park’s ecosystem. Elk overpopulation led to overgrazing of areas that a multitude of other animals relied on for food and shelter. As scientists began to see how essential the gray wolf was to the Yellowstone food chain, ecological restoration strategies were employed to reintroduce the gray wolf to the park in 1996. The rebound effect in the park’s natural ecosystem was noticed almost immediately.\n\nWhich choice best describes the overall structure of the text?","o":["It summarizes a problem that developed in Yellowstone National Park in the 1920s and then offers potential solutions to that problem.","It mentions the elimination of the gray wolf from Yellowstone National Park and then explains why the wolf was eventually restored to the park.","It presents a claim about the health of the Yellowstone National Park gray wolf population and then gives specific examples to support that claim.","It explains why Yellowstone National Park allowed the eradication of the gray wolf and then discusses the consequences of reintroducing the wolf to the park."],"a":1,"r":"Choice B is the best answer because it most accurately describes the overall structure of the text. The text begins by stating that the gray wolf was eradicated from Yellowstone National Park in 1926. It then explains the consequences of this elimination—namely that the elk population grew too large and overgrazing occurred, negatively affecting other animals in the area. The text then states that once scientists realized the importance of the gray wolf to the Yellowstone food chain, they undertook efforts leading to the wolves’ reintroduction to the park in 1996. Thus, the structure of the text can be accurately described as mentioning the elimination of the gray wolf from Yellowstone and then explaining why the wolf was later restored to the park. Choice A is incorrect. While the text does summarize a problem associated with an event in the 1920s (the eradication of gray wolves from Yellowstone in 1926), the problems discussed arose after that event—namely, the subsequent elk overpopulation, resultant overgrazing, and then further impacts to other animals in Yellowstone. Furthermore, the text doesn’t present multiple potential solutions. Instead, it describes one solution that was actually implemented: the reintroduction of gray wolves in 1996. Choice C is incorrect because the text doesn’t make a claim about the health of the gray wolf population apart from pointing out that the wolves had been eradicated from, and then subsequently restored to, Yellowstone. Instead, the text focuses on outcomes associated with the gray wolf’s eradication and reintroduction. Choice D is incorrect. Though the text does mention that the ecosystem of Yellowstone rebounded after the gray wolf was reintroduced in 1996, the text never explains why the park allowed the wolves to be eradicated in 1926. It simply states that this eradication occurred without elaborating on the decision- making process behind it."},{"i":"82c05b34","c":"cross","d":"M","s":"Text 1 The live music festival business is growing in event size and genre variety. With so many consumer options, organizers are finding ways to cement festival attendance as a special experience worth sharing. This phenomenon is linked to the growing “experiential economy,” where many find it gratifying to purchase lived experiences. To ensure a profitable event, venues need to consider the overall consumer experience, not just the band lineup.\n\nText 2 Music festival appearances are becoming a more important part of musicians’ careers. One factor in this shift is the rising use of streaming services that allow access to huge numbers of songs for a monthly fee, subsequently reducing sales of full-length albums. With this shift in consumer behavior, musicians are increasingly dependent on revenue from live performances.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Consumers are more interested in paying subscription fees to stream music than in attending music festivals in person.","Consumers’ growing interest in purchasing experiences is mostly confined to the music industry.","Changing consumer behaviors are leading to changes in music-related businesses.","The rising consumer demand for live music festivals also generates higher demand for music streaming platforms."],"a":2,"r":"Choice C is the best answer. Both authors mention how consumer behaviors have shifted, and how this affects different aspects of the music industry. Text 1 states that consumers enjoy purchasing “lived experiences,” and that this influences how organizers design music festivals. Text 2 states that consumers are using streaming services more, and that this reduces album sales and increases the importance of live performances for musicians. Choice A is incorrect. Neither text claims that consumers prefer streaming to festivals, or that these are mutually exclusive options. Text 1 implies that festivals are popular and profitable, and Text 2 never suggests that streaming services diminish the demand for live music. Choice B is incorrect. This choice misreads Text 1, which identifies music festivals as just one example of a broader trend of purchasing “lived experiences.” Text 2 doesn’t mention growing interest in purchasing experiences, in the music industry or otherwise. Choice D is incorrect. Neither text establishes a cause/effect relationship between the demand for festivals and the demand for streaming platforms. Text 1 does not mention streaming platforms at all, and Text 2 does not imply that streaming platforms benefit from the popularity of festivals."},{"i":"de0a5b4e","c":"main","d":"E","s":"In 2022, researchers rediscovered ancient indigenous glyphs, or drawings, on the walls of a cave in Alabama. The cave’s ceiling was only a few feet high, affording no position from which the glyphs, being as wide as ten feet, could be viewed or photographed in their entirety. However, the researchers used a technique called photogrammetry to assemble numerous photos of the walls into a 3D model. They then worked with representatives of tribes originally from the region, including the Chickasaw Nation, to understand the significance of the animal and humanoid figures adorning the cave.\n\nAccording to the text, what challenge did the researchers have to overcome to examine the glyphs?","o":["The cave was so remote that the researchers couldn’t easily reach it.","Some of the glyphs were so faint that they couldn’t be photographed.","The researchers were unable to create a 3D model of the cave.","The cave’s dimensions prevented the researchers from fully viewing the glyphs."],"a":3,"r":"Choice D is the best answer. The text describes the very low ceiling of the cave, making it impossible to photograph the very wide glyphs all at once. Choice A is incorrect. The text doesn’t say this. It never suggests that the cave was remote or difficult to access, just that the cave itself was difficult to photograph well. Choice B is incorrect. The text doesn’t say this. The glyphs were so wide that they couldn’t be photographed completely. Choice C is incorrect. The text states the opposite of this. The researchers “used a technique called photogrammetry to assemble numerous photos of the walls into a 3D model.”"},{"i":"35b46381","c":"main","d":"H","s":"In their 2022 paper, Christos Dimopoulos et al., having granted that the existence of antigravity—in which antimatter and matter repel rather than attract each other—lacked affirmative experimental support, rightly argued that such antigravity was worth considering on theoretical grounds given that evidence against it was similarly lacking. But a 2023 report by an international team of researchers details the first direct ballistic observations of antihydrogen atoms under gravity inside a CERN particle accelerator. Corresponding most closely to predictions under gravitational attraction, these observations were thoroughly inconsistent with antigravity.\n\nWhich choice best states the main idea of the text?","o":["Antihydrogen ballistics observations were conducted at CERN to test specific conclusions about antigravity presented in the 2022 paper by Dimopoulos et al.","Although theoreticians were justified in studying antigravity before the release of the 2023 report, the report’s findings suggest that the rationale for theoretical consideration offered in the 2022 paper by Dimopoulos et al. is no longer applicable.","The theoretical approach represented in the 2022 paper by Dimopoulos et al. assumed that unambiguous proof of antigravity would not be achievable, but the results in the 2023 report undermine that assumption.","Before 2023, researchers’ inordinate focus on theoretical considerations hindered the development of the experimental regimen for direct antihydrogen ballistics observations."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The text begins by acknowledging that in 2022, Dimopoulos et al. were justified in arguing for antigravity on theoretical grounds because although there was no experimental evidence supporting its existence at that time, there was no evidence contradicting its existence either. The text then introduces the 2023 report describing an experiment that produced observations \"thoroughly inconsistent with antigravity.\" Thus, the main idea is that while the study of antigravity was theoretically justified before the 2023 report (due to lack of evidence against it), the report’s findings undermine the rationale for such theoretical consideration since there is now evidence against this hypothetical phenomenon. Choice A is incorrect. Although antihydrogen ballistics observations were conducted at CERN, the text provides no evidence that they were conducted to test conclusions in Dimopoulos et al.’s 2022 paper. Rather, the text presents the 2023 report as new evidence that contradicts the existence of the hypothetical phenomenon that Dimopoulos et al. had considered. Choice C is incorrect because the text doesn’t suggest that Dimopoulos et al. assumed that unambiguous proof of antigravity would be unattainable. Rather, the text states that they argued antigravity was worth considering theoretically because evidence against it was lacking at that time. At the same time, the results in the 2023 report do not undermine but strengthen the idea that the proof of antigravity might not be achievable. Choice D is incorrect because the text doesn’t suggest that there was an \"inordinate focus on theoretical considerations\" before 2023 or that such a focus hindered the development of experimental methods. In fact, the text describes Dimopoulos et al.’s position regarding the theoretical consideration of antigravity as \"rightly argued,\" indicating approval of their approach given the absence of experimental evidence at that time."},{"i":"cac82f9b","c":"infer","d":"M","s":"Biologist Natacha Bodenhausen and colleagues analyzed the naturally occurring bacterial communities associated with leaves and roots of wild Arabidopsis thaliana, a small flowering plant. The researchers found many of the same bacterial genera in both the plants’ leaves and roots. To explain this, the researchers pointed to the general proximity of A. thaliana leaves to the ground and noted that rain splashing off soil could bring soil-based bacteria into contact with the leaves. Alternatively, the researchers noted that wind, which may be a source of bacteria in the aboveground portion of plants, could also bring bacteria to the soil and roots. Either explanation suggests that ______ Which choice most logically completes the text?","o":["bacteria carried by wind are typically less beneficial to A. thaliana than soil-based bacteria are.","some bacteria in A. thaliana leaves and roots may share a common source.","many bacteria in A. thaliana leaves may have been deposited by means other than rain.","A. thaliana leaves and roots are especially vulnerable to harmful bacteria."],"a":1,"r":"Choice B is the best answer. Both explanations suggest that the bacteria come from the same place: either they come from the ground and make their way to the leaves, or they come from above the ground and make their way to the roots. Choice A is incorrect. This inference isn’t supported. The text never discusses any benefits of any kind of bacteria. Choice C is incorrect. This conflicts with the text. One of the theories is that the bacteria in the leaves were deposited by rain splashing off soil. Choice D is incorrect. This inference isn’t supported. The text only discusses “naturally occurring” bacteria. It never mentions either the harms or benefits of these bacteria."},{"i":"d8b78a2b","c":"infer","d":"M","s":"Red velvet cake has been a favorite dessert of many for years, but the recipe’s origins are unclear. A bakery in Dallas, Texas, argued that it created the first recipe for the cake when the bakery opened in the 1860s. The Adams Extract Co., which sells baking products, claims to have created the recipe in the 1930s to help market their red dye. A US hotel and a Canadian department store also publicly stated that the red velvet cake sold in each of their establishments in the 1930s was an original creation, each alleging that it was the recipe author. No clear evidence has emerged to favor one of these claims over the others, however. It thus seems that ______ Which choice most logically completes the text?","o":["red velvet cake was first baked sometime before the 1860s.","we cannot say at present who actually baked the first red velvet cake.","none of the supposed inventors of red velvet cake are likely to have invented it.","the bakery in Dallas, Texas, probably invented red velvet cake."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically completes the text’s discussion of competing claims about the origins of red velvet cake. The text states that the origins of the recipe for red velvet cake \"are unclear.\" The text then presents four different entities that claim to have created the first red velvet cake recipe: a Dallas bakery (1860s), the Adams Extract Co. (1930s), a US hotel (1930s), and a Canadian department store (1930s). Lastly, the text states that \"no clear evidence has emerged to favor one of these claims over the others.\" Given this information, it most logically follows that it’s not possible to determine who baked the first red velvet cake, as there is insufficient evidence to determine which claim, if any, is correct. Choice A is incorrect because the text doesn’t provide information indicating that red velvet cake existed before the 1860s. According to the text, the earliest claim for creating red velvet cake comes from a bakery in Dallas, Texas, that asserted it developed the first recipe for the cake at the time of the bakery’s opening in the 1860s. There’s no textual support for the conclusion that the cake existed before this earliest claimed date, since the text presents only competing claims starting from the 1860s and extending to the 1930s without evidence of earlier origins. Choice C is incorrect because the text doesn’t support the conclusion that none of the supposed inventors of red velvet cake likely invented the cake. The text states that multiple entities claim to have invented the recipe and that \"no clear evidence has emerged to favor one of these claims over the others.\" This lack of decisive evidence doesn’t logically lead to the conclusion that all the claims are false; it merely indicates that the cake’s true origins can’t be determined with the available evidence. The text leaves open the possibility that one of the claimants could indeed be the actual inventor. Choice D is incorrect because the text provides no basis for concluding that the Dallas bakery is \"probably\" the inventor of red velvet cake. While the text mentions that this bakery claims to have created the recipe in the 1860s (making it the earliest claim), the text explicitly states that there’s no definitive evidence supporting any of the claims about the cake’s origins over the others. The text presents all claims as equally lacking in definitive supporting evidence."},{"i":"a44bbd6b","c":"claim","d":"H","s":"Several studies of sediment (e.g., dirt, pieces of rock, etc.) in streams have shown an inverse correlation between sediment grain size and downstream distance from the primary sediment source, suggesting that stream length has a sorting effect on sediment. In a study of sediment sampled at more than a dozen sites in Alpine streams, however, geologists Camille Litty and Fritz Schlunegger found that cross-site variations in grain size were not associated with differences in downstream distance, though they did not conclude that downstream distance is irrelevant to grain size. Rather, they concluded that sediment influx in these streams may have been sufficiently spatially diffuse to prevent the typical sorting effect from being observed.\n\nWhich finding about the streams in the study, if true, would most directly support Litty and Schlunegger’s conclusion?","o":["The streams regularly experience portions of their banks collapsing into the water at multiple points upstream of the sampling sites.","The streams contain several types of sediment that are not typically found in streams where the sorting effect has been demonstrated.","The streams mostly originate from the same source, but their lengths vary considerably due to the different courses they take.","The streams are fed by multiple tributaries that carry significant volumes of sediment and that enter the streams downstream of the sampling sites."],"a":0,"r":"Choice A is the best answer. This finding would support the conclusion. If stream banks are collapsing into the water at multiple points, then sediment is getting into the water at those various points. This supports the conclusion that the inflow of sediment is very spread out. Choice B is incorrect. This finding wouldn’t support the conclusion. The conclusion is about the influx of sediment being “spatially diffuse,” meaning spread out over a large area. The type of sediment wouldn’t have an impact on the conclusions. Choice C is incorrect. This finding wouldn’t support the conclusion. It doesn’t say anything about the influx of sediment being “spatially diffuse” (spread out). Choice D is incorrect. This finding wouldn’t support the conclusion. Any sediment that enters downstream of the sampling sites wouldn’t end up in the samples, so it wouldn’t affect the findings or the conclusion."},{"i":"d696eafa","c":"claim","d":"H","s":"Early Earth is thought to have been characterized by a stagnant lid tectonic regime, in which the upper lithosphere (the outer rocky layer) was essentially immobile and there was no interaction between the lithosphere and the underlying mantle. Researchers investigated the timing of the transition from a stagnant lid regime to a tectonic plate regime, in which the lithosphere is fractured into dynamic plates that in turn allow lithospheric and mantle material to mix. Examining chemical data from lithospheric and mantle-derived rocks ranging from 285 million to 3.8 billion years old, the researchers dated the transition to 3.2 billion years ago.\n\nWhich finding, if true, would most directly support the researchers’ conclusion?","o":["Among rocks known to be older than 3.2 billion years, significantly more are mantle derived than lithospheric, but the opposite is true for the rocks younger than 3.2 billion years.","Mantle-derived rocks older than 3.2 billion years show significantly more compositional diversity than lithospheric rocks older than 3.2 billion years do.","There is a positive correlation between the age of lithospheric rocks and their chemical similarity to mantle-derived rocks, and that correlation increases significantly in strength at around 3.2 billion years old.","Mantle-derived rocks younger than 3.2 billion years contain some material that is not found in older mantle-derived rocks but is found in older and contemporaneous lithospheric rocks."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would most directly support the researchers’ conclusion that the transition from a stagnant lid regime to a tectonic plate regime occurred around 3.2 billion years ago. The text explains that early in Earth’s history, Earth exhibited a stagnant lid regime in which there’s no interaction between the lithosphere and the underlying mantle. The text further explains that, by contrast, once Earth began to exhibit a tectonic plate regime, its lithospheric and mantle material began to mix. If mantle-derived rocks younger than 3.2 billion years contain material not found in older mantle-derived rocks, that material must have originated somewhere other than the mantle. And if this material is found in both older and contemporaneous lithospheric rocks, that would imply that the lithosphere was able to mix with mantle material beginning around 3.2 billion years ago, as the researchers concluded. Choice A is incorrect. The text gives no basis for comparing the quantities of lithospheric and mantle-derived rocks. Choice B is incorrect. The text gives no basis for comparing the material makeup of lithospheric rocks to that of mantle-derived rocks. Choice C is incorrect. A positive correlation between the age of lithospheric rocks and these rocks’ chemical similarity to mantle-derived rocks would mean that the oldest rocks would be the most similar, which contradicts the text’s claim that lithospheric and mantle-derived rocks were completely separate until 3.2 billion years ago. If the researchers’ conclusion about the onset of tectonics on Earth is correct, then younger lithospheric rocks would show greater chemical similarity to mantle-derived rocks than older lithospheric rocks do."},{"i":"4411e15b","c":"graph","d":"H","s":"","o":["the selection process that enabled the Navajo-Churro to retain its somewhat coarse outer fiber also resulted in inner fiber that, at its softest, is softer than either the mouflon’s or the Merino’s inner fiber.","the Navajo-Churro more closely resembles its ancestor, the mouflon, in the uniform softness of its inner fiber, while the Merino more closely resembles the mouflon in the variable diameter of its outer fiber.","domestication resulted in a counterintuitive increase in the inner fiber’s minimum diameter, making the inner fiber of the Merino and the Navajo-Churro less suitable for delicate garments than the mouflon’s inner fiber is.","the domestication of the mouflon and the subsequent selection process that produced the Merino and the Navajo-Churro resulted in greater softness of outer and inner fiber alike."],"a":0,"r":"Choice A is the best answer because it accurately uses data from the table to complete the statement about the fibers of three types of sheep. The text discusses some qualities of outer and inner fibers of mouflons, Spanish Merino sheep, and Navajo-Churro sheep and indicates that sheep fibers with finer, or smaller, diameters are softer than fibers with larger diameters. The text then sets up a conclusion that can be made by comparing the fibers of all three sheep types. The table shows that the minimum diameter of the Navajo-Churro’s inner fibers is 10 microns, which is smaller than the minimum diameters of the inner fibers of both the mouflon (15 microns) and the Spanish Merino (17 microns). Thus, comparing the fiber characteristics of all three sheep reveals that at its softest, the inner fiber of the Navajo-Churro is softer than either the mouflon’s or the Merino’s inner fiber. Choice B is incorrect because it doesn’t accurately describe the data in the table. The table shows that the softness of Navajo-Churro inner fiber isn’t uniform (since the diameter of Navajo-Churro inner fiber ranges from 10 microns to 35 microns) and that the diameter of the outer fiber of the mouflon isn’t variable (rather, it is a uniform 150 microns). Choice C is incorrect because it doesn’t accurately describe the data in the table. The text indicates that both Spanish Merino sheep and Navajo-Churro sheep were domesticated from mouflon sheep. The table doesn’t show that domestication increased the minimum diameter of inner fibers for both Spanish Merino sheep and Navajo-Churro sheep from the 15-micron diameter of mouflon inner fibers: the minimum diameter of Spanish Merino increased to 17 microns, but the minimum diameter of Navajo- Churro inner fibers decreased to 10 microns. Choice D is incorrect because it doesn’t accurately describe the data in the table. The text explains that sheep fibers with finer, or smaller, diameters are softer than fibers with larger diameters. The table does show that Spanish Merino outer fibers are finer, and thus softer, than mouflon outer fibers and that at their finest, Navajo-Churro outer fibers are softer than mouflon outer fibers, but it also shows that Spanish Merino inner fibers are less soft than mouflon inner fibers, since their minimum diameter is greater than 15 microns, and that Navajo-Churro inner fibers can be less soft than mouflon inner fibers, since the diameter ranges up to 35 microns."},{"i":"0ec15b5a","c":"graph","d":"M","s":"","o":["sales and related occupations.","installation, maintenance, and repair occupations.","construction and resource extraction occupations.","management, business, and financial services occupations."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to complete the text. The text discusses self-employed workers in the US, and the table shows the US incorporated and unincorporated self-employment rates in four occupational fields in 2015. According to the table, the incorporated self-employment rate was 8.9% for the management, business, and financial services occupational field, which is higher than the incorporated self-employment rate shown for any other occupational field. Choice A is incorrect because according to the table, the incorporated self-employment rate was 5.8% for the sales and related occupational field, which is lower than the 8.9% for the management, business, and financial services occupational field. Choice B is incorrect because according to the table, the incorporated self-employment rate was 2.7% for the installation, maintenance, and repair occupational field, which is lower than the 8.9% for the management, business, and financial services occupational field. Choice C is incorrect because according to the table, the incorporated self-employment rate was 4.4% for the construction and resource extraction occupational field, which is lower than the 8.9% for the management, business, and financial services occupational field."},{"i":"fced396a","c":"fss","d":"H","s":"The Herfindahl-Hirschman Index (HHI), a commonly used measure of competition between companies in a particular market, ranges from a score of zero to 10,000 points. Compared with that of a highly concentrated market—that is, a market controlled by very few companies—______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["a market that is less concentrated will have a much lower HHI score.","the HHI score of a less concentrated market will be much lower.","when a market is less concentrated, its HHI score will be much lower.","a less concentrated market will have an HHI score that is much lower."],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"the HHI...market\" the subject of the sentence and places it immediately after the modifying phrase \"compared...market.\" In doing so, this choice clearly establishes that the HHI score of a less concentrated market—and not another noun in the sentence—is being compared with the HHI score of a highly concentrated market. Choice A is incorrect because it results in a dangling modifier. The placement of \"a market that is less concentrated\" immediately after the modifying phrase illogically suggests that a market is being compared with an HHI score. Choice C is incorrect because it results in a confusing, illogical sentence. The placement of the modifier \"when a market is less concentrated\" after \"a highly concentrated market\" is contradictory. Furthermore, it’s ambiguous what \"its\" is referring to in \"its HHI score,\" resulting in an illogical comparison. Choice D is incorrect because it results in a dangling modifier. The placement of \"a less concentrated market\" immediately after the modifying phrase illogically suggests that a market is being compared with an HHI score."},{"i":"b5b74c3f","c":"fss","d":"E","s":"When writing The Other Black Girl (2021), novelist Zakiya Dalila Harris drew on her own experiences working at a publishing office. The award- winning book is Harris’s first novel, but her writing ______ honored before. At the age of twelve, she entered a contest to have a story published in American Girl magazine—and won.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["were","have been","has been","are"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb “has been” agrees in number with the singular subject “writing.” Choice A is incorrect because the plural verb “were” doesn’t agree in number with the singular subject “writing.” Choice B is incorrect because the plural verb “have been” doesn’t agree in number with the singular subject “writing.” Choice D is incorrect because the plural verb “are” doesn’t agree in number with the singular subject “writing.”"},{"i":"e62241b7","c":"fss","d":"E","s":"What is the correct pronunciation of Kiribati? In the Gilbertese language spoken by residents of the island nation, the letter combination -ti makes the -s sound; as a result, the country’s name ______ pronounced “Kiribas.”\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are","have been","are being","is"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The singular verb \"is\" agrees in number with the singular subject \"the country’s name.\" Choice A is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"the country’s name.\" Choice B is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"the country’s name.\" Choice C is incorrect because the plural verb \"are being\" doesn’t agree in number with the singular subject \"the country’s name.\""},{"i":"04bfd364","c":"bound","d":"E","s":"The intense pressure found in the deep ocean can affect the structure of proteins in fish’s cells, distorting the proteins’ shape. The chemical trimethylamine N-oxide (TMAO) counters this effect, ensuring that proteins retain their original ______ is found in high concentrations in the cells of the deepest-dwelling fish.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["configurations. TMAO","configurations TMAO","configurations, TMAO","configurations and TMAO"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “configurations” is used correctly to mark the boundary between one sentence (“The intense…configurations”) and another (“TMAO…fish”). The supplementary phrase (“ensuring…configurations”) modifies the main clause of the first sentence (“The chemical…effect”), and “TMAO” is the subject of the second sentence. Choice B is incorrect because it results in a run-on sentence. The sentences (“The intense…configurations” and “TMAO…fish”) are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice D is incorrect. Without a comma preceding it, the conjunction “and” can’t be used in this way to join sentences."},{"i":"960dec02","c":"bound","d":"H","s":"A recent study tracked the number of bee species present in twenty-seven New York apple orchards over a ten-year period. ______ found that when wild growth near an orchard was cleared, the number of different bee species visiting the orchard decreased.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Entomologist Heather Grab:","Entomologist, Heather Grab,","Entomologist Heather Grab","Entomologist Heather Grab,"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between a name and title and between a subject and a verb. No punctuation is needed between the proper noun “Heather Grab” and “entomologist,” the title that describes Grab. Additionally, no punctuation is needed between the sentence’s subject (“Entomologist Heather Grab”) and the main verb (“found”) that indicates what Grab did. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed. Setting the entomologist’s name off with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Choice D is incorrect because no punctuation is needed between the subject and the verb."},{"i":"a1ca7ec4","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Cecilia Vicuña is a multidisciplinary artist. In 1971, her first solo art exhibition, Pinturas, poemas y explicaciones, was shown at the Museo Nacional de Bellas Artes in Santiago, Chile. Her poetry collection Precario/Precarious was published in 1983 by Tanam Press. Her poetry collection Instan was published in 2002 by Kelsey St. Press. She lives part time in Chile, where she was born, and part time in New York. The student wants to introduce the artist’s 1983 poetry collection.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Before she published the books Precario/Precarious (1983) and Instan (2002), Cecilia Vicuña exhibited visual art at the Museo Nacional de Bellas Artes in Santiago, Chile.","Cecilia Vicuña is a true multidisciplinary artist whose works include numerous poetry collections and visual art exhibitions.","Published in 1983 by Tanam Press, Precario/Precarious is a collection of poetry by the multidisciplinary artist Cecilia Vicuña.","In 1971, Cecilia Vicuña exhibited her first solo art exhibition, Pinturas, poemas y explicaciones, in Chile, her country of birth."],"a":2,"r":"Choice C is the best answer. The sentence effectively introduces the poetry collection Precario/Precarious, noting that it is a collection by Vicuña that was published in 1983 by Tanam Press. Choice A is incorrect. While the sentence mentions the 1983 poetry collection Precario/Precarious, it focuses mainly on Vicuña’s visual art. Choice B is incorrect. The sentence doesn’t introduce the 1983 poetry collection Precario/Precarious; instead, it introduces Vicuña. Choice D is incorrect. The sentence emphasizes the location of Vicuña’s 1971 exhibition Pinturas, poemas y explicaciones; it doesn’t introduce the 1983 poetry collection Precario/Precarious."},{"i":"eaded344","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The painter Frida Kahlo is one of the most influential artists of the twentieth century. She was born in Coyoacán, Mexico, in 1907. She is best known for her vivid and richly symbolic self-portraits. The Two Fridas (1939) features two versions of Kahlo sitting together. One version wears a European-style dress and the other a traditional Tehuana dress. The student wants to introduce Kahlo to an audience unfamiliar with the artist.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Known for being vivid and richly symbolic, Frida Kahlo’s self-portraits include The Two Fridas (1939).","The 1939 painting The Two Fridas is one example of a self-portrait by Frida Kahlo.","One painting by Frida Kahlo features two versions of herself, with one version wearing a European-style dress and the other a traditional Tehuana dress.","One of the most influential artists of the twentieth century, Mexican painter Frida Kahlo is best known for her self-portraits, which are vivid and richly symbolic."],"a":3,"r":"Choice D is the best answer. By identifying Kahlo as an influential artist from Mexico, and by describing the work she’s best known for, this choice provides the background information necessary to introduce Kahlo to an unfamiliar audience. Choice A is incorrect. This choice doesn’t effectively introduce Kahlo. It doesn’t include any background information about who Kahlo is or where she’s from. It simply identifies one of her paintings. Choice B is incorrect. This choice doesn’t effectively introduce Kahlo. It doesn’t include any background information about who Kahlo is or where she’s from. It simply identifies one of her paintings. Choice C is incorrect. This choice doesn’t effectively introduce Kahlo. It doesn’t include any background information about who Kahlo is or where she’s from. Instead, it describes one of her paintings in detail."},{"i":"82ec9628","c":"trans","d":"M","s":"Archaeologist Sue Brunning explains why the seventh-century ship burial site at Sutton Hoo in England was likely the tomb of a king. First, the gold artifacts inside the ship suggest that the person buried with them was a wealthy and respected leader. ______ the massive effort required to bury the ship would likely only have been undertaken for a king.\n\nWhich choice completes the text with the most logical transition?","o":["Instead,","Still,","Specifically,","Second,"],"a":3,"r":"Choice D is the best answer. “Second” logically signals that the information in this sentence—that the effort to bury the ship would likely only have been made for a king—joins the information in the previous sentence (“first…”) in supporting Brunning’s claim that the burial site was likely the tomb of a king. Choice A is incorrect because “instead” illogically signals that the information in this sentence presents an alternative or substitute to the previous information about the gold artifacts inside the ship. Rather, this sentence presents a second piece of information that supports Brunning’s claim. Choice B is incorrect because “still” illogically signals that the information in this sentence exists in contrast to or despite the previous information about the gold artifacts inside the ship. Instead, this sentence presents a second piece of information that supports Brunning’s claim. Choice C is incorrect because “specifically” illogically signals that the information in this sentence specifies or elaborates on the previous information about the gold artifacts inside the ship. Instead, this sentence presents a second piece of information that supports Brunning’s claim."},{"i":"e0bd4f8a","c":"trans","d":"E","s":"In 1942, the 1,500-mile Alaska Highway was constructed in under nine months, largely due to the skilled work of nearly 4,000 African American soldiers from US Army engineering regiments. The soldiers’ contribution was overlooked for decades. ______ in 2017, lawmakers declared October 25 a day of recognition—“Alaska Highway Day”—for the troops who helped build this critical roadway.\n\nWhich choice completes the text with the most logical transition?","o":["Lastly,","Then,","Similarly,","For example,"],"a":1,"r":"Choice B is the best answer. \"Then\" logically signals that the event described in this sentence—lawmakers’ 2017 declaration of Alaska Highway Day—is part of a chronological sequence of events, occurring after the decades-long period in which the soldiers’ contribution was overlooked. Choice A is incorrect because \"lastly\" illogically signals that this sentence presents the last of a series of points or reasons. Instead, it describes a later event occurring in a chronological sequence of events. Choice C is incorrect because \"similarly\" illogically signals that the information in this sentence is similar to the previous information about the soldiers’ contribution being overlooked for decades. Instead, it describes an event occurring after that decades-long period. Choice D is incorrect because \"for example\" illogically signals that this sentence provides function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
