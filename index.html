<script>
const D={"q":[{"i":"54804e10","c":"vocab","d":"H","s":"While scholars believe many Mesoamerican cities influenced each other, direct evidence of such influence is difficult to ascertain. However, recent excavations in a sector of Tikal (Guatemala) unearthed a citadel that shows ______ Teotihuacán (Mexico) architecture—including a near replica of a famed Teotihuacán temple—providing tangible evidence of outside influence in portions of Tikal.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["refinements of","precursors of","commonalities with","animosities toward"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of architectural influences among Mesoamerican cities. In this context, “commonalities with” means similarities to or shared attributes with. The text indicates that a recently discovered citadel in Tikal includes a close imitation of a famous temple in Teotihuacán (another Mesoamerican city) and other evidence of Teotihuacán influence, which suggests that the citadel possesses features that resemble architectural features found in Teotihuacán. This context thus indicates that the Tikal citadel shows commonalities with Teotihuacán architecture. Choice A is incorrect because there’s nothing in the text that suggests that the Tikal citadel shows “refinements of,” or improvements on, Teotihuacán architecture. Although the text suggests that the architecture of Teotihuacán influenced the architecture of the Tikal citadel, and although it’s possible that later architectural designs could make improvements on earlier designs, the text doesn’t discuss whether, in imitating Teotihuacán architecture, the Tikal citadel’s builders improved on it. Choice B is incorrect because describing the citadel in Tikal as showing “precursors of”Teotihuacán architecture—or features that preceded and foreshadowed those of Teotihuacán architecture—would imply the opposite of what the text suggests about the relationship between the architecture found in Tikal and Teotihuacán. The text claims that the discovery of similarities between the Tikal citadel and the architecture of Teotihuacán, including a replica of a temple in Teotihuacán, provides evidence of outside influences on Tikal architecture. If the Tikal citadel was influenced by Teotihuacán architecture, then the Teotihuacán architecture must predate the citadel, not the other way around. In this context, therefore, it wouldn’t make sense to say that the Tikal citadel shows precursors of Teotihuacán architecture. Choice D is incorrect because the text discusses how the citadel in Tikal indicates the influence of Teotihuacán architecture, which implies that the makers of the Tikal citadel likely admired aspects of Teotihuacán architecture enough to imitate it. Thus, there’s no reason to think that the Tikal citadel provides evidence of the Tikal people’s “animosities toward,” or feelings of strong dislike or hostility toward, Teotihuacán architecture."},{"i":"f3fac04f","c":"vocab","d":"E","s":"Bioluminescent beetles called fireflies may seem to create flashes of light randomly, but each species of firefly actually has its own special series of repeated flashes and pauses. These unique ______ allow fireflies of the same species to find each other.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["quantities","decorations","patterns","agreements"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the flashes created by fireflies. In this context, “patterns” means distinct and predictable sequences. The text indicates that although the flashes that fireflies produce appear to occur randomly—that is, without any particular sequence or rhythm—each species actually produces its own special series of flashes and pauses. Indeed, these series of flashes are so unique that fireflies can use them to find other members of their species. Therefore, this context supports the idea that fireflies produce flashes in distinct and recognizable patterns. Choice A is incorrect because “quantities” means certain amounts or numbers of something. Although the text discusses how different firefly species produce flashes and pauses in unique sequences that help other members of their species to find them, it doesn’t mention the number of flashes that are used in these sequences. Choice B is incorrect because in this context, “decorations” would mean things that make an object more beautiful. Although it may be reasonable to say that firefly flashes are beautiful, the text focuses on the fact that fireflies use these unique sequences of flashes to find other members of their own species, not that the flashes make fireflies more beautiful. Choice D is incorrect because in this context, “agreements” would refer to deals that individuals have discussed and come to a consensus about. Since fireflies aren’t capable of making such agreements, it wouldn’t make sense to use this word to refer to the signals they send each other with their flashes."},{"i":"4a2b2535","c":"vocab","d":"E","s":"A brief book review cannot fully convey the ______ of Olga Tokarczuk’s novel The Books of Jacob, with its enormous cast of characters, its complicated, wandering plot, and its page numbers that count backward (beginning at 965 and ending at 1).\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["accuracy","inactivity","complexity","restraint"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Olga Tokarczuk’s novel The Books of Jacob. As used in this context, “complexity” means having many complicated parts that when taken as a whole are difficult to follow or explain. The text indicates that The Books of Jacob has a large cast of characters, a complicated and wandering plot (that is, a plot that is difficult to follow), and reverse page numbering. Together, these features make up a novel that’s challenging to read and summarize. This context supports the idea that a brief book review can’t do justice to the novel’s complexity. Choice A is incorrect. Although the word “accuracy,” or being free from error or falsehood, can sometimes be used to describe a novel, the text doesn’t discuss whether Tokarczuk’s novel has this quality. Instead, the text describes the novel as having a large cast of characters, a difficult- to-follow plot, and reverse page numbering. These features suggest complexity, not accuracy. Choice B is incorrect because “inactivity” means being in a state of idleness or doing nothing, neither of which would make sense in this context. The text describes Tokarczuk’s novel, and although it’s possible the novel could portray its characters as inactive, it wouldn’t make sense to describe the novel itself as such. Choice D is incorrect because in this context “restraint” would mean holding back or showing self-control, and the text doesn’t indicate that Tokarczuk’s novel has either of these qualities. In fact, the features of the novel that the text describes, such as a large cast of characters, a complicated and wandering plot, and reverse page numbering, suggest excess and complexity, not restraint."},{"i":"571cf537","c":"vocab","d":"H","s":"The author’s claim about the relationship between Neanderthals and Homo sapiens is ______, as it fails to account for several recent archaeological discoveries. To be convincing, his argument would need to address recent finds of additional hominid fossils, such as the latest Denisovan specimens and Homo longi.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["disorienting","tenuous","nuanced","unoriginal"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the author’s claim about the relationship between Neanderthals and Homo sapiens. As used in this context, “tenuous” means lacking substance. The end of the first sentence states that the author’s claim didn’t consider certain key pieces of evidence—“recent archaeological discoveries”—and is therefore weak. Choice A is incorrect because it wouldn’t make sense in context to refer to the author’s claim as “disorienting,” or confusing. The text suggests that the author’s claim is insubstantial, not that it’s difficult to grasp. Choice C is incorrect because referring to the claim as “nuanced,” or subtle, wouldn’t make sense in context. According to the text, the claim is incomplete because it didn’t consider certain key information about recent archaeological finds; it doesn’t suggest that what’s in the claim lacks precision. Choice D is incorrect because saying that the claim is “unoriginal,” or imitative, wouldn’t make sense in context. The text faults the claim because it doesn’t consider certain key information about recent archaeological finds; it doesn’t suggest that the author’s claim lacks originality."},{"i":"d5600e74","c":"purpose","d":"E","s":"The following text is adapted from Pam Muñoz Ryan’s 2020 novel Mañanaland. In the village where Max lives, there is an old fortress called La Reina. Children in the village say that the fortress is haunted. For as long as he could remember, Max had begged Papá [his father] to take him to see La Reina and the ruins up close. He’d be a hero among his friends if he was the first boy to cross the haunted gates! Just because Papá didn’t believe in ghosts didn’t mean they weren’t there. Maybe this summer Papá would finally take him. He wasalmost twelve. ©2020 by Pam Muñoz Ryan Which choice best describes the overall purpose of the text?","o":["To portray how proud Max’s father is of Max","To explain why Max doesn’t want to grow up yet","To criticize Max for disliking summer","To show how much Max wants to visit La Reina"],"a":3,"r":"Choice D is the best answer because it most accurately describes the overall purpose of the text. The text indicates that \"for as long as he could remember,\" Max had \"begged\" his father to take him to La Reina. This point is later emphasized in the text by indicating that \"this summer\" his father might \"finally take\" Max to visit La Reina. Thus, the purpose of the text as a whole is to show how much Max wants to visit La Reina. Choice A is incorrect. The text does not discuss Papa’s feelings toward Max. Rather, it mentions that Max has long wanted Papa to take him to La Reina and that, unlike Max and some other children, Papa does not believe that La Reina is haunted. Choice B is incorrect. The text mentions that Max is \"almost twelve\" at the time, which suggests anticipation of growing up rather than refusal to. Choice C is incorrect. The text indicates that Max hopes to visit La Reina during the current summer, but nothing suggests that Max dislikes summer."},{"i":"03c9f327","c":"purpose","d":"H","s":"The following text is from Charlotte Brontë’s 1847 novel Jane Eyre. Jane, the narrator, works as a governess at Thornfield Hall. I went on with my day’s business tranquilly; but ever and anon vague suggestions kept wandering across my brain of reasons why I should quit Thornfield; and I kept involuntarily framing advertisements and pondering conjectures about new situations: these thoughts I did not think to check; they might germinate and bear fruit if they could.\n\nWhich choice best states the main purpose of the text?","o":["To convey a contrast between Jane’s outward calmness and internal restlessness","To emphasize Jane’s loyalty to the people she works for at Thornfield Hall","To demonstrate that Jane finds her situation both challenging and deeply fulfilling","To describe Jane’s determination to secure employment outside of Thornfield Hall"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to show that while Jane calmly goes about her daily tasks, she is experiencing internal agitation about possibly seeking a new job. At the start of the text, Jane says, “I went on with my day’s business tranquilly,” indicating that she is outwardly calm. This outward calmness is then contrasted with her intense internal restlessness, as Jane says that thoughts of leaving her job keep running through her mind, that she is “involuntarily framing advertisements” (meaning that she can’t stop herself from thinking up potential listings for jobs), and that she often wonders what new “situations” (or jobs) would be like. Choice B is incorrect because the text gives no indication of Jane’s feelings, either positive or negative, about the people she works for at Thornfield Hall. And rather than emphasizing that Jane feels particularly loyal to her employers, the text focuses on her constant consideration of leaving her job. Choice C is incorrect because the text gives no indication that Jane finds her current situation fulfilling, or satisfying. Given that much of the text is focused on Jane’s thoughts about possibly leaving her job for a new one, it might be the case that she finds her situation challenging, but there is no evidence in the text that Jane also finds that situation satisfying—she says nothing positive about her current job at all, in fact. Choice D is incorrect because the text describes Jane as wondering about getting a new job, not as determined to definitely do so. Jane keeps thinking about reasons why she “should” quit her current job (indicating that she hasn’t yet decided to) and imagining possible new situations she could find, but she says at the end of the text that these thoughts “might germinate and bear fruit if they could,” meaning that the thoughts haven’t yet led to a decision—that Jane isn’t yet determined to get a new job somewhere else."},{"i":"e23f50b9","c":"func","d":"M","s":"The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and—more affordably—steam baths. <u>While such amenities were available mainly to town dwellers,<\/u> regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.\n\nWhich choice best describes the function of the underlined portion?","o":["It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.","It describes a limitation of earlier historians’ studies of medieval European bathing habits.","It concedes that not all people in medieval Europe had access to public bathhouses.","It explains why Janega decided to study the popularity of public bathhouses in medieval Europe."],"a":2,"r":"Choice C is the best answer because it most effectively describes the function of the underlined portion. The text discusses the long-standing misconception that people in medieval Europe were uninterested in cleanliness and hygiene. As evidence that this idea is false, the text cites historian Eleanor Janega’s assertion that in medieval Europe, towns usually had at least one bathhouse, where people could take immersion baths or steam baths for a fee. The underlined portion then notes that mainly town dwellers had access to these bathhouses. The remainder of the text explains that those who lacked such access were nonetheless able to bathe in outdoor waterways or take sponge baths at home. Therefore, the underlined portion concedes that some people in medieval Europe lacked access to public bathhouses. Choice A is incorrect. The underlined portion establishes that amenities such as steam baths were mainly available to town dwellers, which suggests in turn that steam baths were largely unavailable to people in rural areas. Thus, the distinction made by the underlined portion is not between the popularity of steam baths in towns versus their lack of popularity in rural areas but instead between their presence in towns and absence in rural areas. Choice B is incorrect. Although the text does explain that recent historians have disproved the idea that medieval Europeans rarely bathed, it doesn’t attribute that misconception to earlier historians of medieval Europe or suggest that their research was subject to limitations. Moreover, the underlined portion addresses a limitation of life in medieval Europe, not of historical research. Choice D is incorrect because the underlined portion doesn’t address why historian Eleanor Janega decided to study the popularity of public bathhouses in medieval Europe—nor does any portion of the text. The text mentions Janega in passing, but it doesn’t go into detail about why she decided to study the popularity of public bathhouses in medieval Europe."},{"i":"6bc0ba75","c":"func","d":"H","s":"The mimosa tree evolved in East Asia, where the beetle Bruchidius terrenus preys on its seeds. In 1785, mimosa trees were introduced to North America, far from any B. terrenus. <u>But evolutionary links between predators and their prey can persist across centuries and continents.<\/u> Around 2001, B. terrenus was introduced in southeastern North America near where botanist Shu-Mei Chang and colleagues had been monitoring mimosa trees. Within a year, 93 percent of the trees had been attacked by the beetles.\n\nWhich choice best describes the function of the third sentence in the overall structure of the text?","o":["It states the hypothesis that Chang and colleagues had set out to investigate using mimosa trees and B. terrenus.","It presents a generalization that is exemplified by the discussion of the mimosa trees and B. terrenus.","It provides context that clarifies why the species mentioned spread to new locations.","It offers an alternative explanation for the findings of Chang and colleagues."],"a":1,"r":"Choice B is the best answer because it most accurately describes the function of the third sentence within the overall structure of the text. The third sentence makes a generalization, asserting that evolutionary links between predators and prey can persist across great expanses of time and distance. This generalization is exemplified by the text’s discussion of the relationship between mimosa trees and B. terrenus beetles. When mimosa trees were introduced to North America in 1785, no B. terrenus beetles were present, so the relationship between the trees and the beetles that exists in their native East Asia was disrupted. When the beetles were introduced to North America more than 200 years later, however, they quickly attacked mimosa trees, illustrating the generalization that links between predators and prey \"can persist across centuries and continents.\" Choice A is incorrect because the third sentence doesn’t indicate that Chang and colleagues were investigating any hypothesis. According to the text, Chang and colleagues were simply monitoring mimosa trees when the beetles happened to be introduced to the area. Choice C is incorrect because the third sentence doesn’t discuss any particular species, let alone the species mentioned elsewhere in the text, nor does the sentence explain why species spread to new locations. Choice D is incorrect because the third sentence offers a generalization about the relationship between predators and prey, not an explanation for the findings by Chang and colleagues that’s an \"alternative\" to an explanation presented elsewhere in the text."},{"i":"190857f0","c":"structure","d":"M","s":"Why do sand cats purr but lions roar? Researchers hypothesize that this difference between the two feline species may be partly due to a U- shaped bone in their throats called the hyoid. Sand cats, which are much smaller than lions, have a rigid hyoid that rumbles when the cat’s larynx vibrates, resulting in a purr. By contrast, lions have a somewhat flexible hyoid, and the bone is attached to the skull with a stretchy ligament that sand cats lack. These traits allow lions and most other species of big cats to produce powerful roars. The same traits may also prevent most big cats from purring.\n\nWhich choice best describes the overall structure of the text?","o":["The text presents a theory about two species, then discusses facts that weaken it.","The text compares the habitats of two species, then explains how those habitats are changing.","The text describes a behavior shared by two species, then discusses other behaviors shared by them.","The text poses a question about two species, then presents a possible answer."],"a":3,"r":"Choice D is the best answer because it best describes the overall structure of the text. The text begins by posing a question about two different cat species: \"Why do sand cats purr but lions roar?\" The remainder of the text then presents a possible answer to this question by explaining a hypothesis about differences in these cats’ hyoid bone structure. The text details how sand cats have rigid hyoids that produce purring sounds when their larynx vibrates, while lions have more flexible hyoids attached to the skull with a stretchy ligament that enables roaring but may prevent purring. Choice A is incorrect because the text doesn’t present facts that weaken the theory about two cat species; rather, it asks a question about two species and then discusses a potential answer. Choice B is incorrect because the text doesn’t discuss the habitats of sand cats and lions at all, nor does it mention any changes to their habitats. Choice C is incorrect because the text doesn’t describe a behavior shared by the two cat species mentioned. On the contrary, it specifically focuses on the different vocalization behaviors of each species (purring versus roaring) and why those differences may exist."},{"i":"8de51658","c":"cross","d":"M","s":"Text 1 The idea that time moves in only one direction is instinctively understood, yet it puzzles physicists. According to the second law of thermodynamics, at a macroscopic level some processes of heat transfer are irreversible due to the production of entropy—after a transfer we cannot rewind time and place molecules back exactly where they were before, just as we cannot unbreak dropped eggs. But laws of physics at a microscopic or quantum level hold that those processes should be reversible.\n\nText 2 In 2015, physicists Tiago Batalhão et al. performed an experiment in which they confirmed the irreversibility of thermodynamic processes at a quantum level, producing entropy by applying a rapidly oscillating magnetic field to a system of carbon-13 atoms in liquid chloroform. But the experiment “does not pinpoint ... what causes [irreversibility] at the microscopic level,” coauthor Mauro Paternostro said.\n\nBased on the texts, what would the author of\n\nText 1 most likely say about the experiment described in\n\nText 2?","o":["It would suggest an interesting direction for future research were it not the case that two of the physicists who conducted the experiment disagree on the significance of its findings.","It provides empirical evidence that the current understanding of an aspect of physics at a microscopic level must be incomplete.","It is consistent with the current understanding of physics at a microscopic level but not at a macroscopic level.","It supports a claim about an isolated system of atoms in a laboratory, but that claim should not be extrapolated to a general claim about the universe."],"a":1,"r":"Choice B is the best answer. Author 1 describes the puzzle that physicists still can’t solve: at a microscopic level, the “laws of physics” suggest that we should be able to reverse processes that are not reversible at a macroscopic level (and, maybe, turn back time!). The experiment confirmed that those processes are not reversible even on the microscopic level, but it didn’t explain why. This supports Author 1’s point that physicists still don’t fully understand how things work at a microscopic level—maybe the laws need to be revised. Choice A is incorrect. We can’t infer that the author of Text 1 would respond this way to the experiment. Text 2 does name two of the physicists involved in the experiment, but it never suggests that they disagree on anything. Choice C is incorrect. This is the opposite of what the experiment suggests. The experiment confirmed that the macroscopic-level law (“these things can’t be reversed—like time”) was still true on the microscopic level—meaning it supports the current understanding of physics at a macroscopic level. Choice D is incorrect. We can’t infer that the author of Text 1 would respond this way to the experiment. Neither text makes this distinction between laboratory findings and the way the universe works in general."},{"i":"2573d64b","c":"main","d":"M","s":"At over a thousand pages across two volumes, The Fifty-Year Mission, compiled by Edward Gross and Mark A. Altman, is presented as the “complete, uncensored, unauthorized oral history” as told by the people behind the media franchise Star Trek. The work aspires to be comprehensive by, for example, including accounts from cast and crew members of every Star Trek television series and film to date. But while The Fifty-Year Mission is clearly a unique and valuable resource, it has a shortcoming common among oral histories: it lacks a clear authorial point of view that could otherwise unite the various accounts into a cohesive whole.\n\nWhich choice best states the main idea of the text?","o":["The compilers of The Fifty-Year Mission had lofty goals for their oral history of the Star Trek franchise, but the published work lacks information about many key events in the franchise’s history.","The Fifty-Year Mission includes more accounts from people involved with Star Trek television shows than it does from people involved with Star Trek films.","The large amount of material compiled into The Fifty-Year Mission is surprising given that many of the people involved in the Star Trek franchise did not participate in the oral history project.","The Fifty-Year Mission represents a worthwhile attempt to thoroughly recount the history of the Star Trek franchise, but its approach has an important limitation."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. According to the text, Gross and Altman’s book is a \"valuable resource\" because it’s a \"complete, uncensored, unauthorized oral history\" that features accounts from people involved with \"every Star Trek television series and film\" made. However, the text also points out an inherent shortcoming of the oral history approach used by the book’s creators: the lack of an authorial voice that could unify the many accounts into a coherent narrative. Thus, the text’s main idea is that while the book’s attempt at presenting a comprehensive oral history of the Star Trek franchise is a worthwhile one, the approach the creators selected has an important limitation. Choice A is incorrect. While the goal of the book’s creators (providing a comprehensive history of the Star Trek franchise) could be described as lofty, the text’s criticism of the book is focused on the shortcomings of the oral history form, not on events in the Star Trek franchise that were not reflected in the book. Choice B is incorrect because the text doesn’t suggest that the book includes more accounts from people involved with television shows than with films. In fact, the text explicitly states that the book includes accounts from people involved with \"every Star Trek television series and film\" ever made. Choice C is incorrect because the text doesn’t indicate that many people involved with the Star Trek franchise failed to participate in the book’s oral history project. The only mention of the scope of participation states that the book includes accounts \"from cast and crew members of every Star Trek television series and film to date.\" This information implies a high level of participation from relevant individuals, not a lack of participation."},{"i":"0b696a0c","c":"main","d":"E","s":"NASA’s Cassini probe has detected an unusual wobble in the rotation of Mimas, Saturn’s smallest moon. Using a computer model to study Mimas’s gravitational interactions with Saturn and tidal forces, geophysicist Alyssa Rhoden and colleagues have proposed that this wobble could be due to a liquid ocean moving beneath the moon’s icy surface. The researchers believe other moons should be examined to see if they too might have oceans hidden beneath their surfaces.\n\nWhich choice best states the main idea of the text?","o":["Rhoden and colleagues were the first to confirm that several of Saturn’s moons contain hidden oceans.","Research has failed to identify signs that there is an ocean hidden beneath the surface of Mimas.","Rhoden and colleagues created a new computer model that identifies moons with hidden oceans without needing to analyze the moons’ rotation.","Research has revealed that an oddity in the rotation of Mimas could be explained by an ocean hidden beneath its surface."],"a":3,"r":"Choice D is the best answer. The study isn’t definitive, but it says that Mimas’s wobbly rotation could be explained by the hidden ocean. Choice A is incorrect. This choice goes too far beyond the information in the text. Rhoden’s team proposed that one moon of Saturn could have a liquid ocean beneath its surface, and that other moons should also be examined, but no one has confirmed anything. Choice B is incorrect. This choice conflicts with the text. Research has identified at least one sign—the unusual wobble in Mimas’s rotation—that might be due to a hidden ocean beneath its surface. Choice C is incorrect. This choice doesn’t reflect the text. The computer model studies “gravitational interactions,” which seem to account for the wobbly rotation of Mimas."},{"i":"1755eaf0","c":"infer","d":"H","s":"Like many other genera of wild bees, bumblebees have in recent decades experienced population collapse caused by, among other factors, habitat destruction and climate variation. Bumblebees are also one of the most researched bee genera, second only to honeybees. As a result, ecologists have gained much of their insight about wild-bee declines from bumblebees. In a 2021 paper, zoologist Guillaume Ghisbain notes that bumblebees are among the relatively few wild-bee genera that display social behaviors and dietary generalism (ability to obtain nectar and pollen from a diversity of plant species), two traits that are associated with increased resilience to some specific environmental changes. Ghisbain therefore contends that ______ Which choice most logically completes the text?","o":["although bumblebees and many other wild bees have experienced similar population declines in the past, compared with other wild bees, bumblebees are likely at greater risk of being harmed by climate variation than by habitat destruction.","although bumblebees have been more extensively studied than most wild bees, researchers should not use bumblebees to draw conclusions about the decline of other wild bees, even ones with feeding patterns and levels of sociability that are similar to those of bumblebees.","because bumblebees and other bees with generalist diets are less negatively affected by environmental stress than bees with specialized diets are, they are less likely to experience major population changes in the future than bees with specialized diets are.","because the responses of bumblebees and other wild bees to environmental threats are not always comparable, researchers need to exercise caution when extrapolating information about wild-bee population declines from bumblebees."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of wild-bee declines. The text establishes that bumblebees and other wild bees have been experiencing population collapse as a result of habitat destruction, climate variation, and other factors. The text then indicates that because bumblebees are very extensively researched, ecologists rely heavily on findings about them to understand wild-bee declines in general. However, the text then introduces Ghisbain’s observation that unlike most other wild-bee genera, bumblebees have certain traits (social behaviors and dietary generalism) linked to increased resilience to certain environmental changes. In other words, bumblebees aren’t necessarily representative of wild bees as a whole because they are likely more tolerant of some pressures. Therefore, it logically follows that Ghisbain would urge researchers to exercise caution when using bumblebee data to draw conclusions about other wild-bee population declines, since bumblebees and other wild bees don’t always respond comparably to environmental threats. Choice A is incorrect because the text doesn’t indicate that climate variation is more of a threat to bumblebees than habitat destruction is or that it is a bigger threat to bumblebees than it is to other wild bees. The text simply indicates that climate variation and habitat destruction are among the factors that have caused population collapses for bumblebees and other wild-bee genera. Choice B is incorrect. As it is presented in the text, Ghisbain notes that bumblebees may respond to environmental changes differently than many other wild-bee genera do; this suggests that bumblebees shouldn’t be treated as representative of all wild bees, but there’s no reason to think that Ghisbain would go so far as to assert that bumblebee data shouldn’t be used to draw conclusions about other wild-bee genera that are similar to bumblebees in their dietary and social traits, even if there are relatively few. The text suggests caution in extrapolation, not a complete rejection of using bumblebee research. Choice C is incorrect. Although the text indicates that dietary generalism is linked to increased resilience to specific environmental changes (that is, to some but not all environmental stresses), it doesn’t suggest that bumblebees and other bees with this trait are less likely than bees with specialized diets to experience major population changes. In fact, the text makes it clear that like many other wild-bee genera—most of which don’t display dietary generalism—bumblebees are already experiencing population collapse."},{"i":"4802f6a5","c":"infer","d":"H","s":"Aptamers—synthetic DNA or RNA molecules that bind to target molecules—can be used to test for foodborne bacterial pathogens, though their specificity (the probability of returning a negative result in the absence of the focal pathogen) in real-world foods has been unclear. Sandeep Somvanshi et al. fabricated test paper incorporating aptamers targeting strain O157:H7 of the bacteria Escherichia coli; the paper shifts from pink to purple as the aptamers bind to target molecules. Somvanshi et al. tested the paper in store-bought pear juice they treated with E. coli O157:H7, other strains of E. coli, or other bacteria species. Following exposure, the paper from the O157:H7 test was purple while papers from the other tests were pink, suggesting that ______ Which choice most logically completes the text?","o":["aptamer-based tests in real-world foods are more likely to show a high degree of specificity if the focal pathogen is E. coli O157:H7 than if the focal pathogen is another strain of E. coli or another species.","uncertainty about the specificity of aptamer-based tests for pathogens in real-world foods may be due to the similarity between E. coli O157:H7 and other E. coli strains.","the specificity of the tests in a real-world food was unaffected by the aptamers’ tendency to bind to different strains of E. coli.","the aptamers successfully bound to E. coli O157:H7 and the tests displayed a high degree of specificity in a real-world food."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of aptamers’ capacity to test for pathogens in food. The text explains that although synthetic aptamer molecules can be used to test for foodborne bacterial pathogens because they bind to target molecules, it hasn’t been clear how likely it is that they will indicate a negative result when a target pathogen is absent in real-world foods. The text then indicates that Somvanshi et al. created test paper that changes from pink to purple when aptamers in it bind to a particular strain of E. coli bacteria, O157:H7, and tested it with store-bought pear juice (that is, a real-world food); the paper changed to purple when exposed to juice to which the target pathogen E. coli O157:H7 had been added, but it remained pink when exposed to juice treated with other E. coli strains or other bacteria species. Based on this result, it seems the aptamers in the paper successfully bound to the target (O157:H7) and the tests had a high degree of specificity (providing negative results for samples where the target was absent even though other bacteria were present) when applied to a real-world food. Choice A is incorrect because nothing in the text suggests that E. coli O157:H7 differs from other pathogens in a way that makes it more suitable for aptamer-based testing of any kind and that specificity is likely to be lower when aptamer-based tests target other bacteria; the text simply indicates that Somvanshi et al. used O157:H7 as the target for aptamer-based test paper in their study and suggests that the paper had a high degree of specificity. Choice B is incorrect because the text indicates that the specificity of aptamer-based tests in real-world foods is uncertain for pathogens broadly, not just for E. coli, and similarity between strains (of E. coli or of other pathogens) isn’t mentioned. Moreover, the results presented in the text suggest that aptamers are actually capable of distinguishing between strains of E. coli, since Somvanshi et al.’s paper turned purple when exposed to E. coli O157:H7 and remained pink when exposed to other strains. Choice C is incorrect because the text suggests that the aptamers in the test papers didn’t bind to different strains of E. coli. The text explains that the test papers turn purple when the aptamers bind to the targeted pathogen and that in the pear juice tests, the test papers turned purple when exposed to samples with the targeted strain of E. coli (O157:H7) but remained pink when exposed to samples with other strains of E. coli. In other words, the aptamers bound only to the targeted strain, not to the other strains. Further, specificity would be affected if the aptamers had bound to multiple strains and not just the targeted one; that result would cause the specificity to be low."},{"i":"20583752","c":"claim","d":"H","s":"“The Poet Walt Whitman” is an 1887 essay by José Martí, a Cuban author and political activist, originally written in Spanish. In the essay, Martí explores the value of literature, arguing that a society’s spiritual well-being depends on the character of its literary culture: ______ Which quotation from a translation of “The Poet Walt Whitman” most effectively illustrates the claim?","o":["“Poetry, which brings together or separates, which fortifies or brings anguish, which shores up or demolishes souls, which gives or robs men of faith and vigor, is more necessary to a people than industry itself, for industry provides them with a means of subsistence, while literature gives them the desire and strength for life.”","“Every society brings to literature its own form of expression, and the history of the nations can be told with greater truth by the stages of literature than by chronicles and decades.”","“Where will a race of men go when they have lost the habit of thinking with faith about the scope and meaning of their actions? The best among them, those who consecrate Nature with their sacred desire for the future, will lose, in a sordid and painful annihilation, all stimulus to alleviate the ugliness of humanity.”","“Listen to the song of this hardworking and satisfied nation; listen to Walt Whitman. The exercise of himself exalts him to majesty, tolerance exalts him to justice, and order to joy.”"],"a":0,"r":"Choice A is the best answer because it most effectively illustrates the claim that Martí argues that a society’s spiritual well-being depends on the character of its literary culture. In the quotation, Martí asserts that poetry is “more necessary to a people than industry itself” and that it has the power to provide people with “faith and vigor.” He also adds that literature gives people “the desire and strength for life.” Therefore, this quotation shows that Martí believes that literature is a societal necessity because it uplifts people and nourishes their spiritual well-being. Choice B is incorrect. Although this quotation emphasizes the importance of literature, it focuses on how the nature of a society is reflected in that society’s literature rather than on literature’s value for people’s spiritual well-being. Choice C is incorrect. Although this quotation involves an element of spirituality, it doesn’t discuss literature. The quotation instead focuses on humanity’s actions. Choice D is incorrect because this quotation mainly focuses on the importance of Walt Whitman rather than on the value of literature in general."},{"i":"8584f3ce","c":"claim","d":"H","s":"When digging for clams, their primary food, sea otters damage the roots of eelgrass plants growing on the seafloor. Near Vancouver Island in Canada, the otter population is large and well established, yet the eelgrass meadows are healthier than those found elsewhere off Canada’s coast. To explain this, conservation scientist Erin Foster and colleagues compared the Vancouver Island meadows to meadows where otters are absent or were reintroduced only recently. Finding that the Vancouver Island meadows have a more diverse gene pool than the others do, Foster hypothesized that damage to eelgrass roots increases the plant’s rate of sexual reproduction; this, in turn, boosts genetic diversity, which benefits the meadows’ health overall.\n\nWhich finding, if true, would most directly undermine Foster’s hypothesis?","o":["At some sites in the study, eelgrass meadows are found near otter populations that are small and have only recently been reintroduced.","At several sites not included in the study, there are large, well-established sea otter populations but no eelgrass meadows.","At several sites not included in the study, eelgrass meadows’ health correlates negatively with the length of residence and size of otter populations.","At some sites in the study, the health of plants unrelated to eelgrass correlates negatively with the length of residence and size of otter populations."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would weaken Foster’s hypothesis that damage to eelgrass roots improves the health of eelgrass meadows by boosting genetic diversity. The text indicates that sea otters damage eelgrass roots but that eelgrass meadows near Vancouver Island, where there’s a large otter population, are comparatively healthy. When Foster and her colleagues compared the Vancouver Island eelgrass meadows to those that don’t have established otter populations, the researchers found that the Vancouver Island meadows are more genetically diverse than the other meadows are. This finding led Foster to hypothesize that damage to the eelgrass roots encourages eelgrass reproduction, thereby improving genetic diversity and the health of the meadows. If, however, other meadows not included in the study are less healthy the larger the local otter population is and the longer the otters have been in residence, that would suggest that damage to the eelgrass roots, which would be expected to increase with the size and residential duration of the otter population, isn’t leading meadows to be healthier. Such a finding would therefore weaken Foster’s hypothesis. Choice A is incorrect because finding that small, recently introduced otter populations are near other eelgrass meadows in the study wouldn’t weaken Foster’s hypothesis. If otter populations were small and only recently established, they wouldn’t be expected to have caused much damage to eelgrass roots, so even if those eelgrass meadows were less healthy than the Vancouver Island meadows, that wouldn’t undermine Foster’s hypothesis. In fact, it would be consistent with Foster’s hypothesis since it would suggest that the greater damage caused by larger, more established otter populations is associated with healthier meadows. Choice B is incorrect because the existence of areas with otters but without eelgrass meadows wouldn’t reveal anything about whether the damage that otters cause to eelgrass roots ultimately benefits eelgrass meadows. Choice D is incorrect because the health of plants other than eelgrass would have no bearing on Foster’s hypothesis that damage to eelgrass roots leads to greater genetic diversity and meadow health. It would be possible for otters to have a negative effect on other plants while nevertheless improving the health of eelgrass meadows by damaging eelgrass roots."},{"i":"75e07a4d","c":"graph","d":"E","s":"","o":["shrimp cocktail for meal B.","hot cocoa for meal C.","sugar cookie cubes for meal B.","chicken and vegetables for meal A."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the statement. The table shows that on day 1, the menu for NASA’s Gemini missions included sugar cookie cubes for meal B. Choice A is incorrect because according to the table, shrimp cocktail was served on day 4, not day 1; moreover, the item was served for meal C, not meal B, as this choice claims. Choice B is incorrect because according to the table, hot cocoa was served on day 3, not on day 1; moreover, the item was served for meal A, not for meal C, as this choice claims. Choice D is incorrect because according to the table, chicken and vegetables were served on day 2, not on day 1; moreover, the item was served for meal B, not for meal A, as this choice claims."},{"i":"645fd11a","c":"graph","d":"H","s":"","o":["The average numbers of managers and department leaders reporting directly to their CEO didn’t fluctuate from the 1991–1995 period to the 2001–2008 period.","The average number of managers reporting directly to their CEO was highest in the 1996–2001 period.","The average number of department leaders reporting directly to their CEO was greater than the average number of managers reporting directly to their CEO in each of the three periods studied.","The average number of department leaders reporting directly to their CEO rose over the three periods studied."],"a":3,"r":"Choice D is the best answer because it describes data from the graph that support the researchers’ conclusion that there is a growing interest among CEOs in connecting with more departments in their companies. The graph shows the average number of individuals reporting directly to CEOs during three different time periods: the individuals are divided into managers and department leaders. The average number of department leaders directly reporting to their CEO during the 1991–1995 period was slightly more than three, during the 1996–2001 period it was four, and during the 2001–2008 period it was almost seven. Thus, the average number of department leaders reporting directly to their CEO rose over the three periods studied, which suggests that CEOs were connecting with more departments. Choice A is incorrect because the average number of managers and department leaders reporting directly to their CEO rose for both categories between the 1991–1995 and 2001–2008 periods; thus, it isn’t true that the average numbers didn’t fluctuate. Choice B is incorrect because the average number of managers reporting directly to their CEO was highest in the 2001–2008 period, not in the 1996–2001 period. Choice C is incorrect. Although it correctly describes a feature of the graph, the observation that more department leaders than managers are reporting to CEOs does not by itself address the question of whether CEOs are connecting with more departments over time—to address that question, one needs to know whether the number of department leaders reporting to CEOs is increasing over time."},{"i":"50801257","c":"fss","d":"E","s":"In 1994, almost 200 years after the death of Wang Zhenyi, the International Astronomical ______ the contributions of the barrier-breaking 18th- century astronomer and author of “Dispute of the Procession of the Equinoxes,” naming a crater on Venus after her.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Union would finally acknowledge","Union to finally acknowledge","Union, having finally acknowledged","Union, finally acknowledging"],"a":0,"r":"Choice A is the best answer. It’s the only choice that offers a form of the verb “acknowledge” that can go with the subject “International Astronomical Union” to make a complete sentence. This might seem like an odd use of “would,” but when speaking from a point of view in the past, we can actually use “would” to express something that happened later. That’s the case here: 200 years after Wang Zhenyi’s death, the IAU would finally acknowledge her contributions. Choice B is incorrect. This choice creates a sentence fragment. There’s no main verb elsewhere in the sentence, so we need a form of the verb “acknowledge” that can go with the subject “the International Astronomical Union” and serve as that main verb. “To acknowledge” can’t do that. Choice C is incorrect. This choice creates a sentence fragment. There’s no main verb elsewhere in the sentence, so we need a form of the verb “acknowledge” that can go with the subject “the International Astronomical Union” and serve as that main verb. “Having acknowledged” can’t do that. Choice D is incorrect. This choice creates a sentence fragment. There’s no main verb elsewhere in the sentence, so we need a form of the verb “acknowledge” that can go with the subject “the International Astronomical Union” and serve as that main verb. The “-ing” form can’t do that."},{"i":"512f0ac9","c":"fss","d":"H","s":"Working from an earlier discovery of Charpentier’s, chemists Emmanuelle Charpentier and Jennifer Doudna—winners of the 2020 Nobel Prize in Chemistry—re-created and then reprogrammed the so-called “genetic scissors” of a species of DNA-cleaving bacteria ______ a tool that is revolutionizing the field of gene technology.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to forge","forging","forged","and forging"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of finite and nonfinite verb forms within a sentence. The nonfinite to-infinitive “to forge” is correctly used to form a nonfinite (infinitive) clause that explains why the chemists re-created and reprogrammed the DNA-cleaving bacteria. Choice B is incorrect. Without a comma separating the main clause (“chemists...bacteria”) from the participle “forging,” this choice illogically suggests that the bacteria are forging a tool, which doesn’t make sense. Choice C is incorrect. Without a coordinating conjunction such as “and” placed before it, the finite past tense verb “forged” can’t be used in this way to describe the chemists’ actions. Choice D is incorrect. If read as a finite verb, the present progressive verb “forging” isn’t consistent with the past tense verbs used in this sentence to describe the actions of the chemists. If read as a nonfinite verb, the participle “forging” can’t be used in this way because there is no following main clause for it to modify."},{"i":"dfbf5d33","c":"fss","d":"H","s":"In 1453, English King Henry VI became unfit to rule after falling gravely ill. As a result, Parliament appointed Richard, Third Duke of York, who had a strong claim to the English throne, to rule as Lord Protector. Upon recovering two years later, ______ forcing an angered Richard from the royal court and precipitating a series of battles later known as the Wars of the Roses.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Henry resumed his reign,","the reign of Henry resumed,","Henry’s reign resumed,","it was Henry who resumed his reign,"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice ensures that the introductory phrase “upon recovering two years later” appears immediately before the noun it modifies (“Henry”), clearly establishing that Henry recovered two years later. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “the reign of Henry” immediately after the introductory phrase illogically suggests that the reign of Henry recovered two years later. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “Henry’s reign” immediately after the introductory phrase illogically suggests that Henry’s reign recovered two years later. Choice D is incorrect because it results in a dangling modifier. The placement of the function word “it” immediately after the introductory phrase illogically suggests that “it” recovered two years later."},{"i":"6fac7f45","c":"bound","d":"H","s":"Butterfly is a 1988 painting by the Japanese artist Ay-O. Like many of Ay-O’s paintings, Butterfly, which portrays a swimmer performing the butterfly stroke, attempts to make use of the entire visual light ______ sporting rainbow-striped goggles, the rainbow-hued swimmer splashes through a wavy rainbow of water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["spectrum","spectrum:","spectrum while","spectrum, while"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of a colon within a sentence. In this choice, the colon correctly introduces the following description of how the painting makes use of the entire visual light spectrum by depicting a rainbow-hued swimmer. Choice A is incorrect because it results in a run-on sentence. The main clauses (\"Like…spectrum\" and \"sporting…water\") are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a run-on sentence. The main clauses (\"Like…spectrum\" and \"while… water\") are fused without punctuation. Furthermore, the conjunction \"while\" fails to indicate that what follows is a description of how the painting makes use of the entire visual light spectrum. Choice D is incorrect because it results in a logically confusing sentence. The conjunction \"while,\" which suggests that what follows is occurring at the same time as or despite what came before, fails to indicate that what follows is a description of how the painting makes use of the entire visual light spectrum."},{"i":"77e06a09","c":"bound","d":"M","s":"Between 322 and 184 BCE, the Maurya Empire established a complex economic system that, through trade and centralized ______ funded major infrastructure projects throughout the Indian subcontinent. This included the building of many roads, canals, and hospitals.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["taxation:","taxation,","taxation—","taxation"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after \"taxation\" pairs with the comma after \"that\" to separate the supplementary element \"through trade and centralized taxation\" from the rest of the sentence. This supplementary element functions to identify the funding source of the Mauryan economy, and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because a colon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence. Choice C is incorrect because a dash can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence."},{"i":"3ea7372e","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In the art world, the term biennial traditionally refers to an art exhibition that takes place every two years in a single location. Such biennials are held in New York, Berlin, and Venice. In 2006, artists Ed Gomez and Luis Hernandez founded the unconventional MexiCali Biennial. The MexiCali Biennial hosts exhibitions in different venues on both sides of the US-Mexico border. The MexiCali Biennial has taken place on an uneven schedule, with exhibitions in 2006, 2009–10, 2013, and 2018–20. The student wants to emphasize a difference between the MexiCali Biennial and traditional biennials.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In 2006, artists Ed Gomez and Luis Hernandez founded the MexiCali Biennial, which has taken place in 2006, 2009–10, 2013, and 2018–20.","Unlike traditional biennials, the MexiCali Biennial hosts exhibitions in different venues on an uneven schedule.","The term biennial traditionally refers to an art exhibition that takes place every two years in a single location, not to exhibitions hosted at a variety of times and venues.","Biennial exhibitions have been held in New York, Berlin, and Venice but also on both sides of the US-Mexico border."],"a":1,"r":"Choice B is the best answer. The sentence effectively emphasizes a difference between the MexiCali Biennial and traditional biennials, stating that the MexiCali Biennial is unlike traditional biennials because it hosts exhibitions in different venues on an uneven schedule. Choice A is incorrect. The sentence indicates who founded the MexiCali Biennial and the years this biennial has taken place; it doesn’t emphasize a difference between the MexiCali Biennial and traditional biennials. Choice C is incorrect. While the sentence clarifies the traditional meaning of biennial with language that could apply to the MexiCali Biennial, it doesn’t mention the MexiCali Biennial by name. Therefore, the sentence doesn’t effectively emphasize a difference between the MexiCali Biennial and traditional biennials. Choice D is incorrect. The sentence notes locations where various biennial exhibitions have been held; it doesn’t emphasize a difference between the MexiCali Biennial and traditional biennials."},{"i":"07456405","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Malapportionment is the over- or underrepresentation (relative to population size) of electoral districts in a governing body. It is a common feature of representative governments. There are 169 seats in Norway’s supreme legislature (the Storting). Seats are distributed by a formula that awards 1 point per resident and 1.8 points per unit of land. Less populated rural districts with large tracts of land receive a disproportionate number of seats compared to smaller but more populated urban districts. The student wants to refute a claim that malapportionment in the Storting favors small urban districts.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Less populated rural districts are disproportionally underrepresented in the Storting, creating an unfair advantage for smaller but more populated urban districts.","It’s untrue that malapportionment in the 169-seat Storting favors small urban districts; rather, the formula for distributing seats overrepresents more populated districts.","A common feature of representative governments, malapportionment occurs when electoral districts are over- or underrepresented.","Awarding more points per unit of land than points per resident, the formula for distributing Storting seats overrepresents less populated rural districts with large tracts of land."],"a":3,"r":"Choice D is the best answer. By noting that the formula for distributing Storting seats overrepresents less populated rural districts, the sentence effectively refutes a claim that malapportionment in the Storting favors small urban districts. Choice A is incorrect because the sentence claims that malapportionment in the Storting favors small urban districts; it doesn’t refute such a claim. Moreover, it misrepresents information in the notes. According to the notes, the formula for distributing seats overrepresents less populated, not more populated, districts. Choice B is incorrect. While the sentence appears to refute a claim that malapportionment in the Storting favors small urban districts, it misrepresents information in the notes. According to the notes, the formula for distributing seats overrepresents less populated, not more populated, districts. Choice C is incorrect. The sentence explains what malapportionment is but doesn’t address malapportionment in the Storting specifically."},{"i":"6036ad0e","c":"trans","d":"E","s":"In 2014, Nestor Gomez won his first-ever storytelling competition, relating a tale about his life as a Guatemalan immigrant living in Chicago. ______ in 2017, Gomez created the show 80 Minutes Around the World as a platform for others to share stories about their immigration experiences.\n\nWhich choice completes the text with the most logical transition?","o":["Instead,","For example,","Later,","In other words,"],"a":2,"r":"Choice C is the best answer. \"Later\" logically signals that the information in the sentence—that in 2017 Gomez created a platform for others to share stories about their immigration experiences—occurs later in a chronological series of events than the previous information about Gomez winning his first storytelling competition in 2014. Choice A is incorrect because \"instead\" illogically signals that Gomez created a platform for others to share stories about their immigration experiences as an alternative to winning his first storytelling competition. Rather, Gomez created the platform later—in a chronological series of events—than when he won the competition. Choice B is incorrect because \"for example\" illogically signals that the information about Gomez creating a platform for others to share stories exemplifies his winning his first storytelling competition. Rather, Gomez created the platform later —in a chronological series of events—than when he won the competition. Choice D is incorrect because \"in other words\" illogically signals that the information about Gomez creating a platform for others to share stories is merely a paraphrase or restatement of the previous information about Gomez winning his first storytelling competition. Rather, Gomez created the platform later—in a chronological series of events—than when he won the competition."},{"i":"420dea42","c":"trans","d":"E","s":"A blend of gabardine and wool, the material for Elvis Presley’s Gold Vine jumpsuit was flexible enough to allow the singer to perform his signature dance moves. ______ the added weight of the suit’s swirling vines made of gold rhinestones likely limited Elvis’s mobility to some degree.\n\nWhich choice completes the text with the most logical transition?","o":["For this reason,","Firstly,","However,","In other words,"],"a":2,"r":"Choice C is the best answer. \"However\" logically signals that the claim in this sentence—that the weight of the gold rhinestones likely limited Elvis’s mobility—contrasts with the previous information about the material being flexible enough for Elvis’s dance moves. Choice A is incorrect because \"for this reason\" illogically signals that the claim in this sentence is caused by the previous information about the material being flexible enough for Elvis’s dance moves. Instead, the claim that the weight of the suit’s rhinestones limited movement contrasts with the previous information about the jumpsuit’s flexibility. Choice B is incorrect because \"firstly\" illogically signals that the claim in this sentence is the first in a series of claims about the jumpsuit being flexible enough for Elvis’s dance moves. Instead, the claim that the weight of the suit’s rhinestones limited movement contrasts with the previous information about the jumpsuit’s flexibility. Choice D is incorrect because \"in other words\" illogically signals that the claim in this sentence is a paraphrase or restatement of the previous information about the material being flexible enough for Elvis’s dance moves. Instead, the claim that the weight of the suit’s rhinestones limited movement contrasts with the previous information about the jumpsuit’s flexibility."}],"img":{"75e07a4d":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEZBAMAAACHreuwAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAAtHElEQVR42u1dZ2AUVdd+7sxuetizSehIJgWR6oQEEGkbIIpIWaQoTQJIVwmWF1GUACqolKDSQQNIF1kBqREiTaWGXgOLgIqQ5C4tIcnu/X6EkoRdIIBfgpnnRzI7t8y9z5x75pxbAQ0aNGjQoEGDhscCxtw/at28qK2CGenGDxaWP5HUK/cvv5sRwQCAwABGLOcWFWt2yyf/mOvXgZssrVNp+K5DN2/vg3dcUO5Unity/XBL+fMmk94qIFtgsKCE9b2cm5MKvYpSIT57eKgHQhUpAm0RHA6gCQi6p/U+SdwrvL7OBFkFq2UDzk0if0UKVkOBJkC7n6UQFgG/cBYJ1Ov1siqrkp/pipKRVCvMHgeEIZKvR1OSIjEL4ZAClGIqvWOVAN3Rld3GTltiXv+9eYvHuomQ1i3wzFYwBWzxIixZhPJrL8FnTGbIus2ev/8+Y47nkhGYsN9ndYNpsW+MXbTehNchB8/Ypj+yfdpm7/Aj62QLSvyN75NGe6yzDPxeneexdk71GStY8aS37HGT3vTFhyHp5SyHyiZuaWQ8AO8f25TcDBq3fvTpmnX2BZrGBv/BvEdM8o7p5vVl98irgf4j0CD6afOMANuMktcqxOJzuZa7paJ+X+Mei30r7asZkgTfD9lvSYsMppGH3aJXNQ47UjHyN1YclQPD390m21v2PHHyxEWedYFDWWKEY8L61gJcLEmacKzXD+djvE9yAVGCvT6IbUjd+Ms/qybAavW1lL249eSF4ykAwwdv1//Rb8PujVYYTp4iAMs6ngRPX/LNpz/EG3z2vG3YaBXFU/f2/G2B
