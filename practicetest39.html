<script>
const D={"t":"Practicetest39","q":[{"i":"5444db38","c":"vocab","d":"H","s":"To demonstrate that the integrity of underground metal pipes can be assessed without unearthing the pipes, engineer Aroba Saleem and colleagues ______ the tendency of some metals’ internal magnetic fields to alter under stress: the team showed that such alterations can be measured from a distance and can reveal concentrations of stress in the pipes.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["hypothesized","discounted","redefined","exploited"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of using magnetism to detect stress in buried metal pipes. In this context, \"exploited\" means made productive use of. The text indicates that the magnetic fields of some metals change under stress and that Saleem and colleagues showed that it is possible to measure those changes from a distance, thereby demonstrating that the integrity of underground metal pipes can be evaluated without having to unearth them. This context thus indicates that Saleem and colleagues made productive use of, or exploited, this tendency of the metals’ magnetic fields. Choice A is incorrect because in this context, \"hypothesized\" would mean made a tentative assumption to be evaluated in a study or experiment. Although Saleem and colleagues may have had one or more hypotheses for these experiments, the text presents the information about the tendency of some metals’ magnetic fields to change under stress as a known fact that the researchers made productive use of, not as a hypothesis to be evaluated. The text after the colon indicates that the researchers were not evaluating whether such changes occur but whether those changes can be measured at a distance. Choice B is incorrect because in this context, \"discounted\" would mean downplayed or ignored, but the text does not suggest that Saleem and colleagues minimized or ignored the tendency of the magnetic fields of some metals to change under stress. Rather, the text indicates that this tendency is the basis for Saleem and colleagues’ method of assessing the pipes’ integrity. Choice C is incorrect because nothing in the text indicates that Saleem and colleagues \"redefined,\" or reevaluated or reformulated, the tendency of some metals’ magnetic fields to change under stress. Instead, the text indicates that the researchers made use of that tendency to demonstrate that it is possible to evaluate the integrity of underground pipes without unearthing them."},{"i":"637d0878","c":"vocab","d":"E","s":"The Appalachian Trail is a hiking path in the eastern United States. Much of the 2,000 mile trail passes through wilderness areas. In order to ______ those areas, the United States Congress passed the National Trails System Act in 1968, ensuring that the trail would not be sold or commercially developed.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["borrow","postpone","protect","decorate"],"a":2,"r":"Choice C is the best answer. \"Protect\" means \"preserve\" or \"keep safe from.\" By ensuring that the wilderness areas along the Appalachian Trail can’t be sold or developed, the National Trails System Act protects them. Choice A is incorrect. \"Borrow\" means \"to take something with intent to return it.\" The text doesn’t say anything about taking and returning the wilderness that surrounds the Appalachian Trail. Choice B is incorrect. \"Postpone\" means \"to put off until later.\" Nothing in the passage suggests that Congress wants to \"postpone\" the wilderness areas (and that doesn’t make sense anyway—they can postpone doing something to the wilderness areas, but they can’t postpone the areas themselves). Choice D is incorrect. \"Decorate\" means \"to adorn\" or \"add extra items or pictures to make more attractive.\" No details in the text suggest that Congress wishes to make the trail fancier or more attractive."},{"i":"849bf8d7","c":"vocab","d":"E","s":"In the mid-nineteenth century, some abolitionist newspapers ______ westward migration in the United States; by printing a letter that described the easy fortunes and high salaries miners could make in California during the Gold Rush, Frederick Douglass’s newspaper North Star was one such publication that inspired readers to relocate.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["stimulated","assigned","opposed","disregarded"],"a":0,"r":"Choice A is the best answer. \"Stimulated\" means \"encouraged interest or increased activity in.\" Because the newspapers discussed the benefits of westward migration and \"inspired readers to relocate,\" we can infer that they encouraged people to move west. Choice B is incorrect. \"Assigned\" means \"gave a job or duty.\" Newspapers do not have the power to assign people to move west, although they can encourage it. Choice C is incorrect. \"Opposed\" means \"disapproved of.\" We can tell that this isn’t the case, because the newspapers discussed \"the easy fortunes and high salaries miners could make in California\" and \"inspired readers to relocate.\" Choice D is incorrect. \"Disregarded\" means \"ignored.\" If the newspapers are writing about the west and \"inspir[ing] readers to relocate,\" they can’t be ignoring it at the same time."},{"i":"9d73c9eb","c":"vocab","d":"E","s":"Osage Nation citizen Randy Tinker-Smith produced and directed the ballet Wahzhazhe, which vividly chronicles Osage history and culture. Telling Osage stories through ballet is ______ choice because two of the foremost ballet dancers of the twentieth century were Osage: sisters Maria and Marjorie Tallchief.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a suitable","a determined","an arbitrary","an unpredictable"],"a":0,"r":"Choice A is the best answer. “Suitable” means “appropriate for a particular purpose.” Since the text indicates that two of the best ballet dancers of the twentieth century were Osage, we can infer that the author believes that ballet is a very suitable artform for telling Osage stories. Choice B is incorrect. The text never suggests that Tinker-Smith’s choice was determined. That would imply that Tinker-Smith initially faced some kind of obstacle or opposition, and nothing like that is mentioned in the passage. Choice C is incorrect. The text implies the opposite of this. “Arbitrary” means “based on random choice or whim rather than reason.” But the text does give us a good reason behind the choice to tell Osage stories through ballet: two of the best ballet dancers of the twentieth century were Osage. Choice D is incorrect. The text never suggests that Tinker-Smith’s choice was “unpredictable.” Rather, the fact that two of the best ballet dancers of the twentieth century were Osage makes ballet especially appropriate for telling Osage stories."},{"i":"03c9f327","c":"purpose","d":"H","s":"The following text is from Charlotte Brontë’s 1847 novel Jane Eyre. Jane, the narrator, works as a governess at Thornfield Hall. I went on with my day’s business tranquilly; but ever and anon vague suggestions kept wandering across my brain of reasons why I should quit Thornfield; and I kept involuntarily framing advertisements and pondering conjectures about new situations: these thoughts I did not think to check; they might germinate and bear fruit if they could.\n\nWhich choice best states the main purpose of the text?","o":["To convey a contrast between Jane’s outward calmness and internal restlessness","To emphasize Jane’s loyalty to the people she works for at Thornfield Hall","To demonstrate that Jane finds her situation both challenging and deeply fulfilling","To describe Jane’s determination to secure employment outside of Thornfield Hall"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to show that while Jane calmly goes about her daily tasks, she is experiencing internal agitation about possibly seeking a new job. At the start of the text, Jane says, “I went on with my day’s business tranquilly,” indicating that she is outwardly calm. This outward calmness is then contrasted with her intense internal restlessness, as Jane says that thoughts of leaving her job keep running through her mind, that she is “involuntarily framing advertisements” (meaning that she can’t stop herself from thinking up potential listings for jobs), and that she often wonders what new “situations” (or jobs) would be like. Choice B is incorrect because the text gives no indication of Jane’s feelings, either positive or negative, about the people she works for at Thornfield Hall. And rather than emphasizing that Jane feels particularly loyal to her employers, the text focuses on her constant consideration of leaving her job. Choice C is incorrect because the text gives no indication that Jane finds her current situation fulfilling, or satisfying. Given that much of the text is focused on Jane’s thoughts about possibly leaving her job for a new one, it might be the case that she finds her situation challenging, but there is no evidence in the text that Jane also finds that situation satisfying—she says nothing positive about her current job at all, in fact. Choice D is incorrect because the text describes Jane as wondering about getting a new job, not as determined to definitely do so. Jane keeps thinking about reasons why she “should” quit her current job (indicating that she hasn’t yet decided to) and imagining possible new situations she could find, but she says at the end of the text that these thoughts “might germinate and bear fruit if they could,” meaning that the thoughts haven’t yet led to a decision—that Jane isn’t yet determined to get a new job somewhere else."},{"i":"ea971260","c":"purpose","d":"E","s":"The following text is adapted from Louisa May Alcott’s 1869 novel An Old-Fashioned Girl. Polly, a teenager, is visiting her friend Fanny. Fanny’s friends did not interest Polly much; she was rather afraid of them [because] they seemed so much older and wiser than herself, even those younger in years. They talked about things of which she knew nothing and when Fanny tried to explain, she didn’t find them interesting; indeed, some of them rather shocked and puzzled her.\n\nWhich choice best states the main purpose of the text?","o":["To portray Polly’s reaction to Fanny’s friends","To identify the topics Polly talks about with Fanny’s friends","To explain how Fanny met some of her friends","To illustrate how Fanny’s friends feel about Polly"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to show how Polly reacted to some of Fanny’s other friends. The text describes Polly as being frightened of Fanny’s friends because they seemed “much older and wiser” to her and elaborates that they “talked about things of which” Polly was unfamiliar, uninterested, and shocked. Thus, the main purpose of the text is to describe Polly’s impressions of Fanny’s other friends. Choice B is incorrect because the text does not provide any of the topics Polly discussed with Fanny’s friends, stating only that Polly found the topics unfamiliar, uninteresting, and shocking. Choice C is incorrect because the text says nothing about how Fanny and her other friends first met. Choice D is incorrect because the focus of the text is on Polly’s feelings about Fanny’s other friends, not on the other friends’ feelings about Polly."},{"i":"809addda","c":"func","d":"E","s":"The following text is from Ameen Rihani’s 1921 poem “The Wanderer.” I wander among the hills of alien lands Where Nature her prerogative resigns To Man; where Comfort in her shack reclines And all the arts and sciences commands. <u>But in my soul The eastern billows roll— I hear the voices of my native strands.<\/u> Which choice best describes the function of the underlined lines in the text as a whole?","o":["It establishes that the speaker’s enthusiasm about current travels conflicts with the growing urge to return home.","It illustrates the speaker’s uncertainty about maintaining strong links with relatives in distant places.","It conveys the speaker’s sense of feeling a pull toward home while traveling in an unfamiliar place.","It reveals that upon returning after an extended absence, the speaker longs for the way a location once felt."],"a":2,"r":"Choice C is the best answer because it most accurately describes the function of the underlined lines in the text as a whole. In the opening line of the text, the speaker describes wandering in \"alien lands,\" which establishes that the speaker is traveling in unfamiliar territory. In the underlined lines, the speaker describes \"billows\" (large waves) rolling in the soul, which suggests that the speaker feels inner turmoil. The underlined lines go on to associate these rolling billows with voices calling to the speaker from the speaker’s \"native strands,\" or homeland, indicating that thoughts of home are prompting the emotional experience these lines describe. Taken together, the imagery in the underlined lines thus implies that the speaker feels a deep emotional connection to, or pull toward, home while traveling in an unfamiliar place. Choice A is incorrect. While the text’s first line states that the speaker is traveling and the underlined lines indicate that the speaker experiences an emotional pull toward home, neither the underlined lines nor the text as a whole establishes an enthusiasm about the current travels that conflicts with a growing urge to return home. The text’s description of the lands the speaker is traveling in focuses on their artificial quality, stating, \"Nature her prerogative resigns / To Man,\" which doesn’t suggest enthusiasm but rather a sense of detachment or even critique. Choice B is incorrect because the underlined lines don’t address uncertainty about maintaining links with relatives in distant places. In the underlined lines, the speaker expresses a sense of connection to the speaker’s homeland (\"native strands\") but doesn’t refer to any family members the speaker may have there or to concerns about maintaining any familial ties. Choice D is incorrect because the poem doesn’t indicate that the speaker has returned home after an absence. Rather, the speaker explicitly states, \"I wander among the hills of alien lands,\" establishing that the current setting is a foreign place. Moreover, the underlined lines express a sense of connection with, or pull toward, a distant homeland, not a sense of longing for how that homeland or any other location once felt."},{"i":"02e49a0c","c":"func","d":"E","s":"Genetic studies have led researchers to suggest that turtles are most closely related to the group that includes modern crocodiles. But studies of fossils have suggested instead that turtles are most closely related to other groups, such as the one that contains modern snakes. <u>However, many of the fossil studies have relied on incomplete data sets.<\/u> For a 2022 investigation, biologist Tiago R. Simões and colleagues examined more than 1,000 reptile fossils collected worldwide. From this large data set, they found clear agreement with the results of the genetic studies.\n\nWhich choice best describes the function of the underlined sentence?","o":["It offers an overview of the tools scientists use to examine fossils.","It describes a limitation of some studies about the origin of turtles.","It summarizes previous research on the evolution of crocodiles.","It criticizes a widely held belief about genetic studies of reptiles."],"a":1,"r":"Choice B is the best answer. The sentence mentions that some fossil studies have relied on incomplete data sets, suggesting that these studies are limited in what they can tell us about turtles’ origins. Choice A is incorrect. While the sentence mentions the incompleteness of the data sets studied, it doesn’t mention any tools or techniques used to examine fossils. Choice C is incorrect. The sentence doesn’t mention anything about the evolution of crocodiles. Choice D is incorrect. This sentence doesn’t directly mention or criticize any \"widely held belief,\" and it focuses on a limitation of fossil studies of reptiles, not genetic studies."},{"i":"9645f55e","c":"cross","d":"E","s":"Text 1 For decades, bluegrass musicians have debated whether their genre should exclude influences from mainstream genres such as rock. Many insist that bluegrass is defined by its adherence to the folk music of the US South, out of which bluegrass emerged. Such “purists,” as they are known, regard the recordings of Bill Monroe, which established the bluegrass sound in the 1940s, as a standard against which the genre should still be measured.\n\nText 2 Bluegrass isn’t simply an extension of folk traditions into the era of recorded music. In reality, Bill Monroe created the bluegrass sound in the 1940s by combining Southern folk music with commercial genres that had arisen only a few decades before, such as jazz and the blues. Since bluegrass has always been a mixed genre, contemporary bluegrass musicians should not be forbidden from incorporating into it influences from rock and other mainstream genres.\n\nBased on the texts, how would the author of\n\nText 2 most likely regard the perspective of bluegrass purists, as described in\n\nText 1?","o":["As inconsistent, since bluegrass purists themselves enjoy other musical genres","As unrealistic, since bluegrass purists have no way of enforcing their musical preferences","As shortsighted, because bluegrass could enlarge its audience by including influences from mainstream genres","As illogical, because the purists overlook crucial aspects of how the bluegrass sound first originated."],"a":3,"r":"Choice D is the best answer. According to Author 1, the “purists” argue that bluegrass should stick to its folk music roots. But Author 2 points out that this isn’t how bluegrass emerged: it actually got its sound from a mix of folk, jazz, and blues. Choice A is incorrect. There’s nothing in Text 2 about what other genres the purists enjoy, so this inference about Author 2’s views isn’t supported. Choice B is incorrect. There’s nothing in Text 2 about whether or how purists can enforce their preferences, so this inference about Author 2’s views isn’t supported. Choice C is incorrect. There’s nothing in Text 2 about the size of bluegrass’s audience, so this inference about Author 2’s views isn’t supported."},{"i":"0e3b4967","c":"main","d":"E","s":"Scrapbooks of saved fabric pieces were commonly kept by women in the nineteenth-century United States, but few are as meticulously detailed as Hannah Ditzler Alspaugh’s work. Alongside each piece of fabric, Alspaugh recorded intimate memories, such as dressmaking with her sister. Additionally, she listed the prices and how she used the fabric. Historians note that by representing fifty years of changing textures, patterns, and dress styles, the scrapbook is a record of nineteenth-century textiles and dressmaking as well as Alspaugh’s life.\n\nWhich choice best states the main idea of the text?","o":["Alspaugh inspired other women to save pieces of fabric in scrapbooks and provide historical records of nineteenth-century fashions in the United States.","Historians rely on fabric scrapbooks to understand how fashions changed throughout the nineteenth-century United States.","Fabric scrapbooks were a popular hobby for many women in the nineteenth-century United States.","Alspaugh’s scrapbook provides a detailed account of her life and historical record of fashion trends in the nineteenth-century United States."],"a":3,"r":"Choice D is correct. The text describes how Alspaugh’s scrapbook is both a record of her life and a historical record of nineteenth-century textiles and dressmaking. Choice A is incorrect. The text says that it was common for American women to keep scrapbooks of fabric pieces in the nineteenth century, and it says that Alspaugh was one of these women. However, it never says that other women were inspired by Alspaugh. Choice B is incorrect. This is too general and too strong. The text says that Alspaugh’s scrapbook is a historical record of nineteenth-century textiles and dressmaking, but it never says that historians rely on such scrapbooks in general to understand how fashions changed throughout that time period. This choice also fails to even mention Alspaugh, who is the real focus of the text. Choice C is incorrect. The text does say this, but it’s a detail—not the main idea. The text is mainly about one woman’s scrapbook (Alspaugh’s), and this choice doesn’t even mention her."},{"i":"d73a908a","c":"main","d":"M","s":"Believing that living in an impractical space can heighten awareness and even improve health, conceptual artists Madeline Gins and Shusaku Arakawa designed an apartment building in Japan to be more fanciful than functional. A kitchen counter is chest-high on one side and knee-high on the other; a ceiling has a door to nowhere. The effect is disorienting but invigorating: after four years there, filmmaker Nobu Yamaoka reported significant health benefits.\n\nWhich choice best states the main idea of the text?","o":["Although inhabiting a home surrounded by fanciful features such as those designed by Gins and Arakawa can be rejuvenating, it is unsustainable.","Designing disorienting spaces like those in the Gins and Arakawa building is the most effective way to create a physically stimulating environment.","As a filmmaker, Yamaoka has long supported the designs of conceptual artists such as Gins and Arakawa.","Although impractical, the design of the apartment building by Gins and Arakawa may improve the well-being of the building’s residents."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. According to the text, conceptual artists Gins and Arakawa have designed an apartment building that is disorienting because of several unconventional elements, such as uneven kitchen counters and “a door to nowhere.” The text goes on to suggest that there may be benefits to this kind of design because filmmaker Yamaoka lived in the apartment building for four years and reported health benefits. Thus, although the design is impractical, it may improve the well-being of the apartment building’s residents. Choice A is incorrect. Although the text mentions that Yamaoka lived in the apartment for four years, it doesn’t address how long someone can beneficially live in a home surrounded by fanciful features or whether doing so can be sustained. Choice B is incorrect. Although the text mentions the potential benefits of living in a home with disorienting design features, it doesn’t suggest that this is the most effective method to create a physically stimulating environment. Choice C is incorrect because the text refers to Yamaoka to support the claim that Gins and Arakawa’s apartment building design may be beneficial, but the text doesn’t indicate that Yamaoka supports the designs of other conceptual artists."},{"i":"a0b58ef0","c":"infer","d":"M","s":"The Younger Dryas was a period of extreme cooling from 11,700 to 12,900 years ago in the Northern Hemisphere. Some scientists argue that a comet fragment hitting Earth brought about the cooling. Others disagree, partly because there is no known crater from such an impact that dates to the beginning of the period. In 2015, a team led by Kurt Kjær detected a 19-mile-wide crater beneath a glacier in Greenland. The scientists who believe an impact caused the Younger Dryas claim that this discovery supports their view. However, Kjær’s team hasn’t yet been able to determine the age of the crater. Therefore, the team suggests that ______ Which choice most logically completes the text?","o":["it can’t be concluded that the impact that made the crater was connected to the beginning of the Younger Dryas.","it can’t be determined whether a comet fragment could make a crater as large as 19 miles wide.","scientists have ignored the possibility that something other than a comet fragment could have made the crater.","the scientists who believe an impact caused the Younger Dryas have made incorrect assumptions about when the period began."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of a crater’s connection to the start of the Younger Dryas. According to the text, some scientists believe that a comet fragment hitting Earth caused the cooling of the Younger Dryas period to come about. The text then indicates that a team of scientists found a crater in Greenland, which some believe supports the theory of a comet fragment hitting Earth to initiate the Younger Dryas. However, the text also notes that the team was unable to determine the age of the crater. If the age of the crater can’t be determined, then its connection to the Younger Dryas period of time can’t be confirmed either. Thus, it can’t be concluded that the impact that made the crater was connected to the beginning of the Younger Dryas. Choice B is incorrect because though the text suggests that the age of the comet crater found by a team of scientists is uncertain, it doesn’t address whether a comet fragment can make a crater as large as 19 miles wide. The text doesn’t consider the size of comet fragments and how they relate to the size of craters they might make. Choice C is incorrect because the debate in the text centers on the age of the crater found, not the cause of the crater. The text doesn’t indicate uncertainty about what caused the discovered crater. Choice D is incorrect because the text suggests that the age of the crater found by the team of scientists is uncertain, not that the dates of the Younger Dryas are uncertain or incorrect. The text states that \"the Younger Dryas was a period of extreme cooling from 11,700 to 12,900 years ago\" but doesn’t indicate any debate about the timing of the period."},{"i":"4a85fea6","c":"infer","d":"M","s":"Euphorbia esula (leafy spurge) is a Eurasian plant that has become invasive in North America, where it displaces native vegetation and sickens cattle. E. esula can be controlled with chemical herbicides, but that approach can also kill harmless plants nearby. Recent research on introducing engineered DNA into plant species to inhibit their reproduction may offer a path toward exclusively targeting E. esula, consequently ______ Which choice most logically completes the text?","o":["making individual E. esula plants more susceptible to existing chemical herbicides.","enhancing the ecological benefits of E. esula in North America.","enabling cattle to consume E. esula without becoming sick.","reducing invasive E. esula numbers without harming other organisms."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of leafy spurge and engineered DNA. The text establishes that using chemical herbicides to control leafy spurge in North America can also harm other plants nearby. The text then indicates that it might be possible to use engineered DNA to prevent plants from reproducing, which would be useful for “exclusively targeting” leafy spurge. If it’s possible to exclusively target leafy spurge with engineered DNA—meaning that only leafy spurge is affected by the engineered DNA—and prevent the plant from reproducing, then leafy spurge numbers could be reduced “without harming other organisms.” Choice A is incorrect because the text raises the possibility of using engineered DNA to prevent leafy spurge from reproducing, not to make individual leafy spurge plants more vulnerable to chemical herbicides that already exist. Choice B is incorrect because the text doesn’t describe any ecological benefits of leafy spurge in North America; instead, the text is focused on using engineered DNA to prevent leafy spurge from reproducing and thereby reduce its numbers. The only ecological effects of leafy spurge in North America that are described in the text are harmful. Choice C is incorrect because the text describes the possibility of using engineered DNA to prevent leafy spurge from reproducing; it doesn’t offer a way to enable cattle to eat leafy spurge without becoming sick."},{"i":"38d75269","c":"claim","d":"E","s":"Janet Echelman is a sculptor and fiber artist. She has installed giant sculptures all over the world. Echelman uses bright and flowing materials, which mimic the wind. <u>However, while her sculptures appear as delicate as a breeze, they are actually very durable.<\/u> Which quotation from an article about Echelman’s sculptures, if true, would most effectively illustrate the underlined claim?","o":["“Echelman uses a special program that makes a 3D model of the sculpture.”","“The first part of planning a new sculpture is done using paper and pencil, and then a digital program is used to finalize the design.”","“The materials that Echelman uses to build her sculptures are both flexible and strong.”","“Each sculpture is designed to reflect local landmarks from the area in which it is eventually installed.”"],"a":2,"r":"Choice C is the best answer because it presents the quotation that most effectively illustrates the claim that Echelman’s sculptures appear delicate but are in fact quite durable. The text explains that Echelman’s sculptures include flowing shapes that mimic the wind. If it is true that the materials she uses are both flexible and strong, that would help explain why the works are durable even though they appear delicate. Choice A is incorrect because the claim in the text is not about how Echelman models her work before sculpting. Choice B is incorrect because the claim in the text is not about the planning and design phases of Echelman’s work. Choice D is incorrect because the claim in the text is not about how the sculptures relate to their locations."},{"i":"08ff903e","c":"claim","d":"E","s":"A museum curator is writing a biographical statement about Trinidadian-born Chinese dancer, choreographer, and teacher Dai Ailian for a new exhibit on Chinese dance. The curator claims that some of the pieces Dai created shortly after arriving in mainland China in 1941, such as the solo dance Yao Drum, reflect a desire to represent the dances of local communities Dai visited during her travels through China.\n\nWhich quotation from a work by a dance historian would be the most effective evidence for the curator to include in support of this claim?","o":["“There is no sound or music accompanying Dai’s movements in Yao Drum, aside from the sounds of drumsticks beating against a drum and against each other.”","“Unlike some of the works Dai created in the early 1940s, Yao Drum does not feature a narrative structure, humorous elements, or references to real-life events.”","“Yao Drum was inspired by a ceremonial dance Dai witnessed during her time performing field research among the Yao people in the province of Guizhou in 1941 or 1942.”","“Yao Drum is notable for its intense physicality, with Dai performing sharp jumps, swift turns, and dramatic sweeps of her legs through the air as she moves in circles on the stage.”"],"a":2,"r":"Choice C is the best answer. This choice clearly states that Yao Drum was inspired by a ceremonial dance of the Yao people. This directly supports the curator’s claim that some of Dai’s pieces “represent the dances of local communities” she visited. Choice A is incorrect. This choice discusses the sound and music in Yao Drum, but it doesn’t connect these elements to “the dances of local communities,” which is the focus of the claim. Choice B is incorrect. This choice doesn’t mention the dances of local communities, but instead discusses how Yao Drum is different from some of Dai’s earlier works. Choice D is incorrect. This choice describes the choreography of Yao Drum, but it doesn’t connect these elements to “the dances of local communities,” which is the focus of the claim."},{"i":"c4bee178","c":"graph","d":"E","s":"","o":["Eris and Makemake.","Haumea and Eris.","Pluto and Haumea.","Makemake and Ceres."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the statement about dwarf planets that have exactly one moon. The table lists several dwarf planets in one column and the number of moons that each of those dwarf planets has in another column. The text states that some dwarf planets have exactly one moon and indicates that there are two examples. Only two dwarf planets in the table have exactly one moon: Eris and Makemake. Choice B is incorrect. According to the table, Eris has exactly one moon, but Haumea has two moons. Choice C is incorrect. According to the table, Haumea has two moons, and Pluto has five moons. Thus, they are not examples of dwarf planets with exactly one moon. Choice D is incorrect because while the table indicates that Makemake has exactly one moon, the table shows that Ceres has no moons at all."},{"i":"e37f79a7","c":"graph","d":"E","s":"","o":["April.","March.","January.","February."],"a":0,"r":"Choice A is the best answer because it effectively uses data from the table to complete the statement, identifying the month in which the United States had the highest number of housing starts in 2022. According to the table, which shows the number of US housing starts from January to April 2022, the highest number of housing starts was 1,803 thousand, which occurred in April. Choice B is incorrect because March had 1,713 thousand housing starts, which is lower than the number of starts in April and in February. Choice C is incorrect because January had 1,669 thousand housing starts, which is the lowest of all the months listed in the table. Choice D is incorrect because February had 1,771 thousand housing starts, which is lower than the number of starts in April."},{"i":"81f09e07","c":"fss","d":"H","s":"Instead of sleeping on soft pillows, ancient Egyptians slept on hard, elevated headrests, their design ______ airflow, protection from insects, and hairstyle maintenance over comfort.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["had prioritized","was prioritizing","prioritized","prioritizing"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite present participle “prioritizing” is correctly used to form a supplementary element that modifies “their design,” describing what the headrests’ design prioritized. Choice A is incorrect because it results in a comma splice. The finite past perfect verb “had prioritized” creates a second main clause in the sentence, and the comma after “headrests” can’t be used in this way to join two main clauses. Choice B is incorrect because it results in a comma splice. The finite past progressive verb “was prioritizing” creates a second main clause in the sentence, and the comma after “headrests” can’t be used in this way to join two main clauses. Choice C is incorrect because it results in a comma splice. The finite past tense verb “prioritized” creates a second main clause in the sentence, and the comma after “headrests” can’t be used in this way to join two main clauses."},{"i":"f339ee39","c":"fss","d":"E","s":"Multiple newspapers ______ the Spanish-speaking population of Washington, DC, including El Tiempo Latino and Washington Hispanic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["serve","having served","to serve","serving"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, \"multiple newspapers\"), and this choice supplies the finite present tense verb \"serve\" to indicate that there are multiple newspapers serving the Spanish-speaking population of Washington, DC. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having served\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to serve\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"serving\" doesn’t supply the main clause with a finite verb."},{"i":"0bcb4417","c":"fss","d":"H","s":"Oglala Lakota poet Layli Long Soldier’s star quilt poems offer an unusually open-ended reading experience. With ______ eight panels of text stitched together in the shape of a traditional eight-pointed Lakota star quilt, the poems present viewers with a seemingly infinite number of ways to read them.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["their","it’s","they’re","its"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of possessive determiners. The plural possessive determiner \"their\" agrees in number with the plural noun \"the poems,\" thus indicating that the poems had eight panels of text stitched together in the shape of a traditional eight-pointed Lakota star quilt. Choice B is incorrect because \"it’s\" is the contraction for \"it is\" or \"it has,\" not a possessive determiner. Choice C is incorrect because \"they’re\" is the contraction for \"they are,\" not a possessive determiner. Choice D is incorrect because the singular possessive determiner \"its\" doesn’t agree in number with the plural noun \"the poems.\""},{"i":"790fc366","c":"bound","d":"H","s":"Using satellite remote sensing, Dr. Catherine Nakalembe, director of NASA’s Harvest Africa initiative, gathers important data on crop health. Nakalembe doesn’t just compile the ______ she also shares her findings with African farmers, enabling them to make data-driven decisions about managing critical food crops.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["information, though;","information, though,","information; though","information though,"],"a":0,"r":"Choice A is the best answer. This choice uses a semicolon to join two independent clauses (\"Nakalembe doesn’t just…though\" and \"she also shares...\"). This choice also appropriately includes \"though\" in the first clause, where it logically belongs. Choice B is incorrect. This choice results in a grammar error called a comma splice. It incorrectly joins two independent clauses with only a comma instead of a comma and a coordinating conjunction like \"and\" or \"but.\" \"Though\" is a transition word, but it’s not a coordinating conjunction. Choice C is incorrect. This choice results in a punctuation error. A semicolon can only be used to link two independent clauses. However, if \"though\" is included in the second clause, it turns the second clause into a dependent clause, so a semicolon can’t be used after \"information.\" Choice D is incorrect. This choice results in a grammar error called a comma splice. It incorrectly joins two independent clauses with only a comma instead of a comma and a coordinating conjunction like \"and\" or \"but.\""},{"i":"0b005ae2","c":"bound","d":"H","s":"Recently unearthed Neronian tools in France dating to 54,000 years ago and attributed to Homo sapiens may provide evidence that interactions between Neanderthals and modern humans occurred 10,000 years earlier than was previously ______ finding that, if true, would overturn current theories about H. sapiens migration during the Upper Paleolithic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["supposed; a","supposed. A","supposed a","supposed, a"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to mark the boundary between the main clause (\"Recently...supposed\") and the supplementary element (\"a finding...Paleolithic\") that provides additional information about the implications of the Neronian tool discovery. Choice A is incorrect because a semicolon can’t be used in this way to join the main clause (\"Recently...supposed\") and the supplementary element (\"a finding...Paleolithic\"). Choice B is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with \"a finding.\" Choice C is incorrect because it results in a run-on sentence. The main clause (\"Recently...supposed\") and the supplementary element (\"a finding...Paleolithic\") are fused without punctuation and/or a conjunction."},{"i":"7d5c32e6","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: The fifth Solvay Conference on Physics was held in 1927. It brought together twenty-nine of the era’s preeminent scientists to discuss the emerging field of quantum theory. The conference famously featured a debate between physicists Albert Einstein and Niels Bohr. Bohr proposed that subatomic entities like electrons had only probable realities until they were observed. Einstein argued that subatomic entities like electrons had a reality independent of observation. Bohr’s position, later called the Copenhagen interpretation, remains the most widely accepted theory of quantum mechanics. The student wants to place Einstein’s argument within its historical context.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["During the dawn of quantum theory, Einstein maintained the independent reality of some subatomic entities, although Bohr’s opposing interpretation would become the widely accepted view.","At the 1927 Solvay Conference on Physics, Einstein disagreed with Bohr’s argument that subatomic entities like electrons had a reality independent of observation.","The attendees of the 1927 Solvay Conference were among the preeminent scientists of their era, including Einstein, who opposed Bohr’s proposal.","In 1927, Einstein and Bohr engaged in a famous debate; Bohr’s argument, later called the Copenhagen interpretation, would remain popular decades after."],"a":0,"r":"Choice A is the best answer. The sentence places Einstein’s argument within the historical context of the development of quantum theory, noting that his argument—made during the dawn of the field—conflicted with Bohr’s argument, which became the widely accepted view. Choice B is incorrect. The sentence misrepresents information from the notes, attributing the argument that electrons had a reality independent of observation to Bohr, not Einstein. In addition, while the sentence provides the date of the conference, it doesn’t place Einstein’s argument in the context of the development of quantum theory. Choice C is incorrect. The sentence indicates that Einstein attended the 1927 Solvay Conference; it doesn’t identify Einstein’s argument or place it in the historical context of the development of quantum theory. Choice D is incorrect. The sentence explains that Einstein and Bohr had a famous debate in 1927 and that Bohr’s argument remained popular decades afterward; it doesn’t identify Einstein’s argument or place it in the context of the development of quantum theory."},{"i":"5645f119","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: In a 2023 study, environmental scientist Jazmin Locke-Rodriguez and colleagues tested the use of floating treatment wetlands (FTWs) in Florida. FTWs are artificial floating platforms of plants used to remediate polluted or nutrient-imbalanced water. Finding: FTWs using marigold flowers removed 52% more total phosphorus than the control. Finding: The test yielded 65 market-quality blooms per square meter. The authors concluded marigolds showed “promising potential as a commercially viable remediating crop cultivated on FTWs in South Florida.” The student wants to present the findings of the study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The authors concluded that marigolds grown on FTWs were “commercially viable,” having produced 65 blooms per square meter of market- quality blooms in a 2023 study.","In a 2023 study, Locke-Rodriguez and colleagues found that marigolds cultivated on FTWs produced 52% more market-quality flower blooms than the control.","Locke-Rodriguez and colleagues found that FTWs using marigolds not only helped remove phosphorus from the water but also yielded market-quality blooms.","FTWs using marigolds, Locke-Rodriguez and colleagues found, yielded 65 flower blooms and removed 52% of phosphorus from the water."],"a":2,"r":"Choice C is the best answer. The sentence presents both findings from the study, noting that FTWs using marigolds both removed phosphorus from the water and yielded market-quality blooms. Choice A is incorrect. While the sentence presents a finding from the study, the presentation is incomplete; the study found that marigolds cultivated on FTWs both removed phosphorus from the water and yielded market-quality blooms. Choice B is incorrect. The sentence misrepresents information in the notes. The figure of 52% refers to the amount of phosphorus removed by FTWs using marigolds when compared to the control; the marigolds’ bloom yield was 65 market-quality blooms per square meter, and it was not compared to the control. Choice D is incorrect. The sentence misrepresents information in the notes. The FTWs using marigolds removed 52% more phosphorus from the water than did the control, not 52% of the total phosphorus. Additionally, the bloom figure is incomplete; the figure is 65 market-quality flower blooms per square meter."},{"i":"f8c4591b","c":"trans","d":"M","s":"With their distinctive cone shapes and steeply sloping sides, the volcanoes Hverfjall (Iceland) and Toliman (Guatemala) may look similar from afar. Tehnuka Ilanko and other volcanologists, ______ can tell by how each was formed that Hverfjall is a cinder cone volcano, while Toliman is a composite volcano.\n\nWhich choice completes the text with the most logical transition?","o":["for example,","in addition,","therefore,","though,"],"a":3,"r":"Choice D is the best answer. \"Though\" logically signals that the information in this sentence—that volcanologists can distinguish the two volcanoes by how they were formed—presents a qualification or exception to the previous statement that the volcanoes look similar. The volcanoes are actually of two different types. Choice A is incorrect because \"for example\" illogically signals that the information in this sentence exemplifies the previous information about the volcanoes looking similar. Instead, the sentence presents a qualification to that apparent similarity—the volcanoes are actually of two different types. Choice B is incorrect because \"in addition\" illogically signals that the information in this sentence merely adds to the previous information about the volcanoes looking similar. Instead, the sentence presents a qualification to that apparent similarity—the volcanoes are actually of two different types. Choice C is incorrect because \"therefore\" illogically signals that the information in this sentence is a result of the previous information about the volcanoes looking similar. Instead, the sentence presents a qualification to that apparent similarity—the volcanoes are actually of two different types."},{"i":"660d50dc","c":"trans","d":"E","s":"Samuel Coleridge-Taylor was a prominent classical music composer from England who toured the US three times in the early 1900s. The child of a West African father and an English mother, Coleridge-Taylor emphasized his mixed-race ancestry. For example, he referred to himself as Anglo- African. ______ he incorporated the sounds of traditional African music into his classical music compositions.\n\nWhich choice completes the text with the most logical transition?","o":["In addition,","Actually,","However,","Regardless,"],"a":0,"r":"Choice A is the best answer. “In addition” logically signals that the detail in this sentence—that Coleridge-Taylor included traditional African music in his classical compositions—adds to the information in the previous sentence. Specifically, the previous sentence indicates one way in which Coleridge-Taylor emphasized his mixed-race ancestry, and the claim that follows indicates a second, additional way. Choice B is incorrect because “actually” illogically signals that the detail in this sentence is surprising in light of the information in the previous sentence. Instead, the detail adds to the information, indicating a second, additional way in which Coleridge-Taylor emphasized his mixed-race ancestry. Choice C is incorrect because “however” illogically signals that the detail in this sentence contrasts with the information in the previous sentence. Instead, the detail adds to the information, indicating a second, additional way in which Coleridge-Taylor emphasized his mixed-race ancestry. Choice D is incorrect because “regardless” illogically signals that the detail in this sentence is true despite the information in the previous sentence. Instead, the detail adds to the information, indicating a second, additional way in which Coleridge-Taylor emphasized his mixed-race ancestry."},{"i":"8622320e","c":"trans","d":"M","s":"Earth’s auroras—colorful displays of light seen above the northern and southern poles—result, broadly speaking, from the Sun’s activity. ______ the Sun releases charged particles that are captured by Earth’s magnetic field and channeled toward the poles. These particles then collide with atoms in the atmosphere, causing the atoms to function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
