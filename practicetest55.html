<script>
const D={"t":"Practicetest55","q":[{"i":"5179fd36","c":"vocab","d":"E","s":"Urban planning expert Francisco Lara-Valencia and colleagues have argued that managing environmental matters along the US-Mexico border ______ coordination between the two countries’ governments. Since ecosystems extend across the border, actions taken on one side can have environmental effects on the other side, making international cooperation essential.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["requires","praises","reports","advises"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of environmental management along the US and Mexican border. In this context, \"requires\" means needs in order to perform a task. The text indicates that because ecosystems span the border, actions taken by the government on one side of the border can affect the environment in the nation on the other side of the border, which makes international cooperation crucial. In other words, because actions on one side of the US and Mexican border can affect the other side of the border, managing environmental matters along the border requires coordination between the two governments. Choice B is incorrect because \"praises\" in this context would mean to express a favorable judgment, but the text doesn’t describe approval expressed by anyone, and it wouldn’t make sense to say that environmental management itself praises intergovernmental coordination. Choice C is incorrect. In this context, \"reports\" would mean gives an account. Although coordination between the US and Mexican governments likely would involve some sort of reporting, the text doesn’t describe any such practice. Choice D is incorrect. In this context, \"advises\" would mean recommends a course of action, and although governments can advise one another, it wouldn’t make sense to say that environmental management itself makes recommendations."},{"i":"e8c26398","c":"vocab","d":"M","s":"To develop a method for measuring snow depth with laser beams, NASA physicist Yongxiang Hu relied on ______; identifying broad similarities between two seemingly different phenomena, Hu used information about how ants move inside colonies to calculate how the particles of light that make up laser beams travel through snow.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a collaboration","an accessory","a contradiction","an analogy"],"a":3,"r":"Choice D is the best answer. The text after the semicolon tells us that Hu \"identif[ied] broad similarities between two seemingly different phenomena,\" comparing ants with light particles. Since an analogy seeks similarities between seemingly unrelated phenomena, this fits the context perfectly. Choice A is incorrect. \"A collaboration\" refers to \"an act of working with others,\" but what comes after the semicolon doesn’t describe collaboration with other researchers. Instead, it shows a comparison between two different (but ultimately similar) scientific phenomena. Choice B is incorrect. \"An accessory\" can refer to \"something added to increase attractiveness or usefulness.\" No accessories are described in this text. Choice C is incorrect. \"A contradiction\" means \"a set of ideas or things that are opposed to or inconsistent with each other.\" The text describes how Hu used the similarity between ant and light particle movement to develop his method, so a word that refers to difference would not make sense here."},{"i":"c843d63c","c":"vocab","d":"M","s":"The artisans of the Igun Eronmwon guild in Benin City, Nigeria, typically ______ the bronze- and brass-casting techniques that have been passed down through their families since the thirteenth century, but they don’t strictly observe every tradition; for example, guild members now use air- conditioning motors instead of handheld bellows to help heat their forges.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["experiment with","adhere to","improve on","grapple with"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of bronze- and brass-casting techniques used by the Igun Eronmwon guild. In this context “adhere to” would mean to act in accordance with. The text states that although members of the Igun Eronmwon guild typically do something with techniques that have been passed down since the thirteenth century, they “don’t strictly observe every tradition.” By establishing a contrast with not always following traditions, the context suggests that guild members do typically adhere to traditional techniques. Choice A is incorrect because in this context “experiment with” would mean to do something new with. Although using motors rather than manual bellows is presented as a new approach, the text establishes a contrast between what the guild members typically do with techniques that have been passed down over centuries and the idea that the members “don’t strictly observe every tradition.” The phrase “experiment with” wouldn’t support the contrast because regularly trying new things with the techniques would be an example of not strictly following all traditions. Choice C is incorrect because in this context “improve on” would mean to make better. Although using motors rather than manual bellows might be an improved approach, the text establishes a contrast between what the guild members typically do with techniques that have been passed down over centuries and the idea that the members “don’t strictly observe every tradition.” The phrase “improve on” wouldn’t support the contrast because regularly making changes to the techniques would be an example of not strictly following all traditions. Choice D is incorrect because in this context “grapple with” would mean to try hard to solve a difficult problem. Although bronze- and brass-casting are likely challenging tasks, nothing in the text suggests that the guild members have any particular difficulties with the techniques passed down since the thirteenth century."},{"i":"be94c9fc","c":"vocab","d":"H","s":"The following text is adapted from James Baldwin’s 1956 novel Giovanni’s Room. The narrator is riding in a taxi down a street lined with food vendors and shoppers in Paris, France. The multitude of Paris seems to be dressed in blue every day but Sunday, when, for the most part, they put on an unbelievably festive black. Here they were now, in blue, disputing, every inch, our passage, with their wagons, handtrucks, their bursting baskets carried at an angle steeply self-confident on the back. ©1956 by James Baldwin As used in the text, what does the word “disputing” most nearly mean?","o":["Arguing about","Disapproving of","Asserting possession of","Providing resistance to"],"a":3,"r":"Choice D is the best answer because as used in the text, \"disputing\" most nearly means providing resistance to. The narrator is in a taxi as it drives down a street lined with so many food vendors and shoppers that the narrator describes them as \"the multitude of Paris,\" meaning an immense group of people. The street is essentially a large open-air market, and there are so many people pushing small wagons of goods and carrying shopping baskets that \"every inch\" of the taxi’s progress is impeded. In other words, the people are providing resistance to the taxi’s attempt to drive down the street. Choice A is incorrect. Although in some contexts, \"disputing\" can mean arguing, the narrator doesn’t portray the shoppers and vendors as arguing with the driver of the taxi or, indeed, arguing at all. Choice B is incorrect. Although in some contexts, \"disputing\" can mean expressing disapproval, the narrator doesn’t suggest that the shoppers and vendors necessarily disapprove of the taxi’s attempt to drive down the street. Instead, their combined presence along the street has the effect of impeding the taxi’s progress. Choice C is incorrect because, as the narrator explains, both the multitude of people and the taxi are using a public space (a street) at the same time. The narrator doesn’t go so far as to suggest that the people feel that they, and not the taxi, possess exclusive access to the street."},{"i":"d563bf65","c":"purpose","d":"E","s":"The following text is adapted from Jean Webster’s 1912 novel Daddy-Long-Legs. The narrator is a young college student writing letters detailing her weekly experiences. [The college is] organizing the Freshman basket-ball team and there’s just a chance that I shall make it. I’m little of course, but terribly quick and wiry and tough. While the others are hopping about in the air, I can dodge under their feet and grab the ball.\n\nWhich choice best states the main purpose of the text?","o":["To compare basketball with other sports","To provide details of how to play basketball","To state how players will be chosen for the basketball team","To explain why the narrator thinks she might make the basketball team"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text. In the first sentence of the text, the narrator states that she thinks there’s a chance she will become part of the basketball team at her college. She goes on to explain that she is \"quick\" and \"tough.\" Based on these characteristics, she thinks she has a chance to join the team. Thus, the main purpose of the text is to explain why the narrator thinks she might make the basketball team. Choice A is incorrect because the text focuses solely on basketball and doesn’t mention any other kinds of sports. Choice B is incorrect because the text doesn’t describe aspects of the game of basketball. Instead, it provides the narrator’s reasoning for thinking that she might make her school basketball team. Choice C is incorrect. Although the narrator explains why she thinks she will be chosen for the basketball team at her school, the text doesn’t go into the general decision-making process or the requirements for being picked for the team."},{"i":"1782cdd7","c":"purpose","d":"E","s":"In many agricultural environments, the banks of streams are kept forested to protect water quality, but it’s been unclear what effects these forests may have on stream biodiversity. To investigate the issue, biologist Xingli Giam and colleagues studied an Indonesian oil palm plantation, comparing the species richness of forested streams with that of nonforested streams. Giam and colleagues found that species richness was significantly higher in forested streams, a finding the researchers attribute to the role leaf litter plays in sheltering fish from predators and providing food resources.\n\nWhich choice best states the main purpose of the text?","o":["It discusses research intended to settle a debate about how agricultural yields can be increased without negative effects on water quality.","It explains the differences between stream-protection strategies used in oil palm plantations and stream-protection strategies used in other kinds of agricultural environments.","It describes findings that challenge a previously held view about how fish that inhabit streams in agricultural environments attempt to avoid predators.","It presents a study that addresses an unresolved question about the presence of forests along streams in agricultural environments."],"a":3,"r":"Choice D is the best answer. The author first describes an unresolved question: what effect do bank forests have on stream biodiversity? Then the author presents a study that answers the question: bank forests increase stream biodiversity. Choice A is incorrect. This isn’t the main purpose of the text. The text never mentions agricultural yields. Choice B is incorrect. This isn’t the main purpose of the text. The text never mentions other kinds of agricultural environments. Choice C is incorrect. This isn’t the main purpose of the text. The text never mentions any previously held view about how fish in these streams try to avoid predators."},{"i":"d168e7c5","c":"func","d":"M","s":"The following text is from Annie Dillard’s 1987 autobiographical novel An American Childhood. The narrator is a young girl living in Pittsburgh. I walked. My mother had given me the freedom of the streets as soon as I could say our telephone number. I walked and memorized the neighborhood. I made a mental map and located myself upon it. At night in bed I rehearsed the small world’s scheme and set challenges: <u>Find the store using backyards only. Imagine a route from the school to my friend’s house.<\/u> ©1987 by Annie Dillard Which choice best describes the function of the underlined portion in the text as a whole?","o":["It describes the narrator trying to memorize her telephone number.","It provides examples of what the narrator thinks about at night.","It gives directions to the narrator’s favorite local store.","It portrays the narrator’s relationship with her mother."],"a":1,"r":"Choice B is the best answer because it accurately describes how the underlined portion functions in the text as a whole. In the text, the narrator explains that she walks around her neighborhood, making a \"mental map\" of the area that she imagines herself navigating through. She then states that she rehearses \"the small world’s scheme\"—that is, imagines moving through her mental map—and challenges herself to use the map in her mind while lying in bed at night. The underlined portion presents two such challenges (getting to the store through backyards and traveling from school to a friend’s house) and thus provides examples of what the narrator thinks about at night. Choice A is incorrect because the underlined portion makes no mention of memorizing a telephone number. Although the narrator mentions that she had to learn the home telephone number before her mother would give her permission to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about memorizing the telephone number. Choice C is incorrect. Although the underlined portion refers to navigation tasks like finding a route to a store only through backyards, the text contains no specific directions to any store, nor is any store identified as the narrator’s favorite. Choice D is incorrect because the underlined portion makes no mention of the narrator’s mother and doesn’t address the narrator’s relationship with her. Although the narrator mentions that her mother gave her permission as a child to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about the mother or her relationship to her child."},{"i":"9b01bcf4","c":"func","d":"H","s":"The 1967 release of Harold Cruse’s book The Crisis of the Negro Intellectual isolated him from almost all other scholars and activists of the American Civil Rights Movement—though many of those thinkers disagreed with each other, he nonetheless found ways to disagree with them all. He thought that activists who believed that Black people such as himself should culturally assimilate were naïve. <u>But he also sharply criticized Black nationalists such as Marcus Garvey who wanted to establish independent, self-contained Black economies and societies, even though Cruse himself identified as a Black nationalist.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It describes a direction that Cruse felt the Civil Rights Movement ought to take.","It indicates that Cruse’s reputation as a persistent antagonist of other scholars is undeserved.","It describes a controversy that Cruse’s work caused within the Black nationalist movement.","It helps explain Cruse’s position with respect to the community of civil rights thinkers."],"a":3,"r":"Choice D is the best answer. The text as a whole claims that Cruse disagreed with virtually all other Civil Rights scholars and activists. The underlined sentence describes one way that Cruse both did and didn’t fit in with those thinkers: he criticized Black nationalists, even though he identified as one. Choice A is incorrect. The underlined sentence doesn’t do this. It describes Cruse’s criticisms—it never mentions what Cruse did want the movement to do instead. Choice B is incorrect. This conflicts with the text, which argues that Cruse did disagree with almost all other scholars of the Civil Rights Movement. Choice C is incorrect. This is a step too far. The text never says that Cruse’s work caused controversy within the Black nationalist movement."},{"i":"eb89dcc8","c":"cross","d":"E","s":"Text 1 <u>Imagine you and your friend are trying to decide where to eat lunch.<\/u> When people try to make joint decisions like this, they often don’t reveal their true preferences. Instead, they say they would be happy with all options because they think this response will help them appear more easygoing and likable to the other person.\n\nText 2 Research shows that people who don’t state their preferences when making a decision with others aren’t more likable in the eyes of others. In fact, stating that you have no preference actually makes the decision more difficult for other people. It can also cause them to feel less happy with their ultimate decision and with you.\n\nBased on the texts, what response would the author of\n\nText 2 most likely suggest for someone in the situation described in the underlined sentence in\n\nText 1?","o":["Cancel the plan to have lunch together.","Ask where the friend typically likes to eat.","State a preference about where to eat.","Change the subject to talk about something else."],"a":2,"r":"Choice C is the best answer because it directly applies the research findings described in Text 2 to the situation underlined in Text 1. The underlined sentence in Text 1 describes a common scenario in which two friends are deciding on a lunch location. Text 1 goes on to explain that people often don’t reveal their true preferences in such situations, instead claiming they’re fine with any option so that they can appear more easygoing and likable. Text 2 presents research that advises against this approach, stating that people who don’t express their preferences aren’t viewed as more likable and that this behavior actually makes decisions more difficult for others. Since Text 2 specifically argues against the strategy of concealing preferences and indicates negative outcomes from doing so, the author of Text 2 would most likely recommend stating a preference about where to eat. Choice A is incorrect because nothing in Text 2 suggests that canceling plans is a good solution. The author of Text 2 is addressing how to make joint decisions effectively (through stating your own preference), not advocating for avoiding such decisions entirely. Choice B is incorrect because asking where the friend typically likes to eat still avoids stating one’s own preference. While this approach might seem considerate, it continues the pattern of not revealing true preferences that Text 2 identifies as problematic. Choice D is incorrect because changing the subject would avoid making any decision altogether, which contradicts the implied advice in Text 2. The author of Text 2 presents research suggesting that directly engaging with the decision by stating preferences helps others make decisions and makes you appear more likable."},{"i":"706046f7","c":"main","d":"E","s":"In the 1960s, Gloria Richardson led a movement to promote racial equality. Her involvement in this effort was inspired by her daughter, Donna Richardson. In 1961, Donna joined protests organized by the Student Nonviolent Coordinating Committee in Cambridge, Maryland. Following her daughter, Gloria joined these protests too. Gloria soon became the cochair of the Cambridge Nonviolent Action Committee. She was also the leader of what became known as the Cambridge movement.\n\nAccording to the text, what did Gloria Richardson lead?","o":["The Cambridge movement","Her daughter Donna’s high school","Protests to support environmental protections","A new business in Cambridge, Maryland"],"a":0,"r":"Choice A is the best answer because it presents information about Gloria Richardson that is supported by the text. The text provides a number of details about Gloria’s involvement in efforts to promote racial equality, including that she was the leader of what became known as the Cambridge movement. Choice B is incorrect because the text never indicates that Gloria Richardson led her daughter Donna’s high school. The text says only that Gloria was inspired by her daughter to become involved in efforts to promote racial equality. Choice C is incorrect because the text doesn’t mention protests related to environmental protections. Rather, the text discusses Gloria Richardson’s involvement in efforts to promote racial equality. Choice D is incorrect because the text doesn’t indicate that Gloria Richardson led a new business in Cambridge, Maryland. Rather, the text states that she led what became known as the Cambridge movement."},{"i":"9731a22b","c":"main","d":"H","s":"Paleontologist Lucas E. Fiorelli and colleagues have reported the discovery at a mine in Brazil of several egg clutches, partially preserved single eggs, and egg shells from the Late Cretaceous period. The researchers have concluded that the area was once a nesting and breeding site for titanosaurs, a group of sauropod dinosaurs. The finding is significant given the previous lack of known nesting sites in northern regions of South America, which led many paleontologists to assume that titanosaurs migrated south to lay eggs. What does the text most strongly suggest about the site discovered by the researchers?","o":["It is the earliest known example of a titanosaur nesting and breeding site.","It was very difficult to excavate given that it was discovered in a mine.","It may have been occupied by other sauropods in addition to titanosaurs.","It is farther north than any other nesting site discovered in South America."],"a":3,"r":"Choice D is the best answer because it presents a statement about the site discovered by the researchers that is supported by the text. The text discusses Fiorelli and colleagues’ discovery of egg clutches, single eggs, and eggshells in a Brazilian mine. According to the text, the presence of these eggs, which are from the Late Cretaceous period, led the researchers to conclude that the location was once a nesting and breeding site for titanosaurs. The text then explains that the finding is important because of the “previous lack of known nesting sites in northern regions of South America.” If there haven’t been any other discoveries of a nesting site in South America’s northern regions and the site in the Brazilian mine is the first, then the text strongly suggests that the site is farther north than other nesting sites that have been discovered in South America. Choice A is incorrect because the text doesn’t suggest that the site discovered by Fiorelli and colleagues is the earliest titanosaur nesting and breeding site known to paleontologists but rather that it’s the first nesting site found in northern regions of South America. Moreover, the text doesn’t suggest how the timeline of the newly discovered site compares with that of other titanosaur nesting and breeding sites. Choice B is incorrect because there is no mention in the text about any difficulties that Fiorelli and colleagues faced when they were excavating the nesting and breeding site in the Brazilian mine. Choice C is incorrect because the text doesn’t support the idea that the nesting and breeding site in the Brazilian mine was occupied by sauropods other than titanosaurs. The text simply mentions that titanosaurs are sauropod dinosaurs and presents the researchers’ conclusion that the site they discovered was for titanosaurs."},{"i":"2d2983b3","c":"infer","d":"M","s":"Pigments give paints and dyes their color. Ocher is a mineral-based pigment used to make several colors, including red. Red ocher gets its color from iron oxide. Pigments can also be plant-based; plant-based pigments contain a high level of carbon. In a 2023 study, archaeologists tested the red pigment on decorated beads made by members of the Natufian culture approximately 15,000 years ago. The test showed that the pigment found on several beads contained no iron but had a high level of carbon. This finding led the researchers to conclude that ______ Which choice most logically completes the text?","o":["the Natufian beads examined in the study are the oldest surviving examples of the use of plant-based pigments for decorating beads.","the Natufian beadmakers used plant-based pigments rather than ocher to decorate some of the beads examined in the study.","the Natufian beadmakers preferred to use plant-based pigments because they are much brighter than mineral-based pigments are.","the pigments used by the Natufian beadmakers likely came from plants because ocher was difficult to find."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the chemical content of pigments. The text begins by differentiating between two kinds of pigments: mineral-based pigments such as red ocher, which get their color from iron oxide, and plant-based pigments, which have a high level of carbon. The text then goes on to describe an analysis by archaeologists of the pigment of decorated beads made by members of the Natufian culture around 15,000 years ago. The archaeologists found that the red pigment on some of the beads contained no iron but had a high level of carbon. Since red ocher gets its color from iron oxide, while plant-based pigments have a high level of carbon, the researchers concluded that the Natufian beadmakers used plant-based pigments to decorate some of the beads examined in the study. Choice A is incorrect because the text does not indicate that the Natufians were the first to use plant-based pigments, so it cannot be concluded that the beads in the study were the oldest surviving examples of the use of plant-based pigments for decorating beads. Choice C is incorrect because the text does not compare the brightness of plant-based and mineral-based pigments. Choice D is incorrect. While it can be concluded that the Natufian beadmakers used plant-based pigments because the pigment found on several beads had a high level of carbon, the text offers no evidence that ocher was difficult to find."},{"i":"a68fd3e7","c":"infer","d":"H","s":"Many of William Shakespeare’s tragedies address broad themes that still appeal to today’s audiences. For instance, Romeo and Juliet, which is set in the Italy of Shakespeare’s time, tackles the themes of parents versus children and love versus hate, and the play continues to be read and produced widely around the world. But understanding Shakespeare’s so-called history plays can require a knowledge of several centuries of English history. Consequently, ______ Which choice most logically completes the text?","o":["many theatergoers and readers today are likely to find Shakespeare’s history plays less engaging than the tragedies.","some of Shakespeare’s tragedies are more relevant to today’s audiences than twentieth-century plays.","Romeo and Juliet is the most thematically accessible of all Shakespeare’s tragedies.","experts in English history tend to prefer Shakespeare’s history plays to his other works."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the relative appeal of different kinds of plays by Shakespeare to today’s audiences. According to the text, Shakespeare’s tragedies address broad themes that continue to appeal to today’s audiences. Indeed, the text suggests that these themes are timeless, as illustrated by the example of Romeo and Juliet, which the text states is still read and widely performed despite being set in the Italy of Shakespeare’s time. In contrast, the text indicates that audiences and readers may need to be familiar with several centuries of English history in order to understand Shakespeare’s history plays. Because many theatergoers and readers are unlikely to possess such extensive historical knowledge, it follows that they are likely to find Shakespeare’s history plays less engaging than his more accessible tragedies. Choice B is incorrect because the text never introduces a comparison between Shakespeare’s tragedies and twentieth-century plays, only between Shakespeare’s tragedies and his history plays. Since twentieth-century plays aren’t mentioned, there’s no basis in the text for the idea that some of Shakespeare’s tragedies are more relevant than twentieth-century plays to today’s audiences. Choice C is incorrect. Although the text indicates that Romeo and Juliet is thematically accessible to today’s audiences, it doesn’t suggest that Romeo and Juliet is more accessible than Shakespeare’s other tragedies. Rather, the text presents Romeo and Juliet as an example to support the idea that Shakespeare’s tragedies hold continued appeal for today’s readers and theatergoers. Choice D is incorrect. Although experts in English history would likely possess the knowledge needed to understand Shakespeare’s history plays, the text never mentions such experts or suggests that they would enjoy the history plays more than Shakespeare’s other works."},{"i":"73d457b6","c":"claim","d":"M","s":"In the 1970s, a roughly 60,000-year-old piece of hyena bone marked with nine notches was discovered at a site in western France once inhabited by Neanderthals. Although many believe that only modern humans developed systems for notating numbers, one archaeologist asserts that this artifact may be a sign that Neanderthals also recorded numerical information. The notches on the bone are unevenly spaced but approximately parallel, and microscopic analysis reveals that they were made with a single stone tool; according to the archaeologist, <u>this suggests that the notches were all made at one time by one individual as a means of counting something.<\/u> Which finding, if true, would most directly weaken the underlined claim?","o":["Parallel lines are a common feature in modern humans’ early systems for recording numerical information.","More than nine approximately parallel notches made with a different stone tool are present on another artifact found at a site in western France.","It would have taken careful effort to make evenly spaced lines on bone with the stone tools typically used by Neanderthals.","Decorative art discovered at another Neanderthal site in western France primarily features patterns of unevenly spaced parallel lines."],"a":3,"r":"Choice D is the best answer. The archeologist bases their claim on the fact that the hyena bone features unevenly spaced parallel notches. But if unevenly spaced parallel lines were found on \"decorative art\" at another Neanderthal site, it would suggest that the hyena bone is probably decorative art as well—not a counting tool. Choice A is incorrect. This choice doesn’t weaken the underlined claim. If anything, it might actually strengthen the claim: assuming we can make an inference about Neanderthals using a fact about early humans, it provides more support for the idea that the person who made the notches was counting something. Choice B is incorrect. This choice doesn’t weaken the underlined claim. The fact that another artifact had parallel notches made with a different stone tool doesn’t tell us anything about the use of either artifact. For all we know, they could both have been used for counting. Choice C is incorrect. This choice doesn’t weaken the underlined claim. The fact that it took effort to make the lines doesn’t tell us anything about what the lines were for."},{"i":"16a4a83b","c":"claim","d":"M","s":"An Ideal Husband is an 1895 play by Oscar Wilde. In the play, which is a satire, Wilde suggests that a character named Lady Gertrude Chiltern is perceived as both extremely virtuous and unforgiving, as is evident when another character says ______ Which quotation from An Ideal Husband most effectively illustrates the claim?","o":["“Lady Chiltern is a woman of the very highest principles, I am glad to say. I am a little too old now, myself, to trouble about setting a good example, but I always admire people who do.”","“Do you know, [Lady Chiltern], I don’t mind your talking morality a bit. Morality is simply the attitude we adopt towards people whom we personally dislike.”","“[Lady Chiltern] does not know what weakness or temptation is. I am of clay like other men. She stands apart as good women do—pitiless in her perfection—cold and stern and without mercy.”","“Lady Chiltern, you are a sensible woman, the most sensible woman in London, the most sensible woman I know.”"],"a":2,"r":"Choice C is the best answer because it most effectively uses a quotation to illustrate the claim that Lady Gertrude Chiltern is perceived as “both extremely virtuous and unforgiving.” In the quotation, a man describes Lady Chiltern as someone who “does not know what weakness or temptation is.” In other words, the man regards her as someone who is strong and adheres to a strict definition of moral perfection. However, he ironically suggests that this definition excludes mercy and forgiveness—qualities that are also thought of as virtues; according to him, Lady Chiltern is “pitiless in her perfection—cold and stern and without mercy.”This description supports the idea that Lady Chiltern is perceived by others as virtuous as well as unforgiving. Choice A is incorrect. The quotation supports the claim that Lady Chiltern is perceived as virtuous, in that it describes her as “a woman of the very highest principles.” However, it doesn’t characterize her as unforgiving or being perceived as such. Choice B is incorrect. The quotation suggests that Lady Chiltern is concerned with morality, but it suggests that her interest in discussing it is fundamentally hypocritical and functions as a means by which to judge others. However, the quotation doesn’t address the question of whether Lady Chiltern is unmerciful to those who seek forgiveness for harm they have caused. Choice D is incorrect because it doesn’t address either Lady Chiltern’s perceived virtuousness or her perceived lack of forgiveness; instead, it expresses the belief that she is sensible."},{"i":"cf7491c1","c":"graph","d":"M","s":"","o":["None of the planets have an orbital period of more than 10 days, and TOI-628 b has a mass of 6.33 Jupiters.","TOI-1478 b has an orbital period of 153 days, and the masses of all the planets range from 0.85 to 6.33 Jupiters.","All the planets have a radius between 1.060 and 1.771 Jupiters, and only TOI-1333 b has an orbital period of more than 10 days.","Each of the planets has a mass greater than 0.25 Jupiters, and all except for TOI-1478 b have an orbital period of less than 10 days."],"a":3,"r":"Choice D is the best answer because it accurately describes data from the table that support Rodriguez and colleagues’ assertion about the classifications of the five new gas exoplanets. The text describes two categories of gas planets: hot Jupiters, which have a mass of at least 0.25 Jupiters and an orbital period of less than 10 days, and warm Jupiters, which have the same mass characteristic but have orbital periods of more than 10 days. According to the table, four of the gas exoplanets discovered by Rodriguez and colleagues have a mass of at least 0.25 Jupiters and an orbital period of less than 10 days, while one of the planets has a mass of at least 0.25 Jupiters and an orbital period of more than 10 days. These data therefore support Rodriguez and colleagues’ assertion that four of the new exoplanets are hot Jupiters and one is a warm Jupiter. Choice A is incorrect because it doesn’t accurately describe the data from the table. Although the table shows that TOI-628 b has a mass equivalent to 6.33 Jupiters, the table also shows that one of the planets—TOI-1478 b—does indeed have an orbital period of more than 10 days. Choice B is incorrect because it doesn’t accurately describe the data from the table. Although the table does show that the masses of the five planets range from 0.85 to 6.33 Jupiters, the table also shows that TOI-1478 b has an orbital period of 10.180 days, not 153 days. Choice C is incorrect. According to the table, TOI-1333 b has an orbital period of only 4.720 days, not more than 10 days. Additionally, although the table does show that all the planets have a radius between 1.060 and 1.771 Jupiters, the text indicates that a planet may be classified as a hot Jupiter or a warm Jupiter based on its mass and orbital period, not on its radius, making the information about the range of the five planets’ radius values irrelevant."},{"i":"b30a2613","c":"graph","d":"M","s":"","o":["The spider population count was the same in both enclosures on day 1.","The spider population count also substantially declined by day 30 in the enclosure without lizards.","The largest decline in spider population count in the enclosure with lizards occurred from day 1 to day 10.","The spider population count on day 30 was lower in the enclosure with lizards than in the enclosure without lizards."],"a":1,"r":"Choice B is the best answer because it describes data from the graph that weaken the student’s conclusion about the reduction in the spider population in the enclosure with lizards. The graph shows that the enclosure with lizards and the enclosure without lizards each began with about 85 spiders, and that the number of spiders in each enclosure fell over the 30 days of the study. The student’s claim is that the reduction in spiders in the enclosure with lizards is “entirely attributable to the presence of the lizards,” meaning that the spider population wouldn’t have declined except for the presence of the lizards. This claim is weakened, however, by the fact that the enclosure without lizards also saw a substantial reduction in the number of spiders. Since the number of spiders fell in the enclosure without lizards as well as in the enclosure with lizards, there must be some other factor than just the presence of the lizards that contributed to the reduction in the spider population. Choice A is incorrect because the fact that the two enclosures started with the same number of spiders is irrelevant to the claim that the reduction in spider population by day 30 in the enclosure with lizards can be entirely attributed to the lizards. Choice C is incorrect because the fact that the spider population in the enclosure with lizards fell more between days 1 and 10 than in other periods has nothing to do with the student’s claim that the reduction in spiders in that enclosure by day 30 can be entirely attributed to the lizards. Choice D is incorrect. Although it’s true that on day 30 the spider population was lower in the enclosure with lizards than in the enclosure without lizards, this fact doesn’t weaken the student’s claim that the reduction in the spider population in the enclosure with lizards can be entirely attributed to the lizards. Indeed, the lower spider population in the enclosure with lizards suggests that the lizards are contributing to the reduction in the spider population, though the fact that the spider population also fell substantially in the other enclosure means that the lizards aren’t the only cause of the reduction."},{"i":"c5d39bc7","c":"fss","d":"E","s":"Scientists believe that, unlike most other species of barnacle, turtle barnacles (Chelonibia testudinari) can dissolve the cement-like secretions they use to attach ______ to a sea turtle shell, enabling the barnacles to move short distances across the shell’s surface.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["it","themselves","them","itself"],"a":1,"r":"Choice B is the best answer. The convention being tested is pronoun-antecedent agreement. The plural reflexive pronoun “themselves” agrees in number with the plural antecedent “turtle barnacles,” correctly indicating what is attached to a sea turtle shell. Choice A is incorrect because the singular pronoun “it” doesn’t agree in number with the plural antecedent “turtle barnacles.” Choice C is incorrect because it results in an unclear and confusing sentence. In this context, it’s unclear what the plural pronoun “them” refers to. Choice D is incorrect because the singular reflexive pronoun “itself” doesn’t agree in number with the plural antecedent “turtle barnacles.”"},{"i":"acf454af","c":"fss","d":"E","s":"An online content creator who uses copyrighted songs without permission risks being demonetized (prohibited from including paid advertisements in content). The best way to avoid demonetization is to choose music from the public domain. Using one of these noncopyrighted songs ______ a creator won’t lose advertising revenue.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are ensuring","have ensured","ensure","ensures"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The singular verb \"ensures\" agrees in number with the singular subject \"using.\" Choice A is incorrect because the plural verb \"are ensuring\" doesn’t agree in number with the singular subject \"using.\" Choice B is incorrect because the plural verb \"have ensured\" doesn’t agree in number with the singular subject \"using.\" Choice C is incorrect because the plural verb \"ensure\" doesn’t agree in number with the singular subject \"using.\""},{"i":"7c48a6dd","c":"fss","d":"E","s":"In the late 1960s, inspired in part by the sight of laundry hanging on a clothesline, African American abstract painter Sam Gilliam began to create his iconic “Drape” paintings. He applied bold, saturated hues to large canvases and ______ them from ceilings or walls, causing the drooping fabric to cascade in dramatic loops and curves.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to have suspended","suspending","to suspend","suspended"],"a":3,"r":"Choice D is the best answer. The past tense of \"suspended\" matches the past tense of \"applied,\" which has the same subject (\"he\") and takes place in the same context: \"He applied…and [he] suspended.\" Choice A is incorrect. The perfect infinitive \"to have suspended\" doesn’t match the past tense of \"applied,\" and it can’t serve as a verb on its own. These are both verbs with the same subject and in the same context, so there’s no need to shift tenses. Choice B is incorrect. The present participle \"suspending\" doesn’t match the past tense of \"applied,\" and it can’t serve as a verb on its own. These are both verbs with the same subject and in the same context, so there’s no need to shift tenses. Choice C is incorrect. The infinitive \"to suspend\" doesn’t match the past tense of \"applied,\" and it can’t serve as a verb on its own. These are both verbs with the same subject and in the same context, so there’s no need to shift tenses."},{"i":"ce81d0b7","c":"bound","d":"E","s":"The life spans of rockfish vary greatly by species. For instance, the colorful calico rockfish (Sebastes dallii) can survive for a little over a ______ the rougheye rockfish (Sebastes aleutianus) boasts a maximum life span of about two centuries.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["decade: while","decade. While","decade; while","decade, while"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation between a main clause and a subordinate clause. This choice correctly uses a comma to mark the boundary between the main clause (\"the colorful…decade\") and the subordinate clause (\"while…centuries\") that provides contrasting information about the life span of rougheye rockfish. Choice A is incorrect because a colon can’t be used in this way to join a main clause and a subordinate clause. Choice B is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with \"while.\" Choice C is incorrect because a semicolon can’t be used in this way to join a main clause and a subordinate clause."},{"i":"2c84f96a","c":"bound","d":"M","s":"In 2017, artists Isabel and Ruben Toledo redesigned the costumes and sets for The Miami City Ballet’s production of The ______ to reviewers, the Toledos’ designs helped infuse the production with elements of Miami’s Latin American culture.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Nutcracker according,","Nutcracker, according","Nutcracker according","Nutcracker. According"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (“In 2017...Nutcracker”) and another (“According...culture”). The supplementary element “according to reviewers” modifies the main clause of the second sentence (“the Toledos’...culture”). Choice A is incorrect because it results in a run-on sentence. The sentences are fused without punctuation and/or a conjunction. Furthermore, no punctuation is needed within the supplementary element “according to reviewers.” Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice C is incorrect because it results in a run-on sentence. The sentences are fused without punctuation and/or a conjunction."},{"i":"7298633c","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Grimanesa Amoros is a Peruvian American artist well known for her LED light sculptures. Her sculpture Uros Island is made of smooth multicolored LED domes. It occupies 335 cubic feet of space. Her sculpture Fortuna is made of entangled blue and white LED tubes. It occupies 19,950 cubic feet of space. The student wants to emphasize a similarity between Uros Island and Fortuna.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The smooth LED domes of Grimanesa Amoros’s Uros Island stand in contrast to the tangled LED tubes of Fortuna.","At 19,950 cubic feet in size, Grimanesa Amoros’s Fortuna cuts a larger figure than the 335-cubic-foot Uros Island.","Grimanesa Amoros is the artist behind Uros Island—a sculpture made of smooth multicolored LED domes.","Uros Island is an LED light sculpture made by Grimanesa Amoros, as is Fortuna."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes a similarity between the sculptures, noting that both Uros Island and Fortuna are LED light sculptures created by Grimanesa Amoros. Choice A is incorrect. Noting that Uros Island’s smooth LED domes contrast with Fortuna’s tangled LED tubes, the sentence emphasizes a difference between the two sculptures rather than a similarity. Choice B is incorrect. Contrasting the respective sizes of Uros Island and Fortuna, the sentence emphasizes a difference between the two sculptures rather than a similarity. Choice C is incorrect. While the sentence describes Uros Island, it doesn’t mention Fortuna or emphasize any similarity between the two sculptures."},{"i":"ec03f090","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: A sestina is a thirty-nine-line poetic form. Each line of the poem ends with one of six end words, which alternate according to a set pattern. “Forage Sestina” is a sestina by Marilyn Hacker. Its end words are words, structure, wire, beam, wall, and room. “Towards Autumn” is a sestina by Marilyn Hacker. Its end words are daughter, friend, bread, mother, lover, and myself. The student wants to use one of the poems to illustrate the sestina form.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Hacker employs the sestina, a poetic form with thirty-nine lines and six end words, in both “Forage Sestina” and “Towards Autumn.”","As a sestina, “Towards Autumn” contains thirty-nine lines and six end words—in this case, daughter, friend, bread, mother, lover, and myself— that alternate in a set pattern.","The thirty-nine-line sestina form uses the words daughter, friend, bread, mother, lover, and myself, which are found in the poem “Forage Sestina.”","Hacker has used the sestina form multiple times, as in “Towards Autumn,” which contains these six words: words, structure, wire, beam, wall, and room."],"a":1,"r":"Choice B is the best answer. The sentence uses the poem \"Towards Autumn\" to illustrate the form of a sestina, explaining that a sestina’s thirty- nine lines all end in one of six alternating words and showcasing that poem’s specific end words. Choice A is incorrect. The sentence identifies both of Hacker’s poems as sestinas; it doesn’t use one of the poems to illustrate the form of a sestina. Choice C is incorrect. While the sentence appears to use the poem \"Forage Sestina\" to illustrate a feature of the sestina form, it misrepresents the information in the notes. According to the notes, \"Forage Sestina\" doesn’t use these six end words; it uses six other words instead. Choice D is incorrect. While the sentence uses the poem \"Towards Autumn\" as an example of one of Hacker’s sestinas, it misrepresents the information in the notes. According to the notes, \"Towards Autumn\" doesn’t use these six end words; it uses six other words instead."},{"i":"4105f5ac","c":"trans","d":"M","s":"When, in 2017, Cambridge University students Lucy Moss and Toby Marlow decided they wanted to develop a musical together, one of their goals was for their female actor friends to have good parts to play. ______ they created the show Six, a retelling of the history of King Henry VIII’s wives in which each of the six queens has a starring role.\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","In summary,","For example,","To that end,"],"a":3,"r":"Choice D is the best answer. \"To that end\" logically signals that the information in this sentence—the students’ creation of a show with six starring female roles—is the product of a goal or desire in the previous sentence (the students’ wish to develop a musical with roles for female actors). Choice A is incorrect because \"in other words\" illogically signals that the information in this sentence is a paraphrase or restatement of the previous information about the students’ wish to develop a musical with roles for female actors. Instead, the students’ show is the product of that desire. Choice B is incorrect because \"in summary\" illogically signals that the information in this sentence summarizes the previous information about the students’ wish to develop a musical with roles for female actors. Instead, the students’ show is the product of that desire. Choice C is incorrect because \"for example\" illogically signals that the information in this sentence is merely an example of the previous information about the students’ wish to develop a musical with roles for female actors. Instead, the students’ show is the direct product of that desire."},{"i":"01c8c433","c":"trans","d":"E","s":"Before the 1847 introduction of the US postage stamp, the cost of postage was usually paid by the recipient of a letter rather than the sender, and recipients were not always able or willing to pay promptly. ______ collecting this fee could be slow and arduous, and heaps of unpaid-for, undeliverable mail piled up in post offices.\n\nWhich choice completes the text with the most logical transition?","o":["Regardless,","On the contrary,","Consequently,","For example,"],"a":2,"r":"Choice C is the best answer. “Consequently” logically signals that the postal problems described in this sentence (slow fee collection, heaps of undeliverable mail) were a consequence of the fee system described in the previous sentence. Choice A is incorrect because “regardless” illogically signals that the postal problems described in this sentence occurred despite the fee system described in the previous sentence. Instead, they were a consequence of that system. Choice B is incorrect because “on the contrary” illogically signals that the postal problems described in this sentence contrast with the fee system described in the previous sentence. Instead, they were a consequence of that system. Choice D is incorrect because “for example” illogically signals that the postal problems described in this sentence are an example of the fee system described in the previous sentence. Instead, they were a consequence of that system."},{"i":"a6155e60","c":"trans","d":"E","s":"Every chemical compound has a spectroscopic fingerprint, a pattern of reflected light unique to that compound. ______ upon analyzing the light reflected by the bright regions on the surface of the dwarf planet Ceres, Maria Cristina De Sanctis of Rome’s National Institute of Astrophysics was able to determine that the regions contain large amounts of the compound sodium carbonate.\n\nWhich choice completes the text with the most logical transition?","o":["Regardless,","Meanwhile,","Thus,","In comparison,"],"a":2,"r":"Choice C is the best answer. “Thus” logically signals that the action described in this sentence—the researcher being able to determine the chemical makeup of the planet’s bright regions based on how they reflect light—is a result or consequence of the previous information about spectroscopic fingerprints. Choice A is incorrect because “regardless” illogically signals that the action described in this sentence occurs despite the previous information about spectroscopic fingerprints. Instead, the finding in this sentence is a result or consequence of that information. Choice B is incorrect because “meanwhile” illogically signals that the action described in this sentence either occurs at the same time as or offers an alternative to the previous information about spectroscopic fingerprints. Instead, the finding in this sentence is a result or consequence of that information. Choice D is incorrect because “in comparison” illogically signals that the action described in this sentence is being compared with the previous information about spectroscopic fingerprints. Instead, the finding in this sentence is a result or consequence of that information."}],"img":{"cf7491c1":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEyBAMAAADqxh5FAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABSV0lEQVR42u1dd3hTt9d+db2yLSdhr5uEPR1WC7TgsEcB05bZUsyGskKBsgqYUTZtgFJmIRQoIwwzWiBhmFk2DnvHYa/EcpgZtr4/kkCA0Ngmpf3183nah/heXeno1ZF0ztGRBLjJTW5yk5vc5CY3/fuIUBKWzWMKACTLg7yhICpV5hOiei0XbcZTQrMrJATAyy9UL/8kmv84vDOuiKez/hbS8dkEQO2VpfLTNahz9UKtjF9Lrs7K+pEE1wFgzNGZHuHZFdIM+PiqPh1QorBd1WW+kBtfbdD/GnnEesTvD4HwqRCCqhTFUWsc6pIQUU2qSP/wFyVqSNWAVC05RPEJEBCMANQDtiIagWoEiKQugquib9gNESKmSqIlolSD4hTFRRX8UQ9BoUIYQr4AOY9zkGkQooZHBCQIQFWQKhqZQagnBKtpgFqxH1X/e/D6aEnnYzN0fadVv1Qmeqbi8Ob++8pFdb2kia21qHdqQc20NXTBdoqF82U2NT4BmtQS5xaMCscKjJRFb5Ee2VIoJrz/d/pdM0//pojEFFT0DF+wRrZ9i3zb/lribwVjdP1+7bigxOHLEMwIlhzeKmz/Ex4R8IxY6blmpuziYZmxb1SjbYfJmoMF7+WL3vifg9dXAxzMb+jmuXWjQrip1Kz0Cl8gPXeDxI+SDFrh2yWpvOZRflF2vVLnrUCdGENzb138SMGMqF63fXXf+Y4dMVJq/i4wvqn61DSfcExBuZr6G/lrd57iN/A7H038AsH8XVCSz7SBCyE3BQRJwjvJTB9CkXo04PCeTkFP5KfqVDN09dy66SuPyNqBm5Wace+r1sL7KohTwP6QHjxrPWk74l/Y2MFuCjhEd1K2/sAMX/ujXWdiF4wwSxZfqMMBvsAIW+W4gCMqSp5FK/t28lsyue4h2B4yq5luDDUCEMwsekTCkmFFNkSWb3CyyhEUvnlvk2rJRthRYrvNFu7z8ENg+/CEPwYUiBuCXUdV9M+z7MRu1SczLSeSFyz+z8ELUbIZAhbV5KjZwBgMSqi9TSfKVOcGbjQTBsInpKihFmIp4BcVwVPKRtZqXAcPV4jCinZEVKY11kJQ2hmuTjfDjlArm3C/rogkSlOrRyY01lq5x5ClohJ2csigqD8ArctTcmwHqDoAtUGFopjxoQo06fdBEFM+Wv
