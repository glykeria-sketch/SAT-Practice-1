<script>
const D={"t":"Practicetest22","q":[{"i":"aa7ae735","c":"vocab","d":"E","s":"The following text is adapted from Mohsin Hamid’s 2017 novel Exit West. Saeed lives with his mother and father. On cloudless nights after a daytime rain, Saeed’s father would sometimes bring out the telescope, and the family would sip green tea on their balcony, enjoying a breeze, and take turns to look up at objects whose light, often, had been emitted before any of these three viewers had been born—light from other centuries, only now reaching Earth. ©2017 by Mohsin Hamid As used in the text, what does the word “reaching” most nearly mean?","o":["Arriving at","Consulting with","Running to","Clinging to"],"a":0,"r":"Choice A is the best answer. The word \"reaching\" in this text means \"to arrive\" at Earth. Before, the light had been traveling across space; now, it had arrived at Earth. Choice B is incorrect. \"Consulting with\" means \"seeking advice or information from someone.\" Light is not alive, so it can’t consult with Earth. Choice C is incorrect. It’s confusing to say that starlight is \"only now running to Earth,\" both because light doesn’t literally \"run\" and because the text is describing the moment the light touches Earth, not the period of time when it’s traveling to Earth. Choice D is incorrect. This might be tempting, as \"clinging to\" has a connotation of \"sticking to.\" It wouldn’t make sense to say that the light was \"only now\" clinging to Earth."},{"i":"4fa7e50e","c":"vocab","d":"H","s":"According to a US tax policy expert, state taxes are ______ other factors when considering an interstate move. Even significant differences in state taxation have almost no effect on most people’s decisions, while differences in employment opportunities, housing availability, and climate are strong influences.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["consistent with","representative of","overshadowed by","irrelevant to"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the factors that influence peoples’ decisions to move to a different state. As used in this context, “overshadowed by” means to be surpassed by or caused to seem less important than other factors affecting a move. The text indicates that, according to a US tax policy expert, when people think about an interstate move, state taxes have little effect on their decisions, while employment opportunities, housing availability, and climate have a very strong effect. This context suggests that people consider these other factors to be more important than state taxes. Choice A is incorrect because the text indicates that state taxes aren’t as important a consideration as other factors when people are thinking of moving to another state. The context doesn’t suggest that state taxes are “consistent with,” or in agreement with these other factors. Choice B is incorrect because it wouldn’t make sense in context to say that state taxes are “representative of,” or typical of, other factors. Taxes aren’t an example of employment opportunities, housing availability, and climate, which are the other factors listed in the text. Choice D is incorrect because it wouldn’t make sense in context to say that state taxes are “irrelevant to,” or unconnected or unimportant to other factors. State taxes are irrelevant to peoples’ decisions, not to other factors. In other words, although the text suggests that state taxes may be irrelevant to people considering a move to another state, the other factors mentioned in the text, such as employment opportunities, are unable to have an opinion about state taxes. Furthermore, the text indicates that significant differences in state taxes have almost no effect on peoples’ choices to move, but they aren’t completely unimportant."},{"i":"53542eb5","c":"vocab","d":"E","s":"Shoppers can help keep money cycling within a community by making purchases at small local businesses instead of large retailers. Some cities are ______ programs to encourage this behavior, establishing reward points and other incentives for shopping at small businesses.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["instituting","occupying","underestimating","encountering"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of programs that encourage money to cycle within a community. In this context, \"instituting\" means initiating. The text indicates that making purchases at small local businesses can help keep money cycling within a community. The text goes on to state that some cities are establishing incentives to promote small business shopping. This context supports the idea that some cities are instituting programs to encourage this consumer behavior. Choice B is incorrect because saying that some cities are \"occupying,\" or forcibly holding possession or control of, programs that encourage shoppers to make purchases at small local businesses wouldn’t make sense in context. The text doesn’t discuss who controls these programs but instead indicates that some cities are establishing incentives that encourage shoppers to make purchases at small local businesses. Furthermore, it wouldn’t make sense to say that a city is occupying a program. Choice C is incorrect because nothing in the text suggests that cities are \"underestimating,\" or failing to understand the value of, programs that encourage consumers to shop at small local businesses. The text indicates that some cities are establishing incentives to encourage small business shopping, which suggests that these cities understand the value of such programs. Choice D is incorrect because saying that some cities are \"encountering,\" or coming into contact with, programs that encourage consumers to shop at small local businesses wouldn’t make sense in context. The text indicates that some cities are already establishing incentives to encourage shoppers to make purchases at small businesses. This context suggests that the cities are instituting the programs, not that they are encountering them."},{"i":"1374a9fa","c":"vocab","d":"M","s":"Austin McCoy has argued that historians have tended to ______ rank-and-file workers in analyses of changes in organized labor in the United States in the decades following the Second World War, presenting political, business, and labor leaders as the major actors and ordinary workers as nearly devoid of agency.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["epitomize","marginalize","extol","substantiate"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of how historians have treated rank-and-file (ordinary) workers in their analyses. In this context, \"marginalize\" means treat as unimportant or relatively powerless within a group or society. The text explains that according to Austin McCoy, historians have tended to treat \"political, business, and labor leaders\" as the \"major actors\" involved in making changes in organized labor in the period after the Second World War. By emphasizing the contributions of these leaders, historians have in effect minimized the contributions of ordinary workers, treating them as relatively unimportant and \"nearly devoid of agency,\" thereby marginalizing them. Choice A is incorrect. In this context, \"epitomize\" would mean either serve as an ideal example of something or make into an example of something, neither of which would make sense. In stating that historians have tended to characterize political, business, and labor leaders as the primary actors responsible for changes in the post-Second World War labor movement in a manner that minimizes the influence of ordinary workers, the text suggests that historians have tended to present ordinary workers as unimportant to or uninfluential within the movement, not that historians themselves serve as examples of ordinary workers, or that historians in their analyses have made ordinary workers into examples of the changes that occurred. Choice C is incorrect because in this context, \"extol\" would mean praise highly or glorify. The text states that historians have tended to present ordinary workers as being \"nearly devoid of agency,\" thereby minimizing their importance. It therefore wouldn’t make sense to say that in doing so, historians have tended to praise or glorify them. Choice D is incorrect because \"substantiate\" would mean verify with evidence, and nothing in the text suggests that historians have verified rank-and-file workers or their contributions in their analyses. If anything, the text suggests the opposite, implying that by minimizing workers’ agency in organized labor, historians have likely overlooked evidence demonstrating their influence."},{"i":"2d77660e","c":"purpose","d":"M","s":"In the late 1800s, Spanish-language newspapers flourished in cities across Texas. San Antonio alone produced eleven newspapers in Spanish between 1890 and 1900. But El Paso surpassed all other cities in the state. This city produced twenty-two newspapers in Spanish during that period. El Paso is located on the border with Mexico and has always had a large population of Spanish speakers. Thus, it is unsurprising that this city became such a rich site for Spanish-language journalism.\n\nWhich choice best states the main purpose of the text?","o":["To compare Spanish-language newspapers published in Texas today with ones published there during the late 1800s","To explain that Spanish-language newspapers thrived in Texas and especially in El Paso during the late 1800s","To argue that Spanish-language newspapers published in El Paso influenced the ones published in San Antonio during the late 1800s","To explain why Spanish-language newspapers published in Texas were so popular in Mexico during the late 1800s"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text begins by stating that there were many Spanish-language newspapers in cities across Texas in the late 1800s, citing San Antonio as a city that produced eleven such newspapers. The text then goes on to note that in El Paso, there were twenty-two newspapers published in Spanish in the late 1800s, more than any other Texas city. The text then concludes by explaining that the reason for this large number of Spanish-language newspapers was likely El Paso’s location near Mexico and its large population of Spanish speakers. Therefore, the main purpose of the text is to explain that Spanish-language newspapers thrived in Texas cities, especially in El Paso, in the late 1800s. Choice A is incorrect because the text doesn’t discuss Spanish-language newspapers published in Texas today, let alone compare them with newspapers that were published in the 1800s. Choice C is incorrect. Although the text characterizes El Paso as a particularly rich site for Spanish-language journalism in the late 1800s, the text doesn’t discuss whether newspapers published in El Paso influenced the newspapers published in other cities across Texas, including San Antonio. Choice D is incorrect because the text doesn’t mention whether Spanish-language newspapers published in Texas were also widely read in Mexico. The text only focuses on the popularity of Spanish-language newspapers within Texas, and especially in El Paso."},{"i":"ad4f7362","c":"purpose","d":"H","s":"The following text is from John Dryden’s 1697 translation of Virgil’s poem the Aeneid, written in the first century BCE. Queen Dido has just heard the Trojan hero Aeneas recount a sad tale. But anxious cares already seiz’d the queen: She fed within her veins a flame unseen; The hero’s valor, acts, and birth inspire Her soul with love, and fan the secret fire. His words, his looks, imprinted in her heart, Improve the passion, and increase the smart.\n\nWhich choice best states the main purpose of the text?","o":["To indicate that Dido is hiding her skepticism of Aeneas’s account","To emphasize that Dido has been deeply affected by Aeneas’s story","To imply that Dido engages both emotionally and intellectually with Aeneas","To suggest that Dido is worried that Aeneas might discover a secret she is keeping from him"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text, which is to foreground Queen Dido’s strong emotional response to Aeneas’s story. Throughout, the text emphasizes how deeply the queen is affected by both Aeneas’s tale and persona. At the outset, the speaker explicitly states that \"anxious cares...seiz’d the queen\" and then uses the metaphor of fire (\"within her veins a flame unseen\" and \"secret fire\") to evoke the warmth of Dido’s feelings for Aeneas. In addition, the line \"His words, his looks, imprinted in her heart\" suggests the deep impression that Aeneas’s story makes on Dido, eliciting passion for him (\"improv[ing] the passion\") and empathy for his suffering (\"increas[ing] the smart\"). Choice A is incorrect because there’s no indication in the text that Dido is skeptical of Aeneas’s account, much less that she’s trying to conceal that skepticism. On the contrary, the text shows her being moved by his words and developing feelings for him. Choice C is incorrect. While the text mentions that Dido is impressed by Aeneas’s \"valor, acts, and birth,\" which might suggest (but doesn’t necessarily entail) intellectual engagement, the text doesn’t represent Dido’s engagement with Aeneas in a manner that suggests a balance between emotion and intellect. Rather, the text primarily emphasizes her emotional response—specifically her attraction to Aeneas and her emotional investment in his story, indicating that his \"valor, acts, and birth inspire / Her soul with love, and fan the secret fire\" and that his words and looks elicit passion and empathy. Choice D is incorrect because the text doesn’t suggest that Dido is worried about Aeneas discovering a secret she is concealing from him. Though the text begins by mentioning Dido’s \"anxious cares,\" this refers to her growing passion for Aeneas and pity for his suffering, not to worry about a secret she is concealing. The text’s reference to a \"flame unseen\" and \"secret fire\" points to Dido’s growing feelings for Aeneas that develop as he recounts his tale, not to a secret that existed before their encounter; moreover, the text provides no indication that Dido is worried Aeneas might discover these feelings."},{"i":"662892ad","c":"func","d":"E","s":"Wakako Yamauchi is best known for And the Soul Shall Dance, her 1977 play about a Japanese American family in Southern California. The play is based on a short story Yamauchi had published three years earlier. Adapting the story wasn’t easy. Theater relies on dialogue between characters, but the original story features little dialogue and instead describes its characters’ silent thoughts. <u>To transform the story into a play, Yamauchi created situations where characters reveal their thoughts by speaking them aloud during conversations with each other.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It offers information about how Yamauchi adapted her short story into a play.","It argues that Yamauchi’s play influenced later playwrights.","It explains why Yamauchi’s short story is better known than the play adaptation is.","It describes how Yamauchi chose the actors who performed in the play."],"a":0,"r":"Choice A is the best answer because it best describes how the underlined sentence functions in the text as a whole. According to the text, it was hard for Yamauchi to adapt her short story into the play And the Soul Shall Dance because the story had included little dialogue, instead describing the characters’ silent thoughts. The underlined sentence offers information about how Yamauchi ultimately succeeded in adapting the story into a play: it explains that Yamauchi created situations where the characters of the play could reveal their internal thoughts while speaking with each other. Choice B is incorrect because neither the underlined sentence nor the text as a whole makes any mention of playwrights other than Yamauchi or how the play might have influenced them. Choice C is incorrect because the text states that Yamauchi is best known for her play And the Soul Shall Dance, which conveys that the play is better known than the short story it’s based on is. Choice D is incorrect because neither the underlined sentence nor the text as a whole mentions the actors who performed in the play or Yamauchi’s approach to choosing them."},{"i":"c966ad55","c":"func","d":"E","s":"The following text is from Srimati Svarna Kumari Devi’s 1894 novel The Fatal Garland (translated by A. Christina Albers in 1910). Shakti is walking near a riverbank that she visited frequently during her childhood. She crossed the woods she knew so well. <u>The trees seemed to extend their branches like welcoming arms.<\/u> They greeted her as an old friend. Soon she reached the river-side.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It suggests that Shakti feels uncomfortable near the river.","It indicates that Shakti has lost her sense of direction in the woods.","It emphasizes Shakti’s sense of belonging in the landscape.","It conveys Shakti’s appreciation for her long-term friendships."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence of the text states that Shakti knows the woods she is walking in well. The next sentence, which is underlined, emphasizes Shakti’s familiarity with, and sense of security within, the woods by describing how the tree branches are friendly and “welcoming,” as they are depicted as extending open arms to her. The remainder of the text also shows that Shakti is comfortable and content in the woods by describing her as “an old friend” of the trees. Thus, the function of the underlined portion is to emphasize Shakti’s sense of belonging in the wooded landscape that she visits. Choice A is incorrect because the text and underlined portion suggest that Shakti is comfortable, not uncomfortable, in her surroundings: the trees around her are described as welcoming and reassuring. Moreover, the underlined portion discusses Shakti’s feelings in the forest, not the river, since she hasn’t reached the river yet. Choice B is incorrect because the text and underlined portion emphasize Shakti’s familiarity with the woods. The trees are inviting, and she feels like “an old friend” to the woods, so she isn’t lost or confused there. Choice D is incorrect because the third sentence uses the phrase “as an old friend” figuratively in reference to Shakti’s sense of familiarity with the landscape, not in reference to her long-standing friendships with other people, and the text and underlined portion never discuss her feelings about such friendships."},{"i":"c4737d6a","c":"cross","d":"H","s":"Text 1 Africa’s Sahara region—once a lush ecosystem—began to dry out about 8,000 years ago. A change in Earth’s orbit that affected climate has been posited as a cause of desertification, but archaeologist David Wright also attributes the shift to Neolithic peoples. He cites their adoption of pastoralism as a factor in the region drying out: the pastoralists’ livestock depleted vegetation, prompting the events that created the Sahara Desert.\n\nText 2 Research by Chris Brierley et al. challenges the idea that Neolithic peoples contributed to the Sahara’s desertification. Using a climate-vegetation model, the team concluded that the end of the region’s humid period occurred 500 years earlier than previously assumed. The timing suggests that Neolithic peoples didn’t exacerbate aridity in the region but, in fact, may have helped delay environmental changes with practices (e.g., selective grazing) that preserved vegetation.\n\nBased on the texts, how would Chris Brierley (Text 2) most likely respond to the discussion in\n\nText 1?","o":["By pointing out that given the revised timeline for the end of the Sahara’s humid period, the Neolithic peoples’ mode of subsistence likely didn’t cause the region’s desertification","By claiming that pastoralism was only one of many behaviors the Neolithic peoples took part in that may have contributed to the Sahara’s changing climate","By insisting that pastoralism can have both beneficial and deleterious effects on a region’s vegetation and climate","By asserting that more research needs to be conducted into factors that likely contributed to the desertification of the Sahara region"],"a":0,"r":"Choice A is the best answer. Brierley et al.’s research directly challenges Wright’s claim that pastoralism turned the Sahara into a desert, suggesting that, in a Sahara that turned arid 500 years earlier than previously thought, pastoral practices may have actually “preserved vegetation” rather than depleting it. Choice B is incorrect. Brierley et al.’s research actually disputes the idea that any Neolithic peoples’ behaviors, including pastoralism, could have contributed to the Sahara’s changing climate. In fact, their research implies that the Neolithic peoples’ practices did not “exacerbate aridity” (i.e., make things worse), but may have slowed environmental changes. Choice C is incorrect. Brierley et al.’s research does not acknowledge that pastoralism can have deleterious (i.e., negative) effects on a region’s vegetation and climate. It only describes one possible beneficial effect: preserving vegetation through practices like selective grazing. Choice D is incorrect. Brierley et al.’s research does not call for more research into factors that likely contributed to the desertification of the Sahara region."},{"i":"36e2868f","c":"main","d":"H","s":"The following text is from Thomas Mann’s 1924 novel The Magic Mountain, translated by John E. Woods in 1995. The story of Hans Castorp that we intend to tell here—not for his sake (for the reader will come to know him as a perfectly ordinary, if engaging young man), but for the sake of the story itself, which seems to us to be very much worth telling (although in Hans Castorp’s favor it should be noted that it is his story, and that not every story happens to everybody)—is a story that took place long ago, and is, so to speak, covered with the patina of history and must necessarily be told with verbs whose tense is that of the deepest past. ©1995 by Alfred A. Knopf, Inc. What does the text most strongly suggest about the story of Hans Castorp?","o":["Though it is true that stories of even the most uninteresting people are themselves interesting because all people are unique, the reason this story is interesting is nonetheless difficult to understand because of the passage of time.","Even though it is a story of a person of no particular importance, its age and the manner in which it therefore must be told are both indicators that the story itself is important.","Like all stories about the lives of inconsequential people, this story must necessarily be related in a particular way if the reason the story is consequential is to be made evident to the audience.","It is a remarkable story that happened to an unremarkable person, though one could plausibly argue that because the story is valuable, some of its value accrues to the person at its center."],"a":3,"r":"Choice D is the best answer because it presents a statement about Hans Castorp’s story that is suggested by the text. The narrator of the text indicates that the story about Hans Castorp will be told not because there is something particularly notable about him, since he is pleasant but \"perfectly ordinary,\" but because the story itself is remarkable (\"very much worth telling\"). The narrator then notes that there is a benefit in being at the heart of the story—that it is \"in Hans Castorp’s favor\" that the story is his, and maybe uniquely so (\"not every story happens to everybody\"). Thus, the text suggests both that the story that will be told is a remarkable one that happened to an unremarkable person and that it is reasonable to argue that the person at the center of a valuable story takes on some of the story’s value. Choice A is incorrect. Although the narrator of the text makes the point that \"not every story happens to everybody,\" the narrator doesn’t state that stories are interesting simply because the people they are about are unique. Rather, the narrator suggests that one particular story is \"very much worth telling\" on its own and that Hans Castorp benefits from the fact that the story is remarkable and may be unique to him. Further, the narrator never suggests that the story will be hard to understand even though it is old. Choice B is incorrect. Although the narrator of the text suggests that Hans Castorp is of no particular importance, since he is a \"perfectly ordinary\" person, the narrator never reveals what makes the story of Castorp important, just that \"the story itself\" is \"very much worth telling.\" The narrator states that the story \"took place long ago,\" is \"covered with the patina of history,\" and can be told only \"with verbs whose tense is that of the deepest past,\" but the story’s age and the way it must be told aren’t presented as reasons the story is important; the narrator is simply providing details about how the story will be told. Choice C is incorrect because the narrator of the text doesn’t suggest that all stories about people who are \"perfectly ordinary\" (like Hans Castorp) must be told in particular ways to make it clear why those stories are consequential. Further, the narrator suggests that Hans Castorp’s story must be told \"with verbs whose tense is that of the deepest past\" because it took place so long ago, not because telling it that way will convey the story’s importance."},{"i":"ee41d7e0","c":"main","d":"E","s":"Arthropods—brine shrimp, hawk moths, and many other invertebrate animals—have a nervous system made up of a brain, nerve cord, and other nerves. Researchers have gained insights about this system in ancient arthropods from traces found in various fossils. For example, in a study of two fossils of the extinct arthropod species Mollisonia symmetrica, Javier Ortega-Hernández, James Weaver, and team observed clear signs of a nerve cord. They also saw possible indications of a synganglion, a brain-like mass of nerves. Researchers hope to identify more features of the nervous systems of prehistoric arthropods as additional fossils are found.\n\nWhich choice best states the main idea of the text?","o":["There are several similarities between the brains of hawk moths and the brains of brine shrimp.","Fossil evidence can contribute to the understanding of the nervous system in ancient arthropods.","Newly discovered fossils suggest that ancient hawk moths and ancient brine shrimp had spines.","Researchers need to focus on finding more fossils of ancient arthropods."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The text states that researchers have used fossils to learn about the nervous systems of ancient arthropods. It then provides a specific example of researchers studying fossils of Mollisonia symmetrica and finding evidence of a nerve cord and possibly a synganglion (a brain-like mass of nerves). The text concludes by noting that researchers hope to discover more features of prehistoric arthropods’ nervous systems \"as additional fossils are found.\" Thus, the main idea of the text is that fossil evidence can contribute to the understanding of the nervous system in ancient arthropods. Choice A is incorrect because the text doesn’t compare the brains of hawk moths and brine shrimp. These animals are merely mentioned as examples of arthropods in the opening sentence, and the text doesn’t go on to discuss any similarities between their brains. Choice C is incorrect because the text discusses nervous systems, not spines, in ancient arthropods, and it doesn’t specifically mention findings about ancient hawk moths or brine shrimp. Choice D is incorrect. While the text concludes by noting that researchers aim to discover additional characteristics of prehistoric arthropods’ nervous systems as more fossils are uncovered, this statement doesn’t suggest that researchers need to focus on finding more fossils. Rather, it simply indicates that researchers expect to learn more about this topic as additional fossils are discovered. Moreover, the statement is just a detail that supports the main idea; it’s not the main idea itself."},{"i":"3f236877","c":"infer","d":"H","s":"Ratified by more than 90 countries, the Nagoya Protocol is an international agreement ensuring that Indigenous communities are compensated when their agricultural resources and knowledge of wild plants and animals are utilized by agricultural corporations. However, the protocol has shortcomings. For example, it allows corporations to insist that their agreements with communities to conduct research on the commercial uses of the communities’ resources and knowledge remain confidential. Therefore, some Indigenous advocates express concern that the protocol may have the unintended effect of ______ Which choice most logically completes the text?","o":["diminishing the monetary reward that corporations might derive from their agreements with Indigenous communities.","limiting the research that corporations conduct on the resources of the Indigenous communities with which they have signed agreements.","preventing independent observers from determining whether the agreements guarantee equitable compensation for Indigenous communities.","discouraging Indigenous communities from learning new methods for harvesting plants and animals from their corporate partners."],"a":2,"r":"Choice C is the best answer because it most logically completes the argument about an unintended effect of the Nagoya Protocol. The text explains that the Nagoya Protocol is an agreement ensuring that Indigenous communities are compensated when their agricultural resources and knowledge are used by corporations. The text then states that the protocol allows corporations to keep their agreements with Indigenous communities confidential, about which some Indigenous advocates express concern. Choice C, when inserted into the blank, gives a good justification for the advocates’ concern: such secrecy could mean that the public is unable to determine whether participating Indigenous communities were properly compensated under these agreements. Choice A is incorrect. The text suggests that because corporations can keep their agreements with Indigenous communities confidential, Indigenous communities, not corporations, might not be compensated fairly. Choice B is incorrect because the text doesn’t suggest that the ability of corporations to keep their agreements with Indigenous communities confidential would place limits on how much research corporations can undertake. Choice D is incorrect because the text doesn’t indicate that Indigenous communities aim to learn new harvesting methods from their corporate partners. Rather, the text suggests that corporations use the knowledge of Indigenous communities for their research."},{"i":"2a075bd1","c":"infer","d":"H","s":"Indigenous cultures possess unique knowledge of the medicinal uses of plants. According to a 2021 study, 73 percent of the medicinal uses of plants native to North America are reflected in the vocabulary of a single Indigenous language. However, as more and more Indigenous people exclusively speak a globally dominant language, such as English, their ancestral languages fade from daily use. These facts lend added importance to tribal nations’ efforts to preserve their languages. By ensuring the continued use of Cherokee, Ojibwe, and the hundreds of other Indigenous languages in what is now the United States, tribal nations are also ______ Which choice most logically completes the text?","o":["increasing the number of medicinal plants represented in the vocabularies of Indigenous languages.","transmitting terms for medicinal plants from Indigenous languages to globally dominant languages.","preserving knowledge about the medicinal value of plants native to the tribal nations’ lands.","ensuring that citizens of tribal nations have physical access to medicinal plants."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the relationship between Indigenous languages and knowledge of the medicinal uses of plants. The text states that Indigenous cultures possess special knowledge of the medicinal uses of plants, which is reflected in their vocabulary. The text then discusses how tribal nations are working to preserve their languages, whose daily use is declining as globally dominant languages become increasingly dominant in Indigenous communities. Given that the languages of tribal nations in what is now the United States function as repositories of knowledge about plants’ medicinal uses, it logically follows that continued use of those languages will assist with passing on knowledge about the medicinal value of plants native to the tribal nations’ lands. Choice A is incorrect because the text states that preserving Indigenous languages will increase the knowledge, not the number, of medicinal plants. Choice B is incorrect because the text is concerned with how vocabulary about the medicinal value of plants can be preserved through the continued daily use of Indigenous languages, not with how such vocabulary can be incorporated into globally dominant, non-Indigenous languages. Moreover, the text explains that the exclusive use of globally dominant languages in Indigenous communities comes at an expense to the continued daily use of those communities’ languages. Given this relationship, it is unlikely globally dominant languages would borrow Indigenous vocabulary pertaining to plants’ medicinal uses. Choice D is incorrect because the text doesn’t discuss physical access to medicinal plants, instead focusing on Indigenous knowledge and language surrounding the medicinal uses of plants."},{"i":"6df33868","c":"claim","d":"E","s":"“We Are Marching” is a 1921 poem by Carrie Law Morgan Figgs. In the poem, the speaker predicts future success: ______ Which quotation from “We Are Marching” most effectively illustrates the claim?","o":["“Can’t you hear the sound of feet?”","“You who are out just get in line.”","“We have answered duty’s call.”","“We shall never know defeat.”"],"a":3,"r":"Choice D is the best answer because it most effectively illustrates the claim that the speaker in the poem \"We Are Marching\" predicts future success. To say that someone will \"never know\" an experience—like defeat, or being unsuccessful—is to indicate that they will never personally have that experience. Thus, when the speaker says that the marching group \"shall never know defeat,\" the speaker is predicting that the group will experience only success in the future. Choice A is incorrect because the quotation presents a question about an activity already taking place (marching), not a statement about future success. The speaker is asking if the sound of marching feet is being heard. Choice B is incorrect because the quotation directs an immediate action instead of making a prediction about the future. The speaker is telling people to \"get in line,\" or to join the march that’s already happening. Choice C is incorrect because the quotation describes a past action instead of making a prediction about the future. The speaker is stating that those in the march have \"answered duty’s call\"—that is, that they have acted out of a sense of duty."},{"i":"dc47c2ac","c":"claim","d":"M","s":"Although most songbirds build open, cupped nests, some species build domed nests with roofs that provide much more protection. <u>Many ecologists have assumed that domed nests would provide protection from weather conditions and thus would allow species that build them to have larger geographic ranges than species that build open nests do.<\/u> To evaluate this assumption, a research team led by evolutionary biologist Iliana Medina analyzed data for over 3,000 species of songbirds.\n\nWhich finding from Medina and her colleagues’ study, if true, would most directly challenge the assumption in the underlined sentence?","o":["Species that build open nests tend to have higher extinction rates than species that build domed nests.","Species that build open nests tend to be smaller in size than species that build domed nests.","Species that build open nests tend to use fewer materials to build their nests than species that build domed nests do.","Species that build open nests tend to have larger ranges than species that build domed nests."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would challenge the assumption that many ecologists have made about the connection between the building of domed nests and geographic range in songbirds. The text says that many ecologists have assumed that since domed nests provide protection from weather conditions, songbird species that build such nests should be able to have larger geographic ranges than songbird species that build open nests do. If Medina and her colleagues found that species that build open nests tend to have larger geographic ranges than species that build domed nests do, their finding would show the opposite of what the ecologists have assumed. It would therefore challenge the ecologists’ assumption. Choice A is incorrect because nothing in the text suggests that there’s a relationship between songbird species’ extinction rates and their geographic ranges. The finding that species that build open nests tend to have higher extinction rates than species that build domed nests do would therefore have no clear bearing on the ecologists’ assumption that domed nests allow species that build them to have larger geographic ranges than those of species that build open nests. Choice B is incorrect because nothing in the text suggests that there’s a relationship between songbird species’ sizes and their geographic ranges. The finding that species that build open nests tend to be smaller in size than species that build domed nests are would therefore have no clear bearing on the ecologists’ assumption that domed nests allow species that build them to have larger geographic ranges than those of species that build open nests. Choice C is incorrect because although the text indicates that many ecologists have assumed that there’s a connection between how songbird species build their nests and the species’ geographic ranges, the text says that this assumption is based on the shape of the nests—that is, whether the nests are domed or open—not the number of materials used. The finding that species that build open nests tend to use fewer materials to build their nests than species that build domed nests do would therefore have no clear bearing on the ecologists’ assumption that domed nests allow species that build them to have larger geographic ranges than those of species that build open nests."},{"i":"6a6bbac3","c":"graph","d":"H","s":"","o":["at each depth below the surface in the cave, the difference in the numbers of tools of each type suggests that shells were easier to collect from the beach than to harvest from the seafloor.","the highest number of tools were at a depth of 3–4 meters below the surface, which suggests that the Neanderthal population at the site was highest during the related period of time.","at each depth below the surface in the cave, the difference in the numbers of tools of each type suggests that Neanderthals preferred to use clamshells from the beach because of their durability.","the higher number of tools at depths of 5–6 meters below the surface in the cave than at depths of 4–5 meters below the surface suggests that the size of clam populations changed over time."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to support the researchers’ conclusion about the harvesting of clamshells by Neanderthals for use as tools. The text explains that Neanderthals used clamshells to make tools and that the sturdiest, and therefore the most desirable, shells for this purpose are found on the seafloor, not on the beach. However, the researchers also concluded that the clamshell tools made from shells from the seafloor are rarer than those made from shells from the beach. Meanwhile the table shows that at each depth, the number of tools made from shells from the beach exceeds the number made from the more desirable shells from the seafloor. The fact that the more desirable shells are less common suggests that it was significantly more difficult to harvest shells from the seafloor than from the beach. Choice B is incorrect because knowing which depth represents the period of time with the highest Neanderthal population does not help answer the question of why the Neanderthals consistently made more tools from the less desirable shells from the beach than they made from the more desirable shells from the seafloor. Choice C is incorrect because it claims that the beach shells are more durable than the seafloor shells, which contradicts the text’s description of shells from the seafloor as smoother and sturdier than shells from the beach. Choice D is incorrect because knowing which depth has the most artifacts or whether the clam population fluctuated does not help explain why tools made from the less desirable shells from the beach outnumber tools made from the more desirable shells from the seafloor."},{"i":"d102706f","c":"graph","d":"H","s":"","o":["The study by Meers used body-mass scaling and produced the lowest estimated maximum bite force, while the study by Cost et al. used muscular and skeletal modeling and produced the highest estimated maximum.","In their study, Gignac and Erickson used tooth-bone interaction analysis to produce an estimated bite force range with a minimum of 8,000 newtons and a maximum of 34,000 newtons.","The bite force estimates produced by Bates and Falkingham and by Cost et al. were similar to each other, while the estimates produced by Meers and by Gignac and Erickson each differed substantially from any other estimate.","The estimated maximum bite force produced by Cost et al. exceeded the estimated maximum produced by Bates and Falkingham, even though both groups of researchers used the same method to generate their estimates."],"a":2,"r":"Choice C is the best answer because it accurately describes data from the table that support Barrett and Rayfield’s suggestion about bite force estimates. According to the text, Barrett and Rayfield believe that estimates of dinosaur bite force may be strongly influenced by the methods used to produce them—that is, that different methods may produce significantly different results. The table shows that the studies by Bates and Falkingham and by Cost et al. used the same estimation method (muscular and skeletal modeling) and produced similar bite force estimates (approximately 35,000–57,000 newtons and 35,000–63,000 newtons, respectively). The study by Meers, however, used body-mass scaling and produced a much higher bite force estimate (183,000–235,000 newtons), while the study by Gignac and Erickson used tooth-bone interaction analysis and produced a much lower bite force estimate (8,000–34,000 newtons). The fact that one method produced similar estimates in two different studies and that two different methods used in other studies produced substantially different estimates supports the idea that dinosaur bite force estimates are significantly influenced by the methodology used to produce them. Choice A is incorrect because it inaccurately describes data from the table. The table does show that the studies by Meers and by Cost et al. used different estimation methods and produced very different ranges of estimated dinosaur bite force, which would support Barrett and Rayfield’s suggestion that different methodologies may produce significantly different estimates. However, the table doesn’t show that the study by Meers produced the lowest estimated maximum bite force while the study by Cost et al. produced the highest. In fact, the study by Meers estimated a maximum bite force of approximately 235,000 newtons, which is the highest of all the estimated maximums. Choice B is incorrect. Although the data from Gignac and Ericson’s study are accurately described, a single set of findings from one study using only one methodology can’t show that different methodologies may produce significantly different dinosaur bite force estimates, as Barrett and Rayfield suggest. Choice D is incorrect. Although the table shows that the maximum bite force estimated by Cost et al. was higher than that estimated by Bates and Falkingham, the difference is relatively small; in fact, both teams estimated a minimum bite force of approximately 35,000 newtons and a maximum bite force close to approximately 60,000 newtons. Because these findings demonstrate that a single methodology (muscular and skeletal modeling) produced similar overall results in two studies, the findings don’t support Barrett and Rayfield’s suggestion that different methodologies may produce significantly different dinosaur bite force estimates."},{"i":"975eda7c","c":"fss","d":"E","s":"For thousands of years, people in the Americas ______ the bottle gourd, a large bitter fruit with a thick rind, to make bottles, other types of containers, and even musical instruments. Oddly, there is no evidence that any type of bottle gourd is native to the Western Hemisphere; either the fruit or its seeds must have somehow been carried from Asia or Africa.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to use","have used","having used","using"],"a":1,"r":"Choice B is the best answer. The convention being tested is finite and nonfinite verb forms within a sentence. A main clause requires a finite verb to perform the action of the subject (in this case, “people in the Americas”), and this choice supplies the finite past perfect tense verb “have used” to indicate what people in the Americas used the gourd for. Choice A is incorrect because the nonfinite to-infinitive “to use” doesn’t supply the main clause with a finite verb. Choice C is incorrect because the nonfinite participle “having used” doesn’t supply the main clause with a finite verb. Choice D is incorrect because the nonfinite participle “using” doesn’t supply the main clause with a finite verb."},{"i":"b0fb36ad","c":"fss","d":"H","s":"Unique among animal species, humans use our vocal apparatuses primarily for two separate communicative purposes: to talk and to sing. The question of what cross-cultural traits distinguish these distinct modes, and secondarily what pressures led humans to develop them in the first place, ______ neuropsychologist Daniela Sammler’s 2024 study “Signatures of Speech and Song: ‘Universal’ Links despite Cultural Diversity.”\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["animates","have animated","animate","animating"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb \"animates\" agrees in number with the singular subject \"question.\" Choice B is incorrect because the plural verb \"have animated\" doesn’t agree in number with the singular subject \"question.\" Choice C is incorrect because the plural verb \"animate\" doesn’t agree in number with the singular subject \"question.\" Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"animating\" doesn’t supply the clause with a finite verb."},{"i":"42cc9236","c":"fss","d":"E","s":"If you try on one of artist Nick Cave’s signature Soundsuits, you can expect to swish, rustle, or clang every time you move. Cave makes his suits out of found objects, everything from ceramic birds to broken record players. He carefully considers the sound an object makes before using ______ in a suit.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["this","that","these","it"],"a":3,"r":"Choice D is the best answer. The convention being tested here is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"object.\" Choice A is incorrect. The singular pronoun \"this\" is used to refer to a specific thing, but here there is no specific object being referred to. Instead, the sentence is referring back to a hypothetical object that Cave might use in a Soundsuit. Choice B is incorrect. The singular pronoun \"that\" is used to refer to a specific thing, but here there is no specific object being referred to. Instead, the sentence is referring back to a hypothetical object that Cave might use in a Soundsuit. Choice C is incorrect because the plural pronoun \"these\" doesn’t agree in number with the singular antecedent \"object.\""},{"i":"b6560e5a","c":"bound","d":"M","s":"Materials scientist Marie-Agathe Charpagne and her colleagues believed they could improve on the multicomponent alloy NiCoCr, an equal- proportions mixture of nickel (Ni), cobalt (Co), and chromium (Cr), by replacing chromium with ruthenium ______ the alloy that resulted, NiCoRu, turned out to be an unsuitable replacement for NiCoCr.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["(Ru)","(Ru) but","(Ru),","(Ru), but"],"a":3,"r":"Choice D is the best answer. The convention being tested is the coordination of main clauses. This choice correctly uses a comma and the coordinating conjunction “but” to join the first main clause (“Materials…Ru”) and the second main clause (“the alloy…NiCoCr”). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."},{"i":"2c4cd76d","c":"bound","d":"H","s":"Researchers studying magnetosensation have determined why some soil-dwelling roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field when searching for ______ in the Northern Hemisphere, the magnetic field points down, into the ground, but in the Southern Hemisphere, it points up, toward the surface and away from worms’ food sources.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["food:","food,","food while","food"],"a":0,"r":"Choice A is the best answer. The convention being tested is colon use within a sentence. A colon used in this way introduces information that illustrates or explains information that has come before it. In this case, the colon introduces the following explanation of why some roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to join two long independent clauses (“Researchers…food” and “in…sources”) such as these. Choice C is incorrect because it results in a run-on sentence. The two clauses (“Researchers…food” and “in…sources”) are fused without punctuation. Furthermore, the conjunction “while” fails to indicate that what follows is an explanation of why some roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field. Choice D is incorrect because it results in a run-on sentence. The two clauses (“Researchers…food” and “in…sources”) are fused without punctuation and/or a conjunction."},{"i":"4b99b481","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Scientists have developed a “freeze-thaw” battery that can retain 92% of its charge after twelve weeks. The battery contains molten salt (a type of salt that liquifies when heated and solidifies at room temperature). When the salt is in a liquid state, energy flows through the battery. When the salt is in a solid state, energy stops flowing and is stored in the battery. The stored (frozen) energy can be used by reheating (thawing) the battery. The student wants to specify how the salt enables energy storage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Scientists have developed a freeze-thaw battery that contains molten salt, which liquifies when heated and solidifies at room temperature.","The stored energy in a freeze-thaw battery, which contains molten salt, can be used by reheating the battery.","When the molten salt in a freeze-thaw battery solidifies at room temperature, energy stops flowing and can be stored in the battery.","Molten salt allows a freeze-thaw battery to retain 92% of its charge after twelve weeks."],"a":2,"r":"Choice C is the best answer. The sentence specifies how the salt in a freeze-thaw battery enables energy storage, explaining that energy stops flowing and can be stored when the salt solidifies at room temperature. Choice A is incorrect. The sentence explains some properties of molten salt; it doesn’t specify how that salt enables energy storage. Choice B is incorrect. The sentence indicates how the energy in a freeze-thaw battery can be released; it doesn’t specify how the salt in the battery enables energy storage. Choice D is incorrect. The sentence specifies how much charge the freeze-thaw battery retains when storing energy; it doesn’t specify how the salt in the battery enables energy storage."},{"i":"5d3177aa","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In the early 1960s, the US had a strict national-origins quota system for immigrants. The number of new immigrants allowed from a country each year was based on how many people from that country lived in the US in 1890. This system favored immigrants from northern Europe. Almost 70% of slots were reserved for immigrants from Great Britain, Ireland, and Germany. The 1965 Hart-Celler Act abolished the national-origins quota system. The student wants to present the significance of the Hart-Celler Act to an audience unfamiliar with the history of US immigration.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Almost 70% of slots were reserved for immigrants from Great Britain, Ireland, and Germany at the time the Hart-Celler Act was proposed.","Prior to the Hart-Celler Act, new immigration quotas were based on how many people from each country lived in the US in 1890.","The quota system in place in the early 1960s was abolished by the 1965 Hart-Celler Act.","The 1965 Hart-Celler Act abolished the national-origins quota system, which favored immigrants from northern Europe."],"a":3,"r":"Choice D is the best answer. The sentence presents the significance of the Hart-Celler Act to an audience unfamiliar with the history of US immigration, noting that the 1965 act abolished the national-origins quota system and explaining why that mattered, historically: because the old quota system had favored immigrants from northern Europe. Choice A is incorrect. The sentence describes an aspect of immigration policy at the time the Hart-Celler Act was proposed; it doesn’t present the significance of the Hart-Celler Act to an audience unfamiliar with the history of US immigration. Choice B is incorrect. The sentence describes an aspect of immigration policy before the Hart-Celler Act; it doesn’t describe or present the significance of the act to an audience unfamiliar with the history of US immigration. Choice C is incorrect. While the sentence indicates that the Hart-Celler Act abolished the old quota system, it doesn’t explain the act or the quota system to an audience unfamiliar with the history of US immigration."},{"i":"0d088ae0","c":"trans","d":"M","s":"Observing that a fire in a closed container soon went out, leading eighteenth-century scientists did not conclude that fresh air (specifically, oxygen) is necessary for combustion; instead, many theorized that the container’s air had become saturated with a substance called phlogiston. ______ when Joseph Priestley first isolated oxygen gas in 1774, he termed it “dephlogisticated air.”\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","For this reason,","Alternatively,","Nevertheless,"],"a":1,"r":"Choice B is the best answer. \"For this reason\" logically signals that the reason Joseph Priestley termed oxygen \"dephlogisticated air\" was that he accepted the theory mentioned in the previous sentence—that the presence of phlogiston, rather than the absence of oxygen, causes fire in a closed container to go out. Choice A is incorrect because \"in other words\" illogically signals that the information about Priestley terming oxygen \"dephlogisticated air\" is a restatement of the previous theory concerning phlogiston. Instead, Priestley chose the term as a result of this theory. Choice C is incorrect because \"alternatively\" illogically signals that Priestley termed oxygen \"dephlogisticated air\" as an alternative to the previous theory concerning phlogiston. Instead, Priestley chose the term as a result of this theory. Choice D is incorrect because \"nevertheless\" illogically signals that Priestley termed oxygen \"dephlogisticated air\" despite the previous theory concerning phlogiston. Instead, Priestley chose the term as a result of this theory."},{"i":"b8eec031","c":"trans","d":"M","s":"Researchers Helena Mihaljević-Brandt, Lucía Santamaría, and Marco Tullney report that while mathematicians may have traditionally worked alone, evidence points to a shift in the opposite direction. ______ mathematicians are choosing to collaborate with their peers—a trend illustrated by a rise in the number of mathematics publications credited to multiple authors.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","For this reason,","Furthermore,","Increasingly,"],"a":3,"r":"Choice D is the best answer. “Increasingly” logically signals that the claim in this sentence—that mathematicians are collaborating with their peers—marks a change relative to what was traditionally done. As the previous sentence explains, while mathematicians may have traditionally worked alone, evidence points to a shift in the opposite direction. The claim describes the shift: a rise in collaboration. Choice A is incorrect because “similarly” illogically signals that the claim in this sentence is similar to, but separate from, the previous claim about the shift away from mathematicians working alone. Instead, the claim about the rise in collaboration elaborates on the previous claim, describing the shift. Choice B is incorrect because “for this reason” illogically signals that the claim in this sentence is caused by the previous claim about the shift away from mathematicians working alone. Instead, the claim about the rise in collaboration elaborates on the previous claim, describing the shift. Choice C is incorrect because “furthermore” illogically signals that the claim in this sentence is in addition to the previous claim about the shift away from mathematicians working alone. Instead, the claim about the rise in collaboration elaborates on the previous claim, describing the shift."},{"i":"1e31470f","c":"trans","d":"H","s":"To perform a quad axel, a figure skater must leap into the air and complete four and a half rotations before landing, an extreme feat. ______ in 2022, when 17-year-old Ilia Malinin landed the first quad axel—considered the most difficult quad jump—in a high-level competition, the audience was left awestruck.\n\nWhich choice completes the text with the most logical transition?","o":["Moreover,","Fittingly,","Next,","However,"],"a":1,"r":"Choice B is the best answer. \"Fittingly\" logically signals that the information in this sentence—that the audience was amazed when Malinin landed the first quad axel—describes a suitable or appropriate reaction to the completion of this extremely difficult jump. Choice A is incorrect. \"Moreover\" illogically signals that the information in this sentence merely adds to the previous information about the difficulty of completing a quad axel. Instead, the audience’s amazement is a suitable or appropriate reaction to this accomplishment. Choice C is incorrect. \"Next\" illogically signals that the information in this sentence is simply the next step in a process. Instead, the audience’s amazement is a suitable or appropriate reaction to the accomplishment. Choice D is incorrect. \"However\" illogically signals that the information in this sentence is in contrast or an exception to the difficulty of completing a quad axel. Instead, the audience’s amazement is a suitable or appropriate reaction to this accomplishment."}],"img":{"6a6bbac3":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFVBAMAAAD/NyGnAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABQUklEQVR42u1dd3xT1ft+zs3obk46mEJvB7LhtixFoCkUFFkpU1AkTMEBYSigIAVkONACggoIAVSmUDYUhLA3DRsE2rQgu81Jy2ybnN8fKV2AipWmX395Ph9ocnPmc97z3vd9z7nnAi644IILLrjgwr8I+mzJ1f9j3RP+SSa
