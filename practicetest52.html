<script>
const D={"t":"Practicetest52","q":[{"i":"e1d5d5df","c":"vocab","d":"E","s":"According to botanists, a viburnum plant experiencing insect damage may develop erineum—a discolored, felty growth—on its leaf blades. A ______ viburnum plant, on the other hand, will have leaves with smooth surfaces and uniformly green coloration.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["struggling","beneficial","simple","healthy"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of damage to viburnum plants. In this context, “healthy” would mean not distressed or diseased. The text states that insect damage may cause viburnum plants to be discolored and have abnormal growths. In the next sentence, the phrase “on the other hand” indicates a contrast with the description of plants suffering from damage. Thus, the context contrasts the appearance of healthy, undamaged plants with the appearance of damaged plants. Choice A is incorrect because in this context, “struggling” would mean working against difficulties. The text first describes viburnum plants experiencing damage by insects, and the phrase “on the other hand” then establishes a contrast with that description. It wouldn’t make sense to contrast struggling viburnum plants with those being damaged by insects, because in both cases the plants would be experiencing difficulties. Choice B is incorrect because in this context, “beneficial” would mean producing good or helpful effects. The text doesn’t discuss how viburnum plants affect other things or suggest that the plants are helpful in some way; rather, it focuses on how viburnum plants are affected by certain conditions. Choice C is incorrect because in this context “simple” would mean plain or uncomplicated. The text doesn’t discuss whether certain viburnum plants are complicated or uncomplicated; rather, it focuses on how viburnum plants are affected by certain conditions."},{"i":"a60b0004","c":"vocab","d":"H","s":"Scholarly discussions of gender in Shakespeare’s comedies often celebrate the rebellion of the playwright’s characters against the rigid expectations ______ by Elizabethan society. Most of the comedies end in marriage, with characters returning to their socially dictated gender roles after previously defying them, but there are some notable exceptions.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["interjected","committed","illustrated","prescribed"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of gender roles in Shakespeare’s comedies. As used in this context, “prescribed” would mean laid down as rules. The text indicates that the characters in the comedies often defy gender roles that are “socially dictated” (even if most characters do return to those roles eventually) and that scholars have been very interested in these acts of defiance. This context indicates that what the characters are rebelling against are standards of behavior prescribed by the society of the time. Choice A is incorrect because saying that expectations about gender were “interjected,” or suddenly inserted between other things, wouldn’t make sense in context. There’s no suggestion in the text that the issue of gender roles was inserted between other things or was an interruption in a larger discussion. Choice B is incorrect because the text indicates that Shakespeare depicts characters rebelling against expectations about gender that have been “socially dictated,” not expectations that society has “committed,” or carried out, entrusted, or promised. Choice C is incorrect because the text indicates that Shakespeare depicts characters rebelling against expectations about gender that have been “socially dictated,” not expectations that have been “illustrated,” or clarified with examples. Although it’s possible for expectations about gender roles to be illustrated, there’s nothing in the text to indicate that characters in Shakespeare’s comedies rebel against illustrations of gender expectations."},{"i":"e26d23c4","c":"vocab","d":"H","s":"Proposals to raise the age at which retirees begin receiving government transfers of funds are generally discussed in terms of the effects on transfer recipients, but Andria Smythe has argued that delaying such transfers could ______ wealth creation among working adults by lengthening the period in which they are providing financial support to their nonworking parents.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["stymie","compound","disparage","outstrip"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the consequences of raising the age at which retirees begin receiving government funds. The text indicates that raising the age for these funds is usually discussed in terms of effects on fund recipients but that Andria Smythe is instead considering the effects on working family members who care for retirees. Smythe notes that raising the age for the funds would increase the length of time retirees are dependent on financial assistance from working family members. This is suggested to have an effect on wealth creation for those workers, and most logically, that effect would be disadvantageous. Thus, \"stymie,\" which means to prevent or greatly hinder, is the most logical choice in context. Choice B is incorrect because in this context, \"compound\" would most nearly mean multiply or greatly enhance. The text indicates that raising the age at which retirees are eligible for government funds will increase the amount of time retirees are dependent on working family members for financial support. This would likely have a negative rather than a positive effect on wealth creation. Choice C is incorrect because in this context, \"disparage\" would most nearly mean criticize or defame. Nothing in the text suggests that raising the age at which retirees are eligible for government funds would defame wealth creation among working adults. Choice D is incorrect because in this context, \"outstrip\" would most nearly mean to exceed, and nothing in the text indicates that the financial support provided to retirees would exceed the amount of wealth these workers can create. The text does suggest that workers providing funds to retirees works against those workers’ wealth accumulation, but not that the support to retirees exceeds the workers’ accumulated wealth."},{"i":"98364791","c":"vocab","d":"H","s":"In studying the use of external stimuli to reduce the itching sensation caused by an allergic histamine response, Louise Ward and colleagues found that while harmless applications of vibration or warming can provide a temporary distraction, such ______ stimuli actually offer less relief than a stimulus that seems less benign, like a mild electric shock.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["deceptive","innocuous","novel","impractical"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Ward and colleagues’ findings. As used in this context, “innocuous” means mild or unharmful. The text describes the vibration and warming that Ward and colleagues used to alleviate itching as “harmless applications” and goes on to contrast these applications with another stimulus that actually offers more relief even though it seems to be stronger and “less benign.” This context conveys the idea that vibration and warming were innocuous stimuli. Choice A is incorrect because the text focuses on a distinction between harmless stimuli and those that seem to be less benign. Nothing in the text suggests that any of the treatments are “deceptive,” or misleading; indeed, even the less effective ones are described as offering some relief. Choice C is incorrect because the text focuses on the amount of relief from itching offered by harmless stimuli and those that seem to be less benign. The text doesn’t suggest that any of these stimuli are “novel,” or original and new; heat, vibration, and electricity aren’t new inventions. Choice D is incorrect because it wouldn’t make sense to describe an application of vibration or warming as “impractical,” or not suitable for use. The text indicates that these harmless applications are useful in that they offer at least some temporary relief."},{"i":"ea971260","c":"purpose","d":"E","s":"The following text is adapted from Louisa May Alcott’s 1869 novel An Old-Fashioned Girl. Polly, a teenager, is visiting her friend Fanny. Fanny’s friends did not interest Polly much; she was rather afraid of them [because] they seemed so much older and wiser than herself, even those younger in years. They talked about things of which she knew nothing and when Fanny tried to explain, she didn’t find them interesting; indeed, some of them rather shocked and puzzled her.\n\nWhich choice best states the main purpose of the text?","o":["To portray Polly’s reaction to Fanny’s friends","To identify the topics Polly talks about with Fanny’s friends","To explain how Fanny met some of her friends","To illustrate how Fanny’s friends feel about Polly"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to show how Polly reacted to some of Fanny’s other friends. The text describes Polly as being frightened of Fanny’s friends because they seemed “much older and wiser” to her and elaborates that they “talked about things of which” Polly was unfamiliar, uninterested, and shocked. Thus, the main purpose of the text is to describe Polly’s impressions of Fanny’s other friends. Choice B is incorrect because the text does not provide any of the topics Polly discussed with Fanny’s friends, stating only that Polly found the topics unfamiliar, uninteresting, and shocking. Choice C is incorrect because the text says nothing about how Fanny and her other friends first met. Choice D is incorrect because the focus of the text is on Polly’s feelings about Fanny’s other friends, not on the other friends’ feelings about Polly."},{"i":"47904792","c":"purpose","d":"E","s":"Animals use many objects as tools to achieve goals more easily. Such goals include grooming, finding food, and protecting themselves. For a long time, people thought tool use was unique to primates. Dolphins and other animals, though, have busted the myth that tool use requires hands. Inventively, dolphins use sponges to protect their noses from scratches when foraging on the seafloor. Palm cockatoos also get creative. They use leaves to pad their beaks when opening nuts.\n\nWhich choice best states the main purpose of the text?","o":["To question the belief that birds are intelligent","To compare tool use in humans with tool use in palm cockatoos","To establish that tool use doesn’t indicate intelligence","To argue that a variety of animals use tools"],"a":3,"r":"Choice D is the best answer because it most accurately states the main purpose of the text. The text first states that animals make use of objects as tools to help them achieve different goals. The text then explains that although people used to think only primates use tools, tool use by dolphins (aquatic mammals) and palm cockatoos (birds) has shown that primates are not the only animals that use tools. Thus, the main purpose of the text is to argue that a variety of animals, not just primates, use tools. Choice A is incorrect because the text doesn’t mention intelligence at all, focusing just on the idea that animals use tools. Further, the text mentions one kind of bird (palm cockatoos) only as an example of a non-primate that uses tools and describes its use of tools as creative, not unintelligent. Choice B is incorrect. Although the text mentions tool use in primates (a group that includes humans) and in palm cockatoos, it doesn’t compare humans’ tool use with palm cockatoos’ tool use. The text mentions palm cockatoos only as one example out of the variety of animals that use tools and never directly mentions tool use in humans. Choice C is incorrect because the text discusses tool use but never makes any mention of intelligence. Rather than establishing that tool use doesn’t indicate intelligence, the text describes certain tool use as inventive and creative."},{"i":"d168e7c5","c":"func","d":"M","s":"The following text is from Annie Dillard’s 1987 autobiographical novel An American Childhood. The narrator is a young girl living in Pittsburgh. I walked. My mother had given me the freedom of the streets as soon as I could say our telephone number. I walked and memorized the neighborhood. I made a mental map and located myself upon it. At night in bed I rehearsed the small world’s scheme and set challenges: <u>Find the store using backyards only. Imagine a route from the school to my friend’s house.<\/u> ©1987 by Annie Dillard Which choice best describes the function of the underlined portion in the text as a whole?","o":["It describes the narrator trying to memorize her telephone number.","It provides examples of what the narrator thinks about at night.","It gives directions to the narrator’s favorite local store.","It portrays the narrator’s relationship with her mother."],"a":1,"r":"Choice B is the best answer because it accurately describes how the underlined portion functions in the text as a whole. In the text, the narrator explains that she walks around her neighborhood, making a \"mental map\" of the area that she imagines herself navigating through. She then states that she rehearses \"the small world’s scheme\"—that is, imagines moving through her mental map—and challenges herself to use the map in her mind while lying in bed at night. The underlined portion presents two such challenges (getting to the store through backyards and traveling from school to a friend’s house) and thus provides examples of what the narrator thinks about at night. Choice A is incorrect because the underlined portion makes no mention of memorizing a telephone number. Although the narrator mentions that she had to learn the home telephone number before her mother would give her permission to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about memorizing the telephone number. Choice C is incorrect. Although the underlined portion refers to navigation tasks like finding a route to a store only through backyards, the text contains no specific directions to any store, nor is any store identified as the narrator’s favorite. Choice D is incorrect because the underlined portion makes no mention of the narrator’s mother and doesn’t address the narrator’s relationship with her. Although the narrator mentions that her mother gave her permission as a child to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about the mother or her relationship to her child."},{"i":"cf9a00e0","c":"func","d":"M","s":"Chile’s Atacama Desert is one of the driest places on Earth. <u>Mary Beth Wilhelm and other astrobiologists search for life, or its remains, in this harsh place because the desert closely mirrors the extreme environment on Mars.<\/u> The algae and bacteria found in Atacama’s driest regions may offer clues about Martian life. By studying how these and other microorganisms survive such extreme conditions on Earth, Wilhelm’s team hopes to determine whether similar life might have existed on Mars and to develop the best tools to look for evidence of it.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["To contrast the conditions in the Atacama Desert with those on Mars","To explain why many life-forms cannot survive in the Atacama Desert","To indicate why astrobiologists choose to conduct research in the Atacama Desert","To describe certain limitations to conducting scientific study in the Atacama Desert"],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence describes a unique location on Earth, the Atacama Desert. The next sentence, which is the underlined sentence, states that the reason why astrobiologists study life, or its remains, in this unique location is that Atacama is a harsh environment that closely resembles the extreme environment of Mars. The remainder of the text explains that the researchers hope their work in Atacama will support inquiry into life on Mars. Thus, the underlined portion functions mainly to indicate why astrobiologists choose to conduct research in the Atacama Desert. Choice A is incorrect because to contrast two things means to show the differences between them, and the phrase \"closely mirrors\" in the underlined sentence indicates that the extreme environment in the Atacama Desert is similar to, not different from, that on Mars. This similarity is why, according to the underlined sentence, astrobiologists conduct research in Atacama. Choice B is incorrect because the underlined sentence doesn’t address forms of life that are unable to survive the harsh environment of the Atacama Desert. Instead, the underlined sentence explains why astrobiologists study life, or its remains, in this environment. Choice D is incorrect because the underlined sentence doesn’t suggest that the scientific research in the Atacama Desert is limited in any way; instead, the sentence explains that the similarity between the environments of Atacama and Mars is the reason why astrobiologists search for life, or its remains, in Atacama."},{"i":"835d1ae6","c":"cross","d":"E","s":"Text 1 Historians studying pre-Inca Peru have looked to ceramic vessels to understand daily life among the Moche people. These mold-made sculptures present plants, animals, and human faces in precise ways—vessels representing human faces are so detailed that <u>scholars have interpreted facial markings to represent scars and other skin irregularities<\/u>. Some historians have even used these objects to identify potential skin diseases that may have afflicted people at the time.\n\nText 2 Art historian and archaeologist Lisa Trever has argued that the interpretation of Moche “portrait” vessels as hyper-realistic portrayals of identifiable people may inadvertently disregard the creativity of the objects’ creators. Moche ceramic vessels, Trever argues, are artworks in which sculptors could free their imagination, using realistic objects and people around them as inspiration to explore more abstract concepts.\n\nBased on the texts, what would Lisa Trever (Text 2) most likely say about the interpretation presented in the underlined portion of\n\nText 1?","o":["Depictions of human faces are significantly more realistic than depictions of plants and other animals are.","It is likely that some depictions of human faces with extensive markings are intended to portray the same historical individual.","Some vessels may have been damaged during their excavation and thus provide little insight into Moche culture.","Markings on depictions of human faces are not necessarily intended to portray particular details about the physical appearance of individuals."],"a":3,"r":"Choice D is the best answer. Trever thinks that the “hyper-realistic portrayal of identifiable people” interpretation ignores the sculptors’ imagination and creativity. We can infer that Trevor thinks the facial markings on the sculptures may not have represented real skin blemishes on real people. Choice A is incorrect. The text gives us no reason to think that Trever would respond to the underlined interpretation in this way. Neither text compares the depictions of human faces to the depictions of plants or animals, so we have no basis to draw this conclusion. Choice B is incorrect. The text gives us no reason to think that Trever would respond to the underlined interpretation in this way. There’s nothing in either text about multiple depictions representing the same person, so we have no basis to draw this conclusion. Choice C is incorrect. The text gives us no reason to think that Trever would respond to the underlined interpretation in this way. Neither text mentions the state of the vessels (damaged or intact), so we have no basis to draw this conclusion."},{"i":"34c2e387","c":"main","d":"H","s":"Jürgen Kocka and other historians of capitalism rarely discuss domestic capitalism in Africa before the period of European colonization, implicitly presenting capitalism as external to and imposed on Africa. Crislayne Alfagali and other Africanist scholars have shown, however, that in parts of Africa, returns-focused investment, the establishment of open markets for wage labor, and other features of capitalism predated colonization. One reason for this discrepancy is that historians of capitalism tend to focus on longitudinal economic data drawn from archival records, which do not exist for much of precolonial Africa.\n\nWhich statement about Alfagali and other Africanist scholars is best supported by information in the text?","o":["They likely make use of different types of evidence than historians of capitalism typically rely on.","They likely differ from historians of capitalism in the methods they use to derive longitudinal economic data from archival records.","They likely have a different view about which activities should be considered capitalist in nature than historians of capitalism do.","They likely view capitalism as having been more beneficial for Africa than historians of capitalism do."],"a":0,"r":"Choice A is the best answer because it presents a statement about Alfagali and other Africanist scholars that is supported by the text. The last sentence of the text explains that historians of capitalism generally rely on a type of data that requires \"archival records, which do not exist for much of precolonial Africa.\" Nevertheless, Alfagali and other Africanist scholars have demonstrated that features of capitalism including \"returns-focused investment,...open markets for wage labor, and other features of capitalism\" existed in parts of Africa before colonization. Because archival records typically used by historians of capitalism aren′t available for precolonial Africa, Alfagali and other Africanist scholars of precolonial capitalism in Africa likely used atypical sources for their studies. Choice B is incorrect because the text states that archival records containing longitudinal economic data \"do not exist for much of precolonial Africa.\" If these records don’t exist for precolonial Africa, then Alfagali and other Africanist scholars couldn’t derive data from them by any method. Choice C is incorrect because the text doesn’t suggest that Alfagali and other Africanist scholars define capitalism differently than other historians of capitalism do. On the contrary, the text simply asserts that specific features they found, such as \"returns-focused investment [and] open markets for wage labor,\" are \"features of capitalism,\" which implies scholarly agreement that these activities are capitalist in nature. Choice D is incorrect because the text doesn’t indicate any effects of capitalism in Africa, positive or negative. Rather, the text explains why precolonial Africa has been omitted from mainstream histories of capitalism and presents work by Alfagali and other Africanist scholars that challenges and corrects the historical record of precolonial capitalism."},{"i":"748995b3","c":"main","d":"E","s":"In the 1700s and 1800s, European composers experimented with volume in their musical works. They did so by increasing the number of musicians playing in the orchestra. For example, in some of his operas, German composer Richard Wagner added more horns, trombones, and tubas to the orchestra. With more instruments playing at the same time, the orchestra could play extremely loudly at key moments in his operas.\n\nAccording to the text, how did Richard Wagner achieve moments of extremely high volume in his operas?","o":["By moving the performances of his operas from outdoor stages to indoor ones","By increasing the number of musicians playing horns, trombones, and tubas in the orchestra","By building a concert hall whose shape would cause sounds to echo","By insisting that the singers undergo special training to sing for extended periods of time"],"a":1,"r":"Choice B is the best answer because it presents a statement about how Richard Wagner achieved moments of extremely high volume in his operas that is supported by the text. The text states that European composers experimented with volume in their works by increasing the number of musicians in the orchestra and provides the example of Wagner, who \"added more horns, trombones, and tubas to the orchestra.\" The text explains that by having more of these instruments playing at the same time, the overall volume of the orchestra could be dramatically increased at key moments in Wagner’s operas. Choice A is incorrect because the text never indicates that Wagner moved his operas indoors to achieve moments of extremely high volume, nor does it indicate that his operas were previously performed outdoors. The only technique discussed in the text for achieving extremely high volume is Wagner’s addition of more instruments to create a bigger, louder orchestra. Choice C is incorrect because the text never says that Wagner built or used a specially designed concert hall to increase volume through echoes. The only technique discussed in the text is Wagner’s addition of more instruments to create a bigger, louder orchestra. Choice D is incorrect because the text never mentions any special training for singers related to volume or singing for extended periods. The text’s focus is entirely on the orchestra and how Wagner and other European composers used instruments to experiment with volume in their musical works."},{"i":"4603d1f7","c":"infer","d":"E","s":"In their book Smart Pricing, Jagmohan Raju and Z. John Zhang consider musicians’ use of the nontraditional “pay as you wish” pricing model. This model generally offers listeners the choice to pay more or less than a suggested price for a song or album—or even to pay nothing at all. As the authors note, that’s the option most listeners chose for an album by the band Harvey Danger. Only about 1% opted to pay for the album, resulting in earnings below the band’s expectations. But the authors also discuss musician Jane Siberry, who saw significant earnings from her “pay as you wish” online music store as a result of many listeners choosing to pay more than the store’s suggested prices. Hence, the “pay as you wish” model may ______ Which choice most logically completes the text?","o":["prove financially successful for some musicians but disappointing for others.","hold greater financial appeal for bands than for individual musicians.","cause most musicians who use the model to lower the suggested prices of their songs and albums over time.","more strongly reflect differences in certain musicians’ popularity than traditional pricing models do."],"a":0,"r":"Choice A is the best answer. In one example, musicians made less money than expected by using the “pay as you wish” model. In the other example, a musician made more money than expected. This suggests that some musicians may have more success than others using the “pay as you wish” model. Choice B is incorrect. This inference isn’t supported. In the examples provided, the individual musician was more successful with the “pay as you wish” model than the band was. Choice C is incorrect. This inference isn’t supported. The passage provides no instances in which musicians changed the suggested prices of their songs or albums, nor does it mention this as a possibility. Choice D is incorrect. This inference isn’t supported. The text never discusses the differences in popularity of different musicians, so there is no basis to make this inference."},{"i":"9391b7cc","c":"infer","d":"H","s":"If some artifacts recovered from excavations of the settlement of Kuulo Kataa, in modern Ghana, date from the thirteenth century CE, that may lend credence to claims that the settlement was founded before or around that time. There is other evidence, however, strongly supporting a fourteenth century CE founding date for Kuulo Kataa. If both the artifact dates and the fourteenth century CE founding date are correct, that would imply that ______ Which choice most logically completes the text?","o":["artifacts from the fourteenth century CE are more commonly recovered than are artifacts from the thirteenth century CE.","the artifacts originated elsewhere and eventually reached Kuulo Kataa through trade or migration.","Kuulo Kataa was founded by people from a different region than had previously been assumed.","excavations at Kuulo Kataa may have inadvertently damaged some artifacts dating to the fourteenth century CE."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of artifacts and Kuulo Kataa’s founding date. If it were true both that Kuulo Kataa was founded in the fourteenth century CE and that artifacts found in excavations of the settlement are from the thirteenth century CE, it would be reasonable to conclude that the artifacts weren’t created in the Kuulo Kataa settlement. That would suggest, then, that the artifacts originated somewhere else and eventually reached the settlement through trading or as people migrated. Choice A is incorrect because the existence of thirteenth-century CE artifacts recovered during excavations of a settlement founded in the fourteenth century CE isn’t logically connected to artifacts from one century being more commonly recovered than artifacts from another century. Rather than suggesting anything about how frequently artifacts from different times are found, the existence of artifacts confirmed as predating the settlement’s founding suggests that those items arrived in Kuulo Kataa during or after its establishment. Choice C is incorrect because the text focuses on time periods and says nothing about which region the founders of Kuulo Kataa have been thought to come from; similarly, the text doesn’t suggest anything about where the thirteenth-century CE artifacts originated other than not from Kuulo Kataa. Therefore, it isn’t logical to conclude that the mere existence of artifacts confirmed as predating the Kuulo Kataa settlement suggests that the founders of the settlement came from a particular region other than one previously assumed. Choice D is incorrect because the existence of artifacts from the thirteenth century CE at a site dated to the fourteenth century CE doesn’t imply that fourteenth-century objects were damaged during excavations. There’s nothing in the text to suggest that any objects were damaged; rather, the existence of artifacts confirmed as predating the settlement’s founding suggests that those items were brought to Kuulo Kataa during or after its establishment."},{"i":"20583752","c":"claim","d":"H","s":"“The Poet Walt Whitman” is an 1887 essay by José Martí, a Cuban author and political activist, originally written in Spanish. In the essay, Martí explores the value of literature, arguing that a society’s spiritual well-being depends on the character of its literary culture: ______ Which quotation from a translation of “The Poet Walt Whitman” most effectively illustrates the claim?","o":["“Poetry, which brings together or separates, which fortifies or brings anguish, which shores up or demolishes souls, which gives or robs men of faith and vigor, is more necessary to a people than industry itself, for industry provides them with a means of subsistence, while literature gives them the desire and strength for life.”","“Every society brings to literature its own form of expression, and the history of the nations can be told with greater truth by the stages of literature than by chronicles and decades.”","“Where will a race of men go when they have lost the habit of thinking with faith about the scope and meaning of their actions? The best among them, those who consecrate Nature with their sacred desire for the future, will lose, in a sordid and painful annihilation, all stimulus to alleviate the ugliness of humanity.”","“Listen to the song of this hardworking and satisfied nation; listen to Walt Whitman. The exercise of himself exalts him to majesty, tolerance exalts him to justice, and order to joy.”"],"a":0,"r":"Choice A is the best answer because it most effectively illustrates the claim that Martí argues that a society’s spiritual well-being depends on the character of its literary culture. In the quotation, Martí asserts that poetry is “more necessary to a people than industry itself” and that it has the power to provide people with “faith and vigor.” He also adds that literature gives people “the desire and strength for life.” Therefore, this quotation shows that Martí believes that literature is a societal necessity because it uplifts people and nourishes their spiritual well-being. Choice B is incorrect. Although this quotation emphasizes the importance of literature, it focuses on how the nature of a society is reflected in that society’s literature rather than on literature’s value for people’s spiritual well-being. Choice C is incorrect. Although this quotation involves an element of spirituality, it doesn’t discuss literature. The quotation instead focuses on humanity’s actions. Choice D is incorrect because this quotation mainly focuses on the importance of Walt Whitman rather than on the value of literature in general."},{"i":"66fd248a","c":"claim","d":"H","s":"“Poetry” is a 1919 poem by Marianne Moore. The poem highlights an ambivalence toward poetry as the speaker acknowledges its merits while also expressing a sense of displeasure, writing ______ Which quotation from “Poetry” most effectively illustrates the claim?","o":["“nor is it valid / to discriminate against ‘business documents and / school-books’; all these phenomena are important.”","“One must make a distinction / however: when dragged into prominence by half poets, the result is not / poetry”","“when [poems] become so derivative as to become unintelligible, the / same thing may be said for all of us—that we / do not admire what / we cannot understand.”","“Reading [poetry], however, with a perfect contempt for it, one discovers that there is in / it after all, a place for the genuine.”"],"a":3,"r":"Choice D is the best answer because it most effectively uses a quotation from \"Poetry\" to illustrate the claim that the poem highlights an ambivalence, or a conflicted attitude, toward poetry. In the quotation, the speaker suggests that one might read poetry with \"contempt,\" or disdain, for it, but even with this negative attitude one will find \"a place for the genuine.\" Because the quotation expresses conflicting attitudes toward poetry, it effectively illustrates the speaker’s ambivalence in discussing the merits and displeasure of reading poetry. Choice A is incorrect because it doesn’t mention poetry or show ambivalence. Choice B is incorrect. Although the idea of \"half poets\" may seem to relate to ambivalence, the speaker mentions only negative attitudes toward certain works and the quotation therefore lacks a contrasting positive or neutral attitude that would be needed to indicate ambivalence. Choice C is incorrect because the speaker mentions only negative attitudes toward certain works and the quotation therefore lacks a contrasting positive or neutral attitude that would be needed to indicate ambivalence."},{"i":"ccf414c9","c":"graph","d":"M","s":"","o":["the percentage of 2016 cookbook sales that were e-books with the percentage of 2016 science fiction and fantasy sales that were e-books.","the percentage of 2006 romance sales that were e-books with the percentage of 2016 romance sales that were e-books.","the percentage of 2006 romance sales that were e-books with the 2006 science fiction and fantasy sales that were e-books.","the percentage of 2011 travel guide sales that were e-books with the percentage of 2016 travel guide sales that were e-books."],"a":0,"r":"Choice A is the best answer because it uses data from the table to effectively support the claim that book genres that typically require the reader to start at the beginning of the story and read straight through are more commercially successful as e-books than other genres. For each of three years, the table presents four book genres and the percentage of total sales for each genre in e-book format. Cookbooks, a nonfiction genre, do not require the reader to read straight through. According to the table, 10.5 percent of total cookbook sales in 2016 were in the e-book format. The 2016 percentage of e-book sales was 36.7 percent in the science fiction and fantasy genre, which are typically stories read straight through from start to finish. The higher percentage of total sales of the story-based e-books in 2016 supports the claim in the text. Choice B is incorrect because it compares the e-book sales of romance books in 2006 to those in 2016. Romance books are meant to be read straight through from start to finish. The text claims that books that are not stories and do not require reading straight through are not as commercially successful in e-book format as those that do. As this choice is only comparing e-book sales for one genre, it does not support the claim. Choice C is incorrect because both science fiction and fantasy and romance novels are fiction books meant to be read straight through from beginning to end. The text claims that books that are not stories and do not require reading straight through are less commercially successful in e-book format than those that do. As this choice does not compare e-book sales of story genres to e-book sales in genres that are not stories, it does not support the claim. Choice D is incorrect. Although the data in the table show that the travel guide e-books made up a greater percentage of total sales in 2016 than in 2011, this doesn’t illustrate the claim in the text that e-books in nonfiction genres not meant to be read straight through are less commercially successful. The claim cannot be supported without comparing the percentage of e-book sales between fiction and nonfiction book genres from the table."},{"i":"0147b080","c":"graph","d":"E","s":"","o":["33 meters tall.","47 meters tall.","40 meters tall.","60 meters tall."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the text about the el Castillo pyramid. The table presents information for the location, height, and age of four pyramids, and the task is to use the data from the table to complete the text by choosing the correct height for el Castillo, which the table shows is 40 meters. Choice A is incorrect because, according to the table, el Castillo is 40 meters tall, not 33 meters, which is the height of the Great Pyramid in Mexico. Choice B is incorrect because, according to the table, el Castillo is 40 meters tall, not 47 meters, which is the height of the Pyramid of Sahure in Egypt. Choice D is incorrect because, according to the table, el Castillo is 40 meters tall, not 60 meters, which is the height of the Pyramid of Djoser in Egypt."},{"i":"f1c5157d","c":"fss","d":"M","s":"Established in 1936 by African American novelist Richard Wright, ______ it would become a vital part of the creative movement known as the Chicago Black Renaissance.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["the South Side Writers Group provided a valuable forum for Chicago writers to share ideas;","Chicago writers in the South Side Writers Group had a valuable forum for sharing ideas;","writers shared ideas at a valuable forum known as the South Side Writers Group in Chicago;","Chicago was where the South Side Writers Group provided a valuable forum for writers to share ideas;"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “the South Side Writers Group” the subject of the sentence and places it immediately after the modifying phrase “established in 1936 by African American novelist Richard Wright.” In doing so, this choice clearly indicates that the South Side Writers Group—and not another noun in the sentence—was established in 1936 by Richard Wright. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “Chicago writers” immediately after the modifying phrase illogically suggests that the Chicago writers were established in 1936 by Richard Wright. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “writers” immediately after the modifying phrase illogically suggests that the writers were established in 1936 by Richard Wright. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “Chicago” immediately after the modifying phrase illogically suggests that Chicago was established in 1936 by Richard Wright."},{"i":"6205f7e4","c":"fss","d":"M","s":"A worker cooperative is a business that is owned and operated by its workers. This model stands in contrast to traditional models in which a smaller group of owners controls a company. Because the profits made by a cooperative are shared by all workers—who are also owners—the workers ______ directly from its success.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["benefit","benefited","were benefiting","had benefited"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the present tense verb “benefit” is consistent with the other present tense verbs (“is,” “stands,” and “are shared”) used to describe worker cooperatives and how they function. Choice B is incorrect because the past tense verb “benefited” isn’t consistent with the other present tense verbs used to describe worker cooperatives and how they function. Choice C is incorrect because the past progressive tense verb “were benefiting” isn’t consistent with the other present tense verbs used to describe worker cooperatives and how they function. Choice D is incorrect because the past perfect tense verb “had benefited” isn’t consistent with the other present tense verbs used to describe worker cooperatives and how they function."},{"i":"97b62fab","c":"fss","d":"E","s":"Smaller than poppy seeds, tardigrades are tiny, but they are tough. These minuscule animals can survive for thirty years without food or water, and ______ can withstand extreme temperatures as low as minus 328 degrees and as high as 304 degrees Fahrenheit.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["that","it","they","he"],"a":2,"r":"Choice C is the best answer. The convention being tested is pronoun-antecedent agreement. The plural pronoun \"they\" agrees in number with the plural antecedent \"animals,\" which refers to tardigrades. Choice A is incorrect because the singular pronoun \"that\" doesn’t agree in number with the plural antecedent \"animals.\" Choice B is incorrect because the singular pronoun \"it\" doesn’t agree in number with the plural antecedent \"animals.\" Choice D is incorrect because the singular pronoun \"he\" doesn’t agree in number with the plural antecedent \"animals.\""},{"i":"4565a53c","c":"bound","d":"E","s":"Lucía Michel of the University of Chile observed that alkaline soils contain an insoluble form of iron that blueberry plants cannot absorb, thus inhibiting blueberry growth. If these plants were grown in alkaline soil alongside grasses that aid in iron solubilization, ______ Michel was determined to find out.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["could the blueberries thrive.","the blueberries could thrive.","the blueberries could thrive?","could the blueberries thrive?"],"a":3,"r":"Choice D is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a question mark to punctuate the interrogative clause “could the blueberries thrive,” which asks a direct question at the end of the sentence. Choice A is incorrect because a period can’t be used in this way to punctuate an interrogative clause, such as “could the blueberries thrive,” at the end of a sentence. Choice B is incorrect because the context requires an interrogative clause. The declarative clause “the blueberries could thrive” incorrectly indicates that it was known that the blueberries could thrive in alkaline soil, whereas Michel had yet to find this out. Choice C is incorrect because a question mark can’t be used in this way to punctuate a declarative clause, such as “the blueberries could thrive,” at the end of a sentence."},{"i":"8a264a54","c":"bound","d":"H","s":"With a blend of traditional design elements, such as arched Gothic ceilings, and modern ones, such as floor-to-ceiling ______ design splits the difference between old and new, a mixture that is increasingly seen in home interiors in the US.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["windows; transitional","windows—transitional","windows. Transitional","windows, transitional"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to mark the boundary between the introductory subordinate clause (\"With…windows\") and the main clause (\"transitional design splits the difference between old and new\"). Choice A is incorrect because a semicolon can’t be used in this way to separate the subordinate clause (\"With…windows\") from the main clause (\"transitional…new\"). Choice B is incorrect because a dash can’t be used in this way to separate the subordinate clause (\"With…windows\") from the main clause (\"transitional…new\"). Choice C is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with \"with.\""},{"i":"3c925481","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Pineapple is a fruit that contains ascorbic acid, an essential nutrient for humans. Every 100 grams (g) of pineapple contains 48 milligrams (mg) of ascorbic acid. Many animals can make ascorbic acid in their bodies, but humans cannot. Humans must get ascorbic acid from foods, including fruits and vegetables. Ascorbic acid is also known as vitamin C. The student wants to provide an example of a fruit that contains vitamin C.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Humans cannot make ascorbic acid in their bodies, but they can get it from foods, such as fruits, for example.","Vitamin C, also known as ascorbic acid, can be found in pineapple as well as other fruits.","Since humans cannot make vitamin C in their bodies, they must get it from food.","Many animals can make ascorbic acid, which is also known as vitamin C, in their bodies, but humans cannot."],"a":1,"r":"Choice B is the best answer. The sentence provides an example of a fruit that contains vitamin C, noting that vitamin C (also known as ascorbic acid) can be found in pineapple as well as other fruits. Choice A is incorrect. While the sentence does explain that humans can get vitamin C from fruits, it doesn’t provide an example of a specific fruit that contains vitamin C. Choice C is incorrect. The sentence explains why humans must get vitamin C from foods; it doesn’t provide an example of a fruit that contains vitamin C. Choice D is incorrect. The sentence compares vitamin C production in animals with vitamin C production in humans; it doesn’t provide an example of a fruit that contains vitamin C."},{"i":"eae29760","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The calendar used by most of the world (the Gregorian calendar) has 365 days. Because 365 days can’t be divided evenly by 7 (the number of days in a week), calendar dates fall on a different day of the week each year. The Hanke-Henry permanent calendar, developed as an alternative to the Gregorian calendar, has 364 days. Because 364 can be divided evenly by 7, calendar dates fall on the same day of the week each year, which supports more predictable scheduling. The student wants to explain an advantage of the Hanke-Henry calendar.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Gregorian calendar has 365 days, which is one day longer than the Hanke-Henry permanent calendar.","Adopting the Hanke-Henry permanent calendar would help solve a problem with the Gregorian calendar.","Designed so calendar dates would occur on the same day of the week each year, the Hanke-Henry calendar supports more predictable scheduling than does the Gregorian calendar.","The Hanke-Henry permanent calendar was developed as an alternative to the Gregorian calendar, which is currently the most-used calendar in the world."],"a":2,"r":"Choice C is the best answer. The sentence explains an advantage of the Hanke-Henry calendar, noting that it supports more predictable scheduling than does the Gregorian calendar and describing how it does so (by having calendar dates occur on the same day each year). Choice A is incorrect. The sentence compares the number of days in the Gregorian and Hanke-Henry calendars; it doesn’t explain an advantage of the Hanke-Henry calendar. Choice B is incorrect. While the sentence refers to a possible reason to adopt the Hanke-Henry calendar—that doing so would help solve a problem with the Gregorian calendar—it doesn’t identify the problem or the solution and thus doesn’t explain the advantage of the Hanke-Henry calendar. Choice D is incorrect. The sentence describes the origins of the Hanke-Henry calendar; it doesn’t explain an advantage of it."},{"i":"2ba97187","c":"trans","d":"H","s":"Upon first approaching artist Kurt Wenner’s Dies Irae, a colorful scene painted on the surface of a cobblestone street in Mantua, Italy, one might assume a deep hole filled with life-sized, classically styled sculptures had opened up in the street. ______ by expertly applying the principles of perspective, Wenner created merely the illusion of depth.\n\nWhich choice completes the text with the most logical transition?","o":["Additionally,","On the contrary,","As a result,","Next,"],"a":1,"r":"Choice B is the best answer. \"On the contrary\" logically signals that the information in this sentence—that Dies Irae’s appearance of depth is merely an illusion—contrasts with the previous statement about a viewer’s possible assumption regarding the street painting. Choice A is incorrect because \"additionally\" illogically signals that this sentence is simply additional information about a viewer’s possible assumption regarding the street painting. Instead, the information about how Wenner achieved the illusion of depth contrasts with the previous sentence’s description of the illusion. Choice C is incorrect because \"as a result\" illogically signals that the information in this sentence is a result of, or caused by, a viewer’s possible assumption regarding the street painting. Instead, the information about how Wenner achieved the illusion of depth contrasts with the previous sentence’s description of the illusion. Choice D is incorrect because \"next\" illogically signals that the information in this sentence is the next step in a process. Instead, the information about how Wenner achieved the illusion of depth contrasts with the previous sentence’s description of the illusion."},{"i":"bfb4e85e","c":"trans","d":"E","s":"Ballet dancer Misty Copeland has accomplished a lot. She has appeared on Broadway, toured with Prince, and even served on the President’s Council on Sports, Fitness &amp; Nutrition. ______ according to Copeland, nothing in her career matches the honor of being the first African American woman named principal dancer at the prestigious American Ballet Theatre.\n\nWhich choice completes the text with the most logical transition?","o":["Thus,","However,","For example,","Second of all,"],"a":1,"r":"Choice B is the best answer. \"However\" logically signals that the information in this sentence—that nothing in Copeland’s career matches her accomplishment of being the first African American woman named principal dancer at the American Ballet Theatre—offers a contrast or exception to the previous information about Copeland’s accomplishments. Choice A is incorrect because \"thus\" illogically signals that the information that follows is a result of the previous information about Copeland’s accomplishments. Instead, the statement that nothing in Copeland’s career matches this accomplishment offers a contrast or exception to that information. Choice C is incorrect because \"for example\" illogically signals that Copeland’s statement about her greatest accomplishment exemplifies the claim about her accomplishments in the previous sentence. Instead, it offers a contrast or exception to that information. Choice D is incorrect because \"second of all\" illogically signals that the information in this sentence is a second, separate claim from the previous sentence’s information about her accomplishments. Instead, the statement that nothing in Copeland’s career matches this accomplishment offers a contrast or exception to that information."},{"i":"9e34720b","c":"trans","d":"M","s":"Although those who migrated to California in 1849 dreamed of finding gold nuggets in streambeds, the state’s richest deposits were buried deeply in rock, beyond the reach of individual prospectors. ______ by 1852, many had given up their fortune-hunting dreams and gone to work for one of the large companies capable of managing California’s complex mining operations.\n\nWhich choice completes the text with the most logical transition?","o":["Furthermore,","Still,","Consequently,","Next,"],"a":2,"r":"Choice C is the best answer. “Consequently” logically signals that the information in this sentence—that many individual gold prospectors gave up their fortune-hunting dreams and became employees of mining companies—is a result or consequence of the previous information about the inaccessibility of the state’s gold deposits. Choice A is incorrect because “furthermore” illogically signals that the information in this sentence merely adds to the previous information about the inaccessibility of the state’s gold deposits. Instead, it’s a result or consequence of that information. Choice B is incorrect because “still” illogically signals that the information in this sentence offers a contrast or exception to the previous information about the inaccessibility of the state’s gold deposits. Instead, it’s a result or consequence of that information. Choice D is incorrect because “next” illogically signals that the information in this sentence is the next step in a process. Instead, it’s a result or consequence of the previous information about the inaccessibility of the state’s gold deposits."}],"img":{"ccf414c9":"iVBORw0KGgoAAAANSUhEUgAAArwAAAE7BAMAAADNyU+NAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABANklEQVR42u1dd3gU1dd+72xJz57ZUAMks0noQiYBQZosRf0hIAsISlE29CpBbIAloiJSdBHpbeldlt5l6R029BayoSMkOxuqJNn5/kiCSUgoMfJJ2NfnkezcmXPvvPfeM+ec2wA33HDDDTfccMON/xxYiIAAyvwRAYDpAKBhLvdqdY+X1ZW0Om3mj+oAgQAwAOAIACdm5pN5UxGdASwkI/uHyYUI38SdgH8mvTgC4Os4PYCjudRE2rnobL+57OmqY0K/+PP6DC47QmHHHgClmADujzMEqC0Zd5ZO/+cs/MNsCI47nkG
