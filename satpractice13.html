<script>
const D={"t":"SATPractice13","q":[{"i":"4b8244ca","c":"vocab","d":"E","s":"One challenge of generating electricity from ocean waves is that wave power isn’t ______: it varies in unpredictable ways that pose technological and planning problems for electricity generation.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["accidental","confident","expensive","consistent"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the challenge of generating electricity from ocean waves. In this context, \"consistent\" means steady or unchanging over time. The text introduces a challenge and then explains that wave power varies, or changes, unpredictably in ways that cause problems for electricity generation. This context conveys that the challenge being described is a lack of consistency. Choice A is incorrect because the text introduces a challenge and then elaborates on it by emphasizing that the unpredictable nature of variations in ocean waves causes problems, which doesn’t indicate that wave power isn’t \"accidental,\" or isn’t happening unintentionally. It wouldn’t make sense to describe waves—a natural occurrence—as happening intentionally. Choice B is incorrect because \"confident\" means having a feeling of self-assurance, and it wouldn’t make sense to describe wave power itself in terms of either having or lacking a sense of confidence. Choice C is incorrect because the text introduces a challenge and then elaborates on it by emphasizing that the unpredictable nature of variations in ocean waves causes problems, which doesn’t indicate that wave power isn’t \"expensive,\" or isn’t costly. If anything, technological and planning problems might actually increase the expense of generating electricity from waves."},{"i":"35fd0eb4","c":"vocab","d":"M","s":"The discoverers of the minor planet 1227 Geranium named it after the plant genus that includes cranesbills. Most of the recently discovered minor planets, however, are given only an identification number, largely due to there being over 500,000 such bodies known at present, which makes the already challenging task of finding a unique name for each nearly ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["insurmountable","feasible","substantial","unnecessary"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the difficulty in naming a large number of minor planets. In this context, \"insurmountable\" means impossible to overcome or too difficult to solve. The text establishes that coming up with distinct names for minor planets is already a difficult task that has become even more challenging because there are now more than 500,000 known minor planets. The logical conclusion is that finding unique names for such a vast number of celestial objects has become virtually impossible—or insurmountable—which explains why the majority of recently discovered minor planets receive only identification numbers instead of proper names. Choice B is incorrect because \"feasible\" means possible to do or achieve, which would contradict the logic of the text. The text indicates that the task of naming minor planets has become more difficult because of their large number. The text then explains that this is why most new discoveries receive only identification numbers. If the task were feasible, there would be no reason to abandon the practice of giving proper names to minor planets in favor of using only numbers. Choice C is incorrect because \"substantial\" means considerable in size, amount, or importance. While the text does suggest that naming all minor planets would be a significant undertaking, describing the task as substantial wouldn’t logically explain why the naming practice has been largely abandoned in favor of using only identification numbers. The text suggests that the task has become virtually impossible (insurmountable), not merely large or significant. Choice D is incorrect because \"unnecessary,\" which means not needed, would suggest that giving proper names to minor planets serves no purpose. However, the text doesn’t question the value or purpose of naming minor planets; rather, it explains that the sheer number of discoveries has made the already challenging naming task nearly impossible to complete. The text provides an example of a named minor planet (1227 Geranium), indicating that naming has been considered worthwhile but has become impractical because of the volume."},{"i":"d8d1ecaa","c":"vocab","d":"M","s":"Business researcher Melanie Brucks and colleagues found that remote video conference meetings may be less conducive to brainstorming than in-person meetings are. The researchers suspect that video meeting participants are focused on staring at the speaker on the screen and don’t allow their eyes or mind to wander as much, which may ultimately ______ creativity.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["recommend","criticize","impede","construct"],"a":2,"r":"Choice C is the best answer. The first sentence tells us that video meetings are “less conducive to” (meaning less good for) brainstorming. This suggests that the video meeting participants’ focus is bad for their creativity. “Impede” means “delay” or “prevent,” which works perfectly in this context. Choice A is incorrect. This choice is too positive to fit the context. The first sentence tells us that video meetings are “less conducive to” (meaning less good for) brainstorming. This suggests that the video meeting participants’ focus is bad for their creativity. Choice B is incorrect. This choice doesn’t make sense. The participants’ intense focus on the screen is the subject of the missing verb. It wouldn’t make sense to say that their over-focusing “criticizes” their creativity. Choice D is incorrect. “Construct” means “build” or “make,” which is too positive to fit the context. The first sentence tells us that video meetings are “less conducive to” (meaning less good for) brainstorming. This suggests that the video meeting participants’ focus is bad for their creativity."},{"i":"dc0bca21","c":"vocab","d":"E","s":"It would be a mistake to ______ the exhibit that artist and curator Joe Baker, who is a member of the Lenape (Delaware) people, has organized at the Brooklyn Public Library. The exhibit, which includes Lenape beadwork from the 1850s as well as modern works that use traditional patterns, is essential viewing.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["complicate","amplify","overlook","assemble"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of an exhibit at the Brooklyn Public Library. In this context, \"overlook\" means to ignore or to miss. The text states that artist and curator Joe Baker organized an exhibit that features Lenape beadwork in historical and modern works. The text describes the exhibit as \"essential viewing,\" suggesting that it’s an important exhibit that people should make an effort to visit; this context conveys that it would be a mistake to overlook the exhibit. Choice A is incorrect. In this context, \"complicate\" would mean to add difficulty, and there’s no reason to think the text would need to directly caution against complicating Baker’s exhibit; the text focuses on the idea that the exhibit is \"essential viewing,\" not on the idea of a potential difficulty that could be raised. Choice B is incorrect. In this context, \"amplify\" means to increase, and there’s no reason to believe the text would indicate that it would be a mistake to increase an exhibit the text describes as \"essential viewing.\" Choice D is incorrect because it wouldn’t make sense to say that it would be a mistake to \"assemble,\" or put together, Baker’s exhibit: the text makes it clear that the exhibit has already been put together and, further, praises the exhibit as \"essential viewing.\""},{"i":"e5ca7687","c":"purpose","d":"E","s":"Archaeologists studying the ancient city of Pompeii in Italy recently discovered a well-preserved food shop known as a thermopolium. The site contains food remains, artworks, and decorations. These items give researchers a better understanding of what daily life in Pompeii may have been like. For example, the archaeologists found a ceramic jar that they believe likely contained a meat and seafood stew.\n\nWhich choice best states the main purpose of the text?","o":["To compare ancient artworks with modern ones","To discuss the political system of Italy","To present a recent archaeological discovery","To describe a region’s climate"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text. The text states that archaeologists recently discovered a well-preserved food shop, or thermopolium, in Pompeii, Italy. The text then further describes the contents of the discovery and provides an example of what was found. Thus, the overall purpose of the text is to present a recent archaeological discovery. Choice A is incorrect. Although the text states that archaeologists found ancient artworks, it doesn’t compare these artworks to modern ones or to any other artworks. Choice B is incorrect. Although the archaeological discovery discussed in the text was made in Italy, the text doesn’t provide any information about politics or government in Italy. Choice D is incorrect because the text doesn’t discuss the climate where the archaeological discovery was made or in any other region."},{"i":"82cb7dda","c":"purpose","d":"H","s":"The field of study called affective neuroscience seeks instinctive, physiological causes for feelings such as pleasure or displeasure. Because these sensations are linked to a chemical component (for example, the release of the neurotransmitter dopamine in the brain when one receives or expects a reward), they can be said to have a partly physiological basis. These processes have been described in mammals, but Jingnan Huang and his colleagues have recently observed that some behaviors of honeybees (such as foraging) are also motivated by a dopamine-based signaling process.\n\nWhat choice best describes the main purpose of the text?","o":["It describes an experimental method of measuring the strength of physiological responses in humans.","It illustrates processes by which certain insects can express how they are feeling.","It summarizes a finding suggesting that some mechanisms in the brains of certain insects resemble mechanisms in mammalian brains.","It presents research showing that certain insects and mammals behave similarly when there is a possibility of a reward for their actions."],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to summarize a finding suggesting that some mechanisms in the brains of certain insects resemble mechanisms in mammalian brains. The text begins by explaining that feelings such as pleasure and displeasure are linked to chemical processes in the brain, such as the release of dopamine when one receives a reward. The text then indicates that such processes have been seen in mammals but that researchers have recently observed similar processes involving dopamine in honeybees. Taken together, this information serves to sum up the discovery that some mechanisms in the brains of certain insects may resemble mechanisms linked to feelings such as pleasure and displeasure in mammals. Choice A is incorrect because the text doesn’t describe any experiments or experimental methods. Instead, the text describes a phenomenon that has been observed in mammals and then presents the recent observations of Huang and colleagues that this phenomenon is also seen in honeybees. Choice B is incorrect because there’s nothing in the text to suggest that certain insects can express how they’re feeling through particular processes. The text does indicate that certain honeybee behaviors such as foraging are linked to dopamine, but it doesn’t suggest that these behaviors enable honeybees to communicate feelings or sensations. Choice D is incorrect because the text presents research showing that certain honeybee behaviors such as foraging are linked to dopamine and therefore may be motivated by similar mechanisms to those in mammalian brains, not that honeybees and mammals behave similarly when there is the possibility of reward for their actions."},{"i":"809addda","c":"func","d":"E","s":"The following text is from Ameen Rihani’s 1921 poem “The Wanderer.” I wander among the hills of alien lands Where Nature her prerogative resigns To Man; where Comfort in her shack reclines And all the arts and sciences commands. <u>But in my soul The eastern billows roll— I hear the voices of my native strands.<\/u> Which choice best describes the function of the underlined lines in the text as a whole?","o":["It establishes that the speaker’s enthusiasm about current travels conflicts with the growing urge to return home.","It illustrates the speaker’s uncertainty about maintaining strong links with relatives in distant places.","It conveys the speaker’s sense of feeling a pull toward home while traveling in an unfamiliar place.","It reveals that upon returning after an extended absence, the speaker longs for the way a location once felt."],"a":2,"r":"Choice C is the best answer because it most accurately describes the function of the underlined lines in the text as a whole. In the opening line of the text, the speaker describes wandering in \"alien lands,\" which establishes that the speaker is traveling in unfamiliar territory. In the underlined lines, the speaker describes \"billows\" (large waves) rolling in the soul, which suggests that the speaker feels inner turmoil. The underlined lines go on to associate these rolling billows with voices calling to the speaker from the speaker’s \"native strands,\" or homeland, indicating that thoughts of home are prompting the emotional experience these lines describe. Taken together, the imagery in the underlined lines thus implies that the speaker feels a deep emotional connection to, or pull toward, home while traveling in an unfamiliar place. Choice A is incorrect. While the text’s first line states that the speaker is traveling and the underlined lines indicate that the speaker experiences an emotional pull toward home, neither the underlined lines nor the text as a whole establishes an enthusiasm about the current travels that conflicts with a growing urge to return home. The text’s description of the lands the speaker is traveling in focuses on their artificial quality, stating, \"Nature her prerogative resigns / To Man,\" which doesn’t suggest enthusiasm but rather a sense of detachment or even critique. Choice B is incorrect because the underlined lines don’t address uncertainty about maintaining links with relatives in distant places. In the underlined lines, the speaker expresses a sense of connection to the speaker’s homeland (\"native strands\") but doesn’t refer to any family members the speaker may have there or to concerns about maintaining any familial ties. Choice D is incorrect because the poem doesn’t indicate that the speaker has returned home after an absence. Rather, the speaker explicitly states, \"I wander among the hills of alien lands,\" establishing that the current setting is a foreign place. Moreover, the underlined lines express a sense of connection with, or pull toward, a distant homeland, not a sense of longing for how that homeland or any other location once felt."},{"i":"764331f8","c":"func","d":"E","s":"The following text is from Louise Erdrich’s 1986 novel The Beet Queen. The narrator discusses her relationship with her young niece, Dot. Celestine, the narrator’s sister-in-law, is Dot’s mother. Dot was as impatient with babyhood as I. She tried at once to grow out of it. Celestine never saw that, because she, and only she, took pleasure in Dot’s helpless softness. Only Celestine was saddened by her daughter’s fierce progress. Day by day, Dot grew stronger. <u>In her shopping-cart stroller she exercised to exhaustion, bouncing for hours to develop her leg muscles.<\/u> ©1986 by Louise Erdrich Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It offers a detail that shows how Dot is growing stronger.","It expresses hope that Celestine will mature psychologically.","It explores some of the narrator’s psychological characteristics.","It indicates how sad Celestine is by describing a behavior she engages in."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. In the text, the narrator makes observations about her young niece, Dot, noting that Dot is making progress toward outgrowing babyhood and is growing stronger \"day by day.\" The description of Dot purposefully exercising by \"bouncing for hours\" reinforces the narrator’s earlier characterization of Dot. The underlined sentence thus offers a detail that shows how Dot is growing stronger. Choice B is incorrect. While a sentence earlier in the text mentions Celestine’s psychological state (sadness because Dot is growing fast), the underlined sentence doesn’t focus on Celestine at all. Instead, the sentence focuses on Dot’s physical activities to show that she is getting stronger. Choice C is incorrect because the underlined sentence describes Dot’s behavior, not the narrator’s psychological characteristics. While a sentence earlier in the text establishes that the narrator, like Dot, was \"impatient with babyhood,\" the underlined sentence specifically addresses Dot’s physical activities in her stroller. Choice D is incorrect. While an earlier sentence in the text mentions that Celestine is sad, the underlined sentence doesn’t focus on how Celestine feels nor does it describe a behavior that Celestine engages in. The sentence focuses entirely on Dot’s actions, describing her as \"bouncing for hours\" to show that she is growing stronger."},{"i":"2903a041","c":"structure","d":"M","s":"Using NASA’s powerful James Webb Space Telescope (JWST), Mercedes López-Morales and colleagues measured the wavelengths of light traveling through the atmosphere of WASP-39b, an exoplanet, or planet outside our solar system. Different molecules absorb different wavelengths of light, and the wavelength measurements showed the presence of carbon dioxide (CO₂) in WASP-39b’s atmosphere. This finding not only offers the first decisive evidence of CO₂ in the atmosphere of an exoplanet but also illustrates the potential for future scientific breakthroughs held by the JWST .\n\nWhich choice best describes the overall structure of the text?","o":["It discusses a method used by some researchers, then states why an alternative method is superior to it.","It describes how researchers made a scientific discovery, then explains the importance of that discovery.","It outlines the steps taken in a scientific study, then presents a hypothesis based on that study.","It examines how a group of scientists reached a conclusion, then shows how other scientists have challenged that conclusion."],"a":1,"r":"Choice B is the best answer. The text begins by describing how the researchers used the JWST to detect CO₂ in WASP-39b’s atmosphere. Then the text discusses the significance of this finding, both as the first evidence of CO₂ in an exoplanet’s atmosphere and as an illustration of the JWST’s potential for making new discoveries in general. Choice A is incorrect. The text doesn’t compare two different methods, but rather focuses on one study that used the JWST . Choice C is incorrect. The text doesn’t present a hypothesis, but rather reports on the findings of a study. Choice D is incorrect. The text doesn’t mention any scientists challenging the conclusion reached by López-Morales and colleagues."},{"i":"a87c3925","c":"cross","d":"H","s":"Text 1 Soy sauce, made from fermented soybeans, is noted for its umami flavor. Umami—one of the five basic tastes along with sweet, bitter, salty, and sour—was formally classified when its taste receptors were discovered in the 2000s. In 2007, to define the pure umami flavor scientists Rie Ishii and Michael O’Mahony used broths made from shiitake mushrooms and kombu seaweed, and two panels of Japanese and US judges closely agreed on a description of the taste.\n\nText 2 A 2022 experiment by Manon Jünger et al. led to a greater understanding of soy sauce’s flavor profile. The team initially presented a mixture of compounds with low molecular weights to taste testers who found it was not as salty or bitter as real soy sauce. Further analysis of soy sauce identified proteins, including dipeptides, that enhanced umami flavor and also contributed to saltiness. The team then made a mix of 50 chemical compounds that re-created soy sauce’s flavor.\n\nBased on the texts, if Ishii and O’Mahony (Text 1) and Jünger et al. (Text 2) were aware of the findings of both experiments, they would most likely agree with which statement?","o":["On average, the diets of people in the United States tend to have fewer foods that contain certain dipeptides than the diets of people in Japan have.","Chemical compounds that activate both the umami and salty taste receptors tend to have a higher molecular weight than those that only activate umami taste receptors.","Fermentation introduces proteins responsible for the increase of umami flavor in soy sauce, and those proteins also increase the perception of saltiness.","The broths in the 2007 experiment most likely did not have a substantial amount of the dipeptides that played a key part in the 2022 experiment."],"a":3,"r":"Choice D is the best answer. Ishii and O’Mahony were trying to isolate the pure umami flavor, while Jünger was trying to recreate soy sauce, which has a mix of flavors that includes umami. Accordingly, the broths from Text 1 are not described as having any soy sauce in them—just “shiitake mushrooms and kombu seaweed.” So they probably don’t have as much of the dipeptides described in Text 2, which were found to be a key part of soy sauce’s umami-ness and its saltiness. Choice A is incorrect. Neither text supports this. Neither text gets into the diets of people in the United States, nor the diets of people in Japan. Choice B is incorrect. Neither text supports this. Text 2 does talk about the molecular weights of chemical compounds, but there isn’t enough information provided about molecular weights in Text 1 to make an inference about what the scientists in Text 1 would say. Choice C is incorrect. Neither text supports this. Text 1 briefly mentions that soy sauce is “made from fermented soybeans,” but it never claims that fermentation is responsible for its flavor in any way. And Text 2 never mentions fermentation at all."},{"i":"9731a22b","c":"main","d":"H","s":"Paleontologist Lucas E. Fiorelli and colleagues have reported the discovery at a mine in Brazil of several egg clutches, partially preserved single eggs, and egg shells from the Late Cretaceous period. The researchers have concluded that the area was once a nesting and breeding site for titanosaurs, a group of sauropod dinosaurs. The finding is significant given the previous lack of known nesting sites in northern regions of South America, which led many paleontologists to assume that titanosaurs migrated south to lay eggs. What does the text most strongly suggest about the site discovered by the researchers?","o":["It is the earliest known example of a titanosaur nesting and breeding site.","It was very difficult to excavate given that it was discovered in a mine.","It may have been occupied by other sauropods in addition to titanosaurs.","It is farther north than any other nesting site discovered in South America."],"a":3,"r":"Choice D is the best answer because it presents a statement about the site discovered by the researchers that is supported by the text. The text discusses Fiorelli and colleagues’ discovery of egg clutches, single eggs, and eggshells in a Brazilian mine. According to the text, the presence of these eggs, which are from the Late Cretaceous period, led the researchers to conclude that the location was once a nesting and breeding site for titanosaurs. The text then explains that the finding is important because of the “previous lack of known nesting sites in northern regions of South America.” If there haven’t been any other discoveries of a nesting site in South America’s northern regions and the site in the Brazilian mine is the first, then the text strongly suggests that the site is farther north than other nesting sites that have been discovered in South America. Choice A is incorrect because the text doesn’t suggest that the site discovered by Fiorelli and colleagues is the earliest titanosaur nesting and breeding site known to paleontologists but rather that it’s the first nesting site found in northern regions of South America. Moreover, the text doesn’t suggest how the timeline of the newly discovered site compares with that of other titanosaur nesting and breeding sites. Choice B is incorrect because there is no mention in the text about any difficulties that Fiorelli and colleagues faced when they were excavating the nesting and breeding site in the Brazilian mine. Choice C is incorrect because the text doesn’t support the idea that the nesting and breeding site in the Brazilian mine was occupied by sauropods other than titanosaurs. The text simply mentions that titanosaurs are sauropod dinosaurs and presents the researchers’ conclusion that the site they discovered was for titanosaurs."},{"i":"11c68ded","c":"main","d":"M","s":"A contraction of “you all,” the pronoun “y’all” has long been used as a plural version of “you” in the South and in Black communities around the US. In recent decades, most other English-speaking communities in the US have begun to use “y’all.” What explains its rise in popularity? Many varieties of English have no pronoun that specifically addresses more than one person and instead must use “you” to address both one person and more than one. But “y’all” always refers to two or more people. As a result, it conveys the speaker’s meaning more precisely than “you” can. Which question does the text most directly attempt to answer?","o":["How many other plural versions of the pronoun “you” are there in English, besides “y’all”?","Why has the pronoun “y’all” become more widely used in the US?","When was the first recorded use of the pronoun “y’all” in the English language?","Is “y’all” commonly used in English-speaking regions of the world besides the US?"],"a":1,"r":"Choice B is the best answer because it presents a question that the text is attempting to answer: why has the pronoun \"y’all\" become more widely used in the US? The text begins by explaining where and how the plural pronoun \"y’all\" originated and then goes on to state that its use has been rising in popularity, even in areas outside of its place of origin. The text then attributes this rise in popularity to the fact that many varieties of English do not have a pronoun to address more than one person, and thus \"you\" must function as both a singular and plural pronoun. Choice A is incorrect because while the text states that \"y’all\" is used as a plural of \"you\" in English, it does not discuss other plural forms of the word. Choice C is incorrect because while the text discusses the general origins of the pronoun \"y’all,\" it does not state when the use of the pronoun was first recorded in the English language. Choice D is incorrect because though the text addresses the use of the pronoun \"y’all\" within English-speaking communities in the US, it does not address its use outside of that geographic area."},{"i":"28dfc05a","c":"infer","d":"M","s":"Even with the widespread adoption of personal computers, many authors still choose to write and revise their novels by hand and only then transcribe the final version on a computer. It may be tempting to speculate about how a novel written this way would be affected if it had been exclusively typed instead, but each novel is a unique entity resulting from a specific set of circumstances. Therefore, ______ Which choice most logically completes the text?","o":["in order to increase their efficiency, authors who currently write their novels largely by hand should instead work only on a computer.","authors who do most of their drafting and revising by hand likely have more success than those who work entirely on a computer.","novels written by hand take less time to produce, on average, than novels written on a computer do.","there is no way to reasonably evaluate how a work would be different if it had been written by other means."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the means authors use to write and revise their novels. After stating that many authors still choose to draft novels by hand even though computers are now widely used, the text acknowledges the speculation that the opposite choice—using only a computer—would have had an effect on such novels. However, the text then points out that every novel is the singular result of a combination of the particular conditions surrounding its creation. This suggests that it isn’t possible to determine the effect of any single condition (such as the means of writing) on its own; thus, there would be no way to reasonably evaluate how a novel would have turned out differently if it had been written by other means. Choice A is incorrect because the text doesn’t suggest that it’s more efficient to write a novel on a computer than to write it by hand; it doesn’t address efficiency at all. Therefore, it isn’t logical to conclude that authors who currently choose to write novels largely by hand should instead work only on a computer to increase their efficiency. Choice B is incorrect because the text doesn’t suggest anything about how successful authors are, regardless of the means by which they choose to write; therefore, it isn’t logical to conclude that authors who write largely by hand are likely to be more successful than those who work only on a computer. Choice C is incorrect because the text makes no mention of the time it takes to produce a novel, regardless of the means by which it’s written; therefore, it isn’t logical to conclude that novels written by hand take less time on average to produce than those written on a computer do."},{"i":"61228830","c":"infer","d":"H","s":"A heliograph is a semaphore device used for sending optical communications—usually in the form of Morse code—by reflecting flashes of sunlight off a mirror. Heliographs were used for rapid communication across expansive distances for military, surveying, and forestry purposes during the late nineteenth and early twentieth centuries, but they were largely effective only during the daytime, and the range of the device depended on factors such as the opacity of the air and line of sight. Therefore, heliographs were eventually replaced by technology that ______ Which choice most logically completes the text?","o":["worked on similar principles but was easier to produce and maintain.","was not so constrained by environmental circumstances.","could be used for more than military, surveying, or forestry purposes.","enabled communication that didn’t require knowledge of Morse code."],"a":1,"r":"Choice B is the best answer. The passage explains that heliographs “were largely effective only during the daytime” and that “the range of the device depended on factors such as the opacity of the air and line of sight.”These constraints would have greatly limited the use of the heliograph, so we can infer that this would have been a reason to replace it with new technology. Choice A is incorrect. The passage doesn’t discuss the production and maintenance of heliographs, so there’s no basis for this inference. Choice C is incorrect. The passage doesn’t mention any “other purposes” that a heliograph wouldn’t work for, so there’s no basis for this inference. Choice D is incorrect. The passage doesn’t mention knowledge of Morse code as a particular problem with the use of heliographs, so there’s no basis for this inference."},{"i":"5d122d45","c":"claim","d":"H","s":"Psychologists Dacher Keltner and Jonathan Haidt have argued that experiencing awe—a sensation of reverence and wonder typically brought on by perceiving something grand or powerful—can enable us to feel more connected to others and thereby inspire us to act more altruistically. Keltner, along with Paul K. Piff, Pia Dietze, and colleagues, claims to have found evidence for this effect in a recent study where participants were asked to either gaze up at exceptionally tall trees in a nearby grove (reported to be a universally awe-inspiring experience) or stare at the exterior of a nearby, nondescript building. After one minute, an experimenter deliberately spilled a box of pens nearby.\n\nWhich finding from the researchers’ study, if true, would most strongly support their claim?","o":["Participants who had been looking at the trees helped the experimenter pick up significantly more pens than did participants who had been looking at the building.","Participants who helped the experimenter pick up the pens used a greater number of positive words to describe the trees and the building in a postexperiment survey than did participants who did not help the experimenter.","Participants who did not help the experimenter pick up the pens were significantly more likely to report having experienced a feeling of awe, regardless of whether they looked at the building or the trees.","Participants who had been looking at the building were significantly more likely to notice that the experimenter had dropped the pens than were participants who had been looking at the trees."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would most strongly support the researchers’ claim that they found evidence that experiencing awe can make people feel more connected to others and thus more likely to behave altruistically (with beneficial and unselfish concern for others). According to the text, the researchers tested for this effect by first having participants look at either something known to be awe-inspiring (very tall trees) or something ordinary (a plain building) and then purposely spilling pens near the participants. The finding that participants who had looked at the trees helped pick up significantly more pens than did participants who had looked at the building would support the researchers’ claim by demonstrating that the people who had experienced awe behaved more altruistically when the experimenter needed help than the other participants did. Choice B is incorrect because a finding about helpful participants using positive words to describe the trees and the building after the experiment was over wouldn’t have any bearing on the researchers’ claim that experiencing awe increases altruistic behavior. The text doesn’t address the use of positive words to describe things or suggest any connection between using such words and having experienced awe, so that behavior wouldn’t serve as evidence that experiencing awe played a role in promoting helpful behavior. Choice C is incorrect because a finding that participants who didn’t help the experimenter were significantly more likely than others to report having experienced awe whether they had looked at the building or the trees would weaken the researchers’ claim that experiencing awe increases altruistic behavior by suggesting that the opposite might be true—that experiencing awe is in fact linked to choosing not to act in a way that benefits someone else. Choice D is incorrect because a finding about participants noticing that the experimenter had dropped the pens wouldn’t have any bearing on the researchers’ claim about people behaving altruistically. Being aware of a challenge or problem isn’t necessarily beneficial on its own and isn’t the same as offering help, so the finding wouldn’t support the idea that experiencing awe increases altruistic behavior."},{"i":"378c66d5","c":"claim","d":"H","s":"A member of the Otomi, an Indigenous people in Central Mexico, Octavio Medellín immigrated to the United States as a child, and his sculpture bears the impress of traditions on both sides of the border: US-based modernist sculpture, Mexican modernist painting, Otomi art, and the ancient sculpture of other Mexican Indigenous peoples, including the Maya. <u>In his 1950 masterpiece History of Mexico, Medellín fuses these influences into a style so idiosyncratic that it resists efforts to view his work through the lens of nationality or cultural identity.<\/u> Artists, he insisted, should strive for individual expression, even as they draw inspiration from their heritage and the communities where they live and work.\n\nWhich quotation from an art critic most directly challenges the underlined claim in the text?","o":["“Although a number of ancient Indigenous artistic traditions pictured human forms in profile, the forms populating the surface of A History of Mexico suggest a specifically Maya influence.”","“In A History of Mexico, the synthesis of ancient and modernist traditions functions as a stylistic parallel to the work’s subject matter: a survey of centuries of Mexican history.”","“Many critics focus on Indigenous influences in A History of Mexico and other key works by Medellín to the exclusion of influences from non- Indigenous art.”","“While A History of Mexico features modernist motifs, it relies primarily on angular human forms in profile—a staple of Maya sculpture—and thus invites classification as Indigenous art.”"],"a":3,"r":"Choice D is the best answer. This critic challenges the claim by arguing that A History of Mexico is not so idiosyncratic (unique) as to resist classification because its use of Maya-style human profiles actually “invites classification as Indigenous art.”Therefore, according to this critic, the work can be viewed, at least partially, through a lens of national or cultural identity. Choice A is incorrect. While it describes the Maya influence on a particular aspect of A History of Mexico, this quotation doesn’t push back on Medellín’s “idiosyncratic” (unique) style, nor does it try to categorize the entire work into a single cultural tradition. Choice B is incorrect. This choice doesn’t directly challenge the underlined claim, but rather supports it. It suggests that the work effectively blends a variety of artistic products to create a single work that can’t be defined by any one tradition. Instead, the work recalls many centuries of history and culture all at once. Choice C is incorrect. This choice supports rather than challenges the underlined claim. The quotation argues that other critics focus too much on Indigenous influences on the artwork instead of viewing all of the influences equally—that they should instead be viewing the work as an idiosyncratic whole instead of through one or two narrow cultural lenses."},{"i":"df9c5a1d","c":"graph","d":"H","s":"","o":["For all five species, less than 75% of juvenile plants were growing in patches of vegetation.","The species with the greatest number of juvenile plants growing in patches of vegetation was H. stoechas.","For T . libanitis and T . moroderi, the percentage of juvenile plants growing in patches of vegetation was less than what would be expected if plants were randomly distributed.","For each species, the percentage of juvenile plants growing in patches of vegetation was substantially higher than what would be expected if plants were randomly distributed."],"a":3,"r":"Choice D is the best answer because it provides the most direct support from the table for the claim that the plants growing in close proximity to other plants gained an advantage at an early developmental stage. The table shows the total number of juvenile plants from five species that were found growing on bare ground and in patches of vegetation as well as the percentage of the total number of each species that were growing in patches of vegetation. For each of the five species, more than 50% of the juvenile plants were growing in patches of vegetation. The text notes, however, that a random distribution of plants across the landscape should result in only about 15% of the plants being found in patches of vegetation. In other words, for each of the five species, the percentage of juvenile plants found growing in patches of vegetation was substantially higher than could be explained by chance alone. This finding supports the claim in the text: if plants growing in patches are overrepresented among plants that have survived to the juvenile stage, as the data show they are, then it suggests that it’s advantageous for plants at an early stage of development to grow in patches of vegetation. Choice A is incorrect because the statement that less than 75% of juvenile plants were found growing in patches of vegetation, while true, doesn’t clearly support the claim that the plants growing in close proximity to other plants gained an advantage at an early developmental stage. Saying that less than 75% of plants were found in patches doesn’t indicate how the percentage growing in patches compares with the percentage that would be expected to grow in patches on the basis of chance alone, which is the information necessary to evaluate whether the claim in the text has support in the table. Put another way, if the percentage of plants found growing in patches was 15% or less, it would be true that less than 75% were found in patches, but the data would in fact weaken the claim in the text, not strengthen it, since the data would show that growing in patches wasn’t advantageous. Choice B is incorrect because only 12 plants of this species were found growing in patches, which was the lowest number of any species, not the greatest number. Additionally, even if it were true that this species had the greatest number of plants growing in patches, the finding would be irrelevant to the claim that plants of all five species gained an advantage by growing in close proximity to other plants. Choice C is incorrect because 59.1% of the plants of these species were found growing in patches, which is a far greater percentage, not a lower percentage, than what would be expected if plants were randomly distributed (around 15%). Additionally, if it were true that the percentage of plants growing in patches was lower for these species than what would be expected from chance alone, that finding would weaken, not strengthen, the claim that growing in patches is advantageous."},{"i":"0014477f","c":"graph","d":"E","s":"","o":["47.3 square miles.","77.1 square miles.","32.4 square miles.","595.7 square miles."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the comparison between Pueblo tribal nations. The student identifies that the total area of Taos Pueblo is 156.2 square miles and needs to complete the comparison with the total area of Nambé Pueblo. According to the table, Nambé Pueblo has a total area of 32.4 square miles. Choice A is incorrect because according to the table, 47.3 square miles is the area of Pueblo de San Ildefonso, not of Nambé Pueblo. Choice B is incorrect because according to the table, 77.1 square miles is the area of Santa Clara Pueblo, not of Nambé Pueblo. Choice D is incorrect because according to the table, 595.7 square miles is the area of Pueblo of Acoma, not of Nambé Pueblo."},{"i":"772835db","c":"fss","d":"H","s":"Most of the ice found on Earth is ice Ih, distinguished by a crystalline structure in which molecules form a hexagonal pattern. Amorphous ice, on the other hand, constitutes most of the ice in the ultrafrigid environment of outer space. Defined by a disorganized molecular structure, ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["ice Ih contains crystals, whereas amorphous ice, which lacks the thermal energy to form them, does not.","amorphous ice lacks the thermal energy to form the crystals found in ice Ih.","the lack of thermal energy in amorphous ice explains its inability to form the crystals found in ice Ih.","ice Ih differs from amorphous ice in that it possesses the thermal energy to form crystals."],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “amorphous ice” the subject of the sentence and places it immediately after the modifying phrase “defined…structure.” In doing so, this choice clearly establishes that amorphous ice—and not another noun in the sentence—is being described as having a disorganized molecular structure. Choice A is incorrect because it results in a dangling modifier. The placement of the noun “ice Ih” immediately after the modifying phrase illogically suggests that ice Ih has a disorganized molecular structure, whereas ice Ih is previously described as having molecules that form a hexagonal pattern. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “the lack of thermal energy” immediately after the modifying phrase illogically suggests that the lack of thermal energy has a disorganized molecular structure. Choice D is incorrect because it results in a dangling modifier. The placement of “ice Ih” immediately after the modifying phrase illogically suggests that ice Ih has a disorganized molecular structure, whereas ice Ih is previously described as having molecules that form a hexagonal pattern."},{"i":"c5d39bc7","c":"fss","d":"E","s":"Scientists believe that, unlike most other species of barnacle, turtle barnacles (Chelonibia testudinari) can dissolve the cement-like secretions they use to attach ______ to a sea turtle shell, enabling the barnacles to move short distances across the shell’s surface.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["it","themselves","them","itself"],"a":1,"r":"Choice B is the best answer. The convention being tested is pronoun-antecedent agreement. The plural reflexive pronoun “themselves” agrees in number with the plural antecedent “turtle barnacles,” correctly indicating what is attached to a sea turtle shell. Choice A is incorrect because the singular pronoun “it” doesn’t agree in number with the plural antecedent “turtle barnacles.” Choice C is incorrect because it results in an unclear and confusing sentence. In this context, it’s unclear what the plural pronoun “them” refers to. Choice D is incorrect because the singular reflexive pronoun “itself” doesn’t agree in number with the plural antecedent “turtle barnacles.”"},{"i":"7f1df833","c":"fss","d":"M","s":"In 1966, Emmett Ashford became the first African American to umpire a Major League Baseball game. His energetic gestures announcing when a player had struck out and his habit of barreling after a hit ball to see if it would land out of ______ transform the traditionally solemn umpire role into a dynamic one.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["bounds helped","bounds, helping","bounds that helped","bounds to help"],"a":0,"r":"Choice A is the best answer. The convention being tested is finite verb use in a main clause. A main clause requires a finite verb to perform the action of the subject (in this case, Ashford’s “gestures” and “habit”), and this choice supplies the finite past tense verb “helped” to indicate what Ashford’s gestures and habit helped accomplish. Choice B is incorrect because the non-finite participle “helping” doesn’t supply the main clause with a finite verb. Choice C is incorrect because the relative clause “that helped” doesn’t supply the main clause with a finite verb. Choice D is incorrect because the non-finite to-infinitive “to help” doesn’t supply the main clause with a finite verb."},{"i":"615f001e","c":"bound","d":"H","s":"Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this ______ the hole’s small size restricts light to a single ray, all light passing through the hole can only arrive at a single destination, eliminating diffraction and ensuring a clear image.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["works because","works. Because","works, it’s because","works: it’s because"],"a":1,"r":"Choice B is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used to correctly mark the boundary between one sentence (\"A ray...works\") and another (\"Because...image\"). Choice A is incorrect because it results in a run-on sentence. The two sentences (\"A ray…works\" and \"Because…image\") are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice D is incorrect because it results in a comma splice. Since the contraction \"it’s\" creates a main clause, the comma after \"single ray\" can’t be used in this way to mark the boundary between two main clauses (\"it’s...ray\" and \"all light…image\")."},{"i":"fcaff694","c":"bound","d":"M","s":"The city of Pompeii, which was buried in ash following the eruption of Mount Vesuvius in 79 CE, continues to be studied by archaeologists. Unfortunately, as ______ attest, archaeological excavations have disrupted ash deposits at the site, causing valuable information about the eruption to be lost.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["researchers, Roberto Scandone and Christopher Kilburn,","researchers, Roberto Scandone and Christopher Kilburn","researchers Roberto Scandone and Christopher Kilburn","researchers Roberto Scandone, and Christopher Kilburn"],"a":2,"r":"Choice C is the best answer. The convention being tested is the punctuation of a restrictive coordinated noun phrase. No punctuation is needed within or around the coordinated noun phrase “researchers Roberto Scandone and Christopher Kilburn” because it would create an illogical separation between the noun “researchers” and the coordinated noun phrase “Roberto Scandone and Christopher Kilburn.” Choice A is incorrect because no punctuation is needed. Placing a pair of commas around the coordinated noun phrase “Roberto Scandone and Christopher Kilburn” creates an illogical separation between the noun “researchers” and the aforementioned coordinated noun phrase. In this case, it illogically suggests that researchers in general bear the specific names Roberto Scandone and Christopher Kilburn. Choice B is incorrect because no punctuation is needed between the noun “researchers” and the coordinated noun phrase “Roberto Scandone and Christopher Kilburn.” Choice D is incorrect because no punctuation is needed within the coordinated noun phrase “Roberto Scandone and Christopher Kilburn.”"},{"i":"c40a1964","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Leigh Torres is a marine ecologist. She conducted a study of blue whales in New Zealand’s South Taranaki Bight region. She wanted to know how ocean temperature affects where the whales forage for krill in that region. She found that during a marine heat wave, the whales foraged farther offshore than they had during cooler periods. The offshore waters, which were colder than areas closer to shore, had a higher relative abundance of krill. The student wants to emphasize the aim of the research study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Analyzing ocean temperature data, Torres found that during a marine heat wave, blue whales foraged farther offshore than they had during cooler periods.","In her study, Torres sought to determine how ocean temperature affects where blue whales forage for krill in the South Taranaki Bight region.","Torres’s study revealed that blue whales were attracted to offshore waters with a relatively high abundance of krill.","Torres, a marine ecologist, studied blue whales in the South Taranaki Bight region, where the whales forage."],"a":1,"r":"Choice B is the best answer. The sentence emphasizes the aim, or goal, of the research study, noting that Torres sought to determine how ocean temperature affects where blue whales forage for krill. Choice A is incorrect. The sentence emphasizes the results of the study, noting what Torres found at the end; it doesn’t emphasize the aim, or goal, of the study, which is what Torres sought at the beginning. Choice C is incorrect. The sentence makes a claim about the study’s results; it doesn’t emphasize the aim, or goal, of the study. Choice D is incorrect. The sentence indicates the location of Torres’s study; it doesn’t emphasize the aim, or goal, of the study."},{"i":"af88c47a","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Freddie Wong (born 1985) is a director and special effects artist from the United States. He is best known for the action-comedy web series Video Game High School (VGHS). VGHS premiered in 2012 on RocketJump, a YouTube channel that Wong cocreated. The series was celebrated for its inventive video game–centric world and high-quality special effects. VGHS was nominated for a Producers Guild Award for Outstanding Digital Series. The student wants to begin a narrative about Wong’s award-nominated web series.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In 2012, director and visual effects artist Freddie Wong launched a new action-comedy web series: Video Game High School.","Video Game High School was celebrated for its inventive video game–centric world and high-quality special effects, and it was nominated for a Producer’s Guild Award for Outstanding Digital Series.","Wong, cocreator of the YouTube channel RocketJump, would go on to see his web series be nominated for a Producers Guild Award.","In 2012, Video Game High School premiered on RocketJump; it would later be nominated for an award."],"a":0,"r":"Choice A is the best answer. This choice introduces Wong and VGHS in an active and specific way, as if to an audience unfamiliar with the series. It also sets up the time and genre of the web series, which are useful ways to introduce the series of events in a narrative. Choice B is incorrect. This choice isn’t suited for beginning a narrative. A narrative is a story that follows a sequence of events and creates interest and suspense for the reader. This choice jumps to the end, explaining the success of VGHS without explaining what it is. Choice C is incorrect. This choice isn’t suited for beginning a narrative. It doesn’t actually introduce the web series by name. It just jumps to later in the story without sufficient explanation. Choice D is incorrect. This choice is not very effective for beginning a narrative. It doesn’t explain what VGHS is, and it doesn’t mention Wong."},{"i":"eea351c4","c":"trans","d":"M","s":"“Wishcycling”—putting nonrecyclable items into recycling bins under the mistaken belief that those items can be recycled—ultimately does more harm than good. Nonrecyclable items, such as greasy pizza boxes, can contaminate recyclable materials, rendering entire batches unusable. ______ nonrecyclable products can damage recycling plants’ machinery.\n\nWhich choice completes the text with the most logical transition?","o":["Fittingly,","On the contrary,","Moreover,","Nevertheless,"],"a":2,"r":"Choice C is the best answer. The first sentence tells us that “wishcycling” is harmful, the previous sentence gives us an example, and this sentence gives us another example. So “moreover”—a transition that indicates the addition of another supporting point—fits perfectly here. Choice A is incorrect. This choice uses a transition that means “appropriately” or “suitably,” which doesn’t make sense in context. This sentence adds another example of how “wishcycling” is harmful, so we’re looking for an addition transition. Choice B is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with the previous sentence. Both provide examples of how “wishcycling” is harmful. Choice D is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with the previous sentence. Both provide examples of how “wishcycling” is harmful."},{"i":"fc5e83cc","c":"trans","d":"E","s":"When following musical scores, professional opera singers like soprano Ana María Martínez take vocal directions from descriptive notations, typically in Italian, that appear alongside the musical notes. ______ these descriptive terms might guide the performer to sing giocoso (playfully) or lento (at a slow tempo).\n\nWhich choice completes the text with the most logical transition?","o":["On the other hand,","All the same,","For example,","In the second place,"],"a":2,"r":"Choice C is the best answer. \"For example\" logically signals that this sentence supports the previous information about the descriptive notations opera singers use by providing specific examples of these notations: giocoso (playfully) and lento (at a slow tempo). Choice A is incorrect because \"on the other hand\" illogically signals that the information in this sentence contrasts with the previous information about the descriptive notations opera singers use. Instead, the sentence provides examples of these notations. Choice B is incorrect because \"all the same\" illogically signals that the information in this sentence is true despite the previous information about the descriptive notations opera singers use. Instead, the sentence provides examples of these notations. Choice D is incorrect because \"in the second place\" illogically signals that the information in this sentence is a second point that is separate from the previous information about the descriptive notations opera singers use. Instead, the sentence provides examples of these notations."}],"img":{"df9c5a1d":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFUBAMAAAA0a/ICAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABcMUlEQVR42u1dd1gUx/v/zO4dHW4OsBeWYm9LsbfDEo0lnthiovFsUWPUUxON0UQssUSjqLFHxRJ7OY1JFI2e0Rg7hxo1FjhQYyxwc6gocHf7+wNQUJADgyHfH+/z+Hjszsy+85l33n3fd96dAUqohEqohEqohErof4Lom3gI98/ySUggAMBT4IXsZZR+2Up5U4AT8u6o0jfbH5457z5vlhdAMp75rDgJzV7UoStBZpFsDD6r3j3zgp/vs2vZmCLFRgx+y/bbWZMAAK7Wq7U0GdAJAAFibxx9XsiDgjt7VXjWiT05u0NjY7XPMHW+cSHHKLipsv50F+GqAoD5Z/cC4EABY/bR6hvqrMdImtW2EgAEF3XmXdf1mcw8uFYrE1Xul3vPnlsbIMUD4r0C50k5wVvgvETOL4a0BnXTuGzVylScbyv+hFBFAC4AfCh8iRAYDO+6QMUI1ylBKm/BEwInqDwDKGnlC8hEzksELnC3EUKDRF4F+iWdBD+VTFQKPAlSQVZbDa4VPP3hXVsFXunXFVhGvuFaY45KFkjOh4LrihAKcKFcFCXx2IcQ0FZBCCDbRD5UfpwXeBUJDAL6aBEMLgjuIuG8wCMYcI6ssNBPDZkImSiDt4gAsThIr87pU12t4AN7nTdfctHE1Nw2hbipZL9oDqxQntxe9UHwyWPAeWD4StUP8sgD34Wd3kngQbmg0wP3Hy8vHnPRHHlnTqTL/pvgo352/HMfcJS76BK1e/uUlZuBTZDR02OitjhEVvI+cQrb5ou0z3fqL74bfXqNCNfAP6MoXYpKH2/tenj0xK2B11apPv6uStRRYOLWkDgtTnAXHaPWO564I4/66WxY1M9OabVUK7b63t0uYP4ep/273Y/DHXDtrf6oTNRa4nie1P87imzdR7Zuqc1tPS7b+lMxgPfHGOcFxs6u2r6uC75wmWIYzp2H67QPlms1PqpbFbQbXXQfAtcPaP5yMhyTG/aXPbn7HQEtiL/ylltEv5oD0l1VyZ29kvv63SIV1nYpu3YkcONQpFx5fF+ZIz4Cucj74bJTTL0qOveqMS1LmeuKaOtoXBFw+UgLEe7BCXXVdGX9g/UdjR09H5bXXKwQcctlTsQnhH/kGrGP0r6OkZWE3xVhW93VW4YSTV
