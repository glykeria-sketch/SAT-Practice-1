<script>
const D={"t":"SATPractice12","q":[{"i":"d3104a68","c":"vocab","d":"M","s":"Birds sing to communicate over potentially great distances. For this reason, many researchers believe that birds in densely vegetated habitats generally sing at lower frequencies than birds living in comparatively sparse habitats, since dense vegetation tends to ______ the distance that high-frequency sounds can travel.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["exceed","diminish","encompass","conceal"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of birdsong. In this context, \"diminish\" means reduce or lessen. The text establishes that birds sing to communicate over potentially large distances and that researchers believe that birds that live in densely vegetated habitats sing at lower frequencies than birds that live in comparatively sparsely vegetated habitats. The text then explains that researchers hold this belief due to some effect of dense vegetation on the distance that high-frequency sounds can travel. If birds sing to communicate over long distances, it would be logical to conclude that researchers believe that birds in densely vegetated habitats sing at lower frequencies than birds in relatively sparse habitats do because dense vegetation diminishes the distance that high-frequency sounds can travel. Choice A is incorrect because nothing in the text suggests that dense vegetation can \"exceed,\" or surpass or go beyond, the distance that high- frequency sounds can travel. The text suggests that dense vegetation reduces the distance that high-frequency sounds can travel, not that dense vegetation goes farther than that distance. Choice C is incorrect because it would not be sensible to say that dense vegetation can \"encompass,\" or enclose or encircle, the distance that high-frequency sounds can travel. The distance that sounds can travel is not an object that can be enclosed or encircled by vegetation. Choice D is incorrect because there is no information in the text indicating that dense vegetation can \"conceal,\" or hide or keep from being observed, the distance that high-frequency sounds travel. Instead, the text suggests that dense vegetation reduces the distance that high-frequency sounds can travel."},{"i":"4480fae9","c":"vocab","d":"E","s":"The following text is adapted from Sui Sin Far’s 1912 short story “Mrs. Spring Fragrance.” Mr. and Mrs. Spring Fragrance immigrated to the United States from China. Mrs. Spring Fragrance was unaware that Mr. Spring Fragrance, tired with the day’s business, had thrown himself down on the bamboo settee on the veranda, and that although his eyes were engaged in scanning the pages of the Chinese World, his ears could not help receiving the words which were borne to him through the open window.\n\nAs used in the text, what does the word “receiving” most nearly mean?","o":["Denying","Entering","Carrying","Hearing"],"a":3,"r":"Choice D is the best answer because as used in the text, “receiving” most nearly means hearing, or perceiving sound. The text describes Mr. Spring Fragrance as he reads a newspaper, focusing on his eyes and ears. While his eyes look at the newspaper, he is unwillingly distracted by words coming through a nearby open window (that is, “his ears could not help receiving the words”). The words are being perceived specifically by his ears and not his eyes, and ears are the organs of sense with which one hears, so therefore Mr. Spring Fragrance is hearing the words through the open window. Choice A is incorrect because there is no indication in the text that Mr. Spring Fragrance is denying, or refusing the truth of, the words coming to him through the window. He is merely distracted by them. Choice B is incorrect because it wouldn’t make sense to say that Mr. Spring Fragrance’s ears couldn’t help entering, or coming into, the words coming to him through the window. Instead, the text indicates that the opposite occurs: that is, when Mr. Spring Fragrance hears the words, they enter his ears, but his ears don’t enter the words. Choice C is incorrect because it doesn’t make sense in this context to think of Mr. Spring Fragrance as carrying the words coming to him through the window, even though the word “carry” can have a number of different meanings depending on context: for example, he is not lifting them, he is not supporting them, and he is not accepting blame for them (as one “carries the blame” for a mistake)."},{"i":"9d73c9eb","c":"vocab","d":"E","s":"Osage Nation citizen Randy Tinker-Smith produced and directed the ballet Wahzhazhe, which vividly chronicles Osage history and culture. Telling Osage stories through ballet is ______ choice because two of the foremost ballet dancers of the twentieth century were Osage: sisters Maria and Marjorie Tallchief.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a suitable","a determined","an arbitrary","an unpredictable"],"a":0,"r":"Choice A is the best answer. “Suitable” means “appropriate for a particular purpose.” Since the text indicates that two of the best ballet dancers of the twentieth century were Osage, we can infer that the author believes that ballet is a very suitable artform for telling Osage stories. Choice B is incorrect. The text never suggests that Tinker-Smith’s choice was determined. That would imply that Tinker-Smith initially faced some kind of obstacle or opposition, and nothing like that is mentioned in the passage. Choice C is incorrect. The text implies the opposite of this. “Arbitrary” means “based on random choice or whim rather than reason.” But the text does give us a good reason behind the choice to tell Osage stories through ballet: two of the best ballet dancers of the twentieth century were Osage. Choice D is incorrect. The text never suggests that Tinker-Smith’s choice was “unpredictable.” Rather, the fact that two of the best ballet dancers of the twentieth century were Osage makes ballet especially appropriate for telling Osage stories."},{"i":"5d2fd27d","c":"vocab","d":"E","s":"While we can infer information about climate activity in Earth’s distant past from physical evidence, we of course cannot observe past climates directly. To study early Earth’s climate in action, we must ______ that climate using computer models that represent various climate conditions consistent with the physical evidence.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["invent","simulate","exaggerate","preserve"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of climate activity in Earth’s distant past. In this context, to “simulate” most nearly means to represent a natural process using computer models. According to the text, understanding Earth’s early climate is difficult because we cannot make direct observations of the distant past. Instead, scientists must create computer models that approximate early climate conditions, based on the physical evidence that those conditions left behind on Earth’s surface. This context supports the idea that computer models simulate Earth’s climate in the distant past. Choice A is incorrect because scientists use existing physical evidence as a basis for developing computer models that describe what Earth’s actual past climate might have been like. The models are not being used to “invent,” or imagine, a completely fictional climate. Choice C is incorrect because the computer models are being used in an attempt to describe as accurately as possible what Earth’s past climate might have been like. They are not attempting to “exaggerate,” or distort, those features. Choice D is incorrect because the computer models do not “preserve,” or protect from deterioration, Earth’s early climate; instead, they attempt to reproduce the characteristics of that climate, based on the remaining physical evidence of that climate."},{"i":"ad4f7362","c":"purpose","d":"H","s":"The following text is from John Dryden’s 1697 translation of Virgil’s poem the Aeneid, written in the first century BCE. Queen Dido has just heard the Trojan hero Aeneas recount a sad tale. But anxious cares already seiz’d the queen: She fed within her veins a flame unseen; The hero’s valor, acts, and birth inspire Her soul with love, and fan the secret fire. His words, his looks, imprinted in her heart, Improve the passion, and increase the smart.\n\nWhich choice best states the main purpose of the text?","o":["To indicate that Dido is hiding her skepticism of Aeneas’s account","To emphasize that Dido has been deeply affected by Aeneas’s story","To imply that Dido engages both emotionally and intellectually with Aeneas","To suggest that Dido is worried that Aeneas might discover a secret she is keeping from him"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text, which is to foreground Queen Dido’s strong emotional response to Aeneas’s story. Throughout, the text emphasizes how deeply the queen is affected by both Aeneas’s tale and persona. At the outset, the speaker explicitly states that \"anxious cares...seiz’d the queen\" and then uses the metaphor of fire (\"within her veins a flame unseen\" and \"secret fire\") to evoke the warmth of Dido’s feelings for Aeneas. In addition, the line \"His words, his looks, imprinted in her heart\" suggests the deep impression that Aeneas’s story makes on Dido, eliciting passion for him (\"improv[ing] the passion\") and empathy for his suffering (\"increas[ing] the smart\"). Choice A is incorrect because there’s no indication in the text that Dido is skeptical of Aeneas’s account, much less that she’s trying to conceal that skepticism. On the contrary, the text shows her being moved by his words and developing feelings for him. Choice C is incorrect. While the text mentions that Dido is impressed by Aeneas’s \"valor, acts, and birth,\" which might suggest (but doesn’t necessarily entail) intellectual engagement, the text doesn’t represent Dido’s engagement with Aeneas in a manner that suggests a balance between emotion and intellect. Rather, the text primarily emphasizes her emotional response—specifically her attraction to Aeneas and her emotional investment in his story, indicating that his \"valor, acts, and birth inspire / Her soul with love, and fan the secret fire\" and that his words and looks elicit passion and empathy. Choice D is incorrect because the text doesn’t suggest that Dido is worried about Aeneas discovering a secret she is concealing from him. Though the text begins by mentioning Dido’s \"anxious cares,\" this refers to her growing passion for Aeneas and pity for his suffering, not to worry about a secret she is concealing. The text’s reference to a \"flame unseen\" and \"secret fire\" points to Dido’s growing feelings for Aeneas that develop as he recounts his tale, not to a secret that existed before their encounter; moreover, the text provides no indication that Dido is worried Aeneas might discover these feelings."},{"i":"ff97fd53","c":"purpose","d":"M","s":"In 1973, poet Miguel Algarín started inviting other writers who, like him, were Nuyorican—a term for New Yorkers of Puerto Rican heritage—to gather in his apartment to present their work. The gatherings were so well attended that Algarín soon had to rent space in a cafe to accommodate them. Thus, the Nuyorican Poets Cafe was born. Moving to a permanent location in 1981, the Nuyorican Poets Cafe expanded its original scope beyond the written word, hosting art exhibitions and musical performances as well. Half a century since its inception, it continues to foster emerging Nuyorican talent.\n\nWhich choice best describes the overall purpose of the text?","o":["To explain what motivated Algarín to found the Nuyorican Poets Cafe","To situate the Nuyorican Poets Cafe within the cultural life of New York as a whole","To discuss why the Nuyorican Poets Cafe expanded its scope to include art and music","To provide an overview of the founding and mission of the Nuyorican Poets Cafe"],"a":3,"r":"Choice D is the best answer. The text presents a brief history of the Nuyorican Poets Cafe, from how it got started in the ’70s, to its expansion in the ’80s, to its ongoing mission today. Choice A is incorrect. This isn’t the overall purpose. The text never mentions Algarín’s motivations. Choice B is incorrect. This isn’t the overall purpose. The text never discusses the cultural life of New York as a whole. Choice C is incorrect. This is too narrow. One sentence mentions that the Nuyorican Poets Cafe expanded its scope to include art and music, but this is only one point in the broader history of the Nuyorican Poets Cafe, which is the overall focus of the text."},{"i":"1f2d6173","c":"func","d":"H","s":"Scholarly accounts of the Chicano movement—a movement that advocated for the social, political, and cultural empowerment of Mexican Americans and reached its zenith in the 1960s and 1970s—<u>tend to focus on the most militant, outspoken figures in the movement,<\/u> making it seem uniformly radical. Geographer Juan Herrera has shown, however, that if we shift our focus toward the way the movement manifested in comparatively low-profile neighborhood institutions and projects, we see participants espousing an array of political orientations and approaches to community activism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It presents a trend in scholarship on the Chicano movement that the text claims has been reevaluated by researchers in light of Herrera’s work on the movement’s participants.","It identifies an aspect of the Chicano movement that the text implies was overemphasized by scholars due to their own political orientations.","It describes a common approach to studying the Chicano movement that, according to the text, obscures the ideological diversity of the movement’s participants.","It summarizes the conventional method for analyzing the Chicano movement, which the text suggests creates a misleading impression of the effectiveness of neighborhood institutions and projects."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The text begins by mentioning scholarly accounts of the Chicano movement, which the underlined portion describes as tending \"to focus on the most militant, outspoken figures in the movement,\" making the movement as a whole seem uniformly radical. The text then indicates that the work of geographer Juan Herrera shows that focusing less on such militant figures and instead paying more attention to manifestations of the Chicano movement in less widely known neighborhood institutions and projects would reveal that the movement’s participants embraced a range of political orientations and approaches. Thus, the underlined portion describes a common approach to studying the Chicano movement that, according to the text, obscures the ideological diversity of the movement’s participants. Choice A is incorrect. Though the underlined portion does present a trend in scholarship on the Chicano movement, the text does not indicate that other scholars have reevaluated their methods in light of Herrera’s work. It only indicates that Herrera’s work suggests that the work of those other scholars does not provide a complete picture of the Chicano movement. Choice B is incorrect. Though the underlined portion does identify an aspect of the Chicano movement that the text indicates has been overemphasized, the text does not discuss the political orientations of the scholars whose work is mentioned in the text. Choice D is incorrect. Though the underlined portion does summarize the conventional method for analyzing the Chicano movement, the rest of the text does not address the effectiveness of \"comparatively low-profile neighborhood institutions and projects.\" Instead, the text suggests that those projects were led by people with a variety of approaches to community activism."},{"i":"1b5d4e3e","c":"func","d":"E","s":"Were penguins always flightless? <u>Theresa Cole and her team argue that penguins could fly at some point, but that they lost that ability more than 60 million years ago as they adapted to marine life.<\/u> After examining various penguin fossils and genetic information, the researchers concluded that over time penguins developed underwater vision, blood oxygenation, and bone density better suited for swimming than flying. Thus, environmental conditions might have driven penguins to change from flyers to swimmers.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It defines a scientific term used in the sentence that follows.","It contradicts a description in the sentence that follows.","It provides an answer to the question in the previous sentence.","It notes that the question in the previous sentence has not been researched."],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The text begins with a question: have penguins always been unable to fly? The underlined sentence then presents an answer that has been offered by researchers, indicating that Theresa Cole and her team believe that penguins were once able to fly but lost that ability long ago as they began living in the sea. The text then describes the research that led to that answer. Thus, the function of the underlined sentence is to provide an answer to the question in the previous sentence. Choice A is incorrect because none of the terms used in the sentence that follows are defined in the underlined sentence; no definitions are given at all. Instead, the sentence presents Theresa Cole and her team’s answer to the earlier question about penguins’ ability to fly. Choice B is incorrect because there is no contradiction between the underlined sentence and the sentence that follows since both convey that at some point penguins underwent adaptations that limited their ability to fly and helped them swim and live in the sea. Instead of contradicting later information, the underlined sentence presents an answer to the earlier question about penguins’ ability to fly. Choice D is incorrect because the question in the previous sentence is about penguins’ ability to fly and the underlined sentence presents Theresa Cole and her team’s answer to that question based on their research into penguin flight, which is described in the rest of the text."},{"i":"f6352bd3","c":"structure","d":"M","s":"Many archaeologists assume that large-scale engineering projects in ancient societies required an elite class to plan and direct the necessary labor. However, recent discoveries, such as the excavation of an ancient canal near the Gulf Coast of Alabama, have complicated this picture. Using radiocarbon dating, a team of researchers concluded that the 1.39-kilometer-long canal was most likely constructed between 576 and 650 CE by an Indigenous society that was relatively free of social classes.\n\nWhich choice best describes the overall structure of the text?","o":["It describes a common view among archaeologists, then discusses a recent finding that challenges that view.","It outlines a method used in some archaeological fieldwork, then explains why an alternative method is superior to it.","It presents contradictory conclusions drawn by archaeologists, then evaluates a study that has apparently resolved that contradiction.","It identifies a gap in scientific research, then presents a strategy used by some archaeologists to remedy that gap."],"a":0,"r":"Choice A is the best answer. The text starts by introducing a common view among archaeologists about the need for an elite class to direct large-scale engineering projects. Then, it discusses the discovery of a large canal most likely built by a society without an elite class, which challenges the first view. Choice B is incorrect. Although the text discusses carbon dating as an archaeological method, it doesn’t compare it to any other alternative methods. Choice C is incorrect. The study doesn’t resolve any contradictions—rather, it introduces a contradiction to the one view presented at the beginning of the text. Choice D is incorrect. The text never identifies any gaps in scientific research."},{"i":"2c50ed1a","c":"cross","d":"E","s":"Text 1 Literary scholars have struggled with the vastness of Nigerian writer Wole Soyinka’s collective works of drama (spanning over 20 plays in total). It is best, however, to understand Soyinka’s body of work as a dramatist chronologically. Soyinka’s progression as a playwright can be considered to fall into three periods, with each one representing a particular thematic and stylistic cohesion: the 1960s, the two decades between 1970 and 1990, and lastly, from roughly 1990 onwards.\n\nText 2 It is tempting to impose a linear sense of order on the expanse of Wole Soyinka’s body of work as a dramatist. However, critics who have considered Soyinka’s plays to fit neatly into three phases overlook potential commonalities in Soyinka’s work that span across these phases. Additionally, this view may discount significant differences in the styles and content of plays written around the same time.\n\nWhich choice best describes a difference in how the author of\n\nText 1 and the author of\n\nText 2 view the study of Soyinka’s works of drama?","o":["While the author of Text 1 believes that thinking about Soyinka’s works of theater in phases is useful, the author of Text 2 views such an approach as limiting.","Although the author of Text 1 claims that Soyinka’s style as a dramatist has evolved over time, the author of Text 2 argues that Soyinka’s style has remained consistent throughout his career.","The author of Text 1 considers Soyinka’s plays to showcase his strongest writing, whereas the author of Text 2 believes that Soyinka’s poetry is where he is most skilled.","The author of Text 1 argues that Soyinka’s early plays were his most politically charged, whereas the author of Text 2 claims that Soyinka’s most recent plays are the most politicized."],"a":0,"r":"Choice A is the best answer. The author of Text 1 states that Soyinka’s progression as a playwright can be considered to fall into three periods, implying that this is a helpful way to understand his works. The author of Text 2, on the other hand, challenges this view and says that it overlooks potential commonalities and differences in Soyinka’s work across what Text 1 calls distinctive stylistic phases. Choice B is incorrect. This choice overstates the central claim of Text 2. The author of Text 2 argues against the chronological progression supported in Text 1, but does not go so far as to say that Soyinka’s style remained consistent. In fact, Text 2 points out “significant differences in styles and content” among Soyinka’s plays. Choice C is incorrect. Neither of the texts mention Soyinka’s poetry, nor do they rank his dramatic writing relative to his other work. Choice D is incorrect. Neither text discusses the political aspects of Soyinka’s plays, nor do they make any claims about whether they have changed over time."},{"i":"dcca0dfc","c":"main","d":"H","s":"The following text is from Mick Herron’s 2023 novel The Secret Hours. The narrator is describing members of a government committee. Finally, and adding much-needed gravitas, was Sir Winston Day, whose features seemed moulded to adorn a bust, or possibly a stamp, and whose forehead was so evidently bulging with grey matter that it would have been impertinent to inquire too closely into the actual achievements his half century of public service had produced. His recently published memoirs possibly cast light on this enigma, but given that such details were not provided until after the thirty-page mark, they might as well have remained state secrets. ©2023 by Mick Herron Based on the text, which choice best describes Sir Winston Day?","o":["He has the appearance of a distinguished figure, but it is uncertain whether he has accomplished anything to earn distinction.","He looks like a person worthy of respect, but his memoirs reveal that some of his actions were dishonorable.","He would be a celebrated public figure if his achievements did not have to be kept secret.","He has maintained a modest profile even though he has served the public capably for many years."],"a":0,"r":"Choice A is the best answer because it accurately describes Sir Winston Day as he is portrayed in the text. The text indicates that Sir Winston’s “features seemed moulded to adorn a bust, or possibly a stamp,” suggesting that he appeared distinguished. But the text also indicates that his “actual achievements” during his long public service constitute an “enigma,” or mystery, highlighting the point with a joke about Sir Winston’s uninteresting memoirs (any information about his achievements past the first thirty pages “might as well have remained state secrets” since, it’s implied, no one bothered to read that far). Thus, the text suggests that Sir Winston appears distinguished even though his known accomplishments, if any, are relatively few. Choice B is incorrect because nothing in the text indicates that Sir Winston behaved dishonorably. Rather, the text indicates that his “actual achievements” during his long public service constitute an enigma, or mystery, suggesting that he may have done very little, not that what he has done was disreputable. Choice C is incorrect. Although the text says that Sir Winston’s achievements that appear “after the thirty-page mark” in his memoirs “might as well have remained state secrets,” this is a joke about the public’s lack of interest in the memoirs, not a sincere claim that secrecy was intended. Choice D is incorrect because the text does not associate Sir Winston with modesty, nor does it suggest that he was a capable public servant. Rather, by indicating that Sir Winston’s “features seemed moulded to adorn a bust, or possibly a stamp,” the text suggests that Sir Winston’s appearance communicated importance, not modesty. The text further indicates that his “actual achievements” during his long public service constitute an enigma, or mystery, suggesting that he may have done very little, not that he was particularly capable."},{"i":"5325b3cc","c":"main","d":"M","s":"Philadelphia’s Black Pearl Chamber Orchestra, founded by Jeri Lynne Johnson, performs classical music, from well-known compositions by Beethoven to contemporary works by Jessie Montgomery. For the orchestra’s iConduct! program, Johnson invites community members to learn some basic elements of conducting and then experience conducting the Black Pearl orchestra themselves.\n\nWhich choice best states the main idea of the text?","o":["The Black Pearl orchestra performs music from all over the world but mostly performs music composed by Philadelphians.","Johnson founded the Black Pearl orchestra to perform classical music by contemporary artist Jessie Montgomery.","The Black Pearl orchestra gives community members the chance to both listen to and participate in classical music performance.","Johnson has community members conduct an orchestra to demonstrate how difficult the task is."],"a":2,"r":"Choice C is the best answer because it most accurately states the main idea of the text. The text begins by stating that the Black Pearl orchestra performs classical music, and then goes on to explain that the orchestra offers an iConduct! program. According to the text, this program offers community members the opportunity to learn some basics about conducting and then apply what they learn by conducting the orchestra themselves. Thus, the main idea of the text is that community members can both listen to and participate in a classical music performance. Choice A is incorrect. Although the text states that the Black Pearl orchestra is based in Philadelphia, it doesn’t indicate that most of the music it plays was composed by Philadelphians. Choice B is incorrect. Although the text does state that Johnson founded the Black Pearl orchestra, this is just a detail and not the main focus of the text. Moreover, while the text does say that the orchestra sometimes plays music by Montgomery, it doesn’t assert that the orchestra was founded solely for the purpose of performing Montgomery’s work. Choice D is incorrect. Although the text explains that community members are invited to conduct the Black Pearl orchestra after participating in the iConduct! program, the text doesn’t indicate that Johnson allows community members to do this for the specific purpose of showing how difficult the task is."},{"i":"3cc2eacc","c":"infer","d":"M","s":"In a study of the mechanisms underlying associative memory—or the ability to learn and remember connections between inherently unrelated things—neuroscientists Kei Igarashi, Jasmine Chavez, and others presented mice with memory tests. The team discovered that fan cells, a type of cell found in the medial temporal lobe of the brain, are necessary for the acquisition of new associative memories. They also found that fan cell activity requires dopamine, a chemical the brain produces in response to pleasure and rewards. Consequently, receiving a reward should likely help to ______ Which choice most logically completes the text?","o":["decrease an individual’s capacity to utilize dopamine.","increase an individual’s capacity to recognize differences between unrelated things.","increase an individual’s capacity to form associative memories.","decrease an individual’s capacity to create fan cells."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the mechanisms underlying associative memory. The text explains that fan cells—a type of brain cell—are necessary for the acquisition of new associative memories, and that activity among these cells requires a chemical known as dopamine, which the brain produces in response to rewards. Since the brain cells that enable the formation of associative memories require dopamine in order to function, and since the brain produces dopamine in response to rewards, it can be inferred that receiving a reward should likely help to increase an individual’s capacity to form associative memories. Choice A is incorrect because the relationship between rewards and dopamine sketched by the text is that rewards result in the production of dopamine, not that they cause an individual’s capacity to utilize dopamine to decrease. Choice B is incorrect. The text suggests that receiving a reward would produce dopamine and thereby assist with associative memory formation. However, the text never suggests that associative memory involves the capacity to recognize differences between unrelated things, indicating only that associative memory involves remembering what connects those things. Choice D is incorrect because the text never discusses how fan cells are initially created and therefore provides no evidence for a conclusion about how receiving a reward would affect their creation."},{"i":"aaddd60f","c":"infer","d":"H","s":"Scientists studying Mars long thought the history of its crust was relatively simple. One reason for this is that geologic and climate data collected by a spacecraft showed that the crust was largely composed of basalt, likely as a result of intense volcanic activity that brought about a magma ocean, which then cooled to form the planet’s surface. A study led by Valerie Payré focused on additional information—further analysis of data collected by the spacecraft and infrared wavelengths detected from Mars’s surface—that revealed the presence of surprisingly high concentrations of silica in certain regions on Mars. Since a planetary surface that formed in a mostly basaltic environment would be unlikely to contain large amounts of silica, Payré concluded that ______ Which choice most logically completes the text?","o":["the information about silica concentrations collected by the spacecraft is likely more reliable than the silica information gleaned from infrared wavelengths detected from Mars’s surface.","high silica concentrations on Mars likely formed from a different process than that which formed the crusts of other planets.","having a clearer understanding of the composition of Mars’s crust and the processes by which it formed will provide more insight into how Earth’s crust formed.","Mars’s crust likely formed as a result of other major geological events in addition to the cooling of a magma ocean."],"a":3,"r":"Choice D is the best answer. Cooling magma would create basalt, but “a planetary surface that formed in a mostly basaltic environment would be unlikely to contain large amounts of silica.” Since Mars’s crust does contain large amounts of silica, it is unlikely that Mars’s crust was formed exclusively by cooling magma. Therefore, there were likely other major geological events that created the high silica concentrations. Choice A is incorrect. Although the passage discusses these two methods of collecting data about Mars’s crust, it never compares their reliability, so there’s no basis for this inference. Choice B is incorrect. The passage never mentions anything about the crusts of other planets, so there’s no basis for this inference. Choice C is incorrect. The passage never mentions Earth’s crust, so there’s no basis for this inference."},{"i":"94ca8ebd","c":"claim","d":"M","s":"A student is examining a long, challenging poem that was initially published in a quarterly journal without explanatory notes, then later republished in a stand-alone volume containing only that poem and accompanying explanatory notes written by the poet. The student asserts that the explanatory notes were included in the republication primarily as a marketing device to help sell the stand-alone volume.\n\nWhich statement, if true, would most directly support the student’s claim?","o":["The text of the poem as published in the quarterly journal is not identical to the text of the poem published in the stand-alone volume.","Many critics believe that the poet’s explanatory notes remove certain ambiguities of the poem and make it less interesting as a result.","The publishers of the stand-alone volume requested the explanatory notes from the poet in order to make the book attractive to readers who already had a copy of the poem in a journal issue.","Correspondence between the poet and the publisher reveals that the poet’s explanatory notes went through several drafts."],"a":2,"r":"Choice C is the best answer because it would most directly support the student’s claim about the motivation for including explanatory notes with the stand-alone volume of the poem. The text explains that the poem had previously been published without the notes in a quarterly journal. It stands to reason that readers who had purchased the journal issue containing the poem would be unlikely to purchase an unchanged version of the poem in a stand-alone volume. However, the inclusion of notes in that volume would encourage the purchase of a stand-alone volume, since the later text would differ from the original by including the author’s own explanation of the poem. Therefore, if it were true that the publishers of the stand-alone volume had requested the notes to make the book attractive to readers who already had a copy of the journal issue, this fact would support the student’s claim that the notes were included primarily as a marketing device. Choice A is incorrect because the student’s claim is about the motivation for including the explanatory notes in the stand-alone volume, not about changes that might have been made to the poem itself for publication in that volume; moreover, the text never suggests that such changes were made. Choice B is incorrect because the student’s claim is about why the explanatory notes were included in the stand-alone volume, not about how the notes affected readers’ and critics’ subsequent experience of the poem. Choice D is incorrect because the fact that the poet drafted multiple versions of the explanatory notes doesn’t directly address the issue of whether the notes were intended as a marketing device, as the student claims; the correspondence would support this claim only if it showed that the poet had revised the notes specifically to make them useful to the marketing of the stand-alone volume."},{"i":"b32c4b3a","c":"claim","d":"H","s":"The Intertropical Convergence Zone (ITCZ), a band of clouds that encircles Earth in the tropics and is a major rainfall source, shifts position in response to temperature variations across Earth’s hemispheres. Data from Huagapo Cave in Peru suggest the ITCZ shifted south during the Little Ice Age (circa 1300–1850), but a shift as far into South America as Huagapo should have led to dry conditions in Central America, which is inconsistent with climate models. To resolve the issue, geologist Yemane Asmerom and colleagues collected data from Yok Balum Cave in Central America and compared them with the Huagapo data. They concluded that during the Little Ice Age, the ITCZ may have expanded northward and southward rather than simply shifted.\n\nWhich finding from Asmerom and colleagues’ study, if true, would most directly support their conclusion?","o":["Neither the Yok Balum data nor the Huagapo data show significant local variations in temperature during the Little Ice Age.","Both the Yok Balum data and the Huagapo data show increased temperatures and prolonged dry conditions during the Little Ice Age.","The Yok Balum data show prolonged dry conditions during the same portions of the Little Ice Age in which the Huagapo data show heightened levels of rainfall.","The Yok Balum data and the Huagapo data show strongly correlated patterns of high rainfall during the Little Ice Age."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would support Asmerom and colleagues’ conclusion that the ITCZ may have expanded northward and southward rather than shifting south during the Little Ice Age. The text indicates that the ITCZ, a band of clouds in the tropics that is a significant rainfall source, can change position. Data from Peru’s Huagapo Cave suggest that the ITCZ shifted south during the Little Ice Age. But according to the text, if the ITCZ moved into South America in that way, then Central America should have been drier than climate models suggest it was. In other words, rainfall should have been reduced in Central America because the ITCZ, a significant rainfall source, had shifted into South America, but climate models do not show such a reduction in Central America. The text goes on to say that Asmerom and colleagues tried to resolve this apparent conflict by collecting data from Yok Balum cave in Central America and comparing them with data from Huagapo, which led the researchers to conclude that the ITCZ may have expanded both northward and southward rather than simply shifting south. If it is true that Yok Balum in Central America and Huagapo in South America show strongly correlated patterns of high rainfall during the Little Ice Age, such a finding would support Asmerom and colleagues’ conclusion by suggesting that the two areas were affected by the same rainfall source, and thus that the ITCZ may have expanded rather than shifted. Choice A is incorrect because there is no information in the text about how, if at all, the ITCZ affects temperature in areas where it is located. Rather, the text states that temperature variations across Earth’s hemispheres can shift the position of the ITCZ. Finding that neither Yok Balum nor Huagapo data show evidence of significant local variations in temperature during the Little Ice Age would have no clear bearing on Asmerom and colleagues’ claim. Choice B is incorrect because finding that both Yok Balum and Huagapo experienced prolonged dry conditions during the Little Ice Age would not support Asmerom and colleagues’ conclusion that the ITCZ, a major source of rainfall, may have expanded northward and southward rather than simply shifting south. Dry conditions in both locations would suggest that the ITCZ did not cover either location. Additionally, finding that temperatures were elevated in both locations would have no clear bearing on Asmerom and colleagues’ conclusion, since there is no information in the text that indicates how, if at all, the ITCZ affects temperature. Choice C is incorrect because finding that Yok Balum experienced prolonged dry conditions at the same time that Huagapo experienced high rainfall would weaken Asmerom and colleagues’ conclusion, not strengthen it. Such a finding would suggest that the ITCZ shifted south and left Central America dry rather than expanding both northward and southward."},{"i":"3233c162","c":"graph","d":"H","s":"","o":["a substantial increase in oxygenation in the Alboran Sea corresponded with the local decline in L. pertusa, but the opposite relationship between oxygenation and L. pertusa was found near the Mauritanian coast.","L. pertusa declined in the Alboran Sea during a period of substantial local decline in oxygenation, but L. pertusa declined near the Mauritanian coast during a period of little local change in oxygenation.","oxygenation in the Alboran Sea was higher before the decline in L. pertusa than after the decline, whereas oxygenation near the Mauritanian coast was relatively low both before and after the decline in L. pertusa.","oxygenation in the Alboran Sea tended to be substantially higher than oxygenation near the Mauritanian coast during the period studied."],"a":1,"r":"Choice B is the best answer because it effectively uses data from the graph to complete the statement about Rodrigo da Costa Portilho-Ramos and colleagues’ conclusion. The graph shows the ratio of manganese to calcium in L. pertusa coral samples from the Alboran Sea and the Mauritanian coast. The graph reflects time in approximate years before present: in other words, the greater the number in years noted on the graph’s horizontal axis, the farther that moment is in the past. The text indicates that the researchers tested the samples to determine whether oxygenation played a role in the decline of L. pertusa. The text goes on to note that a change in the ratio of manganese to calcium would signal an inverse, or opposite, change in oxygenation. According to the graph, the ratio of manganese to calcium in samples from the Alboran Sea increased from about 30 micromoles per mole 10,000 years ago to about 80 micromoles per mole 8,000 years ago, which means that oxygenation decreased between 10,000 and 8,000 years ago. Meanwhile, there was almost no discernible change in the ratio of manganese to calcium in samples from the Mauritanian coast between 12,000 and 10,000 years ago. According to the text, the population of L. pertusa declined significantly around 9,000 years ago in the Alboran Sea and around 11,000 years ago near the Mauritanian coast. Thus, the increase in the ratio of manganese to calcium around 9,000 years ago in the Alboran Sea coincides with the decline in the L. pertusa population, suggesting an association between the decrease in oxygenation and the decline in population of the coral. No such relationship is suggested around 11,000 years ago near the Mauritanian coast. So, oxygenation likely played a role in the L. pertusa decline in the Alboran Sea but not in the coral’s decline near the Mauritanian coast. Choice A is incorrect because it asserts the opposite of what the graph indicates regarding oxygenation in the Alboran Sea, and it misrepresents what the graph indicates about oxygenation near the Mauritanian coast. The graph indicates that at the time of the decline in L. pertusa (approximately 9,000 years ago), the samples from the Alboran Sea contained a ratio of manganese to calcium that was increasing. According to the text, this ratio inversely correlates with ocean oxygenation levels, so if the ratio was increasing, oxygenation was decreasing, not substantially increasing. Furthermore, the graph shows that the ratio of manganese to calcium remained relatively stable in coral samples from the Mauritanian coast during the period studied, which suggests that there was no discernible relationship between oxygenation and the coral’s population decline in that location, not that there was a substantial decrease in oxygenation corresponding to the coral’s decline. Choice C is incorrect. Although the graph suggests that the level of oxygenation in the Alboran Sea was higher before the decline in L. pertusa than after— because the ratio of manganese to calcium inversely correlates with ocean oxygenation levels and this ratio was lower before the decline than after—the graph doesn’t support the claim that oxygenation near the Mauritanian coast was consistently low before and after the coral’s decline there. Rather, the graph indicates that relative to coral samples from the Alboran Sea, the ratio of manganese to calcium in samples from near the Mauritanian coast was consistently low, which suggests that oxygenation levels were relatively high both before and after the decline of L. pertusa. Choice D is incorrect because it states the opposite of what the graph indicates: the graph shows that throughout the period studied, the ratio of manganese to calcium was higher in coral samples from the Alboran Sea than it was in samples from near the Mauritanian coast. Since the text indicates that the ratio of manganese to calcium inversely correlates with ocean oxygenation levels, oxygenation in the Alboran Sea was therefore lower than, not higher than, oxygenation near the Mauritanian coast during the period studied. Moreover, even if choice D did accurately represent the graph, it wouldn’t effectively complete the statement since a comparison of the ocean oxygenation levels at the two locations is not relevant to the claim that a decline in oxygenation levels was associated with the decline of L. pertusa in the Alboran Sea but not near the Mauritanian coast."},{"i":"5ff1ba73","c":"graph","d":"E","s":"","o":["there were 49 guilds in Bordeaux but 72 guilds in Lyon despite the two cities having nearly equal numbers of inhabitants.","Lyon had far fewer inhabitants than Paris did but had many more guilds.","there was one guild for every 661 inhabitants in Rouen but one guild for every 4,511 inhabitants in Paris.","Paris had 133 guilds and 600,000 inhabitants, or one guild for every 4,511 inhabitants."],"a":2,"r":"Choice C is the best answer. The claim we’re trying to prove is that guilds were much more numerous relative to population in some cities than others. This choice describes the guilds per number of inhabitants in two cities (Rouen and Paris), showing significant differences between guilds relative to population in these cities. Choice A is incorrect. This choice misreads the table. Bordeaux had 80,000 inhabitants, according to the table, while Lyon had 143,000, so it isn’t correct to say that they had \"nearly equal numbers of inhabitants.\" Lyon had almost twice as many inhabitants. Choice B is incorrect. This choice misreads the table. Although Lyon did have fewer inhabitants than Paris, it didn’t have more guilds—Paris had 133 guilds versus Lyon’s 72. Choice D is incorrect. This choice doesn’t support the claim. To show that guilds were more numerous relative to population in some cities than others, we would need to compare at least two cities, and this choice only mentions one."},{"i":"57998dd3","c":"fss","d":"E","s":"Obsidian is a kind of volcanic glass formed when lava cools so quickly that the atoms inside it cannot arrange themselves in a crystalline structure. You ______ more about obsidian’s structure, which is classified as amorphous, in a later chapter.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["had learned","had been learning","will learn","have learned"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the future tense verb “will learn,” used in conjunction with the phrase “in a later chapter,” correctly indicates that “you” (the reader) are going to learn about obsidian’s structure at some point in the future. Choice A is incorrect because the past perfect verb “had learned” doesn’t indicate that the subject is going to learn about obsidian’s structure in the future. Choice B is incorrect because the past perfect progressive verb “had been learning” doesn’t indicate that the subject is going to learn about obsidian’s structure in the future. Choice D is incorrect because the present perfect verb “have learned” doesn’t indicate that the subject is going to learn about obsidian’s structure in the future."},{"i":"e44db0a0","c":"fss","d":"M","s":"Because a cycle of lunar phases ______ 29.5 days to complete, it’s possible to observe two full moons in a single month, one at the beginning and one at the end.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are taking","have taken","take","takes"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The singular verb \"takes\" agrees in number with the singular subject \"a cycle of lunar phases.\" Choice A is incorrect because the plural verb \"are taking\" doesn’t agree in number with the singular subject \"a cycle of lunar phases.\" Choice B is incorrect because the plural verb \"have taken\" doesn’t agree in number with the singular subject \"a cycle of lunar phases.\" Choice C is incorrect because the plural verb \"take\" doesn’t agree in number with the singular subject \"a cycle of lunar phases.\""},{"i":"52b61716","c":"fss","d":"E","s":"Formed in 1967 to foster political and economic stability within the Asia-Pacific region, the Association of Southeast Asian Nations was originally made up of five members: Thailand, the Philippines, Singapore, Malaysia, and Indonesia. By the end of the 1990s, the organization ______ its initial membership.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has doubled","had doubled","doubles","will double"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the past perfect verb “had doubled” properly indicates that the doubling of the organization’s initial membership occurred during a specific period before the present (between the organization’s founding in 1967 and the end of the 1990s). Choice A is incorrect because the present perfect verb “has doubled” doesn’t indicate that the organization’s doubling of its initial membership occurred during a specific period in the past. Choice C is incorrect because the present tense verb “doubles” doesn’t indicate that the organization’s doubling of its initial membership occurred during a specific period in the past. Choice D is incorrect because the future tense verb “will double” doesn’t indicate that the organization’s doubling of its initial membership occurred during a specific period in the past."},{"i":"cfe23776","c":"bound","d":"M","s":"According to the original text of the US Constitution, written in 1787, the presidential candidate receiving the second-most Electoral College votes becomes vice president. The 12th amendment, ratified in ______ separated the elections for the two offices.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["1804—","1804,","1804:","1804"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after “1804” pairs with the comma after “amendment” to separate the supplementary element “ratified in 1804” from the rest of the sentence. This supplementary element functions to provide additional information on the term “12th amendment,” and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because a dash can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence. Choice C is incorrect because a colon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because it fails to use appropriate punctuation to separate the supplemental element from the rest of the sentence."},{"i":"333b2b65","c":"bound","d":"E","s":"While one requires oxygen and one does ______ and anaerobic respiration are both forms of cellular respiration—that is, they are processes by which cells break down glucose to use as energy.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["not aerobic","not. Aerobic","not, aerobic","not; aerobic"],"a":2,"r":"Choice C is the best answer. A comma is the appropriate way to link the dependent clause “While...not” and the independent clause that follows. Choice A is incorrect. This choice creates a run-on sentence error. “While...not” is a dependent clause, which must be separated from the independent clause that follows with some sort of punctuation. Choice B is incorrect. This choice creates a sentence fragment. “While one requires oxygen and one does not” isn’t an independent clause, so it can’t stand alone as a complete sentence. Choice D is incorrect. This choice creates a punctuation error. “While one requires oxygen and one does not” isn’t an independent clause, so it can’t be linked to the clause that follows with a semicolon."},{"i":"92dec236","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Maika’i Tubbs is a Native Hawaiian sculptor and installation artist. His work has been shown in the United States, Canada, Japan, and Germany, among other places. Many of his sculptures feature discarded objects. His work Erasure (2008) includes discarded audiocassette tapes and magnets. His work Home Grown (2009) includes discarded pushpins, plastic plates and forks, and wood. The student wants to emphasize a similarity between the two works.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Erasure (2008) uses discarded objects such as audiocassette tapes and magnets; Home Grown (2009), however, includes pushpins, plastic plates and forks, and wood.","Tubbs’s work, which often features discarded objects, has been shown both within the United States and abroad.","Like many of Tubbs’s sculptures, both Erasure and Home Grown include discarded objects: Erasure uses audiocassette tapes, and Home Grown uses plastic forks.","Tubbs completed Erasure in 2008 and Home Grown in 2009."],"a":2,"r":"Choice C is the best answer. This choice most effectively emphasizes \"a similarity\" by identifying a trait the works share: \"both Erasure and Home Grown include discarded objects.\" Choice A is incorrect. This choice doesn’t \"emphasize a similarity.\" Instead, this choice shows how the materials used in the two works are different. Notice the use of the contrast word \"however.\" Choice B is incorrect. This choice doesn’t \"emphasize a similarity between the two works.\" While it says that Tubbs’s work \"often features discarded objects,\" it doesn’t provide details about the two works in question. Choice D is incorrect. This choice doesn’t \"emphasize a similarity.\" Instead, this choice shows how the works were produced at different times."},{"i":"5d3177aa","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In the early 1960s, the US had a strict national-origins quota system for immigrants. The number of new immigrants allowed from a country each year was based on how many people from that country lived in the US in 1890. This system favored immigrants from northern Europe. Almost 70% of slots were reserved for immigrants from Great Britain, Ireland, and Germany. The 1965 Hart-Celler Act abolished the national-origins quota system. The student wants to present the significance of the Hart-Celler Act to an audience unfamiliar with the history of US immigration.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Almost 70% of slots were reserved for immigrants from Great Britain, Ireland, and Germany at the time the Hart-Celler Act was proposed.","Prior to the Hart-Celler Act, new immigration quotas were based on how many people from each country lived in the US in 1890.","The quota system in place in the early 1960s was abolished by the 1965 Hart-Celler Act.","The 1965 Hart-Celler Act abolished the national-origins quota system, which favored immigrants from northern Europe."],"a":3,"r":"Choice D is the best answer. The sentence presents the significance of the Hart-Celler Act to an audience unfamiliar with the history of US immigration, noting that the 1965 act abolished the national-origins quota system and explaining why that mattered, historically: because the old quota system had favored immigrants from northern Europe. Choice A is incorrect. The sentence describes an aspect of immigration policy at the time the Hart-Celler Act was proposed; it doesn’t present the significance of the Hart-Celler Act to an audience unfamiliar with the history of US immigration. Choice B is incorrect. The sentence describes an aspect of immigration policy before the Hart-Celler Act; it doesn’t describe or present the significance of the act to an audience unfamiliar with the history of US immigration. Choice C is incorrect. While the sentence indicates that the Hart-Celler Act abolished the old quota system, it doesn’t explain the act or the quota system to an audience unfamiliar with the history of US immigration."},{"i":"db8fe023","c":"trans","d":"E","s":"A potter choosing which type of clay to use for a piece considers two key factors: the desired look of the piece and its intended use. ______ earthenware clay is often used for decorative pieces because of its rustic look. This type of clay is not often used in industrial settings, though, because it is less durable than other clays.\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","Regardless,","In conclusion,","For example,"],"a":3,"r":"Choice D is the best answer. The previous sentence tells us that potters think about the look and use of a piece when selecting clay. This sentence provides a specific example of a type of clay selected for its appearance, so the transition \"for example\" fits perfectly. Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea. But this sentence does more than just restate the previous idea. Instead, it provides a more specific example of the idea presented in the first sentence. Choice B is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with the previous sentence. Both sentences suggest that desired look plays a role in the selection of clay types for pottery pieces. Choice C is incorrect. This choice uses a concluding transition. But this sentence doesn’t sum up the previous sentence. Instead, it gives a specific example of the idea presented in the previous sentence."},{"i":"a204d618","c":"trans","d":"E","s":"In 1949, Frank Zamboni developed an ice rink resurfacing machine. As Zamboni’s machine moved along the rink’s surface, it first scraped off the top layer of ice. ______ it sprayed water into the deep grooves left behind by customers’ skates. Lastly, it smoothed over the newly formed ice.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","Next,","Similarly,","In contrast,"],"a":1,"r":"Choice B is the best answer. \"Next\" logically signals that the action in this sentence—the water spraying—is the next step in the resurfacing process, following the ice scraping mentioned in the previous sentence. Choice A is incorrect because \"for example\" illogically signals that the action in this sentence is an example of the action in the previous sentence. Instead, the water spraying is the next step in a process that begins with the ice scraping. Choice C is incorrect because \"similarly\" illogically signals that the action in this sentence is similar to the action in the previous sentence. Instead, the water spraying is the next step in a process that begins with the ice scraping. Choice D is incorrect because \"in contrast\" illogically signals that the action in this sentence contrasts with the action in the previous sentence. Instead, the water spraying is the next step in a process that begins with the ice scraping."}],"img":{"3233c162":"iVBORw0KGgoAAAANSUhEUgAAArwAAAIjBAMAAAATpNXmAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABl60lEQVR42u1dd2BT1dt+zk3SdOckZc/bspSZtiwBIWwHI2xF1AAyZGhQmaIW/UAZagFBQMAiDpZS9oYgIMoMS5DVFESQ0ZyU2ZGc748k7U0XBVt/rb3PH23uPeeee89z3/ue933PAmTIkCFDhgwZMmTIkCFDhgwZMmTIkFG8QPJIo/kvhj60sP8wIrxEhWUypvhYhBaANp9lCK0BQKUHECE9H+55TZG+L0MwFHqthCLCrmLeghgA0NGylHpFzV8DLKDw/yYXSfSwJXj/b+4bA8DPAKCdVK57u7PWHr/U+z0QEED5Fikp8qzc2+gUANpEWtvKAI6YEPJn3h99oN79o87sagYAgSZfgaeeAzKtWmvfey4pMbpBGY/lwoyNip2batGAg/0BYfpe5eqNwGYLXlovfLoPg2asw3MHvlesWkdmbe+G5ptRdnuMYlUspR8c0LfYLAIzADyx3RxoEnbE9lKZSU/V67+VPagHeqkHH9SDbASEhd9jyIzYRWuE0YfMqjVk4VoMP0NLAL27hY2CsaVxuthCnF/tF4IKS0YYh7cB9q3H9+uF1i2Mn3Ub0fpExThl6wk0tdQp4ZfycSN0hqeNC4AqA5S/lF8DbAJQvdqGIPMr/Q3T1HHCpoCTT96rZQXmBdxVxwPvtYbC+LT+x+id/RcIKdX+8IsLMr9XxlK9BOheXm7aWdfadNFuA5698L0 function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
