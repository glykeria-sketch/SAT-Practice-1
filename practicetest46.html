<script>
const D={"t":"Practicetest46","q":[{"i":"fa7a89f1","c":"vocab","d":"E","s":"Studying how workload affects productivity, Maryam Kouchaki and colleagues found that people who chose to do relatively easy tasks first were less ______ compared to those who did hard tasks first. Finishing easy tasks gave participants a sense of accomplishment, but those who tackled hard tasks first actually became more skilled and productive workers over time.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["secretive","efficient","outgoing","unsympathetic"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion about Kouchaki and colleagues’ research into how workload affects productivity. In context, “efficient” means effective or well organized. The text indicates that, according to Kouchaki and colleagues’ research, people who worked on hard tasks first were “more skilled and productive” than those who did easy tasks first. This context conveys the idea that despite their sense of accomplishment, the people who chose to do the easy tasks first were less efficient or productive than those who tackled hard tasks first. Choice A is incorrect because there’s nothing in the text to suggest that workers who do easy tasks first are less “secretive,” or uncommunicative or silent, than those who do hard tasks first. Rather, the text suggests that people are less skillful or efficient if they tackle easy tasks before the hard ones. Choice C is incorrect because “outgoing” means openly friendly, which wouldn’t make sense in this context. The text focuses on Kouchaki and colleagues’ research in which people who worked on hard tasks first were “more skilled and productive” than those who did easy tasks first and were therefore less efficient. Choice D is incorrect because there’s nothing in the text to suggest that workers who do easy tasks first are less “unsympathetic,” or insensitive or unkind, than those who do hard tasks first. Rather, the text suggests that people are less skillful or efficient if they tackle easy tasks before the hard ones."},{"i":"44cc5f75","c":"vocab","d":"E","s":"Artificially delivering biomolecules to plant cells is an important component of protecting plants from pathogens, but it is difficult to transmit biomolecules through the layers of the plant cell wall. Markita del Carpio Landry and her colleagues have shown that it may be possible to ______ this problem by transmitting molecules through carbon nanotubes, which can cross cell walls.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["conceptualize","neglect","illustrate","overcome"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of delivering biomolecules to plant cells. In this context, “overcome” means to succeed in dealing with an obstacle. The text suggests that although it’s difficult to move biomolecules through plant cell walls, Landry and her colleagues have shown that carbon nanotubes may be useful, since they can cross cell walls. This context conveys that Landry and her colleagues think it’s possible, using carbon nanotubes, to succeed in dealing with the obstacle of transmitting biomolecules to plant cells. Choice A is incorrect because it wouldn’t make sense in context to say that Landry and her colleagues have shown that it may be possible to “conceptualize,” or form an idea of, the difficulty of transmitting biomolecules through the walls of plant cells. The text presents this difficulty as a known problem that Landry and her colleagues think they may have solved, not as a mysterious occurrence that they have yet to form ideas about. Choice B is incorrect because the text suggests that Landry and her colleagues think it may be possible to successfully deal with the problem of transmitting biomolecules through the walls of plant cells, not that Landry and her colleagues think it may be possible to “neglect,” or simply to disregard and ignore the problem. Choice C is incorrect because it wouldn’t make sense in context to say that Landry and her colleagues have shown that it may be possible to “illustrate,” or demonstrate, the difficulty of transmitting biomolecules through the walls of plant cells by using carbon nanotubes. According to the text, carbon nanotubes allow molecules to be transmitted to plant cells—something that is otherwise difficult to do. The text therefore presents carbon nanotubes as a way of possibly solving a problem, not as a means of demonstrating the problem."},{"i":"e3ffb854","c":"vocab","d":"E","s":"The following text is adapted from John Matheus’s 1925 short story “Fog.” The fog extended its tentacles over city and river, gradually obliterating traces of familiar landscapes. At five-thirty the old Panhandle bridge, supported by massive sandstone pillars, stalwart, as when erected fifty years before to serve a generation now passed behind the portals of life, had become a spectral outline against the sky.\n\nAs used in the text, what does the word “supported” most nearly mean?","o":["Held up","Encouraged","Improved on","Defended"],"a":0,"r":"Choice A is the best answer because as used in the text, \"supported\" most nearly means held up or sustained physically. The sentence describes the physical structure of the Panhandle bridge, stating it was \"supported by massive sandstone pillars.\" This clearly refers to the structural relationship between the bridge and its pillars—the pillars physically hold up the bridge and keep it standing. The text further emphasizes the physical nature of this support by describing the pillars as \"stalwart\" (strong and sturdy) and noting they’ve been performing this function for fifty years. Choice B is incorrect. Although in some contexts \"supported\" can mean \"encouraged,\" the sandstone pillars and bridge described in the text are all inanimate objects that can’t provide or receive encouragement. The text clearly describes a structural relationship between the elements of the bridge, not an emotional one. Choice C is incorrect. Although in some contexts \"supported\" has a meaning similar to \"improved on,\" the text doesn’t suggest that the sandstone pillars have enhanced or made the bridge better; rather, they simply provide the necessary physical foundation to keep the bridge standing. Thus, the sentence describes the structural elements of the bridge, not improvements made to it. Choice D is incorrect. Although in some contexts \"supported\" can mean \"defended,\" the text doesn’t present a situation in which the sandstone pillars are defending the bridge from a threat. Instead, the description focuses on the physical structure of the bridge, in which the pillars hold the bridge up and ensure its stability."},{"i":"b44066dc","c":"vocab","d":"M","s":"Economist Jingting Fan argues that the effects of international trade may display spatial variation at sub-national levels. For instance, imported goods may reduce expenses for a country’s average consumer, but for consumers living far from ports, high intranational transport costs could ______ the price advantages associated with imports.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["nullify","denigrate","underestimate","misconstrue"],"a":0,"r":"Choice A is the best answer because it logically completes the text’s discussion of imported goods and consumer prices. In this context, \"nullify\" most nearly means negate or undermine. The text indicates that importing goods to a country can reduce consumer prices in that country, then cautions that the costs of transporting goods within the country is also a factor. These transportation costs likely raise the prices that must be paid by people who live far from the ports of entry. Therefore, the intranational transportation costs could nullify the price advantages to consumers of importing goods. Choice B is incorrect. In this context, \"denigrate\" would most nearly mean disparage or deny the importance of. Since transportation costs would not be capable of denying the importance of price advantages, it would not make sense to state that intranational transportation costs denigrate the price advantages of importing goods. Choice C is incorrect. In this context, \"underestimate\" would most nearly mean predict a lower value for, or to undervalue, someone or something. Though transportation costs might be undervalued, they cannot themselves undervalue something else, so it would not make sense to state that intranational transportation costs underestimate the price advantages of importing goods. Choice D is incorrect. In this context, \"misconstrue\" would most nearly mean misunderstand. Since transport costs are not capable of understanding, it would not make sense to claim that intranational transportation costs misconstrue the price advantages of importing goods."},{"i":"af43b0bd","c":"purpose","d":"M","s":"Researchers have long hypothesized that woolly mammoths were hunted to extinction in North America by humans using spears with grooved tips known as Clovis points. One anthropologist set out to test this hypothesis. Using a mechanical spear-thrower, he launched spears with Clovis points into mounds of clay—substitutes for the animals’ large bodies. The projectiles generally penetrated only a few inches into the clay, an amount insufficient to have harmed most woolly mammoths. This led the anthropologist to conclude that hunters using spears with Clovis points likely weren’t the principal drivers of the extinction.\n\nWhich choice best states the main purpose of the text?","o":["To argue for the significance of new findings amid an ongoing debate among researchers","To discuss the advantages and disadvantages of the method used in an experiment","To summarize two competing hypotheses and a major finding associated with each one","To describe an experiment whose results cast doubt on an established hypothesis"],"a":3,"r":"Choice D is the best answer because it most accurately states the main purpose of the text, which is to describe an experiment whose results cast doubt on an established hypothesis. The text begins by noting that researchers have long believed that woolly mammoths were hunted to extinction in North America by humans using spears with Clovis points. The text then describes an experiment conducted by an anthropologist to test this hypothesis. According to the text, the results of the experiment led the anthropologist to conclude that hunters using spears with Clovis points likely weren’t the primary cause of the extinction. The anthropologist’s results cast doubt on the long-held hypothesis presented at the beginning of the text and suggest that woolly mammoths may have become extinct in North America due to some other cause. Choice A is incorrect because there’s nothing in the text to suggest that researchers have been involved in an ongoing debate. On the contrary, the text suggests that most researchers agree on the cause of the woolly mammoth’s extinction in North America. Choice B is incorrect because the text never mentions any advantages or disadvantages of the method used in the experiment, focusing instead on the results achieved using that method. Choice C is incorrect because the text addresses only one hypothesis, that mammoths were hunted to extinction in North America by humans using spears with Clovis points. Rather than present a competing hypothesis, the text explains how one anthropologist designed an experiment to test this long-held hypothesis."},{"i":"a086c2cb","c":"purpose","d":"E","s":"Built in the 1970s, Raccoon Mountain is a pumped-storage hydropower facility (a “water-battery”) located in the United States along the Tennessee River. When energy demand is low, excess power from the regional electric utility’s nuclear plants is used to pump water (from a lower reservoir filled from the Tennessee River) up a shaft to the summit lake, where the water is stored as gravitational potential energy. When energy demand peaks, the water drains down from the summit lake, spinning turbines and generating upward of 1,700 megawatts of power— enough to power one million homes for twenty hours.\n\nWhich choice best states the main purpose of the text?","o":["To point out the differences between two methods of energy generation","To explain the basics of how a specific energy technology works","To encourage regional electric utilities to build energy storage facilities","To discuss the benefits of a new energy technology"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text, which is to explain the basics of how a specific energy technology works. The text introduces Raccoon Mountain as a pumped-storage hydropower facility built in the 1970s and then explains how it operates: during periods of low demand, excess power pumps water up to a lake at the mountain’s summit, and when demand for energy peaks, the water flows back down, spinning turbines along the way to generate electricity. The text provides some additional details, like the name of the water source, but the overall focus is on explaining the basics of how pumped-storage hydropower works. Choice A is incorrect because the text focuses on one method of energy generation—pumped-water hydropower—and briefly mentions another type of energy generation (nuclear plants) only to identify it as a source of power for the pumping process. The text never makes any comparison between the two methods. Choice C is incorrect because the text simply gives a factual description of how Raccoon Mountain, a pumped- storage hydropower facility, operates; it never suggests that more energy storage facilities should be built, whether by regional utilities or by any other entity. Choice D is incorrect because the text doesn’t present pumped-storage hydropower as a new technology; it indicates that Raccoon Mountain was built in the 1970s, meaning that, rather than being new, this facility is approximately 50 years old."},{"i":"ac5bf490","c":"func","d":"E","s":"The following text is from Reyna Grande’s 2012 memoir The Distance Between Us. In the text, Grande reflects on a time when she and her older sister Mago were children. A Barbie is a type of doll. I begged Mago to come play with me. She wasn’t as interested in my Barbie as she had been just two months before, <u>which made me sad because that was the only thing Mago had envied me for<\/u>. Usually, it was me doing the envying. After I pestered her relentlessly, she finally put her notebook down and came over to me. ©2012 by Reyna Grande Which choice best describes the function of the underlined portion in the text?","o":["It indicates Grande’s unhappiness over Mago’s disinterest in Grande’s doll.","It expresses Grande’s anger over Mago’s refusal to spend time with her.","It presents an example of how Mago and Grande generally played together as children.","It provides a reason for why Mago is unwilling to play with Grande."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined portion in the text. The underlined portion (\"which made me sad because that was the only thing Mago had envied me for\") directly expresses Grande’s unhappiness about her sister’s diminished interest in her Barbie doll. The underlined text specifically identifies that Grande feels sad and explains why Mago’s disinterest particularly affects her—because it was the one rare instance where her older sister had envied her, rather than the reverse. Choice B is incorrect because the underlined portion expresses sadness, not anger. Although there is some correspondence between the emotions anger and envy and the text does indicate that Grande usually envies her sister, the underlined portion states that Grande feels sad about Mago’s disinterest in Grande’s Barbie, not angry about Mago’s refusal to spend time with her. Choice C is incorrect. While the first part of the sentence that contains the underlined portion indicates that Mago has previously taken an interest in Grande’s Barbie, implying that the sisters may regularly have played with the Barbie together in the past, the underlined portion doesn’t provide an example of this. The underlined portion instead explains why Mago’s recently developed disinterest in the Barbie saddens Grande. Choice D is incorrect because neither the underlined portion nor the text as a whole explains why Mago is unwilling to play with Grande. Rather than addressing Mago’s motivation or reasoning, the underlined portion describes Grande’s emotional reaction to Mago’s disinterest in Grande’s Barbie and explains why this lack of interest matters to Grande."},{"i":"a70cbc53","c":"func","d":"H","s":"Raymond Antrobus, an accomplished poet and writer of prose, recently released his debut spoken word poetry album, The First Time I Wore Hearing Aids, in collaboration with producer Ian Brennan. The album contains both autobiographical and reflective pieces combining Antrobus’s spoken words with Brennan’s fragmented audio elements and pieces of music to convey how people who are deaf may experience sound, both its presence and absence. Some critics suggest that the album questions the function of sound in the world, highlighting that the experience of sound is multifaceted.\n\nWhich choice best describes the overall structure of the text?","o":["It introduces a collaborative spoken word poetry project, details the approach taken to produce the work, and then provides an example of critique the album received upon release.","It mentions a collection of spoken word poems, distinguishes one poem as being an exemplar on the album, and then offers a summary of the subject matter of the whole collection.","It summarizes the efforts to produce a collection of spoken word poems, presents biographies of two people who worked on the album, and speculates about the meaning behind the poetry.","It connects two artists to the same spoken word poetry project, explains the extent of their collaboration on each poem, and then provides an overview of the technique used to produce the work."],"a":0,"r":"Choice A is the best answer. The text first introduces the album as being a collaboration between Antrobus and Brennan, then describes the approach taken to produce it, then mentions how critics have said that it calls into question the function of sound. Choice B is incorrect. While the text does mention a collection of spoken word poems, it doesn’t single out one poem as being particularly noteworthy. Additionally, the text doesn’t simply summarize the subject matter—it goes into detail about the content and production of the album. Choice C is incorrect. The text doesn’t provide biographical information about the two artists, and the text doesn’t speculate about the meaning behind the poetry—instead, it relays what some critics have said about the album. Choice D is incorrect. The text doesn’t provide just an overview of the production techniques used but instead goes into more detail about the content and audio elements of the album, as well as critical response to the album."},{"i":"159ef46d","c":"cross","d":"E","s":"Text 1 Although food writing is one of the most widely read genres in the United States, literary scholars have long neglected it. And within this genre, cookbooks attract the least scholarly attention of all, regardless of how well written they may be. This is especially true of works dedicated to regional US cuisines, whose complexity and historical significance are often overlooked.\n\nText 2 With her 1976 cookbook The Taste of Country Cooking, Edna Lewis popularized the refined Southern cooking she had grown up with in Freetown, an all-Black community in Virginia. She also set a new standard for cookbook writing: the recipes and memoir passages interspersing them are written in prose more elegant than that of most novels. <u>Yet despite its inarguable value as a piece of writing, Lewis’s masterpiece has received almost no attention from literary scholars.<\/u> Based on the two texts, how would the author of\n\nText 1 most likely regard the situation presented in the underlined sentence in\n\nText 2?","o":["As typical, because scholars are dismissive of literary works that achieve popularity with the general public","As unsurprising, because scholars tend to overlook the literary value of food writing in general and of regional cookbooks in particular","As justifiable, because Lewis incorporated memoir into The Taste of Country Cooking, thus undermining its status as a cookbook","As inevitable, because The Taste of Country Cooking was marketed to readers of food writing and not to readers of other genres"],"a":1,"r":"Choice B is the best answer. Text 1 states that literary scholars ignore regional cookbooks most of all, even when they have historical significance and are well written. So the author of Text 1 wouldn’t be surprised that scholars ignored Edna Lewis’s cookbook. Choice A is incorrect. We can’t infer that this is how the author of Text 1 would regard the situation. Text 1 never suggests that scholars are dismissive of popular works in general. Instead, Text 1 says that scholars ignore food writing specifically, despite its popularity—and despite the fact that it can be historically significant and complex. Choice C is incorrect. We can’t infer that this is how the author of Text 1 would regard the situation. Text 1 never suggests that elements of other genres should be kept out of cookbooks. Choice D is incorrect. We can’t infer that this is how the author of Text 1 would regard the situation. Text 1 never discusses how food writing is or should be marketed."},{"i":"2fdfe002","c":"main","d":"H","s":"The following text is adapted from Countee Cullen’s 1926 poem “Thoughts in a Zoo.” They in their cruel traps, and we in ours, Survey each other’s rage, and pass the hours Commiserating each the other’s woe, To mitigate his own pain’s fiery glow. Man could but little proffer in exchange Save that his cages have a larger range. That lion with his lordly, untamed heart Has in some man his human counterpart, Some lofty soul in dreams and visions wrapped, But in the stifling flesh securely trapped.\n\nBased on the text, what challenge do humans sometimes experience?","o":["They cannot effectively tame certain wild animals because of a lack of compassion.","They cannot focus on setting attainable goals because of a lack of motivation.","They quickly become frustrated when faced with difficult tasks because of a lack of self-control.","They have aspirations that cannot be fulfilled because of certain limitations."],"a":3,"r":"Choice D is the best answer. The text metaphorically likens humans to animals in a zoo, suggesting that humans have dreams that they cannot fulfill because they are trapped. Choice A is incorrect. The speaker says that the lion has an “untamed heart,” but the speaker doesn’t actually mention anything about humans taming wild animals or a lack of compassion. Choice B is incorrect. The speaker doesn’t suggest that humans lack motivation. Rather, the speaker thinks that humans are “trapped” and prevented from achieving their dreams. Choice C is incorrect. The speaker doesn’t mention anything about humans becoming frustrated or lacking self-control. Rather, the speaker thinks that humans are “trapped” and prevented from achieving their dreams."},{"i":"5325b3cc","c":"main","d":"M","s":"Philadelphia’s Black Pearl Chamber Orchestra, founded by Jeri Lynne Johnson, performs classical music, from well-known compositions by Beethoven to contemporary works by Jessie Montgomery. For the orchestra’s iConduct! program, Johnson invites community members to learn some basic elements of conducting and then experience conducting the Black Pearl orchestra themselves.\n\nWhich choice best states the main idea of the text?","o":["The Black Pearl orchestra performs music from all over the world but mostly performs music composed by Philadelphians.","Johnson founded the Black Pearl orchestra to perform classical music by contemporary artist Jessie Montgomery.","The Black Pearl orchestra gives community members the chance to both listen to and participate in classical music performance.","Johnson has community members conduct an orchestra to demonstrate how difficult the task is."],"a":2,"r":"Choice C is the best answer because it most accurately states the main idea of the text. The text begins by stating that the Black Pearl orchestra performs classical music, and then goes on to explain that the orchestra offers an iConduct! program. According to the text, this program offers community members the opportunity to learn some basics about conducting and then apply what they learn by conducting the orchestra themselves. Thus, the main idea of the text is that community members can both listen to and participate in a classical music performance. Choice A is incorrect. Although the text states that the Black Pearl orchestra is based in Philadelphia, it doesn’t indicate that most of the music it plays was composed by Philadelphians. Choice B is incorrect. Although the text does state that Johnson founded the Black Pearl orchestra, this is just a detail and not the main focus of the text. Moreover, while the text does say that the orchestra sometimes plays music by Montgomery, it doesn’t assert that the orchestra was founded solely for the purpose of performing Montgomery’s work. Choice D is incorrect. Although the text explains that community members are invited to conduct the Black Pearl orchestra after participating in the iConduct! program, the text doesn’t indicate that Johnson allows community members to do this for the specific purpose of showing how difficult the task is."},{"i":"db876fd5","c":"infer","d":"M","s":"Songbirds learn to respond to and imitate their species’ songs from an early age. With each generation, small differences are introduced that result in distinct variations—called dialects—among geographically isolated populations of the same species. A research study examined whether twelve-day-old Ficedula hypoleuca (pied flycatcher) nestlings prefer local dialects over the unfamiliar dialects of nonlocal F . hypoleuca populations: the more begging calls the nestlings made in response to a song, the stronger their preference. The researchers found that nestlings produced more begging calls in response to their own dialect than to nonlocal dialects. Since song preference plays a role in songbird mate selection, the finding suggests that ______ Which choice most logically completes the text?","o":["F . hypoleuca nestlings’ preference for their own dialect likely disappears as they mature to promote socialization between different F . hypoleuca populations.","F . hypoleuca nestlings who show an early preference for their own dialect are likely to receive more food from their caretakers than nestlings who show no preferences among any F . hypoleuca dialects.","F . hypoleuca nestlings’ preference for their own dialect likely drives them when they mature to reproduce with other F . hypoleuca from local rather than nonlocal populations.","F . hypoleuca nestlings show a preference for both local F . hypoleuca dialects and the songs of other local songbirds over the songs of nonlocal birds of any species."],"a":2,"r":"Choice C is the best answer. Because “song preference plays a role in songbird mate selection,” and because F . hypoleuca nestlings display a preference for local dialects, we can infer that they will be more likely to choose mates from local populations. Choice A is incorrect. We don’t have any information suggesting that this preference disappears, so there’s no basis for this inference. Choice B is incorrect. Although the passage discusses the number of begging calls made in response to various F . hypoleuca dialects, no mention is made about the amount of food received based on dialect preference. Therefore, there’s no basis for this inference. Choice D is incorrect. There’s no mention in the passage of methods of other types of local songbirds, so there’s no basis for this inference."},{"i":"df654a2b","c":"infer","d":"M","s":"Zines are small-scale, self-printed magazines. They have been around since the Black literary zine Fire!! was created in the 1920s. Since then, zines have appealed to creators looking for an inexpensive form of expression to share with a select audience. Zine creators often mix art with social commentary and challenge mainstream culture. At first, the internet appeared to replace the zine, but this old form persists. Today, there are enough zines in the United States to support annual zine festivals. This suggests that ______ Which choice most logically completes the text?","o":["creators can reach a larger audience by posting online.","zines are still a meaningful form of expression.","creators can continue to explore new art forms.","zines are good sources of mainstream culture."],"a":1,"r":"Choice B is the best answer because it most logically follows from the text’s point about zines today. The text describes zines as a form of expression that goes back to the 1920s and asserts that \"this old form persists.\" The text then indicates that multiple zines exist in the US today and that they are popular enough to support annual festivals, a point that suggests that people continue to view zines as a meaningful form of expression. Choice A is incorrect because the text’s point about current interest in zines in the US doesn’t logically suggest that zine creators can reach a larger audience by posting online. The text indicates that zines have long had an audience, and there’s no indication that online posts have caused that audience to grow; there’s no mention of zine creators’ use of the internet at all. Choice C is incorrect because the idea that zine creators can explore new art forms—while objectively true—isn’t logically connected to the text’s discussion of zines as an existing form of expression (one that often includes art) or the point that zines are still popular enough in the US to support annual festivals. Choice D is incorrect because the point that zines are popular enough in the US today to support annual festivals doesn’t logically suggest that zines present mainstream culture (or are themselves mainstream); moreover, the text states that zine creators often \"challenge mainstream culture.\""},{"i":"44da37eb","c":"claim","d":"H","s":"The variety of species with adaptations to produce toxins is matched by the variety of uses of those toxins: northern stargazers, for example, use toxins for defense, whereas tiger snakes use toxins for predation and skeleton shrimp use toxins for intraspecific competition. In fact, a species may have adaptations enabling it to produce a toxin with multiple uses. Finding that the venom used by the Panamanian scorpion Centruroides granosus to subdue prey also inhibits growth of the pathogenic bacteria Escherichia coli, Dumas Gálvez and colleagues conclude that the particular form of venom production observed in C. granosus may have propagated through the species because it mitigates risk during feeding in addition to enhancing predation success.\n\nWhich finding, if true, would most directly support Gálvez and colleagues’ conclusion?","o":["E. coli does not appear to be virulent for C. granosus even when transmitted from prey captured without the use of venom.","E. coli is frequently found in species preyed on by C. granosus and can survive exposure to the digestive juices of C. granosus.","C. granosus appears to be chemically sensitive to prey infected with E. coli and tends to favor uninfected individuals.","Exposure to C. granosus venom also inhibits the growth of nonpathogenic bacteria species common in the native environment of C. granosus."],"a":1,"r":"Choice B is the best answer because it presents a finding that, if true, would most directly support Dumas Gálvez and colleagues’ conclusion that the venom produced by the scorpion species Centruroides granosus helps mitigate, or reduce, risk during feeding in addition to enhancing predation success. According to the text, Gálvez and colleagues found that the venom used by C. granosus both subdues prey and inhibits the growth of Escherichia coli, a pathogen that, if ingested by C. granosus, would presumably cause disease unless neutralized in some way. If it were true that E. coli is commonly found in species preyed on by C. granosus and, moreover, can withstand C. granosus’s digestive juices after ingestion, this would suggest that C. granosus likely relies on another mechanism to neutralize E. coli to make E. coli-infected prey safe for consumption by the scorpion species. Given that, as the text states, C. granosus’s venom was found to inhibit the pathogen’s growth, it therefore follows that the venom provides protection for C. granosus against E. coli that its digestive system wouldn’t otherwise provide, making it reasonable to conclude that the trait may have spread through the species because it mitigates risk during feeding. Choice A is incorrect because a finding that E. coli doesn’t appear to be virulent, or dangerous, for C. granosus even when venom isn’t used would weaken rather than strengthen Gálvez and colleagues’ conclusion that a particular form of venom production spread in C. granosus in part because it helps reduce risk during feeing, since this finding would suggest that E. coli isn’t actually a risk to C. granosus when consuming prey. Choice C is incorrect because a finding that C. granosus can detect and avoid consuming E. coli-infected prey in the first place would suggest that an ability other than venom production is the primary factor that reduces C. granosus’s risk when feeding, which would suggest there has been less evolutionary pressure to develop venom that provides protection; thus, this finding wouldn’t clearly support the conclusion that C. granosus’s form of venom production spread in the species in part because it helps reduce risk during feeding. Choice D is incorrect because Gálvez and colleagues’ conclusion focuses on C. granosus venom in relation to the risk of E. coli, and a finding that the venom also inhibits nonpathogenic (not disease-causing) bacteria species, which presumably don’t pose a risk if consumed, wouldn’t be relevant to the conclusion that C. granosus’s particular form of venom production spread in the species in part because it helps reduce risk during feeding."},{"i":"25176ff8","c":"claim","d":"M","s":"“Mrs. Spring Fragrance” is a 1912 short story by Sui Sin Far. In the story, Mrs. Spring Fragrance, a Chinese immigrant living in Seattle, is traveling in California. In letters to her husband and friend, she demonstrates her concern for what’s happening at her home in Seattle while she is away: ______ Which quotation from Mrs. Spring Fragrance’s letters most effectively illustrates the claim?","o":["“My honorable cousin is preparing for the Fifth Moon Festival, and wishes me to compound for the occasion some American ‘fudge,’ for which delectable sweet, made by my clumsy hands, you have sometimes shown a slight prejudice.”","“Next week I accompany Ah Oi to the beauteous town of San José. There will we be met by the son of the Illustrious Teacher.”","“Forget not to care for the cat, the birds, and the flowers. Do not eat too quickly nor fan too vigorously now that the weather is warming.”","“I am enjoying a most agreeable visit, and American friends, as also our own, strive benevolently for the accomplishment of my pleasure.”"],"a":2,"r":"Choice C is the best answer because it presents a quotation that illustrates the claim that Mrs. Spring Fragrance demonstrates concern for what’s happening at home while she’s in California. By giving reminders to “care for the cat, the birds, and the flowers,” “not eat too quickly,” and avoid engaging in strenuous activity in the heat, Mrs. Spring Fragrance shows that she’s thinking about what’s happening at home and wants to ensure everything is taken care of. Choice A is incorrect because the quotation, while it does suggest that Mrs. Spring Fragrance has made fudge at home before, is focused on preparations for an upcoming festival, not on concerns for anything happening at home while Mrs. Spring Fragrance is away. Choice B is incorrect because the quotation has to do with an upcoming event during Mrs. Spring Fragrance’s trip—visiting San José and meeting someone new—rather than her concern for what’s happening at home. Choice D is incorrect because the quotation is focused on how Mrs. Spring Fragrance feels about her trip and the friends she’s seeing, not on her concern for what’s happening at home."},{"i":"54be8f96","c":"graph","d":"H","s":"","o":["1.51 days, which is the shortest rotational period of any of the TRAPPIST planets.","6.1 days, and its rotational period is also 6.1 days.","9.21 days, which is the same as the rotational period of TRAPPIST -1f.","6.1 days, and its rotational period is 0.92 days."],"a":1,"r":"Choice B is the best answer because it correctly uses data from the table to illustrate the relationship between orbital and rotational periods described in the text. For Earth and each of four TRAPPIST -1 exoplanets, the table provides the orbital period and radius (in relation to the radius of Earth). The text explains that for each TRAPPIST -1 exoplanet, gravitational forces cause the rotational period (how long the planet takes to spin once on its axis) to equal the orbital period (how long the planet takes to orbit the star). According to the table, TRAPPIST -1e has an orbital period of 6.1 days. Since the text states that the orbital and rotational periods are equal for these planets, TRAPPIST -1e’s rotational period must also be 6.1 days. Choice A is incorrect because the table shows that TRAPPIST -1e has an orbital period (and thus a rotational period) of 6.1 days, not 1.51 days, which is the orbital period (and thus the rotational period) of TRAPPIST -1b. Furthermore, comparing the length of TRAPPIST -1e’s rotational period to those of the other exoplanets would not logically complete the example, which should illustrate how the orbital and rotational periods of a planet in TRAPPIST -1 are the same length. Choice C is incorrect because the table shows that TRAPPIST -1e has an orbital period (and thus a rotational period) of 6.1 days, not 9.21 days, which the table shows is the orbital period (and thus rotational period) of TRAPPIST -1f. Additionally, comparing the rotational periods of two exoplanets would not logically complete the example, which should illustrate how the orbital and rotational periods of a planet in TRAPPIST -1 are the same length. Choice D is incorrect because although it correctly identifies TRAPPIST -1e’s orbital period as 6.1 days, it incorrectly states that its rotational period is 0.92 days. This contradicts the text’s statement that the orbital and rotational periods are equal for TRAPPIST -1 exoplanets. The value 0.92 actually represents TRAPPIST -1e’s radius in relation to Earth’s radius, not its rotational period."},{"i":"30c3aa98","c":"graph","d":"E","s":"","o":["The rise in copper production in Michigan slowed from 1902 to 1909.","Montana and Arizona produced more copper than Michigan did in 1909.","Fewer than 100 million pounds of copper were produced in Arizona in 1889.","Copper production rose significantly from 1889 to 1909 for Arizona, Michigan, and Montana."],"a":3,"r":"Choice D is the best answer. The text asks us to provide examples of several states that saw rapid growth in copper production from the 1890s onward. The graph depicts Arizona, Michigan, and Montana all experiencing such rapid growth during this time period. Choice A is incorrect. The claim is about states experiencing rapid growth in copper production. This statement only discusses one state and does not provide evidence of rapid growth—in fact, it discusses a slow-down of growth. Choice B is incorrect. The claim is about states experiencing rapid growth in copper production, and this statement provides a comparison of production rates between states, rather than an example of rapid growth. Choice C is incorrect. The claim is about several states experiencing rapid growth in copper production. This statement only discusses one state and does not provide evidence of growth in copper production."},{"i":"5ad2a12c","c":"fss","d":"E","s":"The First Folio, published in 1623, is the first collection of William Shakespeare’s plays. The collection ______ 18 plays that might otherwise have been lost, such as Julius Caesar and Macbeth.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to be including","including","to include","includes"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, \"the collection\"), and this choice supplies the finite present tense verb \"includes\" to indicate what is in the collection. Choice A is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to be including\" doesn’t supply the main clause with a finite verb. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"including\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to include\" doesn’t supply the main clause with a finite verb."},{"i":"b369d54c","c":"fss","d":"H","s":"Woven from recycled yarn and hand tufted using a carpet weaving technique passed down by the artist’s Turkish grandmother, ______ so lush and tactilely inviting that you are tempted to reach out and touch them.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["the topological tapestries of Argentine textile artist Alexandra Kehayoglou are","the Argentine textile artist Alexandra Kehayoglou creates topological tapestries that are","when she creates her topological tapestries, Argentine textile artist Alexandra Kehayoglou makes them","Alexandra Kehayoglou is an Argentine textile artist whose topological tapestries are"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"topological tapestries\" the subject of the sentence and places it immediately after the modifying phrase \"woven…grandmother.\" In doing so, this choice clearly establishes that the topological tapestries—and not another noun in the sentence—are being described as woven from recycled yarn and hand tufted. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase \"Argentine textile artist Alexandra Kehayoglou\" immediately after the modifying phrase illogically suggests that Kehayoglou is woven from recycled yarn and hand tufted. Choice C is incorrect because it results in a dangling modifier. The placement of the pronoun \"she\" and the noun phrase \"Argentine textile artist Alexandra Kehayoglou\" after the modifying phrase illogically suggests that Kehayoglou is woven from recycled yarn and hand tufted. Choice D is incorrect because it results in a dangling modifier. The placement of the noun \"Alexandra Kehayoglou\" immediately after the modifying phrase illogically suggests that Kehayoglou is woven from recycled yarn and hand tufted."},{"i":"d1482e27","c":"fss","d":"E","s":"One of the earliest known maps is a Babylonian clay tablet thought to be almost 4,500 years old. The map ______ the area of a plot of land, shows a river valley, and includes the cardinal directions.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["describes","describe","have described","are describing"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The singular verb \"describes\" agrees in number with the singular subject \"map.\" Choice B is incorrect because the plural verb \"describe\" doesn’t agree in number with the singular subject \"map.\" Choice C is incorrect because the plural verb \"have described\" doesn’t agree in number with the singular subject \"map.\" Choice D is incorrect because the plural verb \"are describing\" doesn’t agree in number with the singular subject \"map.\""},{"i":"6fdddabf","c":"bound","d":"E","s":"The part of a compound that determines the compound’s color is ______ the chromophore. One example of a chromophore is hemoglobin, which gives human blood its red color.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["called,","called","called—","called;"],"a":1,"r":"Choice B is the best answer. The convention being tested is punctuation use between a verb and its complement. No punctuation is needed between the verb “is called” and its complement “the chromophore.”The complement helps complete the idea of the verb—in this case, it explains what the part of a compound that determines the compound’s color is called—and any punctuation between the two results in an ungrammatical sentence. Choice A is incorrect because no punctuation is needed between the verb and its complement. Choice C is incorrect because no punctuation is needed between the verb and its complement. Choice D is incorrect because no punctuation is needed between the verb and its complement."},{"i":"8b002b08","c":"bound","d":"E","s":"Many Samoans enjoy a sport called kilikiti. This bat-and-ball game was derived from ______ kilikiti differs from cricket in a few key ways.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["cricket but:","cricket but,","cricket, but","cricket, but,"],"a":2,"r":"Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma before the coordinating conjunction \"but\" to join the first main clause (\"This bat-and-ball game was derived from cricket\") and the second main clause (\"kilikiti differs from cricket in a few key ways\"). Choice A is incorrect. When coordinating two main clauses such as these, it’s not conventional to use a colon in this way after the coordinating conjunction. Choice B is incorrect. When coordinating two main clauses such as these, it’s not conventional to use a comma in this way after the coordinating conjunction. Choice D is incorrect. When coordinating two main clauses such as these, it’s not conventional to use a comma in this way after the coordinating conjunction."},{"i":"25a197dd","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The human body requires magnesium for over 300 essential processes. Magnesium is a mineral present in many foods. Peanuts contain 49 milligrams per ounce (mg/oz) of magnesium. Almonds contain 80 mg/oz. Chia seeds contain 150 mg/oz. The student wants to identify which of the three foods has the highest magnesium content.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["At 80 mg/oz, almonds contain more magnesium than peanuts (49 mg/oz).","Chia seeds contain 150 mg/oz of magnesium, which is more than peanuts and almonds.","Magnesium is present in many foods, including peanuts, almonds, and chia seeds.","Peanuts contain 49 mg/oz of magnesium, a mineral the human body requires for over 300 essential processes."],"a":1,"r":"Choice B is the best answer. The sentence identifies chia seeds as having the highest magnesium content of the three foods, noting that they contain 150 mg/oz, which is more than both peanuts and almonds. Choice A is incorrect. The sentence compares the magnesium content of almonds and peanuts; it doesn’t identify which of the three foods has the highest magnesium content. Choice C is incorrect. The sentence merely mentions the three foods; it doesn’t identify which one has the highest magnesium content. Choice D is incorrect. The sentence identifies the magnesium content of peanuts; it doesn’t identify which of the three foods has the highest magnesium content."},{"i":"e887dab1","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: “Organ 2 /ASLSP (As Slow as Possible)” is a musical piece by avant-garde composer John Cage. A specially designed automated organ in St. Burchardi Church in Halberstadt, Germany, began playing the piece in 2001. It is scheduled to stop playing the piece in 2640. The performance will last 639 years. It will be the longest continuous musical performance in history. The student wants to indicate how long John Cage’s musical piece will last.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["John Cage is the composer of the musical piece “Organ 2 /ASLSP (As Slow as Possible).”","“Organ 2 /ASLSP (As Slow as Possible)” is a musical piece currently being played in St. Burchardi Church in Halberstadt, Germany.","Lasting 639 years, John Cage’s musical piece will be the longest continuous musical performance in history.","An organ in St. Burchardi Church in Halberstadt, Germany, began playing a musical piece by avant-garde composer John Cage."],"a":2,"r":"Choice C is the best answer. The sentence indicates how long John Cage’s musical piece will last, noting that it will last 639 years and be the longest continuous musical performance in history. Choice A is incorrect. The sentence identifies John Cage as the composer and provides the name of the musical piece; it doesn’t indicate how long the piece will last. Choice B is incorrect. The sentence provides the name of the musical piece and where it is currently being played; it doesn’t indicate how long the piece will last. Choice D is incorrect. The sentence mentions where the musical piece is being played and identifies John Cage as the composer; it doesn’t indicate how long the piece will last."},{"i":"7c3f0145","c":"trans","d":"M","s":"In a 2022 analysis of 200 terms, researchers found a broad pattern of valence-dependent mutation for which negative words saw a faster rate of cognate replacement—______ the rate at which a word will be replaced over time with a noncognate form. Adjectives (e.g., “afraid”) saw the largest effect; nouns (e.g., “attack”), meanwhile, saw the smallest.\n\nWhich choice completes the text with the most logical transition?","o":["for example,","likewise,","in addition,","that is,"],"a":3,"r":"Choice D is the best answer. \"That is\" logically signals that the information that follows in the sentence clarifies a term used in the previous discussion of the researchers’ findings: cognate replacement. Choice A is incorrect because \"for example\" illogically signals that the information that follows in the sentence provides a specific example of the research findings described earlier. Instead, it clarifies a term introduced earlier in the sentence. Choice B is incorrect because \"likewise\" illogically signals that the information that follows in the sentence is similar to the previous information about the researchers’ findings. Instead, it clarifies a term introduced earlier in the sentence. Choice C is incorrect because \"in addition\" illogically signals that the information that follows in the sentence merely adds to the previous information about the researchers’ findings. Instead, it clarifies a term introduced earlier in the sentence."},{"i":"04ad68ca","c":"trans","d":"E","s":"In Gothic architecture, flying buttresses are large arches that help support a building’s exterior walls. Before the Gothic era, cathedrals’ heavy ceilings had to be supported by thick, short walls, but the invention of flying buttresses eliminated this need. ______ Gothic cathedrals could be built with thinner, higher walls.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","For instance,","Nevertheless,","As a result,"],"a":3,"r":"Choice D is the best answer. “As a result” logically signals that the thinner, higher walls in this sentence were a result of the invention of flying buttresses in the previous sentence. Choice A is incorrect because “similarly” illogically signals that the thinner, higher walls in this sentence are similar to the invention of flying buttresses in the previous sentence. Instead, the walls were a result of that invention. Choice B is incorrect because “for instance” illogically signals that the thinner, higher walls in this sentence are an example supporting the statement about the invention of flying buttresses in the previous sentence. Instead, the walls were a result of that invention. Choice C is incorrect because “nevertheless” illogically signals that the thinner, higher walls in this sentence occurred despite the invention of flying buttresses in the previous sentence. Instead, the walls were a result of that invention."},{"i":"a204d618","c":"trans","d":"E","s":"In 1949, Frank Zamboni developed an ice rink resurfacing machine. As Zamboni’s machine moved along the rink’s surface, it first scraped off the top layer of ice. ______ it sprayed water into the deep grooves left behind by customers’ skates. Lastly, it smoothed over the newly formed ice.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","Next,","Similarly,","In contrast,"],"a":1,"r":"Choice B is the best answer. \"Next\" logically signals that the action in this sentence—the water spraying—is the next step in the resurfacing process, following the ice scraping mentioned in the previous sentence. Choice A is incorrect because \"for example\" illogically signals that the action in this sentence is an example of the action in the previous sentence. Instead, the water spraying is the next step in a process that begins with the ice scraping. Choice C is incorrect because \"similarly\" illogically signals that the action in this sentence is similar to the action in the previous sentence. Instead, the water spraying is the next step in a process that begins with the ice scraping. Choice D is incorrect because \"in contrast\" illogically signals that the action in this sentence contrasts with the action in the previous sentence. Instead, the water spraying is the next step in a process that begins with the ice scraping."}],"img":{"54be8f96":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEyBAMAAADqxh5FAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA3NElEQVR42u1dZ3gUVRd+7+xsNglJ9k4KHTIbEFSEbAgdgQlFipRFQEAQlqKgoCwWQEFZFBBUZOmKqAtIB4n0EiB0pC5NVEiyoYiUZO+GmrJ7vx8JECCBEMoXwr7PkyezM3duee+ZM+ecOXMH8MADDzzwwAMPPCiAkHR37qG3NoX2NFAKJBIFABJIIVEQBFKik2QAQNYhAEA5ekdFgTSnBlX6m8cDszYigSBaOOl1nzDf9luHFbd+eG+j4xxxbeK2QzyNBnE7xIzjxs/EuGNe8a6jpM5MguFxf94s/OatWQEAiHF/kpu7bm15WwAZoBBdcWYAEOQuQP/CyS45KJwJDBMaIawRSCTCqu2kEYhEUBSAxqhrBobRMrSNrLlG66HNc7FqZ/8AY0tFdQpCzEzgUxCBBiESgc+hC8rLQpieRKK/QRUFlDU2MKj0QpgSJAtBMq0mC+VRjYq1zfBeIUQRqKOpLOqFsBYTuwRjdLD85AYtPrmmtO6tlYZMNZSprC1zfODk+qXK63v3/ursufAEu8+glgmNzGCs8taNQeUny1psqM3ST4LT2WXcDribWAGAF+/YocOgsxtbqRd7zbnQfn5GhyErG16qpCTYw61iy2m006qTtpebrPKr+uvFJivDvzp6MfAkyld7twqPBWUpu+K7rF0WeXxIyMBpZeoURuk9XfNyuP4vjX2hl3OBaP9GNxdH6tM/TxfX43PdlUo9gM9QdvB6uaufsVX18cGHO7P+6hMTIKQQiBOB4TG/q/+OHhd06s2wK13Vhhm+E/v3F06+Kl3W6DEM0Bwq22RLlQmL/EZ8/px+cZGZ3eiO06XMUM/61ycWYvreQGODoMPe5jcjE33sHfHE1K/wxOjlxXu09D/0T9qRIulbgnexUgnJYLpF2h++OYjUhMmMAxwksJbdEGpM+egIq1hPIenNKskkodlEJAOuMZb0Haa0pJUB8VZktGojbDyk2x2QoP1hsQ0OAvx2vk1y/NLfydIlF8c1IEvlRZExFyn4qd1pl4A/hrjLWJ1J3B6w71LqxRJghVA57OiLl3kYCTgF+WrTyp0ELYi7b5XYrg1iI+HmjDKAf1
