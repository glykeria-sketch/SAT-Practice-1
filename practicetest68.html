<script>
const D={"t":"Practicetest68","q":[{"i":"7afb470b","c":"vocab","d":"H","s":"Diadromous fish migrate between freshwater and marine biomes during their life cycle. The migration’s obligate nature is why diadromous fish can be ______ those that are merely euryhaline (able to tolerate high salinity): the euryhaline blackchin tilapia can survive high salinity, but its life cycle does not involve relocation to a different biome, as does that of the diadromous wild salmon.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["demarcated from","reconstituted as","conflated with","derived from"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of diadromous fish. In this context, \"demarcated from\" means separate or set apart from. The text indicates that diadromous fish differ from euryhaline fish in that diadromous fish \"migrate between freshwater and marine biomes during their life,\" whereas euryhaline fish do not relocate to a different biome because they can tolerate higher salinity environments. Therefore, this context suggests that because of differences between their migration patterns, diadromous fish are distinct and can be demarcated from euryhaline fish. Choice B is incorrect. Although the text states that diadromous fish migrate and relocate, the text does not suggest that diadromous fish would be \"reconstituted as,\" or formed again as, anything new. Only their environments change and not the fish themselves. Choice C is incorrect because the text does not suggest that diadromous fish can be \"conflated with,\" or combined with, euryhaline fish. Instead, the text distinguishes the two types of fish by pointing out their differences with regard to migration and tolerance for salinity. Choice D is incorrect because the text indicates that based on migration habits and tolerance for salinity, diadromous fish are different from euryhaline fish; so it would not make logical sense to say that diadromous fish would be \"derived from,\" or be an extension of or result from, euryhaline fish."},{"i":"86fbc64d","c":"vocab","d":"M","s":"Domesticated thousands of years ago by Indigenous people in South America, cacao, the plant from which chocolate is made, deviates structurally from the wild plant it is descended from. Maize (corn), another crop domesticated by Indigenous Americans, shows so little resemblance to any wild plant that genetic research was necessary to ______ teosinte grass as its ancestor.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["acquire","develop","attract","confirm"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the identification of maize’s wild ancestor. In this context, to \"confirm\" means to establish the truth or correctness of something. The text explains that maize \"shows so little resemblance to any wild plant that genetic research was necessary\" to establish its ancestry, which was ultimately traced to teosinte grass. This context conveys the idea that scientific verification was required to establish an ancestral relationship with certainty—that is, to confirm teosinte grass as maize’s ancestor. Choice A is incorrect because to \"acquire\" means to obtain or gain possession of something. Although their research likely required scientists to acquire samples of maize and teosinte grass, the text does not suggest that this was the ultimate goal of their work, which instead probed the connection between the two plants. Choice B is incorrect because to \"develop\" means to create something or to promote the growth of something, and the ancestral relationship between teosinte grass and maize already existed as a biological fact in the deep past, which scientists then verified through research; because this relationship already existed, the scientists can’t be said to have either created it or encouraged its growth. Choice C is incorrect because to \"attract\" means to entice something or to bring about a relationship or connection between two things, while the ancestral relationship between teosinte grass and maize already existed as a biological fact; rather than bringing about the relationship between the two plants, the scientists instead verified the prior existence of it."},{"i":"3f37eb3b","c":"vocab","d":"M","s":"People sometimes dismiss a claim if it comes from a source they regard as self-interested, but from a strictly logical perspective, the source of a claim is ______: it has no direct bearing on whether the claim is true.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["indistinct","irrelevant","indisputable","implicit"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion about people’s tendency to dismiss claims from sources perceived as self-interested, or acting for their own advantage. In this context, \"irrelevant\" means not applicable to the matter at hand. The text explains that as a matter of logical reasoning, the source of a claim has nothing to do with the claim’s truthfulness—a claim is either true or false in actuality, regardless of where it originates. This context suggests that even though people may distrust a claim based on its source, the source of the claim is actually irrelevant. Choice A is incorrect because in this context, \"indistinct\" would mean uncertain or not clearly recognizable. Instead of suggesting that the source of a claim can’t be determined with certainty, the text suggests that recognizing a source and having an opinion of it simply doesn’t matter because as a matter of logic, a claim is true or false in actuality, regardless of where it originates. Choice C is incorrect because in this context, \"indisputable\" would mean impossible to question or deny. Although the text suggests that it isn’t logical to assume a claim is false just because its source appears to be self-interested, it doesn’t go so far as to suggest that the source of a claim can’t be questioned—the text instead makes the point that from a logical standpoint, the source of a claim doesn’t matter because the claim is either true or false in and of itself. Choice D is incorrect because in this context, \"implicit\" would mean suggested or understood without being directly expressed. Nothing in the text suggests that logically, the source of a claim is only suggested; instead of addressing whether sources can be directly identified, the text focuses on the idea that sources don’t matter because a claim is true or false in actuality, regardless of where it originates."},{"i":"5d2fd27d","c":"vocab","d":"E","s":"While we can infer information about climate activity in Earth’s distant past from physical evidence, we of course cannot observe past climates directly. To study early Earth’s climate in action, we must ______ that climate using computer models that represent various climate conditions consistent with the physical evidence.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["invent","simulate","exaggerate","preserve"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of climate activity in Earth’s distant past. In this context, to “simulate” most nearly means to represent a natural process using computer models. According to the text, understanding Earth’s early climate is difficult because we cannot make direct observations of the distant past. Instead, scientists must create computer models that approximate early climate conditions, based on the physical evidence that those conditions left behind on Earth’s surface. This context supports the idea that computer models simulate Earth’s climate in the distant past. Choice A is incorrect because scientists use existing physical evidence as a basis for developing computer models that describe what Earth’s actual past climate might have been like. The models are not being used to “invent,” or imagine, a completely fictional climate. Choice C is incorrect because the computer models are being used in an attempt to describe as accurately as possible what Earth’s past climate might have been like. They are not attempting to “exaggerate,” or distort, those features. Choice D is incorrect because the computer models do not “preserve,” or protect from deterioration, Earth’s early climate; instead, they attempt to reproduce the characteristics of that climate, based on the remaining physical evidence of that climate."},{"i":"9421ed62","c":"purpose","d":"E","s":"In 2007, computer scientist Luis von Ahn was working on converting printed books into a digital format. He found that some words were distorted enough that digital scanners couldn’t recognize them, but most humans could easily read them. Based on that finding, von Ahn invented a simple security test to keep automated “bots” out of websites. The first version of the reCAPTCHA test asked users to type one known word and one of the many words scanners couldn’t recognize. Correct answers proved the users were humans and added data to the book-digitizing project.\n\nWhich choice best states the main purpose of the text?","o":["To discuss von Ahn’s invention of reCAPTCHA","To explain how digital scanners work","To call attention to von Ahn’s book-digitizing project","To indicate how popular reCAPTCHA is"],"a":0,"r":"Choice A is the best answer because it most accurately states the main purpose of the text. After providing a brief introduction to computer scientist Luis von Ahn, the text focuses on discussing how von Ahn’s digitization work led to the invention of a digital security test known as reCAPTCHA. Choice B is incorrect because the text doesn’t address how digital scanners work. Choice C is incorrect. Although the text mentions von Ahn’s book-digitizing project, that information is provided as a detail, not as the main purpose of the text. Choice D is incorrect because the text doesn’t provide any indication of reCAPTCHA’s popularity; instead, it describes reCAPTCHA’s origin."},{"i":"19688783","c":"purpose","d":"M","s":"The following text is from Lucy Maud Montgomery’s 1908 novel Anne of Green Gables. Anne, an eleven-year-old girl, has come to live on a farm with a woman named Marilla in Nova Scotia, Canada. Anne reveled in the world of color about her. “Oh, Marilla,” she exclaimed one Saturday morning, coming dancing in with her arms full of gorgeous boughs, “I’m so glad I live in a world where there are Octobers. It would be terrible if we just skipped from September to November, wouldn’t it? Look at these maple branches. Don’t they give you a thrill—several thrills? I’m going to decorate my room with them.” “Messy things,” said Marilla, whose aesthetic sense was not noticeably developed. “You clutter up your room entirely too much with out-of-doors stuff, Anne. Bedrooms were made to sleep in.”\n\nWhich choice best states the main purpose of the text?","o":["To demonstrate that Anne has a newly developed appreciation of nature","To describe an argument that Anne and Marilla often have","To emphasize Marilla’s disapproval of how Anne has decorated her room","To show that Anne and Marilla have very different personalities"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text. The text begins by noting that Anne “reveled in the world of color about her”—that is, she takes great delight in colorful things. It then relates a scene when she enthusiastically enters the house with autumn foliage and announces that she will decorate her room with it. The focus of the text then shifts to Marilla, who has an undeveloped “aesthetic sense,” or appreciation of beauty, as can be seen when she dismisses the maple leaves as “messy things” and criticizes Anne for cluttering her room with objects from outside. This episode thus illustrates that Anne and Marilla differ in their appreciation of beauty and, more generally, in their basic character: Anne is exuberant and joyful, while Marilla is stern and critical. Therefore, the purpose of the text is to show that Anne and Marilla have very different personalities. Choice A is incorrect because the text presents Anne’s appreciation of nature as a basic personality trait, not as a newfound enthusiasm, and never indicates how recently she developed that appreciation. Choice B is incorrect. Although the text portrays Anne and Marilla as having different personalities and attitudes toward natural beauty and home decoration, it doesn’t show them engaging in an argument about this difference or suggest that they often argue about it. Choice C is incorrect. Although the text does indicate that Marilla disapproves of how Anne plans to decorate her room, Marilla’s disapproval is a supporting detail that serves to develop her personality, which the text as a whole contrasts with Anne’s personality."},{"i":"617a8a10","c":"func","d":"M","s":"Very little is known about the role nocturnal insects, such as moths, play in flower pollination because it is difficult to monitor insects at night. <u>To address this problem, a team of scientists used time-lapse cameras to record pollinator visits to red clover all day and night.<\/u> The recordings showed that while most pollinator visits were by bumblebees, one-third of visits were by moths. Additionally, flowers that were visited by both moths and bees produced more seeds than flowers that were only visited by bees.\n\nWhich choice best states the function of the underlined sentence?","o":["To describe an approach a team of scientists used to study pollinators","To question a claim scientists make about pollinators","To explain why moths prefer red clover to other flowers","To announce an unexpected research finding about red clover"],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined sentence. The sentence indicates that scientists used time-lapse photography during both day and night to detect pollinators visiting red clover. Therefore, the underlined sentence has the function of describing an approach scientists used in the pollinator study discussed in the text. Choice B is incorrect because the underlined sentence discusses equipment the scientists used to conduct their study, and the text provides nothing to suggest these elements of their experimental design could, by themselves, question claims resulting from the study. Choice C is incorrect because nothing in either the underlined sentence or the rest of the text addresses whether moths have a preference for red clover or any other flowers. Choice D is incorrect. Although the sentences that follow the underlined sentence discuss research findings, nothing in the text suggests that these findings were unexpected. Moreover, the underlined sentence describes part of the scientists’ experimental design (day and night time-lapse photography), not a finding of the scientists’ study."},{"i":"c502943e","c":"func","d":"E","s":"The following text is adapted from Cynthia Kadohata’s 2004 novel Kira-Kira. <u>[Uncle Katsuhisa] was as loud as my father was quiet.<\/u> Even when he wasn’t talking, he made a lot of noise, clearing his throat and sniffing and tapping his fingers. ©2004 by Cynthia Kadohata Which choice best describes the function of the underlined sentence?","o":["It lists the kinds of topics Uncle Katsuhisa enjoys discussing.","It suggests that Uncle Katsuhisa dislikes meeting new people.","It contrasts Uncle Katsuhisa with the narrator’s father.","It describes a conversation between the narrator and the narrator’s father."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The underlined sentence establishes a difference between Uncle Katsuhisa and the narrator’s father by describing Uncle Katsuhisa as \"loud\" and the narrator’s father as \"quiet.\" The text then elaborates on that contrast, describing some ways Uncle Katsuhisa is very noisy even when he isn’t speaking. Choice A is incorrect because the text doesn’t indicate what kinds of topics Uncle Katsuhisa enjoys discussing, only that he is loud even when he isn’t speaking. Choice B is incorrect because the text never indicates how Uncle Katsuhisa feels about meeting new people, only how loud he is. Choice D is incorrect because the text never describes a conversation occurring between any people; it refers to talking only when stating that Uncle Katsuhisa is loud even when he isn’t speaking."},{"i":"9a94eb77","c":"cross","d":"M","s":"Text 1 One challenge faced by researchers studying global urbanization is that countries may define urban settlements differently. Many countries define urban settlements based on the number of people living in them. However, countries do not all use the same number; for example, Iceland uses a minimum population of 200, while the Netherlands uses 20,000. Other countries use a combination of population and other factors. This variation makes it difficult for researchers to compare aspects of urbanization in different countries.\n\nText 2 Recently, a group of six international organizations developed global definitions of common types of settlements. The group developed a new measure called the “degree of urbanization.”This new measure establishes global criteria used to define three types of settlements (cities, towns, and rural areas) and allows researchers to better understand global urbanization rates.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the problem presented in\n\nText 1?","o":["By recommending that a specific institution should further investigate the problem","By suggesting that researchers focus on topics besides urbanization","By supplying additional ways in which urbanization research is difficult","By noting that a possible solution to the problem is available"],"a":3,"r":"Choice D is the best answer because Text 2 presents a possible solution to the problem identified in Text 1—that is, how disparities in the criteria used by different countries to define urban settlements make it \"difficult for researchers to compare aspects of urbanization in different countries.\" Text 2 describes the creation of a shared framework for studying global urbanization: \"global definitions of common types of settlements\" and a \"new measure called the ‘degree of urbanization’\" that \"allows researchers to better understand global urbanization rates.\" Choice A is incorrect. Although Text 2 mentions \"a group of six international organizations\" that developed criteria and a measure related to settlements and urbanization, no organization or institution is singled out to perform further research. Choice B is incorrect because both texts are about urbanization research and neither mentions any other fields of study. Choice C is incorrect. Text 2 discusses a possible solution to the terminological problem in global urbanization research, not additional areas of difficulty in the field."},{"i":"2312021b","c":"main","d":"M","s":"In a study by Mika R. Moran, Daniel A. Rodriguez, and colleagues, residents of Quito, Ecuador, and Lima, Peru, were surveyed about parks in their cities. Of the 618 respondents from Quito, 82.9% indicated that they use the city’s parks, and of the 663 respondents from Lima, 72.7% indicated using city parks. Given that the percentage of Quito respondents who reported living within a 10-minute walk of a park was much lower than that reported by Lima respondents, greater proximity alone can’t explain the difference in park use. The text makes which point about the difference between the proportions of Quito residents and Lima residents using parks?","o":["It was much larger than the researchers conducting the study expected.","It is caused by something other than the parks’ proximity to city residents.","It could be due to inaccuracies in the survey results.","It was calculated using sources that predate the survey."],"a":1,"r":"Choice B is the best answer because it presents a statement about the difference between the proportions of Quito residents and Lima residents using parks that is supported by the text. The text states that 82.9% of surveyed Quito residents and 72.7% of surveyed Lima residents reported using their city’s parks. The text then notes that compared to Lima respondents, a much smaller percentage of Quito respondents said they live within a 10-minute walk of a park. The text concludes that because a greater proportion of Quito respondents used parks despite generally living farther from them than Lima respondents did, \"greater proximity\"—being closer to a park—\"can’t explain the difference in park use.\" That is, the text makes the point that the difference between the proportions of Quito residents and Lima residents using parks is caused by something other than the distance of the parks from city residents. Choice A is incorrect because the text doesn’t address whether the researchers had expected a particular result and doesn’t indicate that they were surprised by the difference in park usage between the two cities’ residents. The text simply presents the survey findings without stating the researchers’ expectations. Choice C is incorrect because the text gives no indication that there might be inaccuracies in the survey results; the text presents the findings as factual information and uses them as the basis for a conclusion that a certain factor doesn’t explain differences in park usage between Quito and Lima residents. Choice D is incorrect because the text doesn’t mention any sources that predate the survey or suggest that the difference in proportions was calculated using such sources. According to the text, the information about park usage came directly from the survey of residents in Quito and Lima."},{"i":"f64ff4fb","c":"main","d":"M","s":"In her 1998 book Blues Legacies and Black Feminism, Angela Y . Davis bases her analysis in part on recordings of songs sung in the 1920s by Gertrude “Ma” Rainey and Bessie Smith. Davis focuses on how Rainey and Smith improvised the lyrics—replacing the original lines with mischievous jokes and wordplay. Davis’s work was particularly labor intensive because in order to transcribe, or write down, the lyrics as Rainey and Smith sang them, Davis had to listen repeatedly to the vinyl recordings, which weren’t very clear. What does the text most strongly suggest about the songs sung by Rainey and Smith?","o":["The songs have grown in popularity since Rainey and Smith first sang them.","There were more recordings made of Rainey’s songs than there were of Smith’s.","There were few, if any, reliable transcriptions of Smith’s and Rainey’s improvised lyrics when Davis began her research.","According to Davis, the songs sung by Rainey were more musically innovative than those sung by Smith typically were."],"a":2,"r":"Choice C is the best answer because it describes the songs sung by Gertrude \"Ma\" Rainey and Bessie Smith in a way the text implies is accurate. The text describes Angela Y . Davis’s research on Rainey and Smith for her book Blues Legacies and Black Feminism, focusing on her efforts to transcribe the improvised lyrics in Rainey’s and Smith’s songs. The text calls Davis’s transcription process \"labor intensive\" since the lack of clarity in the recordings required her to listen to each repeatedly to verify the accuracy of her transcripts. The fact that Davis undertook a painstaking transcription process using only fairly low-fidelity recordings suggests that reliable transcriptions were otherwise unavailable to her. Choice A is incorrect. The text doesn’t discuss the popularity of Rainey’s and Smith’s songs either in the 1920s or after. Although it is plausible that the music of Rainey and Smith is more widely enjoyed than it was in the 1920s, this isn’t supported by the text. Choice B is incorrect. The text doesn’t discuss which of Rainey and Smith was the more prolific recording artist and so provides no support for such a claim. Choice D is incorrect. The text discusses the creativity of both Rainey and Smith, but it does so only to note similarities between them in terms of improvisation and wit, not to emphasize differences between them or Davis’s relative views of the artists’ inventiveness."},{"i":"4802f6a5","c":"infer","d":"H","s":"Aptamers—synthetic DNA or RNA molecules that bind to target molecules—can be used to test for foodborne bacterial pathogens, though their specificity (the probability of returning a negative result in the absence of the focal pathogen) in real-world foods has been unclear. Sandeep Somvanshi et al. fabricated test paper incorporating aptamers targeting strain O157:H7 of the bacteria Escherichia coli; the paper shifts from pink to purple as the aptamers bind to target molecules. Somvanshi et al. tested the paper in store-bought pear juice they treated with E. coli O157:H7, other strains of E. coli, or other bacteria species. Following exposure, the paper from the O157:H7 test was purple while papers from the other tests were pink, suggesting that ______ Which choice most logically completes the text?","o":["aptamer-based tests in real-world foods are more likely to show a high degree of specificity if the focal pathogen is E. coli O157:H7 than if the focal pathogen is another strain of E. coli or another species.","uncertainty about the specificity of aptamer-based tests for pathogens in real-world foods may be due to the similarity between E. coli O157:H7 and other E. coli strains.","the specificity of the tests in a real-world food was unaffected by the aptamers’ tendency to bind to different strains of E. coli.","the aptamers successfully bound to E. coli O157:H7 and the tests displayed a high degree of specificity in a real-world food."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of aptamers’ capacity to test for pathogens in food. The text explains that although synthetic aptamer molecules can be used to test for foodborne bacterial pathogens because they bind to target molecules, it hasn’t been clear how likely it is that they will indicate a negative result when a target pathogen is absent in real-world foods. The text then indicates that Somvanshi et al. created test paper that changes from pink to purple when aptamers in it bind to a particular strain of E. coli bacteria, O157:H7, and tested it with store-bought pear juice (that is, a real-world food); the paper changed to purple when exposed to juice to which the target pathogen E. coli O157:H7 had been added, but it remained pink when exposed to juice treated with other E. coli strains or other bacteria species. Based on this result, it seems the aptamers in the paper successfully bound to the target (O157:H7) and the tests had a high degree of specificity (providing negative results for samples where the target was absent even though other bacteria were present) when applied to a real-world food. Choice A is incorrect because nothing in the text suggests that E. coli O157:H7 differs from other pathogens in a way that makes it more suitable for aptamer-based testing of any kind and that specificity is likely to be lower when aptamer-based tests target other bacteria; the text simply indicates that Somvanshi et al. used O157:H7 as the target for aptamer-based test paper in their study and suggests that the paper had a high degree of specificity. Choice B is incorrect because the text indicates that the specificity of aptamer-based tests in real-world foods is uncertain for pathogens broadly, not just for E. coli, and similarity between strains (of E. coli or of other pathogens) isn’t mentioned. Moreover, the results presented in the text suggest that aptamers are actually capable of distinguishing between strains of E. coli, since Somvanshi et al.’s paper turned purple when exposed to E. coli O157:H7 and remained pink when exposed to other strains. Choice C is incorrect because the text suggests that the aptamers in the test papers didn’t bind to different strains of E. coli. The text explains that the test papers turn purple when the aptamers bind to the targeted pathogen and that in the pear juice tests, the test papers turned purple when exposed to samples with the targeted strain of E. coli (O157:H7) but remained pink when exposed to samples with other strains of E. coli. In other words, the aptamers bound only to the targeted strain, not to the other strains. Further, specificity would be affected if the aptamers had bound to multiple strains and not just the targeted one; that result would cause the specificity to be low."},{"i":"0dccbf17","c":"infer","d":"H","s":"Henry Ossawa Tanner’s 1893 painting The Banjo Lesson, which depicts an elderly man teaching a boy to play the banjo, is regarded as a landmark in the history of works by Black artists in the United States. Scholars should be cautious when ascribing political or ideological values to the painting, however: beliefs and assumptions that are commonly held now may have been unfamiliar to Tanner and his contemporaries, and vice versa. Scholars who forget this fact when discussing The Banjo Lesson therefore ______ Which choice most logically completes the text?","o":["risk judging Tanner’s painting by standards that may not be historically appropriate.","tend to conflate Tanner’s political views with those of his contemporaries.","forgo analyzing Tanner’s painting in favor of analyzing his political activity.","wrongly assume that Tanner’s painting was intended as a critique of his fellow artists."],"a":0,"r":"Choice A is the best answer. It most logically completes the text. The text argues that Tanner and his contemporaries may have been unfamiliar with modern beliefs and values. This suggests that scholars who attribute those modern values to Tanner’s painting are risking judging the painting by standards that are not historically accurate. Choice B is incorrect. It doesn’t logically complete the text. The text argues that Tanner AND his contemporaries may have been unfamiliar with modern views. It never suggests that Tanner’s views were different from his contemporaries’ views. Choice C is incorrect. It doesn’t logically complete the text. The text never suggests that scholars should analyze Tanner’s political activity instead of his painting. Rather, the text argues that Tanner and his contemporaries may have been unfamiliar with modern beliefs and values. Choice D is incorrect. It doesn’t logically complete the text. The text never suggests that Tanner wanted to critique his contemporaries with his painting. Rather, the text argues that Tanner AND his contemporaries may have been unfamiliar with modern beliefs and values."},{"i":"ac7166f7","c":"claim","d":"E","s":"Researchers Narelle Haworth and Amy Schramm studied bicycling behavior in Queensland, Australia. Haworth and Schramm asked adult bike riders questions about their level of experience, reasons for riding a bike, and route preferences. The researchers claim that <u>experienced riders who mainly bike to work tend to prefer routes that reduce their travel time<\/u>. Which survey response from a bike rider in Queensland would best support the underlined claim?","o":["“I have a bike, but I don’t ride it very often. When the weather is nice, I sometimes use my bike to go into town to do some shopping.”","“I just got a new bike, and I’m looking forward to going on rides with my friends soon.”","“I bike to my job every day. There’s a nice bike path that goes through a park, but I use the bike lane on the main road because it’s faster.”","“I usually bike to work, but I’m taking the bus now because my bike has a broken part that needs to be fixed.”"],"a":2,"r":"Choice C is the best answer because it presents a response that best supports the underlined claim that experienced riders who mainly bike to work tend to prefer routes that reduce their travel time. The bike rider responds that they bike to work every day and that they use the bike lane because it is faster; thus, it is reasonable to assume that they are an experienced rider who prefers routes that reduce their travel time to work. Choice A is incorrect because this response does not address the claim. The claim is about experienced riders preferring to take routes that reduce their travel time on the way to work; however, this response is from an inexperienced rider who is discussing biking for personal reasons. Choice B is incorrect because this response is not related to the underlined claim. The response from this rider does not establish the level of experience they have with riding, nor does it state that the rider uses a bike to get to work. Choice D is incorrect. Although this response is from an experienced rider who mainly bikes to work, the response also mentions that the rider’s bike is broken, which is not related to any route preference."},{"i":"72c7dafd","c":"claim","d":"E","s":"Happy House is a 1920 novel by Jane Abbott. The narrator presents a young woman as being unimpressed with the house she is visiting: ______ Which quotation from Happy House most effectively illustrates the claim?","o":["“Her first feeling was of disappointment; in the square lines of the house there was little claim to beauty.”","“Someone had opened one of the blinds so here there was more light.”","“The door, built squarely in the middle of the house, opened almost directly upon a stone-flagged path that led in a straight line to the road.”","“She tip-toed through the hall and opened the door on the right.”"],"a":0,"r":"Choice A is the best answer because it most effectively uses a quotation from Happy House to illustrate the claim that the young woman is unimpressed with the house she is visiting. In the quotation, it says the young woman’s \"first feeling was of disappointment\" and that \"there was little claim to beauty\" when referring to the house. This disappointment and the overall lack of beauty in the house suggest that the young woman isn’t impressed by the house she is visiting. Choice B is incorrect because the quotation doesn’t describe what the young woman thinks about the house. Instead, it indicates that there is more light because window blinds have been opened. Choice C is incorrect because the quotation describes a door and a path outside of the house but doesn’t include anything to indicate the young woman’s feelings about the house. Choice D is incorrect because the quotation states what the young woman did in the house (\"tip-toed through the hall\" and \"opened the door\"), but it doesn’t show what she thinks about it."},{"i":"145da981","c":"graph","d":"E","s":"","o":["The Chicago Tribune and the Los Angeles Times had similar total revenue changes, but the Los Angeles Times had a smaller percentage change.","The Los Angeles Times had a 12.5% revenue change, while the Chicago Tribune had a 19% revenue change.","The New York Times had a 20% revenue change, while the Denver Post had a −1% revenue change.","The Denver Post had only a −1% revenue change, which was the smallest percentage change of the selected companies."],"a":2,"r":"Choice C is the best answer. The conclusion is that paywalls are more beneficial for large newspapers. This data supports that conclusion by comparing the revenue increase of a large newspaper to the revenue decrease of a small newspaper. Choice A is incorrect. This choice doesn’t support the conclusion. It doesn’t include any small newspapers for comparison. Choice B is incorrect. This choice doesn’t support the conclusion. It doesn’t include any small newspapers for comparison. Choice D is incorrect. This choice doesn’t support the conclusion. It doesn’t include any large newspapers for comparison."},{"i":"0b96fa93","c":"graph","d":"E","s":"","o":["silver maple.","sugar maple.","red maple.","Norway maple."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the statement about the forestry student’s project. The table shows five types of maple trees, each tree’s maximum height, and whether each tree is native to North America. The text indicates that the student needs to recommend a maple tree that’s native to North America and won’t reach a height greater than 60 feet. The red maple is the only tree listed in the table that meets these criteria: its maximum height is 60 feet—meaning that it won’t grow higher than 60 feet—and it’s native to North America. Choice A is incorrect because the text states that the student needs to recommend a tree that’s native to North America and won’t grow higher than 60 feet, but the table shows that the maximum height of the silver maple is 70 feet. Choice B is incorrect because the text states that the student needs to recommend a tree that’s native to North America and won’t grow higher than 60 feet, but the table shows that the maximum height of the sugar maple is 75 feet. Choice D is incorrect because the text states that the student needs to recommend a tree that’s native to North America and won’t grow higher than 60 feet, but the table shows that the Norway maple isn’t native to North America."},{"i":"ae439895","c":"fss","d":"H","s":"In her 1983 book The Managed Heart: Commercialization of Human Feeling, sociologist Arlie Russell Hochschild first explored at length her conception of a “sociology of emotions”—the idea that the various cultural and ideological frameworks a person has internalized (class, gender, political affiliation, etc.) ______ each emotional reaction that person has within a situation.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["underlies","is underlying","underlie","has been underlying"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The plural verb \"underlie\" agrees in number with the plural subject \"frameworks.\" Choice A is incorrect because the singular verb \"underlies\" doesn’t agree in number with the plural subject \"frameworks.\" Choice B is incorrect because the singular verb \"is underlying\" doesn’t agree in number with the plural subject \"frameworks.\" Choice D is incorrect because the singular verb \"has been underlying\" doesn’t agree in number with the plural subject \"frameworks.\""},{"i":"b32eab9f","c":"fss","d":"H","s":"Increased gender diversity is revitalizing the field of economics, according to Harvard’s Claudia Goldin. The trailblazing accomplishments of Goldin, winner of the 2023 Nobel Prize in Economics for her work on women in the labor force, ______ to the value of scholars of diverse backgrounds in spurring research into previously unexplored, but vitally important, topics.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["attests","has attested","is attesting","attest"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The plural verb \"attest\" agrees in number with the plural subject \"trailblazing accomplishments.\" Choice A is incorrect because the singular verb \"attests\" doesn’t agree in number with the plural subject \"trailblazing accomplishments.\" Choice B is incorrect because the singular verb \"has attested\" doesn’t agree in number with the plural subject \"trailblazing accomplishments.\" Choice C is incorrect because the singular verb \"is attesting\" doesn’t agree in number with the plural subject \"trailblazing accomplishments.\""},{"i":"100269ad","c":"fss","d":"E","s":"Zydeco music originated in the French Creole community of southwest Louisiana. One instrument that gives zydeco its unique sound is the vest frottoir. The vest frottoir ______ a wearable washboard that is played by rubbing spoons or bottle openers against it.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have been","is","were","are"],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-verb agreement. The singular verb \"is\" agrees in number with the singular subject \"vest frottoir.\" Choice A is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"vest frottoir.\" Choice C is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"vest frottoir.\" Choice D is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"vest frottoir.\""},{"i":"a466679a","c":"bound","d":"E","s":"In 1976, the Inuit rock group Sikumiut recorded the album People of the Ice. Though only their first record, it shows a band already skilled at the difficult task of making music that sounds easy and fun. On songs like “Utirumavunga,” Lucassie Koperqualuk’s guitar riffs effortlessly ______ Charlie Adams’s delightfully catchy vocal melodies.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["blend, with","blend. With","blend; with","blend with"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation between a verb and a prepositional phrase. No punctuation is needed between the verb “blend” and the prepositional phrase “with Charlie Adams’s delightfully catchy vocal melodies.” The prepositional phrase completes the idea of the sentence, explaining with what Koperqualuk’s guitar riffs blend. Choice A is incorrect because no punctuation is needed between the verb and the prepositional phrase. Choice B is incorrect because no punctuation is needed between the verb and the prepositional phrase. Choice C is incorrect because no punctuation is needed between the verb and the prepositional phrase."},{"i":"5aa171de","c":"bound","d":"H","s":"Chondrites are stony meteorites that are undifferentiated—that is, their contents have not melted and separated into distinct layers. They are hardly ______ many chondrites experience aqueous alteration as a result of exposure to fluids, as well as fracturing, veining, and localized melting due to collisions with other objects.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["pristine, though","pristine, though;","pristine; though","pristine, though,"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to separate the supplementary adverb \"though\" from the preceding main clause (\"They are hardly pristine\") and uses a semicolon to join the two main clauses (\"They…though\" and \"many…objects\"). Further, placing the semicolon after \"though\" indicates that the information in the preceding main clause (chondrites are far from pristine) is contrary to what might be assumed from the information in the previous sentence (chondrites have been generally unaltered by their environment). Choice A is incorrect because placing the comma after \"pristine\" and using \"though\" as a subordinating conjunction illogically indicates that the information in the next main clause (many chondrites have experienced damage) is contrary to the information in the previous clause (chondrites are far from pristine). Choice C is incorrect because placing the semicolon after \"pristine\" illogically indicates that the information in the next main clause (many chondrites have experienced damage) is contrary to the information in the previous clause (chondrites are far from pristine). Choice D is incorrect because it results in a comma splice. Without a conjunction following it, the comma after \"though\" can’t be used in this way to join two main clauses."},{"i":"c92ea686","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: The Ramayana is a Sanskrit epic poem from ancient India. In The Ramayana, the character Kaikeyi is often portrayed as a villain. Kaikeyi is a 2022 novel by Vaishnavi Patel. The novel is a retelling of the epic poem from Kaikeyi’s point of view. It often portrays Kaikeyi as heroic. The student wants to emphasize whose point of view the novel is told from.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["From the point of view of The Ramayana, the character Kaikeyi is often a villain.","Vaishnavi Patel often portrays the character as heroic.","Kaikeyi is a retelling of The Ramayana from the character Kaikeyi’s point of view.","The Ramayana is an epic poem that features the character Kaikeyi."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes whose point of view the novel Kaikeyi is told from: the character Kaikeyi’s. Choice A is incorrect. While the sentence does discuss point of view, it focuses on that of the epic poem rather than the novel. Choice B is incorrect. While the sentence seems to be referring to Patel’s novel, it doesn’t establish whose point of view the novel is told from. Choice D is incorrect. The sentence discusses the character Kaikeyi in the context of the epic poem; it doesn’t discuss the novel’s point of view."},{"i":"ff8d2125","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Crown shyness is a phenomenon in which the tops (crowns) of neighboring trees grow close together but don’t overlap. To explain how this happens, Australian forester M.R. Jacobs proposes the mutual abrasion theory. According to Jacobs’s theory, when trees brush against one another, branches break off. Malaysian scholar Francis S.P . Ng posits the mutual shade avoidance theory. According to Ng’s theory, when tree branches detect shade from nearby trees’ branches, they stop growing. The student wants to compare the causes of crown shyness proposed in the two theories.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["While Jacobs proposes that crown shyness is caused by neighboring tree branches brushing against one another, Ng posits that it occurs when branches detect shade from nearby trees’ branches.","Both Jacobs and Ng have proposed theories to explain what causes crown shyness.","Ng posits the mutual shade avoidance theory, whereas Jacobs proposes an alternative theory.","Jacobs’s mutual abrasion theory proposes that when neighboring trees brush against one another, branches break off, resulting in a phenomenon in which the tops of trees grow close together but don’t overlap."],"a":0,"r":"Choice A is the best answer. The sentence compares the two proposed causes of crown shyness, noting the theories’ differences: Jacobs cites branches brushing against one another as the cause, while Ng cites branches detecting shade from other branches as the cause. Choice B is incorrect. The sentence merely identifies the existence of two theories for crown shyness; it doesn’t compare the causes proposed by each theory. Choice C is incorrect. The sentence merely indicates that there are two different theories for crown shyness; it doesn’t compare the causes proposed by each theory. Choice D is incorrect. The sentence merely explains one theory for crown shyness; it doesn’t compare two theories."},{"i":"3831f2d7","c":"trans","d":"E","s":"Arkansas aviator Louise Thaden was already a record breaker when she won the inaugural National Women’s Air Derby, a race from California to Ohio, in August of 1929. ______ in December of 1928, Thaden had set an aviation record when she reached an altitude of 20,269 feet in a Travel Air biplane.\n\nWhich choice completes the text with the most logical transition?","o":["Earlier,","However,","Next,","As a result,"],"a":0,"r":"Choice A is the best answer. This choice uses a transition that indicates a shift back in time. Since the first sentence talks about Thaden’s race win in 1929 and the second shifts back to talking about her record in 1928, this makes the most sense here. Choice B is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with and expands on the previous sentence by describing the earlier record that Thaden had \"already\" held. Choice C is incorrect. This choice uses a transition that indicates a shift forward in time, which doesn’t make sense here. A record in 1928 didn’t come after Thaden’s race win in 1929. Choice D is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense in this context—an event in 1929 can’t cause something in 1928."},{"i":"42301836","c":"trans","d":"M","s":"In her 2012 analysis of tree rings from Japan’s Yaku Island, cosmic ray physicist Fusa Miyake noted an anomalous carbon-14 spike dating to 774–775 CE, indicating that a massive burst of radiation reached Earth during that time. ______ this unprecedented radiocarbon surge was dubbed a “Miyake event” in honor of its discoverer.\n\nWhich choice completes the text with the most logical transition?","o":["Fittingly,","Similarly,","However,","In other words,"],"a":0,"r":"Choice A is the best answer. \"Fittingly\" logically signals that the naming of an unprecedented radiocarbon surge for Fusa Miyake is appropriate to the situation, since Miyake is the person who identified the surge (through her Yaku Island tree-ring analysis). Choice B is incorrect because \"similarly\" illogically signals that the information in this sentence is similar to the previous information about Miyake’s identification of a massive radiation burst through tree-ring analysis. Instead, the naming of the event for its discoverer is a fitting and appropriate outcome. Choice C is incorrect because \"however\" illogically signals that the information in this sentence contrasts with the previous information about Miyake’s identification of a massive radiation burst through tree-ring analysis. Instead, the naming of the event for its discoverer is a fitting and appropriate outcome. Choice D is incorrect because \"in other words\" illogically signals that the information in this sentence is a paraphrase or restatement of the previous information about Miyake’s identification of a massive radiation burst through tree-ring analysis. Instead, the naming of the event for its discoverer is a fitting and appropriate outcome."},{"i":"42e6cc83","c":"trans","d":"H","s":"In hindsight, given the ideas about the natural world circulating among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a coincidence, ______ that Charles Darwin and Alfred Wallace arrived at the concept independently. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.\n\nWhich choice completes the text with the most logical transition?","o":["however,","then,","moreover,","for example,"],"a":1,"r":"Choice B is the best answer. \"Then\" signals that this sentence’s claim about Darwin and Wallace follows logically from the previous information. In other words, both scientists independently arriving at the theory of natural selection was, arguably, an expected outcome of the circumstances mentioned in the previous sentence. Choice A is incorrect because \"however\" illogically signals that the claim in this sentence contrasts with the previous information about the ideas circulating among British scientists in the 1800s. Instead, this claim follows logically from that information. Choice C is incorrect because \"moreover\" illogically signals that the claim in this sentence merely adds to the previous information about the ideas circulating among British scientists in the 1800s. Instead, this claim follows logically from that information. Choice D is incorrect because \"for example\" illogically signals that this sentence provides an example supporting the previous information about the ideas circulating among British scientists in the 1800s. Instead, it presents a claim that follows logically from that information."}],"img":{"145da981":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEyBAMAAADqxh5FAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABNoUlEQVR42u1dd3gTx9N+907FXSsXuvHZ9H42LYQm0wlN9ABJkAFDEpIg0iChmd6DgSTUgGhJKAkCQjMGRO9YtNCxTG+2Vqa6SPf9YQO2ae7ml8/zPODT3e7e7ruzszOzc7tAIRVSIRVSIRVSIeU+0f9ou7g8Lp94CrI+RYLT3qojQi2kr4QYmD5XwPPsGYt7U08Q/5fvqVP+BAHq/2AX0p2XT1cbMyL4RVcScshfkXxRmzaVk+E0XAwAfYb6pBQkidAjA3t3EJWm18L08SX9S+jPSQH5NHGKvSj89/DdBDK8yTlalsJbmCqC1IRiHxRGZQzXlAgkUE15eItOhtNwCfdvwh/wLCPUAprO46BGGaHq4CCUFTlvAeA1CGwCdDAqjSSICBzUfDCpJcJbJGU04DVcgMjd5B+hKby8SBD8m4BrgoAgBKEsUJOfBeew4iZv0ROeaAqvMlTgBD4YvJjHzZflcfkSSOcS5crMudd+Y3SRR+bKQ8/Mr00fswTSU+PRue+KoKHbD2y83xkqgPvz2vWy5ZY2mnA7dEL1bx4OHfHHnQV9Ek6tuBS6olQV/FA6Zu61OIt7MUl4P2Rj0ORaLff0ubnC2mDfpY77o+v94bb3UFf+gruuRP92Oxr5cis+snlUERy9yN66g369Ezrk6VcEuMf9nvxt9Q9GDWi45qtijg+1yTWsbWp8b/mf5t4dkYYv/A+46aa5j/6hjUCneT6Un4JizwfmrkrzAY8FrvGfeWm/VBquwWXWw1L6TU7rGwceqhF4wANzS3ea66yf6qFf5KZfCP6B28zrJfX4vFF580q5ebOfYflBRT1D7zLakYpdjSvsql7uFJQmihFe1z4u87iy8WDRmM5Oxq0VzX+UFs+pNGMAp/0jhhjaOxn2fUyuNQq6YXYZfc01/GGxPBYYeT21JU0yIDpOPbyDx+KJdmZziVsuRUOq20i7dx9d1nBp+2v14xoOJrAB0qVYGsf9XTlqZv2o3RK1efz9mWSxuhumV7cYwP2W4H/fCsQfncnKbqEnetRO/nn7CdMa94a9+Z1H/asY4o9RiTGUiP3dcfnyJbjcO3FuP1wvQC1MUz2dvwiQhFGz24bbPZPJEeo4fopJxHkDmzzf8r8tHJIiUQVq2/gYQqFm8IIfKCGbJ7G5rSJ3LWyyqssKJ+/eACARwrEYidohXIOKMJoyu/GU2hRqcBpYSoNCelLxhFN/e4ktU2ptYr2Vns7eeglEfebbOMpkAjZdh+9JEMBGPKa1nmfj4SBDPFzaLm8okfnb/TfOTL57vHp396p7PVwAp/7JtrZa4/8098pqiowye5BPXN8pVzV0T+0qIBKxMqouKlyq4nC/aiZkDIEKhKok6qWmxr5t132jQT9tzDebpWAS21cXAz8kKupGEVAQSU9PEe3JHaeMp6x+nQeZyddS5z5/cTwP2M/XKbWhVlU1KKGKOsyvKKUSJVdqNHX39ZRA6PGBAUWka8ZdfjobqKKF46qX/6lo4X+be0/PV4bajj8q/tHq4jeOz+29YN8nUhQcFrBZa41SVPJv9w0JJe47zBwcJofDbK9mvvnDiicfXn464PiT1nuTai99UulmMrsM6bup9To4zIhFRPCk function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
