<script>
const D={"t":"Practicetest25","q":[{"i":"be612a26","c":"vocab","d":"M","s":"Recent measurements of the mass of the W boson (a subatomic particle) were notable not only for the mere fact that the particle’s mass differed from expectations but for the ______ of that difference: the measured mass of the W boson was seven standard deviations higher than predicted by the standard model of particle physics.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["cause","existence","implication","scale"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the W boson. In this context, \"scale\" means size or extent. The text indicates that recent measurements of the W boson were remarkable because they revealed the subatomic particle’s mass to be much greater (\"seven standard deviations higher\") than had been expected based on a standard model. This context conveys not only that the measurements differed from predictions but also that the extent of the difference was very large. Choice A is incorrect. Although the text indicates that there was a very large difference between the predicted mass and the actual measured mass of the subatomic particle, it doesn’t explain the cause of, or reason behind, that difference. Choice B is incorrect because it wouldn’t make sense to say that the measurements of the subatomic particle were notable because they differed from expectations and also because a difference existed between the measurements and what had been predicted; the text would be repeating the idea that there was a difference instead of adding to that idea. Choice C is incorrect because the text doesn’t convey any implications of, or consequences of or conclusions drawn from, the fact that the mass of the subatomic particle differed from expectations; the context indicates only that the actual measured mass was much higher than the predicted mass."},{"i":"d8d33cc5","c":"vocab","d":"E","s":"The early British postal system required the cost of mail delivery to be paid upon receipt, a system which encouraged inventive strategies by the intended recipient to avoid payment. To improve this system, ______ were proposed in 1837, including the use of a postage stamp, a small receipt pasted to the mail indicating that delivery costs had been paid by the sender.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["investigations","expansions","reforms","possessions"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the early British postal system. In this context, \"reforms\" most nearly means attempts at improving something. The text indicates that the pay-upon-delivery postage method led to fee avoidance on the part of recipients. It then says that action was taken to improve the postal system, giving examples such as the move to having the sender pay and affixing stamps to indicate payment had been received. These represent revisions to the system intended to improve its functioning; therefore, \"reforms\" most logically completes the text. Choice A is incorrect. In this context, \"investigations\" most nearly means attempts to understand something. And although it is plausible that an attempt to improve the postal system would involve investigations, nothing in the text provides a logical basis for understanding the example of changes like affixing stamps to letters as an investigation. Choice B is incorrect. In this context, \"expansions\" most nearly means additions to something. Although the text indicates that some new policies were adopted, nothing in the text suggests that the overall number of policies increased, which expansions would seem to entail. Choice D is incorrect. In this context, \"possessions\" most nearly means items of personal property or things that otherwise belong to, or are part of, something. The text provides no logical context for understanding changes like affixing stamps to letters as possessions."},{"i":"84ece3f6","c":"vocab","d":"M","s":"The following text is adapted from Nathaniel Hawthorne’s 1844 short story “Drowne’s Wooden Image.” Drowne, a young man, is carving a wooden figure to decorate the front of a ship. Day by day, the work assumed greater precision, and settled its irregular and misty outline into distincter grace and beauty. The general design was now obvious to the common eye.\n\nAs used in the text, what does the word “assumed” most nearly mean?","o":["Acquired","Acknowledged","Imitated","Speculated"],"a":0,"r":"Choice A is the best answer because as used in the text, “assumed” most nearly means acquired, or came to possess. The text portrays a character named Drowne carving a figure out of wood. At first “irregular and misty,” or haphazard and indistinct, the figure’s outline gradually showed “distincter grace and beauty” until the general design of the carved object “was now obvious to the common eye,” or plainly recognizable to anyone. In other words, as Drowne continued to carve, the wooden object came to possess, or acquired, greater precision, changing from an indistinct outline or shape into a graceful, beautiful, and clearly recognizable form. Choice B is incorrect. Although in some contexts “assumed” can mean acknowledged, or recognized, it doesn’t have that meaning in this context because an inanimate object like the wooden figure can’t acknowledge its own precision. Choice C is incorrect because there’s nothing in the text to suggest that the wooden figure merely imitated, or mimicked, precision. Rather, the text suggests that as Drowne carved his wooden figure, it gradually became more precise. Choice D is incorrect. Although in some contexts “assumed” can mean speculated, or supposed based on incomplete information, it doesn’t have that meaning in this context because an inanimate object like the wooden figure can’t speculate about its own precision."},{"i":"d3104a68","c":"vocab","d":"M","s":"Birds sing to communicate over potentially great distances. For this reason, many researchers believe that birds in densely vegetated habitats generally sing at lower frequencies than birds living in comparatively sparse habitats, since dense vegetation tends to ______ the distance that high-frequency sounds can travel.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["exceed","diminish","encompass","conceal"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of birdsong. In this context, \"diminish\" means reduce or lessen. The text establishes that birds sing to communicate over potentially large distances and that researchers believe that birds that live in densely vegetated habitats sing at lower frequencies than birds that live in comparatively sparsely vegetated habitats. The text then explains that researchers hold this belief due to some effect of dense vegetation on the distance that high-frequency sounds can travel. If birds sing to communicate over long distances, it would be logical to conclude that researchers believe that birds in densely vegetated habitats sing at lower frequencies than birds in relatively sparse habitats do because dense vegetation diminishes the distance that high-frequency sounds can travel. Choice A is incorrect because nothing in the text suggests that dense vegetation can \"exceed,\" or surpass or go beyond, the distance that high- frequency sounds can travel. The text suggests that dense vegetation reduces the distance that high-frequency sounds can travel, not that dense vegetation goes farther than that distance. Choice C is incorrect because it would not be sensible to say that dense vegetation can \"encompass,\" or enclose or encircle, the distance that high-frequency sounds can travel. The distance that sounds can travel is not an object that can be enclosed or encircled by vegetation. Choice D is incorrect because there is no information in the text indicating that dense vegetation can \"conceal,\" or hide or keep from being observed, the distance that high-frequency sounds travel. Instead, the text suggests that dense vegetation reduces the distance that high-frequency sounds can travel."},{"i":"af43b0bd","c":"purpose","d":"M","s":"Researchers have long hypothesized that woolly mammoths were hunted to extinction in North America by humans using spears with grooved tips known as Clovis points. One anthropologist set out to test this hypothesis. Using a mechanical spear-thrower, he launched spears with Clovis points into mounds of clay—substitutes for the animals’ large bodies. The projectiles generally penetrated only a few inches into the clay, an amount insufficient to have harmed most woolly mammoths. This led the anthropologist to conclude that hunters using spears with Clovis points likely weren’t the principal drivers of the extinction.\n\nWhich choice best states the main purpose of the text?","o":["To argue for the significance of new findings amid an ongoing debate among researchers","To discuss the advantages and disadvantages of the method used in an experiment","To summarize two competing hypotheses and a major finding associated with each one","To describe an experiment whose results cast doubt on an established hypothesis"],"a":3,"r":"Choice D is the best answer because it most accurately states the main purpose of the text, which is to describe an experiment whose results cast doubt on an established hypothesis. The text begins by noting that researchers have long believed that woolly mammoths were hunted to extinction in North America by humans using spears with Clovis points. The text then describes an experiment conducted by an anthropologist to test this hypothesis. According to the text, the results of the experiment led the anthropologist to conclude that hunters using spears with Clovis points likely weren’t the primary cause of the extinction. The anthropologist’s results cast doubt on the long-held hypothesis presented at the beginning of the text and suggest that woolly mammoths may have become extinct in North America due to some other cause. Choice A is incorrect because there’s nothing in the text to suggest that researchers have been involved in an ongoing debate. On the contrary, the text suggests that most researchers agree on the cause of the woolly mammoth’s extinction in North America. Choice B is incorrect because the text never mentions any advantages or disadvantages of the method used in the experiment, focusing instead on the results achieved using that method. Choice C is incorrect because the text addresses only one hypothesis, that mammoths were hunted to extinction in North America by humans using spears with Clovis points. Rather than present a competing hypothesis, the text explains how one anthropologist designed an experiment to test this long-held hypothesis."},{"i":"c0e1b70a","c":"purpose","d":"M","s":"The following text is adapted from Etsu Inagaki Sugimoto’s 1925 memoir A Daughter of the Samurai. As a young woman, Sugimoto moved from feudal Japan to the United States. The standards of my own and my adopted country differed so widely in some ways, and my love for both lands was so sincere, that sometimes I had an odd feeling of standing upon a cloud in space, and gazing with measuring eyes upon two separate worlds. At first I was continually trying to explain, by Japanese standards, all the queer things that came every day before my surprised eyes; for no one seemed to know the origin or significance of even the most familiar customs, nor why they existed and were followed.\n\nWhich choice best describes the main purpose of the text?","o":["To convey the narrator’s experience of observing and making sense of differences between two cultures she embraces","To establish the narrator’s hope of forming connections with new companions by sharing customs she learned as a child","To reveal the narrator’s recognition that she is hesitant to ask questions about certain aspects of a culture she is newly encountering","To emphasize the narrator’s wonder at discovering that the physical distance between two countries is greater than she had expected"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text. The narrator asserts that she loves both her “own” country (Japan) and her “adopted country” (the United States) even though the two countries differ “widely.” She also indicates that, at first, she would try to explain unfamiliar experiences that she had in the United States using the standards ingrained in her from growing up in Japan. Thus, the main purpose of the text is to convey the narrator’s experience of observing and making sense of the differences between two cultures she embraces. Choice B is incorrect because the text makes no reference to possible companions. Although the text does indicate that the narrator sometimes used the cultural framework she acquired growing up in Japan to explain some experiences she’s had, there is no suggestion that this was in service of making friends. And although “no one seemed to know” strongly implies that the narrator has interacted with other people in the United States, there is no indication that these conversations involved her discussing Japanese customs. Choice C is incorrect because nothing in the text suggests that the narrator was hesitant to ask questions. In fact, the narrator indicates that “no one seemed to know the origin” of various customs, which provides evidence that, rather than being hesitant, she sought information from several people. Choice D is incorrect because the text makes no reference to the physical distance between Japan and the United States. Although the narrator indicates that the two countries differ “widely” and likens them to “two separate worlds,” these descriptions relate to cultural aspects of the countries and the narrator’s feelings about the two countries, not the physical distance between them."},{"i":"590f0ad2","c":"func","d":"M","s":"Industrial activity is often assumed to be a threat to wildlife, but that isn’t always so. <u>Consider the silver-studded blue butterfly (Plebejus argus<\/u>): as forest growth has reduced grasslands in northern Germany, many of these butterflies have left meadow habitats and are now thriving in active limestone quarries. In a survey of multiple active quarries and patches of maintained grassland, an ecologist found silver-studded blue butterflies in 100% of the quarries but only 57% of the grassland patches. Moreover, butterfly populations in the quarries were four times larger than those in the meadows.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It challenges a common assumption about the species under investigation in the research referred to in the text.","It introduces discussion of a specific example that supports the general claim made in the previous sentence.","It suggests that a certain species should be included in additional studies like the one mentioned later in the text.","It provides a definition for an unfamiliar term that is central to the main argument in the text."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first sentence presents the general claim that industrial activity is not always a threat to wildlife. The underlined portion of the sentence that follows suggests that the silver-studded blue butterfly is an example of wildlife thriving in areas of industrial activity: active limestone quarries. Thus, the function of the underlined portion is to introduce a specific example in support of the general claim in the previous sentence. Choice A is incorrect. Although the first sentence indicates that “industrial activity is often assumed” to harm wildlife, in the case of the silver- studded blue butterfly the text mentions neither an assumption about this species nor any challenge to such an assumption. Choice C is incorrect because the text mentions only one study: the “survey.” Additional studies are not mentioned in the text. Choice D is incorrect because neither the underlined portion nor any other portion of the text provides a definition for any of the terms used in the text’s argument."},{"i":"422c5068","c":"func","d":"M","s":"Generally it takes Tule geese about four days to migrate south for the winter. From their summer breeding grounds in Cook Inlet, Alaska, <u>the birds begin by flying over the Gulf of Alaska, keeping about 100 miles from the Canadian shore<\/u>. They pause to rest on the Pacific Ocean, then fly toward Summer Lake, Oregon, before finally arriving at their winter destination of Sacramento Valley, California. In 2020, however, it took the geese over twice as long to make their way from Cook Inlet to Sacramento Valley. According to researchers, the reason was airborne pollutants.\n\nWhich choice best states the function of the underlined portion in the text as a whole?","o":["It illustrates a change in Tule geese’s usual flight behavior.","It suggests an explanation for why Tule geese breed in Alaska.","It describes part of the Tule geese’s typical winter migration journey.","It compares Tule geese to other birds that migrate south for the winter."],"a":2,"r":"Choice C is the best answer because it best states how the underlined portion functions in the text as a whole. The first sentence states that Tule geese typically take four days to migrate south. Then in the next sentence, which contains the underlined portion, the text describes the first part of that journey, which begins with the geese flying over the Gulf of Alaska while keeping about 100 miles from the Canadian shore. The rest of the text details the remainder of the geese’s typical journey and then mentions circumstances in 2020 that resulted in the geese taking an unusually long time to complete it. Thus, the underlined portion describes part of the Tule geese’s typical winter migration journey. Choice A is incorrect. Although the text concludes by stating that in 2020, Tule geese took twice as long to complete their typical migration, which suggests a change in their usual flight behavior, the underlined portion doesn’t discuss this. Instead, the underlined portion describes the first part of the Tule geese’s typical winter migration journey over the Gulf of Alaska. Choice B is incorrect. Although the sentence containing the underlined portion mentions that Tule geese breed in Alaska, the underlined portion doesn’t explain why the geese breed in that location. Rather, the text mentions Alaska to explain that it’s the starting point of the Tule geese’s typical winter migration. Choice D is incorrect because the underlined portion doesn’t discuss any other birds that migrate south for the winter. In fact, the text is only concerned with the migration of Tule geese."},{"i":"a87c3925","c":"cross","d":"H","s":"Text 1 Soy sauce, made from fermented soybeans, is noted for its umami flavor. Umami—one of the five basic tastes along with sweet, bitter, salty, and sour—was formally classified when its taste receptors were discovered in the 2000s. In 2007, to define the pure umami flavor scientists Rie Ishii and Michael O’Mahony used broths made from shiitake mushrooms and kombu seaweed, and two panels of Japanese and US judges closely agreed on a description of the taste.\n\nText 2 A 2022 experiment by Manon Jünger et al. led to a greater understanding of soy sauce’s flavor profile. The team initially presented a mixture of compounds with low molecular weights to taste testers who found it was not as salty or bitter as real soy sauce. Further analysis of soy sauce identified proteins, including dipeptides, that enhanced umami flavor and also contributed to saltiness. The team then made a mix of 50 chemical compounds that re-created soy sauce’s flavor.\n\nBased on the texts, if Ishii and O’Mahony (Text 1) and Jünger et al. (Text 2) were aware of the findings of both experiments, they would most likely agree with which statement?","o":["On average, the diets of people in the United States tend to have fewer foods that contain certain dipeptides than the diets of people in Japan have.","Chemical compounds that activate both the umami and salty taste receptors tend to have a higher molecular weight than those that only activate umami taste receptors.","Fermentation introduces proteins responsible for the increase of umami flavor in soy sauce, and those proteins also increase the perception of saltiness.","The broths in the 2007 experiment most likely did not have a substantial amount of the dipeptides that played a key part in the 2022 experiment."],"a":3,"r":"Choice D is the best answer. Ishii and O’Mahony were trying to isolate the pure umami flavor, while Jünger was trying to recreate soy sauce, which has a mix of flavors that includes umami. Accordingly, the broths from Text 1 are not described as having any soy sauce in them—just “shiitake mushrooms and kombu seaweed.” So they probably don’t have as much of the dipeptides described in Text 2, which were found to be a key part of soy sauce’s umami-ness and its saltiness. Choice A is incorrect. Neither text supports this. Neither text gets into the diets of people in the United States, nor the diets of people in Japan. Choice B is incorrect. Neither text supports this. Text 2 does talk about the molecular weights of chemical compounds, but there isn’t enough information provided about molecular weights in Text 1 to make an inference about what the scientists in Text 1 would say. Choice C is incorrect. Neither text supports this. Text 1 briefly mentions that soy sauce is “made from fermented soybeans,” but it never claims that fermentation is responsible for its flavor in any way. And Text 2 never mentions fermentation at all."},{"i":"d2e0cba5","c":"main","d":"H","s":"In a study of new technology adoption, Davit Marikyan et al. examined negative disconfirmation (which occurs when experiences fall short of one’s expectations) to determine whether it could lead to positive outcomes for users. The team focused on established users of “smart home” technology, which presents inherent utilization challenges but tends to attract users with high expectations, often leading to feelings of dissonance. The researchers found that many users employed cognitive mechanisms to mitigate those feelings, ultimately reversing their initial sense of disappointment.\n\nWhich choice best states the main idea of the text?","o":["Research suggests that most users of smart home technology will not achieve a feeling of satisfaction given the utilization challenges of such technology.","Although most smart home technology is aimed at meeting or exceeding users’ high expectations, those expectations in general remain poorly understood.","Research suggests that users with high expectations for a new technology can feel content with that technology even after experiencing negative disconfirmation.","Although negative disconfirmation has often been studied, little is known about the cognitive mechanisms shaping users’ reactions to it in the context of new technology adoption."],"a":2,"r":"Choice C is the best answer. The passage begins by describing the study, and concludes with its results: \"many users employed cognitive mechanisms to mitigate those feelings [of negative disconfirmation].\" Choice A is incorrect. This is the opposite of what the text claims. Rather, the researchers found that \"many users\" reversed \"their initial sense of disappointment.\" Choice B is incorrect. This choice doesn’t reflect the text. What the expectations of smart home tech users are is not discussed. Choice D is incorrect. This choice doesn’t reflect the text. How often these topics have been studied is not mentioned."},{"i":"57485f5e","c":"main","d":"E","s":"The following text is adapted from Johanna Spyri’s 1881 novel Heidi (translated by Elisabeth Stork in 1915). Eight-year-old Heidi and her friend’s grandmother are looking at some illustrated books. Heidi had come and was looking with wondering eyes at the splendid pictures in the large books, that Grandmama was showing her. Suddenly she screamed aloud, for there on the picture she saw a peaceful flock grazing on a green pasture. In the middle a shepherd was standing, leaning on his crook. The setting sun was shedding a golden light over everything. With glowing eyes Heidi devoured the scene.\n\nWhich choice best states the main idea of the text?","o":["Heidi is upset until she sees a serene image of a pasture in one of Grandmama’s books.","Heidi is delighted and fascinated by an image she sees in one of Grandmama’s books.","Heidi is initially frightened by an image in one of Grandmama’s books but quickly comes to appreciate its beauty.","Heidi is inspecting an image in one of Grandmama’s books because she has never seen a shepherd with his sheep before."],"a":1,"r":"Choice B is the best answer because it most effectively states the main idea of the text, which is that Heidi is delighted and fascinated by an image she sees in one of Grandmama’s books. In the text, Heidi screams upon first seeing the picture of the green pasture. In another context, such a reaction might suggest fear, but here the reaction is followed by descriptions of an image that’s peaceful rather than scary. The text goes on to describe Heidi’s eyes as “glowing” and states that she “devoured the scene,” suggesting that the image delights and fascinates her so much that she wants to examine every detail. Together, these descriptions suggest that Heidi is thrilled and intrigued by the image in the book. Choice A is incorrect because there’s nothing in the text to suggest that Heidi is upset before seeing the peaceful image of the green pasture. Before Heidi sees that image, the text describes her as “looking with wondering eyes at the splendid pictures” in the book, suggesting that Heidi is intrigued, not that she’s unhappy. Choice C is incorrect. Although Heidi screams upon first seeing the image, the text’s description of the image and Heidi’s other reactions to it suggest that she is screaming with delight, not fear. The text describes the images in the book as “splendid” and the particular image that causes her to scream as peaceful rather than frightening. It also describes Heidi’s eyes as “glowing” and states that she “devoured the scene,” suggesting that the image of the green pasture delights and fascinates her so much that she wants to examine every detail. Choice D is incorrect because it’s unclear from the text whether Heidi has ever seen a shepherd with his sheep before. The text merely suggests that she is delighted and fascinated by the image of the shepherd and his sheep."},{"i":"bcbcc43f","c":"infer","d":"M","s":"The ancient Sumerian civilization formed around 4000 BCE between two large rivers in an area that is now Iraq and Syria. The extremely hot and sunny weather in that area helped crops grow very quickly, but it also made it hard to keep the crops from drying up and dying. So, the Sumerians used water from the rivers in their farming. That method worked so well that they often could harvest even more crops than they needed in a season. As a result, the Sumerians ______ Which choice most logically completes the text?","o":["harvested crops only on the hottest days of each season.","found ways to shield their crops from the sun.","did not begin farming until long after 4000 BCE.","were able to store extra crops for later use."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically completes the text’s discussion of Sumerian civilization and crop growth. The text mentions the hot, sunny weather in the area where the Sumerians lived, which made crops grow quickly but also made it difficult to keep them alive. The Sumerians solved this problem by using river water for their farming—as a result, they often harvested more crops than were needed in a season. It follows that the Sumerians must have needed to find something to do with the surplus crops—that is, they stored the extra crops for later use. Choice A is incorrect because it doesn’t logically follow that a surplus in crops would lead the Sumerians to choose only certain days of the season to harvest. Nor is there any indication in the text that the Sumerians improved their farming methods with the goal of reducing the time spent farming. Choice B is incorrect because the text doesn’t suggest that the Sumerians tried to shield their crops from the sun: in fact, the text indicates that the sunny weather helped crops grow very quickly and that the Sumerians used river water to allow crops to be exposed to the sun without dying. Choice C is incorrect. Having a surplus of crops wouldn’t have caused the Sumerians to begin farming until long after 4000 BCE: in fact, since the text indicates that the Sumerian civilization formed around 4000 BCE and farming was a part of that civilization, the statement that Sumerians only began farming long after 4000 BCE isn’t supported by the text."},{"i":"03701ef3","c":"infer","d":"H","s":"To better understand the burrowing habits of Alpheus bellulus (the tiger pistol shrimp), some studies have used resin casting to obtain precise measurements of the shrimps’ burrows. Resin casting involves completely filling an empty burrow with a liquid plastic that hardens to create a three-dimensional model; however, recovering the model inevitably requires destroying the burrow. In their 2022 study, Miyu Umehara and colleagues discovered that an x-ray computed tomography (CT) scanner can accurately record a burrow’s measurements both at a moment in time and throughout the entire burrow-building process, something that’s impossible with resin casting because ______ Which choice most logically completes the text?","o":["it can only be used on burrows below a certain size.","it does not allow for multiple castings of the same burrow over time.","the casting process takes more time than A. bellulus takes to construct a burrow.","the process of recovering the model distorts the resin’s shape."],"a":1,"r":"Choice B is the best answer. Since resin casting “inevitably requires destroying the burrow,” it would be impossible to make multiple castings of the same burrow over time. Choice A is incorrect. The passage doesn’t discuss size requirements for completing resin casting, so there’s no basis for this inference. Choice C is incorrect. The passage never mentions how long the casting process takes nor how long A. bellulus takes to construct a borrow, so there’s no basis for this inference. Choice D is incorrect. The passage never states that recovering the model distorts the resin’s shape, only that it destroys the burrow. Therefore, there’s no basis for this inference."},{"i":"0045c234","c":"claim","d":"H","s":"Given that stars and planets initially form from the same gas and dust in space, some astronomers have posited that host stars (such as the Sun) and their planets (such as those in our solar system) are composed of the same materials, with the planets containing equal or smaller quantities of the materials that make up the host star. This idea is also supported by evidence that rocky planets in our solar system are composed of some of the same materials as the Sun.\n\nWhich finding, if true, would most directly weaken the astronomers’ claim?","o":["Most stars are made of hydrogen and helium, but when cooled they are revealed to contain small amounts of iron and silicate.","A nearby host star is observed to contain the same proportion of hydrogen and helium as that of the Sun.","Evidence emerges that the amount of iron in some rocky planets is considerably higher than the amount in their host star.","The method for determining the composition of rocky planets is discovered to be less effective when used to analyze other kinds of planets."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would weaken the astronomers’ claim about the makeup of host stars and their planets. The text explains that because stars and planets begin forming from the same gas and dust, astronomers believe planets should be composed of the same materials as their host stars, but in equal or smaller quantities. The finding that the amount of iron in some rocky planets is much higher than the amount in their host star would weaken the astronomers’ claim because it would show that some planets contain the same material as their host star, but in higher quantities. Choice A is incorrect because a finding only about the makeup of stars, whether they’ve cooled or not, would provide no information about the makeup of planets. Thus, it wouldn’t have any bearing on the claim that planets and their host stars are composed of the same materials in differing quantities. Choice B is incorrect because a finding about two host stars having similar proportions of certain materials wouldn’t provide any information about the makeup of planets. Thus, it wouldn’t be relevant to the claim that planets and their host stars are composed of the same materials in differing quantities. Choice D is incorrect because the text indicates that the astronomers’ claim is based on a fact—that stars and planets begin forming from the same gas and dust in space—which would remain true regardless of the effectiveness of a method for analysis of compositions. The text does cite analysis of rocky planets in our solar system and the Sun, but only as a single piece of evidence that is consistent with the claim and not as the source of the claim; the finding that the method used for that analysis is less effective in other scenarios wouldn’t weaken a claim that’s based on knowledge of how stars and planets initially form."},{"i":"2ef8e367","c":"claim","d":"M","s":"“To You” is an 1856 poem by Walt Whitman. In the poem, Whitman suggests that he deeply understands the reader, whom he addresses directly, writing, ______ Which quotation from “To You” most effectively illustrates the claim?","o":["“Your true soul and body appear before me.”","“Whoever you are, now I place my hand upon you, that you be my poem.”","“I should have made my way straight to you long ago.”","“Whoever you are, I fear you are walking the walks of dreams.”"],"a":0,"r":"Choice A is the best answer because it most directly illustrates the text’s claim about Whitman’s poem, “To You.” The text says that in this poem, Whitman suggests that he deeply understands the poem’s reader. This quotation says that the reader’s “true soul and body appear before” Whitman, thereby asserting that he can see the reader as the reader truly is, suggesting that he deeply understands the reader. Choice B is incorrect because this quotation describes Whitman making the reader the subject of the poem (“you be my poem”), not Whitman deeply understanding the reader. Choice C is incorrect because instead of suggesting that Whitman deeply understands the reader, it emphasizes Whitman’s regret at not having addressed the reader sooner. Choice D is incorrect. Although this quotation shows Whitman directly addressing the reader and expressing concern about the reader, it doesn’t illustrate the idea that Whitman suggests that he deeply understands the reader. The quotation is simply expressing concern about the reader, which doesn’t necessarily imply deep understanding of the reader."},{"i":"1703403b","c":"graph","d":"E","s":"","o":["Rincón’s average rainfall is greater than that of Isabela, San Sebastián, and Ponce.","Rincón and Ponce have an average rainfall of about 5 inches, and Isabela and San Sebastián have an average rainfall of about 10 inches.","Rincón, Ponce, and Isabela each have an average rainfall below 8 inches, but San Sebastián’s average rainfall that month is greater than 8 inches.","Rincón has a similar average rainfall to Isabela, and Ponce has a similar average rainfall to San Sebastián."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the graph to complete the statement about average rainfall in September in select Puerto Rican cities. The graph shows that between 1981 and 2010 Rincón, Ponce, and Isabela all had an average rainfall during the month of September of about 6 inches, and San Sebastián had an average rainfall of nearly 11 inches. Describing the average September rainfall of Rincón, Ponce, and Isabela as below 8 inches and the average September rainfall of San Sebastián as greater than 8 inches therefore offers an accurate description of the data in the graph and most effectively completes the statement. Choice A is incorrect because it offers an inaccurate interpretation of the data in the graph. The graph shows that in September, Rincón, Isabela, and Ponce all have an average rainfall of about 6 inches, and San Sebastián has an average rainfall of nearly 11 inches. Therefore, Rincón’s average rainfall is the same as, not greater than, that of Isabela and Ponce, and it is below, not greater than, that of San Sebastián. Choice B is incorrect because it inaccurately describes the data in the graph. In September, Rincón and Ponce have an average rainfall of about 6 inches, not 5 inches; Isabela has an average rainfall of about 6 inches, not 10 inches; and San Sebastián has an average rainfall of nearly 11 inches, not 10 inches. Choice D is incorrect because although the graph shows a similar average rainfall (about 6 inches) for Rincón and Isabela in September, it doesn’t show that Ponce has a similar average rainfall to San Sebastián during this month. In September, Ponce’s average rainfall is about 6 inches, whereas San Sebastián’s average rainfall is nearly 11 inches."},{"i":"89f71526","c":"graph","d":"E","s":"","o":["Alcedo.","Pacaya.","Fernandina.","Maule."],"a":1,"r":"Choice B is the best answer. Pacaya had a deformation rate of almost 3.5 centimeters per month, while Sierra Negra had a deformation rate of less than 3 centimeters per month. Therefore, Sierra Negra’s deformation rate was lower than Pacaya’s. Choice A is incorrect. Alcedo has a lower rate of deformation than Sierra Negra. Choice C is incorrect. Fernandina has a lower rate of deformation than Sierra Negra. Choice D is incorrect. Maule has a lower rate of deformation than Sierra Negra."},{"i":"b74f676f","c":"fss","d":"H","s":"Classical composer Florence Price’s 1927 move to Chicago marked a turning point in her career. It was there that Price premiered her First Symphony—a piece that was praised for blending traditional Romantic motifs with aspects of Black folk music—and ______ supportive relationships with other Black artists.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["developing","developed","to develop","having developed"],"a":1,"r":"Choice B is the best answer. The missing verb is part of the same clause as the verb \"premiered,\" and \"Price\" is the subject of both. So we need the past-tense form \"developed\" in order to match \"premiered.\" Choice A is incorrect. This choice creates a verb form error. The missing verb is part of the same clause as the verb \"premiered,\" and \"Price\" is the subject of both. So we need the past-tense form \"developed\" in order to match \"premiered.\" Choice C is incorrect. This choice creates a verb form error. The missing verb is part of the same clause as the verb \"premiered,\" and \"Price\" is the subject of both. So we need the past-tense form \"developed\" in order to match \"premiered.\" Choice D is incorrect. This choice creates a verb form error. The missing verb is part of the same clause as the verb \"premiered,\" and \"Price\" is the subject of both. So we need the past-tense form \"developed\" in order to match \"premiered.\""},{"i":"75f49353","c":"fss","d":"M","s":"The Progressive Era in the United States witnessed the rise of numerous Black women’s clubs, local organizations that advocated for racial and gender equality. Among the clubs’ leaders ______ Josephine St. Pierre Ruffin, founder of the Women’s Era Club of Boston.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["was","were","are","have been"],"a":0,"r":"Choice A is the best answer. The convention being tested here is subject-verb agreement. The singular verb “was” agrees in number with the singular subject “Josephine St. Pierre Ruffin.” Choice B is incorrect because the plural verb “were” doesn’t agree in number with the singular subject “Josephine St. Pierre Ruffin.” Choice C is incorrect because the plural verb “are” doesn’t agree in number with the singular subject “Josephine St. Pierre Ruffin.” Choice D is incorrect because the plural verb “have been” doesn’t agree in number with the singular subject “Josephine St. Pierre Ruffin.”"},{"i":"908a76b8","c":"fss","d":"H","s":"When a given industry—water and electricity are two well-known examples—carries high infrastructural start-up costs and other barriers that discourage competition, ______ of just one or two suppliers per municipality. Such industries are known as natural monopolies.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["these often consist","they often consist","it often consists","this often consists"],"a":2,"r":"Choice C is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"industry\" and clearly indicates that the industry consists of just one or two suppliers per municipality. Choice A is incorrect. The plural pronoun \"these\" neither agrees in number with the singular antecedent \"industry\" nor clearly indicates that the industry—not another plural noun in the sentence, such as \"start-up costs\" or \"barriers\"—consists of just one or two suppliers per municipality. Choice B is incorrect because the plural pronoun \"they\" doesn’t agree in number with the singular antecedent \"industry.\" Choice D is incorrect because the singular pronoun \"this\" is ambiguous in this context; the resulting sentence leaves unclear what consists of just one or two suppliers per municipality."},{"i":"de55ec71","c":"bound","d":"E","s":"Generations of mystery and horror ______ have been influenced by the dark, gothic stories of celebrated American author Edgar Allan Poe (1809– 1849).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["writers","writers,","writers—","writers;"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation between a subject and a verb. When, as in this case, a subject (“Generations of mystery and horror writers”) is immediately followed by a verb (“have been influenced”), no punctuation is needed. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice C is incorrect because no punctuation is needed between the subject and the verb. Choice D is incorrect because no punctuation is needed between the subject and the verb."},{"i":"8a3998f1","c":"bound","d":"E","s":"After the United Kingdom began rolling out taxes equivalent to a few cents on single-use plastic grocery bags in 2011, plastic-bag consumption decreased by up to ninety ______ taxes are subject to what economists call the “rebound effect”: as the change became normalized, plastic-bag use started to creep back up.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["percent, such","percent and such","percent. Such","percent such"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “percent” is used correctly to mark the boundary between one sentence (“After…percent”) and another (“Such…up”). Choice A is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice B is incorrect. Without a comma preceding it, the conjunction “and” can’t be used in this way to join sentences. Choice D is incorrect because it results in a run-on sentence. The sentences (“After…percent” and “Such…up”) are fused without punctuation and/or a conjunction."},{"i":"b46e0c8a","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Organisms release cellular material into their environment by shedding substances such as hair or skin. The DNA in these substances is known as environmental DNA, or eDNA. Researchers collect and analyze eDNA to detect the presence of species that are difficult to observe. Geneticist Sara Oyler-McCance’s research team analyzed eDNA in water samples from the Florida Everglades to detect invasive constrictor snake species in the area. The study determined a 91% probability of detecting Burmese python eDNA in a given location. The student wants to present the study to an audience already familiar with environmental DNA.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Sara Oyler-McCance’s researchers analyzed eDNA in water samples from the Florida Everglades for evidence of invasive constrictor snakes, which are difficult to observe.","An analysis of eDNA can detect the presence of invasive species that are difficult to observe, such as constrictor snakes.","Researchers found Burmese python eDNA, or environmental DNA, in water samples; eDNA is the DNA in released cellular materials, such as shed skin cells.","Sara Oyler-McCance’s researchers analyzed environmental DNA (eDNA)—that is, DNA from cellular materials released by organisms—in water samples from the Florida Everglades."],"a":0,"r":"Choice A is the best answer. This choice presents the study in a way that assumes the audience is already familiar with eDNA. Choice B is incorrect. This choice doesn’t present the study. It only states a general fact about eDNA analysis. Choice C is incorrect. This choice isn’t suited for an audience already familiar with eDNA. A familiar audience wouldn’t need to have the term defined or explained. Choice D is incorrect. This choice isn’t suited for an audience already familiar with eDNA. A familiar audience wouldn’t need to have the term defined or explained. It also doesn’t present the study."},{"i":"d7c5388f","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Planetary scientists classify asteroids based on their composition. C-type asteroids are composed primarily of carbon. They account for roughly 75 percent of known asteroids. S-type asteroids are primarily made up of silicate minerals. They account for roughly 17 percent of known asteroids. The student wants to emphasize a difference between C-type and S-type asteroids.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Planetary scientists classify asteroids into types, two of which are the C-type and the S-type.","Planetary scientists consider an asteroid’s composition (such as whether the asteroid is composed mainly of silicate minerals or carbon) when classifying it.","Roughly 17 percent of known asteroids are classified as S-type asteroids; another percentage is classified as C-type asteroids.","C-type asteroids are mainly composed of carbon, whereas S-type asteroids are primarily made up of silicate minerals."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes a difference between C-type and S-type asteroids, noting that C-type asteroids are mainly composed of carbon, while S-type asteroids are mainly composed of silicate minerals. Choice A is incorrect. The sentence states that C-type and S-type are two types of asteroids, but it doesn’t emphasize a difference between them. Choice B is incorrect because it doesn’t directly mention C-type or S-type asteroids. Choice C is incorrect. While the sentence mentions that 17 percent of known asteroids are S-type asteroids, it doesn’t identify the percentage of asteroids that are C-type. Therefore, the sentence doesn’t emphasize a difference between the two types."},{"i":"25361ec6","c":"trans","d":"M","s":"Scientists long debated the origins of chondrules, tiny glass beads that formed in meteors billions of years ago. For decades, different theories were proposed, from lightning strikes to powerful rock collisions, but none had sufficient evidentiary support. ______ scientists found strong evidence that chondrules were formed by shock waves in nearby nebulae.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","Therefore,","Similarly,","Finally,"],"a":3,"r":"Choice D is the best answer. \"Finally\" logically signals that the information in this sentence—that scientists found evidence that chondrules were formed by shock waves in nearby nebulae—indicates a conclusion to the scientific debate mentioned in the previous sentences. Choice A is incorrect because \"for example\" illogically signals that the information about the evidence for chondrule formation in this sentence exemplifies the information about the scientific debate regarding chondrule formation in the previous sentences. Instead, it indicates a conclusion to the debate. Choice B is incorrect because \"therefore\" illogically signals that the information in this sentence is a result of the previous information about the scientific debate regarding chondrule formation. Instead, it indicates a conclusion to the debate. Choice C is incorrect because \"similarly\" illogically signals that the information that follows is similar to the information about the scientific debate regarding chondrule formation in the previous sentences. Instead, it indicates a conclusion to the debate."},{"i":"6e0c60da","c":"trans","d":"H","s":"When one looks at the dark craggy vistas in Hitoshi Fugo’s evocative photo series, one’s mind might wander off to the cratered surfaces of faraway planets. ______ it’s the series’ title, Flying Frying Pan, that brings one back to Earth, reminding the viewer that each photo is actually a close-up view of a familiar household object: a frying pan.\n\nWhich choice completes the text with the most logical transition?","o":["Consequently,","Alternatively,","Ultimately,","Additionally,"],"a":2,"r":"Choice C is the best answer. The first sentence describes an experience that the viewer has when they’re looking at the photos: they imagine other planets. This sentence describes an experience that the viewer has afterward: the title reminds them that the photos are of frying pans, bringing them back to reality. “Ultimately” is a transition that means “eventually” or “in the end,” so it fits the context perfectly. Choice A is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. The viewer imagining other planets when they’re looking at the photos doesn’t cause the title to bring them back to reality. Choice B is incorrect. This choice uses a transition that indicates another option or possibility, which doesn’t make sense here. Rather, the viewer has both experiences: first the viewer imagines that they’re looking at another planet, and then the title reminds them that it’s just a frying pan. Choice D is incorrect. This choice uses a transition that indicates the addition of an agreeing idea. But the viewer’s experience in the second sentence is actually the opposite of the viewer’s experience in the first sentence. In the first sentence, the viewer is imagining that they’re seeing a landscape from another planet. In the second sentence, the viewer is reminded that they’re looking at a frying pan."},{"i":"39d1a519","c":"trans","d":"M","s":"To discover which fruit varieties were grown in Italy’s Umbria region before the introduction of industrial farming, botanist Isabella Dalla Ragione often turns to centuries-old lists of cooking ingredients. ______ she analyzes Renaissance paintings of Umbria, as they can provide accurate representations of fruits that were grown there long ago.\n\nWhich choice completes the text with the most logical transition?","o":["In sum,","Instead,","Thus,","Additionally,"],"a":3,"r":"Choice D is the best answer. “Additionally” logically signals that the painting analysis discussed in this sentence is an additional part of the botany research discussed in the previous sentence. That is, to research which fruits Umbrians grew in the past, the botanist analyzes old paintings in addition to looking at old lists of ingredients. Choice A is incorrect because “in sum” illogically signals that the painting analysis discussed in this sentence is a concluding summary of the botany research discussed in the previous sentence. Instead, the painting analysis is an additional part of that research. Choice B is incorrect because “instead” illogically signals that the painting analysis discussed in this sentence is an alternative to the botany research discussed in the previous sentence. Rather, the painting analysis is an additional part of that research. Choice C is incorrect because “thus” illogically signals that the painting analysis discussed in this sentence is a result of the botany research discussed in the previous sentence. Instead, the painting analysis is an additional part of that research."}],"img":{"1703403b":"iVBORw0KGgoAAAANSUhEUgAAArwAAAJVBAMAAADO3zs6AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABAx0lEQVR42u1dZ2AURRt+Zq+kQLjZhCYgbBKaFLmELqgXSJCmHFXFQkRAQZFYKAJKQEWKJYBI/SQgvYYqnVCkBjiq9ByCKCXcXlAISe7m+5EEcpc9kkACl8s8f5Kd2Z3bffbdZ973ndlZgIODg4ODg4ODg4ODg4ODg4ODg8PtQfJVnMdqjnugoPf+y06dCBB6f7fSElCGAhQIpAABQgAAr0UBNFxlyNrmcIBmpQO3961zPIh3/P3tSpFA
