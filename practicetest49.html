<script>
const D={"t":"Practicetest49","q":[{"i":"5effa190","c":"vocab","d":"E","s":"The process of mechanically recycling plastics is often considered ______ because of the environmental impact and the loss of material quality that often occurs. But chemist Takunda Chazovachii has helped develop a cleaner process of chemical recycling that converts superabsorbent polymers from diapers into a desirable reusable adhesive.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["resilient","inadequate","dynamic","satisfactory"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion about recycling plastics. In this context, “inadequate” means not satisfactory. The text indicates that the mechanical plastic-recycling process affects the environment and causes “the loss of material quality.” The text contrasts that with Chazovachii’s chemical plastic-recycling process, which is cleaner and produces a desirable product. The text’s emphasis on the negative aspects of mechanical recycling suggests that it is inadequate in terms of environmental impact and the quality of the material the process yields. Choice A is incorrect because in this context “resilient” would mean able to withstand difficulty and the text does not characterize the plastic- recycling process as having this quality or describe any difficulties that these processes might need to overcome. Choice C is incorrect because in this context “dynamic” would mean constantly changing. Although the text suggests that there have been changes in the field of recycling, as is the case with the advent of Chazovachii’s chemical recycling process, there is nothing to suggest that the mechanical process itself has changed or is prone to change. Choice D is incorrect because in this context “satisfactory” would mean acceptable but not perfect. The text mentions only shortcomings of the mechanical process (environmental effects and lower material quality), so the text more strongly supports a negative view of this process and provides no evidence that it would be considered satisfactory."},{"i":"b507f90f","c":"vocab","d":"E","s":"Latro, the main character of Gene Wolfe’s novel Soldier of the Mist, is a man in ancient Greece. He completely loses his memory whenever he sleeps. So, before sleeping, Latro records the important experiences of each day on a scroll, carefully choosing which ones to ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["suspect","preserve","suggest","imagine"],"a":1,"r":"Choice B is the best answer because it most logically completes the text about Latro, the main character in Gene Wolfe’s novel Soldier of the Mist. In this context, \"preserve\" means save or keep from destruction or loss. The text describes Latro as a character who loses his memory whenever he sleeps. The text goes on to explain that before going to sleep, Latro records his most important memories to prevent him from forgetting, or losing, them. The context therefore supports the idea that Latro records his most important experiences in an effort to save, or preserve, his memory of them from loss. Choice A is incorrect because \"suspect\" would mean mistrust, which wouldn’t make sense in this context. The text emphasizes that in writing down his experiences, Latro carefully chooses those which are most important to him and thus worth remembering later, not that he is mistrustful or has reason to doubt the experiences he records. Choice C is incorrect because in this context, \"suggest\" would mean propose for consideration. The text emphasizes the fact that Latro actually records those experiences that he has decided are most important to him, not that he merely proposes which experiences to consider for inclusion in his scroll. Choice D is incorrect because in this context, \"imagine\" would either mean form a mental image of or fabricate, neither of which would logically complete the text. Although it’s possible that reviewing records from previous days might enable Latro to reconstruct mental images of what has happened to him in the past, the text emphasizes the fact that Latro carefully selects and writes down his experiences so he will remember them in the future, not so that he can form mental pictures of them as he writes them down. In a similar vein, the text emphasizes that Latro is recording experiences that have actually happened to him, not that he’s fabricating the experiences he records."},{"i":"8a47383f","c":"vocab","d":"E","s":"The National Heritage Fellowship was created to publicly ______ exceptional folk and traditional artists in the United States. In 2015, the fellowship was given to the circus aerialist (mid-air acrobat) Dolly Jacobs to celebrate her lifetime contributions to the arts.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["startle","recognize","familiarize","convey"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the purpose of the National Heritage Fellowship. In this context, \"recognize\" means acknowledge or honor someone officially for their achievements. The text states that the fellowship was created for \"exceptional folk and traditional artists.\" It then provides an example of one recipient of the fellowship, circus aerialist Dolly Jacobs, who was given the fellowship \"to celebrate her lifetime contributions to the arts.\" The fact that the fellowship is given to celebrate exceptional artists for their achievements therefore suggests that its purpose is to publicly honor, or recognize, them. Choice A is incorrect because \"startle\" would mean alarm or surprise, and there’s nothing in the text to suggest that Jacobs and other artists who received the National Heritage Fellowship didn’t expect to receive it or were alarmed by it. It therefore wouldn’t make sense to say the fellowship was created to publicly alarm or surprise exceptional artists. Choice C is incorrect because in this context, \"familiarize\" would mean make known or familiar, but the text gives no indication that Jacobs or other recipients of the National Heritage Fellowship were unknown or unfamiliar before receiving the fellowship or that the fellowship was intended to make them familiar to the public. In fact, the text describes recipients as \"exceptional\" and notes that Jacobs received the award \"to celebrate her lifetime contributions to the arts,\" both of which suggest that Jacobs and other recipients were already well known in the arts world. Choice D is incorrect because \"convey\" would mean either transport or communicate something, neither of which would be logical in this context. The fellowship doesn’t transport artists, and though the process of awarding the fellowship might communicate something about the artists to the general public, it would be illogical to state that the fellowship communicates the artists themselves. Rather, the fellowship honors artists for their contributions."},{"i":"8634bf4a","c":"vocab","d":"M","s":"Diego Velázquez was the leading artist in the court of King Philip IV of Spain during the seventeenth century, but his influence was hardly ______ Spain: realist and impressionist painters around the world employed his techniques and echoed elements of his style.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["derived from","recognized in","confined to","repressed by"],"a":2,"r":"Choice C is the best answer because it most logically completes the discussion of the artist Diego Velázquez’s influence outside Spain. As used in this context, “confined to” means restricted to. The text says that Velázquez was the leading artist in the Spanish court during the seventeenth century, but it also notes that other painters around the world were influenced by his techniques and style. Thus, Velázquez’s influence was hardly (or almost not) confined to, or restricted to, Spain. Choice A is incorrect because if Velázquez was a leading artist in Spain, it doesn’t make logical sense to claim that his influence was hardly (or almost not) derived from, or obtained from, Spain. Moreover, the other painters around the world who employed Velázquez’s techniques would by definition be influenced by Spanish style. Choice B is incorrect because if Velázquez was a leading artist in the court of King Philip IV of Spain, then his influence must have been widely recognized, or acknowledged, rather than being hardly (or almost not) recognized. Choice D is incorrect because the text gives no indication that deliberately limiting Velázquez’s influence outside Spain was ever considered by anyone. Thus, even if it is true that his influence was not repressed, or restrained, it doesn’t make logical sense to say so in this context."},{"i":"a1d2c4d0","c":"purpose","d":"H","s":"Pteropods are small swimming snails with thin, delicate calcium carbonate shells. These animals are thought to be especially vulnerable to ocean acidification due to calcium carbonate’s susceptibility to dissolution at lower pH values. Victoria L. Peck and colleagues recently found that the periostracum (a protective coating on pteropods’ outer shells) prevents this dissolution when intact. Moreover, the team was surprised to discover that even when the periostracum is breached, pteropods can still mitigate damage by rebuilding the inner shell wall.\n\nWhich choice best describes the main purpose of the text?","o":["To call for additional research on biological mechanisms that improve pteropod survival rates","To discuss a conclusion drawn in a study of calcium carbonate’s role in protecting the periostracum of pteropods","To address some of the ways ocean acidification has altered pteropod behavior over time","To present findings that suggest that a concern about the effects of ocean acidification on pteropod shells may be unwarranted"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to present findings that suggest a previously held concern about the effects of ocean acidification on pteropod shells may be unwarranted. The text introduces the concern that pteropods are thought to be particularly vulnerable to ocean acidification, or lower pH levels, due to the susceptibility of their calcium carbonate shells to dissolution at lower pH levels. However, the text then describes findings from a recent study that suggest this concern may be unjustified, insofar as the protective periostracum coating on a pteropod’s shell prevents dissolution, and even when the coating is breached, a pteropod can rebuild the inner shell wall, reducing the damage. Choice A is incorrect because the text doesn’t call for additional research or suggest that more research is needed on biological mechanisms that improve pteropod survival rates. Instead, the text discusses a recent study showing that pteropods may not be as vulnerable to ocean acidification as is feared. Choice B is incorrect because the study discussed in the text doesn’t address calcium carbonate’s role in protecting the periostracum of pteropods. According to the text, the study addresses the periostracum’s role in protecting pteropods’ calcium carbonate shells from dissolution due to ocean acidification. Choice C is incorrect because the text doesn’t address how ocean acidification has altered pteropod behavior over time. Instead, the text focuses on the potential effects of ocean acidification on pteropods’ shells and the mechanisms protecting against those effects."},{"i":"eaea6f8f","c":"purpose","d":"E","s":"Ordinary soap bubbles usually exist for a minute or less before popping due to either a rupture forced by gravity-induced drainage or the evaporation of the liquid from which the bubble is composed. But physicist Aymeric Roux and colleagues discovered ways to mitigate these factors, resulting in bubbles that can last for a year or more. For example, glycerol tends to adhere to water molecules, so <u>a bubble with a shell that contains both water and glycerol is able to draw additional water molecules from the surrounding air and thereby compensate for evaporation.<\/u> Which choice best states the purpose of the underlined portion in the text as a whole?","o":["It describes the effects of a process devised by researchers that increases the longevity of an object discussed in the text.","It details the circumstances that prompted the research discussed in the text.","It presents a reason why the phenomenon discussed in the text that the researchers wanted to avoid will inevitably occur.","It mentions a method discussed in the text that researchers intend to test in future experiments."],"a":0,"r":"Choice A is the best answer because it describes how the underlined portion of the sentence functions in the text as a whole. The text begins by discussing ordinary soap bubbles, objects that usually exist for less than a minute before popping due to either evaporation or gravity-induced drainage. The text then goes on to mention work by researchers Aymeric Roux and colleagues, who have discovered how to increase the longevity of bubbles by altering their chemical composition. Finally, the underlined portion of the text describes how this process works: since the bubble contains both water and glycerol, it can draw water molecules from the surrounding air to replace those lost to evaporation. Therefore, the underlined portion of the sentence describes the effects of a process devised by researchers that increases the longevity of an object described in the text. Choice B is incorrect because the circumstance that prompted the research is discussed in the first sentence of the text, not the underlined portion. Choice C is incorrect because the underlined portion of the text does not address why soap bubbles must eventually rupture. Rather, it explains how the longevity of soap bubbles can be extended. Choice D is incorrect because the underlined portion of the text does not mention any future experiments."},{"i":"cce2f8dc","c":"func","d":"H","s":"In 2023 literary scholar Jeremy Douglass cautioned technology investors and enthusiasts who predict conventional books’ ultimate displacement by newer forms of media. Douglass observed that <u>the concept of an “interactive” text is much older than technologists assume, extending back to the first time readers scratched notes into a text’s margins<\/u>. In addition, newer media, such as video games, haven’t replaced older forms of entertainment, such as comic books, but rather exist alongside them. Douglass believes that rather than supplanting books, technology is simply making new forms of expression possible.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It challenges the stance of the investors and enthusiasts who are mentioned earlier in the text.","It explains the basis for the claim made by the technologists mentioned in the text.","It suggests that academics are better suited than investors to see the potential uses of contemporary interactive texts.","It provides a historical anecdote about the technological challenges involved in reading the earliest interactive texts."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first sentence of the text introduces literary scholar Jeremy Douglass’s warning to technology investors and enthusiasts against predicting the displacement of conventional books by newer media forms. The next sentence, which is underlined in part, presents Douglass’s observation that interactive texts are hardly new; they have been available for longer than technologists assume, beginning with the first time readers wrote notes in texts’ margins. Thus, the function of the underlined portion is to challenge the stance of the technology investors and enthusiasts mentioned earlier in the text. As the remainder of the text points out, newer media doesn’t necessarily replace older media, but rather, as Douglass believes, leads to new forms of expression. Choice B is incorrect because the underlined portion challenges the position taken by investors and enthusiasts; it doesn’t provide context for their claims. Choice C is incorrect because the underlined portion doesn’t mention academics or compare them to investors regarding their ability to see potential in using contemporary interactive texts; instead, the underlined portion challenges the position of investors and enthusiasts who predict that conventional books will be replaced by newer forms of media. Choice D is incorrect because the underlined portion doesn’t address technological challenges; instead, it disputes the stance taken by investors and enthusiasts, suggesting that conventional books haven’t been displaced by traditional interactions with texts, such as writing in the margins, and won’t be supplanted by newer forms of media either."},{"i":"617a8a10","c":"func","d":"M","s":"Very little is known about the role nocturnal insects, such as moths, play in flower pollination because it is difficult to monitor insects at night. <u>To address this problem, a team of scientists used time-lapse cameras to record pollinator visits to red clover all day and night.<\/u> The recordings showed that while most pollinator visits were by bumblebees, one-third of visits were by moths. Additionally, flowers that were visited by both moths and bees produced more seeds than flowers that were only visited by bees.\n\nWhich choice best states the function of the underlined sentence?","o":["To describe an approach a team of scientists used to study pollinators","To question a claim scientists make about pollinators","To explain why moths prefer red clover to other flowers","To announce an unexpected research finding about red clover"],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined sentence. The sentence indicates that scientists used time-lapse photography during both day and night to detect pollinators visiting red clover. Therefore, the underlined sentence has the function of describing an approach scientists used in the pollinator study discussed in the text. Choice B is incorrect because the underlined sentence discusses equipment the scientists used to conduct their study, and the text provides nothing to suggest these elements of their experimental design could, by themselves, question claims resulting from the study. Choice C is incorrect because nothing in either the underlined sentence or the rest of the text addresses whether moths have a preference for red clover or any other flowers. Choice D is incorrect. Although the sentences that follow the underlined sentence discuss research findings, nothing in the text suggests that these findings were unexpected. Moreover, the underlined sentence describes part of the scientists’ experimental design (day and night time-lapse photography), not a finding of the scientists’ study."},{"i":"f3c45b4f","c":"cross","d":"H","s":"Text 1 Fossils of the hominin Australopithecus africanus have been found in the Sterkfontein Caves of South Africa, but <u>assigning an age to the fossils is challenging because of the unreliability of dating methods in this context.<\/u> The geology of Sterkfontein has caused soil layers from different periods to mix, impeding stratigraphic dating, and dates cannot be reliably imputed from those of nearby animal bones since the bones may have been relocated by flooding.\n\nText 2 Archaeologists used new cosmogenic nuclide dating techniques to reevaluate the ages of A. africanus fossils found in the Sterkfontein Caves. This technique involves analyzing the cosmogenic nucleotides in the breccia—the matrix of rock fragments immediately surrounding the fossils. The researchers assert that this approach avoids the potential for misdating associated with assigning ages based on Sterkfontein’s soil layers or animal bones.\n\nBased on the texts, how would the researchers in\n\nText 2 most likely respond to the underlined portion in\n\nText 1?","o":["They would emphasize the fact that the A. africanus fossils found in the Sterkfontein Caves may have been corrupted in some way over the years.","They would contend that if analyses of surrounding layers and bones in the Sterkfontein Caves were combined, then the dating of the fossils there would be more accurate.","They would argue that their techniques are better suited than other methods to the unique challenges posed by the Sterkfontein Caves.","They would claim that cosmogenic nuclide dating is reliable in the context of the Sterkfontein Caves because it is applied to the fossils directly."],"a":2,"r":"Choice C is the best answer. Text 2 states that the researchers used cosmogenic nuclide dating to \"avoid the potential for misdating\" caused by the geology of Sterkfontein, which Text 1 describes as \"challenging\" and unreliable. Choice A is incorrect. Neither text suggests that the A. africanus fossils have been \"corrupted,\" but only that traditional dating methods are difficult in Sterkfontein because of floods and soil mixing where the fossils were found. Nothing is implied to have compromised the fossils themselves. Choice B is incorrect. This choice misreads Text 2. Text 2 agrees that stratigraphy and other methods are prone to error in the context of Sterkfontein: there’s a \"potential for misdating\" when evaluating age based on soil layers and bones. Choice D is incorrect. Text 2 does not state that cosmogenic nuclide dating is applied to the fossils directly but rather to the breccia that surrounds them."},{"i":"458b4a11","c":"main","d":"H","s":"To understand how temperature change affects microorganism-mediated cycling of soil nutrients in alpine ecosystems, Eva Kaštovská et al. collected plant-soil cores in the Tatra Mountains at elevations around 2,100 meters and transplanted them to elevations of 1,700–1,800 meters, where the mean air temperature was warmer by 2°C. Microorganism-mediated nutrient cycling was accelerated in the transplanted cores; crucially, microorganism community composition was unchanged, allowing Kaštovská et al. to attribute the acceleration to temperature-induced increases in microorganism activity. It can most reasonably be inferred from the text that the finding about the microorganism community composition was important for which reason?","o":["It provided preliminary evidence that microorganism-mediated nutrient cycling was accelerated in the transplanted cores.","It suggested that temperature-induced changes in microorganism activity may be occurring at increasingly high elevations.","It ruled out a potential alternative explanation for the acceleration in microorganism-mediated nutrient cycling.","It clarified that microorganism activity levels in the plant-soil cores varied depending on which microorganisms comprised the community."],"a":2,"r":"Choice C is the best answer because it accurately describes why the finding about the microorganism community composition was important. The text describes an experiment by Eva Kaštovská and her team in which they collected plant-soil cores at one elevation and transplanted them to sites at a lower elevation, where the mean air temperature was warmer. Kaštovská and her team observed that microorganism-mediated nutrient cycling was accelerated in the transplanted cores and that \"crucially, microorganism community composition was unchanged,\" which allowed the team to attribute the acceleration to changes in microorganism activity brought about by the difference in temperature. This strongly implies that the team wouldn’t have been able to make that attribution otherwise, meaning that a change in microorganism composition represented another possible explanation for the acceleration that had to be ruled out. Choice A is incorrect. Although the text says microorganism-mediated cycling of soil nutrients increased in the transplanted cores, this is unrelated to what’s important about the finding that the microorganism composition didn’t change—that it allowed the team to attribute the change in activity solely to the change in temperature. Choice B is incorrect. Although the text compares activity in one core at two different elevations, the text doesn’t address changes in activity at various elevations over time. Choice D is incorrect. Although different microorganisms likely exhibit different levels of activity, the text indicates that there was no change in microorganism composition, and there is nothing in the text about different microorganisms having different activity levels."},{"i":"b168ce48","c":"main","d":"E","s":"The average age at which people in the United States start businesses is 35. Economist Andrés Hincapié studied why young adults are relatively less likely to start businesses and whether there are ways to increase entrepreneurship in early adulthood. Hincapié found that one impediment is lack of knowledge about the practical details of how businesses are started; he further found that simply providing young adults with good informational resources on the topic significantly alleviates this problem.\n\nBased on the text, what would Hincapié most likely say is a promising way to increase entrepreneurship in early adulthood?","o":["Creating social networks of young adults who are interested in starting a business","Encouraging young adults to brainstorm business ideas","Providing young adults with practical information about how to start a business","Giving young adults training opportunities at a variety of businesses"],"a":2,"r":"Choice C is the best answer because it presents a conclusion about increasing entrepreneurship in early adulthood that can be reasonably inferred from the text. The text explains that Andrés Hincapié investigated why young adults are less likely than older adults to start businesses and found that lack of knowledge of practical aspects of starting a business is a barrier. The text then states that Hincapié found that providing relevant informational resources greatly helps address that problem. Offering young adults practical information about how to start a business would be an example of providing relevant informational resources, so Hincapié would most likely say it is a promising way to increase early adult entrepreneurship. Choice A is incorrect because creating social networks of young adults interested (but presumably inexperienced) in starting a business wouldn’t involve a clear source of practical information for those young adults, and the text indicates that Hincapié identified offering relevant informational resources about starting a business as a way to significantly reduce the problem of young adults’ low participation in entrepreneurship. Choice B is incorrect because encouraging young people to brainstorm business ideas wouldn’t involve a clear source of practical information for those young adults, and the text indicates that Hincapié identified offering relevant informational resources about starting a business as a way to significantly reduce the problem of young adults’ low participation in entrepreneurship. Choice D is incorrect because providing young adults with training opportunities at existing businesses would give those young people exposure to businesses that already exist but not necessarily information about how to start a business, and the text indicates that Hincapié identified offering relevant informational resources about starting a business as a way to significantly reduce the problem of young adults’ low participation in entrepreneurship."},{"i":"8fbed1cb","c":"infer","d":"M","s":"When the Vinland Map, a map of the world purported to date to the mid-1400s, surfaced in 1957, some scholars believed it demonstrated that European knowledge of the eastern coast of present-day North America predated Christopher Columbus’s 1492 arrival. In 2021, a team including conservators Marie-France Lemay and Paula Zyats and materials scientist Anikó Bezur performed an extensive analysis of the map and the ink used. They found that the ink contains titanium dioxide, a compound that was first introduced in ink manufacturing in the early 1900s. Therefore, the team concluded that ______ Which choice most logically completes the text?","o":["mid-1400s Europeans could not have known about the eastern coast of present-day North America.","the Vinland Map could not have been drawn by mid-1400s mapmakers.","mapmakers must have used titanium compounds in their ink in the 1400s.","there isn’t enough information to determine when the ink was created."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Lemay, Zyats, and Bezur’s 2021 analysis of the Vinland Map. The text indicates that while some scholars have believed that the map was drawn in the mid-1400s, the 2021 analysis showed the presence of the compound titanium dioxide in the ink used to draw the map. The text goes on to say that titanium dioxide wasn’t used to manufacture ink until the early 1900s, which means that ink containing this compound couldn’t have been available to mapmakers in the 1400s. Since mapmakers in the mid-1400s couldn’t have used ink with titanium dioxide, it follows that the Vinland Map couldn’t have been drawn by mid- 1400s mapmakers. Choice A is incorrect because the 2021 finding that the ink used to draw the Vinland Map wasn’t available until the early 1900s doesn’t imply that Europeans in the mid-1400s couldn’t have known about the eastern coast of North America. While this finding suggests that the map couldn’t have been created in the mid-1400s, it doesn’t preclude the possibility that Europeans nevertheless had knowledge—and perhaps even drew other maps that are no longer in existence or are yet to be discovered by researchers—of the eastern coast of present-day North America as early as the mid-1400s. Choice C is incorrect because there’s nothing in the text that suggests that the 2021 discovery of the presence of titanium dioxide in the ink used to draw the Vinland Map caused Lemay, Zyats, and Bezur to question or reach a new conclusion about when mapmakers began using ink containing titanium compounds. Instead, the text indicates that titanium dioxide wasn’t used in ink before the early 1900s. This knowledge led the team to conclude that the map, which was drawn with ink containing titanium dioxide, couldn’t have been created in the mid- 1400s. Choice D is incorrect because although the text doesn’t indicate that Lemay, Zyats, and Bezur established an exact date for the creation of the ink that was used to draw the Vinland Map, the text does say that titanium dioxide was introduced in ink manufacturing in the early 1900s. This fact provides enough information to determine that the ink that was used to draw the map was created no earlier than the early 1900s. This finding, in turn, led the team to conclude that the Vinland Map couldn’t have been drawn in the mid-1400s."},{"i":"5432d1de","c":"infer","d":"M","s":"It’s common for jazz musicians and fans to refer to certain songs as having “swing,” indicating that the songs provoke a strong feeling, like the impulse to tap one’s foot or dance. The exact acoustic properties that give a song swing, however, have long been thought to be undefinable. To investigate swing, a team led by physicist Corentin Nelias delayed the downbeats and synchronized the offbeats in jazz piano solos and asked jazz musicians to compare the intensity of swing in each modified piece with the intensity of swing in the original piece. They found that participants were more than seven times likelier to characterize the modified songs as having swing than to characterize the original versions as having swing, suggesting that ______ Which choice most logically completes the text?","o":["synchronized offbeats tend to give a song swing regardless of whether downbeats are delayed.","the acoustic properties that give a song swing are not easy for jazz musicians to manipulate.","jazz songs that feature the piano are more likely to have swing than are jazz songs that do not feature the piano.","the timing of downbeats and offbeats may play a crucial role in giving a song swing."],"a":3,"r":"Choice D is the best answer. The passage tells us that participants were “more than seven times likelier to characterize the modified songs as having swing than to characterize the original versions as having swing.” Because the modified songs had been changed by altering the timing of the downbeats and offbeats, this suggests that the timing of downbeats and offbeats may play a crucial role in giving a song swing. Choice A is incorrect. Although the passage mentions that the researchers “synchronized the offbeats” in the modified songs, they also “delayed the downbeats” in those songs. Because we can’t disentangle whether it was the synchronized offbeats, the delayed downbeats, or the combination of both that increased the song’s swing, we don’t have enough information to make this inference. Choice B is incorrect. The passage doesn’t mention whether or not it’s difficult for a jazz musician to give a song swing, so there’s no basis for this inference. Choice C is incorrect. The passage doesn’t compare jazz songs that feature piano to those that don’t, so there’s no basis for this inference."},{"i":"860803dd","c":"claim","d":"H","s":"Biologist Valentina Gómez-Bahamón and her team have investigated two subspecies of the fork-tailed flycatcher bird that live in the same region in Colombia, but one subspecies migrates south for part of the year, and the other doesn’t. The researchers found that, due to slight differences in feather shape, the feathers of migratory forked-tailed flycatcher males make a sound during flight that is higher pitched than that made by the feathers of nonmigratory males. The researchers hypothesize that fork-tailed flycatcher females are attracted to the specific sound made by the males of their own subspecies, and that over time the females’ preference will drive further genetic and anatomical divergence between the subspecies.\n\nWhich finding, if true, would most directly support Gómez-Bahamón and her team’s hypothesis?","o":["The feathers located on the wings of the migratory fork-tailed flycatchers have a narrower shape than those of the nonmigratory birds, which allows them to fly long distances.","Over several generations, the sound made by the feathers of migratory male fork-tailed flycatchers grows progressively higher pitched relative to that made by the feathers of nonmigratory males.","Fork-tailed flycatchers communicate different messages to each other depending on whether their feathers create high-pitched or low-pitched sounds.","The breeding habits of the migratory and nonmigratory fork-tailed flycatchers remained generally the same over several generations."],"a":1,"r":"Choice B is the best answer because it presents a finding that, if true, would most directly support Gómez-Bahamón and her team’s hypothesis about fork-tailed flycatchers. The text indicates that although two subspecies of the birds live in the same region, the tail feathers of the migrating males make a higher-pitched sound than the tail feathers of the nonmigrating males do. Gómez-Bahamón and her team hypothesize that female fork-tailed flycatchers are attracted to the particular sound made by the tail feathers of males of their own subspecies, which will bring about additional “genetic and anatomical divergence” between the two subspecies. If it were found that the pitch generated by the tail feathers of migrating males is getting higher over successive generations, it would indicate that the shape of the migrating subspecies’ tail feathers is diverging further from that of the nonmigrating subspecies. And if females continue to prefer the sounds of the males of their own subspecies, the females of the migrating subspecies will become acclimated to increasingly higher pitches over subsequent generations, causing further divergence between the subspecies. Thus, if it were found that migrating males’ tail feathers were producing higher pitches over time, that would support the researchers’ hypothesis. Choice A is incorrect because the researchers’ hypothesis is that female flycatchers prefer the sounds produced by the tail feathers of males of their own subspecies, which will lead to further divergence between the two subspecies. This finding is about the shape of wing feathers and how that affects long-distance flight, whereas the hypothesis is about the shape of tail feathers and how that relates to female mate preference. Choice C is incorrect because the researchers’ hypothesis is that female flycatchers prefer the sounds produced by the tail feathers of males of their own subspecies, which will lead to further divergence between the two subspecies. This finding focuses on how the tail feather sounds communicate different messages, which doesn’t address differences between the subspecies or female preferences. Choice D is incorrect because the researchers’ hypothesis is that female flycatchers prefer the sounds produced by the tail feathers of males of their own subspecies, which will lead to further divergence between the two subspecies. The finding that breeding habits haven’t changed for either subspecies does not, by itself, suggest anything about female preferences or divergence between the two subspecies."},{"i":"6d69ab93","c":"claim","d":"H","s":"Initially observed in 2017, the interstellar object ‘Oumuamua is the first object of its kind to be seen in our solar system. Researchers have been puzzled because its acceleration cannot be entirely explained by the gravitational pull of nearby bodies: there must be a nongravitational influence on its velocity and trajectory. Some previously suggested explanations for this nongravitational acceleration involve mechanisms that are unlikely or unrealistic, such as geometric effects from ‘Oumuamua being potentially composed of several spatially separated bodies. Now, Jennifer Bergner and colleagues propose that the nongravitational acceleration is due to the gaseous expulsion of entrapped hydrogen from ‘Oumuamua’s water-rich icy body.\n\nWhich statement, if true, would most strongly support the claim made by Bergner and colleagues about the cause of ‘Oumuamua’s acceleration?","o":["Existing proposed models of outgassing from ‘Oumuamua include the direct conversion of nitrogen or carbon monoxide from a solid to a gaseous state without becoming liquid, but these models have theoretical or observational inconsistencies.","‘Oumuamua’s trajectory is inconsistent with a nongravitational acceleration that would be caused by the release of hydrogen gas resulting from the processing of water ice (H 2 O), but the interstellar object’s observable properties can be explained if it has a significant component of molecular hydrogen ice (H 2 ).","Since nongravitational accelerations of interstellar objects are several orders of magnitude weaker than gravitational accelerations, deviation from behavior that could be fully attributed to gravitational pull has been detected on a limited number of objects similar to ‘Oumuamua.","Exposure to interstellar cosmic radiation can result in the formation of embedded pockets of hydrogen gas in water ice; moreover, when traveling through the solar system, ‘Oumuamua experienced warming sufficient to alter its icy structure and allow for outgassing."],"a":3,"r":"Choice D is the best answer because it presents findings that, if true, would support the claim made by Bergner and colleagues that the nongravitational acceleration of ‘Oumuamua is due to the expulsion of entrapped hydrogen. The text first introduces the observation of a unique interstellar object named ‘Oumuamua and goes on to explain that the object exhibited nongravitational acceleration that could not be fully attributed to the expected cause: gravitational pull of nearby celestial bodies. The text concludes by stating that Bergner and colleagues claim that the nongravitational acceleration is caused by expulsion of hydrogen gas from ‘Oumuamua’s water-rich icy body. To support this claim requires evidence that hydrogen gas could be present within ‘Oumuamua at all, which this answer choice presents: cosmic radiation can result in embedded pockets of hydrogen gas in water ice. Additionally, evidence that this gas can be released from such a body is required to fully support the claim, which this answer choice goes on to provide: ‘Oumuamua experienced sufficient warming as it traveled through the solar system to alter its icy structure and release the hydrogen gas. Thus, this answer choice provides the best evidence to support Bergner and colleagues’ claim. Choice A is incorrect because this answer choice concerns faults with previous models of outgassing from ‘Oumuamua of carbon monoxide and nitrogen, which would not support a claim regarding hydrogen outgassing. Furthermore, inconsistencies in other models would not provide evidence in support of a different model or explanation. Choice B is incorrect. The evidence presented in this answer choice would weaken the claim proposed by Bergner and colleagues that the nongravitational acceleration of ‘Oumuamua is caused by the expulsion of hydrogen gas because this answer choice suggests that there is evidence that refutes this claim: ‘Oumuamua’s trajectory is inconsistent with a nongravitational acceleration caused by the release of hydrogen gas. Furthermore, the remaining portion of this answer choice is unrelated to the claim. Choice C is incorrect because the claim being made by Bergner and colleagues concerns the expulsion of entrapped hydrogen gas, but this answer choice is concerned solely with the differences in magnitude of gravitational and nongravitational acceleration, which would not support Bergner’s claim. Furthermore, this answer choice discusses interstellar objects similar to ‘Oumuamua, but the text states that ‘Oumuamua is the first observed object of its kind in our solar system, so evidence from other, similar bodies would not be available."},{"i":"040583a5","c":"graph","d":"H","s":"","o":["20°C is the ideal temperature at which to store bananas to slow ripening time.","for those bananas that were not treated with ethylene, differences in temperature were not associated with absolute differences in ripening time.","bananas treated with ethylene ripen faster at 14°C and 16°C than at 18°C and 20°C.","ethylene was associated with a greater absolute change in ripening time at 14°C, 16°C, and 18°C than at 20°C."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the graph to complete the student’s conclusion about banana ripening time with and without ethylene at different temperatures. The graph shows that at 20°C, the gap between the two bars showing ripening times for ethylene-treated bananas and untreated bananas crosses fewer than 2 gridlines (from about 4 days for ethylene-treated bananas to about 5.5 days for untreated bananas). Meanwhile, the graph shows that at 14°C, 16°C, and 18°C, the gap between the bars crosses more than 2 gridlines (from about 8 days for treated bananas to about 11 days for untreated bananas at 14°C; from about 6 days for treated bananas to about 9.5 days for untreated bananas at 16°C; and from about 5.5 days for treated bananas to about 8.5 days for untreated bananas at 18°C). Since the gap between the bars at each of these temperatures crosses more than 2 gridlines, and since each of these gaps is larger than the gap between the bars at 20°C, it can be concluded that ethylene was associated with a greater absolute change in ripening time at 14°C, 16°C, and 18°C than at 20°C. Choice A is incorrect because the graph shows that ethylene-treated bananas stored at 20°C ripen more quickly than ethylene-treated bananas stored at the other temperatures do (about 4 days at 20°C vs. about 5.5, 6, and 8 days at 18°C, 16°C, and 14°C, respectively) and that untreated bananas stored at 20°C ripen more quickly than untreated bananas stored at the other temperatures do (about 5.5 days at 20°C vs. about 8.5, 9.5, and 11 days at 18°C, 16°C, and 14°C, respectively). The information in the graph therefore indicates that storing bananas at 20°C speeds up ripening time relative to storing bananas at the other temperatures shown, not that this storage temperature slows ripening time. Choice B is incorrect because the graph shows that as temperature increases, the ripening time of untreated bananas decreases, from about 11 days at 14°C to about 5.5 days at 20°C, with no exceptions to this trend. The graph therefore shows that differences in temperature were associated with absolute differences in ripening time, not that there was no association between differences in temperature and differences in ripening time. Choice C is incorrect because the graph shows that ripening times of ethylene-treated bananas at 14°C and 16°C were about 8 and 6 days, respectively, which is greater than, not less than, ripening times of ethylene-treated bananas at 18°C and 20°C, which were about 5.5 and 4 days, respectively. In other words, bananas treated with ethylene ripen more slowly, not faster, at 14°C and 16°C than at 18°C and 20°C."},{"i":"75e07a4d","c":"graph","d":"E","s":"","o":["shrimp cocktail for meal B.","hot cocoa for meal C.","sugar cookie cubes for meal B.","chicken and vegetables for meal A."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the statement. The table shows that on day 1, the menu for NASA’s Gemini missions included sugar cookie cubes for meal B. Choice A is incorrect because according to the table, shrimp cocktail was served on day 4, not day 1; moreover, the item was served for meal C, not meal B, as this choice claims. Choice B is incorrect because according to the table, hot cocoa was served on day 3, not on day 1; moreover, the item was served for meal A, not for meal C, as this choice claims. Choice D is incorrect because according to the table, chicken and vegetables were served on day 2, not on day 1; moreover, the item was served for meal B, not for meal A, as this choice claims."},{"i":"83617355","c":"fss","d":"E","s":"Each night in Gijón, Spain, a section of the city’s marina is bathed in a soft green glow. The source of the glow is the Árbol de la Sidra, a large sculpture made up of 3,200 recycled glass bottles. A lamp inside the tree-shaped structure ______ the green glass.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["will be illuminating","illuminates","would illuminate","illuminated"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the present tense verb \"illuminates\" is consistent with the other present tense verb (\"is\") used to describe the sculpture, correctly indicating that the sculpture habitually glows (\"each night\") and that the lamp inside is the source of its illumination. Choice A is incorrect because the future progressive tense verb \"will be illuminating\" isn’t consistent with the other present tense verb used to describe the sculpture and the source of its glow. Choice C is incorrect because the modal \"would,\" which is used to indicate a typical behavior in the past, isn’t consistent with the other present tense verb used to describe the sculpture and the source of its glow. Choice D is incorrect because the past tense verb \"illuminated\" isn’t consistent with the other present tense verb used to describe the sculpture and the source of its glow."},{"i":"50445680","c":"fss","d":"E","s":"In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food availability than by food preference. Although the monkeys prefer to eat vegetation and land-dwelling invertebrates, those food sources may become unavailable because of extensive snow and ice cover, ______ the monkeys to hunt for marine animals in any streams that have not frozen over.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["forces","to force","forcing","forced"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of finite and nonfinite verb forms within a sentence. The nonfinite present participle “forcing” is correctly used to form a participial phrase that supplements the main clause “those...cover,” describing the effects on monkeys of the lack of food sources. Choice A is incorrect because the finite present tense verb “forces” can’t be used in this way to supplement the main clause (“those...cover”). Choice B is incorrect. While the nonfinite to-infinitive “to force” could be used to form a subordinate clause that supplements the main clause (“those...cover”), to-infinitives conventionally express purpose, and nothing in the sentence suggests that the food sources become unavailable for the purpose of forcing monkeys to hunt marine animals. Choice D is incorrect because the finite past tense verb “forced” can’t be used in this way to supplement the main clause (“those...cover”)."},{"i":"a03008de","c":"fss","d":"M","s":"The Proto-Nilotic language, common ancestor of fifty-five African languages with similar linguistic properties, ______ like all protolanguages, hypothetical: there’s no direct evidence these ancestral languages actually existed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is,","are,","have been,","were,"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb \"is\" agrees in number with the singular subject \"the Proto-Nilotic language.\" Choice B is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"the Proto-Nilotic language.\" Choice C is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"the Proto-Nilotic language.\" Choice D is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"the Proto-Nilotic language.\""},{"i":"96499989","c":"bound","d":"E","s":"Fans of science fiction will ______ multiple references to classic sci-fi stories in Janelle Monáe’s song lyrics, including her recurring nods to the plot of the 1927 sci-fi film Metropolis.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["appreciate the","appreciate. The","appreciate, the","appreciate: the"],"a":0,"r":"Choice A is the best answer. The convention being tested here is punctuation between a verb and object. No punctuation is needed between the verb (\"appreciate\") and its object (\"the multiple references...\"). The object helps complete the idea of the verb—in this case, it explains what fans of science fiction will appreciate—and any punctuation between the two results in an ungrammatical sentence. Choice B is incorrect because no punctuation is needed between the verb and its object. Choice C is incorrect because no punctuation is needed between the verb and its object. Choice D is incorrect because no punctuation is needed between the verb and its object."},{"i":"d4fe8f03","c":"bound","d":"H","s":"Paintings by the renowned twentieth-century US ______ were featured in Artist to Artist, an exhibition at the Smithsonian Art Museum that paired the works of artists whose career trajectories intersected in meaningful ways.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["artists: Thomas Hart Benton and Jackson Pollock,","artists Thomas Hart Benton and Jackson Pollock","artists Thomas Hart Benton, and Jackson Pollock,","artists, Thomas Hart Benton and Jackson Pollock"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of punctuation around noun phrases. No punctuation is needed because the coordinated noun phrase \"Thomas Hart Benton and Jackson Pollock\" is a restrictive appositive, meaning that it provides essential identifying information about the noun phrase before it, \"the renowned twentieth-century US artists.\" Choice A is incorrect because no punctuation is needed between the noun phrase \"the renowned twentieth-century US artists\" and the restrictive appositive \"Thomas Hart Benton and Jackson Pollock.\" Additionally, no punctuation is needed between the sentence’s subject (\"paintings by the renowned twentieth-century US artists Thomas Hart Benton and Jackson Pollock\") and the main verb (\"were featured\"). Choice C is incorrect because no punctuation is needed between the coordinated elements \"Thomas Hart Benton\" and \"Jackson Pollock.\" Additionally, no punctuation is needed between the sentence’s subject (\"paintings by the renowned twentieth-century US artists Thomas Hart Benton and Jackson Pollock\") and the main verb (\"were featured\"). Choice D is incorrect because no punctuation is needed between the noun phrase \"the renowned twentieth- century US artists\" and the restrictive appositive \"Thomas Hart Benton and Jackson Pollock.\""},{"i":"8432a140","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Marine biologist Camille Jazmin Gaynus studies coral reefs. Coral reefs are vital underwater ecosystems that provide habitats to 25% of all marine species. Reefs can include up to 8,000 species of fish, such as toadfish, seahorses, and clown triggerfish. The Amazon Reef is a coral reef in Brazil. It is one of the largest known reefs in the world. The student wants to introduce the scientist and her field of study to a new audience.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Located in Brazil, the Amazon Reef is one of the largest known coral reefs in the world.","Marine biologist Camille Jazmin Gaynus studies coral reefs, vital underwater ecosystems that provide homes to 25% of all marine species.","Providing homes to 25% of all marine species, including up to 8,000 species of fish, coral reefs are vital underwater ecosystems and thus of great interest to marine biologists.","As Camille Jazmin Gaynus knows well, coral reefs are vital underwater ecosystems, providing homes to thousands of species of fish."],"a":1,"r":"Choice B is the best answer. We’re asked to select the sentence that \"introduce[s] the scientist and her field of study.\" This choice introduces scientist Camille Jazmin Gaynus as a marine biologist and explains what marine life she studies. Choice A is incorrect. This choice doesn’t mention Camille Jazmin Gaynus, so it fails to \"introduce the scientist.\" Choice C is incorrect. This choice doesn’t mention Camille Jazmin Gaynus, so it fails to \"introduce the scientist.\" Choice D is incorrect. This choice mentions Camille Jazmin Gaynus, but it doesn’t identify her as a marine biologist. It says she \"knows well\" about coral reefs, but doesn’t identify her expertise as a \"field of study.\""},{"i":"96a86bce","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Cambodia’s Angkor Wat was built in the 1100s to honor the Hindu god Vishnu. It has been a Buddhist temple since the sixteenth century. Decorrelation stretch analysis is a novel digital imaging technique that enhances the contrast between colors in a photograph. Archaeologist Noel Hidalgo Tan applied decorrelation stretch analysis to photographs he had taken of Angkor Wat’s plaster walls. Tan’s analysis revealed hundreds of images unknown to researchers. The student wants to present Tan’s research to an audience unfamiliar with Angkor Wat.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Tan photographed Angkor Wat’s plaster walls and then applied decorrelation stretch analysis to the photographs.","Decorrelation stretch analysis is a novel digital imaging technique that Tan used to enhance the contrast between colors in a photograph.","Using a novel digital imaging technique, Tan revealed hundreds of images hidden on the walls of Angkor Wat, a Cambodian temple.","Built to honor a Hindu god before becoming a Buddhist temple, Cambodia’s Angkor Wat concealed hundreds of images on its plaster walls."],"a":2,"r":"Choice C is the best answer. The sentence effectively presents Tan’s research to an audience unfamiliar with Angkor Wat, explaining the results of the research and identifying Angkor Wat as a temple in Cambodia. Choice A is incorrect. While the sentence presents Tan’s research, it fails to explain what Angkor Wat is for an audience unfamiliar with the temple. Choice B is incorrect. The sentence emphasizes the role that decorrelation stretch analysis played in Tan’s research; it doesn’t present the research, which would require specifying where it was conducted. Choice D is incorrect. While the sentence explains what Angkor Wat is, it fails to present Tan’s research."},{"i":"ff1a2e5e","c":"trans","d":"E","s":"Historians agree that the jazz pianist Jelly Roll Morton was exaggerating when he claimed to have invented jazz music. No one can deny, ______ that Morton’s innovative compositions and remarkable improvisational skills helped shape jazz as a genre during its early years.\n\nWhich choice completes the text with the most logical transition?","o":["therefore,","in the second place,","in other words,","though,"],"a":3,"r":"Choice D is the best answer. \"Though\" logically signals that the claim in the sentence—that Morton’s improvisational skills helped shape jazz as a genre during its early years (\"No one can deny\" it)—is true despite the previous information about Morton’s exaggerated claim to have invented jazz. Choice A is incorrect because \"therefore\" illogically signals that the claim in the sentence is a result of the previous information about Morton’s claim to have invented jazz. Instead, the sentence states that Morton helped to shape jazz—even if his claim was an exaggeration. Choice B is incorrect because \"in the second place\" illogically signals that the claim in the sentence is a second, separate point in addition to Morton’s claim to have invented jazz. Instead, the sentence states that Morton helped to shape jazz—even if his claim was an exaggeration. Choice C is incorrect because \"in other words\" illogically signals that the claim in the sentence is merely a paraphrase or restatement of the previous information about Morton’s claim to have invented jazz. Instead, the sentence states that Morton helped to shape jazz—even if his claim was an exaggeration."},{"i":"20733eac","c":"trans","d":"E","s":"It has long been thought that humans first crossed a land bridge into the Americas approximately 13,000 years ago. ______ based on radiocarbon dating of samples uncovered in Mexico, a research team recently suggested that humans may have arrived more than 30,000 years ago—much earlier than previously thought.\n\nWhich choice completes the text with the most logical transition?","o":["As a result,","Similarly,","However,","In conclusion,"],"a":2,"r":"Choice C is the best answer. “However” logically signals that the theory discussed in this sentence—that humans may have arrived in the Americas over 30,000 years ago—contrasts with the previously discussed theory that humans arrived around 13,000 years ago. Choice A is incorrect because “as a result” illogically signals that the theory in this sentence is the result of the theory discussed in the previous sentence. Instead, this theory contrasts with the previous one. Choice B is incorrect because “similarly” illogically signals that the theory in this sentence is similar to the theory discussed in the previous sentence. Instead, this theory contrasts with the previous one. Choice D is incorrect because “in conclusion” illogically signals that the theory in this sentence concludes or summarizes the discussion of the previous theory. Instead, this theory contrasts with the previous one."},{"i":"fc2bcc79","c":"trans","d":"E","s":"Tyrian purple was a highly prized dye among the Phoenicians (an ancient civilization located in present-day Lebanon). The Phoenicians were famous for using this natural dye to color their clothes a distinctive purple. ______ the name “Phoenicia” itself, some historians claim, may have originally meant “land of purple.”\n\nWhich choice completes the text with the most logical transition?","o":["In fact,","Regardless,","Lastly,","On the contrary,"],"a":0,"r":"Choice A is the best answer. “In fact” logically signals that the claim in this sentence—Phoenicia being named after the color purple—emphasizes and supports the previous claim that Phoenicians were famous for using purple dye. Choice B is incorrect because “regardless” illogically signals that the claim about Phoenicia’s name contrasts with the previous claim that Phoenicians were famous for using purple dye. Instead, the naming emphasizes and supports this claim. Choice C is incorrect because “lastly” illogically signals that the claim about Phoenicia’s name is the final step in a process or sequence. Instead, the naming emphasizes and supports the previous claim that Phoenicians were famous for using purple dye. Choice D is incorrect because “on the contrary” illogically signals that the claim about Phoenicia’s name directly opposes the previous claim that Phoenicians were famous for using purple dye. Instead, the naming emphasizes and supports this claim."}],"img":{"040583a5":"iVBORw0KGgoAAAANS function card(q,n){const a=ans[q.i];
