<script>
const D={"t":"SATPractice14","q":[{"i":"c5b1afe5","c":"vocab","d":"M","s":"Bicycle sharing systems allow users to rent a bicycle at one location within a city and return it to any other designated location in that city, which can cause serious problems of bicycle supply and user demand within the city’s system. Tohru Ikeguchi uses open-source data and statistical modeling to identify when a high number of users making one-way trips is likely to leave some locations within the system ______ bicycles and other areas with insufficient supply.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["susceptible to","contingent on","saturated with","depleted of"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Ikeguchi’s model of bicycle supply. In this context, “saturated with” means thoroughly or completely supplied with. The text explains a problem encountered by some bicycle-sharing programs: users can return bicycles to different locations than where the users picked up the bicycles to start, which can result in a mismatch between bicycle supply (that is, where the bicycles are currently located) and user demand (that is, the locations where users are hoping to pick up bicycles). The text goes on to explain that Ikeguchi developed a way to identify when this mismatch is likely to occur. This context suggests that Ikeguchi’s method will show when it is likely that some locations have an insufficient supply and other locations, by implicit contrast, are saturated with bicycles. Choice A is incorrect because nothing in the text suggests that some locations are “susceptible to,” or sensitive to or easily influenced by, bicycles. The text describes the phenomenon of bicycles being redistributed away from locations where users want them, not anything about those locations being influenced by the bicycles. Choice B is incorrect because the text describes situations in which some locations have an insufficient supply of bicycles because the bicycles have been relocated elsewhere, which suggests that the other locations have many bicycles, not that the other locations are “contingent on,” or dependent on, the bicycles. Nothing in the text suggests that the locations themselves depend on the bicycles for anything. Choice D is incorrect because it would not make sense in context to say that some locations are “depleted of,” or empty of, bicycles while others have an insufficient supply. The text describes situations in which bicycles have been relocated such that there is a mismatch between bicycle supply and user demand—the bicycles are no longer at the locations where users want to pick them up. This means that some locations do not have enough bicycles, while other locations must have many bicycles, not be depleted of bicycles."},{"i":"d5ad34f0","c":"vocab","d":"H","s":"The results of randomized clinical trials testing the efficacy of common medical interventions sometimes fail to ______ conclusions that practitioners reach based on their real-world observations of patients. While there are several possible reasons for this, one is that practitioners may overlook confounding variables that account for the results they attribute to the interventions in question.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["circumvent","corroborate","disseminate","implement"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of a relationship between the results of randomized clinical tests of how effective common medical interventions are and the conclusions practitioners reach about such interventions in real-world settings. In this context, \"corroborate\" means confirm or support with evidence. The text indicates that one possible explanation for the relationship being discussed is that practitioners may overlook confounding variables—that is, additional factors other than the medical interventions being investigated that affect the observed outcomes. This means that practitioners may assume that an outcome is the direct result of a medical intervention when it is actually the result of a combination of factors. Clinical trials take steps to rule out factors other than the one being studied, so if those extra factors are actually having an effect on real-world outcomes, the trials are likely to produce conclusions different from those practitioners reach in their real-world observations. In other words, clinical trials may fail to corroborate practitioners’ conclusions. Choice A is incorrect because it wouldn’t make sense to say that the results of clinical trials could \"circumvent,\" or find a way around or bypass, conclusions practitioners reach in real-world scenarios with patients; it’s possible that researchers conducting the trials might avoid engaging with practitioners’ conclusions, but findings from a study can’t choose to get around something. Choice C is incorrect because it wouldn’t make sense to say that the results of clinical trials could \"disseminate,\" or spread widely, conclusions practitioners reach in real-world scenarios with patients; the researchers conducting the trials might choose to draw attention to practitioners’ conclusions, but findings from a study can’t spread anything. Choice D is incorrect because it wouldn’t make sense to say that the results of clinical trials could \"implement,\" or put into effect, conclusions practitioners reach in real-world scenarios with patients; the researchers conducting the trials might consider practitioners’ conclusions, but findings from a study can’t put anything into effect."},{"i":"8634bf4a","c":"vocab","d":"M","s":"Diego Velázquez was the leading artist in the court of King Philip IV of Spain during the seventeenth century, but his influence was hardly ______ Spain: realist and impressionist painters around the world employed his techniques and echoed elements of his style.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["derived from","recognized in","confined to","repressed by"],"a":2,"r":"Choice C is the best answer because it most logically completes the discussion of the artist Diego Velázquez’s influence outside Spain. As used in this context, “confined to” means restricted to. The text says that Velázquez was the leading artist in the Spanish court during the seventeenth century, but it also notes that other painters around the world were influenced by his techniques and style. Thus, Velázquez’s influence was hardly (or almost not) confined to, or restricted to, Spain. Choice A is incorrect because if Velázquez was a leading artist in Spain, it doesn’t make logical sense to claim that his influence was hardly (or almost not) derived from, or obtained from, Spain. Moreover, the other painters around the world who employed Velázquez’s techniques would by definition be influenced by Spanish style. Choice B is incorrect because if Velázquez was a leading artist in the court of King Philip IV of Spain, then his influence must have been widely recognized, or acknowledged, rather than being hardly (or almost not) recognized. Choice D is incorrect because the text gives no indication that deliberately limiting Velázquez’s influence outside Spain was ever considered by anyone. Thus, even if it is true that his influence was not repressed, or restrained, it doesn’t make logical sense to say so in this context."},{"i":"e1e89221","c":"vocab","d":"E","s":"The following text is from Frances Hodgson Burnett’s 1911 novel The Secret Garden. Mary, a young girl, is outside trying her new jump rope. The sun was shining and a little wind was blowing—not a rough wind, but one which came in delightful little gusts and brought a fresh scent of newly turned earth with it. She skipped round the fountain garden, and up one walk and down another.\n\nAs used in the text, what does the word “rough” most nearly mean?","o":["Harsh","Scratchy","Basic","Vague"],"a":0,"r":"Choice A is the best answer because as used in the text, \"rough\" most nearly means harsh, or forceful and unpleasant. The text describes Mary’s surroundings as she plays: the sun is out and there’s \"a little wind.\" To further illustrate the wind, the narrator contrasts the word \"rough\" with a description of the wind blowing in \"delightful little gusts,\" suggesting that the wind is not unpleasant or harsh at all. Choice B is incorrect. Although in some contexts \"rough\" objects, or objects with irregular surfaces, can sometimes be scratchy, rough doesn’t mean scratchy in this context. The text explains that the wind is not rough but rather gentle, \"delightful little gusts,\" which suggests that the use of \"rough\" here is referring to the degree of force of the wind. Choice C is incorrect because there’s nothing in the text to suggest that the wind wasn’t \"basic,\" or simple and uncomplicated. Instead, the text describes the wind as blowing not roughly or harshly but in \"delightful little gusts.\" Choice D is incorrect because the word \"vague\" means not clearly expressed or seen. Nothing in the text indicates that the wind was barely noticeable to Mary as she played outside, but rather the text states that it was delightful."},{"i":"b0f7541b","c":"purpose","d":"H","s":"The following text is adapted from Herman Melville’s 1857 novel The Confidence-Man. Humphry Davy was a prominent British chemist and inventor. Years ago, a grave American savant, being in London, observed at an evening party there, a certain coxcombical fellow, as he thought, an absurd ribbon in his lapel, and full of smart [banter], whisking about to the admiration of as many as were disposed to admire. Great was the savant’s disdain; but, chancing ere long to find himself in a corner with the jackanapes, got into conversation with him, when he was somewhat ill-prepared for the good sense of the jackanapes, but was altogether thrown aback, upon subsequently being [informed that he was] no less a personage than Sir Humphry Davy.\n\nWhich choice best states the main purpose of the text?","o":["It portrays the thoughts of a character who is embarrassed about his own behavior.","It presents an account of a misunderstanding.","It offers a short history of how a person came to be famous.","It explains why one character dislikes another."],"a":1,"r":"Choice B is the best answer. The text tells a story of a first impression that turned out to be wrong: a serious American savant was dismissive of a goofy-looking, wisecracking guest at a British party, and then was shocked to learn that the guest was actually a prominent British chemist and inventor. Choice A is incorrect. This is too strong and too narrow. Only at the very end is the savant \"thrown aback\" by the fact that the man was Sir Humphry Davy—he’s not \"embarrassed about his own behavior.\" Choice C is incorrect. This isn’t the main purpose. The text never provides the history of how Sir Humphry Davy came to be famous. Nor does it provide any history for the American savant. Choice D is incorrect. This is too narrow. It doesn’t include the second half of the text, where the savant gets into a conversation with the man and then finds out that the man is Sir Humphry Davy."},{"i":"47904792","c":"purpose","d":"E","s":"Animals use many objects as tools to achieve goals more easily. Such goals include grooming, finding food, and protecting themselves. For a long time, people thought tool use was unique to primates. Dolphins and other animals, though, have busted the myth that tool use requires hands. Inventively, dolphins use sponges to protect their noses from scratches when foraging on the seafloor. Palm cockatoos also get creative. They use leaves to pad their beaks when opening nuts.\n\nWhich choice best states the main purpose of the text?","o":["To question the belief that birds are intelligent","To compare tool use in humans with tool use in palm cockatoos","To establish that tool use doesn’t indicate intelligence","To argue that a variety of animals use tools"],"a":3,"r":"Choice D is the best answer because it most accurately states the main purpose of the text. The text first states that animals make use of objects as tools to help them achieve different goals. The text then explains that although people used to think only primates use tools, tool use by dolphins (aquatic mammals) and palm cockatoos (birds) has shown that primates are not the only animals that use tools. Thus, the main purpose of the text is to argue that a variety of animals, not just primates, use tools. Choice A is incorrect because the text doesn’t mention intelligence at all, focusing just on the idea that animals use tools. Further, the text mentions one kind of bird (palm cockatoos) only as an example of a non-primate that uses tools and describes its use of tools as creative, not unintelligent. Choice B is incorrect. Although the text mentions tool use in primates (a group that includes humans) and in palm cockatoos, it doesn’t compare humans’ tool use with palm cockatoos’ tool use. The text mentions palm cockatoos only as one example out of the variety of animals that use tools and never directly mentions tool use in humans. Choice C is incorrect because the text discusses tool use but never makes any mention of intelligence. Rather than establishing that tool use doesn’t indicate intelligence, the text describes certain tool use as inventive and creative."},{"i":"a68239ed","c":"func","d":"E","s":"The following text is adapted from Oscar Wilde’s 1897 nonfiction work De Profundis. People whose desire is solely for self-realisation never know where they are going. They can’t know. In one sense of the word it is of course necessary to know oneself: that is the first achievement of knowledge. But to recognise that the soul of a man is unknowable, is the ultimate achievement of wisdom. The final mystery is oneself. When one has weighed the sun in the balance, and measured the steps of the moon, and mapped out the seven heavens star by star, there still remains oneself. <u>Who can calculate the orbit of his own soul?<\/u> Which choice best describes the function of the underlined question in the text as a whole?","o":["It reinforces the text’s skepticism about the possibility of truly achieving self-knowledge.","It speculates that some readers will share the doubts expressed in the text about the value of self-knowledge.","It cautions readers that the text’s directions for how to achieve self-knowledge are hard to follow.","It concedes that the definition of self-knowledge advanced in the text is unpopular."],"a":0,"r":"Choice A is the best answer. The text repeatedly claims that true self-knowledge can’t possibly be achieved, and this rhetorical question emphasizes that point. Choice B is incorrect. The underlined question doesn’t do this. The text never expresses doubts about the value of self-knowledge—rather, the text expresses doubts about the possibility of achieving self-knowledge. Choice C is incorrect. The underlined question doesn’t do this. The text doesn’t provide directions for how to achieve self-knowledge—rather, it claims that true self-knowledge is impossible to achieve. Choice D is incorrect. The underlined question doesn’t do this. The text doesn’t ever define self-knowledge, and popularity isn’t mentioned in the text at all."},{"i":"54c6128b","c":"func","d":"M","s":"When ancient oak planks were unearthed during subway construction in Rome, Mauro Bernabei and his team examined the growth rings in the wood to determine where these planks came from. By comparing the growth rings on the planks to records of similar rings in oaks from Europe, the team could trace the wood to the Jura region of France, hundreds of kilometers from Rome. <u>Because timber could only have been transported from distant Jura to Rome by boat, the team’s findings suggest the complexity of Roman trade routes.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It presents a conclusion about Roman trade routes based on the team’s findings.","It questions how the team was able to conclude that the planks were used to build a boat.","It explains why the planks were made from oak rather than a different kind of wood.","It describes common methods used in Roman subway construction."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence explains that Bernabei and his team studied growth rings to obtain information about the ancient oak planks found during a construction project in Rome. The next sentence presents what the researchers learned: the wood from the planks came from France’s Jura region, which is far from Rome. The underlined sentence then presents the implications of the findings about the planks: the wood must have been brought to Rome by boat, a difficult task that suggests Roman trade routes were complex. Thus, the underlined sentence mainly functions to present a conclusion about Roman trade routes based on the team’s findings. Choice B is incorrect because the text doesn’t suggest that the team thought the ancient planks were used in the construction of a boat, nor does the underlined sentence question that conclusion. Instead, the text states that the wood could only have been transported from Jura to Rome in a boat. Choice C is incorrect because the underlined sentence simply offers a conclusion drawn from the team’s findings about the likely place of origin of the ancient planks; the text never mentions why oak was chosen for the planks instead of other wood. Choice D is incorrect because neither the underlined sentence nor the text as a whole addresses any methods that Romans used in constructing subways. Instead, the underlined sentence offers a conclusion drawn from the team’s findings about the likely place of origin of the ancient wooden planks discovered."},{"i":"acb852e7","c":"structure","d":"M","s":"The following text is from the 1923 poem “Black Finger” by Angelina Weld Grimké, a Black American writer. A cypress is a type of evergreen tree. I have just seen a most beautiful thing, Slim and still, Against a gold, gold sky, A straight black cypress, Sensitive, Exquisite, A black finger Pointing upwards. Why, beautiful still finger, are you black? And why are you pointing upwards?\n\nWhich choice best describes the overall structure of the text?","o":["The speaker assesses a natural phenomenon, then questions the accuracy of her assessment.","The speaker describes a distinctive sight in nature, then ponders what meaning to attribute to that sight.","The speaker presents an outdoor scene, then considers a human behavior occurring within that scene.","The speaker examines her surroundings, then speculates about their influence on her emotional state."],"a":1,"r":"Choice B is the best answer because it most accurately describes the overall structure of the text. First, the speaker describes observing a “most beautiful” sight: a tree (“black cypress”) standing out from the golden sky behind it, looking like a person’s finger “pointing upwards” and appearing “sensitive” and “exquisite.” Then the speaker wonders about the image’s meaning, asking why the finger is black and why it’s pointing upward. Thus, the text moves from the speaker’s description of a distinctive sight in nature to her pondering about what meaning to attribute to that sight. Choice A is incorrect because the speaker assesses a natural sight—a “black cypress” tree standing “against a gold, gold sky” like a pointed finger—but doesn’t question the accuracy of her own assessment. Although she wonders why the finger, which is really a tree, is black and why it’s pointing, the speaker doesn’t suggest that her belief that the tree resembles a finger is wrong. Choice C is incorrect. Although the speaker describes seeing a “black cypress” tree standing “against a gold, gold sky” like a pointed finger, she wonders about that natural image (asking why the finger, which is really a tree, is black and why it’s pointing) and doesn’t give any indication that any people are present in the scene. Choice D is incorrect. Although the speaker examines and wonders about one thing in her surroundings—a “black cypress” tree standing “against a gold, gold sky” like a pointed finger—she doesn’t address her own emotional state or consider how it’s affected by her surroundings."},{"i":"8d802289","c":"cross","d":"E","s":"Text 1 Dance choreographer Alvin Ailey’s deep admiration for jazz music can most clearly be felt in the rhythms and beats his works were set to. Ailey collaborated with some of the greatest jazz legends, like Charles Mingus, Charlie Parker, and perhaps his favorite, Duke Ellington. With his choice of music, Ailey helped bring jazz to life for his audiences.\n\nText 2 Jazz is present throughout Ailey’s work, but it’s most visible in Ailey’s approach to choreography. Ailey often incorporated improvisation, a signature characteristic of jazz music, in his work. When managing his dance company, Ailey rarely forced his dancers to an exact set of specific moves. Instead, he encouraged his dancers to let their own skills and experiences shape their performances, as jazz musicians do.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Dancers who worked with Ailey greatly appreciated his supportive approach as a choreographer.","Ailey’s work was strongly influenced by jazz.","Audiences were mostly unfamiliar with the jazz music in Ailey’s works.","Ailey blended multiple genres of music together when choreographing dance pieces."],"a":1,"r":"Choice B is the best answer. Author 1 states that Ailey had a “deep admiration for jazz music” and that he “helped bring jazz to life for his audiences.” Author 2 states that “Jazz is present throughout Ailey’s work.” While the authors name different aspects of Ailey’s work as the most influenced by jazz, they agree that jazz was a strong influence. Choice A is incorrect. This isn’t something that either text claims. Neither text mentions how Ailey’s dancers felt about his approach as a choreographer, so we have no evidence that either author would agree with this. Choice C is incorrect. This isn’t something that either text claims. Neither text mentions how familiar audiences were with any aspect of Ailey’s works, so we have no evidence that either author would agree with this. Choice D is incorrect. This isn’t something that either text claims. Neither text mentions any genre of music other than jazz, so we have no evidence that either author would agree with this."},{"i":"d1b8a9ad","c":"main","d":"H","s":"Disco remains one of the most ridiculed popular music genres of the late twentieth century. But as scholars have argued, the genre is far less superficial than many people believe. Take the case of disco icon Donna Summer: she may have been associated with popular songs about love and heartbreak (subjects hardly unique to disco, by the way), but like many Black women singers before her, much of her music also reflects concerns about community and identity. These concerns are present in many of the genre’s greatest songs, and they generally don’t require much digging to reveal. What does the text most strongly suggest about the disco genre?","o":["It has been unjustly ignored by most scholars despite the importance of the themes addressed by many of the genre’s songs.","It evolved over time from a superficial genre focused on romance to a genre focused on more serious concerns.","It has been unfairly dismissed for the inclusion of subject matter that is also found in other musical genres.","It gave rise to a Black women’s musical tradition that has endured even though the genre itself faded in the late twentieth century."],"a":2,"r":"Choice C is the best answer. The text argues that disco is \"far less superficial\" than its popular perception might indicate, and that love and heartbreak are \"subjects hardly unique to disco.\" Choice A is incorrect. This choice conflicts with the text, which says that scholars argue that disco \"is far less superficial than many people believe.\" Choice B is incorrect. This choice says the opposite of what the text suggests. The writer argues that the genre is not as superficial as commonly believed, but that it always reflected \"concerns about community and identity.\" Choice D is incorrect. The text doesn’t support this choice. There’s nothing in the text about disco giving rise to an enduring Black women’s musical tradition."},{"i":"d0f51067","c":"main","d":"H","s":"Modern dog breeds are largely the result of 160 years of owners crossbreeding certain dogs in order to select for particular physical appearances. Owners often say that some breeds are also more likely than others to have particular personality traits—basset hounds are affectionate; boxers are easy to train—but Kathleen Morrill and colleagues found through a combination of owner surveys and DNA sequencing of 2,000 dogs that while physical traits are predictably heritable among purebred dogs, behavior varies widely among dogs of the same breed.\n\nWhich choice best states the main idea of the text?","o":["Dog breeds would not exist without many years of human intervention in dogs’ reproduction.","Research fails to confirm a commonly held belief about dog breeds and behavior.","The dog breeds most popular among owners have often changed over the past 160 years.","A study of dog breeds is notable for its usage of both opinion surveys and DNA sequencing."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The text indicates that dog owners typically claim that some dog breeds are “more likely than others to have particular personality traits.” In other words, the text points out that a commonly held belief about dog breeds is that their personality traits are heritable. The text then states that Kathleen Morrill and colleagues undertook research about dog trait heritability and found that “behavior varies widely among dogs of the same breed.” Because Morrill and colleagues found evidence for variability rather than consistency in the behavior of dogs of the same breed, the statement that research fails to uphold a commonly held belief about dog breeds and behavior accurately reflects the main idea of the text. Choice A is incorrect. Although the text mentions that humans have long intervened in dogs’ reproduction by intentionally crossbreeding certain dogs, it doesn’t argue that such intervention is essential to the existence of dog breeds. Choice C is incorrect because the text doesn’t discuss the popularity of any dog breeds; breeds are mentioned as having certain traits, but the text says nothing about the popularity of these breeds or traits. Choice D is incorrect. Although the text briefly mentions that Morrill and colleagues conducted a study about dog traits using both surveys and DNA sequencing, this is not the main focus of the text. The text concerns the study’s results about the heritability of dog traits, not the particular methodology used by Morrill and colleagues."},{"i":"6409016a","c":"infer","d":"M","s":"The Household, Income and Labour Dynamics in Australia Survey (HILDA) examines trends in economic well-being among 25,000 people in Australia unfolding over many years. As is true of most longitudinal studies, this need for years of data collection results in high costs. By contrast, a relatively straightforward fitness study, such as one that is merely trying to identify the percentage of regular exercisers in a city who do weight training, may not need a large budget because ______ Which choice most logically completes the text?","o":["longitudinal methods are probably suitable for the fitness study.","it would be easy for HILDA researchers to add questions to their economic well-being study.","25,000 people is more than enough for HILDA to find trends in economic well-being.","the fitness study can be done well without years of data collection."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the costs of studies. The text indicates that HILDA is a longitudinal study—it involves repeated observations over a long time—and that the \"need for years of data collection\" is what causes it and most other longitudinal studies to have high costs. The text then contrasts such studies with more straightforward studies, using the example of a fitness study that wants only to find out how many regular exercisers in a particular location do weight training, that may not demand a large budget. The contrast emphasized in the text most directly suggests that the fitness study may cost less than a study like HILDA because the fitness study aims only to determine a current percentage and thus can be completed well without extending data collection over years. Choice A is incorrect because the text explicitly introduces the idea of a less expensive, straightforward fitness study as a contrast to many longitudinal studies that, like HILDA, have high costs because they require data collection over many years. The fitness study is described as trying merely to gather information about a current behavior (how many regular exercisers do weight training) rather than track trends over time, which suggests that costs could remain low because expensive longitudinal methods would not be needed, not because they would be suitable. Choice B is incorrect because the idea that HILDA researchers could easily add questions to their study might be relevant to the costs of that survey but would be completely irrelevant as an explanation for why an unrelated fitness study may not need a large budget; the studies have no direct bearing on each other. Choice C is incorrect because the idea that HILDA involves more people than necessary would be relevant to the costs of that survey but would be completely irrelevant as an explanation for why an unrelated fitness study may not need a large budget; the studies have no direct bearing on each other."},{"i":"26f5c4ba","c":"infer","d":"H","s":"In 2022, Crystal Reeck and colleagues studied whether the decision-making modes that guide consumers influence their choice between nonenvironmentally friendly standard electricity plans and environmentally friendly green plans that cap electricity usage. Study participants who self-reported using either an Affect Mode or Role Mode—which prioritize choices that have a stronger positive emotional or social impact, respectively—were more likely to select a green plan. Conversely, participants using a Calculation Mode—which aims to minimize both financial cost and personal inconvenience—were more likely to select a standard plan, even when the green option was cheaper. This finding suggests that participants using a Calculation Mode ______ Which choice most logically completes the text?","o":["were equally unlikely to factor the financial savings of the green plan into their decision-making as were participants using either the Affect or Role Modes.","may have been less strongly motivated to appear socially responsible with their choice of plan than they realized.","may have determined that the green plan imposed additional burdens on them that were not sufficiently offset by the potential financial savings.","were less likely to believe that the green plan was truly cost-effective than were participants using either the Affect or Role Modes."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the influence of decision-making modes on consumers’ choices of different electricity plans. The Affect Mode describes choices based on the decision-maker’s preferred emotional outcome, the Role Mode describes choices based on the decision-maker’s social motivations, and the Calculation Mode describes choices based on minimizing financial costs and maximizing the decision-maker’s convenience. Thus, if those using a Calculation Mode disfavor the green plan, it would be due to some financial or convenience burden the green plan imposes that the other doesn’t. The text indicates that the green plan had a lower financial cost but was nonetheless rejected by participants using the Calculation Mode. It therefore follows that the green plan likely imposed a convenience burden that outweighed potential financial savings for these participants. Choice A is incorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves social motivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience. Thus, unlike the Affect or Role Modes, the Calculation Mode would almost certainly involve taking price differences into account. Choice B is incorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves social motivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience. Thus, there is no reason to think that participants using the Calculation Mode at any point took social responsibility into account, let alone think that they discovered a disparity between their expectations and reality. Choice D is incorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves social motivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience. Thus, the text doesn’t indicate that cost-effectiveness is a factor for participants using the Affect or Role Modes, and there is no basis to compare their beliefs in the truthfulness of the green-plan description with those of the Calculation Mode users."},{"i":"8af0c099","c":"claim","d":"M","s":"“Ad recall” measures how memorable an advertising campaign is. To provide advertisers with information about their ads’ memorability, a social media site regularly surveys users about whether they remember ads they had recently interacted with on the site. In a study that drew on this survey data, advertising researcher Kristen Sussman and colleagues noted that different kinds of social media interactions involve different levels of cognitive engagement: commenting on or sharing a post is more cognitively demanding than is clicking on embedded links or on a “like” button. The researchers hypothesized that interactions indicating high levels of cognitive engagement with ad content would result in relatively high levels of ad recall.\n\nWhich finding, if true, would most directly support the researchers’ hypothesis?","o":["Users who interacted with an ad were much more likely to do so by clicking on the ad’s “like” button than they were to interact with the ad in any other way.","Users who interacted with an ad were significantly more likely to purchase the advertised product at the time they saw the ad than were users who saw the ad but did not interact with it.","Compared with users who clicked on links in an ad, users who commented on that same ad were significantly more likely to remember seeing the ad when surveyed two days later.","Although users who shared an ad were highly likely to remember details from the ad when surveyed two days later, those same users tended to forget those details when surveyed again a week later."],"a":2,"r":"Choice C is the best answer because it details a finding that, if true, would most directly support the researchers’ hypothesis about ad recall. According to the text, the researchers found that commenting on an ad that appears as a social media post is more cognitively demanding for users than simply clicking on embedded links in such an ad. The researchers then hypothesized that a high level of cognitive engagement with ad content would result in a high level of ad recall, or memory of ad content. This hypothesis would be supported by the finding that users who had commented on an ad were more likely to recall its content when surveyed two days later than users who had simply clicked on links in the same ad. Choice A is incorrect. Although the text compares one form of social media user interaction with ads—clicking on the ad’s \"like\" button—with other forms of interaction—commenting on the ad and sharing it through social media—it does so in order to determine which form of interaction is associated with a higher level of ad recall. The text doesn’t note whether users were more likely to click on the \"like\" button than they were to interact with the ad in other ways. Choice B is incorrect because the text doesn’t indicate that the study attempted to track whether social media users purchased the advertised product or to determine which form of interaction with ad content was more strongly associated with making a purchase. Choice D is incorrect. Finding that social media users who shared an ad forgot the content one week later would weaken, not support, the researchers’ hypothesis that cognitive engagement is associated with a high level of recall."},{"i":"2a5aa08a","c":"claim","d":"E","s":"Treasure Island is an 1883 novel by Robert Louis Stevenson. When the narrator was a child, his father ran a hotel. A mysterious sailor came to stay at the hotel. The narrator was frightened of the sailor, as can be seen when the narrator says, ______ Which quotation from Treasure Island most effectively illustrates the claim?","o":["“I remember [the sailor] as if it were yesterday, as he came plodding to the inn door, his sea-chest following behind him in a hand-barrow.”","“[The sailor] was a very silent man by custom. All day he hung round the cove or upon the cliffs with a brass telescope.”","“All the time he lived with us [the sailor] made no change whatever in his dress but to buy some stockings from a hawker. One of the [corners] of his hat having fallen down, he let it hang from that day forth, though it was a great annoyance when it blew.”","“How [the sailor] haunted my dreams, I need scarcely tell you. On stormy nights, when the wind shook the four corners of the house and the surf roared along the cove and up the cliffs, I would see him in a thousand forms, and with a thousand diabolical expressions.”"],"a":3,"r":"Choice D is the best answer because it most effectively illustrates the claim that the narrator was frightened of the sailor. The quotation describes the sailor haunting the narrator’s dreams, appearing in \"a thousand forms\" with \"a thousand diabolical expressions.\" This vivid imagery conveys the intense psychological fear the narrator experienced when thinking about the sailor. Furthermore, the quotation evokes the narrator’s terror and dread by describing a stormy night setting with wind shaking the house and a roaring surf. Choice A is incorrect because this quotation does not provide any details to suggest that the narrator was afraid of the sailor. It simply describes the narrator’s memory of the sailor arriving at the inn with his sea chest. Choice B is incorrect because this quotation does not effectively illustrate the claim that the narrator was frightened of the sailor. The quotation provides several details about the sailor, including that it was his custom to remain silent. However, the quotation does not relate these details to the narrator’s experience of being frightened of the sailor. Choice C is incorrect because this quotation focuses on aspects of the sailor’s appearance and dress. There is no connection made in the quotation between these physical details and the narrator’s sense of being frightened of the sailor."},{"i":"6317295c","c":"graph","d":"M","s":"","o":["J0614-03 has the shortest amount of time between consecutive pulses of all the RRATs in the table.","J0545-03 and J0121+53 have the same amount of time between consecutive pulses.","J1654-2335 has the longest amount of time between consecutive pulses of all the RRATs in the table.","J0103+54 and J0121+53 both have more than one second of time between consecutive pulses."],"a":0,"r":"Choice A is the best answer because it most accurately uses data from the table to complete the statement about certain rotating radio transients (RRATs). The table contains information about the right ascensions, periods, and frequencies of various pulsar stars called RRATs. According to the text, the period of an RRAT is defined as the time between consecutive pulses. The table shows that the period of RRAT J0614- 03 is 0.136 seconds, which is the lowest number of all the periods of the RRATs listed in the table. If the period is the time between consecutive pulses, and J0614-03 has the shortest period, then J0614-03 has the shortest amount of time between consecutive pulses of all the RRATs in the table. Choice B is incorrect because according to the table, J0545-03 has a period of 1.074 seconds and J0121+53 has a period of 2.725 seconds. According to the text, the period of an RRAT is the time between consecutive pulses. Therefore, since J0545-03 and J0121+53 have different periods, they do not have the same amount of time between consecutive pulses. Choice C is incorrect because according to the table, J1654- 2335 has a period of 0.545 seconds, which is not the longest period of all the RRATs listed in the table. According to the text, the period of an RRAT is the time between consecutive pulses, and both J0545-03 and J0121+53 have longer periods than J1654-2335, so J1654-2335 does not have the longest time between consecutive pulses of all the RRATs in the table. Choice D is incorrect because according to the table, J0103+54 has a period of 0.354 seconds, and J0121+53 has a period of 2.725 seconds. According to the text, the period of an RRAT is the time between consecutive pulses, and only J0121+53 has more than one second of time between consecutive pulses, not J0103+54."},{"i":"df34b586","c":"graph","d":"E","s":"","o":["the Philippines increased dramatically from 1908 to 1918.","New Zealand were largely consistent from 1903 to 1918.","Australia increased steadily from 1903 to 1918.","Turkey declined substantially from 1913 to 1918."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the graph to complete the example. According to the graph, fewer than 10,000 sewing machines were sold in the Philippines in both 1903 and 1908, but nearly 30,000 were sold in 1913 and around 45,000 were sold in 1918. This increase illustrates the statement in the text that demand for Singer sewing machines grew significantly in the early twentieth century in overseas countries other than Russia, Germany, and the United Kingdom. Choice B is incorrect because consistent sales of Singer sewing machines in New Zealand from 1903 to 1918 do not indicate that demand for the product increased but rather that demand remained relatively the same. Choice C is incorrect because it does not accurately describe the data in the graph. Although sales in Australia did increase somewhat between 1903 and 1908, there was very little change between 1908 and 1913, and then sales declined between 1913 and 1918. The data for Australia, then, do not show a steady increase from 1903 to 1918. Choice D is incorrect because declining sales of Singer sewing machines in Turkey from 1913 to 1918 do not point to an increase in demand for the product but rather to a decline in demand."},{"i":"eee7536f","c":"fss","d":"E","s":"On March 27, 2004, after nine years as a professional boxer, Isra Girgrah retired. The Yemeni American athlete ______ her career with a record of twenty-eight wins, three losses, and two ties.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["finish","has been finishing","finished","will be finishing"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of a verb to express tense in a sentence. In this choice, the past tense verb “finished” is consistent with the other past tense verb (“retired”) used to refer to Girgrah’s retirement in 2004. Choice A is incorrect because the present tense verb “finish” isn’t consistent with the other past tense verb (“retired”) used to refer to Girgrah’s retirement in 2004. Furthermore, the plural verb “finish” doesn’t agree in number with the sentence’s singular subject “The Yemeni American athlete.” Choice B is incorrect because the present perfect progressive tense verb “has been finishing” isn’t consistent with the other past tense verb (“retired”) used to refer to Girgrah’s retirement in 2004. Choice D is incorrect because the future progressive tense verb “will be finishing” isn’t consistent with the other past tense verb (“retired”) used to refer to Girgrah’s retirement in 2004."},{"i":"2dd1b8bf","c":"fss","d":"H","s":"Compared to that of alumina glass, ______ silica glass atoms are so far apart that they are unable to re-form bonds after being separated.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["silica glass is at a significant disadvantage due to its more dispersed atomic arrangement:","silica glass has a more dispersed atomic arrangement, resulting in a significant disadvantage:","a significant disadvantage of silica glass is that its atomic arrangement is more dispersed:","silica glass’s atomic arrangement is more dispersed, resulting in a significant disadvantage:"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-modifier placement. This choice makes “silica glass’s atomic arrangement” the subject of the sentence and places it immediately after the modifying phrase “compared to that of alumina glass.” In doing so, this choice clearly establishes that silica glass’s atomic arrangement—and not another noun in the sentence—is being compared to the atomic arrangement (“that”) of alumina glass. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase “silica glass” immediately after the modifying phrase illogically suggests that silica glass itself (rather than its atomic arrangement) is being compared to alumina glass’s atomic arrangement. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “silica glass” immediately after the modifying phrase illogically suggests that silica glass itself (rather than its atomic arrangement) is being compared to alumina glass’s atomic arrangement. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “a significant disadvantage” immediately after the modifying phrase illogically suggests that “a significant disadvantage” is being compared to alumina glass’s atomic arrangement."},{"i":"20a6a4ed","c":"fss","d":"E","s":"Anthropologist Lívia Barbosa, of the Universidade Federal Fluminense in Brazil, ______ food and sociability in contemporary Brazil—specifically, how foods such as cabidela (a rice and rabbit dish) and churrasco (a barbeque dish) function as central mechanisms in building social relationships, values, and identities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["studies","are studying","have studied","study"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb \"studies\" agrees in number with the singular subject \"anthropologist Lívia Barbosa.\" Choice B is incorrect because the plural verb \"are studying\" doesn’t agree in number with the singular subject \"anthropologist Lívia Barbosa.\" Choice C is incorrect because the plural verb \"have studied\" doesn’t agree in number with the singular subject \"anthropologist Lívia Barbosa.\" Choice D is incorrect because the plural verb \"study\" doesn’t agree in number with the singular subject \"anthropologist Lívia Barbosa.\""},{"i":"d75d57a0","c":"bound","d":"E","s":"While many video game creators strive to make their graphics ever more ______ others look to the past, developing titles with visuals inspired by the “8-bit” games of the 1980s and 1990s. (The term “8-bit” refers to a console whose processor could only handle eight bits of data at once.) Which choice completes the text so that it conforms to the conventions of Standard English?","o":["lifelike but","lifelike","lifelike,","lifelike, but"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation between a subordinate clause and a main clause. This choice correctly uses a comma to mark the boundary between the subordinate clause (“While…lifelike”) and the main clause (“others look to the past”). Choice A is incorrect because it results in an incomplete sentence with no main clause. Choice B is incorrect because it fails to mark the boundary between the subordinate clause (“While…lifelike”) and the main clause (“others…past”). Choice D is incorrect because it results in an incomplete sentence with no main clause."},{"i":"1f39ab8b","c":"bound","d":"E","s":"In the novel Things Fall Apart by Chinua Achebe, Okonkwo is a leader of Umuofia (a fictional Nigerian clan) and takes pride in his culture’s traditions. However, when the arrival of European missionaries brings changes to Umuofia, the novel asks a central question: How ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["Umuofia’s traditions will be affected.","will Umuofia’s traditions be affected.","Umuofia’s traditions will be affected?","will Umuofia’s traditions be affected?"],"a":3,"r":"Choice D is the best answer. The clause before the colon tells us that the novel “asks a question,” so the clause after the colon should be in the conventional form of a question: with the verb before the subject, and a question mark at the end. Choice A is incorrect. This choice ends the sentence with a period, which isn’t right. The clause before the colon tells us that the novel “asks a question,” so the clause after the colon should be that question. Choice B is incorrect. This choice ends the sentence with a period, which isn’t right. The clause before the colon tells us that the novel “asks a question,” so the clause after the colon should be that question. In Standard English, questions place the verb before the subject and end with a question mark. Choice C is incorrect. This choice doesn’t conform to the conventions of Standard English. In Standard English, questions place the verb before the subject."},{"i":"5a5e22b5","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Gravitational waves are powerful ripples that originate in deep space and eventually pass through Earth. The Laser Interferometer Gravitational Wave Observatory (LIGO) is a physics study that began in 2002. LIGO’s goal is to detect and analyze gravitational waves. LIGO uses a pair of massive gravitational wave detectors called interferometers that are thousands of miles apart. In 2015, for the first time in history, LIGO researchers detected a gravitational wave passing through Earth. The student wants to present LIGO’s aim and methodology.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In 2015, LIGO’s massive interferometers detected a powerful ripple that originated in deep space and eventually passed through Earth.","Though the physics study LIGO began in 2002, its massive interferometers didn’t detect a gravitational wave until 2015.","To achieve its aims, LIGO uses a pair of massive interferometers that are thousands of miles apart.","A physics study designed to detect and analyze gravitational waves, LIGO uses a pair of massive interferometers that are thousands of miles apart."],"a":3,"r":"Choice D is the best answer. The sentence effectively presents the LIGO study’s aim, noting that it is designed to detect and analyze gravitational waves, and its methodology (it uses two interferometers to detect the waves). Choice A is incorrect. The sentence describes a finding from the LIGO study; it doesn’t effectively present the study’s aim or its methodology. Choice B is incorrect. The sentence provides background information about the LIGO study’s timeline; it doesn’t effectively present the study’s aim or its methodology. Choice C is incorrect. The sentence touches on LIGO’s methodology, noting that it uses two interferometers, but doesn’t indicate what the study’s aims are."},{"i":"96a86bce","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Cambodia’s Angkor Wat was built in the 1100s to honor the Hindu god Vishnu. It has been a Buddhist temple since the sixteenth century. Decorrelation stretch analysis is a novel digital imaging technique that enhances the contrast between colors in a photograph. Archaeologist Noel Hidalgo Tan applied decorrelation stretch analysis to photographs he had taken of Angkor Wat’s plaster walls. Tan’s analysis revealed hundreds of images unknown to researchers. The student wants to present Tan’s research to an audience unfamiliar with Angkor Wat.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Tan photographed Angkor Wat’s plaster walls and then applied decorrelation stretch analysis to the photographs.","Decorrelation stretch analysis is a novel digital imaging technique that Tan used to enhance the contrast between colors in a photograph.","Using a novel digital imaging technique, Tan revealed hundreds of images hidden on the walls of Angkor Wat, a Cambodian temple.","Built to honor a Hindu god before becoming a Buddhist temple, Cambodia’s Angkor Wat concealed hundreds of images on its plaster walls."],"a":2,"r":"Choice C is the best answer. The sentence effectively presents Tan’s research to an audience unfamiliar with Angkor Wat, explaining the results of the research and identifying Angkor Wat as a temple in Cambodia. Choice A is incorrect. While the sentence presents Tan’s research, it fails to explain what Angkor Wat is for an audience unfamiliar with the temple. Choice B is incorrect. The sentence emphasizes the role that decorrelation stretch analysis played in Tan’s research; it doesn’t present the research, which would require specifying where it was conducted. Choice D is incorrect. While the sentence explains what Angkor Wat is, it fails to present Tan’s research."},{"i":"b7c404d1","c":"trans","d":"M","s":"With her room-sized installation The Interstitium, Iranian American artist Laleh Mehran succeeded in creating a space that felt, as intended, both “familiar and distant.” ______ with a video screen placed at the far end of the coal slag-encrusted room, her installation was reminiscent of a typical movie theater—albeit one found in a subterranean coal mine.\n\nWhich choice completes the text with the most logical transition?","o":["Next,","Nevertheless,","Indeed,","Instead,"],"a":2,"r":"Choice C is the best answer. \"Indeed\" logically signals that the information in this sentence—that Laleh Mehran’s installation resembled both a typical movie theater and a coal mine—supports the previous sentence’s claim that the space Mehran created felt both \"familiar and distant.\" Choice A is incorrect because \"next\" illogically signals that the description of Laleh Mehran’s installation in this sentence is the next step in a process. Rather, it supports the previous sentence’s claim about Mehran’s installation. Choice B is incorrect because \"nevertheless\" illogically signals that the information in this sentence is true despite the claim about Laleh Mehran’s installation in the previous sentence. Rather, it supports that claim. Choice D is incorrect because \"instead\" illogically signals that this sentence presents an alternative to the previous sentence’s claim about Laleh Mehran’s installation. Rather, it supports that claim."},{"i":"827afb27","c":"trans","d":"E","s":"Most conifers (trees belonging to the phylum Coniferophyta) are evergreen. That is, they keep their green leaves or needles year-round. However, not all conifer species are evergreen. Larch trees, ______ lose their needles every fall.\n\nWhich choice completes the text with the most logical transition?","o":["for instance,","nevertheless,","meanwhile,","in addition,"],"a":0,"r":"Choice A is the best answer. “For instance” logically signals that the information in this sentence—that larch trees lose their needles every fall—is an example supporting the claim in the previous sentence (that not all conifer species keep their leaves or needles year-round). Choice B is incorrect because “nevertheless” illogically signals that the information in this sentence is true in spite of the claim about conifer species in the previous sentence. Instead, it’s an example supporting that claim. Choice C is incorrect because “meanwhile” illogically signals that the information in this sentence is separate from (while occurring simultaneously with) the claim about conifer species in the previous sentence. Instead, it’s an example supporting that claim. Choice D is incorrect because “in addition” illogically signals that the information in this sentence is merely an additional fact related to the claim about conifer species in the previous sentence. Instead, it’s an example supporting that claim."}],"img":{"6317295c":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEPBAMAAABSIgo2AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA1D0lEQVR42u1deXwTRRt+ZnM1vTJJW27abWkBubqlXHKm0AJ+CKSUQxQh3IcHAbnkkCIoAgpFFEVAKoeiooRLEBWCcgrYVJAbmnIqQjPh6Jlkvz/KUWghiVCgmuf3o2R359pn3pl533dmZw
