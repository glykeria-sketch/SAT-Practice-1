<script>
const D={"t":"Practicetest24","q":[{"i":"a49500cc","c":"vocab","d":"E","s":"Predatory animals differ widely in how they ______ food for their young. Some leave dead prey nearby for their young to consume, some bring live prey to their young, and some feed their young directly from their own mouths.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["avoid","guess","provide","describe"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of how predators feed their young. As used in this context, \"provide\" means supply or make something that’s needed available. The text indicates that some predators supply prey for their young by either leaving dead prey nearby or by bringing live prey to them. Other predators, the text states, feed their young directly from their own mouths. This context supports the idea that predatory animals have various ways to provide food for their young. Choice A is incorrect because in this context, \"avoid\" would mean keep away from or refrain from, neither of which would make sense in context. Nothing in the text suggests that predators refrain from food for their young. Choice B is incorrect because in this context, \"guess\" would mean speculate or suppose, and it’s unclear what it would mean for predators to speculate food for their young. Choice D is incorrect because in this context, \"describe\" would mean explain, and it’s unclear what it would mean for predators to explain food for their young."},{"i":"94eb800d","c":"vocab","d":"M","s":"For a 2020 exhibition, photographer and neurobiologist Okunola Jeyifous ______ a series of new images based on a series of alphabet posters from the 1970s known as the “Black ABCs,” which featured Black children from Chicago. Jeyifous photographed the now-adult models and layered the photos over magnified images of the models’ cells, resulting in what he called “micro and macro portraiture.”\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["validated","created","challenged","restored"],"a":1,"r":"Choice B is the best answer because it most logically and precisely completes the text’s discussion of Jeyifous’s series of images for the 2020 exhibition. In this context, “created” means produced. The text explains that Jeyifous, a photographer and neurobiologist, photographed adults who had appeared as children in posters from the 1970s, then combined those photographs with magnified images of the adults’ cells—a process that resulted in what he called “micro and macro portraiture.”This context suggests that Jeyifous drew on his dual interests in photography and neurobiology to produce the images for display in the exhibition. Choice A is incorrect because there’s nothing in the text to suggest that Jeyifous “validated,” or corroborated, the series of images. The text describes Jeyifous’s process for composing the images but doesn’t describe Jeyifous making an effort to evaluate the images for their artistic or scientific legitimacy. Choice C is incorrect because there’s nothing in the text to suggest that Jeyifous “challenged,” or disputed, an aspect of the images; rather, the focus of the text is on the inspiration behind the images and the method Jeyifous used to achieve them. Choice D is incorrect because the text indicates that Jeyifous made the images himself using a combination of photography and magnified pictures of cells, not that he “restored,” or reconditioned, the images from a deteriorated state."},{"i":"a7991da1","c":"vocab","d":"E","s":"A unique dialect, or regional variety, of Spanish is spoken in Puerto Rico. It contains many words borrowed from the language of the Taínos, the Indigenous people of Puerto Rico. African languages also made important contributions to the Puerto Rican dialect. For example, the way certain vowel sounds are pronounced in it can be ______ to how they are pronounced in Yoruba, a West African language.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["traced","surrendered","announced","offered"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the origins of the unique dialect of Spanish spoken in Puerto Rico. In this context, \"traced\" means tracked back to. The text notes that the regional variety of Spanish spoken in Puerto Rico has its roots in the language of the Taínos and in the West African language of Yoruba. This context supports the idea that the way certain vowel sounds are pronounced in the Puerto Rican dialect can be traced back to Yoruba. Choice B is incorrect because the text presents the statement about the relationship between vowel pronunciation in the Puerto Rican dialect of Spanish and in Yoruba as an example to support the claim that African languages have contributed to the Puerto Rican dialect. It therefore wouldn’t make sense to say that the pronunciation of certain vowel sounds in the Puerto Rican dialect can be \"surrendered,\" or handed over on demand, to the pronunciation in Yoruba. Choice C is incorrect because the text gives no indication that the way certain vowel sounds are pronounced in the Puerto Rican dialect of Spanish has been \"announced,\" or officially declared or proclaimed. According to the text, elements of the dialect have been inherited or borrowed from African languages, and the relationship between the pronunciation of certain vowels in the Puerto Rican dialect and in Yoruba is an example of this inheritance, suggesting that the pronunciation in the Puerto Rican dialect can be traced to Yoruba. Choice D is incorrect because the text presents the statement about the relationship between vowel pronunciation in the Puerto Rican dialect of Spanish and in Yoruba as an example to support the claim that African languages have contributed to the Puerto Rican dialect. It therefore wouldn’t make sense to say that the pronunciation of certain vowel sounds in the Puerto Rican dialect can be \"offered,\" or presented as a gift, to the pronunciation in Yoruba."},{"i":"760ee1db","c":"vocab","d":"E","s":"Although the playwrights hoped that their play would be ______ when performed live, critics generally agreed that the production and performances had the opposite effect, wearying audiences instead of energizing them.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["multifaceted","realistic","rousing","subtle"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the play’s effect on audiences. As used in this context, “rousing” means exciting or energizing. The text indicates that critics found the play to have “the opposite effect” on audiences of what the playwrights hoped for. The critics, the text says, thought the play was wearying rather than energizing to viewers. This context supports the idea that the playwrights hoped live performances of the play would be energizing, or rousing, to audiences. Choice A is incorrect because there’s no information in the text suggesting that the playwrights hoped live performances of the play would be “multifaceted,” or be varied or have many aspects. The text indicates that critics found the play to be wearying to audiences and that this was the opposite of what the playwrights hoped for. Multifaceted is not the opposite of wearying, but rousing is, which suggests that the playwrights hoped the play would be rousing. Choice B is incorrect because there’s no information in the text suggesting that the playwrights hoped live performances of the play would be “realistic,” or lifelike or sensible. The text says that critics found the play to be wearying to audiences and that this was the opposite of what the playwrights hoped for. Realistic is not the opposite of wearying, but rousing is, which suggests that the playwrights hoped the play would be rousing. Choice D is incorrect because there’s no information in the text suggesting that the playwrights hoped live performances of the play would be subtle, or complex or understated. The text says that critics found the play to be wearying to audiences and that this was the opposite of what the playwrights hoped for. Subtle is not the opposite of wearying, but rousing is, which suggests that the playwrights hoped the play would be rousing."},{"i":"48e4021d","c":"purpose","d":"E","s":"The following text is from Holly Goldberg Sloan’s 2017 novel Short. More than two years ago my parents bought a piano from some people who were moving to Utah. Mom and Dad gave it to my brothers and me for Christmas. I had to act really happy because it was such a big present, but I pretty much hated the thing from the second it was carried into the hallway upstairs, which is right next to my bedroom. The piano glared at me. It was like a songbird in a cage. It wanted to be set free. ©2017 by Holly Goldberg Sloan Which choice best states the main purpose of the text?","o":["It explains why the narrator always wanted a piano close to her bedroom.","It establishes how the narrator feels about the piano.","It suggests that the narrator’s brothers are talented piano players.","It describes the event that led the narrator’s parents to buy a piano."],"a":1,"r":"Choice B is the best answer because it best states the main purpose of the text, which is to establish the narrator’s feelings about the piano. The narrator reveals that she “had to act really happy” about the piano even though she “pretty much hated the thing” as soon as it was placed upstairs near her bedroom. The narrator also describes the piano as glaring at her and compares it to a caged bird that wants to be set free. These details establish the narrator’s feelings about the piano, suggesting that it makes her uneasy. Choice A is incorrect because the text indicates that the narrator hated having the piano upstairs right next to her bedroom, not that she wanted a piano to be close to her bedroom. Choice C is incorrect because the only information provided in the text about the narrator’s brothers is that they were given the piano along with the narrator. Choice D is incorrect because the text does not describe the event that led the narrator’s parents to buy the piano from the people moving to Utah. Instead, the text focuses on the narrator’s feelings about the piano after it was given to her and her brothers."},{"i":"9421ed62","c":"purpose","d":"E","s":"In 2007, computer scientist Luis von Ahn was working on converting printed books into a digital format. He found that some words were distorted enough that digital scanners couldn’t recognize them, but most humans could easily read them. Based on that finding, von Ahn invented a simple security test to keep automated “bots” out of websites. The first version of the reCAPTCHA test asked users to type one known word and one of the many words scanners couldn’t recognize. Correct answers proved the users were humans and added data to the book-digitizing project.\n\nWhich choice best states the main purpose of the text?","o":["To discuss von Ahn’s invention of reCAPTCHA","To explain how digital scanners work","To call attention to von Ahn’s book-digitizing project","To indicate how popular reCAPTCHA is"],"a":0,"r":"Choice A is the best answer because it most accurately states the main purpose of the text. After providing a brief introduction to computer scientist Luis von Ahn, the text focuses on discussing how von Ahn’s digitization work led to the invention of a digital security test known as reCAPTCHA. Choice B is incorrect because the text doesn’t address how digital scanners work. Choice C is incorrect. Although the text mentions von Ahn’s book-digitizing project, that information is provided as a detail, not as the main purpose of the text. Choice D is incorrect because the text doesn’t provide any indication of reCAPTCHA’s popularity; instead, it describes reCAPTCHA’s origin."},{"i":"cf9a00e0","c":"func","d":"M","s":"Chile’s Atacama Desert is one of the driest places on Earth. <u>Mary Beth Wilhelm and other astrobiologists search for life, or its remains, in this harsh place because the desert closely mirrors the extreme environment on Mars.<\/u> The algae and bacteria found in Atacama’s driest regions may offer clues about Martian life. By studying how these and other microorganisms survive such extreme conditions on Earth, Wilhelm’s team hopes to determine whether similar life might have existed on Mars and to develop the best tools to look for evidence of it.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["To contrast the conditions in the Atacama Desert with those on Mars","To explain why many life-forms cannot survive in the Atacama Desert","To indicate why astrobiologists choose to conduct research in the Atacama Desert","To describe certain limitations to conducting scientific study in the Atacama Desert"],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence describes a unique location on Earth, the Atacama Desert. The next sentence, which is the underlined sentence, states that the reason why astrobiologists study life, or its remains, in this unique location is that Atacama is a harsh environment that closely resembles the extreme environment of Mars. The remainder of the text explains that the researchers hope their work in Atacama will support inquiry into life on Mars. Thus, the underlined portion functions mainly to indicate why astrobiologists choose to conduct research in the Atacama Desert. Choice A is incorrect because to contrast two things means to show the differences between them, and the phrase \"closely mirrors\" in the underlined sentence indicates that the extreme environment in the Atacama Desert is similar to, not different from, that on Mars. This similarity is why, according to the underlined sentence, astrobiologists conduct research in Atacama. Choice B is incorrect because the underlined sentence doesn’t address forms of life that are unable to survive the harsh environment of the Atacama Desert. Instead, the underlined sentence explains why astrobiologists study life, or its remains, in this environment. Choice D is incorrect because the underlined sentence doesn’t suggest that the scientific research in the Atacama Desert is limited in any way; instead, the sentence explains that the similarity between the environments of Atacama and Mars is the reason why astrobiologists search for life, or its remains, in Atacama."},{"i":"fcc328c6","c":"func","d":"E","s":"Streams and rivers carry soil and rocks from one location to another. But there is another way for these geological materials to move. <u>Scientists call this process “aeolian transport.”<\/u> In aeolian transport, winds move small particles of soil or rock over potentially great distances. Geologist Melisa Diaz and her team studied dust in Antarctica to find out if it was moved by aeolian transport. They discovered that the dust matched geological material in Australia. Aeolian transport had carried it from one continent to another, across thousands of miles of open ocean.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It presents Melisa Diaz’s remarks about difficulties that her team encountered.","It introduces a scientific term that is used in the discussion that follows.","It emphasizes the surprising nature of the findings that are presented.","It explains the difference between two kinds of geological material."],"a":1,"r":"Choice B is the best answer because it most accurately describes the function of the underlined portion in the text as a whole. The first two sentences introduce the idea that soil and rocks can be moved from one location to another by something other than rivers and streams. The underlined sentence then states that the term used by scientists to refer to this process is “aeolian transport.” The discussion that follows explains what aeolian transport is (the movement of small geological materials over potentially great distances by the wind) and describes an example of a study that found that dust particles had been moved by aeolian transport from Australia to Antarctica. Thus, the underlined portion introduces a scientific term that is used in the discussion that follows. Choice A is incorrect because the underlined portion of the text doesn’t present any remarks from Melisa Diaz, nor does it suggest that Diaz and her team encountered difficulties in their study. Instead, the phrase in quotation marks in the underlined portion simply presents a term that is used by scientists to refer to a specific process discussed in the text. Choice C is incorrect because nothing in either the underlined portion or the text as a whole suggests that the findings of the study presented in the text were surprising or unexpected. In fact, the text suggests that Diaz and her team wanted to see if aeolian transport could explain the appearance of certain geological materials in Antarctica, and their findings did indeed confirm the involvement of aeolian transport. Choice D is incorrect. Although the first sentence of the text mentions soil and rocks, which are two different kinds of geological material, the underlined portion doesn’t refer to these materials, nor does it explain the difference between them. Rather, the underlined portion introduces the scientific term “aeolian transport,” which is used in the discussion that follows."},{"i":"f878693b","c":"cross","d":"M","s":"Text 1 In 1954 George Balanchine choreographed a production of The Nutcracker, a ballet by Pyotr Ilyich Tchaikovsky. It has since become a tradition for hundreds of dance companies in North America to stage The Nutcracker each year. <u>But the show is stuck in the past, with an old-fashioned story and references, so it should no longer be produced.<\/u> Ballet needs to create new traditions if it wants to stay relevant to contemporary audiences.\n\nText 2 The Nutcracker is outdated, but it should be kept because it’s a holiday favorite and provides substantial income for some dance companies. Although it can be behind the times, there are creative ways to update the show. For example, Debbie Allen successfully modernized the story. Her show Hot Chocolate Nutcracker combines ballet, tap, hip-hop, and other styles, and it has been gaining in popularity since it opened in 2009.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the underlined claim in\n\nText 1?","o":["By questioning the idea that the story of The Nutcracker is stuck in the past and by rejecting the suggestion that contemporary audiences would enjoy an updated version","By agreeing that contemporary audiences have largely stopped going to see performances of The Nutcracker because it’s so old-fashioned","By pointing out that most dance companies could increase their incomes by offering modernized versions of The Nutcracker","By suggesting that dance companies should consider offering revised versions of The Nutcracker instead of completely rejecting the show"],"a":3,"r":"Choice D is the best answer because it reflects how the author of Text 2 would most likely respond to the underlined claim in Text 1. Text 1 begins by noting the success of The Nutcracker but then claims that the ballet is \"stuck in the past\" and should \"no longer be produced.\" Text 2 begins by conceding that The Nutcracker is indeed outdated but argues that it should continue to be performed, states that the show can be updated to include more contemporary dance styles, and provides an example of one such modernized version, Hot Chocolate Nutcracker. Hence, the author of Text 2 would most likely respond to the underlined claim in Text 1 by suggesting that dance companies should consider offering revised versions of The Nutcracker instead of completely rejecting the show. Choice A is incorrect because the author of Text 2 advocates for using creative ways to update The Nutcracker and therefore wouldn’t respond to the underlined claim by rejecting the suggestion that contemporary audiences would enjoy an updated version. Choice B is incorrect because although the authors of both texts claim that The Nutcracker is outdated, neither text suggests that contemporary audiences have largely stopped attending productions of the show. On the contrary, Text 2 states that The Nutcracker is a holiday favorite and generates substantial income for some dance companies. Choice C is incorrect because although Text 2 provides an example of a contemporized version of The Nutcracker, the text doesn’t suggest that offering modernized versions is a way to increase income for most dance companies. Rather, the author of Text 2 suggests that offering modernized versions is a way to make the ballet discussed in Text 1 feel less outdated."},{"i":"7f0be746","c":"main","d":"H","s":"The following text is from Milan Kundera’s 1984 novel The Unbearable Lightness of Being (translated by Michael Henry Heim in 1984). Karenin is a dog that belongs to Tomas and Tereza. Karenin was not overjoyed by the move to Switzerland [from Prague]. Karenin hated change. Dog time cannot be plotted along a straight line; it does not move on and on, from one thing to the next. It moves in a circle like the hands of a clock, which—they, too, unwilling to dash madly ahead—turn round and round the face, day in and day out following the same path. In Prague, when Tomas and Tereza bought a new chair or moved a flower pot, Karenin would look on in displeasure. It disturbed his sense of time. It was as though they were trying to dupe the hands of the clock by changing the numbers on its face. ©1984 by Milan Kundera. Translation ©1984 by Harper &amp; Row, Publishers, Inc.\n\nWhich choice best states the main idea of the text?","o":["As a dog, Karenin possesses a sense of time that involves a strong preference for predictability and an aversion to disruption.","After he’s moved to a new home, Karenin’s negative response to changes has become more pronounced.","Similar to Tomas and Tereza, Karenin comprehends time as circular rather than as a straightforward progression.","As is the case for other dogs, Karenin’s sense of time seems to accelerate depending on the objects and places that surround him."],"a":0,"r":"Choice A is the best answer because it most accurately states the main idea of the text. The text begins by stating that Tomas and Tereza’s dog Karenin felt disrupted by a recent move because of his dislike of change. The text then goes on to suggest that this is because the way a dog experiences time differs from the way humans experience time: time for a dog doesn’t move linearly, going \"on and on, from one thing to the next,\" but instead moves circularly, \"like the hands of a clock.\" That is, time for a dog is experienced as a cyclical pattern characterized by routine and predictability, with each day \"following the same path.\" The text then concludes by providing examples of seemingly insignificant changes in routine that profoundly \"disturbed [Karenin’s] sense of time,\" causing him to feel displeasure. Thus, the main idea of the text is that Karenin’s sense of time as a dog involves a strong preference for predictability and an aversion to disruption. Choice B is incorrect. Although the text emphasizes Karenin’s displeasure with the recent move to a new home, it doesn’t suggest that the move has made his negative responses more pronounced than they once were. Rather, in accounting for Karenin’s displeasure with the move to Switzerland, the text explains that Karenin generally has a negative response to any kind of change. Choice C is incorrect because the text doesn’t suggest that Karenin comprehends time similarly to how Tomas and Tereza comprehend it. On the contrary, the text strongly implies a contrast between dogs’ circular experience of time with the way humans experience time as a straightforward progression that can be \"plotted on a straight line.\" Choice D is incorrect because the text provides no indication that a change in the places and objects surrounding Karenin causes him to feel as though time is accelerating. Although the text does use the language of \"dash[ing] madly ahead\" in relation to time, the phrase appears in the context of a comparison illustrating how dogs experience time: time for a dog moves just as the hands of a clock do, in a circle and \"unwilling to dash madly ahead\"—that is, always in a regular and predictable way."},{"i":"ed314256","c":"main","d":"H","s":"The most recent iteration of the immersive theater experience Sleep No More, which premiered in New York City in 2011, transforms its performance space—a five-story warehouse—into a 1930s-era hotel. Audience members, who wander through the labyrinthine venue at their own pace and follow the actors as they play out simultaneous, interweaving narrative loops, confront the impossibility of experiencing the production in its entirety. The play’s refusal of narrative coherence thus hinges on the sense of spatial fragmentation that the venue’s immense and intricate layout generates. What does the text most strongly suggest about Sleep No More’s use of its performance space?","o":["The choice of a New York City venue likely enabled the play’s creators to experiment with the use of theatrical space in a way that venues from earlier productions could not.","Audience members likely find the experience of the play disappointing because they generally cannot make their way through the entire venue.","The production’s dependence on a particular performance environment would likely make it difficult to reproduce exactly in a different theatrical space.","Audience members who navigate the space according to a recommended itinerary will likely have a better grasp of the play’s narrative than audience members who depart from that itinerary."],"a":2,"r":"Choice C is the best answer. The text says that the production’s use of its large, winding space has a very specific effect on the audience. Given that the space itself is so important to creating this effect, it would be difficult to reproduce the production in a different space. Choice A is incorrect. The fact that the venue is in New York City isn’t connected to the experimental nature of the performance. It’s the size of the venue, not its location in New York, that affects the theatrical experience. Choice B is incorrect. The text never suggests that audience members are disappointed because they can’t see the entire production. In fact, it suggests that that’s an important part of the experience. Choice D is incorrect. The text doesn’t mention a recommended itinerary for audience members."},{"i":"4b3d6062","c":"infer","d":"H","s":"The Mammillaria cactus M. boolii occurs naturally only in the state of Sonora in Mexico, and the smallness of its range makes it especially vulnerable to extinction. The traditional single-species approach to conservation emphasizes the need to focus on individual species most at risk, like M. boolii, but recently, conservationists have argued that an ecosystem-based approach that incorporates the many interactions between the climate, terrain, and various species of a given geographical area may lead to better outcomes for all the species in a given location. If this view is correct, the single-species approach to the conservation of M. boolii could thus ______ Which choice most logically completes the text?","o":["lead to a better understanding of how the distribution of Mammillaria species throughout Mexico has affected their survival.","allow conservationists to better consider how climatic changes affecting Sonora may reduce the number of species competing with M. boolii.","erroneously shift the focus of conservation efforts away from M. boolii itself.","fail to consider the ways in which the survival of M. boolii may be influenced by changes in the populations of other species that inhabit Sonora."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of conservation approaches for the Mammillaria cactus M. boolii. The text establishes that M. boolii only grows naturally in the state of Sonora in Mexico, which makes it particularly vulnerable to extinction. The text then contrasts two approaches to conservation: the traditional single-species approach that individually focuses on at-risk species and a newer ecosystem-based approach that considers the interactions between climate, terrain, and various species in a geographical area. According to the text, conservationists have recently argued that this ecosystem-based approach may lead to better outcomes for all species in a location. If this ecosystem view is correct, then the single-species approach to conserving M. boolii would likely fail to consider how the cactus’s survival depends on its interactions with other species in Sonora’s ecosystem. Choice A is incorrect because the text doesn’t address the distribution of Mammillaria species besides M. boolii throughout Mexico or discuss how that distribution affects survival. The text focuses specifically on M. boolii in Sonora and different approaches to its conservation. Choice B is incorrect because the text doesn’t suggest that climatic changes in Sonora would reduce competition for M. boolii or that conservation efforts are focused on understanding this specific dynamic. In fact, the text implies that an ecosystem-based approach would consider climate among many other factors but doesn’t specify how climatic changes might affect competition between species. Choice C is incorrect because the text doesn’t suggest that the single-species approach would shift the focus of conservation efforts away from M. boolii itself—rather, it suggests that this approach might be too narrowly focused on M. boolii alone without considering the broader ecosystem-related factors that affect its survival."},{"i":"7a895def","c":"infer","d":"E","s":"Georgia Douglas Johnson wrote many plays in the 1920s and 1930s. At the time, professional theater companies rarely put on plays by Black women, so few of Johnson’s plays made it to the stage. Only a small number of her plays were published in her lifetime. But that doesn’t mean that Johnson never learned what other people thought of her plays. Johnson hosted weekly get-togethers for fellow Black writers and artists in her Washington, D.C., home. Attendees would read and discuss one another’s work, including Johnson’s own. These gatherings could therefore serve as ______ Which choice most logically completes the text?","o":["an occasion for professional theater companies to put on plays.","an opportunity for Johnson to get feedback on her plays.","a way for Johnson to learn about plays that were produced in other cities.","subject matter for future plays by Johnson."],"a":1,"r":"Choice B is the best answer. The passage tells us that attendees at Johnson’s get-togethers \"would read and discuss one another’s work.\" This suggests that the gatherings could provide an opportunity for Johnson to get feedback on her plays. Notice how the text foreshadows this conclusion by the mention of Johnson learning \"what other people thought of her plays.\" Choice A is incorrect. The passage doesn’t mention theater companies attending the get-togethers, so there is no basis for this inference. Choice C is incorrect. The passage doesn’t mention learning about plays from other cities, so there is no basis for this inference. Choice D is incorrect. The passage doesn’t mention Johnson using the get-togethers as inspiration for future plays, so there is no basis for this inference."},{"i":"dc87adf4","c":"claim","d":"H","s":"Barchester Towers is an 1857 novel by Anthony Trollope. In the novel, Trollope’s portrayal of Dr. Proudie underscores the character’s exaggerated sense of his own abilities: ______ Which quotation from Barchester Towers most effectively illustrates the claim?","o":["“It must not…be taken as proved that Dr. Proudie was a man of great mental powers, or even of much capacity for business, for such qualities had not been required in him.”","“[Dr. Proudie] was comparatively young, and had, as he fondly flattered himself, been selected as possessing such gifts, natural and acquired, as must be sure to recommend him to a yet higher notice.”","“[Dr. Proudie’s] residence in the metropolis, rendered necessary by duties thus entrusted to him, his high connexions, and the peculiar talents and nature of the man, recommended him to persons in power.”","“[Dr. Proudie] was certainly possessed of sufficient tact to answer the purpose for which he was required without making himself troublesome.”"],"a":1,"r":"Choice B is the best answer. In this quotation, Dr. Proudie is described as \"fondly flatter[ing] himself\" that he has gifts that \"must be sure to recommend him to a yet higher notice.\" In other words, he expects his skills to push him to greater fame and success. This implies an exaggerated sense of his own abilities, which matches the claim we’re trying to support. Choice A is incorrect. This quotation doesn’t describe Proudie’s view of himself, nor does it paint him in an especially flattering light. Instead, by saying his mental powers and business skill are not \"proved,\" it implies that he is actually dim-witted and bad at business. Choice C is incorrect. This choice describes Proudie’s closeness to power and importance, but it doesn’t show what Proudie thinks of himself. Proudie is not describing himself or his abilities here. The narrator is. Choice D is incorrect. While this quotation offers Proudie very mild praise, it doesn’t show what Proudie thinks of himself or his own abilities, which is what the claim focuses on."},{"i":"0198240a","c":"claim","d":"H","s":"Under normal atmospheric pressure at Earth’s surface, water molecules form a tetrahedral network stabilized by hydrogen bonds between adjacent molecules. Extreme high pressure, such as can be found in deep ocean waters, destabilizes these bonds and compresses water’s structure, allowing water molecules within organisms to permeate proteins and impede crucial biological functions; yet deep-sea organisms known as piezophiles have adapted to extreme pressure. Studies have found a positive correlation between the depths that various piezophiles inhabit and concentrations of a compound called trimethylamine N-oxide (TMAO) in their muscle tissues, which has led a team of researchers to hypothesize that TMAO reduces water’s compressibility.\n\nWhich finding, if true, would most directly support the researchers’ hypothesis?","o":["Water molecules are found to be impervious to TMAO even when the water molecules’ tetrahedral configuration has been distorted by high pressure.","Examination of TMAO’s molecular structure shows that TMAO molecules retain their shape even as pressure increases.","A positive correlation is found between concentrations of TMAO and the rate at which water’s molecular structure compresses as pressure increases.","Analysis of water’s molecular structure under high pressure reveals that hydrogen bonds are more stable when TMAO is present than when it is not."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would support the researchers’ hypothesis that TMAO reduces water’s compressibility. The text explains that at great depths in the ocean, extreme pressure compresses the molecular structure of water by destabilizing the hydrogen bonds between adjacent molecules, thereby allowing water to penetrate proteins and harm the associated organisms. However, deep-sea organisms called piezophiles have adapted to live at these depths and previous studies show a positive correlation between the depth at which a piezophile species lives and the species’ level of the compound TMAO. Because this hypothesis links TMAO levels with reduced compressibility of water’s tetrahedral molecular structure, a finding that TMAO helps maintain the hydrogen bonds between water molecules under high pressure would strongly support that hypothesis. Choice A is incorrect. Although the researchers’ hypothesis suggests a relationship between TMAO and water molecules’ tetrahedral molecular structure, that relationship involves TMAO helping maintain water’s tetrahedral molecular structure under high pressure; as presented in the text, the hypothesis doesn’t contend that water molecules are impervious to, or incapable of being penetrated by, TMAO. Choice B is incorrect because the text discusses how the molecular structure of water, not TMAO, is compressed under extreme pressure and never addresses how TMAO might be affected by such pressure. Choice C is incorrect because the researchers’ hypothesis holds that water under extreme pressure is more resistant, not less, to being compressed when TMAO concentrations are higher. Moreover, the positive correlation mentioned in the text is between TMAO concentrations and the depths at which piezophiles live, not between concentrations of TMAO and the rate at which water’s molecular structure compresses as pressure increases."},{"i":"5c73f0cc","c":"graph","d":"E","s":"","o":["75%.","10%.","45%.","20%."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the graph to complete the statement. The graph shows test results for two new battery recycling processes used with two types of lithium-ion batteries, type A and type B. According to the graph, recycling process 2 recovered the highest percentage of lithium in the tests: recovering about 75% from lithium-ion battery type B. Choice B is incorrect because, according to the graph, the highest percentage of lithium recovered in the tests was 75%, not 10%. In fact, none of the tests recovered exactly 10% of lithium from a recycling process. Choice C is incorrect because, according to the graph, the highest percentage of lithium recovered in the tests was 75%, not 45%. In fact, none of the tests recovered exactly 45% of lithium from a recycling process. Choice D is incorrect because, according to the graph, the highest percentage of lithium recovered in the tests was 75%, not 20%. In fact, none of the tests recovered exactly 20% of lithium from a recycling process."},{"i":"b074cc05","c":"graph","d":"M","s":"","o":["higher than the number of jobs in technical consulting services, and in 2019 was about the same as the number of jobs in engineering services.","about the same as the number of jobs in engineering services, and in 2019 was about the same as the number of jobs in technical consulting services.","lower than the number of jobs in engineering services, but in 2019 was higher than the number of jobs in engineering services.","about the same as the number of jobs in technical consulting services, but in 2019 was lower than the number of jobs in technical consulting services."],"a":1,"r":"Choice B is the best answer because it uses data from the graph to effectively complete the statement regarding what the student notices about the number of jobs in computer services in 2010. The graph shows that in 2010, the number of computer services jobs was approximately 6,000, which is the same approximate number of jobs in engineering services. Additionally, the graph shows that in 2019, the number of jobs in technical consulting services and the number of jobs in computer services were about the same, at approximately 5,000. Choice A is incorrect. While the graph shows that in 2010 the number of computer services jobs (about 6,000) was higher than the number of technical consulting services jobs (about 4,000), in 2019 the number of computer services jobs (about 5,000) was not about the same as the number of engineering services jobs (about 6,000). Choice C is incorrect because according to the graph, the number of jobs in computer services was lower than the number of jobs in engineering services in 2019, not 2010. Additionally, the graph shows that in 2019, the number of computer services jobs (about 5,000) was not higher than the number of jobs in engineering services (about 6,000). Choice D is incorrect because the graph shows that the number of computer services jobs was about the same as the number of technical consulting services jobs in 2019, not 2010. This also means the number of computer services jobs could not have been lower than the technical consulting services jobs in 2019 if they were about the same."},{"i":"9f737b2a","c":"fss","d":"M","s":"In Death Valley National Park’s Racetrack Playa, a flat, dry lakebed, are 162 rocks—some weighing less than a pound but others almost 700 pounds—that move periodically from place to place, seemingly of their own volition. Racetrack-like trails in the ______ mysterious migration.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["playas sediment mark the rock’s","playa’s sediment mark the rocks","playa’s sediment mark the rocks’","playas’ sediment mark the rocks’"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of plural and possessive nouns. The singular possessive noun “playa’s” and the plural possessive noun “rocks’” correctly indicate that the sediment is that of one playa (the Racetrack Playa) and that there are multiple rocks that have mysteriously migrated across the sediment. Choice A is incorrect because the context requires the singular possessive noun “playa’s” and the plural possessive noun “rocks’,” not the plural noun “playas” and the singular possessive noun “rock’s.” Choice B is incorrect because the context requires the plural possessive noun “rocks’,” not the plural noun “rocks.” Choice D is incorrect because the context requires the singular possessive noun “playa’s,” not the plural possessive noun “playas’.”"},{"i":"175df826","c":"fss","d":"E","s":"In the 2011 documentary The Barber of Birmingham, civil rights activist James Armstrong recounts how his barbershop in Birmingham, Alabama, ______ as a political hub for members of the Black community during the 1950s.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["serving","having served","served","to serve"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. Relative clauses, such as the one beginning with \"how,\" require a finite (tensed) verb, a verb that can function as the main verb of a clause. This choice correctly supplies the clause with the finite past tense verb \"served.\" Choice A is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"serving\" doesn’t supply the clause with a finite verb. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having served\" doesn’t supply the clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to serve\" doesn’t supply the clause with a finite verb."},{"i":"0ff8477b","c":"fss","d":"E","s":"Food and the sensation of taste are central to Monique Truong’s novels. In The Book of Salt, for example, the exiled character of Bình connects to his native Saigon through the food he prepares, while in Bitter in the Mouth, the character of Linda ______ a form of synesthesia whereby the words she hears evoke tastes.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["experienced","had experienced","experiences","will be experiencing"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the present tense verb “experiences” is consistent with the other present tense verbs (e.g., “connects” and “prepares”) used to describe the events in Truong’s novels. Furthermore, it’s conventional to use the present tense when discussing a literary work. Choice A is incorrect because the past tense verb “experienced” isn’t consistent with the other present tense verbs used to describe the events in Truong’s novels. Choice B is incorrect because the past perfect tense verb “had experienced” isn’t consistent with the other present tense verbs used to describe the events in Truong’s novels. Choice D is incorrect because the future progressive tense verb “will be experiencing” isn’t consistent with the other present tense verbs used to describe the events in Truong’s novels."},{"i":"3ed5ebb4","c":"bound","d":"M","s":"In her analysis of Edith Wharton’s The House of Mirth (1905), scholar Candace Waid observes that the novel depicts the upper classes of New York society as “consumed by the appetite of a soulless ______ an apt assessment given that The House of Mirth is set during the Gilded Age, a period marked by rapid industrialization, economic greed, and widening wealth disparities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["materialism”; and","materialism” and","materialism,”","materialism”"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation between a main clause and a supplementary noun phrase. This choice correctly uses a comma to mark the boundary between the main clause (“scholar…materialism”) and the supplementary noun phrase (“an apt assessment”) that describes Waid’s observation about how The House of Mirth depicts the upper classes of New York society. Choice A is incorrect because a semicolon and the conjunction “and” can’t be used in this way to mark the boundary between a main clause and a supplementary noun phrase. Choice B is incorrect. Joining the main clause (“scholar…materialism”) and the following noun phrase with the conjunction “and” results in a confusing and illogical sentence that suggests that the novel depicts the upper classes of New York society as “an apt assessment,” which doesn’t make sense in this context. Choice D is incorrect because it fails to mark the boundary between the main clause and the supplementary noun phrase with appropriate punctuation."},{"i":"ad046778","c":"bound","d":"M","s":"To humans, it does not appear that the golden orb-weaver spider uses camouflage to capture its ______ the brightly colored arachnid seems to wait conspicuously in the center of its large circular web for insects to approach. Researcher Po Peng of the University of Melbourne has explained that the spider’s distinctive coloration may in fact be part of its appeal.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["prey, rather,","prey rather,","prey, rather;","prey; rather,"],"a":3,"r":"Choice D is the best answer. The convention being tested is the coordination of main clauses within a sentence. The semicolon is correctly used to join the first main clause (“To humans…prey”) and the second main clause (“rather…approach”). Further, the comma after the adverb “rather” is correctly used to separate the adverb from the main clause (“the brightly…approach”) it modifies, logically indicating that the information in this clause (how the spider’s behavior appears to humans) is contrary to the information in the previous clause (how the spider’s behavior does not appear to humans). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice B is incorrect because it results in a run-on sentence. The two main clauses are fused without appropriate punctuation and/or a conjunction. Choice C is incorrect. Placing the comma between the first main clause “To humans…prey” and the adverb “rather” illogically indicates that the information in the first main clause is contrary to what came before, which doesn’t make sense in this context."},{"i":"eaded344","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The painter Frida Kahlo is one of the most influential artists of the twentieth century. She was born in Coyoacán, Mexico, in 1907. She is best known for her vivid and richly symbolic self-portraits. The Two Fridas (1939) features two versions of Kahlo sitting together. One version wears a European-style dress and the other a traditional Tehuana dress. The student wants to introduce Kahlo to an audience unfamiliar with the artist.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Known for being vivid and richly symbolic, Frida Kahlo’s self-portraits include The Two Fridas (1939).","The 1939 painting The Two Fridas is one example of a self-portrait by Frida Kahlo.","One painting by Frida Kahlo features two versions of herself, with one version wearing a European-style dress and the other a traditional Tehuana dress.","One of the most influential artists of the twentieth century, Mexican painter Frida Kahlo is best known for her self-portraits, which are vivid and richly symbolic."],"a":3,"r":"Choice D is the best answer. By identifying Kahlo as an influential artist from Mexico, and by describing the work she’s best known for, this choice provides the background information necessary to introduce Kahlo to an unfamiliar audience. Choice A is incorrect. This choice doesn’t effectively introduce Kahlo. It doesn’t include any background information about who Kahlo is or where she’s from. It simply identifies one of her paintings. Choice B is incorrect. This choice doesn’t effectively introduce Kahlo. It doesn’t include any background information about who Kahlo is or where she’s from. It simply identifies one of her paintings. Choice C is incorrect. This choice doesn’t effectively introduce Kahlo. It doesn’t include any background information about who Kahlo is or where she’s from. Instead, it describes one of her paintings in detail."},{"i":"ff3865b3","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: A wok is a cooking pan that originated in China during the Han dynasty (206 BCE–220 CE). The wok’s round, wide base helps to cook food evenly. The wok’s high, angled sides help to contain oil splatters. Grace Young is a cook and culinary historian. Her book The Breath of a Wok (2004) traces the history of the wok. The student wants to describe the wok’s shape.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Grace Young’s 2004 book, The Breath of a Wok, traces the history of the cooking pan.","Able to cook food evenly and contain oil splatters, the wok is the subject of Grace Young’s 2004 book.","A wok is a cooking pan with a round, wide base and high, angled sides.","The design of a wok, a type of cooking pan that originated in China during the Han dynasty, helps the pan cook food evenly and contain oil splatters."],"a":2,"r":"Choice C is the best answer. It summarizes the information that describes the wok’s shape from the second and third bullet points. Choice A is incorrect. This choice doesn’t describe the shape of a wok. Choice B is incorrect. This choice doesn’t describe the shape of a wok, just some of its features. Choice D is incorrect. This choice doesn’t describe the shape of a wok, only some of its benefits or functions."},{"i":"af89fa02","c":"trans","d":"M","s":"The Babylonian king Hammurabi achieved much during his forty-year reign. He conquered all of Mesopotamia and built Babylon into one of the most powerful cities of the ancient world. Today, ______ he is mainly remembered for a code of laws inscribed on a seven-foot-tall block of stone: the Code of Hammurabi.\n\nWhich choice completes the text with the most logical transition?","o":["therefore,","likewise,","however,","for instance,"],"a":2,"r":"Choice C is the best answer. “However” logically signals that the information in this sentence—that Hammurabi is mainly remembered for just a single achievement, the Code of Hammurabi—is contrary to what might be assumed from the previous information about Hammurabi’s many achievements. Choice A is incorrect because “therefore” illogically signals that the information in this sentence is a result of the previous information about Hammurabi’s many achievements. Instead, this sentence makes a point that is contrary to what might be assumed from the previous information. Choice B is incorrect because “likewise” illogically signals that the information in this sentence is similar to the previous information about Hammurabi’s many achievements. Instead, this sentence makes a point that is contrary to what might be assumed from the previous information. Choice D is incorrect because “for instance” illogically signals that this sentence exemplifies the previous information about Hammurabi’s many achievements. Instead, this sentence makes a point that is contrary to what might be assumed from the previous information."},{"i":"4f2710ab","c":"trans","d":"E","s":"Organisms have evolved a number of surprising adaptations to ensure their survival in adverse conditions. Tadpole shrimp (Triops longicaudatus) embryos, ______ can pause development for over ten years during extended periods of drought.\n\nWhich choice completes the text with the most logical transition?","o":["in contrast,","for example,","meanwhile,","consequently,"],"a":1,"r":"Choice B is the best answer. “For example” logically signals that the information in this sentence—that tadpole shrimp embryos can pause development during extended periods of drought—exemplifies the previous sentence’s claim that organisms have evolved surprising adaptations to survive in adverse conditions. Choice A is incorrect because “in contrast” illogically signals that the information in this sentence contrasts with the claim about organisms in the previous sentence. Instead, it exemplifies this claim. Choice C is incorrect because “meanwhile” illogically signals that the information in this sentence is separate from (while occurring simultaneously with) the claim about organisms in the previous sentence. Instead, it exemplifies this claim. Choice D is incorrect because “consequently” illogically signals that the information in this sentence is a consequence, or result, of the claim about organisms in the previous sentence. Instead, it exemplifies this claim."},{"i":"0c0d50e1","c":"trans","d":"M","s":"The Coastal Virginia Offshore Wind project is anticipated to generate 2.6 gigawatts of energy, enough to power almost one million homes. As its name indicates, the project—currently in development—consists of wind turbines located off the Virginia coast. ______ the project plan calls for 176 large turbines to be placed at a site 27 miles east of Virginia Beach.\n\nWhich choice completes the text with the most logical transition?","o":["To be exact,","In conclusion,","As a result,","In contrast,"],"a":0,"r":"Choice A is the best answer. \"To be exact\" logically signals that this sentence about the Coastal Virginia Offshore Wind project plan provides specific, precise details—number of turbines, location of site—elaborating on the more general information about the project in the previous sentence. Choice B is incorrect because \"in conclusion\" illogically signals that the information in this sentence about the Coastal Virginia Offshore Wind project plan concludes or summarizes the discussion of the project in the previous sentences. Instead, the sentence provides specific, precise details elaborating on the previous information. Choice C is incorrect because \"as a result\" illogically signals that the information in this sentence about the Coastal Virginia Offshore Wind project plan is caused by, or occurs as a result
