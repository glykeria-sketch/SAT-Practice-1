<script>
const D={"t":"Practicetest35","q":[{"i":"d4a8f7cb","c":"vocab","d":"E","s":"Dance choreographer Jawole Willa Jo Zollar aims to give people the opportunity to be ______ her creative process. For example, live performances of her dance HairStories, which debuted in 2001, featured videos of people across the United States talking about their hair and audience members sharing pictures of their interesting hairstyles.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["nervous about","completed by","delayed by","involved in"],"a":3,"r":"Choice D is the best answer. “Involved in” means “playing an active role in.” This fits the context clues describing how Zollar includes the audience in her shows by incorporating their stories and pictures. Choice A is incorrect. “Nervous” means “worried or anxious about.” Nothing in the text suggests that people would be nervous about Zollar’s creative process. Choice B is incorrect. “Completed by” means “made whole by.” It doesn’t make sense to say that Zollar’s shows would make her audience complete. Choice C is incorrect. “Delayed by” means “made late by.” Nothing in the text suggests that people would be delayed by Zollar’s creative process."},{"i":"a1ff8ce3","c":"vocab","d":"H","s":"As discussed by scholar Anna Mladentseva, many artworks produced in the mid-1990s to the early 2000s exclusively for exhibition on the internet, such as Sinae Kim’s Genesis (2001), have become inaccessible because viewing them requires the use of ______ software (most notably Adobe Flash, discontinued in 2021).\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["defunct","arcane","ubiquitous","extraneous"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of artworks that were produced for exhibition on the internet. In this context, \"defunct\" means no longer existing or functioning. According to the text, many artworks that were produced in the mid- 1990s to the early 2000s for exhibition on the internet have become inaccessible due to their reliance on certain software. As an example, the text cites Sinae Kim’s Genesis, which relied on software that was discontinued in 2021. This context supports the idea that the software is defunct. Choice B is incorrect because the text indicates that viewing artworks produced in the mid-1990s to the early 2000s for exhibition on the internet requires the use of software. Artists generally want their works to be seen by many people, so it wouldn’t make sense for creators of internet art to require the use of software that is \"arcane,\" or known or knowable to only a few people. Moreover, the text states that a prominent example of software used to view these artworks is Adobe Flash, which was discontinued in 2021, meaning it’s now defunct. Choice C is incorrect because \"ubiquitous\" would mean found everywhere, which wouldn’t make sense in this context. The text indicates that the reason why many artworks that were produced in the mid-1990s to the early 2000s for exhibition on the internet have become inaccessible has to do with the software required for viewing them. According to the text, one example of such software is Adobe Flash, which was discontinued in 2021, meaning it’s now defunct. Choice D is incorrect because nothing in the text suggests that the software used to view artworks produced in the mid-1990s to the early 2000s for exhibition on the internet is \"extraneous,\" or irrelevant. Instead, the text indicates that use of specific software is required to view certain artworks from this period and that the discontinuation of the software renders the works inaccessible."},{"i":"aaa3ee7c","c":"vocab","d":"H","s":"Critics have asserted that fine art and fashion rarely ______ in a world where artists create timeless works for exhibition and designers periodically produce new styles for the public to buy. Luiseño/Shoshone-Bannock beadwork artist and designer Jamie Okuma challenges this view: her work can be seen in the Metropolitan Museum of Art and purchased through her online boutique.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["prevail","succumb","diverge","intersect"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion about the relationship between fine art and fashion. As used in this context, “intersect” means to connect or overlap. The text indicates that Jamie Okuma challenges the position held by critics because her work can be seen at an art museum and can be bought by the public from her online boutique. The text also presents the critics’ view as being influenced by a perception that fine artists create works that are “timeless” and meant for exhibition, whereas fashion designers periodically produce new styles that are meant for purchase. This context suggests that the critics believe that fine art and fashion tend not to overlap—in other words, that they rarely intersect. Choice A is incorrect because it wouldn’t make sense in context to say that critics contend that fine art and fashion rarely “prevail,” or prove to be triumphant or widespread. The text indicates that Okuma is an example of an artist who demonstrates that it’s possible to make fine art that is also available to the public as fashion. Choice B is incorrect because it wouldn’t make sense in context to say that fine art and fashion rarely “succumb,” or surrender. The text establishes that unlike what critics believe, Okuma creates works that are in art museums and available for the public to purchase, suggesting that critics believe fine art and fashion rarely overlap, not that they rarely succumb. Choice C is incorrect because saying that critics believe that fine art and fashion rarely “diverge,” or disagree or move in different directions, wouldn’t make sense in context. The text presents Okuma’s work as both fine art and fashion, thereby undermining what the critics assert. This suggests that the critics believe that fine art and fashion rarely intersect rather than that the two rarely diverge."},{"i":"e1e89221","c":"vocab","d":"E","s":"The following text is from Frances Hodgson Burnett’s 1911 novel The Secret Garden. Mary, a young girl, is outside trying her new jump rope. The sun was shining and a little wind was blowing—not a rough wind, but one which came in delightful little gusts and brought a fresh scent of newly turned earth with it. She skipped round the fountain garden, and up one walk and down another.\n\nAs used in the text, what does the word “rough” most nearly mean?","o":["Harsh","Scratchy","Basic","Vague"],"a":0,"r":"Choice A is the best answer because as used in the text, \"rough\" most nearly means harsh, or forceful and unpleasant. The text describes Mary’s surroundings as she plays: the sun is out and there’s \"a little wind.\" To further illustrate the wind, the narrator contrasts the word \"rough\" with a description of the wind blowing in \"delightful little gusts,\" suggesting that the wind is not unpleasant or harsh at all. Choice B is incorrect. Although in some contexts \"rough\" objects, or objects with irregular surfaces, can sometimes be scratchy, rough doesn’t mean scratchy in this context. The text explains that the wind is not rough but rather gentle, \"delightful little gusts,\" which suggests that the use of \"rough\" here is referring to the degree of force of the wind. Choice C is incorrect because there’s nothing in the text to suggest that the wind wasn’t \"basic,\" or simple and uncomplicated. Instead, the text describes the wind as blowing not roughly or harshly but in \"delightful little gusts.\" Choice D is incorrect because the word \"vague\" means not clearly expressed or seen. Nothing in the text indicates that the wind was barely noticeable to Mary as she played outside, but rather the text states that it was delightful."},{"i":"e5ca7687","c":"purpose","d":"E","s":"Archaeologists studying the ancient city of Pompeii in Italy recently discovered a well-preserved food shop known as a thermopolium. The site contains food remains, artworks, and decorations. These items give researchers a better understanding of what daily life in Pompeii may have been like. For example, the archaeologists found a ceramic jar that they believe likely contained a meat and seafood stew.\n\nWhich choice best states the main purpose of the text?","o":["To compare ancient artworks with modern ones","To discuss the political system of Italy","To present a recent archaeological discovery","To describe a region’s climate"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text. The text states that archaeologists recently discovered a well-preserved food shop, or thermopolium, in Pompeii, Italy. The text then further describes the contents of the discovery and provides an example of what was found. Thus, the overall purpose of the text is to present a recent archaeological discovery. Choice A is incorrect. Although the text states that archaeologists found ancient artworks, it doesn’t compare these artworks to modern ones or to any other artworks. Choice B is incorrect. Although the archaeological discovery discussed in the text was made in Italy, the text doesn’t provide any information about politics or government in Italy. Choice D is incorrect because the text doesn’t discuss the climate where the archaeological discovery was made or in any other region."},{"i":"a086c2cb","c":"purpose","d":"E","s":"Built in the 1970s, Raccoon Mountain is a pumped-storage hydropower facility (a “water-battery”) located in the United States along the Tennessee River. When energy demand is low, excess power from the regional electric utility’s nuclear plants is used to pump water (from a lower reservoir filled from the Tennessee River) up a shaft to the summit lake, where the water is stored as gravitational potential energy. When energy demand peaks, the water drains down from the summit lake, spinning turbines and generating upward of 1,700 megawatts of power— enough to power one million homes for twenty hours.\n\nWhich choice best states the main purpose of the text?","o":["To point out the differences between two methods of energy generation","To explain the basics of how a specific energy technology works","To encourage regional electric utilities to build energy storage facilities","To discuss the benefits of a new energy technology"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text, which is to explain the basics of how a specific energy technology works. The text introduces Raccoon Mountain as a pumped-storage hydropower facility built in the 1970s and then explains how it operates: during periods of low demand, excess power pumps water up to a lake at the mountain’s summit, and when demand for energy peaks, the water flows back down, spinning turbines along the way to generate electricity. The text provides some additional details, like the name of the water source, but the overall focus is on explaining the basics of how pumped-storage hydropower works. Choice A is incorrect because the text focuses on one method of energy generation—pumped-water hydropower—and briefly mentions another type of energy generation (nuclear plants) only to identify it as a source of power for the pumping process. The text never makes any comparison between the two methods. Choice C is incorrect because the text simply gives a factual description of how Raccoon Mountain, a pumped- storage hydropower facility, operates; it never suggests that more energy storage facilities should be built, whether by regional utilities or by any other entity. Choice D is incorrect because the text doesn’t present pumped-storage hydropower as a new technology; it indicates that Raccoon Mountain was built in the 1970s, meaning that, rather than being new, this facility is approximately 50 years old."},{"i":"1b5d4e3e","c":"func","d":"E","s":"Were penguins always flightless? <u>Theresa Cole and her team argue that penguins could fly at some point, but that they lost that ability more than 60 million years ago as they adapted to marine life.<\/u> After examining various penguin fossils and genetic information, the researchers concluded that over time penguins developed underwater vision, blood oxygenation, and bone density better suited for swimming than flying. Thus, environmental conditions might have driven penguins to change from flyers to swimmers.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It defines a scientific term used in the sentence that follows.","It contradicts a description in the sentence that follows.","It provides an answer to the question in the previous sentence.","It notes that the question in the previous sentence has not been researched."],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The text begins with a question: have penguins always been unable to fly? The underlined sentence then presents an answer that has been offered by researchers, indicating that Theresa Cole and her team believe that penguins were once able to fly but lost that ability long ago as they began living in the sea. The text then describes the research that led to that answer. Thus, the function of the underlined sentence is to provide an answer to the question in the previous sentence. Choice A is incorrect because none of the terms used in the sentence that follows are defined in the underlined sentence; no definitions are given at all. Instead, the sentence presents Theresa Cole and her team’s answer to the earlier question about penguins’ ability to fly. Choice B is incorrect because there is no contradiction between the underlined sentence and the sentence that follows since both convey that at some point penguins underwent adaptations that limited their ability to fly and helped them swim and live in the sea. Instead of contradicting later information, the underlined sentence presents an answer to the earlier question about penguins’ ability to fly. Choice D is incorrect because the question in the previous sentence is about penguins’ ability to fly and the underlined sentence presents Theresa Cole and her team’s answer to that question based on their research into penguin flight, which is described in the rest of the text."},{"i":"066a3295","c":"func","d":"E","s":"Researchers have found a nearly 164,000-year-old molar from a member of the archaic human species known as Denisovans in a cave in Laos, suggesting that Denisovans lived in a wider range of environments than indicated by earlier evidence. <u>Before the discovery, Denisovans were thought to have lived only at high altitudes in relatively cold climates in what are now Russia and China,<\/u> but the discovery of the tooth in Laos suggests that they may have lived at low altitudes in relatively warm climates in Southeast Asia as well.\n\nWhich choice best states the function of the underlined portion in the text as a whole?","o":["It dismisses as untrue the research presented in the previous sentence.","It defines a term used in the description that follows in the rest of the sentence.","It emphasizes the main goal of the research introduced in the previous sentence.","It provides context that clarifies the significance of the information that follows in the rest of the sentence."],"a":3,"r":"Choice D is the best answer. The text describes how a new discovery expands our understanding of Denisovans. The underlined portion describes what we used to believe about Denisovans, which helps the reader understand the significance of the discovery of the molar: it suggests that they lived in more places than we’d previously thought. Choice A is incorrect. The underlined portion doesn’t do this. Instead, it explains what we used to believe about Denisovans before the discovery —it doesn’t dismiss the new discovery as false. Choice B is incorrect. The underlined portion doesn’t do this. No term is defined here. Choice C is incorrect. The underlined portion doesn’t do this. The text never tells us what the “goal” of the research was, just what its discovery was."},{"i":"c68ceeff","c":"cross","d":"E","s":"Text 1 Today the starchy root cassava is found in many dishes across West Africa, but its rise to popularity was slow. Portuguese traders brought cassava from Brazil to the West African coast in the 1500s. But at this time, people living in the capitals further inland had little contact with coastal communities. Thus, cassava remained relatively unknown to most of the region’s inhabitants until the 1800s.\n\nText 2 Cassava’s slow adoption into the diet of West Africans is mainly due to the nature of the crop itself. If not cooked properly, cassava can be toxic. Knowledge of how to properly prepare cassava needed to spread before the food could grow in popularity. The arrival of formerly enslaved people from Brazil in the 1800s, who brought their knowledge of cassava and its preparation with them, thus directly fueled the spread of this crop.\n\nBased on the texts, the author of\n\nText 1 and the author of\n\nText 2 would most likely agree with which statement?","o":["Cassava did not become a significant crop in West Africa until long after it was first introduced.","Several of the most commonly grown crops in West Africa are originally from Brazil.","The climate of the West African coast in the 1500s prevented cassava’s spread in the region.","The most commonly used methods to cook cassava today date to the 1500s."],"a":0,"r":"Choice A is the best answer. Text 1 states that cassava’s “rise to popularity was slow” in West Africa. Text 2 also describes cassava’s “slow adoption into the diet of West Africans.” While the two texts identify different causes for this slow adoption, both agree that cassava took a long time to catch on. Choice B is incorrect. This isn’t something that either text claims. Cassava is the only crop discussed in the passages, so we have no basis to draw conclusions about what the authors might say about “several” crops. Choice C is incorrect. This isn’t something that either text claims. Neither text mentions the “climate of the West African coast,” so we have no evidence that either author would agree with this. Choice D is incorrect. This isn’t something that either text claims. The 1500s were when cassava was brought to West Africa, but neither text describes how cassava is cooked, nor do they make any claims about when cooking methods were developed."},{"i":"602b47c7","c":"main","d":"M","s":"Biologists have predicted that birds’ feather structures vary with habitat temperature, but this hadn’t been tested in mountain environments. Ornithologist Sahas Barve studied feathers from 249 songbird species inhabiting different elevations—and thus experiencing different temperatures—in the Himalaya Mountains. He found that feathers of high-elevation species not only have a greater proportion of warming downy sections to flat and smooth sections than do feathers of low-elevation species, but high-elevation species’ feathers also tend to be longer, providing a thicker layer of insulation.\n\nWhich choice best states the main idea of the text?","o":["Barve’s investigation shows that some species of Himalayan songbirds have evolved feathers that better regulate body temperature than do the feathers of other species, contradicting previous predictions.","Barve found an association between habitat temperature and feather structure among Himalayan songbirds, lending new support to a general prediction.","Barve discovered that songbirds have adapted to their environment by growing feathers without flat and smooth sections, complicating an earlier hypothesis.","The results of Barve’s study suggest that the ability of birds to withstand cold temperatures is determined more strongly by feather length than feather structure, challenging an established belief."],"a":1,"r":"Choice B is the best answer. The text describes how Barve found an association between habitat temperature and feather structure among Himalayan songbirds, which supports the general prediction that birds’ feather structures vary with habitat temperature. Choice A is incorrect. Barve’s study isn’t said to contradict previous predictions. In fact, the study supports the prediction described in the first sentence, which is that birds’ feather structures vary with habitat temperature. Choice C is incorrect. Barve’s study isn’t said to “complicate an earlier hypothesis.” In fact, the study supports the earlier prediction described in the first sentence, which is that birds’ feather structures vary with habitat temperature. Choice D is incorrect. The text doesn’t compare the importance of feather length and feather structure, and it doesn’t say that Barve’s study challenges any established beliefs. In fact, the study supports the prediction described in the first sentence, which is that birds’ feather structures vary with habitat temperature."},{"i":"e80ba20d","c":"main","d":"H","s":"Philosophers note that many people have an intuitive sense that while we ought not to lie, there may be circumstances in which lying is permissible. If this intuition is correct and we lack an inviolable duty to speak truthfully, what grounds opposition to lying in the first place? Japa Pallikkathayil has advanced one answer by appealing to a duty to respect others’ agential interests: the possession of false beliefs constrains agency, and thus we ought not to impede the formation of true beliefs unless doing so prevents a greater constraint on someone’s agency or an otherwise impermissible end.\n\nWhich choice best states the main idea of the text?","o":["One potential means of justifying opposition to lying is Pallikkathayil’s argument that we have an obligation to respect other people’s agency that entails a commitment to truthfulness except in certain circumstances.","Many people have an intuitive sense that lying is permissible in some circumstances but lack a principled way to identify those circumstances, and Pallikkathayil’s argument may provide a means of resolving that problem.","Pallikkathayil’s argument suggests that if we have a duty to respect other people’s agential interests and if possession of false beliefs constrains agency, then we have an inviolable duty to speak truthfully.","Pallikkathayil’s argument shows that if our intuition that circumstances may make lying permissible is correct, then it is unclear whether there are any grounds for an opposition to lying in the first place."],"a":0,"r":"Choice A is the best answer because it most accurately states the main idea of the text. The text begins by noting a common intuition that lying might sometimes be permissible, which raises the question of what is the reason for being against lying. The text then presents Pallikkathayil’s answer to this question: we have a duty to respect others’ agential interests (that is, we have an obligation to allow people to exercise their free will in order to best serve their own ends), false beliefs constrain agency (the implication here being that people who are deceived about what is true are impeded in acting in their own best interests), and so we should not hinder the formation of true beliefs (we should not deliberately deceive a person) unless doing so prevents a greater limitation on someone’s agency or prevents some otherwise impermissible end (for example, it might be morally permissible to lie to someone in the rare circumstance where a false belief would lead a person to act in their own best interest, and where they would not do so if they knew the truth). Thus, the main idea of the text is that Pallikkathayil offers a potential justification for opposing lying based on respecting agency, while still allowing for exceptions in specific circumstances. Choice B is incorrect because the text doesn’t focus on people’s lack of a principled way to identify circumstances where lying is permissible or indicate that Pallikkathayil’s argument resolves this specific problem. Rather, the text presents Pallikkathayil’s argument that lies limit agency but may be permitted in very specific situations (to prevent a greater limitation on someone’s agency or an otherwise unacceptable outcome) as one of a number of possible arguments about why lies are undesirable but sometimes permissible. Choice C is incorrect because it directly contradicts the text. Pallikkathayil’s argument, as described in the text, wouldn’t lead to an \"inviolable duty to speak truthfully.\" On the contrary, the text explicitly states that Pallikkathayil’s position is that interfering with people developing accurate beliefs is wrong, except when such interference prevents either a more significant limitation on someone’s agency or an outcome that would be unacceptable for other reasons. This indicates that Pallikkathayil’s argument allows for some exceptions to the duty to speak truthfully, making it not inviolable. Choice D is incorrect because Pallikkathayil’s argument doesn’t suggest that if it is permissible to lie in at least some circumstances, then it is unclear whether there are good reasons for opposing lying in any circumstances. Instead, the text presents Pallikkathayil as offering a specific ground for opposing lying (respecting others’ ability to act in their own best interests) while qualifying that assertion by presenting a situation in which lying might sometimes be morally permissible."},{"i":"350e2336","c":"infer","d":"M","s":"The Haitian Declaration of Independence was issued in 1804, bringing to an end the revolution against colonial France that began in 1791. Written in French, which was not the first language of most Haitians but which was used throughout Europe as the language of international diplomacy, the declaration notes that Haiti will not bring rebellion to other Caribbean nations, promises to respect the sovereignty of its neighbors—widely understood as a reassurance to the United States—and sets up Haiti as an example for future struggles against colonizers (an implicit reference to the many colonies then found in the Americas). So even though the declaration is explicitly addressed to the Haitian people, it’s reasonable to conclude that ______ Which choice most logically completes the text?","o":["aspects of the declaration were modeled on similar documents from other countries.","the French government may have been surprised by the declaration.","many Haitian people opposed the revolution and the declaration.","the declaration actually had several intended audiences."],"a":3,"r":"Choice D is the best answer. The passage tells us that the declaration was written in a language important to European diplomacy but not most Haitians, states that the declaration included \"a reassurance to the United States,\" and made implicit references to colonies in the Americas. Because of the messages within the declaration that were largely irrelevant to the Haitian people, we can assume that the Haitian people were not the only audience for this document. Choice A is incorrect. There’s no mention in the passage of similar documents in other countries, so there’s no basis for this inference. Choice B is incorrect. Although there’s an implicit reference to European governments when the passage discusses how the declaration was written in French, \"which was used throughout Europe as the language of international diplomacy,\" there is no discussion of the French government’s response to the declaration. Therefore, there’s no basis for this inference. Choice C is incorrect. The passage doesn’t mention the popularity of the revolution and declaration among the Haitian people, so there’s no basis for this inference."},{"i":"75208874","c":"infer","d":"H","s":"The widespread use of social media enables linguists to study changes in language usage in real time. A notable recent example is the proliferation of the affix meng- among speakers of Bahasa Indonesia, the official language of Indonesia. Linguists observed meng- originate as an onomatopoetic tag that social-media users applied to images of cats they posted; over time, users increasingly applied it as a prefix to existing words (e.g., mengsedih affixes meng- to the word for sad) in text that they posted. From there, it has begun to move into spoken Bahasa Indonesia. Linguists have noted many similar examples of this phenomenon occurring in other languages, suggesting that social media ______ Which choice most logically completes the text?","o":["is more useful for studying informal language than for studying formal or official language.","appears to be exerting an exceptionally strong influence on the evolution of Bahasa Indonesia.","may give linguists a somewhat misleading sense of how languages are changing.","does not merely register changes in language usage but can facilitate such changes."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of linguists using social media to study changes in language usage in real time, providing the specific example of the affix meng- in Bahasa Indonesia. The text states that linguists first observed meng- being used as an onomatopoeic tag on social media, which then spread to being affixed to existing words in text posted on social media; from there, it has begun to move into spoken Bahasa Indonesia. As presented in the text, this progression from online usage to spoken language suggests that social media does more than just register or reflect changes in language—it can actively drive such changes. In the case of meng-, the text suggests, social media facilitated the movement of the affix from an online tag to part of spoken Bahasa Indonesia. Choice A is incorrect because the text doesn’t differentiate between social media’s usefulness for studying informal versus formal or official language; it merely notes that Bahasa Indonesia is an official language. Choice B is incorrect because while the example given in the text focuses on changes in Bahasa Indonesia, the text doesn’t provide any evidence that social media is exerting an exceptionally strong influence on the evolution of this particular language compared to others. In fact, the text states that \"linguists have noted many similar examples of this phenomenon occurring in other languages,\" suggesting that social media’s influence is evident across multiple languages and not unique to Bahasa Indonesia. Choice C is incorrect because the text never suggests that social media provides a somewhat misleading sense of how languages are changing. Rather, the text suggests that by allowing linguists to directly observe linguistic changes, social media offers a clear window into language evolution."},{"i":"194dd448","c":"claim","d":"M","s":"“John of God, the Water-Carrier” is a 1913 short story by María Cristina Mena. In the story, the narrator presents John as being a hard worker who is fully dedicated to his job as water carrier, or aguador: ______ Which quotation from “John of God, the Water-Carrier” most effectively illustrates the claim?","o":["“Very happy, he would jog home, the heavy silver pieces in his leather pockets making a discreet and dulcet ‘trink-trak’ between his jugs and his body.”","“He learned that the city aguador may not blow his whistle to halt the traffic while he gravely crosses the street, but must wait for the passing of many vehicles, some with horses and some outlandishly without.”","“From early morn to the fall of the afternoon he would go from fountain to fountain and from portal to portal, his lean body so accustomed to bending that he never thought of straightening it, his head bowed as if in prayer.”","“When his first jugs had worn out—the sweet-scented, porous red clay becomes perforated in time—he had buried them to their necks in the corner where he slept, and they were now his treasury.”"],"a":2,"r":"Choice C is the best answer because it most effectively illustrates the claim in the text that John is hard-working and dedicated to his job. In the quotation, John is portrayed as spending “early morn to the fall of the afternoon” working hard as a water carrier. John is also described as “so accustomed to bending” while doing his work “that he never thought of straightening” his body, instead remaining deeply focused on his work. These details portray John as a dedicated worker. Choice A is incorrect because this quotation portrays John as happy about heading home after being paid. It doesn’t showcase John being hard at work. Choice B is incorrect because this quotation doesn’t pertain to John’s commitment to his work; it describes difficulties the traffic in the city causes John in the performance of his work. Choice D is incorrect because this quotation doesn’t pertain to John’s commitment to his work; it discusses what John does with his worn-out water jugs."},{"i":"ed586475","c":"claim","d":"M","s":"There Is Confusion is a 1924 novel by Jessie Redmon Fauset. In the novel, the narrator portrays the character Joanna as someone who admires ambition in other people to the exclusion of all other qualities: ______ Which quotation from There Is Confusion most effectively illustrates the claim?","o":["“Joanna was mightily interested in people who had a ‘purpose’ in life. Otherwise not at all.”","“Indeed from the very beginning Joanna showed her preference for her father.”","“Joanna was like her father not only so far as ambition was concerned but also in her willingness to work.”","“She had a good sense of logic, a strong power of concentration, and a remarkably retentive and visualizing memory.”"],"a":0,"r":"Choice A is the best answer because it most effectively presents a quotation from There Is Confusion that illustrates the claim that the narrator portrays Joanna as admiring the quality of ambition, or the determination to achieve something, and no other qualities in other people. By describing Joanna as not being interested in people unless they have \"a ‘purpose’ in life\"—that is, a goal they are determined to achieve—in which case she is very interested in them, the quotation reveals that Joanna cares only about others’ ambition. Choice B is incorrect because this quotation indicates only that Joanna has a preference for her father, without giving a reason for that preference; therefore, it doesn’t illustrate the claim that Joanna cares only about others’ ambition. Choice C is incorrect because this quotation doesn’t illustrate that Joanna greatly admires the quality of ambition in others; it refers to Joanna’s similarity to her father \"so far as ambition was concerned\" but doesn’t reveal how she (or her father) views that quality. Choice D is incorrect because this quotation describes qualities Joanna possesses—praising her logic, concentration, and memory—instead of Joanna’s interest in other people’s qualities."},{"i":"a0203977","c":"graph","d":"M","s":"","o":["in each year shown, the revenue from tourism by residents of those countries was greater than the revenue from international tourism.","Japan’s international tourism revenue was higher in 2016 than it was in 2018.","South Korea’s annual international tourism revenue decreased from 2016 to 2017.","in each year shown, Thailand had higher international tourism income than any of the other countries."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the text, providing an example that illustrates that the annual increases in international tourism revenue in 2017 and 2018 weren’t universal. The table shows the annual spending by international tourists (which indicates annual international tourism revenue) in 2016–2018 in four Asian countries. According to the table, annual spending by international tourists in South Korea was $21.0 billion in 2016 and then decreased to $17.2 billion in 2017. This decrease shows that not all of the countries included in the table saw increases in annual international tourism revenue in 2017. Choice A is incorrect because the table doesn’t provide any data regarding revenue from tourism by residents of those countries. Even if that data were provided, it wouldn’t be relevant to the claim that the trend of annual increases in international tourism revenue in 2017 and 2018 was not universal. Choice B is incorrect because the data in the table do not support the statement that Japan’s international tourism revenue was higher in 2016 than it was in 2018: the table indicates that Japan’s annual international tourism revenue was $33.5 billion in 2016, which is less than Japan’s annual international tourism revenue of $45.3 billion in 2018. Choice D is incorrect. Although the table does indicate that Thailand’s revenue from international tourism was higher than that of the other three Asian countries in 2016, 2017, and 2018, this information has no direct bearing on the text’s claim that not all the Asian countries represented in the table saw an increase in revenue from international tourism."},{"i":"0b634641","c":"graph","d":"E","s":"","o":["There were about as many drawings with an example of an insect as there were with an example of a bird.","The fewest number of drawings contained an example of a bird.","More of the drawings had an example of an insect than an example of a mammal.","More of the drawings had an example of a mammal than either an example of a bird or an example of an insect."],"a":3,"r":"Choice D is the best answer because it accurately describes data from the graph that support the researchers’ conclusion that children may be more aware of mammals than of other animals. The graph presents the percent of drawings by schoolchildren that contained an example of an animal from a certain group (mammals, birds, or insects). The graph shows that approximately 80% of the drawings contained an example of a mammal, while only approximately 69% contained an example of a bird and only about 55% contained an example of an insect. The fact that mammals were included in more drawings than either birds or insects were supports the idea that children may be particularly aware of mammals in their environments. Choice A is incorrect because the graph shows that there were not \"about as many\" drawings with insects as there were drawings with birds (approximately 69% of the drawings included an example of a bird, while only about 55% included an example of an insect). Further, comparing only the numbers for birds and insects wouldn’t indicate anything about the schoolchildren’s awareness of mammals. Choice B is incorrect because the graph shows that insects, not birds, were the group that appeared in the fewest number of drawings (approximately 69% of the drawings included an example of a bird but only about 55% included an example of an insect). Further, stating that examples from one nonmammal group appeared in the fewest number of drawings would provide no evidence about the schoolchildren’s awareness of mammals. Choice C is incorrect because the graph shows that more drawings had an example of a mammal than an example of an insect, not the other way around (approximately 80% of the drawings included an example of a mammal, while only about 55% included an example of an insect). Further, examples of a nonmammal group appearing in more drawings than examples of mammals did would actually weaken the claim that schoolchildren may be more aware of mammals than of other animals."},{"i":"d222f7d9","c":"fss","d":"H","s":"Helical ______ widely understood to confer stability and efficiency in the locomotion of a variety of microscopic organisms—including bacteria, eukaryotic algae, and ciliates—bestows similar advantages, albeit via different propulsive modes, to larger oceanic macroplanktons, such as salps.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["swimming, is","swimming is","swimming has been","swimming,"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after “swimming” pairs with the dash after “ciliates” to offset the supplementary element (“widely…ciliates”) that interrupts the main clause of the sentence. Choice A is incorrect. Adding the verb “is” here creates an ungrammatical sentence structure with two main verbs (“is” and “bestows”) without appropriate punctuation and/or conjunction. Choice B is incorrect because it fails to offset the supplementary element with appropriate punctuation. Furthermore, adding the verb “is” here creates an ungrammatical sentence that has two finite verbs (“is” and “bestows”) without appropriate punctuation and/or conjunction. Choice C is incorrect because it fails to offset the supplementary element with appropriate punctuation. Furthermore, adding the verb “has been” here creates an ungrammatical sentence that has two finite verbs (“has been” and “bestows”) without appropriate punctuation and/or conjunction."},{"i":"329255db","c":"fss","d":"H","s":"Bengali author Toru Dutt’s A Sheaf Gleaned in French Fields (1876), a volume of English translations of French poems, ______ scholars’ understanding of the transnational and multilingual contexts in which Dutt lived and worked.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has enhanced","are enhancing","have enhanced","enhance"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb “has enhanced” agrees in number with the singular subject “A Sheaf Gleaned in French Fields,” which is the title of a book of poems. Choice B is incorrect because the plural verb “are enhancing” doesn’t agree in number with the singular subject “A Sheaf Gleaned in French Fields.” Choice C is incorrect because the plural verb “have enhanced” doesn’t agree in number with the singular subject “A Sheaf Gleaned in French Fields.” Choice D is incorrect because the plural verb “enhance” doesn’t agree in number with the singular subject “A Sheaf Gleaned in French Fields.”"},{"i":"576b2c70","c":"fss","d":"E","s":"A member of the Cherokee Nation, Mary Golda Ross is renowned for her contributions to NASA’s Planetary Flight Handbook, which ______ detailed mathematical guidance for missions to Mars and Venus.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["provided","having provided","to provide","providing"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of finite verbs in a relative clause. Relative clauses, such as the one beginning with “which,” require a finite verb, a verb that can function as the main verb of a clause. This choice correctly supplies the clause with the finite past tense verb “provided.” Choice B is incorrect because the non-finite participle “having provided” doesn’t supply the clause with a finite verb. Choice C is incorrect because the non-finite to-infinitive “to provide” doesn’t supply the clause with a finite verb. Choice D is incorrect because the non-finite participle “providing” doesn’t supply the clause with a finite verb."},{"i":"f45ae404","c":"bound","d":"H","s":"The city of Amsterdam partnered with consultants to develop Public Eye—an ethical AI-powered crowd-monitoring ______ video streamed from cameras in heavily touristed areas, the AI algorithm determines crowd sizes without, in the interest of protecting individuals’ privacy, retaining the footage.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["system—analyzing","system, analyzing","system. Analyzing","system analyzing"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"The city…system\") and another (\"Analyzing…footage\"). The participial phrase beginning with \"analyzing\" modifies the subject of the second sentence, \"the AI algorithm.\" Choice A is incorrect. Placing a dash before \"analyzing\" creates a confusing and ambiguous modifying element (\"analyzing...areas\") and a comma splice between \"areas\" and \"the AI algorithm.\" (A comma can’t be used in this way to mark the boundary between sentences.) Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice D is incorrect because it results in a run-on sentence. The sentences (\"The city…system\" and \"analyzing…footage\") are fused without punctuation and/or a conjunction."},{"i":"c49e946e","c":"bound","d":"H","s":"As the fourteenth US librarian of Congress, Carla Hayden has many responsibilities. These include overseeing the Library of Congress’s collections, which boast more than 162 million ______ the US Copyright Office, which registers copyright claims and advises Congress on copyright law; and appointing the US poet laureate.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["items managing","items, managing","items; managing","items. Managing"],"a":2,"r":"Choice C is the best answer. The convention being tested is the punctuation of elements in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after \"items\" is conventionally used to separate the first item (\"overseeing…items\") and the second item (\"managing…law\") in a list of Hayden’s responsibilities. Choice A is incorrect because it fails to use appropriate punctuation to separate the first item and the second item in the complex series. Choice B is incorrect because a comma after \"items\" doesn’t match the semicolon used later to separate the second and third items in the series (\"managing…law\" and \"and appointing the US poet laureate\"). Choice D is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with \"Managing.\""},{"i":"efa2be4f","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: The meter of a poem is the rhythmic structure or pattern of accents in its lines. Alliterative meter is structured by a pattern of repeated sounds. Quantitative meter is structured by a pattern of long and short syllables. The Old English poem Widsith uses an alliterative meter. The Sanskrit poem Meghadūta uses a quantitative meter. The student wants to emphasize a difference between the meters of the two poems.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The poem Widsith is written in Old English, but Meghadūta is written in Sanskrit.","Alliterative meter is a pattern of repeated sounds, but quantitative meter is a rhythmic structure or pattern of accents.","The Sanskrit poem Meghadūta uses a quantitative meter, while the meter of the Old English poem Widsith uses a pattern of long and short syllables.","The lines of the poem Meghadūta use a pattern of long and short syllables, whereas Widsith’s lines use a pattern of repeated sounds."],"a":3,"r":"Choice D is the best answer. Noting that Meghadūta uses a pattern of long and short syllables in its lines (quantitative meter) and Widsith uses a pattern of repeated sounds in its lines (alliterative meter), and signaling a contrast with “whereas,” the sentence emphasizes a difference between the meters of the two poems. Choice A is incorrect. The sentence indicates that the two poems were written in different languages; it doesn’t emphasize a difference between the meters of the two poems. Choice B is incorrect. The sentence mentions the meters of the two poems but misrepresents information from the notes; the overall definition of a meter (the rhythmic structure or pattern of accents in a poem’s lines) applies to both alliterative and quantitative meters, not just quantitative. Choice C is incorrect. While the sentence emphasizes a difference between the meters of the two poems, it misrepresents information from the notes; Widsith uses an alliterative meter, which is structured by a pattern of repeated sounds, not a pattern of long and short syllables."},{"i":"d6dec50e","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In 2019, Emily Shepard and colleagues in the UK and Germany studied the effect of wind on auks’ success in landing at cliffside nesting sites. They found as wind conditions intensified, the birds needed more attempts in order to make a successful landing. When the wind was still, almost 100% of landing attempts were successful. In a strong breeze, approximately 40% of attempts were successful. In near-gale conditions, only around 20% of attempts were successful. The student wants to summarize the study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["For a 2019 study, researchers from the UK and Germany collected data on auks’ attempts to land at cliffside nesting sites in different wind conditions.","Emily Shepard and her colleagues wanted to know the extent to which wind affected auks’ success in landing at cliffside nesting sites, so they conducted a study.","Knowing that auks often need multiple attempts to land at their cliffside nesting sites, Emily Shepard studied the birds’ success rate, which was only around 20% in some conditions.","Emily Shepard’s 2019 study of auks’ success in landing at cliffside nesting sites showed that as wind conditions intensified, the birds’ success rate decreased."],"a":3,"r":"Choice D is the best answer. The sentence effectively summarizes the study, noting who conducted it, when it was conducted, and what its results showed: that auks’ landing success rate decreased as wind conditions intensified. Choice A is incorrect. While the sentence presents the methodology of the study—that is, the approach taken by the researchers—it fails to summarize the study as a whole. Choice B is incorrect. While the sentence presents the aim, or goal, of the study, it fails to summarize the study as a whole. Choice C is incorrect. While the sentence indicates what Shepard studied, it fails to mention a key factor: the effect of wind. It thus fails to summarize the study as a whole."},{"i":"edf30612","c":"trans","d":"H","s":"In the late twentieth century, scholars directed much discussion toward issues of spatiality. Adherents to quantitative analytical approaches delineated space with the use of GIS spatial technologies; ______ cultural geographer Doreen Massey defined space as the product of “an ever- shifting social geometry of power and signification,” focusing instead on socio-political forces.\n\nWhich choice completes the text with the most logical transition?","o":["for example,","by contrast,","as such,","likewise,"],"a":1,"r":"Choice B is the best answer. \"By contrast\" logically signals that the information about how Massey defined space—by focusing on socio-political forces—contrasts with the information in the previous clause, which discusses quantitative analytical approaches and spatial technologies. Choice A is incorrect because \"for example\" illogically signals that the information that follows in the sentence exemplifies the quantitative analytical approaches to defining space described previously. Instead, the information about Massey’s socio-political focus presents a contrasting approach. Choice C is incorrect because \"as such\" illogically signals that the information that follows in the sentence is a direct result or logical consequence of the quantitative analytical approaches to defining space described previously. Instead, the information about Massey’s socio-political focus presents a contrasting approach. Choice D is incorrect because \"likewise\" illogically signals that the information that follows in the sentence is similar to the quantitative analytical approaches to defining space described previously. Instead, the information about Massey’s socio-political focus presents a contrasting approach."},{"i":"a7a944ed","c":"trans","d":"H","s":"In astrophysics, a ring of debris orbiting a larger object within the object’s Roche limit is expected to persist as a ring, whereas a ring of debris orbiting outside this limit would likely accrete into a satellite (e.g., a moon). Bruno Morgado and colleagues, ______ detected a dense ring of material orbiting the trans-Neptunian object Quaoar at a distance of 2,500 miles, well outside the calculated Roche limit of 1,100 miles, that has remained intact.\n\nWhich choice completes the text with the most logical transition?","o":["though,","for example,","fittingly,","likewise,"],"a":0,"r":"Choice A is the best answer. “Though” logically signals that the information in this sentence—that Morgado and colleagues detected a dense ring orbiting outside the Roche limit that remained intact—presents an exception to the previous sentence’s claim about debris orbiting outside an object’s Roche limit. Such debris would be expected to accrete into a satellite, not remain intact as a ring. Choice B is incorrect because “for example” illogically signals that the information about Morgado’s discovery exemplifies the previous sentence’s claim about debris orbiting outside an object’s Roche limit. Instead, the sentence presents an exception to the claim. Choice C is incorrect because “fittingly” illogically signals that the information about Morgado’s discovery aligns with the previous sentence’s claim about debris orbiting outside an object’s Roche limit. Instead, the sentence presents an exception to the claim. Choice D is incorrect because “likewise” illogically signals that the information about Morgado’s discovery is similar to the previous sentence’s claim about debris orbiting outside an object’s Roche limit. Instead, the sentence presents an exception to the claim."},{"i":"00e0170f","c":"trans","d":"H","s":"Magnetic levitation (maglev) trains are suspended above a track by powerful electromagnets, reducing friction and thus allowing for much faster speeds. Though maglev advocates in the US have long imagined these trains crisscrossing the country, their dream remains unrealized. ______ of the handful of maglev trains currently in operation, all are in Asia.\n\nWhich choice completes the text with the most logical transition?","o":["In fact,","To that end,","Nevertheless,","That said,"],"a":0,"r":"Choice A is the best answer. This sentence emphasizes just how far maglev advocates’ dreams are from coming true. “In fact” is a transition used to emphasize the truth of a statement that modifies the previous statement and therefore fits perfectly in this context. Choice B is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. Maglev advocates’ dream remaining unrealized would not cause there to be only a few maglev trains, all located in Asia. Choice C is incorrect. This choice uses a disagreement transition, which doesn’t make sense here. In fact, this sentence agrees with the previous sentence—both talk about how maglev trains are far from becoming common in the US. Choice D is incorrect. This choice uses a disagreement transition, which doesn’t make sense here. In fact, this sentence agrees with the previous sentence—both talk about how maglev trains are far from becoming common in the US."}],"img":{"a0203977":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEZBAMAAACHreuwAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA0wklEQVR42u1dd2AUxff/zO7dpZJ7dwlNhOwlgDRhE7qI
