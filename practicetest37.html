<script>
const D={"t":"Practicetest37","q":[{"i":"683f66c9","c":"vocab","d":"E","s":"Though not closely related, the hedgehog tenrecs of Madagascar share basic ______ true hedgehogs, including protective spines, pointed snouts, and small body size—traits the two groups of mammals independently developed in response to equivalent roles in their respective habitats.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["examples of","concerns about","indications of","similarities with"],"a":3,"r":"Choice D is the best answer because in context, sharing \"similarities with\" means having some resemblance to. The text establishes a comparison between two groups of mammals, stating that although they aren’t closely related, hedgehog tenrecs and true hedgehogs play similar roles in their habitats, a circumstance that has resulted in the independent development of some of the same physical traits. This context supports the idea that hedgehog tenrecs resemble, or share basic similarities with, true hedgehogs in some respects. Choice A is incorrect because the text doesn’t suggest that hedgehog tenrecs are \"examples of,\" or representative of, true hedgehogs. The text states that despite some shared physical traits, the two groups of mammals aren’t closely related; therefore, hedgehog tenrecs can’t be examples of true hedgehogs. Choice B is incorrect because in this context, \"concerns about\" would mean worries about or interests in. The text focuses on the various physical traits that hedgehog tenrecs and true hedgehogs share. There’s nothing in the text to suggest why hedgehog tenrecs would be worried about true hedgehogs, or why they would be interested in them. Choice C is incorrect because in this context, \"indications of\" would mean evidence of. By listing a set of traits that hedgehog tenrecs share with true hedgehogs, the text establishes a comparison between the two groups of mammals, and saying that the traits shared within one group of mammals provide evidence of another group of mammals wouldn’t be an effective way to establish the similarities between the two groups."},{"i":"e0656211","c":"vocab","d":"M","s":"In Nature Poem (2017), Kumeyaay poet Tommy Pico portrays his ______ the natural world by honoring the centrality of nature within his tribe’s traditional beliefs while simultaneously expressing his distaste for being in wilderness settings himself.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["responsiveness to","ambivalence toward","renunciation of","mastery over"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s description of how Pico feels about the natural world. In this context, to say that Pico portrays his “ambivalence toward” nature would mean that he portrays his mixed feelings about nature. The text explains that Pico “honors the centrality of nature” and also makes it clear that he doesn’t enjoy being in nature. This context suggests that Pico feels ambivalence toward nature. Choice A is incorrect because saying that Pico portrays his “responsiveness to” nature would mean that he portrays himself as quick to react to nature, which isn’t supported by the text. Instead, the text focuses on Pico’s mixed feelings toward nature, describing him as both honoring nature’s role in his tribe’s beliefs and expressing his personal dislike for being in nature. Choice C is incorrect because saying that Pico portrays his “renunciation of” nature would mean that he portrays himself as rejecting nature, which isn’t supported by the text. The text conveys that Pico demonstrates both positive and negative responses toward nature, not that he’s giving it up completely. Choice D is incorrect because saying that Pico portrays his “mastery over” nature would mean that he portrays himself as having control over nature, which isn’t supported by the text. The text focuses on Pico’s mixed feelings about nature; nothing in the text suggests that Pico feels mastery over nature."},{"i":"79fe7550","c":"vocab","d":"H","s":"Researcher Haesung Jung led a 2020 study showing that individual acts of kindness can ______ prosocial behavior across a larger group. Jung and her team found that bystanders who witness a helpful act become more likely to offer help to someone else, and in doing so, can inspire still others to act.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["require","remember","foster","discourage"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Jung and her team’s study of acts of kindness. In this context, “foster” means encourage or promote the development of. The text indicates that Jung and her team found that seeing a helpful (or prosocial) act makes a bystander more likely to help someone else, which can in turn inspire additional people to help others. That is, the team showed that single acts of kindness can foster additional prosocial acts across a group. Choice A is incorrect because nothing in the text suggests that Jung and her team found that single acts of kindness “require,” or depend on or make obligatory, broader prosocial (or helpful) behavior across a group. There’s no suggestion in the text that individual acts of kindness can only occur if other prosocial acts have already occurred, and the text indicates only that an act of kindness can inspire additional helpful acts, not that it necessarily will do so. Choice B is incorrect because the text focuses on a possible direct effect of individual acts of kindness, or single helpful actions, and it wouldn’t make sense to suggest that actions can “remember,” or hold a memory of, something. Choice D is incorrect because the text doesn’t indicate that Jung and her team found that single acts of kindness can “discourage,” or hinder, prosocial (or helpful) behavior across a group. On the contrary, the text states that Jung and her team found that seeing a helpful act makes a bystander more likely to help someone else, which can in turn inspire even more people to help others."},{"i":"f83f0aab","c":"vocab","d":"H","s":"Some scientists have suggested that mammals in the Mesozoic era were not a very ______ group, but paleontologist Zhe-Xi Luo’s research suggests that early mammals living in the shadow of dinosaurs weren’t all ground-dwelling insectivores. Fossils of various plant-eating mammals have been found in China, including species like Vilevolodon diplomylos, which Luo says could glide like a flying squirrel.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["predatory","obscure","diverse","localized"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the kinds of mammals alive during the Mesozoic era. As used in this context, “diverse” means to have a significant amount of variety. The text indicates that some scientists have suggested that Mesozoic mammals can’t be characterized in a certain way, then contrasts the view put forward by those scientists with Luo’s research, which shows that Mesozoic mammals “weren’t all ground-dwelling insectivores” and instead were “various.” This context suggests that some scientists have viewed Mesozoic mammals as being all alike, or not a very diverse group. Choice A is incorrect because it wouldn’t make sense to say that some scientists have suggested that Mesozoic mammals weren’t very “predatory,” or that they didn’t prey on other animals, since the text establishes a contrast between what some scientists have suggested and Luo’s research showing that Mesozoic mammals “weren’t all ground-dwelling insectivores.” This context suggests that some scientists have regarded Mesozoic mammals as all being insectivores, or animals that prey on insects, not that some scientists have suggested that Mesozoic mammals didn’t prey on other animals. Choice B is incorrect because it wouldn’t make sense to say that some scientists have suggested that Mesozoic mammals weren’t very “obscure,” or concealed or not well known, since the text establishes a contrast between what some scientists have suggested and Luo’s research showing that Mesozoic mammals were a varied group. There’s no contrast between saying that the mammals weren’t concealed or well known and the mammals being varied. Choice D is incorrect because it wouldn’t make sense to say that some scientists have suggested that Mesozoic mammals weren’t very “localized,” or confined to a particular area, since the text establishes a contrast between what some scientists have suggested and Luo’s research showing that Mesozoic mammals were a varied group. There’s no contrast between saying that the mammals weren’t localized and the mammals being varied. Although the text mentions mammal fossils found in China, nothing in the discussion of Luo’s research addresses the limits of Mesozoic mammal habitats."},{"i":"7d8224f9","c":"purpose","d":"M","s":"In 1154, Muhammad al-Idrisi completed a collection of maps of the lands known to medieval Arabic and European scholars. This collection was titled Al-Kitāb al-Rujārī (The Book of Roger), after the Norman king Roger II who hired him to create it. To create the collection, al-Idrisi consulted Arabic and Greek maps and interviewed travelers about the lands they visited. He included these travelers’ stories alongside the map illustrations.\n\nWhich choice best states the main purpose of the text?","o":["To discuss the benefits of studying mapmaking","To explain how travelers created maps","To describe a collection of medieval maps and how it was created","To compare medieval Arabic and Greek mapmaking techniques"],"a":2,"r":"Choice C is the best answer because it most accurately states the main purpose of the text, which is to describe a collection of medieval maps and how it was created. The text begins by mentioning Muhammad al-Idrisi’s collection of maps of lands known to medieval Arabic and European scholars. It then states that the Norman king Roger II hired al-Idrisi to create the collection and details al-Idrisi’s methods of creation: consulting Arabic and Greek maps and interviewing travelers. In short, the text presents a collection of medieval maps and then goes on to describe how that collection came to be. Choice A is incorrect because the text describes a collection of maps and the process of creating that collection but does not discuss the benefits of studying mapmaking in general. Choice B is incorrect because though the text mentions that al-Idrisi interviewed travelers, the text does not describe how those travelers created maps. Choice D is incorrect because though the text mentions that al-Idrisi consulted Arabic and Greek maps, the text does not offer a comparison of Arabic and Greek mapmaking techniques."},{"i":"0ed94d4c","c":"purpose","d":"E","s":"Jackie Ormes’s Torchy Brown in Dixie to Harlem (1937–38) was the first comic strip by a Black woman to appear in a widely read newspaper. The strip tells the story of Torchy, a young woman who leaves Mississippi to become a performer in New York City. Torchy’s story reflects the experience of the Great Migration (1910–1970), when millions of Black Americans left the South in search of opportunities in other parts of the United States. Torchy Brown thus shows how Ormes used comics to comment humorously on issues affecting Black Americans, which she continued to do throughout her career.\n\nWhich choice best states the main purpose of the text?","o":["To show how Ormes’s Torchy Brown inspired other Black women to write comic strips in the 1930s","To illustrate how the subjects Ormes addressed in her comic strips changed over the course of her career","To give an example of how Ormes presented the experiences of Black Americans in her comic strips","To claim that several characters in Torchy Brown were based on people that Ormes knew personally"],"a":2,"r":"Choice C is the best answer. The text describes how Torchy Brown depicted the experiences of a young Black woman experiencing America’s Great Migration. It further states that Ormes continued to use comics throughout her career to humorously comment on important issues impacting Black Americans. Choice A is incorrect. The text never mentions other Black women comic strip writers. Choice B is incorrect. The text never mentions any changes in the subjects Ormes addressed. Choice D is incorrect. The text never mentions the inspiration for characters in Torchy Brown."},{"i":"39857700","c":"func","d":"H","s":"The following text is from Edith Wharton’s 1905 novel The House of Mirth. Lily Bart and a companion are walking through a park. Lily had no real intimacy with nature, but she had a passion for the appropriate and could be keenly sensitive to a scene which was the fitting background of her own sensations. <u>The landscape outspread below her seemed an enlargement of her present mood, and she found something of herself in its calmness, its breadth, its long free reaches.<\/u> On the nearer slopes the sugar-maples wavered like pyres of light; lower down was a massing of grey orchards, and here and there the lingering green of an oak-grove.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It creates a detailed image of the physical setting of the scene.","It establishes that a character is experiencing an internal conflict.","It makes an assertion that the next sentence then expands on.","It illustrates an idea that is introduced in the previous sentence."],"a":3,"r":"Choice D is the best answer because it best describes how the underlined sentence functions in the text as a whole. The first sentence of the text establishes that Lily can be “keenly sensitive to” scenes that serve as a “fitting background” for her feelings—that is, she’s very aware of when a setting seems to reflect her mood. The next sentence, which is underlined, then demonstrates this awareness: Lily views the landscape she’s in as a large-scale reflection of her current mood, identifying with elements such as its calmness. Thus, the function of the underlined sentence is to illustrate an idea introduced in the previous sentence. Choice A is incorrect because the underlined sentence describes the scene only in very general terms, referring to its calmness, breadth, and long stretches of land. It’s the next sentence that adds specific details about colors, light, and various trees nearby. Choice B is incorrect because nothing in the underlined sentence suggests that Lily is experiencing an internal conflict. In fact, the sentence indicates that Lily thinks the landscape reflects her own feeling of calmness. Choice C is incorrect because the only assertion in the underlined sentence is that Lily feels that broad aspects of the landscape, such as its calmness, reflect her current mood, and that assertion isn’t expanded on in the next sentence. Instead, the next sentence describes specific details of the scene without connecting them to Lily’s feelings."},{"i":"03eeecf3","c":"func","d":"M","s":"The following text is from H.D.’s 1916 poem “Mid-Day.” In the poem, the speaker is on a path in an outdoor setting. <u>A slight wind shakes the seed-pods<\/u>— my thoughts are spent as the black seeds. My thoughts tear me, I dread their fever. I am scattered in its whirl. I am scattered like the hot shrivelled seeds.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It illustrates a change in the natural environment that the speaker implies is responsible for the growing misgivings described in the text.","It establishes an example of consistency in the natural landscape that the speaker then contrasts with the unpredictability of human emotions.","It presents an observation of an occurrence in the natural world that the speaker then expands on to convey a sense of a turbulent interior state.","It evokes the ordinariness of an event in nature to suggest that the critical self-evaluation the speaker engages in is a common pursuit."],"a":2,"r":"Choice C is the best answer because it best describes the function of the underlined portion in the text as a whole. In the text, the speaker mentions the occurrence in nature of seedpods being shaken by a slight wind. The speaker then goes on to compare the black seeds to thoughts, using language that indicates that the speaker’s state of mind is unsettled (e.g., \"my thoughts are spent\"; \"My thoughts tear me, I dread their fever\"). The text concludes with a comparison between the speaker’s \"scattered\" state of mind and the \"hot shrivelled seeds.\" Thus, the underlined portion of the text presents an observation of an occurrence in the natural world that the speaker then expands on to convey a sense of a turbulent interior state. Choice A is incorrect because the text does not indicate that the seedpods are the cause of the speaker’s state of mind; thus, they could not be responsible for any misgivings the speaker has. Choice B is incorrect because the text does not contrast the natural landscape with the speaker’s state of mind or describe the wind shaking the seedpods as consistent; rather, the text suggests that the state of the natural world and the speaker’s state of mind are similar in that both are unsettled. Choice D is incorrect because there is no indication in the text that the speaker regularly engages in critical self-evaluation, only that in this particular instance the speaker’s state of mind is turbulent."},{"i":"ab56a107","c":"cross","d":"M","s":"Text 1 Digital art, the use of digital technology to create or display images, isn’t really art at all. It doesn’t require as much skill as creating physical art. “Painting” with a tablet and stylus is much easier than using paint and a brush: the technology is doing most of the work.\n\nText 2 The painting programs used to create digital art involve more than just pressing a few buttons. In addition to knowing the fundamentals of art, digital artists need to be familiar with sophisticated software. Many artists will start by drawing an image on paper before transforming the piece to a digital format, where they can apply a variety of colors and techniques that would otherwise require many different traditional tools.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the claims of the author of\n\nText 1?","o":["By arguing that a piece of art created digitally can still be displayed traditionally","By explaining that it’s actually much harder to use a tablet and stylus to create art than to use paint and a brush","By insisting that digital art requires artistic abilities and skill even if it employs less traditional tools","By admitting that most digital artists don’t think fundamental drawing skills are important"],"a":2,"r":"Choice C is the best answer because it reflects how the author of Text 2 would respond to the claims in Text 1. Both texts address skills needed to produce digital art. Text 1 claims that digital art doesn’t require the same amount of skill as creating physical art and that “the technology is doing most of the work.” Text 2 states that digital art requires “knowing the fundamentals of art” and that many digital artists begin their work on paper and then transfer it to a digital format using “sophisticated software” and “a variety of colors and techniques.” Therefore, the author of Text 2 would most likely insist that digital art requires artistic abilities even if it employs less traditional tools. Choice A is incorrect because neither text discusses nondigital means of displaying art. Choice B is incorrect because the author of Text 2 doesn’t address whether it’s harder to use a tablet and stylus than it is to use paint and a brush. Text 2 does argue that digital art requires skills that aren’t part of the traditional methods for producing art, but the text doesn’t address relative difficulty. Choice D is incorrect because the author of Text 2 states that digital artists still need to know “the fundamentals of art” and that many digital artists begin their work by drafting on paper before transferring the work to a digital format."},{"i":"82d2436a","c":"main","d":"E","s":"The following text is from Laila Lalami’s 2019 novel The Other Americans. The narrator is a member of her middle school’s jazz band. One day the jazz band was invited to perform at the Summer Festival in Palm Springs. Walking across the stage to the piano, I did what my teacher had advised. Pretend you’re only playing for one person. That way you won’t be so nervous. I glanced at my father, who sat in the front row, leaning his head just so, waiting. Then I closed my eyes, and began to play. ©2019 by Laila Lalami According to the text, what does the narrator do as she walks across the stage?","o":["She thinks about the differences between playing the piano alone and playing in a band.","She feels excitement about playing in a music festival for the first time.","She remembers how hard she has practiced for the performance.","She follows her teacher’s advice about managing her nervousness."],"a":3,"r":"Choice D is the best answer because it presents a statement about what the narrator is doing that is directly supported by the text. According to the text, as the narrator walks across the stage to her piano, she recalls her teacher’s advice to pretend that she is playing for only one person. The text indicates that this advice was intended to help manage any nerves related to performing. Moreover, the text implies that the narrator follows this advice by deciding to focus on her father sitting in the audience. Thus, the text supports the idea that as she walks across the stage, the narrator follows her teacher’s advice about managing her nervousness. Choice A is incorrect because the text doesn’t indicate that the narrator is thinking about how playing the piano alone is different from playing the piano in a band. Rather, the narrator thinks about her teacher’s advice to pretend that she is playing the piano for only one person to help ease her nervousness about performing. Choice B is incorrect because the text provides no indication that this is the first music festival that the narrator has performed in. Furthermore, the text indicates that the narrator is nervous, not excited, to play the piano at the festival. Choice C is incorrect because the text doesn’t suggest that the narrator is remembering how hard she practiced for the performance. Rather, she is thinking about what her teacher told her to do to help ease her nerves about playing the piano in front of an audience."},{"i":"f2208f98","c":"main","d":"M","s":"When Kenyan writer Ngũgĩ wa Thiong’o, who had previously published four novels in English, began writing in his native language, Gĩkũyũ, in the 1970s, several fellow writers and critics cautioned that doing so might make his works inaccessible outside his own community. Some noted that Kiswahili—widely spoken in Kenya and elsewhere in Africa—would be a more practical choice. Rejecting their arguments, Ngũgĩ went on to author dozens of acclaimed works in Gĩkũyũ that have been translated into a total of more than thirty languages.\n\nWhich choice best states the main idea of the text?","o":["The reaction to Ngũgĩ’s rejection of English illustrates that some literary experts believe that fame is most easily gained by writing in a widely understood language, such as Gĩkũyũ.","Although Ngũgĩ insisted on publishing his first works in Gĩkũyũ, they have since been translated into many other languages.","Although Ngũgĩ’s decision to write in Gĩkũyũ was met with some skepticism, it didn’t prevent him from achieving literary success.","In the 1970s, Ngũgĩ became convinced that literature ought to be written in authors’ native languages, and he proceeded to publish many works in Gĩkũyũ."],"a":2,"r":"Choice C is the best answer because it most accurately states the main idea of the text. The text begins by explaining that Kenyan writer Ngũgĩ wa Thiong’o had published four novels in English before he began writing in his native language, Gĩkũyũ, in the 1970s. The text then explains that fellow writers and critics were skeptical of this decision, warning that the choice to publish in his native language, which the text implies isn’t widely understood, would limit his readership. The text concludes by stating that despite those warnings, Ngũgĩ proceeded to publish several acclaimed novels in Gĩkũyũ that were translated into several languages, suggesting that Ngũgĩ’s works in Gĩkũyũ achieved literary success in the forms of critical recognition and a wide international readership. Thus, the main idea is that although Ngũgĩ’s decision to write in Gĩkũyũ was met with some skepticism, this choice didn’t prevent him from achieving literary success. Choice A is incorrect because it contradicts the description of Gĩkũyũ provided in the text. Rather than indicating that Gĩkũyũ is a widely understood language, as this choice claims, the text states that colleagues cautioned Ngũgĩ that writing in Gĩkũyũ instead of English “might make his works inaccessible outside his own community.” Furthermore, the text contrasts the choice of Gĩkũyũ with another alternative to English, Kiswahili, which the text indicates is “a more practical choice” given that it is “widely spoken in Kenya and elsewhere in Africa.” Choice B is incorrect because it contradicts information in the text. Although the text states that the novels Ngũgĩ published in Gĩkũyũ were later translated into other languages, the text explicitly states that Ngũgĩ had previously published four novels in English before he began writing in Gĩkũyũ in the 1970s. Thus, his first works were published in English, not Gĩkũyũ. Choice D is incorrect. The text doesn’t address what motivated Ngũgĩ’s choice to publish in his native Gĩkũyũ, and nothing in the text suggests that he intended for other authors to follow his example."},{"i":"9077be25","c":"infer","d":"E","s":"Alice Guy-Blaché directed hundreds of films between 1896 and 1920. She wanted audiences to feel like they were watching real people on screen. She would encourage actors in her films to behave naturally. Guy-Blaché even hung a large sign reading “Be Natural” in the studio where she made her films. At the time, films lacked sound, so actors needed to rely solely on their bodies and facial expressions to convey emotions. As a result, actors tended to highly exaggerate their actions and expressions. The style of acting in Guy-Blaché’s films was therefore ______ Which choice most logically completes the text?","o":["copied by many of Guy-Blaché’s peers.","familiar to actors who had worked on other directors’ films.","very unusual for the period.","better than film acting today."],"a":2,"r":"Choice C is the best answer. The text tells us that “actors tended to highly exaggerate their actions and expressions” in films produced from 1896 to 1920. This suggests that the natural style of acting in Guy-Blaché’s films was very unusual for the time. Choice A is incorrect. The text never discusses any other directors copying the style of acting found in Guy-Blaché’s films, and in fact suggests the opposite—that it was unusual for directors to suggest this style of acting at the time. Choice B is incorrect. The text never discusses actors’ familiarity with the style of acting found in Guy-Blaché’s films, so there isn’t much basis for this inference. But since the text tells us that other films of the period used a highly exaggerated form of acting, we might predict that the natural style in Guy-Blachés films would have been unfamiliar to these actors. Choice D is incorrect. The text never discusses film acting today, so there’s no basis for this inference."},{"i":"e185a21f","c":"infer","d":"H","s":"One theory behind human bipedalism speculates that it originated in a mostly ground-based ancestor that practiced four-legged “knuckle- walking,” like chimpanzees and gorillas do today, and eventually evolved into moving upright on two legs. But recently, researchers observed orangutans, another relative of humans, standing on two legs on tree branches and using their arms for balance while they reached for fruits. These observations may suggest that ______ Which choice most logically completes the text?","o":["bipedalism evolved because it was advantageous to a tree-dwelling ancestor of humans.","bipedalism must have evolved simultaneously with knuckle-walking and tree-climbing.","moving between the ground and the trees would have been difficult without bipedalism.","a knuckle-walking human ancestor could have easily moved bipedally in trees."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the evolution of bipedalism in humans. According to the text, one potential explanation for humans walking upright on two legs is that the behavior evolved from an ancestor that mostly stayed on the ground and walked on four limbs, as modern chimpanzees and gorillas do. However, the finding that orangutans, also a relative of humans, sometimes stand on two legs in trees while using their arms to balance and reach for fruits suggests another possible explanation: perhaps a tree-dwelling ancestor of humans began moving on two legs because it offered an advantage, such as access to certain foods. Choice B is incorrect because the finding that modern orangutans (a relative of humans) sometimes stand on two legs in trees doesn’t offer any insight into when either bipedalism or tree-climbing behavior emerged in human ancestors. Additionally, the text indicates that one theory is that bipedalism evolved from a mostly ground-based ancestor that was already practicing knuckle-walking, not that bipedalism and knuckle-walking developed at the same time. Choice C is incorrect because the finding that orangutans (a relative of humans) sometimes stand on two legs in trees doesn’t offer any insight into how difficult it would’ve been to move between the ground and the trees without bipedalism; there’s no suggestion that climbing or moving in trees depends on the ability to walk on two legs rather than four, even if that ability might be helpful in certain circumstances. Choice D is incorrect because the finding that orangutans (a relative of humans) sometimes stand on two legs in trees doesn’t suggest that a knuckle-walking human ancestor could’ve easily moved on two legs in trees. Although the text indicates that bipedalism may have evolved from a human ancestor that mostly stayed on the ground and walked on four limbs, it gives no indication of how easy it would’ve been for such an ancestor to move bipedally in trees."},{"i":"5d6ab069","c":"claim","d":"M","s":"Jan Gimsa, Robert Sleigh, and Ulrike Gimsa have hypothesized that the sail-like structure running down the back of the dinosaur Spinosaurus aegyptiacus improved the animal’s success in underwater pursuits of prey species capable of making quick, evasive movements. To evaluate their hypothesis, a second team of researchers constructed two battery-powered mechanical models of S. aegyptiacus, one with a sail and one without, and subjected the models to a series of identical tests in a water-filled tank.\n\nWhich finding from the model tests, if true, would most strongly support Gimsa and colleagues’ hypothesis?","o":["The model with a sail took significantly less time to complete a sharp turn while submerged than the model without a sail did.","The model with a sail displaced significantly more water while submerged than the model without a sail did.","The model with a sail had significantly less battery power remaining after completing the tests than the model without a sail did.","The model with a sail took significantly longer to travel a specified distance while submerged than the model without a sail did."],"a":0,"r":"Choice A is the best answer. This finding would most strongly support the hypothesis. The hypothesis is that the sail improved the dinosaur’s ability to chase quick, evasive prey. This finding suggests that the sail helped the dinosaur make sharp turns more quickly, which supports that hypothesis. Choice B is incorrect. This finding wouldn’t necessarily support the hypothesis. The hypothesis is that the sail improved the dinosaur’s ability to chase quick, evasive prey. It’s unclear how the sail displacing more water would relate to that hypothesis—it doesn’t seem to be relevant. Choice C is incorrect. This finding wouldn’t necessarily support the hypothesis. The hypothesis is that the sail improved the dinosaur’s ability to chase quick, evasive prey. It’s unclear how the difference in battery power between the models would relate to that hypothesis—it doesn’t seem to be relevant. Choice D is incorrect. This finding would actually weaken the hypothesis. The hypothesis is that the sail improved the dinosaur’s ability to chase quick, evasive prey. This finding suggests that the sail slowed the dinosaur down—which would probably make it worse at catching quick, evasive prey."},{"i":"0fc0a773","c":"claim","d":"E","s":"The Minneapolis Institute of Art in Minneapolis, Minnesota, has over 90,000 works of art. Digital images of thousands of those works have been put online through the museum’s website and the Google Arts &amp; Culture project. One of the images is of Mississippi Delta, a drawing by Siah Armajani. In a paper, a student claims that <u>putting a work from the museum online increases the number of people who experience that work<\/u>.\n\nWhich finding, if true, would most directly support the underlined claim?","o":["The Minneapolis Institute of Art has several works by Siah Armajani.","Many people who have been to Minneapolis say that the Minneapolis Institute of Art is worth visiting.","Mississippi Delta has been praised by some art critics.","Each year, more people access the online image of Mississippi Delta than visit the Minneapolis Institute of Art in person."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would most directly support the student’s claim that putting a work online increases the number of people who experience it. The text states that the Minneapolis Institute of Art has more than 90,000 artworks. It goes on to explain that images of a subset of these works can be viewed online, such as an image of Armajani’s drawing Mississippi Delta. The text then presents a student’s claim that online images of art can increase the number of people who experience the work. If more people view Armajani’s drawing online than they do in person, this finding would support the student’s claim about the benefits of putting a work from the museum online. Thus, this finding would most directly support the claim because, if it were true, more people would view Mississippi Delta online than would visit the entire museum in person. Choice A is incorrect because information about the museum having several works by Armajani wouldn’t address the student’s claim about how putting artworks online affects the number of people who experience them. The quantity of works by one artist that are held in a museum collection wouldn’t support a claim about audience size or the impact of online accessibility. Choice B is incorrect because opinions about the museum would only relate to the institution’s reputation. This finding wouldn’t provide information about online accessibility or whether digital images increase the number of people who view specific artworks. Choice C is incorrect because critics’ praise for Mississippi Delta wouldn’t address the student’s claim about how online access increases the number of people who can experience a work. Although positive comments from art critics could affect interest in an artwork, this finding wouldn’t provide information about how many people experience the work or whether online accessibility increases that number."},{"i":"1281dfd5","c":"graph","d":"H","s":"","o":["most lizard species use about the same percentage of their maximal speed when escaping predation as they do when pursuing prey.","multiple lizard species move at an average of less than 90% of their maximal speed while escaping predation.","more lizard species use, on average, 90%–100% of their maximal speed while escaping predation than use any other percentage of their maximal speed.","at least 4 lizard species use, on average, less than 100% of their maximal speed while pursuing prey."],"a":1,"r":"Choice B is the best answer because it describes data from the graph that complete the text’s discussion of lizard species’ use of maximal speed when escaping predators. According to the text, moving at maximal speed (the highest speed possible) requires so much energy that it is not always an effective strategy for animals, even when they are escaping predators. The graph displays data on the average percent of maximal speed used by lizard species while either escaping predators or pursuing prey. The graph categorizes the data for both pursuing and escaping by the number of species using 30%–39% of maximal speed, 40%–49% of maximal speed, 50%–59% of maximal speed, 60%–69% of maximal speed, 70%–79% of maximal speed, 80%–89% of maximal speed, and 90%–100% of maximal speed, respectively. In the graph, there is at least one species in each of the following percent categories for maximal speed while escaping predators: 50%–59%, 60%–69%, 70%–79%, and 80%– 89%. Thus, the data in the graph show that multiple lizard species move at an average of less than 90% of their maximal speed while escaping predation. Choice A is incorrect because the data in the graph isn’t organized in such a way that a comparison of the percentage of maximal speed used when escaping predation with the percentage used when pursuing prey is possible at the level of individual species. Choice C is incorrect. It is true that in the graph, the percent category with the largest number of species using maximal speed while escaping predators is 90%–100% (8 species total). However, these data don’t complete the text, which is concerned instead with how animals are discouraged from using maximal speed even when escaping predators because of the amount of energy required to use it. Choice D is incorrect because these data from the graph pertain to maximal speed while pursuing prey and therefore don’t complete the text’s discussion of lizard species’ use of maximal speed when escaping predators."},{"i":"6177abc5","c":"graph","d":"E","s":"","o":["2000–2004.","1995–1999.","1970–1974.","1985–1989."],"a":1,"r":"Choice B is the best answer because it most effectively uses data from the table to complete the statement about video game availability. The text states that just a few games released in the past are available today and then indicates that there is a period of years from which only 14.22 percent of the games released are available. The table shows that 14.22 percent of games are still available from the years 1995–1999. Choice A is incorrect because the years 2000–2004 are not represented in the table. Choice C is incorrect because the years 1970–1974 are not represented in the table. Choice D is incorrect because the years 1985–1989 correspond to a percentage of games still available of 15.38 percent, not 14.22 percent."},{"i":"ec08463d","c":"fss","d":"E","s":"Botanists recognize over fifty different species of sunflower. One species, the silverleaf sunflower, ______ both an early-flowering ecotype that tends to grow in coastal areas and a late-flowering ecotype that grows inland.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["having included","including","to include","includes"],"a":3,"r":"Choice D is the best answer. This verb needs to function as the main verb in the sentence, with the subject “one species,” so it needs to be conjugated. This choice gives us the singular present tense “includes,” which is the only conjugated form of the verb among the choices. Choice A is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This verb needs to function as the main verb in the sentence, with the subject “one species,” so it needs to be conjugated. “Having included” is a participle form of the verb: it’s not conjugated and doesn’t function like a normal verb. Choice B is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This verb needs to function as the main verb in the sentence, with the subject “one species,” so it needs to be conjugated. “Including” is the gerund form of the verb: it’s not conjugated and doesn’t function like a normal verb. Choice C is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This verb needs to function as the main verb in the sentence, with the subject “one species,” so it needs to be conjugated. “To include” is the infinitive form of the verb: it’s not conjugated."},{"i":"1684b237","c":"fss","d":"E","s":"One of the few African American global explorers during the turn of the 20th century, ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["Matthew Henson made several treks across Greenland between 1891 and 1909.","1891 and 1909 were the years between which Matthew Henson made several treks across Greenland.","Greenland was where Matthew Henson made several treks between 1891 and 1909.","several treks across Greenland were made by Matthew Henson between 1891 and 1909."],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the proper noun \"Matthew Henson\" the subject of the sentence and places it immediately after the modifying phrase \"one…century.\" In doing so, this choice clearly establishes that Matthew Henson—and not another noun in the sentence—is being described as one of the few African American global explorers during the turn of the 20th century. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase \"1891 and 1909\" immediately after the modifying phrase illogically suggests that those years were one of the few African American global explorers during the turn of the 20th century. Choice C is incorrect because it results in a dangling modifier. The placement of the proper noun \"Greenland\" immediately after the modifying phrase illogically suggests that Greenland was one of the few African American global explorers during the turn of the 20th century. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase \"several treks across Greenland\" immediately after the modifying phrase illogically suggests that the treks were one of the few African American global explorers during the turn of the 20th century."},{"i":"59209b6d","c":"fss","d":"M","s":"Based on genetic evidence, archaeologists have generally agreed that reindeer domestication began in the eleventh century CE. However, since uncovering fragments of a 2,000-year-old reindeer training harness in northern Siberia, ______ may have begun much earlier.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["researcher Robert Losey has argued that domestication","researcher Robert Losey’s argument is that domestication","domestication, researcher Robert Losey has argued,","the argument researcher Robert Losey has made is that domestication"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “researcher Robert Losey” the subject of the sentence and places it immediately after the modifying phrase “since…Siberia.” In doing so, this choice clearly establishes that researcher Robert Losey—and not another noun in the sentence—is who uncovered fragments of a 2,000-year-old reindeer training harness in northern Siberia. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “researcher Robert Losey’s argument” immediately after the modifying phrase illogically suggests that the “argument” is what uncovered fragments of a 2,000-year-old reindeer training harness in northern Siberia. Choice C is incorrect because it results in a dangling modifier. The placement of the noun “domestication” immediately after the modifying phrase illogically suggests that “domestication” is what uncovered fragments of a 2,000-year-old reindeer training harness in northern Siberia. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “the argument” immediately after the modifying phrase illogically suggests that the “argument” is what uncovered fragments of a 2,000-year-old reindeer training harness in northern Siberia."},{"i":"0fa289a7","c":"bound","d":"H","s":"In 1955, Indian Bengali filmmaker Satyajit Ray released his first movie, Pather ______ quiet black-and-white drama about a family in rural India, Ray’s film was quite different from the loud, colorful action-romance movies that were popular at the time.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Panchali a","Panchali, which was a","Panchali, a","Panchali. A"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"In…Panchali\") and another (\"A quiet…time\"). The phrase beginning with \"a quiet\" modifies the subject of the next sentence, \"Ray’s film.\" Choice A is incorrect because it results in a run-on sentence. The sentences are fused without punctuation and/or a conjunction. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences."},{"i":"ea8f4658","c":"bound","d":"E","s":"When particles are suspended in liquid (like pollen in a water glass), they will zigzag randomly through the liquid and collide with one another in perpetuity. This type of random, continuous ______ is known as Brownian motion, can be observed throughout the natural world.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["movement: which","movement, which","movement which","movement. Which"],"a":1,"r":"Choice B is the best answer. This choice correctly uses commas to set off the nonessential relative clause \"which is known as Brownian motion\" that provides extra information about the \"random, continuous movement\" that isn’t necessary for the function of the sentence. Choice A is incorrect. This choice results in a punctuation error. The relative clause \"which is known as Brownian motion\" is a nonessential supplement. Nonessential supplements need to be set apart from the rest of the sentence with a pair of commas, dashes, or parentheses, so we can’t use a colon here. Also, notice that colons can only come after an independent clause, which isn’t the case here. Choice C is incorrect. This choice results in a punctuation error. The relative clause \"which is known as Brownian motion\" is a nonessential supplement, so it should be separated from the rest of the sentence by a pair of matching punctuation marks. We already have a comma after \"motion,\" so we need to add a comma before \"which.\" This choice is missing that comma. Choice D is incorrect. This choice results in a sentence fragment. \"This type of random, continuous movement\" is not an independent clause and can’t stand alone as a full sentence, so we can’t put a period here."},{"i":"f6d454c1","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: If a moon orbiting a planet comes close enough to that planet, tidal forces can cause the moon to break apart. In a 2022 study, researchers proposed that Saturn was once orbited by a large moon they named Chrysalis. Their simulations indicated that Chrysalis would likely have come very close to Saturn around 160 million years ago. At that distance, Chrysalis would have been broken apart by tidal forces. The researchers hypothesized that the resulting debris formed Saturn’s rings. The student wants to recount the sequence of events proposed by the researchers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["According to researchers’ simulations, two events likely occurred around 160 million years ago: first, Chrysalis came very close to Saturn, and second, debris from Saturn’s rings caused the moon to break apart.","If a moon orbiting a planet (like Saturn) comes close enough to that planet, tidal forces can cause the moon to break apart.","Around 160 million years ago, a large moon (Chrysalis) came close enough to Saturn that tidal forces broke the moon apart; its debris then formed the planet’s rings.","First, researchers proposed that Saturn was orbited by a large moon (Chrysalis); next, they conducted simulations; and, finally, they formed a hypothesis."],"a":2,"r":"Choice C is the best answer. The sentence recounts the sequence of events proposed by the researchers: a large moon orbiting Saturn came close enough to the planet that it was broken apart by tidal forces, and the resulting debris formed Saturn’s rings. Choice A is incorrect because the sentence misrepresents information from the notes; according to the notes, tidal forces, not debris, caused the moon to break apart. Choice B is incorrect. The sentence offers information relevant to the 2022 study but doesn’t recount the sequence of events proposed by the researchers. Choice D is incorrect. The sentence recounts a sequence, but it’s a sequence of the researchers’ activities, not the sequence of events proposed by the researchers."},{"i":"fb3abe38","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In a 2020 study, researchers in California investigated how many potential nesting sites female wood ducks visited during the nesting season. The researchers placed nest boxes throughout the survey area and tagged 138 female wood ducks with radio frequency ID trackers. These trackers recorded how many nest boxes each duck visited. 67 ducks (48.5%) visited only one nest box. 18 ducks (13.0%) visited 10 or more nest boxes. Younger ducks were more likely to visit multiple nest boxes. The student wants to present the methods used in the 2020 study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["By recording how many nest boxes each duck visited, the researchers discovered that only a relatively small percentage (13.0%) of the ducks visited 10 or more nest boxes.","After tracking how many nest boxes the 138 wood ducks visited, the researchers found that the younger ducks tended to visit more nest boxes than the older ducks.","The researchers tagged 138 female wood ducks with radio frequency ID trackers and recorded how many nest boxes each duck visited during the nesting season.","The researchers investigated each nesting site for signs that it had been visited by the female wood ducks."],"a":2,"r":"Choice C is the best answer. The sentence presents the methods used in the study, noting that researchers tagged 138 female wood ducks with radio frequency ID trackers and recorded the number of nest boxes each duck visited. Choice A is incorrect. While the sentence mentions an aspect of the study’s design (that the researchers recorded the number of nest boxes the wood ducks visited), it primarily focuses on a finding of the study rather than the methods the researchers used. Choice B is incorrect. While the sentence mentions an aspect of the study’s design (that the researchers tracked the number of nest boxes the wood ducks visited), it primarily focuses on a finding of the study rather than the methods the researchers used. Choice D is incorrect. The sentence misrepresents information from the notes. The researchers used radio frequency ID trackers to record the ducks’ visits; they didn’t investigate each site to look for evidence that it had been visited."},{"i":"388b45aa","c":"trans","d":"M","s":"Establishing Coordinated Universal Time (UTC) is no easy task. Each month, readings of a single second from atomic clocks around the world are taken and sent to the International Bureau of Weights and Measures (BIPM) in France. ______ BIPM metrologists perform the meticulous work of assembling these minutely disparate readings into a globally shared time standard.\n\nWhich choice completes the text with the most logical transition?","o":["There,","In particular,","For example,","Conversely,"],"a":0,"r":"Choice A is the best answer. \"There\" indicates that the work of calculating Coordinated Universal Time takes place at the International Bureau of Weights and Measures in France. Because \"there\" indicates a location, it fits the context perfectly. Choice B is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. This sentence is describing where the work of coordinating Coordinated Universal Time takes place, not giving an example of the work described in the previous sentence. Choice C is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. This sentence is describing where the work of coordinating Coordinated Universal Time takes place, not giving an example of the work described in the previous sentence. Choice D is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the previous sentence. They both describe the work involved in calculating Coordinated Universal Time."},{"i":"4fde4454","c":"trans","d":"M","s":"One poll taken after the first 1960 presidential debate suggested that John Kennedy lost badly: only 21 percent of those who listened on the radio rated him the winner. ______ the debate was ultimately considered a victory for the telegenic young senator, who rated higher than his opponent, Vice President Richard Nixon, among those watching on the new medium of television.\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","Therefore,","Likewise,","Nevertheless,"],"a":3,"r":"Choice D is the best answer. “Nevertheless” logically signals that the claim in this sentence—that the telegenic Kennedy was ultimately considered the winner of the debate—is true despite the previous information about the poll of radio listeners. Choice A is incorrect because “in other words” illogically signals that the claim in this sentence is a paraphrase of the previous information about the poll of radio listeners. Instead, Kennedy was ultimately considered the winner despite what that poll suggested about his performance. Choice B is incorrect because “therefore” illogically signals that the claim in this sentence is a result of the previous information about the poll of radio listeners. Instead, Kennedy was ultimately considered the winner despite what that poll suggested about his performance. Choice C is incorrect because “likewise” illogically signals that the claim in this sentence is similar to the previous information about the poll of radio listeners. Instead, Kennedy was ultimately considered the winner despite what that poll suggested about his performance."},{"i":"57bcd0d6","c":"trans","d":"E","s":"Etched into Peru’s Nazca Desert are line drawings so large that they can only be fully seen from high above. Archaeologists have known of the lines since the 1920s, when a researcher spotted some from a nearby foothill, and they have been studying the markings ever since. ______ archaeologists’ efforts are aided by drones that capture high-resolution aerial photographs of the lines.\n\nWhich choice completes the text with the most logical transition?","o":["Currently,","In comparison,","Still,","However,"],"a":0,"r":"Choice A is the best answer. “Currently” logically signals that the archaeologists’ use of drones (a current technology) to photograph the lines is the present-day continuation of the ongoing archaeological research described in the previous sentence. Choice B is incorrect because “in comparison” illogically signals that the action described in this sentence offers a comparison to the ongoing archaeological research described in the previous sentence. Instead, the use of drones is the present-day continuation of that research. Choice C is incorrect because “still” illogically signals that the action described in this sentence occurs despite the ongoing archaeological research described in the previous sentence. Instead, the use of drones is the present-day continuation of that research. Choice D is incorrect because “however” illogically signals that the action described in this sentence occurs either despite or in contrast to the ongoing archaeological research described in the previous sentence. Instead, the use of drones is the present-day continuation of that research."}],"img":{"1281dfd5":"iVBORw0KGgoAAAANSUhEUgAAArwAAAHjBAMAAAAzpNHPAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA960lEQVR42u1dd2AUxdt+ZvdKKjeXhNCTTUKRvpAQmsBBEhApv6MLiBxNFFGDgqCgX0A6KAEFpGnoVQ2idDD00C9UUcoBYkNyc6Gn3Hx/XELukqCoXCi3zx+57OzM7M6z77zzvlMBBQoUKFCgQIECBQoUKFCgQIECBQoUPN6gD3yX/rssPA2EguQzQoYUoGiEAQQIdGauEoAgieRnEXiP2RhXkolCr2YH0ZpyuQXIbhBndr02GtANqO4c+Dqg2b9Zn5/Fc/du7cv7R9xZUJw9lGrvTOKdmC+960Ccq7e/BEwBBGeiegIhHes5yT+5x96yvDDtrYLKghY3v8Ljwe8nve3sGaoxtBy function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
