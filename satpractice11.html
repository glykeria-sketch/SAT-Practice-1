<script>
const D={"t":"SATPractice11","q":[{"i":"93665100","c":"vocab","d":"H","s":"Seminole/Muscogee director Sterlin Harjo ______ television’s tendency to situate Native characters in the distant past: this rejection is evident in his series Reservation Dogs, which revolves around teenagers who dress in contemporary styles and whose dialogue is laced with current slang.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["repudiates","proclaims","foretells","recants"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Sterlin Harjo’s approach to representing Native characters on television. As used in this context, “repudiates” means rejects or refuses to have anything to do with. The text indicates that television shows tend to depict Native characters as living long ago, but that Harjo’s series Reservation Dogs focuses on Native teenagers in the present day, representing a “rejection” of the typical approach to depicting Native characters. This context thus indicates that Harjo repudiates television’s general tendency regarding Native characters. Choice B is incorrect because the text describes Harjo’s “rejection” of the typical approach to representing Native characters on television, so it wouldn’t make sense to say that Harjo “proclaims,” or declares or affirms, television’s general tendency regarding Native characters. Harjo is described as refusing to follow the pattern of depicting Native characters in the distant past, not as proclaiming that pattern. Choice C is incorrect because the text describes television’s tendency to represent Native characters in the distant past as something that is already occurring, not as something that Harjo “foretells,” or predicts will happen in the future. The text is focused on Harjo’s “rejection” of this pattern, not on any predictions he may have about it. Choice D is incorrect because saying that Harjo “recants” something would mean that he withdraws a previously held belief, and it wouldn’t make sense to say that Harjo recants television’s tendency to represent Native characters as living in the past. No beliefs previously held by Harjo are mentioned. Additionally, a tendency isn’t a belief and thus isn’t something that can be recanted."},{"i":"4d1a9c0d","c":"vocab","d":"E","s":"Following the principles of community-based participatory research, tribal nations and research institutions are equal partners in health studies conducted on reservations. A collaboration between the Crow Tribe and Montana State University ______ this model: tribal citizens worked alongside scientists to design the methodology and continue to assist in data collection.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["circumvents","eclipses","fabricates","exemplifies"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the collaboration between the Crow Tribe and Montana State University. As used in this context, “exemplifies” means demonstrates. The text conveys how the Crow Tribe–Montana State University collaboration serves to illustrate the model of community-based participatory research introduced earlier in the text and expanded on later in the text. Choice A is incorrect because referring to “circumvents,” or avoids, wouldn’t make sense in context. The text suggests that the Crow Tribe– Montana State University collaboration serves as an example of the principles of community-based participatory research, not that the collaboration evades this model. Choice B is incorrect because referring to “eclipses,” or overshadows, wouldn’t make sense in context. The text describes the Crow Tribe–Montana State University collaboration as an equal partnership, which indicates that it’s an example of the community- based participatory research model, not that it overshadows the model. Choice C is incorrect because saying that the collaboration “fabricates,” or creates, the model wouldn’t make sense in context. The text indicates that the Crow Tribe–Montana State University collaboration serves as an example of the model, not that it created the model."},{"i":"051d3065","c":"vocab","d":"E","s":"Kelp forests grow underwater along the eastern Pacific Coast. These underwater forests are important to fish and other marine animals. Ocean currents can be powerful and rough, making it difficult for animals to find safe places to hide from predators. The underwater forests slow down the currents. This creates a more ______ environment with calmer waters where animals can take shelter.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["tranquil","dangerous","imaginative","surprising"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of how kelp forests help marine animals. In this context, \"tranquil\" means free from disturbance, or calm. The text indicates that ocean currents are powerful and make it difficult for marine animals to hide from predators and that kelp forests slow currents down to create calmer areas. In other words, kelp forests create a more tranquil environment. Choice B is incorrect because the text indicates that kelp forests provide shelter for marine animals, meaning they create environments that are safer, not more \"dangerous.\" Choice C is incorrect because the text discusses how kelp forests affect currents in the ocean, and it isn’t clear how an ocean environment could be \"imaginative,\" or full of imagination. Choice D is incorrect because the text indicates that kelp forests create a calm and safe environment, and an environment that is \"surprising\" would be characterized by unexpected occurrences, not calmness."},{"i":"e0656211","c":"vocab","d":"M","s":"In Nature Poem (2017), Kumeyaay poet Tommy Pico portrays his ______ the natural world by honoring the centrality of nature within his tribe’s traditional beliefs while simultaneously expressing his distaste for being in wilderness settings himself.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["responsiveness to","ambivalence toward","renunciation of","mastery over"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s description of how Pico feels about the natural world. In this context, to say that Pico portrays his “ambivalence toward” nature would mean that he portrays his mixed feelings about nature. The text explains that Pico “honors the centrality of nature” and also makes it clear that he doesn’t enjoy being in nature. This context suggests that Pico feels ambivalence toward nature. Choice A is incorrect because saying that Pico portrays his “responsiveness to” nature would mean that he portrays himself as quick to react to nature, which isn’t supported by the text. Instead, the text focuses on Pico’s mixed feelings toward nature, describing him as both honoring nature’s role in his tribe’s beliefs and expressing his personal dislike for being in nature. Choice C is incorrect because saying that Pico portrays his “renunciation of” nature would mean that he portrays himself as rejecting nature, which isn’t supported by the text. The text conveys that Pico demonstrates both positive and negative responses toward nature, not that he’s giving it up completely. Choice D is incorrect because saying that Pico portrays his “mastery over” nature would mean that he portrays himself as having control over nature, which isn’t supported by the text. The text focuses on Pico’s mixed feelings about nature; nothing in the text suggests that Pico feels mastery over nature."},{"i":"a1d2c4d0","c":"purpose","d":"H","s":"Pteropods are small swimming snails with thin, delicate calcium carbonate shells. These animals are thought to be especially vulnerable to ocean acidification due to calcium carbonate’s susceptibility to dissolution at lower pH values. Victoria L. Peck and colleagues recently found that the periostracum (a protective coating on pteropods’ outer shells) prevents this dissolution when intact. Moreover, the team was surprised to discover that even when the periostracum is breached, pteropods can still mitigate damage by rebuilding the inner shell wall.\n\nWhich choice best describes the main purpose of the text?","o":["To call for additional research on biological mechanisms that improve pteropod survival rates","To discuss a conclusion drawn in a study of calcium carbonate’s role in protecting the periostracum of pteropods","To address some of the ways ocean acidification has altered pteropod behavior over time","To present findings that suggest that a concern about the effects of ocean acidification on pteropod shells may be unwarranted"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to present findings that suggest a previously held concern about the effects of ocean acidification on pteropod shells may be unwarranted. The text introduces the concern that pteropods are thought to be particularly vulnerable to ocean acidification, or lower pH levels, due to the susceptibility of their calcium carbonate shells to dissolution at lower pH levels. However, the text then describes findings from a recent study that suggest this concern may be unjustified, insofar as the protective periostracum coating on a pteropod’s shell prevents dissolution, and even when the coating is breached, a pteropod can rebuild the inner shell wall, reducing the damage. Choice A is incorrect because the text doesn’t call for additional research or suggest that more research is needed on biological mechanisms that improve pteropod survival rates. Instead, the text discusses a recent study showing that pteropods may not be as vulnerable to ocean acidification as is feared. Choice B is incorrect because the study discussed in the text doesn’t address calcium carbonate’s role in protecting the periostracum of pteropods. According to the text, the study addresses the periostracum’s role in protecting pteropods’ calcium carbonate shells from dissolution due to ocean acidification. Choice C is incorrect because the text doesn’t address how ocean acidification has altered pteropod behavior over time. Instead, the text focuses on the potential effects of ocean acidification on pteropods’ shells and the mechanisms protecting against those effects."},{"i":"1782cdd7","c":"purpose","d":"E","s":"In many agricultural environments, the banks of streams are kept forested to protect water quality, but it’s been unclear what effects these forests may have on stream biodiversity. To investigate the issue, biologist Xingli Giam and colleagues studied an Indonesian oil palm plantation, comparing the species richness of forested streams with that of nonforested streams. Giam and colleagues found that species richness was significantly higher in forested streams, a finding the researchers attribute to the role leaf litter plays in sheltering fish from predators and providing food resources.\n\nWhich choice best states the main purpose of the text?","o":["It discusses research intended to settle a debate about how agricultural yields can be increased without negative effects on water quality.","It explains the differences between stream-protection strategies used in oil palm plantations and stream-protection strategies used in other kinds of agricultural environments.","It describes findings that challenge a previously held view about how fish that inhabit streams in agricultural environments attempt to avoid predators.","It presents a study that addresses an unresolved question about the presence of forests along streams in agricultural environments."],"a":3,"r":"Choice D is the best answer. The author first describes an unresolved question: what effect do bank forests have on stream biodiversity? Then the author presents a study that answers the question: bank forests increase stream biodiversity. Choice A is incorrect. This isn’t the main purpose of the text. The text never mentions agricultural yields. Choice B is incorrect. This isn’t the main purpose of the text. The text never mentions other kinds of agricultural environments. Choice C is incorrect. This isn’t the main purpose of the text. The text never mentions any previously held view about how fish in these streams try to avoid predators."},{"i":"fcc328c6","c":"func","d":"E","s":"Streams and rivers carry soil and rocks from one location to another. But there is another way for these geological materials to move. <u>Scientists call this process “aeolian transport.”<\/u> In aeolian transport, winds move small particles of soil or rock over potentially great distances. Geologist Melisa Diaz and her team studied dust in Antarctica to find out if it was moved by aeolian transport. They discovered that the dust matched geological material in Australia. Aeolian transport had carried it from one continent to another, across thousands of miles of open ocean.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It presents Melisa Diaz’s remarks about difficulties that her team encountered.","It introduces a scientific term that is used in the discussion that follows.","It emphasizes the surprising nature of the findings that are presented.","It explains the difference between two kinds of geological material."],"a":1,"r":"Choice B is the best answer because it most accurately describes the function of the underlined portion in the text as a whole. The first two sentences introduce the idea that soil and rocks can be moved from one location to another by something other than rivers and streams. The underlined sentence then states that the term used by scientists to refer to this process is “aeolian transport.” The discussion that follows explains what aeolian transport is (the movement of small geological materials over potentially great distances by the wind) and describes an example of a study that found that dust particles had been moved by aeolian transport from Australia to Antarctica. Thus, the underlined portion introduces a scientific term that is used in the discussion that follows. Choice A is incorrect because the underlined portion of the text doesn’t present any remarks from Melisa Diaz, nor does it suggest that Diaz and her team encountered difficulties in their study. Instead, the phrase in quotation marks in the underlined portion simply presents a term that is used by scientists to refer to a specific process discussed in the text. Choice C is incorrect because nothing in either the underlined portion or the text as a whole suggests that the findings of the study presented in the text were surprising or unexpected. In fact, the text suggests that Diaz and her team wanted to see if aeolian transport could explain the appearance of certain geological materials in Antarctica, and their findings did indeed confirm the involvement of aeolian transport. Choice D is incorrect. Although the first sentence of the text mentions soil and rocks, which are two different kinds of geological material, the underlined portion doesn’t refer to these materials, nor does it explain the difference between them. Rather, the underlined portion introduces the scientific term “aeolian transport,” which is used in the discussion that follows."},{"i":"02e49a0c","c":"func","d":"E","s":"Genetic studies have led researchers to suggest that turtles are most closely related to the group that includes modern crocodiles. But studies of fossils have suggested instead that turtles are most closely related to other groups, such as the one that contains modern snakes. <u>However, many of the fossil studies have relied on incomplete data sets.<\/u> For a 2022 investigation, biologist Tiago R. Simões and colleagues examined more than 1,000 reptile fossils collected worldwide. From this large data set, they found clear agreement with the results of the genetic studies.\n\nWhich choice best describes the function of the underlined sentence?","o":["It offers an overview of the tools scientists use to examine fossils.","It describes a limitation of some studies about the origin of turtles.","It summarizes previous research on the evolution of crocodiles.","It criticizes a widely held belief about genetic studies of reptiles."],"a":1,"r":"Choice B is the best answer. The sentence mentions that some fossil studies have relied on incomplete data sets, suggesting that these studies are limited in what they can tell us about turtles’ origins. Choice A is incorrect. While the sentence mentions the incompleteness of the data sets studied, it doesn’t mention any tools or techniques used to examine fossils. Choice C is incorrect. The sentence doesn’t mention anything about the evolution of crocodiles. Choice D is incorrect. This sentence doesn’t directly mention or criticize any \"widely held belief,\" and it focuses on a limitation of fossil studies of reptiles, not genetic studies."},{"i":"6d44060a","c":"structure","d":"M","s":"Works of moral philosophy, such as Plato’s Republic or Aristotle’s Nicomachean Ethics, are partly concerned with how to live a morally good life. But philosopher Jonathan Barnes argues that works that present a method of living such a life without also supplying a motive are inherently useful only to those already wishing to be morally good—those with no desire for moral goodness will not choose to follow their rules. However, some works of moral philosophy attempt to describe what constitutes a morally good life while also proposing reasons for living one.\n\nWhich choice best describes the overall structure of the text?","o":["It provides a characterization about a field of thought by noting two works in it and then details a way in which some works in that field are more comprehensive than others.","It mentions two renowned works and then claims that despite their popularity it is impossible for these works to serve the purpose their authors intended.","It summarizes the history of a field of thought by discussing two works and then proposes a topic of further research for specialists in that field.","It describes two influential works and then explains why one is more widely read than the other."],"a":0,"r":"Choice A is the best answer. The text starts by stating what moral philosophy is concerned with and naming two examples of works in the field. Then it describes a shortcoming of some works in that field (they say how but not why), and finally it states that other works try to avoid that shortcoming (by including both how and why to live a morally good life). Choice B is incorrect. This is too extreme. The text never mentions whether the two works are popular or not, and it never argues that these works don’t serve their intended purpose of describing how to live a morally good life. Rather, the text claims that works of moral philosophy that don’t include both how and why to be moral are not useful to readers who don’t already want to be moral. Choice C is incorrect. This isn’t the overall structure. The text never discusses the history of moral philosophy at all, and it doesn’t propose any topic for further research. Choice D is incorrect. This isn’t the overall structure. The text never discusses which of the two works is more widely read."},{"i":"12d81fc1","c":"cross","d":"M","s":"Text 1 Because literacy in Nahuatl script, the writing system of the Aztec Empire, was lost after Spain invaded central Mexico in the 1500s, it is unclear exactly how meaning was encoded in the script’s symbols. Although many scholars had assumed that the symbols signified entire words, linguist Alfonso Lacadena theorized in 2008 that they signified units of language smaller than words: individual syllables.\n\nText 2 The growing consensus among scholars of Nahuatl script is that many of its symbols could signify either words or syllables, depending on syntax and content at any given site within a text. For example, the symbol signifying the word huipil (blouse) in some contexts could signify the syllable “pil” in others, as in the place name “Chipiltepec.” Thus, for the Aztecs, reading required a determination of how such symbols functioned each time they appeared in a text.\n\nBased on the texts, how would the author of\n\nText 2 most likely characterize Lacadena’s theory, as described in\n\nText 1?","o":["By praising the theory for recognizing that the script’s symbols could represent entire words","By arguing that the theory is overly influenced by the work of earlier scholars","By approving of the theory’s emphasis on how the script changed over time","By cautioning that the theory overlooks certain important aspects of how the script functioned"],"a":3,"r":"Choice D is the best answer. Lacadena’s theory is that Nahuatl script symbols signified syllables, but the consensus described in Text 2 is that they can signify either symbols or full words, depending on the context. So the author of Text 2 would likely consider Lacadena’s theory too simplistic: it’s missing the importance of the context in determining the meaning of a symbol. Choice A is incorrect. This conflicts with Text 1’s description of Lacadena’s theory. Lacadena’s theory is that Nahuatl script symbols signified syllables. Choice B is incorrect. This conflicts with Text 1’s description of Lacadena’s theory. Text 1 states that Lacadena’s theory differed from what earlier scholars believed. Choice C is incorrect. We can’t infer that this is how the author of Text 2 would characterize Lacadena’s theory. Neither text mentions how or even if the script changed over time."},{"i":"0fd96039","c":"main","d":"E","s":"It has long been thought that the original author of the US Pledge of Allegiance was Francis Bellamy, who said that he wrote the pledge one evening in August of 1892. But a historian recently discovered a newspaper article that was published several months before August 1892. The article describes students reciting the same pledge that Bellamy claims he first wrote in August. This means that Bellamy may not have created the pledge after all.\n\nBased on the text, what piece of knowledge about the Pledge of Allegiance has recently become uncertain?","o":["How many changes were made to the pledge in the 1900s","The identity of the person who first wrote the pledge","The name of the newspaper that first published the pledge","Which part of the pledge students liked best in 1892"],"a":1,"r":"Choice B is the best answer because it presents a supposed fact about the Pledge of Allegiance that, as the text explains, has recently become uncertain. The text begins by explaining the long-held belief that the original author of the US Pledge of Allegiance was Francis Bellamy, who claimed to have written it in August 1892. The text then describes a historian’s recent discovery of a newspaper article published several months before August 1892 that mentions students reciting the same pledge. The text concludes that this discovery suggests Bellamy may not have created the pledge after all. Thus, what has recently become uncertain is the identity of the person who first wrote the pledge. Choice A is incorrect because the text doesn’t address any changes made to the Pledge of Allegiance in the 1900s. The text focuses solely on the question of who originally authored the pledge in or before 1892 and doesn’t mention any subsequent modifications to its wording. Choice C is incorrect. While the text does mention a historian’s discovery of a newspaper article that described students reciting the pledge, it doesn’t suggest that the pledge was published in its entirety within that article. Moreover, the text doesn’t identify the newspaper by name or suggest the possibility of an earlier mention of the pledge in a different newspaper. Choice D is incorrect because the text doesn’t mention which parts of the Pledge of Allegiance students preferred in 1892 or at any other time. The text only states that a newspaper article described students reciting the pledge, without providing any information about their preferences regarding different portions of it."},{"i":"0d81b7d9","c":"main","d":"M","s":"Paleontologist Alan Tennyson and colleagues studied fossil bones found in New Zealand that are more than 55 million years old. The researchers determined that the fossil bones belonged to two previously unknown species of prehistoric penguins. Moreover, they estimated that one of the two penguin species was more than three times the size of the emperor penguin, which is the largest penguin species that exists today.\n\nBased on the text, which choice best describes the two previously unknown penguin species?","o":["They are frequently studied by paleontologists.","They are no longer living species.","They were smaller than penguin species that exist today.","They spent little of their lives in water."],"a":1,"r":"Choice B is the best answer because it presents a statement about the two previously unknown penguin species that is supported by the text. According to the text, Alan Tennyson and colleagues studied fossil bones belonging to two previously unknown penguin species that are described as prehistoric, or ancient. The text goes on to say that one of the two species was considerably larger than the emperor penguin, which is currently the largest penguin in existence. Thus, the text indicates that the other species aren’t in existence today, or that the two previously unknown penguin species are no longer living species. Choice A is incorrect. Although the text states that Alan Tennyson is a paleontologist who studied the fossils of two previously unknown penguin species, it doesn’t say whether these penguins are frequently studied by paleontologists. Choice C is incorrect because the text says that one of the two previously unknown penguin species was three times larger than the emperor penguin (a penguin alive today), not that they were both smaller than penguin species that exist today. Choice D is incorrect because the text doesn’t discuss whether the two previously unknown penguin species spent any time in water."},{"i":"cf3acc50","c":"infer","d":"H","s":"Compiled in the late 1500s largely through the efforts of Indigenous scribes, Cantares Mexicanos is the most important collection of poetry in Classical Nahuatl, the principal language of the Aztec Empire. The poems portray Aztec society before the occupation of the empire by the army of Spain, and marginal notes in Cantares Mexicanos indicate that much of the collection’s content predates the initial invasion. Nonetheless, some of the poems contain inarguable references to beliefs and customs common in Spain during this era. Thus, some scholars have concluded that ______ Which choice most logically completes the text?","o":["while its content largely predates the invasion, Cantares Mexicanos also contains additions made after the invasion.","although those who compiled Cantares Mexicanos were fluent in Nahuatl, they had limited knowledge of the Spanish language.","before the invasion by Spain, the poets of the Aztec Empire borrowed from the literary traditions of other societies.","the references to beliefs and customs in Spain should be attributed to a coincidental resemblance between the societies of Spain and the Aztec Empire."],"a":0,"r":"Choice A is the best answer because it most logically completes the text. The text explains that the Cantares Mexicanos contains poems about the Aztec Empire from before the Spanish invasion. Furthermore, it indicates that notes in the collection attest that some of these poems predate the Spanish invasion, while some customs depicted are likely Spanish in origin. The implication is that some poems were composed before the invasion but the references to Spanish customs could have come about only after the invasion, and thus that the collection includes content that predates the invasion and also content from after the invasion. Choice B is incorrect because the text clearly indicates that the collection is in Nahuatl, not Spanish, so the compilers’ unfamiliarity with Spanish is irrelevant to whether the collection contains material composed after the Spanish invasion. Choice C is incorrect because the text mentions only the Aztec Empire and Spain: there is no information about the relationship of Aztec literature to any traditions other than its own or Spain’s. Choice D is incorrect because the text states that some of the poems make “inarguable references” to common Spanish customs, which conflicts with the idea that these references can reasonably be attributed to mere coincidence."},{"i":"c9708e7d","c":"infer","d":"M","s":"In Switzerland, the white fuzzy mountain flowers known as edelweiss are widely treated as a symbol of strength and courage. Although edelweiss can thrive in extreme conditions, they aren’t notably tougher or harder to reach than other mountain flowers growing in the Swiss Alps. Historian Tobias Scheidegger has shown that the popular view of the flowers originated in the mid-1800s when mountain climbing became popular in Switzerland. Mountain climbers spread the idea that the flowers grew only in steep, icy terrains that were dangerous to climb to. Scheidegger says that these claims were self-interested. He suggests that mountain climbers presented edelweiss in this way in order to ______ Which choice most logically completes the text?","o":["make themselves appear brave and strong for being able to climb to difficult places where edelweiss supposedly grew.","encourage more flower enthusiasts to explore the Swiss Alps.","share their observations about the unusual characteristics of edelweiss with scientists.","prove that edelweiss were more common in the Swiss Alps than in other mountain regions in Europe."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of mountain climbers’ motivations for exaggerating the difficulty of reaching edelweiss. The text establishes that edelweiss became symbols of strength and courage in Switzerland in the mid-1800s. The text goes on to state that mountain climbing became popular around the same time and that climbers spread the false idea that the flowers grew only in dangerous, hard-to-reach locations. According to the text, historian Tobias Scheidegger argues that these claims were “self- interested,” meaning they served the climbers’ own purposes. The text therefore implies that by claiming that edelweiss could be found only in perilous locations, mountain climbers could enhance their own reputations: climbers who encountered edelweiss would appear to have undertaken a dangerous journey, thereby making themselves seem brave and strong. Choice B is incorrect because making edelweiss seem more dangerous to reach than other mountain flowers are would likely discourage flower enthusiasts from trying to reach edelweiss rather than encourage them to explore the Swiss Alps. The text suggests that climbers’ self-interested motivation for exaggerating the difficulty of climbing to areas where edelweiss grew was to enhance their own reputations for being especially brave, not to promote tourism in the Swiss Alps. Choice C is incorrect because the text states that according to Scheidegger, mountain climbers exaggerated the difficulty of reaching edelweiss for self-interested reasons, not because they wanted to report genuine scientific observations about the flower’s unique characteristics. The text provides no indication that the climbers sincerely believed that their claims about the especially challenging terrain in which edelweiss grew were accurate, much less that they wanted to share this information with scientists. Choice D is incorrect because the text doesn’t suggest that mountain climbers were trying to prove that edelweiss were more common in Switzerland than elsewhere. The text’s focus is on the supposed difficulty and danger of reaching the flowers, not on their relative abundance in the Swiss Alps compared to other regions. In fact, the text implies that mountain climbers exaggerated how difficult edelweiss were to reach; it therefore wouldn’t make sense to say that they exaggerated this difficulty to demonstrate that edelweiss were relatively common."},{"i":"4987f743","c":"claim","d":"H","s":"ALSOL is a microcredit program in Mexico that makes small loans to female entrepreneurs who lack the collateral and credit history to secure financing from conventional banks. Borrowers use their business proceeds to repay loans in equal weekly installments and incur no penalty for missed payments other than lack of access to larger loans. Economists Gustavo Barboza and Sandra Trejos analyzed ALSOL data and found that rural borrowers, who mostly make and sell handicrafts, miss payments more often than urban borrowers do, partly because they sell their goods less frequently than they could. Barboza and Trejos claim that this behavior reflects strategic decisions that enable rural women to increase their profits per unit sold.\n\nWhich finding, if true, would most directly support Barboza and Trejos’s claim?","o":["Many marketplaces require entrepreneurs to pay marketplace operators a fixed percentage of each day’s proceeds in exchange for permission to sell goods there.","Rural entrepreneurs can typically sell their goods for higher prices in cities than in their home areas, but the number of people selling competing goods tends to be higher in cities.","Due to the lower costs they incur, rural entrepreneurs tend to require smaller initial loans than urban entrepreneurs do.","The cost to rural entrepreneurs to bring their goods to towns with marketplaces is high but largely independent of the number of goods they bring."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would most directly support Barboza and Trejos’s claim that rural female entrepreneurs who have received small loans from ALSOL are strategic in selling their goods less frequently than they could, even if it means missing payments. The text explains that borrowers in the ALSOL program use proceeds from their businesses to repay loans in equal weekly payments, with almost no penalty for missed payments. According to the text, Barboza and Trejos found that rural borrowers miss weekly payments in part because they don’t sell their goods as often as they could, a move the researchers claim allows the entrepreneurs to help increase profits for the goods they sell. Finding that the cost of bringing goods to towns with marketplaces is high for rural entrepreneurs but is largely independent of how many goods are brought would support the researchers’ claim: traveling to marketplaces less frequently would mean that a rural entrepreneur spends less on travel overall, and taking a large load of goods to a marketplace for essentially the same cost as taking a small load would allow the entrepreneur to more substantially offset the cost of travel with greater overall sales at the marketplace, resulting in more profit per good sold—even if those profits are earned less frequently and don’t support weekly loan payments. Choice A is incorrect because the finding that many marketplaces require entrepreneurs to pay the operators of the marketplace a fixed percentage of proceeds to be able to sell goods there wouldn’t explain why rural entrepreneurs strategically choose to sell their goods less frequently than they could in order to increase their profits per unit sold. With a fixed percentage of proceeds due to operators, the amount entrepreneurs have to pay operators would also be fixed regardless of frequency of selling. Choice B is incorrect because the finding that rural entrepreneurs can usually sell their goods for higher prices in cities than in their local areas but also face higher competition to sell goods in cities wouldn’t explain why rural entrepreneurs strategically choose to sell their goods less frequently than they could in order to increase their profits per unit sold. This is because both the higher prices and higher competition in cities would be stable factors—meaning there would be no clear reason for the rural entrepreneurs not to take every available chance to sell their goods in cities and to instead sell their goods in cities only sometimes. Choice C is incorrect because the finding that rural entrepreneurs have lower costs and thus tend to require smaller initial loans than urban entrepreneurs do has no bearing on rural borrowers strategically choosing to sell their goods less frequently than they could specifically to increase their profits per unit sold. The cost of producing goods doesn’t depend on the frequency with which an entrepreneur sells those goods, so lower frequency alone wouldn’t affect profits, and the initial loan amount is set and has nothing to do with how much profit is earned from each sale."},{"i":"c088a9a9","c":"claim","d":"E","s":"Over the course of the 1900s, more and more Native Hawaiians spoke English instead of the Hawaiian language. To preserve their language, Native Hawaiian teachers founded the ‘Aha Pūnana Leo preschool in 1984. They spoke Hawaiian while teaching, and their Native Hawaiian students were soon able to understand and speak it themselves. The school was a huge success. Eventually it opened locations around Hawai‘i and started teaching Hawaiian to elementary and high school students too. <u>Thanks to ‘Aha Pūnana Leo, the number of young people who speak the language has increased.<\/u> Which statement, if true, would most directly support the underlined claim?","o":["Fewer than fifty children could speak Hawaiian when ‘Aha Pūnana Leo was founded, but now more than 2,000 students at ‘Aha Pūnana Leo speak it.","Roughly 680,000 Native Hawaiian people lived in the United States in 2020, and a little less than half of them lived in Hawai‘i.","Hawaiian is very similar to other languages that are spoken on the Polynesian Islands of the Pacific Ocean, including Tahitian, Samoan, and Māori.","Besides Native Hawaiians, tens of thousands of people from other Pacific Islander communities live in Hawai‘i today, including over 37,000 Samoans."],"a":0,"r":"Choice A is the best answer because it presents a statement that, if true, would most directly support the claim that the number of young people who speak Hawaiian has increased because of the ‘Aha Pūnana Leo school. The text explains that Native Hawaiian teachers founded the school to help preserve the Hawaiian language by teaching it to children at a time when an increasing number of Native Hawaiians were speaking English instead. If it is true that when ‘Aha Pūnana Leo was founded fewer than fifty children could speak Hawaiian and that now over 2,000 students at the school can speak it, that would directly demonstrate that the school’s efforts have led to a greater number of young people speaking Hawaiian. Choice B is incorrect because information about the total number and location of Native Hawaiian people in a single year wouldn’t reveal anything about the number of young speakers of Hawaiian (particularly since the text indicates that not all Native Hawaiians speak Hawaiian) or about the effect of the ‘Aha Pūnana Leo school on that number, so it wouldn’t have any bearing on the text’s claim. Choice C is incorrect because the fact that Hawaiian is similar to Tahitian, Samoan, Māori, and other languages of the Polynesian Islands wouldn’t reveal anything about the number of young speakers of Hawaiian or the effect of the ‘Aha Pūnana Leo school on that number, so it wouldn’t have any bearing on the text’s claim. Choice D is incorrect because information about non–Native Hawaiian people from Pacific Islander communities living in Hawai‘i today wouldn’t reveal anything about the number of young speakers of Hawaiian or the effect of the ‘Aha Pūnana Leo school on that number, so it wouldn’t have any bearing on the text’s claim."},{"i":"0147b080","c":"graph","d":"E","s":"","o":["33 meters tall.","47 meters tall.","40 meters tall.","60 meters tall."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the text about the el Castillo pyramid. The table presents information for the location, height, and age of four pyramids, and the task is to use the data from the table to complete the text by choosing the correct height for el Castillo, which the table shows is 40 meters. Choice A is incorrect because, according to the table, el Castillo is 40 meters tall, not 33 meters, which is the height of the Great Pyramid in Mexico. Choice B is incorrect because, according to the table, el Castillo is 40 meters tall, not 47 meters, which is the height of the Pyramid of Sahure in Egypt. Choice D is incorrect because, according to the table, el Castillo is 40 meters tall, not 60 meters, which is the height of the Pyramid of Djoser in Egypt."},{"i":"cebfb2c6","c":"graph","d":"M","s":"","o":["they are much younger than the samples brought back from any of the Apollo missions.","they were collected from the same landing site as the Apollo 11 mission.","they are closest in age to the samples brought back by the Apollo 17 mission.","they helped confirm the predicted ages of the lunar samples from the Apollo missions."],"a":0,"r":"Choice A is the best answer because it effectively uses data from the table to complete the claim about the significance of the Chang’e 5 lunar samples. The table shows the approximate ages of lunar samples from four different missions: three Apollo missions and the Chang’e 5 mission. The Chang’e 5 samples are said to be approximately 2 billion years old, while the Apollo samples are each said to be more than 3 billion years old. In other words, based on the data in the table, the Chang’e 5 samples are much younger than those from the Apollo missions. Choice B is incorrect because the table shows that the Chang’e 5 samples were taken from a landing site at Oceanus Procellarum, which none of the Apollo missions are shown to have visited. Choice C is incorrect because the table shows the Apollo 17 samples as approximately 3.8 billion years old, the Apollo 15 samples as approximately 3.3 billion years old, and the Chang’e 5 samples as approximately 2 billion years old, and therefore, the Chang’e samples are closer in age to the Apollo 15 samples than they are to the Apollo 17 samples. Choice D is incorrect because nothing in the text or table suggests that the Chang’e 5 samples were used to confirm the ages of the Apollo samples."},{"i":"96e5da01","c":"fss","d":"E","s":"The alga species Chlorella vulgaris is very efficient at making oxygen. For this reason, scientists are currently exploring ways to use this species in space. C. vulgaris might be used, for example, to build future biological air exchange systems that ______ oxygen for astronauts.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are producing","produced","produce","have produced"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verbs to express tense. Simple present tense verbs can be used to describe actions that tend to occur, including in a hypothetical or future scenario. In this case, the simple present tense verb “produce” indicates what the air exchange systems might be able to do in the future (produce oxygen for astronauts). Choice A is incorrect. The present progressive tense verb “are producing” suggests that the oxygen is currently being produced, not that it might be produced in the future. Choice B is incorrect because the past tense verb “produced” suggests that the oxygen was produced in the past, not that it might be produced in the future. Choice D is incorrect because the present perfect tense verb “have produced” suggests that the oxygen has been produced from a point in the past up to the present, not that it might be produced in the future."},{"i":"983d33fa","c":"fss","d":"E","s":"In 1637, the price of tulips skyrocketed in Amsterdam, with single bulbs of rare varieties selling for up to the equivalent of $200,000 in today’s US dollars. Some historians ______ that this “tulip mania” was the first historical instance of an asset bubble, which occurs when investors drive prices to highs not supported by actual demand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["claiming","claim","having claimed","to claim"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of finite and nonfinite verb forms within a sentence. A main clause requires a finite verb to perform the action of the subject (in this case, “some historians”), and this choice supplies the finite present tense verb “claim” to indicate what some historians do. Choice A is incorrect because the nonfinite participle “claiming” doesn’t supply the main clause with a finite verb. Choice C is incorrect because the nonfinite participle “having claimed” doesn’t supply the main clause with a finite verb. Choice D is incorrect because the nonfinite to-infinitive “to claim” doesn’t supply the main clause with a finite verb."},{"i":"f339ee39","c":"fss","d":"E","s":"Multiple newspapers ______ the Spanish-speaking population of Washington, DC, including El Tiempo Latino and Washington Hispanic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["serve","having served","to serve","serving"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, \"multiple newspapers\"), and this choice supplies the finite present tense verb \"serve\" to indicate that there are multiple newspapers serving the Spanish-speaking population of Washington, DC. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having served\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to serve\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"serving\" doesn’t supply the main clause with a finite verb."},{"i":"21e58a83","c":"bound","d":"H","s":"Jetties—long, narrow structures that extend from a landmass into the water—are often constructed to protect coastlines from erosion. Jetties can sometimes have the opposite ______ obstructing the natural flow of sand along the shore can lead to increased erosion in some areas.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["effect, though;","effect, though","effect; though","effect, though,"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a comma to separate the supplementary adverb \"though\" from the preceding main clause (\"Jetties can sometimes have the opposite effect\") and uses a semicolon to join the next main clause (\"obstructing…areas\") to the rest of the sentence. Further, placing the semicolon after \"though\" logically indicates that the information earlier in this sentence (that jetties can sometimes cause erosion) is contrary to what might be assumed from the information in the previous sentence (that jetties are often constructed for the purpose of protecting coastlines from erosion). Choice B is incorrect because it fails to mark the boundary between the two main clauses with appropriate punctuation. With \"though…areas\" functioning as a subordinate clause following the comma, this choice illogically indicates that the following information (that obstructing the natural flow of sand along the shore can sometimes lead to erosion) is contrary to the information earlier in the sentence (that jetties can sometimes cause erosion). Instead, the information following \"though\" supports the previous claim about the erosive effects of jetties. Choice C is incorrect because it’s not conventional to use a semicolon in this way to separate a main clause from a dependent clause. Further, it illogically indicates that the following information (that obstructing the natural flow of sand along the shore can sometimes lead to erosion) is contrary to the information earlier in the sentence (that jetties can sometimes cause erosion). Instead, the information following \"though\" supports the previous claim about the erosive effects of jetties. Choice D is incorrect because it results in a comma splice. Commas can’t be used in this way to set off a supplementary word or phrase between two main clauses."},{"i":"2c84f96a","c":"bound","d":"M","s":"In 2017, artists Isabel and Ruben Toledo redesigned the costumes and sets for The Miami City Ballet’s production of The ______ to reviewers, the Toledos’ designs helped infuse the production with elements of Miami’s Latin American culture.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Nutcracker according,","Nutcracker, according","Nutcracker according","Nutcracker. According"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (“In 2017...Nutcracker”) and another (“According...culture”). The supplementary element “according to reviewers” modifies the main clause of the second sentence (“the Toledos’...culture”). Choice A is incorrect because it results in a run-on sentence. The sentences are fused without punctuation and/or a conjunction. Furthermore, no punctuation is needed within the supplementary element “according to reviewers.” Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice C is incorrect because it results in a run-on sentence. The sentences are fused without punctuation and/or a conjunction."},{"i":"441f0505","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: A lever is a simple machine consisting of a rigid beam and a fulcrum. The fulcrum is the point about which the beam pivots. The input force (effort) is the force applied to the lever. The output force (load) is the force that the lever exerts on another object. In first-class levers, the fulcrum is located between the effort and the load. In second-class levers, the load is located between the effort and the fulcrum. The student wants to contrast first-class levers and second-class levers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In levers, the effort is the force applied to the lever; the load, in contrast, is the force that the lever exerts on another object.","In first-class and second-class levers, the fulcrum and the load are in different locations.","First-class levers are simple machines consisting of a rigid beam and a fulcrum, but then again, the same is true of second-class levers.","In first-class levers, the fulcrum is located between the effort and the load, but in second-class levers, the load is located between the effort and the fulcrum."],"a":3,"r":"Choice D is the best answer. The sentence contrasts first-class levers and second-class levers, explaining that the fulcrum in a first-class lever is between the effort and the load, whereas in a second-class lever the load is between the effort and the fulcrum. Choice A is incorrect. The sentence defines two terms associated with levers; it doesn’t contrast first-class levers and second-class levers. Choice B is incorrect. While the sentence seems to acknowledge a general difference in fulcrum and load locations between first-class and second-class levers, it does not specify what this difference is. Moreover, the sentence could be read as emphasizing a similarity—that in both types of levers, the fulcrum and load are in different locations. The sentence thus fails to effectively contrast the two types of levers. Choice C is incorrect. The sentence describes a similarity between first-class and second-class levers; it doesn’t contrast them."},{"i":"e3bbf2bf","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: In World War I, US soldiers who were members of the Choctaw Nation in Oklahoma participated in the Choctaw Code Talkers program. The Choctaw Code Talkers were trained to relay coded military information in their native language. In World War II, the US Army recruited Navajo (Diné) soldiers to transmit coded messages in their native language. These soldiers were known as the Navajo Code Talkers. The student wants to emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["US soldiers who were members of the Choctaw Nation in Oklahoma used their native language to relay coded information.","In World War II, one group of Navajo (Diné) soldiers was known as the Navajo Code Talkers.","Both the Choctaw Code Talkers and the Navajo Code Talkers transmitted coded military messages in the soldiers’ native languages.","The Choctaw Code Talkers, not the Navajo Code Talkers, served in World War I."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes a similarity between the Choctaw Code Talkers and the Navajo Code Talkers by explaining that both groups used their native languages to transmit coded messages for the military. Choice A is incorrect. The sentence describes the Choctaw Code Talkers; it doesn’t emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers. Choice B is incorrect. The sentence introduces the Navajo Code Talkers; it doesn’t emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers. Choice D is incorrect. The sentence emphasizes a difference between the Choctaw Code Talkers and the Navajo Code Talkers; it doesn’t emphasize a similarity."},{"i":"0c13dea9","c":"trans","d":"M","s":"The chemical trimethylamine N-oxide not only gives fish their fishy smell but also protects them from crushing hydrostatic pressure in deep waters. Trimethylamine N-oxide strengthens the bonds between water molecules in a fish’s body. ______ these water molecules maintain their linked structure at extreme depths, thus preventing pressure-related damage.\n\nWhich choice completes the text with the most logical transition?","o":["Nevertheless,","As a result,","However,","For instance,"],"a":1,"r":"Choice B is the best answer. “As a result” indicates that water molecules maintaining their linked structure at high pressures is caused by the strengthening of these water molecules by trimethylamine N-oxide. So the transition “as a result” fits the context perfectly. Choice A is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the previous one—rather, it’s describing an effect of the phenomenon described in the previous sentence. Choice C is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the previous one; it actually expands on the previous sentence by describing an effect of the strengthened molecules. Choice D is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. The second sentence doesn’t provide an example or instance of the idea in the previous sentence. Instead, it explores the effects of the previous idea in more depth."},{"i":"9e34720b","c":"trans","d":"M","s":"Although those who migrated to California in 1849 dreamed of finding gold nuggets in streambeds, the state’s richest deposits were buried deeply in rock, beyond the reach of individual prospectors. ______ by 1852, many had given up their fortune-hunting dreams and gone to work for one of the large companies capable of managing California’s complex mining operations.\n\nWhich choice completes the text with the most logical transition?","o":["Furthermore,","Still,","Consequently,","Next,"],"a":2,"r":"Choice C is the best answer. “Consequently” logically signals that the information in this sentence—that many individual gold prospectors gave up their fortune-hunting dreams and became employees of mining companies—is a result or consequence of the previous information about the inaccessibility of the state’s gold deposits. Choice A is incorrect because “furthermore” illogically signals that the information in this sentence merely adds to the previous information about the inaccessibility of the state’s gold deposits. Instead, it’s a result or consequence of that information. Choice B is incorrect because “still” illogically signals that the information in this sentence offers a contrast or exception to the previous information about the inaccessibility of the state’s gold deposits. Instead, it’s a result or consequence of that information. Choice D is incorrect because “next” illogically signals that the information in this sentence is the next step in a process. Instead, it’s a result or consequence of the previous information about the inaccessibility of the state’s gold deposits."}],"img":{"0147b080":"iVBORw0KGgoAAAANSUhEUgAAArwAAAD2BAMAAADGyElTAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA0I0lEQVR42u1dd1xUR9d+5t7dpQjsLMWuXIpdwqKIGtuq2KLGtceYKPaSxGCKJfFNUGNLTMTErlHsxoq9K5rYYmERNSYqLLYYFXYWLCjszvfHgoDs6qqYF753n99P2Xvv1GfOzJwz99wZwAEHHHDAAQcccKBEgfjTApeAFwUAy11Pf2txAgB40ycRnkBw0Pk0Ol05mv/STYIHBY function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}
function fb(q){const a=ans[q.i],S=seg(q.r);
 if(a===undefined)return `<p class="v bad">Not answered. The correct answer is ${L[q.a]}.</p><p>${S[L[q.a]]||q.r}</p>`;
 const own=S[L[a]]||q.r;
 return a===q.a?`<p class="v ok">Correct.</p><p>${own}</p>`:`<p class="v bad">Not quite. You chose ${L[a]}.</p><p>${own}</p><p class="v ok">The correct answer is ${L[q.a]}.</p><p>${S[L[q.a]]||""}</p>`}
function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
function sum(){const d=Object.keys(ans).length,ok=Q.filter(q=>ans[q.i]===q.a).length;$("#sum").textContent=done?`Score: ${ok} of ${Q.length} correct (${Math.round(100*ok/Q.length)}%)`:`${d} of ${Q.length} answered`}
function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="re"){if(!done&&Object.keys(ans).length&&!confirm("Clear all your answers and start over?"))return;ans={};done=false;miss=false;draw();scrollTo(0,0)}
 else if(t.id==="sub")submit();
 else if(t.id==="mi"){miss=!miss;draw()}
 else if(t.dataset.k!==undefined&&!done){const a=t.closest("article"),q=Q[a.dataset.n-1];ans[q.i]=+t.dataset.k;a.outerHTML=card(q,+a.dataset.n);sum()}});
draw();
</script></body></html>
