<script>
const D={"t":"Practicetest42","q":[{"i":"8b46bb51","c":"vocab","d":"M","s":"A journalist and well-respected art critic of nineteenth-century Britain, Lady Elizabeth Rigby Eastlake did not hesitate to publish reviews that went against popular opinion. One of her most divisive works was an essay questioning the idea of photography as an emerging medium for fine art: in the essay, Eastlake ______ that the value of photographs was informational rather than creative.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["exposed","asserted","discovered","doubted"],"a":1,"r":"Choice B is the best answer. \"Asserted\" means \"stated confidently.\" Eastlake \"did not hesitate to publish reviews going against popular opinion,\" so we can assume that she was confident in sharing her opinions. Choice A is incorrect. \"Exposed\" means \"made visible by uncovering\" and, when talking about ideas, tends to be used in relation to uncovering the truth. Eastlake was sharing an opinion, not uncovering a truth. Choice C is incorrect. \"Discovered\" means \"found,\" but Eastlake was writing an opinion essay. She was writing her own opinion, not \"discovering\" a new universal truth. Choice D is incorrect. \"Doubted\" means \"didn’t believe in.\" We’re told that Eastlake \"questioned\" the idea that photography could be fine art. Placing \"doubted\" in the blank would actually suggest that Eastlake argued that photos were valuable for creativity and not for information, which is the opposite of what we were told she believes."},{"i":"05575bca","c":"vocab","d":"E","s":"The following text is adapted from Lewis Carroll’s 1871 novel Through the Looking-Glass, and What Alice Found There. Alice, a child, is talking to her cat. “Do you hear the snow against the window-panes, Kitty? How nice and soft it sounds! Just as if someone was kissing the window all over outside.”\n\nAs used in the text, what does the word “soft” most nearly mean?","o":["Gentle","Sensitive","Shapeless","Bland"],"a":0,"r":"Choice A is the best answer because as used in the text, \"soft\" most nearly means gentle. The text portrays Alice speaking about the snow falling against the window, describing it as sounding \"nice\" and similar to someone \"kissing the window.\" These details most strongly suggest that Alice thinks the sound made by the snow falling against the window is gentle. Choice B is incorrect. Although in some contexts, \"gentle\" can mean sensitive, or caring about others’ feelings, that isn’t the meaning in this context; it doesn’t make sense to say that Alice thinks the sound of the snow cares about anything. Choice C is incorrect because the text doesn’t suggest that Alice thinks the sound of the snow is shapeless, or lacks a definite shape; she isn’t indicating how anything looks or feels but, rather, is describing how \"nice\" and gentle the snow sounds. Choice D is incorrect because the text doesn’t suggest that Alice thinks the sound of the snow is bland, or uninteresting; rather, she notices the sound and comments on how \"nice\" it is."},{"i":"428cd2c1","c":"vocab","d":"E","s":"Some people have speculated that two helmets with attached horns discovered in Denmark in 1942 belonged to Vikings, but scholars have long been skeptical. Archaeologist Helle Vandkilde and colleagues recently provided radiocarbon dates for the helmets, and their findings ______ scholars’ skepticism: the helmets date to the Nordic Bronze Age, centuries before the Vikings existed.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["anticipate","inspect","reveal","justify"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the helmets found in Denmark. In this context, “justify” means confirm or give reasons for. The text indicates that scholars have long been skeptical about the supposed Viking origin of two helmets found in Denmark. The radiocarbon dating of the helmets conducted by Vandkilde and colleagues demonstrates that the helmets date from the Nordic Bronze Age, making the helmets too old to have belonged to Vikings. This context supports the idea that the scholars’ skepticism is justified. Choice A is incorrect because “anticipate” means expect or come before, neither of which would make sense in context. The text indicates that scholars have long been skeptical of the idea that the helmets belonged to Vikings. Because the skepticism has existed for a long time, Vandkilde and colleagues’ research couldn’t be said to anticipate it. Instead, the radiocarbon dating results justify or confirm the scholar’s skepticism. Choice B is incorrect because “inspect” means examine or review, which wouldn’t make sense in this context. Research findings are inanimate and therefore unable to inspect scholars’ skepticism. The text focuses on the origin of two helmets, which some people believe belonged to Vikings. Vandkilde and colleagues found that the helmets are from the Nordic Bronze Age and therefore much older than the Vikings. This context suggests that the researchers’ findings justify, not inspect, the scholars’ skepticism. Choice C is incorrect because “reveal” means uncover or report, which wouldn’t make sense in context. The text focuses on the origin of two helmets, which some people believe belonged to Vikings. Vandkilde and colleagues tested the helmets and found that they date to the Nordic Bronze Age and therefore are much older than the Vikings. This context suggests that the researchers’ findings confirm or justify the scholars’ skepticism, which was already known so didn’t need to be revealed."},{"i":"10c236ce","c":"vocab","d":"H","s":"Text corpora such as the Bank of English are enormous collections of electronically stored texts that can be used for empirical testing of hypotheses regarding the frequency of typical word usage. If one has a ______ that the word “get” has a high incidence in English, for example, an analysis of a corpus can support that hypothesis by showing that “get” is the fifth most commonly used verb.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["recognition","scheme","supposition","synopsis"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of testing hypotheses regarding usage by means of text corpora. In this context, \"supposition\" refers to an assumption or hypothesis that is not yet proven. The text explains that text corpora can be used for \"empirical testing of hypotheses regarding the frequency of typical word usage\" and then provides a specific example of using corpus analysis to support a claim about the word \"get.\" The word \"supposition\" precisely conveys this idea of an assumption or hypothesis about word frequency that can then be tested against empirical data. Choice A is incorrect because it wouldn’t make sense to say that someone has a \"recognition\" that the word \"get\" has a high incidence in English. Recognition implies acknowledging something already established as true or valid, but the text indicates that corpus analysis is needed to support the claim about \"get,\" suggesting its high frequency wasn’t already established or previously known. Choice B is incorrect because it wouldn’t make sense to say that someone has a \"scheme\" that the word \"get\" has a high incidence in English. A scheme is a plan or systematic arrangement, but the context indicates what’s needed is a preliminary hypothesis that can be tested with corpus data, not a plan related to word frequency. Choice D is incorrect because it wouldn’t make sense to say that someone has a \"synopsis\" that the word \"get\" has a high incidence in English. A synopsis is a summary or outline, but the text is discussing an initial hypothesis about word frequency that requires testing, not a condensed statement of existing information."},{"i":"b13378c8","c":"purpose","d":"M","s":"Early in the Great Migration of 1910–1970, which involved the mass migration of Black people from the southern to the northern United States, political activist and Chicago Defender writer Fannie Barrier Williams was instrumental in helping other Black women establish themselves in the North. Many women hoped for better employment opportunities in the North because, in the South, they faced much competition for domestic employment and men tended to get agricultural work. To aid with this transition, Barrier Williams helped secure job placement in the North for many women before they even began their journey.\n\nWhich choice best states the main purpose of the text?","o":["To introduce and illustrate Barrier Williams’s integral role in supporting other Black women as their circumstances changed during part of the Great Migration","To establish that Barrier Williams used her professional connections to arrange employment for other Black women, including jobs with the Chicago Defender","To demonstrate that the factors that motivated the start of the Great Migration were different for Black women than they were for Black men","To provide an overview of the employment challenges faced by Black women in the agricultural and domestic spheres in the southern United States"],"a":0,"r":"Choice A is the best answer because it most accurately describes the text’s purpose, which is to discuss the important role Barrier Williams played in supporting many other Black women as they relocated to the northern United States during the early years of the Great Migration. After introducing Barrier Williams, the text describes how she helped find jobs for other Black women, who in many cases relocated in search of better employment prospects than the South could offer at the time. The text indicates that by doing so, she eased these women’s transition as their circumstances changed. Choice B is incorrect. Although the text mentions Barrier Williams’s work as a political activist and writer for the Chicago Defender, it doesn’t discuss any professional connections she made in these roles or indicate that she used any such connections in her work to secure employment for other Black women. Choice C is incorrect. Although the text discusses a factor that caused many women to relocate during the Great Migration, their difficulty finding employment in the South, the text doesn’t indicate that this factor motivated the start of the Great Migration. Moreover, the text doesn’t discuss the factors that motivated Black men to migrate. Choice D is incorrect. Although the text mentions the difficult employment prospects for Black women in the domestic and agricultural sectors in the South during the Great Migration, the text’s main purpose isn’t to provide an overview of the employment challenges Black women faced in these sectors. Rather, it provides this information to show that Barrier Williams played a crucial role in supporting many Black women who relocated to the North by helping them achieve one of their main goals, securing a job."},{"i":"2b085bc6","c":"purpose","d":"M","s":"The following text is adapted from Paul Laurence Dunbar’s 1902 novel The Sport of the Gods. Joe and some of his family members have recently moved to New York City. [Joe] was wild with enthusiasm and with a desire to be a part of all that the metropolis meant. In the evening he saw the young fellows passing by dressed in their spruce clothes, and he wondered with a sort of envy where they could be going. Back home there had been no place much worth going to, except church and one or two people’s houses.\n\nWhich choice best states the main purpose of the text?","o":["It illustrates a character’s reaction to a new environment.","It explains why a character has traveled to a city.","It compares a character’s thoughts about an event at two different times of day.","It presents a character feeling regret over leaving home."],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text. The narrator describes how Joe responds to being in “the metropolis”: he’s excited and “wild with enthusiasm.” He also envies the young fellows who walk by because, dressed as they are, they look as if they have somewhere special to go. The text contrasts this new place with the place Joe comes from, where apparently there wasn’t as much to do. Thus, the main purpose of the text is to illustrate Joe’s reaction to a new environment. Choice B is incorrect because the text makes no reference to why Joe has moved. The narrator indicates that Joe is enthusiastic about being in a city, but there’s no explanation provided for the move. Choice C is incorrect because the text makes no reference to how Joe thinks about an event. The narrator describes young men passing by in the evening and then recalls places worth going to at home—church and a few people’s houses—but there’s no explicit comparison made nor is a time of day mentioned for these events back home. Choice D is incorrect because the text doesn’t support the idea that Joe feels regret over leaving home. Instead, Joe is described as “wild with enthusiasm” at being in the city. Joe’s home is mentioned, but only to compare it unfavorably with the city."},{"i":"47598085","c":"func","d":"M","s":"<u>Yawn contagion occurs when one individual yawns in response to another’s yawn.<\/u> Studies of this behavior in primates have focused on populations in captivity, but biologist Elisabetta Palagi and her colleagues have shown that it can occur in wild primate populations as well. In their study, which focused on a wild population of gelada monkeys (Theropithecus gelada) in Ethiopia, the researchers further reported that yawn contagion most commonly occurred in males and across different social groups instead of within a single social group.\n\nWhich choice best describes the function of the first sentence in the text as a whole?","o":["It defines a phenomenon that is discussed in the text.","It introduces a problem that is examined in the text.","It makes a claim that is challenged in the text.","It presents a hypothesis that is evaluated in the text."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the first sentence functions in the text as a whole. The first sentence introduces what yawn contagion is, explaining that it occurs when an individual yawns in response to the yawn of another individual. The text goes on to describe Elisabetta Palagi and her colleagues’ study of this phenomenon in a wild population of gelada monkeys. According to the text, the study showed that wild primate populations experience yawn contagion and that the behavior occurs most commonly in male monkeys and across social groups. Thus, the function of the first sentence is to define the phenomenon of yawn contagion that is discussed in the text. Choice B is incorrect. Although the first sentence introduces the text’s discussion of yawn contagion, it doesn’t present this behavior, or anything else, as a problem. Choice C is incorrect because the first sentence doesn’t present a claim but instead explains what yawn contagion is. Moreover, the text doesn’t challenge anything; it’s an informative text that describes the findings of a research study about yawning in wild primate populations. Choice D is incorrect. Although the text describes a scientific study, and most scientific studies are guided by a hypothesis, the text doesn’t say what Palagi and her colleagues’ hypothesis was; the text discusses their findings instead."},{"i":"ac9a3a26","c":"func","d":"H","s":"According to historian Vicki L. Ruiz, Mexican American women made crucial contributions to the labor movement during World War II. At the time, food processing companies entered into contracts to supply United States armed forces with canned goods. Increased production quotas conferred greater bargaining power on the companies’ employees, many of whom were Mexican American women: <u>employees insisted on more favorable benefits, and employers, who were anxious to fulfill the contracts, complied.<\/u> Thus, labor activism became a platform for Mexican American women to assert their agency.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It elaborates on a claim about labor relations in a particular industry made earlier in the text.","It offers an example of a trend in the World War II–era economy discussed earlier in the text.","It notes a possible exception to the historical narrative of labor activism sketched earlier in the text.","It provides further details about the identities of the workers discussed earlier in the text."],"a":0,"r":"Choice A is the best answer because it best describes how the underlined portion functions in the text as a whole. The text says that the increased production quotas of food processing companies during World War II enabled employees to make better bargains in exchange for their labor. The underlined portion presents an example of this increased bargaining power: employees requested more favorable benefits, and employers complied because they were under pressure to fulfill the demanding terms of their contracts. Thus, the underlined portion of the text elaborates on a claim about labor relations in a particular industry (food processing) made earlier in the text. Choice B is incorrect because there is no indication in the text that the economic factors that influenced food processing also influenced other parts of the economy; thus, the bargaining described in the underlined portion of the text cannot be called an example of a trend. Choice C is incorrect because the underlined portion supports the historical narrative of labor activism in food processing that is sketched in the text, instead of noting an exception to that narrative. Choice D is incorrect because while the underlined portion does discuss the demands that workers made in exchange for their labor, it does not discuss the identities of the workers."},{"i":"105ea6de","c":"cross","d":"H","s":"Text 1 Growth in the use of novel nanohybrids—materials created from the conjugation of multiple distinct nanomaterials, such as iron oxide and gold nanomaterials conjugated for use in magnetic imaging—has outpaced studies of nanohybrids’ environmental risks. Unfortunately, risk evaluations based on nanohybrids’ constituents are not reliable: <u>conjugation may alter constituents’ physiochemical properties such that innocuous nanomaterials form a nanohybrid that is anything but<\/u>.\n\nText 2 The potential for enhanced toxicity of nanohybrids relative to the toxicity of constituent nanomaterials has drawn deserved attention, but the effects of nanomaterial conjugation vary by case. For instance, it was recently shown that a nanohybrid of silicon dioxide and zinc oxide preserved the desired optical transparency of zinc oxide nanoparticles while mitigating the nanoparticles’ potential to damage DNA.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the assertion in the underlined portion of\n\nText 1?","o":["By concurring that the risk described in Text 1 should be evaluated but emphasizing that the risk is more than offset by the potential benefits of nanomaterial conjugation","By arguing that the situation described in Text 1 may not be representative but conceding that the effects of nanomaterial conjugation are harder to predict than researchers had expected","By denying that the circumstance described in Text 1 is likely to occur but acknowledging that many aspects of nanomaterial conjugation are still poorly understood","By agreeing that the possibility described in Text 1 is a cause for concern but pointing out that nanomaterial conjugation does not inevitably produce that result"],"a":3,"r":"Choice D is the best answer. The author of Text 2 acknowledges that nanohybrids may be more toxic than their constituent parts, but also provides an example of a nanohybrid that has reduced toxicity compared to its components: silicon dioxide and zinc oxide together have all the benefits of zinc oxide nanoparticles without any of the DNA harm zinc oxide has on its own. Choice A is incorrect. While the author of Text 2 gives an example of a nanohybrid that isn’t as toxic as its constituent parts, they don’t argue that the benefit outweighs the risk. They merely argue that “the effects of nanomaterial conjugation vary by case.” Choice B is incorrect. The author of Text 2 states that the effects of nanomaterial conjugation “vary by case,” and that the attention that their potential toxicity has drawn is warranted. If the situation in Text 1 weren’t representative, then there would be less attention to the potential danger of these materials. Furthermore, neither passage suggests that researchers had expected that they could predict the effects of nanomaterial conjugation. Choice C is incorrect. The author of Text 2 agrees that the potential toxicity of nanohybrids “has drawn deserved attention,” so they aren’t denying the problem."},{"i":"1ba5ad7a","c":"main","d":"H","s":"Many literary theorists distinguish between fabula, a narrative’s content, and syuzhet, a narrative’s arrangement and presentation of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative—he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by interactions between the artist, the work, and the audience.\n\nWhich choice best states the main idea of the text?","o":["Literary theorist Mikhail Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives.","Literary theorist Mikhail Bakhtin claimed that meaning is not inherent in a narrative but is created when an audience encounters a narrative so that narratives are interpreted differently by different people.","The storytelling methods used in The Godfather Part II may seem unusually complicated, but they can be easily understood when two concepts from literary theory are utilized.","Narratives that are told out of chronological order are more difficult for audiences to understand than are narratives presented chronologically."],"a":0,"r":"Choice A is the best answer because it most accurately states the main idea of the text. The text begins by explaining that many literary theorists rely on the concepts of fabula (a narrative’s content) and syuzhet (a narrative’s arrangement and presentation of events) and illustrates these concepts by explaining how they can be applied to the film The Godfather Part II. The text then discusses how Mikhail Bakhtin, a literary theorist, argued that fabula and syuzhet can’t fully describe a narrative, since systematic categorizations such as these fail to account for all the ways in which interactions between the artist, the work, and the audience produce meaning. Thus, the main idea is that Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives. Choice B is incorrect because according to the text, Mikhail Bakhtin believed that meaning was created through the interactions of the artist, narrative, and audience, not simply through the interaction between the audience and narrative; moreover, the text doesn’t address whether Bakhtin focused on the ways in which different people interpret narratives differently. Choice C is incorrect. Although the text implies that the storytelling methods used in The Godfather Part II are complicated, it discusses the film only to illustrate how the concepts of fabula and syuzhet may be applied to a narrative. The film’s storytelling methods aren’t the primary focus of the text. Choice D is incorrect. The text discusses The Godfather Part II, whose narrative doesn’t adhere to a single chronological order, only to illustrate the concepts of fabula (a narrative’s content) and syuzhet (a narrative’s arrangement and presentation of events). The primary focus of this text isn’t the structure of this film or of other narratives that are told out of chronological order; moreover, the text doesn’t consider whether such structures make it harder for audiences to understand narratives."},{"i":"96802cc0","c":"main","d":"H","s":"For centuries, the widespread acknowledgment of the involvement of the cerebellum—a dense brain structure in vertebrates—in coordinating motor control in humans has hindered recognition of other possible functions of the structure. Neuroscience research from the last two decades now suggests that the cerebellum regulates emotion and social behavior, and recent research by Ilaria Carta and colleagues has identified a pathway connecting the cerebellum to a center for motivation and reward processing known as the ventral tegmental area (VTA).\n\nWhich choice best states the main idea of the text?","o":["The recent verification of a pathway between the VTA and the cerebellum confirms the cerebellum’s long-suspected role in motor coordination.","Recent advances in the field of neuroscience have challenged widely accepted claims about the function of a pathway connecting the VTA and the cerebellum.","The cerebellum has primarily been thought to regulate motor functioning, but in recent years neuroscience researchers have been uncovering additional functions.","Technological limitations have historically hindered the study of the cerebellum, but the recent development of new technologies has led to greater insights into its functions."],"a":2,"r":"Choice C is the best answer. The text says that the cerebellum has long been thought to regulate motor functioning, but new research shows that it may also have other functions—including regulating emotion and social behavior and some connection to motivation and rewards processing. Choice A is incorrect. The VTA is described as “a center for motivation and reward processing,” and the discovery of the pathway between the VTA and the cerebellum supports the theory that the cerebellum is involved in functions other than motor coordination. Choice B is incorrect. The text says that recent research has identified this pathway, but it doesn’t discuss any previous “widely accepted claims” about the pathway’s function. The “widespread acknowledgement” mentioned early in the passage is about the cerebellum alone, not its connection to the VTA. Choice D is incorrect. The text never discusses any technological limitations or any new technologies."},{"i":"e9521fd1","c":"infer","d":"H","s":"The Uto-Aztecan language family is divided into a northern branch, which includes the Shoshone language of present-day Idaho and Utah, and a southern one, whose best-known representative is Nahuatl, the language of the Aztec Empire in Mexico. Lexical similarities across the family, including of botanical terms, confirm descent from a single language spoken millennia ago, and the family’s geographical distribution suggests an origin in what is now the US Southwest. However, vocabulary pertaining to maize isn’t shared between northern and southern branches, despite the crop’s universal cultivation among Uto-Aztecan tribes. Given archaeological evidence that maize originated in Mexico and diffused northward into what became the US Southwest, some linguists reason that ______ Which choice most logically completes the text?","o":["northern Uto-Aztecan tribes likely obtained the crop directly from a southern Uto-Aztecan tribe rather than from a non-Uto-Aztecan tribe.","variation in maize-related vocabulary within each branch of the Uto-Aztecan family likely reflects regionally specific methods for cultivating the crop.","southern Uto-Aztecan tribes likely acquired maize at roughly the same time as northern Uto-Aztecan tribes did, though from different sources.","the family’s division into northern and southern branches likely preceded the acquisition of the crop by the Uto-Aztecan tribes."],"a":3,"r":"Choice D is the best answer because it most logically completes the discussion of Uto-Aztecan languages. The text explains that the northern and southern branches of the Uto-Aztecan language family descended from a single language (believed to have originated in what is now the US Southwest), resulting in similarities across the family’s languages; however, the branches don’t have similar vocabulary for maize, even though maize has been cultivated by all Uto-Aztecan tribes. The text also indicates that maize originated in Mexico and spread northward into what is now the US Southwest—the area where the Uto-Aztecan language family originated. It follows, then, that the language family had already divided into northern and southern branches before maize reached that area; if maize had been present before the division occurred, the family’s origin language would have had terminology for it that likely would have been reflected in the branches, meaning they would have had similar vocabulary for maize. If maize arrived after the division occurred, however, the tribes in the two regions likely would have developed vocabulary pertaining to maize separately, at the times when they acquired the crop. Choice A is incorrect because the text focuses on vocabulary pertaining to maize in the branches of the Uto-Aztecan language family, and referring only to how some Uto-Aztecan tribes obtained maize wouldn’t directly address the role of language. Moreover, if northern Uto-Aztecan tribes had acquired maize from a southern Uto-Aztecan tribe, it’s reasonable to assume that the northern tribes might have also picked up southern Uto-Aztecan terminology for maize in that exchange. Choice B is incorrect because the text discusses the fact that the northern and southern branches of the Uto-Aztecan language family don’t have shared vocabulary pertaining to maize, not the idea that there are variations in such vocabulary within each branch—that is, the text focuses on differences between the two branches, not on differences between languages within a branch. Choice C is incorrect because the text focuses on vocabulary pertaining to maize in the branches of the Uto-Aztecan language family, and referring only to the timing and source of maize acquisition wouldn’t directly address the role of language. Furthermore, the text implies that southern Uto-Aztecan tribes probably acquired maize before the northern tribes did, given the evidence that maize originated in Mexico—the location of the best-known representative of the southern branch of the Uto-Aztecan language family—before spreading to the north."},{"i":"4889580c","c":"infer","d":"H","s":"Archaeologists and historians used to believe that the Maya civilization during its Classic period (roughly 250–900) lacked agricultural marketplaces. One reason for this belief was that these scholars misunderstood the ecology of the regions the Maya inhabited. Marketplaces typically emerge because different individuals or groups want to trade resources they control for resources they don’t control. Scholars seriously underestimated the ecological diversity of the Maya landscape and thus assumed that ______ Which choice most logically completes the text?","o":["marketplaces likely would not have attracted many traders from outside the regions controlled by the Maya.","farming practices would have been largely the same throughout Maya lands even if the crops people produced varied significantly.","marketplaces would not have enabled Maya people to acquire many products different from those they already produced.","farmers would trade agricultural products only if they had already produced enough to meet their own needs."],"a":2,"r":"Choice C is the best answer because it presents the conclusion that most logically follows from the text’s discussion of scholars’ understanding of Maya ecology and agricultural marketplaces. The text indicates that scholars used to believe that during the Classic period, the Maya civilization didn’t have agricultural marketplaces. According to the text, scholars held this view because they misunderstood the ecology of areas where the Maya lived. The text points out that people tend to create marketplaces in order to acquire resources they don’t otherwise control. Agricultural marketplaces would have allowed farmers who produced one type of crop to trade that crop for other types of crops that they didn’t produce. The text goes on to say, however, that scholars underestimated the ecological diversity of the Maya areas, meaning that scholars thought that the Maya landscape produced a smaller range of resources than it actually produced. Taken together, then, this information suggests that scholars assumed that marketplaces wouldn’t have allowed Maya people to acquire products different from the products they already produced: that is, if everyone produced the same array of crops, as scholars mistakenly believed, then there wouldn’t have been any need for marketplaces where people could trade those crops. Choice A is incorrect because the text doesn’t say anything about trade between the Maya and people from outside the regions controlled by the Maya. Although scholars’ mistaken belief that the Maya lands weren’t very ecologically diverse would give those scholars a reason to think that the Maya didn’t have marketplaces, it wouldn’t lead scholars to assume that traders from outside Maya lands were uninterested in acquiring resources produced by the Maya. Even if the Maya actually did produce only a small array of resources throughout their lands, there is no reason to believe from the text that people outside Maya lands also produced these same resources and thus would have no need to trade with the Maya people. Choice B is incorrect because the text indicates that scholars underestimated the ecological diversity of the Maya lands, which suggests that they mistakenly believed that the Maya produced a relatively small array of resources throughout their territory, not that the crops the Maya produced varied significantly throughout the Maya lands. Although the scholars might have assumed that a lack of ecological diversity suggests that Maya farming practices were largely the same everywhere, the text does not support that they also assumed there was a lot of variation in the crops that Maya people produced. In fact, the text states that marketplaces emerge when people want to obtain resources they don’t already control. If it were the case that scholars assumed that the crops Maya people produced varied significantly, this would have led them to conclude that Maya people likely established marketplaces so they could trade for resources they didn’t already possess, not that the Maya civilization lacked marketplaces. Choice D is incorrect because nothing in the text suggests that scholars assumed that farmers wouldn’t trade their agricultural products unless they had already met their own needs with those products. Instead, the text says that scholars thought that the Maya lands produced a smaller array of resources than they actually did, which the text suggests led scholars to assume that the Maya didn’t have any need for marketplaces. The scholars’ mistaken belief has no bearing on the issue of whether farmers met their own needs before trading their products."},{"i":"124fdcd7","c":"claim","d":"H","s":"Many archaeologists will tell you that categorizing excavated fragments of pottery by style, period, and what objects they belong to relies not only on standard criteria, but also on instinct developed over years of practice. In a recent study, however, researchers trained a deep-learning computer model on thousands of images of pottery fragments and found that it could categorize them as accurately as a team of expert archaeologists. Some archaeologists have expressed concern that they might be replaced by such computer models, but the researchers claim that outcome is highly unlikely.\n\nWhich finding, if true, would most directly support the researchers’ claim?","o":["In the researchers’ study, the model was able to categorize the pottery fragments much more quickly than the archaeologists could.","In the researchers’ study, neither the model nor the archeologists were able to accurately categorize all the pottery fragments that were presented.","A survey of archaeologists showed that categorizing pottery fragments limits the amount of time they can dedicate to other important tasks that only human experts can do.","A survey of archaeologists showed that few of them received dedicated training in how to properly categorize pottery fragments."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would support the researchers’ claim that archaeologists are unlikely to be replaced by certain computer models. The text explains that although archaeologists hold that categorizing pottery fragments relies on both objective criteria and instinct developed through direct experience, researchers have found that a computer model can categorize the fragments with the same degree of accuracy as the humans can—a finding that has caused some archaeologists to worry that their own work won’t be needed any longer. If survey results indicate that categorizing pottery fragments limits the amount of time archaeologists can dedicate to other important tasks that only human experts can do, that would mean that computer models aren’t able to do all of the important things archaeologists do, thus supporting the researchers’ claim that computer models are unlikely to replace human archaeologists. Choice A is incorrect because if it were true that the computer model could categorize the pottery fragments much more quickly than the archaeologists could, that would weaken the researchers’ claim that archaeologists are unlikely to be replaced by certain computer models, since it would demonstrate that the models could conduct the archaeologists’ work not only with equal accuracy but also at a faster pace. Choice B is incorrect because the inability of both the computer model and the archaeologists to accurately categorize all of the pottery fragments presented wouldn’t support the researchers’ claim that archaeologists are unlikely to be replaced by certain computer models. The text indicates that some archaeologists are worried because the computer model’s accuracy is equal to their own, and that could be the case whether both were perfectly accurate or were unable to achieve complete accuracy. Choice D is incorrect because survey results showing that few archaeologists received special training in properly categorizing pottery fragments wouldn’t support the researchers’ claim that archaeologists are unlikely to be replaced by certain computer models. The amount of special training in categorizing pottery fragments that archaeologists have received has no direct bearing on whether computer models’ success at categorizing fragments will lead to the models replacing the archaeologists."},{"i":"eaf22802","c":"claim","d":"H","s":"A student in a political science course is writing a paper on Aristotle’s The Politics, in which Aristotle offers his opinion on political instability and gives advice on how constitutions can be preserved. Aristotle observes that different forms of government can fall in different ways—for example, oligarchies might grant power to military leaders during wartime who refuse to relinquish that power during peacetime—but some methods of preserving order apply across all forms of government. The student claims that in particular Aristotle asserts that in a healthy state obedience to law must be as close to absolute as possible and that even minor infractions should not be ignored.\n\nWhich quotation from a philosopher’s analysis of The Politics would best support the student’s claim?","o":["“When constructing his argument regarding the characteristics of a well-functioning government, Aristotle asserts that ‘Transgression creeps in unperceived and at last ruins the state,’ illustrating this idea with a comparison to frequent small expenditures slowly and almost imperceptibly chipping away at a fortune until it is ultimately depleted.”","“When Aristotle writes on the necessity of avoiding corruption in government, he proposes that ‘every state should be so administered and so regulated by law that its magistrates cannot possibly make money.’ In particular, he thinks oligarchies are particularly susceptible to corruption through bribery.”","“When Aristotle considers the health of constitutions, he states that ‘Constitutions are preserved when their destroyers are at a distance, and sometimes also because they are near, for the fear of them makes the government keep in hand the constitution.’ He holds that rulers who wish to see constitutions preserved must continually remind the populace of the dangers that would result from a constitutional collapse.”","“When contrasting different forms of government, Aristotle holds that ‘oligarchies may last, not from any inherent stability in such forms of government, but because the rulers are on good terms both with the unenfranchised and with the governing classes.’That is, oligarchic leaders who wish to hold on to power will introduce members of disenfranchised classes into government in a participatory role.”"],"a":0,"r":"Choice A is the best answer because it presents the quotation that best supports the student’s claim that in The Politics, Aristotle gives advice on preserving constitutions—preventing governments from falling and maintaining order—and specifically asserts that in a healthy state, laws must be followed as strictly as possible and infractions should not be overlooked even if they are minor. The philosopher states that when Aristotle builds his argument about the characteristics of a well-functioning government, Aristotle asserts that transgression, or violation of law, will ruin the state if it \"creeps in unperceived,\" or goes unnoticed. The philosopher then adds that Aristotle illustrates this point by comparing the situation to one in which small but frequent expenses diminish a fortune almost unnoticeably until, eventually, the fortune is entirely gone. In other words, the philosopher indicates that Aristotle makes the point that total obedience to law preserves a healthy state while even small violations, if ignored, will undermine the health of the state. Choice B is incorrect because the philosopher addresses Aristotle’s observation about corruption within the government (in particular, preventing the possibility that members of the government can take bribes), and although corruption can involve infractions, the observation is about a subset of people within the state and isn’t directly connected to the importance of upholding total obedience to the law throughout the state. Choice C is incorrect because the philosopher discusses Aristotle’s point about those who would intentionally destroy a constitution altogether and the need for rulers to remind the populace that it would be dangerous for a constitution to collapse, but neither idea is directly connected to the importance of upholding total obedience to the law. Choice D is incorrect because the philosopher explains that Aristotle makes the point that oligarchic leaders may retain power by having members of disenfranchised classes participate in government alongside governing classes, and this point doesn’t address the importance of ensuring obedience to the law and addressing even minor violations."},{"i":"303bcc41","c":"graph","d":"E","s":"","o":["wild boar.","eastern gray kangaroo.","African bush elephant.","white-tailed deer."],"a":3,"r":"Choice D is the best answer because it accurately identifies the species with the highest global biomass, the white-tailed deer at approximately 2.7 million metric tons. The graph shows the global biomass for four wild land mammal species with the highest global biomass. The graph indicates that the African bush elephant’s global biomass is about 1.3 million metric tons, the eastern gray kangaroo’s is about 0.6 million metric tons, and the wild boar’s is about 1.9 million metric tons. These values are all lower than the global biomass for the white-tailed deer’s approximately 2.7 million metric tons. Thus, the white-tailed deer is the species with the highest global biomass. Choice A is incorrect because although the graph indicates that the wild boar has a relatively high global biomass of about 1.9 million metric tons, it is not the species with the highest value. The white-tailed deer is the species with the highest global biomass at about 2.7 million metric tons. Choice B is incorrect because the eastern gray kangaroo has the lowest global biomass value shown on the graph at about 0.6 million metric tons, not the highest global biomass. The white-tailed deer has the highest at about 2.7 million metric tons. Choice C is incorrect because although the African bush elephant has a substantial global biomass of about 1.3 million metric tons, it is not the species with the highest value according to the graph. The white-tailed deer has the highest global biomass at about 2.7 million metric tons."},{"i":"3430be35","c":"graph","d":"H","s":"","o":["the students tended to value the concert tickets more highly than did the more age-diverse group recruited online, but when considering what they could afford to pay, the students tended to choose a lower price than did the other group.","in all three messaging conditions, the group of participants recruited online tended to choose lower prices than did the students, but both groups tended to choose prices closest to the actual cost of the tickets when prompted to consider the tickets’ value.","the students tended to value the concert tickets more highly than did the more age-diverse group recruited online, but both groups tended to choose a higher price when considering the value of the tickets than when considering what they could afford or wanted to pay.","within each group of participants, there was wide variation in the value that individuals assigned to the concert tickets, but the students tended to assign a higher value to the tickets than did the more age-diverse group recruited online."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the graph to complete the text about the effect of messaging on participative pricing. The graph shows mean ticket prices chosen by participants in response to three messages across two studies: Study 1, which the text indicates was conducted with an age-diverse group recruited online, and Study 2, which was conducted with student participants. The graph indicates that in the \"pay what you think it’s worth\" condition, the mean price of the concert tickets in Study 2 was about $74, which is greater than the mean price of about $55 in Study 1. In other words, when participants were asked to consider their valuation of the tickets, the response was heterogeneous, or mixed. Moreover, according to the graph, both Study 1 and Study 2 show higher prices for the tickets under the \"pay what you think it’s worth\" condition than they do under both the \"pay what you can\" and the \"pay what you want\" conditions. That is, the data suggest that both groups of participants named higher prices when considering the value of the tickets than when considering either what they could afford or wanted to pay, a finding that supports the idea that sellers can benefit when prompting consumers to consider their own valuations when they choose prices. Choice A is incorrect because it contradicts information in the graph. Although the graph shows that students in Study 2 assigned a higher value to the tickets than did the age-diverse group in Study 1, which would support the idea that consumer valuations were heterogeneous, the graph shows that in the \"pay what you can\" (i.e., what you can afford) condition, the students in Study 2 assigned a higher price (about $40), not a lower price, than the age-diverse group in Study 1 did (about $30). Moreover, even if it were true that the students had assigned a lower price in this condition, it wouldn’t support the result described in the text, only that the participants across the two studies had different ideas of what they can afford to pay. Choice B is incorrect. Although a finding that participants tended to choose prices that were closest to the actual ticket costs in the \"pay what you think it’s worth\" condition would support the idea that sellers benefit by prompting consumers to think about their own valuations (since it’s implied that sellers would lose money in the other conditions, where chosen prices were lower than the participants’ valuations), neither the text nor the graph addresses how any of the prices chosen by the study participants relate to the tickets’ actual market price. Choice D is incorrect. Although the wide variation in participant valuations would support the idea that consumer valuations tend to be heterogeneous, neither the text nor the graph provides any information from which to discern the relative levels of variance among the responses from participants in either study."},{"i":"819c443d","c":"fss","d":"M","s":"In January 1776, Thomas Paine published Common Sense, an appeal for freedom from the British monarchy that famously helped ignite the desire for independence among the American colonists. After the colonies achieved their independence, Paine moved to Paris, where the provocative ______ would contribute to another revolution—the French Revolution.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["authors political writings","author’s political writings","author’s political writing’s","authors’ political writings’"],"a":1,"r":"Choice B is the best answer. The conventions being tested are the use of plural and possessive nouns. The singular possessive noun \"author’s\" correctly indicates that the political writings are those of Thomas Paine, and the plural noun \"writings\" correctly indicates that multiple works by Paine are being discussed. Choice A is incorrect because the context requires the singular possessive noun \"author’s,\" not the plural noun \"authors.\" Choice C is incorrect because the context requires the plural noun \"writings,\" not the singular possessive noun \"writing’s.\" Choice D is incorrect because the context requires the singular possessive noun \"author’s\" and the plural noun \"writings,\" not the plural possessive nouns \"authors’\" and \"writings’.\""},{"i":"003f22c8","c":"fss","d":"M","s":"Every last second of space shuttle mission STS-79, which lasted ten days and three hours, ______ carefully monitored by a team of experts.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have been","are","was","were"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb \"was\" agrees in number with the singular subject \"every last second.\" Choice A is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"every last second.\" Choice B is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"every last second.\" Choice D is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"every last second.\""},{"i":"20ea68b7","c":"fss","d":"M","s":"It can take time for proposed amendments to the US Constitution to become law. For example, the Twenty-Second Amendment, which limits the number of ______ can serve, was first proposed in 1947 but wasn’t approved by the required three-fourths majority of state legislatures until 1951.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["terms presidents","term’s presidents","term’s president’s","terms president’s"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of plural nouns. The plural nouns \"terms\" and \"presidents\" correctly indicate that the amendment involves multiple terms and applies to presidents in general. Choice B is incorrect because the context requires the plural noun \"terms,\" not the singular possessive noun \"term’s.\" Choice C is incorrect because the context requires the plural nouns \"terms\" and \"presidents,\" not the singular possessive nouns \"term’s\" and \"president’s.\" Choice D is incorrect because the context requires the plural noun \"presidents,\" not the singular possessive noun \"president’s.\""},{"i":"eb95235b","c":"bound","d":"H","s":"The Limón technique, developed by Mexican-born dancer and choreographer Jose Limón, is known for its emphasis on breath control and its interplay of weight and ______ dancers may explore, for example, the moment of mid-air suspension at the top of a jump.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["weightlessness","weightlessness which","weightlessness,","weightlessness;"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. This choice uses a semicolon in a conventional way to join the first main clause (\"The Limón…weightlessness\") and the second main clause (\"dancers…jump\"). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect. The relative pronoun \"which\" can’t be used in this way to join two main clauses. Choice C is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."},{"i":"b0115ef6","c":"bound","d":"E","s":"Technologies such as microphones and inkjet printers are made using piezoelectric materials, which generate an internal electric field when pressure is applied to them. The toxic nature of some of these materials recently led a team from the University of Sheffield to investigate how ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["could their use be better regulated?","their use could be better regulated.","their use could be better regulated?","could their use be better regulated."],"a":1,"r":"Choice B is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a period to punctuate a declarative sentence that asks an indirect question (\"The toxic nature of some of these materials recently led a team from the University of Sheffield to investigate how their use could be better regulated\"). Choice A is incorrect because the structure requires a period and a declarative clause at the end of the sentence that states what the team investigated, not an interrogative clause that asks a direct question, such as \"how could their use be better regulated?\" Choice C is incorrect because it’s unconventional to use a question mark in this way to punctuate a declarative sentence. Choice D is incorrect because the structure requires a declarative clause at the end of the sentence that states what the team investigated, not an interrogative clause that asks a direct question, such as \"how could their use be better regulated?\""},{"i":"00460c13","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Novelist Willa Cather grew up in Nebraska and attended the University of Nebraska-Lincoln. Some of Cather’s best-known novels are set in Nebraska. Two such novels are O Pioneers! (1913) and My Ántonia (1918). Cather’s novels describe the experiences of immigrants who settled in the Great Plains. The student wants to identify the setting of Cather’s novel My Ántonia.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["My Ántonia is set in Nebraska, where Cather grew up.","Cather, author of My Ántonia, described the experiences of immigrants in her novels.","Among Cather’s best-known novels are O Pioneers! (1913) and My Ántonia (1918).","Cather attended the University of Nebraska-Lincoln and set some of her novels in Nebraska."],"a":0,"r":"Choice A is the best answer. This choice directly identifies the setting of Cather’s novel My Ántonia as Nebraska. Choice B is incorrect. This choice mentions that Cather wrote about immigrants, but it doesn’t indicate where they lived. Choice C is incorrect. This choice mentions that My Ántonia is one of Cather’s best-known novels but doesn’t state where it takes place. Choice D is incorrect. This choice mentions that some of Cather’s novels are set in Nebraska, but it doesn’t specify which ones, so we can’t be certain that My Ántonia is one of them. It also includes irrelevant information about Cather’s education."},{"i":"5888712f","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Physicist Muluneh Abebe was working on a garment suited for both warm and cold conditions. He analyzed the emissivity, or ability to emit heat, of the materials he planned to use. Abebe found that reflective metal fibers emitted almost no heat and had an emissivity of 0.02. He found that silicon carbide fibers absorbed large amounts of heat and had an emissivity of 0.74. The amount of heat a material absorbs is equal to the amount of heat it emits. The student wants to contrast the emissivity of reflective metal fibers with that of silicon carbide fibers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The ability of reflective metal fibers and silicon carbide fibers to emit heat was determined by an analysis of each material’s emissivity.","The amount of heat a material absorbs is equal to the amount it emits, as evidenced in Abebe’s analyses.","Though the reflective metal fibers and silicon carbide fibers had different rates of emissivity, Abebe planned to use both in a garment.","Whereas the reflective metal fibers had an emissivity of just 0.02, the silicon carbide fibers absorbed large amounts of heat, resulting in an emissivity of 0.74."],"a":3,"r":"Choice D is the best answer. The sentence uses “whereas” to contrast the emissivities of the two fibers, noting that the emissivity of the reflective metal fibers was just 0.02, far lower than that of the silicon carbide fibers (0.74). Choice A is incorrect. The sentence emphasizes the ability of reflective metal fibers and silicon carbide fibers to emit heat; it doesn’t contrast the emissivities of the two fibers. Choice B is incorrect. The sentence states a law of thermodynamics: the amount of heat a material absorbs is equal to the amount it emits. The sentence doesn’t contrast the emissivity of reflective metal fibers with that of silicon carbide fibers. Choice C is incorrect. While the sentence includes a generalization about the emissivities of reflective metal fibers and silicon carbide fibers, it emphasizes Abebe’s plans for their use in a garment; it doesn’t contrast the emissivities of the two fibers."},{"i":"129089b5","c":"trans","d":"M","s":"In 1933, the Twentieth Amendment to the US Constitution was ratified. The amendment mandates that presidential inaugurations be held on January 20, approximately ten weeks after the November election. ______ this amendment requires newly elected US senators and representatives to be sworn into their respective offices on January 3.\n\nWhich choice completes the text with the most logical transition?","o":["Instead,","For instance,","Specifically,","In addition,"],"a":3,"r":"Choice D is the best answer. “In addition” logically signals that the information in this sentence—that the Twentieth Amendment requires newly elected US senators and representatives to be sworn in on January 3—is separate from and additional to the amendment’s mandate concerning presidential inaugurations. Choice A is incorrect because “instead” illogically signals that the information in the sentence presents an alternative to or substitute for the Twentieth Amendment’s mandate concerning presidential inaugurations. Rather, the sentence presents a separate requirement in addition to that one. Choice B is incorrect because “for instance” illogically signals that the information in the sentence exemplifies the Twentieth Amendment’s mandate concerning presidential inaugurations. Instead, the sentence presents a separate requirement in addition to that one. Choice C is incorrect because “specifically” illogically signals that the sentence provides specific, precise details elaborating on the Twentieth Amendment’s mandate concerning presidential inaugurations. Instead, the sentence presents a separate requirement in addition to that one."},{"i":"a266d876","c":"trans","d":"H","s":"Upper-atmospheric jets—phenomena whereby electrical discharges cause narrow cones of blue light to briefly burst upward from the tops of thunderclouds—have been observed reaching the ionosphere. The extreme altitudes involved (the ionosphere begins about 80 km above Earth) mark these gigantic jets as outliers; ______ the majority of jets reach heights of only 20 to 50 km.\n\nWhich choice completes the text with the most logical transition?","o":["nevertheless,","consequently,","indeed,","in addition,"],"a":2,"r":"Choice C is the best answer. “Indeed” logically signals that the information that follows—that the majority of jets reach heights of only 20 to 50 km—offers additional emphasis in support of the previous claim that jets reaching the ionosphere (about 80 km above Earth) are outliers. Choice A is incorrect because “nevertheless” illogically signals that the information about most jets reaching heights of only 20 to 50 km contrasts with the previous claim that jets reaching the ionosphere are outliers. Instead, it provides additional emphasis in support of that claim. Choice B is incorrect because “consequently” illogically signals that the information about most jets reaching heights of only 20 to 50 km is a consequence, or result, of some jets being outliers. Instead, it offers additional emphasis in support of the claim that jets reaching the ionosphere are outliers. Choice D is incorrect because “in addition” illogically signals that the information about most jets reaching heights of only 20 to 50 km merely adds to the previous claim that jets reaching the ionosphere are considered outliers. Instead, it provides additional emphasis in support of that claim."},{"i":"f07570bb","c":"trans","d":"E","s":"Researchers believe that pieces of hull found off Oregon’s coast are from a Spanish cargo ship that was lost in 1697. Stories passed down among the area’s Confederated Tribes of Siletz Indians support this belief. ______ Siletz stories describe how blocks of beeswax, an item the ship had been carrying, began washing ashore after the ship was lost.\n\nWhich choice completes the text with the most logical transition?","o":["For this reason,","For example,","However,","Likewise,"],"a":1,"r":"Choice B is the best answer. “For example” logically signals that the Siletz beeswax stories mentioned in this sentence are examples consistent with the previous claim that Siletz stories support the shipwreck theory. Choice A is incorrect because “for this reason” illogically signals that the Siletz stories about the beeswax were caused by the previous claim that Siletz stories support the shipwreck theory. Instead, the beeswax stories are examples consistent with the claim. Choice C is incorrect because “however” illogically signals that the Siletz stories about the beeswax contrast with the previous claim that Siletz stories support the shipwreck theory. Instead, the beeswax stories are examples consistent with the claim. Choice D is incorrect because “likewise” illogically signals that the Siletz stories about the beeswax are similar to the previous claim that Siletz stories support the shipwreck theory. Instead, the beeswax stories are examples consistent with the claim."}],"img":{"303bcc41":"iVBORw0KGgoAAAANSUhEUgAAArwAAAInBAMAAACINZfwAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA6BElEQVR42u2deXwTxfvHP7O5epJJW7mhW4rcYAoFBERSuQU0cikoGkC5RA2inOqvIFcR+QZEoHiVW0SlIKegBA/uI9wqWFIQUIRmQjlKj8zvj/RIaYoUGijtvF8vJdvdnd397LPPPM/s7AwgEAgEAoFAIBAIBAKBQCAQCARlGRKh0+Ut6SIi3D+o+78mINmbAYjIt+MQIyEgAI1S6ClUMgjNXUeh0gtpAUCxac8KQ+7SB1/NzhEUAOpv+ilbWwJKPnKr7ka90aiYha5UmTCncizQwAhlbO4tAwLNQloAII03NckTbWd0VJ61guyq8YzHljTn7wAQYAZO4396TaLsbwICjFAl5u2IgNh7fiVSSZSX77+0D602yv4tN4KSi3sPqDbPIhPRXhq5iSA9aVWFJ3dAsSUWdbfIA/DOOv78H3rg+R1yz+eBs1JQjMI6gFDlHjMDADy5+ZFafXdA+uYlRoS82Y7yyoz+s5TT30xgkAjtOP8GiUFTMnUa59f1SB33VmKnjwOJZYjuCb9a86PGtLJDPbZn7LfLgbWKNH2ItR3HsDFhbsNNf96i6fR2bIt11xi/19ehLJnyOqHedV6FT3+PBFePvdax8+5GFIz/vRV46nCvE1u26yO2XwpLO6nQqledepb8C6hmnI/mKcAaKStKv5YT9uzsG1cAAFtqyvh891sBo6pGC+eQ61VtuAy7CyCZew+5kBXlAJACIK3hd9zOL0c896LkAGe6zq9fmrYU0DF+GgBO9bD+2ggAgnGKAhzo0wsuBlRHigxhvQBAOTjAIf/EwDO/x1uQ7AAnDABJW0dAaMo8yihNhSvO5XBSY6KDggNAlmFKxjAwl0xAQa8Soni3/hD3AwEmrBcAwHTINCnqc6PKBRDQo4g5EAkTZABaNCQGVdLpcklZNRlHymunnPxzPVwGVRAokGGy/1QFVMJ2NKEM4NIFNQeAM7QmFdabrS/Sf/h+Jv7dPhKEgs08cWHxtF2M2wCyxXkiq/7ON3f8Wq5W3L636fXH9g6azl/BjeD1/+OM8KyLyAIA++4TW9cDj/35S2aCXXsN9MPDW38VMa8bGZAiERgVBUBHQRpTQmIAGUDkE6jUPwpoHAGpMSgUNWhkFAApCpI7ryOUUgA1AJAaNeTICEoAIERHhbCeBBu8/z3Q5JGqkbxgruQhlWR5swqTnYGBuKWlPEfZQiouIsy0sHtPi/Z3gUAgEAgEAkFJQwRut4+ukNSAFpJECG3/m3YAecaLikMAAJVys2XlIL3 function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="re"){if(!done&&Object.keys(ans).length&&!confirm("Clear all your answers and start over?"))return;ans={};done=false;miss=false;draw();scrollTo(0,0)}
 else if(t.id==="sub")submit();
 else if(t.id==="mi"){miss=!miss;draw()}
 else if(t.dataset.k!==undefined&&!done){const a=t.closest("article"),q=Q[a.dataset.n-1];ans[q.i]=+t.dataset.k;a.outerHTML=card(q,+a.dataset.n);sum()}});
draw();
</script></body></html>
