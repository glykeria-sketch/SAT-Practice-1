<script>
const D={"t":"Practicetest67","q":[{"i":"b940952c","c":"vocab","d":"E","s":"On the basis of extensive calculations and models, astronomers in the 1990s predicted that the collision of two neutron stars or a neutron star and a black hole could release a massive burst of gamma rays in an event called a kilonova. This ______ was confirmed with observations in 2017.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["theory","evidence","constant","experiment"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of a prediction about a kilonova. In this context, a \"theory\" is an explanation that is considered scientifically acceptable. The text states that astronomers predicted in the 1990s that a collision between a black hole and a neutron star or between two neutron stars could release a massive gamma ray burst called a kilonova, explaining that they determined this possibility based on their extensive work with existing data and simulations (\"calculations and models\"). In other words, the prediction was a theory—a well-supported explanation—that, as the text indicates, was later confirmed with observations in 2017. Choice B is incorrect because the text indicates that it is the prediction made by astronomers in the 1990s that was confirmed in 2017, and a prediction of an event isn’t \"evidence,\" or proof, of that event’s existence, even when the prediction is based on extensive study. Further, there would be no need for later confirmation of something that was already recognized as evidence. Choice C is incorrect because in this context, a \"constant\" is a situation or factor that doesn’t change. The text indicates that it is the prediction made by astronomers in the 1990s that was confirmed in 2017, and there is no reason to describe the prediction as a constant because the text doesn’t suggest that the prediction was completely unchanged over time—it addresses only the making of the prediction and its later confirmation. Choice D is incorrect because the text indicates that it is the prediction made by astronomers in the 1990s that was confirmed in 2017; although a prediction might be informed by an \"experiment,\" or a controlled test, a prediction is an idea rather than a test."},{"i":"54804e10","c":"vocab","d":"H","s":"While scholars believe many Mesoamerican cities influenced each other, direct evidence of such influence is difficult to ascertain. However, recent excavations in a sector of Tikal (Guatemala) unearthed a citadel that shows ______ Teotihuacán (Mexico) architecture—including a near replica of a famed Teotihuacán temple—providing tangible evidence of outside influence in portions of Tikal.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["refinements of","precursors of","commonalities with","animosities toward"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of architectural influences among Mesoamerican cities. In this context, “commonalities with” means similarities to or shared attributes with. The text indicates that a recently discovered citadel in Tikal includes a close imitation of a famous temple in Teotihuacán (another Mesoamerican city) and other evidence of Teotihuacán influence, which suggests that the citadel possesses features that resemble architectural features found in Teotihuacán. This context thus indicates that the Tikal citadel shows commonalities with Teotihuacán architecture. Choice A is incorrect because there’s nothing in the text that suggests that the Tikal citadel shows “refinements of,” or improvements on, Teotihuacán architecture. Although the text suggests that the architecture of Teotihuacán influenced the architecture of the Tikal citadel, and although it’s possible that later architectural designs could make improvements on earlier designs, the text doesn’t discuss whether, in imitating Teotihuacán architecture, the Tikal citadel’s builders improved on it. Choice B is incorrect because describing the citadel in Tikal as showing “precursors of”Teotihuacán architecture—or features that preceded and foreshadowed those of Teotihuacán architecture—would imply the opposite of what the text suggests about the relationship between the architecture found in Tikal and Teotihuacán. The text claims that the discovery of similarities between the Tikal citadel and the architecture of Teotihuacán, including a replica of a temple in Teotihuacán, provides evidence of outside influences on Tikal architecture. If the Tikal citadel was influenced by Teotihuacán architecture, then the Teotihuacán architecture must predate the citadel, not the other way around. In this context, therefore, it wouldn’t make sense to say that the Tikal citadel shows precursors of Teotihuacán architecture. Choice D is incorrect because the text discusses how the citadel in Tikal indicates the influence of Teotihuacán architecture, which implies that the makers of the Tikal citadel likely admired aspects of Teotihuacán architecture enough to imitate it. Thus, there’s no reason to think that the Tikal citadel provides evidence of the Tikal people’s “animosities toward,” or feelings of strong dislike or hostility toward, Teotihuacán architecture."},{"i":"757077f9","c":"vocab","d":"M","s":"During a 2014 archaeological dig in Spain, Vicente Lull and his team uncovered the skeleton of a woman from El Algar, an Early Bronze Age society, buried with valuable objects signaling a high position of power. This finding may persuade researchers who have argued that Bronze Age societies were ruled by men to ______ that women may have also held leadership roles.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["waive","concede","refute","require"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the significance of the 2014 archaeological finding at El Algar. In this context, “concede” means to admit something is true after first resisting that admission. The text indicates that some researchers believe “Bronze Age societies were ruled by men.” But the Bronze Age burial of a woman at El Algar included “valuable objects signaling a high position of power,” which would raise the possibility that “women may have also held leadership roles.” Thus, the text is calling into question the notion that only men were leaders in these societies and speculating that people holding this view may reconsider their opinion. Choice A is incorrect because “waive” means to refrain from insisting that something, such as a right or a requirement, be observed; the word isn’t used, however, in contexts where someone acknowledges that an opinion they hold may be invalid, as is the case in the text. Choice C is incorrect. According to the text, the finding from the El Algar burial site undermines the view that Bronze Age societies were exclusively ruled by men. However, “refute” means to demonstrate that something is false and would not make sense in context. Lull and team’s finding supports the view that women may have also held leadership roles, not that they did not participate in such roles. Choice D is incorrect because in this context, “require” means to demand or specify as mandatory. However, it would not make sense for contemporary researchers to demand that Bronze Age “women may have also held leadership roles.”"},{"i":"4a2b2535","c":"vocab","d":"E","s":"A brief book review cannot fully convey the ______ of Olga Tokarczuk’s novel The Books of Jacob, with its enormous cast of characters, its complicated, wandering plot, and its page numbers that count backward (beginning at 965 and ending at 1).\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["accuracy","inactivity","complexity","restraint"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Olga Tokarczuk’s novel The Books of Jacob. As used in this context, “complexity” means having many complicated parts that when taken as a whole are difficult to follow or explain. The text indicates that The Books of Jacob has a large cast of characters, a complicated and wandering plot (that is, a plot that is difficult to follow), and reverse page numbering. Together, these features make up a novel that’s challenging to read and summarize. This context supports the idea that a brief book review can’t do justice to the novel’s complexity. Choice A is incorrect. Although the word “accuracy,” or being free from error or falsehood, can sometimes be used to describe a novel, the text doesn’t discuss whether Tokarczuk’s novel has this quality. Instead, the text describes the novel as having a large cast of characters, a difficult- to-follow plot, and reverse page numbering. These features suggest complexity, not accuracy. Choice B is incorrect because “inactivity” means being in a state of idleness or doing nothing, neither of which would make sense in this context. The text describes Tokarczuk’s novel, and although it’s possible the novel could portray its characters as inactive, it wouldn’t make sense to describe the novel itself as such. Choice D is incorrect because in this context “restraint” would mean holding back or showing self-control, and the text doesn’t indicate that Tokarczuk’s novel has either of these qualities. In fact, the features of the novel that the text describes, such as a large cast of characters, a complicated and wandering plot, and reverse page numbering, suggest excess and complexity, not restraint."},{"i":"2b085bc6","c":"purpose","d":"M","s":"The following text is adapted from Paul Laurence Dunbar’s 1902 novel The Sport of the Gods. Joe and some of his family members have recently moved to New York City. [Joe] was wild with enthusiasm and with a desire to be a part of all that the metropolis meant. In the evening he saw the young fellows passing by dressed in their spruce clothes, and he wondered with a sort of envy where they could be going. Back home there had been no place much worth going to, except church and one or two people’s houses.\n\nWhich choice best states the main purpose of the text?","o":["It illustrates a character’s reaction to a new environment.","It explains why a character has traveled to a city.","It compares a character’s thoughts about an event at two different times of day.","It presents a character feeling regret over leaving home."],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text. The narrator describes how Joe responds to being in “the metropolis”: he’s excited and “wild with enthusiasm.” He also envies the young fellows who walk by because, dressed as they are, they look as if they have somewhere special to go. The text contrasts this new place with the place Joe comes from, where apparently there wasn’t as much to do. Thus, the main purpose of the text is to illustrate Joe’s reaction to a new environment. Choice B is incorrect because the text makes no reference to why Joe has moved. The narrator indicates that Joe is enthusiastic about being in a city, but there’s no explanation provided for the move. Choice C is incorrect because the text makes no reference to how Joe thinks about an event. The narrator describes young men passing by in the evening and then recalls places worth going to at home—church and a few people’s houses—but there’s no explicit comparison made nor is a time of day mentioned for these events back home. Choice D is incorrect because the text doesn’t support the idea that Joe feels regret over leaving home. Instead, Joe is described as “wild with enthusiasm” at being in the city. Joe’s home is mentioned, but only to compare it unfavorably with the city."},{"i":"5f56fdec","c":"purpose","d":"H","s":"The following text is from George Marion McClellan’s 1895 poem “Eternity.” My spirit swoons, and all my senses cry For Ocean’s breast and covering of the sky. Rock me to sleep, ye waves, and outward bound, Just let me drift far out from toil and care, Where lapping of the waves shall be the sound, Which mingled with the winds that gently bear Me on between a peaceful sea and sky, To make my soothing slumberous lullaby.\n\nWhich choice best states the main purpose of the text?","o":["To illustrate the increasing intensity of the speaker’s desire to escape ongoing hardship by gliding on the ocean","To contrast the demands of the speaker’s everyday life with the serenity of being rocked to sleep by the ocean","To convey the speaker’s longing for the ocean to impart a sense of inner tranquility","To justify the speaker’s qualms about being transported by the ocean to a quiet destination"],"a":2,"r":"Choice C is the best answer because it most accurately states the main purpose of the text, which is to convey the speaker’s longing for the ocean to impart a sense of inner tranquility, or peace. The text begins by expressing the speaker’s strong desire to be on the ocean, appealing directly to the waves to rock the speaker to sleep. The poem then describes the \"slumberous lullaby\" formed by the sound of the waves and the winds on which the speaker wishes to be carried \"gently...between a peaceful sea and sky.\" All these details serve to emphasize the speaker’s desire for the ocean to give them a sense of inner tranquility. Choice A is incorrect. Given the poem’s expression of a longing to achieve tranquility by drifting on the ocean, it can be inferred that the speaker desires to escape something unpleasant in daily life. However, the poem doesn’t refer directly to any such hardship—ongoing or otherwise. And since the poem doesn’t establish that the speaker is experiencing a desire to escape ongoing hardship, it can’t be said that such a desire increases in intensity. Choice B is incorrect. The speaker does express a desire for the serenity of being rocked to sleep by the ocean, and it can be inferred that this desire is a response to demands that make the speaker’s daily life stressful. However, the poem doesn’t refer directly to such demands or contrast them with the tranquility of drifting on the ocean. Choice D is incorrect because the text doesn’t suggest the speaker has any qualms, or reservations, about being transported by the ocean. On the contrary, the speaker actively desires to \"drift far out\" and be carried by the waves and wind. Moreover, the poem doesn’t suggest that this drifting would have any particular destination."},{"i":"c502943e","c":"func","d":"E","s":"The following text is adapted from Cynthia Kadohata’s 2004 novel Kira-Kira. <u>[Uncle Katsuhisa] was as loud as my father was quiet.<\/u> Even when he wasn’t talking, he made a lot of noise, clearing his throat and sniffing and tapping his fingers. ©2004 by Cynthia Kadohata Which choice best describes the function of the underlined sentence?","o":["It lists the kinds of topics Uncle Katsuhisa enjoys discussing.","It suggests that Uncle Katsuhisa dislikes meeting new people.","It contrasts Uncle Katsuhisa with the narrator’s father.","It describes a conversation between the narrator and the narrator’s father."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The underlined sentence establishes a difference between Uncle Katsuhisa and the narrator’s father by describing Uncle Katsuhisa as \"loud\" and the narrator’s father as \"quiet.\" The text then elaborates on that contrast, describing some ways Uncle Katsuhisa is very noisy even when he isn’t speaking. Choice A is incorrect because the text doesn’t indicate what kinds of topics Uncle Katsuhisa enjoys discussing, only that he is loud even when he isn’t speaking. Choice B is incorrect because the text never indicates how Uncle Katsuhisa feels about meeting new people, only how loud he is. Choice D is incorrect because the text never describes a conversation occurring between any people; it refers to talking only when stating that Uncle Katsuhisa is loud even when he isn’t speaking."},{"i":"97ca2cda","c":"func","d":"E","s":"In the early days of television in the 1940s, many people thought that US television programs would rely on the financial support of ad agencies and commercial sponsors, much like radio did. But advertisers hesitated to jump into a new space, <u>particularly at a time when the manufacturing of new television sets was stalled due to the US’s involvement in World War II.<\/u> Broadcasters, like the National Broadcasting Company (NBC), needed to persuade advertisers to support their programming despite not knowing whether there would be a robust television audience to begin with.\n\nWhich choice best describes the function of the underlined phrase in the text as a whole?","o":["It compares the beginnings of radio programming with the beginnings of television programming in the United States.","It identifies a specific reason behind some advertisers’ hesitance to support television.","It describes how broadcasters attempted to convince advertisers to support television.","It explains why a type of television programming was popular at the time."],"a":1,"r":"Choice B is the best answer because it accurately describes the function of the underlined phrase in the text as a whole. According to the text, advertisers were reluctant to support television in its early days. The underlined phrase then indicates that this reluctance was partly due to the US’s involvement in World War II, which hindered television production. Thus, the underlined phrase identifies a specific reason behind some advertisers’ hesitance to support television. Choice A is incorrect. The text merely mentions that television was expected to be financed through advertising, as radio was at the time. Nothing in the text compares the origins of radio and television. Choice C is incorrect. The underlined phrase focuses on a reason advertisers were reluctant to support television, not measures taken to convince advertisers to support television. Choice D is incorrect. The underlined phrase focuses on a reason advertisers were reluctant to support television, not what types of television programming were popular."},{"i":"f52cc78c","c":"cross","d":"M","s":"Text 1 Polar bears sustain themselves primarily by hunting seals on the Arctic sea ice, but rising ocean temperatures are causing the ice to diminish, raising concerns about polar bear population declines as these large predators’ seal-hunting habitats continue to shrink. A 2020 study examining polar bear populations across the Arctic <u>concluded that populations affected by sea-ice loss are at great risk of extinction by the end of the twenty-first century<\/u>.\n\nText 2 Monitoring carried out by researchers from the Norwegian Polar Institute shows that the polar bear population on the Arctic archipelago of Svalbard remains stable and well nourished despite rapidly declining sea ice in recent years. The researchers attribute this population’s resilience in part to a shift in feeding strategies: in addition to hunting seals, the Svalbard polar bears have begun relying on a diet of reindeer meat and birds’ eggs.\n\nBased on the texts, how would the researchers in\n\nText 2 most likely respond to the conclusion presented in the underlined portion of\n\nText 1?","o":["By noting that it neglects the possibility of some polar bear populations adapting to changes in their environment","By suggesting that it is likely incorrect about the rates at which warming ocean temperatures have caused sea ice to melt in the Arctic","By asserting that it overlooks polar bear populations that have not yet been affected by loss of seal-hunting habitats","By arguing that it fails to account for polar bears’ reliance on a single seal-hunting strategy"],"a":0,"r":"Choice A is the best answer. Text 2 describes how the Svalbard polar bears have adapted to the loss of sea ice by diversifying their diet and feeding on reindeer and seabird eggs, resulting in a “stable and well nourished” population despite environmental challenges. This counters the underlined claim that polar bears facing a loss of sea ice are at “great risk of extinction” by the end of the century. Choice B is incorrect. Text 2 does not challenge the fact that sea ice is rapidly declining in the Arctic due to warming ocean temperatures. In fact, it states that the Svalbard polar bears have faced “rapidly declining sea ice in recent years.” Choice C is incorrect. The claim in Text 1 is specific to polar bear populations affected by the loss of seal hunting habitats, so unaffected populations are irrelevant to the claim. Also, Text 2 doesn’t mention any polar bear populations that haven’t yet been affected by loss of seal hunting habitats. It focuses on a population that has been affected by sea-ice loss but has managed to survive and thrive nevertheless. Choice D is incorrect. Text 2 doesn’t imply that polar bears rely on a single seal-hunting strategy. In fact, the researcher in Text 2 would say that Text 1 fails to account for polar bears’ ability to develop other hunting strategies and food sources."},{"i":"d5c2a4d4","c":"main","d":"M","s":"The following text is adapted from Guy de Maupassant’s nineteenth-century short story “The Trip of Le Horla” (translated by Albert M. C. McMaster, A. E. Henderson, Mme. Quesada, et al.). The narrator is part of a group traveling in a hot-air balloon at night. The earth no longer seems to exist, it is buried in milky vapors that resemble a sea. We are now alone in space with the moon, which looks like another balloon travelling opposite us; and our balloon, which shines in the air, appears like another, larger moon, a world wandering in the sky amid the stars, through infinity. We no longer speak, think nor live; we float along through space in delicious inertia. The air which is bearing us up has made of us all beings which resemble itself, silent, joyous, irresponsible beings, peculiarly alert, although motionless.\n\nWhich choice best states the main idea of the text?","o":["The narrator feels a growing sense of isolation even though his companions are nearby during the balloon ride.","The narrator and his companions are completely absorbed in the change in perspective they gain while riding in the balloon.","The narrator and his companions are troubled by the disorienting effects of the altitude while riding in the balloon.","The narrator is pleasantly surprised by his companions’ unrestrained enthusiasm about the sensation of riding in the balloon."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The narrator describes the view he and his companions have from the balloon: the earth lies beneath \"milky vapors,\" and the balloon itself looks like another moon. The narrator goes on to explain how the people riding in the balloon are affected by the ride, explaining that they are immersed in the experience: floating along in \"delicious inertia,\" or inactivity, like \"silent, joyous, irresponsible beings.\" Thus, the main idea is that the narrator and his companions are completely absorbed in the change in perspective they gain while riding in the balloon. Choice A is incorrect because the narrator never describes himself as feeling isolated from his companions; instead, he characterizes riding in the balloon as an experience he is sharing with them. And although he does imply a sense of isolation, it is isolation from those on the ground, as when he says of himself and his companions, \"We are now alone.\" Choice C is incorrect because the narrator doesn’t suggest that he or his companions are troubled by the effects of the balloon ride. Instead, he describes himself and his companions as \"joyous\" and the experience of floating in the balloon as \"delicious.\" Choice D is incorrect because nothing in the text suggests that the narrator is surprised by his companions’ response to the balloon ride. In fact, the text indicates that the narrator and his companions are having the same experience: they’re described as \"silent\" and \"motionless,\" rather than as having unrestrained enthusiasm."},{"i":"4d3e3c52","c":"main","d":"H","s":"In a paper about p-i-n planar perovskite solar cells (one of several perovskite cell architectures designed to collect and store solar power), Lyndsey McMillon-Brown et al. describe a method for fabricating the cell’s electronic transport layer (ETL) using a spray coating. Conventional ETL fabrication is accomplished using a solution of nanoparticles. The process can result in a loss of up to 80% of the solution, increasing the cost of manufacturing at scale—an issue that may be obviated by spray coating fabrication, which the researchers describe as “highly reproducible, concise, and practical.” What does the text most strongly suggest about conventional ETL fabrication?","o":["It is less suitable for manufacturing large volumes of planar p-i-n perovskite solar cells than an alternative fabrication method may be.","It is more expensive when manufacturing at scale than are processes for fabricating ETLs used in other perovskite solar cell architectures.","It typically entails a greater loss of nanoparticle solution than do other established approaches for ETL fabrication.","It is somewhat imprecise and therefore limits the potential effectiveness of p-i-n planar perovskite solar cells at capturing and storing solar power."],"a":0,"r":"Choice A is the best answer. Conventional solar cell fabrication increases “the cost of manufacturing at scale,” but spray coating might get rid of that problem. Choice B is incorrect. This is not completely supported by the text. While it’s true that conventional ETL fabrication is expensive at scale, there’s nothing in the text that mentions other perovskite solar cell architectures. Choice C is incorrect. This choice does not match the text. Only one conventional method of ETL fabrication is described, so we can’t compare the solution loss in this method to that of other conventional methods. Choice D is incorrect. This choice isn’t supported by the text. The text never suggests that the effectiveness of solar cells changes based on their method of fabrication."},{"i":"d748c3fd","c":"infer","d":"M","s":"In her 2021 article “Throwaway History: Towards a Historiography of Ephemera,” scholar Anne Garner discusses John Johnson (1882–1956), a devoted collector of items intended to be discarded, including bus tickets and campaign pamphlets. Johnson recognized that scholarly institutions considered his expansive collection of ephemera to be worthless—indeed, it wasn’t until 1968, after Johnson’s death, that Oxford University’s Bodleian Library acquired the collection, having grasped the items’ potential value to historians and other researchers. Hence, the example of Johnson serves to ______ Which choice most logically completes the text?","o":["demonstrate the difficulties faced by contemporary historians in conducting research at the Bodleian Library without access to ephemera.","represent the challenge of incorporating examples of ephemera into the collections of libraries and other scholarly institutions.","lend support to arguments by historians and other researchers who continue to assert that ephemera holds no value for scholars.","illustrate both the relatively low scholarly regard in which ephemera was once held and the later recognition of ephemera’s possible utility."],"a":3,"r":"Choice D is the best answer. Johnson collected “ephemera,” or things that are meant to be thrown away. Scholars thought his collection was worthless to them, then later realized that it was potentially valuable. This suggests that scholars went from disregarding ephemera to recognizing their usefulness. Choice A is incorrect. This inference isn’t supported. The text tells us that the Bodleian Library acquired Johnson’s large collection of ephemera back in 1968, so we can assume that contemporary historians conducting research there do have access to that collection. Choice B is incorrect. This inference isn’t supported. The text tells us that “Oxford University’s Bodleian Library acquired the collection,” but it never suggests that it was a challenge to do so. Choice C is incorrect. This inference isn’t supported. The text actually suggests the opposite: the example of Johnson’s collection lends support to arguments that ephemera does hold value for scholars."},{"i":"4ba0695d","c":"infer","d":"H","s":"The alpaca was domesticated by Indigenous peoples in the Andes about 7,000 years ago. But which wild species did it descend from, the vicuña or guanaco? A research team led by Ruiwen Fan may have solved the mystery, concluding that the alpaca is the domesticated form of the vicuña but that the modern alpaca gets only 64 percent of its genetic material from its wild ancestor. The rest comes from the domesticated llama. The llama, meanwhile, gets 95.5 percent of its genetic material from its own wild ancestor, the guanaco, and the rest from the alpaca. The llama and alpaca apparently interbred widely for only a handful of generations between 400 and 600 years ago. Assuming that the findings of Fan’s team are valid, it can be inferred that ______ Which choice most logically completes the text?","o":["modern llama populations have a greater degree of genetic diversity, on average, than modern alpaca populations do.","the domestication process of the alpaca may have involved some introduction of genetic material from the llama.","the period of interbreeding resulted in a greater genetic difference between alpacas and their wild ancestors than between llamas and their wild ancestors.","if they were subjected to genetic testing, modern populations of guanacos and vicuñas would likely show traces of ancient interbreeding as well."],"a":2,"r":"Choice C is the best answer because it presents the inference that most logically follows from the text’s discussion of the genetic material of alpacas. The text states that modern alpacas get only 64 percent of their genetic material from their wild ancestor (the vicuña), while llamas get 95.5 percent of their genetic material from their wild ancestor (the guanaco). These data imply that relative to llamas, alpacas have experienced a much greater genetic shift away from their wild ancestors (36 percent of their genetic material derives from another source, compared to 4.5 percent of llamas’ genetic material). Moreover, the text establishes that the remainder of alpacas’ genetic material derives from llamas, and the remainder of llamas’ genetic material derives from alpacas, reflecting a period of interbreeding. Taken together, these details support the inference that the period of interbreeding had a more significant impact on the genetic material of alpacas than on that of llamas, thereby reducing the percentage of alpacas’ genetic material that derives from wild ancestors and placing alpacas at a greater remove from these ancestors. Choice A is incorrect because the text doesn’t provide information about genetic diversity within modern llama and alpaca populations. While the text discusses the percentage of genetic material each domesticated species inherited from its wild ancestor and from interbreeding, it does not address the level of genetic variation within each species. Therefore, it isn’t logical to infer that modern llama populations have a greater degree of genetic diversity than modern alpaca populations do. Choice B is incorrect because it contradicts the chronology presented in the text. The text states that alpacas were domesticated about 7,000 years ago, but the interbreeding with llamas occurred \"between 400 and 600 years ago.\" The genetic mixing happened thousands of years after domestication, not during it; in addition, the text does not provide details about what the process of domestication might entail. Therefore, it isn’t logical to infer that llama genetic material was introduced during the domestication process of alpacas. Choice D is incorrect because though the text notes that guanacos and vicuñas contributed to the genetic material of alpacas and llamas, it only discusses alpacas’ and llamas’ genetic composition. Therefore, the text does not support the inference that modern populations of guanacos and vicuñas would likely show traces of ancient interbreeding."},{"i":"8545ccfe","c":"claim","d":"H","s":"Icebergs generally appear to be mostly white or blue, depending on how the ice reflects sunlight. Ice with air bubbles trapped in it looks white because much of the light reflects off the bubbles. Ice without air bubbles usually looks blue because the light travels deep into the ice and only a little of it is reflected. However, some icebergs in the sea around Antarctica appear to be green. One team of scientists hypothesized that this phenomenon is the result of yellow-tinted dissolved organic carbon in Antarctic waters mixing with blue ice to produce the color green.\n\nWhich finding, if true, would most directly weaken the team’s hypothesis?","o":["White ice doesn’t change color when mixed with dissolved organic carbon due to the air bubbles in the ice.","Dissolved organic carbon has a stronger yellow color in Antarctic waters than it does in other places.","Blue icebergs and green icebergs are rarely found near each other.","Blue icebergs and green icebergs contain similarly small traces of dissolved organic carbon."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would weaken the scientists’ hypothesis about icebergs that appear to be green. The text indicates that most icebergs are either mostly white or blue in color but that some icebergs in Antarctica appear to be green. The text goes on to say that the scientists hypothesized that this green color occurs when yellow-tinted dissolved organic carbon in ocean waters mixes with blue ice. A finding that both blue icebergs and green icebergs contain similarly small traces of dissolved organic carbon would suggest that something other than yellow-tinted organic carbon causes some icebergs’ green color, since the blue icebergs that contain yellow- tinted organic carbon remained blue instead of turning green. Choice A is incorrect because, according to the text, the scientists’ hypothesis was that blue icebergs, not white ones, change color when their ice mixes with yellow-tinted dissolved organic carbon. A finding that white ice, because of its air bubbles, doesn’t change color when it’s mixed with dissolved organic carbon would therefore have no bearing on the scientists’ hypothesis. Choice B is incorrect because the text focuses only on Antarctic icebergs that appear to be green. It doesn’t indicate that icebergs in locations other than Antarctica have been found to have a green hue. A finding that dissolved organic carbon has a stronger yellow color in Antarctic waters than in other places would therefore have no bearing on the scientists’ hypothesis that green color in icebergs in Antarctica is caused by yellow-tinted dissolved organic carbon mixing with blue ice. Choice C is incorrect because, according to the text, the scientists’ hypothesis was that blue icebergs turn green when their ice mixes with yellow-tinted dissolved organic carbon in the sea around them. If that’s correct, one would expect blue icebergs and green icebergs to be located at a distance from each other since all blue icebergs in an area where the waters contain yellow-tinted dissolved organic carbon would take on a green hue. A finding that blue icebergs and green icebergs are rarely found near each other would therefore strengthen, not weaken, the researchers’ hypothesis."},{"i":"2a5aa08a","c":"claim","d":"E","s":"Treasure Island is an 1883 novel by Robert Louis Stevenson. When the narrator was a child, his father ran a hotel. A mysterious sailor came to stay at the hotel. The narrator was frightened of the sailor, as can be seen when the narrator says, ______ Which quotation from Treasure Island most effectively illustrates the claim?","o":["“I remember [the sailor] as if it were yesterday, as he came plodding to the inn door, his sea-chest following behind him in a hand-barrow.”","“[The sailor] was a very silent man by custom. All day he hung round the cove or upon the cliffs with a brass telescope.”","“All the time he lived with us [the sailor] made no change whatever in his dress but to buy some stockings from a hawker. One of the [corners] of his hat having fallen down, he let it hang from that day forth, though it was a great annoyance when it blew.”","“How [the sailor] haunted my dreams, I need scarcely tell you. On stormy nights, when the wind shook the four corners of the house and the surf roared along the cove and up the cliffs, I would see him in a thousand forms, and with a thousand diabolical expressions.”"],"a":3,"r":"Choice D is the best answer because it most effectively illustrates the claim that the narrator was frightened of the sailor. The quotation describes the sailor haunting the narrator’s dreams, appearing in \"a thousand forms\" with \"a thousand diabolical expressions.\" This vivid imagery conveys the intense psychological fear the narrator experienced when thinking about the sailor. Furthermore, the quotation evokes the narrator’s terror and dread by describing a stormy night setting with wind shaking the house and a roaring surf. Choice A is incorrect because this quotation does not provide any details to suggest that the narrator was afraid of the sailor. It simply describes the narrator’s memory of the sailor arriving at the inn with his sea chest. Choice B is incorrect because this quotation does not effectively illustrate the claim that the narrator was frightened of the sailor. The quotation provides several details about the sailor, including that it was his custom to remain silent. However, the quotation does not relate these details to the narrator’s experience of being frightened of the sailor. Choice C is incorrect because this quotation focuses on aspects of the sailor’s appearance and dress. There is no connection made in the quotation between these physical details and the narrator’s sense of being frightened of the sailor."},{"i":"8af28416","c":"graph","d":"E","s":"","o":["Washington had between 600 and 800 organic farms.","New York had fewer than 800 organic farms.","Wisconsin and Iowa each had between 1,200 and 1,400 organic farms.","Pennsylvania had more than 1,200 organic farms."],"a":0,"r":"Choice A is the best answer because it uses data from the graph to accurately complete the text. The graph shows the number of organic farms located in each of six US states in 2016: between 2,600 and 2,800 in California; between 1,200 and 1,400 in Wisconsin; between 1,000 and 1,200 in New York; approximately 800 in Pennsylvania; and between 600 and 800 in both Iowa and Washington. The last sentence of the text provides information about the number of organic farms in 2016, first describing the number in California. The best completion of the sentence is the choice that accurately describes the number of organic farms in 2016 in another state, which the assertion that Washington had between 600 and 800 organic farms provides. Choice B is incorrect because it doesn’t accurately reflect the data from the graph. The graph indicates that there were between 1,000 and 1,200 organic farms in New York, not fewer than 800 organic farms. Choice C is incorrect because it doesn’t accurately reflect the data from the graph. While the graph indicates that there were between 1,200 and 1,400 organic farms in Wisconsin in 2016, there were only between 600 and 800 in Iowa. Choice D is incorrect because it doesn’t accurately reflect the data from the graph. The graph indicates that in 2016 there were approximately 800 organic farms in Pennsylvania, not more than 1,200."},{"i":"df9c5a1d","c":"graph","d":"H","s":"","o":["For all five species, less than 75% of juvenile plants were growing in patches of vegetation.","The species with the greatest number of juvenile plants growing in patches of vegetation was H. stoechas.","For T . libanitis and T . moroderi, the percentage of juvenile plants growing in patches of vegetation was less than what would be expected if plants were randomly distributed.","For each species, the percentage of juvenile plants growing in patches of vegetation was substantially higher than what would be expected if plants were randomly distributed."],"a":3,"r":"Choice D is the best answer because it provides the most direct support from the table for the claim that the plants growing in close proximity to other plants gained an advantage at an early developmental stage. The table shows the total number of juvenile plants from five species that were found growing on bare ground and in patches of vegetation as well as the percentage of the total number of each species that were growing in patches of vegetation. For each of the five species, more than 50% of the juvenile plants were growing in patches of vegetation. The text notes, however, that a random distribution of plants across the landscape should result in only about 15% of the plants being found in patches of vegetation. In other words, for each of the five species, the percentage of juvenile plants found growing in patches of vegetation was substantially higher than could be explained by chance alone. This finding supports the claim in the text: if plants growing in patches are overrepresented among plants that have survived to the juvenile stage, as the data show they are, then it suggests that it’s advantageous for plants at an early stage of development to grow in patches of vegetation. Choice A is incorrect because the statement that less than 75% of juvenile plants were found growing in patches of vegetation, while true, doesn’t clearly support the claim that the plants growing in close proximity to other plants gained an advantage at an early developmental stage. Saying that less than 75% of plants were found in patches doesn’t indicate how the percentage growing in patches compares with the percentage that would be expected to grow in patches on the basis of chance alone, which is the information necessary to evaluate whether the claim in the text has support in the table. Put another way, if the percentage of plants found growing in patches was 15% or less, it would be true that less than 75% were found in patches, but the data would in fact weaken the claim in the text, not strengthen it, since the data would show that growing in patches wasn’t advantageous. Choice B is incorrect because only 12 plants of this species were found growing in patches, which was the lowest number of any species, not the greatest number. Additionally, even if it were true that this species had the greatest number of plants growing in patches, the finding would be irrelevant to the claim that plants of all five species gained an advantage by growing in close proximity to other plants. Choice C is incorrect because 59.1% of the plants of these species were found growing in patches, which is a far greater percentage, not a lower percentage, than what would be expected if plants were randomly distributed (around 15%). Additionally, if it were true that the percentage of plants growing in patches was lower for these species than what would be expected from chance alone, that finding would weaken, not strengthen, the claim that growing in patches is advantageous."},{"i":"6e5bf3a8","c":"fss","d":"E","s":"Even though bats prefer very sweet nectar, the plants that attract them have evolved to produce nectar that is only moderately sweet. A recent study ______ why: making sugar is energy-intensive, and it is more advantageous for plants to make a large amount of low-sugar nectar than a small amount of high-sugar nectar.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["explains","explaining","having explained","to explain"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of finite and nonfinite verb forms within a sentence. A main clause requires a finite verb to perform the action of the subject (in this case, “a recent study”), and this choice supplies the finite present tense verb “explains” to indicate that the study explains why plants that attract bats have evolved to produce moderately sweet nectar. Choice B is incorrect because the nonfinite participle “explaining” doesn’t supply the main clause with a finite verb. Choice C is incorrect because the nonfinite participle “having explained” doesn’t supply the main clause with a finite verb. Choice D is incorrect because the nonfinite to- infinitive “to explain” doesn’t supply the main clause with a finite verb."},{"i":"b7363ba2","c":"fss","d":"E","s":"Mathematician and meteorologist Edward Lorenz used the metaphor of the “butterfly effect” to explain how seemingly minor events can have major impacts on future weather. According to Lorenz’s metaphor, the wind from a butterfly flapping ______ in Brazil might eventually grow into a storm elsewhere across the globe.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["its wings","its wings’","it’s wing’s","it’s wings’"],"a":0,"r":"Choice A is the best answer. The conventions being tested are the use of possessive determiners and plural nouns. The singular possessive determiner \"its\" and the plural noun \"wings\" correctly indicate that the butterfly has multiple wings. Choice B is incorrect because the context requires the plural noun \"wings,\" not the plural possessive noun \"wings’.\" Choice C is incorrect because the context requires the singular possessive determiner \"its\" and the plural noun \"wings,\" not the contraction \"it’s\" and the singular possessive noun \"wing’s.\" Choice D is incorrect because the context requires the singular possessive determiner \"its\" and the plural noun \"wings,\" not the contraction \"it’s\" and the plural possessive noun \"wings’.\""},{"i":"36e89f74","c":"fss","d":"E","s":"An imposing spire of igneous rock rising high above the Belle Fourche River in eastern Wyoming, Devils Tower (also known as Bear Lodge) is one of the most prominent examples of columnar jointing, a pattern of fracturing in rocks that ______ in parallel arrays of long polygonal prisms.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["resulting","were resulting","results","to result"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. Relative clauses, such as the one beginning with “that,” require a finite (tensed) verb, a verb that can function as the main verb of a clause. This choice correctly supplies the clause with the finite present tense verb “results.” Furthermore, the simple present tense verb “results” correctly indicates that the formation of parallel arrays of long polygonal prisms is an enduring property of this fracturing pattern. Choice A is incorrect because it results in an ungrammatical sentence. The nonfinite participle “resulting” doesn’t supply the clause with a finite verb. Choice B is incorrect because the past progressive tense verb “were resulting” doesn’t indicate that the formation of parallel arrays of long polygonal prisms is an enduring property of this fracturing pattern. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive “to result” doesn’t supply the clause with a finite verb."},{"i":"7b950fc2","c":"bound","d":"E","s":"In 2000, Nora de Hoyos Comstock, herself an owner of a successful consulting firm, sought to increase Latina representation in corporate ______ founded Las Comadres para las Americas, an international community that for over two decades has served as a resource and information network for Latina business professionals.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["settings she","settings, she","settings and she","settings. She"],"a":3,"r":"Choice D is the best answer. It appropriately uses a period to mark the end of one independent clause (\"In 2000…settings\") and the start of another (\"She founded…professionals\"). Choice A is incorrect. This choice results in a run-on sentence error. Both the clause before the blank (\"In 2000…settings\") and the clause after the blank (\"she…professionals\") are independent clauses, so they need to be separated by punctuation. Choice B is incorrect. This choice results in a comma splice error. It incorrectly joins two independent clauses with just a comma. Linking two independent clauses with a comma also requires the use of a coordinating conjunction (like for, and, nor, but, or, yet, or so). Choice C is incorrect. This choice results in a run-on sentence, an error caused when two independent clauses are joined without punctuation or appropriate conjunctions. Since both the clause before the blank (\"In 2000…settings\") and the clause after the blank (\"she…professionals\") are independent, a comma would be required in addition to the coordinating conjunction \"and.\""},{"i":"83c9c503","c":"bound","d":"M","s":"Nigerian American artist Toyin Ojih Odutola uses black-ink pens to create highly detailed drawings of human figures. Her portrait of novelist Zadie ______ is displayed in the National Portrait Gallery in London.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Smith:","Smith—","Smith","Smith,"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between a subject and a verb. No punctuation is needed when, as in this case, a subject (\"Her portrait of novelist Zadie Smith\") is immediately followed by a main verb (\"is displayed\"). Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice D is incorrect because no punctuation is needed between the subject and the verb."},{"i":"3150021d","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The Royal Alcázar of Seville is a historic royal palace in Andalucía, Spain. The palace is famous for its intricate tilework. The palace features majolica and arista tiles. In the majolica style, designs are painted directly on the ceramic tiles. In the arista style, designs are stamped into the ceramic tiles. The student wants to contrast the two styles of tiles.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Tiles in the majolica and arista styles can be found in the Royal Alcázar of Seville in Andalucía, Spain.","Featuring tiles in the majolica and arista styles, the Royal Alcázar of Seville in Spain is famous for its intricate tilework.","In the arista style, designs are stamped into the ceramic tiles, whereas in the majolica style, the designs are painted directly on them.","Among the famous tilework of the Royal Alcázar of Seville are majolica style tiles, made by painting designs directly on the ceramic tiles."],"a":2,"r":"Choice C is the best answer. The sentence contrasts the two styles of tiles, noting that tiles in the arista style have designs stamped into them, whereas tiles in the majolica style have designs painted directly on them. Choice A is incorrect because the sentence indicates that the two styles of tile can be found in the same location; it doesn’t contrast the two styles of tile. Choice B is incorrect because the sentence indicates that the Royal Alcázar of Seville features tiles in both the majolica and arista styles; it doesn’t contrast the two styles of tile. Choice D is incorrect because the sentence indicates that the tilework of the Royal Alcázar of Seville includes tiles in the majolica style; it doesn’t contrast tiles in the majolica style with tiles in the arista style."},{"i":"e1453c88","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: 1914: British explorer Ernest Shackleton and a small crew embarked on an expedition to Antarctica. 1915: Shackleton’s ship Endurance became stuck in ice before eventually breaking apart and sinking. 1916: After more harrowing sea-ice adventures, the entire crew was rescued. 1959: Historian Alfred Lansing wrote a book called Endurance: Shackleton’s Incredible Voyage. 2001: Filmmaker George Butler released a documentary called The Endurance: Shackleton’s Legendary Antarctic Expedition. 2022: The wreckage of Endurance was discovered at the bottom of Antarctica’s Weddell Sea. The student wants to provide a historical overview of the Shackleton expedition.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Leaving in 1914 for Antarctica, Shackleton and his crew underwent many harrowing sea-ice adventures, including losing their ship in 1915, before being rescued in 1916.","In 1914, the Shackleton expedition sailed to Antarctica, where, in 1916, they rescued the crew of a ship that had sunk, Endurance (the wreckage of which was discovered in 2022).","Shackleton’s expedition has inspired a 1959 book, a 2001 film, and a 2022 discovery.","Alfred Lansing wrote about the history of Shackleton’s 1914–16 expedition in the book Endurance: Shackleton’s Incredible Voyage (1959); years later, in 2001, George Butler released a documentary about the expedition."],"a":0,"r":"Choice A is the best answer. The sentence provides a historical overview of the Shackleton expedition, noting that the explorers left for Antarctica in 1914, lost their ship in 1915, and were rescued in 1916. Choice B is incorrect. The sentence misrepresents information from the notes; Shackleton and his crew were themselves rescued in 1916—they weren’t rescuing others. Choice C is incorrect. The sentence provides examples of works and discoveries inspired by the expedition; it doesn’t provide an overview of the expedition itself. Choice D is incorrect. The sentence provides examples of works made about the expedition; it doesn’t provide an overview of the expedition itself."},{"i":"37ec26e7","c":"trans","d":"E","s":"In order to create the Global Positioning System (GPS), scientists had to develop an accurate mathematical model of Earth’s shape that accounted for various forces, such as tides. ______ it was mathematician Gladys West who wrote the computer program that could perform these necessary calculations.\n\nWhich choice completes the text with the most logical transition?","o":["Ultimately,","In other words,","Secondly,","In addition,"],"a":0,"r":"Choice A is the best answer. \"Ultimately\" logically signals that West’s completion of the computer program was the conclusion of the process described in the previous sentence, in which scientists working on GPS sought to develop a mathematical model of Earth. Choice B is incorrect because \"in other words\" illogically signals that the information about West’s program is a restatement of the information about the scientists’ efforts to develop a mathematical model of Earth. Instead, West’s program was the conclusion of those efforts. Choice C is incorrect because \"secondly\" illogically signals that West’s completion of the computer program was merely the next step in the scientists’ efforts to develop a mathematical model of Earth. Instead, West’s program was the conclusion of those efforts. Choice D is incorrect because \"in addition\" illogically signals that West’s completion of the computer program was merely additional information related to the scientists’ work on GPS. Instead, West’s program was the conclusion of the scientists’ efforts to develop a mathematical model of Earth."},{"i":"ab1f424a","c":"trans","d":"M","s":"Working together with the Navajo Nation Department of Water Resources, Dr. Lani Tsinnajinnie analyzed data about snowpack levels in the Chuska Mountains. She found that the snowpack (the amount of snow on the ground) was deepest in early March at lower elevations. At higher elevations, ______ the snowpack was deepest in mid-March.\n\nWhich choice completes the text with the most logical transition?","o":["in other words,","for instance,","on the other hand,","in summary,"],"a":2,"r":"Choice C is the best answer. \"On the other hand\" logically signals that the information in the sentence—that the snowpack at higher elevations in the Chuska Mountains was deepest in mid-March—contrasts with the previous information about the snowpack at lower elevations being deepest in early March. Choice A is incorrect because \"in other words\" illogically signals that information in the sentence is merely a paraphrase or restatement of the previous information about the snowpack at lower elevations. Instead, the information about the snowpack at higher elevations contrasts with that information. Choice B is incorrect because \"for instance\" illogically signals that the information in the sentence exemplifies the previous information about the snowpack at lower elevations. Instead, the information about the snowpack at higher elevations contrasts with that information. Choice D is incorrect because \"in summary\" illogically signals that the information in the sentence summarizes the previous information about the snowpack at lower elevations. Instead, the information about the snowpack at higher elevations contrasts with that information."},{"i":"3fd0ab63","c":"trans","d":"M","s":"Voting members of the 2002 Latin Grammys were impressed by Banda Cuisillos’s album Puras Rancheras Con Cuisillos and its contribution to the banda genre, a form of regional Mexican music featuring large ensembles of wind instruments and drums that first developed in southern and central Mexico in the mid-nineteenth century. ______ they awarded the group the Best Banda Album award.\n\nWhich choice completes the text with the most logical transition?","o":["In contrast,","Meanwhile,","Nevertheless,","Accordingly,"],"a":3,"r":"Choice D is the best answer. \"Accordingly\" logically signals that the information in this sentence—that the voting members awarded Banda Cuisillos the Best Banda Album award—is in accordance with, or results from, the previous information about the voters being impressed by Banda Cuisillos’s album. Choice A is incorrect because \"in contrast\" illogically signals that the information in this sentence contrasts with the previous information about voting members being impressed by Banda Cuisillos’s album. Instead, the voters’ decision to give the group the Best Banda Album award is in accordance with, or results from, that information. Choice B is incorrect because \"meanwhile\" illogically signals that the information in this sentence is separate from (while occurring simultaneously with) the previous information about the voting members being impressed by Banda Cuisillos’s album. Instead, the voters’ decision to give the group the Best Banda Album award is in accordance with, or results from, that information. Choice C is incorrect because \"nevertheless\" illogically signals that the information that follows is despite the information about the voting members being impressed by Banda Cuisillos’s album. Instead, the voters’ decision to give the group the Best Banda Album award is in accordance with, or results from, that information."}],"img":{"8af28416":"iVBORw0KGgoAAAANSUhEUgAAArwAAAI4BAMAAAB6tSe+AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABNtUlEQVR42u1dd3wUxRf/zl5Jz80m9JZNQpN6CU360UUEAiIqohyggIAYREAENKDS0YAoXYOi0oSAIB1C+dHL0WvIh
