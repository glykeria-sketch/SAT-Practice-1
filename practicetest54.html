<script>
const D={"t":"Practicetest54","q":[{"i":"cf9a3f34","c":"vocab","d":"E","s":"The following text is adapted from Elizabeth von Arnim’s 1922 novel The Enchanted April. Mrs. Wilkins and her friend Rose are traveling in Italy. “I’m going to have one of these gorgeous oranges,” said Mrs. Wilkins, staying where she was and reaching across to a black bowl piled with them. “Rose, how can you resist them. Look—have this one. Do have this beauty—” And she held out a big one.\n\nAs used in the text, what does the phrase “reaching across to” most nearly mean?","o":["Joining with","Gaining on","Stretching toward","Arriving at"],"a":2,"r":"Choice C is the best answer because as used in the text \"reaching across to\" most nearly means stretching toward. The text begins with Mrs. Wilkins stating that she wants to have one of the oranges that she’s admiring. The text then indicates that Mrs. Wilkins, staying where she is, holds out a big orange to her friend. This context suggests that when the text describes Mrs. Wilkins as reaching across to the bowl of oranges, it means that she is stretching toward the bowl. Choice A is incorrect because the text never suggests that Mrs. Wilkins is joining with, or becoming attached to, the bowl of oranges. Rather, the text indicates that she is stretching toward the bowl so she can pick out oranges for herself and her friend Rose to eat. Choice B is incorrect because the text never suggests that Mrs. Wilkins is gaining on, or overtaking in a competition or race, the bowl of oranges. The text suggests instead that the bowl is sitting still on a surface and that Mrs. Wilkins is extending her arm toward the bowl so she can pick out oranges for herself and her friend Rose to eat. Choice D is incorrect because the text doesn’t indicate that Mrs. Wilkins is arriving at the bowl of oranges. In fact, the text states that Mrs. Wilkins stays where she is when reaching across to the bowl, meaning that she remains at a distance from it."},{"i":"1c7fe9be","c":"vocab","d":"M","s":"At the turn of the twentieth century, Black residents of Richmond, Virginia, had few formal options for banking and other financial services. To ______ this situation, Maggie Lena Walker chartered the St. Luke Penny Savings Bank in 1903. The bank went on to provide home loans and savings opportunities to thousands of Black families over the following decades.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["prolong","rectify","retain","highlight"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of how Maggie Lena Walker addressed the lack of financial services available to Black residents in Richmond, Virginia, at the turn of the twentieth century. In this context, \"rectify\" means to correct or remedy something undesirable. The text indicates that by chartering the St. Luke Penny Savings Bank in 1903, Walker took action to provide local Black residents with greater access to financial services like home loans and savings opportunities. This context supports the idea that she aimed to rectify the undesirable situation affecting these residents. Choice A is incorrect because in this context, \"prolong\" would mean to lengthen something in time. The text indicates that at the turn of the twentieth century, Black residents in Richmond, Virginia, were faced with a lack of formal banking options. The text then states that Walker founded a new bank that provided these residents with financial services. Therefore, instead of prolonging the situation, she took steps to rectify, or correct, it. Choice C is incorrect because in this context, \"retain\" would mean to continue to have or to keep something. According to the text, at the turn of the twentieth century, Black residents in Richmond, Virginia, had few formal banking options, and Walker chartered a new institution to provide these residents with expanded financial services; therefore, she took steps to rectify, not retain, the situation. Choice D is incorrect because in this context, \"highlight\" would mean to emphasize or call attention to something, but the text indicates that Walker took concrete steps beyond merely drawing attention to the situation Black residents were facing in Richmond, Virginia, at the turn of the twentieth century. According to the text, Walker worked to rectify, or correct, the lack of formal banking options that were available to these residents by establishing a bank that provided them with home loans and savings opportunities."},{"i":"1455b754","c":"vocab","d":"H","s":"While recent scholarship has undermined claims that the works of twelfth-century Islamic philosopher Ibn Rushd were ______ other Muslim philosophers of his time, it is indisputable that his location in the Muslim-ruled area of what is now Spain meant that his works were primarily available thousands of miles west of the era’s center of Islamic thought.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["controversial among","antagonistic toward","imitated by","inconsequential to"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the twelfth-century Islamic philosopher Ibn Rushd. As used in this context, \"inconsequential to\" means not significant to. According to the text, Ibn Rushd’s works were primarily available in Spain, where he lived, far from central areas of the Muslim world, a fact that could support the conclusion that his influence on Muslim contemporaries was limited. The text implies, however, that recent scholarship has shown that his works still had an impact on other Muslim philosophers of his time. This context supports the idea that his works weren’t inconsequential to Islamic thought in this period. Choice A is incorrect because the issue under consideration in the text is whether other Muslim philosophers of Ibn Rushd’s time had access to his works, not whether his works were \"controversial among,\" or causing dispute among, other philosophers. Choice B is incorrect. The text implies that other Muslim philosophers of Ibn Rushd’s era were aware of his works, not that they were \"antagonistic toward,\" or hostile toward, them. There is no suggestion that Ibn Rushd’s writings elicited hostility from his contemporaries. Choice C is incorrect because in this context, \"imitated by\" would mean followed as a model by. Although the text implies that Ibn Rushd’s works were at least somewhat available in regions that were at the center of Islamic thought during the period, it doesn’t specifically address in what ways his works influenced contemporary Muslim philosophers. Thus, the text doesn’t support the idea that other philosophers modeled their own works after Ibn Rushd’s works."},{"i":"7bc05fa2","c":"vocab","d":"H","s":"Whether the reign of a French monarch such as Hugh Capet or Henry I was historically consequential or relatively uneventful, its trajectory was shaped by questions of legitimacy and therefore cannot be understood without a corollary understanding of the factors that allowed the monarch to ______ his right to hold the throne.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["disengage","annotate","buttress","reciprocate"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the legitimacy of the reigns of French monarchs such as Hugh Capet and Henry I. As used in this context, “buttress” means to strengthen or defend. The text indicates that regardless of whether a French monarch’s reign was significant or uneventful, each monarch faced questions about his right to the throne. The text goes on to say that in order to understand the path of a French monarch’s reign, it’s important to understand what contributed to the monarch’s ability to “hold the throne.” This context suggests that French monarchs such as Hugh Capet and Henry I had to buttress, or defend, their right to be monarch. Choice A is incorrect because it wouldn’t make sense in context to discuss factors that enabled a monarch to “disengage,” or withdraw his right to the French throne. The text focuses on an examination of people who reigned as French monarchs, not on people who didn’t choose to rule. Choice B is incorrect because it wouldn’t make sense in context to discuss factors that enabled a monarch to “annotate,” or add notes to or explain, his right to the French throne. Nothing in the text suggests that the monarchs were writing notes about their right to the throne; instead, faced with questions about the legitimacy of their reign, the monarchs defended their right. Choice D is incorrect. Saying that a monarch who is faced with questions about the legitimacy of his reign was able to “reciprocate” his right to the French throne would mean that he either returned his right to the throne or that he responded in kind to the challenge. Neither of these meanings would make sense in context because the text focuses on people who did reign as French monarchs and defended their right to do so."},{"i":"d9e55268","c":"purpose","d":"M","s":"The following text is adapted from Louise Erdrich’s 2020 novel The Night Watchman. Louis Pipestone is collecting signatures for a petition from fellow members of the Turtle Mountain Band of Chippewa on the tribe’s reservation in North Dakota. Louis Pipestone tended the petition like a garden. He kept it with him at all times. In town, his eyes sharpened when he noticed a tribal member who hadn’t yet signed. Wherever they were—at the gas pump, mercantile [general store], at Henry’s [Café], on the road, or outside the clinic and hospital—Louis cornered them. If they were waiting for a baby to be born, he’d have them sign. If they were laughing, if they were arguing. If they were taking a child home from school, they signed. ©2020 by Louise Erdrich Which choice best states the main purpose of the text?","o":["To suggest that some tribal members refuse to sign the petition because they dislike Louis Pipestone","To show that attitudes toward the petition within the tribal community change over time","To demonstrate that most tribal members are enthusiastic about signing the petition","To portray Louis Pipestone’s strong commitment to collecting signatures for the petition"],"a":3,"r":"Choice D is the best answer because it most accurately states the text’s main purpose. The text indicates that Louis always had his petition with him, asked everyone he encountered to sign it if they hadn’t already, and lists several comical circumstances in which he might try to get someone to sign. Thus, the main purpose of the text is to illustrate Louis’s dedicated focus on getting people to sign the petition. Choice A is incorrect. Although the text suggests that Louis was aggressive in seeking signatures for the petition—for example, saying that he \"cornered\" people—nothing in the text addresses how those people feel toward Louis, let alone that they are refusing his request. Choice B is incorrect because, other than portraying Louis’s commitment to gathering signatures, the text doesn’t discuss community members’ attitudes toward Louis or the petition. Choice C is incorrect because the text never mentions the attitudes of the people Louis approaches toward the petition, but the text does indicate that he \"cornered\" prospective signatories, strongly suggesting that their enthusiasm was neither needed nor considered."},{"i":"e5ca7687","c":"purpose","d":"E","s":"Archaeologists studying the ancient city of Pompeii in Italy recently discovered a well-preserved food shop known as a thermopolium. The site contains food remains, artworks, and decorations. These items give researchers a better understanding of what daily life in Pompeii may have been like. For example, the archaeologists found a ceramic jar that they believe likely contained a meat and seafood stew.\n\nWhich choice best states the main purpose of the text?","o":["To compare ancient artworks with modern ones","To discuss the political system of Italy","To present a recent archaeological discovery","To describe a region’s climate"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text. The text states that archaeologists recently discovered a well-preserved food shop, or thermopolium, in Pompeii, Italy. The text then further describes the contents of the discovery and provides an example of what was found. Thus, the overall purpose of the text is to present a recent archaeological discovery. Choice A is incorrect. Although the text states that archaeologists found ancient artworks, it doesn’t compare these artworks to modern ones or to any other artworks. Choice B is incorrect. Although the archaeological discovery discussed in the text was made in Italy, the text doesn’t provide any information about politics or government in Italy. Choice D is incorrect because the text doesn’t discuss the climate where the archaeological discovery was made or in any other region."},{"i":"c502943e","c":"func","d":"E","s":"The following text is adapted from Cynthia Kadohata’s 2004 novel Kira-Kira. <u>[Uncle Katsuhisa] was as loud as my father was quiet.<\/u> Even when he wasn’t talking, he made a lot of noise, clearing his throat and sniffing and tapping his fingers. ©2004 by Cynthia Kadohata Which choice best describes the function of the underlined sentence?","o":["It lists the kinds of topics Uncle Katsuhisa enjoys discussing.","It suggests that Uncle Katsuhisa dislikes meeting new people.","It contrasts Uncle Katsuhisa with the narrator’s father.","It describes a conversation between the narrator and the narrator’s father."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The underlined sentence establishes a difference between Uncle Katsuhisa and the narrator’s father by describing Uncle Katsuhisa as \"loud\" and the narrator’s father as \"quiet.\" The text then elaborates on that contrast, describing some ways Uncle Katsuhisa is very noisy even when he isn’t speaking. Choice A is incorrect because the text doesn’t indicate what kinds of topics Uncle Katsuhisa enjoys discussing, only that he is loud even when he isn’t speaking. Choice B is incorrect because the text never indicates how Uncle Katsuhisa feels about meeting new people, only how loud he is. Choice D is incorrect because the text never describes a conversation occurring between any people; it refers to talking only when stating that Uncle Katsuhisa is loud even when he isn’t speaking."},{"i":"df45f0eb","c":"func","d":"H","s":"<u>Several studies have found negligible electoral consequences for governments that impose fiscal austerity measures, yet some European governments recently suffered electorally due to their austerity programs.<\/u> Evelyne Huebscher and colleagues attribute this incongruity to governments’ tendency—not followed in the recent European cases—to implement austerity programs strategically to avoid electoral costs (e.g., setting spending cuts to take effect only after the next election), which has obscured the inherent political risks of austerity measures in the election data scholars have examined.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It explains a discrepancy between what has been observed in study settings and what has been observed in real-world settings that the text goes on to assert is attributable to the studies not using real-world data.","It identifies a conflict between research findings and recent events that the text goes on to suggest is a consequence of a complicating factor in the data used to generate those findings.","It presents a long-standing divergence in research findings that the text goes on to say is due to different groups of researchers using data that derive from different electoral circumstances.","It describes a recent exception to a general pattern in research findings that the text goes on to explain is a result of researchers underestimating the significance of inconsistencies in the data they’ve analyzed."],"a":1,"r":"Choice B is the best answer because it best describes how the underlined sentence functions in the text as a whole. The underlined sentence explains that contrary to what several studies would suggest, recent European governments suffered electorally after the launch of fiscal austerity programs. The text goes on to indicate that the researchers generated their findings from data that didn’t reveal the true political risk of austerity measures because the data were based on cases in which governments had set austerity programs to take effect after the next election, a practice the European governments that recently suffered electorally didn’t adhere to, thus introducing a complicating factor resulting in a conflict between the research findings and recent events. Choice A is incorrect because the underlined sentence doesn’t indicate that the discrepancy described in the text is between observations made in study settings and observations made in real-world settings. Rather, the underlined sentence indicates that the outcome of recent events is contrary to what would be expected based on the findings of several studies. Additionally, there is nothing in the text to suggest that the studies mentioned did not use real-world data; instead, the text indicates that the data used was generated under potentially different circumstances than the recent events. Choice C is incorrect because the underlined sentence doesn’t present a long-standing divergence in research findings but rather a discrepancy between past research findings and recent events that the text goes on to attribute to researchers’ use of data that didn’t reveal the true political risk of austerity measures. Choice D is incorrect because while the underlined sentence notes that there have been some recent exceptions to a general pattern observed in several research studies, it does not go on to attribute this exception to the researchers underestimating inconsistencies in the data. Rather, the text goes on to attribute this to a circumstance (fiscal austerity measures being implemented before an election rather than after) which adds a complicating factor into the data not accounted for in past studies."},{"i":"592f94c2","c":"cross","d":"H","s":"Text 1 Good art often challenges and disrupts social and aesthetic norms, but the creation of public art—paintings, sculptures, and performance pieces displayed in nonmuseum or nontheatrical public settings—typically requires broad agreement among artists, civic officials, and community members about the works’ message and artistic goals. <u>Public art that fails to appease everyone by being sufficiently aesthetically and conceptually bland almost inevitably provokes backlash.<\/u>\n\nText 2 Public art is commonly displayed in spaces intended for purposes other than meaningful aesthetic engagement. Some critics of public art therefore note that norm-defying pieces that aren’t effectively integrated within their surroundings in a manner that primes passersby to appreciate the pieces’ merits (as is often the case) tend to be regarded more unfavorably than similarly provocative art encountered in museums is.\n\nBased on the texts, how would the critics mentioned in\n\nText 2 most likely respond to the underlined claim in\n\nText 1?","o":["By arguing that the reason members of the general public might disagree about a public artwork’s merits is unrelated to the unconventionality of its appearance and ideas","By agreeing with the idea that only works of art that are universally appealing are suitable for displaying in public spaces","By disputing the notion that civic leaders and community members are easily placated by art that is intended mainly to reinforce social norms","By contending that the kinds of reactions controversial public artworks often receive aren’t exclusively the result of attributes inherent in the works themselves"],"a":3,"r":"Choice D is the best answer because the critics mentioned in Text 2 would argue that negative reactions to controversial public art are not solely the result of the nature of the art itself. The claim in Text 1 suggests that public artworks tend to provoke backlash when they are not “aesthetically and conceptually bland.”This implies that the content of public art alone can cause backlash. However, the critics in Text 2 offer a more nuanced explanation. They argue that norm-defying pieces of public art that are not “effectively integrated within their surroundings” are more likely to be judged harshly by the public. They also imply that a museum provides a context that prepares viewers to expect challenging art, while public environments that serve other purposes often do not. This indicates that the critics in Text 2 would contend that factors beyond the attributes of the art, like environment and presentation, play a significant role in how public art is received. Choice A is incorrect because the critics in Text 2 do not argue that unconventionality is unrelated to public disagreement about a public artwork’s merits. Rather, they acknowledge that norm-defying pieces do face unfavorable reactions, but they attribute such reactions to contextual factors like poor integration with the environment rather than dismissing the role of unconventionality entirely. Choice B is incorrect because the critics in Text 2 do not advocate for restricting public art to universally appealing works. Instead, they argue that better integration with the surroundings and situating the work in appropriate contexts could help norm-defying art be better received by passersby. Choice C is incorrect because the critics in Text 2 do not address whether civic leaders and community members are easily satisfied by norm-reinforcing art. The critics in Text 2 instead argue that installation and integration with the surrounding environment factor into how norm-defying art is received by the general public, rather than disputing how people respond to conventional art."},{"i":"c889e52e","c":"main","d":"E","s":"In 1935 Hallie Flanagan was chosen to lead the Federal Theatre Project (FTP). This project was part of the new Works Progress Administration (WPA), a program created by President Franklin D. Roosevelt to provide jobs for unemployed people during the Great Depression. As the director of the FTP , Flanagan created jobs for over 12,500 performers, designers, and other theater professionals across the country. She also kept ticket prices low for the shows they staged, which meant that many people could afford to experience theater for the first time.\n\nWhich choice best states the main idea of the text?","o":["Jobs provided by the FTP were intended mainly for performers, designers, and other theater professionals.","President Roosevelt created the WPA to provide jobs for unemployed people.","During the Great Depression, many people couldn’t afford to buy theater tickets.","As the director of the FTP , Flanagan succeeded in creating many jobs and introducing people to theater."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text begins by stating that Flanagan was chosen in 1935 to lead the Federal Theatre Project (FTP), which was part of a program created by President Franklin D. Roosevelt. The text then explains that as the director of the FTP , Flanagan created jobs for more than 12,500 theater professionals and ensured that ticket prices stayed low so that many people could afford to experience theater for the first time. Thus, the main idea of the text is that as the FTP’s director, Flanagan succeeded in creating many jobs and introducing people to theater. Choice A is incorrect. The text does suggest that jobs provided by the FTP were intended mainly for theater professionals, but this isn’t the text’s main idea. The focus of the text is Hallie Flanagan’s work as the director of the FTP , with the text’s main point being that Flanagan succeeded in creating many jobs and introducing people to theater. Choice B is incorrect. The text does state that President Roosevelt created the WPA to provide jobs for unemployed people, but this is supporting information, not the text’s main idea. The focus of the text is Hallie Flanagan’s work as the director of the FTP , which was part of the WPA, and the text’s main point is that Flanagan succeeded in creating many jobs and introducing people to theater. Choice C is incorrect. It’s true that many people couldn’t afford to buy theater tickets during the Great Depression, but this isn’t the text’s main idea. The focus of the text is Hallie Flanagan’s work as the director of the FTP , with the text’s main point being that Flanagan succeeded in creating many jobs and introducing people to theater."},{"i":"d0fbf1ae","c":"main","d":"H","s":"Algae living within the tissues of corals play a critical role in keeping corals, and the marine ecosystems they are part of, thriving. Some coral species appear brown in color when healthy due to the algae colonies living in their tissues. In the event of an environmental stressor, the algae can die or be expelled, causing the corals to appear white. To recover the algae, the bleached corals then begin to produce bright colors, which block intense sunlight, encouraging the light-sensitive algae to recolonize the corals. What does the text most strongly suggest about corals that produce bright colors?","o":["These corals have likely been subjected to stressful environmental conditions.","These corals are likely more vulnerable to exposure from intense sunlight than white corals are.","These corals have likely recovered from an environmental event without the assistance of algae colonies.","These corals are more likely to survive without algae colonies than brown corals are."],"a":0,"r":"Choice A is the best answer. The text says that corals produce bright colors to block sunlight and encourage algae to recolonize after “an environmental stressor.” From this, we can infer that corals that produce bright colors have probably been subjected to an environmental stressor. Choice B is incorrect. The text says that corals produce bright colors to block intense sunlight, which protects the light-sensitive algae that keep the coral healthy. In other words, bright colors make the coral’s health less vulnerable to intense sunlight. Choice C is incorrect. The text says that corals produce bright colors to encourage algae to recolonize, not that they have recovered without the assistance of algae colonies. Choice D is incorrect. The text never compares the likelihood of differently colored corals surviving without algae colonies."},{"i":"dbbbc5dd","c":"infer","d":"E","s":"Off-off-Broadway theaters emerged in the late 1950s as a rebellion against mainstream Broadway theaters in New York, freeing artists to create productions that were more experimental than typical Broadway shows. One such artist was playwright María Irene Fornés. Working with off-off Broadway theaters enabled Fornés not only to direct her own plays but also to direct them exactly as she intended them to be staged, regardless of how strange the results might have seemed to audiences accustomed to Broadway shows. In this way, Fornés ______ Which choice most logically completes the text?","o":["wrote plays that would have been too expensive to produce if someone else had directed the production.","recognized that staging an off-off-Broadway play was more complicated than staging a Broadway play.","would have been more famous if she had created plays that were mainstream instead of experimental.","illustrates the artistic opportunity offered by off-off Broadway theaters."],"a":3,"r":"Choice D is the best answer. The text says that off-off-Broadway theaters allowed artists to create more experimental shows, and then discusses how Fornés was free to direct her own “strange” plays however she wanted. This suggests that Fornés exemplifies the artistic freedom of off-off Broadway theaters. Choice A is incorrect. This inference isn’t supported. The text never discusses the costs of production, so we can’t logically make this claim. Choice B is incorrect. This inference isn’t supported. The text never discusses the complexity of staging plays either on Broadway or off-off Broadway, so there’s no basis to make this inference. Choice C is incorrect. This inference isn’t supported. The text never discusses fame at all, so there’s no basis to make this inference."},{"i":"787729be","c":"infer","d":"E","s":"Martin Dančák, Wewin Tjiasmanto, and colleagues have identified a new carnivorous plant species (Nepenthes pudica) in Indonesia. Like other carnivorous plants, N. pudica has pitfall traps, or pitchers, that capture prey, but unlike others, the pitchers of N. pudica are located underground. The researchers unearthed the new species on fairly dry ridges with surfaces that host few other plants and animals. Therefore, the researchers hypothesize that the N. pudica species likely ______ Which choice most logically completes the text?","o":["represents one of many undiscovered carnivorous plant species in the region.","formed pitchers early in development to absorb more moisture.","is buried by nearby animals as they forage along the ridges for food.","evolved to have underground traps to access more prey than would surface traps."],"a":3,"r":"Choice D is the best answer. The text says that N.pudica’s prey-catching pitchers are underground. It also says that the ridges where N. pudica lives don’t have many plants and animals on the surface. This suggests that N. pudica evolved underground pitchers in order to catch more prey. Choice A is incorrect. This inference isn’t supported. The text never mentions the possibility of other undiscovered carnivorous plant species in Indonesia, so there’s no basis to make this inference. Choice B is incorrect. This inference isn’t supported. The text does say that the ridges where N. pudica lives are dry, but it also says that the purpose of carnivorous plant pitchers is to capture prey. It never suggests that these pitchers also absorb moisture, so there’s no basis to make this inference. Choice C is incorrect. This inference isn’t supported. The text never suggests that N. pudica’s underground pitcher can catch animals on the surface, so there’s no basis to make this inference."},{"i":"e7dc27dc","c":"claim","d":"E","s":"As a monthly newsletter formed in 1969 by a group of Asian American students at the University of California, Los Angeles, Gidra helped raise awareness about social and political issues concerning the Asian American community on campus and at large. The newsletter had an expansive reach for a publication of its kind: around 4,000 copies were published each month. A student writing a history paper, however, hypothesizes that Gidra’s influence cannot be measured by the number of newsletters published monthly alone.\n\nWhich finding, if true, would most directly support the student’s hypothesis?","o":["The students who initially formed Gidra each contributed financially to its creation.","In addition to covering current events, Gidra also featured works of art and literature.","Gidra was initially based out of the Asian American Studies Center at UCLA.","People would often give their copies of Gidra to others once they had finished reading an issue."],"a":3,"r":"Choice D is the best answer. If there were more Gidra readers than there were copies of the newsletter, then the newsletter’s influence would be much greater than its 4,000 monthly copies. Choice A is incorrect. Information about the newsletter’s initial funding doesn’t tell us about the influence that the newsletter eventually had. Choice B is incorrect. While the content of Gidra was undoubtedly related to the newsletter’s influence, this information isn’t relevant to the specific hypothesis about monthly circulation numbers. Choice C is incorrect. Where the publishers of Gidra were initially based doesn’t tell us about the newsletter’s overall influence."},{"i":"b4cda84d","c":"claim","d":"M","s":"In 1967 the US Congress created the Corporation for Public Broadcasting, which in turn created National Public Radio (NPR). NPR began producing and distributing high-quality news and cultural programming to affiliate stations across the United States in 1971. In a research paper, a student claims that the Corporation for Public Broadcasting and NPR were inspired by the British Broadcasting System (BBC), which had been established in the 1920s.\n\nWhich quotation from a work by a historian would be the most effective evidence for the student to include in support of this claim?","o":["“Although the BBC had begun as a private corporation, politicians successfully argued to make it a public company because they believed a public broadcaster could help build national unity in the aftermath of World War I.”","“For many decades, the BBC had no competition since it held Britain’s only broadcasting license, whereas in the United States, the Corporation for Public Broadcasting launched NPR in a broadcasting market already filled with competitors.”","“Congress’s embrace of publicly funded broadcasting reflected a common belief among US politicians that the role of government was not only to ensure people’s safety and liberty but also to enrich people’s lives in other ways.”","“The goal of the BBC was to support British democracy by promoting an informed citizenry, and US legislators believed that ensuring access to high-quality programming could do the same for democracy in the United States.”"],"a":3,"r":"Choice D is the best answer because this quotation would be the most effective evidence to include in support of the claim that the Corporation for Public Broadcasting and NPR were inspired by the British Broadcasting System (BBC). The quotation states that the goal of the BBC was to support British democracy and that US legislators believed high-quality programming could accomplish the same goal for democracy in the United States. In other words, US legislators looked to the BBC as a model, taking direct inspiration from it when they created the Corporation for Public Broadcasting, which in turn created NPR. Choice A is incorrect because this quotation provides historical information about the BBC, not information about the inspiration for the creation of the Corporation for Public Broadcasting and NPR. This quotation, therefore, is irrelevant to the student’s claim that the BBC inspired the creation of the Corporation for Public Broadcasting, which in turn created NPR. Choice B is incorrect because this quotation contrasts the lack of competition faced by the BBC with the substantial competition faced by NPR, which has no bearing on the student’s claim that the Corporation for Public Broadcasting and NPR were inspired by the BBC. Choice C is incorrect because this quotation focuses on a common belief among US politicians that inspired Congress’s embrace of publicly funded broadcasting. The quotation doesn’t say anything about the BBC and therefore doesn’t support the claim that the BBC inspired Congress to create the Corporation for Public Broadcasting, which in turn created NPR."},{"i":"7a1877be","c":"graph","d":"H","s":"","o":["Isoguanine and purine were detected in both meteorite samples but not in the soil sample.","Adenine and xanthine were detected in both of the meteorite samples and in the soil sample.","Hypoxanthine and purine were detected in both the Murchison meteorite sample 2 and in the soil sample.","Isoguanine and hypoxanthine were detected in the Murchison meteorite sample 1 but not in sample 2."],"a":0,"r":"Choice A is the best answer. The researchers concluded that the meteorite’s nucleobases weren’t the result of soil contamination. Presence of nucleobases in the meteorite and not in soil provides evidence that those nucleobases likely didn’t come from the soil. Choice B is incorrect. This choice doesn’t justify the conclusion. The researchers concluded that the meteorite’s nucleobases weren’t the result of soil contamination. If the nucleobases are present in both the soil and meteorite, then it’s possible that these nucleobases came from the soil. Choice C is incorrect. This choice misreads the table. Purine was not detected in the soil sample. Choice D is incorrect. This choice misreads the table. Both isoguanine and hypoxanthine were detected in both Murchison meteorite samples."},{"i":"a95075c5","c":"graph","d":"M","s":"","o":["ranged from 5.0 to 92.00, indicating that well-being varied widely from participant to participant.","were lower for two measures, with the rating for only one measure indicating greater well-being for these participants.","ranged from 3.9 to 46.00, with no rating indicating greater well-being in any measure for these participants.","were higher for all three measures, indicating greater overall well-being for these participants."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to complete the statement comparing the mean ratings for two different groups of participants in a study. The text explains that a research team evaluated the study’s participants using various measures in order to learn whether there might be a medical benefit to telling patients they’re receiving a placebo. The table shows the team’s mean ratings for participants after 21 days for three of the measures: global improvement, symptom severity reduction, and quality of life improvement. According to the table, the mean ratings were higher for all three measures for participants aware of taking a placebo than for participants in the control group. Given that higher ratings indicate greater well-being, as the text states, the mean ratings in the table indicate greater overall well- being for participants aware of taking a placebo than for participants in the control group. Choice A is incorrect because the table doesn’t include data about individual participants; rather, it presents means, or mathematical averages, of ratings. For this reason, no conclusions can be drawn from data in the table about the extent to which well-being may have varied from participant to participant. Choice B is incorrect because according to the table, the mean ratings for participants aware of taking a placebo were higher for all three measures than for participants in the control group, not lower for two of the measures. Choice C is incorrect because it cites data from the table related to participants in the control group, not to participants aware of taking a placebo. Additionally, the mean ratings in the table for participants aware of taking a placebo are higher for all three measures than for participants in the control group. Given that higher ratings indicate greater well-being, as the text states, the ratings in the table for participants aware of taking a placebo indicate greater well-being for these participants in all three measures."},{"i":"aa443c4b","c":"fss","d":"H","s":"Recent pollen analyses of the Aran Islands have led some researchers to propose that the now treeless islands were once wooded. This hypothesis ______ that certain trees, such as P . sylvestris, survived without interruption or human intervention throughout the Holocene cannot stand, researchers Michael O’Connell and Karen Molloy counter, unless other explanations can first be ruled out.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["suggesting","suggested","suggests","has suggested"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite present participle \"suggesting\" is correctly used to form a restrictive participial phrase (\"suggesting...Holocene\") within the main clause (\"This hypothesis...cannot stand...\"). This participial phrase functions as part of the sentence’s subject (\"This...Holocene\"), providing essential identifying information about what the hypothesis states—namely, that certain trees survived without interruption or human intervention throughout the Holocene. Choice B is incorrect because it results in an ungrammatical sentence. The finite verb \"suggested\" can’t be used in this way within the subject of the sentence. Choice C is incorrect because it results in an ungrammatical sentence. The finite verb \"suggests\" can’t be used in this way within the subject of the sentence. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb \"has suggested\" can’t be used in this way within the subject of the sentence."},{"i":"de3dd17d","c":"fss","d":"M","s":"Planetary scientist Briony Horgan and her colleagues have determined that as much as 25 percent of the sand on Mars is composed of impact spherules. These spherical bits of glass form when asteroids collide with the planet, ejecting bits of molten rock into the atmosphere that, after cooling and solidifying into glass, ______ back onto Mars’s surface.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to rain","raining","having rained","rain"],"a":3,"r":"Choice D is the best answer. \"That…[rain] back onto Mars’s surface\" is a relative clause that describes the \"bits of molten rock.\" Forming the clause requires a conjugated, finite verb, and this is the only choice that provides that. Choice A is incorrect. \"To rain\" is an infinitive and can’t serve as the main verb of a clause. A conjugated verb is needed here to form the main verb of the relative clause \"that…[rain] back onto Mars’s surface,\" which describes the \"bits of molten rock.\" Choice B is incorrect. \"Raining\" is a present participle and, on its own, can’t serve as the main verb of a clause. A conjugated verb is needed here to form the main verb of the relative clause \"that…[rain] back onto Mars’s surface,\" which describes the \"bits of molten rock.\" Choice C is incorrect. \"Having rained\" is a perfect participle and can’t serve as the main verb of a clause. A conjugated verb is needed here to form the main verb of the relative clause \"that…[rain] back onto Mars’s surface,\" which describes the \"bits of molten rock.\""},{"i":"bd11fe93","c":"fss","d":"E","s":"Dr. Rocío Paola Caballero-Gill is a paleoceanographer. This means that Dr. Caballero-Gill doesn’t just study oceans as they are today. She uses chemistry and fossil evidence ______ oceans as they were in the past.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has studied","to study","studied","studies"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite to-infinitive verb “to study” is correctly used to form a subordinate clause that indicates what Dr. Caballero-Gill uses chemistry and fossil evidence for (to study oceans as they were in the past). Choice A is incorrect because it results in an ungrammatical sentence. The finite verb “has studied” can’t be used in this way to form a subordinate clause that indicates what Dr. Caballero-Gill uses the evidence for. Choice C is incorrect because it results in an ungrammatical sentence. The finite verb “studied” can’t be used in this way to form a subordinate clause that indicates what Dr. Caballero-Gill uses the evidence for. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb “studies” can’t be used in this way to form a subordinate clause that indicates what Dr. Caballero-Gill uses the evidence for."},{"i":"a8fa749a","c":"bound","d":"H","s":"Nigerian author Buchi Emecheta’s celebrated literary oeuvre includes The Joys of Motherhood, a novel about the changing roles of women in 1950s ______ a television play about the private struggles of a newlywed couple in Nigeria; and Head Above Water, her autobiography.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Lagos, A Kind of Marriage,","Lagos; A Kind of Marriage,","Lagos, A Kind of Marriage:","Lagos; A Kind of Marriage"],"a":1,"r":"Choice B is the best answer. The convention being tested is the punctuation of items in a complex series (a series including internal punctuation). In this choice, the semicolon after “Lagos” is conventionally used to separate the first item (“The Joys…Lagos”) and the second item (“A Kind…Nigeria”) in the series. Further, the comma after “Marriage” correctly separates the title “A Kind of Marriage” from the supplementary phrase (“a television…Nigeria”) that describes it. Choice A is incorrect because the comma after “Lagos” doesn’t match the semicolon used later in the series to separate the second item (“A Kind…Nigeria”) from the third item (“and…autobiography”). Choice C is incorrect because the comma after “Lagos” doesn’t match the semicolon used later in the series to separate the second item (“A Kind…Nigeria”) from the third item (“and…autobiography”). Additionally, a colon can’t be used in this way to separate the title “A Kind of Marriage” from the supplementary phrase (“a television…Nigeria”) that describes it. Choice D is incorrect because it fails to use appropriate punctuation to separate the title “A Kind of Marriage” from the supplementary phrase (“a television… Nigeria”) that describes it."},{"i":"5670a657","c":"bound","d":"H","s":"During the decades-long movement to codify the rights of Latinos in the US, certain events were pivotal: the founding of social justice group the League of United Latin American Citizens in ______ Katzenbach v. Morgan court decision in 1966, which affirmed the rights of Latino voters, is another such event.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["1929. For one, the","1929, for one, the","1929 for one, the","1929, for one. The"],"a":3,"r":"Choice D is the best answer. The conventions being tested are punctuation use between sentences and the punctuation of a supplementary element. This choice correctly uses a period to mark the boundary between one sentence (\"During...one\") and another (\"The Katzenbach...event\") and uses a comma to separate the supplementary phrase \"for one\" from the preceding main clause. Further, placing the period after \"for one\" correctly indicates that the information in the preceding main clause (\"the founding...1929\") is the first example provided of a pivotal event in the Latino rights movement. Choice A is incorrect because placing the period after \"1929\" illogically indicates that the information in the next main clause (describing the Katzenbach v. Morgan court decision) is the first example provided of a pivotal event in the Latino rights movement; rather, it’s a second example. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to join two main clauses. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to join two main clauses. Moreover, it fails to use appropriate punctuation to separate the supplementary element \"for one\" from the preceding main clause."},{"i":"3fa48bf3","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: British scholar Robert Plot described fossilized dinosaur bones in his 1676 book The Natural History of Oxfordshire. Plot earned a reputation for being the first person to have discovered dinosaur remains. In 1990, archaeologists in Lesotho, in southern Africa, discovered a fossilized phalanx of a Massospondylus carinatus dinosaur in a cave once inhabited by humans. Indigenous Khoesan and Basotho peoples had inhabited the cave beginning around 1100 CE. According to paleontologist Julien Benoit, these peoples may have found the phalanx and brought it to the cave centuries before Plot’s descriptions. The student wants to emphasize the significance of the 1990 discovery to Plot’s reputation.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Benoit challenged Plot’s reputation for being the first person to have discovered M. carinatus remains.","Evidence that Khoesan and Basotho peoples may have found an M. carinatus phalanx as long ago as 1100 CE suggests that Plot may not have been the first person to have discovered dinosaur remains.","According to Benoit’s analysis of the 1990 discovery, Indigenous peoples in southern Africa may have brought the fossilized phalanx to the cave as long ago as 1100 CE.","In 1990, more than three centuries after Plot claimed in his book that he had found fossilized dinosaur bones, archaeologists uncovered evidence in southern Africa that disproved his claims."],"a":1,"r":"Choice B is the best answer. Noting that the evidence suggests Indigenous peoples may have found dinosaur remains in 1100 CE, the sentence emphasizes how the 1990 discovery challenged Plot’s reputation as the first person to discover dinosaur remains. Choice A is incorrect. While the sentence does emphasize that Benoit challenged Plot’s reputation, it misrepresents information in the notes; Plot was reputed to be the first person to discover dinosaur remains in general, not the first person to discover M. carinatus remains specifically. Choice C is incorrect. The sentence only partially explains the significance of the 1990 discovery, noting that it suggests Indigenous people brought dinosaur remains to the cave in 1100 CE; it doesn’t explain the discovery’s significance to Plot’s reputation. Choice D is incorrect. While the sentence does emphasize that the discovery challenged Plot’s reputation, it misrepresents information in the notes. The notes don’t indicate that the 1990 discovery cast any doubt on Plot’s claims to have found fossilized dinosaur bones; rather, the discovery challenged Plot’s reputation for being the first to discover dinosaur bones."},{"i":"63a4fa29","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In 2013, archaeologists studied cat bone fragments they had found in the ruins of Quanhucun, a Chinese farming village. The fragments were estimated to be 5,300 years old. A chemical analysis of the fragments revealed that the cats had consumed large amounts of grain. The grain consumption is evidence that the Quanhucun cats may have been domesticated. The student wants to present the Quanhucun study and its conclusions.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["As part of a 2013 study of cat domestication, a chemical analysis was conducted on cat bone fragments found in Quanhucun, China.","A 2013 analysis of cat bone fragments found in Quanhucun, China, suggests that cats there may have been domesticated 5,300 years ago.","In 2013, archaeologists studied what cats in Quanhucun, China, had eaten more than 5,000 years ago.","Cat bone fragments estimated to be 5,300 years old were found in Quanhucun, China, in 2013."],"a":1,"r":"Choice B is the best answer. The sentence presents the study, describing it as a 2013 analysis of Quanhucun cat bone fragments, and its conclusions, indicating what the analysis suggests about cat domestication in Quanhucun. Choice A is incorrect because the sentence focuses on the study’s methodology; it doesn’t present conclusions from the study. Choice C is incorrect. While the sentence provides a general overview of the study, it doesn’t present conclusions from the study. Choice D is incorrect. The sentence describes a finding from the study; it doesn’t present conclusions from the study."},{"i":"f114cbf0","c":"trans","d":"M","s":"A firefly uses specialized muscles to draw oxygen into its lower abdomen through narrow tubes, triggering a chemical reaction whereby the oxygen combines with chemicals in the firefly’s abdomen to produce a glow. ______ when the firefly stops drawing in oxygen, the reaction—and the glow—cease.\n\nWhich choice completes the text with the most logical transition?","o":["For instance,","By contrast,","Specifically,","In conclusion,"],"a":1,"r":"Choice B is the best answer. “By contrast” logically signals that the information in this sentence—that a firefly’s glow ceases when it stops drawing in oxygen—contrasts with the previous sentence’s discussion of the processes that cause a firefly to begin to glow. Choice A is incorrect because “for instance” illogically signals that the information in the sentence exemplifies the previous sentence’s discussion of how a firefly begins to glow. Instead, it contrasts with the previous sentence’s discussion. Choice C is incorrect because “specifically” illogically signals that the information in the sentence provides specific details elaborating on the previous sentence’s discussion of how a firefly begins to glow. Instead, it contrasts with the previous sentence’s discussion. Choice D is incorrect because “in conclusion” illogically signals that the information in the sentence sums up the previous sentence’s discussion of how a firefly begins to glow. Instead, it contrasts with the previous sentence’s discussion."},{"i":"c4f7f726","c":"trans","d":"E","s":"Many butterfly species have bold, brightly colored wings. ______ some butterfly species have wings that are almost completely colorless and transparent. Glasswing butterflies, for example, have see-through wings that make them nearly invisible.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","Previously,","In other words,","However,"],"a":3,"r":"Choice D is the best answer. \"However\" logically signals that the information in this sentence about butterfly species—that some have colorless, transparent wings—contrasts with the previous information about butterfly species with bold, colorful wings. Choice A is incorrect because \"similarly\" illogically signals that the information in this sentence is similar to the previous information about butterfly species. Instead, it contrasts with the previous information. Choice B is incorrect because \"previously\" illogically signals that this sentence describes an event that occurred before another event. Instead, the sentence provides information about butterfly species that contrasts with the information in the first sentence. Choice C is incorrect because \"in other words\" illogically signals that the information in this sentence is a paraphrase or restatement of the previous information about butterfly species. Instead, it contrasts with the previous information."},{"i":"e3edc138","c":"trans","d":"H","s":"In a heated debate in biogeography, the field is divided between dispersalists and vicariancists. ______ there are those who argue that dispersal is the most crucial determining factor in a species’ distribution, and those who insist that vicariance (separation due to geographic barriers) is. Biogeographer Isabel Sanmartín counts herself among neither.\n\nWhich choice completes the text with the most logical transition?","o":["Furthermore,","By contrast,","Similarly,","That is,"],"a":3,"r":"Choice D is the best answer. “That is” logically signals that this sentence clarifies the terms of the scientific debate introduced in the previous sentence by explaining the difference between dispersalists and vicariancists. Choice A is incorrect because “furthermore” illogically signals that the information in this sentence is merely additional to (and separate from) the information in the previous sentence about the scientific debate. Instead, the information about dispersalists and vicariancists clarifies the terms of that debate. Choice B is incorrect because “by contrast” illogically signals that the information in this sentence contrasts with the information in the previous sentence about the scientific debate. Instead, the information about dispersalists and vicariancists clarifies the terms of that debate. Choice C is incorrect because “similarly” illogically signals that the information in this sentence is merely similar to the information in the previous sentence about the scientific debate. Instead, the information about dispersalists and vicariancists clarifies the terms of that debate."}],"img":{"7a1877be":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFEBAMAAAA3vfCZAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABUSklEQVR42u1dd1hUx9d+595dOuzsInblLmCJ9YItiUYXu4ll1WhM1IgaY0simmJXNDH2iBq7UdTYC1gSu2LHymIvIAv2AjsLKlJ25/sDVLAirsovH+d5Epd7Z87MvHNm5pwz584ABVRABVRABVRABfQfJ2I7VoIt61M/8x93mqME+qJs2V4ouuZ8/riFfoA656sc7EhO5oIvoKEAiOAPECnbK1HKXirRPL9WGi2kagrQfNTZa+ESlPnrQOY/n2R/Kx6PINkweQKdWhFMs/qG4pP+2fCOASIfpT8A/J6NWQpIGgE0j1LbB6lzwGuAXcwZAM5lwkH+iJaeAOoUlMldCAcA14QLmX9KOeXEEtM6bI6bT0g+gndhoHOQRKgg4wBpAMEflctQNKSiPyH1AbegKoGCjmh1EGV4U00hucI00UtsLWzVyqQa0VaD0BpkteTlL/gT3/qiDBorCSYiicRL8pH+rQYtqgM+klBIgpAOu1T4qCfJog4Kf+Llpd1CC0kECj/4VSNCo3B4yp2kMpLCLhxKo0OYQgdta4UkeEtOgYI/qlMQnbYa4KKvFCz6Cd5F/kEDgFTTQZRFPwhGu1PSHDetLNSH4C2/OTaKN2fh8uNfbFGjoOh6M7j9wBaXqpqsv5Rv3LN5uhRbKSDRUDVI4TVOijt0yjBR1WfZrS8XFhvaoPbPEdIpb+9Oq/UHmseVcvY37fMJSPD5lJq2RjWp9yGzBvWKtAscViTi0xm37/fZ17j72HM/z7jTa2aFShD0O6IUy6KL3qtdz9hRa5o/36Wmb2/XZhhU5fdBSfvvtAbl0grNxku9igFcfLjo38RTm5ObVaq/3LUaBsvXfneoSwKjSYsgYrwkLUfgpkbVivZs2U+xPHbPbNcxv33KGSchFyAGrg5w2zbLuXZ+kN5/JrkExjmGnC0WfPoT9bl7LiFVfI/YkzNn7XXXHMLQGVAml+p+pVT3pIrf6+a6Bqxy7P+9bxvn4HH24ecLGw8XNhy202MeneSV7Dz1aoW9/YCzcaWG24eU9jhVuv/slYUNK1S+v3rqtrvpt0I8HFJnqEvghF6aJNeu94ovPuMQPNMhrApFN+fgQ0XDDxc2wD46yFO33a1QOMhf/5KAer5XSi0a7jy1X7FpV5wnB/aAYJxXOA6uP/0Q1LVk3/6KxSq/0bA7WbVRVKnOviAZu/sb57iVCT/vwVz7r84XSxsJmkIZF9JvjOJ+2zVrUjQ88o+Mo9LYyXtTDlAwArL2t function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
