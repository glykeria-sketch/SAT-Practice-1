<script>
const D={"t":"Practicetest48","q":[{"i":"03f5a9b7","c":"vocab","d":"E","s":"When marine biologist Brittany Williams played different ocean recordings to groups of oyster larvae, groups that heard sounds of a healthy oyster reef were the most ______. They were twice as likely as other groups to show signs of making a permanent home. This suggests that playing recordings of a healthy ocean reef may encourage oysters to create such a reef.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["responsive","inactive","liked","distressed"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of oysters and ocean recordings. As used in this context, \"responsive\" means reacting positively. The text presents a finding and describes it as suggesting that healthy ocean sounds may encourage oyster larvae to establish a reef (a permanent home): groups of oyster larvae that heard recorded sounds of a healthy oyster reef were two times more likely to show signs of forming their own reef than groups that heard different ocean recordings were. This context conveys that the groups that heard healthy reef sounds had a more positive reaction than the other groups did—that is, they were the most responsive. Choice B is incorrect because the text doesn’t indicate that hearing sounds of a healthy oyster reef caused some groups of oyster larvae to become \"inactive,\" or to stop engaging in work or activity. Instead, the text conveys that the groups that heard those sounds were observed engaging in activity: they were two times more likely to create a reef (a permanent home) than groups that heard different ocean sounds were. Choice C is incorrect because describing the groups of oyster larvae that heard sounds of a healthy oyster reef as most \"liked,\" or regarded with pleasure, wouldn’t make sense in context. The text focuses on the idea that a study found that healthy reef sounds may encourage groups of oyster larvae to form reefs (permanent homes), not on the idea that some of the groups in the study were liked more than others. Choice D is incorrect because the text doesn’t indicate that hearing sounds of a healthy oyster reef caused some groups of oyster larvae to be \"distressed,\" or to experience difficulty or begin to decline. Instead, the text indicates that the sounds increased the likelihood that groups of larvae would establish a reef (a permanent home), suggesting that the sounds had a positive effect on the larvae."},{"i":"9b22bf7b","c":"vocab","d":"H","s":"The following text is from the 1989 novel The Ancient Child by Kiowa writer N. Scott Momaday. The main character has achieved tremendous commercial success as a painter. More and more often he was asked to compromise his art or himself in one way or another, and more often than not he did so, for he was inclined to be passive and naïve; it was difficult for him to say no. Those who exhibited his work, who praised and purchased it, and who demanded its proliferation began to determine it. ©1989 by N. Scott Momaday As used in the text, what does the word “determine” most nearly mean?","o":["Conclude","Dictate","Evaluate","Select"],"a":1,"r":"Choice B is the best answer because as used in the text \"determine\" most nearly means \"dictate.\" The text describes the relationship between the main character and those who exhibit, praise, and purchase his artwork. The text states that the main character is often asked to change his art or himself based on outside influences, and he usually acquiesces. Because the main character admits that those who support his work often shape it based on their demands, it follows that those outside influences dictate, or guide or dominate, the direction his work takes. Choice A is incorrect because the text doesn’t suggest that outside influences \"conclude,\" or end, the main character’s work. The text states that many supporters of the main character’s art \"demand its proliferation,\" not its conclusion. Choice C is incorrect because the text doesn’t suggest that outside influences are \"evaluating,\" or judging the main character’s work. According to the text, the main character’s art has already achieved great commercial success, with many people exhibiting, purchasing, and praising his work. Thus, outsiders have already supported the main character’s work and are not questioning or evaluating its success or worth. They are instead influencing its initial direction. Choice D is incorrect because the text doesn’t suggest that outside influences \"select,\" or choose the main character’s work. According to the text, the main character’s art has already achieved great commercial success, with many people exhibiting, purchasing, and praising his work. Thus, outsiders have already supported the main character’s work and are not selecting it. They are instead influencing its initial direction."},{"i":"62a18353","c":"vocab","d":"M","s":"The following text is adapted from Zora Neale Hurston’s 1921 short story “John Redding Goes to Sea.” John wants to travel far beyond the village where he lives near his mother, Matty. [John] had on several occasions attempted to reconcile his mother to the notion, but found it a difficult task. Matty always took refuge in self-pity and tears. Her son’s desires were incomprehensible to her, that was all.\n\nAs used in the text, what does the phrase “reconcile his mother to” most nearly mean?","o":["Get his mother to accept","Get his mother to apologize for","Get his mother to match","Get his mother to reunite with"],"a":0,"r":"Choice A is the best answer. The expression “reconcile to” means “to cause (a person) to accept something difficult or disagreeable.”The text suggests that John wants his mother to accept his desire to travel, even though she doesn’t like that idea. Choice B is incorrect. This doesn’t make sense. John doesn’t want his mother to apologize for his own desire to travel—he wants her to accept his desire to travel. Choice C is incorrect. The text doesn’t suggest that John wants his mother to match his desire to travel. Rather, he wants her to accept his desire to travel even though she doesn’t like it. Choice D is incorrect. This is tempting, because it seems to pick up on the idea of people “reconciling” after a fight, but it actually doesn’t make sense. The text never suggests that John’s mother was “united with” the idea of him traveling in the past—if anything, it seems like she’s always been against it. Besides, it would be strange to say that a person “reunites with” a notion."},{"i":"35fd0eb4","c":"vocab","d":"M","s":"The discoverers of the minor planet 1227 Geranium named it after the plant genus that includes cranesbills. Most of the recently discovered minor planets, however, are given only an identification number, largely due to there being over 500,000 such bodies known at present, which makes the already challenging task of finding a unique name for each nearly ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["insurmountable","feasible","substantial","unnecessary"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the difficulty in naming a large number of minor planets. In this context, \"insurmountable\" means impossible to overcome or too difficult to solve. The text establishes that coming up with distinct names for minor planets is already a difficult task that has become even more challenging because there are now more than 500,000 known minor planets. The logical conclusion is that finding unique names for such a vast number of celestial objects has become virtually impossible—or insurmountable—which explains why the majority of recently discovered minor planets receive only identification numbers instead of proper names. Choice B is incorrect because \"feasible\" means possible to do or achieve, which would contradict the logic of the text. The text indicates that the task of naming minor planets has become more difficult because of their large number. The text then explains that this is why most new discoveries receive only identification numbers. If the task were feasible, there would be no reason to abandon the practice of giving proper names to minor planets in favor of using only numbers. Choice C is incorrect because \"substantial\" means considerable in size, amount, or importance. While the text does suggest that naming all minor planets would be a significant undertaking, describing the task as substantial wouldn’t logically explain why the naming practice has been largely abandoned in favor of using only identification numbers. The text suggests that the task has become virtually impossible (insurmountable), not merely large or significant. Choice D is incorrect because \"unnecessary,\" which means not needed, would suggest that giving proper names to minor planets serves no purpose. However, the text doesn’t question the value or purpose of naming minor planets; rather, it explains that the sheer number of discoveries has made the already challenging naming task nearly impossible to complete. The text provides an example of a named minor planet (1227 Geranium), indicating that naming has been considered worthwhile but has become impractical because of the volume."},{"i":"7a0e31ea","c":"purpose","d":"M","s":"The following text is from Betty Smith’s 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, visits the library often. Francie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in alphabetical order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B’s. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine architecture. For all her enthusiasm, she had to admit that some of the B’s had been hard going. But Francie was a reader. ©1947 by Betty Smith Which choice best states the main purpose of the text?","o":["To illustrate Francie’s enjoyment of an unusual topic","To explain why Francie prefers reading over other activities","To portray Francie’s determination to meet a goal","To describe a book that Francie greatly admires"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to portray Francie’s determination to reach her goal of reading all the books in the world. The text indicates that to achieve this aim, Francie works systematically and persistently: she reads all the books in the library in alphabetical order and devotes much time and effort to the project, finishing one book per day over a long period of time. The text then suggests that even though she progresses slowly (\"she was still in the B’s\") and that she struggled with some books (\"some of the B’s had been hard going\"), she doesn’t give up because she thinks of herself as \"a reader.\" These details show Francie’s resolve. Choice A is incorrect. Although the text mentions several topics (bees and buffaloes, Bermuda vacations, and Byzantine architecture) that Francie has read about, it doesn’t indicate that any of these topics are unusual or that she especially enjoyed reading about one of these topics in particular. If anything, the text suggests that she may have found some of these topics to be dull, saying that she even read the \"dry ones\"—that is, the boring books—and that some of the books were \"hard going,\" meaning they were difficult to get through. Choice B is incorrect because the text doesn’t discuss Francie’s involvement in other activities, only her dedication to reading. Although it’s possible that Francie dedicates herself to reading because she prefers it to other activities, the text doesn’t indicate whether this is the case. Choice D is incorrect. Although the text mentions one author (Abbott) whose book Francie has read as well as several topics (bees and buffaloes, Bermuda vacations, and Byzantine architecture) she has encountered, the text doesn’t say whether Francie admires any of the books she’s read so far. Instead, the text focuses on the time and effort she devotes to reaching her goal of reading all the books in the world—even ones she doesn’t enjoy."},{"i":"2af2016f","c":"purpose","d":"M","s":"A study by Dr. Paul Hanel and colleagues concluded that people are more likely to behave politely when listening to ideas they disagree with if they think about values before they engage in a discussion. Study participants were assigned to one of two groups. The experimental group spent a few minutes writing about one of their personal values before they had a group discussion on a controversial topic. And the control group spent a few minutes writing about a drink (tea, milk, etc.) before their group discussion on that topic. Hanel and colleagues found that the experimental group’s discussion was more civil than the control group’s discussion was.\n\nWhich choice best describes the main purpose of the text?","o":["To describe a widely held belief and how a study’s results support that belief","To argue that researchers were surprised by the results of a certain study","To suggest ways to improve a certain study’s experimental design","To explain a study’s conclusion and how a research team arrived at that conclusion"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain a study’s conclusion and how researchers involved in the study arrived at that conclusion. The text begins by summarizing the main conclusion of the study conducted by Paul Hanel and colleagues: when confronted with ideas they disagree with in discussions about controversial topics, people are more likely to respond politely if they think about their personal values before engaging in such discussions. The text then goes on to describe the design of Hanel and colleagues’ experiment. By comparing interactions between members of an experimental group (who had been prompted to write about their personal values beforehand) to those between members of a control group (who had been prompted to write about a beverage), the team found that people in the experimental group behaved more civilly, or politely, than people in the control group did during discussions about a controversial topic. This finding led to the conclusion described at the beginning of the text. Choice A is incorrect. Although the text discusses the results of a study, it doesn’t provide any indication that the conclusion the study supported —that when facing disagreement, people behave more politely when they have thought about their values—is a belief that is widely held. Choice B is incorrect because the text doesn’t indicate that the researchers found the results of their study to be surprising, or contrary to what they expected. In fact, there’s no indication provided in the text about how the researchers felt about the study’s results or that the results should be considered surprising. Choice C is incorrect. Although the text discusses the experimental design of a study, it doesn’t suggest any improvements to that design; instead, it focuses on how the design enabled the researchers to draw a particular conclusion."},{"i":"ca50de52","c":"func","d":"H","s":"<u>“How lifelike are they?”<\/u> Many computer animators prioritize this question as they strive to create ever more realistic environments and lighting. Generally, while characters in computer-animated films appear highly exaggerated, environments and lighting are carefully engineered to mimic reality. But some animators, such as Pixar’s Sanjay Patel, are focused on a different question. Rather than asking first whether the environments and lighting they’re creating are convincingly lifelike, Patel and others are asking whether these elements reflect their films’ unique stories.\n\nWhich choice best describes the function of the underlined question in the text as a whole?","o":["It reflects a primary goal that many computer animators have for certain components of the animations they produce.","It represents a concern of computer animators who are more interested in creating unique backgrounds and lighting effects than realistic ones.","It conveys the uncertainty among many computer animators about how to create realistic animations using current technology.","It illustrates a reaction that audiences typically have to the appearance of characters created by computer animators."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined question in the text as a whole. The text begins with the underlined question, “How lifelike are they?” The text then explains that many computer animators pose this question about the environments and lighting that they create for animated films, striving for realistic animation of those components even if the characters themselves aren’t portrayed in realistic terms. The focus of the text then shifts to describe how some animators strive to create environments and lighting that reflect the film’s unique stories rather than making them appear realistic. Therefore, the function of the underlined question is to reflect a primary goal that many computer animators have for certain components of the animations they produce. Choice B is incorrect because, as the text makes clear, the underlined question is one posed by computer animators who wish to create realistic backgrounds and lighting effects, not by those who, instead, wish to create effects that reflect films’ unique stories and aren’t necessarily realistic; this latter group of animators is discussed later in the text. Choice C is incorrect. As the text explains, many computer animators strive for realistic environments and lighting, while others do not; this difference of approach relates to whether these components should be realistic, not to how realism can be achieved using current technology, and the text never suggests that animators are uncertain how to achieve it. Choice D is incorrect because the underlined question pertains to the perspective of computer animators, not the audience, and the text never considers audience’s reactions to characters in animated films."},{"i":"570970cd","c":"func","d":"H","s":"The following text is adapted from Indian Boyhood, a 1902 memoir by Ohiyesa (Charles A. Eastman), a Santee Dakota writer. In the text, Ohiyesa recalls how the women in his tribe harvested maple syrup during his childhood. Now the women began to test the trees—moving leisurely among them, axe in hand, and striking a single quick blow, to see if the sap would appear. <u>The trees, like people, have their individual characters; some were ready to yield up their life-blood, while others were more reluctant.<\/u> Now one of the birchen basins was set under each tree, and a hardwood chip driven deep into the cut which the axe had made. From the corners of this chip—at first drop by drop, then more freely—the sap trickled into the little dishes.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It portrays the range of personality traits displayed by the women as they work.","It foregrounds the beneficial relationship between humans and maple trees.","It demonstrates how human behavior can be influenced by the natural environment.","It elaborates on an aspect of the maple trees that the women evaluate."],"a":3,"r":"Choice D is the best answer because it best describes the function of the underlined sentence in the text’s overall portrayal of how the women in Ohiyesa’s tribe harvested maple syrup. The text states that the women used an axe to strike the maple trees in order to find out which ones would produce sap. The underlined sentence compares the trees to people, with the sap described as the trees’ “life-blood.” Some of the trees are ready to give out their sap, while others are unwilling to do so. Using personification, the sentence provides greater detail about the aspect of the maple trees—their potential to give sap—that the women are evaluating. Choice A is incorrect because the personalities of the women are not discussed in the text. Although the underlined sentence does mention “individual characters,” this reference is not to the women in the text but rather to the maple trees, which the sentence compares to people with individual character traits. Choice B is incorrect because the underlined sentence focuses on the trees’ willingness or refusal to yield sap, not on the beneficial relationship between the women and the trees. Additionally, although the text does suggest that the women and their tribe benefit from the maple trees since the trees allow the women to harvest syrup, there is nothing in the text to suggest that the trees benefit from this relationship in turn. Choice C is incorrect because the underlined sentence is comparing maple trees to humans, not addressing the influence of the natural environment on how the actual humans in the text, the women, behave."},{"i":"8d802289","c":"cross","d":"E","s":"Text 1 Dance choreographer Alvin Ailey’s deep admiration for jazz music can most clearly be felt in the rhythms and beats his works were set to. Ailey collaborated with some of the greatest jazz legends, like Charles Mingus, Charlie Parker, and perhaps his favorite, Duke Ellington. With his choice of music, Ailey helped bring jazz to life for his audiences.\n\nText 2 Jazz is present throughout Ailey’s work, but it’s most visible in Ailey’s approach to choreography. Ailey often incorporated improvisation, a signature characteristic of jazz music, in his work. When managing his dance company, Ailey rarely forced his dancers to an exact set of specific moves. Instead, he encouraged his dancers to let their own skills and experiences shape their performances, as jazz musicians do.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Dancers who worked with Ailey greatly appreciated his supportive approach as a choreographer.","Ailey’s work was strongly influenced by jazz.","Audiences were mostly unfamiliar with the jazz music in Ailey’s works.","Ailey blended multiple genres of music together when choreographing dance pieces."],"a":1,"r":"Choice B is the best answer. Author 1 states that Ailey had a “deep admiration for jazz music” and that he “helped bring jazz to life for his audiences.” Author 2 states that “Jazz is present throughout Ailey’s work.” While the authors name different aspects of Ailey’s work as the most influenced by jazz, they agree that jazz was a strong influence. Choice A is incorrect. This isn’t something that either text claims. Neither text mentions how Ailey’s dancers felt about his approach as a choreographer, so we have no evidence that either author would agree with this. Choice C is incorrect. This isn’t something that either text claims. Neither text mentions how familiar audiences were with any aspect of Ailey’s works, so we have no evidence that either author would agree with this. Choice D is incorrect. This isn’t something that either text claims. Neither text mentions any genre of music other than jazz, so we have no evidence that either author would agree with this."},{"i":"835545cd","c":"main","d":"M","s":"The following text is adapted from Charles W. Chesnutt’s 1901 novel The Marrow of Tradition. Mrs. Ochiltree was a woman of strong individuality, whose comments upon her acquaintance[s], present or absent, were marked by a frankness at times no less than startling. This characteristic caused her to be more or less avoided. Mrs. Ochiltree was aware of this sentiment on the part of her acquaintance[s], and rather exulted in it.\n\nBased on the text, what is true about Mrs. Ochiltree’s acquaintances?","o":["They try to refrain from discussing topics that would upset Mrs. Ochiltree.","They are unable to spend as much time with Mrs. Ochiltree as she would like.","They are too preoccupied with their own concerns to speak with Mrs. Ochiltree.","They are likely offended by what Mrs. Ochiltree has said about them."],"a":3,"r":"Choice D is the best answer because it presents a statement about Mrs. Ochiltree’s acquaintances that is supported by the text. The text indicates that Mrs. Ochiltree makes comments about her acquaintances that are frank, or direct and blunt, and sometimes startling. It also states that because of this behavior, the acquaintances tend to avoid Mrs. Ochiltree. Together, these details suggest that the acquaintances choose not to be around Mrs. Ochiltree because they are offended by the things she has said about them. Choice A is incorrect because the text doesn’t suggest that Mrs. Ochiltree’s acquaintances avoid discussing topics that would upset Mrs. Ochiltree; instead, it states that they avoid being around Mrs. Ochiltree at all. Choice B is incorrect because the text makes it clear that Mrs. Ochiltree knows her acquaintances often avoid her and is pleased about it (she “rather exulted in it”), not that she wants to spend more time with them. Choice C is incorrect because the text doesn’t suggest that Mrs. Ochiltree’s acquaintances don’t speak with Mrs. Ochiltree because they are too focused on their own concerns, but rather because they don’t like the frank comments she makes."},{"i":"23ecf625","c":"main","d":"H","s":"Conservationists worldwide are working to protect ecosystems from habitat destruction and biodiversity loss, and in many cases, initiatives that rely on natural features or processes can help address such challenges. In response to a rapidly dwindling population of blueback salmon, the Quinault Indian Nation (a tribe in Washington State) partnered with the conservation organization Wild Salmon Center to restore naturally occurring logjams in the Quinault River. The logjams create shady pools where the blueback salmon can rest and spawn, thus promoting blueback population recovery.\n\nWhich choice best states the main idea of the text?","o":["A partnership between the Quinault Indian Nation and Wild Salmon Center shows the importance of collaborative approaches to preserving biodiversity.","Nature-based approaches can be effective ways to achieve conservation goals.","As indicated by a recent project, logjams help the blueback salmon thrive and reproduce.","Scientists now realize that nature-based conservation methods offer better long-term solutions to environmental issues than methods that are not nature-based do."],"a":1,"r":"Choice B is the best answer because it best states the main idea of the text: that nature-based approaches can be effective for achieving conservation goals. The text indicates that in many cases where conservationists are trying to protect ecosystems, their methods depend on natural processes or features. The text then gives an example of this phenomenon, a project with the Quinault Indian Nation that allowed logjams to form naturally in a river, creating spawning habitats for blueback salmon. Choice A is incorrect. Although the text does suggest that the partnership with the Quinault Indian Nation was beneficial, this is not the central aim of the text; the text primarily argues that nature-based approaches to conservation can be effective. Choice C is incorrect. Although the text indicates that logjams are helpful to blueback salmon, the example of the blueback salmon project is included to illustrate the larger point made earlier in the text: that nature-based approaches to conservation are often effective. Choice D is incorrect. There is no evidence in the text to support a direct comparison of the efficacy of nature-based conservation approaches to other types of approaches. The text merely indicates that nature-based approaches can often be effective."},{"i":"cae97f58","c":"infer","d":"H","s":"Mosses can struggle in harsh desert conditions because these plants require enough sunlight for photosynthesis but not so much that they risk drying out. Researchers Jenna Ekwealor and Kirsten M. Fisher found several species of Syntrichia caninervis, a type of desert moss, growing under quartz crystals in California’s Mojave Desert. To evaluate whether these semitransparent rocks benefited the moss, the researchers compared the shoot tissue, a measure of plant growth, of S. caninervis when growing on the soil surface versus when the moss was growing under the quartz rocks. They found that the shoot tissue was 62% longer for moss growing under the quartz as compared to moss on the soil surface, suggesting that ______ Which choice most logically completes the text?","o":["S. caninervis is one of the few types of moss that can survive under semitransparent rocks.","quartz crystals do not transmit the necessary sunlight for photosynthesis in S. caninervis.","S. caninervis growing under quartz crystals experience lower light intensity and are thus able to retain more moisture.","quartz crystals are capable of supporting S. caninervis growth if the crystals are not too thin."],"a":2,"r":"Choice C is the best answer because it most logically completes the text. The text explains that while desert moss species need sufficient sunlight for photosynthesis, exposure to sunlight can also affect the plants negatively by drying them out. Ekwealor and Fisher’s team found specimens of S. caninervis moss growing under quartz crystals that were semitransparent, allowing some but not all sunlight to pass through them, and the shoot tissue of these specimens was longer than that of S. caninervis specimens found growing on the surface that were unprotected by such crystals. Since, as the text explains, the length of shoot tissue is an indicator of plant growth, and since greater exposure to sunlight results in greater loss of moisture, it can be inferred that S. caninervis growing under quartz crystals experience lower light intensity and are thus able to retain more moisture. Choice A is incorrect because the text doesn’t mention another moss species besides S. caninervis or discuss whether other such species are able to grow under transparent crystals, as S. caninervis is. Choice B is incorrect because, as the text explains, specimens of S. caninervis were found growing under quartz crystals and exhibited more plant growth than specimens growing on the soil surface. This wouldn’t have been the case if the crystals transmitted insufficient light for the moss’s photosynthesis. Choice D is incorrect. The text contrasts the growth of S. caninervis specimens found beneath semitransparent quartz crystals with that of specimens found on the soil surface absent such crystals, but it doesn’t make a comparison among specimens growing beneath crystals of different degrees of thickness or consider how the relative thickness of the crystals affects the growth of the moss."},{"i":"1ffd60ce","c":"infer","d":"H","s":"An analysis by Alain Elayi and colleagues of coins minted in Sidon in the fifth and fourth centuries BCE reveals a change in their composition over time: while a coin from circa 450 BCE contains about 98% silver and 1% copper, a coin from 367 BCE (the end of Ba’alšillem II’s reign) contains 74.2% silver and 24.7% copper, giving it a relatively yellowish appearance that traders would have noticed. Because coins with a silver content below 80% were widely considered unsuitable for trade, Elayi et al. speculate that a crisis in confidence in the currency occurred in Sidon around 367 BCE, which was likely relieved—despite Sidon’s persistent oppressive financial obligations—as a result of Ba’alšillem II’s successor Abd’aštart I’s decision to ______ Which choice most logically completes the text?","o":["proclaim that the percentage of silver in coins suitable for trade would be raised to a threshold higher than 80%.","keep the amount of silver in Sidonian coins consistent with that in coins minted in 367 BCE but decrease their weight.","begin minting heavier coins with a proportion of silver to copper similar to that in coins minted in 367 BCE.","fund the mining of some copper deposits that were not available to Ba’alšillem II."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Sidonian coins. As the text explains, researchers determined that Sidonian coins were made of silver and copper and that from 450 BCE to 367 BCE, the percentage of silver in each coin decreased from 98% to 74.2% while the percentage of copper increased from 1% to 24.7%. The text indicates that because the coins containing less than 80% silver weren’t considered suitable for trade (suggesting that copper was less valuable than silver) and looked different from coins containing more silver, the researchers suspect there was a serious loss in confidence in the currency in Sidon in 367 BCE when the copper content was high. It’s reasonable to assume that it wasn’t possible to boost confidence simply by devoting a greater amount of valuable silver to the currency, since Sidon was under significant and ongoing financial pressure; however, keeping the total amount of silver the same and reducing the amount of copper in the coins would have resulted in smaller coins with a higher percentage of silver. Therefore, it makes sense to suggest that Abd’aštart I (the ruler after 367 BCE) likely restored confidence in the currency by deciding to keep the amount of silver in Sidonian coins consistent with that in coins minted in 367 BCE but to decrease the coins’ weight. Choice A is incorrect because the text conveys that a crisis in confidence in the currency of Sidon likely occurred around 367 BCE because the percentage of silver in coins had fallen below 80% (presumably because Sidon’s financial pressures meant that less silver was available for currency), making the coins unsuitable for trade. Thus, announcing that the threshold for the percentage of silver in coins would be raised—that is, that coins would need to contain even more than 80% silver to be suitable for trade—likely would have worsened the crisis rather than relieved it. Choice C is incorrect because the text strongly suggests that a crisis in confidence in the currency of Sidon was caused by the proportion of silver to copper in the coins in 367 BCE, with 74.2% being too little silver for the coins to be considered suitable for trade; therefore, it’s unlikely that minting coins with a similar proportion of silver to copper (that is, still around 74.2% silver) would have restored confidence, even if the coins were heavier. Choice D is incorrect because the text gives no indication that funding the mining of more copper would have relieved a crisis in confidence in the currency of Sidon. The text establishes that Sidonian coins that visibly contained copper weren’t considered suitable for trade, so Abd’aštart I wouldn’t have wanted to add even more copper to them, and it’s unclear how else copper mining would affect views of the currency."},{"i":"40578580","c":"claim","d":"E","s":"Many scientists have believed that giraffes are solitary creatures, preferring to spend their time alone instead of with others. But observations of giraffes and their behavior in recent years has suggested that these animals may be more social than we once thought. For example, scientists Zoe Muller and Stephen Harris claim that giraffes may even help each other care for one another’s newborns.\n\nWhich finding, if true, would most directly support Muller and Harris’s conclusion?","o":["Female giraffes have been observed feeding young giraffes that aren’t their direct offspring.","Confrontations between a younger and an older male giraffe are frequently observed.","Some female giraffes have been observed sniffing and licking their newborn offspring.","Giraffes are able to make sounds but are rarely observed communicating with others."],"a":0,"r":"Choice A is the best answer. If female giraffes feed nonoffspring young, that’s direct evidence that \"giraffes may even help each other care for one another’s newborns.\" Choice B is incorrect. Confrontations between males doesn’t tell us anything about whether giraffes help each other care for newborns. Choice C is incorrect. While this option does mention newborn offspring, it only discusses a mother’s behavior toward her own child, not another giraffe’s child. Choice D is incorrect. Whether or not giraffes are observed communicating with each other doesn’t tell us anything about whether they help each other care for newborns."},{"i":"c088a9a9","c":"claim","d":"E","s":"Over the course of the 1900s, more and more Native Hawaiians spoke English instead of the Hawaiian language. To preserve their language, Native Hawaiian teachers founded the ‘Aha Pūnana Leo preschool in 1984. They spoke Hawaiian while teaching, and their Native Hawaiian students were soon able to understand and speak it themselves. The school was a huge success. Eventually it opened locations around Hawai‘i and started teaching Hawaiian to elementary and high school students too. <u>Thanks to ‘Aha Pūnana Leo, the number of young people who speak the language has increased.<\/u> Which statement, if true, would most directly support the underlined claim?","o":["Fewer than fifty children could speak Hawaiian when ‘Aha Pūnana Leo was founded, but now more than 2,000 students at ‘Aha Pūnana Leo speak it.","Roughly 680,000 Native Hawaiian people lived in the United States in 2020, and a little less than half of them lived in Hawai‘i.","Hawaiian is very similar to other languages that are spoken on the Polynesian Islands of the Pacific Ocean, including Tahitian, Samoan, and Māori.","Besides Native Hawaiians, tens of thousands of people from other Pacific Islander communities live in Hawai‘i today, including over 37,000 Samoans."],"a":0,"r":"Choice A is the best answer because it presents a statement that, if true, would most directly support the claim that the number of young people who speak Hawaiian has increased because of the ‘Aha Pūnana Leo school. The text explains that Native Hawaiian teachers founded the school to help preserve the Hawaiian language by teaching it to children at a time when an increasing number of Native Hawaiians were speaking English instead. If it is true that when ‘Aha Pūnana Leo was founded fewer than fifty children could speak Hawaiian and that now over 2,000 students at the school can speak it, that would directly demonstrate that the school’s efforts have led to a greater number of young people speaking Hawaiian. Choice B is incorrect because information about the total number and location of Native Hawaiian people in a single year wouldn’t reveal anything about the number of young speakers of Hawaiian (particularly since the text indicates that not all Native Hawaiians speak Hawaiian) or about the effect of the ‘Aha Pūnana Leo school on that number, so it wouldn’t have any bearing on the text’s claim. Choice C is incorrect because the fact that Hawaiian is similar to Tahitian, Samoan, Māori, and other languages of the Polynesian Islands wouldn’t reveal anything about the number of young speakers of Hawaiian or the effect of the ‘Aha Pūnana Leo school on that number, so it wouldn’t have any bearing on the text’s claim. Choice D is incorrect because information about non–Native Hawaiian people from Pacific Islander communities living in Hawai‘i today wouldn’t reveal anything about the number of young speakers of Hawaiian or the effect of the ‘Aha Pūnana Leo school on that number, so it wouldn’t have any bearing on the text’s claim."},{"i":"46e45728","c":"graph","d":"E","s":"","o":["the cold-dry season for both females and males.","the cold-dry season for females and the hot-dry season for males.","the hot-dry season for females and the monsoon season for males.","the monsoon season for both females and males."],"a":0,"r":"Choice A is the best answer. Females only traveled 9.28 km per day in the cold-dry season, versus 12.64 and 12.48 km per day in the monsoon and hot-dry seasons, respectively. Males only traveled 15.81 km per day per day in the cold-dry season, versus 18.93 and 18.87 km per day in the monsoon and hot-dry seasons, respectively. So, the cold-dry season was the season where both males and females had the least daily travel. Choice B is incorrect. Although females traveled least in the cold-dry season, males didn’t travel least in the hot-dry season. Instead, they traveled less per day in the cold-dry season as well. Choice C is incorrect. Females had less daily travel in the cold-dry season than in the hot-dry season (9.28 versus 12.48 km per day), and males had less daily travel in the cold-dry season than in the monsoon season (15.81 versus 18.93 km per day). Choice D is incorrect. In fact, both females and males traveled the most kilometers per day in the monsoon season."},{"i":"d83c3d54","c":"graph","d":"M","s":"","o":["The lowest amount of grass cover was approximately 58,000 square meters, and the highest amount of forest cover was approximately 75,000 square meters.","There was more grass cover than forest cover in 1987, and this difference increased dramatically in 1993 and again in 2006.","There was less grass cover than bare soil in 1987 but more grass cover than bare soil in 1993 and 2006, whereas there was more forest cover than bare soil in all three years.","Grass cover increased from 1987 to 1993 and from 1993 to 2006, whereas forest cover decreased in those periods."],"a":3,"r":"Choice D is the best answer because it describes data from the graph that support Martinez and colleagues’ conclusion that the Jordanelle Dam led to changes that benefited grass plants but not trees. The graph shows characteristics of the banks of the Provo River downstream of the Jordanelle Dam in three different years—1987, 1993, and 2006. Specifically, the graph shows the amount of grass cover, bare soil, and forest cover in those years. The text indicates that the Jordanelle Dam was built in 1992, meaning that the data from the graph for 1987 reflect conditions before the dam was built, whereas the data for 1993 and 2006 reflect conditions after the dam was built. The data show that grass cover increased substantially from 1987 to 1993 and again from 1993 to 2006. The data also show that forest cover declined over those periods. Together, these data support Martinez and colleagues’ conclusion that the dam was beneficial for grass plants but not for trees—grass cover increased significantly after the dam was built, while forest cover declined. Choice A is incorrect. Although it is true that, in the graph, the lowest value for grass cover is approximately 58,000 square meters and the highest value for forest cover is approximately 75,000 square meters, both values are from 1987, before the Jordanelle Dam was built in 1992. Therefore, this information alone cannot support Martinez and colleagues’ conclusion about changes in grass and tree cover following the construction of the dam. Choice B is incorrect because it presents an inaccurate description of data from the graph. The graph shows that there was more forest cover than grass cover in 1987, not that there was more grass cover than forest cover that year. Choice C is incorrect because, while it accurately reflects data from the graph when it compares grass cover and forest cover to bare soil, these data alone cannot support Martinez and colleagues’ conclusion that the dam led to changes that benefited grass plants but not trees. An increase in grass cover relative to bare soil following the construction of the dam might indicate that the dam benefited grass plants, but the fact that there was more forest cover than bare soil in all three years doesn’t indicate that the dam failed to benefit trees."},{"i":"430d929a","c":"fss","d":"E","s":"British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper announcing the double helix structure of DNA, but it is misleading to say that Watson and Crick discovered the double helix. ______ findings were based on a famous X-ray image of DNA fibers, “Photo 51,” developed by X-ray crystallographer Rosalind Franklin and her graduate student Raymond Gosling.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["They’re","It’s","Their","Its"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of possessive determiners. The plural possessive determiner “their” agrees in number with the plural conjoined noun phrase “Watson and Crick” and thus indicates that the findings were those of Watson and Crick. Choice A is incorrect because “they’re” is the contraction for “they are,” not a possessive determiner. Choice B is incorrect because “it’s” is the contraction for “it is” or “it has,” not a possessive determiner. Choice D is incorrect because the singular possessive determiner “its” doesn’t agree in number with the plural conjoined noun phrase “Watson and Crick.”"},{"i":"843f92af","c":"fss","d":"E","s":"The sun never sets during the Arctic summer in the Far North. In response, reindeer in this region must change their sleep habits. Instead of resting when it gets dark, they rest when they need ______ their food.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["digest","will digest","to digest","digesting"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of nonfinite verb forms within a sentence. Working together with the finite verb \"need,\" the nonfinite to-infinitive verb \"to digest\" is correctly used to form a subordinate clause that describes what the reindeer need. Choice A is incorrect because the verb \"digest\" (in either its finite or nonfinite form) can’t be used in this way with the finite verb \"need.\" Choice B is incorrect because the finite verb \"will digest\" can’t be used in this way with the finite verb \"need.\" Choice D is incorrect because the nonfinite participle \"digesting\" can’t be used in this way with the finite verb \"need.\""},{"i":"4bed4658","c":"fss","d":"E","s":"In order to prevent nonnative fish species from moving freely between the Mediterranean and Red Seas, marine biologist Bella Galil has proposed that a saline lock system be installed along the Suez Canal in Egypt’s Great Bitter Lakes. The lock would increase the salinity of the lakes and ______ a natural barrier of water most marine creatures would be unable to cross.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["creates","create","creating","created"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of non-finite (untensed) verb forms in a sentence. The modal “would,” which indicates the future from a perspective in the past, should be accompanied by a non-finite plain form verb. In this choice, the non-finite plain form verb “create” is used correctly in conjunction with the non-finite plain form verb “increase” to describe what the lock would do. Choice A is incorrect because the finite present tense verb “creates” can’t be used in this way with the modal “would” to describe what the lock would do. Choice C is incorrect because the present participle “creating” can’t be used in this way with the modal “would” to describe what the lock would do. Choice D is incorrect because the finite past tense verb “created” can’t be used in this way with the modal “would” to describe what the lock would do."},{"i":"267a13e2","c":"bound","d":"M","s":"In 2010, archaeologist Noel Hidalgo Tan was visiting the twelfth-century temple of Angkor Wat in Cambodia when he noticed markings of red paint on the temple ______ the help of digital imaging techniques, he discovered the markings to be part of an elaborate mural containing over 200 paintings.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["walls, with","walls with","walls so with","walls. With"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “walls” is used correctly to mark the boundary between the first sentence (“In...walls”) and the second sentence (“With…techniques”), which starts with a supplementary phrase. Choice A is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice B is incorrect because it results in a run-on sentence. The sentences (“In...walls” and “with...paintings”) are fused without punctuation and/or a conjunction. Choice C is incorrect. Without a comma preceding it, the conjunction “so” can’t be used in this way to join sentences."},{"i":"5aa1fffd","c":"bound","d":"E","s":"Where ______ Interestingly, it was invented by an author. It first appears in the novel Through the Looking Glass by English author Lewis Carroll.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["did the word “chortle” come from.","the word “chortle” did come from?","did the word “chortle” come from?","the word “chortle” come from."],"a":2,"r":"Choice C is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a question mark to punctuate the interrogative sentence \"where did the word ‘chortle’ come from,\" which asks a direct question. Choice A is incorrect because a period can’t be used in this way to punctuate an interrogative sentence, such as \"where did the word ‘chortle’ come from.\" Choice B is incorrect because \"where the word ‘chortle’ did come from\" does not follow the conventional structure of a direct question in Standard English. It’s conventional in Standard English to follow the interrogative word \"where\" with an auxiliary verb (such as \"did\") when asking a direct question. Choice D is incorrect because \"where the word ‘chortle’ come from\" does not follow the conventional structure of a direct question in Standard English. It’s conventional in Standard English to follow the interrogative word \"where\" with an auxiliary verb (such as \"did\") when asking a direct question. Furthermore, a period can’t be used in this way to punctuate an interrogative sentence."},{"i":"9551ef8b","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: The magnificent frigatebird (fregata magnificens) is a species of seabird that feeds mainly on fish, tuna, squid, and other small sea animals. It is unusual among seabirds in that it doesn’t dive into the water for prey. One way it acquires food is by using its hook-tipped bill to snatch prey from the surface of the water. Another way it acquires food is by taking it from weaker birds by force. This behavior is known as kleptoparasitism. The student wants to emphasize a similarity between the two ways a magnificent frigatebird acquires food.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["A magnificent frigatebird never dives into the water, instead using its hook-tipped bill to snatch prey from the surface.","Neither of a magnificent frigatebird’s two ways of acquiring food requires the bird to dive into the water.","Of the magnificent frigatebird’s two ways of acquiring food, only one is known as kleptoparasitism.","In addition to snatching prey from the water with its hook-tipped bill, a magnificent frigatebird takes food from other birds by force."],"a":1,"r":"Choice B is the best answer. The sentence emphasizes a similarity between the two ways a magnificent frigatebird acquires food, noting that neither way requires the seabird to dive into the water. Choice A is incorrect. The sentence describes how a magnificent frigatebird captures prey without diving into water; it doesn’t emphasize a similarity between the two ways the seabird acquires food. Choice C is incorrect. The sentence notes the term used to describe one of the two ways that magnificent frigatebirds acquire food; it doesn’t emphasize a similarity between the two ways. Choice D is incorrect. The sentence describes the two ways that a magnificent frigatebird acquires food; it doesn’t emphasize a similarity between the two ways."},{"i":"b5cd28a7","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Samuel Delany is a US writer known for his science fiction. Delany’s science fiction novel Babel-17 was published in 1966. The novel won a Nebula Award in 1967. The Nebula Awards are given each year to the best works of science fiction published in the US. The student wants to indicate the title of a novel that won a Nebula Award.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Babel-17, by Samuel Delany, won a Nebula Award in 1967.","Samuel Delany published a science fiction novel in 1966.","Samuel Delany is an award-winning US writer known for his science fiction.","One of Samuel Delany’s novels was among the best works of science fiction published in the US."],"a":0,"r":"Choice A is the best answer. The sentence indicates the title of a novel that won a Nebula Award, noting that Babel-17 by Samuel Delany won the award in 1967. Choice B is incorrect because the sentence identifies the year that Samuel Delany published a science fiction novel; it doesn’t indicate the novel’s title or that it won a Nebula Award. Choice C is incorrect because the sentence provides an introduction of Samuel Delany; it doesn’t indicate the title of a novel that has won a Nebula Award. Choice D is incorrect because the sentence indicates that one of Samuel Delany’s novels met the qualification for a Nebula Award; it doesn’t indicate the novel’s title or that it won an award."},{"i":"a819d8b6","c":"trans","d":"M","s":"In 1873, Spanish scientist Santiago Ramón y Cajal observed that brain fibers have distinct boundaries with clear end points, a finding that went against earlier assumptions about the brain. ______ scientists had assumed that the brain was a continuous web of fused fibers, not a vast network of distinct, individual cells.\n\nWhich choice completes the text with the most logical transition?","o":["However,","Previously,","As a result,","Likewise,"],"a":1,"r":"Choice B is the best answer. “Previously” logically signals that the fused fiber theory came before Ramón y Cajal’s discovery. Choice A is incorrect. “However” illogically signals that the fused fiber theory in this sentence contrasts with the information in the previous sentence. While this theory does contrast with Ramón y Cajal’s discovery, the previous sentence concludes by stating that his discovery went against prior assumptions about the brain. The fact that the fused fiber theory was one of those earlier assumptions makes “however” an illogical choice. Choice C is incorrect because “as a result” illogically signals that the fused fiber theory in this sentence was a result of the discovery in the previous sentence. Instead, the fused fiber theory came before Ramón y Cajal’s discovery. Choice D is incorrect because “likewise” illogically signals that the fused fiber theory in this sentence was similar to the discovery in the previous sentence. Instead, the fused fiber theory, which came before Ramón y Cajal’s discovery, was very different from it."},{"i":"60917233","c":"trans","d":"M","s":"In the 1880s, inventor Lewis Latimer improved upon Thomas Edison’s design for the electric light bulb. ______ Latimer made the light bulb more durable by placing cardboard around its carbon filament. With this innovation, Latimer became the first Black inventor to contribute to the electrification of the world.\n\nWhich choice completes the text with the most logical transition?","o":["Soon,","Regardless,","However,","Specifically,"],"a":3,"r":"Choice D is the best answer. \"Specifically\" logically signals that the information in this sentence—Latimer making the light bulb more durable— provides a specific detail elaborating on the more general claim in the previous sentence that Latimer improved the light bulb. Choice A is incorrect because \"soon\" illogically signals that the information in this sentence occurred shortly after Latimer improved the light bulb. Instead, Latimer making the bulb more durable was the specific improvement. Choice B is incorrect because \"regardless\" illogically signals that the information in this sentence is true despite the previous claim about Latimer. Instead, the information about Latimer making the bulb more durable provides a specific detail elaborating on that claim. Choice C is incorrect because \"however\" illogically signals that the information in this sentence contrasts with the previous claim about Latimer. Instead, the information about Latimer making the bulb more durable provides a specific detail elaborating on that claim."},{"i":"0205e563","c":"trans","d":"M","s":"At two weeks old, the time their critical socialization period begins, wolves can smell but cannot yet see or hear. Domesticated dogs, ______ can see, hear, and smell by the end of two weeks. This relative lack of sensory input may help explain why wolves behave so differently around humans than dogs do: from a very young age, wolves are more wary and less exploratory.\n\nWhich choice completes the text with the most logical transition?","o":["in other words,","for instance,","by contrast,","accordingly,"],"a":2,"r":"Choice C is the best answer. “By contrast” logically signals that the information in this sentence—that dogs can see, hear, and smell by the end of two weeks—contrasts with the preceding information (that wolves can smell but not see or hear at the same age). Choice A is incorrect because “in other words” illogically signals that the information about domesticated dogs in this sentence paraphrases the information about wolves in the previous sentence. Instead, the information about dogs contrasts with what came before. Choice B is incorrect because “for instance” illogically signals that the information about domesticated dogs in this sentence exemplifies the information about wolves in the previous sentence. Instead, the information about dogs contrasts with what came before. Choice D is incorrect because “accordingly” illogically signals that the information about domesticated dogs in this sentence is in accordance with, or results from, the information about wolves in the previous sentence. Instead, the information about dogs contrasts with what came before."}],"img":{"46e45728":"iVBORw0KGgoAAAANSUhEUgAAArwAAADdBAMAAACro7ymAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAAvZklEQVR42u1dd0BT19t+zs0gzJyAe8ANaN0YUOuoShC1dcfZalXirKtt1Lo6sdZZW7HW2qqtuOrAgeIExbgXYnBPCI62DsgNuBjJ+f5gCApWU8mP9svzh5J7zj3jOe99z/u+95xzAQcccMABBxxwwIGyA08KAETE5/1QPJeDKD35gh+cGgBIMLzo0xxiCpAAAAQgz9ydW3zR6xQAPBW+YvpcQ/5j4CwnVADectUCEOWcUI0E4Fkki3OS5cxTJg0AACOq5/HmrwVctABn9AS6aRAUlk8T9QQgigIADx6uqoIyJBEA8J3p+oBCtYhSLxQeUoAAfKn3vrQrIOdaRyAEl6CgHCWHuoXFoDGdpRYHwLcNRGqIVHhc+1DDRqryvCc40gggISAhZgjleCWUDAEBECspz3mQ0WpADQ0y2oAnvLKRebZKrLaE+/oBDHhiFKlIQDC8VLCEK0OA8R82MpSjnB8JAUIAl/Hvqmuo0IgnfpQ0hm8NRnoaS7v34lIXX/bEq/6IBlf1D8NiLjzA48C3l07PrnLks7QRO88mve9j7Bw0wQhGdo365e5kj0nTJh8XOmncc7oBmFF5kXFBZ3Sw4OeM6IgO3blAkV4eQrr9MJn3GNwrzCVj+6Ajc5LOhsXTW2EAnOkcjNx5xrBI/o5YW5W46wUieM+sNGrlsA8axI6oHkH4lQELXdssujJ4Rp33Prh9nRdFvuMe8W9XDqIo/P6GWBjgOtTwLUR6RI/x0H3SV6HzVmdUH/TARXfTJYxIE7lbEtUSN+2Nzzz/0O+SGNZLjHAfFOnvlQLOuFZytnoPg5vO2I9Hv7WS42EXZPqz0qiLFfVTiC7Iz7C+pgHuPNzb3vBve8O/jbk2leovOutBB1D/4Ase6sUS42JRCsTx8921n0n59W7hnyzxTf/cV/hIEvavVw6g8Em5DBPJyahHCKBgj0bHM1POFvOpVM/4R6ucD4EB5L7li+45gQl+MaCSXcQ120jpsnnXeu2DNOMRTU31AQ function card(q,n){const a=ans[q.i];
