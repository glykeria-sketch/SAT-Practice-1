<script>
const D={"t":"Practicetest53","q":[{"i":"6d5ddea4","c":"vocab","d":"E","s":"According to Potawatomi ecologist Robin Wall Kimmerer, the Indigenous method of harvesting Hierochloe odorata, or sweetgrass, by snapping the plant off at the root actually ______ wild populations: it may seem counterintuitive, she says, but this method of removal allows new sweetgrass plants to repopulate the space, with an overall increase in number and vigor.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["selects","originates","conditions","replenishes"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the Indigenous method of harvesting Hierochloe odorata. As used in this context, “replenishes” means helps increase the population or helps it recover. The text explains that although snapping off a wild plant at the root might seem detrimental to the wild population, it actually helps Hierochloe odorata, increasing both their “number and vigor.” This context conveys the idea that even though it seems counterintuitive, the Indigenous method of harvesting Hierochloe odorata actually replenishes the wild population. Choice A is incorrect. Although a harvesting method could be used to select for certain traits in plants, it’s not clear what it would mean for a harvesting method to select “wild populations” of plants. Choice B is incorrect because as used in this context, “originates” means creates. The text doesn’t address the origin of Hierochloe odorata, but rather how the Indigenous harvesting method affects it. Choice C is incorrect because in this context, “conditions” means to influence someone or something to behave in a certain way, and the text doesn’t suggest the new plants that replace the harvested ones differ in any meaningful way, or in any way that could be the result of conditioning."},{"i":"6c9f1727","c":"vocab","d":"H","s":"One popular theory of the origin of the Moon, the “big whack,” posits that a protoplanet called Theia collided with Earth, flinging debris into orbit that eventually coalesced into the Moon. Until recently, Theia was ______, but researcher Qian Yuan and colleagues now claim to have identified pieces of the protoplanet in the lowermost section of Earth’s mantle.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["desultory","spurious","veritable","notional"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of Theia and the origin of the Moon. In this context, \"notional\" means theoretical or only an idea. The text indicates that although something was once true of Theia, the protoplanet one theory holds collided with Earth and created debris that became the Moon, researchers now claim to have identified pieces of it deep in Earth’s mantle. In other words, having direct evidence of Theia is a new development. This context suggests that before evidence was found, Theia was only theoretical—that is, that it was notional. Choice A is incorrect because the text doesn’t suggest that Theia, a protoplanet, was \"desultory,\" which in this context would mean moving away from the matter at hand; indeed, the text focuses on the \"big whack\" theory of the origin of the Moon and indicates that Theia is a central part of that theory. Choice B is incorrect because the text makes the point that something was true of Theia until recently and suggests that this has changed now that researchers believe they have found pieces of the protoplanet deep in Earth’s mantle. It wouldn’t make sense to say that Theia was actually \"spurious,\" or false, until researchers found direct evidence of the protoplanet. (Although Theia’s existence might not have been certain, it would not have been false simply because there was no evidence of it.) Choice C is incorrect because the text makes the point that something was true of Theia until recently and suggests that this has changed now that researchers believe they have found pieces of the protoplanet deep in Earth’s mantle. It wouldn’t make sense to say that Theia was \"veritable,\" or real, before researchers found direct evidence of its existence: the evidence would instead confirm that Theia was real."},{"i":"d529c1ad","c":"vocab","d":"E","s":"Ezra Pound’s poetry can be hard to ______: it is dense, experimental, and so full of references and allusions that many readers have a difficult time even identifying the poems’ subjects.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["comprehend","dislike","interrupt","overlook"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Ezra Pound’s poetry. In this context, “comprehend” would mean to understand or grasp the meaning of something. The text describes Pound’s poetry as “dense” and “experimental,” with many references that readers may not understand. The text also states that many readers may not even be able to identify a poem’s subject. This context clearly suggests that readers struggle to understand Pound’s poetry as a result of its complexity and obscure references. Choice B is incorrect. To say that Pound’s poetry is “hard to dislike” would suggest that people generally like it, but the text doesn’t focus on how likeable or enjoyable the poems are; rather, it focuses on how challenging many readers find it to understand them. Choice C is incorrect. To say that Pound’s poetry is “hard to interrupt” would mean that it is hard to stop or break into it while it’s being read or recited, but the text doesn’t discuss any such breaks; instead, the text focuses on the challenge of understanding the content of Pound’s poems. Choice D is incorrect. In this context, “overlook” would mean look past or fail to notice, so to say that Pound’s poetry is “hard to overlook” would mean that it is very likely to be noticed. The text focuses on the difficulty people have in understanding Pound’s poems when reading them, not how noticeable his poetry is in the first place."},{"i":"76e4c51d","c":"vocab","d":"H","s":"The güiro, a musical instrument traditionally made from a dried and hollowed gourd, is thought to have originated with the Taíno people of Puerto Rico. Players use a wooden stick to scrape along ridges cut into the side of the gourd, creating sounds that are highly ______: the sounds produced by güiros can differ based on the distance between the ridges, the types of strokes the player uses, and the thickness of the gourd.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["overlooked","powerful","routine","variable"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the sounds made by güiros. In this context, “variable” means able to change. The text begins by explaining that güiros are instruments made out of hollowed gourds with ridges cut into their sides and that players scrape the ridges with wooden sticks to produce sounds. The text goes on to say that güiros’ sounds can change depending on gourd thickness, the distance between ridges, and the types of strokes the player uses, thus supporting the idea that the sounds created by these instruments are variable. Choice A is incorrect because “overlooked” means not being seen or noticed, and there is nothing in the text to suggest that the sounds produced by güiros are overlooked or not noticed. Choice B is incorrect because in this context, “powerful” would mean having a great ability to produce an effect. While it’s possible that the sounds produced by güiros have a strong effect on listeners, the text doesn’t discuss this aspect of their sounds. Choice C is incorrect because “routine” means usual and unvarying, and there is nothing in the text to suggest that the sounds produced by güiros are unvarying. In fact, the text describes how the sounds produced by güiros can differ based on several factors."},{"i":"1d9a09c0","c":"purpose","d":"E","s":"The following text is adapted from Jason Reynolds’s 2016 novel Ghost. The narrator, who is in middle school, is at a bus stop. I just go there [to the bus stop] to look at the people working out. See, the gym across the street has this big window—like the whole wall is a window—and they have those machines that make you feel like you walking up steps and so everybody just be facing the bus stop, looking all crazy like they’re about to pass out. And trust me, there ain’t nothing funnier than that. So I check that out for a little while like it’s some kind of movie: The About to Pass Out Show, starring stair-stepper person one through ten. ©2016 by Jason Reynolds Which choice best states the main purpose of the text?","o":["To give a reason why the narrator is excited to start middle school","To describe an activity that the narrator finds amusing","To explain a problem that the narrator has overcome","To discuss a movie that the narrator saw in a theater"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text describes how the narrator watches people working out at a gym through a window near a bus stop. The narrator says that \"there ain’t nothing funnier\" than watching people try to work out on the stair climber machine. Thus, the main purpose of the text is to describe an activity that the narrator finds amusing. Choice A is incorrect because the text isn’t about the narrator beginning middle school. The text describes how the narrator finds people working out at a gym amusing and makes no mention of school life. Choice C is incorrect because the text doesn’t mention any problems that the narrator currently has or has overcome. It just describes how the narrator finds watching people work out amusing. Choice D is incorrect because the narrator invents the made-up movie mentioned in the text. The text doesn’t indicate that the narrator has seen a movie in a theater. The focus of the text is on the narrator watching people at the gym, not watching a movie."},{"i":"c4900368","c":"purpose","d":"M","s":"The following text is from the 1924 poem “Cycle” by D’Arcy McNickle, who was a citizen of the Confederated Salish and Kootenai Tribes. There shall be new roads wending, A new beating of the drum— Men’s eyes shall have fresh seeing, Grey lives reprise their span— But under the new sun’s being, Completing what night began, There’ll be the same backs bending, The same sad feet shall drum— When this night finds its ending And day shall have come.....\n\nWhich choice best states the main purpose of the text?","o":["To consider how the repetitiveness inherent in human life can be both rewarding and challenging","To question whether activities completed at one time of day are more memorable than those completed at another time of day","To refute the idea that joy is a more commonly experienced emotion than sadness is","To demonstrate how the experiences of individuals relate to the experiences of their communities"],"a":0,"r":"Choice A is the best answer because it accurately states the main purpose of the text. The text begins by discussing the promise of the future, with positive references to renewal such as “new roads,” “new beating of the drum,” and “fresh seeing.” But with the “new sun,” the text continues, there will still be “the same backs bending” and “the same sad feet” drumming, indicating that these difficulties will follow people into this new day. The poem thus considers both the rewards and challenges associated with the repetitiveness of human life. Choice B is incorrect because the text doesn’t say anything about how memorable activities are, let alone compare the memorability of activities completed at different times of the day. Choice C is incorrect. Although the text contrasts hope with difficulty, it does not compare the relative frequency of joyful feelings with that of sad feelings. Choice D is incorrect because the text makes no distinction between the experiences of individuals and the experiences of their communities."},{"i":"29741ebc","c":"func","d":"E","s":"In the past, historians who wanted to examine Frederick Douglass’s diary and other personal papers had to visit the Library of Congress in Washington, DC, to view them on microfilm <u>(film containing scaled-down reproductions of documents)<\/u>. But traveling to the library often added time and costs to research projects. Now, by going to the library’s website, researchers can access digitized versions of Douglass’s papers without physically going anywhere.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It gives information about a famous person.","It explains the meaning of a word.","It describes a debate among historians.","It summarizes an unexpected finding."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The underlined portion is a parenthetical phrase directly following the word “microfilm,” and it describes film containing small (“scaled-down”) images; the placement and focus of the portion indicate that it is serving to define the term “microfilm.” Choice A is incorrect. Although the text is about accessing the writings of a famous historical figure (Douglass), the underlined portion doesn’t give information about Douglass or any other person. Instead, it explains what microfilms are. Choice C is incorrect because the text never describes any kind of debate or disagreement; it simply describes a change in how researchers can access historical documents, with the underlined portion defining an important term. Choice D is incorrect because the text never makes any mention of a particular finding, unexpected or otherwise; it simply describes a change in how researchers do some of their work, with the underlined portion defining an important term."},{"i":"4c4db685","c":"func","d":"M","s":"On painter William H. Johnson’s return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. <u>Turning away from landscapes painted in an expressionist style—a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist’s subjective experience of reality—Johnson began painting portraits of Black Americans in a bold new way.<\/u> Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It elaborates on the previous sentence’s statement about a transitional moment in Johnson’s artistic career.","It provides information about Johnson’s travels in support of a claim about his artistic influences, which is advanced in the following sentence.","It recounts a moment in Johnson’s personal life that enabled the success of his subsequent career, which is summarized in the following sentence.","It presents evidence that calls into question the previous sentence’s characterization of Johnson’s artistic development."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The first sentence of the text indicates that Johnson returned to the US in 1938 at which time his painting style suddenly changed. The second sentence is underlined and gives more detail about this stylistic change, noting that his earlier work consisted largely of landscapes in an expressionist style and his new works were highly stylized portraits of Black Americans. In other words, the function of the underlined sentence is to elaborate on a transitional moment in Johnson’s painting career. Choice B is incorrect. Although the text does mention that Johnson spent a decade in Europe, it does not discuss what other travel Johnson might have done. Furthermore, although the text mentions African, American, and Scandinavian artistic elements in Johnson’s work, it does not indicate that he traveled to different locations to learn about these practices. Choice C is incorrect because the text does not focus on Johnson’s personal life nor does it address how successful his career was in general. Choice D is incorrect because, rather than call it into question, the underlined sentence continues the discussion of Johnson’s career by adding further relevant detail of Johnson’s artistic transformation."},{"i":"8de51658","c":"cross","d":"M","s":"Text 1 The idea that time moves in only one direction is instinctively understood, yet it puzzles physicists. According to the second law of thermodynamics, at a macroscopic level some processes of heat transfer are irreversible due to the production of entropy—after a transfer we cannot rewind time and place molecules back exactly where they were before, just as we cannot unbreak dropped eggs. But laws of physics at a microscopic or quantum level hold that those processes should be reversible.\n\nText 2 In 2015, physicists Tiago Batalhão et al. performed an experiment in which they confirmed the irreversibility of thermodynamic processes at a quantum level, producing entropy by applying a rapidly oscillating magnetic field to a system of carbon-13 atoms in liquid chloroform. But the experiment “does not pinpoint ... what causes [irreversibility] at the microscopic level,” coauthor Mauro Paternostro said.\n\nBased on the texts, what would the author of\n\nText 1 most likely say about the experiment described in\n\nText 2?","o":["It would suggest an interesting direction for future research were it not the case that two of the physicists who conducted the experiment disagree on the significance of its findings.","It provides empirical evidence that the current understanding of an aspect of physics at a microscopic level must be incomplete.","It is consistent with the current understanding of physics at a microscopic level but not at a macroscopic level.","It supports a claim about an isolated system of atoms in a laboratory, but that claim should not be extrapolated to a general claim about the universe."],"a":1,"r":"Choice B is the best answer. Author 1 describes the puzzle that physicists still can’t solve: at a microscopic level, the “laws of physics” suggest that we should be able to reverse processes that are not reversible at a macroscopic level (and, maybe, turn back time!). The experiment confirmed that those processes are not reversible even on the microscopic level, but it didn’t explain why. This supports Author 1’s point that physicists still don’t fully understand how things work at a microscopic level—maybe the laws need to be revised. Choice A is incorrect. We can’t infer that the author of Text 1 would respond this way to the experiment. Text 2 does name two of the physicists involved in the experiment, but it never suggests that they disagree on anything. Choice C is incorrect. This is the opposite of what the experiment suggests. The experiment confirmed that the macroscopic-level law (“these things can’t be reversed—like time”) was still true on the microscopic level—meaning it supports the current understanding of physics at a macroscopic level. Choice D is incorrect. We can’t infer that the author of Text 1 would respond this way to the experiment. Neither text makes this distinction between laboratory findings and the way the universe works in general."},{"i":"aa0968dd","c":"main","d":"H","s":"Poetry in Classical Nahuatl, the language of the Aztec Empire, relies on difrasismo, or a parallel noun construction that conventionally operates as a single metaphor. For example, the common difrasismo in cuauhtli in ocelotl (literally, “the eagle, the jaguar”) signifies “warrior.”The device’s function is both formal—providing structure to lines of verse—and ritual: semantic relations among the two nouns and the concept they signify can be tenuous, as in the previous example, such that difrasismos are often only intelligible according to the conceptual associations observed in Aztec ceremonial culture.\n\nWhich statement about the difrasismo in cuauhtli in ocelotl is most strongly supported by the text?","o":["Its metaphorical significance derives from the semantic equivalence of the two nouns constituting the difrasismo.","Its unintelligibility may cause its formal function within a line of verse to go unnoticed by present-day readers.","Its apparent obscurity can be resolved when considered in the proper cultural context.","Its frequency in Classical Nahuatl poetry confirms its intelligibility to the Aztec audience."],"a":2,"r":"Choice C is the best answer because it presents a statement about the difrasismo in cuauhtli in ocelotl that is directly supported by the text. The text begins by describing difrasismo, a device used in Classical Nahuatl poetry. The text then mentions the device’s two functions: a formal one (giving structure to lines of verse) and a ritualistic one. The text indicates that the relation between the words in a difrasismo may appear tenuous without the additional information supplied by Aztec ceremonial culture but that the meaning becomes intelligible in the context of that information. Therefore, the difrasismo’s apparent obscurity can be resolved when considered in the proper cultural context. Choice A is incorrect because the text doesn’t indicate that the two nouns used in a difrasismo are semantically equivalent; instead, the text indicates that the two nouns used in a difrasismo make up a single metaphor whose meaning is often intelligible only in the context of information supplied by Aztec ceremonial culture. Choice B is incorrect because the text doesn’t indicate that there’s a relationship between the formal function of the difrasismo and the difrasismo’s intelligibility. Additionally, the text suggests that present-day readers who are familiar with Aztec ceremonial culture wouldn’t find the difrasismo to be unintelligible. Choice D is incorrect because the text doesn’t indicate that the frequency of difrasismo’s use in Classical Nahuatl is a necessary feature of intelligibility: the text indicates that an infrequently used difrasismo would presumably also be intelligible to members of an Aztec audience who are sufficiently familiar with Aztec ceremonial culture."},{"i":"8f3a200e","c":"main","d":"H","s":"Some astronomers searching for extraterrestrial life have proposed that atmospheric NH 3 (ammonia) can serve as a biosignature gas—an indication that a planet harbors life. Jingcheng Huang, Sara Seager, and colleagues evaluated this possibility, finding that on rocky planets, atmospheric NH 3 likely couldn’t reach detectably high levels in the absence of biological activity. But the team also found that on so-called mini- Neptunes—gas planets smaller than Neptune but with atmospheres similar to Neptune’s—atmospheric pressure and temperature can be high enough to produce atmospheric NH 3.\n\nBased on the text, Huang, Seager, and colleagues would most likely agree with which statement about atmospheric NH 3 ?","o":["Its presence is more likely to indicate that a planet is a mini-Neptune than that the planet is a rocky planet that could support life.","Its absence from a planet that’s not a mini-Neptune indicates that the planet probably doesn’t have life.","It should be treated as a biosignature gas if detected in the atmosphere of a rocky planet but not if detected in the atmosphere of a mini- Neptune.","It doesn’t reliably reach high enough concentrations in the atmospheres of rocky planets or mini-Neptunes to be treated as a biosignature gas."],"a":2,"r":"Choice C is the best answer because it states a conclusion the researchers likely agree with, given the details in the text. The text explains that a biosignature gas is a gas that can be used as an indicator that a planet harbors some form of life and some astronomers have proposed that NH 3 could serve as a biosignature gas. The researchers evaluating this claim found that the atmosphere of rocky planets would be unlikely to reach \"detectably high levels\" of NH 3 without biological activity, which would support the proposal of NH 3 serving as a biosignature gas. However, the text also states that mini-Neptune planets can produce NH 3 in the absence of biological activity. Thus, the text is structured to lead to the conclusion that detectable levels of NH 3 in the atmospheres of rocky planets could constitute a biosignature, but that is not the case for detectable levels of the gas in the atmospheres of mini-Neptune planets. Choice A is incorrect because the text indicates that biological activity likely accounts for detectable levels of NH 3 in the atmospheres of rocky planets but mini-Neptune planets can have detectable levels of NH 3 in their atmospheres in the absence of biological activity. Therefore, both rocky planets and mini-Neptune planets can have detectable levels of atmospheric NH 3 . Choice B is incorrect because the text states that for NH 3 to reach detectable levels in the atmospheres of rocky planets likely means they harbor biological activity, meaning that rocky planets with detectable NH 3 usually harbor biological activity. However, that does not entail that every rocky planet with biological activity will have detectable levels of NH 3 in their atmospheres. Choice D is incorrect because the text claims only that some astronomers have proposed using NH 3 as a biosignature gas without mentioning a minimum concentration of atmospheric NH 3 that must be met for it to function as a biosignature gas."},{"i":"f495b554","c":"infer","d":"H","s":"Silicon-based photovoltaic cells account for 95% of the cells used in solar panels worldwide despite converting an average of only 18–22% of the sunlight that reaches them. In a study addressing this relative inefficiency, a team led by Laura Miranda-Pérez demonstrated that the addition of a thin layer of the mineral perovskite—which captures the blue range of light in the solar spectrum, whereas silicon captures the red range— allows the cells to convert 29.5% or more of the Sun’s energy into usable electricity. Cells made with only perovskite, however, are no more efficient than silicon-based ones. It’s reasonable to conclude, then, that ______ Which choice most logically completes the text?","o":["photovoltaic cells with both silicon and perovskite are more efficient because they make use of more of the solar spectrum.","photovoltaic cells with only perovskite and no silicon would likely convert more than 29.5% of the Sun’s energy.","solar power will remain elusive until photovoltaic cells are replaced with a more practical technology.","researchers need to evaluate whether other minerals like perovskite are as effective as perovskite seems to be."],"a":0,"r":"Choice A is the best answer because it presents the conclusion that most logically completes the text’s discussion of the efficiency of various photovoltaic cells. The text indicates that Miranda-Pérez and her team found that adding a layer of perovskite to silicon-based cells increased the percentage of sunlight converted to usable electricity relative to the percentage converted to electricity by silicon-based cells. Using cells with only perovskite and no silicon, however, resulted in no improvement in efficiency over silicon-based cells. The text also states that perovskite captures light in the blue range of the solar spectrum and silicon captures light in the red range of the spectrum. If perovskite and silicon capture different parts of the solar spectrum and the combination of perovskite and silicon results in greater efficiency than the use of either perovskite or silicon alone does, then it is reasonable to infer that the improved efficiency of perovskite-silicon cells could be attributable to their making use of more of the solar spectrum than perovskite-based or silicon-based cells do. Choice B is incorrect because it is directly contradicted by the text, which says that silicon-based cells convert 18%–22% of the sunlight that reaches them to electricity and that cells with only perovskite are no more efficient than silicon-based cells are. Perovskite-only cells thus must convert 22% or less—not more than 29.5%—of the sunlight that reaches them to electricity. Choice C is incorrect because the text focuses on a possible improvement to photovoltaic cells and makes no mention of any alternatives to those cells, so there is no reason to conclude that photovoltaic cells must be replaced with some other technology. Additionally, the text presents solar power as something that currently exists, so it wouldn’t make sense to conclude that solar power will remain elusive. Choice D is incorrect because nothing in the text suggests that there is a need to evaluate the effectiveness of other minerals than perovskite. In fact, the text gives no indication that it is even possible to use other minerals than silicon and perovskite in photovoltaic cells. Instead, the text is focused on the effect of combining perovskite and silicon and the different parts of the solar spectrum that perovskite and silicon capture."},{"i":"58e9e497","c":"infer","d":"H","s":"In the early nineteenth century, some Euro-American farmers in the northeastern United States used agricultural techniques developed by the Haudenosaunee (Iroquois) people centuries earlier, but it seems that few of those farmers had actually seen Haudenosaunee farms firsthand. Barring the possibility of several farmers of the same era independently developing techniques that the Haudenosaunee people had already invented, these facts most strongly suggest that ______ Which choice most logically completes the text?","o":["those farmers learned the techniques from other people who were more directly influenced by Haudenosaunee practices.","the crops typically cultivated by Euro-American farmers in the northeastern United States were not well suited to Haudenosaunee farming techniques.","Haudenosaunee farming techniques were widely used in regions outside the northeastern United States.","Euro-American farmers only began to recognize the benefits of Haudenosaunee farming techniques late in the nineteenth century."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Euro-American farmers’ use of Haudenosaunee agricultural techniques. According to the text, some Euro-American farmers were using these techniques in the early nineteenth century despite few of the farmers having seen Haudenosaunee farms. One explanation for these facts might be that the farmers developed techniques on their own that already had been invented centuries earlier by the Haudenosaunee people, but the text explicitly bars, or rules out, this explanation. If Euro-American farmers didn’t learn these techniques from direct observation of Haudenosaunee practices and didn’t invent the techniques independently, then the most logical explanation is that they learned the techniques from other people who were more directly influenced by Haudenosaunee practices than the farmers themselves were. Once they learned about Haudenosaunee agricultural practices, Euro-American farmers could then apply those practices to their own farming. Choice B is incorrect because the fact that some Euro-American farmers in the northeastern United States were using Haudenosaunee techniques suggests that the techniques were likely useful for the crops the farmers raised, not that the crops typically cultivated by the farmers were not well suited to Haudenosaunee farming techniques. If the farmers’ crops were ill suited to the techniques, it’s unlikely that the farmers would have used those techniques. Choice C is incorrect because the text indicates only that Haudenosaunee agricultural techniques were used by Euro-American farmers in the northeastern United States, not that these techniques were widely used outside this region. Choice D is incorrect because the text states that some Euro-American farmers were using Haudenosaunee farming techniques early in the nineteenth century. This suggests that some Euro-American farmers were beginning to recognize the benefits of these techniques near the start of the century, not that such farmers only began to recognize the benefits of the techniques much later."},{"i":"825dc766","c":"claim","d":"H","s":"King Lear is a circa 1606 play by William Shakespeare. In the play, the character of King Lear attempts to test his three daughters’ devotion to him. He later expresses regret for his actions, as is evident when he ______ Which choice most effectively uses a quotation from King Lear to illustrate the claim?","o":["says of himself, “I am a man / more sinned against than sinning.”","says during a growing storm, “This tempest will not give me leave to ponder / On things would hurt me more.”","says to himself while striking his head, “Beat at this gate that let thy folly in / And thy dear judgement out!”","says of himself, “I will do such things— / What they are yet, I know not; but they shall be / The terrors of the earth!”"],"a":2,"r":"Choice C is the best answer because it most effectively uses a quotation from King Lear to illustrate the claim that King Lear expresses regret for his actions. In the quotation, Lear describes striking himself on the head—the same act he’s engaged in as he speaks, and one that suggests he’s deeply upset with himself. Referring to himself in the second person (with “thy”), the character exclaims “Beat at this gate that let thy folly in / And thy dear judgement out!” Lear refers metaphorically to his own mind as a gate that has allowed folly, or poor judgement, to enter and good judgement to escape. This suggests that Lear regrets his attempts to test his three daughters’ devotion to him, regarding those attempts as examples of the folly that has entered the gate of his mind. Choice A is incorrect because this quotation doesn’t express King Lear’s sense of regret over his own actions; instead, it expresses his belief that the harm that others have done to him (or the extent to which they have “sinned against” him) outweighs whatever harm he himself has caused by “sinning.” Choice B is incorrect because this quotation doesn’t express King Lear’s sense of regret over his own actions; instead, it expresses his thoughts about an approaching storm (“this tempest”), which he believes “will not give [him] leave to ponder,” or time to consider, the harm that he will continue to experience (“things” that “would hurt [him] more”). Choice D is incorrect because this quotation expresses King Lear’s vow to commit terrible actions (or “things” that “shall be / The terrors of the earth”) in the future, not his regret over actions that he’s already taken."},{"i":"156ff681","c":"claim","d":"H","s":"Many governments that regularly transfer money to individuals—to provide supplemental incomes for senior citizens, for example—have long done so electronically, but other countries typically have distributed physical money and have only recently developed electronic transfer infrastructure. Researchers studied the introduction of an electronic transfer system in one such location and found that recipients of electronic transfers consumed a different array of foods than recipients of physical transfers of the same amount did. One potential explanation for this result is that individuals conceive of and allocate funds in physical money differently than they conceive of and allocate funds in electronic form.\n\nWhich finding from the study, if true, would most directly weaken the potential explanation?","o":["Recipients of electronic transfers typically spent their funds at a slower rate than recipients of physical transfers did.","Nearly every recipient of an electronic transfer withdrew the entire amount in physical money shortly after receiving the transfer.","Recipients of physical transfers tended to purchase food about as frequently as recipients of electronic transfers did.","Some recipients of physical transfers received small amounts of money relatively frequently, while others received large amounts relatively infrequently."],"a":1,"r":"Choice B is the best answer. This would weaken the explanation. If the recipients of electronic money immediately withdrew it all as physical money, then both kinds of recipients ended up spending physical money on food. So there must be some other explanation why those who initially received electronic money ate different kinds of food. Choice A is incorrect. This wouldn’t weaken the explanation. If anything, it actually supports it: it demonstrates that recipients of electronic money and recipients of physical money have different spending habits. Choice C is incorrect. This wouldn’t weaken the explanation. The explanation we’re testing this choice against is about the way that people might “conceive of and allocate” physical and electronic funds differently. This choice only focuses on the timing, not what they spend the money on. Choice D is incorrect. This would have no impact on the explanation. It doesn’t tell us anything about possible differences between the spending habits of those who spend physical money and those who spend money electronically."},{"i":"d5da74be","c":"graph","d":"H","s":"","o":["When plants exposed to air from whitefly-free plants were infested, they produced more jasmonic acid than did control plants, whereas when plants exposed to air from whitefly-infested plants were infested, they produced less jasmonic acid and more salicylic acid than did control plants.","When plants exposed to air from whitefly-infested plants were infested, they produced less jasmonic acid than salicylic acid, whereas when plants exposed to air from whitefly-free plants were infested, they produced about the same amount of jasmonic acid and salicylic acid.","When plants exposed to air from whitefly-free plants were infested, they produced both jasmonic acid and salicylic acid, whereas when plants exposed to air from whitefly-infested plants were infested, they exclusively produced salicylic acid.","When plants exposed to air from whitefly-infested plants were infested, they produced less jasmonic acid than did control plants, whereas when plants exposed to air from whitefly-free plants were infested, they produced more jasmonic acid and salicylic acid than did control plants."],"a":0,"r":"Choice A is the best answer because it best describes data from the graph that support the researchers’ conclusion about whitefly-induced defenses in tomato plants. According to the text, tomato plants produce airborne chemicals that prompt nearby tomato plants to increase their production of appropriate defensive chemicals, such as jasmonic acid in response to herbivory and salicylic acid in response to microbial infection. The text goes on to indicate that researchers concluded that whiteflies induce tomato plants to emit chemicals that cause nearby plants to defend against microbial infection instead of herbivory from whiteflies. The graph shows that control tomato plants (plants that weren’t exposed to any chemicals from nearby tomato plants and weren’t subsequently infested with whiteflies) produced about 140 nanograms of jasmonic acid per gram of dry weight and about 120 nanograms of salicylic acid per gram of dry weight, which indicates the baseline levels of these defensive chemicals in tomato plants. The graph also shows that plants exposed to air from whitefly-free plants produced about 205 nanograms of jasmonic acid per gram of dry weight when subsequently infested by whiteflies, which is more than the amount produced by the control plants. This suggests that when infested with whiteflies, tomato plants that weren’t previously exposed to air from nearby whitefly- infested plants begin producing higher levels of jasmonic acid to defend against the infestation. Finally, the graph also shows that plants exposed to air from whitefly-infested plants and then subsequently infested by whiteflies produced approximately 100 nanograms of jasmonic acid per gram of dry weight (which is less than control plants did) and approximately 175 nanograms of salicylic acid per gram of dry weight (which is more than control plants did). This suggests that whiteflies cause tomato plants to emit chemical signals that decrease nearby plants’ defenses against whitefly herbivory relative to baseline levels and redirect their defenses toward microbial infection, thereby supporting the researchers’ conclusion that whiteflies cause tomato plants to emit airborne chemical signals that induce nearby plants to preferentially defend against microbes even when experiencing herbivory from whiteflies. Choice B is incorrect. Although the graph shows that tomato plants exposed to whitefly-infested plants produced less jasmonic acid than salicylic acid (about 100 nanograms of jasmonic acid per gram of dry weight vs. about 175 nanograms of salicylic acid per gram of dry weight), and although this might suggest that those plants are therefore better defended against microbial attack than against herbivory, this wouldn’t be sufficient to conclude that this is the case: without reference to the relative levels of defensive chemicals produced by the plants in the other experimental conditions, it would be impossible to conclude that exposure to air from whitefly-infested plants either induces or diminishes these plants’ defenses to different kinds of threats. Furthermore, the graph shows that plants exposed to air from whitefly-free plants produced about 205 nanograms of jasmonic acid per gram of dry weight and about 130 nanograms of salicylic acid per gram of dry weight, not that they produced the same amount of the two acids. Choice C is incorrect because it inaccurately describes the data in the graph. The graph shows that plants in all three conditions produced both jasmonic and salicylic acid, not that plants exposed to air from whitefly-infested plants produce no jasmonic acid at all. Choice D is incorrect. Although the graph shows that plants exposed to air from whitefly-infested plants produced about 100 nanograms of jasmonic acid per gram of dry weight when infested, which is less than the amount produced by control plants (about 140 nanograms per gram of dry weight), and although the graph shows that plants exposed to air from whitefly-free plants produced about 205 nanograms of jasmonic acid per gram of dry weight when infested (which is more than the amount produced by control plants) and about 130 nanograms of salicylic acid per gram of dry weight (which is more than the approximately 120 nanograms per gram of dry weight produced by control plants), this wouldn’t support the researchers’ conclusion that plants exposed to air from whitefly-infested plants preferentially defend against microbial infection—that is, that they increase their levels of salicylic acid and decrease their levels of jasmonic acid relative to control plants. Rather, the data would suggest that exposure to air from whitefly-infested plants reduces plants’ defenses against herbivory, but these data wouldn’t indicate that whiteflies induce plants to redirect their defenses to guard against microbial infection. Furthermore, the data concerning plants exposed to air from whitefly-free plants merely indicate that these plants increase their defenses against both herbivory and microbial infection when infested by whiteflies."},{"i":"82bdf676","c":"graph","d":"H","s":"","o":["There was a strong positive correlation between participants’ ignobility scores and admirable-trait candidates’ likability ratings, but there was no correlation between ignobility scores and ignoble-trait candidates’ likability ratings.","Participants with an ignobility score of 5 or less rated admirable-trait candidates as more likable than ignoble-trait candidates, whereas participants with an ignobility score of 6 or more rated ignoble-trait candidates as equally likable as or even more likable than admirable-trait candidates.","Overall, participants rated admirable-trait candidates as quite likable, and that rating was not significantly affected by the participants’ ignobility scores.","Unlike participants with an ignobility score of 6, participants with an ignobility score either greater or less than 6 gave admirable-trait candidates and ignoble-trait candidates different likability ratings."],"a":1,"r":"Choice B is the best answer because it describes data from the graph that support the researchers’ conclusion that the trend of admirable-trait candidates being rated as more likable than ignoble-trait candidates held true when participants’ own personality-trait scores were factored in, except among participants with high ignobility scores. The values on the x-axis represent survey participants grouped by their own ignobility scores, from low ignobility (1) to high ignobility (7), while the values on the y-axis represent the likability scores given to the political candidates. The graph shows that the full range of participants (from least to most ignoble) gave the admirable-trait candidates (represented by the line with triangles) a likability rating of approximately 70 out of 100; that is, regardless of their own level of ignobility, participants generally found admirable-trait candidates quite likable. However, the graph shows that participants varied in their views of ignoble-trait candidates (represented by the line with squares); likability ratings increased as the participants’ own ignobility scores increased. Participants with low to medium-high ignobility scores (1 to 5) still rated the ignoble-trait candidates as less likable than the admirable-trait candidates, with all ratings falling below approximately 70, but participants with high ignobility scores (6 and 7) gave ratings equal to or higher than approximately 70. In other words, the previously observed trend of ranking admirable-trait candidates as more likable than ignoble-trait candidates persisted for participants with low to medium-high ignobility but not for participants with high ignobility. Choice A is incorrect because it describes the opposite of what the graph shows. The graph shows a positive correlation between participants’ ignobility scores and ignoble-trait candidates’ likability ratings (as participants’ ignobility scores increased, so did their ratings for ignoble-trait candidates’ likability) and no correlation between ignobility scores and admirable-trait candidates’ likability ratings (all participants gave admirable-trait candidates a rating of approximately 70 out of 100). Choice C is incorrect. The graph does show that regardless of their own ignobility scores, participants rated admirable-trait candidates as quite likable (a rating of approximately 70 out of 100). However, this doesn’t support the researchers’ conclusion because the conclusion has to do with how participants rated both types of candidates, not just the admirable-trait ones; moreover, the conclusion is that relative ratings were actually affected by the participants’ ignobility scores. Choice D is incorrect. The graph does show that only participants with an ignobility score of 6 gave the same likability score to both admirable- and ignoble- trait candidates while participants with other ignobility scores gave a different rating for each candidate, but this doesn’t support the researchers’ conclusion. The conclusion isn’t just that participants gave different ratings to the two types of candidates—it’s that participants with low to medium-high ignobility scores specifically gave higher likability ratings to admirable-trait candidates than to ignoble-trait candidates and that participants with high ignobility scores didn’t."},{"i":"0aebdf5f","c":"fss","d":"E","s":"According to linguist Martin Joos, speakers of the English language ______ five main registers—frozen, formal, consultative, casual, and intimate —which they rotate between depending on the situation.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["use","is using","uses","has used"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The plural verb \"use\" agrees in number with the plural subject \"speakers.\" Choice B is incorrect because the singular verb \"is using\" doesn’t agree in number with the plural subject \"speakers.\" Choice C is incorrect because the singular verb \"uses\" doesn’t agree in number with the plural subject \"speakers.\" Choice D is incorrect because the singular verb \"has used\" doesn’t agree in number with the plural subject \"speakers.\""},{"i":"7a0d9031","c":"fss","d":"M","s":"In many of her landscape paintings from the 1970s and 1980s, Lebanese American artist Etel Adnan worked to capture the essence of California’s fog-shrouded Mount Tamalpais region through abstraction, using splotches of color to represent the area’s features. Interestingly, the triangle representing the mountain itself ______ among the few defined figures in her paintings.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are","have been","were","is"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject–verb agreement. The singular verb “is” agrees in number with the singular subject “the triangle.” Choice A is incorrect because the plural verb “are” doesn’t agree in number with the singular subject “the triangle.” Choice B is incorrect because the plural verb “have been” doesn’t agree in number with the singular subject “the triangle.” Choice C is incorrect because the plural verb “were” doesn’t agree in number with the singular subject “the triangle.”"},{"i":"772835db","c":"fss","d":"H","s":"Most of the ice found on Earth is ice Ih, distinguished by a crystalline structure in which molecules form a hexagonal pattern. Amorphous ice, on the other hand, constitutes most of the ice in the ultrafrigid environment of outer space. Defined by a disorganized molecular structure, ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["ice Ih contains crystals, whereas amorphous ice, which lacks the thermal energy to form them, does not.","amorphous ice lacks the thermal energy to form the crystals found in ice Ih.","the lack of thermal energy in amorphous ice explains its inability to form the crystals found in ice Ih.","ice Ih differs from amorphous ice in that it possesses the thermal energy to form crystals."],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “amorphous ice” the subject of the sentence and places it immediately after the modifying phrase “defined…structure.” In doing so, this choice clearly establishes that amorphous ice—and not another noun in the sentence—is being described as having a disorganized molecular structure. Choice A is incorrect because it results in a dangling modifier. The placement of the noun “ice Ih” immediately after the modifying phrase illogically suggests that ice Ih has a disorganized molecular structure, whereas ice Ih is previously described as having molecules that form a hexagonal pattern. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “the lack of thermal energy” immediately after the modifying phrase illogically suggests that the lack of thermal energy has a disorganized molecular structure. Choice D is incorrect because it results in a dangling modifier. The placement of “ice Ih” immediately after the modifying phrase illogically suggests that ice Ih has a disorganized molecular structure, whereas ice Ih is previously described as having molecules that form a hexagonal pattern."},{"i":"74ce2f05","c":"bound","d":"M","s":"A study led by scientist Rebecca Kirby at the University of Wisconsin–Madison found that black bears that eat human food before hibernation have increased levels of a rare carbon isotope, ______ due to the higher 13 C levels in corn and cane sugar. Bears with these elevated levels were also found to have much shorter hibernation periods on average.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["carbon-13, ( 13 C)","carbon-13 ( 13 C)","carbon-13, ( 13 C),","carbon-13 ( 13 C),"],"a":3,"r":"Choice D is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. The comma after “(13C)” pairs with the comma after “isotope” to separate the supplementary element “carbon-13 (13C)” from the rest of the sentence. This supplementary element defines the “rare carbon isotope,” and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because it fails to use appropriate punctuation to separate the supplementary element “carbon-13 (13C)” from the rest of the sentence. Choice B is incorrect because it fails to use appropriate punctuation to separate the supplementary element “carbon-13 (13C)” from the rest of the sentence. Choice C is incorrect because it fails to use appropriate punctuation to separate the supplementary element “carbon-13 (13C)” from the rest of the sentence. The comma after “carbon-13” isn’t necessary because the parentheses around “13C” already separate this element from the rest of the sentence."},{"i":"fe41f258","c":"bound","d":"M","s":"In ancient Greece, an Epicurean was a follower of Epicurus, a philosopher whose beliefs revolved around the pursuit of pleasure. Epicurus defined pleasure as “the absence of pain in the body and of trouble in the ______ that all life’s virtues derived from this absence.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["soul,” positing","soul”: positing","soul”; positing","soul.” Positing"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between a main clause and a participial phrase. This choice correctly uses a comma to mark the boundary between the main clause (“Epicurus… ‘soul’”) and the participial phrase (“positing…absence”) that provides additional information about how Epicurus defined pleasure. Choice B is incorrect because a colon can’t be used in this way to join a main clause and a participial phrase. Choice C is incorrect because a semicolon can’t be used in this way to join a main clause and a participial phrase. Choice D is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “positing.”"},{"i":"56b000d0","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: The factors that affect clutch size (the number of eggs laid at one time) have been well studied in birds but not in lizards. A team led by Shai Meiri of Tel Aviv University investigated which factors influence lizard clutch size. Meiri’s team obtained clutch-size and habitat data for over 3,900 lizard species and analyzed the data with statistical models. Larger clutch size was associated with environments in higher latitudes that have more seasonal change. Lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable conditions. The student wants to emphasize the aim of the research study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Researchers wanted to know which factors influence lizard egg clutch size because such factors have been well studied in birds but not in lizards.","After they obtained data for over 3,900 lizard species, researchers determined that larger clutch size was associated with environments in higher latitudes that have more seasonal change.","We now know that lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable conditions.","Researchers obtained clutch-size and habitat data for over 3,900 lizard species and analyzed the data with statistical models."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes the aim of the research study by highlighting what the researchers conducting the study wanted to know—specifically, which factors influence clutch size among lizards. Choice B is incorrect because the sentence emphasizes what researchers determined at the end of the study, not what the study’s aim was. Choice C is incorrect because the sentence emphasizes a finding from the research study, not the aim of the study. Choice D is incorrect because the sentence emphasizes the research study’s methodology, not its aim."},{"i":"6b5bc97d","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The Sasanian Empire lasted about 400 years (AD 224 to AD 651). The Sasanians controlled an area spanning 1.4 million square miles. This area included present-day Iran and Iraq. The empire’s capital was the ancient city of Ctesiphon. Ctesiphon was located near present-day Baghdad, Iraq. The student wants to specify the location of Ctesiphon.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Sasanian Empire began in AD 224 and ended in AD 651.","The capital of the Sasanian Empire, which spanned 1.4 million square miles, was Ctesiphon.","The Sasanians controlled an area of 1.4 million square miles, including present-day Iran and Iraq.","Ctesiphon, the capital of the Sasanian Empire, was located near present-day Baghdad, Iraq."],"a":3,"r":"Choice D is the best answer. The sentence specifies the location of Ctesiphon, noting that it was located near present-day Baghdad, Iraq. Choice A is incorrect because the sentence explains when the Sasanian Empire began and ended; it doesn’t specify the location of Ctesiphon. Choice B is incorrect because the sentence emphasizes that Ctesiphon was the capital of the Sasanian Empire; it doesn’t specify Ctesiphon’s location. Choice C is incorrect because it emphasizes the size of the Sasanian Empire; it doesn’t specify the location of Ctesiphon."},{"i":"8e9677e6","c":"trans","d":"H","s":"In 2009, the Craft and Folk Art Museum in Los Angeles hosted a special exhibition, Sueños/Yume, showcasing the works of local sculptor Dora de Larios. As suggested by the show’s title (sueños and yume mean “dreams” in Spanish and Japanese, respectively), de Larios’s art reflects a mix of cultural influences. ______ her work is grounded in the artistic traditions of both Mexico and Japan.\n\nWhich choice completes the text with the most logical transition?","o":["In addition,","In contrast,","Specifically,","Therefore,"],"a":2,"r":"Choice C is the best answer. “Specifically” logically signals that this sentence provides specific, precise details elaborating on the previous sentence’s claim that de Larios’s art reflects a mix of cultures. This sentence specifies which cultures the previous sentence is referring to: the artistic traditions of both Mexico and Japan. Choice A is incorrect because “in addition” illogically signals that the information in this sentence is a separate point that follows the previous claim about de Larios’s art. Instead, it provides specific details elaborating on that claim. Choice B is incorrect because “in contrast” illogically signals that the information in this sentence contrasts with the previous claim about de Larios’s art. Instead, it provides specific details elaborating on that claim. Choice D is incorrect because “therefore” illogically signals that the information in this sentence is a result of the previous claim about de Larios’s art. Instead, it provides specific details elaborating on that claim."},{"i":"0f9ed134","c":"trans","d":"M","s":"In 1974, Mexican chemist Mario Molina and US chemist F . Sherwood Rowland discovered that chemicals called CFCs were harmful to the ozone layer. Their research was extremely influential in the fight against CFCs. ______ it laid the foundation for a 1987 treaty that phased out the use of CFCs across the globe.\n\nWhich choice completes the text with the most logical transition?","o":["Regardless,","Specifically,","However,","Earlier,"],"a":1,"r":"Choice B is the best answer. \"Specifically\" logically signals that the information in this sentence—that Molina and Rowland’s research laid the foundation for a later treaty—provides specific, precise details elaborating on the previous sentence’s more general claim about the influence of the research. Choice A is incorrect because \"regardless\" illogically signals that the information in this sentence is true despite the previous sentence’s claim about the influence of Molina and Rowland’s research. Instead, this information—that the research laid the foundation for a later treaty—provides specific details elaborating on the previous claim. Choice C is incorrect because \"however\" illogically signals that the information in this sentence contrasts with the previous sentence’s claim about the influence of Molina and Rowland’s research. Instead, this information—that the research laid the foundation for a later treaty—provides specific details elaborating on the previous claim. Choice D is incorrect because \"earlier\" illogically signals that the information in this sentence occurred at a time before Molina and Rowland’s research influenced the fight against CFCs. Instead, this information—that the research laid the foundation for a later treaty—provides specific details elaborating on the previous claim about the research’s influence."},{"i":"d3725911","c":"trans","d":"E","s":"In the search for extraterrestrial life, astrobiologists Stuart Bartlett and Michael L. Wong propose that scientists avoid using the term “life.” ______ researchers should use another word: “lyfe.”This new term, they argue, could be used to draw distinctions between the known characteristics of life on Earth and the potentially differing characteristics of lyfe on other planets.\n\nWhich choice completes the text with the most logical transition?","o":["Previously,","Regardless,","There,","Instead,"],"a":3,"r":"Choice D is the best answer. \"Instead\" logically signals that the idea in this sentence—that researchers should use the word \"lyfe\"—is an alternative to the idea mentioned in the previous sentence (scientists’ use of the word \"life\"). Choice A is incorrect because \"previously\" illogically signals that the idea in this sentence occurs before the action in the first sentence. Instead, the use of \"lyfe\" is an alternative to the previously mentioned use of \"life.\" Choice B is incorrect because \"regardless\" illogically signals that the idea in this sentence is true despite the information in the first sentence. Instead, the use of \"lyfe\" is an alternative to the previously mentioned use of \"life.\" Choice C is incorrect because \"there\" illogically signals that the idea in this sentence occurs in a place mentioned in the previous sentence. Instead, the use of \"lyfe\" is an alternative to the previously mentioned use of \"life.\""}],"img":{"d5da74be":"iVBORw0KGgoAAAANSUhEUgAAArwAAALLBAMAAADps0wJAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABk/klEQVR42u1dd1wURxt+Zvfu6Nws2BsL2Oth7x72qIlnS9QkesaaxCSYGI0tH0ZjjQY1sZtg74olFtR49ojtsHcOS4xRuTnsAjffH3cgIBaMCOI+P3+yu7OzM/vcu++87zsNUKBAgQIFChQoUKBAgQIFChQoUKBAwZsCkuFV+pz0F01+ayFlSJYuFbEARD1AKgMAaSM6rzUhOseBDwAgCIAR8E/906h0bz29fUAAkLTiJ4YB1PFPAgAXEzAkshtAVDsKyY57xqsmOfLMAACsBYgN+PaxzEu0cMhbL9WDaUZX5bRXXcOhPhaoByCuFZIzEkoBgNyUAUAGiAmYllqnuBtf44sIOZJerW3IX9T1YKhbn
