<script>
const D={"t":"SATPractice9","q":[{"i":"bcd924a5","c":"vocab","d":"E","s":"The unique subak water management system used to irrigate the rice paddy fields of the Indonesian island of Bali has a rich cultural, philosophical, and historical significance dating back to the ninth century. The many elements of subak—terraces, canals, and water temples— are ______: they are joined together into a single cohesive unit.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["outmoded","informal","interconnected","optional"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Bali’s subak water management system. In this context, “interconnected” would mean joined or linked together. The text describes the various components of the subak system—“terraces, canals, and water temples”—and then states that they are “joined together into a single cohesive unit.”This context indicates that these elements are connected with one another in an integrated system. Choice A is incorrect because “outmoded” would mean outdated or no longer in use. While the text does indicate that the subak system has “rich cultural, philosophical, and historical significance,” the text doesn’t suggest that the subak system is obsolete or not currently used. Choice B is incorrect because “informal” would suggest that the subak system lacks structure or organization. The text contradicts this by describing a complex system with specific components (“terraces, canals, and water temples”) that are “joined together into a single cohesive unit,” indicating formal organization rather than informality. Choice D is incorrect because “optional” would suggest that the various elements of the subak system are not necessary or required. The text indicates the opposite by stating that these elements are “joined together into a single cohesive unit,” suggesting that each component plays a necessary role in the functioning of the integrated system."},{"i":"f7d58b53","c":"vocab","d":"E","s":"Like other tribal nations, the Muscogee (Creek) Nation is self-governing; its National Council generates laws regulating aspects of community life such as land use and healthcare, while the principal chief and cabinet officials ______ those laws by devising policies and administering services in accordance with them.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["implement","presume","improvise","mimic"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of self-government among the Muscogee (Creek) Nation. In this context, “implement” means to carry out or put into effect. The text states that the National Council generates laws, while the principal chief and cabinet officials are responsible for “devising policies and administering services in accordance with” those laws. This context suggests that the principal chief and cabinet officials implement the laws: they put the laws into effect by creating policies and administering services that accord with those laws. Choice B is incorrect because “presume” in this context would mean to assume based on incomplete information, and the text does not suggest that the principal chief and cabinet officials either made assumptions about the content of the laws or had incomplete information about them. Choice C is incorrect because in this context “improvise” would mean to create something without preparation, and the text does not suggest that the principal chief and cabinet officials create policies and administer services without advance preparation. Choice D is incorrect because nothing in the text suggests that the principal chief and cabinet officials “mimic,” or imitate, the laws generated by the National Council. To mimic laws would mean to generate new laws that are imitations of existing laws, but the text indicates that the National Council, not the principal chief and cabinet officials, is responsible for generating laws. Instead of generating laws, the principal chief and cabinet officials put laws into effect by “devising policies and administering services in accordance with” the laws."},{"i":"e41dfaab","c":"vocab","d":"E","s":"In 1929 the Atlantic Monthly published several articles based on newly discovered letters allegedly exchanged between President Abraham Lincoln and a woman named Ann Rutledge. Historians were unable to ______ the authenticity of the letters, however, and quickly dismissed them as a hoax.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["validate","interpret","relate","accommodate"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of letters allegedly exchanged between President Lincoln and Rutledge. In this context, “validate” means to confirm that something is real or correct. According to the text, it was alleged, or claimed, that the newly discovered letters had been written by Lincoln and Rutledge. The text also indicates that historians ultimately decided the letters were a hoax, or fraudulent. This context suggests that the historians couldn’t confirm that the letters were authentic. Choice B is incorrect. The text focuses on the authenticity of the letters, which were claimed to have been written by Lincoln and Rutledge and were then quickly dismissed as fraudulent by historians. Rather than conveying that the historians simply weren’t able to “interpret,” or explain in an understandable way, the letters’ authenticity, the text suggests that the historians decided the letters lacked authenticity altogether. Choice C is incorrect. The text states that the historians quickly dismissed the letters claimed to have been written by Lincoln and Rutledge as fraudulent; this suggests that rather than being unable to “relate,” or tell others about, the letters’ authenticity, the historians were able to share what they’d decided about the letters. Choice D is incorrect because it wouldn’t make sense to suggest that the historians couldn’t “accommodate,” or give consideration to, the authenticity of the letters claimed to have been written by Lincoln and Rutledge; the text states that the historians decided that the letters were fraudulent, which indicates that they did consider whether the letters were authentic."},{"i":"f4166aae","c":"vocab","d":"M","s":"In addition to being an accomplished psychologist himself, Francis Cecil Sumner was a ______ increasing the opportunity for Black students to study psychology, helping to found the psychology department at Howard University, a historically Black university, in 1930.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["proponent of","supplement to","beneficiary of","distraction for"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Francis Cecil Sumner. As used in this context, “proponent of” means supporter of. The text says that Sumner helped to found the psychology department at historically Black Howard University in 1930. This is evidence that Sumner supported increasing the opportunity for Black students to study psychology. Choice B is incorrect because the phrase “supplement to,” or addition to, wouldn’t make sense in context. The text discusses Sumner’s efforts to increase the number of Black psychology students, but it doesn’t make sense to describe him as an addition to his efforts. Choice C is incorrect because Sumner was already an accomplished psychologist himself when he helped to found the Howard University psychology department. While Black students were the beneficiaries of his efforts—that is, they received help because of his efforts—it wouldn’t make sense in this context to describe Sumner as a “beneficiary of” opportunities, because he was the one doing the helping. Choice D is incorrect because founding a psychology department at Howard University wouldn’t be a “distraction for” Sumner’s aim to increase the opportunity for Black students to study psychology—that is, it wouldn’t be something that draws Sumner’s attention away from that goal, but rather the opposite."},{"i":"6f5fc289","c":"purpose","d":"M","s":"The following text is adapted from Charles Dickens’s 1854 novel Hard Times. Coketown is a fictional town in England. [Coketown] contained several large streets all very like one another, and many small streets still more like one another, inhabited by people equally like one another, who all went in and out at the same hours, with the same sound upon the same pavements, to do the same work, and to whom every day was the same as yesterday and tomorrow, and every year the counterpart of the last and the next.\n\nWhich choice best states the main purpose of the text?","o":["To emphasize the uniformity of both the town and the people who live there","To explain the limited work opportunities available to the town’s residents","To reveal how the predictability of the town makes it easy for people lose track of time","To argue that the simplicity of life in the town makes it a pleasant place to live"],"a":0,"r":"Choice A is the best answer. The author describes Coketown as having streets that are all very similar and residents who live similarly and do the same work. This repetition of similarities emphasizes how everything in Coketown is alike. Choice B is incorrect. While the text mentions that all the residents “do the same work,” it never explains what that work is or why everyone does it. Besides, the idea that they all do the same work is just one of several similarities among the townspeople described in the text. Choice C is incorrect. While the last sentence states that “every day was the same as yesterday and tomorrow, and every year the counterpart of the last and the next,” it never suggests that people actually “lose track of time.” This is also too narrow to be the main idea, since time is just one of many aspects of Coketown that the text describes as always being the same. Choice D is incorrect. The text never mentions whether life is simple in Coketown, and the town sounds as though it’s probably a pretty dull place to live, rather than a pleasant one."},{"i":"ae2b3112","c":"purpose","d":"M","s":"By combining Indigenous and classical music, Cree composer and cellist Cris Derksen creates works that reflect the diverse cultural landscape of Canada. For her album Orchestral Powwow, Derksen composed new songs in the style of traditional powwow music that were accompanied by classical arrangements played by an orchestra. But where an orchestra would normally follow the directions of a conductor, the musicians on Orchestral Powwow are led by the beat of a powwow drum.\n\nWhich choice best states the main purpose of the text?","o":["To examine how Derksen’s musical compositions blend cultures","To argue that Derksen should be recognized for creating a new style of music","To describe the difficulties Derksen encountered when producing her album","To establish a contrast between Derksen’s classical training and her Cree heritage"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to discuss how Derksen’s compositions incorporate elements from both Indigenous and classical music. After introducing Derksen, the text describes how the songs Derksen composed for her album Orchestral Powwow feature aspects of the two musical traditions. Specifically, the text notes that Derksen wrote songs in the style of traditional powwow music but accompanied them with classical arrangements played by an orchestra that followed the beat of a powwow drum rather than the directions of a conductor. In this way, Derksen’s compositions blend different cultures. Choice B is incorrect because although the text suggests that Derksen’s songs contain innovative elements since they blend styles from two different musical traditions, it doesn’t discuss whether her compositions constitute a new style of music, let alone whether Derksen should be recognized for creating a new style of music. Choice C is incorrect because the text doesn’t mention any difficulties Derksen encountered when producing her album. Rather, the text describes how the songs on the album exemplify how Derksen combines music from two different cultures. Choice D is incorrect because although the text mentions Derksen’s Cree heritage and suggests that she relies on knowledge of both Indigenous and classical music when she composes her songs, it doesn’t discuss her musical training. Additionally, the text is primarily focused on how Derksen combines different cultural traditions, not on contrasting Derksen’s training with her heritage."},{"i":"a2f64e58","c":"func","d":"H","s":"<u>Individual elephants and Arctic herbivores such as caribou tend to have fixed geographic ranges throughout their lifetimes,<\/u> which had prompted some researchers to speculate that the Arctic woolly mammoth, an extinct elephantid, might have exhibited similar behavior. Mammoth tusks grew in sequential layers, incorporating ingested minerals and organics, and so each ivory stratum reflects the ratio of strontium isotopes ( 87 Sr/ 86 Sr) in the local environment; thus, the sequence of strata shows where the animal roamed during life. Recent analysis of the strontium ratios in the strata of one Arctic woolly mammoth tusk in relation to the geographic distribution of strontium ratios in the environment shows the animal’s range begin to expand as it reached sexual maturity, only to contract again in its final 1.5 years.\n\nWhich choice best describes the function of the underlined statement in the text as a whole?","o":["It discusses a characteristic shared by certain animals in order to explain why researchers raised a possibility that turned out not to be supported by data described later in the text.","It illustrates a pattern of behavior among certain animals in order to present a theory about exceptions to that pattern that is weakened by a finding described later in the text.","It describes a similarity in the behavior of certain animals in order to show why a method described later in the text did not reveal whether another animal also showed that behavior.","It introduces a trait shared by certain animals in order to contextualize a hypothesis about the origin of that trait that is advanced later in the text."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined statement functions in the text as a whole. The underlined statement mentions a category of animals that have a feature in common: they tend to have fixed geographic ranges throughout their lifetimes. The text then presents the speculation of some researchers that the Arctic woolly mammoth might also share this characteristic. However, an examination of the content of strontium in the strata (or layers) of a woolly mammoth tusk indicated that contrary to the researchers’ hypothesis, the mammoth had an expanding range in its environment that contracted in its last 1.5 years of life. Thus, the underlined statement discusses a characteristic shared by certain animals in order to explain why researchers raised a possibility that turned out not to be supported by data described later in the text. Choice B is incorrect. Though the underlined statement presents a pattern of behavior (the habit of certain animals of staying within a fixed geographic range), the rest of the text does not present a theory of exceptions to that pattern; rather, the researchers are merely concerned with whether one particular animal has behavior consistent with the pattern. Choice C is incorrect. Though the underlined statement does describe a similarity in the behavior of certain animals (their tendency to stay within a fixed geographic range), this is not done in order to show why a method described later in the text failed to show whether another animal showed that behavior; rather, the method of analysis of strata of a woolly mammoth tusk showed that the mammoth’s behavior was different from that of the animals mentioned in the underlined statement. Choice D is incorrect. Though the underlined statement mentions a trait shared by a number of animals (their fixed geographic range), the rest of the text does not present a hypothesis regarding the origin of that trait; rather, the researchers are concerned with whether another particular animal shares that trait."},{"i":"c6bd3447","c":"func","d":"M","s":"The following text is from Virginia Woolf’s 1919 novel Night and Day. The text describes a gathering of young artists and intellectuals. One person after another rose, and, as with <u>an ill-balanced axe, attempted to hew out<\/u> his conception of art a little more clearly, and sat down with the feeling that, for some reason which he could not grasp, his <u>strokes had gone awry<\/u>. As they sat down they turned almost invariably to the person sitting next them, and rectified and continued what they had just said in public.\n\nWhich choice best describes the function of the underlined portions in the text as a whole?","o":["To demonstrate individuals’ puzzlement over the reputation of a certain artwork","To highlight the physical effort involved in individuals’ construction of large-scale works of art","To draw attention to individuals’ discontent with the group’s conversation about art","To emphasize the extent of individuals’ struggles to articulate thoughts on art"],"a":3,"r":"Choice D is the best answer because it most accurately describes the function of the underlined portions in the text as a whole. The underlined portions describe the young artists and intellectuals at the gathering as trying to \"hew out,\" or give shape to, their views of art more clearly, but with each seeming to be using \"an ill-balanced axe\" and then feeling that the \"strokes had gone awry.\" In context, the metaphorical language comparing attempts to refine concepts of art to imprecisely cutting wood with an inadequate axe serves to emphasize how much the individuals at the gathering struggled to articulate, or express, their thoughts; indeed, the text explains that the individuals couldn’t quite grasp why their statements had gone awry and tended to try to rectify, or correct, them in continued discussion after they sat down. Choice A is incorrect because the underlined portions characterize aspects of the young artists and intellectuals’ attempts to present their general views of art more clearly, not their views of the reputation of a certain artwork; the text never mentions any specific artwork or its reputation. Choice B is incorrect. Although the underlined portions refer to a physical activity—cutting wood with an axe—the descriptions are metaphorical rather than literal. The text isn’t describing people constructing works of art, large-scale or otherwise; rather, it’s describing people talking at a gathering, using the idea of imprecisely cutting wood with an inadequate axe to suggest that each individual struggled when trying to present their view of art more clearly. Choice C is incorrect. Although the underlined portions do provide a reason for the young artists and intellectuals’ discontent, the text focuses on the fact that they were each dissatisfied with their own statements, not on how they felt about the group’s full conversation about art. Instead, the text explains that each individual tried to present their view of art more clearly but struggled (as if imprecisely cutting wood with an inadequate axe), couldn’t grasp what went awry, and then felt the need to rectify, or correct, what they had just said. It’s possible that the individuals were also discontented with the group’s conversation overall, but neither the underlined portions nor the text as a whole suggest that."},{"i":"c7265342","c":"structure","d":"M","s":"The following text is from the 1895 poem “Marshlands” by Emily Pauline Johnson, a Kanienkahagen (Mohawk) writer also known as Tekahionwake. Among the wild rice in the still lagoon, In monotone the lizard shrills his tune. The wild goose, homing, seeks a sheltering, Where rushes grow, and oozing lichens cling. Late cranes with heavy wing, and lazy flight, Sail up the silence with the nearing night. And like a spirit, swathed in some soft veil, Steals twilight and its shadows o’er the swale. Hushed lie the sedges, and the vapours creep, Thick, grey and humid, while the marshes sleep.\n\nWhich choice best describes the overall structure of the text?","o":["It names animal species found in a place, then names plant species there.","It sketches a setting by presenting a series of images of nature.","It makes an extended comparison of nature to human emotions.","It identifies a location, then refers to a person living there."],"a":1,"r":"Choice B is the best answer because it best describes the overall structure of the text. The text first establishes the setting, a \"still lagoon,\" and then goes on to provide more details about the lagoon by presenting several descriptive images of nature, including a lizard that \"shrills his tune,\" \"oozing lichens,\" and \"thick, grey and humid\" vapors. Choice A is incorrect. Instead of simply naming species, the text presents descriptive images of nature; further, instead of naming animals and then moving on to name plants, the text refers first to a plant (\"the wild rice\"), then to two animals (\"the lizard,\" \"the wild goose\"), then to another plant (\"rushes\"), and so on. Choice C is incorrect because the text does not draw any comparison between nature and human emotions; it does not refer to human emotions at all. Choice D is incorrect. While the text does begin by identifying a specific location, a \"still lagoon,\" it makes no mention of a person living there."},{"i":"105ea6de","c":"cross","d":"H","s":"Text 1 Growth in the use of novel nanohybrids—materials created from the conjugation of multiple distinct nanomaterials, such as iron oxide and gold nanomaterials conjugated for use in magnetic imaging—has outpaced studies of nanohybrids’ environmental risks. Unfortunately, risk evaluations based on nanohybrids’ constituents are not reliable: <u>conjugation may alter constituents’ physiochemical properties such that innocuous nanomaterials form a nanohybrid that is anything but<\/u>.\n\nText 2 The potential for enhanced toxicity of nanohybrids relative to the toxicity of constituent nanomaterials has drawn deserved attention, but the effects of nanomaterial conjugation vary by case. For instance, it was recently shown that a nanohybrid of silicon dioxide and zinc oxide preserved the desired optical transparency of zinc oxide nanoparticles while mitigating the nanoparticles’ potential to damage DNA.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the assertion in the underlined portion of\n\nText 1?","o":["By concurring that the risk described in Text 1 should be evaluated but emphasizing that the risk is more than offset by the potential benefits of nanomaterial conjugation","By arguing that the situation described in Text 1 may not be representative but conceding that the effects of nanomaterial conjugation are harder to predict than researchers had expected","By denying that the circumstance described in Text 1 is likely to occur but acknowledging that many aspects of nanomaterial conjugation are still poorly understood","By agreeing that the possibility described in Text 1 is a cause for concern but pointing out that nanomaterial conjugation does not inevitably produce that result"],"a":3,"r":"Choice D is the best answer. The author of Text 2 acknowledges that nanohybrids may be more toxic than their constituent parts, but also provides an example of a nanohybrid that has reduced toxicity compared to its components: silicon dioxide and zinc oxide together have all the benefits of zinc oxide nanoparticles without any of the DNA harm zinc oxide has on its own. Choice A is incorrect. While the author of Text 2 gives an example of a nanohybrid that isn’t as toxic as its constituent parts, they don’t argue that the benefit outweighs the risk. They merely argue that “the effects of nanomaterial conjugation vary by case.” Choice B is incorrect. The author of Text 2 states that the effects of nanomaterial conjugation “vary by case,” and that the attention that their potential toxicity has drawn is warranted. If the situation in Text 1 weren’t representative, then there would be less attention to the potential danger of these materials. Furthermore, neither passage suggests that researchers had expected that they could predict the effects of nanomaterial conjugation. Choice C is incorrect. The author of Text 2 agrees that the potential toxicity of nanohybrids “has drawn deserved attention,” so they aren’t denying the problem."},{"i":"659c6c1d","c":"main","d":"M","s":"The following text is adapted from Robert Louis Stevenson’s 1883 novel Treasure Island. Bill is a sailor staying at the Admiral Benbow, an inn run by the narrator’s parents. Every day when [Bill] came back from his stroll he would ask if any seafaring men had gone by along the road. At first we thought it was the want of company of his own kind that made him ask this question, but at last we began to see he was desirous to avoid them. When a seaman did [stay] at the Admiral Benbow (as now and then some did) he would look in at him through the curtained door before he entered the parlour; and he was always sure to be as silent as a mouse when any such was present.\n\nAccording to the text, why does Bill regularly ask about “seafaring men”?","o":["He’s hoping to find an old friend and fellow sailor.","He’s trying to secure a job as part of the crew on a new ship.","He isn’t sure that other guests at the inn will be welcoming of sailors.","He doesn’t want to encounter any other sailor unexpectedly."],"a":3,"r":"Choice D is the best answer. The narrator says that, at first, they thought Bill asked regularly about other seafarers because he wanted their company, but eventually they realized that Bill actually wanted to avoid them. Choice A is incorrect. This isn’t the reason the text gives for why Bill regularly asks about “seafaring men.” The narrator says that, at first, they thought Bill asked regularly about other seafarers because he wanted their company, but eventually they realized that Bill wanted to avoid them. Choice B is incorrect. This isn’t the reason the text gives for why Bill regularly asks about “seafaring men.” The narrator says that, at first, they thought Bill asked regularly about other seafarers because he wanted their company, but eventually they realized that Bill wanted to avoid them. Choice C is incorrect. This isn’t the reason the text gives for why Bill regularly asks about “seafaring men.” The narrator says that, at first, they thought Bill asked regularly about other seafarers because he wanted their company, but eventually they realized that Bill wanted to avoid them."},{"i":"ee41d7e0","c":"main","d":"E","s":"Arthropods—brine shrimp, hawk moths, and many other invertebrate animals—have a nervous system made up of a brain, nerve cord, and other nerves. Researchers have gained insights about this system in ancient arthropods from traces found in various fossils. For example, in a study of two fossils of the extinct arthropod species Mollisonia symmetrica, Javier Ortega-Hernández, James Weaver, and team observed clear signs of a nerve cord. They also saw possible indications of a synganglion, a brain-like mass of nerves. Researchers hope to identify more features of the nervous systems of prehistoric arthropods as additional fossils are found.\n\nWhich choice best states the main idea of the text?","o":["There are several similarities between the brains of hawk moths and the brains of brine shrimp.","Fossil evidence can contribute to the understanding of the nervous system in ancient arthropods.","Newly discovered fossils suggest that ancient hawk moths and ancient brine shrimp had spines.","Researchers need to focus on finding more fossils of ancient arthropods."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The text states that researchers have used fossils to learn about the nervous systems of ancient arthropods. It then provides a specific example of researchers studying fossils of Mollisonia symmetrica and finding evidence of a nerve cord and possibly a synganglion (a brain-like mass of nerves). The text concludes by noting that researchers hope to discover more features of prehistoric arthropods’ nervous systems \"as additional fossils are found.\" Thus, the main idea of the text is that fossil evidence can contribute to the understanding of the nervous system in ancient arthropods. Choice A is incorrect because the text doesn’t compare the brains of hawk moths and brine shrimp. These animals are merely mentioned as examples of arthropods in the opening sentence, and the text doesn’t go on to discuss any similarities between their brains. Choice C is incorrect because the text discusses nervous systems, not spines, in ancient arthropods, and it doesn’t specifically mention findings about ancient hawk moths or brine shrimp. Choice D is incorrect. While the text concludes by noting that researchers aim to discover additional characteristics of prehistoric arthropods’ nervous systems as more fossils are uncovered, this statement doesn’t suggest that researchers need to focus on finding more fossils. Rather, it simply indicates that researchers expect to learn more about this topic as additional fossils are discovered. Moreover, the statement is just a detail that supports the main idea; it’s not the main idea itself."},{"i":"9077be25","c":"infer","d":"E","s":"Alice Guy-Blaché directed hundreds of films between 1896 and 1920. She wanted audiences to feel like they were watching real people on screen. She would encourage actors in her films to behave naturally. Guy-Blaché even hung a large sign reading “Be Natural” in the studio where she made her films. At the time, films lacked sound, so actors needed to rely solely on their bodies and facial expressions to convey emotions. As a result, actors tended to highly exaggerate their actions and expressions. The style of acting in Guy-Blaché’s films was therefore ______ Which choice most logically completes the text?","o":["copied by many of Guy-Blaché’s peers.","familiar to actors who had worked on other directors’ films.","very unusual for the period.","better than film acting today."],"a":2,"r":"Choice C is the best answer. The text tells us that “actors tended to highly exaggerate their actions and expressions” in films produced from 1896 to 1920. This suggests that the natural style of acting in Guy-Blaché’s films was very unusual for the time. Choice A is incorrect. The text never discusses any other directors copying the style of acting found in Guy-Blaché’s films, and in fact suggests the opposite—that it was unusual for directors to suggest this style of acting at the time. Choice B is incorrect. The text never discusses actors’ familiarity with the style of acting found in Guy-Blaché’s films, so there isn’t much basis for this inference. But since the text tells us that other films of the period used a highly exaggerated form of acting, we might predict that the natural style in Guy-Blachés films would have been unfamiliar to these actors. Choice D is incorrect. The text never discusses film acting today, so there’s no basis for this inference."},{"i":"787729be","c":"infer","d":"E","s":"Martin Dančák, Wewin Tjiasmanto, and colleagues have identified a new carnivorous plant species (Nepenthes pudica) in Indonesia. Like other carnivorous plants, N. pudica has pitfall traps, or pitchers, that capture prey, but unlike others, the pitchers of N. pudica are located underground. The researchers unearthed the new species on fairly dry ridges with surfaces that host few other plants and animals. Therefore, the researchers hypothesize that the N. pudica species likely ______ Which choice most logically completes the text?","o":["represents one of many undiscovered carnivorous plant species in the region.","formed pitchers early in development to absorb more moisture.","is buried by nearby animals as they forage along the ridges for food.","evolved to have underground traps to access more prey than would surface traps."],"a":3,"r":"Choice D is the best answer. The text says that N.pudica’s prey-catching pitchers are underground. It also says that the ridges where N. pudica lives don’t have many plants and animals on the surface. This suggests that N. pudica evolved underground pitchers in order to catch more prey. Choice A is incorrect. This inference isn’t supported. The text never mentions the possibility of other undiscovered carnivorous plant species in Indonesia, so there’s no basis to make this inference. Choice B is incorrect. This inference isn’t supported. The text does say that the ridges where N. pudica lives are dry, but it also says that the purpose of carnivorous plant pitchers is to capture prey. It never suggests that these pitchers also absorb moisture, so there’s no basis to make this inference. Choice C is incorrect. This inference isn’t supported. The text never suggests that N. pudica’s underground pitcher can catch animals on the surface, so there’s no basis to make this inference."},{"i":"98fd50f2","c":"claim","d":"M","s":"Among the most visited art museums in the world, the Galleria dell’Accademia in Florence had approximately 1.7 million visitors in 2019. The Galleria dell’Accademia also offers virtual tours that art lovers can view online for free. Although there were initial concerns that people who viewed the virtual tours would then consider an in-person visit unnecessary, museum administrators claim that their surveys of in-person visitors show that those concerns were unjustified.\n\nWhich statement, if true, would most directly support the administrators’ claim?","o":["Many surveyed visitors to the Galleria dell’Accademia indicated that the virtual tours convinced them to plan an in-person visit.","Most surveyed visitors to the Galleria dell’Accademia indicated that they were unaware of the virtual tours before their first in-person visit.","Most surveyed visitors to the Galleria dell’Accademia indicated that they lived somewhere other than Florence.","Many surveyed visitors to the Galleria dell’Accademia indicated that they would likely view the virtual tours in order to reminisce about their in- person visit."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would most directly support the museum administrators’ claim that concerns about virtual tours replacing in-person visits were unjustified. The text explains that after the Galleria dell’Accademia began offering online tours, there were concerns that if people viewed these virtual tours, they would consider an in-person visit to be unnecessary. The finding that many visitors who were surveyed indicated that the virtual tours actually convinced them to plan an in-person visit directly contradicts these concerns. Rather than deterring in-person visits, virtual tours actively encouraged them, providing strong support for the administrators’ claim that the initial concerns were unfounded. Choice B is incorrect. The finding that most surveyed visitors were unaware of the virtual tours before their first in-person visit wouldn’t directly address whether virtual tours affect decisions about in-person visits. This finding would only indicate that these particular visitors didn’t have the opportunity to be influenced by virtual tours when making their decision to visit. Choice C is incorrect because the geographic location of visitors wouldn’t address the impact of virtual tours on people’s decisions to visit the museum in person. Whether visitors live in Florence or elsewhere would suggest nothing about whether virtual tours influenced their choice. This information is irrelevant to the administrators’ claim about the relationship between virtual tours and in-person visits. Choice D is incorrect because visitors’ intentions to view virtual tours after their in-person visit wouldn’t address the initial concerns that virtual tours might make in-person visits seem unnecessary. This finding indicates that some visitors plan to use virtual tours as a way to remember their visit, but it provides no information about whether virtual tours influenced their decision to visit in person in the first place, which is what the administrators’ claim addresses."},{"i":"c2c61e7d","c":"claim","d":"H","s":"Researchers hypothesized that a decline in the population of dusky sharks near the mid-Atlantic coast of North America led to a decline in the population of eastern oysters in the region. Dusky sharks do not typically consume eastern oysters but do consume cownose rays, which are the main predators of the oysters.\n\nWhich finding, if true, would most directly support the researchers’ hypothesis?","o":["Declines in the regional abundance of dusky sharks’ prey other than cownose rays are associated with regional declines in dusky shark abundance.","Eastern oyster abundance tends to be greater in areas with both dusky sharks and cownose rays than in areas with only dusky sharks.","Consumption of eastern oysters by cownose rays in the region substantially increased before the regional decline in dusky shark abundance began.","Cownose rays have increased in regional abundance as dusky sharks have decreased in regional abundance."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would most directly support the researchers’ hypothesis about the connection between the dusky shark population decline and the eastern oyster population decline. The text indicates that although dusky sharks don’t usually eat eastern oysters, they do consume cownose rays, which are the main predators of eastern oysters. An increase in the abundance of cownose rays in the region in response to a decline in the abundance of dusky sharks would directly support the researchers’ hypothesis: a higher number of cownose rays would consume more eastern oysters, driving down the oyster population. Choice A is incorrect because a finding that there’s an association between a decline in the regional abundance of some of dusky sharks’ prey and the regional abundance of dusky sharks wouldn’t directly support the researchers’ hypothesis that a decline in dusky sharks has led to a decline in eastern oysters in the region. Although such a finding might help explain why shark abundance has declined, it would reveal nothing about whether the shark decline is related to the oyster decline. Choice B is incorrect because a finding that eastern oyster abundance tends to be greater when dusky sharks and cownose rays are present than when only dusky sharks are present wouldn’t support the researchers’ hypothesis that a decline in dusky sharks has led to a decline in eastern oysters in the region. The text indicates that the sharks prey on the rays, which are the main predators of the oysters; if oyster abundance is found to be greater when rays are present than when rays are absent, that would suggest that rays aren’t keeping oyster abundance down, and thus that a decline in rays’ predators, which would be expected to lead to an increase in the abundance of rays, wouldn’t bring about a decline in oyster abundance as the researchers hypothesize. Choice C is incorrect because a finding that consumption of eastern oysters by cownose rays increased substantially before dusky sharks declined in regional abundance wouldn’t support the researchers’ hypothesis that the decline in dusky sharks has led to a decline in eastern oysters in the region. Such a finding would suggest that some factor other than shark abundance led to an increase in rays’ consumption of oysters and thus to a decrease in oyster abundance, thereby weakening the researchers’ hypothesis."},{"i":"0b634641","c":"graph","d":"E","s":"","o":["There were about as many drawings with an example of an insect as there were with an example of a bird.","The fewest number of drawings contained an example of a bird.","More of the drawings had an example of an insect than an example of a mammal.","More of the drawings had an example of a mammal than either an example of a bird or an example of an insect."],"a":3,"r":"Choice D is the best answer because it accurately describes data from the graph that support the researchers’ conclusion that children may be more aware of mammals than of other animals. The graph presents the percent of drawings by schoolchildren that contained an example of an animal from a certain group (mammals, birds, or insects). The graph shows that approximately 80% of the drawings contained an example of a mammal, while only approximately 69% contained an example of a bird and only about 55% contained an example of an insect. The fact that mammals were included in more drawings than either birds or insects were supports the idea that children may be particularly aware of mammals in their environments. Choice A is incorrect because the graph shows that there were not \"about as many\" drawings with insects as there were drawings with birds (approximately 69% of the drawings included an example of a bird, while only about 55% included an example of an insect). Further, comparing only the numbers for birds and insects wouldn’t indicate anything about the schoolchildren’s awareness of mammals. Choice B is incorrect because the graph shows that insects, not birds, were the group that appeared in the fewest number of drawings (approximately 69% of the drawings included an example of a bird but only about 55% included an example of an insect). Further, stating that examples from one nonmammal group appeared in the fewest number of drawings would provide no evidence about the schoolchildren’s awareness of mammals. Choice C is incorrect because the graph shows that more drawings had an example of a mammal than an example of an insect, not the other way around (approximately 80% of the drawings included an example of a mammal, while only about 55% included an example of an insect). Further, examples of a nonmammal group appearing in more drawings than examples of mammals did would actually weaken the claim that schoolchildren may be more aware of mammals than of other animals."},{"i":"eb775f90","c":"graph","d":"E","s":"","o":["the number of cars produced increased but the number of companies producing cars decreased.","both the number of cars produced and the number of companies producing cars remained unchanged.","the number of cars produced decreased but the number of companies producing cars remained unchanged.","both the number of cars produced and the number of companies producing cars increased."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the statement about the US auto industry in the early twentieth century. The table shows the number of cars produced annually and number of companies producing cars in the United States between 1910 and 1925 in increments of five years. According to the table, the number of cars produced consistently increased from one increment to the next, going from 123,990 cars in 1910 to 3,185,881 cars in 1925. At the same time, the table shows that the number of companies producing cars consistently decreased, going from 320 companies in 1910 to only 80 companies in 1925. Thus, the table shows that the number of cars produced increased from 1910 to 1925, even as the number of companies producing cars decreased. Choice B is incorrect. The table shows that the number of cars produced in the US increased, going from 123,990 in 1910 to 3,185,881 in 1925, instead of remaining unchanged, and the table also shows that the number of companies producing cars decreased from 320 to 80 instead of remaining unchanged. Choice C is incorrect because the table indicates that the number of cars produced consistently increased from 1910 to 1925, going from 123,990 cars to 3,185,881 cars, instead of decreasing; moreover, the table shows that the number of companies producing cars from 1910 to 1925 declined from 320 to 80 instead of remaining unchanged. Choice D is incorrect because the table indicates that the number of companies producing cars consistently decreased from 1910 to 1925, going from 320 companies to only 80 companies."},{"i":"67614549","c":"fss","d":"M","s":"After winning the 1860 presidential election, Abraham Lincoln appointed Edward Bates, Salmon P . Chase, and William H. Seward to his cabinet. Lincoln’s decision was surprising, since each of these men had run against him, but historians have praised it, noting that Lincoln ______ his rivals’ diverse talents to strengthen his administration.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has leveraged","is leveraging","will leverage","leveraged"],"a":3,"r":"Choice D is the best answer. The subject of the verb is “Lincoln,” and the first sentence tells us that we’re talking about something that Abraham Lincoln did in 1860. So the simple past tense “leveraged” fits the logic of the text. Choice A is incorrect. This choice creates a tense issue. “Has leveraged” is the present perfect tense, which is used for an action that began in the past and continues into the present. Lincoln started leveraging his rivals’ talents in 1860—it’s definitely not still happening today. So the present perfect tense isn’t appropriate. Choice B is incorrect. This choice creates a tense issue. “Is leveraging” is the present tense, but Lincoln leveraged his rivals’ talents in 1860, so the present tense isn’t appropriate. Choice C is incorrect. This choice creates a tense issue. “Will leverage” is the future tense, but Lincoln leveraged his rivals’ talents in 1860, so the future tense isn’t appropriate."},{"i":"81ac953e","c":"fss","d":"E","s":"In 1899, Swedish chemist Svante Arrhenius developed an equation to answer a long-standing question: why do chemical reactions speed up at higher temperatures? The Arrhenius equation, named for its creator, ______ an important concept in modern chemistry.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have remained","remain","remains","are remaining"],"a":2,"r":"Choice C is the best answer. This choice uses the singular verb \"remains\" to match the singular subject \"equation.\" Choice A is incorrect. The singular noun \"equation\" doesn’t match with the plural verb conjugation \"have remained.\" Choice B is incorrect. The singular noun \"equation\" doesn’t match with the plural verb conjugation \"remain.\" Choice D is incorrect. The singular noun \"equation\" doesn’t match with the plural verb conjugation \"are remaining.\""},{"i":"d47bb0a4","c":"fss","d":"E","s":"Objects ranging from the Kikkoman soy sauce bottle to the Yamaha VMAX motorcycle to the Komachi bullet train ______ designed by twentieth- century industrial designer Kenji Ekuan.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["was","is","has been","were"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The plural verb \"were\" agrees in number with the plural subject \"objects.\" Choice A is incorrect because the singular verb \"was\" doesn’t agree in number with the plural subject \"objects.\" Choice B is incorrect because the singular verb \"is\" doesn’t agree in number with the plural subject \"objects.\" Choice C is incorrect because the singular verb \"has been\" doesn’t agree in number with the plural subject \"objects.\""},{"i":"d198997b","c":"bound","d":"M","s":"Cy Twombly, a US painter and sculptor, created many large-scale abstract works, such as his 10-painting series Fifty Days at Iliam. In these works, Twombly’s artistic style is exemplified by his use of graffiti-like ______ often incorporate words or phrases from poetry and mythology.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["scribbles: that","scribbles that","scribbles; that","scribbles. That"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use and punctuation of a relative clause. This choice correctly uses the relative pronoun “that” and no punctuation to create an integrated relative clause that provides essential information about the noun phrase (“graffiti-like scribbles”) that it modifies. Choice A is incorrect because no punctuation is needed between the integrated relative clause beginning with “that often” and the noun phrase that it modifies (“graffiti-like scribbles”). Choice C is incorrect because no punctuation is needed between the integrated relative clause beginning with “that often” and the noun phrase that it modifies (“graffiti-like scribbles”). Choice D is incorrect because no punctuation is needed between the integrated relative clause beginning with “that often” and the noun phrase that it modifies (“graffiti-like scribbles”)."},{"i":"89ab0d46","c":"bound","d":"E","s":"After the printing press was introduced in 1440, handwritten manuscripts from Europe’s medieval period were often destroyed and the paper used for other purposes. In one instance, pages ______ a collection of Norse tales dating to 1270 were discovered lining a bishop’s miter (hat).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["from:","from,","from","from—"],"a":2,"r":"Choice C is the best answer. The word “from” introduces a prepositional phrase that modifies the noun “pages” and provides essential information about their origin. No additional punctuation is needed after “from” in this context. Choice A is incorrect. This choice results in a punctuation error, illogically separating the preposition “from” from the rest of the prepositional phrase with a colon. Also, a colon can only follow an independent clause, but what comes before the blank could not stand on its own as a complete sentence. Choice B is incorrect. This choice results in a punctuation error, illogically separating the preposition “from” from the rest of the prepositional phrase with a comma. Choice D is incorrect. This choice results in a punctuation error, illogically separating the preposition “from” from the rest of the prepositional phrase with a dash."},{"i":"6c9df5d1","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Some powerful works of literature have so influenced readers that new legislation has been passed as a result. The Interesting Narrative of the Life of Olaudah Equiano (1789) is the autobiography of a man who endured slavery on both sides of the Atlantic. Equiano’s book contributed to the passage of the Slave Trade Act of 1807. The Jungle (1906) is a fictional work by Upton Sinclair that describes unsanitary conditions in US meatpacking plants. Sinclair’s book contributed to the passage of the Pure Food and Drug Act in 1906. The student wants to emphasize a difference between the two books.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Although both are powerful works of literature that contributed to new legislation, Equiano’s book is an autobiography, while Sinclair’s is fictional.","They may have written about different topics, but Equiano and Sinclair both influenced readers.","The 1807 Slave Trade Act resulted in part from a book by Equiano, while the 1906 Pure Food and Drug Act resulted in part from a book by Sinclair.","The Interesting Narrative of the Life of Olaudah Equiano and The Jungle are two works of literature that contributed to new legislation (concerning the slave trade and food safety, respectively)."],"a":0,"r":"Choice A is the best answer. This choice emphasizes a difference between the two books by using relevant information from the notes to contrast their genres. Choice B is incorrect. This choice mentions a difference between the books (their different topics), but it emphasizes a similarity between the books (their influence on readers). Choice C is incorrect. This choice provides information about the books that reflects both a similarity (both resulted in new laws) and a difference (the specific laws that resulted), without emphasizing either. Choice D is incorrect. This choice doesn’t emphasize a difference between the two books. Instead, it emphasizes a similarity."},{"i":"e8494245","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Political scientist Graham Allison is known for his Thucydides trap theory. Allison’s theory states that whenever “a rising power is threatening to displace a ruling power,” conflict is likely. The theory is based on Thucydides’s explanation of the conflict between Athens and Sparta. Thucydides wrote that “the rise of Athens and the fear this instilled in Sparta” made conflict “inevitable.” History professor Edmund Stewart recently challenged the historical basis of the theory. Stewart claimed that Athens was not a rising power and that the rivals experienced a “clash of cultures” instead. The student wants to use a quotation to challenge Thucydides’s explanation of the conflict between Athens and Sparta.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["According to Allison’s Thucydides trap theory, whenever “a rising power is threatening to displace a ruling power,” conflict is likely.","Thucydides wrote that conflict between the two powers was “inevitable,” although Stewart later challenged the historical basis of this claim.","According to Stewart, a “clash of cultures” between Athens and Sparta caused the conflict, not Athens’s rise.","Thucydides explained that conflict was caused by “the rise of Athens and the fear this instilled in Sparta,” but Allison disagreed, seeing the conflict as an example of the Thucydides trap."],"a":2,"r":"Choice C is the best answer. Using a quotation from Stewart, the sentence challenges Thucydides’s explanation that the rise of Athens caused the conflict, suggesting that it was instead caused by a \"clash of cultures.\" Choice A is incorrect. While the sentence uses a quotation, the quotation doesn’t challenge Thucydides’s explanation of the conflict. Choice B is incorrect. While the sentence mentions that Stewart challenged Thucydides’s explanation of the conflict, it doesn’t use a quotation to challenge Thucydides’s explanation: the quoted word \"inevitable\" is from Thucydides. Choice D is incorrect. While the sentence appears to refute Thucydides’s explanation, it does so in a way that misrepresents the information in the notes; Allison’s Thucydides trap theory is based on Thucydides’s explanation of the conflict. Thus, Allison’s theory affirms, rather than challenges, Thucydides’s explanation."},{"i":"d3725911","c":"trans","d":"E","s":"In the search for extraterrestrial life, astrobiologists Stuart Bartlett and Michael L. Wong propose that scientists avoid using the term “life.” ______ researchers should use another word: “lyfe.”This new term, they argue, could be used to draw distinctions between the known characteristics of life on Earth and the potentially differing characteristics of lyfe on other planets.\n\nWhich choice completes the text with the most logical transition?","o":["Previously,","Regardless,","There,","Instead,"],"a":3,"r":"Choice D is the best answer. \"Instead\" logically signals that the idea in this sentence—that researchers should use the word \"lyfe\"—is an alternative to the idea mentioned in the previous sentence (scientists’ use of the word \"life\"). Choice A is incorrect because \"previously\" illogically signals that the idea in this sentence occurs before the action in the first sentence. Instead, the use of \"lyfe\" is an alternative to the previously mentioned use of \"life.\" Choice B is incorrect because \"regardless\" illogically signals that the idea in this sentence is true despite the information in the first sentence. Instead, the use of \"lyfe\" is an alternative to the previously mentioned use of \"life.\" Choice C is incorrect because \"there\" illogically signals that the idea in this sentence occurs in a place mentioned in the previous sentence. Instead, the use of \"lyfe\" is an alternative to the previously mentioned use of \"life.\""},{"i":"5e93039f","c":"trans","d":"M","s":"Roughly once an hour, a torrent of boiling water shoots up 100 feet or more from Yellowstone’s Old Faithful geyser before plunging back to the surface—a cycle seemingly inhospitable to life. ______ as microbiologist Eric Boyd attests, “the geyser is…almost like a cradle for biodiversity,” home to numerous bacteria species that thrive in its sulfurous waters.\n\nWhich choice completes the text with the most logical transition?","o":["Thus,","Specifically,","Still,","In other words,"],"a":2,"r":"Choice C is the best answer. \"Still\" logically signals that the information in this sentence about Old Faithful’s thriving bacteria species is true despite the previous claim that conditions at the geyser seem as if they would be inhospitable to life. Choice A is incorrect because \"thus\" illogically signals that the information in this sentence is a result or consequence of the previous claim about Old Faithful’s seemingly inhospitable conditions. Instead, this information about the geyser’s many thriving bacteria species is true despite the previous claim. Choice B is incorrect because \"specifically\" illogically signals that the information in this sentence provides specific, precise details elaborating on the previous claim about Old Faithful’s seemingly inhospitable conditions. Instead, this information about the geyser’s many thriving bacteria species is true despite the previous claim. Choice D is incorrect because \"in other words\" illogically signals that the information in this sentence serves as a paraphrase or restatement of the previous claim about Old Faithful’s seemingly inhospitable conditions. Instead, this information about the geyser’s many thriving bacteria species is true despite the previous claim."}],"img":{"0b634641":"iVBORw0KGgoAAAANSUhEUgAAArwAAAHuBAMAAACPOsIRAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA0zklEQVR42u2dd2BT1dvHv+cm6W5z0rJHe0sB2QTKUlZkqagYpqggBUGWaBEFFPVXVBQRfAsqyBALKFAQKVOWUjYoI5Ulo5ACAgJtTgot0KY57x9tsbkpNEBD1/n80+bm5I7vfe5znuesCwgEAoFAIBAIBAKBQCAQCASC0gG55xYqBHKFUJqvVAQgePpjkBqUZH+fXUgvFLsfVPuWR+py9aU5Fhqe/YHsfRs+mzZFAITklCCrctUX1uuSvOdbHHEy3E+z/1HHA35vP3U8rzeQhaz3Ja8JS8gbR8jgeRi5j/bbhT6j1nhcWw1UPqlvfTUCfga8quu1STVvl0eEZ7QmcrrmpX1UvfnniO/3CPFckveY16qGoVt6eu1q6rGjuuHNHm9Ku3XQ7dUc9tgB+Bng32FLT8n4fMU4X6vPxIQqR6rGPNdko3dUx2Jw9lJxl5dXeP9kzVX2AT4rguYerLDSLzLgl/nBFgvSLmfusScCoLAH+66wr07ylbvtoFtp6tR/5ZBDq0jYb0JeF6KvctWMQS3fsp5FYDxIi7dNdhACQDIjAXL2NSQlQz0zQnu43U+6JBYAO9327nO3bs0Q8rog77ERSJk8awHAKGWxM6O14LAQANCCAQC6x1tR54+PQtKzdjyZBDCC0x3m2od6UyFvwc4BFMlvmSxaJEeyrBcOwQqircGRGY7nQAGOcp8TIHB+T/N6u2UkwCgQFLuS2D8R1uuC9TKGf9uc0hPc9D9x0++0noBj6Q74xx7YRBig+35PP07x5+nqzHLGlsEBxkHev9ryz9lMBAYFowcghQKAKhRSDYCAEhmQmmSnbjodACCcZMe+FAAWkyqRYbLQrmBonqYE4mL7A/lV1zaiWKQXpFTek1cahrwkLNN9dBSpsUAgEAgEghIXekqlRaq7RmKEiiDNRWULFEoo6fJz9fSgPMISoDMAeMnOJTsPGZRt1pTcuQnf/if1hwnCOTjTNeLpbCk51DLhOVt5qHPJoc2aZH/NOAdAGQA9chqDoercWNiq832/CED1GqSgHmg9htZ6Ejqi60QJDSynh6pTOKDqBZ3UAcASIJBKupodiKTuoOoOuZYe61CuBwBVD1TcWYQeQ11c5dVsIhyzdFmxn5VLadf1+3dDz/aduuRG2nBjVdq21bgaXaug1Yttx80KCo6BFvBufjXtiQ7
