<script>
const D={"t":"Practicetest60","q":[{"i":"6e3fdd1a","c":"vocab","d":"E","s":"During film’s early years, those who worked in the industry had a vested interest in convincing the public to embrace the new medium. As Sumiko Higashi argues, some filmmakers relied on film critics to influence the public’s ______ the world of cinema. Critics who drew similarities between film and traditional art forms, like drama, could help legitimize film as an art form.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["reproduction of","contribution to","application to","perception of"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the early years of film. In this context, “perception of” means understanding of or view of. The text states that people in the film industry had a personal stake (“a vested interest”) in getting the public to embrace film when the medium was new and indicates that some film critics helped legitimize film as an art form—that is, that they helped to make film something people accepted as a type of art. This context conveys that it was the critics’ ability to influence the public’s view of the world of cinema that some early filmmakers relied on. Choice A is incorrect because in this context, “reproduction of” would refer to a copy of something or the act of copying something, and it wouldn’t make sense to describe the general public as reproducing the world of cinema, or copying film as an entire art form. Choice B is incorrect. In this context, “contribution to” would refer to playing a significant part in causing something to happen. Although the text indicates that people in the early film industry had reasons to want the public to embrace film, it wouldn’t make sense to suggest that filmmakers relied on film critics to influence how the public contributed to the world of cinema; the text focuses on the public’s view of film once the world of cinema existed (embracing it, regarding it as legitimate art) and doesn’t suggest the general public was responsible for the medium’s existence. Choice C is incorrect because in this context, “application to” would refer to putting something to direct use, and it wouldn’t make sense to say that the general public needed to be used in a practical way in the world of cinema. The text focuses on the importance of the public’s view of film when the medium was new but not on the idea that the public needed to be directly involved in film."},{"i":"d5ad34f0","c":"vocab","d":"H","s":"The results of randomized clinical trials testing the efficacy of common medical interventions sometimes fail to ______ conclusions that practitioners reach based on their real-world observations of patients. While there are several possible reasons for this, one is that practitioners may overlook confounding variables that account for the results they attribute to the interventions in question.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["circumvent","corroborate","disseminate","implement"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of a relationship between the results of randomized clinical tests of how effective common medical interventions are and the conclusions practitioners reach about such interventions in real-world settings. In this context, \"corroborate\" means confirm or support with evidence. The text indicates that one possible explanation for the relationship being discussed is that practitioners may overlook confounding variables—that is, additional factors other than the medical interventions being investigated that affect the observed outcomes. This means that practitioners may assume that an outcome is the direct result of a medical intervention when it is actually the result of a combination of factors. Clinical trials take steps to rule out factors other than the one being studied, so if those extra factors are actually having an effect on real-world outcomes, the trials are likely to produce conclusions different from those practitioners reach in their real-world observations. In other words, clinical trials may fail to corroborate practitioners’ conclusions. Choice A is incorrect because it wouldn’t make sense to say that the results of clinical trials could \"circumvent,\" or find a way around or bypass, conclusions practitioners reach in real-world scenarios with patients; it’s possible that researchers conducting the trials might avoid engaging with practitioners’ conclusions, but findings from a study can’t choose to get around something. Choice C is incorrect because it wouldn’t make sense to say that the results of clinical trials could \"disseminate,\" or spread widely, conclusions practitioners reach in real-world scenarios with patients; the researchers conducting the trials might choose to draw attention to practitioners’ conclusions, but findings from a study can’t spread anything. Choice D is incorrect because it wouldn’t make sense to say that the results of clinical trials could \"implement,\" or put into effect, conclusions practitioners reach in real-world scenarios with patients; the researchers conducting the trials might consider practitioners’ conclusions, but findings from a study can’t put anything into effect."},{"i":"a0777403","c":"vocab","d":"E","s":"The following text is from Anita Desai’s 2011 novella Translator Translated. While working on her translation of a novel written in Odia (a language of India) into English, the narrator looks out her window at night to clear her mind. I tried to distract myself with these sights of the ordinary world, but in my mind it was the lines I had been translating and the lines that I had been writing that remained in the forefront. I longed for sleep to obliterate them but it eluded me. Perhaps everything would be normal again once I had sent off the manuscript, I thought, and looked forward to completing the work. ©2011 by Anita Desai As used in the text, what does the word “completing” most nearly mean?","o":["Destroying","Finishing","Advertising","Rejecting"],"a":1,"r":"Choice B is the best answer because as used in the text, \"completing\" most nearly means finishing. In the text, the narrator conveys that the task of translating a novel has been an all-consuming one and that she hopes things will \"be normal again\" once she has \"sent off the manuscript.\" In other words, the narrator is looking forward to finishing her work on the manuscript and returning to other things. Choice A is incorrect because in this context, \"completing\" doesn’t mean destroying, or ruining. The narrator addresses her desire to send off the manuscript she’s focused on and her hope that things will be \"normal again\" once she does, conveying that she is looking forward to finishing the work, not to ruining it. Choice C is incorrect because in this context, \"completing\" doesn’t mean advertising, or publicly promoting. The narrator addresses her complete focus on the translation and her hope that things will be \"normal again\" once she has \"sent off the manuscript,\" conveying that she is looking forward to finishing the task, not to promoting the resulting manuscript. Choice D is incorrect because in this context, \"completing\" doesn’t mean rejecting, or refusing or repelling. The narrator makes it clear that she is absorbed in working on the translation and plans to send off the manuscript, suggesting that instead of refusing to do the work, she is continuing to do it (even if she looks forward to things being \"normal again\" when she’s done)."},{"i":"79dec1e1","c":"vocab","d":"E","s":"Art scholars have noted that some colors seem to be more ______ viewers than others. For example, people tend to find paintings featuring blues and greens more appealing than paintings featuring yellows and oranges.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["confusing for","attractive to","corrected by","similar to"],"a":1,"r":"Choice B is the best answer because it best completes the text’s discussion of how viewers respond to colors. The text presents something art scholars have noted and gives the example of people tending to find paintings with blues and greens more appealing than those with yellows and oranges. This context conveys that certain colors are more \"attractive to\" viewers than other colors are. Choice A is incorrect because the text indicates only that people tend to find some colors more appealing than others and gives no indication that certain colors are ever \"confusing for,\" or puzzling to, viewers. Choice C is incorrect because the text discusses the relative appeal of certain colors in paintings but gives no indication that any colors would ever be \"corrected by\" viewers, or somehow fixed or improved by them. Choice D is incorrect because it wouldn’t make much sense to say that some colors are more \"similar to\" viewers than others, which would suggest that colors and viewers are alike to different degrees. Further, the text primarily emphasizes a difference, not a similarity, in how appealing paintings tend to be based on the colors they contain."},{"i":"a086c2cb","c":"purpose","d":"E","s":"Built in the 1970s, Raccoon Mountain is a pumped-storage hydropower facility (a “water-battery”) located in the United States along the Tennessee River. When energy demand is low, excess power from the regional electric utility’s nuclear plants is used to pump water (from a lower reservoir filled from the Tennessee River) up a shaft to the summit lake, where the water is stored as gravitational potential energy. When energy demand peaks, the water drains down from the summit lake, spinning turbines and generating upward of 1,700 megawatts of power— enough to power one million homes for twenty hours.\n\nWhich choice best states the main purpose of the text?","o":["To point out the differences between two methods of energy generation","To explain the basics of how a specific energy technology works","To encourage regional electric utilities to build energy storage facilities","To discuss the benefits of a new energy technology"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text, which is to explain the basics of how a specific energy technology works. The text introduces Raccoon Mountain as a pumped-storage hydropower facility built in the 1970s and then explains how it operates: during periods of low demand, excess power pumps water up to a lake at the mountain’s summit, and when demand for energy peaks, the water flows back down, spinning turbines along the way to generate electricity. The text provides some additional details, like the name of the water source, but the overall focus is on explaining the basics of how pumped-storage hydropower works. Choice A is incorrect because the text focuses on one method of energy generation—pumped-water hydropower—and briefly mentions another type of energy generation (nuclear plants) only to identify it as a source of power for the pumping process. The text never makes any comparison between the two methods. Choice C is incorrect because the text simply gives a factual description of how Raccoon Mountain, a pumped- storage hydropower facility, operates; it never suggests that more energy storage facilities should be built, whether by regional utilities or by any other entity. Choice D is incorrect because the text doesn’t present pumped-storage hydropower as a new technology; it indicates that Raccoon Mountain was built in the 1970s, meaning that, rather than being new, this facility is approximately 50 years old."},{"i":"19688783","c":"purpose","d":"M","s":"The following text is from Lucy Maud Montgomery’s 1908 novel Anne of Green Gables. Anne, an eleven-year-old girl, has come to live on a farm with a woman named Marilla in Nova Scotia, Canada. Anne reveled in the world of color about her. “Oh, Marilla,” she exclaimed one Saturday morning, coming dancing in with her arms full of gorgeous boughs, “I’m so glad I live in a world where there are Octobers. It would be terrible if we just skipped from September to November, wouldn’t it? Look at these maple branches. Don’t they give you a thrill—several thrills? I’m going to decorate my room with them.” “Messy things,” said Marilla, whose aesthetic sense was not noticeably developed. “You clutter up your room entirely too much with out-of-doors stuff, Anne. Bedrooms were made to sleep in.”\n\nWhich choice best states the main purpose of the text?","o":["To demonstrate that Anne has a newly developed appreciation of nature","To describe an argument that Anne and Marilla often have","To emphasize Marilla’s disapproval of how Anne has decorated her room","To show that Anne and Marilla have very different personalities"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text. The text begins by noting that Anne “reveled in the world of color about her”—that is, she takes great delight in colorful things. It then relates a scene when she enthusiastically enters the house with autumn foliage and announces that she will decorate her room with it. The focus of the text then shifts to Marilla, who has an undeveloped “aesthetic sense,” or appreciation of beauty, as can be seen when she dismisses the maple leaves as “messy things” and criticizes Anne for cluttering her room with objects from outside. This episode thus illustrates that Anne and Marilla differ in their appreciation of beauty and, more generally, in their basic character: Anne is exuberant and joyful, while Marilla is stern and critical. Therefore, the purpose of the text is to show that Anne and Marilla have very different personalities. Choice A is incorrect because the text presents Anne’s appreciation of nature as a basic personality trait, not as a newfound enthusiasm, and never indicates how recently she developed that appreciation. Choice B is incorrect. Although the text portrays Anne and Marilla as having different personalities and attitudes toward natural beauty and home decoration, it doesn’t show them engaging in an argument about this difference or suggest that they often argue about it. Choice C is incorrect. Although the text does indicate that Marilla disapproves of how Anne plans to decorate her room, Marilla’s disapproval is a supporting detail that serves to develop her personality, which the text as a whole contrasts with Anne’s personality."},{"i":"df46a2ee","c":"func","d":"M","s":"The following text is from Joseph Conrad’s 1907 novel The Secret Agent: A Simple Tale. Mr. Verloc is navigating the London streets on his way to a meeting. Before reaching Knightsbridge, Mr. Verloc took a turn to the left out of the busy main thoroughfare, uproarious with the traffic of swaying omnibuses and trotting vans, in the almost silent, swift flow of hansoms [horse-drawn carriages]. Under his hat, worn with a slight backward tilt, his hair had been carefully brushed into respectful sleekness; for his business was with an Embassy. And Mr. Verloc, steady like a rock—<u>a soft kind of rock<\/u>—marched now along a street which could with every propriety be described as private.\n\nWhich choice best describes the function of the underlined phrase in the text as a whole?","o":["It qualifies an earlier description of Mr. Verloc.","It emphasizes an internal struggle Mr. Verloc experiences.","It contrasts Mr. Verloc with his surroundings.","It reveals a private opinion Mr. Verloc holds."],"a":0,"r":"Choice A is the best answer. The underline phrase qualifies (meaning adds limits or conditions to) the description of Mr. Verloc as “steady like a rock,” adding that he is a “soft” rock. Choice B is incorrect. In fact, the passage never mentions Mr. Verloc experiencing any internal struggles. Choice C is incorrect. The underlined phrase doesn’t contrast Mr. Verloc with his surroundings, but is instead modifying the description of him as a rock. Choice D is incorrect. The underlined phrase doesn’t reveal a private opinion Mr. Verloc holds: instead, it further describes his character for the reader."},{"i":"cce2f8dc","c":"func","d":"H","s":"In 2023 literary scholar Jeremy Douglass cautioned technology investors and enthusiasts who predict conventional books’ ultimate displacement by newer forms of media. Douglass observed that <u>the concept of an “interactive” text is much older than technologists assume, extending back to the first time readers scratched notes into a text’s margins<\/u>. In addition, newer media, such as video games, haven’t replaced older forms of entertainment, such as comic books, but rather exist alongside them. Douglass believes that rather than supplanting books, technology is simply making new forms of expression possible.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It challenges the stance of the investors and enthusiasts who are mentioned earlier in the text.","It explains the basis for the claim made by the technologists mentioned in the text.","It suggests that academics are better suited than investors to see the potential uses of contemporary interactive texts.","It provides a historical anecdote about the technological challenges involved in reading the earliest interactive texts."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first sentence of the text introduces literary scholar Jeremy Douglass’s warning to technology investors and enthusiasts against predicting the displacement of conventional books by newer media forms. The next sentence, which is underlined in part, presents Douglass’s observation that interactive texts are hardly new; they have been available for longer than technologists assume, beginning with the first time readers wrote notes in texts’ margins. Thus, the function of the underlined portion is to challenge the stance of the technology investors and enthusiasts mentioned earlier in the text. As the remainder of the text points out, newer media doesn’t necessarily replace older media, but rather, as Douglass believes, leads to new forms of expression. Choice B is incorrect because the underlined portion challenges the position taken by investors and enthusiasts; it doesn’t provide context for their claims. Choice C is incorrect because the underlined portion doesn’t mention academics or compare them to investors regarding their ability to see potential in using contemporary interactive texts; instead, the underlined portion challenges the position of investors and enthusiasts who predict that conventional books will be replaced by newer forms of media. Choice D is incorrect because the underlined portion doesn’t address technological challenges; instead, it disputes the stance taken by investors and enthusiasts, suggesting that conventional books haven’t been displaced by traditional interactions with texts, such as writing in the margins, and won’t be supplanted by newer forms of media either."},{"i":"c8a2af72","c":"cross","d":"M","s":"Text 1 French Impressionist artist Edgar Degas insisted that his paintings be kept in their original frames after they were sold. Like many Impressionist painters, Degas used painted frames that stood in contrast to the gold frames frequently seen at the Paris Salon, a prestigious art exhibition that was sponsored by the French government and promoted traditional painting styles. Impressionist painters likely chose these colorful frames to distinguish themselves from what was considered conventional at the time.\n\nText 2 Impressionist painters often focused on the interplay of color and light in their works. As such, those Impressionists who placed their works in painted frames instead of the more traditional gold ones did so for aesthetic reasons: a frame’s color was likely chosen because it would harmonize with the colors or subjects in a painting. Gold, conversely, could distract from the subtleties in a painted scene.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Gold frames were considered especially desirable by those who purchased works from Impressionist painters.","The colors in an Impressionist painting were often chosen to complement the colors of the frame it would be placed in.","Many Impressionist painters were intentional about the frames they selected for their works.","Degas’s preferred framing style was different from that of most Impressionist painters."],"a":2,"r":"Choice C is the best answer because it presents the statement about the use of painted frames in Impressionist painting that both authors would be most likely to agree with. Text 1 discusses painter Edgar Degas’s insistence that his works remain in their original painted frames, which contrasted with the gold frames that were typical of the Paris art scene at the time. The text then argues that the preference of Degas and other French Impressionist painters for colorful frames can likely be attributed to their desire \"to distinguish themselves from what was considered conventional at the time.\" Text 2 also notes that Impressionist painters \"placed their works in painted frames\" but argues that they probably did so for a purely aesthetic reason: to ensure that \"the frame’s color...would harmonize with the colors or subjects in a painting.\" Though differing on Impressionist painters’ rationale for using painted frames, the authors of both texts would agree that many Impressionist painters were intentional about the frames they selected for their works. Choice A is incorrect because neither text suggests that gold frames were considered desirable by those purchasing Impressionist works. Indeed, it can be inferred from the fact that Impressionist painters used painted frames that those who purchased those works wouldn’t have had a strong preference for gold frames. Choice B is incorrect because neither text suggests that Impressionist painters chose colors for their paintings based on planned frame colors. Indeed, Text 2 states that frame colors were chosen to \"harmonize with the colors or subjects in a painting,\" implying that the color scheme of paintings predated and took precedence over the choice of the colors of frames. Choice D is incorrect because Text 1 presents Degas’s preference for painted frames as being typical of Impressionist painters’ attitudes toward the framing of their works. Moreover, although Text 2 doesn’t specifically discuss Degas, it concurs with Text 1’s assertion that these painters preferred painted frames. Thus, both texts position painted frames as a hallmark of French Impressionist painting, not as a deviation from it."},{"i":"c228bd45","c":"main","d":"E","s":"The following text is adapted from Edith Nesbit’s 1906 novel The Railway Children. Mother did not spend all her time in paying dull [visits] to dull ladies, and sitting dully at home waiting for dull ladies to pay [visits] to her. She was almost always there, ready to play with the children, and read to them, and help them to do their home-lessons. Besides this she used to write stories for them while they were at school, and read them aloud after tea, and she always made up funny pieces of poetry for their birthdays and for other great occasions.\n\nAccording to the text, what is true about Mother?","o":["She wishes that more ladies would visit her.","Birthdays are her favorite special occasion.","She creates stories and poems for her children.","Reading to her children is her favorite activity."],"a":2,"r":"Choice C is the best answer because it describes something that is true of Mother, as presented in the text. The text indicates that in addition to other activities, Mother writes stories for her children while they are at school and makes up “funny pieces of poetry” for certain occasions. Choice A is incorrect because the text suggests that Mother prefers to spend her time with her children and doesn’t sit at home hoping that ladies will visit her. Choice B is incorrect because the text says only that Mother makes up poetry for the children’s birthdays, not that she likes birthdays more than other special occasions. Choice D is incorrect because the text doesn’t suggest that Mother prefers reading to her children over the other activities she does with them, such as playing with them and writing stories and poems for them."},{"i":"a3fb5e77","c":"main","d":"H","s":"Some animal-behavior studies involve observing wild animals in their natural habitat, and some involve capturing wild animals and observing them in a laboratory. Each approach has advantages over the other. In wild studies, researchers can more easily presume that the animals are behaving normally, and in lab studies, researchers can more easily control factors that might affect the results. But if, for example, the results from a wild study and a lab study of Western scrub-jays (Aphelocoma californica) contradict each other, one or both of the studies must have failed to account for some factor that was relevant to the birds’ behavior.\n\nWhich choice best states the main idea of the text?","o":["When the results of a natural-habitat study and those from a lab study of a wild animal such as the Western scrub-jay conflict, the study in the natural habitat is more likely than the lab study to have accurate results.","Studying wild animals such as the Western scrub-jay in both their natural habitat and lab settings is likely to yield conflicting results that researchers cannot fully resolve.","Wild animals such as the Western scrub-jay can be effectively studied in their natural habitat and in the lab, but each approach has drawbacks that could affect the accuracy of the findings.","Differing results between natural-habitat and lab studies of wild animals such as the Western scrub-jay are a strong indication that both of the studies had design flaws that affected the accuracy of their results."],"a":2,"r":"Choice C is the best answer because it most accurately states the main idea of the text. The text begins by explaining that wild animals can be studied in their natural habitat or in a laboratory setting, with each setting offering unique advantages to researchers. The text then highlights an instance in which Western scrub-jays were studied in both settings but with conflicting results, indicating that one or both studies may have failed to account for the disadvantages of its research setting. Thus, the main idea of the text is that while wild animals can be effectively studied in natural or lab settings, there are drawbacks to each that need to be considered to ensure accurate results. Choice A is incorrect because the text does not position one study setting (natural or lab) as superior to the other; rather, the text states that each one has advantages over the other. Choice B is incorrect. The text provides a hypothetical example of two studies in different environments with conflicting results, but this single example cannot be extrapolated to a general claim about the likelihood that results of studies in different environments will conflict. Additionally, the text does not assert anything about how researchers can or cannot resolve conflicting study results. Choice D is incorrect because the text does not state that discrepancies between natural-habitat and lab-based animal behavior studies are due to both of the designs being flawed. Rather, the text states that the conflict in results can be the consequence of one or both of the studies having failed to account for some factor."},{"i":"0dba14e6","c":"infer","d":"H","s":"The increased integration of digital technologies throughout the process of book creation in the late 20th and early 21st centuries lowered the costs of book production, but those decreased costs have been most significant in the manufacturing and distribution process, which occurs after the authoring, editing, and design of the book are complete. This suggests that in the late 20th and early 21st centuries, ______ Which choice most logically completes the text?","o":["digital technologies made it easier than it had been previously for authors to write very long works and get them published.","customers generally expected the cost of books to decline relative to the cost of other consumer goods.","publishers increased the variety of their offerings by printing more unique titles but also printed fewer copies of each title.","the costs of writing, editing, and designing a book were less affected by the technologies used than were the costs of manufacturing and distributing a book."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of how digital technologies affected the process of book creation. The text explains that in the late 20th and early 21st centuries digital technologies lowered book production costs most significantly in manufacturing and distribution. The text goes on to point out that authoring, editing, and book design are distinct steps in the process that occur before manufacturing and distribution. Because the savings connected to digital technologies have been most significant in manufacturing and distribution, it’s reasonable to infer that those technologies had less of an effect on writing, editing, and designing books. Choice A is incorrect because the text focuses on lowered book production costs that occur after authoring has taken place; there’s no indication in the text whether digital technologies made writing and publishing lengthy books easier. Choice B is incorrect. Although it’s logical to conclude that customers would expect the cost of books to decline if production costs have declined, the text doesn’t address customer expectations for the cost of books or any other consumer goods. Choice C is incorrect because the text focuses broadly on how digital technologies have affected the cost of the publishing process; it doesn’t address the kinds of books being published or how many copies are printed."},{"i":"8a3ecac6","c":"infer","d":"E","s":"North American gray wolves usually have mixed gray and white fur, but some members of the species have a version of a gene, or gene variant, that gives them a mostly black coat instead. Sarah Cubaynes and her team studied twelve populations of North American gray wolves. They found that the black-furred wolves are more common in areas where outbreaks of distemper virus happen regularly. The team also discovered that the black-furred wolves are more likely to be immune to distemper than the gray-furred wolves are. Taken together, these findings suggest that ______ Which choice most logically completes the text?","o":["North American gray wolves experience more outbreaks of distemper virus than other wolf species do.","the gene variant that results in black fur may be linked to immunity to the distemper virus.","the average life span of gray wolves is likely to increase over time because of a particular gene variant.","gray-furred wolves will soon replace black-furred wolves across North America."],"a":1,"r":"Choice B is the best answer. The text tells us that the black-furred wolves are more common in areas with regular outbreaks of distemper virus and are more likely to be immune to distemper than the gray-furred wolves. This suggests that the gene variant that results in black fur may be linked to immunity to the distemper virus. Choice A is incorrect. The text never compares North American gray wolves to other wolf species—in fact, it never discusses other wolf species at all, so there’s no basis for this inference. Choice C is incorrect. The life span of gray wolves is never mentioned in this text, so we have no basis for this inference. Choice D is incorrect. This is too extreme. The text says that \"black-furred wolves are more likely to be immune to distemper than the gray-furred wolves,\" but that alone doesn’t mean that black-furred wolves will replace gray-furred wolves across North America."},{"i":"7254379e","c":"claim","d":"E","s":"Some residents in a neighborhood in Atlanta recently founded a community garden inside a local park. The residents agreed to volunteer to take care of the garden together. Students at a local high school surveyed some of the volunteers as part of a project to understand the impact of the new garden. The students concluded that the new garden benefited the community overall by fostering connections and relationships between the volunteers and other residents of the neighborhood who weren’t volunteering at the garden.\n\nWhich quotation from a survey respondent would best illustrate the students’ conclusion?","o":["“Our first challenge was deciding what plants would be most suitable to the climate and soil here in Atlanta. We needed plants that could survive the hot and humid summers.”","“We’re lucky to have a few expert gardeners living in the neighborhood. Some volunteers and I have gone to them a few times with questions, and they’ve been eager to help us and to learn more about the project.”","“I love getting the opportunity to be outside and around nature, especially on days when the weather is nice.”","“My favorite thing about the garden is the feeling of pride I get when I walk by each day. As I see the plants growing, I feel good knowing I had a small part in creating this beautiful space in the neighborhood.”"],"a":1,"r":"Choice B is the best answer. This choice shows how volunteers have been interacting with nonvolunteer neighbors and benefiting from their gardening expertise: proof of the connections enabled by the garden. Choice A is incorrect. This volunteer describes the challenges of developing the garden, which isn’t connected to the conclusion about the garden fostering connections between volunteers and neighbors. Choice C is incorrect. While the volunteer expresses enthusiasm for the garden, they don’t mention any interactions with other people, which is what the students need to show for their conclusion. Choice D is incorrect. The respondent enjoys and takes pride in the garden, but they don’t mention interacting with neighbors or other volunteers."},{"i":"0240d11c","c":"claim","d":"H","s":"In the twentieth century, ethnographers made a concerted effort to collect Mexican American folklore, but they did not always agree about that folklore’s origins. Scholars such as Aurelio Espinosa claimed that Mexican American folklore derived largely from the folklore of Spain, which ruled Mexico and what is now the southwestern United States from the sixteenth to early nineteenth centuries. Scholars such as Américo Paredes, by contrast, argued that while some Spanish influence is undeniable, Mexican American folklore is mainly the product of the ongoing interactions of various cultures in Mexico and the United States.\n\nWhich finding, if true, would most directly support Paredes’s argument?","o":["The folklore that the ethnographers collected included several songs written in the form of a décima, a type of poem originating in late sixteenth-century Spain.","Much of the folklore that the ethnographers collected had similar elements from region to region.","Most of the folklore that the ethnographers collected was previously unknown to scholars.","Most of the folklore that the ethnographers collected consisted of corridos—ballads about history and social life—of a clearly recent origin."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would support Paredes’s argument that Mexican-American folklore is mostly the result of cultural interactions in Mexico and the United States rather than an adaptation of Spanish folklore. The text describes a disagreement among scholars about whether Mexican-American folklore mostly derived from the folklore of Spain or originated in Mexico and the United States as cultures there have interacted. The latter view is the argument that Paredes puts forward. If Mexican-American folklore collected in the twentieth century mostly consists of ballads about history and social life that originated recently, then that would support Paredes’s argument, since it would suggest that the folklore mostly arose after Spanish rule ended in the early nineteenth century and that the folklore reflects cultural interactions in Mexico and the United States rather than traditions from Spain. Choice A is incorrect because the inclusion of songs influenced by sixteenth-century Spanish poetry among Mexican-American folklore collected in the twentieth century would not support Paredes’s view that the folklore was the result of cultural interactions in Mexico and the United States rather than an offshoot of Spanish folklore. If anything, the presence of such songs among the folklore collected in the twentieth century would weaken Paredes’s argument, since it would reflect the influence of Spanish culture on the folklore. Choice B is incorrect because the mere presence of similarities in Mexican-American folklore across regions would not be sufficient to draw a conclusion about where the folklore originated, let alone to support Paredes’s argument that the folklore reflects cultural interactions in Mexico and the United States. In fact, since Paredes argued that Mexican-American folklore is the product of various cultures interacting in Mexico and the United States, he would likely expect there to be regional variations in folklore as different cultures have interacted in different places. Choice C is incorrect because scholars’ previous ignorance of the folklore would have no bearing on Paredes’s argument that Mexican-American folklore mostly reflects cultural interactions in Mexico and the United States. The folklore’s origins are independent of scholars’ knowledge of the folklore."},{"i":"eb775f90","c":"graph","d":"E","s":"","o":["the number of cars produced increased but the number of companies producing cars decreased.","both the number of cars produced and the number of companies producing cars remained unchanged.","the number of cars produced decreased but the number of companies producing cars remained unchanged.","both the number of cars produced and the number of companies producing cars increased."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the statement about the US auto industry in the early twentieth century. The table shows the number of cars produced annually and number of companies producing cars in the United States between 1910 and 1925 in increments of five years. According to the table, the number of cars produced consistently increased from one increment to the next, going from 123,990 cars in 1910 to 3,185,881 cars in 1925. At the same time, the table shows that the number of companies producing cars consistently decreased, going from 320 companies in 1910 to only 80 companies in 1925. Thus, the table shows that the number of cars produced increased from 1910 to 1925, even as the number of companies producing cars decreased. Choice B is incorrect. The table shows that the number of cars produced in the US increased, going from 123,990 in 1910 to 3,185,881 in 1925, instead of remaining unchanged, and the table also shows that the number of companies producing cars decreased from 320 to 80 instead of remaining unchanged. Choice C is incorrect because the table indicates that the number of cars produced consistently increased from 1910 to 1925, going from 123,990 cars to 3,185,881 cars, instead of decreasing; moreover, the table shows that the number of companies producing cars from 1910 to 1925 declined from 320 to 80 instead of remaining unchanged. Choice D is incorrect because the table indicates that the number of companies producing cars consistently decreased from 1910 to 1925, going from 320 companies to only 80 companies."},{"i":"2c06139b","c":"graph","d":"H","s":"","o":["The difference in average tadpole body mass was small between the low and medium population density conditions and substantially larger between the low and high population density conditions.","Tadpoles in the low and medium population density conditions had substantially lower average bufadienolide concentrations but had greater average body masses than those in the high population density condition.","Tadpoles in the high population density condition displayed a relatively modest increase in the average amount of bufadienolide but roughly double the average bufadienolide concentration compared to those in the low population density condition.","Tadpoles produced approximately the same number of different bufadienolide toxins per individual across the population density conditions, but average tadpole body mass decreased as population density increased."],"a":1,"r":"Choice B is the best answer. This data shows that the tadpoles in the high-density pond (meaning those with the most competition) didn’t grow as big as the other two groups but produced more bufadienolide. Choice A is incorrect. This doesn’t fully support the conclusion. It doesn’t include any data about bufadienolide production. Choice C is incorrect. This doesn’t fully support the conclusion. It doesn’t include any data about growth. Choice D is incorrect. This doesn’t fully support the conclusion. It doesn’t demonstrate that the tadpoles in the high-density pond produced more bufadienolide overall. The fact that they didn’t produce more kinds of bufadienolide isn’t relevant to the conclusion."},{"i":"035fd57e","c":"fss","d":"E","s":"The rough frog is a species of amphibian native to Australia. Currently, the frog’s range ______ parts of northern New South Wales and southeastern Queensland.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["includes","included","will have included","had included"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the present tense verb “includes,” used in conjunction with the word “currently,” correctly indicates that the frog’s current range includes parts of northern New South Wales and southeastern Queensland. Choice B is incorrect because the past tense verb “included” doesn’t indicate that the frog’s range currently includes parts of northern New South Wales and southeastern Queensland. Choice C is incorrect because the future perfect tense “will have included” doesn’t indicate that the frog’s range currently includes parts of northern New South Wales and southeastern Queensland. Choice D is incorrect because the past perfect tense “had included” doesn’t indicate that the frog’s range currently includes parts of northern New South Wales and southeastern Queensland."},{"i":"20a6a4ed","c":"fss","d":"E","s":"Anthropologist Lívia Barbosa, of the Universidade Federal Fluminense in Brazil, ______ food and sociability in contemporary Brazil—specifically, how foods such as cabidela (a rice and rabbit dish) and churrasco (a barbeque dish) function as central mechanisms in building social relationships, values, and identities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["studies","are studying","have studied","study"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb \"studies\" agrees in number with the singular subject \"anthropologist Lívia Barbosa.\" Choice B is incorrect because the plural verb \"are studying\" doesn’t agree in number with the singular subject \"anthropologist Lívia Barbosa.\" Choice C is incorrect because the plural verb \"have studied\" doesn’t agree in number with the singular subject \"anthropologist Lívia Barbosa.\" Choice D is incorrect because the plural verb \"study\" doesn’t agree in number with the singular subject \"anthropologist Lívia Barbosa.\""},{"i":"c91ef0f0","c":"fss","d":"H","s":"During the American Civil War, Thomas Morris Chester braved the front lines as a war correspondent for the Philadelphia Press. Amplifying the voices and experiences of Black soldiers ______ of particular importance to Chester, who later became an activist and lawyer during the postwar Reconstruction period.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["were","have been","are","was"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The singular verb \"was\" agrees in number with the singular subject \"amplifying.\" Gerunds such as \"amplifying\" are always singular. Choice A is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"amplifying.\" Choice B is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"amplifying.\" Choice C is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"amplifying.\""},{"i":"5aae2475","c":"bound","d":"H","s":"Stomata, tiny pore structures in a leaf that absorb gases needed for plant growth, open when guard cells surrounding each pore swell with water. In a pivotal 2007 article, plant cell ______ showed that lipid molecules called phosphatidylinositol phosphates are responsible for signaling guard cells to open stomata.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["biologist, Yuree Lee","biologist Yuree Lee,","biologist Yuree Lee","biologist, Yuree Lee,"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed to offset the proper noun \"Yuree Lee\" from the title \"plant cell biologist\" that describes Lee. Choice A is incorrect because no punctuation is needed. Choice B is incorrect because no punctuation is needed. Choice D is incorrect because no punctuation is needed around the proper noun \"Yuree Lee.\" Setting the phrase off with punctuation suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case."},{"i":"594b4a94","c":"bound","d":"H","s":"The field of geological oceanography owes much to American ______ Marie Tharp, a pioneering oceanographic cartographer whose detailed topographical maps of the ocean floor and its multiple rift valleys helped garner acceptance for the theories of plate tectonics and continental drift.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["geologist,","geologist","geologist;","geologist:"],"a":1,"r":"Choice B is the best answer. “Marie tharp” is essential information that completes the first clause — the first clause doesn’t function without it. So we don’t want to separate it with punctuation. Choice A is incorrect. This choice creates a punctuation error. “The field of geological oceanography owes much to American geologist” is unclear: which geologist are we talking about? We need the “Marie Tharp” for clarity, which means it’s essential information and should not be separated by a comma. Choice C is incorrect. This choice creates a punctuation error. “The field of geological oceanography owes much to American geologist” is unclear: which geologist are we talking about? We need the “Marie Tharp” for clarity, which means it’s essential information and should not be separated by a semicolon. Choice D is incorrect. This choice creates a punctuation error. “The field of geological oceanography owes much to American geologist” is unclear: which geologist are we talking about? We need the “Marie Tharp” for clarity, which means it’s essential information and should not be separated by a colon."},{"i":"3ea7372e","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In the art world, the term biennial traditionally refers to an art exhibition that takes place every two years in a single location. Such biennials are held in New York, Berlin, and Venice. In 2006, artists Ed Gomez and Luis Hernandez founded the unconventional MexiCali Biennial. The MexiCali Biennial hosts exhibitions in different venues on both sides of the US-Mexico border. The MexiCali Biennial has taken place on an uneven schedule, with exhibitions in 2006, 2009–10, 2013, and 2018–20. The student wants to emphasize a difference between the MexiCali Biennial and traditional biennials.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In 2006, artists Ed Gomez and Luis Hernandez founded the MexiCali Biennial, which has taken place in 2006, 2009–10, 2013, and 2018–20.","Unlike traditional biennials, the MexiCali Biennial hosts exhibitions in different venues on an uneven schedule.","The term biennial traditionally refers to an art exhibition that takes place every two years in a single location, not to exhibitions hosted at a variety of times and venues.","Biennial exhibitions have been held in New York, Berlin, and Venice but also on both sides of the US-Mexico border."],"a":1,"r":"Choice B is the best answer. The sentence effectively emphasizes a difference between the MexiCali Biennial and traditional biennials, stating that the MexiCali Biennial is unlike traditional biennials because it hosts exhibitions in different venues on an uneven schedule. Choice A is incorrect. The sentence indicates who founded the MexiCali Biennial and the years this biennial has taken place; it doesn’t emphasize a difference between the MexiCali Biennial and traditional biennials. Choice C is incorrect. While the sentence clarifies the traditional meaning of biennial with language that could apply to the MexiCali Biennial, it doesn’t mention the MexiCali Biennial by name. Therefore, the sentence doesn’t effectively emphasize a difference between the MexiCali Biennial and traditional biennials. Choice D is incorrect. The sentence notes locations where various biennial exhibitions have been held; it doesn’t emphasize a difference between the MexiCali Biennial and traditional biennials."},{"i":"8b2636ee","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Angana Chaudhuri is a scientist. Chaudhuri studies sedimentary rocks. A scientist who studies sedimentary rocks is called a sedimentologist. Shale, chalk, and sandstone are examples of sedimentary rocks. The student wants to identify what type of scientist Chaudhuri is.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Chalk is a type of sedimentary rock.","Some scientists study shale, chalk, and sandstone.","There are scientists who study sedimentary rocks.","Chaudhuri is a sedimentologist."],"a":3,"r":"Choice D is the best answer. The sentence identifies the type of scientist Chaudhuri is, noting that she is a sedimentologist. Choice A is incorrect. The sentence provides an example of a type of sedimentary rock; it doesn’t identify what type of scientist Chaudhuri is. Choice B is incorrect. The sentence indicates types of rock that some scientists study; it doesn’t identify what type of scientist Chaudhuri is. Choice C is incorrect. While the sentence states that some scientists study sedimentary rocks, it doesn’t identify Chaudhuri as this type of scientist."},{"i":"2b5f4bdc","c":"trans","d":"M","s":"In the early 1900s, Jovita Idár fought injustice on both sides of the Mexico–United States border. As a reporter for the Texas newspaper La Crónica, she voiced support for the Mexican people’s revolt against authoritarian rule. ______ she founded the League of Mexican Women, a group that advocated for the rights of Mexican Americans.\n\nWhich choice completes the text with the most logical transition?","o":["Additionally,","In conclusion,","For example,","Rather,"],"a":0,"r":"Choice A is the best answer because “additionally” logically signals that the information in this sentence—that Idár founded the League of Mexican Women—is another instance of Idár fighting injustice, this time advocating for the rights of Mexican Americans. Choice B is incorrect because “in conclusion” illogically signals that the information in this sentence sums up or concludes the discussion of Idár’s support for the Mexican people’s revolt. Instead, the founding of the League of Mexican Women is a separate instance of Idár fighting injustice. Choice C is incorrect because “for example” illogically signals that the information in this sentence is an example of how, as a newspaper reporter, Idár voiced support for the Mexican people’s revolt. Instead, the founding of the League of Mexican Women is a separate instance of Idár fighting injustice, this time in support of Mexican Americans. Choice D is incorrect because “rather” illogically signals that the information in this sentence offers a contrast or exception to the previous information about Idár’s support for the Mexican people’s revolt. Instead, the founding of the League of Mexican Women is a separate instance of Idár fighting injustice."},{"i":"dd087f31","c":"trans","d":"E","s":"Chimamanda Ngozi Adichie’s 2013 novel Americanah chronicles the divergent experiences of Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to attend a prestigious university. ______ Obinze travels to London, hoping to start a career there. However, frustrated with the lack of opportunities, he soon returns to Nigeria.\n\nWhich choice completes the text with the most logical transition?","o":["Meanwhile,","Nevertheless,","Secondly,","In fact,"],"a":0,"r":"Choice A is the best answer. “Meanwhile” logically signals that the action described in this sentence (Obinze’s move to London to pursue a career) is simultaneous with the action described in the previous sentence (Ifemelu’s move to the United States). The first sentence establishes that the actions take place around the same time, referring to the characters’ “divergent experiences” following high school. Choice B is incorrect because “nevertheless” illogically signals that the information in this sentence about Obinze’s move to London is true despite the previous information about Ifemelu’s move to the United States. Instead, as the first sentence establishes, Obinze’s move and Ifemelu’s move are related, parallel experiences that occur around the same time. Choice C is incorrect because “secondly” illogically signals that the information in this sentence is a second point or reason separate from the previous information about Ifemelu’s move to the United States. Instead, as the first sentence establishes, Obinze’s move and Ifemelu’s move are related, parallel experiences that occur around the same time. Choice D is incorrect because “in fact” illogically signals that the information in this sentence emphasizes, modifies, or contradicts the previous information about Ifemelu’s move to the United States. Instead, as the first sentence establishes, Obinze’s move and Ifemelu’s move are related, parallel experiences that occur around the same time."},{"i":"273c2f12","c":"trans","d":"M","s":"Jeffrey Gibson’s sculptural object KNOW YOUR MAGIC, BABY , an Everlast-brand exercise bag embroidered with multicolored beads and a fringe associated with the dances of the Ojibwe people, stitches together—literally and figuratively—recognizable symbols from both Native and non- Native cultures. ______ Gibson’s piece also blurs the distinction between contemporary art and traditional crafts.\n\nWhich choice completes the text with the most logical transition?","o":["Conversely,","In so doing,","For instance,","In particular,"],"a":1,"r":"Choice B is the best answer. \"In so doing\" logically signals that the information in this sentence about Gibson’s piece—that it blurs the distinction between contemporary art and traditional crafts—is a result or consequence of the piece’s blending of particular Native and non-Native cultural symbols. Choice A is incorrect. \"Conversely\" illogically signals that the information in this sentence contrasts with the previous information about the blending of particular cultural symbols in Gibson’s piece. Instead, it presents a result or consequence of that information. Choice C is incorrect. \"For instance\" illogically signals that this sentence provides an example supporting the previous information about the blending of particular cultural symbols in Gibson’s piece. Instead, it presents a result or consequence of that information. Choice D is incorrect. \"In particular\" illogically signals that this sentence provides specific details elaborating on the previous information about the blending of particular cultural symbols in Gibson’s piece. Instead, it presents a result or consequence of that information."}],"img":{"eb775f90":"iVBORw0KGgoAAAANSUhEUgAAArwAAAD2BAMAAADGyElTAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAApfUlEQVR42u1deUCUxfv/zPvuwb2zCN7Ki6DlhS+ipnktgpZ5rYqaZblanpmulopmBVmpX7MfHpnZIXjlUbpq5VmuR1qKst5lKQuaV8LOgjfszu8PUEEBNcCA9vMH7DvvvDPP+5nnfd5nZp53BnDBBRdccMEFF1wooyD5jhQSUOf2gTbwdp6mt3/Qe67KPUFB8iQGAUJgAVX5UgAQbpeBQCAQ8JUqMLu0vT7voY+Mamkbcnk6+Ofi3OQjOdxJbobchNYAAAm7cw7P4iMAnrIEgKAr8M4pXWBOjlwIowzCgSPkNSP58RwA1N2LGqf0NU4Z3bOPPdYbFh5rbUxHSR0dqRNOJIEq63Dg/aC/NWJPIQg4H1y1UhCagXSAFgE0QvzawyyGk8Bw4DfBT4a4AGgGPxlIByfB0vXjy2kY1QRRiIPrf7CMBstu8xAGRAJEqYf7ri3KXkyV2RmUoIUG79afbag7ThvZsAJrr7Bxg/D7Ft9ft/iaPAyrV9aS8T0q05krW/1OsRsDavzSYGFM9ZWp/bHTY/Vnfz9pHLVQ3rdaR19w37yHqLLlrR/1/HUPcAQzGy7c6dXqonLLBtWv20CuoOXfdX9fVvOCekuC2+oEAG56L4M3VEb3mFo6ABiGTTjclKY2nPZ4jYPisdYmuitF9/HaalGyRPDzgfZnSQC5hOPvjdrEkFnv4+AFr0RbHSMPZoJGDdu1MpXMqLu8es/x5kzxt8s8a6XV8  return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
function sum(){const d=Object.keys(ans).length,ok=Q.filter(q=>ans[q.i]===q.a).length;$("#sum").textContent=done?`Score: ${ok} of ${Q.length} correct (${Math.round(100*ok/Q.length)}%)`:`${d} of ${Q.length} answered`}
function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="re"){if(!done&&Object.keys(ans).length&&!confirm("Clear all your answers and start over?"))return;ans={};done=false;miss=false;draw();scrollTo(0,0)}
 else if(t.id==="sub")submit();
 else if(t.id==="mi"){miss=!miss;draw()}
 else if(t.dataset.k!==undefined&&!done){const a=t.closest("article"),q=Q[a.dataset.n-1];ans[q.i]=+t.dataset.k;a.outerHTML=card(q,+a.dataset.n);sum()}});
draw();
</script></body></html>
