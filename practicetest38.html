<script>
const D={"t":"Practicetest38","q":[{"i":"b622fb78","c":"vocab","d":"E","s":"The following text is from the 1913 story “The King’s Coin” by Emily Pauline Johnson, a Kanienkahagen (Mohawk) writer also known as Tekahionwake. Fox-Foot, a young Ojibwe man, is guiding a group of fur traders who are traveling by canoe and suspects that they are being followed. At supper time, Fox-Foot would allow no fire to be built, no landing to be made, no trace of their passing to be left. They ate canned meat and marmalade, drank again of the stream and pushed on, until just at dusk they reached the edge of a long, still lake, with shores of granite and dense fir forest.\n\nAs used in the text, what does the word “trace” most nearly mean?","o":["Evidence","Blemish","Amount","Sketch"],"a":0,"r":"Choice A is the best answer because the text indicates that Fox-Foot doesn’t let the group build a fire or create a canoe landing when it’s time for supper. This context suggests that he doesn’t want anyone who might be following the group to see any sign of them or their activities. In other words, Fox-Foot doesn’t want there to be any trace, or evidence, of the group’s movements (\"their passing\") through the area. Choice B is incorrect because the text conveys that Fox-Foot doesn’t want the group to be detected, not that he doesn’t want their presence to create a blemish, or a spoiling flaw, in the area; human activity could disturb a natural environment, but the context emphasizes that Fox-Foot is instead focused on avoiding giving any sign of the group’s movements through a place (\"their passing\") to anyone who might be following them. Choice C is incorrect because the text focuses on Fox-Foot’s desire to avoid detection by those who might be following the group. This context conveys that Fox-Foot doesn’t want to create any signs or evidence of the group moving through a place (\"their passing\"), not that he doesn’t want to leave behind some quantity of their presence; indeed, it isn’t clear what an amount of a group’s movement would be. Choice D is incorrect because nothing in the text suggests that the group has a sketch, or rough drawing, of their movements through that area (\"their passing\") that might be left behind. Rather, the context emphasizes that Fox-Foot is focused on ensuring that the group doesn’t give any kind of indication of their presence, as he wants to avoid detection by anyone who might be following the group."},{"i":"417f8dfa","c":"vocab","d":"E","s":"The following text is from Darcie Little Badger’s 2021 novel A Snake Falls to Earth. Nina is looking at old family photographs. Nina couldn’t stop looking at the sepia-toned photograph in an oak frame. Propped on the window ledge, it featured a portrait of Great-Great-Grandmother Rosita as a young woman. ©2021 by Darcie Little Badger As used in the text, what does the word “featured” most nearly mean?","o":["Displayed","Questioned","Approved","Ignored"],"a":0,"r":"Choice A is the best answer because as used in the text, \"featured\" most nearly means displayed. The text describes Nina’s fascination with a framed photograph. It then goes on to describe what the photograph showed, or displayed, which is a portrait of Nina’s great-great-grandmother Rosita as a young woman. Thus, the text indicates that the photograph displayed a portrait of Rosita. Choice B is incorrect because the text identifies the person shown in the photograph as Nina’s great-great-grandmother; it gives no indication that the contents of the photograph were questioned, or asked about. Choice C is incorrect because approved means expressed a favorable opinion of, and there’s nothing to suggest that the photograph of Nina’s great-great-grandmother has received approval or been viewed favorably, only that Nina is unable to stop looking at it. Choice D is incorrect because nothing in the text suggests that the photograph Nina is fascinated with ignored, or refused to take notice of, Nina’s great-great-grandmother Rosita. Rather, the text indicates that the photograph was a portrait of Rosita."},{"i":"e35d481c","c":"vocab","d":"H","s":"Some economic historians ______ that late nineteenth- and early twentieth-century households in the United States experienced an economy of scale when it came to food purchases—they assumed that large households spent less on food per person than did small households. Economist Trevon Logan showed, however, that a close look at the available data disproves this supposition.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["surmised","contrived","questioned","regretted"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of late nineteenth- and early twentieth-century household food purchases. In this context, “surmised” means formed an idea or assumption with little evidence. The text explains that certain economic historians “assumed” that large and small households spent different amounts on food per person, but that another economist found this supposition to be false based on evidence from available data. This context suggests that the economic historians made an incorrect assumption without enough consideration of evidence. Choice B is incorrect. In this context, “contrived” would mean brought about or created through trickery. Nothing in the text suggests that the economic historians were deliberately trying to trick people with a claim about food purchasing behaviors in late nineteenth- and early twentieth- century households; the text simply suggests that they made an assumption about those behaviors that another historian believes isn’t supported by the available data. Choice C is incorrect because the text indicates that it’s Logan and not the economic historians who “questioned,” or doubted, the assumption that large and small households in the late nineteenth and early twentieth centuries spent different amounts on food per person; the economic historians are the ones who made that assumption to begin with. Choice D is incorrect because nothing in the text suggests that some economic historians “regretted,” or felt sad or remorseful about, the food purchasing behaviors of late nineteenth- and early twentieth-century households. The text focuses on the idea that the economic historians made an assumption about those behaviors that may not be supported by available data, not on the historians’ emotional response to what households did in the past."},{"i":"cb526866","c":"vocab","d":"E","s":"The recent discovery of a carved wooden figure dating to around 2,000 years ago in a ditch in England was truly surprising. Wooden objects ______ survive for so long due to their high susceptibility to rot, but archaeologists suspect layers of sediment in the ditch preserved the figure by creating an oxygen-free environment.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["sturdily","carelessly","rarely","simply"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the discovery of a carved wooden figure dating to around 2,000 years ago. In this context, “rarely” means infrequently. The text states that the discovery of the figure was “truly surprising” and notes that wooden objects are highly prone to rot. This context conveys the idea that wooden objects infrequently survive for as long as the carved figure has survived. Choice A is incorrect because “sturdily” means strongly, which wouldn’t make sense in context. If wooden objects in general could strongly survive for long periods of time, then the discovery of a wooden figure that’s around 2,000 years old wouldn’t be surprising. Choice B is incorrect because “carelessly” means accidentally. The text conveys the idea that wooden objects in general don’t survive for very long because they rot, not that wooden objects in general accidentally survive despite this. Choice D is incorrect because the text conveys the idea that wooden objects in general don’t survive for very long because they rot, not that wooden objects in general “simply,” or merely, survive for long periods of time. If wooden objects in general could merely survive for as long as the figure has survived, then the discovery of the figure wouldn’t have been surprising."},{"i":"a1d2c4d0","c":"purpose","d":"H","s":"Pteropods are small swimming snails with thin, delicate calcium carbonate shells. These animals are thought to be especially vulnerable to ocean acidification due to calcium carbonate’s susceptibility to dissolution at lower pH values. Victoria L. Peck and colleagues recently found that the periostracum (a protective coating on pteropods’ outer shells) prevents this dissolution when intact. Moreover, the team was surprised to discover that even when the periostracum is breached, pteropods can still mitigate damage by rebuilding the inner shell wall.\n\nWhich choice best describes the main purpose of the text?","o":["To call for additional research on biological mechanisms that improve pteropod survival rates","To discuss a conclusion drawn in a study of calcium carbonate’s role in protecting the periostracum of pteropods","To address some of the ways ocean acidification has altered pteropod behavior over time","To present findings that suggest that a concern about the effects of ocean acidification on pteropod shells may be unwarranted"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to present findings that suggest a previously held concern about the effects of ocean acidification on pteropod shells may be unwarranted. The text introduces the concern that pteropods are thought to be particularly vulnerable to ocean acidification, or lower pH levels, due to the susceptibility of their calcium carbonate shells to dissolution at lower pH levels. However, the text then describes findings from a recent study that suggest this concern may be unjustified, insofar as the protective periostracum coating on a pteropod’s shell prevents dissolution, and even when the coating is breached, a pteropod can rebuild the inner shell wall, reducing the damage. Choice A is incorrect because the text doesn’t call for additional research or suggest that more research is needed on biological mechanisms that improve pteropod survival rates. Instead, the text discusses a recent study showing that pteropods may not be as vulnerable to ocean acidification as is feared. Choice B is incorrect because the study discussed in the text doesn’t address calcium carbonate’s role in protecting the periostracum of pteropods. According to the text, the study addresses the periostracum’s role in protecting pteropods’ calcium carbonate shells from dissolution due to ocean acidification. Choice C is incorrect because the text doesn’t address how ocean acidification has altered pteropod behavior over time. Instead, the text focuses on the potential effects of ocean acidification on pteropods’ shells and the mechanisms protecting against those effects."},{"i":"d4732483","c":"purpose","d":"H","s":"Studying late nineteenth- and early twentieth-century artifacts from an agricultural and domestic site in Texas, archaeologist Ayana O. Flewellen found that Black women employed as farm workers utilized hook-and-eye closures to fasten their clothes at the waist, giving themselves a silhouette similar to the one that was popular in contemporary fashion and typically achieved through more restrictive garments such as corsets. Flewellen argues that this sartorial practice shows that these women balanced hegemonic ideals of femininity with the requirements of their physically demanding occupation.\n\nWhich choice best states the main purpose of the text?","o":["To describe an unexpected discovery that altered a researcher’s view of how rapidly fashions among Black female farmworkers in late nineteenth- and early twentieth-century Texas changed during the period","To discuss research that investigated the ways in which Black female farmworkers in late nineteenth- and early twentieth-century Texas used fashion practices to resist traditional gender ideals","To evaluate a scholarly work that offers explanations for the impact of urban fashion ideals on Black female farmworkers in late nineteenth- and early twentieth-century Texas","To summarize the findings of a study that explored factors influencing a fashion practice among Black female farmworkers in late nineteenth- and early twentieth-century Texas"],"a":3,"r":"Choice D is the best answer. The text provides an overview of a scholarly work discussing the fashion practices of Black female farmworkers in late 19th- and early 20th-century Texas, and how these practices were influenced by both the fashion ideals of the time and the demands of farmwork. Choice A is incorrect. The text never discusses the rate of fashion change among Black female farmworkers. The text also never categorizes Flewellen’s findings as \"unexpected.\" Choice B is incorrect. The text actually explains that Black female farmworkers were trying to achieve traditional feminine ideals, not resist them. Choice C is incorrect. The text doesn’t evaluate a scholarly work but rather simply describes it. Furthermore, the text is focused on \"agricultural and domestic\" fashion, not urban fashion as this choice suggests."},{"i":"662ebff2","c":"func","d":"H","s":"In response to concerns that some recent financial crises were exacerbated by consumers misunderstanding risks associated with credit cards, loans, and other financial products, policymakers in many countries have instituted risk-disclosure requirements on sellers of those products. Enrique Seira et al. investigated a variety of risk-disclosure messages sent to thousands of credit card customers and found that the messages had only small and short-lived effects on behavior. Seira et al. asserted that such effects may nevertheless be worth pursuing, <u>given the negligible cost of messaging<\/u>.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It notes a factor that led Seira et al. to not dismiss risk-disclosure messaging altogether despite their evidence of its limited utility.","It acknowledges a type of risk-disclosure messaging that Seira et al. may not have fully accounted for in their study.","It describes a consideration that explains why Seira et al. recommended risk-disclosure messaging even though its effects may be small relative to its costs.","It points out a circumstance that Seira et al. conceded may make risk-disclosure messaging more effective than their study suggests."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined portion in the text as a whole. The text establishes that many countries have adopted risk-disclosure requirements for financial products due to concerns that consumers don’t understand the risks associated with the products. According to the text, Seira et al. found that the effects of such messaging on consumer behavior were small and temporary. The text then adds that the researchers assert that because the cost of the messaging is negligible, the approach may be worth doing even if the effects are limited. Thus, the underlined portion notes a factor—very low cost—that led the researchers to not completely dismiss risk-disclosure messaging despite their evidence of its limited utility. Choice B is incorrect because the underlined portion doesn’t refer to a particular type of risk-disclosure messaging, whether Seira et al. considered it or not; the underlined portion simply indicates that the cost of the messaging (broadly) is very low, which makes the approach worth pursuing even if its effects are limited. Choice C is incorrect. Although the underlined portion does describe a consideration that led the researchers to recommend risk-disclosure messaging despite the messaging’s small effects on consumer behavior, it directly states that the cost of such messaging is negligible, or very low—meaning that both the effects and the costs are small, not that the effects are small only relative to the costs. Choice D is incorrect because there’s no indication that Seira et al. suggest that risk-disclosure messaging could be more effective if it had lower costs; rather, the underlined portion indicates that Seira et al. believe the already negligible cost of messaging makes the approach worth pursuing even if its effects are limited."},{"i":"74446089","c":"func","d":"M","s":"For his 1986 album Keyboard Fantasies, Beverly Glenn-Copeland wrote songs grounded in traditional soul and folk music, then accompanied them with futuristic synthesizer arrangements featuring ambient sounds and complex rhythms. The result was so strange, so unprecedented, that the album attracted little attention when first released. In recent years, however, a younger generation of musicians has embraced the stylistic experimentation of Keyboard Fantasies. <u>Alternative R&amp;B musicians Blood Orange and Moses Sumney, among other contemporary recording artists, cite the album as an influence.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It urges contemporary musicians to adopt the unique sound of Keyboard Fantasies.","It responds to criticism of Keyboard Fantasies by some younger musicians.","It offers examples of younger musicians whose work has been impacted by Keyboard Fantasies.","It contrasts Keyboard Fantasies with the recordings of two younger musicians."],"a":2,"r":"Choice C is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The text’s subject is Beverly Glenn-Copeland’s 1986 album Keyboard Fantasies, notable for its innovative, experimental arrangements. According to the text, the album was not initially admired, but in recent years it has become popular among younger musicians. The underlined portion of the text mentions two of those musicians, Blood Orange and Moses Sumney, who “cite the album as an influence.” Therefore, the underlined portion of the text offers examples of younger musicians whose work has been impacted by Keyboard Fantasies. Choice A is incorrect because even though the underlined sentence states that Blood Orange and Moses Sumney were influenced by Keyboard Fantasies, it doesn’t say that all other musicians should also embrace the album’s experimental style. Choice B is incorrect. Although the text states that Keyboard Fantasies was not admired on its first release, the text doesn’t present any criticism of the album by younger musicians: it only presents two younger musicians who cite it as an influence. Choice D is incorrect because the underlined sentence doesn’t mention any differences between Keyboard Fantasies and the work of Blood Orange and Moses Sumney."},{"i":"faee8ec7","c":"cross","d":"M","s":"Text 1 <u>It seems clear that emotional contagion (the unintentional transfer of an emotional state from one person to another) requires physical interaction and the observation of body language.<\/u> After all, research shows that talking to someone who is smiling and expressing positive feelings often causes people to respond in a comparably positive way. Similarly, displays of nervous fidgeting have been found to prompt others to begin behaving more nervously, too.\n\nText 2 In an experiment using a social networking service, Zeyao Yang and Emilio Ferrara found evidence of emotional contagion in text-based online interactions. The researchers discovered that reading social media posts that expressed a positive outlook led people to make more positive posts themselves, while posts with a negative emotional tone led people to make more negative posts.\n\nBased on the texts, what would the researchers in\n\nText 2 most likely say about the claim underlined in\n\nText 1?","o":["It perpetuates a flawed understanding of emotional contagion, because there isn’t enough evidence to suggest that smiling is a sign of emotional contagion.","It reflects an incomplete view of emotional contagion, because this phenomenon can occur even without in-person interaction.","It’s fairly persuasive, because studies attempting to identify emotional contagion in situations without in-person interaction have thus far yielded unclear results.","It’s mostly accurate, because the social networking study confirmed that emotional contagion primarily occurs in response to negative emotions like nervousness."],"a":1,"r":"Choice B is the best answer because it represents how the researchers in Text 2 would most likely respond to the underlined claim in Text 1. Text 1 begins by asserting that the unintended transfer of feelings from one person to another, known as emotional contagion, seems to rely on both people being physically present and able to observe body language. Text 1 then references research that supports this assertion. Text 2 describes an experiment conducted by the researchers Yang and Ferrara in which they found evidence of emotional contagion in the absence of physical interaction, namely through text-based interactions on social media. The researchers in Text 2 wouldn’t completely agree with what is asserted in the underlined portion of Text 1 (that emotional contagion seems to require physical proximity), because their study, which used a social media networking service, found that physical interaction isn’t the only way that emotional contagion can take place. Thus, the researchers in Text 2 would most likely respond to the underlined claim in Text 1 by stating that it reflects an incomplete view of emotional contagion, because the phenomenon can occur without an in-person interaction. Choice A is incorrect. Although the researchers in Text 2 would likely agree that the underlined statement in Text 1 perpetuates a flawed conclusion that emotional contagion requires physical interaction, Text 2 doesn’t address what the researchers thought about smiling as a sign of emotional contagion. Choice C is incorrect because the researchers in Text 2 wouldn’t say that the underlined claim in Text 1 is fairly persuasive. According to Text 2, the researchers conducted a study that found emotional contagion didn’t require physical interaction, because they found evidence of it in text-based online interactions. Choice D is incorrect because neither of the texts claim that emotional contagion primarily occurs when a person is exposed to negativity. Instead, Text 1 claims that physical interaction is required for emotional contagion to occur, and Text 2 describes a study that suggests emotional contagion can occur in text-based online interactions."},{"i":"cf956802","c":"main","d":"E","s":"When fashion designer Lloyd Henri Kiva New opened his store in Scottsdale, Arizona, in 1945, he quickly became known for creating delicately crafted leather goods, like belts and hats. He was perhaps most renowned for his colorful handbags, which he made by hand using a long and painstaking process. As he gained more customers, New began using sewing machines and other tools to help him produce bags more efficiently, though he continued to handcraft the crucial details that made each bag unique.\n\nBased on the text, what would have been the most likely consequence if New had not begun using sewing machines?","o":["He would have been unable to ensure that each bag included unique, handcrafted details.","He would have struggled to meet the increasing demand for his bags.","He would have had to individually design each bag he produced.","He would not have been able to generate as much interest in his bags."],"a":1,"r":"Choice B is the best answer because it presents the most likely consequence if New had not begun using sewing machines. The text states that New gained new customers and that sewing machines allowed him to make bags more efficiently, or in less time than he could when sewing by hand. It’s reasonable to conclude that if New hadn’t reduced the time it took to make each bag by starting to use sewing machines, it would have been hard for him to keep up with the increased demand. Choice A is incorrect because the text indicates that New added unique, handcrafted details to his bags before he started using sewing machines and continued to do so after he started using them. Choice C is incorrect because the text doesn’t suggest that individually designing each bag would have been a consequence of not using sewing machines, since New was already designing unique details for each bag before he started using sewing machines and continued to do so after he started using them. Choice D is incorrect because the text indicates that people were already interested in New’s bags before he started using sewing machines. Rather than allowing New to generate more interest in his bags, sewing machines helped New keep up with the interest that had already grown."},{"i":"11a9f635","c":"main","d":"M","s":"Paleontologists searching for signs of ancient life have found many fossilized specimens of prehistoric human ancestors, including several from the Pleistocene era discovered in a geological formation in the Minatogawa quarry in Japan. However, to study the emergence of the earliest multicellular organisms to appear on Earth, researchers must turn elsewhere, such as to the Ediacaran geological formation at Mistaken Point in Canada. A UNESCO World Heritage Site, the 146-hectare reserve contains more than 10,000 fossils that together document a critical moment in evolutionary history. What does the text indicate about the geological formation at Mistaken Point?","o":["It holds a greater number of fossils but from a smaller variety of species than the formation in the Minatogawa quarry does.","It has provided evidence that the earliest human species may have emerged before the Pleistocene era.","It is widely considered by paleontologists to be the most valuable source of information about prehistoric life forms.","It contains specimens from an older time period than those found in the formation in the Minatogawa quarry."],"a":3,"r":"Choice D is the best answer. The text says that the formation at Mistaken Point contains fossils of “the earliest multicellular organisms,” which implies that these fossils are from an older time period than the fossils of “prehistoric human ancestors” found in the Minatogawa quarry. Choice A is incorrect. The text says that the formation at Mistake Point contains “more than 10,000 fossils,” but it doesn’t compare this number to the number of fossils in the Minatogawa quarry. It also doesn’t say anything about the variety of species in either formation. Choice B is incorrect. The text says that the formation at Mistaken Point contains fossils of “the earliest multicellular organisms,” but it never says that the site contains early human fossils too. Rather, the early human fossils mentioned in the text were found in the formation at Minatogawa quarry. Choice C is incorrect. The text says that the fossils at Mistaken Point “document a critical moment in evolutionary history,” but it never says that Mistaken Point is the most valuable source of information about prehistoric life forms."},{"i":"22b3da87","c":"infer","d":"H","s":"During the Bourbon Restoration in France (1814–1830), the right to vote required in part that a person paid at least 300 francs in direct taxes to the government. The four most common taxes (the quatre vieilles) were levied on real estate (both land and buildings); the doors and windows in taxpayer homes; the rental values of homes; and the businesses of artisans and merchants. (Foreign investments were either exempt from taxation or taxed lightly.) Although relatively few people paid the tax on real estate, it was the main means of voter qualification and accounted for over two-thirds of government receipts during this period, suggesting that during the Bourbon Restoration ______ Which choice most logically completes the text?","o":["those people who had the right to vote most likely had substantial holdings of French real estate.","the voting habits of French artisans and merchants were effective in reducing tax burdens on businesses.","the number of doors and windows in French residences was kept to a minimum but increased after 1830.","French people with significant foreign investments were unlikely to have the right to vote."],"a":0,"r":"Choice A is the best answer. We’re told that people needed to pay “at least 300 francs in direct taxes” to be able to vote. We’re also told that, while “relatively few people paid the tax on real estate,” real estate taxes were both the main way people qualified to vote and the main source of revenue for the government. Based on this, we can infer that those who did qualify to vote likely had significant French real estate holdings. Choice B is incorrect. The passage doesn’t mention the voting habits of artisans and merchants nor any reduction in tax burdens on businesses, so there’s no basis for this inference. Choice C is incorrect. Although we know that doors and windows were taxed during the Bourbon Restoration, we don’t have enough information to infer if doors and windows increased after this time. Choice D is incorrect. Although we know that foreign investments were only minimally taxed, we don’t have enough information to determine if those with significant foreign investments were unlikely to have voting rights. For example, it’s possible that those with significant foreign investments were likely to also be people with significant domestic investments which they did pay taxes on, so we don’t have the information necessary to make this inference."},{"i":"493c46bc","c":"infer","d":"E","s":"In the South Pacific, New Caledonian crows use two different kinds of stick tools. One tool is complex. The crows shape a stick from a rare plant into a hook. The other tool is basic. The crows find a stick without a hook on the ground. The hooked tool is harder to get but is much better than the basic tool at removing prey from holes. When studying New Caledonian crows, ecologist Barbara Klump found that they hold the hooked tools in their claws when not using them, or they carefully put them in a safe place. The crows don’t do the same with the basic tools. This suggests to Klump that the ______ Which choice most logically completes the text?","o":["hooked stick tools are more valuable to the crows than the stick tools without hooks.","hooked stick tools are easier for most of the crows to hold than the stick tools without hooks.","crows prefer to share their hooked stick tools but don’t share the stick tools without hooks.","crows realize that both kinds of stick tools are less effective than their claws are at removing prey from holes."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the two types of stick tools used by New Caledonian crows. The text indicates that the more effective type of tool has a hook that the crows make themselves, while the other type of tool is simply a stick without a hook that the crows find and don’t shape in any way. According to the text, Klump found that the crows keep hooked tools—but not the tools without hooks—in their grasp or in safe places when they aren’t using the tools. If the hooked tools are more effective than the tools without hooks are and the crows are more protective of the hooked tools than they are of the tools without hooks, it’s reasonable to conclude that the hooked tools are more valuable to the crows than the tools without hooks are. Choice B is incorrect because the text gives no indication of how easy it is for the crows to hold either the hooked tools or the tools without hooks. The text does state that crows hold the hooked tools and not the tools without hooks when the tools aren’t in use. However, the text also indicates that the hooked tools require work from the crows to make and are more useful for helping the crows catch prey than the tools without hooks are. This context suggests that the crows hold the hooked tools because they’re more valuable to the crows than the tools without hooks are, not because the hooked tools are easier to hold. Choice C is incorrect because the text makes no mention of the crows sharing tools. Additionally, the text indicates that when the crows aren’t using the hooked tools, they either grasp the tools or store them safely, which suggests that the crows try to maintain possession of the hooked tools, not that crows prefer to share those tools. Choice D is incorrect because the text says nothing about the crows using their claws to remove prey from holes, so there’s no evidence that the crows perceive the stick tools to be less effective than their claws are."},{"i":"3f4ab688","c":"claim","d":"H","s":"In a research paper, a student criticizes some historians of modern African politics, claiming that they have evaluated Patrice Lumumba, the first prime minister of what is now the Democratic Republic of the Congo, primarily as a symbol rather than in terms of his actions.\n\nWhich quotation from a work by a historian would best illustrate the student’s claim?","o":["“Lumumba is a difficult figure to evaluate due to the starkly conflicting opinions he inspired during his life and continues to inspire today.”","“The available information makes it clear that Lumumba’s political beliefs and values were largely consistent throughout his career.”","“Lumumba’s practical accomplishments can be passed over quickly; it is mainly as the personification of Congolese independence that he warrants scholarly attention.”","“Many questions remain about Lumumba’s ultimate vision for an independent Congo; without new evidence coming to light, these questions are likely to remain unanswered.”"],"a":2,"r":"Choice C is the best answer because it illustrates the student’s claim about some historians viewing Lumumba primarily as a symbol. This quotation argues that Lumumba “warrants” (or deserves) “scholarly attention” as a symbol and not for his “practical accomplishments”—that is, his actions as prime minister—which “can be passed over quickly,” or dismissed as being of comparatively little importance. Thus, the quotation expresses the view that the student criticizes some historians for holding. Choice A is incorrect. Although this quotation touches on the difficulty of evaluating Lumumba’s legacy, it doesn’t address how historians of modern African politics view him as a symbol. Choice B is incorrect. While this quotation mentions Lumumba’s political beliefs, it doesn’t discuss historians viewing him as a symbol. Choice D is incorrect. This quotation touches on Lumumba’s vision for his country, but it doesn’t discuss historians viewing him as a symbol."},{"i":"3091f805","c":"claim","d":"E","s":"Ochre sea stars live in tidal pools along the shoreline of the Pacific Ocean. At night, they move to higher shore levels in search of prey. But scientists Corey Garza and Carlos Robles noticed that ochre sea stars stayed at lower levels at night after heavy rains. Garza and Robles hypothesized that a layer of fresh water formed by rainfall was a barrier to the sea stars. To test their hypothesis, the scientists did an experiment. They placed some sea stars in a climbable tank of seawater and other sea stars in a similar tank of seawater with a layer of fresh water on top. Then, the scientists watched the sea stars’ behavior at night.\n\nWhich finding from the experiment, if true, would most directly support Garza and Robles’s hypothesis?","o":["None of the sea stars climbed to the tops of the tanks, but sea stars in the tank with only seawater moved around the bottom of the tank more than sea stars in the other tank did.","Sea stars in the tank with only seawater climbed to the top of the tank, but sea stars in the other tank stopped climbing just below the layer of fresh water.","Both groups of sea stars climbed to the tops of the tanks, but sea stars in the tank with only seawater climbed more slowly than sea stars in the other tank did.","Sea stars in the tank with only seawater mostly stayed near the bottom of the tank, but sea stars in the other tank climbed into the layer of fresh water."],"a":1,"r":"Choice B is the best answer because it presents a finding that, if true, would support Garza and Robles’s hypothesis that a layer of fresh water forms a barrier to ochre sea stars. The text explains that the sea stars tend to move to higher shore levels at night in search of prey, but after a heavy rain, the sea stars stay at lower shore levels. Garza and Robles hypothesize that rainfall results in a layer of fresh water that the sea stars don’t cross. To determine whether fresh water forms a barrier to sea stars, Garza and Robles observed how sea stars behaved in a tank of only seawater and in a tank of seawater with a layer of fresh water on top. If the sea stars climbed to the top of the tank with only seawater but stopped climbing just below the layer of fresh water in the other tank, that would suggest that fresh water does indeed serve as a barrier to the sea stars, thereby supporting Garza and Robles’s hypothesis. Choice A is incorrect because finding that sea stars in the tank with only seawater moved around the bottom of the tank more than sea stars in the other tank did but that none of the stars in either tank climbed to the top would be irrelevant to Garza and Robles’s hypothesis. Such a finding would reveal nothing about whether fresh water serves as a barrier to sea stars. Choice C is incorrect because finding that sea stars climbed to the top of both tanks would weaken, not support, Garza and Robles’s hypothesis, since it would indicate that the layer of fresh water wasn’t a barrier to the sea stars. Choice D is incorrect because finding that sea stars in the tank with only seawater mostly stayed near the bottom of the tank but sea stars in the other tank climbed into the layer of fresh water wouldn’t support Garza and Robles’s hypothesis. Instead, such a finding would suggest that the layer of fresh water wasn’t a barrier to the sea stars, thereby weakening Garza and Robles’s hypothesis."},{"i":"38e79659","c":"graph","d":"E","s":"","o":["7.35 million visitors.","9.60 million visitors.","6.40 million visitors.","5.60 million visitors."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the example of the high cost and low popularity of world’s fairs. The text presents Chow’s argument that the United States hasn’t hosted a world’s fair since 1984 because people think these exhibitions are overly expensive and insufficiently popular. The text then cites the 1984 World’s Fair as an example, noting that it cost $350 million. Since the example should illustrate both high cost and insufficient popularity, the best completion of the example is the information from the table that the 1984 World’s Fair had 7.35 million visitors. Choice B is incorrect because it misrepresents data from the table. The table indicates that the 1984 World’s Fair, which is the world’s fair used as an example in the text, had 7.35 million, not 9.60 million, visitors. Choice C is incorrect because it misrepresents data from the table. The table indicates that the 1984 World’s Fair, which is the world’s fair used as an example in the text, had 7.35 million, not 6.40 million, visitors. Choice D is incorrect because it misrepresents data from the table. The table indicates that the 1984 World’s Fair, which is the world’s fair used as an example in the text, had 7.35 million, not 5.60 million, visitors."},{"i":"f8244f7c","c":"graph","d":"M","s":"","o":["Although the Bendire’s thrasher has one of the smallest mean bill surface areas of the birds included in the table, its habitat has one of the lowest mean maximum temperatures in the warmest month and one of the lowest mean minimum temperatures in the coldest month.","Although the Cozumel thrasher has the second greatest mean bill surface area of the birds included in the table, its habitat’s mean temperature in the warmest month is significantly higher than that of the other birds’ habitats.","Of the birds included in the table, the brown thrasher has the smallest mean bill surface area and the habitat with the lowest mean minimum temperature in the coldest month, while the long-billed thrasher has the second-largest mean bill surface area and the habitat with the second- highest mean minimum temperature in the coldest month.","Of the birds included in the table, the ocellated thrasher has the largest mean bill surface area and the habitat with the lowest mean maximum temperature in the warmest month, while the Bendire’s thrasher has the second smallest mean bill surface area and the habitat with the highest mean maximum temperature in the warmest month."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to support Probst and colleagues’ conclusion about the hypothesis regarding the relationship between birds’ bill size and habitat temperature. The text states that although it has been hypothesized that birds’ bill size should increase with habitat temperature (an adaptation that reflects the fact that birds can release excess heat through their bills), Probst and colleagues concluded after studying mean bill surface area in North American thrashers that this hypothesis was not fully supported. In other words, Probst and colleagues did not observe the predicted positive relationship between mean bill surface area and habitat temperature in the thrashers they studied. The data in the table about the ocellated thrasher support Probst and colleagues’ conclusion because this species has the greatest mean bill surface area (3.26 cm 2 ), but its habitat has the lowest mean maximum temperature in the warmest month (27.56°C). If the hypothesis were fully supported, species such as the ocellated thrasher that have colder habitats would likely also have smaller bills. Similarly, the data about the Bendire’s thrasher support Probst and colleagues’ conclusion because this species has the second- smallest mean bill surface area (1.98 cm 2 ), yet its habitat has the highest mean maximum temperature in the warmest month (36.57°C). If the hypothesis were fully supported, the Bendire’s thrasher and other species with warmer habitats would also have larger bills. Because data in the table show that the ocellated thrasher and the Bendire’s thrasher have the opposite or near opposite of the hypothesized relationship between bill size and habitat temperature, these examples support Probst and colleagues’ conclusion that this hypothesis isn’t fully supported. Choice A is incorrect because it misrepresents the data in the table. Although the Bendire’s thrasher has the second-smallest mean bill surface area of the species that are included in the table and although its habitat has the second-lowest mean minimum temperature in the coldest month, this habitat has the highest (rather than the lowest) mean maximum temperature in the warmest month. Moreover, the data about this species’ bill surface area and mean minimum temperature suggest that smaller bills are associated with colder habitats, supporting rather than challenging the hypothesis that bill size increases with habitat temperature. Choice B is incorrect because it misrepresents the data in the table. Although the Cozumel thrasher has the second-greatest mean bill surface area of the species that are included in the table, its habitat’s mean maximum temperature in the warmest month is not \"significantly higher\" than the mean maximum temperatures of the other habitats. On the contrary, the mean maximum temperature of the Cozumel thrasher’s habitat is lower than that observed for the habitats of both the Bendire’s thrasher and the long-billed thrasher. Choice C is incorrect because it misrepresents the data in the table. Although this choice accurately describes the brown thrasher’s mean bill surface area and habitat temperature, it incorrectly states that the long-billed thrasher has the second- largest (rather than the third-largest) mean bill surface area of the species included. In addition, instead of revealing a lack of support for the hypothesis that bill size increases with habitat temperature, the data in this choice broadly reflect the hypothesized relationship."},{"i":"353890a1","c":"fss","d":"E","s":"Water is constantly moving and changing forms on Earth and in the atmosphere. This process is called the water cycle, and it is typically thought to consist of evaporation, condensation, and precipitation. However, the National Oceanic and Atmospheric Administration seeks ______ understanding of the water cycle to include transpiration, sublimation, and other types of water movement.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is expanding","to expand","has expanded","expands"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite to-infinitive verb “to expand” is correctly used to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do. Choice A is incorrect because it results in an ungrammatical sentence. The finite verb “is expanding” can’t be used in this way to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do. Choice C is incorrect because it results in an ungrammatical sentence. The finite verb “has expanded” can’t be used in this way to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb “expands” can’t be used in this way to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do."},{"i":"e44db0a0","c":"fss","d":"M","s":"Because a cycle of lunar phases ______ 29.5 days to complete, it’s possible to observe two full moons in a single month, one at the beginning and one at the end.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are taking","have taken","take","takes"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The singular verb \"takes\" agrees in number with the singular subject \"a cycle of lunar phases.\" Choice A is incorrect because the plural verb \"are taking\" doesn’t agree in number with the singular subject \"a cycle of lunar phases.\" Choice B is incorrect because the plural verb \"have taken\" doesn’t agree in number with the singular subject \"a cycle of lunar phases.\" Choice C is incorrect because the plural verb \"take\" doesn’t agree in number with the singular subject \"a cycle of lunar phases.\""},{"i":"35360da9","c":"fss","d":"E","s":"The US Geological Survey wants to map every human-made structure in the United States, and it is asking volunteers to help. Cassie Tammy Wang and Ashish D’Souza are just two of the many volunteer map editors who ______ to the project since it began in 2012.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["contribute","will contribute","have contributed","will be contributing"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the present perfect tense verb “have contributed,” used in conjunction with the phrase “since it began in 2012,” correctly indicates that map editors have contributed in the past and continue to do so in the present. Choice A is incorrect because the present tense verb “contribute” is inconsistent with the phrase “since it began in 2012,” which suggests that the contributions occurred in the past and continue into the present. Choice B is incorrect because the future tense verb “will contribute” is inconsistent with the phrase “since it began in 2012,” which suggests that the contributions occurred in the past and continue into the present. Choice D is incorrect because the future tense verb “will be contributing” is inconsistent with the phrase “since it began in 2012,” which suggests that the contributions occurred in the past and continue into the present."},{"i":"5bed774c","c":"bound","d":"H","s":"Philosopher Peter Kivy was a leading figure in musical ______ evidenced by his belief that instead of evoking particular emotions, such as sadness or joy, compositions elicit a listener’s emotional response to the structure and artistry of the music itself, Kivy’s approach to the study of music was decidedly formalist.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["aesthetics as","aesthetics and as","aesthetics, as","aesthetics. As"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"Philosopher...aesthetics\") and another (\"As...formalist\"). The long adverbial element \"as evidenced...itself\" modifies the content in the following clause to support the claim that Kivy’s approach was formalist. Choice A is incorrect because it results in a run-on sentence. The sentences (\"Philosopher...aesthetics\" and \"As…formalist\") are fused without punctuation and/or a conjunction. Choice B is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join sentences. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences."},{"i":"603755a5","c":"bound","d":"E","s":"In 1959, marine biologist Dr. Albert Jones founded the Underwater Adventure Seekers, a scuba diving ______ that is the oldest club for Black divers in the United States and that has helped thousands of diving enthusiasts become certified in the field.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["club","club,","club—","club, and"],"a":0,"r":"Choice A is the best answer. “That is…field” is an essential supplement, so we should not use punctuation to separate it from “scuba diving club.” . Choice B is incorrect. This choice creates a punctuation error. “That is…field” is an essential supplement, so we should not use a comma (or any kind of punctuation) to separate it from “scuba diving club.” . Choice C is incorrect. This choice creates a punctuation error. “That is…field” is an essential supplement, so we should not use a dash (or any kind of punctuation) to separate it from “scuba diving club.” . Choice D is incorrect. This choice creates a run-on sentence. It makes “that is…United States” into an awkward independent clause, but it also makes “that has…field” into its own awkward independent clause without the correct punctuation separating it."},{"i":"264e7415","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The Philadelphia and Lancaster Turnpike was a road built between 1792 and 1794. It was the first private turnpike in the United States. It connected the cities of Philadelphia and Lancaster in the state of Pennsylvania. It was sixty-two miles long. The student wants to emphasize the distance covered by the Philadelphia and Lancaster Turnpike.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The sixty-two-mile-long Philadelphia and Lancaster Turnpike connected the Pennsylvania cities of Philadelphia and Lancaster.","The Philadelphia and Lancaster Turnpike was the first private turnpike in the United States.","The Philadelphia and Lancaster Turnpike, which connected two Pennsylvania cities, was built between 1792 and 1794.","A historic Pennsylvania road, the Philadelphia and Lancaster Turnpike was completed in 1794."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes the distance covered by the Philadelphia and Lancaster Turnpike, noting that the turnpike, which connected the two Pennsylvania cities in its name, was sixty-two miles long. Choice B is incorrect. The sentence emphasizes the significance of the turnpike; it doesn’t emphasize the distance that the turnpike covered. Choice C is incorrect. While the sentence mentions that the turnpike connected two Pennsylvania cities, it doesn’t emphasize the specific distance covered by the turnpike. Choice D is incorrect. The sentence emphasizes when the turnpike was built; it doesn’t emphasize the distance that the turnpike covered."},{"i":"85c0c0f0","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Texture analysis and historical analysis are two approaches to art criticism. Texture analysis examines how surfaces are visually represented in an artwork. Such an analysis of Giorgione’s Youth Holding an Arrow might consider how the painting’s blended colors make the subject’s skin appear smooth in texture. Historical analysis considers the historical context in which a work was created. Such an analysis of Diego Velázquez’s Las Meninas might consider how the painting’s depiction of the artist with King Philip IV symbolizes art’s historical ties to power. The student wants to present historical analysis to an audience unfamiliar with the concept.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["A texture analysis of Youth Holding an Arrow might consider how the painting’s blended colors make the subject’s skin appear smooth in texture.","Texture analysis differs from historical analysis in that texture analysis examines how surfaces are visually represented in an artwork.","An approach to art criticism, historical analysis considers the historical context in which a work was created.","Las Meninas’s depiction of the artist with King Philip IV symbolizes art’s historical ties to power."],"a":2,"r":"Choice C is the best answer. The sentence presents historical analysis to an audience unfamiliar with the concept by defining it as an approach to art criticism that considers the historical context in which a work was created. Choice A is incorrect because it provides an example of texture analysis; it doesn’t present historical analysis to an audience unfamiliar with the concept. Choice B is incorrect. The sentence explains a difference between texture analysis and historical analysis; it doesn’t present historical analysis to an audience unfamiliar with the concept. Choice D is incorrect. It provides an example of historical analysis; it doesn’t present historical analysis to an audience unfamiliar with the concept."},{"i":"221ecf0f","c":"trans","d":"M","s":"Alexander Lawrence Posey (1873–1908) varied his focus and tone depending on the genre in which he was writing. In his poetry, he used heartfelt language to evoke the beauty and peacefulness of his natural surroundings; in his journalism, ______ he employed humor and satire to comment on political issues affecting his Muskogee Creek community.\n\nWhich choice completes the text with the most logical transition?","o":["that is,","granted,","similarly,","by contrast,"],"a":3,"r":"Choice D is the best answer. This sentence compares two examples of Posey’s tone: the “heartfelt language” he used in his poetry versus the “humor and satire” he used in his journalism. We know from these descriptions and from the claim in the previous sentence that the two tones are very different from each other. So the transition “by contrast” fits the context perfectly. Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea in other words. But the text isn’t restating the first example here. Instead, it’s offering a second, totally different example. Choice B is incorrect. This choice uses a transition that means “admittedly.” But the text isn’t admitting or conceding anything here. Instead, these two examples work together to support the claim made in the first sentence. Choice C is incorrect. This choice uses a transition that indicates the addition of an agreeing idea. But these two examples are intentionally very different from each other, so “similarly” doesn’t make sense here."},{"i":"a773f069","c":"trans","d":"E","s":"Small, flat structures called spatulae are found at the tips of the hairs on a spider’s leg. These spatulae temporarily bond with the atoms of whatever they touch. ______ spiders are able to cling to and climb almost any surface.\n\nWhich choice completes the text with the most logical transition?","o":["For instance,","However,","Similarly,","As a result,"],"a":3,"r":"Choice D is the best answer. “As a result” logically signals that the claim in this sentence—that spiders can cling to and climb almost any surface —is because of the previous information about the bonding properties of spiders’ spatulae. Choice A is incorrect because “for instance” illogically signals that the claim in this sentence exemplifies the information in the previous sentences. Instead, the claim is because of the previous information about the bonding properties of spiders’ spatulae. Choice B is incorrect because “however” illogically signals that the claim in this sentence contrasts with the information in the previous sentences. Instead, the claim is because of the previous information about the bonding properties of spiders’ spatulae. Choice C is incorrect because “similarly” illogically signals that the claim in this sentence is similar to, but separate from, the information in the previous sentences. Instead, the claim is because of the previous information about the bonding properties of spiders’ spatulae."},{"i":"feb1e6da","c":"trans","d":"M","s":"Biographer Michael Gorra notes that the novelist Henry James “lived in a world of second thoughts,” frequently tinkering with his novels and stories after their initial publication. However, the differences between the 1881 first edition and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James’s standards; ______ some critics regard the two editions as two different novels altogether.\n\nWhich choice completes the text with the most logical transition?","o":["by contrast,","in fact,","nevertheless,","in other words,"],"a":1,"r":"Choice B is the best answer. \"In fact\" logically signals that the critics’ claim at the end of this sentence—that the two editions are essentially two different novels altogether—offers additional emphasis in support of the previous claim that the differences between the editions are extreme. Choice A is incorrect because \"by contrast\" illogically signals that the claim at the end of this sentence contrasts with the previous claim about the differences between the editions. Instead, the critics’ opinion offers additional emphasis in support of that claim. Choice C is incorrect because \"nevertheless\" illogically signals that the claim at the end of this sentence is true despite the previous claim about the differences between the two editions. Instead, the critics’ opinion offers additional emphasis in support of that claim. Choice D is incorrect because \"in other words\" illogically signals that the claim at the end of this sentence is merely paraphrasing the previous claim about the differences between the two editions. The critics’ opinion adds new information to the previous claim rather than simply paraphrasing it."}],"img":{"38e79659":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEHBAMAAAC+cYhbAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg
