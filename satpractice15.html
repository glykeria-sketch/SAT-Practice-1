<script>
const D={"t":"SATPractice15","q":[{"i":"49bbe4d7","c":"vocab","d":"E","s":"For painter Jacob Lawrence, being ______ was an important part of the artistic process. Because he paid close attention to all the details of his Harlem neighborhood, Lawrence’s artwork captured nuances in the beauty and vitality of the Black experience during the Harlem Renaissance and the Great Migration.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["skeptical","observant","critical","confident"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Jacob Lawrence’s artistic process. In this context, “observant” means watchful and perceptive. The text emphasizes that the “close attention” Lawrence paid to “all the details” of his neighborhood allowed him to reflect subtle elements of “the beauty and vitality of the Black experience” in his artwork. This context indicates that being observant of his surroundings was an important part of Lawrence’s work as an artist. Choice A is incorrect because the text gives no indication that Lawrence was “skeptical,” or had an attitude of doubt in general or about particular things, let alone that skepticism was important to him as an artist. Rather than indicating that he was skeptical, the text focuses on how Lawrence paid careful attention to everything around him and reflected his observations in his artwork. Choice C is incorrect because the text gives no indication that Lawrence was “critical,” which in this context would mean inclined to criticize harshly or unfairly. Rather than indicating that Lawrence found fault in things, the text suggests that he paid careful attention to everything around him and that his artwork reflects this careful attention. Choice D is incorrect because the text doesn’t suggest that Lawrence was “confident,” or self-assured. Rather than addressing how Lawrence felt about himself and how that feeling affected his artistic process, the text emphasizes the careful attention Lawrence paid to everything around him—attention that allowed him to capture subtle elements of a particular place and time in his artwork."},{"i":"62a18353","c":"vocab","d":"M","s":"The following text is adapted from Zora Neale Hurston’s 1921 short story “John Redding Goes to Sea.” John wants to travel far beyond the village where he lives near his mother, Matty. [John] had on several occasions attempted to reconcile his mother to the notion, but found it a difficult task. Matty always took refuge in self-pity and tears. Her son’s desires were incomprehensible to her, that was all.\n\nAs used in the text, what does the phrase “reconcile his mother to” most nearly mean?","o":["Get his mother to accept","Get his mother to apologize for","Get his mother to match","Get his mother to reunite with"],"a":0,"r":"Choice A is the best answer. The expression “reconcile to” means “to cause (a person) to accept something difficult or disagreeable.”The text suggests that John wants his mother to accept his desire to travel, even though she doesn’t like that idea. Choice B is incorrect. This doesn’t make sense. John doesn’t want his mother to apologize for his own desire to travel—he wants her to accept his desire to travel. Choice C is incorrect. The text doesn’t suggest that John wants his mother to match his desire to travel. Rather, he wants her to accept his desire to travel even though she doesn’t like it. Choice D is incorrect. This is tempting, because it seems to pick up on the idea of people “reconciling” after a fight, but it actually doesn’t make sense. The text never suggests that John’s mother was “united with” the idea of him traveling in the past—if anything, it seems like she’s always been against it. Besides, it would be strange to say that a person “reunites with” a notion."},{"i":"1374a9fa","c":"vocab","d":"M","s":"Austin McCoy has argued that historians have tended to ______ rank-and-file workers in analyses of changes in organized labor in the United States in the decades following the Second World War, presenting political, business, and labor leaders as the major actors and ordinary workers as nearly devoid of agency.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["epitomize","marginalize","extol","substantiate"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of how historians have treated rank-and-file (ordinary) workers in their analyses. In this context, \"marginalize\" means treat as unimportant or relatively powerless within a group or society. The text explains that according to Austin McCoy, historians have tended to treat \"political, business, and labor leaders\" as the \"major actors\" involved in making changes in organized labor in the period after the Second World War. By emphasizing the contributions of these leaders, historians have in effect minimized the contributions of ordinary workers, treating them as relatively unimportant and \"nearly devoid of agency,\" thereby marginalizing them. Choice A is incorrect. In this context, \"epitomize\" would mean either serve as an ideal example of something or make into an example of something, neither of which would make sense. In stating that historians have tended to characterize political, business, and labor leaders as the primary actors responsible for changes in the post-Second World War labor movement in a manner that minimizes the influence of ordinary workers, the text suggests that historians have tended to present ordinary workers as unimportant to or uninfluential within the movement, not that historians themselves serve as examples of ordinary workers, or that historians in their analyses have made ordinary workers into examples of the changes that occurred. Choice C is incorrect because in this context, \"extol\" would mean praise highly or glorify. The text states that historians have tended to present ordinary workers as being \"nearly devoid of agency,\" thereby minimizing their importance. It therefore wouldn’t make sense to say that in doing so, historians have tended to praise or glorify them. Choice D is incorrect because \"substantiate\" would mean verify with evidence, and nothing in the text suggests that historians have verified rank-and-file workers or their contributions in their analyses. If anything, the text suggests the opposite, implying that by minimizing workers’ agency in organized labor, historians have likely overlooked evidence demonstrating their influence."},{"i":"7d84fe2b","c":"vocab","d":"E","s":"Particle physicists like Ayana Holloway Arce and Aida El-Khadra spend much of their time ______ what is invisible to the naked eye: using sophisticated technology, they closely examine the behavior of subatomic particles, the smallest detectable parts of matter.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["selecting","inspecting","creating","deciding"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the work of particle physicists. In this context, “inspecting” means viewing closely in order to examine. The text indicates that as particle physicists, Arce and El-Khadra’s work involves using advanced technology to “closely examine” subatomic particles. In other words, they use technology to inspect small parts of matter that can’t be seen by the naked eye. Choice A is incorrect because nothing in the text suggests that Arce and El-Khadra spend time “selecting,” or choosing, subatomic particles for some purpose; the text simply states that the particle physicists use advanced technology to see and study the behavior of those tiny parts of matter. Choice C is incorrect because nothing in the text suggests that Arce and El-Khadra spend time “creating” subatomic particles, or bringing them into existence; the text simply states that the particle physicists use advanced technology to see and study the behavior of those tiny parts of matter. Choice D is incorrect. In this context, “deciding” would mean making a final choice or judgment about something. It wouldn’t make sense to say that particle physicists get to choose what is and isn’t visible to the naked eye, especially when the text presents it as fact that subatomic particles are “the smallest detectable parts of matter” and would therefore be invisible. The text focuses on Arce and El-Khadra’s close observation of those particles, not on any decisions they might make."},{"i":"be947479","c":"purpose","d":"E","s":"Jazz tap is a dance form that was first developed in African American communities. Jazz tap was heavily influenced by jazz music, which became widely popular in the United States in the 1920s. Tap dancers were inspired by jazz music’s quick rhythms and by the way jazz musicians would make up melodies as they played. As jazz music continued to develop in the 1930s and 1940s, jazz tap evolved with it. Because of jazz music’s influence, jazz tap quickly developed into a dance form that was very different from earlier kinds of tap dance.\n\nWhich choice best states the main purpose of the text?","o":["It explains why audiences prefer some kinds of music over others.","It discusses the development of a dance form.","It describes how to play a musical instrument.","It emphasizes the popularity of a famous dancer."],"a":1,"r":"Choice B is the best answer because it best describes the main purpose of the text. The text indicates where and when jazz tap first developed (in African American communities in the 1920s) and what influenced it (the quick rhythms and improvisations in jazz music) and then explains that it evolved alongside jazz music in the 1930s and 1940s, resulting in a very different form of tap dance than had existed before. Therefore, the main purpose of the text is to discuss jazz tap’s development. Choice A is incorrect. Although the text indicates that jazz music became widely popular in the US in the 1920s and describes some of jazz music’s qualities, the text never explains why audiences prefer some kinds of music—jazz or otherwise—over others. Choice C is incorrect because the text never mentions any musical instruments and doesn’t describe how to play one. Choice D is incorrect because the text discusses jazz tap generally and never identifies a particular dancer, famous or otherwise."},{"i":"d5600e74","c":"purpose","d":"E","s":"The following text is adapted from Pam Muñoz Ryan’s 2020 novel Mañanaland. In the village where Max lives, there is an old fortress called La Reina. Children in the village say that the fortress is haunted. For as long as he could remember, Max had begged Papá [his father] to take him to see La Reina and the ruins up close. He’d be a hero among his friends if he was the first boy to cross the haunted gates! Just because Papá didn’t believe in ghosts didn’t mean they weren’t there. Maybe this summer Papá would finally take him. He wasalmost twelve. ©2020 by Pam Muñoz Ryan Which choice best describes the overall purpose of the text?","o":["To portray how proud Max’s father is of Max","To explain why Max doesn’t want to grow up yet","To criticize Max for disliking summer","To show how much Max wants to visit La Reina"],"a":3,"r":"Choice D is the best answer because it most accurately describes the overall purpose of the text. The text indicates that \"for as long as he could remember,\" Max had \"begged\" his father to take him to La Reina. This point is later emphasized in the text by indicating that \"this summer\" his father might \"finally take\" Max to visit La Reina. Thus, the purpose of the text as a whole is to show how much Max wants to visit La Reina. Choice A is incorrect. The text does not discuss Papa’s feelings toward Max. Rather, it mentions that Max has long wanted Papa to take him to La Reina and that, unlike Max and some other children, Papa does not believe that La Reina is haunted. Choice B is incorrect. The text mentions that Max is \"almost twelve\" at the time, which suggests anticipation of growing up rather than refusal to. Choice C is incorrect. The text indicates that Max hopes to visit La Reina during the current summer, but nothing suggests that Max dislikes summer."},{"i":"93ce86d0","c":"func","d":"H","s":"Curious about how people visually perceive objects in their dreams, Stephen LaBerge and team recruited lucid dreamers—people aware that they’re dreaming as it’s happening—for a research study. These participants were reliably able to signal when they had entered a dream state; the team then observed participants’ eye movements as they slept. <u>The smoothness with which participants’ eyes tracked objects in their dreams closely matched how sighted people who are awake visually track objects around them,<\/u> suggesting to the team that the brain perceives dream objects as the product of something other than pure imagination.\n\nWhich choice best states the function of the underlined portion in the text as a whole?","o":["To offer key evidence that undermines LaBerge and team’s initial hypothesis","To show the unexpected result that led LaBerge and team to change the focus of their study","To illustrate an important real-world implication of LaBerge and team’s main finding","To identify a comparable circumstance that helps justify LaBerge and team’s conclusion"],"a":3,"r":"Choice D is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The text first establishes that in order to investigate visual perception of objects in dreams, LaBerge and team observed the eye movements of lucid dreamers (people who are aware of their dreaming as it occurs) when these participants signaled that they were in a dream state. The underlined portion then describes a finding that rests on a comparison: the way participants’ eyes tracked objects in dream states was very similar to how sighted people track real objects when awake. Finally, the text states that the team concluded from this finding that objects in dreams are perceived as more than just products of imagination—implying that the team thinks the eye movements are an indication that the brain treats dream objects as more real than imaginary. Thus, the function of the underlined portion is to identify a circumstance that is comparable to one in the study and that helps justify LaBerge and team’s conclusion, presenting the close similarity of visual tracking in wakeful and dreaming scenarios as support for the implicit idea that the brain perceives dream objects not as imaginary but as somewhat or fully real objects. Choice A is incorrect because the text never presents LaBerge and team’s initial hypothesis, only what question they were interested in studying and what they found. So although the underlined portion does present evidence, that evidence doesn’t serve to undermine any hypothesis in the text. Choice B is incorrect because the text gives no indication that LaBerge and team changed the focus of their study at any point or that the finding described in the underlined portion (or any other finding) was unexpected or surprising. Choice C is incorrect. Rather than illustrating an implication of the main finding by LaBerge and team, the underlined portion only presents the finding itself, stating that the team found that the movements of lucid dreamers’ eyes while dreaming were very similar to those of sighted people visually tracking objects while awake. The next part of the text indicates what the finding implied to the team but still doesn’t offer a real-world example as illustration."},{"i":"2e744883","c":"func","d":"H","s":"Historians have argued that a crucial component of the Civil Rights Movement’s success in the 1960s was the Southern Christian Leadership Conference’s Citizen Education Program (CEP), which invited promising activists from across the South to its one-week training sessions in Dorchester, Georgia. Led by experienced organizers such as Dorothy Cotton and Septima Clark, CEP attendees<u>—more than 7,000 in all—<\/u> participated in workshops on topics ranging from public speaking to legal doctrine before returning home and using their newly acquired knowledge to spearhead local civil rights initiatives.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It underscores the extent of the CEP’s impact on the Civil Rights Movement of the 1960s.","It illustrates the CEP organizers’ efforts to educate participants on a wide variety of topics.","It suggests that CEP attendees held a diverse array of opinions about the Southern Christian Leadership Conference’s political philosophy.","It establishes that criticism of the CEP was limited to a few individuals in the Southern Christian Leadership Conference."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first sentence of the text states that the CEP had a positive impact on the Civil Rights Movement in the 1960s. The next sentence explains that the CEP organized workshops for attendees, who later used the knowledge they gained to lead civil rights initiatives. And the underlined portion indicates the number of activists—more than 7,000—who participated in the workshops. Thus, the underlined portion provides a number that underscores the extent of the CEP’s impact on the Civil Rights Movement in the 1960s. Choice B is incorrect. Although the sentence that contains the underlined portion mentions some CEP workshop topics, the underlined portion itself addresses the number of participants in the CEP workshops, not the number of topics covered. Choice C is incorrect. Although the underlined portion refers to attendees of the CEP workshops, nothing in the underlined portion or the text as a whole addresses the Southern Christian Leadership Conference’s philosophy or the attendees’ opinions thereof. Choice D is incorrect because neither the underlined portion nor the text as a whole mentions any criticism of the CEP by members of the Southern Christian Leadership Conference."},{"i":"f631132b","c":"structure","d":"M","s":"In the Here and Now Storybook (1921), educator Lucy Sprague Mitchell advanced the then controversial idea that books for very young children should imitate how they use language, since toddlers, who cannot yet grasp narrative or abstract ideas, seek reassurance in verbal repetition and naming. The most enduring example of this idea is Margaret Wise Brown’s 1947 picture book Goodnight Moon, in which a young rabbit names the objects in his room as he drifts off to sleep. Scholars note that the book’s emphasis on repetition, rhythm, and nonsense rhyme speaks directly to Mitchell’s influence.\n\nWhich choice best describes the overall structure of the text?","o":["The text outlines a debate between two authors of children’s literature and then traces how that debate shaped theories on early childhood education.","The text summarizes an argument about how children’s literature should be evaluated and then discusses a contrasting view on that subject.","The text lists the literary characteristics that are common to many classics of children’s literature and then indicates the narrative subjects that are most appropriate for young children.","The text presents a philosophy about what material is most suitable for children’s literature and then describes a book influenced by that philosophy."],"a":3,"r":"Choice D is the best answer. The text starts by introducing Mitchell’s philosophy about using simple, repetitive language in books for young children. Then it describes a book influenced by that philosophy, Goodnight Moon. Choice A is incorrect. Although two authors are mentioned in the text, they both agree about the type of language that should be contained in books for young children. Choice B is incorrect. The text never discusses the evaluation of children’s literature. It does provide one view of how children’s books should be written, but never introduces a competing view. Choice C is incorrect. The text doesn’t mention “many classics of children’s literature.” Instead, it describes an educational theory and identifies one example of a famous children’s book that was influenced by that theory."},{"i":"8889d6e2","c":"cross","d":"M","s":"Text 1 An excavation in Chiquihuite Cave in central Mexico has upended the belief that approximately 13,000 years ago, a group known as the Clovis people were the first human inhabitants of North America. More than 200 crude stone tools were found embedded in a layer of earth that is up to 33,150 years old, <u>revealing that humans occupied the cave thousands of years before the Clovis people reached the continent.<\/u>\n\nText 2 The objects uncovered in Chiquihuite Cave are intriguing, but it is premature to characterize them as tools. The stone pieces are so roughly shaped that they may have simply fractured from rocks during natural geological activity in the cave. Moreover, their unearthing has thus far not been accompanied by discoveries of other signs of human activity or even traces of human DNA from surfaces.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the underlined claim in\n\nText 1?","o":["By suggesting that it draws a plausible connection between two groups of people but will need to be confirmed with further study","By asserting that it rests on an assumption about the stone pieces that is not sufficiently supported by available evidence","By acknowledging that it will most likely be proved correct when the stone pieces undergo more detailed analysis","By pointing out that it fails to account for evidence that the Clovis people were active on the continent as early as is commonly thought"],"a":1,"r":"Choice B is the best answer because it reflects how the author of Text 2 would most likely respond to the underlined claim about the Clovis people in Text 1. Text 1 explains that the idea that the Clovis people were the first human inhabitants of North America has been overturned by the unearthing of stone tools in Chiquihuite Cave in Mexico. The tools were found in a layer of earth that is over 33,000 years old—much older than the Clovis people’s arrival 13,000 years ago. The text ends with the claim that the tools reveal that humans lived in the cave long before the Clovis people reached the continent. Text 2, on the other hand, disputes the idea that the stone pieces are definitely tools. Text 2 states that the pieces are so roughly shaped that they may have simply naturally broken off from rocks and, moreover, that no other signs of human activity have been found in the cave. In other words, Text 2 argues that there is no proof yet that humans made the pieces as tools or were even present in the cave. Therefore, the author of Text 2 would most likely say that the claim that humans occupied Chiquihuite Cave long before the Clovis people reached North America rests on an assumption about the stone pieces—that they are human-made tools—that is not sufficiently supported by available evidence. Choice A is incorrect because Text 1 doesn’t claim that human inhabitants of Chiquihuite Cave and the Clovis people had any connection; the author of Text 1 focuses only on the timing of each group’s presence in North America. Further, the author of Text 2 makes no mention of the Clovis people and indicates that it isn’t clear yet that any human group did inhabit Chiquihuite Cave. Choice C is incorrect because nothing in Text 2 suggests that the author believes the stone pieces probably are human-made tools and will be confirmed as such by further analysis; instead, the author of Text 2 emphasizes the current lack of evidence of human activity in the cave. Choice D is incorrect because Text 2 focuses on the issue of characterizing the stone pieces as tools made by humans, not on the timing of any particular group’s activity in North America; further, Text 1 seems to support the common belief that the Clovis people reached North America 13,000 years ago and challenges only the idea that they were the continent’s first inhabitants. Therefore, there’s no reason to think the author of Text 2 would say that the author of Text 1 overlooks evidence that the Clovis people were active as early as is commonly thought."},{"i":"40630cef","c":"main","d":"E","s":"The following text is from David Barclay Moore’s 2022 novel Holler of the Fireflies. The narrator has just arrived at summer camp, which is far away from his home. This place was different than I thought it would be. I’d never been somewhere like this before. I did feel scared, but also excited. ©2022 by David Barclay Moore According to the text, how does the narrator feel about being at summer camp?","o":["He feels overjoyed.","He feels peaceful.","He feels both scared and excited.","He feels both angry and jealous."],"a":2,"r":"Choice C is the best answer because it most accurately states how the narrator feels about being at summer camp. In the text, the narrator states that after arriving at the camp, he found it to be different than he’d expected and that as a result, he felt \"scared, but also excited.\" Choice A is incorrect. In the text, the narrator describes himself as \"excited.\" Although excitement is a positive emotion, it isn’t as intensely positive as feeling overjoyed is. Moreover, the narrator also notes that he felt \"scared.\" In other words, his excitement (a positive emotion) is balanced with fear (a negative emotion). Given this mixture of positive and negative emotions, it would be inaccurate to characterize the narrator as overjoyed. Choice B is incorrect because in the text, the narrator describes himself as having felt both fear and excitement. Neither of these emotions can be thought of as peaceful and, in fact, are almost the opposite of a sense of peace. Choice D is incorrect because in the text, the narrator describes himself as both \"scared\" and \"excited,\" not angry and jealous."},{"i":"835545cd","c":"main","d":"M","s":"The following text is adapted from Charles W. Chesnutt’s 1901 novel The Marrow of Tradition. Mrs. Ochiltree was a woman of strong individuality, whose comments upon her acquaintance[s], present or absent, were marked by a frankness at times no less than startling. This characteristic caused her to be more or less avoided. Mrs. Ochiltree was aware of this sentiment on the part of her acquaintance[s], and rather exulted in it.\n\nBased on the text, what is true about Mrs. Ochiltree’s acquaintances?","o":["They try to refrain from discussing topics that would upset Mrs. Ochiltree.","They are unable to spend as much time with Mrs. Ochiltree as she would like.","They are too preoccupied with their own concerns to speak with Mrs. Ochiltree.","They are likely offended by what Mrs. Ochiltree has said about them."],"a":3,"r":"Choice D is the best answer because it presents a statement about Mrs. Ochiltree’s acquaintances that is supported by the text. The text indicates that Mrs. Ochiltree makes comments about her acquaintances that are frank, or direct and blunt, and sometimes startling. It also states that because of this behavior, the acquaintances tend to avoid Mrs. Ochiltree. Together, these details suggest that the acquaintances choose not to be around Mrs. Ochiltree because they are offended by the things she has said about them. Choice A is incorrect because the text doesn’t suggest that Mrs. Ochiltree’s acquaintances avoid discussing topics that would upset Mrs. Ochiltree; instead, it states that they avoid being around Mrs. Ochiltree at all. Choice B is incorrect because the text makes it clear that Mrs. Ochiltree knows her acquaintances often avoid her and is pleased about it (she “rather exulted in it”), not that she wants to spend more time with them. Choice C is incorrect because the text doesn’t suggest that Mrs. Ochiltree’s acquaintances don’t speak with Mrs. Ochiltree because they are too focused on their own concerns, but rather because they don’t like the frank comments she makes."},{"i":"bcbcc43f","c":"infer","d":"M","s":"The ancient Sumerian civilization formed around 4000 BCE between two large rivers in an area that is now Iraq and Syria. The extremely hot and sunny weather in that area helped crops grow very quickly, but it also made it hard to keep the crops from drying up and dying. So, the Sumerians used water from the rivers in their farming. That method worked so well that they often could harvest even more crops than they needed in a season. As a result, the Sumerians ______ Which choice most logically completes the text?","o":["harvested crops only on the hottest days of each season.","found ways to shield their crops from the sun.","did not begin farming until long after 4000 BCE.","were able to store extra crops for later use."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically completes the text’s discussion of Sumerian civilization and crop growth. The text mentions the hot, sunny weather in the area where the Sumerians lived, which made crops grow quickly but also made it difficult to keep them alive. The Sumerians solved this problem by using river water for their farming—as a result, they often harvested more crops than were needed in a season. It follows that the Sumerians must have needed to find something to do with the surplus crops—that is, they stored the extra crops for later use. Choice A is incorrect because it doesn’t logically follow that a surplus in crops would lead the Sumerians to choose only certain days of the season to harvest. Nor is there any indication in the text that the Sumerians improved their farming methods with the goal of reducing the time spent farming. Choice B is incorrect because the text doesn’t suggest that the Sumerians tried to shield their crops from the sun: in fact, the text indicates that the sunny weather helped crops grow very quickly and that the Sumerians used river water to allow crops to be exposed to the sun without dying. Choice C is incorrect. Having a surplus of crops wouldn’t have caused the Sumerians to begin farming until long after 4000 BCE: in fact, since the text indicates that the Sumerian civilization formed around 4000 BCE and farming was a part of that civilization, the statement that Sumerians only began farming long after 4000 BCE isn’t supported by the text."},{"i":"df654a2b","c":"infer","d":"M","s":"Zines are small-scale, self-printed magazines. They have been around since the Black literary zine Fire!! was created in the 1920s. Since then, zines have appealed to creators looking for an inexpensive form of expression to share with a select audience. Zine creators often mix art with social commentary and challenge mainstream culture. At first, the internet appeared to replace the zine, but this old form persists. Today, there are enough zines in the United States to support annual zine festivals. This suggests that ______ Which choice most logically completes the text?","o":["creators can reach a larger audience by posting online.","zines are still a meaningful form of expression.","creators can continue to explore new art forms.","zines are good sources of mainstream culture."],"a":1,"r":"Choice B is the best answer because it most logically follows from the text’s point about zines today. The text describes zines as a form of expression that goes back to the 1920s and asserts that \"this old form persists.\" The text then indicates that multiple zines exist in the US today and that they are popular enough to support annual festivals, a point that suggests that people continue to view zines as a meaningful form of expression. Choice A is incorrect because the text’s point about current interest in zines in the US doesn’t logically suggest that zine creators can reach a larger audience by posting online. The text indicates that zines have long had an audience, and there’s no indication that online posts have caused that audience to grow; there’s no mention of zine creators’ use of the internet at all. Choice C is incorrect because the idea that zine creators can explore new art forms—while objectively true—isn’t logically connected to the text’s discussion of zines as an existing form of expression (one that often includes art) or the point that zines are still popular enough in the US to support annual festivals. Choice D is incorrect because the point that zines are popular enough in the US today to support annual festivals doesn’t logically suggest that zines present mainstream culture (or are themselves mainstream); moreover, the text states that zine creators often \"challenge mainstream culture.\""},{"i":"47f2cddd","c":"claim","d":"E","s":"“The Rock and the Sea” is an 1893 poem by Charlotte Perkins Gilman. In the poem, a rock is portrayed as intending to confront and restrain the sea: ______ Which quotation from “The Rock and the Sea” most effectively illustrates the claim?","o":["“I am the Rock. Black midnight falls; / The terrible breakers rise like walls; / With curling lips and gleaming teeth / They plunge and tear at my bones beneath.”","“I am the Sea. I hold the land / As one holds an apple in his hand, / Hold it fast with sleepless eyes, / Watching the continents sink and rise.”","“I am the Rock, presumptuous Sea! / I am set to encounter thee. / Angry and loud or gentle and still, / I am set here to limit thy power, and I will!”","“I am the Sea. The earth I sway; / Granite to me is potter’s clay; / Under the touch of my careless waves / It rises in turrets and sinks in caves.”"],"a":2,"r":"Choice C is the best answer. This quotation focuses on the rock, which yells at the sea and announces its intent to “limit [the sea’s] power.” This matches the idea of confrontation and restraint in the claim we’re trying to support. Choice A is incorrect. This choice doesn’t illustrate the claim. While this quotation does focus on the rock, it suggests that the rock fears the sea. It lacks the sense of boldness and strength implied by the phrase “confront and restrain the sea.” Choice B is incorrect. This choice doesn’t illustrate the claim. This quotation focuses on the sea, not the rock. Choice D is incorrect. This choice doesn’t illustrate the claim. This quotation focuses on the sea, not the rock."},{"i":"b4cda84d","c":"claim","d":"M","s":"In 1967 the US Congress created the Corporation for Public Broadcasting, which in turn created National Public Radio (NPR). NPR began producing and distributing high-quality news and cultural programming to affiliate stations across the United States in 1971. In a research paper, a student claims that the Corporation for Public Broadcasting and NPR were inspired by the British Broadcasting System (BBC), which had been established in the 1920s.\n\nWhich quotation from a work by a historian would be the most effective evidence for the student to include in support of this claim?","o":["“Although the BBC had begun as a private corporation, politicians successfully argued to make it a public company because they believed a public broadcaster could help build national unity in the aftermath of World War I.”","“For many decades, the BBC had no competition since it held Britain’s only broadcasting license, whereas in the United States, the Corporation for Public Broadcasting launched NPR in a broadcasting market already filled with competitors.”","“Congress’s embrace of publicly funded broadcasting reflected a common belief among US politicians that the role of government was not only to ensure people’s safety and liberty but also to enrich people’s lives in other ways.”","“The goal of the BBC was to support British democracy by promoting an informed citizenry, and US legislators believed that ensuring access to high-quality programming could do the same for democracy in the United States.”"],"a":3,"r":"Choice D is the best answer because this quotation would be the most effective evidence to include in support of the claim that the Corporation for Public Broadcasting and NPR were inspired by the British Broadcasting System (BBC). The quotation states that the goal of the BBC was to support British democracy and that US legislators believed high-quality programming could accomplish the same goal for democracy in the United States. In other words, US legislators looked to the BBC as a model, taking direct inspiration from it when they created the Corporation for Public Broadcasting, which in turn created NPR. Choice A is incorrect because this quotation provides historical information about the BBC, not information about the inspiration for the creation of the Corporation for Public Broadcasting and NPR. This quotation, therefore, is irrelevant to the student’s claim that the BBC inspired the creation of the Corporation for Public Broadcasting, which in turn created NPR. Choice B is incorrect because this quotation contrasts the lack of competition faced by the BBC with the substantial competition faced by NPR, which has no bearing on the student’s claim that the Corporation for Public Broadcasting and NPR were inspired by the BBC. Choice C is incorrect because this quotation focuses on a common belief among US politicians that inspired Congress’s embrace of publicly funded broadcasting. The quotation doesn’t say anything about the BBC and therefore doesn’t support the claim that the BBC inspired Congress to create the Corporation for Public Broadcasting, which in turn created NPR."},{"i":"a9ac31e4","c":"graph","d":"E","s":"","o":["a larger area than either the Fiescher glacier or the Unteraar glacier.","a smaller area than the Fiescher glacier but a larger area than the Unteraar glacier.","a smaller area than either the Fiescher glacier or the Unteraar glacier.","a larger area than the Fiescher glacier but a smaller area than the Unteraar glacier."],"a":0,"r":"Choice A is the best answer. The claim is that measurements such as total area can be used to compare glaciers. The graph shows us the area measurements for three glaciers. Of those, Gorner has the largest area. Choice B is incorrect. This choice misreads the graph. The graph shows that Gorner has the largest area of the three. Choice C is incorrect. This choice misreads the graph. The graph shows that Gorner has the largest area of the three. Choice D is incorrect. This choice misreads the graph. The graph shows that Gorner has the largest area of the three."},{"i":"ccb1ab92","c":"graph","d":"H","s":"","o":["didn’t show significantly less REM sleep during the second day after returning to land than they did during the first day.","showed no significant differences from one another in baseline levels of REM sleep.","didn’t consistently demonstrate a significant increase in REM sleep after their period of deprivation in the water.","showed no significant difference between REM sleep after returning to land and REM sleep while in the water."],"a":2,"r":"Choice C is the best answer. If REM sleep were homeostatically regulated in fur seals, then all the seals would compensate with REM levels significantly over baseline after going weeks without REM. We’d also expect the seals to maintain those elevated REM levels for some time. Since seals B and C return very quickly to baseline REM levels, this suggests that REM sleep in fur seals may not be regulated homeostatically. Choice A is incorrect. This doesn’t support the conclusion. If REM sleep were homeostatically regulated in fur seals, then we’d suspect the seals to sustain REM levels well above baseline for a prolonged period in order to compensate for weeks of REM deprivation while in the water. Whether or not there’s a reduction in REM sleep from day 1 to day 2 doesn’t tell us how REM sleep on those days relates to baseline, which is where our focus should be. Choice B is incorrect. The y-axis of this graph doesn’t depict baseline levels of REM sleep, but rather shows REM sleep as a percent of baseline. Choice D is incorrect. The graph doesn’t depict REM sleep while in the water for the seals in the study. Additionally, we’re told fur seals get no REM sleep while in the water, which is significantly different to the values shown in the graph for after they return to land."},{"i":"42cc9236","c":"fss","d":"E","s":"If you try on one of artist Nick Cave’s signature Soundsuits, you can expect to swish, rustle, or clang every time you move. Cave makes his suits out of found objects, everything from ceramic birds to broken record players. He carefully considers the sound an object makes before using ______ in a suit.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["this","that","these","it"],"a":3,"r":"Choice D is the best answer. The convention being tested here is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"object.\" Choice A is incorrect. The singular pronoun \"this\" is used to refer to a specific thing, but here there is no specific object being referred to. Instead, the sentence is referring back to a hypothetical object that Cave might use in a Soundsuit. Choice B is incorrect. The singular pronoun \"that\" is used to refer to a specific thing, but here there is no specific object being referred to. Instead, the sentence is referring back to a hypothetical object that Cave might use in a Soundsuit. Choice C is incorrect because the plural pronoun \"these\" doesn’t agree in number with the singular antecedent \"object.\""},{"i":"4c335aea","c":"fss","d":"H","s":"In a recent analysis of lyrical trends in 350,000 songs, researchers cite increases in certain measures, such as the ratio of choruses to verses, as evidence music lyrics are becoming more repetitive. For instance, from 1970 to 2020, ______ chorus-to-verse ratios trended similarly, with each genre’s data indicating that relative to the number of unique verses, the number of repeated choruses in songs increased.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["rocks and raps","rock’s and rap’s","rocks and rap’s","rock and rap’s"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of possessive nouns. The singular possessive nouns \"rock’s\" and \"rap’s\" correctly indicate that the chorus-to-verse ratios belong to the genres of rock and rap. Choice A is incorrect because the context requires the singular possessive nouns \"rock’s\" and \"rap’s,\" not the plural nouns \"rocks\" and \"raps.\" Choice C is incorrect because the context requires the singular possessive noun \"rock’s,\" not the plural noun \"rocks.\" Choice D is incorrect because the context requires the singular possessive noun \"rock’s,\" not the singular noun \"rock.\" This choice incorrectly suggests that there was a single chorus-to-verse ratio for rock and rap together, whereas the ratio was calculated for each genre individually."},{"i":"50445680","c":"fss","d":"E","s":"In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food availability than by food preference. Although the monkeys prefer to eat vegetation and land-dwelling invertebrates, those food sources may become unavailable because of extensive snow and ice cover, ______ the monkeys to hunt for marine animals in any streams that have not frozen over.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["forces","to force","forcing","forced"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of finite and nonfinite verb forms within a sentence. The nonfinite present participle “forcing” is correctly used to form a participial phrase that supplements the main clause “those...cover,” describing the effects on monkeys of the lack of food sources. Choice A is incorrect because the finite present tense verb “forces” can’t be used in this way to supplement the main clause (“those...cover”). Choice B is incorrect. While the nonfinite to-infinitive “to force” could be used to form a subordinate clause that supplements the main clause (“those...cover”), to-infinitives conventionally express purpose, and nothing in the sentence suggests that the food sources become unavailable for the purpose of forcing monkeys to hunt marine animals. Choice D is incorrect because the finite past tense verb “forced” can’t be used in this way to supplement the main clause (“those...cover”)."},{"i":"9579581e","c":"bound","d":"H","s":"As cheesemaking practices spread throughout Europe and Asia during and after the Neolithic, divergent strategies for preserving milk ______ whereas rennet-coagulated cheesemaking became key to milk preservation in Europe and Southwest Asia, acid-heat coagulation methods became common among nomadic herding populations of the northeastern Eurasian steppe.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["emerged","emerged and","emerged:","emerged,"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use within a sentence. A colon can be used between two main clauses to signal that what follows is an elaboration of what came before. In this choice, the colon correctly introduces the following explanation of the divergent milk preservation strategies that emerged. Choice A is incorrect because it results in a run-on sentence. The main clause (\"As…emerged\") and the subordinate clause followed by another main clause (\"whereas…steppe\") are fused without punctuation and/or a conjunction. Choice B is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join a main clause (\"As…emerged\") and a subordinate clause followed by another main clause (\"whereas…steppe\"). Choice D is incorrect because it results in a comma splice. A comma can’t be used in this way to join a main clause (\"As… emerged\") and a subordinate clause followed by another main clause (\"whereas…steppe\")."},{"i":"1ee4485c","c":"bound","d":"H","s":"Journalists have dubbed Gil Scott-Heron the “godfather of rap,” a title that has appeared in hundreds of articles about him since the 1990s. Scott- Heron himself resisted the godfather ______ feeling that it didn’t encapsulate his devotion to the broader African American blues music tradition as well as “bluesologist,” the moniker he preferred.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["nickname, however","nickname, however;","nickname, however,","nickname; however,"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between a main clause and two supplementary elements. In this choice, the commas after “nickname” and “however” are correctly used to separate the supplementary adverb “however” from the main clause (“Scott-Heron…nickname”) on one side and the supplementary participial phrase (“feeling…bluesologist”) on the other. Choice A is incorrect because it fails to mark the boundary between the supplementary adverb “however” and the supplementary phrase (“feeling…bluesologist”). Choice B is incorrect because a semicolon can’t be used in this way to join the supplementary adverb “however” and the supplementary phrase (“feeling…bluesologist”). Choice D is incorrect because a semicolon can’t be used in this way to join the main clause (“Scott-Heron…nickname”) and the supplementary word and phrase (“however” and “feeling…bluesologist”). Moreover, placing the semicolon after “nickname” illogically signals that the following information (Scott-Heron’s feeling that the nickname didn’t encapsulate his devotion to the blues tradition) is contrary to the information in the previous clause (Scott-Heron’s resistance to the nickname)."},{"i":"94f4eecb","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Las sergas de Esplandián was a novel popular in sixteenth-century Spain. The novel featured a fictional island inhabited solely by Black women and known as California. That same century, Spanish explorers learned of an “island” off the west coast of Mexico. They called it California after the island in the novel. The “island” was actually the peninsula now known as Baja California (“Lower California”), which lies to the south of the US state of California. The student wants to emphasize the role a misconception played in the naming of a place.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The novel Las sergas de Esplandián featured a fictional island known as California.","To the south of the US state of California lies Baja California (“Lower California”), originally called California after a fictional place.","In the sixteenth century, Spanish explorers learned of a peninsula off the west coast of Mexico and called it California.","Thinking it was an island, Spanish explorers called a peninsula California after an island in a popular novel."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes the role a misconception played in the naming of a place, explaining that Spanish explorers mistook a peninsula for an island and, as a result, named the peninsula after a fictional island, California. Choice A is incorrect. The sentence mentions a novel that featured a fictional island, California; it doesn’t emphasize the role a misconception played in the naming of a place. Choice B is incorrect. The sentence notes that Baja California was originally named after a fictional place; it doesn’t emphasize the role a misconception—specifically, the Spanish explorers’ mistaken belief that the peninsula was an island—played in the naming of a place. Choice C is incorrect. The sentence indicates when Spanish explorers learned of the peninsula they called California; it doesn’t emphasize the role a misconception played in the naming of a place."},{"i":"6b5bc97d","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The Sasanian Empire lasted about 400 years (AD 224 to AD 651). The Sasanians controlled an area spanning 1.4 million square miles. This area included present-day Iran and Iraq. The empire’s capital was the ancient city of Ctesiphon. Ctesiphon was located near present-day Baghdad, Iraq. The student wants to specify the location of Ctesiphon.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Sasanian Empire began in AD 224 and ended in AD 651.","The capital of the Sasanian Empire, which spanned 1.4 million square miles, was Ctesiphon.","The Sasanians controlled an area of 1.4 million square miles, including present-day Iran and Iraq.","Ctesiphon, the capital of the Sasanian Empire, was located near present-day Baghdad, Iraq."],"a":3,"r":"Choice D is the best answer. The sentence specifies the location of Ctesiphon, noting that it was located near present-day Baghdad, Iraq. Choice A is incorrect because the sentence explains when the Sasanian Empire began and ended; it doesn’t specify the location of Ctesiphon. Choice B is incorrect because the sentence emphasizes that Ctesiphon was the capital of the Sasanian Empire; it doesn’t specify Ctesiphon’s location. Choice C is incorrect because it emphasizes the size of the Sasanian Empire; it doesn’t specify the location of Ctesiphon."},{"i":"e965fd73","c":"trans","d":"E","s":"Preston Singletary is a Tlingit glass artist who often collaborates with other artists. ______ he has worked with Tewa pottery artist Jody Naranjo several times. Together, Singletary and Naranjo have created pottery-inspired glass pieces such as Sunset Stampede and Kiva Steps.\n\nWhich choice completes the text with the most logical transition?","o":["In conclusion,","For example,","However,","In comparison,"],"a":1,"r":"Choice B is the best answer. \"For example\" logically signals that this sentence—noting Singletary’s work with Jody Naranjo—provides an example supporting the previous point about Singletary’s collaborations with other artists. Choice A is incorrect because \"in conclusion\" illogically signals that the information in this sentence concludes or summarizes the previous point about Singletary’s collaborations with other artists. Instead, it provides an example in support of that point. Choice C is incorrect because \"however\" illogically signals that the information in this sentence contrasts with the previous point about Singletary’s collaborations with other artists. Instead, it provides an example in support of that point. Choice D is incorrect because \"in comparison\" illogically signals that the information in this sentence is being compared to the previous point about Singletary’s collaborations with other artists. Instead, it provides an example in support of that point."},{"i":"63c73b50","c":"trans","d":"E","s":"In 2018, Kurt Luther and Vikram Mohanty created the web-based tool Civil War Photo Sleuth (CWPS). A user uploading an unknown Civil War soldier’s photograph to CWPS first tags the photo with all known information. ______ CWPS’s facial-recognition software analyzes twenty-seven different physical features and looks for matches to tagged images already in the database.\n\nWhich choice completes the text with the most logical transition?","o":["Then,","In fact,","Likewise,","For example,"],"a":0,"r":"Choice A is the best answer. “Then” indicates that the events in this sentence took place after the events in the previous sentence. Only after users upload images of unknown soldiers can those images be analyzed. Choice B is incorrect. This transition is used to emphasize the truth of a statement that modifies the previous statement. But this sentence doesn’t modify the step described in the previous statement: instead, it introduces an entirely new step in the process. So “in fact” wouldn’t make sense here. Choice C is incorrect. This choice uses a transition that indicates the addition of a new but related idea, which doesn’t make sense here. Analyzing the physical features in the uploaded photographs isn’t a similar idea, but rather the next step in the process. Choice D is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. Analyzing physical features is not an example of uploading and tagging an image."}],"img":{"a9ac31e4":"iVBORw0KGgoAAAANSUhEUgAAArwAAAIEBAMAAAAJDeBoAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAAw6UlEQVR42u2dd3xT1fvHP+cm6W7z3FAqItDblqEyTGlBWRKWLJEwBFT0GwRUUH4WAUFADS6mWqYstYpsR9mjgAEE2ZQlKitlOBjNSdnQ5vz+SIG2tuxAoef9einpzZ3vPDnnOSfnngtIJBKJRCKRSCQSiUQikUgkksIPAwAQu9Z6dM0F+Swp8tCl/1/2+8QgmNRo1skr//I7Sn34Wbyvmdm7EQFA7KXtIqTj/6BbDYCQI3bZ+k5swPeze61muVQps2ZPCUkAwMAMiTk+m9Her0AxPMmkzrwE/nOlgPD6NCQDcS+2iRmZs+wAVR4V0yrIdklrDu9R3hhvyipLm/+hVAvSN16sX2bHCxsAemiDFnzMBpQi3eLZdn2jJcqkuai43gxMBBBs81+WgGbryiUoX45Ues/02zQI1Mv/1Q0W6FasfrrjAug22aXTHHQPTvD/PfZp6yzWJshObHHEIb/VAGpryp9xi/R/1g8e9IaytvwcsJ1gCLaFx/5S7Eg5P0cp20T2p3W4rh7YtIDTJVYCw01VRtWxvhg94y5diFIo9da5YME/W1usmi9+LGPm+oCjCzxZADhn5zevhv+KTnO2tTnhiQFz4bUxwPG0w2cn7WH8ze3zHgtKTqv8M0QkUv7NAFzpeG+zVlmsIan3Ss0WNzZObGPhfVuwvp05FCcOAQBUCCfcLBXKqy8drN7HCaFiXzWgRJ/HlFQIRL32jHock4eZAc6cjAGAkQNV+9Xhd+dK9IVS7549xIS4ONQYUKvzLAiNPGAAXN63BUKH4q9FQzjETixtDYx6m8KIzvAL/cIOunGux/eVwQDBATcAgeP9PbJwuELxScNHgWhnmFNZfoojM8bdggkCGBgBYFhZZn9wuQMuYJoNHPRQWuwJG2fa/LA0I4H+yAAEOCNvjsZoTZZL6r2CJRkHngH/dNnuCx1/AjxD924E54CRhBNGCLbx0z+zFu+dAix8cdlL4DPWHbh4YqPgi7//3c3x4vI9gBsEJzDnN4KHT1r+m0wXrrTYlOwktqoGExHAqmbHIaB5AyJGJRZDAFgcMZhiASWWEYqp0GCKYgAUAgEslkHREB0ltebb65B/e1nN1dKlfDZjV92HJFeHwzU/B9mlIJFIJBKJRCK5p5sVjOhaSS279D7JVsQNNSxY7paFmk8jLU/rg4F5mxn036ae5JKkp2xM6a0BZqD4RwAad/Eut1N2XFPEJ5rB7l1bb720XVwOjex function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
