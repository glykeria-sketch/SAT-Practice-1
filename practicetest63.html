<script>
const D={"t":"Practicetest63","q":[{"i":"bbb77c84","c":"vocab","d":"H","s":"Containing over 160 billion base pairs of DNA resulting from polyploidy (whole genome duplication) and accumulation of noncoding DNA without significant deletion, the genome of Tmesipteris oblanceolata (New Caledonian fork fern) is the largest known among eukaryotes—and, given the high biological costs of extremely large genomes, is unlikely to be ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["protracted","superseded","curtailed","obviated"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the fork fern’s enormous genome. In this context, \"superseded\" means surpassed or exceeded by something else. The text establishes that this plant has \"the largest known\" genome among eukaryotes and mentions \"the high biological costs of extremely large genomes,\" suggesting there are natural constraints that make it biologically disadvantageous to maintain such massive genetic material. This context supports the idea that it’s unlikely another organism will evolve an even larger genome that would replace this plant’s record—that is, its status as having the largest genome is unlikely to be superseded. Choice A is incorrect because in this context, \"protracted\" would mean drawn out over time or space, and the text focuses on the record size of the New Caledonian fork fern’s genome and the fact that extremely large genomes carry \"high biological costs.\" This information suggests that the biological upper limit for genome size may have been reached and that the New Caledonian fork fern’s genome is therefore unlikely to be surpassed, or superseded, not that it’s unlikely to be protracted. Choice C is incorrect because in this context, \"curtailed\" would mean cut short or reduced, and the text focuses on the record size of the New Caledonian fork fern’s genome and the fact that extremely large genomes carry \"high biological costs.\" This information suggests that the biological upper limit for genome size may have been reached and that the New Caledonian fork fern’s genome is therefore unlikely to be surpassed, or superseded, not that it’s unlikely to be curtailed. Choice D is incorrect because in this context, \"obviated\" would mean made unnecessary or redundant, and the text focuses on the record size of the New Caledonian fork fern’s genome and the fact that extremely large genomes carry \"high biological costs.\" This information suggests that the biological upper limit for genome size may have been reached and that the New Caledonian fork fern’s genome is therefore unlikely to be surpassed, or superseded, not that it’s unlikely to be obviated."},{"i":"7b4dde72","c":"vocab","d":"H","s":"In 1891, design artist William Morris cofounded the Kelmscott Press, which printed editions of books using preindustrial methods. Historians argue that Morris’s repudiation of industrialization is ______ the Kelmscott editions’ use of handmade materials and intricate ornamentation reminiscent of medieval manuscripts: these meticulously handcrafted elements exemplify the artistry involved.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["insensible to","manifest in","scrutinized by","complicated by"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the Kelmscott Press’s books. In this context, \"manifest in\" means evident or apparent from. The text states that the Kelmscott Press, which was cofounded by William Morris, produced its books using preindustrial methods. The text notes the similarity between those methods, which include the use of handmade materials and intricate ornamentation, and methods used in the creation of medieval manuscripts. This context suggests that Morris’s repudiation of industrialization is apparent from, or manifest in, the methods and materials his company employed. Choice A is incorrect because there is nothing in the text to suggest that Morris’s repudiation of industrialization is \"insensible to,\" or unaware of or lacking perception of, the use of handmade materials and intricate ornamentation in the production of the Kelmscott editions. Instead, the text suggests that the methods and materials used to produce the Kelmscott editions are evidence of Morris’s repudiation of industrialization. Choice C is incorrect because it would not make sense to say that Morris’s repudiation of industrialization was \"scrutinized by,\" or examined closely by, the Kelmscott editions’ use of handmade materials and intricate ornamentation. Although creating the Kelmscott editions may have involved examining the books closely, the text does not mention this aspect of Morris’s work, and in any case, the action of using certain materials to create those editions cannot scrutinize Morris’s attitude toward industrialization. Choice D is incorrect because the text gives no indication that Morris’s repudiation of industrialization is \"complicated by,\" or made more complex or difficult by, the Kelmscott Press’s use of preindustrial methods and handcrafted elements to produce books. Instead, the text presents those methods as exemplifying Morris’s repudiation of industrialization."},{"i":"051d3065","c":"vocab","d":"E","s":"Kelp forests grow underwater along the eastern Pacific Coast. These underwater forests are important to fish and other marine animals. Ocean currents can be powerful and rough, making it difficult for animals to find safe places to hide from predators. The underwater forests slow down the currents. This creates a more ______ environment with calmer waters where animals can take shelter.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["tranquil","dangerous","imaginative","surprising"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of how kelp forests help marine animals. In this context, \"tranquil\" means free from disturbance, or calm. The text indicates that ocean currents are powerful and make it difficult for marine animals to hide from predators and that kelp forests slow currents down to create calmer areas. In other words, kelp forests create a more tranquil environment. Choice B is incorrect because the text indicates that kelp forests provide shelter for marine animals, meaning they create environments that are safer, not more \"dangerous.\" Choice C is incorrect because the text discusses how kelp forests affect currents in the ocean, and it isn’t clear how an ocean environment could be \"imaginative,\" or full of imagination. Choice D is incorrect because the text indicates that kelp forests create a calm and safe environment, and an environment that is \"surprising\" would be characterized by unexpected occurrences, not calmness."},{"i":"213248f7","c":"vocab","d":"E","s":"The following text is adapted from Lewis Carroll’s 1865 novel Alice’s Adventures in Wonderland. “The second thing is to find my way into that lovely garden. I think that will be the best plan.” It sounded like an excellent plan, no doubt, and very neatly and simply arranged; the only difficulty was, that Alice had not the smallest idea how to set about it.\n\nAs used in the text, what does the word “simply” most nearly mean?","o":["Faintly","Hastily","Easily","Foolishly"],"a":2,"r":"Choice C is the best answer because as used in the text, “simply” most nearly means easily, or involving minimal difficulty or effort. The text first provides Alice’s reflections on her plan to gain access to a garden and then offers commentary on her plan by the novel’s narrator. The text indicates that a reason Alice likes her plan despite not being fully thought through is that she nonetheless believes it can be efficiently arranged. In other words, the text indicates that one of the supposed benefits of Alice’s plan is that it can be easily arranged. Choice A is incorrect because the text describes how Alice’s plan can be arranged, and it wouldn’t make sense to say that it can be arranged “faintly,” or with little strength or not strongly. Instead, the text indicates that the plan can be arranged with little difficulty. Choice B is incorrect. Although in some contexts “simply” can mean quickly, hastily, or hurriedly, the word “hastily” indicates that something is done too quickly. Although it may be true that Alice’s plan was made in haste, the text doesn’t focus on this aspect of her plan. Instead, the text focuses on the plan’s seemingly good qualities, saying that Alice thinks of it as “the best,” and the narrator refers to it as “excellent” and “neatly,” or efficiently, arranged. Choice D is incorrect. Although in some contexts “simply” can mean foolishly, or lacking good sense, it doesn’t have this meaning in this context. Although the text says that Alice doesn’t know how to go about her plan, it begins by presenting her plan in a positive light: Alice describes her plan as “the best,” and the narrator refers to the plan as “excellent” and “neatly,” or efficiently, arranged."},{"i":"be947479","c":"purpose","d":"E","s":"Jazz tap is a dance form that was first developed in African American communities. Jazz tap was heavily influenced by jazz music, which became widely popular in the United States in the 1920s. Tap dancers were inspired by jazz music’s quick rhythms and by the way jazz musicians would make up melodies as they played. As jazz music continued to develop in the 1930s and 1940s, jazz tap evolved with it. Because of jazz music’s influence, jazz tap quickly developed into a dance form that was very different from earlier kinds of tap dance.\n\nWhich choice best states the main purpose of the text?","o":["It explains why audiences prefer some kinds of music over others.","It discusses the development of a dance form.","It describes how to play a musical instrument.","It emphasizes the popularity of a famous dancer."],"a":1,"r":"Choice B is the best answer because it best describes the main purpose of the text. The text indicates where and when jazz tap first developed (in African American communities in the 1920s) and what influenced it (the quick rhythms and improvisations in jazz music) and then explains that it evolved alongside jazz music in the 1930s and 1940s, resulting in a very different form of tap dance than had existed before. Therefore, the main purpose of the text is to discuss jazz tap’s development. Choice A is incorrect. Although the text indicates that jazz music became widely popular in the US in the 1920s and describes some of jazz music’s qualities, the text never explains why audiences prefer some kinds of music—jazz or otherwise—over others. Choice C is incorrect because the text never mentions any musical instruments and doesn’t describe how to play one. Choice D is incorrect because the text discusses jazz tap generally and never identifies a particular dancer, famous or otherwise."},{"i":"b0f7541b","c":"purpose","d":"H","s":"The following text is adapted from Herman Melville’s 1857 novel The Confidence-Man. Humphry Davy was a prominent British chemist and inventor. Years ago, a grave American savant, being in London, observed at an evening party there, a certain coxcombical fellow, as he thought, an absurd ribbon in his lapel, and full of smart [banter], whisking about to the admiration of as many as were disposed to admire. Great was the savant’s disdain; but, chancing ere long to find himself in a corner with the jackanapes, got into conversation with him, when he was somewhat ill-prepared for the good sense of the jackanapes, but was altogether thrown aback, upon subsequently being [informed that he was] no less a personage than Sir Humphry Davy.\n\nWhich choice best states the main purpose of the text?","o":["It portrays the thoughts of a character who is embarrassed about his own behavior.","It presents an account of a misunderstanding.","It offers a short history of how a person came to be famous.","It explains why one character dislikes another."],"a":1,"r":"Choice B is the best answer. The text tells a story of a first impression that turned out to be wrong: a serious American savant was dismissive of a goofy-looking, wisecracking guest at a British party, and then was shocked to learn that the guest was actually a prominent British chemist and inventor. Choice A is incorrect. This is too strong and too narrow. Only at the very end is the savant \"thrown aback\" by the fact that the man was Sir Humphry Davy—he’s not \"embarrassed about his own behavior.\" Choice C is incorrect. This isn’t the main purpose. The text never provides the history of how Sir Humphry Davy came to be famous. Nor does it provide any history for the American savant. Choice D is incorrect. This is too narrow. It doesn’t include the second half of the text, where the savant gets into a conversation with the man and then finds out that the man is Sir Humphry Davy."},{"i":"236fee8e","c":"func","d":"M","s":"Archeological excavation of Market Street Chinatown, a nineteenth-century Chinese American community in San Jose, California, provided the first evidence that Asian food products were imported to the United States in the 1800s: bones from a freshwater fish species native to Southeast Asia. <u>Jinshanzhuang—Hong Kong–based import/export firms—likely coordinated the fish’s transport from Chinese-operated fisheries in Vietnam and Malaysia to North American markets.<\/u> This route reveals the (often overlooked) multinational dimensions of the trade networks linking Chinese diaspora communities.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It explains why efforts to determine the country of origin of the items mentioned in the previous sentence remain inconclusive.","It provides information that helps support a claim about a discovery’s significance that is presented in the following sentence.","It traces the steps that were taken to locate and recover the objects that are described in the previous sentence.","It outlines a hypothesis that additional evidence discussed in the following sentence casts some doubt on."],"a":1,"r":"Choice B is the best answer. The underlined sentence provides information about import/export firms, showing how Chinese communities across the world were connected by trade routes. Choice A is incorrect. The underlined sentence never suggests that the countries of origin of the fish are in question—in fact, it tells us exactly where they came from. Choice C is incorrect. The passage never describes the steps taken to discover the fish bones described in the previous sentence. Choice D is incorrect. The underlined sentence doesn’t outline a hypothesis but instead provides evidence. And the following sentence agrees with the underlined sentence, so we could eliminate this choice just for saying that the following sentence \"casts some doubt on\" the underlined one—partly wrong is all wrong."},{"i":"29741ebc","c":"func","d":"E","s":"In the past, historians who wanted to examine Frederick Douglass’s diary and other personal papers had to visit the Library of Congress in Washington, DC, to view them on microfilm <u>(film containing scaled-down reproductions of documents)<\/u>. But traveling to the library often added time and costs to research projects. Now, by going to the library’s website, researchers can access digitized versions of Douglass’s papers without physically going anywhere.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It gives information about a famous person.","It explains the meaning of a word.","It describes a debate among historians.","It summarizes an unexpected finding."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The underlined portion is a parenthetical phrase directly following the word “microfilm,” and it describes film containing small (“scaled-down”) images; the placement and focus of the portion indicate that it is serving to define the term “microfilm.” Choice A is incorrect. Although the text is about accessing the writings of a famous historical figure (Douglass), the underlined portion doesn’t give information about Douglass or any other person. Instead, it explains what microfilms are. Choice C is incorrect because the text never describes any kind of debate or disagreement; it simply describes a change in how researchers can access historical documents, with the underlined portion defining an important term. Choice D is incorrect because the text never makes any mention of a particular finding, unexpected or otherwise; it simply describes a change in how researchers do some of their work, with the underlined portion defining an important term."},{"i":"88bb0f6f","c":"cross","d":"E","s":"Text 1 A team led by Bernardo Strassburg has found that rewilding farmland (returning the land to its natural state) could help preserve biodiversity and offset carbon emissions. The amount of farmland that would need to be restored, they found, is remarkably low. Rewilding a mere 15% of the world’s current farmland would prevent 60% of expected species extinctions and help absorb nearly 299 gigatons of carbon dioxide—a clear win in the fight against the biodiversity and climate crises.\n\nText 2 While Strassburg’s team’s findings certainly offer encouraging insight into the potential benefits of rewilding, it’s important to consider potential effects on global food supplies. The researchers suggest that to compensate for the loss of food-producing land, remaining farmland would need to produce even more food. Thus, policies focused on rewilding farmland must also address strategies for higher-yield farming.\n\nWhich choice best describes a difference in how the author of\n\nText 1 and the author of\n\nText 2 view Strassburg’s team’s study?","o":["The author of Text 2 approaches the study’s findings with some caution, whereas the author of Text 1 is optimistic about the reported potential environmental benefits.","The author of Text 2 claims that the percentage of farmland identified by Strassburg’s team is too low for rewilding to achieve meaningful results, whereas the author of Text 1 thinks the percentage is sufficient.","The author of Text 2 believes that the results described by Strassburg’s team are achievable in the near future, whereas the author of Text 1 argues that they likely aren’t.","The author of Text 2 focuses on rewilding’s effect on carbon emissions, whereas the author of Text 1 focuses on its effect on biodiversity."],"a":0,"r":"Choice A is the best answer. Text 1 is extremely positive about Strassburg’s team’s findings, calling the potential results \"a clear win in the fight against the biodiversity and climate crises.\" Text 2 is not as positive, arguing that while the findings point to \"potential benefits,\" we also need to consider the \"potential effects on global food supplies.\" Choice B is incorrect. This isn’t a difference between the two views. Text 1 does present the 15% number as enough to achieve meaningful results, but that’s not what Text 2 takes issue with: rather, Text 2 argues that we need to consider the effect that rewilding this much farmland would have on food supplies. Choice C is incorrect. This isn’t a difference between the two views. Neither text mentions the timeline for achieving the results described by Strassburg’s team. Choice D is incorrect. This isn’t a difference between the two views. Text 1 focuses on rewilding’s effects on both carbon emissions and biodiversity. Text 2 doesn’t focus on rewilding’s effect on carbon emissions at all. Instead, it focuses on a third factor: global food supplies."},{"i":"70aacc03","c":"main","d":"H","s":"Elizabeth Asiedu has identified a negative correlation between the share of developing countries’ economies derived from natural-resource extraction and those countries’ receipts of foreign investment. This may appear counterintuitive—resource extraction requires initial investments (in extractive technology, for instance) at scales best met by multinational corporations—but Asiedu notes that natural-resource industries’ boom-bust cycle can destabilize local currencies and increase developing countries’ vulnerability to external shocks, creating levels of uncertainty to which foreign investors are typically averse.\n\nWhich choice best states the main idea of the text?","o":["Although it may seem surprising that foreign investment declines in developing countries as natural-resource extraction makes up a larger share of those countries’ economies, that decline happens because resource extraction requires initial investments too large for foreign investors to supply.","Although developing countries tend to become less dependent on foreign investment as natural-resource industries make up a larger share of their economies, this change may not occur if the boom-bust cycle of those industries destabilizes local currencies or increases countries’ vulnerability to external shocks.","Although one might expect that foreign investment would increase as natural-resource extraction makes up a larger share of developing countries’ economies, the opposite happens because heavy reliance on natural resources can lead to unattractive conditions for investors.","Although foreign investors tend to avoid initial investments in natural-resource industries in developing countries, foreign investment may increase significantly as those industries stabilize and the risks associated with them decline."],"a":2,"r":"Choice C is the best answer because it accurately states the main idea of the text. According to the text, contrary to what some might expect, foreign investment is typically lower in developing countries whose economies are more dependent on natural-resource extraction. The text explains that high reliance on natural-resource extraction can subject a developing country to economic shocks that can destabilize the local currency and introduce economic uncertainty that tends to keep investors away. In other words, although we may think otherwise, foreign investors are less willing to invest in projects in developing countries whose economies are heavily dependent on natural-resource extraction because those economies tend to exhibit instability that investors want to avoid. Choice A is incorrect. The text does indicate that foreign investment is typically lower in developing countries whose economies are more dependent on natural-resource extraction; the text further indicates that natural-resource extraction requires substantial initial investments (to acquire things like required technologies) for which there are fewer investors willing to participate at this stage than one might think. But the text does not implicate the cost of these initial investments as a reason why foreign investment is less widely available than some might think. Choice B is incorrect. The text indicates that greater dependence on natural-resource extraction makes a developing country less appealing to foreign investors because of associated economic instability. Rather than arguing that the goal of developing countries is to become less dependent on foreign investment, as the phrasing of choice B suggests, the text focuses only on why foreign investors become less involved with such countries, which suggests that more investment would be preferable. Choice D is incorrect. Although the text indicates that natural- resource extraction requires substantial initial investments (to acquire things like required technologies) and that there are fewer likely investors willing to participate at this stage than one might think, the text does not address what investors are likely to do over time as the industry stabilizes itself."},{"i":"d1b8a9ad","c":"main","d":"H","s":"Disco remains one of the most ridiculed popular music genres of the late twentieth century. But as scholars have argued, the genre is far less superficial than many people believe. Take the case of disco icon Donna Summer: she may have been associated with popular songs about love and heartbreak (subjects hardly unique to disco, by the way), but like many Black women singers before her, much of her music also reflects concerns about community and identity. These concerns are present in many of the genre’s greatest songs, and they generally don’t require much digging to reveal. What does the text most strongly suggest about the disco genre?","o":["It has been unjustly ignored by most scholars despite the importance of the themes addressed by many of the genre’s songs.","It evolved over time from a superficial genre focused on romance to a genre focused on more serious concerns.","It has been unfairly dismissed for the inclusion of subject matter that is also found in other musical genres.","It gave rise to a Black women’s musical tradition that has endured even though the genre itself faded in the late twentieth century."],"a":2,"r":"Choice C is the best answer. The text argues that disco is \"far less superficial\" than its popular perception might indicate, and that love and heartbreak are \"subjects hardly unique to disco.\" Choice A is incorrect. This choice conflicts with the text, which says that scholars argue that disco \"is far less superficial than many people believe.\" Choice B is incorrect. This choice says the opposite of what the text suggests. The writer argues that the genre is not as superficial as commonly believed, but that it always reflected \"concerns about community and identity.\" Choice D is incorrect. The text doesn’t support this choice. There’s nothing in the text about disco giving rise to an enduring Black women’s musical tradition."},{"i":"7afdcca2","c":"infer","d":"M","s":"Over 600 languages are spoken in New York City in addition to English—one can find Amharic spoken in the neighborhood of Norwood, or Ilocano in Woodside. Most speakers of Chinese languages reside in the neighborhood of Flushing (part of New York City’s borough of Queens) and in Chinatown, in the borough of Manhattan. New immigrants from north China, where Mandarin is the primary first language, tend to settle in Queens, while new immigrants from south China, where many people speak Cantonese or Fuzhounese as a first language, tend to settle in Manhattan. It can therefore be inferred that ______ Which choice most logically completes the text?","o":["languages tend to change more rapidly in areas where many languages are spoken than in areas where few languages are spoken.","languages spoken by immigrant peoples can differ significantly in vocabulary and pronunciation from those same languages in their country of origin.","there is a positive correlation between the physical size of a country and the number of languages spoken in that country.","correlations in a country between languages and regions where they are spoken can replicate themselves in a new country to which the original country’s citizens emigrate."],"a":3,"r":"Choice D is the best answer because it logically completes the text’s discussion of patterns of linguistic distribution in New York City. The text explains how Chinese immigrants in New York City tend to settle in different boroughs based on their region of origin in China: those from north China (Mandarin speakers) typically settle in Queens, while those from south China (Cantonese or Fuzhounese speakers) typically settle in Manhattan. This pattern demonstrates that the regional language distribution in China (north versus south) has reproduced itself in New York City (Queens versus Manhattan). Therefore, it can be reasonably inferred that correlations between languages and regions in one country can replicate themselves when citizens of that country emigrate to a new country. Choice A is incorrect because the text doesn’t discuss rates of language change. The text indicates that many languages are spoken in New York City, but it doesn’t provide any information about how quickly these languages might be changing, either in relation to each other or compared to areas where fewer languages are spoken. Choice B is incorrect because the text provides no information about changes in vocabulary or pronunciation of immigrant languages compared to their original forms. The text only discusses where different groups of language speakers tend to settle, not how their languages might have evolved after immigration. Choice C is incorrect because the text doesn’t provide any information about a relationship between a country’s physical size and the number of languages spoken there. While the text mentions that over 600 languages are spoken in New York City, it doesn’t relate this to the physical size of New York or the United States, nor does it suggest that large countries like China have more languages than geographically smaller countries."},{"i":"c95995bc","c":"infer","d":"M","s":"Colonized by Spain in the 1600s, New Mexico is home to a dialect of Spanish that differs significantly from dialects spoken in Spain’s other former colonies in the Americas. Most notably, the New Mexican dialect retains older features of the language that other dialects lost in later centuries. But why would it have done so? New Mexico was so distant from population centers in Spain’s other colonies that it attracted few colonists after its initial colonization. Geographical isolation in turn would have limited the exposure of New Mexican colonists to changes occurring to Spanish grammar and vocabulary elsewhere in the empire. Thus, the present-day uniqueness of the New Mexican dialect suggests the extent to which ______ Which choice most logically completes the text?","o":["a language can protect itself from being influenced by other languages.","the grammar and vocabulary of any given language change from one generation to the next.","geographical isolation can influence how a language develops.","speakers of one dialect of a language can understand speakers of another dialect of that language."],"a":2,"r":"Choice C is the best answer because it is the choice that most logically completes the text. The text mentions a dialect of Spanish spoken in New Mexico, which was colonized by Spain in the 1600s. The text then states that the New Mexican dialect differs greatly from other Spanish dialects in that it still has characteristics of an older Spanish that other dialects eventually lost. After asking why this might be, the text points out that the New Mexico colony was distant from Spain’s other colonies, making it less attractive to colonists after the initial colonization. This geographic isolation limited the colony’s exposure to other Spanish colonists who would have otherwise introduced the changes to the Spanish language that occurred in their respective colonies. It can therefore be inferred that this isolation is a reason why the New Mexican dialect still has characteristics of an older Spanish, while the Spanish dialects spoken in less isolated areas that have more interaction with speakers of other dialects would lose those characteristics over time. Thus, the most logical completion of the text is that geographical isolation can influence how a language develops. Choice A is incorrect because the text discusses different dialects of Spanish, not different languages altogether. Choice B is incorrect because the text focuses on how the New Mexican dialect has stayed the same over time in some ways, not on how it has changed from one generation to the next. Choice D is incorrect because though the text discusses how the New Mexican dialect of Spanish is different from others, it does not discuss how speakers of different dialects are able to understand each other."},{"i":"26ee16ba","c":"claim","d":"E","s":"Hip-hop pedagogy is a form of teaching that’s gaining popularity across school subjects. It involves incorporating hip-hop and rap music into lessons as well as using hip-hop elements when teaching other subject matters. For example, Quan Neloms’s students look for college-level vocabulary and historical events in rap songs. Researchers claim that in addition to developing students’ social justice awareness, <u>hip-hop pedagogy encourages student success by raising students’ interest and engagement.<\/u> Which finding, if true, would most strongly support the underlined claim?","o":["Students tend to be more enthusiastic about rap music than they are about hip-hop music.","Students who are highly interested in social justice issues typically don’t sign up for courses that incorporate hip-hop and rap music.","Educators report that they enjoy teaching courses that involve hip-hop and rap music more than teaching courses that don’t.","Courses that incorporate hip-hop and rap music are among the courses with the highest enrollment and attendance rates."],"a":3,"r":"Choice D is the best answer. Enrollment and attendance are logical ways to measure whether students are interested and engaged. High enrollment and attendance suggests a high level of interest and engagement. Choice A is incorrect. This choice doesn’t support the claim. Students’ preferences between hip-hop and rap aren’t relevant to the claim, which is focused on whether or not students like classes that use hip-hop pedagogy (which includes the educational use of both hip-hop and rap). Choice B is incorrect. This choice doesn’t support the claim. While the first part of the sentence discusses social justice, the underlined claim focuses on student success, which is unrelated. Choice C is incorrect. This choice doesn’t support the claim. This tells us about teacher enjoyment, which isn’t relevant to a claim about student interest and engagement."},{"i":"c83e0b43","c":"claim","d":"H","s":"O Pioneers! is a 1913 novel by Willa Cather. In the novel, Cather depicts Alexandra Bergson as a person who takes comfort in understanding the world around her: ______ Which quotation from O Pioneers! most effectively illustrates the claim?","o":["“She looked fixedly up the bleak street as if she were gathering her strength to face something, as if she were trying with all her might to grasp a situation which, no matter how painful, must be met and dealt with somehow.“","“She had never known before how much the country meant to her. The chirping of the insects down in the long grass had been like the sweetest music. She had felt as if her heart were hiding down there, somewhere, with the quail and the plover and all the little wild things that crooned or buzzed in the sun. Under the long shaggy ridges, she felt the future stirring.“","“Alexandra drove off alone. The rattle of her wagon was lost in the howling of the wind, but her lantern, held firmly between her feet, made a moving point of light along the highway, going deeper and deeper into the dark country.”","“Alexandra drew her shawl closer about her and stood leaning against the frame of the mill, looking at the stars which glittered so keenly through the frosty autumn air. She always loved to watch them, to think of their vastness and distance, and of their ordered march. It fortified her to reflect upon the great operations of nature, and when she thought of the law that lay behind them, she felt a sense of personal security.”"],"a":3,"r":"Choice D is the best answer because it most effectively uses a quotation from O Pioneers! to illustrate the claim that Alexandra Bergson takes comfort in understanding the world around her. In the quotation, Alexandra is described as enjoying looking at the stars and feeling a “sense of personal security” when she contemplates nature’s order and its governing laws. This suggests that Alexandra takes comfort in understanding the world around her. Choice A is incorrect because the quotation expresses how Alexandra Bergson attempts to meet difficult situations with determination, not how she takes comfort in understanding the world around her. Choice B is incorrect because the quotation expresses “how much the country meant to” Alexandra Bergson, not how she takes comfort in understanding the world around her. In detailing some of the wildlife surrounding Alexandra, the quotation conveys that nature is important to her but not necessarily that it gives her comfort. Choice C is incorrect because the quotation describes Alexandra driving her wagon down a highway at night; it doesn’t describe how she takes comfort in understanding the world around her or address how she’s feeling as she drives off."},{"i":"cca6fae9","c":"graph","d":"H","s":"","o":["Although delta 15-N values were generally higher in Akumal Bay and Tulum than in Mahahual and Xahuayxol, the values were lower in Akumal Bay than in Mahahual and Xahuayxol in February 2017.","Delta 15-N values reached their lowest level in February 2017 in both Akumal Bay and Tulum, but no data were available for Akumal Bay in February 2016, when the values reached their highest level in Tulum.","Although all sites showed considerable variation in delta 15-N values, the values remained relatively constant in Akumal Bay from October 2016 to February 2017 and in Tulum from February 2016 to October 2016.","In Akumal Bay and Tulum, delta 15-N values fluctuated considerably across the three measurements made from October 2016 to October 2017."],"a":3,"r":"Choice D is the best answer because it describes data from the table that support the underlined conclusion. The text accompanying the table states that delta 15-N values (a measure of the ratio of two nitrogen isotopes) can be used as an indirect means of measuring the ratio of human wastewater to water from uncontaminated sources—the higher the delta 15-N values, the greater the presence of human wastewater. The text goes on to mention an experiment conducted by Camacho-Cruz and colleagues measuring delta 15-N values in seagrass on the Yucatan peninsula at several sites, four of which are presented in the table accompanying the text. Two of the sites noted in the table, Akumal Bay and Tulum, had intermediate tourism development, and two others, Mahahual and Xahuayxol, had low tourism development. It is reasonable to infer that sites with intermediate tourism have a greater human presence than those with low tourism and therefore are subject to greater amounts of wastewater and exhibit higher delta 15-N values in seagrass. However, Camacho-Cruz and colleagues found that the increase in delta 15-N values was not constant. The table supports this conclusion because the two intermediate-tourism sites (Akumal Bay and Tulum) had delta 15-N values that fluctuated considerably—both had higher delta 15-N values than the two low-tourism sites (Mahahual and Xahuayxol) in October 2016 and October 2017, but in February 2017 the delta 15-N values for the intermediate-tourism sites dropped significantly (in fact, Mahahual, a low-tourism site, had a higher delta 15-N value for that period). The fluctuations in values in Akumal Bay and Tulum support the conclusion that these sites experienced influxes of human wastewater intermittently. Choice A is incorrect because it inaccurately describes data from the table: in February 2017 the delta 15-N value in Akumal Bay was higher than the delta 15-N value in Xahuayxol, not lower. Choice B is incorrect because the absence of data for delta 15-N levels in Akumal Bay in February 2016 would neither prove nor disprove that the presence of human wastewater at Akumal Bay and Tulum was not constant. Despite the unavailable data, there is still enough information to conclude that delta 15-N levels at both sites fluctuated significantly and that influxes of human wastewater therefore happened intermittently. Choice C is incorrect because a constancy in delta 15-N values would not indicate that the influx of human wastewater was intermittent, but rather the opposite. Moreover, the two periods selected are not indicative of general trends in the whole table (for example, the values fluctuated significantly in Akumal Bay between February 2017 and October 2017, and in Tulum between October 2016 and February 2017)."},{"i":"a7c52fa4","c":"graph","d":"H","s":"","o":["For pin flowers, damage led to longer times per flower in all pollinator genera, whereas for thrum flowers, damage led to longer times per flower only in Habropoda and Osmia.","Compared with pollinators belonging to the genus Osmia, pollinators belonging to the genus Xylocopa spent less time on damaged pin flowers but more time on damaged thrum flowers.","Damage led to shorter times per thrum flower in three pollinator genera (Osmia, Pierid, and Xylocopa), whereas it led to longer times per thrum flower in one pollinator genus (Habropoda).","Pollinators belonging to the genus Habropoda spent 2.7 seconds on intact pin flowers and 4.1 seconds on intact thrum flowers."],"a":0,"r":"Choice A is the best answer because it describes data from the table that support the researchers’ conclusion that the effect of floral damage on time spent per flower varied by both floral morph and the genus of the pollinator. The table presents the average time pollinators spent per floral morph. The data in the table shows that for pin flowers, the average time spent per flower by all pollinator genera was higher for flowers that had been artificially damaged than for intact flowers. By contrast, for thrum flowers, the difference in time spent on intact and damaged flowers is seen for only some pollinator genera. This supports the researchers’ conclusion that both floral morph and the genus of the pollinator are factors involved in the effect that floral damage has on time pollinators spend per flower. Choice B is incorrect. The table shows that pollinators belonging to the genus Xylocopa spent less time on both damaged pin flowers and damaged thrum flowers than pollinators belonging to the genus Osmia did. Choice C is incorrect. The table shows that the artificial damage to the thrum flowers led to shorter average times spent by pollinators on those flowers for only two of the four pollinator genera represented in the table, not three. Furthermore, this choice doesn’t address the effect the artificial damage had on pin flowers; thus, even if accurate, this evidence doesn’t support the researchers’ conclusion that both floral morph and pollinator genus affect time spent per flower when a flower has been damaged. Choice D is incorrect. While this statement is true based on the information in the table, it doesn’t provide evidence that supports the researchers’ conclusion that the effect of floral damage on time spent per flower varied by both floral morph and the genus of the pollinator because this choice provides information only about how much time one pollinator genus spent on intact flowers."},{"i":"3daf126e","c":"fss","d":"H","s":"A model created by biologist Luis Valente predicts that the rate of speciation—the rate at which new species form—on an isolated island located approximately 5,000 kilometers from the nearest mainland ______ triple the rate of speciation on an island only 500 kilometers from the mainland.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["being","to be","to have been","will be"],"a":3,"r":"Choice D is the best answer. The convention being tested is finite and nonfinite verb forms within a sentence. Relative clauses, such as the one beginning with “that,” require a finite verb, a verb that can function as the main verb of a clause. This choice correctly supplies the clause with the finite future tense verb “will be.” Choice A is incorrect because the nonfinite participle “being” doesn’t supply the clause with a finite verb. Choice B is incorrect because the nonfinite to-infinitive “to be” doesn’t supply the clause with a finite verb. Choice C is incorrect because the nonfinite to-infinitive “to have been” doesn’t supply the clause with a finite verb."},{"i":"b85c19ed","c":"fss","d":"M","s":"The violins handmade in the seventeenth century by Italian craftsman Antonio Stradivari have been celebrated as some of the finest in the world. In close collaboration with musicians, Stradivari introduced changes to the shape of a traditional violin, flattening some of the instrument’s curves and making ______ lighter overall.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["those","one","them","it"],"a":3,"r":"Choice D is the best answer. The convention being tested is pronoun–antecedent agreement. The singular pronoun “it” agrees in number with the singular antecedent “violin” and thus indicates that the traditional violin (and not its curves) was made lighter. Choice A is incorrect because the plural pronoun “those” doesn’t agree in number with the singular antecedent “violin.” Choice B is incorrect because the singular pronoun “one” is ambiguous in this context; the resulting sentence leaves unclear what Stradivari made lighter. Choice C is incorrect because the plural pronoun “them” doesn’t agree in number with the singular antecedent “violin.”"},{"i":"99dedf36","c":"fss","d":"H","s":"When a given term—“self-fulfilling prophecies” and “role models” are two well-known examples—is generally accepted and frequently used, ______ susceptible to obliteration by incorporation (OBI). In cases of OBI, widely used terms are rarely, if at all, attributed to the individuals who coined them.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["they often become","these often become","this often becomes","it often becomes"],"a":3,"r":"Choice D is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun “it” agrees in number with the singular antecedent “a given term” and clearly indicates that the term becomes susceptible to obliteration by incorporation. Choice A is incorrect because the plural pronoun “they” neither agrees in number with the singular antecedent “a given term” nor clearly indicates that the given term—not another plural noun in the sentence, such as “examples”—becomes susceptible to obliteration by incorporation. Choice B is incorrect because the plural pronoun “these” neither agrees in number with the singular antecedent “a given term” nor clearly indicates that the given term—not another plural noun in the sentence, such as “examples”—becomes susceptible to obliteration by incorporation. Choice C is incorrect because the singular pronoun “this” is ambiguous in this context, leaving unclear what exactly becomes susceptible to obliteration by incorporation."},{"i":"adf210e7","c":"bound","d":"H","s":"The haiku-like poems of Tomas Tranströmer, which present nature- and dream-influenced images in crisp, spare language, have earned the Swedish poet praise from leading contemporary ______ them Nigerian American essayist and novelist Teju Cole, who has written that Tranströmer’s works “contain a luminous simplicity.”\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["writers. Among","writers among","writers; among","writers, among"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between a main clause and a supplementary phrase. This choice correctly uses a comma to mark the boundary between the main clause (“The haiku-like…writers”) and the supplementary phrase (“among… Cole”) that specifies a contemporary writer who has praised Tomas Tranströmer’s haiku-like poems. Choice A is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “among.” Choice B is incorrect because it fails to mark the boundary between the main clause and the supplementary phrase with appropriate punctuation. Choice C is incorrect because a semicolon can’t be used in this way to join the main clause (“The haiku-like…writers”) and the supplementary phrase (“among…Cole”)."},{"i":"1f39ab8b","c":"bound","d":"E","s":"In the novel Things Fall Apart by Chinua Achebe, Okonkwo is a leader of Umuofia (a fictional Nigerian clan) and takes pride in his culture’s traditions. However, when the arrival of European missionaries brings changes to Umuofia, the novel asks a central question: How ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["Umuofia’s traditions will be affected.","will Umuofia’s traditions be affected.","Umuofia’s traditions will be affected?","will Umuofia’s traditions be affected?"],"a":3,"r":"Choice D is the best answer. The clause before the colon tells us that the novel “asks a question,” so the clause after the colon should be in the conventional form of a question: with the verb before the subject, and a question mark at the end. Choice A is incorrect. This choice ends the sentence with a period, which isn’t right. The clause before the colon tells us that the novel “asks a question,” so the clause after the colon should be that question. Choice B is incorrect. This choice ends the sentence with a period, which isn’t right. The clause before the colon tells us that the novel “asks a question,” so the clause after the colon should be that question. In Standard English, questions place the verb before the subject and end with a question mark. Choice C is incorrect. This choice doesn’t conform to the conventions of Standard English. In Standard English, questions place the verb before the subject."},{"i":"a3204ab0","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Yellowstone is a national park in the northwest United States. In 1995, gray wolves were reintroduced into the park. Since then, the number of gray wolves in the park has stabilized at roughly 100. This number is believed to be the park’s carrying capacity. Carrying capacity describes the maximum number of a species that a specific environment’s resources can sustain over time. The student wants to specify the number of gray wolves in Yellowstone.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Gray wolves were reintroduced into Yellowstone, a national park in the northwest United States, in 1995.","As of 1995, there were gray wolves living in Yellowstone, a national park in the northwest United States.","The carrying capacity of an environment, such as Yellowstone, describes the maximum number of species that the environment can sustain over time.","Yellowstone is a national park that has roughly 100 gray wolves living in it."],"a":3,"r":"Choice D is the best answer. This choice uses relevant information from the third bullet point to state the approximate number of gray wolves in Yellowstone. Choice A is incorrect. This choice mentions the year gray wolves in Yellowstone were reintroduced but not how many there are currently. Choice B is incorrect. This choice mentions the year gray wolves in Yellowstone were reintroduced but not how many there are currently. Choice C is incorrect. This choice defines the term carrying capacity but doesn’t connect it to the specific number of gray wolves currently living in Yellowstone."},{"i":"064c8999","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The Haber-Bosch process is an industrial process used to manufacture ammonia (NH 3 ). It was invented by chemists Fritz Haber and Carl Bosch in 1910. The process’s primary reaction combines nitrogen (N 2 ) from the air with hydrogen (H 2 ). It requires an iron catalyst and high temperatures and pressures. Most of the ammonia produced by this process is used in fertilizers. The student wants to provide an overview of the Haber-Bosch process.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Haber-Bosch process needs nitrogen, hydrogen, and an iron catalyst.","The Haber-Bosch process uses an iron catalyst along with high temperatures and pressures to manufacture ammonia from nitrogen and hydrogen.","Chemists Fritz Haber and Carl Bosch invented an industrial process to manufacture ammonia to be used in fertilizers.","In 1910, chemists Fritz Haber and Carl Bosch invented the Haber-Bosch process, which requires high temperatures and pressures."],"a":1,"r":"Choice B is the best answer. The sentence provides an overview of the Haber-Bosch process, explaining that it uses an iron catalyst, high temperatures, and high pressures to manufacture ammonia from nitrogen and hydrogen. Choice A is incorrect. While the sentence identifies some of the process’s required components (nitrogen, hydrogen, and an iron catalyst), the overview is incomplete; it doesn’t explain what the process does (produces ammonia) or mention the conditions needed for it to function (high temperatures and pressures). Choice C is incorrect. While the sentence indicates who invented the process (Fritz Haber and Carl Bosch) and that it produces ammonia, the overview is incomplete; it doesn’t mention any of the necessary ingredients or conditions. Choice D is incorrect. While the sentence mentions the inventors of the process along with the required conditions (high temperatures and pressures), it doesn’t explain that the process produces ammonia or indicate what components are needed."},{"i":"0ee64efc","c":"trans","d":"E","s":"In the 1850s, William Still was instrumental in helping nearly 1,000 people escape from slavery, earning him the moniker “the Father of the Underground Railroad.” ______ despite the fame of his contributions during his lifetime, Still is discussed far less today than other prominent Black abolitionists from his era, such as Frederick Douglass and Harriet Tubman.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","However,","Specifically,","Similarly,"],"a":1,"r":"Choice B is the best answer. \"However\" is used to indicate a contrast between two ideas. The first sentence describes how Still used to be famous. This sentence describes how Still is not very famous today, so the transition \"however\" fits perfectly. Choice A is incorrect. This choice uses a transition that introduces an example. But the second sentence doesn’t provide a specific example of Still’s famous contributions to the Underground Railroad. Instead, it changes the subject to how his fame has faded over time. Choice C is incorrect. This choice uses a transition that introduces an example or continuation of a previous idea. But the second sentence doesn’t provide a specific example of Still’s famous contributions to the Underground Railroad. Instead, it changes the subject to how his fame has faded over time. Choice D is incorrect. This choice uses a transition that indicates the agreement between two ideas. But this sentence shows a contrast with the first sentence—namely, that Still used to be very famous but now isn’t very famous."},{"i":"fc95a352","c":"trans","d":"H","s":"When designing costumes for film, American artist Suttirat Larlarb typically custom fits the garments to each actor. ______ for the film Sunshine, in which astronauts must reignite a dying Sun, she designed a golden spacesuit and had a factory reproduce it in a few standard sizes; lacking a tailor-made quality, the final creations reflected the ungainliness of actual spacesuits.\n\nWhich choice completes the text with the most logical transition?","o":["Nevertheless,","Thus,","Likewise,","Moreover,"],"a":0,"r":"Choice A is the best answer. “Nevertheless” logically signals that the information in this sentence—that the spacesuits Suttirat Larlarb designed for the film Sunshine were made in standard sizes in a factory—presents a notable exception to Larlarb’s typical approach of custom-fitting garments to actors, which is described in the previous sentence. Choice B is incorrect because “thus” illogically signals that the information in this sentence is a result or consequence of the previous information about Larlarb’s typical approach of custom-fitting garments to actors. Instead, it presents a notable exception to Larlarb’s typical approach. Choice C is incorrect because “likewise” illogically signals that the information in this sentence is similar to the previous information about Larlarb’s typical approach of custom-fitting garments to actors. Instead, it presents a notable exception to Larlarb’s typical approach. Choice D is incorrect because “moreover” illogically signals that the information in this sentence merely adds to the previous information about Larlarb’s typical approach of custom-fitting garments to actors. Instead, it presents a notable exception to Larlarb’s typical approach."},{"i":"d10e46a2","c":"trans","d":"E","s":"The ancient Spartans were known for their bitingly concise—or laconic—wit, a quality they maintained even in the face of great peril. ______ when Philip II of Macedon threatened Laconia (the region of Greece containing Sparta), he said, “If I invade Laconia, I shall turn you out.”The Spartans replied with a single word: “If.”\n\nWhich choice completes the text with the most logical transition?","o":["Rather,","In other words,","That said,","For instance,"],"a":3,"r":"Choice D is the best answer. \"For instance\" logically signals that the concise, witty exchange between Philip II and the Spartans is an example supporting the previous claim—that the Spartans employed wit even in the face of peril. Choice A is incorrect because \"rather\" illogically signals that the exchange between Philip II and the Spartans contrasts with the previous claim about the Spartans’ wit. Instead, the exchange is an example of their wit. Choice B is incorrect because \"in other words\" illogically signals that the exchange between Philip II  return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
