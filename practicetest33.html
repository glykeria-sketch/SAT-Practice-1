<script>
const D={"t":"Practicetest33","q":[{"i":"daaed806","c":"vocab","d":"E","s":"Mônica Lopes-Ferreira and others at Brazil’s Butantan Institute are studying the freshwater stingray species Potamotrygon rex to determine whether biological characteristics such as the rays’ age and sex have ______ effect on the toxicity of their venom—that is, to see if differences in these traits are associated with considerable variations in venom potency.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a disconcerting","an acceptable","an imperceptible","a substantial"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the research that Lopes-Ferreira and her colleagues are conducting on the stingray species Potamotrygon rex. As used in this context, “a substantial” effect means an effect that is sizable or noteworthy. The text indicates that the researchers are seeking to determine whether there are “considerable variations” in the potency of stingray venom that are associated with variation in the stingrays’ age and sex. This context suggests that the researchers want to find out whether stingray age and sex have a substantial effect on venom toxicity. Choice A is incorrect because there’s nothing in the text that suggests that the researchers have been studying whether the stingrays’ age and sex have “a disconcerting,” or an unsettling and disturbing, effect on the stingrays’ venom. The text indicates that the researchers wish to determine if stingray age and sex cause large variations in the toxicity of stingray venom, not if the effect of age and sex is disconcerting. Choice B is incorrect because the text indicates that researchers want to find out whether differences in stingray age and sex produce differences in stingray venom, not that the researchers want to find out whether age and sex have “an acceptable,” or a satisfactory, effect on venom. The text makes no mention of what would make an effect on venom toxicity acceptable and gives no indication that the researchers are interested in that question. Choice C is incorrect because it wouldn’t make sense in context for the researchers to be looking for “an imperceptible,” or an unnoticeable, effect of age and sex on stingray venom. The text says that the researchers are trying to determine if there are “considerable variations” in venom toxicity linked to age and sex, not that the researchers are trying to find effects that they can’t perceive."},{"i":"1fa751f1","c":"vocab","d":"M","s":"Handedness, a preferential use of either the right or left hand, typically is easy to observe in humans. Because this trait is present but less ______ in many other animals, animal-behavior researchers often employ tasks specially designed to reveal individual animals’ preferences for a certain hand or paw.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["recognizable","intriguing","significant","useful"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion about handedness in animals. As used in this context, “recognizable” means apparent or identifiable. The text indicates that handedness is “easy to observe in humans,” but that animal-behavior researchers use special tasks to determine handedness in other animals. This context and the use of “less” before the blank indicate that compared with handedness in humans, handedness in other animals is less recognizable. Choice B is incorrect because there’s nothing in the text to suggest that handedness is less “intriguing,” or fascinating, in nonhuman animals than it is in humans. The text focuses on how easy it is to observe handedness in humans as compared with other animals; the text doesn’t suggest that handedness is more fascinating in humans. Choice C is incorrect because there’s nothing in the text to suggest that handedness is less “significant,” or important or meaningful, in nonhuman animals than it is in humans. The text focuses on how easy it is to observe handedness in humans as compared with other animals; the text doesn’t suggest that handedness is more significant in humans. Choice D is incorrect because “useful,” or functional or helpful, wouldn’t make sense in context. The text focuses on the ease with which researchers can determine whether an animal or person is right- or left-handed, not on how useful handedness in nonhuman animals is compared with handedness in humans."},{"i":"fce80a36","c":"vocab","d":"M","s":"In 2008 a complete set of ancient pessoi (glass game pieces) was uncovered from beneath a paving stone in modern-day Israel. Due to their small size, pessoi were easily misplaced, making a whole set a rare find. This has led some experts to suggest that the set may have been buried intentionally; however, without clear evidence, archaeologists are left to ______ what happened.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["speculate about","dismiss","expand on","catalog"],"a":0,"r":"Choice A is the best answer. \"Speculate\" means \"to form a theory or guess without any clear evidence.\" This makes sense because, due to the lack of \"clear evidence,\" the archaeologists can only guess how the pessoi set might have come to be there. Choice B is incorrect. \"Dismiss\" can mean \"send away\" or \"treat as unworthy of consideration.\" The text implies that the archaeologists are trying to figure out the truth—they wouldn’t \"dismiss\" what really happened. Choice C is incorrect. \"Expand on\" means \"give more details about,\" but there aren’t any details to give. Without any \"clear evidence,\" the archaeologists can’t give any more details. Choice D is incorrect. \"Catalog\" means \"carefully record\" or \"make a list of.\" However, there’s no \"clear evidence,\" so there’s no real information to \"catalog.\""},{"i":"3f753a8e","c":"vocab","d":"H","s":"Investigating whether shared false visual memories—specific but inaccurate and widely held recollections of images such as product logos—are caused by people’s previous ______ incorrect renditions of the images, researchers Deepasri Prasad and Wilma Bainbridge found that, in fact, such memories are often not explained by familiarity with erroneous versions of the images.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["compliance with","exposure to","criteria for","forfeiture of"],"a":1,"r":"Choice B is the best answer. \"Exposure to\" means \"having contact with.\" It makes sense that Prasad and Bainbridge were investigating whether seeing false versions of images was a cause of false visual memories. Notice how \"exposure to incorrect renditions\" matches the idea of \"familiarity with erroneous versions,\" which appears later in the sentence. Choice A is incorrect. \"Compliance with\" means \"going along with a command or directive.\" False versions of images can’t give commands or directives, so this doesn’t apply. Choice C is incorrect. \"Criteria\" means \"standards by which to judge something.\" It’s not clear how people would come to have standards for the wrong version of an image in the first place, let alone how those standards would cause them to falsely remember the correct version. In other words, this choice would result in a confusing, unclear sentence. Choice D is incorrect. \"Forfeiture of\" means \"a giving up of something.\" It wouldn’t make sense to say that false memories of an image might be caused by giving up the wrong version of the image."},{"i":"e5da61f1","c":"purpose","d":"E","s":"The following text is adapted from Charles Chesnutt’s 1899 short story “Mars Jeems’s Nightmare.”The narrator and his wife have recently moved to the southern United States, and Julius is their carriage driver. Julius [was] very useful when we moved to our new residence. He had a thorough knowledge of the neighborhood, was familiar with the roads and the watercourses, knew the qualities of the various soils and what they would produce, and where the best hunting and fishing were to be had. He was a marvelous hand in the management of horses and dogs.\n\nWhich choice best states the main purpose of the text?","o":["To compare the narrator’s reaction to a new home with his wife’s reaction","To give an example of Julius’s knowledge about soil","To show that the narrator and Julius often hunt and fish together","To explain different ways in which Julius was helpful"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain different ways in which Julius was helpful. The text begins with the narrator stating that Julius was very helpful to him and his wife when they moved to their new residence. The narrator then provides a list of examples to illustrate Julius’s helpfulness. For instance, the narrator states that Julius was familiar with the neighborhood’s roads, which suggests that he was helpful in navigating them, and that Julius helped manage the horses and dogs. The text’s many examples of Julius’s usefulness reinforce just how helpful he was and in how many different ways. Choice A is incorrect because the text doesn’t portray either the narrator’s or his wife’s reaction to their new home. Rather, the text focuses on how Julius was useful to the narrator and his wife in their new home. Choice B is incorrect. Although the text states that Julius was knowledgeable about the soil, this is one of several supporting details that illustrate how helpful Julius was. Moreover, the text merely states that Julius was knowledgeable about soil; it doesn’t provide an example of that knowledge. Choice C is incorrect because there’s nothing in the text to suggest the frequency with which the narrator and Julius hunted and fished together. In fact, it’s unclear from the text whether the narrator and Julius hunted and fished together at all. The text merely indicates that Julius knew the best places to hunt and fish—a detail that supports the text’s main purpose by conveying Julius’s usefulness."},{"i":"1090b367","c":"purpose","d":"M","s":"Today composer Scott Joplin is mainly celebrated for his catchy ragtime pieces “Maple Leaf Rag” and “The Entertainer.” However, by overlooking his less famous works, listeners will miss the full range of Joplin’s creativity. For instance, his waltz “Pleasant Moments” and his opera Treemonisha skillfully blend ragtime and classical music. These masterpieces deserve as much fame as Joplin’s biggest hits.\n\nWhich choice best states the main purpose of the text?","o":["To describe the similarities and differences between ragtime music and opera","To argue that more attention should be given to Joplin’s lesser-known works","To encourage music lovers to listen to music by many different composers","To explain how Joplin learned to compose and perform ragtime music"],"a":1,"r":"Choice B is the best answer because it best states the main purpose of the text, which is to make a case for the importance of Scott Joplin’s less famous works. The text begins by introducing Joplin’s most popular works and then goes on to assert that gaining a full understanding of Joplin’s creativity requires a consideration of his lesser-known pieces as well. The text concludes by characterizing the lesser-known works \"Pleasant Moments\" and Treemonisha as masterpieces that deserve to be famous. These details indicate that the text’s main purpose is to argue that more attention should be given to Joplin’s lesser-known works. Choice A is incorrect. Although the text discusses some of the ragtime music and an opera that Joplin composed, it does not compare the two types of music in general. Instead, the text argues that Joplin’s lesser-known works, including his opera, deserve as much attention as his more famous ragtime pieces receive. Choice C is incorrect because the text discusses only Joplin’s music and does not ask music lovers to listen to a variety of composers. Instead, the text encourages listeners to pay attention to Joplin’s lesser-known works in order to gain a full understanding of his creativity. Choice D is incorrect because the text does not discuss how Joplin learned to compose and perform ragtime music. Instead, the text focuses on Joplin’s less famous works and makes a case for their importance."},{"i":"aa5897b8","c":"func","d":"H","s":"<u>In Jane Austen’s novel Mansfield Park, an almost imperceptible smile from potential suitor Henry Crawford causes the protagonist Fanny Price to blush; her embarrassment grows when she suspects that he is aware of it.<\/u> This moment—in which Fanny not only infers Henry’s mental state through his gestures, but also infers that he is drawing inferences about her mental state—illustrates what literary scholar George Butte calls “deep intersubjectivity,” a technique for representing interactions between consciousnesses through which Austen’s novels derive much of their social and psychological drama.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It states a claim about Austen’s skill at representing psychological complexity that is reinforced by an example presented in the following sentence.","It advances an interpretation of an Austen protagonist who is contrasted with protagonists from other Austen novels cited in the following sentence.","It describes a recurring theme in Austen’s novels that is the focus of a literary scholar’s analysis summarized in the following sentence.","It provides a synopsis of an interaction in an Austen novel that illustrates a literary concept discussed in the following sentence."],"a":3,"r":"Choice D is the best answer. The underlined sentence provides a concrete example to ground readers’ understanding of the “deep intersubjectivity” described in the next sentence as central to Austen’s work. Choice A is incorrect. There is no evaluation made of Austen’s skill in this sentence, and no examples are given in the following sentence. This choice essentially flips the paragraph: it’s this first sentence that provides an example. Choice B is incorrect. There are no other Austen protagonists mentioned in this passage, so this couldn’t be the answer. Choice C is incorrect. The underlined sentence doesn’t identify any “recurring theme,” but instead simply describes one interaction from one book. This interaction exemplifies the literary technique of “deep intersubjectivity” that is introduced in the next sentence."},{"i":"7d075fc5","c":"func","d":"E","s":"Oral histories—whether they consist of interviews or recordings of songs and stories—can offer researchers a rich view of people’s everyday experiences. For her book about coal mining communities in Kentucky during the twentieth century, Karida Brown therefore relied in part on interviews with coal miners and their families. <u>By doing so, she gained valuable insights into her subjects’ day-to-day lives.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It provides a little-known geographical fact about Kentucky.","It argues that Karida Brown is an expert on United States politics.","It presents a major historical event that took place in the twentieth century.","It describes how Karida Brown benefited from incorporating oral history in her book."],"a":3,"r":"Choice D is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The text begins by pointing out one of the advantages of oral histories: that they allow researchers to document the daily experiences of people. The text then goes on to describe how Karida Brown utilized interviews with coal miners and their families for her book about twentieth-century coal mining in Kentucky. The underlined sentence affirms that the general advantages of oral histories mentioned earlier in the text were also benefits in Brown’s particular case. Thus, the underlined sentence describes how Karida Brown benefited from incorporating oral history in her book. Choice A is incorrect because though the text mentions coal miners who live in Kentucky, the underlined sentence does not offer a geographical fact about Kentucky. Choice B is incorrect because the underlined sentence does not mention United States politics or that Brown is an expert in this particular area. Choice C is incorrect. Although the text mentions that Brown’s book revolved around coal miners during the twentieth century, the underlined sentence does not focus on a major historical event during this time."},{"i":"03080769","c":"cross","d":"M","s":"Text 1 Philosopher G.E. Moore’s most influential work entails the concept of common sense. He asserts that there are certain beliefs that all people, including philosophers, know instinctively to be true, whether or not they profess otherwise: among them, that they have bodies, or that they exist in a world with other objects that have three dimensions. Moore’s careful work on common sense may seem obvious but was in fact groundbreaking.\n\nText 2 External world skepticism is a philosophical stance supposing that we cannot be sure of the existence of anything outside our own minds. During a lecture, G.E. Moore once offered a proof refuting this stance by holding out his hands and saying, “Here is one hand, and here is another.” Many philosophers reflexively reject this proof (Annalisa Coliva called it “an obviously annoying failure”) but have found it a challenge to articulate exactly why the proof fails.\n\nBased on the texts, how would the author of\n\nText 1 most likely respond to proponents of the philosophical stance outlined in\n\nText 2?","o":["By agreeing with those proponents that Moore’s treatment of positions that contradict his own is fundamentally unserious","By suggesting that an instinctive distaste for Moore’s position is preventing external world skeptics from constructing a sufficiently rigorous refutation of Moore","By arguing that if it is valid to assert that some facts are true based on instinct, it is also valid to assert that some proofs are inadequate based on instinct","By pointing out that Moore would assert that external world skepticism is at odds with other beliefs those proponents must unavoidably hold"],"a":3,"r":"Choice D is the best answer. According to the author of Text 1, Moore’s definition of common sense—things we instinctively know are true— includes the belief that we all “exist in a world with other objects.”The author of Text 1 describes this notion as both “obvious” and “groundbreaking.” So it’s safe to infer that the author would observe that Moore would respond to external world skeptics by arguing that since everyone instinctively knows that things exist outside of their own minds, then external world skepticism must be wrong. Choice A is incorrect. We can’t infer that the author of Text 1 would respond this way to external world skeptics. If anything, the author of Text 1 seems to agree with Moore. Choice B is incorrect. We can’t infer that the author of Text 1 would respond this way to external world skeptics. The author of Text 1 never mentions external world skeptics directly, let alone why they have a hard time refuting Moore’s position. Choice C is incorrect. We can’t infer that the author of Text 1 would respond this way to external world skeptics. Text 1’s presentation of Moore’s concept of common sense only includes the idea that some facts are true based on instinct—it doesn’t mention the idea that some proofs are inadequate based on instinct."},{"i":"35b46381","c":"main","d":"H","s":"In their 2022 paper, Christos Dimopoulos et al., having granted that the existence of antigravity—in which antimatter and matter repel rather than attract each other—lacked affirmative experimental support, rightly argued that such antigravity was worth considering on theoretical grounds given that evidence against it was similarly lacking. But a 2023 report by an international team of researchers details the first direct ballistic observations of antihydrogen atoms under gravity inside a CERN particle accelerator. Corresponding most closely to predictions under gravitational attraction, these observations were thoroughly inconsistent with antigravity.\n\nWhich choice best states the main idea of the text?","o":["Antihydrogen ballistics observations were conducted at CERN to test specific conclusions about antigravity presented in the 2022 paper by Dimopoulos et al.","Although theoreticians were justified in studying antigravity before the release of the 2023 report, the report’s findings suggest that the rationale for theoretical consideration offered in the 2022 paper by Dimopoulos et al. is no longer applicable.","The theoretical approach represented in the 2022 paper by Dimopoulos et al. assumed that unambiguous proof of antigravity would not be achievable, but the results in the 2023 report undermine that assumption.","Before 2023, researchers’ inordinate focus on theoretical considerations hindered the development of the experimental regimen for direct antihydrogen ballistics observations."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The text begins by acknowledging that in 2022, Dimopoulos et al. were justified in arguing for antigravity on theoretical grounds because although there was no experimental evidence supporting its existence at that time, there was no evidence contradicting its existence either. The text then introduces the 2023 report describing an experiment that produced observations \"thoroughly inconsistent with antigravity.\" Thus, the main idea is that while the study of antigravity was theoretically justified before the 2023 report (due to lack of evidence against it), the report’s findings undermine the rationale for such theoretical consideration since there is now evidence against this hypothetical phenomenon. Choice A is incorrect. Although antihydrogen ballistics observations were conducted at CERN, the text provides no evidence that they were conducted to test conclusions in Dimopoulos et al.’s 2022 paper. Rather, the text presents the 2023 report as new evidence that contradicts the existence of the hypothetical phenomenon that Dimopoulos et al. had considered. Choice C is incorrect because the text doesn’t suggest that Dimopoulos et al. assumed that unambiguous proof of antigravity would be unattainable. Rather, the text states that they argued antigravity was worth considering theoretically because evidence against it was lacking at that time. At the same time, the results in the 2023 report do not undermine but strengthen the idea that the proof of antigravity might not be achievable. Choice D is incorrect because the text doesn’t suggest that there was an \"inordinate focus on theoretical considerations\" before 2023 or that such a focus hindered the development of experimental methods. In fact, the text describes Dimopoulos et al.’s position regarding the theoretical consideration of antigravity as \"rightly argued,\" indicating approval of their approach given the absence of experimental evidence at that time."},{"i":"7c9a65bb","c":"main","d":"H","s":"Optical tweezers are specialized scientific tools—particularly useful in biology and medicine—that use high-powered beams of light to trap and manipulate minuscule particles for study. Use of the tool has led to several scientific and medical breakthroughs over the last few decades, but the particles are often under prolonged exposure to the intense heat of the light beams. To overcome the risk of overheating, and thereby damage, researchers sometimes attach nano-sized glass beads to particles, allowing the light to focus on the beads instead of the particles.\n\nBased on the text, what is one advantage of attaching glass beads to particles when using optical tweezers?","o":["It decreases the time it takes for the optical tweezers to locate and capture the particles.","It facilitates the maneuvering of particles without directly heating the particles themselves.","It allows researchers to use weaker light beams to manipulate particles.","It adds a material to which particles can transfer any heat absorbed from the optical tweezers’ light beam."],"a":1,"r":"Choice B is the best answer. The text says that the glass beads get the \"focus\" of the light beams so that the particles don’t overheat. From this, we can infer that the beads allow the particles to be manipulated without being directly heated by the light beams. Choice A is incorrect. The text never says that attaching the glass beads saves time in any way. Choice C is incorrect. The text never says that attaching the glass beads allows researchers to use weaker light beams. Choice D is incorrect. The text doesn’t say that the particles can transfer heat to the glass beads—rather, it says the heat from the light focuses on the glass beads instead of the particles."},{"i":"38facbad","c":"infer","d":"H","s":"Studies conducted in individual Western societies have demonstrated associations between personality traits and five musical factors (mellowness, unpretentiousness, sophistication, intensity, and contemporariness) underlying individual preferences for styles of Western music. To investigate these associations across cultures, David M. Greenberg et al. collected music-preference assessments for Western genres and self-reported personality traits from participants in fifty-three countries across six continents. The study confirmed that the five-factor framework accurately captured participants’ tastes in Western music, and, moreover, the study found similar correlations between patterns of these factors and of personality traits, suggesting that ______ Which choice most logically completes the text?","o":["across cultural contexts, people who share similar profiles of personality traits tend to prefer listening to similar types of Western music.","the five-factor framework can likely be used to predict preferences for non-Western music styles based on personality traits even if the characteristics of those styles substantially differ from characteristics of Western music styles.","the strength of the relationship between personality traits and musical preferences varies less across cultures than researchers had previously assumed.","people with a relatively high degree of familiarity with Western music styles are likely to express stronger preferences for those styles than people with a relatively low degree of familiarity with those styles are."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the cross-cultural study on personality traits and music preferences. The text first explains that previous studies in individual Western societies had found links between personality traits and five musical factors that shape individual preferences for Western music styles. This finding suggests that people in those societies who have similar personality traits likely prefer listening to similar types of Western music. The text goes on to state that Greenberg et al. conducted a study that expanded this research to a broader, cross-cultural context (fifty-three countries across six continents). This study validated that the five-factor framework accurately represented participants’ preferences for Western music and that the study found patterns linking those preferences to personality traits. It follows, then, that people with similar profiles of personality traits tend to prefer similar types of Western music across cultural contexts. Choice B is incorrect because Greenberg et al.’s study examined only preferences for Western music styles, so the text provides no basis for inferring that the five-factor framework could predict preferences for non-Western music styles. The study was specifically limited to Western musical styles, and extending the study’s findings to non-Western music would go beyond what the study investigated or supports. Choice C is incorrect because the text doesn’t mention what researchers had previously assumed about cultural variation in the strength of the relationship between personality traits and musical preferences. The text presents the cross-cultural consistency of the association between musical preferences and personality traits as a new finding but doesn’t mention previous expectations or assumptions about this association. Choice D is incorrect because the text doesn’t address familiarity with Western music styles or suggest that familiarity influences preference strength for those styles. Greenberg et al.’s study focused on the relationship between personality traits and musical preferences across cultural contexts, not on how exposure or familiarity might affect those preferences."},{"i":"cef77aa7","c":"infer","d":"H","s":"Geoglyphs are large-scale designs of lines or shapes created in a natural landscape. The Nazca Lines were created in the Nazca Desert in Peru by several Indigenous civilizations over a period of many centuries. Peruvian archaeologist Johny Isla specializes in these geoglyphs. At a German exhibit about the Nazca Lines, he saw an old photograph of a large geoglyph of a whalelike figure and was surprised that he didn’t recognize it. Isla returned to Peru and used a drone to search a wide area, looking for the figure from the air. This approach suggests that Isla thought that if he hadn’t already seen it, the whalelike geoglyph ______ Which choice most logically completes the text?","o":["must represent a species of whale that went extinct before there were any people in Peru.","is actually located in Germany, not Peru, and isn’t part of the Nazca Lines at all.","is probably in a location Isla hadn’t ever come across while on the ground.","was almost certainly created a long time after the other Nazca Lines geoglyphs were created."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Johny Isla and the whalelike geoglyph. The text indicates that the German exhibit about the Nazca Lines included a photograph showing a whalelike geoglyph that Isla hadn’t known about before attending the exhibit, even though Isla “specializes in” Nazca Lines geoglyphs. Given his expertise, and his surprise at being unfamiliar with the whale glyph, the text strongly suggests that Isla believed he would have noticed the glyph if he had been to its location. Thus, the text implies that the whalelike geoglyph is likely in a location Isla had not previously been to. Choice A is incorrect because the text doesn’t address either the species of whale that the geoglyph is meant to represent or its relationship to the earliest humans in the area that is now Peru. Choice B is incorrect. Although the text indicates that the photograph of the whalelike geoglyph was on display at a “German exhibit,” that exhibit was specifically “about the Nazca Lines,” which the text indicates are located in Peru. Choice D is incorrect. Although the text does indicate that the glyphs were created “over a period of many centuries,” the text doesn’t address when in that period of time any particular glyphs were created."},{"i":"87023f34","c":"claim","d":"M","s":"“Ghosts of the Old Year” is an early 1900s poem by James Weldon Johnson. In the poem, the speaker describes experiencing an ongoing cycle of anticipation followed by regretful reflection: ______ Which quotation from “Ghosts of the Old Year” most effectively illustrates the claim?","o":["“What does this brazen tongue declare, / That falling on the midnight air / Brings to my heart a sense of care / Akin to fright?”","“The snow has ceased its fluttering flight, / The wind sunk to a whisper light, / An ominous stillness fills the night, / A pause—a hush.”","“It tells of many a squandered day, / Of slighted gems and treasured clay, / Of precious stores not laid away, / Of fields unreaped.”","“And so the years go swiftly by, / Each, coming, brings ambitions high, / And each, departing, leaves a sigh / Linked to the past.”"],"a":3,"r":"Choice D is the best answer because it presents the quotation that most effectively illustrates the claim that the speaker of the poem describes experiencing an ongoing cycle of anticipation followed by regretful reflection. In this quotation, the speaker notes that as years go by, “Each, coming”—that is, each new year as it comes—“brings ambitions high.” In other words, the speaker begins each new year with large goals. But the speaker goes on to say that as each year ends (“each, departing”), it “leaves a sigh / Linked to the past.” A sigh is an expression of longing or regret, so in the context of the whole quotation, this portion suggests that at the end of each year, the speaker regretfully reflects on not having achieved the ambitions formed at the beginning of the year. The phrases “the years go swiftly by,” “Each, coming,” and “each, departing” indicate that this experience happens over and over again: the speaker experiences a cycle of anticipation followed by regretful reflection. Choice A is incorrect because this quotation does not describe an ongoing cycle of anticipation followed by regretful reflection. Instead, the speaker describes experiencing a sensation similar to fright as a result of something that has occurred at midnight. Specifically, the speaker has heard a “brazen tongue,” a figurative way of saying that the speaker has heard the clang of a bronze bell being rung. Choice B is incorrect because although this quotation does convey a sense of anticipation through its reference to “ominous stillness,” there is no suggestion of regretful reflection or any indication that the speaker is describing an ongoing cycle of anticipation followed by such reflection. Instead, the speaker is describing a particular moment when a winter storm appears to have momentarily calmed. Choice C is incorrect because although this quotation does convey a sense of regret (“many a squandered day”), nothing in the quotation suggests an ongoing cycle of anticipation followed by regret. Instead, the speaker is simply lamenting wasted time and opportunities."},{"i":"a44bbd6b","c":"claim","d":"H","s":"Several studies of sediment (e.g., dirt, pieces of rock, etc.) in streams have shown an inverse correlation between sediment grain size and downstream distance from the primary sediment source, suggesting that stream length has a sorting effect on sediment. In a study of sediment sampled at more than a dozen sites in Alpine streams, however, geologists Camille Litty and Fritz Schlunegger found that cross-site variations in grain size were not associated with differences in downstream distance, though they did not conclude that downstream distance is irrelevant to grain size. Rather, they concluded that sediment influx in these streams may have been sufficiently spatially diffuse to prevent the typical sorting effect from being observed.\n\nWhich finding about the streams in the study, if true, would most directly support Litty and Schlunegger’s conclusion?","o":["The streams regularly experience portions of their banks collapsing into the water at multiple points upstream of the sampling sites.","The streams contain several types of sediment that are not typically found in streams where the sorting effect has been demonstrated.","The streams mostly originate from the same source, but their lengths vary considerably due to the different courses they take.","The streams are fed by multiple tributaries that carry significant volumes of sediment and that enter the streams downstream of the sampling sites."],"a":0,"r":"Choice A is the best answer. This finding would support the conclusion. If stream banks are collapsing into the water at multiple points, then sediment is getting into the water at those various points. This supports the conclusion that the inflow of sediment is very spread out. Choice B is incorrect. This finding wouldn’t support the conclusion. The conclusion is about the influx of sediment being “spatially diffuse,” meaning spread out over a large area. The type of sediment wouldn’t have an impact on the conclusions. Choice C is incorrect. This finding wouldn’t support the conclusion. It doesn’t say anything about the influx of sediment being “spatially diffuse” (spread out). Choice D is incorrect. This finding wouldn’t support the conclusion. Any sediment that enters downstream of the sampling sites wouldn’t end up in the samples, so it wouldn’t affect the findings or the conclusion."},{"i":"010fa3f0","c":"graph","d":"H","s":"","o":["If baseline precipitation is somewhat concentrated, the amount of water being used for irrigation will increase 0.4% for surface water and 0.9% for groundwater, whereas the amount of water entering aquifers will increase 11.0% if baseline precipitation is evenly distributed.","If baseline precipitation is somewhat concentrated, water use for irrigation will increase only slightly, whereas it will increase 9.0% for surface water and 7.9% for groundwater if baseline precipitation is evenly distributed.","If baseline precipitation is somewhat concentrated, the amount of water entering aquifers will increase 4.9%, while the amount being used for irrigation will increase 0.4% for surface water and 0.9% for groundwater.","If baseline precipitation is somewhat concentrated, water use for irrigation will decline by a small amount, whereas it will increase 11.0% for surface water and 9.0% for groundwater if baseline precipitation is evenly distributed."],"a":1,"r":"Choice B is the best answer because it describes data from the table that support Persad and her colleagues’ conclusion. The text explains that, according to some climate models, precipitation in the western United States will become concentrated into fewer, more intense rain and snow events. According to the text, Persad and her colleagues concluded that more irrigation will consequently be needed but that the change in irrigation output will be highly sensitive to, or greatly affected by, the baseline concentration of precipitation in an area. This conclusion is supported by data from the researchers’ simulations of changes in annual irrigation output in two different scenarios—one in which an area’s annual precipitation is already somewhat concentrated and one in which its annual precipitation is evenly distributed. The table shows that if baseline precipitation is somewhat concentrated, water use for irrigation will increase only slightly, whereas if baseline precipitation is evenly distributed, water use for irrigation will increase much more—9.0% for surface water and 7.9% for groundwater. This difference illustrates the researchers’ conclusion that the amount of additional water needed for irrigation will vary greatly depending on how concentrated or spread out the annual precipitation in an area already is. Choice A is incorrect because it compares changes in the amount of water being used for irrigation to changes in the amount of water entering aquifers. Persad and her colleagues’ conclusion doesn’t focus on changes to the amount of water entering aquifers; rather, the researchers’ conclusion focuses on changes to irrigation output relative to how concentrated or spread out the annual precipitation in an area is. Choice C is incorrect because it supports only part of Persad and her colleagues’ conclusion. According to the text, the researchers concluded that the concentration of precipitation into fewer events will trigger more irrigation but that this change in irrigation output will be highly sensitive to an area’s baseline concentration of annual precipitation. The data in this choice support the idea that more irrigation will be needed, but to support the rest of the researchers’ conclusion, additional data from the table are required to show that the increases in water use for irrigation will vary depending on how concentrated or spread out the annual precipitation in an area already is. Choice D is incorrect because data in the table indicate no declines in water use for irrigation, showing only increases in the form of positive values."},{"i":"7c21b4b5","c":"graph","d":"M","s":"","o":["33 percent of survey participants in the UK.","22 percent of survey participants in India.","8 percent of survey participants in Japan.","16 percent of survey participants in India."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the text about survey results for online account sign-in methods. According to the table, 8 percent of participants in Japan viewed onetime passcodes as the most secure sign-in method. This is the only choice that correctly represents data in the table. Choice A is incorrect because according to the table, 33 percent of participants in the UK viewed biometrics, not onetime passcodes, as the most secure sign-in method; onetime passcodes were viewed as the most secure method by 16 percent of these participants. Choice B is incorrect because according to the table, 22 percent of participants in India viewed biometrics, not onetime passcodes, as the most secure sign-in method; onetime passcodes were viewed as the most secure method by 25 percent of these participants. Choice D is incorrect because according to the table, the country in which 16 percent of participants viewed onetime passcodes as the most secure sign-in method was the UK, not India; of participants in India, 25 percent viewed such passcodes as the most secure method."},{"i":"2d6f8304","c":"fss","d":"E","s":"In 2019, New Zealand produced 88,465 hectograms per hectare (hg/ha) of wheat, and Portugal produced 23,298 hg/ha. This is the type of information on global food production that the United Nations’ Food and Agriculture Organization ______ since 1945.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is collecting","has collected","will collect","collects"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the present perfect tense verb “has collected,” used in conjunction with the phrase “since 1945,” correctly indicates that the Food and Agriculture Organization has collected this type of information in the past and continues to do so in the present. Choice A is incorrect because the present progressive tense verb “is collecting” is inconsistent with the phrase “since 1945,” which indicates that the action occurred in the past and continues into the present. Choice C is incorrect because the future tense verb “will collect” is inconsistent with the phrase “since 1945,” which indicates that the action occurred in the past and continues into the present. Choice D is incorrect because the present tense verb “collects” is inconsistent with the phrase “since 1945,” which indicates that the action occurred in the past and continues into the present."},{"i":"7c766ceb","c":"fss","d":"M","s":"A popular suite of mapping and spatial analysis software, ArcGIS enables cartographers like Karachi Cartography founder Namra Khalid ______ maps by analyzing and arranging raw geospatial data.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["create","to create","creating","created"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite to-infinitive verb “to create” is correctly used to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps (by analyzing and arranging certain data). Choice A is incorrect because it results in an ungrammatical sentence. The finite verb “create” can’t be used in this way to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite participle “creating” can’t be used in this way to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb “created” can’t be used in this way to form a subordinate clause that expresses how ArcGIS facilitates the creation of maps."},{"i":"f570cece","c":"fss","d":"M","s":"Both Arteaga, in the state of Coahuila, and Lagos de Moreno, in the state of Jalisco, have been designated by Mexico as pueblos mágicos (magical villages) to celebrate these ______ natural beauty and unique cultural traditions.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["town","town’s","towns","towns’"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of possessive nouns. The plural possessive noun “towns’” correctly indicates that the natural beauty and unique cultural traditions belong to both Arteaga and Lagos de Moreno. Choice A is incorrect because the context requires the plural possessive noun “towns’,” not the singular noun “town.” Choice B is incorrect because the context requires the plural possessive noun “towns’,” not the singular possessive noun “town’s.” Choice C is incorrect because the context requires the plural possessive noun “towns’,” not the plural noun “towns.”"},{"i":"f30a478e","c":"bound","d":"H","s":"A study published by Rice University geoscientist Ming Tang in 2019 offers a new explanation for the origin of Earth’s ______ structures called arcs, towering ridges that form when a dense oceanic plate subducts under a less dense continental plate, melts in the mantle below, and then rises and bursts through the continental crust above.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["continents geological","continents: geological","continents; geological","continents. Geological"],"a":1,"r":"Choice B is the best answer. The convention being tested is punctuation use between a main clause and a supplementary phrase. In this choice, a colon is correctly used to mark the boundary between the main clause (“A study…continents”) and the supplementary phrase (“geological… above”) and to introduce the following explanation of the origin of Earth’s continents. Choice A is incorrect because it fails to mark the boundary between the main clause (“A study…continents”) and the supplementary phrase (“geological…above”) with appropriate punctuation. Choice C is incorrect because a semicolon can’t be used in this way to join the main clause (“A study…continents”) and the supplementary phrase (“geological…above”). A semicolon is conventionally used to join two main clauses, whereas a colon is conventionally used to introduce an element that explains or amplifies the information in the preceding clause, making it the better choice in this context. Choice D is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “geological.”"},{"i":"ac5536c1","c":"bound","d":"M","s":"Beatrix Potter is perhaps best known for writing and illustrating children’s books such as The Tale of Peter Rabbit (1902), but she also dedicated herself to mycology, the study of ______ more than 350 paintings of the fungal species she observed in nature and submitting her research on spore germination to the Linnean Society of London.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["fungi; producing","fungi. Producing","fungi producing","fungi, producing"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between two supplementary phrases following the coordinate clause (“but she…mycology”). This choice correctly uses a comma to mark the boundary between the supplementary noun phrase (“the study of fungi”) that defines the term “mycology” and the supplementary participial phrase (“producing...London”) that provides additional information about the extent to which Potter dedicated herself to mycology. Choice A is incorrect because a semicolon can’t be used in this way to join two supplementary phrases following a coordinate clause. Choice B is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “producing.” Choice C is incorrect. The lack of punctuation results in a sentence that illogically suggests that the study of fungi is producing more than 350 paintings."},{"i":"4b376902","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: NASA uses rovers, large remote vehicles with wheels, to explore the surface of Mars. NASA’s rovers can’t explore regions inaccessible to wheeled vehicles. Rovers are also heavy, making them difficult to land on the planet’s surface. Microprobes, robotic probes that weigh as little as 50 milligrams, could be deployed virtually anywhere on the surface of Mars. Microprobes have been proposed as an alternative to rovers. The student wants to explain an advantage of microprobes.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Despite being heavy, NASA’s rovers can land successfully on the surface of Mars.","Microprobes, which weigh as little as 50 milligrams, could explore areas of Mars that are inaccessible to NASA’s heavy, wheeled rovers.","NASA currently uses its rovers on Mars, but microprobes have been proposed as an alternative.","Though they are different sizes, both microprobes and rovers can be used to explore the surface of Mars."],"a":1,"r":"Choice B is the best answer. The sentence explains an advantage of microprobes, noting that because microprobes weigh as little as 50 milligrams, they can explore areas inaccessible to rovers. Choice A is incorrect. The sentence indicates that rovers can land successfully on Mars despite their weight; it doesn’t explain an advantage of microprobes. Choice C is incorrect. While the sentence mentions that microprobes have been proposed as an alternative to rovers, it doesn’t explain an advantage of microprobes. Choice D is incorrect. The sentence emphasizes a similarity between microprobes and rovers; it doesn’t explain an advantage of microprobes."},{"i":"6de02dfa","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: ​ Thailand’s annual Songkran Water Festival is held each April. It marks Songkran, the traditional Thai New Year. People splash and spray each other for fun at the festival’s community-wide water fights. In Bangkok, thousands gather along Silom Road for the city’s largest water fight. In Chiang Mai, thousands gather at a historical monument called the Tha Phae Gate for the city’s largest water fight. The student wants to emphasize a similarity in how people in Bangkok and Chiang Mai celebrate Songkran.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The largest water fight in Bangkok takes place along a city street, whereas the largest water fight in Chiang Mai takes place at a historical monument.","In both Bangkok and Chiang Mai, thousands gather to celebrate Songkran with water fights.","People in both Bangkok and Chiang Mai celebrate Songkran, but they don’t do so in exactly the same way.","Each April, people in Thailand celebrate Songkran, the traditional Thai New Year."],"a":1,"r":"Choice B is the best answer. The sentence emphasizes a similarity in how people in Bangkok and Chiang Mai celebrate Songkran, indicating that people in both cities gather to celebrate with water fights. Choice A is incorrect. The sentence notes the different locations of the largest water fight in Bangkok and the largest water fight in Chiang Mai; it doesn’t emphasize a similarity in how people in Bangkok and Chiang Mai celebrate Songkran. Choice C is incorrect. The sentence indicates that people in Bangkok and Chiang Mai don’t celebrate Songkran in exactly the same way; it doesn’t emphasize a similarity in how people in the two cities celebrate Songkran. Choice D is incorrect. The sentence explains when people in Thailand celebrate Songkran; it doesn’t emphasize a similarity in how people in Bangkok and Chiang Mai celebrate Songkran."},{"i":"42870a4e","c":"trans","d":"E","s":"Marcel Duchamp intended his 1917 so-called ready-made sculpture Fountain to challenge then-prevailing conceptions about the nature of art. ______ Duchamp’s Fountain did just that, raising the question of whether displaying any object in an art gallery could be said to transform the object—even, as Duchamp’s sculpture was, a urinal—into a legitimate work of art.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","Indeed,","Instead,","In addition,"],"a":1,"r":"Choice B is the best answer. \"Indeed\" logically signals that the information in this sentence—that the sculpture raised the question of whether displaying any object in an art gallery transforms the object into a work of art—offers emphasis in support of the claim in the previous sentence that the sculpture was intended to challenge conceptions about the nature of art. Choice A is incorrect because \"similarly\" illogically signals that information in this sentence is similar to the claim about the sculptor’s intention in the previous sentence. Instead, the information about the question raised by the sculpture offers emphasis in support of that claim. Choice C is incorrect because \"instead\" illogically signals that the information in this sentence is an alternative to the claim about the sculptor’s intention in the previous sentence. Rather, the information about the question raised by the sculpture offers emphasis in support of that claim. Choice D is incorrect because \"in addition\" illogically signals that the information in this sentence is merely an additional fact related to the claim about the sculptor’s intention in the previous sentence. Instead, the information about the question raised by the sculpture offers emphasis in support of that claim."},{"i":"6916c8e5","c":"trans","d":"E","s":"Laetitia Ky’s hair is her art. Inspired by hairstyles from various African tribes, the Ivorian artist uses wire and thread to sculpt her hair into all kinds of shapes. ______ she once made her hair into the shape of the continent of Africa—including the island of Madagascar!\n\nWhich choice completes the text with the most logical transition?","o":["Soon,","Elsewhere,","For example,","However,"],"a":2,"r":"Choice C is the best answer. “For example” logically signals that the following information about Ky—that she once shaped her hair to look like Africa—is an example supporting the previous statement that she makes different shapes with her hair. Choice A is incorrect because “soon” illogically signals that the event described in this sentence occurred soon after the statement about Ky making different shapes with her hair. Instead, the sentence provides an example of one of these shapes. Choice B is incorrect because “elsewhere” illogically signals that the event described in this sentence occurred in a different place than the statement about Ky making different shapes with her hair. Instead, the sentence provides an example of one of these shapes. Choice D is incorrect because “however” illogically signals that the information in this sentence contrasts with the statement that Ky makes different shapes with her hair. Instead, the sentence provides an example of one of these shapes."},{"i":"42d92dea","c":"trans","d":"E","s":"Before it unveiled a massive new gallery in 2009, the Art Institute of Chicago was only able to display about 5% of its art collection. ______ the museum is able to display close to 30% of its collection.\n\nWhich choice completes the text with the most logical transition?","o":["Additionally,","For example,","Nevertheless,","Today,"],"a":3,"r":"Choice D is the best answer. \"Today\" logically signals that the information in the sentence—that the museum is able to display close to 30% of its collection—is true of the Art Institute of Chicago as it exists in the present day after the previously mentioned unveiling of the massive new gallery in 2009. Choice A is incorrect because \"additionally\" illogically signals that the information in the sentence is merely an additional fact related to the information about the museum before the new gallery opened. Instead, the sentence is about the museum in the present day after the new gallery opened. Choice B is incorrect because \"for example\" illogically signals that the information in the sentence exemplifies the previous information about the museum before the new gallery opened. Instead, the sentence is about the museum in the present day after the new gallery opened. Choice C is incorrect because \"nevertheless\" illogically signals that the information in the sentence is true despite the previous information about the museum before the new gallery opened. Instead, the sentence is about the museum in the present day after the new gallery opened."}],"img":{"010fa3f0":"iVBORw0KGgoAAAANSUhEUgAAArwAAAE8BAMAAADQzH81AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABiNklEQVR42u19d3wTx/P2s3eS3K2VXKi2z4USQpHpHZkWkhAQnYQQRA0JJBhS6MQk9BbTEmowvQdD6FWmd8v0ast0gm2tbKotad8/XLCNCRDs/JL3qwmf+HS3Nzv77NzezOzsHuAgBznIQQ5ykIMc9FZEJJDs42CafSRoADUVNPkLZ/6hec7pcv0IJB3oy+sSNJkcCM3LD4CQ7zZC5W1A1DlnVblKP78r6KWtyj6gr2p+ILwpzVd19m3aHExyBPGi9I3Q/e2a9En2j48ACKAAFNGQXb+riM5Xui8AQsRHeU6eAdwMWcfLnc5lVu8aldPMwOcYGqHUAnDRZ0H6RfYV8dRdCkDKvIdQOId3bQzl9e00V82uWg0AItXLvqvU9cW58CRZvQBAUyr7/NFXtH/hVY1ntSiAggICAMDdBFcGgOAggAYA4GY7LmV2lke1aICqXxdehdE5Olj0lkKoGoEN4C2N0AptINaKopXDqzTbqINMKwRpIQZTMQwIFr0lwOkJvEKolw9VI1BsTM4C/mcgVtWIUIeWnoHqUnAoXCJDG6NqGCSiXiVBbExCq function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}
function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
