<script>
const D={"t":"Practicetest29","q":[{"i":"8d579825","c":"vocab","d":"E","s":"The printing of Virginia Woolf’s novels featured a creative ______ between Woolf and her sister Vanessa Bell: a talented painter, Bell worked closely with Woolf to create original cover art for most of the novels.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["rebellion","partnership","discovery","disagreement"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the cover art of Virginia Woolf’s novels. In this context, “partnership” means collaboration or joint effort. The text states that Woolf’s sister Vanessa Bell was a talented painter and that Bell worked with Woolf to provide the cover art for most of Woolf’s novels. Thus, this context suggests that Woolf and Bell pursued a creative partnership in order to produce several of Woolf’s novels. Choice A is incorrect because there is no indication that Woolf or Bell were undergoing a “rebellion,” or revolt, against anything in particular. Instead, the text focuses on how they worked together in some aspects of the production of Woolf’s novels. Choice C is incorrect because there is nothing in the text to indicate that Woolf or Bell made a “discovery,” or encountered anything new for the first time as they worked together. The text suggests that Woolf had already written her novels and that Bell then assisted Woolf with the cover art for many of them. Choice D is incorrect because the text implies that Woolf and Bell had a positive relationship. According to the text, the sisters “worked closely” together to produce the cover art for many of Woolf’s novels; the text doesn’t mention whether while working together, Woolf and Bell had a “disagreement,” or conflict."},{"i":"f3fac04f","c":"vocab","d":"E","s":"Bioluminescent beetles called fireflies may seem to create flashes of light randomly, but each species of firefly actually has its own special series of repeated flashes and pauses. These unique ______ allow fireflies of the same species to find each other.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["quantities","decorations","patterns","agreements"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the flashes created by fireflies. In this context, “patterns” means distinct and predictable sequences. The text indicates that although the flashes that fireflies produce appear to occur randomly—that is, without any particular sequence or rhythm—each species actually produces its own special series of flashes and pauses. Indeed, these series of flashes are so unique that fireflies can use them to find other members of their species. Therefore, this context supports the idea that fireflies produce flashes in distinct and recognizable patterns. Choice A is incorrect because “quantities” means certain amounts or numbers of something. Although the text discusses how different firefly species produce flashes and pauses in unique sequences that help other members of their species to find them, it doesn’t mention the number of flashes that are used in these sequences. Choice B is incorrect because in this context, “decorations” would mean things that make an object more beautiful. Although it may be reasonable to say that firefly flashes are beautiful, the text focuses on the fact that fireflies use these unique sequences of flashes to find other members of their own species, not that the flashes make fireflies more beautiful. Choice D is incorrect because in this context, “agreements” would refer to deals that individuals have discussed and come to a consensus about. Since fireflies aren’t capable of making such agreements, it wouldn’t make sense to use this word to refer to the signals they send each other with their flashes."},{"i":"9b2fbb2e","c":"vocab","d":"E","s":"Logically, a damaged fossil should provide less information than an intact one, but for paleontologist Brigitte Schoenemann, a broken area on a fossilized trilobite (a crustacean-like creature) ______ fresh insight, allowing her to view the inner structure of the organism’s eye.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["resolved","adjusted","offered","directed"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion about how, for Schoenemann, a damaged trilobite fossil was informative. In context, “offered” means provided or gave. The text suggests that although it may seem counterintuitive, a broken fossilized trilobite allowed Schoenemann to observe more details of the trilobite’s eye than an intact fossilized trilobite would. This context conveys the idea that a damaged fossil offered, or provided, fresh insight into the structure of a trilobite’s eye. Choice A is incorrect because “resolved” means determined or figured out, which wouldn’t make sense in this context. The text focuses on how Schoenemann was able to get more information from a broken fossil than an intact one. Although the damaged fossil may have allowed her to determine certain information, as an inanimate object the fossil isn’t capable of resolving anything. Choice B is incorrect because saying that the broken part of a trilobite fossil “adjusted,” or changed or modified, fresh insight wouldn’t make sense in this context. The text focuses on how Schoenemann was able to get more information from a broken fossil than an intact one. This context suggests that the fossil offered fresh insight, or understanding, not that it adjusted fresh insight. Choice D is incorrect because “directed” means managed or instructed, which wouldn’t make sense in this context. The text focuses on how Schoenemann was able to get more information from a broken fossil than an intact one. This context suggests that the fossil offered fresh insight, or understanding, not that it directed fresh insight."},{"i":"9e501aaf","c":"vocab","d":"E","s":"Research conducted by planetary scientist Katarina Miljkovic suggests that the Moon’s surface may not accurately ______ early impact events. When the Moon was still forming, its surface was softer, and asteroid or meteoroid impacts would have left less of an impression; thus, evidence of early impacts may no longer be present.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["reflect","receive","evaluate","mimic"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the Moon’s surface. In this context, “reflect” means show or make apparent. The text states that because the surface of the Moon was softer when the Moon was still forming than it is now, early asteroid and meteoroid impacts “would have left less of an impression” and, as a result, evidence of them may no longer exist. This context supports the idea that the surface of the Moon may not accurately show signs of early impact events. Choice B is incorrect because it wouldn’t make sense to say that the surface of the Moon may not accurately “receive,” or acquire or experience, early impacts from asteroids or meteoroids. The text indicates that the impacts have already occurred, and it isn’t clear how the Moon’s surface could be accurate or inaccurate in experiencing them. Choice C is incorrect because it wouldn’t make sense to say that the surface of the Moon may not accurately “evaluate,” or determine the significance or condition of, early impacts from asteroids or meteoroids, since that would suggest that it’s possible for the Moon’s surface to make a decision of any kind. Choice D is incorrect. In this context, “mimic” would mean to deliberately simulate or closely imitate something. It wouldn’t make sense to say that the surface of the Moon may not accurately mimic early asteroid and meteoroid impacts, since that would suggest that it’s possible for the Moon to deliberately imitate something."},{"i":"d9e55268","c":"purpose","d":"M","s":"The following text is adapted from Louise Erdrich’s 2020 novel The Night Watchman. Louis Pipestone is collecting signatures for a petition from fellow members of the Turtle Mountain Band of Chippewa on the tribe’s reservation in North Dakota. Louis Pipestone tended the petition like a garden. He kept it with him at all times. In town, his eyes sharpened when he noticed a tribal member who hadn’t yet signed. Wherever they were—at the gas pump, mercantile [general store], at Henry’s [Café], on the road, or outside the clinic and hospital—Louis cornered them. If they were waiting for a baby to be born, he’d have them sign. If they were laughing, if they were arguing. If they were taking a child home from school, they signed. ©2020 by Louise Erdrich Which choice best states the main purpose of the text?","o":["To suggest that some tribal members refuse to sign the petition because they dislike Louis Pipestone","To show that attitudes toward the petition within the tribal community change over time","To demonstrate that most tribal members are enthusiastic about signing the petition","To portray Louis Pipestone’s strong commitment to collecting signatures for the petition"],"a":3,"r":"Choice D is the best answer because it most accurately states the text’s main purpose. The text indicates that Louis always had his petition with him, asked everyone he encountered to sign it if they hadn’t already, and lists several comical circumstances in which he might try to get someone to sign. Thus, the main purpose of the text is to illustrate Louis’s dedicated focus on getting people to sign the petition. Choice A is incorrect. Although the text suggests that Louis was aggressive in seeking signatures for the petition—for example, saying that he \"cornered\" people—nothing in the text addresses how those people feel toward Louis, let alone that they are refusing his request. Choice B is incorrect because, other than portraying Louis’s commitment to gathering signatures, the text doesn’t discuss community members’ attitudes toward Louis or the petition. Choice C is incorrect because the text never mentions the attitudes of the people Louis approaches toward the petition, but the text does indicate that he \"cornered\" prospective signatories, strongly suggesting that their enthusiasm was neither needed nor considered."},{"i":"1782cdd7","c":"purpose","d":"E","s":"In many agricultural environments, the banks of streams are kept forested to protect water quality, but it’s been unclear what effects these forests may have on stream biodiversity. To investigate the issue, biologist Xingli Giam and colleagues studied an Indonesian oil palm plantation, comparing the species richness of forested streams with that of nonforested streams. Giam and colleagues found that species richness was significantly higher in forested streams, a finding the researchers attribute to the role leaf litter plays in sheltering fish from predators and providing food resources.\n\nWhich choice best states the main purpose of the text?","o":["It discusses research intended to settle a debate about how agricultural yields can be increased without negative effects on water quality.","It explains the differences between stream-protection strategies used in oil palm plantations and stream-protection strategies used in other kinds of agricultural environments.","It describes findings that challenge a previously held view about how fish that inhabit streams in agricultural environments attempt to avoid predators.","It presents a study that addresses an unresolved question about the presence of forests along streams in agricultural environments."],"a":3,"r":"Choice D is the best answer. The author first describes an unresolved question: what effect do bank forests have on stream biodiversity? Then the author presents a study that answers the question: bank forests increase stream biodiversity. Choice A is incorrect. This isn’t the main purpose of the text. The text never mentions agricultural yields. Choice B is incorrect. This isn’t the main purpose of the text. The text never mentions other kinds of agricultural environments. Choice C is incorrect. This isn’t the main purpose of the text. The text never mentions any previously held view about how fish in these streams try to avoid predators."},{"i":"df46a2ee","c":"func","d":"M","s":"The following text is from Joseph Conrad’s 1907 novel The Secret Agent: A Simple Tale. Mr. Verloc is navigating the London streets on his way to a meeting. Before reaching Knightsbridge, Mr. Verloc took a turn to the left out of the busy main thoroughfare, uproarious with the traffic of swaying omnibuses and trotting vans, in the almost silent, swift flow of hansoms [horse-drawn carriages]. Under his hat, worn with a slight backward tilt, his hair had been carefully brushed into respectful sleekness; for his business was with an Embassy. And Mr. Verloc, steady like a rock—<u>a soft kind of rock<\/u>—marched now along a street which could with every propriety be described as private.\n\nWhich choice best describes the function of the underlined phrase in the text as a whole?","o":["It qualifies an earlier description of Mr. Verloc.","It emphasizes an internal struggle Mr. Verloc experiences.","It contrasts Mr. Verloc with his surroundings.","It reveals a private opinion Mr. Verloc holds."],"a":0,"r":"Choice A is the best answer. The underline phrase qualifies (meaning adds limits or conditions to) the description of Mr. Verloc as “steady like a rock,” adding that he is a “soft” rock. Choice B is incorrect. In fact, the passage never mentions Mr. Verloc experiencing any internal struggles. Choice C is incorrect. The underlined phrase doesn’t contrast Mr. Verloc with his surroundings, but is instead modifying the description of him as a rock. Choice D is incorrect. The underlined phrase doesn’t reveal a private opinion Mr. Verloc holds: instead, it further describes his character for the reader."},{"i":"ea9dfe27","c":"func","d":"E","s":"The following text is from Joan Didion’s memoir The Year of Magical Thinking. In the text, the author discusses her home life. [I]n California we heated our houses by building fires. We built fires even on summer evenings, because the fog came in. <u>Fires said we were home, we had drawn the circle, we were safe through the night.<\/u> ©2005 by Joan Didion Which choice best describes the function of the underlined portion in the text as a whole?","o":["It illustrates that a fire provides comfort beyond physical warmth.","It summarizes the information that came before it in the text.","It explains that the house remains cold even in summer.","It suggests that the author feels comfortable in her home with or without a fire."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first two sentences of the text establish that in California, houses were heated by building fires year-round. The underlined portion then indicates that the fires didn’t merely provide physical warmth: they also represented being \"home\" and feeling protected. The underlined portion thus illustrates that a fire provides comfort beyond physical warmth. Choice B is incorrect because the underlined portion doesn’t summarize information that came before it. Whereas the previous two sentences describe fires’ ability to provide physical warmth to homes, the underlined portion focuses on the psychological comfort the fires offered. Choice C is incorrect. Although the text’s second sentence mentions that fires were built in the summer because fog came in, which may have cooled the house, this detail isn’t the focus of the underlined portion. Instead, the underlined portion indicates that fires were built for reasons beyond physical warmth: to create a sense of being home and safe. Choice D is incorrect because the underlined portion focuses on the emotional significance the author places on having a fire going inside the home. There is no indication that the author feels equally comfortable without a fire present."},{"i":"e4e2aeb3","c":"cross","d":"H","s":"Text 1 Like the work of Ralph Ellison before her, Toni Morrison’s novels feature scenes in which characters deliver sermons of such length and verbal dexterity that for a time, the text exchanges the formal parameters of fiction for those of oral literature. Given the many other echoes of Ellison in Morrison’s novels, both in structure and prose style, <u>these scenes suggest Ellison’s direct influence on Morrison.<\/u>\n\nText 2 In their destabilizing effect on literary form, the sermons in Morrison’s works recall those in Ellison’s. Yet literature by Black Americans abounds in moments where interpolated speech erodes the division between oral and written forms that literature in English has traditionally observed. Morrison’s use of the sermon is attributable not only to the influence of Ellison but also to a community-wide strategy of resistance to externally imposed literary conventions.\n\nBased on the texts, how would the author of\n\nText 2 most likely characterize the underlined claim in\n\nText 1?","o":["As failing to consider Ellison’s and Morrison’s equivalent uses of the sermon within the wider cultural context in which they wrote","As misunderstanding the function of sermons in novels by Black American writers other than Ellison and Morrison","As disregarding points of structural and stylistic divergence between the works of Ellison and those of Morrison","As being indebted to the tradition of resisting literary conventions that privilege written forms, such as novels, over sermons and other oral forms"],"a":0,"r":"Choice A is the best answer. The author of Text 2 argues that Morrison’s use of the sermon is not only influenced by Ellison, but also by a “community-wide strategy of resistance” to literary conventions practiced by Black American authors. Ellison, Text 2 alleges, is only one of many influences on Morrison. Choice B is incorrect. Neither text specifically mentions sermons in works by authors other than Morrison or Ellison, only a tendency towards eroding “the division between oral and written forms” among Black American writers. Choice C is incorrect. Both texts describe similarities between the works of Ellison and Morrison, and neither points out instances of divergence. Text 2 simply suggests that Morrison was influenced by more than just Ellison. Choice D is incorrect. While Text 2 does discuss Morrison’s resistance to certain literary conventions, it’s unclear what it would mean for the underlined claim to be “indebted” to that tradition. This choice recycles language from the text, but not in a way that makes any coherent point."},{"i":"40630cef","c":"main","d":"E","s":"The following text is from David Barclay Moore’s 2022 novel Holler of the Fireflies. The narrator has just arrived at summer camp, which is far away from his home. This place was different than I thought it would be. I’d never been somewhere like this before. I did feel scared, but also excited. ©2022 by David Barclay Moore According to the text, how does the narrator feel about being at summer camp?","o":["He feels overjoyed.","He feels peaceful.","He feels both scared and excited.","He feels both angry and jealous."],"a":2,"r":"Choice C is the best answer because it most accurately states how the narrator feels about being at summer camp. In the text, the narrator states that after arriving at the camp, he found it to be different than he’d expected and that as a result, he felt \"scared, but also excited.\" Choice A is incorrect. In the text, the narrator describes himself as \"excited.\" Although excitement is a positive emotion, it isn’t as intensely positive as feeling overjoyed is. Moreover, the narrator also notes that he felt \"scared.\" In other words, his excitement (a positive emotion) is balanced with fear (a negative emotion). Given this mixture of positive and negative emotions, it would be inaccurate to characterize the narrator as overjoyed. Choice B is incorrect because in the text, the narrator describes himself as having felt both fear and excitement. Neither of these emotions can be thought of as peaceful and, in fact, are almost the opposite of a sense of peace. Choice D is incorrect because in the text, the narrator describes himself as both \"scared\" and \"excited,\" not angry and jealous."},{"i":"3543e6e2","c":"main","d":"E","s":"The following text is from Jane Austen’s 1811 novel Sense and Sensibility. Elinor lives with her younger sisters and her mother, Mrs. Dashwood. Elinor, this eldest daughter, whose advice was so effectual, possessed a strength of understanding, and coolness of judgment, which qualified her, though only nineteen, to be the counsellor of her mother, and enabled her frequently to counteract, to the advantage of them all, that eagerness of mind in Mrs. Dashwood which must generally have led to imprudence. She had an excellent heart;—her disposition was affectionate, and her feelings were strong; but she knew how to govern them: it was a knowledge which her mother had yet to learn; and which one of her sisters had resolved never to be taught.\n\nAccording to the text, what is true about Elinor?","o":["Elinor often argues with her mother but fails to change her mind.","Elinor can be overly sensitive with regard to family matters.","Elinor thinks her mother is a bad role model.","Elinor is remarkably mature for her age."],"a":3,"r":"Choice D is the best answer because it provides a detail about Elinor that is established in the text. The text indicates that although Elinor is “only nineteen,” she gives good advice and exhibits such a high level of understanding and judgment that she serves as “the counsellor of her mother.” Thus, Elinor is mature beyond her years. Choice A is incorrect because it isn’t supported by the text: although the text says that Elinor advises her mother and often counteracts her mother’s impulses, there’s no mention of Elinor arguing with her mother or failing to change her mother’s mind. Choice B is incorrect because it isn’t supported by the text: although the text mentions that Elinor has strong feelings, it doesn’t indicate that she’s excessively sensitive when it comes to family issues. Choice C is incorrect because it isn’t supported by the text: there’s no mention of what Elinor thinks about her mother and no suggestion that she thinks her mother is a bad role model. Because she’s described as having “an excellent heart,” Elinor likely doesn’t think ill of her mother."},{"i":"1d0b5bf4","c":"infer","d":"E","s":"To create the poems in her 2017 collection One Last Word, poet Nikki Grimes used a writing method called the golden shovel. This method often involves choosing a line from an existing poem and then using each word from that line as the last word of each line in a new poem. Grimes wanted the poems in One Last Word to honor important Black poets of the past, so she chose lines by poets such as Langston Hughes and Georgia Douglas Johnson. Writing in this way can be challenging and might seem as though it would produce awkward poems. However, reviewers praised One Last Word as a beautiful and powerful tribute to the poets who inspired it. This reaction suggests that ______ Which choice most logically completes the text?","o":["most reviewers didn’t understand Grimes’s goal for One Last Word.","Grimes successfully used the golden shovel method to achieve her goal for One Last Word.","Langston Hughes and Georgia Douglas Johnson are two of Grimes’s favorite poets.","Grimes inspired many other writers to create poems using the golden shovel method."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Nikki Grimes’s poetry collection One Last Word. The text explains that Grimes used a writing method called the golden shovel to create the poems in her book. According to the text, the method involves basing a new poem on a line from an existing poem. The text then mentions Langston Hughes and Georgia Douglas Johnson as examples of important Black poets whose lines of poetry form the basis of Grimes’s poems. The text goes on to say that this writing method is difficult and that the resulting poems can be awkward, but reviewers have positively reviewed Grimes’s book. If the reviewers of One Last Word specifically note that the work is a “beautiful and powerful tribute to the poets who inspired it,” then they must have appreciated how Grimes used the golden shovel method to pay tribute to other poets. This suggests that Grimes was successful in using the golden shovel method to achieve her goal of honoring Black poets in her book. Choice A is incorrect because the reaction suggests that most reviewers did understand Grimes’s goal for her book. According to the text, the reviewers noted that the poems in her book were a “beautiful and powerful tribute to the poets who inspired it.” Earlier, the text claims that Grimes intended the poems “to honor important Black poets of the past,” so in their praise of her book, the reviewers clearly indicated that they understood Grimes’s goal. Choice C is incorrect. Although it’s likely that Grimes sought to honor Hughes and Johnson in her book of poetry because they’re among her favorite poets, this fact isn’t suggested by the reviewers’ positive reaction to her book. Instead, the reaction suggests that Grimes was successful in her use of the golden shovel method. Choice D is incorrect because the text doesn’t discuss whether other writers were inspired by Grimes to use the golden shovel method in their poetry. The text mentions the poets Hughes and Johnson as examples of poets honored in Grimes’s book and describes reviewers’ positive reception of her book, but it doesn’t detail Grimes’s impact on other writers."},{"i":"01989d77","c":"infer","d":"E","s":"Microbes that live in shallow lakes and ponds produce methane, a harmful greenhouse gas. Ecologist Ralf Aben and his team wanted to see how different types of shallow-water plants might affect the amount of methane that escapes into the atmosphere. Aben’s team set up some water tanks with soil and microbes from local ponds. Some tanks had a type of underwater plant that grows in the soil called watermilfoil. Other tanks had either duckweed, a type of plant that floats on the water’s surface, or algae. Aben and his team found that tanks with duckweed and algae released higher levels of methane than tanks with watermilfoil did. This finding suggests that ______ Which choice most logically completes the text?","o":["the presence of some kinds of underwater plants like watermilfoil helps prevent methane from escaping shallow lakes and ponds.","shallow lakes and ponds release more methane than deeper bodies of water because shallow bodies of water usually have more plants than deep bodies of water do.","shallow lakes and ponds are more likely to contain algae than to contain either watermilfoil or duckweed.","having a mix of algae, underwater plants, and floating plants is the best way to reduce the amount of methane in shallow lakes and ponds."],"a":0,"r":"Choice A is the best answer. The passage tells us that “tanks with duckweed (a floating plant) and algae released higher levels of methane than tanks with watermilfoil (an underwater plant) did.” This suggests that the presence of some kinds of underwater plants like watermilfoil may help prevent methane from escaping shallow lakes and ponds. Choice B is incorrect. The passage doesn’t mention deeper bodies of water at all, so there’s no basis for this inference. Choice C is incorrect. The passage doesn’t compare the likelihood of shallow lakes and ponds containing algae, watermilfoil, or duckweed. Choice D is incorrect. The study didn’t include any tanks with a mix of plants, so there’s no basis for this inference."},{"i":"ec93e52c","c":"claim","d":"H","s":"Archaeologist Petra Vaiglova, anthropologist Xinyi Liu, and their colleagues investigated the domestication of farm animals in China during the Bronze Age (approximately 2000 to 1000 BCE). By analyzing the chemical composition of the bones of sheep, goats, and cattle from this era, the team determined that wild plants made up the bulk of sheep’s and goats’ diets, while the cattle’s diet consisted largely of millet, a crop cultivated by humans. The team concluded that cattle were likely raised closer to human settlements, whereas sheep and goats were allowed to roam farther away.\n\nWhich finding, if true, would most strongly support the team’s conclusion?","o":["Analysis of the animal bones showed that the cattle’s diet also consisted of wheat, which humans widely cultivated in China during the Bronze Age.","Further investigation of sheep and goat bones revealed that their diets consisted of small portions of millet as well.","Cattle’s diets generally require larger amounts of food and a greater variety of nutrients than do sheep’s and goats’ diets.","The diets of sheep, goats, and cattle were found to vary based on what the farmers in each Bronze Age settlement could grow."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would most strongly support the team’s conclusion that cattle were likely raised closer to human settlements than sheep and goats were. The text explains that Vaiglova, Liu, and their colleagues analyzed the chemical composition of sheep, goat, and cattle bones from the Bronze Age in China in order to investigate the animals’ domestication, or their adaptation from a wild state to a state in which they existed in close connection with humans. According to the text, the team’s analysis showed that sheep and goats of the era fed largely on wild plants, whereas cattle fed on millet—importantly, a crop cultivated by humans. If analysis of the animal bones shows that the cattle’s diet also consisted of wheat, another crop cultivated by humans in China during the Bronze Age, the finding would support the team’s conclusion by offering additional evidence that cattle during this era fed on human-grown crops—and, by extension, that humans raised cattle relatively close to the settlements where they grew these crops, leaving goats and sheep to roam farther away in areas with wild vegetation, uncultivated by humans. Choice B is incorrect because if it were true that sheep’s and goats’ diets consisted of small portions of millet, which the text states was a crop cultivated by humans, the finding would suggest that sheep and goats were raised relatively close to human settlements, weakening the team’s conclusion that cattle were likely raised closer to those settlements than sheep and goats were. Choice C is incorrect because the finding that cattle generally require more food and nutrients than do sheep and goats wouldn’t support the team’s conclusion that cattle were likely raised closer to human settlements than sheep and goats were. Nothing in the text suggests that cattle were incapable of obtaining sufficient food and nutrients without access to human-grown crops. Hence, even if cattle’s diets are found to have different requirements than the diets of sheep and goats, the cattle could have met those requirements from food located far from human settlements. Choice D is incorrect because if it were true that the diets of sheep, goats, and cattle varied based on what the farmers in each Bronze Age settlement could grow, the finding would weaken the team’s conclusion that cattle were likely raised closer to human settlements than sheep and goats were, suggesting instead that all three types of animals were raised close enough to human settlements to feed on those settlements’ crops."},{"i":"3f7f35ea","c":"claim","d":"E","s":"“The Bet” is an 1889 short story by Anton Chekhov. In the story, a banker is described as being very upset about something: ______ Which quotation from “The Bet” most effectively illustrates the claim?","o":["“Then the banker cautiously broke the seals off the door and put the key in the keyhole.”","“It struck three o’clock, the banker listened; everyone was asleep in the house and nothing could be heard outside but the rustling of the chilled trees.”","“The banker, spoilt and frivolous, with millions beyond his reckoning, was delighted at the bet.”","“When [the banker] got home he lay on his bed, but his tears and emotion kept him for hours from sleeping.”"],"a":3,"r":"Choice D is the best answer because it most effectively uses a quotation from \"The Bet\" to illustrate the claim that the banker was very upset about something. The quotation indicates that the banker shed tears, which suggests that he was likely unhappy about something, and that his emotions were so strong that they kept him from sleeping for hours. These details suggest that the banker was very upset. Choice A is incorrect because this quotation mainly describes the banker cautiously unlocking a door; it doesn’t suggest that he was particularly upset about anything. Choice B is incorrect because this quotation doesn’t mention whether the banker was experiencing any particularly strong negative feelings; instead, the quotation focuses on the quietness of the setting. Choice C is incorrect because this quotation states that the banker was feeling \"delighted,\" not that he was upset."},{"i":"df34b586","c":"graph","d":"E","s":"","o":["the Philippines increased dramatically from 1908 to 1918.","New Zealand were largely consistent from 1903 to 1918.","Australia increased steadily from 1903 to 1918.","Turkey declined substantially from 1913 to 1918."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the graph to complete the example. According to the graph, fewer than 10,000 sewing machines were sold in the Philippines in both 1903 and 1908, but nearly 30,000 were sold in 1913 and around 45,000 were sold in 1918. This increase illustrates the statement in the text that demand for Singer sewing machines grew significantly in the early twentieth century in overseas countries other than Russia, Germany, and the United Kingdom. Choice B is incorrect because consistent sales of Singer sewing machines in New Zealand from 1903 to 1918 do not indicate that demand for the product increased but rather that demand remained relatively the same. Choice C is incorrect because it does not accurately describe the data in the graph. Although sales in Australia did increase somewhat between 1903 and 1908, there was very little change between 1908 and 1913, and then sales declined between 1913 and 1918. The data for Australia, then, do not show a steady increase from 1903 to 1918. Choice D is incorrect because declining sales of Singer sewing machines in Turkey from 1913 to 1918 do not point to an increase in demand for the product but rather to a decline in demand."},{"i":"9452092c","c":"graph","d":"H","s":"","o":["broccoli grown in soil containing mycorrhizal fungi had a slightly higher average mass than broccoli grown in soil that had been treated to kill fungi.","corn grown in soil containing mycorrhizal fungi had a higher average mass than broccoli grown in soil containing mycorrhizal fungi.","marigolds grown in soil containing mycorrhizal fungi had a much higher average mass than marigolds grown in soil that had been treated to kill fungi.","corn had the highest average mass of all three species grown in soil that had been treated to kill fungi, while marigolds had the lowest."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the statement. The text explains that mycorrhizal hosts are plants that benefit from the presence of mycorrhizal fungi in the soil and that some such plants produce more mass when grown in the presence of these fungi, while for nonmycorrhizal species the fungi either have no effect or may be harmful. The experiment included two mycorrhizal hosts (corn and marigold) and one nonmycorrhizal species (broccoli). Given the claim in the text that nonmycorrhizal species will see either no difference or a decrease in mass when exposed to mycorrhizal fungi, the student would likely have been surprised by the higher average mass for broccoli grown in the presence of the fungi than the broccoli grown in the soil treated to kill fungi. Choice B is incorrect. Although this choice accurately describes the corn data from the table, the fact that the mycorrhizal host corn is more massive in the presence of the fungi likely fits with what the student expected and would therefore not be surprising. Choice C is incorrect. Although this choice accurately describes the marigold data from the table, the fact that the mycorrhizal host marigold is more massive in the presence of the fungi is likely what the student expected and thus would not be surprising. Choice D is incorrect because it does not accurately represent the data in the table—when grown in soil treated to kill fungi, corn had an average mass of 3.8 g while broccoli had an average mass of 7g—and because making comparisons among the plants in the no-fungi condition, by itself, does not provide a basis to compare the average mass of mycorrhizal hosts and nonmycorrhizal species grown in the presence of the fungi with those grown in the soil treated to kill fungi."},{"i":"16740ab4","c":"fss","d":"H","s":"At the Chicxulub asteroid impact crater in Mexico, the presence of many fossilized microbacteria, which seem to have thrived there despite the extreme heat that persisted after the Chicxulub impact, ______ claims that bacteria are among the planet’s most resilient organisms.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have reinforced","reinforces","are reinforcing","reinforce"],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-verb agreement. The singular verb “reinforces” agrees in number with the singular subject “the presence.” Choice A is incorrect because the plural verb “have reinforced” doesn’t agree in number with the singular subject “the presence.” Choice C is incorrect because the plural verb “are reinforcing” doesn’t agree in number with the singular subject “the presence.” Choice D is incorrect because the plural verb “reinforce” doesn’t agree in number with the singular subject “the presence.”"},{"i":"1f8cd95f","c":"fss","d":"M","s":"In the 1950s, a man named Joseph McVicker was struggling to keep his business afloat when his sister-in-law Kay Zufall advised him to repurpose the company’s product, a nontoxic, clay-like substance for removing soot from wallpaper, as a modeling putty for kids. In addition, Zufall ______ selling the product under a child-friendly name: Play-Doh.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["suggested","suggests","had suggested","was suggesting"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the simple past tense verb “suggested” properly indicates that Zufall offered her suggestion for the product’s name in the past. This verb tense is consistent with the previous sentence’s use of a simple past tense verb (“advised”) to describe Zufall’s advice to McVicker in the 1950s. Choice B is incorrect because the present tense verb “suggests” doesn’t indicate that Zufall offered her suggestion in the past. Choice C is incorrect because the past perfect verb “had suggested” isn’t consistent with the previous sentence’s use of the simple past tense verb “advised” to describe Zufall’s advice to McVicker. Choice D is incorrect because the past progressive verb “was suggesting” isn’t consistent with the previous sentence’s use of the simple past tense verb “advised” to describe Zufall’s advice to McVicker."},{"i":"f0f9bf8f","c":"fss","d":"E","s":"Félix González-Torres debuted his sculpture “Untitled” (USA Today) in New York City in 1990. The work consists of piled candy, a material González-Torres became known for. ______ created additional installations using a variety of sweets, like bubblegum, lollipops, and chocolates.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["They all","Those","Both","He"],"a":3,"r":"Choice D is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"he\" agrees in number with the singular antecedent \"Félix González-Torres,\" and it clearly indicates that González-Torres created the additional installations. Choice A is incorrect because the plural noun phrase \"they all\" doesn’t agree in number with the singular antecedent \"Félix González-Torres,\" and it doesn’t clearly indicate that he (González-Torres) created the additional installations. Choice B is incorrect because the plural pronoun \"those\" doesn’t agree in number with the singular antecedent \"Félix González-Torres,\" and it doesn’t clearly indicate that he (González-Torres) created the additional installations. Choice C is incorrect because the plural pronoun \"both\" doesn’t agree in number with the singular antecedent \"Félix González-Torres,\" and it doesn’t clearly indicate that he (González-Torres) created the additional installations."},{"i":"be37d4ae","c":"bound","d":"H","s":"During the English neoclassical period (1660–1789), many writers imitated the epic poetry and satires of ancient Greece and Rome. They were not the first in England to adopt the literary modes of classical ______ some of the most prominent figures of the earlier Renaissance period were also influenced by ancient Greek and Roman literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["antiquity, however","antiquity, however,","antiquity, however;","antiquity; however,"],"a":2,"r":"Choice C is the best answer. The convention being tested is the punctuation of a supplementary phrase following a clause. This choice uses a comma to separate the supplementary adverb phrase \"however\" from the independent clause it modifies (\"They...antiquity\") and uses a semicolon to join the first independent clause (\"They...antiquity\") and the second independent clause (\"some...literature\"). Further, placing the semicolon after \"however\" indicates that the information in the clause that this is part of (that neoclassical writers were not the first to adopt classical literary modes) is contrary to what might be assumed from the information in the previous sentence (that the neoclassical writers were unique in imitating classical epic poetry and satires). Choice A is incorrect because it fails to mark the boundary after \"however\" between the two independent clauses with appropriate punctuation. Choice B is incorrect because the comma after \"however\" can’t be used in this way to mark the boundary between the two independent clauses. Choice D is incorrect because placing the semicolon after \"antiquity\" illogically indicates that the information in the clause that this is part of (that prominent Renaissance figures were also influenced by classical literature) is contrary to the information in the previous clause (that neoclassical writers were not the first to adopt classical literary modes)."},{"i":"a3e87535","c":"bound","d":"M","s":"Julia Alvarez’s 1994 novel In the Time of the Butterflies, a fictionalized account of the lives of the Mirabal ______ can serve as a starting point for those wanting to explore how the rule of dictator Rafael Trujillo has been represented in Dominican American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["sisters, and","sisters and","sisters,","sisters"],"a":2,"r":"Choice C is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. The comma after \"sisters\" pairs with the comma after \"Butterflies\" to separate the supplementary element \"a fictionalized account of the lives of the Mirabal sisters\" from the rest of the sentence. This supplementary element functions to describe the novel In the Time of the Butterflies, and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because a comma and conjunction can’t be used in this way to separate the supplementary element from the rest of the sentence. Choice B is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence. Choice D is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence."},{"i":"7c9d0e38","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Roughly 96% of Australia’s estimated 200,000 animal species are invertebrates. Invertebrates of the order Hymenoptera, which consists of sawflies, wasps, bees, and ants, are estimated to total 14,800 species in Australia. Invertebrates of the order Coleoptera, which consists of beetles and weevils, are estimated to total 28,200 species in Australia. Some of these invertebrates’ populations are threatened by invasive bird and fish species. The student wants to emphasize the different orders in which Australia’s invertebrate animals are classified.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In Australia, 28,200 species are estimated to be beetles and weevils, both classified as invertebrates of the order Coleoptera.","Among Australia’s many invertebrates, sawflies, wasps, bees, and ants belong to the order Hymenoptera, while beetles and weevils belong to the order Coleoptera.","Many sawflies, wasps, bees, and ants of the order Hymenoptera are threatened by some of Australia’s invasive bird and fish species.","The order Hymenoptera is estimated to make up 14,800 of Australia’s 200,000 animal species."],"a":1,"r":"Choice B is the best answer. The sentence emphasizes the different orders that Australia’s invertebrates belong to, specifying that sawflies, wasps, bees, and ants belong to the order Hymenoptera, whereas beetles and weevils belong to the order Coleoptera. Choice A is incorrect. The sentence only mentions one order, Coleoptera; it doesn’t emphasize the different orders that Australia’s invertebrates belong to. Choice C is incorrect. The sentence only mentions one order, Hymenoptera; it doesn’t emphasize the different orders that Australia’s invertebrates belong to. Choice D is incorrect. The sentence only mentions one order, Hymenoptera; it doesn’t emphasize the different orders that Australia’s invertebrates belong to."},{"i":"dd11e5ab","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Muckrakers were journalists who sought to expose corruption in US institutions during the Progressive Era (1897–1920). Ida Tarbell was a muckraker who investigated the Standard Oil Company. She interviewed Standard Oil Company executives, oil industry workers, and public officials. She examined thousands of pages of the company’s internal communications, including letters and financial records. Her book The History of the Standard Oil Company (1904) exposed the company’s unfair business practices. The student wants to emphasize the thoroughness of Ida Tarbell’s investigation of the Standard Oil Company.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Ida Tarbell not only interviewed Standard Oil executives, oil industry workers, and public officials but also examined thousands of pages of the company’s internal communications.","Ida Tarbell, who investigated the Standard Oil Company, was a muckraker (a journalist who sought to expose corruption in US institutions during the Progressive Era, 1897–1920).","As part of her investigation of the Standard Oil Company, muckraker Ida Tarbell conducted interviews.","Published in 1904, muckraker Ida Tarbell’s book The History of the Standard Oil Company exposed the company’s unfair business practices."],"a":0,"r":"Choice A is the best answer. It describes Tarbell’s investigation and the lengths she went to complete it. Choice B is incorrect. This choice doesn’t describe how thorough Tarbell was. Instead, it gives a biographical sketch. Choice C is incorrect. This choice doesn’t describe how thorough Tarbell was. Tarbell didn’t only conduct interviews—she also “examined thousands of pages of the company’s internal communications.” Choice D is incorrect. This choice doesn’t describe how thorough Tarbell was. It describes her book but doesn’t include anything about her investigation."},{"i":"335bbe3e","c":"trans","d":"M","s":"In his painting At the Cycle-Race Track, Jean Metzinger aims to depict a bike race in four-dimensional space. Of course, Metzinger’s painting doesn’t technically represent a fourth dimension; humans can only see in three dimensions. ______ by depicting the race through multiple, simultaneous perspectives, Metzinger offers a fascinating glimpse at what this other universe might look like.\n\nWhich choice completes the text with the most logical transition?","o":["Moreover,","That said,","In other words,","For example,"],"a":1,"r":"Choice B is the best answer. \"That said\" logically signals that the statement in this sentence—that Metzinger offers a glimpse of four-dimensional space by depicting multiple, simultaneous perspectives—is true despite the point in the previous sentence (that Metzinger’s painting doesn’t technically represent a fourth dimension because humans can only see in three dimensions). Choice A is incorrect because \"moreover\" illogically signals that the information in this sentence merely adds to the previous point about Metzinger’s painting. Instead, it provides information that is true despite that previous point. Choice C is incorrect because \"in other words\" illogically signals that the information in this sentence is a paraphrase or restatement of the previous point about Metzinger’s painting. Instead, it provides information that is true despite that previous point. Choice D is incorrect because \"for example\" illogically signals that the information in this sentence provides an example that supports the previous point about Metzinger’s painting. Instead, it provides information that is true despite that previous point."},{"i":"90117366","c":"trans","d":"E","s":"To explore how blinking affects social interactions, Dutch researchers observed interactions between human speakers and “listeners” (animated human faces on a screen). The researchers found that when the listeners blinked slowly, the speakers tended to talk for less time. ______ quicker blinks were associated with longer talking times.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","Specifically,","Firstly,","By contrast,"],"a":3,"r":"Choice D is the best answer. “By contrast” logically signals that the finding described in this sentence contrasts with the finding described in the previous sentence. That is, quicker blinks were associated with longer talking times, whereas slower blinks were associated with shorter talking times. Choice A is incorrect because “for example” illogically signals that the finding described in this sentence is an example of the finding described in the previous sentence. Instead, it contrasts with that finding. Choice B is incorrect because “specifically” illogically signals that this sentence provides specific, precise details about the finding described in the previous sentence. Instead, it presents information that contrasts with that finding. Choice C is incorrect because “firstly” illogically signals that the finding described in this sentence is a first point or occurs first in a chronological sequence of events. Instead, it contrasts with the finding described in the previous sentence."},{"i":"2df7b582","c":"trans","d":"H","s":"Plato believed material objects to be crude representations of unseen ideal forms. In his view, such abstract, nonmaterial forms are the ultimate source of knowledge. Aristotle disagreed, positing that knowledge is best obtained through direct engagement with the material world; ______ sensory experience of the material is the ultimate source of knowledge.\n\nWhich choice completes the text with the most logical transition?","o":["regardless,","admittedly,","in other words,","meanwhile,"],"a":2,"r":"Choice C is the best answer. “In other words” logically signals that the claim about sensory experience that follows—that sensory experience is the source of knowledge—is a restatement of Aristotle’s theory from earlier in the sentence. Choice A is incorrect because “regardless” illogically signals that the claim about sensory experience that follows is true in spite of Aristotle’s theory from earlier in the sentence. Instead, this claim is a restatement of his theory. Choice B is incorrect because “admittedly” illogically signals that the claim about sensory experience that follows is an exception to Aristotle’s theory from earlier in the sentence. Instead, this claim is a restatement of his theory. Choice D is incorrect because “meanwhile” illogically signals that the claim about sensory experience that follows is separate from (while occurring simultaneously with) Aristotle’s theory from earlier in the sentence. Instead, this claim is a restatement of his theory."}],"img":{"df34b586":"iVBORw0KGgoAAAANSUhEUgAAArwAAAJHBAMAAACAwZiqAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABQb0lEQVR42u1deWBMxx//zNvd3MnOS1yl5G3irmOTOOped7XUOktLhbpaWlFn0YpqFaXiqLqqQd3KOk
