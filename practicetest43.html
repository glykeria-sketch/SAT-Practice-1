<script>
const D={"t":"Practicetest43","q":[{"i":"7d84fe2b","c":"vocab","d":"E","s":"Particle physicists like Ayana Holloway Arce and Aida El-Khadra spend much of their time ______ what is invisible to the naked eye: using sophisticated technology, they closely examine the behavior of subatomic particles, the smallest detectable parts of matter.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["selecting","inspecting","creating","deciding"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the work of particle physicists. In this context, “inspecting” means viewing closely in order to examine. The text indicates that as particle physicists, Arce and El-Khadra’s work involves using advanced technology to “closely examine” subatomic particles. In other words, they use technology to inspect small parts of matter that can’t be seen by the naked eye. Choice A is incorrect because nothing in the text suggests that Arce and El-Khadra spend time “selecting,” or choosing, subatomic particles for some purpose; the text simply states that the particle physicists use advanced technology to see and study the behavior of those tiny parts of matter. Choice C is incorrect because nothing in the text suggests that Arce and El-Khadra spend time “creating” subatomic particles, or bringing them into existence; the text simply states that the particle physicists use advanced technology to see and study the behavior of those tiny parts of matter. Choice D is incorrect. In this context, “deciding” would mean making a final choice or judgment about something. It wouldn’t make sense to say that particle physicists get to choose what is and isn’t visible to the naked eye, especially when the text presents it as fact that subatomic particles are “the smallest detectable parts of matter” and would therefore be invisible. The text focuses on Arce and El-Khadra’s close observation of those particles, not on any decisions they might make."},{"i":"a1139ff8","c":"vocab","d":"E","s":"In the 1990s, conservationists began planting more than 500,000 native trees in the habitat of the Azores bullfinch to boost the bird’s numbers. This approach was apparently ______: the Azores bullfinch’s population size increased from as few as 100 birds at the end of the 1980s to around 1,300 in 2023.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["amusing","costly","successful","disastrous"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the conservationists’ efforts to increase Azores bullfinch’s numbers. In this context, \"successful\" means accomplishing a goal or purpose. According to the text, conservationists planted more than 500,000 native trees in an Azores bullfinch habitat in order to boost the bird’s population size. The text then indicates that the population size did indeed grow as a result of the planted trees. Thus, in this context, the conservationists’ approach of planting native trees was successful because it achieved the goal of increasing the bird’s population size. Choice A is incorrect because the text gives no indication that the conservationists’ approach of planting native trees to increase Azores bullfinch’s numbers was \"amusing,\" or comical or entertaining. Instead, the approach was seriously undertaken and ultimately accomplished. Choice B is incorrect because the text doesn’t address how much it cost to achieve the goal of planting native trees to increase Azores bullfinch’s numbers. The text indicates that the approach was beneficial and successful rather than \"costly,\" or expensive or harmful. Choice D is incorrect. According to the text, the conservationists’ approach of planting native trees to increase Azores bullfinch’s numbers was beneficial and successful rather than \"disastrous,\" or damaging or unsuccessful."},{"i":"4b54bbf0","c":"vocab","d":"H","s":"In the 2010s, the price of pop music cassette tapes from the 1980s and 1990s rose dramatically, which had the counterintuitive effect of ______ demand: buyers who hadn’t previously wanted to purchase vintage cassettes thronged the market, believing prices would continue to rise and the tapes could be resold later at a profit.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["exploiting","monetizing","appraising","engendering"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of how rising prices affected demand for vintage cassette tapes. In this context, \"engendering\" means producing or causing to exist. The text indicates that the effect of a dramatic increase in the price of vintage cassettes was counterintuitive, or contrary to what would typically be expected. Generally, when prices rise, demand falls—but the text indicates that in this case, buyers who previously had no interest in cassettes \"thronged the market\" (that is, many of them began purchasing cassettes) because they saw the cassettes as potential investments. This context conveys that the rising prices surprisingly produced significant demand, producing many new buyers for vintage cassettes. Choice A is incorrect because the text focuses on a rise in prices of vintage cassettes, and it wouldn’t make sense to describe the price increase itself—rather than sellers of vintage cassettes—as \"exploiting,\" or unfairly or selfishly taking advantage of, demand. Further, wanting to take advantage of new demand would be a motivation for a price increase, not a counterintuitive effect of it. Choice B is incorrect. In this context, \"monetizing\" would mean utilizing as a source of profit, and it wouldn’t make sense to describe a price increase itself, rather than sellers of vintage cassettes, as using demand as a source of profit; moreover, seeking to profit when there’s new demand would be a reason for price increases, not a counterintuitive effect of them. Choice C is incorrect. In this context, \"appraising\" would mean assessing the value or significance of something. The text focuses on a rise in prices of vintage cassettes, and while it would be reasonable to suggest that sellers might have appraised demand for those cassettes, it wouldn’t make sense to suggest that a price increase itself could do such an assessment; moreover, an appraisal of demand would most likely precede a price increase rather than be an effect of it."},{"i":"f7d58b53","c":"vocab","d":"E","s":"Like other tribal nations, the Muscogee (Creek) Nation is self-governing; its National Council generates laws regulating aspects of community life such as land use and healthcare, while the principal chief and cabinet officials ______ those laws by devising policies and administering services in accordance with them.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["implement","presume","improvise","mimic"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of self-government among the Muscogee (Creek) Nation. In this context, “implement” means to carry out or put into effect. The text states that the National Council generates laws, while the principal chief and cabinet officials are responsible for “devising policies and administering services in accordance with” those laws. This context suggests that the principal chief and cabinet officials implement the laws: they put the laws into effect by creating policies and administering services that accord with those laws. Choice B is incorrect because “presume” in this context would mean to assume based on incomplete information, and the text does not suggest that the principal chief and cabinet officials either made assumptions about the content of the laws or had incomplete information about them. Choice C is incorrect because in this context “improvise” would mean to create something without preparation, and the text does not suggest that the principal chief and cabinet officials create policies and administer services without advance preparation. Choice D is incorrect because nothing in the text suggests that the principal chief and cabinet officials “mimic,” or imitate, the laws generated by the National Council. To mimic laws would mean to generate new laws that are imitations of existing laws, but the text indicates that the National Council, not the principal chief and cabinet officials, is responsible for generating laws. Instead of generating laws, the principal chief and cabinet officials put laws into effect by “devising policies and administering services in accordance with” the laws."},{"i":"a2be625e","c":"purpose","d":"M","s":"The following text is from Sarah Orne Jewett’s 1899 short story “Martha’s Lady.” Martha is employed by Miss Pyne as a maid. Miss Pyne sat by the window watching, in her best dress, looking stately and calm; she seldom went out now, and it was almost time for the carriage. Martha was just coming in from the garden with the strawberries, and with more flowers in her apron. It was a bright cool evening in June, the golden robins sang in the elms, and the sun was going down behind the apple-trees at the foot of the garden. The beautiful old house stood wide open to the long-expected guest.\n\nWhich choice best states the main purpose of the text?","o":["To convey the worries brought about by a new guest","To describe how the characters have changed over time","To contrast the activity indoors with the stillness outside","To depict the setting as the characters await a visitor’s arrival"],"a":3,"r":"Choice D is the best answer because it most accurately reflects the main purpose of the text. The text portrays Miss Pyne as awaiting the arrival of a carriage while Martha brings strawberries and flowers from the garden into the house. The text also describes the surroundings of the scene, stating that Miss Pyne looks \"stately and calm,\" the evening is bright and cool, and birds are singing in the garden as the sun sets. Then the last sentence states that the house was \"wide open to the long-expected guest,\" which strongly suggests that Miss Pyne’s anticipation and Martha’s activities were in preparation for the guest who is expected to arrive in the carriage. Thus, the text depicts the setting and conveys what these characters are doing as they await the arrival of their visitor. Choice A is incorrect because there is nothing in the text to indicate that the characters feel any worry about the guest’s arrival. The text indicates that the guest was \"long-expected,\" but characterizing Miss Pyne as \"stately and calm\" conflicts with the idea that the characters are worried about the guest. Choice B is incorrect because the text describes a moment in time when two characters are awaiting the arrival of a visitor rather than an extended period over which characters could be seen changing. Choice C is incorrect. Although the text describes the activity indoors (Miss Pyne sitting calmly), it describes a higher level of activity, not stillness, outside (Martha bringing fruit and flowers and birds singing)."},{"i":"d5600e74","c":"purpose","d":"E","s":"The following text is adapted from Pam Muñoz Ryan’s 2020 novel Mañanaland. In the village where Max lives, there is an old fortress called La Reina. Children in the village say that the fortress is haunted. For as long as he could remember, Max had begged Papá [his father] to take him to see La Reina and the ruins up close. He’d be a hero among his friends if he was the first boy to cross the haunted gates! Just because Papá didn’t believe in ghosts didn’t mean they weren’t there. Maybe this summer Papá would finally take him. He wasalmost twelve. ©2020 by Pam Muñoz Ryan Which choice best describes the overall purpose of the text?","o":["To portray how proud Max’s father is of Max","To explain why Max doesn’t want to grow up yet","To criticize Max for disliking summer","To show how much Max wants to visit La Reina"],"a":3,"r":"Choice D is the best answer because it most accurately describes the overall purpose of the text. The text indicates that \"for as long as he could remember,\" Max had \"begged\" his father to take him to La Reina. This point is later emphasized in the text by indicating that \"this summer\" his father might \"finally take\" Max to visit La Reina. Thus, the purpose of the text as a whole is to show how much Max wants to visit La Reina. Choice A is incorrect. The text does not discuss Papa’s feelings toward Max. Rather, it mentions that Max has long wanted Papa to take him to La Reina and that, unlike Max and some other children, Papa does not believe that La Reina is haunted. Choice B is incorrect. The text mentions that Max is \"almost twelve\" at the time, which suggests anticipation of growing up rather than refusal to. Choice C is incorrect. The text indicates that Max hopes to visit La Reina during the current summer, but nothing suggests that Max dislikes summer."},{"i":"d168e7c5","c":"func","d":"M","s":"The following text is from Annie Dillard’s 1987 autobiographical novel An American Childhood. The narrator is a young girl living in Pittsburgh. I walked. My mother had given me the freedom of the streets as soon as I could say our telephone number. I walked and memorized the neighborhood. I made a mental map and located myself upon it. At night in bed I rehearsed the small world’s scheme and set challenges: <u>Find the store using backyards only. Imagine a route from the school to my friend’s house.<\/u> ©1987 by Annie Dillard Which choice best describes the function of the underlined portion in the text as a whole?","o":["It describes the narrator trying to memorize her telephone number.","It provides examples of what the narrator thinks about at night.","It gives directions to the narrator’s favorite local store.","It portrays the narrator’s relationship with her mother."],"a":1,"r":"Choice B is the best answer because it accurately describes how the underlined portion functions in the text as a whole. In the text, the narrator explains that she walks around her neighborhood, making a \"mental map\" of the area that she imagines herself navigating through. She then states that she rehearses \"the small world’s scheme\"—that is, imagines moving through her mental map—and challenges herself to use the map in her mind while lying in bed at night. The underlined portion presents two such challenges (getting to the store through backyards and traveling from school to a friend’s house) and thus provides examples of what the narrator thinks about at night. Choice A is incorrect because the underlined portion makes no mention of memorizing a telephone number. Although the narrator mentions that she had to learn the home telephone number before her mother would give her permission to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about memorizing the telephone number. Choice C is incorrect. Although the underlined portion refers to navigation tasks like finding a route to a store only through backyards, the text contains no specific directions to any store, nor is any store identified as the narrator’s favorite. Choice D is incorrect because the underlined portion makes no mention of the narrator’s mother and doesn’t address the narrator’s relationship with her. Although the narrator mentions that her mother gave her permission as a child to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about the mother or her relationship to her child."},{"i":"e23f50b9","c":"func","d":"M","s":"The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and—more affordably—steam baths. <u>While such amenities were available mainly to town dwellers,<\/u> regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.\n\nWhich choice best describes the function of the underlined portion?","o":["It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.","It describes a limitation of earlier historians’ studies of medieval European bathing habits.","It concedes that not all people in medieval Europe had access to public bathhouses.","It explains why Janega decided to study the popularity of public bathhouses in medieval Europe."],"a":2,"r":"Choice C is the best answer because it most effectively describes the function of the underlined portion. The text discusses the long-standing misconception that people in medieval Europe were uninterested in cleanliness and hygiene. As evidence that this idea is false, the text cites historian Eleanor Janega’s assertion that in medieval Europe, towns usually had at least one bathhouse, where people could take immersion baths or steam baths for a fee. The underlined portion then notes that mainly town dwellers had access to these bathhouses. The remainder of the text explains that those who lacked such access were nonetheless able to bathe in outdoor waterways or take sponge baths at home. Therefore, the underlined portion concedes that some people in medieval Europe lacked access to public bathhouses. Choice A is incorrect. The underlined portion establishes that amenities such as steam baths were mainly available to town dwellers, which suggests in turn that steam baths were largely unavailable to people in rural areas. Thus, the distinction made by the underlined portion is not between the popularity of steam baths in towns versus their lack of popularity in rural areas but instead between their presence in towns and absence in rural areas. Choice B is incorrect. Although the text does explain that recent historians have disproved the idea that medieval Europeans rarely bathed, it doesn’t attribute that misconception to earlier historians of medieval Europe or suggest that their research was subject to limitations. Moreover, the underlined portion addresses a limitation of life in medieval Europe, not of historical research. Choice D is incorrect because the underlined portion doesn’t address why historian Eleanor Janega decided to study the popularity of public bathhouses in medieval Europe—nor does any portion of the text. The text mentions Janega in passing, but it doesn’t go into detail about why she decided to study the popularity of public bathhouses in medieval Europe."},{"i":"5e4e082c","c":"cross","d":"H","s":"Text 1 Chemically analyzing bulk rock-core samples from Australia’s Mount McRae Shale, Ariel Anbar et al. found a transient but significant increase in molybdenum (Mo) at a point corresponding to roughly 2.5 billion years ago (Ga). On Earth, Mo is released mainly through oxidative weathering of minerals; Anbar et al. therefore concluded that atmospheric oxygen briefly increased 2.5 Ga, then returned to its earlier negligible level.\n\nText 2 Sarah Slotznick et al. reexamined the Mount McRae Shale core. Since chemically analyzing bulk samples can occlude contextual details, Slotznick et al. also employed high-resolution microscopy, which revealed volcanic debris—a known Mo host—around 2.5 Ga and microfractures in the surrounding matrix. The researchers assert that fluid could have reached the debris through the microfractures and initiated oxidative weathering long after debris deposition.\n\nBased on the texts, Anbar et al. (Text 1) and Slotznick et al. (Text 2) would most likely disagree about the answer to which question about the portion of the Mount McRae Shale rock-core corresponding to 2.5 Ga?","o":["Does the increase in Mo in that portion suggest that atmospheric oxygen levels were not negligible before 2.5 Ga?","Is the increase in Mo in that portion indicative of an increase in atmospheric oxygen dating to the same time?","Is the increase in Mo in that portion attributable to oxidative weathering of the material found in that portion?","Did chemically analyzing bulk samples lead to a false impression that there is an increase in Mo in that portion?"],"a":1,"r":"Choice B is the best answer because Anbar et al. and Slotznick et al. would most likely disagree about whether the molybdenum (Mo) increase indicates atmospheric oxygen levels specifically at 2.5 Ga. Anbar et al. conclude that the Mo increase they found “at a point corresponding to roughly 2.5 billion years ago” means that “atmospheric oxygen briefly increased 2.5 Ga, then returned to its earlier negligible level,” directly linking the timing of the Mo increase to contemporaneous atmospheric oxygen levels. In contrast, Slotznick et al. discovered volcanic debris and microfractures in the rock core and “assert that fluid could have reached the debris through the microfractures and initiated oxidative weathering long after debris deposition.” If, as Slotznick asserts, the Mo detected at the 2.5 Ga portion could have been deposited there much later through weathering processes, then the Mo increase wouldn’t necessarily indicate atmospheric oxygen levels at 2.5 Ga specifically. Thus, Anbar et al. and Slotznick et al. disagree on whether the increase in Mo in the portion of the rock core corresponding to 2.5 Ga is indicative of an increase in atmospheric oxygen dating to the same time. Choice A is incorrect because neither research team’s findings directly address atmospheric oxygen levels before 2.5 Ga. Anbar et al. conclude that oxygen “returned to its earlier negligible level” after 2.5 Ga, implying low pre–2.5 Ga levels, while Slotznick et al. focus on explaining the Mo increase through later weathering processes rather than making claims about earlier atmospheric conditions. Choice C is incorrect because both research teams would likely agree that the Mo increase is attributable to oxidative weathering. Anbar et al. state that “Mo is released mainly through oxidative weathering of minerals,” and Slotznick et al. also reference “oxidative weathering” as the process that released Mo from the volcanic debris. Their disagreement concerns the timing of this weathering, not whether oxidative weathering is responsible. Choice D is incorrect because Slotznick et al. don’t suggest that bulk chemical analysis created a false impression about the presence of increased Mo. They acknowledge that the Mo increase exists but offer a different explanation for its timing and source. They critique bulk analysis for occluding “contextual details” that would require another kind of analysis to uncover, not for producing inaccurate measurements of Mo levels."},{"i":"2edd7ffe","c":"main","d":"E","s":"Archaeologist Veronica Waweru visited the Lewa Wildlife Conservancy in Kenya. While exploring there, Waweru noticed many rows of shallow pits carved into stone. Waweru believed the pits could have been used as game boards to play ancient versions of mancala, a two-person strategy game that is still popular today. Some of the more recent pits were carved on top of older pits. This led Waweru to think that the game was played at the site for a long time.\n\nAccording to the text, why does Waweru think that mancala was played at the site for a long time?","o":["Some of the newer pits were carved on top of the older pits.","She noticed many rows of shallow pits carved into stone.","She discovered the pits at the Lewa Wildlife Conservancy.","Some of the pits were shallow and others were quite deep."],"a":0,"r":"Choice A is the best answer because it presents a statement about Veronica Waweru’s thinking that is supported by the text. The text begins by discussing Waweru’s discovery of evidence that ancient versions of the board game mancala had been played at a site in the Lewa Wildlife Conservancy. The evidence consisted of many rows of shallow pits carved into stone. The text goes on to state that some newer pits were carved on top of older pits, suggesting that people may have continued to play the game there over multiple generations, creating new pits over time. The text then explicitly states that the presence of newer pits carved on top of older pits was precisely what caused Waweru to think that mancala had been played at the site for a long time. Choice B is incorrect. While the text does state that Waweru \"noticed many rows of shallow pits carved into stone,\" this observation led her to believe that the pits could have been used as game boards for ancient versions of mancala but did not specifically suggest to her that the game had been played at the site for a long time. The multiple rows of pits merely suggest that these pits functioned as part of a game board; they don’t necessarily indicate how long the site had been used for that purpose. Rather, it was the fact that there appeared to be newer pits carved on top of older pits that led Waweru to think that mancala had been played at the site for a long time. Choice C is incorrect. Although the text states that Waweru found the pits at the Lewa Wildlife Conservancy, this isn’t the reason the text gives for why she thought that mancala had been played at the site for a long time. The location of the discovery only provides information about where the game was played, not how long the game had been played there. Choice D is incorrect because the text doesn’t mention any variation in the depth of the pits. The text only describes the pits collectively as shallow and doesn’t indicate that the depth of the pits factored into Waweru’s thinking about how long the site had been used for playing mancala."},{"i":"3f05e40f","c":"main","d":"M","s":"In many of his sculptures, artist Richard Hunt uses broad forms rather than extreme accuracy to hint at specific people or ideas. In his first major work, Arachne (1956), Hunt constructed the mythical character Arachne, a weaver who was changed into a spider, by welding bits of steel together into something that, although vaguely human, is strange and machine-like. And his large bronze sculpture The Light of Truth (2021) commemorates activist and journalist Ida B. Wells using mainly flowing, curved pieces of metal that create stylized flame.\n\nWhich choice best states the text’s main idea about Hunt?","o":["He often depicts the subjects of his sculptures using an unrealistic style.","He uses different kinds of materials depending on what kind of sculpture he plans to create.","He tends to base his art on important historical figures rather than on fictional characters.","He has altered his approach to sculpture over time, and his works have become increasingly abstract."],"a":0,"r":"Choice A is the best answer because it most accurately states the main idea of the text. According to the text, many of Richard Hunt’s sculptures “use broad forms rather than extreme accuracy”—in other words, they are more abstract than realistic. To illustrate Hunt’s abstract approach, the text characterizes his sculpture of Arachne as “vaguely human” and his work in honor of Ida B. Wells as “using mainly flowing, curved pieces of metal that create stylized flame.”Thus, the main idea is that Hunt often depicts the subjects of his sculptures using an unrealistic style. Choice B is incorrect. Although the text indicates that one of Hunt’s sculptures is made of steel and another of bronze, there is no mention of why he chose these materials. Choice C is incorrect because the text says nothing about how Hunt chose the subjects for his sculptures. Furthermore, of the two examples provided in the text, only Ida B. Wells is an important historical figure; Arachne is a “mythical character.” Choice D is incorrect because the text says nothing about how Hunt’s style changed over time. In fact, although the two examples of Hunt’s work discussed in the text were created 65 years apart, they are both described as heavily stylized rather than realistic, which may suggest that some aspects of Hunt’s style haven’t changed over that time."},{"i":"20000f5f","c":"infer","d":"E","s":"Arthur Conan Doyle’s stories about detective Sherlock Holmes were published between 1887 and 1927. They have inspired countless successful adaptations, including comic strips, movies, and a television series Sherlock Hound, directed by Hayao Miyazaki, who is celebrated for his animated movies. Until 2014, these stories were copyrighted. The right to adapt was only available to those who could afford the copyright fee and gain approval from the strict copyright holders of Doyle’s estate. Some journalists predict that the number of Sherlock Holmes adaptations is likely to increase since the end of copyright means that ______ Which choice most logically completes the text?","o":["Doyle’s original stories will become hard to find.","people will become more interested in detective stories than they were in the 1800s.","producing adaptations will become easier and less expensive.","the former copyright holders of Doyle’s estate will return fees they collected."],"a":2,"r":"Choice C is the best answer. The text tells us that because of the copyright, adapting Sherlock Holmes stories used to be expensive and difficult. This suggests that after the copyright ends, it will be less expensive and less difficult to adapt these stories. Choice A is incorrect. This inference isn’t supported. The text never suggests that the copyright ending will make Sherlock Holmes stories harder to find. Instead, it suggests that adaptations of these stories will be easier and less expensive to make. Choice B is incorrect. This inference isn’t supported. The text never discusses people’s interest in detective stories, so there is no basis to make this inference. Choice D is incorrect. This inference isn’t supported. The text never suggests that copyright fees from the past are returned after a copyright ends, so there is no basis to make this inference."},{"i":"3cc2eacc","c":"infer","d":"M","s":"In a study of the mechanisms underlying associative memory—or the ability to learn and remember connections between inherently unrelated things—neuroscientists Kei Igarashi, Jasmine Chavez, and others presented mice with memory tests. The team discovered that fan cells, a type of cell found in the medial temporal lobe of the brain, are necessary for the acquisition of new associative memories. They also found that fan cell activity requires dopamine, a chemical the brain produces in response to pleasure and rewards. Consequently, receiving a reward should likely help to ______ Which choice most logically completes the text?","o":["decrease an individual’s capacity to utilize dopamine.","increase an individual’s capacity to recognize differences between unrelated things.","increase an individual’s capacity to form associative memories.","decrease an individual’s capacity to create fan cells."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the mechanisms underlying associative memory. The text explains that fan cells—a type of brain cell—are necessary for the acquisition of new associative memories, and that activity among these cells requires a chemical known as dopamine, which the brain produces in response to rewards. Since the brain cells that enable the formation of associative memories require dopamine in order to function, and since the brain produces dopamine in response to rewards, it can be inferred that receiving a reward should likely help to increase an individual’s capacity to form associative memories. Choice A is incorrect because the relationship between rewards and dopamine sketched by the text is that rewards result in the production of dopamine, not that they cause an individual’s capacity to utilize dopamine to decrease. Choice B is incorrect. The text suggests that receiving a reward would produce dopamine and thereby assist with associative memory formation. However, the text never suggests that associative memory involves the capacity to recognize differences between unrelated things, indicating only that associative memory involves remembering what connects those things. Choice D is incorrect because the text never discusses how fan cells are initially created and therefore provides no evidence for a conclusion about how receiving a reward would affect their creation."},{"i":"f9c4bdab","c":"claim","d":"H","s":"A student is writing a paper about One Night in Miami..., a 2020 film directed by Regina King and written by Kemp Powers. Powers adapted the film’s screenplay from his 2013 play, which he wrote after learning about a 1964 meeting that took place in Miami, Florida, between four prominent figures of the Civil Rights movement: Malcolm X, Muhammad Ali, Jim Brown, and Sam Cooke. The student claims that although Powers was inspired by this meeting, the film is best understood not as a precise retelling of historical events but rather as a largely imagined but informed representation of them.\n\nWhich quotation from an article about One Night in Miami... would be the most effective evidence for the student to include in support of this claim?","o":["“When Powers learned of the meeting, he initially planned to write a much longer work about its four famous participants rather than focusing on the meeting itself.”","“One Night in Miami... received numerous awards and nominations, including an Academy Award nomination for Powers for Best Adapted Screenplay.”","“Powers has described One Night in Miami... as the story of four friends encouraging and supporting one another while engaged in a crucial political debate about how best to achieve equality for Black people in the United States.”","“Powers could find only the most superficial historical details about the meeting, so he read extensively about the four individuals and their thinking at the time in an effort to portray what might have happened between them.”"],"a":3,"r":"Choice D is the best answer because it provides a quotation that effectively supports the student’s claim about the film One Night in Miami…. The quotation states that in researching the play on which the film was based, Kemp Powers only found superficial details about what actually happened during the 1964 meeting in Miami between four leading Civil Rights leaders, meaning that there is very little information about the meeting in the historical record. In the absence of greater details, it wouldn’t have been possible for the film to be a precise retelling of the historical events it depicts. The quotation explains that to compensate for this lack of information about the meeting, Powers did extensive research into the four figures and how they thought at the time in order to speculate in an informed way about what they might have said or what might have occurred between them. Therefore, the quotation effectively supports the claim that the film is best understood not as a precise retelling of a historical event but as a deeply informed imaginative rendering of that event. Choice A is incorrect. Although the quotation discusses how on learning about the 1964 meeting in Miami, Powers was inspired to write a play and, later, to adapt it into a screenplay, it doesn’t discuss Powers’s approach to representing what had occurred in the meeting. Instead, it states that Powers didn’t initially plan to write a story only “focusing on the meeting itself” but rather had considered writing a “much longer” and more expansive work about the meeting’s four participants. Choice B is incorrect because the quotation doesn’t discuss Powers’s approach to representing historical events in his play and in the film; instead, the quotation focuses on the film’s positive critical reception by mentioning that it received numerous awards and nominations. Choice C is incorrect. Although the quotation references historical events that are discussed directly in the play and film by explaining how the four historical figures featured in the story engage in political debates about contemporary issues, it doesn’t specify to what extent Powers’s representation of what occurred during the 1964 meeting in Miami is a factual retelling of what happened and how much is an imaginative rendering of what might have happened. Rather, the quotation focuses on Powers’s description of the film’s basic premise and how the characters engage with the historical context of its setting."},{"i":"d696eafa","c":"claim","d":"H","s":"Early Earth is thought to have been characterized by a stagnant lid tectonic regime, in which the upper lithosphere (the outer rocky layer) was essentially immobile and there was no interaction between the lithosphere and the underlying mantle. Researchers investigated the timing of the transition from a stagnant lid regime to a tectonic plate regime, in which the lithosphere is fractured into dynamic plates that in turn allow lithospheric and mantle material to mix. Examining chemical data from lithospheric and mantle-derived rocks ranging from 285 million to 3.8 billion years old, the researchers dated the transition to 3.2 billion years ago.\n\nWhich finding, if true, would most directly support the researchers’ conclusion?","o":["Among rocks known to be older than 3.2 billion years, significantly more are mantle derived than lithospheric, but the opposite is true for the rocks younger than 3.2 billion years.","Mantle-derived rocks older than 3.2 billion years show significantly more compositional diversity than lithospheric rocks older than 3.2 billion years do.","There is a positive correlation between the age of lithospheric rocks and their chemical similarity to mantle-derived rocks, and that correlation increases significantly in strength at around 3.2 billion years old.","Mantle-derived rocks younger than 3.2 billion years contain some material that is not found in older mantle-derived rocks but is found in older and contemporaneous lithospheric rocks."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would most directly support the researchers’ conclusion that the transition from a stagnant lid regime to a tectonic plate regime occurred around 3.2 billion years ago. The text explains that early in Earth’s history, Earth exhibited a stagnant lid regime in which there’s no interaction between the lithosphere and the underlying mantle. The text further explains that, by contrast, once Earth began to exhibit a tectonic plate regime, its lithospheric and mantle material began to mix. If mantle-derived rocks younger than 3.2 billion years contain material not found in older mantle-derived rocks, that material must have originated somewhere other than the mantle. And if this material is found in both older and contemporaneous lithospheric rocks, that would imply that the lithosphere was able to mix with mantle material beginning around 3.2 billion years ago, as the researchers concluded. Choice A is incorrect. The text gives no basis for comparing the quantities of lithospheric and mantle-derived rocks. Choice B is incorrect. The text gives no basis for comparing the material makeup of lithospheric rocks to that of mantle-derived rocks. Choice C is incorrect. A positive correlation between the age of lithospheric rocks and these rocks’ chemical similarity to mantle-derived rocks would mean that the oldest rocks would be the most similar, which contradicts the text’s claim that lithospheric and mantle-derived rocks were completely separate until 3.2 billion years ago. If the researchers’ conclusion about the onset of tectonics on Earth is correct, then younger lithospheric rocks would show greater chemical similarity to mantle-derived rocks than older lithospheric rocks do."},{"i":"645fd11a","c":"graph","d":"H","s":"","o":["The average numbers of managers and department leaders reporting directly to their CEO didn’t fluctuate from the 1991–1995 period to the 2001–2008 period.","The average number of managers reporting directly to their CEO was highest in the 1996–2001 period.","The average number of department leaders reporting directly to their CEO was greater than the average number of managers reporting directly to their CEO in each of the three periods studied.","The average number of department leaders reporting directly to their CEO rose over the three periods studied."],"a":3,"r":"Choice D is the best answer because it describes data from the graph that support the researchers’ conclusion that there is a growing interest among CEOs in connecting with more departments in their companies. The graph shows the average number of individuals reporting directly to CEOs during three different time periods: the individuals are divided into managers and department leaders. The average number of department leaders directly reporting to their CEO during the 1991–1995 period was slightly more than three, during the 1996–2001 period it was four, and during the 2001–2008 period it was almost seven. Thus, the average number of department leaders reporting directly to their CEO rose over the three periods studied, which suggests that CEOs were connecting with more departments. Choice A is incorrect because the average number of managers and department leaders reporting directly to their CEO rose for both categories between the 1991–1995 and 2001–2008 periods; thus, it isn’t true that the average numbers didn’t fluctuate. Choice B is incorrect because the average number of managers reporting directly to their CEO was highest in the 2001–2008 period, not in the 1996–2001 period. Choice C is incorrect. Although it correctly describes a feature of the graph, the observation that more department leaders than managers are reporting to CEOs does not by itself address the question of whether CEOs are connecting with more departments over time—to address that question, one needs to know whether the number of department leaders reporting to CEOs is increasing over time."},{"i":"15873d14","c":"graph","d":"M","s":"","o":["Brazil increased from the previous marketing year but remained lower than the percentage exported by the United States.","Brazil exceeded the percentage exported by Argentina for the first time.","Argentina decreased from the previous marketing year but remained the highest among the three countries.","the United States reached its highest point during the five marketing years."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the graph to complete the text’s discussion of the percentages of maize exported in the marketing year 2012/2013. The graph presents percentages of maize exported by Argentina, Brazil, and the United States in marketing years 2009/2010 to 2013/2014 and indicates that for the marketing year 2012/2013, the percentage of maize exported by Argentina decreased to about 70 percent from about 80 percent in the previous marketing year. The graph also shows that the percentage of maize exported by Argentina remained highest among the three countries in the marketing year 2012/2013, surpassing the percentage exported by Brazil (about 31 percent) and by the United States (about 8 percent). Choice A is incorrect because for the marketing year 2012/2013, the graph indicates that the percentage of maize exported by Brazil didn’t increase from the previous year; rather, it decreased from about 34 percent to about 31 percent. Moreover, the graph shows that the percentage of maize exported by Brazil remained higher, not lower, than the percentage exported by the United States in the marketing year 2012/2013. Choice B is incorrect because the graph indicates that the percentage of maize exported by Brazil never exceeded the percentage exported by Argentina for any of the marketing years represented. Choice D is incorrect because the graph indicates that the percentage of maize exported by the United States reached its lowest point, not its highest, during the five marketing years in 2012/2013, with the United States exporting only about 8 percent of its maize in that marketing year."},{"i":"9df6da04","c":"fss","d":"H","s":"Entomologists Yash Sondhi and Samuel Fabian have tried to explain why moths fly erratically around light sources at night. Knowing that flying insects keep their backs pointed toward sunlight during the day, ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["the researchers theorize that moths, mistaking nighttime lights for the Sun, continually try to reorient their bodies while flying near such lights.","the researchers’ theory is that moths mistake nighttime lights for the Sun, continually trying to reorient their bodies while flying near such lights.","moths mistake nighttime lights for the Sun and continually try to reorient their bodies while flying near such lights, the researchers theorize.","moths continually try to reorient their bodies while flying near nighttime lights, the researchers theorize, mistaking such lights for the Sun."],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"the researchers\" the subject of the sentence and places it immediately after the modifying phrase \"knowing…day.\" In doing so, this choice clearly establishes that the researchers—and not another noun in the sentence—know that flying insects keep their backs pointed toward sunlight during the day. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase \"the researchers’ theory\" immediately after the modifying phrase illogically suggests that the researchers’ theory knows that flying insects keep their backs pointed toward sunlight during the day. Choice C is incorrect because it results in a dangling modifier. The placement of the noun \"moths\" immediately after the modifying phrase illogically suggests that moths know that flying insects keep their backs pointed toward sunlight during the day. Choice D is incorrect because it results in a dangling modifier. The placement of the noun \"moths\" immediately after the modifying phrase illogically suggests that moths know that flying insects keep their backs pointed toward sunlight during the day."},{"i":"e38b3e4f","c":"fss","d":"E","s":"The radiation that ______ during the decay of radioactive atomic nuclei is known as gamma radiation.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["occurs","have occurred","occur","are occurring"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The singular verb \"occurs\" agrees in number with the singular subject \"radiation.\" Choice B is incorrect because the plural verb \"have occurred\" doesn’t agree in number with the singular subject \"radiation.\" Choice C is incorrect because the plural verb \"occur\" doesn’t agree in number with the singular subject \"radiation.\" Choice D is incorrect because the plural verb \"are occurring\" doesn’t agree in number with the singular subject \"radiation.\""},{"i":"96e5da01","c":"fss","d":"E","s":"The alga species Chlorella vulgaris is very efficient at making oxygen. For this reason, scientists are currently exploring ways to use this species in space. C. vulgaris might be used, for example, to build future biological air exchange systems that ______ oxygen for astronauts.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are producing","produced","produce","have produced"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verbs to express tense. Simple present tense verbs can be used to describe actions that tend to occur, including in a hypothetical or future scenario. In this case, the simple present tense verb “produce” indicates what the air exchange systems might be able to do in the future (produce oxygen for astronauts). Choice A is incorrect. The present progressive tense verb “are producing” suggests that the oxygen is currently being produced, not that it might be produced in the future. Choice B is incorrect because the past tense verb “produced” suggests that the oxygen was produced in the past, not that it might be produced in the future. Choice D is incorrect because the present perfect tense verb “have produced” suggests that the oxygen has been produced from a point in the past up to the present, not that it might be produced in the future."},{"i":"96953201","c":"bound","d":"E","s":"In her two major series “Memory Test” and “Autobiography,” painter Howardena Pindell explored themes ______ healing, self-discovery, and memory by cutting and sewing back together pieces of canvas and inserting personal artifacts, such as postcards, into some of the paintings.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["of","of,","of—","of:"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation between a preposition and its complement. No punctuation is needed between the preposition “of” and its complement, the noun phrase “healing, self-discovery, and memory.” Choice B is incorrect because no punctuation is needed between a preposition and its complement. Choice C is incorrect because no punctuation is needed between a preposition and its complement. Choice D is incorrect because no punctuation is needed between a preposition and its complement."},{"i":"ba8ebf49","c":"bound","d":"H","s":"The poem Beowulf begins with the word “hwæt,” which is an Old English ______ as “hark!” or “listen!” in some versions, the word was playfully rendered as “bro!” by Maria Dahvana Headley in her 2020 translation of the poem.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["exclamation, translated","exclamation and translated","exclamation translated","exclamation. Translated"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"The poem…exclamation\") and another sentence that begins with a supplementary element (\"Translated…poem\"). The supplementary element \"translated as ‘hark!’ or ‘listen!’ in some versions\" modifies the subject of the second sentence, \"the word\" (referring to hwæt). Choice A is incorrect because it results in a comma splice after \"exclamation.\" A comma can’t be used in this way to mark the boundary between sentences. Choice B is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join sentences. Choice C is incorrect because it results in a comma splice after \"versions.\" A comma can’t be used in this way to mark the boundary between sentences."},{"i":"7fd39a42","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Circular particle accelerators known as synchrotrons radiate energy in the form of light. Synchrotron light is among the brightest light ever produced. Synchrotron light is an ideal tool for researchers investigating the structure of matter. The first synchrotron created for the purpose of providing synchrotron light was built in 1968. It was called Tantalus and was housed near the University of Wisconsin–Madison. The student wants to emphasize the location of the first synchrotron built to provide synchrotron light.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Tantalus, the first synchrotron created for the purpose of providing synchrotron light, was built in 1968.","Circular particle accelerators known as synchrotrons radiate energy in the form of light, and this light is an ideal tool for researchers investigating the structure of matter.","The first synchrotron created for the purpose of providing synchrotron light, Tantalus, was housed near the University of Wisconsin–Madison.","Synchrotron light is among the brightest light ever produced, making it an ideal tool for researchers investigating the structure of matter."],"a":2,"r":"Choice C is the best answer. After identifying Tantalus as the first synchrotron built to provide light, the sentence emphasizes its location. Choice A is incorrect. While the sentence identifies Tantalus as the first synchrotron built to provide light, it doesn’t emphasize (or mention) its location. Choice B is incorrect. The sentence describes synchrotrons and how researchers use them; it doesn’t emphasize (or mention) the location of Tantalus. Choice D is incorrect. The sentence describes synchrotron light and how researchers use it; the sentence doesn’t emphasize (or mention) the location of Tantalus."},{"i":"92dec236","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Maika’i Tubbs is a Native Hawaiian sculptor and installation artist. His work has been shown in the United States, Canada, Japan, and Germany, among other places. Many of his sculptures feature discarded objects. His work Erasure (2008) includes discarded audiocassette tapes and magnets. His work Home Grown (2009) includes discarded pushpins, plastic plates and forks, and wood. The student wants to emphasize a similarity between the two works.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Erasure (2008) uses discarded objects such as audiocassette tapes and magnets; Home Grown (2009), however, includes pushpins, plastic plates and forks, and wood.","Tubbs’s work, which often features discarded objects, has been shown both within the United States and abroad.","Like many of Tubbs’s sculptures, both Erasure and Home Grown include discarded objects: Erasure uses audiocassette tapes, and Home Grown uses plastic forks.","Tubbs completed Erasure in 2008 and Home Grown in 2009."],"a":2,"r":"Choice C is the best answer. This choice most effectively emphasizes \"a similarity\" by identifying a trait the works share: \"both Erasure and Home Grown include discarded objects.\" Choice A is incorrect. This choice doesn’t \"emphasize a similarity.\" Instead, this choice shows how the materials used in the two works are different. Notice the use of the contrast word \"however.\" Choice B is incorrect. This choice doesn’t \"emphasize a similarity between the two works.\" While it says that Tubbs’s work \"often features discarded objects,\" it doesn’t provide details about the two works in question. Choice D is incorrect. This choice doesn’t \"emphasize a similarity.\" Instead, this choice shows how the works were produced at different times."},{"i":"c78620ba","c":"trans","d":"E","s":"In 1968, US Congressman John Conyers introduced a bill to establish a national holiday in honor of Dr. Martin Luther King Jr. The bill didn’t make it to a vote, but Conyers was determined. He teamed up with Shirley Chisholm, the first Black woman to be elected to Congress, and they resubmitted the bill every session for the next fifteen years. ______ in 1983, the bill passed.\n\nWhich choice completes the text with the most logical transition?","o":["Instead,","Likewise,","Finally,","Additionally,"],"a":2,"r":"Choice C is the best answer. “Finally” logically signals that the bill passing—following many attempts between 1968 and 1983—is the final, concluding event in the sequence described in the previous sentences. Choice A is incorrect because “instead” illogically signals that the bill passing is an alternative to one of the events described in the previous sentences. Instead, it is the final event in the sequence. Choice B is incorrect because “likewise” illogically signals that the bill passing is similar to one of the events described in the previous sentences. Instead, it is the final event in the sequence. Choice D is incorrect because “additionally” illogically signals that the bill passing is merely another event described along with the events of the previous sentences. Instead, it is the final, concluding event in the sequence."},{"i":"b7571c0a","c":"trans","d":"E","s":"Practical movie effects, such as the use of actual locations in a film, provide a more realistic visual experience than computer-generated imagery (CGI) does, but giving audiences the “real thing” can be prohibitively expensive. ______ many filmmakers use a blended approach, employing practical effects whenever possible and CGI elements as necessary to control costs.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","For this reason,","Furthermore,","In other words,"],"a":1,"r":"Choice B is the best answer. The first sentence tells us that practical effects are more realistic but also more expensive than CGI. The second sentence tells us that many filmmakers use both kinds of effects, balancing realism with cost. To connect these ideas, we need a cause-and- effect transition, like “therefore.” “For this reason” has the same meaning as “therefore.” . Choice A is incorrect. This isn’t a logical transition. The first sentence tells us that practical effects are more realistic but also more expensive than CGI. The second sentence tells us that many filmmakers use both kinds of effects, balancing realism with cost. To connect these ideas, we need a cause-and-effect transition, like “therefore.” “Similarly” doesn’t show cause and effect: it shows the addition of another agreeing idea. Choice C is incorrect. This isn’t a logical transition. The first sentence tells us that practical effects are more realistic but also more expensive than CGI. The second sentence tells us that many filmmakers use both kinds of effects, balancing realism with cost. To connect these ideas, we need a cause-and-effect transition, like “therefore.” “Furthermore” doesn’t show cause and effect: it shows the addition of another agreeing idea. Choice D is incorrect. This isn’t a logical transition. The first sentence tells us that practical effects are more realistic but also more expensive than CGI. The second sentence tells us that many filmmakers use both kinds of effects, balancing realism with cost. To connect these ideas, we need a cause-and-effect transition, like “therefore.” “In other words” doesn’t show cause and effect: it shows a restatement of the same idea in different words."},{"i":"a2bff07e","c":"trans","d":"H","s":"Economist Elinor Ostrom’s studies of communities around the world have empirically demonstrated that common pool resources, such as grazing lands, can be sustainably managed by the people who use them (rather than through private entities or centralized governments). ______ Ostrom’s work is a repudiation of the “tragedy of the commons,” the view that individuals will inevitably overexploit a finite shared resource if given unfettered access to it.\n\nWhich choice completes the text with the most logical transition?","o":["By contrast,","For example,","That said,","As such,"],"a":3,"r":"Choice D is the best answer. \"As such\" correctly signals that the claim in this sentence—that Ostrom’s work is a repudiation of the \"tragedy of the commons\" view—follows logically from the information about Ostrom’s studies in the previous sentence. According to that sentence, Ostrom’s studies demonstrate that common pool resources can in fact be sustainably managed by the people who use them. Choice A is incorrect because \"by contrast\" illogically signals that the information in this sentence contrasts with the information about Ostrom’s studies in the previous sentence. Instead, the claim that Ostrom’s work repudiates the \"tragedy of the commons\" view follows logically from that information. Choice B is incorrect because \"for example\" illogically signals that the claim in this sentence exemplifies the information about Ostrom’s studies in the previous sentence. Instead, the claim that Ostrom’s work repudiates the \"tragedy of the commons\" view follows logically from that information. Choice C is incorrect because \"that said\" illogically signals that the information in this sentence is an exception or caveat to the information about Ostrom’s studies in the previous sentence. Instead, the claim that Ostrom’s work repudiates the \"tragedy of the commons\" view follows logically from that information."}],"img":{"645fd11a":"iVBORw0KGgoAAAANSUhEUgAAArwAAAIpBAMAAACyP/aAAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABGa0lEQVR42u2dd2BTVRvGn3OTdLc5admj3JShrHKBgiLDsAUZYYoyDFsZWmSoDC2KiIhYlsgOS5laZAgUsIAoAkJYstu0DJnNSZHVNrnfH0nbBFpaPhoo9Pz+aG9yTu547nvf8573nnsuwOFwOBwOh8PhcDgcDofD4XCeSyiXII9ocvheACFZnxQ691LFJOrQmEAwhFCAhgHo7SgkxMB1ddLDYYkk8y8BKAj8o+ArZVqr12K4VAMazKZkhuOzkrWiACYA2JMhvvkpHIhQENUltR12KTv/UsgAgwyhHxQ0wwkwqJFZjQJQv2uVywOQCWTTFgZgAUAsTschc3mdKEvovHSYptwW7dV8j2pblHXMgaXK7dGAfSUF64yS2i8W9FkbjVsH9HTQn3T4GB2sa5cIn++RiVrVbZ+IcUtRwVfEzCbouUddQlRE3VqzVBaLbh/PHQMA36hdvkZFYn39XO87UlHtZu+doVIP3RwgoFR0gG4zqkpnKlztvUJ1t+hx1e6qkWtGEFq9Ty/dGAlko8/F4od919c3DS4ZrVz3vdfxF8+XkVRxSt0chen1sCbcegGExd1KDfP+9u0jR8kW0zVrouK3ZLFt0kWA3m0GZgGx3j17cNERsu/a796/2QyWKWpWbuFqfaIJMhB7BSHf7KeJV3WqQ6GK2NNgFEg/ch5UCN/B5QUQ8abK9p8yLmxgI5hRYqQ2vU7vncGjqgEsdAUFADWDBYlIRhLqfhB3HQzhsIsyQCjMADHbzfbA/4JjmGBWHwbAvEe+CrZ5jO6Ju7mCKO9b8/fojrXZdH20GhQjlp1PVxazpI8GQFn0J5sAIVENgMpWqMnKOMuXjmjBzAAwAJDpRVC6vPEyWYaFAqD9tuyRkVb/YDVuvVAWX73CsGgMOxZoAUNVU2/FvQXYY7cAjN7qyy5Ar6ZgADqhQbo+AQCwU/SK0wAyJQBknVKyst1vgdj0qhoQvVhoXAc1JannuXMAhDiaXstcFt8cOAFg9r6D8isLo+b//ScgQ56OdbHVtGZoALL87/130/7WEwD7tu2LAUCYzKhwZchPJiC+DJB6Y/fO1CGL2PoD6Rrz69uv8rABIBQUhAJhlEAgWtTXapIQLGYYQxggQkNASC1AoQU0AA2m0ACghAIgIghAKBAsEoRRimCAkvK845wdDbVFTTkkFojLX+r+paOr93RzEaRAm7HsjIOn3toQl+fanEeliMQ14HA4HA6HwykQ0OyDdOL2Hc3t55zs0OTW9SEP6kezdOfa5qDag function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}
function fb(q){const a=ans[q.i],S=seg(q.r);

 return a===q.a?`<p class="v ok">Correct.</p><p>${own}</p>`:`<p class="v bad">Not quite. You chose ${L[a]}.</p><p>${own}</p><p class="v ok">The correct answer is ${L[q.a]}.</p><p>${S[L[q.a]]||""}</p>`}
function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
