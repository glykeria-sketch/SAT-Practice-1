<script>
const D={"t":"SATPractice16","q":[{"i":"e3f05561","c":"vocab","d":"E","s":"In the 1970s, video cameras became increasingly affordable for ordinary consumers and gave Ulysses Jenkins and other artists capabilities that were previously unavailable except to television broadcasters. Jenkins recognized and took full advantage of this ______ access to powerful technology to create groundbreaking works of video art, such as Mass of Images (1978).\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["newfound","delicate","inevitable","habitual"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Ulysses Jenkins’s video art. As used in this context, “newfound” means recently discovered or established. The text indicates that in the 1970s, video cameras became cheaper and therefore more widely available than they had been in the past. The text goes on to say that this development provided Jenkins and other artists with capabilities that they previously didn’t have. As a result, Jenkins began producing groundbreaking works of video art. This context supports the idea that Jenkins took advantage of newfound access to video cameras. Choice B is incorrect because “delicate” means fine in texture or structure or easily broken, neither of which would make sense in this context. The text doesn’t focus on describing what video art looks like or whether it’s breakable. Choice C is incorrect because “inevitable” means impossible to avoid, which wouldn’t make sense in this context. The text doesn’t discuss the likelihood of artists, or anyone else, gaining access to video cameras. Choice D is incorrect because “habitual” means doing something regularly or repeatedly. Although the text does suggest that Jenkins created multiple pieces of video art, its focus is on the fact that video cameras had only just become widely available to artists in the 1970s. Jenkins’s ability to take advantage of video cameras to make art was therefore newfound, not habitual, at the time."},{"i":"44cc5f75","c":"vocab","d":"E","s":"Artificially delivering biomolecules to plant cells is an important component of protecting plants from pathogens, but it is difficult to transmit biomolecules through the layers of the plant cell wall. Markita del Carpio Landry and her colleagues have shown that it may be possible to ______ this problem by transmitting molecules through carbon nanotubes, which can cross cell walls.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["conceptualize","neglect","illustrate","overcome"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of delivering biomolecules to plant cells. In this context, “overcome” means to succeed in dealing with an obstacle. The text suggests that although it’s difficult to move biomolecules through plant cell walls, Landry and her colleagues have shown that carbon nanotubes may be useful, since they can cross cell walls. This context conveys that Landry and her colleagues think it’s possible, using carbon nanotubes, to succeed in dealing with the obstacle of transmitting biomolecules to plant cells. Choice A is incorrect because it wouldn’t make sense in context to say that Landry and her colleagues have shown that it may be possible to “conceptualize,” or form an idea of, the difficulty of transmitting biomolecules through the walls of plant cells. The text presents this difficulty as a known problem that Landry and her colleagues think they may have solved, not as a mysterious occurrence that they have yet to form ideas about. Choice B is incorrect because the text suggests that Landry and her colleagues think it may be possible to successfully deal with the problem of transmitting biomolecules through the walls of plant cells, not that Landry and her colleagues think it may be possible to “neglect,” or simply to disregard and ignore the problem. Choice C is incorrect because it wouldn’t make sense in context to say that Landry and her colleagues have shown that it may be possible to “illustrate,” or demonstrate, the difficulty of transmitting biomolecules through the walls of plant cells by using carbon nanotubes. According to the text, carbon nanotubes allow molecules to be transmitted to plant cells—something that is otherwise difficult to do. The text therefore presents carbon nanotubes as a way of possibly solving a problem, not as a means of demonstrating the problem."},{"i":"a4ca92fd","c":"vocab","d":"E","s":"Beginning in the 1950s, Navajo Nation legislator Annie Dodge Wauneka continuously worked to promote public health; this ______ effort involved traveling throughout the vast Navajo homeland and writing a medical dictionary for speakers of Diné bizaad, the Navajo language.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["impartial","offhand","persistent","mandatory"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Annie Dodge Wauneka’s work as a Navajo Nation legislator. As used in this context, “persistent” means existing continuously. The text states that Wauneka “continuously worked to promote public health,” traveling extensively and authoring a medical dictionary; this indicates that Wauneka’s effort was persistent. Choice A is incorrect because describing Wauneka’s effort related to public health as “impartial,” or not partial or biased and treating all things equally, wouldn’t make sense in context. The text suggests that Wauneka’s continuous work was partial in one way, as she focused specifically on promoting public health throughout the Navajo homeland and to speakers of the Navajo language. Choice B is incorrect because the text emphasizes that Wauneka’s effort to promote public health as a Navajo Nation legislator was continuous and extensive, involving wide travels and the authoring of a medical dictionary. Because this work clearly involved care and dedication, it wouldn’t make sense to describe it as “offhand,” or casual and informal. Choice D is incorrect because nothing in the text suggests that Wauneka’s effort to promote public health was “mandatory,” or required by law or rule, even though Wauneka was a Navajo Nation legislator. Rather than suggesting that Wauneka’s effort was required for any reason, the text emphasizes the continuous and extensive nature of her work."},{"i":"e3ffb854","c":"vocab","d":"E","s":"The following text is adapted from John Matheus’s 1925 short story “Fog.” The fog extended its tentacles over city and river, gradually obliterating traces of familiar landscapes. At five-thirty the old Panhandle bridge, supported by massive sandstone pillars, stalwart, as when erected fifty years before to serve a generation now passed behind the portals of life, had become a spectral outline against the sky.\n\nAs used in the text, what does the word “supported” most nearly mean?","o":["Held up","Encouraged","Improved on","Defended"],"a":0,"r":"Choice A is the best answer because as used in the text, \"supported\" most nearly means held up or sustained physically. The sentence describes the physical structure of the Panhandle bridge, stating it was \"supported by massive sandstone pillars.\" This clearly refers to the structural relationship between the bridge and its pillars—the pillars physically hold up the bridge and keep it standing. The text further emphasizes the physical nature of this support by describing the pillars as \"stalwart\" (strong and sturdy) and noting they’ve been performing this function for fifty years. Choice B is incorrect. Although in some contexts \"supported\" can mean \"encouraged,\" the sandstone pillars and bridge described in the text are all inanimate objects that can’t provide or receive encouragement. The text clearly describes a structural relationship between the elements of the bridge, not an emotional one. Choice C is incorrect. Although in some contexts \"supported\" has a meaning similar to \"improved on,\" the text doesn’t suggest that the sandstone pillars have enhanced or made the bridge better; rather, they simply provide the necessary physical foundation to keep the bridge standing. Thus, the sentence describes the structural elements of the bridge, not improvements made to it. Choice D is incorrect. Although in some contexts \"supported\" can mean \"defended,\" the text doesn’t present a situation in which the sandstone pillars are defending the bridge from a threat. Instead, the description focuses on the physical structure of the bridge, in which the pillars hold the bridge up and ensure its stability."},{"i":"c8603ed7","c":"purpose","d":"E","s":"San Francisco is known for the colorful murals painted on many of its buildings. The densest collection of murals is found on Balmy Alley in the Mission District neighborhood. In the 1970s, Latina artists painted vivid scenes of community life on walls along this block. As the original murals have faded, later generations of artists have painted new ones over them. As a result, Balmy Alley has become a living showcase of San Francisco’s artistic spirit, with its murals reflecting changes in the cultural life of the city.\n\nWhich choice best states the main purpose of the text?","o":["To compare the Balmy Alley murals to other murals in San Francisco","To offer an overview of the history and importance of the Balmy Alley murals","To urge people to protect the murals of San Francisco from decay","To describe the rise of mural painting in San Francisco beginning in the 1970s"],"a":1,"r":"Choice B is the best answer because it best states the main purpose of the text. The text begins by briefly stating that San Francisco is known for its murals, then transitions to a discussion of a single collection of murals, which is found on Balmy Alley in the city’s Mission District. The text explains that the murals in this area were originally created in the 1970s, then observes that they have changed over time: as some have faded through the decades, others have been painted in their place. The text ends by emphasizing that these murals are significant because they reflect San Francisco’s artistic spirit and cultural life. Therefore, the text provides an overview of the history and importance of the Balmy Alley murals. Choice A is incorrect. Although it can be inferred from the text that there are murals in other areas of San Francisco besides Balmy Alley, the text doesn’t specifically discuss murals in other areas or compare the murals of Balmy Alley to those in other areas. Choice C is incorrect. By observing that some of the murals of Balmy Alley have been replaced due to fading, the text implies that murals can decay, but it never urges readers to protect this specific collection of murals—or any murals elsewhere in San Francisco, for that matter. Indeed, by describing the ever- changing murals of Balmy Alley as “a living showcase of San Francisco’s artistic spirit,” the text emphasizes the positive aspects of the fact that the original Balmy Alley murals have faded and been replaced with new murals. Choice D is incorrect because the text doesn’t describe the rise of mural painting in San Francisco generally or note when this occurred. The only historical development of the 1970s mentioned in the text is the origin of the murals in a specific area of the city: Balmy Alley in the Mission District."},{"i":"9c759a09","c":"purpose","d":"E","s":"The following text is from Georgia Douglas Johnson’s 1922 poem “Benediction.” Go forth, my son, Winged by my heart’s desire! Great reaches, yet unknown, Await For your possession. I may not, if I would, Retrace the way with you, My pilgrimage is through, But life is calling you!\n\nWhich choice best states the main purpose of the text?","o":["To express hope that a child will have the same accomplishments as his parent did","To suggest that raising a child involves many struggles","To warn a child that he will face many challenges throughout his life","To encourage a child to embrace the experiences life will offer"],"a":3,"r":"Choice D is the best answer because it accurately states the text’s main purpose. The poem begins with the speaker urging a child to “go forth” with her encouragement (“my heart’s desire”). The speaker goes on to suggest that new experiences (“Great reaches, yet unknown”) lie ahead for the son that “life is calling” him to seek out. Thus, the main purpose is to encourage a child to embrace the experiences available to him in his life. Choice A is incorrect because the speaker encourages the child to pursue new experiences (“Great reaches”) without knowing exactly what those experiences will be (“yet unknown”) or suggesting that they should match the speaker’s own accomplishments. Choice B is incorrect because the speaker focuses on positive possibilities for her son (“Great reaches, yet unknown”) and her enthusiastic encouragement to embrace those possibilities (“life is calling you!”), while there is no mention of raising a child or associated struggles. Choice C is incorrect because the speaker frames the possibilities for her son in a positive light when she says that “great reaches, yet unknown” are waiting for him, and this positive outlook for the son is consistent throughout the text."},{"i":"8bc66f89","c":"func","d":"M","s":"Part of the Atacama Desert in Peru has surprisingly rich plant life despite receiving almost no rainfall. Moisture from winter fog sustains plants once they’re growing, but the soil’s tough crust makes it hard for seeds to germinate in the first place. Local birds that dig nests in the ground seem to be of help: <u>they churn the soil, exposing buried seeds to moisture and nutrients<\/u>. Indeed, in 2016 Cristina Rengifo Faiffer found that mounds of soil dug up by birds were far more fertile and supported more seedlings than soil in undisturbed areas.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It elaborates on the idea that the top layer of Atacama Desert soil forms a tough crust.","It describes the process by which seeds are deposited into Atacama Desert soil.","It identifies the reason particular bird species dig nests in Atacama Desert soil.","It explains how certain birds promote seed germination in Atacama Desert soil."],"a":3,"r":"Choice D is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first two sentences establish a natural phenomenon: there is a richness of plant life found in the Atacama Desert despite the hard soil that makes it challenging for seeds to germinate. The next sentence, which contains the underlined portion, offers a potential explanation for the phenomenon: local birds dig ground nests exposing seeds to moisture and materials in the soil necessary for germination. The last sentence summarizes a study that compared the fertileness of mounds of dirt dug up by birds to mounds that were undisturbed to support the explanation in the underlined portion. Thus, the underlined portion mainly functions to explain how certain birds promote seed germination in the Atacama Desert soil. Choice A is incorrect because the underlined portion doesn’t address the topic of the soil’s tough crust or its formation. Instead, the text elaborates on the idea that local birds that build ground nests may help seeds germinate in the hard soil. Choice B is incorrect because the underlined portion describes how some birds may support seed germination in Atacama Desert soil but doesn’t describe how the seeds are deposited into the soil before germination begins. Choice C is incorrect because neither the underlined portion nor the text as a whole identifies a reason that a particular bird species may choose to dig ground nests in the Atacama Desert soil."},{"i":"422c5068","c":"func","d":"M","s":"Generally it takes Tule geese about four days to migrate south for the winter. From their summer breeding grounds in Cook Inlet, Alaska, <u>the birds begin by flying over the Gulf of Alaska, keeping about 100 miles from the Canadian shore<\/u>. They pause to rest on the Pacific Ocean, then fly toward Summer Lake, Oregon, before finally arriving at their winter destination of Sacramento Valley, California. In 2020, however, it took the geese over twice as long to make their way from Cook Inlet to Sacramento Valley. According to researchers, the reason was airborne pollutants.\n\nWhich choice best states the function of the underlined portion in the text as a whole?","o":["It illustrates a change in Tule geese’s usual flight behavior.","It suggests an explanation for why Tule geese breed in Alaska.","It describes part of the Tule geese’s typical winter migration journey.","It compares Tule geese to other birds that migrate south for the winter."],"a":2,"r":"Choice C is the best answer because it best states how the underlined portion functions in the text as a whole. The first sentence states that Tule geese typically take four days to migrate south. Then in the next sentence, which contains the underlined portion, the text describes the first part of that journey, which begins with the geese flying over the Gulf of Alaska while keeping about 100 miles from the Canadian shore. The rest of the text details the remainder of the geese’s typical journey and then mentions circumstances in 2020 that resulted in the geese taking an unusually long time to complete it. Thus, the underlined portion describes part of the Tule geese’s typical winter migration journey. Choice A is incorrect. Although the text concludes by stating that in 2020, Tule geese took twice as long to complete their typical migration, which suggests a change in their usual flight behavior, the underlined portion doesn’t discuss this. Instead, the underlined portion describes the first part of the Tule geese’s typical winter migration journey over the Gulf of Alaska. Choice B is incorrect. Although the sentence containing the underlined portion mentions that Tule geese breed in Alaska, the underlined portion doesn’t explain why the geese breed in that location. Rather, the text mentions Alaska to explain that it’s the starting point of the Tule geese’s typical winter migration. Choice D is incorrect because the underlined portion doesn’t discuss any other birds that migrate south for the winter. In fact, the text is only concerned with the migration of Tule geese."},{"i":"b4887dae","c":"structure","d":"H","s":"Mathematician Claude Shannon is widely regarded as a foundational figure in information theory. His most important paper, “A Mathematical Theory of Communication,” published in 1948 when he was employed at Bell Labs, utilized a concept called a “binary digit” (shortened to “bit”) to measure the amount of information in any signal and determine the fastest rate at which information could be transmitted while still being reliably decipherable. Robert Gallagher, one of Shannon’s colleagues, said that the bit was “[Shannon’s] discovery, and from it the whole communications revolution has sprung.”\n\nWhich choice best describes the overall structure of the text?","o":["It presents a theoretical concept, illustrates how the name of the concept has changed, and shows how the name has entered common usage.","It introduces a respected researcher, describes an aspect of his work, and suggests why the work is historically significant.","It names the company where an important mathematician worked, details the mathematician’s career at the company, and provides an example of the recognition he received there.","It mentions a paper, offers a summary of the paper’s findings, and presents a researcher’s commentary on the paper."],"a":1,"r":"Choice B is the best answer. The text starts with a general statement that introduces Shannon, then describes a specific contribution from one of his papers, then provides a quote that illustrates just how important this contribution was. Choice A is incorrect. This isn’t the overall structure. The text only mentions very briefly, in parentheses, that “binary digit” was shortened to “bit.” It doesn’t go into detail about this name change, and it doesn’t discuss any “common usage” of the name at all. Choice C is incorrect. This isn’t the overall structure. Shannon’s employment at Bell Labs is only mentioned once, very briefly: the text never goes into detail about his career there, and it never mentions any recognition he received there. Choice D is incorrect. This is too narrow. Overall, the text is about Shannon’s importance in his field, not just this one paper of his."},{"i":"de2c2f57","c":"cross","d":"H","s":"Text 1 The fossil record suggests that mammoths went extinct around 11 thousand years (kyr) ago. In a 2021 study of environmental DNA (eDNA)— genetic material shed into the environment by organisms—in the Arctic, Yucheng Wang and colleagues found mammoth eDNA in sedimentary layers formed millennia later, around 4 kyr ago. To account for this discrepancy, Joshua H. Miller and Carl Simpson proposed that arctic temperatures could preserve a mammoth carcass on the surface, allowing it to leach DNA into the environment, for several thousand years.\n\nText 2 Wang and colleagues concede that eDNA contains DNA from both living organisms and carcasses, but for DNA to leach from remains over several millennia requires that the remains be perpetually on the surface. Scavengers and weathering in the Arctic, however, are likely to break down surface remains well before a thousand years have passed.\n\nWhich choice best describes how\n\nText 1 and\n\nText 2 relate to each other?","o":["Text 1 discusses two approaches to studying mammoth extinction without advocating for either, whereas Text 2 advocates for one approach over the other.","Text 1 presents findings by Wang and colleagues and gives another research team’s attempt to explain those findings, whereas Text 2 provides additional detail that calls that explanation into question.","Text 1 describes Wang and colleagues’ study and a critique of their methodology, whereas Text 2 offers additional details showing that methodology to be sound.","Text 1 argues that new research has undermined the standard view of when mammoths went extinct, whereas Text 2 suggests a way to reconcile the standard view with that new research."],"a":1,"r":"Choice B is the best answer. Text 1 introduces Wang and colleagues’ study and its surprising results, and then mentions Miller and Simpson’s hypothesis as a possible way to explain them. Text 2, however, challenges Miller and Simpson’s hypothesis by pointing out the difficulties of preserving mammoth carcasses on the surface for thousands of years: “scavengers and weathering” are the additional details that complicate the Miller/Simpson hypothesis. Choice A is incorrect. Neither text compares two different approaches for studying mammoth extinction. Text 1 describes one study and one hypothesis pertaining to it. Text 2 critiques that hypothesis. Choice C is incorrect. Text 1 does not describe a critique of Wang and colleagues’ methodology, but rather an interpretation of their results by Miller and Simpson. Text 2 does not offer additional details showing that methodology to be sound, but rather casts doubt on the Miller/Simpson explanation. Choice D is incorrect. Both components mentioned here (the new “undermining” research and the theory for reconciling this discovery) are contained in Text 1. Text 2 then shows how the attempt to reconcile the standard view and new research is flawed, and still fails to explain the discrepancy."},{"i":"2573d64b","c":"main","d":"M","s":"At over a thousand pages across two volumes, The Fifty-Year Mission, compiled by Edward Gross and Mark A. Altman, is presented as the “complete, uncensored, unauthorized oral history” as told by the people behind the media franchise Star Trek. The work aspires to be comprehensive by, for example, including accounts from cast and crew members of every Star Trek television series and film to date. But while The Fifty-Year Mission is clearly a unique and valuable resource, it has a shortcoming common among oral histories: it lacks a clear authorial point of view that could otherwise unite the various accounts into a cohesive whole.\n\nWhich choice best states the main idea of the text?","o":["The compilers of The Fifty-Year Mission had lofty goals for their oral history of the Star Trek franchise, but the published work lacks information about many key events in the franchise’s history.","The Fifty-Year Mission includes more accounts from people involved with Star Trek television shows than it does from people involved with Star Trek films.","The large amount of material compiled into The Fifty-Year Mission is surprising given that many of the people involved in the Star Trek franchise did not participate in the oral history project.","The Fifty-Year Mission represents a worthwhile attempt to thoroughly recount the history of the Star Trek franchise, but its approach has an important limitation."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. According to the text, Gross and Altman’s book is a \"valuable resource\" because it’s a \"complete, uncensored, unauthorized oral history\" that features accounts from people involved with \"every Star Trek television series and film\" made. However, the text also points out an inherent shortcoming of the oral history approach used by the book’s creators: the lack of an authorial voice that could unify the many accounts into a coherent narrative. Thus, the text’s main idea is that while the book’s attempt at presenting a comprehensive oral history of the Star Trek franchise is a worthwhile one, the approach the creators selected has an important limitation. Choice A is incorrect. While the goal of the book’s creators (providing a comprehensive history of the Star Trek franchise) could be described as lofty, the text’s criticism of the book is focused on the shortcomings of the oral history form, not on events in the Star Trek franchise that were not reflected in the book. Choice B is incorrect because the text doesn’t suggest that the book includes more accounts from people involved with television shows than with films. In fact, the text explicitly states that the book includes accounts from people involved with \"every Star Trek television series and film\" ever made. Choice C is incorrect because the text doesn’t indicate that many people involved with the Star Trek franchise failed to participate in the book’s oral history project. The only mention of the scope of participation states that the book includes accounts \"from cast and crew members of every Star Trek television series and film to date.\" This information implies a high level of participation from relevant individuals, not a lack of participation."},{"i":"95146ebb","c":"main","d":"M","s":"The ice melted on a Norwegian mountain during a particularly warm summer in 2019, revealing a 1,700-year-old sandal to a mountaineer looking for artifacts. The sandal would normally have degraded quickly, but it was instead well preserved for centuries by the surrounding ice. According to archaeologist Espen Finstad and his team, the sandal, like those worn by imperial Romans, wouldn’t have offered any protection from the cold in the mountains, so some kind of insulation, like fabric or animal skin, would have needed to be worn on the feet with the sandal. What does the text indicate about the discovery of the sandal?","o":["Temperatures contributed to both protecting and revealing the sandal.","The discovery revealed that the Roman Empire had more influence on Norway than archaeologists previously assumed.","Archaeologists would have found the sandal eventually without help from the general public.","The sandal would have degraded if it hadn’t been removed from the ice."],"a":0,"r":"Choice A is the best answer. A \"particularly warm summer\" revealed the sandal, and centuries of ice kept it \"well preserved.\" Choice B is incorrect. This choice doesn’t reflect the information in the text. The sandal is similar to Roman sandals, but there is no indication that it was a result of Roman influence. Choice C is incorrect. The text doesn’t support this choice. We don’t have enough information to know whether or not archaeologists would have found the sandal without people like the treasure-hunting mountaineer. Choice D is incorrect. The text says the opposite of this choice. The sandal was preserved by the ice for centuries."},{"i":"a13c1c66","c":"infer","d":"H","s":"Many animals, including humans, must sleep, and sleep is known to have a role in everything from healing injuries to encoding information in long-term memory. But some scientists claim that, from an evolutionary standpoint, deep sleep for hours at a time leaves an animal so vulnerable that the known benefits of sleeping seem insufficient to explain why it became so widespread in the animal kingdom. These scientists therefore imply that ______ Which choice most logically completes the text?","o":["prolonged deep sleep is likely advantageous in ways that have yet to be discovered.","most traits perform functions that are hard to understand from an evolutionary standpoint.","it is more important to understand how widespread prolonged deep sleep is than to understand its function.","many traits that provide significant benefits for an animal also likely pose risks to that animal."],"a":0,"r":"Choice A is the best answer. It most logically completes the text. The text says that some scientists can’t explain why prolonged deep sleep is so widespread, given that the known benefits of sleep don’t seem to make up for how vulnerable it leaves an animal. This suggests that prolonged deep sleep probably has unknown evolutionary benefits that make up for the vulnerability. Choice B is incorrect. It doesn’t logically complete the text. The text only discusses the benefits and risks of one trait: sleep. So there’s no basis for an inference about “most traits.” Choice C is incorrect. It doesn’t logically complete the text. The text says that it is already known that prolonged deep sleep is widespread in the animal kingdom. Rather, what some scientists can’t explain is WHY prolonged deep sleep is so widespread, given that the known benefits of sleep don’t seem to make up for how vulnerable it leaves an animal. Choice D is incorrect. It doesn’t logically complete the text. The text only discusses the benefits and risks of one trait: sleep. So there’s no basis for an inference about “many traits.”"},{"i":"8fbed1cb","c":"infer","d":"M","s":"When the Vinland Map, a map of the world purported to date to the mid-1400s, surfaced in 1957, some scholars believed it demonstrated that European knowledge of the eastern coast of present-day North America predated Christopher Columbus’s 1492 arrival. In 2021, a team including conservators Marie-France Lemay and Paula Zyats and materials scientist Anikó Bezur performed an extensive analysis of the map and the ink used. They found that the ink contains titanium dioxide, a compound that was first introduced in ink manufacturing in the early 1900s. Therefore, the team concluded that ______ Which choice most logically completes the text?","o":["mid-1400s Europeans could not have known about the eastern coast of present-day North America.","the Vinland Map could not have been drawn by mid-1400s mapmakers.","mapmakers must have used titanium compounds in their ink in the 1400s.","there isn’t enough information to determine when the ink was created."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Lemay, Zyats, and Bezur’s 2021 analysis of the Vinland Map. The text indicates that while some scholars have believed that the map was drawn in the mid-1400s, the 2021 analysis showed the presence of the compound titanium dioxide in the ink used to draw the map. The text goes on to say that titanium dioxide wasn’t used to manufacture ink until the early 1900s, which means that ink containing this compound couldn’t have been available to mapmakers in the 1400s. Since mapmakers in the mid-1400s couldn’t have used ink with titanium dioxide, it follows that the Vinland Map couldn’t have been drawn by mid- 1400s mapmakers. Choice A is incorrect because the 2021 finding that the ink used to draw the Vinland Map wasn’t available until the early 1900s doesn’t imply that Europeans in the mid-1400s couldn’t have known about the eastern coast of North America. While this finding suggests that the map couldn’t have been created in the mid-1400s, it doesn’t preclude the possibility that Europeans nevertheless had knowledge—and perhaps even drew other maps that are no longer in existence or are yet to be discovered by researchers—of the eastern coast of present-day North America as early as the mid-1400s. Choice C is incorrect because there’s nothing in the text that suggests that the 2021 discovery of the presence of titanium dioxide in the ink used to draw the Vinland Map caused Lemay, Zyats, and Bezur to question or reach a new conclusion about when mapmakers began using ink containing titanium compounds. Instead, the text indicates that titanium dioxide wasn’t used in ink before the early 1900s. This knowledge led the team to conclude that the map, which was drawn with ink containing titanium dioxide, couldn’t have been created in the mid- 1400s. Choice D is incorrect because although the text doesn’t indicate that Lemay, Zyats, and Bezur established an exact date for the creation of the ink that was used to draw the Vinland Map, the text does say that titanium dioxide was introduced in ink manufacturing in the early 1900s. This fact provides enough information to determine that the ink that was used to draw the map was created no earlier than the early 1900s. This finding, in turn, led the team to conclude that the Vinland Map couldn’t have been drawn in the mid-1400s."},{"i":"22e4d633","c":"claim","d":"M","s":"Although many transposons, DNA sequences that move within an organism’s genome through shuffling or duplication, have become corrupted and inactive over time, those from the long interspersed nuclear elements (LINE) family appear to remain active in the genomes of some species. In humans, they are functionally important within the hippocampus, a brain structure that supports complex cognitive processes. When the results of molecular analysis of two species of octopus—an animal known for its intelligence—were announced in 2022, the confirmation of a LINE transposon in Octopus vulgaris and Octopus bimaculoides genomes prompted researchers to hypothesize that that transposon family is tied to a species’ capacity for advanced cognition.\n\nWhich finding, if true, would most directly support the researchers’ hypothesis?","o":["The LINE transposon in O. vulgaris and O. bimaculoides genomes is active in an octopus brain structure that functions similarly to the human hippocampus.","The human genome contains multiple transposons from the LINE family that are all primarily active in the hippocampus.","A consistent number of copies of LINE transposons is present across the genomes of most octopus species, with few known corruptions.","O. vulgaris and O. bimaculoides have smaller brains than humans do relative to body size, but their genomes contain sequences from a wider variety of transposon families."],"a":0,"r":"Choice A is the best answer. The text says that LINE transposons are important in the human hippocampus, which supports complex cognition. If the LINE transposon found in octopuses is active in a similar part of their brain, that would suggest that LINE transposons support complex cognition in octopuses too, which in turn supports the hypothesis that LINE transposons are linked to advanced cognition in general. Choice B is incorrect. This choice doesn’t support the hypothesis. It doesn’t include anything about how LINE transposons function in species other than humans. Choice C is incorrect. This choice doesn’t support the hypothesis. It doesn’t include anything about how the LINE transposon in octopuses might support advanced cognition. Choice D is incorrect. This choice doesn’t support the hypothesis. It doesn’t include anything about how the LINE transposon in octopuses might support advanced cognition."},{"i":"dc87adf4","c":"claim","d":"H","s":"Barchester Towers is an 1857 novel by Anthony Trollope. In the novel, Trollope’s portrayal of Dr. Proudie underscores the character’s exaggerated sense of his own abilities: ______ Which quotation from Barchester Towers most effectively illustrates the claim?","o":["“It must not…be taken as proved that Dr. Proudie was a man of great mental powers, or even of much capacity for business, for such qualities had not been required in him.”","“[Dr. Proudie] was comparatively young, and had, as he fondly flattered himself, been selected as possessing such gifts, natural and acquired, as must be sure to recommend him to a yet higher notice.”","“[Dr. Proudie’s] residence in the metropolis, rendered necessary by duties thus entrusted to him, his high connexions, and the peculiar talents and nature of the man, recommended him to persons in power.”","“[Dr. Proudie] was certainly possessed of sufficient tact to answer the purpose for which he was required without making himself troublesome.”"],"a":1,"r":"Choice B is the best answer. In this quotation, Dr. Proudie is described as \"fondly flatter[ing] himself\" that he has gifts that \"must be sure to recommend him to a yet higher notice.\" In other words, he expects his skills to push him to greater fame and success. This implies an exaggerated sense of his own abilities, which matches the claim we’re trying to support. Choice A is incorrect. This quotation doesn’t describe Proudie’s view of himself, nor does it paint him in an especially flattering light. Instead, by saying his mental powers and business skill are not \"proved,\" it implies that he is actually dim-witted and bad at business. Choice C is incorrect. This choice describes Proudie’s closeness to power and importance, but it doesn’t show what Proudie thinks of himself. Proudie is not describing himself or his abilities here. The narrator is. Choice D is incorrect. While this quotation offers Proudie very mild praise, it doesn’t show what Proudie thinks of himself or his own abilities, which is what the claim focuses on."},{"i":"ede3f942","c":"graph","d":"E","s":"","o":["13.50 square miles.","53.68 square miles.","9.36 square miles.","39.21 square miles."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to support the statement about the tribal nation of Los Coyotes Band of Cahuilla and Cupeño Indians in California. The text states that most tribal nations in California are less than 50 square miles in total area and provides Los Coyotes Band of Cahuilla and Cupeño Indians as an example. According to the table, the tribal nation of Los Coyotes Band of Cahuilla and Cupeño Indians covers 39.21 square miles in Southern California, which is less than 50 square miles. Choice A is incorrect because it cites the area of La Jolla Band of Luiseño Indians (13.50 square miles), not that of Los Coyotes Band of Cahuilla and Cupeño Indians. Choice B is incorrect because it cites the area of the Agua Caliente Band of Cahuilla Indians (53.68 square miles), not that of Los Coyotes Band of Cahuilla and Cupeño Indians. Additionally, this area is greater than 50 square miles and therefore wouldn’t be an effective example for illustrating the text’s statement that most tribal nations in California are less than 50 square miles in total area. Choice C is incorrect because it cites the area of the Pauma Band of Luiseño Mission Indians (9.36 square miles), not that of Los Coyotes Band of Cahuilla and Cupeño Indians."},{"i":"cca6fae9","c":"graph","d":"H","s":"","o":["Although delta 15-N values were generally higher in Akumal Bay and Tulum than in Mahahual and Xahuayxol, the values were lower in Akumal Bay than in Mahahual and Xahuayxol in February 2017.","Delta 15-N values reached their lowest level in February 2017 in both Akumal Bay and Tulum, but no data were available for Akumal Bay in February 2016, when the values reached their highest level in Tulum.","Although all sites showed considerable variation in delta 15-N values, the values remained relatively constant in Akumal Bay from October 2016 to February 2017 and in Tulum from February 2016 to October 2016.","In Akumal Bay and Tulum, delta 15-N values fluctuated considerably across the three measurements made from October 2016 to October 2017."],"a":3,"r":"Choice D is the best answer because it describes data from the table that support the underlined conclusion. The text accompanying the table states that delta 15-N values (a measure of the ratio of two nitrogen isotopes) can be used as an indirect means of measuring the ratio of human wastewater to water from uncontaminated sources—the higher the delta 15-N values, the greater the presence of human wastewater. The text goes on to mention an experiment conducted by Camacho-Cruz and colleagues measuring delta 15-N values in seagrass on the Yucatan peninsula at several sites, four of which are presented in the table accompanying the text. Two of the sites noted in the table, Akumal Bay and Tulum, had intermediate tourism development, and two others, Mahahual and Xahuayxol, had low tourism development. It is reasonable to infer that sites with intermediate tourism have a greater human presence than those with low tourism and therefore are subject to greater amounts of wastewater and exhibit higher delta 15-N values in seagrass. However, Camacho-Cruz and colleagues found that the increase in delta 15-N values was not constant. The table supports this conclusion because the two intermediate-tourism sites (Akumal Bay and Tulum) had delta 15-N values that fluctuated considerably—both had higher delta 15-N values than the two low-tourism sites (Mahahual and Xahuayxol) in October 2016 and October 2017, but in February 2017 the delta 15-N values for the intermediate-tourism sites dropped significantly (in fact, Mahahual, a low-tourism site, had a higher delta 15-N value for that period). The fluctuations in values in Akumal Bay and Tulum support the conclusion that these sites experienced influxes of human wastewater intermittently. Choice A is incorrect because it inaccurately describes data from the table: in February 2017 the delta 15-N value in Akumal Bay was higher than the delta 15-N value in Xahuayxol, not lower. Choice B is incorrect because the absence of data for delta 15-N levels in Akumal Bay in February 2016 would neither prove nor disprove that the presence of human wastewater at Akumal Bay and Tulum was not constant. Despite the unavailable data, there is still enough information to conclude that delta 15-N levels at both sites fluctuated significantly and that influxes of human wastewater therefore happened intermittently. Choice C is incorrect because a constancy in delta 15-N values would not indicate that the influx of human wastewater was intermittent, but rather the opposite. Moreover, the two periods selected are not indicative of general trends in the whole table (for example, the values fluctuated significantly in Akumal Bay between February 2017 and October 2017, and in Tulum between October 2016 and February 2017)."},{"i":"684b8bd2","c":"fss","d":"M","s":"Far from being modern inventions, ______ more than 5,000 years ago.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Sumerians in ancient Mesopotamia used drinking straws","drinking straws were used by Sumerians in ancient Mesopotamia","the use of drinking straws by Sumerians in ancient Mesopotamia happened","ancient Mesopotamia was home to Sumerians who used drinking straws"],"a":1,"r":"Choice B is the best answer. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” must be describing “drinking straws,” because those are the only possible inventions in this sentence. Choice A is incorrect. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” can’t be describing “Sumerians,” because they are a group of people, not an invention. Choice C is incorrect. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” can’t be describing “the use of drinking straws,” because it is not “the use” of drinking straws that is an invention—it is the drinking straws themselves. Choice D is incorrect. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” can’t be describing “Ancient Mesopotamia,” because that is a place, not an invention."},{"i":"1f8cd95f","c":"fss","d":"M","s":"In the 1950s, a man named Joseph McVicker was struggling to keep his business afloat when his sister-in-law Kay Zufall advised him to repurpose the company’s product, a nontoxic, clay-like substance for removing soot from wallpaper, as a modeling putty for kids. In addition, Zufall ______ selling the product under a child-friendly name: Play-Doh.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["suggested","suggests","had suggested","was suggesting"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the simple past tense verb “suggested” properly indicates that Zufall offered her suggestion for the product’s name in the past. This verb tense is consistent with the previous sentence’s use of a simple past tense verb (“advised”) to describe Zufall’s advice to McVicker in the 1950s. Choice B is incorrect because the present tense verb “suggests” doesn’t indicate that Zufall offered her suggestion in the past. Choice C is incorrect because the past perfect verb “had suggested” isn’t consistent with the previous sentence’s use of the simple past tense verb “advised” to describe Zufall’s advice to McVicker. Choice D is incorrect because the past progressive verb “was suggesting” isn’t consistent with the previous sentence’s use of the simple past tense verb “advised” to describe Zufall’s advice to McVicker."},{"i":"d1482e27","c":"fss","d":"E","s":"One of the earliest known maps is a Babylonian clay tablet thought to be almost 4,500 years old. The map ______ the area of a plot of land, shows a river valley, and includes the cardinal directions.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["describes","describe","have described","are describing"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The singular verb \"describes\" agrees in number with the singular subject \"map.\" Choice B is incorrect because the plural verb \"describe\" doesn’t agree in number with the singular subject \"map.\" Choice C is incorrect because the plural verb \"have described\" doesn’t agree in number with the singular subject \"map.\" Choice D is incorrect because the plural verb \"are describing\" doesn’t agree in number with the singular subject \"map.\""},{"i":"c06af4d8","c":"bound","d":"H","s":"Sociologist Alton Okinaka sits on the review board tasked with adding new sites to the Hawai‘i Register of Historic Places, which includes Pi‘ilanihale Heiau and the ‘Ōpaeka‘a Road Bridge. Okinaka doesn’t make such decisions ______ all historical designations must be approved by a group of nine other experts from the fields of architecture, archaeology, history, and Hawaiian culture.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["single-handedly, however;","single-handedly; however,","single-handedly, however,","single-handedly however"],"a":0,"r":"Choice A is the best answer. The convention being tested is the punctuation of a supplementary word or phrase between two main clauses. This choice correctly uses a comma to separate the supplementary adverb “however” from the preceding main clause (“Okinaka doesn’t…single- handedly”) and a semicolon to join the next main clause (“all…culture”) to the rest of the sentence. Further, placing the semicolon after “however” correctly indicates that the information in the preceding main clause (Okinaka doesn’t make such decisions single-handedly) is contrary to what might be assumed from the information in the previous sentence (Okinaka sits on the review board that adds new sites to the Hawaii Register of Historic Places). Choice B is incorrect because placing the semicolon after “single-handedly” and the comma after “however” illogically indicates that the information in the next main clause (all historical designations must be approved by a group of experts) is contrary to the information in the previous clause (Okinaka doesn’t make such decisions single-handedly). Choice C is incorrect because it results in a comma splice. Commas can’t be used in this way to punctuate a supplementary word or phrase between two main clauses. Choice D is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."},{"i":"b6560e5a","c":"bound","d":"M","s":"Materials scientist Marie-Agathe Charpagne and her colleagues believed they could improve on the multicomponent alloy NiCoCr, an equal- proportions mixture of nickel (Ni), cobalt (Co), and chromium (Cr), by replacing chromium with ruthenium ______ the alloy that resulted, NiCoRu, turned out to be an unsuitable replacement for NiCoCr.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["(Ru)","(Ru) but","(Ru),","(Ru), but"],"a":3,"r":"Choice D is the best answer. The convention being tested is the coordination of main clauses. This choice correctly uses a comma and the coordinating conjunction “but” to join the first main clause (“Materials…Ru”) and the second main clause (“the alloy…NiCoCr”). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."},{"i":"86b78078","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Samuel Selvon was a Trinidadian author. The Lonely Londoners is one of his most celebrated novels. Selvon published the novel in 1956. It is about a group of men who emigrate from the Caribbean to Great Britain after World War II. Some of The Lonely Londoners’ characters also appear in Selvon’s later novel Moses Ascending. The student wants to introduce Samuel Selvon and his novel The Lonely Londoners to a new audience.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In 1956, Trinidadian author Samuel Selvon published one of his most celebrated novels, The Lonely Londoners, which is about a group of men who emigrate from the Caribbean to Great Britain after World War II.","Samuel Selvon wrote the novel Moses Ascending after he wrote The Lonely Londoners.","The Lonely Londoners, a celebrated novel that was published in 1956, depicts post–World War II Caribbean migration from the perspective of a Trinidadian author.","Some of the characters who appear in Samuel Selvon’s Moses Ascending also appear in The Lonely Londoners."],"a":0,"r":"Choice A is the best answer. By noting that Selvon is a Trinidadian author and indicating that The Lonely Londoners, published in 1956, is about a group of men who emigrate from the Caribbean to Great Britain after World War II, the sentence effectively introduces Samuel Selvon and his novel to a new audience. Choice B is incorrect. The sentence indicates the order in which two of Selvon’s novels were written; it doesn’t introduce Samuel Selvon and The Lonely Londoners to a new audience. Choice C is incorrect. While the sentence describes the novel The Lonely Londoners, it doesn’t mention its author, Samuel Selvon, by name and thus doesn’t effectively introduce him to a new audience. Choice D is incorrect. The sentence indicates that two of Selvon’s novels include the same characters; it doesn’t introduce Samuel Selvon and The Lonely Londoners to a new audience."},{"i":"964c6055","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Two opposing theories of vision divided scholars for many centuries. The ancient Greek mathematician Euclid (circa 300 BCE) supported the extramission theory. This theory held that the eyes emit a form of radiation that illuminates objects in its range. The ancient Greek philosopher Aristotle (384–322 BCE) supported the intromission theory. This theory held that objects emit a form of radiation that reaches the eyes. In the eleventh century, Arab mathematician Ibn al-Haytham (965–1040 CE) largely settled the debate with the first conclusive experiments supporting intromission. The student wants to provide a historical overview of the two theories.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Scholars were divided between the extramission and intromission theories of vision until Ibn al-Haytham’s eleventh-century experiments largely settled the debate in support of intromission.","Through two opposing theories of vision—extramission and intromission—Euclid, Aristotle, and Ibn al-Haytham held that a form of radiation is emitted either from objects or from the eyes.","While Ibn al-Haytham largely settled the debate in the eleventh century, Aristotle supported the theory of intromission centuries before.","Before the eleventh century, the ancient Greek philosopher Aristotle supported the intromission theory, which held that objects emit a form of radiation that reaches the eyes."],"a":0,"r":"Choice A is the best answer. The sentence provides a historical overview of the two theories, noting that scholars were divided between them before Ibn al-Haytham’s experiments supporting intromission largely settled the debate in the eleventh century. Choice B is incorrect. While the sentence identifies the two theories and the scholars that supported them, it doesn’t provide a historical overview of the theories. Choice C is incorrect. While the sentence indicates Aristotle supported intromission theory centuries before Ibn al-Haytham settled the debate, it doesn’t mention extramission theory or provide a historical overview of both theories. Choice D is incorrect. The sentence provides information about intromission theory but doesn’t mention extramission theory or provide a historical overview of both theories."},{"i":"4703eafb","c":"trans","d":"M","s":"Following the American Revolutionary War, North American foodways underwent a radical transformation, fueled in large part by spiking consumer demand for certain grains. The cultivation, trade, and transportation of maize and wheat, ______ reconfigured the continent’s existing regional foodways into a globally oriented food system.\n\nWhich choice completes the text with the most logical transition?","o":["in particular,","alternatively,","by comparison,","second of all,"],"a":0,"r":"Choice A is the best answer. \"In particular\" logically signals that the information in this sentence—that maize and wheat supply chains transformed North American foodways into a global food system—provides specific, precise details elaborating on the more general information in the previous sentence about the transformation of North American foodways (with maize and wheat the \"certain grains\" at the center of it). Choice B is incorrect because \"alternatively\" illogically signals that the information in this sentence is an alternative option to the previous information about the transformation of North American foodways. Instead, the roles of maize and wheat in creating a global food system are specific, precise details elaborating on that information. Choice C is incorrect because \"by comparison\" illogically signals that the information in this sentence is being compared to the previous information about the transformation of North American foodways. Instead, the roles of maize and wheat in creating a global food system are specific, precise details elaborating on that information. Choice D is incorrect because \"second of all\" illogically signals that the information in this sentence is a second, separate claim from the previous claim that North American foodways were transformed. Instead, the roles of maize and wheat in creating a global food system are specific, precise details elaborating on that information, rather than a separate claim."},{"i":"2b08f514","c":"trans","d":"H","s":"The prime meridian, the global indicator of zero degrees longitude established in 1884, was originally determined using astronomically derived coordinates. ______ as decades passed, new calculations would reveal increasingly precise coordinates, yet the prime meridian remained unchanged; it wasn’t until the 1980s that, spurred by improved geodetic data, the prime meridian was officially moved—roughly one hundred meters east.\n\nWhich choice completes the text with the most logical transition?","o":["Specifically,","To that end,","Again and again,","Granted,"],"a":2,"r":"Choice C is the best answer. \"Again and again\" logically signals that the information in this sentence—that new calculations revealed increasingly precise coordinates for the location of the prime meridian—refers to events that occurred multiple times in the decades after the establishment of the prime meridian in 1884 (which is described in the preceding sentence). Choice A is incorrect because \"specifically\" illogically signals that the information in this sentence provides specific, precise details elaborating on the description of the prime meridian’s establishment in the previous sentence. Instead, the sentence indicates that increasingly precise coordinates were revealed on multiple occasions in the decades following the meridian’s establishment. Choice B is incorrect because \"to that end\" illogically signals that the information in this sentence is a means of accomplishing a goal established in the previous sentence about the prime meridian’s establishment. Instead, the sentence indicates that increasingly precise coordinates were revealed on multiple occasions in the decades following the meridian’s establishment. Choice D is incorrect because \"granted\" illogically signals that the information in this sentence is in opposition to the information about the prime meridian’s establishment in the previous sentence. Instead, the sentence indicates that increasingly precise coordinates were revealed on multiple occasions in the decades following the meridian’s establishment."}],"img":{"ede3f942":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEgBAMAAACk2L3VAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABFJklEQVR42u1dd3iT1ff/3DdJm86cpGWPvmnZ8+0A2YSpIEIAFQSUoogoKEFAUVAKokyxLGVKQUA2ZcpSCsgeDXvTsHdzU6CU0ub+/mgLBVqgjG/Lz5zn6dO873vn55577jnnLsBFLnKRi1zkIhe5KM+TZDRQ+k8NZfFd9RFgCNSnfzIYAwG9Ju2LDAakfcgUk6WHBIAgyKqPMt5TbtYytzKu/s/xCDAmAygE4NhDn8lDhvbK2kbhaU/t96w1o61WBgAPBd/JHpEADKqo+zE8FQDQ7twI4Cs2Wqukv1db/pPs621BCbn0cjREJYKUIkthrAG
