<script>
const D={"t":"Practicetest40","q":[{"i":"52fe862a","c":"vocab","d":"E","s":"Researcher Lucy Salazar is using radiocarbon dating to study Machu Picchu, an ancient Incan fortress in the Andes Mountains. She and her colleagues have found that the site’s age differs from the ______ estimate: it is approximately 20 years older than scholars thought when first encountering Machu Picchu in 1911.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["genuine","intentional","independent","original"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the dating of Machu Picchu. In this context, \"original\" means first or initial. The text indicates that Lucy Salazar and her colleagues have determined the age of Machu Picchu and that the age differs from another estimate of the site’s age, explaining that the site is about 20 years older than scholars thought in 1911 when they initially encountered Machu Picchu. In other words, Salazar and her team found that the site’s age differs from the first estimate. Choice A is incorrect. The text’s structure indicates that the missing word describes the estimate made by scholars when they first encountered Machu Picchu in 1911 in relation to the age determined by Salazar and her colleagues. It wouldn’t make sense to suggest that the estimate by earlier scholars was \"genuine,\" or actual and true, while the one by Salazar’s team wasn’t, since the text treats the finding by Salazar’s team as true and as invalidating the earlier estimate (\"it is approximately 20 years older than scholars thought\"). Choice B is incorrect. The text’s structure indicates that the missing word describes the estimate made by scholars when they first encountered Machu Picchu in 1911 in relation to the age determined by Salazar and her colleagues. It wouldn’t make sense to suggest that the estimate by earlier scholars was \"intentional,\" or done on purpose, while the one by Salazar’s team wasn’t; the text indicates that Salazar and her colleagues were deliberately using radiocarbon dating to study Machu Picchu. Choice C is incorrect. The text’s structure indicates that the missing word describes the estimate made by scholars when they first encountered Machu Picchu in 1911 in relation to the age determined by Salazar and her colleagues. There’s no reason to suggest that the estimate by earlier scholars was \"independent,\" or not controlled by or affiliated with others, while the one by Salazar’s team wasn’t; there’s no mention of any outside influence on the work by Salazar and her team or by scholars in 1911."},{"i":"c977cfcf","c":"vocab","d":"M","s":"According to a team of neuroeconomists from the University of Zurich, ease of decision making may be linked to communication between two brain regions, the prefrontal cortex and the parietal cortex. Individuals tend to be more decisive if the information flow between the regions is intensified, whereas they make choices more slowly when information flow is ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["reduced","evaluated","determined","acquired"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of how the flow of information between two regions of the brain may affect the ease of people’s decision making. In this context, \"reduced\" means decreased. The text presents the finding from a team of neuroeconomists that decision making may be connected to communication between the prefrontal cortex and the parietal cortex. In presenting this finding, the text suggests a contrast between people who tend to be more decisive and people who make decisions more slowly. According to the text, people tend to be more decisive when the flow of information between the two brain regions is intensified, or strengthened. On the other hand, this context suggests that people make choices more slowly when the flow of information between the two brain regions is decreased. Choice B is incorrect because \"evaluated\" means assessed, which wouldn’t make sense in context. According to the text, people tend to be more decisive when the flow of information between two brain regions is intensified, or strengthened. This suggests that people’s ease of decision making varies based on the rate of information traveling between the regions, not based on an effort to assess the information. Choice C is incorrect because \"determined\" means judged or influenced, neither of which would make sense in context. According to the text, people tend to be more decisive when the flow of information between two brain regions is intensified, or strengthened. This suggests that people’s ease of decision making varies based on the rate of information traveling between the regions, not based on an effort to judge or influence the information. Choice D is incorrect because \"acquired\" means developed or attained, neither of which would make sense in context. According to the text, people tend to be more decisive when the flow of information between two brain regions is intensified, or strengthened. This suggests that people’s ease of decision making varies based on the rate of information traveling between the regions, not based on the development or attainment of the information."},{"i":"04e4c51d","c":"vocab","d":"E","s":"Taking photographs in the mid-1800s was complicated and expensive, but this changed with the 1854 invention of the carte de visite, a small photo that cost little to make. Carte de visite photos helped to ______ photography: they made it easy and enjoyable for everyday people to have their pictures taken, and people at the time loved exchanging these small photos with friends and family.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["weaken","praise","popularize","isolate"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of carte de visite photos. To \"popularize\" a technology is to allow it to be used and appreciated widely. The text explains that unlike the photos produced by earlier forms of photographic technology, carte de visite photos were inexpensive and could easily be obtained by \"everyday people,\" who enjoyed exchanging the images. Therefore, carte de visite photos helped popularize photography. Choice A is incorrect because the text indicates that instead of weakening the emerging technology of photography, carte de visite photos allowed it to be more widely accessed and enjoyed by people. Choice B is incorrect. The text establishes that large numbers of people enjoyed using carte de visite photos, so it can be inferred that these photos caused photography to be praised, or celebrated. However, it wouldn’t make sense to say that inanimate objects—in this case, photos—had praised photography; instead, carte de visite consumers themselves would have praised it. Choice D is incorrect because the text explains that rather than isolating photography, or limiting its availability, carte de visite technology made photography more widely accessible to people."},{"i":"69a6d050","c":"vocab","d":"E","s":"In the early 1800s, the Cherokee scholar Sequoyah created the first script, or writing system, for an Indigenous language in the United States. Because it represented the sounds of spoken Cherokee so accurately, his script was easy to learn and thus quickly achieved ______ use: by 1830, over 90 percent of the Cherokee people could read and write it.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["widespread","careful","unintended","infrequent"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the writing system created by Sequoyah. In this context, “widespread” means widely accepted or practiced. The text indicates that because Sequoyah’s script accurately represented the spoken sounds of the Cherokee language and was easy to learn, nearly all Cherokee people were able to read and write it soon after it was created. This context demonstrates that the script was widely used by the Cherokee people. Choice B is incorrect. In this context, “careful” would mean exercised with care and attentive concern. Although the work of creating a writing system likely involved great care, the text indicates that the system was “easy to learn,” which conflicts with the idea that using this system requires a noteworthy amount of care. Choice C is incorrect because in this context “unintended” means not deliberate. The idea that using Sequoyah’s script was unintentional conflicts directly with the claim that it was easy to learn and used by “over 90% of the Cherokee people” by 1830. In fact, because one had to learn this system, it’s not clear how one could use it unintentionally. Choice D is incorrect because in this context “infrequent” means rare or not occurring often, which conflicts directly with the claim that “over 90% of the Cherokee people” were using Sequoyah’s script by 1830."},{"i":"d563bf65","c":"purpose","d":"E","s":"The following text is adapted from Jean Webster’s 1912 novel Daddy-Long-Legs. The narrator is a young college student writing letters detailing her weekly experiences. [The college is] organizing the Freshman basket-ball team and there’s just a chance that I shall make it. I’m little of course, but terribly quick and wiry and tough. While the others are hopping about in the air, I can dodge under their feet and grab the ball.\n\nWhich choice best states the main purpose of the text?","o":["To compare basketball with other sports","To provide details of how to play basketball","To state how players will be chosen for the basketball team","To explain why the narrator thinks she might make the basketball team"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text. In the first sentence of the text, the narrator states that she thinks there’s a chance she will become part of the basketball team at her college. She goes on to explain that she is \"quick\" and \"tough.\" Based on these characteristics, she thinks she has a chance to join the team. Thus, the main purpose of the text is to explain why the narrator thinks she might make the basketball team. Choice A is incorrect because the text focuses solely on basketball and doesn’t mention any other kinds of sports. Choice B is incorrect because the text doesn’t describe aspects of the game of basketball. Instead, it provides the narrator’s reasoning for thinking that she might make her school basketball team. Choice C is incorrect. Although the narrator explains why she thinks she will be chosen for the basketball team at her school, the text doesn’t go into the general decision-making process or the requirements for being picked for the team."},{"i":"eaea6f8f","c":"purpose","d":"E","s":"Ordinary soap bubbles usually exist for a minute or less before popping due to either a rupture forced by gravity-induced drainage or the evaporation of the liquid from which the bubble is composed. But physicist Aymeric Roux and colleagues discovered ways to mitigate these factors, resulting in bubbles that can last for a year or more. For example, glycerol tends to adhere to water molecules, so <u>a bubble with a shell that contains both water and glycerol is able to draw additional water molecules from the surrounding air and thereby compensate for evaporation.<\/u> Which choice best states the purpose of the underlined portion in the text as a whole?","o":["It describes the effects of a process devised by researchers that increases the longevity of an object discussed in the text.","It details the circumstances that prompted the research discussed in the text.","It presents a reason why the phenomenon discussed in the text that the researchers wanted to avoid will inevitably occur.","It mentions a method discussed in the text that researchers intend to test in future experiments."],"a":0,"r":"Choice A is the best answer because it describes how the underlined portion of the sentence functions in the text as a whole. The text begins by discussing ordinary soap bubbles, objects that usually exist for less than a minute before popping due to either evaporation or gravity-induced drainage. The text then goes on to mention work by researchers Aymeric Roux and colleagues, who have discovered how to increase the longevity of bubbles by altering their chemical composition. Finally, the underlined portion of the text describes how this process works: since the bubble contains both water and glycerol, it can draw water molecules from the surrounding air to replace those lost to evaporation. Therefore, the underlined portion of the sentence describes the effects of a process devised by researchers that increases the longevity of an object described in the text. Choice B is incorrect because the circumstance that prompted the research is discussed in the first sentence of the text, not the underlined portion. Choice C is incorrect because the underlined portion of the text does not address why soap bubbles must eventually rupture. Rather, it explains how the longevity of soap bubbles can be extended. Choice D is incorrect because the underlined portion of the text does not mention any future experiments."},{"i":"4c4db685","c":"func","d":"M","s":"On painter William H. Johnson’s return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. <u>Turning away from landscapes painted in an expressionist style—a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist’s subjective experience of reality—Johnson began painting portraits of Black Americans in a bold new way.<\/u> Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It elaborates on the previous sentence’s statement about a transitional moment in Johnson’s artistic career.","It provides information about Johnson’s travels in support of a claim about his artistic influences, which is advanced in the following sentence.","It recounts a moment in Johnson’s personal life that enabled the success of his subsequent career, which is summarized in the following sentence.","It presents evidence that calls into question the previous sentence’s characterization of Johnson’s artistic development."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The first sentence of the text indicates that Johnson returned to the US in 1938 at which time his painting style suddenly changed. The second sentence is underlined and gives more detail about this stylistic change, noting that his earlier work consisted largely of landscapes in an expressionist style and his new works were highly stylized portraits of Black Americans. In other words, the function of the underlined sentence is to elaborate on a transitional moment in Johnson’s painting career. Choice B is incorrect. Although the text does mention that Johnson spent a decade in Europe, it does not discuss what other travel Johnson might have done. Furthermore, although the text mentions African, American, and Scandinavian artistic elements in Johnson’s work, it does not indicate that he traveled to different locations to learn about these practices. Choice C is incorrect because the text does not focus on Johnson’s personal life nor does it address how successful his career was in general. Choice D is incorrect because, rather than call it into question, the underlined sentence continues the discussion of Johnson’s career by adding further relevant detail of Johnson’s artistic transformation."},{"i":"e7247766","c":"func","d":"M","s":"Horizontal gene transfer occurs when an organism of one species acquires genetic material from an organism of another species through nonreproductive means. The genetic material can then be transferred “vertically” in the second species—that is, through reproductive inheritance. Scientist Atma Ivancevic and her team have hypothesized infection by invertebrate parasites as a mechanism of horizontal gene transfer between vertebrate species: <u>while feeding, a parasite could acquire a gene from one host, then relocate to a host from a different vertebrate species and transfer the gene to it in turn.<\/u> Which choice best describes the function of the underlined portion in the text as a whole?","o":["It explains why parasites are less susceptible to horizontal gene transfer than their hosts are.","It clarifies why some genes are more likely to be transferred horizontally than others are.","It contrasts how horizontal gene transfer occurs among vertebrates with how it occurs among invertebrates.","It describes a means by which horizontal gene transfer might occur among vertebrates."],"a":3,"r":"Choice D is the best answer. The text defines horizontal gene transfer and then gives one possibility for how it happens in vertebrates (via infection by parasites). The underlined part describes how that mechanism could work. Choice A is incorrect. The underlined portion doesn’t do this. Parasites are only described as the mechanism that does the transferring, not the species that gives or receives the genes. Choice B is incorrect. The underlined portion doesn’t do this. The text never discusses which genes are more likely to be transferred. Choice C is incorrect. The underlined portion doesn’t do this. The text never discusses how horizontal gene transfer occurs among invertebrates."},{"i":"7bf79a90","c":"cross","d":"M","s":"Text 1 Microbes are tiny organisms in the soil, water, and air all around us. They thrive even in very harsh conditions. That’s why Noah Fierer and colleagues were surprised when soil samples they collected from an extremely cold, dry area in Antarctica didn’t seem to contain any life. The finding doesn’t prove that there are no microbes in that area, but the team says it does suggest that the environment severely restricts microbes’ survival.\n\nText 2 Microbes are found in virtually every environment on Earth. So it’s unlikely they would be completely absent from Fierer’s team’s study site, no matter how extreme the environment is. There were probably so few organisms in the samples that current technology couldn’t detect them. But since a spoonful of typical soil elsewhere might contain billions of microbes, the presence of so few in the Antarctic soil samples would show how challenging the conditions are.\n\nBased on the texts, Fierer’s team and the author of\n\nText 2 would most likely agree with which statement about microbes?","o":["Most microbes are better able to survive in environments with extremely dry conditions than in environments with harsh temperatures.","A much higher number of microbes would probably be found if another sample of soil were taken from the Antarctic study site.","Microbes are likely difficult to detect in the soil at the Antarctic study site because they tend to be smaller than microbes found in typical soil elsewhere.","Most microbes are probably unable to withstand the soil conditions at the Antarctic study site."],"a":3,"r":"Choice D is the best answer because it presents a statement about microbes with which Fierer’s team (Text 1) and the author of Text 2 would most likely agree. Text 1 states that microbes usually thrive in very harsh conditions, and so Fierer’s team was surprised when samples collected from an extremely cold and dry area of Antarctica didn’t appear to contain any life. Fierer’s team says that though this doesn’t conclusively prove there are no microbes in the area, it suggests that microbes would have a notably difficult time surviving in the environment. The author of Text 2 says it’s unlikely that there would be no microbes at all in the Antarctic study site from which Fierer’s team retrieved soil samples and that there may have been hard-to-detect microbes in the samples. However, the presence of only a few microbes in the Antarctic samples rather than the billions found in a typical soil sample (which would presumably be much easier to detect) would illustrate conditions in the Antarctic soil that make it difficult for microbes to thrive. Since Fierer’s team says that the seeming absence of microbes in the Antarctic samples suggests an unusually harsh environment and the author of Text 2 says that even if there are a few undetectable microbes in the samples, the relatively tiny number of microbes would also suggest an unusually harsh environment, then Fierer’s team and the author of Text 2 would most likely agree that most microbes are unable to withstand the soil conditions at the Antarctic study site. Choice A is incorrect. The samples taken by Fierer’s team were from an area of Antarctica that is described in part as extremely dry, and these samples didn’t appear to have any life. Therefore, even though these samples also came from an extremely cold area, Fierer’s team wouldn’t argue based on the evidence available that microbes were better able to survive in dry conditions than in areas with harsh temperatures. Moreover, the author of Text 2 says that microbes are found in virtually every environment on Earth but doesn’t compare dry environments and harsh environments. Choice B is incorrect. Nothing in Text 1 indicates that another collection of samples from the Antarctic study site might yield different results from the samples already taken by Fierer’s team. The author of Text 2 does state that microbes are found in virtually every environment on Earth and suggests that new technology may be better able to detect so few microbes in a soil sample, but the author of Text 2 concludes that the unusual absence of microbes in the Antarctic samples is evidence of the harsh Antarctic environment. Therefore, there is no reason to believe that the author of Text 2 thinks that another sample drawn from that same harsh environment would yield a much higher number of microbes. Choice C is incorrect. The author of Text 2 does speculate that there may have been so few microbes in the Antarctic samples that current technology couldn’t detect them, but the author doesn’t speculate that this is due to the size of the microbes. Moreover, nothing that Fierer’s team says suggests that they are speculating that their samples might have microbes that are smaller than microbes in typical soil samples."},{"i":"303537cf","c":"main","d":"H","s":"The following text is adapted from Lewis Carroll’s 1889 satirical novel Sylvie and Bruno. A crowd has gathered outside a room belonging to the Warden, an official who reports to the Lord Chancellor. One man, who was more excited than the rest, flung his hat high into the air, and shouted (as well as I could make out) “Who roar for the Sub- Warden?” Everybody roared, but whether it was for the Sub-Warden, or not, did not clearly appear: some were shouting “Bread!” and some “Taxes!”, but no one seemed to know what it was they really wanted. All this I saw from the open window of the Warden’s breakfast-saloon, looking across the shoulder of the Lord Chancellor. “What can it all mean?” he kept repeating to himself. “I never heard such shouting before—and at this time of the morning, too! And with such unanimity!”\n\nBased on the text, how does the Lord Chancellor respond to the crowd?","o":["He asks about the meaning of the crowd’s shouting, even though he claims to know what the crowd wants.","He indicates a desire to speak to the crowd, even though the crowd has asked to speak to the Sub-Warden.","He expresses sympathy for the crowd’s demands, even though the crowd’s shouting annoys him.","He describes the crowd as being united, even though the crowd clearly appears otherwise."],"a":3,"r":"Choice D is the best answer because it presents a statement about how the Lord Chancellor responds to the crowd that is supported by the text. The text indicates that the people in the crowd are roaring and shouting “Bread!” or “Taxes!” and presents them as not knowing what they really want. The Lord Chancellor’s response is to ask what their shouting means but also to observe that they’re shouting with “unanimity,” or total agreement. Clearly, this isn’t the case, which supports the statement that the Lord Chancellor describes the crowd as being united even though it’s not. Choice A is incorrect because it isn’t supported by the text. Although the text indicates that the Lord Chancellor asks about the meaning of the crowd’s shouting, it doesn’t suggest that he knows what the crowd really wants. Choice B is incorrect because the text doesn’t suggest that the Lord Chancellor wants to speak to the crowd. Furthermore, the text doesn’t indicate that the crowd wants to hear from the Sub-Warden. Although the crowd roars when asked “Who roar for the Sub-Warden?” it’s unclear what the roaring means. Choice C is incorrect because the text doesn’t suggest that the Lord Chancellor knows of or sympathizes with the crowd’s demands. In addition, the text doesn’t indicate that the crowd’s shouting annoys the Lord Chancellor, just that it causes him to keep repeating “What can it all mean?”"},{"i":"8fb67890","c":"main","d":"M","s":"Archaeologists have discovered a runestone in Norway that may contain the earliest example of written words in Scandinavia. Carbon dating at the discovery site revealed that the stone was likely carved between 1 and 250 CE. Runologist Kristel Zilmer believes the stone will be helpful in learning more about the use of runic alphabets in early Iron Age Scandinavia.\n\nWhich choice best states the main topic of the text?","o":["Battles of the Iron Age","A runestone found in Norway","A new method for dating rock samples","The research interests of Kristel Zilmer"],"a":1,"r":"Choice B is the best answer because it most accurately states the main topic of the text. The text begins by stating that archaeologists in Norway have discovered what may be the oldest known runestone (a stone with an inscription in the runic alphabets used in the region in ancient times). According to the text, the object was created between 1 and 250 CE. The text then mentions a researcher who comments on the runestone’s significance to the study of runic alphabets. Thus, the main focus throughout the text is a runestone found in Norway. Choice A is incorrect because the text mentions the Iron Age only to indicate the era when the runestone was created and when runic alphabets were in use; there’s no discussion of battles during this era. Choice C is incorrect because the text mentions the carbon dating method just once and does so only to indicate the age of the runestone; moreover, the text doesn’t suggest that this method is new. Choice D is incorrect. Although the text indicates that Zilmer is a runologist, or a scholar of runestones, it does so in a single sentence, so Zilmer’s scholarly interests are therefore not a primary focus of the text."},{"i":"086dd8cc","c":"infer","d":"H","s":"The morphological novelty of echinoderms—marine invertebrates with radial symmetry, usually starlike, around a central point—impedes comparisons with most other animals, in which bilateral symmetry on an anterior-posterior (head to tail) axis through a trunk is typical. Particularly puzzling are sea stars, thought to have evolved a headless layout from a known bilateral origin. Applying genomic knowledge of Saccoglossus kowalevskii acorn worms (close relatives of sea stars, and thus expected to have similar markers for corresponding anatomical regions) to the body patterning genes of Patiria miniata sea stars, Laurent Formery et al. observed activity only in anterior genes across P . miniata’s entire body and some posterior genes limited to the edges, suggesting that ______ Which choice most logically completes the text?","o":["despite the greater prevalence of anterior genes in sea stars’ genetic makeup, posterior genes active at the body’s perimeter are primarily responsible for the starlike layout that distinguishes sea stars’ radial symmetry from that of other echinoderms.","contrary to the belief that they evolved from early ancestors with the bilateral form typical of many other animals, sea stars instead originated with an atypical body layout that was neither bilaterally nor radially symmetrical.","although the two species are closely related, there is only minimal correspondence in the genetic markers for head, tail, and trunk region development in P . miniata sea stars and S. kowalevskii acorn worms.","rather than undergoing changes resulting in the eventual elimination of a head region in their radial body plan, as previously assumed, sea stars’ morphology evolved to completely lack a trunk and consist primarily of a head region."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the morphology (form and structure) of sea stars, a type of echinoderm. The text indicates that echinoderms have radially symmetrical body plans (symmetrical around a central point, usually in the form of a star), whereas most animals have bilaterally symmetrical body plans (symmetrical along an axis running from head to tail through a trunk). According to the text, sea stars are unusual echinoderms because, despite their radial body plan, they descended from known bilateral ancestors. This shift in body plan was thought to be a process of losing the genetic markers associated with the head region. The text explains that by comparing the genes of one sea star species (P . miniata) to those of a close relative, the acorn worm, researchers determined that instead, anterior (head) genes are active across the sea star’s entire body, posterior (tail) genes are active in limited, peripheral locations of the body, and no trunk-related genes are active. This finding strongly suggests that, rather than becoming \"headless\" as they evolved from a bilateral ancestor, sea stars developed a body plan consisting almost entirely of a head region with a minimal tail region and no trunk region present. Choice A is incorrect because the text doesn’t identify how any particular region of sea stars’ bodies influences the layout of sea stars’ radial symmetry. Moreover, the text indicates that the radial symmetry of echinoderms is \"usually starlike,\" not that a starlike layout distinguishes sea stars from other echinoderms. Choice B is incorrect because the text doesn’t suggest that the idea that sea stars evolved from an ancestor with bilateral symmetry is incorrect (describing the bilateral origin as \"known\") and doesn’t address any body plans other than those with radial or bilateral symmetry. The text strongly suggests that rather than revealing something about sea stars’ origin, Formery et al.’s findings contradict the assumption that the current body plan of sea stars is \"headless.\" Choice C is incorrect because the text suggests that Formery et al. were able to make determinations about P . miniata sea stars’ body plan based on the comparability of genetic markers between P . miniata and S. kowalevskii acorn worms. The text indicates only that little or no activity was observed in certain types of genes associated with body development in P . miniata, not that those genes turned out to largely differ from body-development genes in S. kowalevskii."},{"i":"28dfc05a","c":"infer","d":"M","s":"Even with the widespread adoption of personal computers, many authors still choose to write and revise their novels by hand and only then transcribe the final version on a computer. It may be tempting to speculate about how a novel written this way would be affected if it had been exclusively typed instead, but each novel is a unique entity resulting from a specific set of circumstances. Therefore, ______ Which choice most logically completes the text?","o":["in order to increase their efficiency, authors who currently write their novels largely by hand should instead work only on a computer.","authors who do most of their drafting and revising by hand likely have more success than those who work entirely on a computer.","novels written by hand take less time to produce, on average, than novels written on a computer do.","there is no way to reasonably evaluate how a work would be different if it had been written by other means."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the means authors use to write and revise their novels. After stating that many authors still choose to draft novels by hand even though computers are now widely used, the text acknowledges the speculation that the opposite choice—using only a computer—would have had an effect on such novels. However, the text then points out that every novel is the singular result of a combination of the particular conditions surrounding its creation. This suggests that it isn’t possible to determine the effect of any single condition (such as the means of writing) on its own; thus, there would be no way to reasonably evaluate how a novel would have turned out differently if it had been written by other means. Choice A is incorrect because the text doesn’t suggest that it’s more efficient to write a novel on a computer than to write it by hand; it doesn’t address efficiency at all. Therefore, it isn’t logical to conclude that authors who currently choose to write novels largely by hand should instead work only on a computer to increase their efficiency. Choice B is incorrect because the text doesn’t suggest anything about how successful authors are, regardless of the means by which they choose to write; therefore, it isn’t logical to conclude that authors who write largely by hand are likely to be more successful than those who work only on a computer. Choice C is incorrect because the text makes no mention of the time it takes to produce a novel, regardless of the means by which it’s written; therefore, it isn’t logical to conclude that novels written by hand take less time on average to produce than those written on a computer do."},{"i":"1f3be847","c":"claim","d":"M","s":"“Loon Point” is a 1912 poem by Amy Lowell. In the poem, which presents a nighttime scene on a body of water, Lowell describes an element of nature as an active participant in the experience, writing, ______ Which quotation from “Loon Point” most effectively illustrates the claim?","o":["“Through the water the moon writes her legends / In light, on the smooth, wet sand.”","“Softly the water ripples / Against the canoe’s curving side.”","“Or like the snow-white petals / Which drop from an overblown rose.”","“But the moon in her wayward beauty / Is ever and always the same.”"],"a":0,"r":"Choice A is the best answer because it most effectively illustrates the claim that Lowell describes an element of nature as an active participant in the experience of a nighttime scene on a body of water. The quotation presents the image of the moon shining on a body of water. However, instead of describing the moon in passive terms or simply stating that it reflects through the water and onto the sandy shore, the quotation portrays the moon as being engaged in the humanlike action of writing a legend. In other words, the moon is participating actively in the nighttime scene. Choice B is incorrect. Although the quotation describes a nighttime scene on a body of water, the element of nature in these lines—the waves— isn’t portrayed as an active participant in an experience; instead, the waves merely ripple softly against a canoe, as waves would normally do. Choice C is incorrect because the quotation doesn’t present a nighttime scene on a body of water; instead, it describes petals falling from a rose. Choice D is incorrect. Although the quotation presents an image of an element of nature—the moon—it doesn’t mention a body of water; moreover, it portrays the moon not as an active participant in a scene but instead as static or unchanging (“ever and always the same”)."},{"i":"6536183b","c":"claim","d":"H","s":"In the mountains of Brazil, Barbacenia tomentosa and Barbacenia macrantha—two plants in the Velloziaceae family—establish themselves on soilless, nutrient-poor patches of quartzite rock. Plant ecologists Anna Abrahão and Patricia de Britto Costa used microscopic analysis to determine that the roots of B. tomentosa and B. macrantha, which grow directly into the quartzite, have clusters of fine hairs near the root tip; further analysis indicated that these hairs secrete both malic and citric acids. The researchers hypothesize that the plants depend on dissolving underlying rock with these acids, as the process not only creates channels for continued growth but also releases phosphates that provide the vital nutrient phosphorus.\n\nWhich finding, if true, would most directly support the researchers’ hypothesis?","o":["Other species in the Velloziaceae family are found in terrains with more soil but have root structures similar to those of B. tomentosa and B. macrantha.","Though B. tomentosa and B. macrantha both secrete citric and malic acids, each species produces the acids in different proportions.","The roots of B. tomentosa and B. macrantha carve new entry points into rocks even when cracks in the surface are readily available.","B. tomentosa and B. macrantha thrive even when transferred to the surfaces of rocks that do not contain phosphates."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would support the researchers’ hypothesis about the plants’ dependence on dissolving rock. The text indicates that the roots of the two plant species grow directly into quartzite rock, where hairs on the roots secrete acids that dissolve the rock. The researchers hypothesize that the plants depend on this process because dissolving rock opens spaces for the roots to grow and releases phosphates that provide the plants with phosphorus, a vital nutrient. If the plants carry out this process of dissolving rock even when the rock already has spaces into which the roots could grow, that would support the researchers’ hypothesis because it suggests that the plants are getting some advantage—such as access to phosphorus—from the action of dissolving rock. If the plants don’t benefit from dissolving rock, they would be expected to grow in the cracks that already exist, as doing so would mean that the plants don’t have to spend energy creating and secreting acids; if, however, the plants create new entry points by dissolving rock even when cracks already exist, that would support the hypothesis that they depend on dissolving rock for some benefit. Choice A is incorrect because the existence of soil-inhabiting members of the Velloziaceae family with similar root structures to those of the two species discussed in the text wouldn’t support the researchers’ hypothesis that the species discussed in the text depend on dissolving rock. If other such members exist, that might suggest that the root structures can serve more functions than secreting acids to dissolve rock (since dissolving rock may not be necessary for plants living in soil), but that wouldn’t suggest anything about whether the species discussed in the text benefit from dissolving rock. Choice B is incorrect because differences in the proportions of citric and malic acid secreted by the two species would be irrelevant to the hypothesis that the plants depend on dissolving rock. There’s no information in the text to suggest that the proportion of each acid has any bearing on the process of dissolving rock or on any benefits the plants might receive from that process. Choice D is incorrect because if the two species thrive on rocks without phosphates, that would weaken the researchers’ hypothesis that the plants depend on dissolving rock partly because dissolving rock gives them access to phosphates. If the plants can survive on rocks without getting a vital nutrient by dissolving those rocks, then either the nutrient isn’t actually vital for those plants or they can get the nutrient in some way other than by dissolving rocks."},{"i":"ff18829b","c":"graph","d":"M","s":"","o":["providing medicinal plants than to improving the local microclimate.","improving community members’ sense of attachment to the neighborhood than to offering educational opportunities.","improving the local microclimate than to providing medicinal plants.","improving the local microclimate than to providing tourist attractions."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the graph to complete the assertion about urban agriculture. The graph shows the average survey ratings, on a scale of 0 to 5, from three groups of people—project leaders, stakeholders, and the general public— concerning the contributions of urban agriculture. According to the graph, project leaders gave an average rating of approximately 2 to urban agriculture’s contributions to the provision of medicinal plants, which is lower than the average rating of approximately 3 that project leaders gave to urban agriculture’s contributions to both improving the local microclimate and improving a sense of attachment to the neighborhood. This shows that project leaders rated urban agriculture as contributing less to providing medicinal plants than to improving the local microclimate. Choice B is incorrect because the graph doesn’t provide data about urban agriculture’s contribution to educational opportunities; therefore, this comparison can’t be made. Choice C is incorrect because it contradicts the data shown in the graph. On average, project leaders gave a rating of approximately 3 to urban agriculture’s contributions to improving the local microclimate, which is higher, not lower, than the average rating of approximately 2 that they gave to its contributions to providing medicinal plants. Choice D is incorrect because the graph doesn’t provide data about urban agriculture’s contribution to providing tourist attractions; therefore, this comparison can’t be made."},{"i":"b71861fc","c":"graph","d":"E","s":"","o":["10%","95%","25%","50%"],"a":3,"r":"Choice D is the best answer because it states the percentage of participants who mentioned costs in the interviews conducted by Judith Hilton and her team. The text states that Hilton and her team interviewed participants about factors that would encourage them to switch from single- use plastic containers to reusable containers. The graph presents three factors mentioned in the interviews (convenience, costs, and established behaviors) and the percentage of participants who mentioned each one. The graph shows that about 50% of participants mentioned costs as a factor. Choice A is incorrect because the graph shows that about 50% of participants, not 10%, mentioned costs as a factor. Choice B is incorrect because the graph shows that about 50% of participants, not 95%, mentioned costs as a factor. Choice C is incorrect because the graph shows that about 50% of participants, not 25%, mentioned costs as a factor."},{"i":"166efaa2","c":"fss","d":"E","s":"Public-awareness campaigns about the need to reduce single-use plastics can be successful, says researcher Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent reduction in plastic-bag use after cashiers were instructed to ask customers whether ______ wanted a bag.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["they","one","you","it"],"a":0,"r":"Choice A is the best answer. The convention being tested is pronoun–antecedent agreement. The plural pronoun “they” agrees in number with the plural antecedent “customers.” Choice B is incorrect because the singular pronoun “one” doesn’t agree in number with the plural antecedent “customers.” Choice C is incorrect because the second person pronoun “you” isn’t conventional as a substitute for “customers.” It suggests that the audience (“you”) is the customer. Choice D is incorrect because the singular pronoun “it” doesn’t agree in number with the plural antecedent “customers.”"},{"i":"6bc907c9","c":"fss","d":"E","s":"Novelist Jane Austen greatly admired the work of Fanny Burney, a popular English author. In fact, scholars believe that a passage from the last chapter of Cecilia, a 1782 novel by Burney, likely inspired the title of one of ______ Pride and Prejudice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Austen’s most famous novels,","Austens’ most famous novels’,","Austens most famous novels,","Austen’s most famous novel’s,"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of plural and possessive nouns. The singular possessive proper noun \"Austen’s\" and the plural noun \"novels\" correctly indicates that Austen wrote multiple novels that were famous. Choice B is incorrect because the context requires the singular possessive proper noun \"Austen’s\" and the plural noun \"novels,\" not the plural possessive nouns \"Austens’\" and \"novels’.\" Choice C is incorrect because the context requires the singular possessive proper noun \"Austen’s,\" not the plural proper noun \"Austens.\" Choice D is incorrect because the context requires the plural noun \"novels,\" not the singular possessive noun \"novel’s.\""},{"i":"4c9a2aee","c":"fss","d":"M","s":"Wanda Diaz-Merced is an astrophysicist who lost her sight when she was young. Diaz-Merced’s condition inspired her to develop software that can translate scientific data into sound. Sound-based tools ______ scientists to detect subtle patterns in data. Such patterns may not be evident in traditional graphs.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has enabled","enable","is enabling","enables"],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-verb agreement. The plural verb \"enable\" agrees in number with the plural subject \"sound-based tools.\" Choice A is incorrect because the singular verb \"has enabled\" doesn’t agree in number with the plural subject \"sound-based tools.\" Choice C is incorrect because the singular verb \"is enabling\" doesn’t agree in number with the plural subject \"sound-based tools.\" Choice D is incorrect because the singular verb \"enables\" doesn’t agree in number with the plural subject \"sound-based tools.\""},{"i":"6b49f5f1","c":"bound","d":"M","s":"In 1727, dramatist Lewis Theobald presented a new play, Double Falsehood, at a London theater. Theobald claimed that his drama was based on a little-known play by William Shakespeare, Cardenio. Many, including poet Alexander Pope, were ______ historians have determined that Shakespeare’s company did perform a play called Cardenio in 1613.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["skeptical but","skeptical, but","skeptical,","skeptical"],"a":1,"r":"Choice B is the best answer. There are two independent clauses in the sentence, each with a subject and a verb: \"many...were skeptical\" and \"historians have determined….\" These clauses can be grammatically joined by a comma and the coordinating conjunction \"but.\" Choice A is incorrect. This choice results in a run-on sentence, which occurs when two independent clauses are joined without punctuation. Two independent clauses can’t be joined by just the coordinating conjunction \"but.\" A comma would also be required. Choice C is incorrect. This choice creates a punctuation error called a comma splice. This sentence contains two independent clauses (\"Many…were skeptical\" and \"historians have determined… \"). A comma alone can’t join two independent clauses. That requires a comma and a coordinating conjunction. Choice D is incorrect. This choice results in a run-on sentence, which occurs when two independent clauses are joined without punctuation. This sentence contains two independent clauses (\"Many…were skeptical\" and \"historians have determined… \"), which need to be either joined by a semicolon, joined by a comma and a coordinating conjunction, or separated by a period."},{"i":"8790d061","c":"bound","d":"M","s":"While constructing the Limyra Bridge, ancient Roman builders relied on temporary wooden beams to support the stone and brick structure. These temporary supports, a construction system known as ______ were removed when the bridge was completed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["falsework;","falsework","falsework,","falsework:"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after \"falsework\" pairs with the comma after \"supports\" to separate the supplementary element \"a construction system known as falsework\" from the rest of the sentence. This supplementary element functions to clarify the term \"these temporary supports,\" and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because a semicolon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence. Choice B is incorrect because it fails to use appropriate punctuation to separate the supplemental element from the rest of the sentence. Choice D is incorrect because a colon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence."},{"i":"aec8d3e8","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Chemical leavening agents cause carbon dioxide to be released within a liquid batter, making the batter rise as it bakes. Baking soda and baking powder are chemical leavening agents. Baking soda is pure sodium bicarbonate. To produce carbon dioxide, baking soda needs to be mixed with liquid and an acidic ingredient such as honey. Baking powder is a mixture of sodium bicarbonate and an acid. To produce carbon dioxide, baking powder needs to be mixed with liquid but not with an acidic ingredient. The student wants to emphasize a difference between baking soda and baking powder.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["To make batters rise, bakers use chemical leavening agents such as baking soda and baking powder.","Baking soda and baking powder are chemical leavening agents that, when mixed with other ingredients, cause carbon dioxide to be released within a batter.","Baking soda is pure sodium bicarbonate, and honey is a type of acidic ingredient.","To produce carbon dioxide within a liquid batter, baking soda needs to be mixed with an acidic ingredient, whereas baking powder does not."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes a difference between baking soda and baking powder, noting that baking soda needs to be mixed with an acidic ingredient to produce carbon dioxide but baking powder doesn’t. Choice A is incorrect. The sentence focuses on what bakers use to make batters rise; it doesn’t emphasize a difference between baking soda and baking powder. Choice B is incorrect. The sentence provides a general description of baking soda and baking powder; it doesn’t emphasize a difference between them. Choice C is incorrect. The sentence explains what baking soda and honey are; it doesn’t emphasize a difference between baking soda and baking powder."},{"i":"4c26f18a","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: By interlocking their bodies, ants can form bridges to help fellow ants cross gaps. In 2020, Yasemin Ozkan-Aydin was inspired by ant behavior to design collaborative quadruped robots. Over the course of a year, she designed, built, tested, and refined her robots. Each robot is programmed to send a signal to another robot upon encountering a gap in a path. The signaled robot connects to the back of the signaler robot via magnetic sensors and pushes it across the gap. The student wants to begin a narrative about the creation of the robots.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["When one of Yasemin Ozkan-Aydin’s robots encounters a gap in its path, it sends a signal to another robot; the signaled robot connects to the back of the signaler and pushes it across the gap.","After a year, Yasemin Ozkan-Aydin had designed, built, tested, and refined her robots.","Inspired by ants, which form bridges with their interlocked bodies to help fellow ants cross gaps, Yasemin Ozkan-Aydin set out to design quadruped robots capable of similarly collaborative behavior.","Ants, which have inspired the design of robots, form bridges by interlocking their bodies."],"a":2,"r":"Choice C is the best answer. The sentence effectively begins a narrative about the creation of the robots, explaining that ants’ gap-crossing technique inspired Yasemin Ozkan-Aydin to \"set out to design\" robots that could collaborate in a similar manner. Choice A is incorrect. The sentence describes how the robots work together to cross gaps; it doesn’t effectively begin a narrative about the creation of the robots. Choice B is incorrect. The sentence provides an overview of the steps Ozkan-Aydin took in creating the robots; it doesn’t effectively begin a narrative about their creation. Choice D is incorrect. The sentence explains how ants form bridges; it doesn’t effectively begin a narrative about the creation of the robots."},{"i":"7f20374f","c":"trans","d":"E","s":"The 435 state districts in the US House of Representatives are designed to be roughly equal in population. These districts average around 760,000 people in size. However, only about 730,000 people live in the state of Alaska. ______ Alaska has just one House district, encompassing the entire state.\n\nWhich choice completes the text with the most logical transition?","o":["As a result,","Instead,","Finally,","For instance,"],"a":0,"r":"Choice A is the best answer. \"As a result\" logically signals that the information in the sentence—that, in the US House of Representatives, the entire state of Alaska has just one district—is the result or consequence of Alaska having only about 730,000 people. This is slightly below the average for House districts, which are designed to have roughly equal populations. Choice B is incorrect because \"instead\" illogically signals that Alaska having just one state district is an alternative to the information about the state’s population in the previous sentence. Rather, the fact that Alaska has just one district is a result or consequence of the entire state having slightly fewer people than an average-sized district. Choice C is incorrect because \"finally\" illogically signals that the information in this sentence about Alaska having just one district indicates a last step in a process or a concluding summary. Instead, the fact that Alaska has just one district is a result or consequence of the entire state having slightly fewer people than an average-sized district. Choice D is incorrect because \"for instance\" illogically signals that the information in this sentence about Alaska having just one district exemplifies the information about the state’s population in the previous sentence. Instead, the fact that Alaska has just one district is a result or consequence of the entire state having slightly fewer people than an average-sized district."},{"i":"827afb27","c":"trans","d":"E","s":"Most conifers (trees belonging to the phylum Coniferophyta) are evergreen. That is, they keep their green leaves or needles year-round. However, not all conifer species are evergreen. Larch trees, ______ lose their needles every fall.\n\nWhich choice completes the text with the most logical transition?","o":["for instance,","nevertheless,","meanwhile,","in addition,"],"a":0,"r":"Choice A is the best answer. “For instance” logically signals that the information in this sentence—that larch trees lose their needles every fall—is an example supporting the claim in the previous sentence (that not all conifer species keep their leaves or needles year-round). Choice B is incorrect because “nevertheless” illogically signals that the information in this sentence is true in spite of the claim about conifer species in the previous sentence. Instead, it’s an example supporting that claim. Choice C is incorrect because “meanwhile” illogically signals that the information in this sentence is separate from (while occurring simultaneously with) the claim about conifer species in the previous sentence. Instead, it’s an example supporting that claim. Choice D is incorrect because “in addition” illogically signals that the information in this sentence is merely an additional fact related to the claim about conifer species in the previous sentence. Instead, it’s an example supporting that claim."},{"i":"f5149550","c":"trans","d":"H","s":"A staunch supporter of women’s voting rights, Wilhelmina Kekelaokalaninui Widemann Dowsett sought to coordinate the efforts of suffragists in her native Hawai‘i. ______ in 1912, she founded the National Women’s Equal Suffrage Association of Hawai‘i, an organization that lobbied for women’s voting rights in the US territory.\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","Conversely,","To that end,","Alternatively,"],"a":2,"r":"Choice C is the best answer. “To that end” logically signals that the information in this sentence—that Dowsett founded the National Women’s Equal Suffrage Association of Hawai‘i—describes an action Dowsett took to achieve the goal stated in the previous sentence: to coordinate the efforts of suffragists in Hawai‘i. Choice A is incorrect because “in other words” illogically signals that the information in this sentence about Dowsett founding a women’s suffrage association is a paraphrase or restatement of the previous information about Dowsett seeking to coordinate suffragists’ efforts. Instead, the sentence describes a specific action Dowsett took to achieve this goal. Choice B is incorrect because “conversely” illogically signals that the information in this sentence about Dowsett founding a women’s suffrage association contrasts with the previous information about Dowsett seeking to coordinate suffragists’ efforts. Instead, the sentence describes a specific action Dowsett took to achieve this goal. Choice D is incorrect because “alternatively” illogically signals that the information in this sentence about Dowsett founding a women’s suffrage association presents an alternative to her seeking to coordinate suffragists’ efforts. Instead, the sentence describes a specific action Dowsett took to achieve this goal."}],"img":{"ff18829b":"iVBORw0KGgoAAAANSUhEUgAAArwAAAKTBAMAAAAJbsaTAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABgl0lEQVR42u1dd3wUxRf/zl5Jz80m9JYNAZF+SQAFBI4qRfDoxcIBKoioB4o00YDSQUIvgobe5egllKNLvwDSpFzoUnJzoafc/P64uxRawo8EAtnv5wPZ252dnf3u2zfvvXk7A8iQIUOGDBkyZMiQIUOGDBkyZMiQIeM1BAUIfWYJIpP0f0NwUvwYwaS4eyv40YNkuFbmLZN4T3IKKIWLRUIIAHhtXEQBQKLzXLtTWC64XqY3s/gp4olKgPp+1yQKAMwIflSyfSWZtszqhl0mDz1+FZYOUrQ6poweh6+WrFRE9yTw1SqPqDfO9r4R+b2y/WmqWBpt7LFXAkavob+dlHnLJDyi1nhECTv8Ok9TPghTh25UbathKKZfDPjqPUzK0GnKWGm39z8FzeWa/67aVolS75U1DDVqv/p2K18PelVRjRLCVGeN85LEk4cQa1FuPRj+yZSikh  return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
function sum(){const d=Object.keys(ans).length,ok=Q.filter(q=>ans[q.i]===q.a).length;$("#sum").textContent=done?`Score: ${ok} of ${Q.length} correct (${Math.round(100*ok/Q.length)}%)`:`${d} of ${Q.length} answered`}
function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="re"){if(!done&&Object.keys(ans).length&&!confirm("Clear all your answers and start over?"))return;ans={};done=false;miss=false;draw();scrollTo(0,0)}
 else if(t.id==="sub")submit();
 else if(t.id==="mi"){miss=!miss;draw()}
 else if(t.dataset.k!==undefined&&!done){const a=t.closest("article"),q=Q[a.dataset.n-1];ans[q.i]=+t.dataset.k;a.outerHTML=card(q,+a.dataset.n);sum()}});
draw();
</script></body></html>
