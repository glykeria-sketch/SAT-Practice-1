<script>
const D={"t":"Practicetest44","q":[{"i":"e459076b","c":"vocab","d":"H","s":"The following text is adapted from George Eliot’s 1871–72 novel Middlemarch. [Mr. Brooke] had travelled in his younger years, and was held in this part of the country to have contracted a too rambling habit of mind. Mr. Brooke’s conclusions were as difficult to predict as the weather.\n\nAs used in the text, what does the word “contracted” most nearly mean?","o":["Restricted","Described","Developed","Settled"],"a":2,"r":"Choice C is the best answer because as used in the text, “contracted” most nearly means developed. The text explains that Mr. Brooke has a “too rambling habit of mind,” which the text likens to a disease, saying he is thought to have contracted it. To contract a disease means to acquire or develop a disease. In other words, the text indicates that Mr. Brooke is believed to have acquired, or developed, the habit of mind described in the text. Choice A is incorrect. Although “contracted” can mean limited or restricted in some contexts, here Mr. Brooke is said to draw unpredictable conclusions, suggesting that he exhibits this “too rambling habit of mind,” not that it has been somehow limited or restricted. Choice B is incorrect. Although the text describes Mr. Brooke’s habit of mind, nothing suggests that those are his descriptions or, indeed, that he described his habit of mind at all. Choice D is incorrect because settled means calmed or mitigated, but here Mr. Brooke is said to draw unpredictable conclusions, suggesting that he exhibits this “too rambling habit of mind,” not that it has been somehow calmed or mitigated."},{"i":"5a97d9cd","c":"vocab","d":"H","s":"In a study of residential mobility in Washington, DC, LaTanya Brown-Robertson et al. found that increases in household spending power (via tax credits) had mixed effects on mobility decisions, possibly because residential location choices are not fully reducible to economic factors but are also ______ noneconomic factors such as access to strong local social networks.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["transposed with","mediated by","decoupled from","antecedent to"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of residential mobility decisions. In this context, \"mediated by\" means influenced or affected by something. The text establishes that increasing household spending power (an economic factor) produced \"mixed effects\" on mobility decisions. The text then explains that residential choices are \"not fully reducible to economic factors,\" which means that these decisions don’t simply rely on how much money is available to spend on a residential move but on other factors as well. According to the text, noneconomic considerations, such as access to social networks, also play a significant role. Thus, \"mediated by\" accurately captures this relationship where noneconomic factors influence what might otherwise be purely economic decisions. Choice A is incorrect because \"transposed with\" would suggest that economic and noneconomic factors are being switched or interchanged when making residential mobility decisions, which wouldn’t make logical sense in this context. The text indicates that these factors coexist and jointly influence such decisions. Choice C is incorrect. The phrase \"decoupled from\" means separated or disconnected from, which would suggest that economic factors are completely separate from noneconomic factors. This would contradict the text’s main point that residential mobility decisions involve multiple factors being considered simultaneously rather than in isolation. Choice D is incorrect because \"antecedent to,\" which means something prior or earlier, would indicate that noneconomic factors come before economic ones in time or sequence. The text doesn’t establish this chronological relationship. Instead, the text indicates that economic factors (household spending power) and noneconomic factors (access to social networks) simultaneously influence residential mobility decisions."},{"i":"6a1194e8","c":"vocab","d":"M","s":"Rydra Wong, the protagonist of Samuel R. Delany’s 1966 novel Babel-17, is a poet, an occupation which, in Delany’s work, is not ______: nearly a dozen of the characters that populate his novels are poets or writers.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["infallible","atypical","lucrative","tedious"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Samuel R. Delany’s character Rydra Wong. As used in this context, “atypical” would mean unrepresentative or not common. The text indicates that Wong is one of “nearly a dozen” characters in Delany’s novels who are poets or writers. This context conveys that being a poet isn’t an atypical occupation for a character in one of Delany’s works. Choice A is incorrect because “infallible” means to be accurate or without fault, which wouldn’t make sense in context. The text focuses on the fact that Delany has written many characters who are poets and writers. This context suggests that the occupation isn’t atypical for Delany, not that the occupation isn’t infallible, or problematic. Choice C is incorrect because “lucrative” means to be profitable, which wouldn’t make sense in context. If writing poet characters weren’t profitable, it wouldn’t be logical to explain this by citing that Delany gave many of his characters the same occupation. Choice D is incorrect because “tedious” means to be boring, which wouldn’t make sense in context. The text focuses on the fact that Delany has written many characters who are poets and writers. This context suggests that the occupation isn’t atypical for Delany, not that the occupation isn’t tedious."},{"i":"e386a11d","c":"vocab","d":"E","s":"Cat and Plum Blossoms is an important work of Nihonga, or classical Japanese painting. Unlike Kuroda Seiki, who adopted traditional European methods such as painting with oil on canvas, Hishida Shunsō ______ traditional Japanese approaches. For instance, Hishida produced Cat and Plum Blossoms by applying color pigments to a silk scroll.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["distrusted","embraced","released","overlooked"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Hishida Shunsō’s painting Cat and Plum Blossoms. In this context, \"embraced\" means accepted or adopted readily. The text begins by identifying Cat and Plum Blossoms as an example of Nihonga, or classical (that is, traditional) Japanese painting. The text continues by drawing a contrast between Hishida’s work and Kuroda Seiki’s work, which differs from that of Hishida in its use of the traditional European method of using oil paints on canvas rather than using traditional Japanese approaches. The text then concludes with an example of one such traditional Japanese painting technique exemplified by Hishida’s Cat and Plum Blossoms—applications of color pigments to a silk scroll—to further develop the contrast between the two artists’ approaches. This context supports the idea that Hishida adopted, or embraced, traditional Japanese approaches. Choice A is incorrect because in this context \"distrusted\" would mean that Hishida was skeptical of or lacked confidence in traditional Japanese approaches to painting. The text begins by stating that Hishida’s painting Cat and Plum Blossoms is an example of Nihonga, or traditional Japanese painting, and then cites Hishida’s application of color pigments to a silk scroll as an instance of a traditional Japanese painting technique. It therefore wouldn’t make sense to say that Hishida’s use of traditional Japanese painting techniques indicates his distrust, or skepticism, of them. Rather, it suggests that he embraced those techniques. Choice C is incorrect because saying that Hishida \"released\" traditional Japanese approaches to painting in this context would mean that he freed them from any restrictions. In using Hishida’s application of color pigments to a silk scroll in Cat and Plum Blossoms as an example of a traditional Japanese approach to painting found in Nihonga, the text strongly implies that Hishida followed these approaches, not that he removed them from any restrictions. Choice D is incorrect because in this context \"overlooked\" would mean ignored or failed to notice. The text establishes that Hishida’s painting Cat and Plum Blossoms is a notable work of Nihonga, or classical Japanese painting, that features the traditional technique of applying color pigments to a silk scroll. It wouldn’t make sense to say that Hishida’s use of a traditional Japanese approach to painting indicates that Hishida failed to notice those approaches."},{"i":"b0f7541b","c":"purpose","d":"H","s":"The following text is adapted from Herman Melville’s 1857 novel The Confidence-Man. Humphry Davy was a prominent British chemist and inventor. Years ago, a grave American savant, being in London, observed at an evening party there, a certain coxcombical fellow, as he thought, an absurd ribbon in his lapel, and full of smart [banter], whisking about to the admiration of as many as were disposed to admire. Great was the savant’s disdain; but, chancing ere long to find himself in a corner with the jackanapes, got into conversation with him, when he was somewhat ill-prepared for the good sense of the jackanapes, but was altogether thrown aback, upon subsequently being [informed that he was] no less a personage than Sir Humphry Davy.\n\nWhich choice best states the main purpose of the text?","o":["It portrays the thoughts of a character who is embarrassed about his own behavior.","It presents an account of a misunderstanding.","It offers a short history of how a person came to be famous.","It explains why one character dislikes another."],"a":1,"r":"Choice B is the best answer. The text tells a story of a first impression that turned out to be wrong: a serious American savant was dismissive of a goofy-looking, wisecracking guest at a British party, and then was shocked to learn that the guest was actually a prominent British chemist and inventor. Choice A is incorrect. This is too strong and too narrow. Only at the very end is the savant \"thrown aback\" by the fact that the man was Sir Humphry Davy—he’s not \"embarrassed about his own behavior.\" Choice C is incorrect. This isn’t the main purpose. The text never provides the history of how Sir Humphry Davy came to be famous. Nor does it provide any history for the American savant. Choice D is incorrect. This is too narrow. It doesn’t include the second half of the text, where the savant gets into a conversation with the man and then finds out that the man is Sir Humphry Davy."},{"i":"ae2b3112","c":"purpose","d":"M","s":"By combining Indigenous and classical music, Cree composer and cellist Cris Derksen creates works that reflect the diverse cultural landscape of Canada. For her album Orchestral Powwow, Derksen composed new songs in the style of traditional powwow music that were accompanied by classical arrangements played by an orchestra. But where an orchestra would normally follow the directions of a conductor, the musicians on Orchestral Powwow are led by the beat of a powwow drum.\n\nWhich choice best states the main purpose of the text?","o":["To examine how Derksen’s musical compositions blend cultures","To argue that Derksen should be recognized for creating a new style of music","To describe the difficulties Derksen encountered when producing her album","To establish a contrast between Derksen’s classical training and her Cree heritage"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to discuss how Derksen’s compositions incorporate elements from both Indigenous and classical music. After introducing Derksen, the text describes how the songs Derksen composed for her album Orchestral Powwow feature aspects of the two musical traditions. Specifically, the text notes that Derksen wrote songs in the style of traditional powwow music but accompanied them with classical arrangements played by an orchestra that followed the beat of a powwow drum rather than the directions of a conductor. In this way, Derksen’s compositions blend different cultures. Choice B is incorrect because although the text suggests that Derksen’s songs contain innovative elements since they blend styles from two different musical traditions, it doesn’t discuss whether her compositions constitute a new style of music, let alone whether Derksen should be recognized for creating a new style of music. Choice C is incorrect because the text doesn’t mention any difficulties Derksen encountered when producing her album. Rather, the text describes how the songs on the album exemplify how Derksen combines music from two different cultures. Choice D is incorrect because although the text mentions Derksen’s Cree heritage and suggests that she relies on knowledge of both Indigenous and classical music when she composes her songs, it doesn’t discuss her musical training. Additionally, the text is primarily focused on how Derksen combines different cultural traditions, not on contrasting Derksen’s training with her heritage."},{"i":"5336f2e4","c":"func","d":"H","s":"The following text is adapted from Zora Neale Hurston’s 1921 short story “John Redding Goes to Sea.” John is a child who lives in a town in the woods. Perhaps ten-year-old John was puzzling to the folk there in the Florida woods for he was an imaginative child and fond of day-dreams. The St. John River flowed a scarce three hundred feet from his back door. On its banks at this point grow numerous palms, luxuriant magnolias and bay trees. On the bosom of the stream float millions of delicately colored hyacinths. <u>[John Redding] loved to wander down to the water’s edge, and, casting in dry twigs, watch them sail away down stream to Jacksonville, the sea, the wide world and [he] wanted to follow them.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It provides an extended description of a location that John likes to visit.","It reveals that some residents of John’s town are confused by his behavior.","It illustrates the uniqueness of John’s imagination compared to the imaginations of other children.","It suggests that John longs to experience a larger life outside the Florida woods."],"a":3,"r":"Choice D is the best answer because it accurately describes how the underlined sentence functions in the text as a whole. The text establishes that John has a strong imagination and then goes on to describe the St. John River near John’s home in the Florida woods. The underlined sentence depicts John sending twigs sailing down the river while he imagines them reaching “Jacksonville, the sea, the wide world,” where he wishes he could follow. This suggests that John longs to expand his life experiences beyond the Florida woods. Choice A is incorrect because the second and third sentences of the text provide an extended description of the riverbank where John likes to go, whereas the underlined sentence describes what John does at that location. Choice B is incorrect because the first sentence of the text suggests that John’s behavior “was puzzling” to others around him, whereas the underlined sentence concerns the content of John’s imaginings. Choice C is incorrect because the underlined sentence elaborates on John’s imagination but doesn’t mention any other children to whom John could be compared."},{"i":"8bc66f89","c":"func","d":"M","s":"Part of the Atacama Desert in Peru has surprisingly rich plant life despite receiving almost no rainfall. Moisture from winter fog sustains plants once they’re growing, but the soil’s tough crust makes it hard for seeds to germinate in the first place. Local birds that dig nests in the ground seem to be of help: <u>they churn the soil, exposing buried seeds to moisture and nutrients<\/u>. Indeed, in 2016 Cristina Rengifo Faiffer found that mounds of soil dug up by birds were far more fertile and supported more seedlings than soil in undisturbed areas.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It elaborates on the idea that the top layer of Atacama Desert soil forms a tough crust.","It describes the process by which seeds are deposited into Atacama Desert soil.","It identifies the reason particular bird species dig nests in Atacama Desert soil.","It explains how certain birds promote seed germination in Atacama Desert soil."],"a":3,"r":"Choice D is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first two sentences establish a natural phenomenon: there is a richness of plant life found in the Atacama Desert despite the hard soil that makes it challenging for seeds to germinate. The next sentence, which contains the underlined portion, offers a potential explanation for the phenomenon: local birds dig ground nests exposing seeds to moisture and materials in the soil necessary for germination. The last sentence summarizes a study that compared the fertileness of mounds of dirt dug up by birds to mounds that were undisturbed to support the explanation in the underlined portion. Thus, the underlined portion mainly functions to explain how certain birds promote seed germination in the Atacama Desert soil. Choice A is incorrect because the underlined portion doesn’t address the topic of the soil’s tough crust or its formation. Instead, the text elaborates on the idea that local birds that build ground nests may help seeds germinate in the hard soil. Choice B is incorrect because the underlined portion describes how some birds may support seed germination in Atacama Desert soil but doesn’t describe how the seeds are deposited into the soil before germination begins. Choice C is incorrect because neither the underlined portion nor the text as a whole identifies a reason that a particular bird species may choose to dig ground nests in the Atacama Desert soil."},{"i":"4b4ab04e","c":"cross","d":"H","s":"Text 1 Mycoprotein is a fungal biomass that can be eaten as an alternative to meat. Studies of the environmental impact of its manufacture generally agree it is lower than that of beef and closer to that of chicken or pork. But the expense of producing mycoprotein restricts its availability to a few countries with postindustrial economies. Knowing that cost reductions would expand access to mycoprotein, biochemists are exploring solutions, such as a cheaper substrate to feed the mycoprotein as it grows.\n\nText 2 Cattle farming is a principal cause of global deforestation, and a study by Florian Humpenöder and his colleagues found that replacing 20% of beef consumption worldwide with consumption of mycoprotein would cut deforestation by half if accomplished over the next thirty years. However, this would likely involve only a small change in agricultural water consumption, since water once dedicated to raising cattle would be diverted to raising crops instead.\n\nBased on the texts, how would the author of\n\nText 1 most likely respond to the study findings mentioned in\n\nText 2?","o":["By emphasizing that since agricultural water consumption would remain static in the event of replacing beef consumption with mycoprotein consumption, an effort must be made to substitute mycoprotein for chicken and pork in diets as well","By asserting that the development of a more inexpensive substrate for mycoprotein production would contribute to the goal of decreasing worldwide deforestation over time","By noting that most people would be more likely to use mycoprotein as a substitute for chicken or pork in their diets than as a substitute for beef","By pointing out that some countries are responsible for greater deforestation than others and thus, to have any significant effect on the environment, will have to replace more than 20% of their beef consumption with mycoprotein"],"a":1,"r":"Choice B is the best answer because it reflects how the author of Text 1 would most likely respond to the study findings described in Text 2. The author of Text 2 discusses a study by Florian Humpenöder and his colleagues that found that deforestation would be reduced by half over the next thirty years if 20% of the beef consumed worldwide were replaced with mycoprotein. The author of Text 1 points out that mycoprotein is not widely available because of its high production cost, but goes on to note that this problem could be addressed by the creation of a cheaper substrate to feed mycoprotein. This suggests that the author of Text 1 would assert that the development of a less expensive mycoprotein substrate would contribute to the reduction in deforestation described in the study findings discussed in Text 2: if reducing the cost of mycoprotein increases people’s access to it, then mycoprotein may be able to replace beef in more people’s diets, thereby reducing the deforestation associated with beef production. Choice A is incorrect because the author of Text 1 indicates that the environmental impact of mycoprotein production is close to that of chicken or pork production, so there is no reason to think that the author would assert that replacing chicken or pork with mycoprotein would be environmentally beneficial: such a replacement would not lessen the total environmental impact of food manufacture. Additionally, the specific issue of agricultural water consumption is never mentioned in Text 1, so there is no evidence indicating what the author of Text 1 would say about that issue. Choice C is incorrect. Although Text 1 does compare the environmental effects of producing mycoprotein to those of producing chicken or pork, nothing in Text 1 suggests that the author believes that people are more likely to replace chicken or pork with mycoprotein than they are to replace beef with mycoprotein. Choice D is incorrect because Text 1 makes no mention of countries’ varying contributions to deforestation, so there is no evidence that the author of Text 1 would respond to the finding described in Text 2 by saying that some countries will have to replace more than 20% of their beef consumption with mycoprotein."},{"i":"d8758c3b","c":"main","d":"E","s":"Psychologists wanted to test how young children think about rewards and fairness. In an experiment, two teachers handed out rewards while children (ages four to six) watched. The teachers gave out the same number of rewards, but one of them counted the rewards out loud. The children were then asked who was fairer. 73% chose the teacher who counted. The psychologists think that counting showed the children that the teacher wanted to be fair. The children may have believed that the teacher who did not count did not care about fairness.\n\nWhich choice best states the main idea of the text?","o":["Psychologists think children cannot understand the concept of fairness until they are six years old.","An experiment found that counting out loud is the best way to teach mathematical concepts to children.","Psychologists think young children expect to be rewarded when the children show that they care about fairness.","An experiment showed that the way rewards are given out may affect whether young children think the situation is fair."],"a":3,"r":"Choice D is the best answer. The text describes a study assessing how children think of rewards and fairness and its results. It concludes that the children in the study may have thought that a teacher who counted out loud when giving rewards cared more about fairness than a teacher who did not count out loud. Choice A is incorrect. The children in the study are described as being “four to six,” and the text doesn’t mention any differences among the different ages. Choice B is incorrect. The experiment wasn’t about teaching math—rather, it was about how counting out loud affected the children’s perception of fairness. Choice C is incorrect. The experiment doesn’t focus on whether the children care about fairness, and the text never mentions the children’s expectations of being rewarded."},{"i":"adbcbce0","c":"main","d":"M","s":"The following text is adapted from Christina Rossetti’s 1881 poem “Monna Innominata 2.” I wish I could remember that first day, First hour, first moment of your meeting me, If bright or dim the season, it might be Summer or Winter for [all] I can say; So unrecorded did it slip away, So blind was I to see and to foresee, So dull to mark the budding of my tree That would not blossom yet for many a May.\n\nWhich choice best states the main idea of the text?","o":["The speaker celebrates how the passage of time has strengthened a relationship that once seemed unimportant.","Because the speaker did not anticipate how important a relationship would become, she cannot recall how the relationship began, which she regrets.","As the anniversary of the beginning of an important relationship approaches, the speaker feels conflicted about how best to commemorate it.","After years of neglecting a once valuable relationship, the speaker worries it may be too late for her to salvage the relationship."],"a":1,"r":"Choice B is the best answer. The speaker says that they wish they could remember when they first met someone, but they can’t remember the meeting at all, because they didn’t know at the time that the relationship would \"blossom\" later on. Choice A is incorrect. The speaker does say that the relationship has \"blossomed\" over time, but only briefly at the end—and they don’t really \"celebrate\" that fact. Rather, the text has a more regretful tone: it’s about how the speaker can’t remember first meeting this person, and they wish they could. Choice C is incorrect. The speaker doesn’t mention an anniversary—in fact, the speaker can’t remember when they met the person they’re talking about. Choice D is incorrect. The speaker doesn’t say that they neglected the relationship. In fact, the speaker suggests that the relationship has become very important to them—that’s why the speaker wishes that they could remember their first meeting."},{"i":"45c03837","c":"infer","d":"H","s":"Outi Tervo and team studied the effect of human-caused noise on narwhals (Monodon monoceros), arctic marine mammals that are sensitive to acoustic changes in their environment. Hypothesizing that elevated sound levels affect foraging among narwhals, Tervo’s team compared narwhal diving behaviors in natural sound conditions with those behaviors in two human-caused sound exposure conditions—ship sounds and ship sounds coupled with sonic pulses. Both exposure conditions resulted in significant decreases in the number and target depth of deep dives (associated with foraging) relative to natural conditions. However, differences between diving behaviors in the two exposure types were negligible, a finding that could be attributed to the fact that ______ Which choice most logically completes the text?","o":["sonic pulses can be heard at significantly greater ocean depths than ship sounds can.","ship sounds contribute so much to the overall sound level that the addition of sonic pulses has little effect on the narwhals’ auditory environment.","narwhals forage at shallower depths in the presence of ship sounds alone than in the presence of ship sounds coupled with sonic pulses.","the narwhals weren’t as sensitive to human-caused sounds as the researchers had predicted."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of human-caused noise and narwhal behavior. The text establishes that Outi Tervo and team found that while both ship sounds alone and ship sounds coupled with sonic pulses significantly affected narwhal foraging behaviors compared to natural conditions, there were negligible differences between the narwhals’ responses to the two sound exposure types (a somewhat surprising finding because one might expect that adding sonic pulses would have an even greater impact). It logically follows that if ship sounds are already so loud that adding sonic pulses to them doesn’t substantially increase the level of human- caused sound exposure, the two conditions would produce essentially the same behavioral responses because the additional sonic pulses are essentially irrelevant. Choice A is incorrect because the fact that sonic pulses are audible at greater depths than are ship sounds would be more likely to help explain a difference—not a similarity—in how the narwhals responded to the two types of sound exposure. If at some points during the study the narwhals were at depths where only sonic pulses (but not ship sounds) could be heard, then they might be expected to alter their diving behavior more dramatically in response to those pulses. But since the text reports negligible differences between diving behaviors in the two exposure types, the fact that sonic pulses reach greater depths than do ship sounds has little explanatory power in this context. Choice C is incorrect because the idea that the narwhals foraged at shallower depths in one of the two exposure conditions directly contradicts the information given in the text. The text states that there were negligible differences in the narwhals’ diving behaviors between the two conditions, meaning that the behaviors were essentially the same. Choice D is incorrect. Although the text states that two conditions with human-caused sounds (ship sounds alone and ship sounds coupled with sonic pulses) had essentially the same effect on narwhals’ deep dives, this indicates only that sonic pulses didn’t meaningfully change the effect of ship sounds, not that the narwhals were less sensitive to human-caused sounds than predicted. Indeed, the text makes it clear that the sounds significantly altered the narwhals’ behavior."},{"i":"3190835d","c":"infer","d":"M","s":"Some businesses believe that when employees are interrupted while doing their work, they experience a decrease in energy and productivity. However, a team led by Harshad Puranik, who studies management, has found that interruptions by colleagues can have a social component that increases employees’ sense of belonging, resulting in greater job satisfaction that benefits employees and employers. Therefore, businesses should recognize that ______ Which choice most logically completes the text?","o":["the interpersonal benefits of some interruptions in the workplace may offset the perceived negative effects.","in order to maximize productivity, employers should be willing to interrupt employees frequently throughout the day.","most employees avoid interrupting colleagues because they don’t appreciate being interrupted themselves.","in order to cultivate an ideal workplace environment, interruptions of work should be discouraged."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of potential benefits of interruptions in the workplace. The text indicates that a common belief in business is that interruptions to working employees decrease energy and productivity levels. However, the text goes on to explain that a research team led by Harshad Puranik has found that there could be a social benefit to these interruptions. Since the team found that workplace interruptions can increase employees’ sense of belonging and job satisfaction, it follows that the interpersonal benefits of some interruptions can offset the perceived negative effects. Choice B is incorrect. Although the text presents research findings that suggest some workplace interruptions can have a positive effect on employee job satisfaction, no further information is presented to suggest at what frequency these interruptions are ideal. Furthermore, the text doesn’t tie workplace interruptions to increased productivity, but rather links it to social benefits such as sense of belonging. Choice C is incorrect because the text doesn’t address employees’ motives for choosing not to interrupt their colleagues. The text presents research findings that suggest that there are some positive interpersonal effects of workplace interruptions that can increase employee job satisfaction. Choice D is incorrect because asking businesses to discourage workplace interruptions doesn’t follow from the team’s research about the benefits of workplace interruptions, nor does the text describe an ideal work environment. Instead, the text presents research suggesting that there may be positive aspects to workplace interruptions that haven’t previously been considered."},{"i":"63e7799d","c":"claim","d":"H","s":"In vertical inheritance, parents pass genes to their offspring, but in horizontal transfer (HT), one species, often bacteria, passes genetic material to an unrelated species. In a 2022 study, herpetologist Atsushi Kurabayashi and his team investigated HT in multicellular organisms—namely, snakes and frogs in Madagascar. The team detected BovB—a gene transmitted vertically in snakes—in many frog species. The apparent direction of gene transfer seems counterintuitive because frogs usually don’t survive encounters with snakes and so wouldn’t be able to transmit the newly acquired gene to offspring, but the team concluded that BovB is indeed transmitted from snakes to frogs, either directly or indirectly, via HT .\n\nWhich finding, if true, would most directly support the team’s conclusion?","o":["BovB can be transmitted across frog species through HT .","Parasites known to feed on species of snakes and frogs in which the BovB gene occurs also carry BovB.","BovB cannot be reliably transmitted from a snake species to bacteria that are usually encountered by frog species.","Frog species with BovB show few discernible advantages as compared with frog species that do not carry BovB."],"a":1,"r":"Choice B is the best answer. If there are parasites that feed on both snakes and frogs, they could carry BovB from snakes to frogs. HT could occur “indirectly” through those encounters, which frogs are more likely to survive than snake encounters. Choice A is incorrect. The team’s conclusion specifically argues that BovB is transmitted from snakes to frogs via HT , and this choice doesn’t mention snakes. Choice C is incorrect. The team argues that BovB is transmitted from snakes to frogs via HT , and this answer choice discusses a scenario in which the gene is not transmitted. Choice D is incorrect. Whether or not frog species with BovB are advantaged isn’t relevant to the team’s conclusion about how the gene is transmitted."},{"i":"0d7f4966","c":"claim","d":"H","s":"Jean-Bernard Caron and colleagues recently discovered a cache of jellyfish fossils in the Burgess Shale, a site in the Canadian Rockies that is rich in fossils from the Cambrian period (over 500 million years ago). Caron and colleagues claim that these are the oldest jellyfish fossils ever discovered. In the past twenty years, two sites in China and the United States have yielded fossils of a similar age that some experts believe are most likely jellyfish due to their shapes and the appearance of projecting tentacles. But Caron and colleagues argue that the apparent tentacles are in fact the comb rows of ctenophores, gelatinous animals that are only distantly related to jellyfish.\n\nWhich statement, if true, would most directly weaken the claim by Caron and colleagues about the fossils found in China and the United States?","o":["Sites in the Canadian Rockies from later periods than the Cambrian period have yielded fossils that have been conclusively identified as ctenophore fossils.","The fossils found in China and the United States are so poorly preserved that though they cannot be conclusively identified as jellyfish, they cannot be conclusively identified as ctenophores either.","While ctenophore fossils have been discovered in China and the United States, they have never been discovered in the Burgess Shale.","The fossils discovered by Caron and colleagues in the Burgess Shale were better preserved than the fossils discovered by other researchers in China and the United States."],"a":1,"r":"Choice B is the best answer because it presents a statement that, if true, would most directly weaken Caron and colleagues’ claim that the apparent tentacles in the Chinese and American fossils are actually ctenophore comb rows. If the fossils are so poorly preserved that they cannot be conclusively identified as either organism, neither the claim that they are jellyfish nor, as Caron claims, that they are ctenophores would be supported. Choice A is incorrect. Caron’s claim is that fossils from the US and China are ctenophores, not jellyfish. These fossils are said to be \"of a similar age\" to the Cambrian fossils found in the Canadian Rockies. And nothing in the text or this choice suggests that the presence or absence of ctenophores after the Cambrian would have any bearing on whether the Cambrian fossils from the US and China are ctenophores. Choice C is incorrect. Caron’s claim is that fossils from the US and China are ctenophores, not jellyfish. Nothing in the text suggests that the presence or absence of ctenophores in the Burgess Shale (in Canada) would affect whether the fossils found in the US and China are ctenophores. Choice D is incorrect. Caron’s claim is that fossils from the US and China are ctenophores, not jellyfish. Although fossil quality is a plausible issue for the research described in the text, nothing in the text or this choice suggests that the fossils from US and China would have been too poorly preserved for proper identification."},{"i":"a15b3219","c":"graph","d":"H","s":"","o":["A large majority of the municipalities that received an inquiry mentioning plans for an announcement before the next election didn’t respond to the inquiry.","The proportion of municipalities that responded to the inquiry or offered incentives didn’t substantially differ across the announcement timing conditions.","Only around half the municipalities that responded to inquiries mentioning plans for an announcement before the next election offered incentives.","Of the municipalities that received an inquiry mentioning plans for an announcement date after the next election, more than 1,200 didn’t respond and only around 100 offered incentives."],"a":1,"r":"Choice B is the best answer. The lighter bars show what happened when the announcement was to come before the election, and the darker bars show what happened when the announcement was to come after the election. For all three of the outcomes, the light and dark bars are virtually the same, demonstrating that the announcement timing didn’t actually make a difference. Choice A is incorrect. This accurately describes some data from the graph, but it doesn’t weaken the hypothesis. It doesn’t include the “announcement after election” data for comparison. Choice C is incorrect. This accurately describes some data from the graph, but it doesn’t weaken the hypothesis. It doesn’t include the “announcement after election” data for comparison. Choice D is incorrect. This accurately describes some data from the graph, but it doesn’t weaken the hypothesis. It doesn’t include the “announcement before election” data for comparison."},{"i":"b8199d5a","c":"graph","d":"E","s":"","o":["4,268,873 square miles","4,471 square miles","304 square miles","6,880 square miles"],"a":2,"r":"Choice C is the best answer because it states the total area of Bahrain that is indicated in the table. The table presents the total area (in square miles) and population for Bahrain, Qatar, and Kuwait, and it indicates that the total area of Bahrain is 304 square miles. Choice A is incorrect because the table indicates that 4,268,873 is the population of Kuwait, not the total area of Bahrain. Choice B is incorrect because the table indicates that 4,471 square miles is the total area of Qatar, not of Bahrain. Choice D is incorrect because the table indicates that 6,880 square miles is the total area of Kuwait, not of Bahrain."},{"i":"8df848c1","c":"fss","d":"E","s":"When they were first introduced to western Europe from Byzantium in the eleventh century, table forks were met with much resistance. The Bishop of Ostia, St. Peter Damian, condemned the eating utensils because he considered ______ dangerous and unnecessary luxury items.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["them","this","that","it"],"a":0,"r":"Choice A is the best answer. The convention being tested is pronoun-antecedent agreement. The plural pronoun \"them\" agrees in number with the plural antecedent \"utensils.\" Choice B is incorrect because the singular pronoun \"this\" doesn’t agree in number with the plural antecedent \"utensils.\" Choice C is incorrect because the singular pronoun \"that\" doesn’t agree in number with the plural antecedent \"utensils.\" Choice D is incorrect because the singular pronoun \"it\" doesn’t agree in number with the plural antecedent \"utensils.\""},{"i":"588887b9","c":"fss","d":"E","s":"In 1881, French chemist Camille Faure redesigned the rechargeable lead-acid battery. Faure’s design greatly increased the amount of electricity that the original battery, which the French physicist Gaston Planté ______ fifteen years earlier, could hold.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is inventing","will invent","invents","had invented"],"a":3,"r":"Choice D is the best answer. Faure redesigned the battery in 1881, and the original battery was invented “fifteen years earlier.” Notice that this is the only choice in the past tense. To indicate that a past occurrence took place before another past occurrence, we need to use “had” + the past tense form of the verb. This is called the “past perfect” tense. Choice A is incorrect. This choice creates a tense error. Planté invented the original battery in the past, so we shouldn’t use the present tense “is inventing.” Choice B is incorrect. This choice creates a tense error. Planté invented the original battery in the past, so we shouldn’t use the future tense “will invent.” Choice C is incorrect. This choice creates a tense error. Planté invented the original battery in the past, so we shouldn’t use the present tense “invents.”"},{"i":"94de423a","c":"fss","d":"E","s":"In a rural area along the border between Oklahoma and Texas, amateur astronomers gather each year to observe the night sky at the Okie-Tex Star Party. Like most star parties, Okie-Tex takes place in an area with low light pollution, ______ dark skies and ideal stargazing conditions.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["ensuring","this will ensure","ensures","it ensures"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite present participle \"ensuring\" is correctly used to form a supplementary element that modifies the main clause \"Okie-Tex takes place in an area with low light pollution,\" describing the viewing conditions of the star party. Choice B is incorrect because it results in a comma splice. The pronoun \"this\" and the finite future tense verb \"will ensure\" would add an additional main clause to this sentence, and the comma after \"pollution\" can’t be used in this way to join two main clauses. Choice C is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"ensures\" can’t be used in this way to form a supplementary element to modify the main clause. Choice D is incorrect because it results in a comma splice. The pronoun \"it\" and the finite present tense verb \"ensures\" would add an additional main clause to this sentence, and the comma after \"pollution\" can’t be used in this way to join two main clauses."},{"i":"145d5ca7","c":"bound","d":"M","s":"Gathering accurate data on water flow in the United States is challenging because of the country’s millions of miles of ______ the volume and speed of water at any given location can vary drastically over time.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["waterways and the fact that,","waterways, and the fact that,","waterways, and, the fact that","waterways and the fact that"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation within two coordinated noun phrases. When, as in this case, a noun phrase (“the country’s millions of miles of waterways”) is coordinated with another noun phrase (“the fact”) followed by an integrated relative clause (“that the volume...time”), no punctuation is needed. Choice A is incorrect because no punctuation is needed. Choice B is incorrect because no punctuation is needed. Choice C is incorrect because no punctuation is needed."},{"i":"aaa1907f","c":"bound","d":"H","s":"To serve local families during the Great Depression, innovative New York City librarian Pura Belpré offered storytelling in both English and Spanish, an uncommon ______ celebrated el Día de los Tres Reyes Magos, an important community holiday; and put on puppet shows dramatizing Puerto Rican folktales.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["practice, at the time","practice at the time;","practice, at the time,","practice at the time,"],"a":1,"r":"Choice B is the best answer. The convention being tested is the punctuation of elements in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after \"time\" is conventionally used to separate the first item (\"offered…time\") and the second (\"celebrated…holiday\") in the series of activities that librarian Pura Belpré offered. Moreover, the semicolon after \"time\" matches the semicolon used later to separate the second item (\"celebrated...holiday\") and the third (\"and...folktales\") in the series. Choice A is incorrect because it fails to use appropriate punctuation to separate the first item and the second item in the complex series. Furthermore, a comma isn’t needed between the noun \"practice\" and the prepositional phrase \"at the time\" because the prepositional phrase is essential to the full meaning of the phrase \"an uncommon practice at the time.\" Choice C is incorrect because a comma after \"time\" doesn’t match the semicolon used later to separate the second (\"celebrated...holiday\") and third (\"and...folktales\") items in the series. Furthermore, a comma isn’t needed between the noun \"practice\" and the prepositional phrase \"at the time\" because the prepositional phrase is essential to the full meaning of the phrase \"an uncommon practice at the time.\" Choice D is incorrect because a comma after \"time\" doesn’t match the semicolon used later to separate the second (\"celebrated...holiday\") and third (\"and...folktales\") items in the series."},{"i":"af88c47a","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Freddie Wong (born 1985) is a director and special effects artist from the United States. He is best known for the action-comedy web series Video Game High School (VGHS). VGHS premiered in 2012 on RocketJump, a YouTube channel that Wong cocreated. The series was celebrated for its inventive video game–centric world and high-quality special effects. VGHS was nominated for a Producers Guild Award for Outstanding Digital Series. The student wants to begin a narrative about Wong’s award-nominated web series.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In 2012, director and visual effects artist Freddie Wong launched a new action-comedy web series: Video Game High School.","Video Game High School was celebrated for its inventive video game–centric world and high-quality special effects, and it was nominated for a Producer’s Guild Award for Outstanding Digital Series.","Wong, cocreator of the YouTube channel RocketJump, would go on to see his web series be nominated for a Producers Guild Award.","In 2012, Video Game High School premiered on RocketJump; it would later be nominated for an award."],"a":0,"r":"Choice A is the best answer. This choice introduces Wong and VGHS in an active and specific way, as if to an audience unfamiliar with the series. It also sets up the time and genre of the web series, which are useful ways to introduce the series of events in a narrative. Choice B is incorrect. This choice isn’t suited for beginning a narrative. A narrative is a story that follows a sequence of events and creates interest and suspense for the reader. This choice jumps to the end, explaining the success of VGHS without explaining what it is. Choice C is incorrect. This choice isn’t suited for beginning a narrative. It doesn’t actually introduce the web series by name. It just jumps to later in the story without sufficient explanation. Choice D is incorrect. This choice is not very effective for beginning a narrative. It doesn’t explain what VGHS is, and it doesn’t mention Wong."},{"i":"04397a63","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: The Haudenosaunee Confederacy is a nearly 1,000-year-old alliance of six Native nations in the northeastern US. The members are bound by a centuries-old agreement known as the Great Law of Peace. Historian Bruce Johansen is one of several scholars who believe that the principles of the Great Law of Peace influenced the US Constitution. This theory is called the influence theory. Johansen cites the fact that Benjamin Franklin and Thomas Jefferson both studied the Haudenosaunee Confederacy. The student wants to present the influence theory to an audience unfamiliar with the Haudenosaunee Confederacy.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Historian Bruce Johansen believes that the Great Law of Peace was very influential.","The influence theory is supported by the fact that Benjamin Franklin and Thomas Jefferson both studied the Haudenosaunee Confederacy.","The influence theory holds that the principles of the Great Law of Peace, a centuries-old agreement binding six Native nations in the northeastern US, influenced the US Constitution.","Native people, including the members of the Haudenosaunee Confederacy, influenced the founding of the US in many different ways."],"a":2,"r":"Choice C is the best answer. The sentence effectively presents the influence theory to an audience unfamiliar with the Haudenosaunee Confederacy, explaining the theory’s position that the Great Law of Peace influenced the US Constitution while avoiding mention of the Haudenosaunee Confederacy itself. Choice A is incorrect. The sentence broadly emphasizes Johansen’s ideas about the Great Law of Peace; it doesn’t identify the influence theory or effectively present it. Choice B is incorrect. The sentence emphasizes one fact that supports the influence theory; it doesn’t effectively present the theory to an audience unfamiliar with the Haudenosaunee Confederacy. Choice D is incorrect. The sentence makes a broad generalization about Native people’s influence on the founding of the US; it doesn’t effectively present the influence theory."},{"i":"420dea42","c":"trans","d":"E","s":"A blend of gabardine and wool, the material for Elvis Presley’s Gold Vine jumpsuit was flexible enough to allow the singer to perform his signature dance moves. ______ the added weight of the suit’s swirling vines made of gold rhinestones likely limited Elvis’s mobility to some degree.\n\nWhich choice completes the text with the most logical transition?","o":["For this reason,","Firstly,","However,","In other words,"],"a":2,"r":"Choice C is the best answer. \"However\" logically signals that the claim in this sentence—that the weight of the gold rhinestones likely limited Elvis’s mobility—contrasts with the previous information about the material being flexible enough for Elvis’s dance moves. Choice A is incorrect because \"for this reason\" illogically signals that the claim in this sentence is caused by the previous information about the material being flexible enough for Elvis’s dance moves. Instead, the claim that the weight of the suit’s rhinestones limited movement contrasts with the previous information about the jumpsuit’s flexibility. Choice B is incorrect because \"firstly\" illogically signals that the claim in this sentence is the first in a series of claims about the jumpsuit being flexible enough for Elvis’s dance moves. Instead, the claim that the weight of the suit’s rhinestones limited movement contrasts with the previous information about the jumpsuit’s flexibility. Choice D is incorrect because \"in other words\" illogically signals that the claim in this sentence is a paraphrase or restatement of the previous information about the material being flexible enough for Elvis’s dance moves. Instead, the claim that the weight of the suit’s rhinestones limited movement contrasts with the previous information about the jumpsuit’s flexibility."},{"i":"6d883838","c":"trans","d":"M","s":"According to Duverger’s law, countries with single-ballot majoritarian elections for single-member districts tend to polarize into two-party systems, wherein dueling political parties consistently dominate the political system. ______ countries with proportional-representation electoral systems tend to support multi-partyism, under which power gets distributed among many political parties.\n\nWhich choice completes the text with the most logical transition?","o":["Subsequently,","Conversely,","For instance,","In other words,"],"a":1,"r":"Choice B is the best answer. \"Conversely\" logically signals that the information in this sentence—that countries with proportional-representation electoral systems tend toward multi-partyism—contrasts with the previous information about countries with single-ballot majoritarian elections, which tend to have two-party systems. Choice A is incorrect because \"subsequently\" illogically signals that the information in this sentence about countries with proportional- representation electoral systems occurs later in a chronological sequence of events than the information in the previous sentence. Instead, it contrasts with the previous information. Choice C is incorrect because \"for instance\" illogically signals that the information in this sentence about countries with proportional-representation electoral systems is an example supporting the previous statement about countries with single- ballot majoritarian elections. Instead, it contrasts with the previous statement. Choice D is incorrect because \"in other words\" illogically signals that the information in this sentence about countries with proportional-representation electoral systems is a paraphrase or restatement of the previous information about countries with single-ballot majoritarian elections. Instead, it contrasts with the previous information."},{"i":"30438650","c":"trans","d":"M","s":"Jhumpa Lahiri’s story collection Interpreter of Maladies features multiple stories about romantic relationships. In “This Blessed House,” newlyweds argue over whether to replace items left by the previous owners of their new home. ______ in “A Temporary Matter,” a husband and wife attempt to rekindle their relationship during a four-night blackout.\n\nWhich choice completes the text with the most logical transition?","o":["Granted,","For example,","Likewise,","Hence,"],"a":2,"r":"Choice C is the best answer. \"Likewise\" is a transition that indicates the addition of a new but related idea. In this sentence, the author is providing another similar example to that discussed in the previous sentence. Therefore, \"likewise\" works best in this context. Choice A is incorrect. This choice uses a transition that means \"admittedly.\" But the text isn’t admitting or conceding anything here. Instead, these two examples work together to support the claim made in the first sentence. Choice B is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. The second story is not an example of the story in the previous sentence—it’s another, similar story. And while both stories exemplify the first sentence in the text, the transition we’re looking for isn’t actually connected to that sentence. Choice D is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. The first story didn’t result in the events of the second story."}],"img":{"a15b3219":"iVBORw0KGgoAAAANSUhEUgAAArwAAAKCBAMAAADB5BetAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABaDUlEQVR42u1dZ3gTRxN+9yRZ7lrZYEI/2/R6NjYlNNFTKKKXABEQCDWfCSGQkGIIEAhJMCF0CKaEUBNRQ0f0DqK3gGUgJASwVqa7aL8fbrItYxMiMPje5wFLe3uru/fmZmdm5+YAGTJkyJAhQ4YMGTJkyJAhQ4YMGTJkvMygAEBSPpB/PwQpeMwFARDTviiR/k0LEqGggJDKCQFIUArPDpxRp2OKKXymbPQHqCLtEhU4fEvhfiLtS3EKCD8QUICCxBaTAlEnhUL6JtB9+fosckhTLkQa/36pw0xNHQAA0BkUdVN6FECGd+hRPD6VHyrAUcxOEgxPp2wS8HmNz7Xp+zm50ekbqR9OO44ipP57bhDyE73uBrS0qPUkKqDLeZSjRY+GDHN/4wJUW0cT33IB7y8uTItdkty2TXkI3DkaVd3tsFR428KArue5MGkPOg1ei3cuiu5bJNXctST+49+FOYsBcNX7F6li61cRtaha30H13ulyeO2QqNy2qOBJ755dWHzKK0KILb62blQ1eihMWOt1upJRFbgJsZV1m+g75HeVabBfIwkYhGrSJOXJukFti62tZCy2YLD++3afFTpRSJxdeLdPo8agnwWWGDNEAk6pr5c3F5/ybvRA6hk5SfVQqo9lbjvrBzYueNLLflEmgwM8ftVB0X7vwRFQMveCfyI5AU7ZHcZIqZJlLNV2mAH/Tyacer3kn4pqv5Ft56VG/5trSP51fmnl7di3vFWg28HiYqQv5hkAkCMXSMiXywEGFkMOmqEqXlLJqm8vePRinfI4BYONWwiIw
