<script>
const D={"t":"Practicetest36","q":[{"i":"21d95d1d","c":"vocab","d":"E","s":"Ofelia Zepeda’s contributions to the field of linguistics are ______: her many accomplishments include working as a linguistics professor and bilingual poet, authoring the first Tohono O’odham grammar book, and co-founding the American Indian Language Development Institute.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["pragmatic","controversial","extensive","universal"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of how Ofelia Zepeda has contributed to the field of linguistics. As used in this context, “extensive” means having a wide or considerable extent. The text indicates that Zepeda’s many accomplishments in linguistics are varied, including teaching linguistics, writing poetry in more than one language, creating a grammar book, and co-founding a language institute. This context supports the idea that Zepeda’s contributions to the field are extensive. Choice A is incorrect because the sentence presents Zepeda’s accomplishments as examples to support the claim made in the first part of the sentence. It wouldn’t make sense to say that achievements as a professor, poet and author, and co-founder of a language institute demonstrate that Zepeda’s contributions in her field are “pragmatic,” or related to practical matters and not involving intellectual or artistic matters. Choice B is incorrect because the sentence presents Zepeda’s accomplishments as a professor, poet and author, and co-founder of a language institute as examples to support the claim made in the first part of the sentence. There’s no reason to believe that the positive achievements listed demonstrate that Zepeda’s contributions in her field are “controversial,” or have caused disputes and opposing viewpoints. Choice D is incorrect because in this context, “universal” would mean including or covering everything in a group. The sentence presents Zepeda’s accomplishments as examples to support the claim made in the first part of the sentence, and it wouldn’t make sense to say that these specific achievements— particularly as the author of a grammar book specific to the Tohono O’odham language—demonstrate that Zepeda’s contributions relate to everything in the field of linguistics."},{"i":"5fa165f7","c":"vocab","d":"E","s":"In the 1960s, Sam Gilliam, a Black painter from the southern United States, became the first artist to drape painted canvases into flowing shapes. He later explored a different style, ______ quilt-like paintings inspired by the patchwork quilting tradition of Black communities in the South.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["predicting","refusing","hiding","creating"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of Sam Gilliam’s artworks. As used in this context, “creating” means producing or bringing something into existence. The text indicates that Gilliam is an artist who made draped canvases and, later, quilt-like paintings. This context supports the idea that Gilliam explored different styles in his art by creating special types of paintings. Choice A is incorrect because the text indicates that Gilliam actually explored and pursued the creation of quilt-like paintings; he wasn’t just “predicting,” or declaring in advance, the existence of these paintings. Choice B is incorrect because in this context “refusing” would mean rejecting, and there is nothing in the text to suggest that Gilliam rejected his quilt-like paintings. Instead, the text indicates that he was exploring and pursuing a new art style in these paintings. Choice C is incorrect because in this context “hiding” would mean concealing from view, and there is nothing in the text to suggest that Gilliam attempted to conceal his quilt-like paintings. Instead, the text indicates that he was exploring and pursuing a new art style in these paintings."},{"i":"afd48140","c":"vocab","d":"E","s":"In 1877, 85% of California’s railways were already controlled by the Southern Pacific Railroad. The company further solidified its ______ in rail access to the state’s Pacific coast when it completed the Sunset Route in 1883: running from Louisiana to Southern California, the route established the first transcontinental rail line across the southern United States.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["dominance","creativity","insignificance","neutrality"],"a":0,"r":"Choice A is the best answer because it most logically and precisely completes the text’s discussion of the Southern Pacific Railroad. As used in this context, \"dominance\" means the state of being more successful than others. The text states that the Southern Pacific Railroad already controlled 85% of California’s railways in 1877, and that the Sunset Route it constructed in 1883 was the first transcontinental rail line across the southern United States. Therefore, the Southern Pacific Railroad would be more successful than other railroads in the area, and the construction of the Sunset Route would further solidify its dominance in rail access to California’s coast. Choice B is incorrect. Although the construction of the Sunset Route must have required some creativity, or use of imagination, the word \"creativity\" would not also encompass the fact that the Southern Pacific Railroad already controlled 85% of California’s railways. The text is more focused on the railroad’s control of the field and overall success rather than its imaginative thought processes. Choice C is incorrect because if the Southern Pacific Railroad controlled the majority of California’s railways, it would not make sense to refer to its \"insignificance,\" or the state of being unimportant. Rather, the opposite would be true. Choice D is incorrect because in context it would not make sense to refer to the Southern Pacific Railroad’s \"neutrality,\" or absence of strong opinion on a matter, since no opinions are mentioned. Nor would \"neutrality\" in the sense of impartiality in a conflict be a logical or precise choice since no conflict is explicitly described. There might be an implied conflict between the Southern Pacific Railroad and other railroads doing business in California, but that is not a conflict in which the Southern Pacific Railroad would take an impartial position."},{"i":"c14daa3c","c":"vocab","d":"H","s":"Close analysis of the painting Girl with a Flute, long attributed to the seventeenth-century Dutch painter Johannes Vermeer, has revealed subtle deviations from the artist’s signature techniques. These variations suggest that the work may be that of a student under Vermeer’s tutelage— potentially ______ our understanding of Vermeer as a solitary artist.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["negating","prefiguring","entrenching","substantiating"],"a":0,"r":"Choice A is the best answer. \"Negating\" means \"reversing\" or \"making invalid.\" Proving that Vermeer worked with students would reverse the view of him as a solitary artist. Choice B is incorrect. \"Prefiguring\" means \"being an early indicator of.\" There already existed views of Vermeer as a solitary painter, so a new painting would not be an early indicator of those views. Rather, a painting proving that Vermeer had a student would contradict those earlier views. Choice C is incorrect. \"Entrenching\" means \"solidifying.\" A painting proving that Vermeer had a student would not solidify views of him as solitary, but would rather contradict those views. Choice D is incorrect. \"Substantiating\" means \"supporting with proof.\" A painting proving that Vermeer had a student would not support views of him as solitary, but would rather contradict those views."},{"i":"fb8b56bc","c":"purpose","d":"E","s":"The following text is adapted from George Bernard Shaw’s 1912 play Pygmalion. Henry Higgins has just arrived at the house of his mother (Mrs. Higgins). She is expecting her friends to visit soon. MRS. HIGGINS: I’m serious, Henry. You offend all my friends: they stop coming whenever they meet you. HIGGINS: Nonsense! I know I have no small talk; but people don’t mind. MRS. HIGGINS: Oh! don’t they? Small talk indeed! What about your large talk? Really, dear, you mustn’t stay.\n\nWhich choice best states the main purpose of the text?","o":["To describe what Henry’s mother does when she goes out with her friends","To show that Henry’s mother wants him to leave","To present a detailed account of what Henry’s home looks like","To explain why Henry often visits his mother"],"a":1,"r":"Choice B is the best answer because it most accurately states the main purpose of the text, which is to show that Henry’s mother, Mrs. Higgins, wants Henry to leave her house. In the text, Mrs. Higgins complains that Henry offends all her friends and that they stop coming when he’s also visiting. She then tells him directly, \"you mustn’t stay.\" The overall exchange conveys Mrs. Higgins’s intention for Henry to leave so as not to drive away her friends with his behavior. Choice A is incorrect because the text doesn’t indicate what Henry’s mother does when she’s out with her friends. Instead, it focuses on what goes on when Henry and her friends visit her at the same time, indicating that since her friends find Henry’s company disagreeable, she wishes him to leave before they arrive. Choice C is incorrect because the text doesn’t contain an account of what Henry’s home looks like. The setting is established as the house of Henry’s mother, and the dialogue focuses solely on her wish that Henry should depart before her friends arrive. Choice D is incorrect because the text doesn’t mention how often Henry visits his mother nor does it provide any explanation for why he visits his mother. Instead, it indicates that she thinks her friends dislike Henry and that she therefore wants him to depart before they arrive."},{"i":"0a04cac5","c":"purpose","d":"H","s":"The following text is adapted from Jane Austen’s 1814 novel Mansfield Park. The speaker, Tom, is considering staging a play at home with a group of his friends and family. We mean nothing but a little amusement among ourselves, just to vary the scene, and exercise our powers in something new. We want no audience, no publicity. We may be trusted, I think, in choosing some play most perfectly unexceptionable; and I can conceive no greater harm or danger to any of us in conversing in the elegant written language of some respectable author than in chattering in words of our own.\n\nWhich choice best states the main purpose of the text?","o":["To offer Tom’s assurance that the play will be inoffensive and involve only a small number of people","To clarify that the play will not be performed in the manner Tom had originally intended","To elaborate on the idea that the people around Tom lack the skills to successfully stage a play","To assert that Tom believes the group performing the play will be able to successfully promote it"],"a":0,"r":"Choice A is the best answer because it most accurately portrays the main purpose of the text. At the beginning of the text, Tom asserts that he and the other people staging the play are doing so only for “a little amusement among ourselves” and aren’t interested in attracting an audience or any attention with the production. Then, Tom promises that the play they chose is modest and appropriate, and he further reasons that using the well-written prose of “some respectable author” is better than using their own words. Overall, the main purpose of the text is to convey Tom’s promise that the play will be inoffensive and involve only a few people. Choice B is incorrect because the text doesn’t indicate that Tom had earlier intentions for the play’s performance or that anything has changed since the group first decided to stage a play. Instead, the text focuses on how harmless the entire endeavor will be. Choice C is incorrect. Although Tom mentions that using the words of a “respectable author” will be better than using their own words, he never addresses the idea that the people around him generally aren’t skilled enough to stage a play. Choice D is incorrect because in the text Tom specifically says that they “want no audience, no publicity,” which indicates that they don’t plan on promoting the play at all."},{"i":"97ca2cda","c":"func","d":"E","s":"In the early days of television in the 1940s, many people thought that US television programs would rely on the financial support of ad agencies and commercial sponsors, much like radio did. But advertisers hesitated to jump into a new space, <u>particularly at a time when the manufacturing of new television sets was stalled due to the US’s involvement in World War II.<\/u> Broadcasters, like the National Broadcasting Company (NBC), needed to persuade advertisers to support their programming despite not knowing whether there would be a robust television audience to begin with.\n\nWhich choice best describes the function of the underlined phrase in the text as a whole?","o":["It compares the beginnings of radio programming with the beginnings of television programming in the United States.","It identifies a specific reason behind some advertisers’ hesitance to support television.","It describes how broadcasters attempted to convince advertisers to support television.","It explains why a type of television programming was popular at the time."],"a":1,"r":"Choice B is the best answer because it accurately describes the function of the underlined phrase in the text as a whole. According to the text, advertisers were reluctant to support television in its early days. The underlined phrase then indicates that this reluctance was partly due to the US’s involvement in World War II, which hindered television production. Thus, the underlined phrase identifies a specific reason behind some advertisers’ hesitance to support television. Choice A is incorrect. The text merely mentions that television was expected to be financed through advertising, as radio was at the time. Nothing in the text compares the origins of radio and television. Choice C is incorrect. The underlined phrase focuses on a reason advertisers were reluctant to support television, not measures taken to convince advertisers to support television. Choice D is incorrect. The underlined phrase focuses on a reason advertisers were reluctant to support television, not what types of television programming were popular."},{"i":"c502943e","c":"func","d":"E","s":"The following text is adapted from Cynthia Kadohata’s 2004 novel Kira-Kira. <u>[Uncle Katsuhisa] was as loud as my father was quiet.<\/u> Even when he wasn’t talking, he made a lot of noise, clearing his throat and sniffing and tapping his fingers. ©2004 by Cynthia Kadohata Which choice best describes the function of the underlined sentence?","o":["It lists the kinds of topics Uncle Katsuhisa enjoys discussing.","It suggests that Uncle Katsuhisa dislikes meeting new people.","It contrasts Uncle Katsuhisa with the narrator’s father.","It describes a conversation between the narrator and the narrator’s father."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The underlined sentence establishes a difference between Uncle Katsuhisa and the narrator’s father by describing Uncle Katsuhisa as \"loud\" and the narrator’s father as \"quiet.\" The text then elaborates on that contrast, describing some ways Uncle Katsuhisa is very noisy even when he isn’t speaking. Choice A is incorrect because the text doesn’t indicate what kinds of topics Uncle Katsuhisa enjoys discussing, only that he is loud even when he isn’t speaking. Choice B is incorrect because the text never indicates how Uncle Katsuhisa feels about meeting new people, only how loud he is. Choice D is incorrect because the text never describes a conversation occurring between any people; it refers to talking only when stating that Uncle Katsuhisa is loud even when he isn’t speaking."},{"i":"7b55e895","c":"cross","d":"E","s":"Text 1 Some animal species, like the leopard, can be found in many kinds of areas. On the other hand, tropical mountain bird species tend to be limited in the types of spaces they can call home. This is because many mountain bird species are only able to survive at very specific elevations. Over time, these species have likely become used to living at a specific temperature. Therefore, these species struggle to survive at elevations that are warmer or colder than they are used to.\n\nText 2 A new study reviewed observations of nearly 3,000 bird species to understand why tropical mountain bird species live at specific elevations. They noted that when a mountain bird species was found in an area with many other bird species, it tended to inhabit much smaller geographic areas. It is thus likely that competition for resources with other species, not temperature, limits where these birds can live.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Tropical mountain bird species are restricted in where they can live.","Scientists have better tools to observe tropical mountain birds than they did in the past.","Little is known about how tropical mountain birds build their nests.","Tropical mountain bird species that live at high elevations tend to be genetically similar."],"a":0,"r":"Choice A is the best answer. Both texts state that tropical mountain bird species have limited ranges or habitats, although they disagree on the reason for this. Text 1 claims that temperature is the main factor that determines where these birds can live, while Text 2 claims that competition with other species is the main factor. However, both texts agree that these birds are not able to survive in many kinds of areas. Choice B is incorrect. Neither text mentions the tools or methods that scientists use to observe these birds, either now or in the past. Choice C is incorrect. Neither text mentions anything about how these birds build their nests. Choice D is incorrect. Neither text provides any information about the genetic similarity of these birds, so we have no evidence that either author would agree with this statement."},{"i":"a12a83ce","c":"main","d":"H","s":"The following text is from William Shakespeare’s play The Tempest, first performed in 1611. Miranda has lived on an island with her father, Prospero, since she was three years old. Prospero has stated that Miranda likely does not remember anything other than her life on the island. MIRANDA: ’Tis far off, And rather like a dream than an assurance That my remembrance warrants. Had I not Four or five women once that tended me? PROSPERO: Thou hadst, and more, Miranda. But how is it That this lives in thy mind? What seest thou else In the dark backward and abysm of time? If thou remember’st ought ere thou camest here, How thou camest here thou mayst. In the text, which point does Prospero most directly make about Miranda and her memories?","o":["Miranda’s reminiscences about her early childhood have a melancholy quality that betrays her discontented view of her current circumstances.","Miranda’s doubts about the accuracy of one recollection of a place other than the island are clouding her judgment and seem to be making her reluctant to explore her recollection of traveling to the island.","Miranda’s ability to summon details of an experience she had before arriving on the island suggests that she may also be able to summon details of her arrival on the island.","Miranda’s impression of a scene is vague because she is remembering a scenario she had daydreamed about as a child rather than a scenario that had occurred in reality."],"a":2,"r":"Choice C is the best answer because it presents a point that Prospero makes about Miranda. The text begins with Miranda responding to Prospero’s claim that she probably doesn’t remember her life before the island. She describes a distant memory, asking if she had \"four or five women\" caring for her. Prospero confirms this (\"thou hadst\") and then asks what else she can recall, stating that because she remembers one thing from the time before she lived on the island (\"ought ere thou camest here\"), she might also remember arriving on the island (\"how thou camest here\"). That is, Prospero indicates that Miranda’s ability to summon details of an experience from before her arrival on the island suggests that she may also be able to summon details of her arrival. Choice A is incorrect because Prospero doesn’t say anything about how Miranda presents her early childhood memory of having several people care for her—he indicates only his surprise that she remembers something from so long ago (\"the dark backward and abysm of time\") and his thought that she may also be able to recall another childhood event: her arrival on the island. Further, Prospero doesn’t suggest that he believes Miranda is discontent in her current circumstances. Choice B is incorrect. Although Miranda suggests some doubt about her recollection of a place other than the island, in that she describes it as \"like a dream\" she can’t be certain of, Prospero doesn’t mention her uncertainty—though he himself wonders how it is possible that she correctly recalls something from so long ago (\"abysm of time\"). Rather than indicating that doubt is making Miranda reluctant, Prospero simply states that Miranda may have the ability to remember traveling to the island. Choice D is incorrect. Although Miranda describes a vague impression of several people who cared for her as a young child and states that it is \"rather like a dream\" instead of something she is certain is real, Prospero doesn’t indicate that Miranda is remembering a childhood daydream. Instead, he confirms that what Miranda remembers actually happened, answering her question about having had caregivers with \"thou hadst,\" and asks her what else she can remember from long ago."},{"i":"d2c2a7ef","c":"main","d":"M","s":"The following text is from Anton Chekhov’s 1898 short story “Ionitch” (translated by Marian Fell in 1915). The text is set in a Russian city referred to as the city of S. If newcomers to the little provincial city of S. complained that life there was monotonous and dull, its inhabitants would answer that, on the contrary, S. was a very amusing place, indeed, that it had a library and a club, that balls were given there, and finally, that very pleasant families lived there with whom one might become acquainted. And they always pointed to the Turkins as the most accomplished and most enlightened family of all. What does the text suggest about the Turkins?","o":["They are relative newcomers to the city of S.","They have a unique status in the city of S.","They have long disliked living in the city of S.","They are amused by the other residents of the city of S."],"a":1,"r":"Choice B is the best answer because it presents a statement about the Turkins that is suggested by the text. The text explains that while many pleasant families live in the city of S., inhabitants of the city consider the Turkins to be \"the most accomplished and most enlightened family of all.\" Thus, by indicating that they are seen as more accomplished and more enlightened than all the other families in the city of S., the text suggests that the Turkins have a unique status there. Choice A is incorrect because the text doesn’t indicate that the Turkins have recently moved to the city of S.; it provides no information about when the Turkins arrived. Choice C is incorrect because the text explains how the Turkins are viewed by others in the city of S. but gives no indication of how the Turkins feel about living there. Choice D is incorrect because the text explains how the Turkins are viewed by other residents of the city of S. but gives no indication of how the Turkins view the other residents."},{"i":"4b8eda0a","c":"infer","d":"H","s":"For its 1974 work Instant Mural, the Chicano art collective Asco taped members Patssi Valdez and Humberto Sandoval to an outdoor wall in East Los Angeles. The work is manifestly a commentary on constraint, but many critics focus on Valdez and the social constraints women faced at the time, which is understandable but leaves the presence of Valdez’s male collaborator Sandoval unexplained. We should instead consider that in 1974, the art establishment’s recognition of Chicano artists was (and had long been) restricted to sociohistorical muralists, leaving nonmuralist Chicano artists—like Asco’s members—struggling to even exhibit their work; attending to this context opens an interpretation that accounts for all the evidence, allowing us to conclude that ______ Which choice most logically completes the text?","o":["while Valdez’s presence in Instant Mural represents the social constraints placed on women at the time, Sandoval’s presence represents Chicano muralists’ frustration at their lack of recognition by the art establishment.","the main subject of Instant Mural is female Chicano artists’ experience of being doubly constrained by gender-role expectations and the marginalization of certain types of art.","Instant Mural is a reflection on the constraining aesthetic expectations placed on Chicano artists in general rather than on the social constraints placed on women specifically.","Instant Mural is best understood not as a critique of the social constraints placed on women but rather as a critique of sociohistorical muralists’ depictions of Chicano culture."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Instant Mural. According to the text, the 1974 work Instant Mural involved taping two Asco members (Patssi Valdez and Humberto Sandoval) to an outdoor wall as a direct commentary on constraint (limitation or restriction). The text suggests that instead of focusing on Valdez’s role in the work and on social limitations women faced at the time—an approach that fails to explain the role of Sandoval, a man—people should consider that in 1974 (and long before) the art establishment limited recognition of Chicano artists to those who created murals with social and historical subjects, making it challenging for nonmuralist Chicano artists (such as Asco’s members) to show their work. The text suggests that considering the situation with the art establishment leads to a conclusion that accounts for the fact that Instant Mural is explicitly about constraint and features both a woman and a man taped to the wall: Instant Mural isn’t a reflection of the social constraints placed on women specifically but instead is a reflection on the constraining aesthetic expectations placed on Chicano artists in general (that is, the limits resulting from the lack of recognition of Chicano artists of any gender who did not create sociohistorical murals). Choice A is incorrect. The text indicates that the art establishment in 1974 (and earlier) did recognize Chicano muralists to the exclusion of other Chicano artists, so there’s no reason to assume Asco’s work Instant Mural was intended to represent Chicano muralists’ frustration; it’s far more likely that Asco’s members—described as Chicano nonmuralists—were representing their own frustration at being unrecognized by the art establishment. Choice B is incorrect. The text emphasizes that while a common approach to Instant Mural focuses on Valdez and the social limitations women faced in 1974 but fails to account for the presence of a man in the work, there is a conclusion that explains Sandoval’s role. But concluding that Instant Mural represents a double constraint experienced specifically by female Chicano artists would still fail to account for the inclusion of a man in the work. Choice D is incorrect. Although the text suggests that Instant Mural can be understood as something other than a commentary on social constraints women faced in 1974, it doesn’t suggest that the work is best understood as a critique of the content of any other artworks. The text doesn’t address how Chicano culture is depicted in sociohistorical murals; it discusses such murals only to make the point that in 1974 (and earlier) the art establishment recognized Chicano artists who produced them to the exclusion of Chicano nonmuralists, indicating a constraint all of Asco’s members faced, regardless of gender."},{"i":"61228830","c":"infer","d":"H","s":"A heliograph is a semaphore device used for sending optical communications—usually in the form of Morse code—by reflecting flashes of sunlight off a mirror. Heliographs were used for rapid communication across expansive distances for military, surveying, and forestry purposes during the late nineteenth and early twentieth centuries, but they were largely effective only during the daytime, and the range of the device depended on factors such as the opacity of the air and line of sight. Therefore, heliographs were eventually replaced by technology that ______ Which choice most logically completes the text?","o":["worked on similar principles but was easier to produce and maintain.","was not so constrained by environmental circumstances.","could be used for more than military, surveying, or forestry purposes.","enabled communication that didn’t require knowledge of Morse code."],"a":1,"r":"Choice B is the best answer. The passage explains that heliographs “were largely effective only during the daytime” and that “the range of the device depended on factors such as the opacity of the air and line of sight.”These constraints would have greatly limited the use of the heliograph, so we can infer that this would have been a reason to replace it with new technology. Choice A is incorrect. The passage doesn’t discuss the production and maintenance of heliographs, so there’s no basis for this inference. Choice C is incorrect. The passage doesn’t mention any “other purposes” that a heliograph wouldn’t work for, so there’s no basis for this inference. Choice D is incorrect. The passage doesn’t mention knowledge of Morse code as a particular problem with the use of heliographs, so there’s no basis for this inference."},{"i":"4fc9a13a","c":"claim","d":"H","s":"The novelist Toni Morrison was the first Black woman to work as an editor at the publishing company Random House, from 1967 to 1983. A scholar asserts that one of Morrison’s likely aims during her time as an editor was to strengthen the presence of Black writers on the list of Random House’s published authors.\n\nWhich finding, if true, would most strongly support the scholar’s claim?","o":["The percentage of authors published by Random House who were Black rose in the early 1970s and stabilized throughout the decade.","Black authors who were interviewed in the 1980s and 1990s were highly likely to cite Toni Morrison’s novels as a principal influence on their work.","The novels written by Toni Morrison that were published after 1983 sold significantly more copies and received wider critical acclaim than the novels she wrote that were published before 1983.","Works that were edited by Toni Morrison during her time at Random House displayed stylistic characteristics that distinguished them from works that were not edited by Morrison."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would support the scholar’s claim about Toni Morrison’s likely goal of strengthening the presence of Black writers on Random House’s list of published authors. The text explains that Morrison was the first Black woman to be an editor for Random House and that she was an editor there from 1967 to 1983. If it were true that Random House published a higher percentage of works by Black authors throughout the 1970s—during most of Morrison’s time working there—than it had previously published, that would suggest that Morrison may have made a deliberate effort to strengthen the presence of Black authors on the list of Random House’s published authors, thus supporting the scholar’s claim. Choice B is incorrect because the scholar’s claim is about Morrison’s work as an editor at a publishing company and her likely effort to strengthen the presence of Black writers on that company’s list of published authors. It might be true that Black authors interviewed in the 1980s and 1990s often cited Morrison’s novels as an influence on their work, but that finding would simply suggest something about how those authors approached their work; it wouldn’t show that Morrison intended to increase the number of Black writers among the published authors specifically at Random House. Choice C is incorrect because the scholar’s claim is about Morrison’s work as an editor at a publishing company, not about her work as a novelist. Therefore, a finding that Morrison’s novels published after 1983 sold more copies and were more widely acclaimed than her earlier novels would have no bearing on the claim that as an editor Morrison made an effort to ensure that more Black writers were present on Random House’s list of published authors. Choice D is incorrect. Although the text discusses Morrison’s work as an editor at Random House, the scholar’s claim focuses on Morrison’s likely effort in that role to increase the number of Black writers present on Random House’s list of published authors, not on the influence she may have had on the content of the works she edited. Without knowing whether Morrison’s stylistic influence led to more publications or if Morrison applied her influence specifically to works by Black writers, the finding that works edited by Morrison could be identified by stylistic characteristics would have no bearing on the claim that Morrison intended to strengthen the presence of Black writers among the published authors at Random House."},{"i":"09775cbf","c":"claim","d":"H","s":"In a series of experiments, Julio Sevilla and Claudia Townsend showed that manipulating the space between products in store displays can influence consumers’ views of those products. Participants in several of the experiments regarded the same products in the same (generic) retail settings as significantly more valuable when the product-to-space ratio was low than when it was high. But in one of the experiments, Sevilla and Townsend arranged the same jewelry with different levels of intervening space at an upscale retailer (Tiffany &amp; Co.) and a relatively inexpensive retailer (Forever 21). The result of this experiment suggests that a store context associated with inexpensive products may moderate the effect Sevilla and Townsend observed in their other experiments.\n\nWhich finding from the experiment with Tiffany &amp; Co. and Forever 21, if true, would most directly support the conclusion presented in the text?","o":["At Tiffany &amp; Co., participants judged jewelry spaced far apart to be substantially more valuable than jewelry spaced close together, but at Forever 21, participants judged jewelry spaced far apart to be only slightly more valuable than jewelry spaced close together.","At both Tiffany &amp; Co. and Forever 21, participants judged jewelry spaced far apart to be less valuable than jewelry spaced close together, but the difference in perceived value was significantly greater at Tiffany &amp; Co. than at Forever 21.","Participants judged jewelry spaced far apart at Tiffany &amp; Co. to be similar in value to jewelry spaced far apart at Forever 21, but participants judged jewelry spaced close together at Tiffany &amp; Co. to be more valuable than jewelry spaced close together at Forever 21.","When jewelry was spaced far apart, participants judged the jewelry at Tiffany &amp; Co. to be more valuable than the jewelry at Forever 21, but when jewelry was spaced close together, participants judged the jewelry at Tiffany &amp; Co. to be less valuable than the jewelry at Forever 21."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would support the text’s conclusion about the results of the experiment with Tiffany &amp; Co. and Forever 21. According to the text, Sevilla and Townsend found in several experiments that when products in a generic retail setting are displayed with a low product-to-space ratio (that is, with lots of space between them), consumers view those products as significantly more valuable than when the same products are displayed with a higher product-to-space ratio (less space between them). The text then states that the results of an experiment specifically using the contexts of an inexpensive store (Forever 21) and an upscale one (Tiffany &amp; Co.) suggest that an inexpensive store context may moderate, or lessen, that effect. If Sevilla and Townsend found that participants in the experiment with Tiffany &amp; Co. and Forever 21 judged the same jewelry items as substantially more valuable when there was lots of space between them than when there was little space between them in the upscale store (Tiffany &amp; Co.) but judged the same jewelry items as only slightly more valuable when there was lots of space between them than when there was little space between them in the inexpensive store (Forever 21), that finding would demonstrate that increased space between products was associated with less of an increase in those products’ perceived value at the inexpensive store than at the upscale store. Thus, the finding would support the text’s conclusion that a store context associated with inexpensive goods moderates the effect Sevilla and Townsend observed in their earlier experiments. Choice B is incorrect because if Sevilla and Townsend found that at both upscale and inexpensive stores, participants judged jewelry spaced far apart to be less valuable than jewelry spaced close together, that would show the opposite of the effect the researchers observed in their earlier experiments, not show that an inexpensive store context merely moderates, or lessens, that effect. Choice C is incorrect because this finding wouldn’t show that the effect Sevilla and Townsend observed in their initial experiments (that products spaced far apart were perceived as more valuable than the same products spaced close together) is present but lessened in inexpensive retail contexts, as the text suggests. The conclusion in the text rests on determining the difference in jewelry items’ perceived value between two spacing conditions within each store and then comparing the difference for the inexpensive store (Forever 21) to the difference for the upscale store (Tiffany &amp; Co.); a finding that compares perceptions of the jewelry items’ value between the two stores but for only one type of spacing condition at a time wouldn’t provide information about the degree of difference between spacing conditions within each type of store context. Choice D is incorrect because this finding wouldn’t show that the effect Sevilla and Townsend observed in their initial experiments (that products spaced far apart were perceived as more valuable than the same products spaced close together) is present but lessened in inexpensive retail contexts, as the text suggests. The conclusion in the text rests on determining the difference in jewelry items’ perceived value between two spacing conditions within each store and then comparing the difference for the inexpensive store (Forever 21) to the difference for the upscale store (Tiffany &amp; Co.); a finding that compares perceptions of the relative value of jewelry items between the two stores and for only one type of spacing condition at a time wouldn’t provide information about the degree of difference between spacing conditions within each type of store context."},{"i":"627d93e3","c":"graph","d":"H","s":"","o":["Growth with nitrogen under the current climate exceeded growth with nitrogen under moderate change, but the latter exceeded growth without nitrogen under extreme change.","Growth without nitrogen under the current climate exceeded growth without nitrogen under moderate change, but the latter exceeded growth with nitrogen under extreme change.","Growth with nitrogen under moderate change exceeded growth without nitrogen under moderate change, but the latter exceeded growth without nitrogen under extreme change.","Growth with nitrogen under moderate change exceeded growth without nitrogen under the current climate, but the latter exceeded growth with nitrogen under extreme change."],"a":3,"r":"Choice D is the best answer because it describes data from the graph that support Ibáñez and colleagues’ conclusion that increasing anthropogenic nitrogen deposition can compensate for the negative effect of climate change on tree growth if that change is moderate but not if it’s extreme. The bar graph shows the growth of sugar maple trees with and without nitrogen fertilization under three different climate-change scenarios: current conditions, a moderate change, and an extreme change. According to the graph, radial growth without nitrogen fertilization is projected to be about 0.16 centimeters (cm) under current conditions, 0.15 cm under a moderate change, and 0.04 cm under an extreme change. The graph also shows that with nitrogen fertilization, growth is projected to be about 0.18 centimeters under a moderate change but only about 0.06 centimeters under an extreme change. Thus, the data in the graph support the researchers’ conclusion by showing greater growth for a moderate change using nitrogen fertilization than they do either under current conditions without nitrogen fertilization or under an extreme change with nitrogen fertilization. Choice A is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion that the decline in radial growth due to climate change will be partly offset by higher levels of anthropogenic nitrogen, but only if change to the climate is moderate and not if it’s extreme. To support this would require comparing radial growth without nitrogen fertilization under current climate conditions to the growth with nitrogen fertilization under both moderate and extreme changes. This choice mentions only growth with nitrogen fertilization under current climate conditions and moderate change and growth without nitrogen fertilization under an extreme change, which don’t provide a basis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change. Choice B is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion that the decline in radial growth due to climate change will be partly offset by higher levels of atmospheric nitrogen, but only if change to the climate is moderate and not if it’s extreme. The support needed would compare radial growth under current climate conditions without nitrogen fertilization to the growth with nitrogen fertilization under moderate and extreme changes. This choice mentions only growth without nitrogen fertilization under current conditions and moderate change and growth with nitrogen fertilization under extreme change, which don’t provide a basis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change. Choice C is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion that the decline in radial growth due to climate change will be partly offset by higher levels of atmospheric nitrogen, but only if change to the climate is moderate and not if it’s extreme. The support needed would compare radial growth without adding nitrogen under current climate conditions to the growth with nitrogen fertilization under moderate and extreme changes. This choice mentions only the growth with and without nitrogen fertilization under moderate climate change and growth without nitrogen fertilization under extreme change, which don’t provide a basis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change."},{"i":"800771e5","c":"graph","d":"E","s":"","o":["In 2016, the number of cellular and molecular biology topic submissions was the same as the number of animal science topic submissions.","In 2019, there were more physics and space science topic submissions than there were medicine and health topic submissions.","The lowest number of animal science topic submissions in a year was approximately 95 in 2016.","The highest number of medicine and health topic submissions during the period shown is approximately 285 in 2019."],"a":3,"r":"Choice D is the best answer because it effectively uses data from the graph to support the underlined claim that more medicine and health topics were submitted to a national science fair in 2019 than in any of the other years shown. This choice indicates that the approximately 285 medicine and health topics submitted in 2019 are more than the number of medicine and health submissions in any other year shown—a description that is supported by information in the graph, which shows that medicine and health topic submissions were below 250 in 2016, 2017, and 2018, but above 250 (approximately 285 submissions) in 2019. Choice A is incorrect because it doesn’t support the underlined claim or accurately reflect the information in the graph. This choice refers to 2016 and discusses cellular and molecular biology and animal science, whereas the underlined claim refers to 2019 and discusses medicine and health. Moreover, the claim that in 2016 there were equal numbers of submissions in the cellular and molecular biology category and in the animal science category is contradicted by the graph, which shows approximately 200 submissions and 50 submissions, respectively, for those categories in 2016. Choice B is incorrect because it doesn’t accurately reflect the information in the graph. This choice claims that in 2019 there were more physics and space submissions than there were medicine and health submissions, but the graph shows that there were approximately 100 space and science submissions that year and approximately 285 medicine and health submissions. Choice C is incorrect because it doesn’t accurately reflect the information in the graph or support the underlined claim about medicine and health research topics. This choice claims that there were approximately 95 submissions for the animal science category in 2016, but the graph shows that the number was closer to 50 in 2016."},{"i":"dc645172","c":"fss","d":"H","s":"The artistic talents of Barbara Chase-Riboud, most known for her 1979 historical novel Sally Hemings and the conversation it inspired, ______ limited to the realm of prose: she first excelled in sculpture, where her affinity for bronze—a material she described as “timeless” due to its use across eras and cultures—became part of her artistic identity.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["hasn’t been","wasn’t","isn’t","aren’t"],"a":3,"r":"Choice D is the best answer. The subject \"talents\" is plural, and so is the verb \"aren’t\": \"the artistic talents…aren’t limited.\" Choice A is incorrect. The subject \"talents\" is plural, but the verb \"hasn’t been\" is singular. Choice B is incorrect. The subject \"talents\" is plural, but the verb \"wasn’t\" is singular. Choice C is incorrect. The subject \"talents\" is plural, but the verb \"isn’t\" is singular."},{"i":"6d247c13","c":"fss","d":"E","s":"The Boston Saloon was one of the most popular African American–owned establishments in nineteenth-century Nevada. ______ by businessman William A.G. Brown, the saloon was known to offer elegant accommodations and an inclusive environment.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Created","Creates","Creating","Create"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite past participle \"created\" is correctly used to form a supplementary element that modifies the noun phrase \"the saloon,\" identifying who established the Boston Saloon. Choice B is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"creates\" can’t be used in this way to form a supplementary element to modify the noun phrase \"the saloon.\" Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite present participle \"creating\" can’t be used in this way to form a supplementary element to modify the noun phrase \"the saloon.\" Choice D is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"create\" can’t be used in this way to form a supplementary element to modify the noun phrase \"the saloon.\""},{"i":"9994ae0d","c":"fss","d":"H","s":"Artist Yto Barrada’s exhibition Ways to Baffle the Wind incorporates sculptures, textiles, and films. Barrada’s pieces, utilizing elements as disparate as plant-dyed fabrics, wire crab traps filled with stones, and cotton balls dangling above a fan, ______ the ways humans attempt to organize and regulate nature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["explore","has explored","explores","exploring"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The plural verb “explore” agrees in number with the plural subject “Barrada’s pieces.” Choice B is incorrect because the singular verb phrase “has explored” doesn’t agree in number with the plural subject “Barrada’s pieces.” Choice C is incorrect because the singular verb “explores” doesn’t agree in number with the plural subject “Barrada’s pieces.” Choice D is incorrect because the nonfinite participle “exploring” doesn’t supply the main clause with a finite verb."},{"i":"333b2b65","c":"bound","d":"E","s":"While one requires oxygen and one does ______ and anaerobic respiration are both forms of cellular respiration—that is, they are processes by which cells break down glucose to use as energy.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["not aerobic","not. Aerobic","not, aerobic","not; aerobic"],"a":2,"r":"Choice C is the best answer. A comma is the appropriate way to link the dependent clause “While...not” and the independent clause that follows. Choice A is incorrect. This choice creates a run-on sentence error. “While...not” is a dependent clause, which must be separated from the independent clause that follows with some sort of punctuation. Choice B is incorrect. This choice creates a sentence fragment. “While one requires oxygen and one does not” isn’t an independent clause, so it can’t stand alone as a complete sentence. Choice D is incorrect. This choice creates a punctuation error. “While one requires oxygen and one does not” isn’t an independent clause, so it can’t be linked to the clause that follows with a semicolon."},{"i":"a7fdf862","c":"bound","d":"E","s":"Azulejos, mosaics made of glazed ceramic tiles, can be found throughout Portugal. These mosaics beautify places such as ______ stations, and public squares.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["libraries train","libraries: train","libraries—train","libraries, train"],"a":3,"r":"Choice D is the best answer. The convention being tested is the punctuation of items in a simple series. The comma after \"libraries\" is used conventionally to separate the first and second items (\"libraries\" and \"train stations\") in the series. Choice A is incorrect because it fails to separate the first two items (\"libraries\" and \"train stations\") in the series. Choice B is incorrect because a colon can’t be used in this way to separate items in a simple series. Choice C is incorrect because a dash can’t be used in this way to separate items in a simple series."},{"i":"14037904","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: The Heartbeat of Wounded Knee: Native America from 1890 to the Present is a history book by Ojibwe author David Treuer. In a review, a critic for The Economist noted that “Treuer’s storytelling skills shine” and that the book is an “elegant handling of [a] complex narrative.” A critic for O, The Oprah Magazine called it “a marvel of research and storytelling.” A critic for the Missoulian dubbed it “a monumental achievement.” The student wants to emphasize a similarity in how critics responded to Treuer’s book.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Treuer’s book, which was widely reviewed, focuses on Native American history from 1890 to the present.","Dubbed “a monumental achievement” by the Missoulian, Treuer’s book documents over a century of Native American history.","Critics praised Treuer’s book for its compelling narrative, with O, The Oprah Magazine calling it “a marvel of research and storytelling” and The Economist likewise writing that “Treuer’s storytelling skills shine” and that the book is an “elegant handling of [a] complex narrative.”","While the Missoulian focused on the book’s broader achievement, The Economist zeroed in on Treuer’s storytelling skills."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes a similarity in how critics responded to Treuer’s book, noting that the critics for O, The Oprah Magazine and The Economist both praised the book’s storytelling. Choice A is incorrect. The sentence provides background information about Treuer’s book; it doesn’t emphasize a similarity in how critics responded to it. Choice B is incorrect. The sentence cites a single critic’s response to Treuer’s book; it doesn’t emphasize a similarity in the responses of multiple critics. Choice D is incorrect. The sentence emphasizes a difference, not a similarity, in how two critics responded to Treuer’s book."},{"i":"efc19153","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Just like states have state flags, some cities have city flags. Over one hundred US cities have redesigned their flags since 2015. The city of Pocatello, Idaho, redesigned its flag after it was named the most poorly designed flag in North America. Pocatello’s new flag better represents the city’s mountainous geography and civic priorities. Residents consider the new flag to be a meaningful symbol of civic pride. The student wants to make and support a generalization about the effect of redesigning a city flag.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Over one hundred US cities have redesigned their flags, including Pocatello, whose flag had been named the most poorly designed flag in North America.","Pocatello is just one of over one hundred US cities that have redesigned their flags.","After it was named the most poorly designed flag in North America, the flag of Pocatello was redesigned to better represent the city’s geography and civic priorities.","Redesigning a poorly designed city flag can create a meaningful symbol of civic pride, as was the case when Pocatello redesigned its original flag to better represent its geography and civic priorities."],"a":3,"r":"Choice D is the best answer. The sentence makes and supports a generalization about the effect of redesigning a city flag, noting that redesigning a city flag can create a meaningful symbol of civic pride, as was the case when the city of Pocatello redesigned its flag. Choice A is incorrect because the sentence explains that many US cities have redesigned their flags and provides an example; it doesn’t make and support a generalization about the effect of redesigning a city flag. Choice B is incorrect because the sentence provides an example of a city that redesigned its flag; it doesn’t make and support a generalization about the effect of redesigning a city flag. Choice C is incorrect because the sentence emphasizes why the flag of Pocatello was redesigned; it doesn’t make and support a generalization about the effect of redesigning a city flag."},{"i":"f735493e","c":"trans","d":"E","s":"Celebrated Tewa potter Maria Martinez (1887–1980) made her signature all-black ceramic vessels using a heating technique called reduction firing. This technique involves smothering the flame surrounding the clay vessel. ______ the vessel takes on a shiny, black hue.\n\nWhich choice completes the text with the most logical transition?","o":["On the contrary,","For example,","Previously,","As a result,"],"a":3,"r":"Choice D is the best answer. \"As a result\" logically signals that the information in this sentence—the vessel turning black—is a result of the heating technique discussed in the previous sentence. Choice A is incorrect because \"on the contrary\" illogically signals that the information in this sentence directly opposes the heating technique in the previous sentence. Instead, the vessel turns black as a result of that technique. Choice B is incorrect because \"for example\" illogically signals that the information in this sentence is an example of the heating technique in the previous sentence. Instead, the vessel turns black as a result of that technique. Choice C is incorrect because \"previously\" illogically signals that the information in this sentence occurs earlier in a chronological series of events than does the heating technique discussed in the first two sentences. Instead, the vessel turns black as a result of that technique."},{"i":"176edca6","c":"trans","d":"H","s":"A 2017 study of sign language learners tested the role of iconicity—the similarity of a sign to the thing it represents—in language acquisition. The study found that the greater the iconicity of a sign, the more likely it was to have been learned. ______ the correlation between acquisition and iconicity was lower than that between acquisition and another factor studied: sign frequency.\n\nWhich choice completes the text with the most logical transition?","o":["In fact,","In other words,","Granted,","As a result,"],"a":2,"r":"Choice C is the best answer. “Granted” logically signals that the following information—that iconicity is not as highly correlated with acquisition as sign frequency—is true in spite of the information about the correlation between iconicity and acquisition in the previous sentence. Choice A is incorrect because “in fact” illogically signals that the sentence that follows either emphasizes or refutes the information in the previous sentence regarding the correlation between iconicity and acquisition. Instead, the sentence that follows provides additional information that is true in spite of the preceding information; it neither emphasizes nor refutes that information. Choice B is incorrect because “in other words” illogically signals that the sentence that follows is a restatement of the information in the previous sentence; instead, the sentence that follows provides additional information that is true in spite of the preceding information. Choice D is incorrect because “as a result” illogically signals that the sentence that follows is a result of the information in the previous sentence regarding the correlation between iconicity and acquisition; instead, the sentence that follows is true in spite of the preceding information."},{"i":"a40c7aa3","c":"trans","d":"M","s":"Most of the planets that have been discovered outside our solar system orbit G-type stars, like our Sun. In 2014, ______ researchers identified a planet orbiting KEL T -9, a B-type star more than twice as massive and nearly twice as hot as the Sun. Called KEL T -9b, it is one of the hottest planets ever discovered.\n\nWhich choice completes the text with the most logical transition?","o":["likewise,","however,","therefore,","for example,"],"a":1,"r":"Choice B is the best answer. The word “however” logically signals that the information in this sentence about the planet KEL T -9b—that it orbits a B-type star—contrasts with the previous information about planets discovered outside our solar system. Most of these planets orbit G-type stars, not B-type stars. Choice A is incorrect because “likewise” illogically signals that the information about the planet KEL T -9b is similar to the previous information about most planets outside our solar system. Instead, it contrasts with that information. Choice C is incorrect because “therefore” illogically signals that the information about the planet KEL T -9b is a result of the previous information about most planets outside our solar system. Instead, it contrasts with that information. Choice D is incorrect because “for example” illogically signals that the information about the planet KEL T -9b is an example of the previous information about most planets outside our solar system. Instead, it contrasts with that information."}],"img":{"627d93e3":"iVBORw0KGgoAAAANSUhEUgAAArwAAAJVBAMAAADO3zs6AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABVjklEQVR42u1dZ0BUR9d+5m5hqTsL9gIX0Bj7ihq7LpbERJMsllgT18QWTUHzxhYTMfaSBGuwRWyxK3bFtvaKrl2jyGJvsLNgB3a+H0tbRFA/UNT7/IBb5s7Ofe6ZM+ecaYAECRIkSJAgQYIECRIkSJAgQYIECRLeAtBX+NRbDEIBAZQABDUAgiIAAaDQAp5iaiKl6AcA1QHAX+tIZKHURJQW+/2Vl14o6PQ6h4KMFa0c4OgBcHwEcIAqDSDTf5lo59FJ2xYAegLoOGosBQFlae+n1NmZZmQSI5K4ZoHHaZBknf14DAC0sIumSzDImTIH7Tdc9Z6p9+UHAqpn1gDlqIs+TZKMkKQ3K1I2QLGdKbb2RYlzGrTYBwHFDlFhm4ECcRenoPcBKFbo0Yp8d4BaAdWmo1Hsm2Vin/10Mqbi5zGL1Z9EUqD8YX25UsGS9GaFaydtyU7a76tF4mCZm7JTriEtsKnIavdhXQwQ9
