<script>
const D={"t":"Practicetest21","q":[{"i":"e56b66e5","c":"vocab","d":"M","s":"Set in a world where science fiction tropes exist as everyday realities, Charles Yu’s 2010 novel How to Live Safely in a Science Fictional Universe traces a time traveler’s quest to find his father. Because the journey at the novel’s center is so ______, with the protagonist ricocheting chaotically across time, the reader often wonders whether the pair will ever be reunited.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["haphazard","premeditated","inspirational","fruitless"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Yu’s novel. In this context, “haphazard” means marked by a lack of plan or order. The text indicates that the quest featured in the novel, which involves the protagonist bouncing across time, is chaotic and causes the reader to often wonder what will happen. This context suggests that the protagonist’s journey seems to be marked by a lack of order. Choice B is incorrect because the text indicates that the journey featured in Yu’s novel involves a character “ricocheting chaotically,” or bouncing in a disordered way, across time and causes the reader to often wonder what will happen. It wouldn’t make sense to say that a chaotic journey seems “premeditated,” or characterized by forethought and planning. Choice C is incorrect because the text doesn’t give any indication that readers regard the journey in Yu’s novel as “inspirational,” or as causing extraordinarily creative or brilliant thoughts or actions; instead, the text focuses on the idea that the protagonist’s journey is chaotic, or disordered, and doesn’t give readers a clear sense of what will happen. Choice D is incorrect. Rather than suggesting that the journey featured in Yu’s novel is “fruitless,” or has an unsuccessful outcome, the text focuses on the idea that while reading about the protagonist’s chaotic movements across time, readers are often unsure of what will happen—that is, they don’t know whether the protagonist will be successful in finding his father."},{"i":"5fe53347","c":"vocab","d":"E","s":"Botanist Al Kovaleski has pointed out that maple trees already thrive in a wide variety of climates and thus may ______ changes in climate better than some other tree species do. The alterations maples may undergo in response to a changing climate are likely to be relatively small and easily achieved.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["relocate from","refer to","originate from","adapt to"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of how maple trees may respond to changes in climate. As used in this context, \"adapt to\" means to adjust to new conditions. The text first notes that maple trees already thrive in a wide variety of climates and then goes on to say that alterations maples may undergo are likely to be relatively small and easily achieved. This context supports the idea that maple trees will more easily adjust or adapt to a changing climate. Choice A is incorrect. Although the text discusses how maple trees adjust to change, the trees do not \"relocate from,\" or physically move from one place to another. Choice B is incorrect because \"refer to\" means to mention or allude to something, and the trees are not doing either of these actions. Choice C is incorrect because the text is discussing how maple trees may respond to changes in climate, not where they \"originate from,\" or came from originally."},{"i":"b0ea8c28","c":"vocab","d":"E","s":"Sueño de Familia is an exhibition of drawings, paintings, and ceramics that explores the artistic heritage of US-based artist Yolanda González. The exhibition ______ five generations, featuring works by González’s great-grandfather, grandmother, mother, and niece as well as González herself.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["borrows","spans","judges","neglects"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the Sueño de Familia art exhibition. In this context, “spans” means extends across or covers. The text states that the exhibition explores González’s artistic heritage and features artwork by her great-grandfather, grandmother, mother, and niece. This context conveys the idea that the exhibition spans, or extends across, five generations of González’s family. Choice A is incorrect because it wouldn’t make sense to say that the exhibition “borrows,” or acquires, five generations of González’s family. The text indicates that the exhibition features artwork by family members from five generations, not that the five generations themselves have been acquired for inclusion in the exhibition. Choice C is incorrect because the text indicates that the purpose of the exhibition is to highlight artwork, not to “judge,” or give an opinion on, five generations of the artist’s family. Choice D is incorrect because the text doesn’t suggest that the exhibition “neglects,” or gives little attention to, five generations of González’s family. On the contrary, the text indicates that the exhibition is dedicated to exploring González’s artistic heritage and therefore designed to bring attention to her family members and their artwork."},{"i":"2390e956","c":"vocab","d":"E","s":"Ronyoung Kim creatively captures the Korean American immigrant experience in her novel Clay Walls by writing about a family from three ______ perspectives. The first section of the novel is from the mother Haesu’s perspective, the second is from the father Chun’s perspective, and the last is from the daughter Faye’s perspective.\n\nWhich choice completes the text with the most logical and precise word?","o":["distinct","required","unintended","unknown"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Ronyoung Kim’s novel Clay Walls. In this context, \"distinct\" means clearly separate and different. The text indicates that the novel consists of three sections and that each section is narrated from the perspective of a different character. This context supports the idea that Kim’s novel features three distinct perspectives. Choice B is incorrect because describing the three perspectives in Kim’s novel as \"required,\" or demanded as necessary to be done or provided, wouldn’t make sense in context. When writing a novel, a novelist is free to choose to narrate the story from any number of perspectives. There’s nothing in the text to indicate that providing three perspectives was demanded of Kim. Instead, the text focuses on identifying the three different perspectives featured in Kim’s novel. Choice C is incorrect because describing the three perspectives in Kim’s novel as \"unintended,\" or not planned as a purpose or goal, wouldn’t make sense in context. Authors make deliberate choices about the perspectives they feature in their works, and the text indicates that Kim chose to incorporate three different perspectives in her novel. Choice D is incorrect because describing the three perspectives in Kim’s novel as \"unknown,\" or not revealed, wouldn’t make sense in context. The text directly identifies the three perspectives that appear in her novel as those of Faye and her two parents, Haesu and Chun, which indicates that the novel’s perspectives are in fact known."},{"i":"7a0e31ea","c":"purpose","d":"M","s":"The following text is from Betty Smith’s 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, visits the library often. Francie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in alphabetical order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B’s. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine architecture. For all her enthusiasm, she had to admit that some of the B’s had been hard going. But Francie was a reader. ©1947 by Betty Smith Which choice best states the main purpose of the text?","o":["To illustrate Francie’s enjoyment of an unusual topic","To explain why Francie prefers reading over other activities","To portray Francie’s determination to meet a goal","To describe a book that Francie greatly admires"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to portray Francie’s determination to reach her goal of reading all the books in the world. The text indicates that to achieve this aim, Francie works systematically and persistently: she reads all the books in the library in alphabetical order and devotes much time and effort to the project, finishing one book per day over a long period of time. The text then suggests that even though she progresses slowly (\"she was still in the B’s\") and that she struggled with some books (\"some of the B’s had been hard going\"), she doesn’t give up because she thinks of herself as \"a reader.\" These details show Francie’s resolve. Choice A is incorrect. Although the text mentions several topics (bees and buffaloes, Bermuda vacations, and Byzantine architecture) that Francie has read about, it doesn’t indicate that any of these topics are unusual or that she especially enjoyed reading about one of these topics in particular. If anything, the text suggests that she may have found some of these topics to be dull, saying that she even read the \"dry ones\"—that is, the boring books—and that some of the books were \"hard going,\" meaning they were difficult to get through. Choice B is incorrect because the text doesn’t discuss Francie’s involvement in other activities, only her dedication to reading. Although it’s possible that Francie dedicates herself to reading because she prefers it to other activities, the text doesn’t indicate whether this is the case. Choice D is incorrect. Although the text mentions one author (Abbott) whose book Francie has read as well as several topics (bees and buffaloes, Bermuda vacations, and Byzantine architecture) she has encountered, the text doesn’t say whether Francie admires any of the books she’s read so far. Instead, the text focuses on the time and effort she devotes to reaching her goal of reading all the books in the world—even ones she doesn’t enjoy."},{"i":"ff97fd53","c":"purpose","d":"M","s":"In 1973, poet Miguel Algarín started inviting other writers who, like him, were Nuyorican—a term for New Yorkers of Puerto Rican heritage—to gather in his apartment to present their work. The gatherings were so well attended that Algarín soon had to rent space in a cafe to accommodate them. Thus, the Nuyorican Poets Cafe was born. Moving to a permanent location in 1981, the Nuyorican Poets Cafe expanded its original scope beyond the written word, hosting art exhibitions and musical performances as well. Half a century since its inception, it continues to foster emerging Nuyorican talent.\n\nWhich choice best describes the overall purpose of the text?","o":["To explain what motivated Algarín to found the Nuyorican Poets Cafe","To situate the Nuyorican Poets Cafe within the cultural life of New York as a whole","To discuss why the Nuyorican Poets Cafe expanded its scope to include art and music","To provide an overview of the founding and mission of the Nuyorican Poets Cafe"],"a":3,"r":"Choice D is the best answer. The text presents a brief history of the Nuyorican Poets Cafe, from how it got started in the ’70s, to its expansion in the ’80s, to its ongoing mission today. Choice A is incorrect. This isn’t the overall purpose. The text never mentions Algarín’s motivations. Choice B is incorrect. This isn’t the overall purpose. The text never discusses the cultural life of New York as a whole. Choice C is incorrect. This is too narrow. One sentence mentions that the Nuyorican Poets Cafe expanded its scope to include art and music, but this is only one point in the broader history of the Nuyorican Poets Cafe, which is the overall focus of the text."},{"i":"271a5017","c":"func","d":"E","s":"The following text is adapted from Akwaeke Emezi’s 2019 novel Pet. Jam is a teenager who lives with her father, Aloe, and her mother, Bitter, who is a painter. Bitter finished the painting in the dark morning of a day—it was well past midnight when Jam heard the studio door creak open. She stared into the velvet black of her room and listened to her mother’s footsteps walking in her [mother] and Aloe’s bedroom. There was a weight thrumming through the floorboards in a low song, and that was how Jam knew the painting was done. <u>Bitter’s feet were singing the news.<\/u> ©2019 by Akwaeke Emezi Which choice best states the function of the underlined sentence in the text as a whole?","o":["It indicates that Jam is more interested in music than in art.","It adds to the idea that Bitter’s footsteps reveal something to Jam.","It indicates that Bitter always sings when working on a painting.","It describes Aloe’s reaction upon seeing the painting for the first time."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The text establishes that Jam hears Bitter’s studio door open early in the morning, when it is still dark. Jam then listens to her mother’s footsteps, which seem to create a song that runs through the floorboards. The text indicates that the sound of Bitter’s footsteps convey to Jam that Bitter is done painting. The underlined sentence then builds on this idea, stating explicitly that Bitter’s feet sing the news of her completion of a painting. Thus, the sentence stating that “Bitter’s feet were singing the news” further emphasizes that Bitter’s footsteps themselves reveal information to Jam. Choice A is incorrect because the text provides no evidence that Jam prefers music to art. While the underlined sentence uses musical imagery to describe the vibrations Jam feels, this is figurative language that is describing the footsteps’ vibrations; it isn’t an indication of Jam’s personal interests. Choice C is incorrect because the text doesn’t suggest that Bitter herself sings while working on paintings. The references to singing in the text are figurative descriptions of how Bitter’s footsteps sound or feel to Jam, not literal statements about Bitter singing. Choice D is incorrect because the underlined sentence only describes Jam’s perception of her mother’s footsteps. It doesn’t provide any details about Aloe or his reaction to the painting; in fact, the text doesn’t mention Aloe seeing the painting at all."},{"i":"2e744883","c":"func","d":"H","s":"Historians have argued that a crucial component of the Civil Rights Movement’s success in the 1960s was the Southern Christian Leadership Conference’s Citizen Education Program (CEP), which invited promising activists from across the South to its one-week training sessions in Dorchester, Georgia. Led by experienced organizers such as Dorothy Cotton and Septima Clark, CEP attendees<u>—more than 7,000 in all—<\/u> participated in workshops on topics ranging from public speaking to legal doctrine before returning home and using their newly acquired knowledge to spearhead local civil rights initiatives.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It underscores the extent of the CEP’s impact on the Civil Rights Movement of the 1960s.","It illustrates the CEP organizers’ efforts to educate participants on a wide variety of topics.","It suggests that CEP attendees held a diverse array of opinions about the Southern Christian Leadership Conference’s political philosophy.","It establishes that criticism of the CEP was limited to a few individuals in the Southern Christian Leadership Conference."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first sentence of the text states that the CEP had a positive impact on the Civil Rights Movement in the 1960s. The next sentence explains that the CEP organized workshops for attendees, who later used the knowledge they gained to lead civil rights initiatives. And the underlined portion indicates the number of activists—more than 7,000—who participated in the workshops. Thus, the underlined portion provides a number that underscores the extent of the CEP’s impact on the Civil Rights Movement in the 1960s. Choice B is incorrect. Although the sentence that contains the underlined portion mentions some CEP workshop topics, the underlined portion itself addresses the number of participants in the CEP workshops, not the number of topics covered. Choice C is incorrect. Although the underlined portion refers to attendees of the CEP workshops, nothing in the underlined portion or the text as a whole addresses the Southern Christian Leadership Conference’s philosophy or the attendees’ opinions thereof. Choice D is incorrect because neither the underlined portion nor the text as a whole mentions any criticism of the CEP by members of the Southern Christian Leadership Conference."},{"i":"5e101c70","c":"cross","d":"H","s":"Text 1 Most animals can regenerate some parts of their bodies, such as skin. But when a three-banded panther worm is cut into three pieces, each piece grows into a new worm. Researchers are investigating this feat partly to learn more about humans’ comparatively limited abilities to regenerate, and they’re making exciting progress. An especially promising discovery is that both humans and panther worms have a gene for early growth response (EGR) linked to regeneration.\n\nText 2 When Mansi Srivastava and her team reported that panther worms, like humans, possess a gene for EGR, it caused excitement. However, as the team pointed out, the gene likely functions very differently in humans than it does in panther worms. Srivastava has likened EGR to a switch that activates other genes involved in regeneration in panther worms, but how this switch operates in humans remains unclear.\n\nBased on the texts, what would the author of\n\nText 2 most likely say about\n\nText 1’s characterization of the discovery involving EGR?","o":["It is reasonable given that Srivastava and her team have identified how EGR functions in both humans and panther worms.","It is overly optimistic given additional observations from Srivastava and her team.","It is unexpected given that Srivastava and her team’s findings were generally met with enthusiasm.","It is unfairly dismissive given the progress that Srivastava and her team have reported."],"a":1,"r":"Choice B is the best answer because it reflects how the author of Text 2 would most likely respond to Text 1 based on the information provided. Text 1 discusses the discovery of a regeneration-linked gene, EGR, in both three-banded panther worms (which are capable of full regeneration) and humans (who have relatively limited regeneration abilities). Text 1 characterizes this discovery as “especially promising” and a sign of “exciting progress” in understanding human regeneration. The author of Text 2, on the other hand, focuses on the fact that the team that reported the EGR finding pointed out that while EGR’s function in humans isn’t yet known, it’s likely very different from its function in panther worms. Therefore, the author of Text 2 would most likely say that Text 1’s enthusiasm about the EGR discovery is overly optimistic given Srivastava’s team’s observations about EGR in humans. Choice A is incorrect because the author of Text 2 explains that Srivastava and her team explicitly reported that they haven’t yet identified how EGR functions in humans; therefore, the author of Text 2 wouldn’t say that Text 1’s excitement is reasonable for the stated reason. Instead, the author of Text 2 would likely characterize Text 1’s excitement as premature and overly optimistic. Choice C is incorrect because Text 1 does treat Srivastava’s team’s findings with enthusiasm; it describes the discovery of EGR in both three-banded panther worms and humans as promising and exciting. It would be illogical for the author of Text 2 to say that because most others treat the discovery with enthusiasm, Text 1’s enthusiastic characterization of the discovery is unexpected. Choice D is incorrect because Text 1 isn’t at all dismissive of Srivastava’s team’s findings; instead, Text 1 is optimistic about the EGR discovery, characterizing it as promising and exciting. There’s nothing in Text 2 to suggest that the author of Text 2 would say that Text 1’s praise for the discovery is dismissive, or disdainful."},{"i":"881ba6f1","c":"main","d":"H","s":"Eighteenth-century economist Adam Smith is famed for his metaphor of the invisible hand, which he putatively used to illustrate a robust model of how individuals produce aggregate benefits by pursuing their own economic interests. Note “putatively”: as Gavin Kennedy has shown, Smith deploys this metaphor only once in his economic writings—to make a narrow point about the then-dominant economic theory of mercantilism— and it was largely ignored until some twentieth-century economists eager to secure an intellectual pedigree for their views elevated it to a fully- fledged paradigm.\n\nWhich choice best states the main idea of the text?","o":["Although Smith is famed for his metaphor of the invisible hand, the metaphor was largely ignored until economists in the twentieth century came to realize that the metaphor was a robust model that anticipated their own views.","Some twentieth-century economists gave Smith’s metaphor of the invisible hand a significance it does not have in Smith’s work, but it is nevertheless a useful model of how individuals produce aggregate benefits by pursuing their own economic interests.","Smith’s metaphor of the invisible hand has been interpreted as a model of how individuals acting in their own interest produce aggregate benefits, but it was intended as a subtle critique of the economic theory of mercantilism.","The reputation of Smith’s metaphor of the invisible hand is not due to the importance of the metaphor in Smith’s work but rather to the promotion of the metaphor by some later economists for their own ends."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text explains that economist Adam Smith’s famous metaphor of the invisible hand was putatively (that is, widely assumed but not proven) intended to illustrate a robust model (a consistently accurate generalization) of how individuals pursuing their own economic interests can create broader benefits for the population. The text then emphasizes the lack of affirmative evidence for this idea by calling out the term \"putatively,\" and explaining that, according to Gavin Kennedy, Smith used the metaphor only once in his works, in reference to specific circumstances related to the now-outdated economic view known as mercantilism, and that the metaphor didn’t garner much attention until economists in the twentieth century held it up as a paradigm (a theoretical framework in the field) and thereby implied that Smith shared some of their views on economics. By emphasizing \"putatively,\" the text implies that there is no independent reason to believe that Smith would agree with the metaphor’s use outside of the specific context for which he wrote it and that, therefore, the twentieth-century economists who used it did so to support their own views without regard for the metaphor’s importance to Smith’s work. Choice A is incorrect. Although the text indicates that Smith’s metaphor was largely ignored until some twentieth-century economists revived it and bolstered its status, the text suggests that the later economists used Smith’s metaphor to self-servingly boost their own work while ignoring the original context in which Smith wrote it. Moreover, the statement in this choice fails to reflect the text’s emphasis on Smith’s limited use of the metaphor in his work. Choice B is incorrect. Although the text indicates that some twentieth-century economists altered the significance of Smith’s metaphor, the text doesn’t suggest that the metaphor is a \"useful model\" of how aggregate benefits arise from individuals’ selfish actions, let alone that this usefulness is unaffected by taking the metaphor out of its original context. Choice C is incorrect. Although the text indicates that Smith’s metaphor was intended as a model of how individuals acting in their own interest produce aggregate benefits and it was written within the context of the now-outdated economic theory of mercantilism, these points are subordinate to the primary idea in the text, which is that Smith’s use of the metaphor was tightly constrained but twentieth-century economists ignored the original context so that they could use the metaphor to suggest, without support, that Smith would agree with their economic views."},{"i":"41d5c33e","c":"main","d":"E","s":"The following text is from Beatrice Harraden’s 1894 novel Ships that Pass in the Night. In an old second-hand bookshop in London, an old man sat reading Gibbon’s History of Rome. He did not put down his book when the postman brought him a letter. He just glanced indifferently at the letter, and impatiently at the postman. Zerviah Holme did not like to be interrupted when he was reading Gibbon; and as he was always reading Gibbon, an interruption was always regarded by him as an insult.\n\nBased on the text, how did Zerviah Holme most likely feel when the letter was delivered?","o":["He felt relieved because he had been expecting an important letter.","He felt excited because the letter was from a good friend.","He felt sad because the postman did not stop to talk with him before leaving.","He felt annoyed because he was interrupted while reading his favorite author."],"a":3,"r":"Choice D is the best answer because it presents a description of how Zerviah Holme felt that is directly supported by the text. The text states that Holme \"did not like to be interrupted\" while reading Gibbon and that he considered interruptions to be \"an insult.\" Furthermore, the text suggests that Gibbon is Holme’s favorite author because, as the text states, \"he was always reading Gibbon.\" Thus, Holme would have felt annoyed at having been interrupted when the letter was delivered. Choice A is incorrect because the text doesn’t suggest that Holme is relieved to receive the letter. Instead, the text states that Holme \"just glanced indifferently at the letter,\" suggesting that the letter wasn’t important to him. Choice B is incorrect because the text doesn’t suggest that Holme is excited to receive the letter. Instead, the text states that Holme didn’t put down his book to receive the letter and that he looked at the letter \"indifferently\" and at the postman \"impatiently.\" This suggests that Holme isn’t excited. Also, there is no mention that Holme knows who sent the letter. Choice C is incorrect because the text doesn’t indicate that Holme is sad or that he wants to speak with the postman. Instead, the text describes Holme as looking \"impatiently at the postman,\" which suggests that he wants the postman to leave."},{"i":"ce4448b7","c":"infer","d":"H","s":"Researchers recently found that disruptions to an enjoyable experience, like a short series of advertisements during a television show, often increase viewers’ reported enjoyment. Suspecting that disruptions to an unpleasant experience would have the opposite effect, the researchers had participants listen to construction noise for 30 minutes and anticipated that those whose listening experience was frequently interrupted with short breaks of silence would thus ______ Which choice most logically completes the text?","o":["find the disruptions more irritating as time went on.","rate the listening experience as more negative than those whose listening experience was uninterrupted.","rate the experience of listening to construction noise as lasting for less time than it actually lasted.","perceive the volume of the construction noise as growing softer over time."],"a":1,"r":"Choice B is the best answer. It most logically completes the text. The text tells us that disruptions to an enjoyable experience increase viewers’ enjoyment. It also says that researchers suspect the opposite is true for disruptions to an unpleasant experience. Thus, we can infer that the researchers expect to find that the interrupted unpleasant experience was worse for listeners than the uninterrupted unpleasant experience. Choice A is incorrect. It doesn’t logically complete the text. The text never makes any claims about how irritating the disruptions themselves are perceived to be. Rather, the text says that pleasant experiences are perceived as more enjoyable with interruptions, and that the opposite is suspected to be true of unpleasant experiences. Choice C is incorrect. It doesn’t logically complete the text. The text never makes any claims about how long any experience is perceived to be. Rather, the text says that pleasant experiences are perceived as more enjoyable with interruptions, and that the opposite is suspected to be true of unpleasant experiences. Choice D is incorrect. It doesn’t logically complete the text. The text never makes any claims about how interruptions affect the perceived volume of the unpleasant or pleasant experience. Rather, the text says that pleasant experiences are perceived as more enjoyable with interruptions, and that the opposite is suspected to be true of unpleasant experiences."},{"i":"7ae8065c","c":"infer","d":"M","s":"Scholars are increasingly exploring the communication and preservation of ecological knowledge through Indigenous songs (e.g., Sakha songs about local ecosystems and those of the Kaluli people about rainforest sounds). In one study, ethnobiologist Dana Lepofsky et al. received insight from Kwaxsistalla Wathl’thla, a song keeper for the Kwakwaka’wakw people in Canada, into songs referencing the people’s use of terraced gardens in intertidal zones along the Pacific Northwest coast for the cultivation of clams for consumption. Archaeological evidence of significant increases in clam size and abundance in that area concurrent with the documented past implementation of the method described in the songs supports the conclusion that ______ Which choice most logically completes the text?","o":["the practice used by ancestors of modern Kwakwaka’wakw people not only effectively maintained a food source but also promoted its robustness.","non-Indigenous people around the Pacific Northwest coast adopted the practice developed by the Kwakwaka’wakw people after observing its efficacy.","there is greater corroboration in the archaeological record of ecological practices described in Kwakwaka’wakw songs than of those described in Sakha and Kaluli songs.","although contemporary Kwakwaka’wakw people have a deep understanding of and appreciation for the fishing and farming practices used by their ancestors, they no longer implement those methods."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the use of songs by the Kwakwaka’wakw people to record and communicate ecological knowledge. The text indicates that some songs of the Kwakwaka’wakw people of Canada’s Pacific Northwest region document how the people used terraced gardens in intertidal zones to cultivate clams for food. The text also explains that archaeological evidence shows increases in \"clam size and abundance\" that occurred along with the implementation of this cultivation method, suggesting the method’s efficacy in not just supporting clam yields but also improving them. It follows, then, that the use of intertidal terraced gardens, as described in the songs, allowed the ancestors of modern Kwakwaka’wakw people to maintain clams as a food source and to cultivate larger and more numerous clams. Choice B is incorrect because the text doesn’t mention anything about cultivation practices among non-Indigenous people in the Pacific Northwest coastal region. Though the text conveys that archaeological evidence suggests that the clam cultivation practice mentioned in Kwakwaka’wakw people’s songs was efficacious when implemented, it gives no indication that people other than the Kwakwaka’wakw adopted that practice. Choice C is incorrect because the text provides no information about the archaeological record as it pertains to Sakha and Kaluli songs and doesn’t suggest that there is less corroboration of practices described in those songs than there is of the clam cultivation practice described in Kwakwaka’wakw songs. The Sakha and Kaluli songs are mentioned early in the text only as examples of Indigenous songs that contain ecological knowledge. Choice D is incorrect because archaeological evidence that clam size and abundance both increased when Kwakwaka’wakw ancestors implemented intertidal terraced gardens provides information only about the past use of that method and doesn’t suggest anything about present practices. The text indicates that knowledge of a past clam cultivation method is maintained in Kwakwaka’wakw songs but doesn’t indicate whether modern Kwakwaka’wakw people use that or other fishing and farming practices used by their ancestors."},{"i":"fbb84fb0","c":"claim","d":"M","s":"Hedda Gabler is an 1890 play by Henrik Ibsen. As a woman in the Victorian era, Hedda, the play’s central character, is unable to freely determine her own future. Instead, she seeks to influence another person’s fate, as is evident when she says to another character, ______ Which quotation from a translation of Hedda Gabler most effectively illustrates the claim?","o":["“Then what in heaven’s name would you have me do with myself?”","“I want for once in my life to have power to mould a human destiny.”","“Then I, poor creature, have no sort of power over you?”","“Faithful to your principles, now and for ever! Ah, that is how a man should be!”"],"a":1,"r":"Choice B is the best answer because it most effectively illustrates the claim in the text that Hedda seeks to influence another character’s fate. In the quotation, Hedda says that she wants “to have power to mould a human destiny,” or shape a person’s fate, just as the text indicates. Additionally, the phrase “for once in my life” suggests that Hedda feels that she has never been able to shape anyone’s life, including her own, supporting the text’s assertion that she “is unable to freely determine her own future.” Choice A is incorrect because this quotation shows Hedda being uncertain about what to do with her own life, not wanting to influence another person’s fate. Choice C is incorrect because while this quotation shows Hedda’s interest in finding out whether she has any power over another character, it doesn’t clearly show that she wants to influence that person’s fate. In this quotation, Hedda seems to have inferred or concluded (“then”) that she doesn’t have any influence over the person to whom she’s speaking, and she’s asking that person to confirm her lack of influence. Choice D is incorrect because this quotation expresses Hedda’s belief that a man should be true to his principles, not her desire to influence another person’s fate."},{"i":"5b74feb9","c":"claim","d":"H","s":"Political scientists who favor the traditional view of voter behavior claim that voting in an election does not change a voter’s attitude toward the candidates in that election. Focusing on each US presidential election from 1976 to 1996, Ebonya Washington and Sendhil Mullainathan tested this claim by distinguishing between subjects who had just become old enough to vote (around half of whom actually voted) and otherwise similar subjects who were slightly too young to vote (and thus none of whom voted). Washington and Mullainathan compared the attitudes of the groups of subjects toward the winning candidate two years after each election.\n\nWhich finding from Washington and Mullainathan’s study, if true, would most directly weaken the claim made by people who favor the traditional view of voter behavior?","o":["Subjects’ attitudes toward the winning candidate two years after a given election were strongly predicted by subjects’ general political orientation, regardless of whether subjects were old enough to vote at the time of the election.","Subjects who were not old enough to vote in a given election held significantly more positive attitudes towards the winning candidate two years later than they held at the time of the election.","Subjects who voted in a given election held significantly more polarized attitudes toward the winning candidate two years later than did subjects who were not old enough to vote in that election.","Two years after a given election, subjects who voted and subjects who were not old enough to vote were significantly more likely to express negative attitudes than positive attitudes toward the winning candidate in that election."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would weaken the claim made by people who favor the traditional view of voter behavior. According to the text, people who favor that view believe that voting in an election doesn’t change a voter’s attitude toward the candidates in that election. If Washington and Mullainathan found that two years after an election, attitudes toward the winning candidate were significantly more polarized among subjects who had voted than among subjects who had been too young to vote, that would suggest that the act of voting did have an effect on the voters’ attitudes toward the candidates, which would undermine the claim that voting doesn’t change voters’ attitudes. Choice A is incorrect because a finding about links between subjects’ attitudes and general political orientation, regardless of age and ability to vote, wouldn’t address the presence or absence of changes in attitudes among those subjects who did actually vote. Therefore, the finding wouldn’t have any bearing on the claim that voting in an election doesn’t change a voter’s attitude toward the candidates in that election. Choice B is incorrect because a finding that positive attitudes toward a winning candidate significantly increased in the two years after the election among subjects who had been too young to vote would involve only people who didn’t vote; therefore, the finding wouldn’t have any bearing on the claim that when people do vote, the act of voting doesn’t change their attitudes toward the candidates. Choice D is incorrect because the finding that subjects in both groups were more likely to have negative attitudes than positive attitudes toward the winning candidate two years after an election would reflect all subjects’ attitudes at one particular time whether they voted or not, rather than the presence or absence of a change in voters’ attitudes after voting. Therefore, the finding would neither weaken nor strengthen the claim that voting in an election doesn’t change a voter’s attitude toward the candidates."},{"i":"3233c162","c":"graph","d":"H","s":"","o":["a substantial increase in oxygenation in the Alboran Sea corresponded with the local decline in L. pertusa, but the opposite relationship between oxygenation and L. pertusa was found near the Mauritanian coast.","L. pertusa declined in the Alboran Sea during a period of substantial local decline in oxygenation, but L. pertusa declined near the Mauritanian coast during a period of little local change in oxygenation.","oxygenation in the Alboran Sea was higher before the decline in L. pertusa than after the decline, whereas oxygenation near the Mauritanian coast was relatively low both before and after the decline in L. pertusa.","oxygenation in the Alboran Sea tended to be substantially higher than oxygenation near the Mauritanian coast during the period studied."],"a":1,"r":"Choice B is the best answer because it effectively uses data from the graph to complete the statement about Rodrigo da Costa Portilho-Ramos and colleagues’ conclusion. The graph shows the ratio of manganese to calcium in L. pertusa coral samples from the Alboran Sea and the Mauritanian coast. The graph reflects time in approximate years before present: in other words, the greater the number in years noted on the graph’s horizontal axis, the farther that moment is in the past. The text indicates that the researchers tested the samples to determine whether oxygenation played a role in the decline of L. pertusa. The text goes on to note that a change in the ratio of manganese to calcium would signal an inverse, or opposite, change in oxygenation. According to the graph, the ratio of manganese to calcium in samples from the Alboran Sea increased from about 30 micromoles per mole 10,000 years ago to about 80 micromoles per mole 8,000 years ago, which means that oxygenation decreased between 10,000 and 8,000 years ago. Meanwhile, there was almost no discernible change in the ratio of manganese to calcium in samples from the Mauritanian coast between 12,000 and 10,000 years ago. According to the text, the population of L. pertusa declined significantly around 9,000 years ago in the Alboran Sea and around 11,000 years ago near the Mauritanian coast. Thus, the increase in the ratio of manganese to calcium around 9,000 years ago in the Alboran Sea coincides with the decline in the L. pertusa population, suggesting an association between the decrease in oxygenation and the decline in population of the coral. No such relationship is suggested around 11,000 years ago near the Mauritanian coast. So, oxygenation likely played a role in the L. pertusa decline in the Alboran Sea but not in the coral’s decline near the Mauritanian coast. Choice A is incorrect because it asserts the opposite of what the graph indicates regarding oxygenation in the Alboran Sea, and it misrepresents what the graph indicates about oxygenation near the Mauritanian coast. The graph indicates that at the time of the decline in L. pertusa (approximately 9,000 years ago), the samples from the Alboran Sea contained a ratio of manganese to calcium that was increasing. According to the text, this ratio inversely correlates with ocean oxygenation levels, so if the ratio was increasing, oxygenation was decreasing, not substantially increasing. Furthermore, the graph shows that the ratio of manganese to calcium remained relatively stable in coral samples from the Mauritanian coast during the period studied, which suggests that there was no discernible relationship between oxygenation and the coral’s population decline in that location, not that there was a substantial decrease in oxygenation corresponding to the coral’s decline. Choice C is incorrect. Although the graph suggests that the level of oxygenation in the Alboran Sea was higher before the decline in L. pertusa than after— because the ratio of manganese to calcium inversely correlates with ocean oxygenation levels and this ratio was lower before the decline than after—the graph doesn’t support the claim that oxygenation near the Mauritanian coast was consistently low before and after the coral’s decline there. Rather, the graph indicates that relative to coral samples from the Alboran Sea, the ratio of manganese to calcium in samples from near the Mauritanian coast was consistently low, which suggests that oxygenation levels were relatively high both before and after the decline of L. pertusa. Choice D is incorrect because it states the opposite of what the graph indicates: the graph shows that throughout the period studied, the ratio of manganese to calcium was higher in coral samples from the Alboran Sea than it was in samples from near the Mauritanian coast. Since the text indicates that the ratio of manganese to calcium inversely correlates with ocean oxygenation levels, oxygenation in the Alboran Sea was therefore lower than, not higher than, oxygenation near the Mauritanian coast during the period studied. Moreover, even if choice D did accurately represent the graph, it wouldn’t effectively complete the statement since a comparison of the ocean oxygenation levels at the two locations is not relevant to the claim that a decline in oxygenation levels was associated with the decline of L. pertusa in the Alboran Sea but not near the Mauritanian coast."},{"i":"01c1d9ee","c":"graph","d":"H","s":"","o":["Tanzania has approximately 61 million Swahili speakers, which is much more than the estimated total number of people worldwide for whom Swahili is their first language.","Tanzania is estimated to have at most 15 million Swahili speakers, while the country’s total population is approximately 61 million people.","Approximately 100 percent of the people who speak Swahili as their first language live in Kenya, which has a total population of approximately 55 million people.","Approximately 100 percent of Kenya’s population speaks Swahili, while only about 25 percent of the Democratic Republic of the Congo’s population speaks Swahili."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to support the underlined claim. The text indicates that Swahili is the first language of up to 15 million people worldwide. The text goes on to claim, in the underlined portion, that even in countries where nearly everyone speaks Swahili, many of the language’s speakers don’t have Swahili as their first language. The table indicates that 61 million people in Tanzania, which amounts to 100 percent of the population, speak Swahili. If 61 million people in Tanzania speak Swahili, but only 15 million people worldwide have Swahili as their first language, that means there are many people in Tanzania who speak Swahili as a language other than their first language. This information about Swahili speakers in Tanzania therefore supports the claim that many Swahili speakers in countries where nearly everyone speaks Swahili speak it as a language other than their first language (such as their second, third, or fourth language). Choice B is incorrect because it doesn’t accurately describe information in the table. According to the table, Tanzania has 61 million Swahili speakers, not at most 15 million Swahili speakers. Additionally, the table indicates that 100 percent of Tanzania’s population speak Swahili, which means that the number of Swahili speakers in the country and the country’s total population should be the same, not that they should differ by such a large amount. Choice C is incorrect because there’s no information in the table or the text that indicates where people who speak Swahili as their first language live. Although Kenya’s total population can be inferred from the table—if Kenya has 55 million Swahili speakers and 100% of Kenya’s population speak Swahili, then Kenya must have a population of 55 million people—nothing suggests that all the people who speak Swahili as their first language live in a single country, let alone that they all live in Kenya. Choice D is incorrect. Although the table does indicate that 100 percent of Kenya’s population and 25 percent of the Democratic Republic of the Congo’s population speak Swahili, this comparison is irrelevant to the claim that Swahili isn’t the first language of many of its speakers even in countries where almost everyone speaks Swahili. On its own, a difference in the proportions of the population who speak Swahili cannot reveal whether those Swahili speakers have Swahili as their first language or a subsequent language."},{"i":"29c9be28","c":"fss","d":"E","s":"To survive when water is scarce, embryos inside African turquoise killifish eggs ______ a dormant state known as diapause. In this state, embryonic development is paused for as long as two years—longer than the life span of an adult killifish.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["enter","to enter","having entered","entering"],"a":0,"r":"Choice A is the best answer. The convention being tested is finite and nonfinite verb forms within a sentence. A main clause requires a finite verb to perform the action of the subject (in this case, “embryos”), and this choice supplies the clause with the finite present tense verb “enter” to indicate how the embryos achieve diapause. Choice B is incorrect because the nonfinite to-infinitive “to enter” doesn’t supply the main clause with a finite verb. Choice C is incorrect because the nonfinite participle “having entered” doesn’t supply the main clause with a finite verb. Choice D is incorrect because the nonfinite participle “entering” doesn’t supply the main clause with a finite verb."},{"i":"b5b74c3f","c":"fss","d":"E","s":"When writing The Other Black Girl (2021), novelist Zakiya Dalila Harris drew on her own experiences working at a publishing office. The award- winning book is Harris’s first novel, but her writing ______ honored before. At the age of twelve, she entered a contest to have a story published in American Girl magazine—and won.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["were","have been","has been","are"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb “has been” agrees in number with the singular subject “writing.” Choice A is incorrect because the plural verb “were” doesn’t agree in number with the singular subject “writing.” Choice B is incorrect because the plural verb “have been” doesn’t agree in number with the singular subject “writing.” Choice D is incorrect because the plural verb “are” doesn’t agree in number with the singular subject “writing.”"},{"i":"1448f43f","c":"fss","d":"E","s":"Unsupervised machine learning is an approach that computer scientists like Nina Miolane use to engineer artificial intelligence technologies. It involves training computer algorithms to organize unlabeled data sets. Multitask learning is another approach. ______ involves training computer models to perform multiple tasks at the same time.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Those","They","It","Some"],"a":2,"r":"Choice C is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"multitask learning\" and clearly indicates what multitask learning involves. Choice A is incorrect because the plural demonstrative pronoun \"those\" doesn’t agree in number with the singular antecedent \"multitask learning.\" Choice B is incorrect because the plural pronoun \"they\" doesn’t agree in number with the singular antecedent \"multitask learning.\" Choice D is incorrect because the indefinite pronoun \"some\" is ambiguous in this context; the resulting sentence leaves unclear what exactly \"involves training computer models.\""},{"i":"870ae7ec","c":"bound","d":"M","s":"Detroit natives Timothy Paule and Nicole Lindsey have combined their two passions, Detroit and beekeeping, to improve the health of their city’s flowers and other vegetation. In 2017, the couple converted a vacant lot in the city into an ______ in the years that followed they acquired nine additional lots and established more than 35 hives.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["apiary,","apiary, and","apiary and","apiary"],"a":1,"r":"Choice B is the best answer. Both clauses in this sentence could stand alone as complete sentences, which means they are both independent clauses. This choice uses a comma plus a coordinating conjunction to link them together, which is one of the correct ways to link two independent clauses. Choice A is incorrect. This choice results in a run-on sentence error. Both clauses in this sentence could stand alone as complete sentences, which means they are both independent clauses. A comma by itself is not enough punctuation to link two independent clauses. Choice C is incorrect. This choice results in a run-on sentence error. Both clauses in this sentence could stand alone as complete sentences, which means they are both independent clauses. Independent clauses can only be linked in a few ways, including with a comma plus a coordinating conjunction. This choice uses the coordinating conjunction “and,” but it is missing the comma beforehand. Choice D is incorrect. This choice results in a run-on sentence error. Both clauses in this sentence could stand alone as complete sentences, which means they are both independent clauses. Independent clauses need to have certain kinds of punctuation marks between them. This choice doesn’t use any punctuation between the two clauses."},{"i":"78e978b5","c":"bound","d":"H","s":"The Organisation for Economic Co-operation and Development (OECD) tracks comparative price list data for its thirty-eight member countries. For instance, in July 2021, a hypothetical basket of goods priced at 100 US dollars (USD) in the United States would have cost 62 USD and 110 USD in fellow OECD ______ and Luxembourg, respectively.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["nations, Chile","nations; Chile","nations: Chile","nations Chile"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed to set off the coordinated noun phrase \"Chile and Luxembourg\" from the title that describes the two countries, \"fellow OECD nations.\" Because the proper nouns \"Chile and Luxembourg\" are essential information identifying the \"fellow OECD nations,\" no punctuation is necessary. Choice A is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Further, setting the countries’ names off with commas suggests that they could be removed without affecting the coherence of the sentence, which isn’t the case. Choice B is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Choice C is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Placing a colon after \"nations\" would confusingly suggest that these were the costs of the basket of goods for \"fellow OECD nations\" in general, not for Chile and Luxembourg specifically."},{"i":"1792fa73","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The tundra is a type of environment characterized by especially harsh winter conditions. Winter temperatures in the tundra average a frigid −30 degrees Fahrenheit. Animals that have adapted to these conditions can survive tundra winters. During the tundra’s short growing season, average temperatures can reach a relatively mild 54 degrees Fahrenheit. Around 1,700 different kinds of plants are able to grow in the tundra. The student wants to emphasize how harsh the conditions can be in the tundra.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Winters in the tundra are especially harsh, with temperatures averaging a frigid −30 degrees Fahrenheit.","Animals that have adapted to harsh winter conditions can survive tundra winters.","There are around 1,700 different kinds of plants that can live in the tundra, where average temperatures can reach a mild 54 degrees Fahrenheit.","Along with animals that have adapted to the tundra’s conditions, around 1,700 different kinds of plants can live in the tundra."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes how harsh the conditions in the tundra can be, noting that the winters are especially harsh and describing the average temperatures as “frigid.” Choice B is incorrect because the sentence explains that some animals can survive harsh tundra winters; it doesn’t emphasize how harsh the conditions can be. Choice C is incorrect because the sentence specifies how many different kinds of plants can live in the tundra; it doesn’t emphasize how harsh the conditions in the tundra can be. Choice D is incorrect because the sentence explains that both plants and animals can survive in the tundra; it doesn’t emphasize how harsh the conditions in the tundra can be."},{"i":"883493d5","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Allan Houser was a Chiricahua Warm Springs Apache sculptor, illustrator, and painter. Many of his sculptures featured Native American figures. He depicted this subject matter using abstract, modernist forms, developing a distinctive style that influenced many other artists. His well-known sculpture Sacred Rain Arrow was pictured on the State of Oklahoma license plate. The student wants to describe the distinctive style of Houser’s sculptures.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["A sculptor, illustrator, and painter, Houser developed a distinctive style for portraying Native American figures.","Houser’s sculptures employ abstract, modernist forms to depict Native American figures.","Many other artists have been influenced by the style of Houser’s sculptures.","The sculpture Sacred Rain Arrow is a well-known example of Houser’s style."],"a":1,"r":"Choice B is the best answer. The sentence describes the distinctive style of Houser’s sculptures, explaining that the sculptures use abstract, modernist forms to depict Native American figures. Choice A is incorrect. While the sentence indicates that Houser developed a distinctive style for portraying Native American figures, it doesn’t describe this style. Choice C is incorrect. While the sentence states that other artists have been influenced by the style of Houser’s sculptures, it doesn’t describe this style. Choice D is incorrect. While the sentence mentions the name of a sculpture that’s a well-known example of Houser’s style, it doesn’t describe the sculpture’s style."},{"i":"0fd4df40","c":"trans","d":"E","s":"The Alaska Native Language Archive (ANLA) is known for its impressive audio collection. ______ the ANLA has more than 5,000 audio recordings of Native Alaskan languages dating as far back as 1943.\n\nWhich choice completes the text with the most logical transition?","o":["In fact,","After,","Regardless,","Instead,"],"a":0,"r":"Choice A is the best answer. \"In fact\" logically signals that the information in this sentence about the large number of recordings in ANLA’s collection emphasizes and supports the previous claim that ANLA is known for its impressive audio collection. Choice B is incorrect because \"after\" illogically signals that the information in this sentence occurs later in a sequence of events than the previous claim about ANLA’s impressive audio collection. Instead, the information about the large number of recordings emphasizes and supports that claim. Choice C is incorrect because \"regardless\" illogically signals that the information in this sentence is true despite the previous claim about ANLA’s impressive audio collection. Instead, the information about the large number of recordings emphasizes and supports that claim. Choice D is incorrect because \"instead\" illogically signals that the information in this sentence presents an alternative to the previous claim about ANLA’s impressive audio collection. Rather, the information about the large number of recordings emphasizes and supports that claim."},{"i":"20e4ff59","c":"trans","d":"E","s":"Famous for its four-degree tilt, the leaning Garisenda Tower is a popular attraction in Bologna’s city center. However, measurements taken in 2023 showed that the tower was rotating in a concerning way. ______ city officials closed the area around the tower so experts could explore solutions to stabilize the historical twelfth-century structure.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","As a result,","For example,","In comparison,"],"a":1,"r":"Choice B is the best answer. \"As a result\" logically signals that the action described in this sentence—closing the area around Garisenda Tower to explore stabilization solutions—occurred as a consequence or result of measurements revealing the tower’s concerning rotation. Choice A is incorrect because \"similarly\" illogically signals that the action of closing the tower area is similar to the discovery of concerning rotation described in the previous sentence. Instead, closing the area around the tower to explore solutions occurred as a result of the measurements revealing the rotation. Choice C is incorrect because \"for example\" illogically signals that the action of closing the tower area serves as an example of the tower’s concerning rotation described in the previous sentence. Instead, closing the area around the tower to explore solutions occurred as a result of the measurements revealing the rotation. Choice D is incorrect because \"in comparison\" illogically signals that the action of closing the tower area is being compared to the discovery of concerning rotation described in the previous sentence. Instead, closing the area around the tower to explore solutions occurred as a result of the measurements revealing the rotation."},{"i":"17e49403","c":"trans","d":"M","s":"When, in the 1800s, geologists first realized that much of Earth had once been covered by great sheets of ice, some theorized that the phenomenon was cyclical, occurring at regular intervals. Each Ice Age is so destructive, though, that it largely erases the geological evidence of its predecessor. ______ geologists were unable to confirm the theory of cyclical Ice Ages until the 1960s.\n\nWhich choice completes the text with the most logical transition?","o":["Hence,","Moreover,","Nevertheless,","Next,"],"a":0,"r":"Choice A is the best answer. “Hence” logically signals that the information in this sentence—that geologists couldn’t confirm the theory of cyclical Ice Ages until the 1960s—is a consequence of the previous information about the destructiveness of each Ice Age and the erasure of necessary geological evidence. Choice B is incorrect because “moreover” illogically signals that the information in this sentence is merely additional to the previous information about the destructiveness of each Ice Age. Instead, the sentence identifies a specific consequence of that information. Choice C is incorrect because “nevertheless” illogically signals that the information in this sentence is true despite the previous information about the destructiveness of each Ice Age. Instead, the sentence identifies a specific consequence of that information. Choice D is incorrect because “next” illogically signals that the information in this sentence is the next step in a process. Instead, the sentence identifies a specific consequence of the previous information."}],"img":{"3233c162":"iVBORw0KGgoAAAANSUhEUgAAArwAAAIjBAMAAAATpNXmAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABl60lEQVR42u1dd2BT1dt+zk3SdOckZc/bspSZtiwBIWwHI2xF1AAyZGhQmaIW/UAZagFBQMAiDpZS9oYgIMoMS5DVFESQ0ZyU2ZGc748k7U0XBVt/rb3PH23uPeeee89z3/ue933PAmTIkCFDhgwZMmTIkCFDhgwZMmTIkFG8QPJIo/kvhj60sP8wIrxEhWUypvhYhBaANp9lCK0BQKUHECE9H+55TZG+L0MwFHqthCLCrmLeghgA0NGylHpFzV8DLKDw/yYXSfSwJXj/b+4bA8DPAKCdVK57u7PWHr/U+z0QEED5Fikp8qzc2
