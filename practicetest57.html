<script>
const D={"t":"Practicetest57","q":[{"i":"0ee67e09","c":"vocab","d":"E","s":"Anthropologist Kristian J. Carlson and colleagues examined the fossilized clavicle and shoulder bones of a 3.6-million-year-old early hominin known as “Little Foot.”They found that these bones were ______ the clavicle and shoulder bones of modern apes that are frequent climbers, such as gorillas and chimpanzees, suggesting that Little Foot had adapted to life in the trees.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["surpassed by","comparable to","independent of","obtained from"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the fossilized bones of the hominin known as Little Foot. As used in this context, “comparable to” would mean similar to. The text indicates that the relationship between the fossilized clavicle and shoulder bones of Little Foot and the clavicle and shoulder bones of “frequent climbers,” such as chimpanzees and gorillas, suggests that Little Foot had adapted to moving around in trees. This context suggests that the relationship between the fossilized bones of Little Foot and the bones of chimpanzees and gorillas is one of similarity—the Little Foot fossils are likely comparable to the modern ape bones. Choice A is incorrect because if the fossilized bones of Little Foot were “surpassed by,” or exceeded by or made inferior to, the bones of modern apes that are frequent climbers, it wouldn’t suggest, as the text says, that Little Foot was adapted to moving around in trees. If anything, learning that Little Foot’s clavicle and shoulder bones were surpassed by those of chimpanzees and gorillas would suggest that Little Foot was poorly adapted to climbing. Choice C is incorrect because if Little Foot’s fossilized clavicle and shoulder bones were “independent of,” or not influenced by or affiliated with, the bones of modern apes that climb often, it wouldn’t suggest, as the text says, that Little Foot was adapted to moving around in trees. Choice D is incorrect because the text indicates that Little Foot’s fossilized bones date to 3.6 million years ago, so they couldn’t have been “obtained from,” or acquired from, the bones of modern apes."},{"i":"dc234d74","c":"vocab","d":"M","s":"The recently observed gamma ray burst GRB 230307A lasted for 200 seconds, ______ for a burst generated by the merger of neutron stars. Bursts caused by neutron mergers typically last fewer than 2 seconds.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a coincidence","a reprieve","an incident","an oddity"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the duration of gamma ray burst GRB 230307A. In this context, \"an oddity\" is something that is odd or unusual. The text explains that the burst lasted for 200 seconds and that other bursts generated by neutron mergers have usually lasted fewer than 2 seconds. In other words, the duration of gamma ray burst GRB 230307A was unusual. Choice A is incorrect because the text focuses on a difference between the duration of gamma ray burst GRB 230307A and the typical duration of bursts caused by neutron mergers, not \"a coincidence,\" or a point of correspondence, between them; the text indicates that GRB 230307A lasted much longer than what is typical of other bursts. Choice B is incorrect. In this context, \"a reprieve\" would be either a temporary relief from something or a delay of a punishment, neither of which would make sense as something that the duration of a gamma ray burst could provide to the burst itself. Choice C is incorrect. Although it would make sense to refer to gamma ray burst GRB 230307A itself as \"an incident,\" or a thing that occurred, the missing word describes the duration of the burst, and it doesn’t make much sense to describe a length of time as an incident. Further, the sentence emphasizes that the burst’s duration was very unusual, not simply that the burst occurred."},{"i":"9c35759f","c":"vocab","d":"M","s":"Novelist N. K. Jemisin declines to ______ the conventions of the science fiction genre in which she writes, and she has suggested that her readers appreciate her work precisely because of this willingness to thwart expectations and avoid formulaic plots and themes.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["question","react to","perceive","conform to"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of Jemisin’s writing. In this context, “conform to” means to act in accordance with something. The text suggests that in her science fiction writing, Jemisin’s willingness to go against expectations and not use plots and themes that seem to follow a formula reflects how she treats the standard practices of the genre. This context conveys that Jemisin chooses not to act in accordance with those conventions. Choice A is incorrect. In this context, “question” would mean doubt or object to. The text indicates that Jemisin is willing to go against expectations and not use formulaic plots and themes in her science fiction writing, suggesting that she may actually object to those conventions of the genre, not that she chooses not to question them. Choice B is incorrect because the text indicates that in her science fiction writing, Jemisin is willing to go against expectations and not use formulaic plots and themes. Rather than suggesting that Jemisin chooses not to “react to,” or act in response to, the standard practices of the genre, this context suggests that she is acting in response to such conventions by deliberately avoiding them. Choice C is incorrect. In this context, “perceive” would mean become aware of or understand. The text indicates that in her science fiction writing, Jemisin is willing to go against expectations and not use formulaic plots and themes. This context conveys that Jemisin is aware of and deliberately avoids those conventions of the genre, not that she chooses not to be aware of them."},{"i":"d3ca5d59","c":"vocab","d":"M","s":"Stephen Hannock’s luminous landscape paintings are appealing to viewers but have elicited little commentary from contemporary critics, a phenomenon that may be due to the very fact that the paintings seem so ______. Many critics focus their attention on art that is cryptic or overtly challenging.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["innovative","subversive","profound","accessible"],"a":3,"r":"Choice D is the best answer. When talking about a thing, “accessible” means “easy to understand.” This sets up the contrast in the next sentence, which tells us that critics mostly focus on art that is “cryptic or challenging” (meaning not easy to understand). Choice A is incorrect. This doesn’t fit the logic of the text. The next sentence tells us that critics focus on art that is mysterious and challenging. If Hannock’s paintings are “innovative” (meaning advanced and original), then critics probably would comment on them. Choice B is incorrect. This doesn’t fit the logic of the text. The next sentence tells us that critics focus on art that is mysterious and challenging. If Hannock’s paintings are “subversive” (meaning disruptive and revolutionary), then critics probably would comment on them. Choice C is incorrect. This doesn’t fit the logic of the text. The next sentence tells us that critics focus on art that is mysterious and challenging. If Hannock’s paintings are “profound” (meaning very deep and insightful), then critics probably would comment on them."},{"i":"edbc6cca","c":"purpose","d":"E","s":"The following text is from Bram Stoker’s 1911 novel The Lair of the White Worm. Adam is meeting his great-uncle Richard at a port. The meeting so auspiciously begun proceeded well. Adam, seeing that the old man was interested in the novelty of the ship, suggested that he should stay the night on board, and that he would himself be ready to start at any hour and go anywhere that the other suggested. This affectionate willingness to fall in with his own plans quite won the old man’s heart. He warmly accepted the invitation, and at once they became not only on terms of affectionate relationship, but almost like old friends.\n\nWhich choice best states the main purpose of the text?","o":["It states the reasons why Adam and his great-uncle Richard decide to sleep on the ship rather than finding lodging on land.","It showcases how Adam’s flexibility and consideration strengthen his relationship with his great-uncle Richard.","It describes why Adam and his great-uncle Richard are excited for their upcoming journey on the ship.","It contrasts great-uncle Richard’s wary first impressions of Adam with his ultimate affection toward him."],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text, which is to showcase how Adam’s flexibility and consideration strengthen his relationship with his great-uncle Richard. The text begins by stating that the meeting between the two characters is proceeding well and then describes Adam’s thoughtful behavior: noticing his great-uncle’s interest in the ship, Adam suggests staying on board overnight and expresses willingness to accommodate his great-uncle’s schedule and destination preferences. The text goes on to describe the positive effect of Adam’s thoughtfulness and flexibility, indicating that Adam’s “affectionate willingness” to accommodate Richard’s preferences “quite won the old man’s heart.” The text concludes by suggesting that Adam’s ability to anticipate his great-uncle’s wishes and willingness to accommodate them result in the rapid development of affection and intimacy between them, stating that they soon became “almost like old friends.” Therefore, the text’s main purpose is to demonstrate how Adam’s flexibility and consideration strengthened his and his great-uncle’s relationship. Choice A is incorrect. Although the text explains Adam’s reason for suggesting that Richard spend the night on the ship rather than finding lodging on land (which is that Adam perceives Richard’s interest in the ship), this isn’t the text’s main purpose. Rather, Adam’s suggestion about where to sleep for the night serves as an example of the consideration Adam shows toward Richard, and the text mentions it mainly to explain how an affectionate relationship developed so quickly between them. Moreover, the text only states that Adam encourages Richard to stay on the ship; it doesn’t specify where Adam plans to spend the night. Choice C is incorrect because the text doesn’t describe why Adam and his great-uncle Richard are excited about their journey. While the text mentions that Adam is willing to “start at any hour and go anywhere,” it provides no details about any planned journey, its destination, or even whether they will be continuing by ship or some other mode of transportation, nor does the text mention anything about either character’s feelings of excitement about their plans. We learn only that Adam is accommodating about potential travel plans, not that either character is particularly eager about the journey itself. The text’s main focus is on Adam and Richard’s developing relationship, not on any anticipated travel experiences. Choice D is incorrect because the text doesn’t show a contrast between initial wariness and later affection. On the contrary, the text begins by stating that the meeting between Adam and his great- uncle Richard has begun in an “auspicious,” or promising, manner and is “proceed[ing] well,” suggesting that Richard’s impression is positive from the outset. There’s no indication of any initial suspicion, caution, or reserve on Richard’s part that later changes to affection. Instead, the text describes a consistently positive interaction that deepens from a good first impression into a stronger, more familiar relationship because of Adam’s considerate behavior."},{"i":"9c759a09","c":"purpose","d":"E","s":"The following text is from Georgia Douglas Johnson’s 1922 poem “Benediction.” Go forth, my son, Winged by my heart’s desire! Great reaches, yet unknown, Await For your possession. I may not, if I would, Retrace the way with you, My pilgrimage is through, But life is calling you!\n\nWhich choice best states the main purpose of the text?","o":["To express hope that a child will have the same accomplishments as his parent did","To suggest that raising a child involves many struggles","To warn a child that he will face many challenges throughout his life","To encourage a child to embrace the experiences life will offer"],"a":3,"r":"Choice D is the best answer because it accurately states the text’s main purpose. The poem begins with the speaker urging a child to “go forth” with her encouragement (“my heart’s desire”). The speaker goes on to suggest that new experiences (“Great reaches, yet unknown”) lie ahead for the son that “life is calling” him to seek out. Thus, the main purpose is to encourage a child to embrace the experiences available to him in his life. Choice A is incorrect because the speaker encourages the child to pursue new experiences (“Great reaches”) without knowing exactly what those experiences will be (“yet unknown”) or suggesting that they should match the speaker’s own accomplishments. Choice B is incorrect because the speaker focuses on positive possibilities for her son (“Great reaches, yet unknown”) and her enthusiastic encouragement to embrace those possibilities (“life is calling you!”), while there is no mention of raising a child or associated struggles. Choice C is incorrect because the speaker frames the possibilities for her son in a positive light when she says that “great reaches, yet unknown” are waiting for him, and this positive outlook for the son is consistent throughout the text."},{"i":"e23f50b9","c":"func","d":"M","s":"The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and—more affordably—steam baths. <u>While such amenities were available mainly to town dwellers,<\/u> regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.\n\nWhich choice best describes the function of the underlined portion?","o":["It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.","It describes a limitation of earlier historians’ studies of medieval European bathing habits.","It concedes that not all people in medieval Europe had access to public bathhouses.","It explains why Janega decided to study the popularity of public bathhouses in medieval Europe."],"a":2,"r":"Choice C is the best answer because it most effectively describes the function of the underlined portion. The text discusses the long-standing misconception that people in medieval Europe were uninterested in cleanliness and hygiene. As evidence that this idea is false, the text cites historian Eleanor Janega’s assertion that in medieval Europe, towns usually had at least one bathhouse, where people could take immersion baths or steam baths for a fee. The underlined portion then notes that mainly town dwellers had access to these bathhouses. The remainder of the text explains that those who lacked such access were nonetheless able to bathe in outdoor waterways or take sponge baths at home. Therefore, the underlined portion concedes that some people in medieval Europe lacked access to public bathhouses. Choice A is incorrect. The underlined portion establishes that amenities such as steam baths were mainly available to town dwellers, which suggests in turn that steam baths were largely unavailable to people in rural areas. Thus, the distinction made by the underlined portion is not between the popularity of steam baths in towns versus their lack of popularity in rural areas but instead between their presence in towns and absence in rural areas. Choice B is incorrect. Although the text does explain that recent historians have disproved the idea that medieval Europeans rarely bathed, it doesn’t attribute that misconception to earlier historians of medieval Europe or suggest that their research was subject to limitations. Moreover, the underlined portion addresses a limitation of life in medieval Europe, not of historical research. Choice D is incorrect because the underlined portion doesn’t address why historian Eleanor Janega decided to study the popularity of public bathhouses in medieval Europe—nor does any portion of the text. The text mentions Janega in passing, but it doesn’t go into detail about why she decided to study the popularity of public bathhouses in medieval Europe."},{"i":"aa5897b8","c":"func","d":"H","s":"<u>In Jane Austen’s novel Mansfield Park, an almost imperceptible smile from potential suitor Henry Crawford causes the protagonist Fanny Price to blush; her embarrassment grows when she suspects that he is aware of it.<\/u> This moment—in which Fanny not only infers Henry’s mental state through his gestures, but also infers that he is drawing inferences about her mental state—illustrates what literary scholar George Butte calls “deep intersubjectivity,” a technique for representing interactions between consciousnesses through which Austen’s novels derive much of their social and psychological drama.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It states a claim about Austen’s skill at representing psychological complexity that is reinforced by an example presented in the following sentence.","It advances an interpretation of an Austen protagonist who is contrasted with protagonists from other Austen novels cited in the following sentence.","It describes a recurring theme in Austen’s novels that is the focus of a literary scholar’s analysis summarized in the following sentence.","It provides a synopsis of an interaction in an Austen novel that illustrates a literary concept discussed in the following sentence."],"a":3,"r":"Choice D is the best answer. The underlined sentence provides a concrete example to ground readers’ understanding of the “deep intersubjectivity” described in the next sentence as central to Austen’s work. Choice A is incorrect. There is no evaluation made of Austen’s skill in this sentence, and no examples are given in the following sentence. This choice essentially flips the paragraph: it’s this first sentence that provides an example. Choice B is incorrect. There are no other Austen protagonists mentioned in this passage, so this couldn’t be the answer. Choice C is incorrect. The underlined sentence doesn’t identify any “recurring theme,” but instead simply describes one interaction from one book. This interaction exemplifies the literary technique of “deep intersubjectivity” that is introduced in the next sentence."},{"i":"96f3accc","c":"cross","d":"H","s":"Text 1 When the 50-second-long film Arrival of the Train—which depicts what its title says, a train pulling into a station—was first shown publicly in 1896, spectators, naïve to the new medium of film and seeing a train appearing to come directly at them, leaped from their seats and fled the room. This moment marks a major cultural shift: a new way of representing and seeing the world had arrived with that train, and nothing would ever be the same.\n\nText 2 The fact that there is no contemporary evidence that the first audience of Arrival of the Train was alarmed has not stopped the story from becoming canonical, even among film historians. But that phenomenon itself is highly revealing. Our belief that the coming of film was transformative is so strong that we invented and keep retelling a founding myth that divides cultural history into a (naïve) “before” and (sophisticated) “after.”\n\nBased on the texts, the author of\n\nText 2 would most likely agree with which statement about the description of the first showing of Arrival of the Train in\n\nText 1?","o":["It is more motivated by a perception of the significance of the invention of film than by facts.","It expresses a view about the transformative nature of film that film historians tend to regard as naïve.","It is not based on evidence and reflects film historians’ belief that they are more sophisticated than today’s audiences.","It reflects a misconception that is widely believed because it captures early film audiences’ sense that the new medium was alarming."],"a":0,"r":"Choice A is the best answer because it provides a statement about the description of the first showing of Arrival of the Train in Text 1 that, based on the texts, the author of Text 2 would most likely agree with. Text 1 indicates that members of the audience, unaccustomed to the new medium of film and believing that they were looking at a real oncoming train, allegedly reacted to the film with alarm. Text 1 then goes on to treat this anecdote as a factual account of the film’s first showing, interpreting it as a moment that marked a \"major cultural shift.\" In contrast, the author of Text 2 indicates that though the story of the film’s first showing has become \"canonical,\" or widely accepted, there is no contemporary evidence to support the idea that the audience reacted as Text 1 describes. Text 2 goes on to explain that this factually questionable description likely persists because it functions as a \"founding myth\" that reinforces a widespread belief in the profoundly transformative nature of the invention of film. This indicates that the author of Text 2 would likely see the description in Text 1 as motivated primarily by cultural perceptions about film’s significance rather than by documented historical facts. Choice B is incorrect because the author of Text 2 doesn’t suggest that film historians regard the view about film’s transformative nature as naïve. On the contrary, Text 2 states that the story of the first showing of Arrival of the Train has become \"canonical, even among film historians,\" indicating that historians broadly accept this narrative as a compelling illustration of film’s impact, not that they regard either the narrative or the views it conveys about the transformative nature of film as naïve. Text 2 refers to a \"(naïve) ‘before’\" in cultural history, but this is describing how the myth itself characterizes pre-film audiences, not how historians regard views about the transformative nature of film. Choice C is incorrect. While the author of Text 2 does indicate that the story of the audience’s reaction to Arrival of the Train described in Text 1 is a myth that lacks evidence, the text doesn’t suggest that the story reflects the fact that film historians believe themselves to be more sophisticated than modern audiences are. Rather, Text 2 suggests that the story persists because of a collective cultural belief, which historians share, in the profound impact of the invention of film. Moreover, the \"naïve\" versus \"sophisticated\" distinction mentioned in Text 2 refers to how the myth characterizes audiences before and after the invention of film; it doesn’t characterize modern audiences versus film historians. Choice D is incorrect. Although the author of Text 2 would agree that the description of the first showing of Arrival of the Train in Text 1 reflects a misconception, the author wouldn’t agree that widespread belief in the misconception can be attributed to the fact that it accurately captures early audiences’ actual sense of alarm. In fact, the misconception identified by the author of Text 2 concerns the accuracy of the audience’s alleged reaction; the author questions whether early audiences were alarmed at all, stating there is \"no contemporary evidence\" that they reacted in this way. According to Text 2, the description is widely believed not because it accurately captures historical reactions but because it serves as a \"founding myth\" that supports a belief in film’s transformative cultural impact."},{"i":"3cc7d73b","c":"main","d":"M","s":"Using the Stratospheric Observatory for Infrared Astronomy (SOFIA), a team of astronomers mapped out the magnetic field of G47, one of the Milky Way’s galactic bones (dense clouds of gas and dust that run through the middle of the arm of a spiral galaxy). Surprisingly, the map revealed a magnetic field with no clear pattern or direction. The researchers had expected the magnetic field to be similar to the more uniform fields seen in galactic bones in other arms of the Milky Way.\n\nAccording to the text, what was surprising about the researchers’ mapping of the magnetic field of galactic bone G47?","o":["It showed a weaker magnetic field than expected.","It implied that previous mappings of the magnetic field were inaccurate.","It produced magnetic field measurements similar to those for other galactic bones.","It revealed a magnetic field that wasn’t uniform."],"a":3,"r":"Choice D is the best answer because it presents the point about the magnetic field mapping that the text describes as surprising. The text indicates that a team of astronomers mapped the magnetic field of G47, a galactic bone in the Milky Way, and that the mapping \"surprisingly\" revealed \"no clear pattern or direction\" in the magnetic field. The text then adds that the researchers had thought the magnetic field would be as uniform as the magnetic fields of other galactic bones in the Milky Way are. In other words, the researchers were surprised that the mapping revealed a magnetic field that wasn’t uniform. Choice A is incorrect because the text doesn’t indicate that the mapping surprisingly showed a weaker magnetic field than the researchers had expected. The text makes no mention of the magnetic field’s strength, only its lack of a clear pattern or direction. Choice B is incorrect because the text doesn’t indicate that the magnetic field mapping suggested to researchers that previous mappings were inaccurate. Although the text states that the mapping didn’t show what researchers had expected based on their knowledge of other magnetic fields, there’s no indication that G47’s magnetic field had ever been mapped before. Choice C is incorrect because the text indicates that the researchers were surprised that the magnetic field was different from, not similar to, the magnetic fields of other galactic bones; the text states that because other galactic bones in the Milky Way are more uniform, the researchers had expected the magnetic field of G47 to be more uniform than it turned out to be."},{"i":"e677fa6c","c":"main","d":"M","s":"The following text is adapted from Edgar Allan Poe’s 1849 story “Landor’s Cottage.” During a pedestrian trip last summer, through one or two of the river counties of New York, I found myself, as the day declined, somewhat embarrassed about the road I was pursuing. The land undulated very remarkably; and my path, for the last hour, had wound about and about so confusedly, in its effort to keep in the valleys, that I no longer knew in what direction lay the sweet village of B——, where I had determined to stop for the night.\n\nWhich choice best states the main idea of the text?","o":["The narrator remembers a trip he took and admits to getting lost.","The narrator recalls fond memories of a journey that he took through some beautiful river counties.","The narrator describes what he saw during a long trip through a frequently visited location.","The narrator explains the difficulties he encountered on a trip and how he overcame them."],"a":0,"r":"Choice A is the best answer. The narrator is “embarrassed” about the route he took, which ends up leaving him lost and confused about how to get to his destination for the evening. Choice B is incorrect. This choice doesn’t match the passage. The narrator is embarrassed, rather than fond, and he doesn’t describe the beauty of the place. Choice C is incorrect. This choice doesn’t match the passage. We don’t know from this excerpt whether or not the narrator has visited this part of New York multiple times. Choice D is incorrect. This choice doesn’t match the passage. The narrator doesn’t explain how he overcame being lost in this excerpt."},{"i":"9c591ff7","c":"infer","d":"H","s":"Some Astyanax mexicanus, a river-dwelling fish found in northeast Mexico, have colonized caves in the region. Although there is little genetic difference between river and cave A. mexicanus and all members of the species can emit the same sounds, biologist Carole Hyacinthe and colleagues found that the context and significance of those sounds vary by location—e.g., the click that river-dwelling A. mexicanus use to signal aggression is used by cave dwellers when foraging—and the acoustic properties of cave fish sounds show some cave-specific variations as well. Hyacinthe and colleagues note that differences in sonic communication could accumulate to the point of inhibiting interbreeding among fish from different locations, suggesting that ______ Which choice most logically completes the text?","o":["although A. mexicanus living in rivers are genetically similar to those living in caves, river fish rely on sonic communication less than cave fish do.","although A. mexicanus is a single species at present, it could be in the process of splitting into distinct populations with different characteristics.","although all A. mexicanus emit sounds, the fish living in rivers produce some sounds that the fish living in caves do not, and vice versa.","although A. mexicanus from different locations can interbreed currently, river fish and cave fish are sufficiently genetically distinct that they can be considered separate species."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of A. mexicanus. According to the text, A. mexicanus, a river-dwelling fish species, has colonized caves. The fish that live in rivers and those that live in caves show no significant genetic differences and are all capable of making the same sounds. The text indicates, however, that Hyacinthe and colleagues found that sounds that the river fish use in a particular context and for a particular purpose are used in a different context and for a different purpose by the cave fish. Additionally, the sounds made by cave fish show some differences depending on the specific cave the fish inhabit. The text goes on to state that Hyacinthe and colleagues have noted that differences in how the fish use sound to communicate could eventually become so great that they prevent fish from different locations from interbreeding. In other words, the river fish might eventually only breed with other river fish (with whom they share characteristics regarding sonic communication that they do not share with cave fish), while the cave fish might only breed with other cave fish for a similar reason. In context, this observation suggests that even though the fish are a single species right now, they could be in the process of splitting into distinct populations with different characteristics. Choice A is incorrect because there is no information in the text suggesting that the river fish are less reliant on sonic communication than the cave fish are. Although the text does indicate that the river fish and cave fish are genetically similar, the text describes both groups as using sonic communication and says nothing to indicate that one group depends on that communication more than the other group does. Choice C is incorrect. The text states that all members of the species can emit the same sounds but that the function and context of sounds differ depending on whether the fish live in rivers or caves, but it does not indicate that river fish produce sounds that cave fish do not or vice versa. Choice D is incorrect because it contradicts the text. The text says that there is little genetic difference between the river fish and the cave fish, not that the river fish and cave fish are so genetically distinct that they can be considered separate species."},{"i":"5b4829d2","c":"infer","d":"E","s":"Researchers wanted to study how consumers’ reactions to an ad may be affected by other ads. The researchers began by showing study participants an ad for a product, with some seeing a less detailed ad and others seeing a more detailed one. Then, all participants viewed the same second ad for a store and shared their opinion of the store based on this second ad. Participants who had first seen an ad less detailed than the second ad had a higher opinion of the store than the participants who had first seen a more detailed ad. The researchers concluded that reactions to an ad may be affected by ______ Which choice most logically completes the text?","o":["the number of people who viewed the ad.","the length of time viewing previous ads.","the amount of detail viewed in previous ads.","the time of day that the ad is viewed."],"a":2,"r":"Choice C is the best answer. The passage tells us that participants who had seen a less detailed ad for a product beforehand had a higher opinion of the store than those who had seen a more detailed ad. This suggests that reactions to an ad may be affected by the amount of detail viewed in previous ads. Choice A is incorrect. The passage doesn’t mention the number of people who viewed the ad, so there’s no basis for this inference. Choice B is incorrect. The passage doesn’t mention the length of time viewing previous ads, so there’s no basis for this inference. Choice D is incorrect. The passage doesn’t mention the time of day that the ad is viewed, so there’s no basis for this inference."},{"i":"3d91c973","c":"claim","d":"H","s":"Mosasaurs were large marine reptiles that lived in the Late Cretaceous period, approximately 100 million to 66 million years ago. Celina Suarez, Alberto Pérez-Huerta, and T . Lynn Harrell Jr. examined oxygen-18 isotopes in mosasaur tooth enamel in order to calculate likely mosasaur body temperatures and determined that mosasaurs were endothermic—that is, they used internal metabolic processes to maintain a stable body temperature in a variety of ambient temperatures. Suarez, Pérez-Huerta, and Harrell claim that endothermy would have enabled mosasaurs to include relatively cold polar waters in their range.\n\nWhich finding, if true, would most directly support Suarez, Pérez-Huerta, and Harrell’s claim?","o":["Mosasaurs’ likely body temperatures are easier to determine from tooth enamel oxygen-18 isotope data than the body temperatures of nonendothermic Late Cretaceous marine reptiles are.","Fossils of both mosasaurs and nonendothermic marine reptiles have been found in roughly equal numbers in regions known to be near the poles during the Late Cretaceous, though in lower concentrations than elsewhere.","Several mosasaur fossils have been found in regions known to be near the poles during the Late Cretaceous, while relatively few fossils of nonendothermic marine reptiles have been found in those locations.","During the Late Cretaceous, seawater temperatures were likely higher throughout mosasaurs’ range, including near the poles, than seawater temperatures at those same latitudes are today."],"a":2,"r":"Choice C is the best answer because it presents the finding that, if true, would best support Suarez, Pérez-Huerta, and Harrell’s claim about mosasaurs. The text states that Suarez, Pérez-Huerta, and Harrell’s research on mosasaur tooth enamel led them to conclude that mosasaurs were endothermic, which means that they could live in waters at many different temperatures and still maintain a stable body temperature. The researchers claim that endothermy enabled mosasaurs to live in relatively cold waters near the poles. If several mosasaur fossils have been found in areas that were near the poles during the period when mosasaurs were alive and fossils of nonendothermic marine reptiles are rare in such locations, that would support the researchers’ claim: it would show that mosasaurs inhabited polar waters but nonendothermic marine mammals tended not to, suggesting that endothermy may have been the characteristic that enabled mosasaurs to include polar waters in their range. Choice A is incorrect because finding that it’s easier to determine mosasaur body temperatures from tooth enamel data than it is to determine nonendothermic reptile body temperatures wouldn’t support the researchers’ claim. Whether one research process is more difficult than another indicates nothing about the results of those processes and therefore is irrelevant to the issue of where mosasaurs lived and what enabled them to live in those locations. Choice B is incorrect because finding roughly equal numbers of mosasaur and nonendothermic marine reptile fossils in areas that were near the poles in the Late Cretaceous would suggest that endothermy didn’t give mosasaurs any particular advantage when it came to expanding their range to include relatively cold polar waters, thereby weakening the researchers’ claim rather than supporting it. Choice D is incorrect because finding that the temperature of seawater in the Late Cretaceous was warmer than seawater today wouldn’t weaken the researchers’ claim. Seawater in the Late Cretaceous could have been warmer than seawater today but still cold enough for endothermy to be advantageous to mosasaurs, so this finding wouldn’t provide enough information to either support or weaken the researchers’ claim."},{"i":"08b28c1a","c":"claim","d":"E","s":"A researcher conducted an experiment inspired by studies suggesting that people may benefit from feeling frightened in certain circumstances, such as when watching scary movies or visiting haunted attractions. The researcher recruited several participants and had them walk through a local haunted house attraction. Immediately after exiting the attraction, each participant completed a survey about their experience. Based on the survey responses, the researcher claims that feeling frightened in controlled situations can boost a person’s mood and confidence.\n\nWhich quotation from a participant would best illustrate the researcher’s claim?","o":["“After I came out of the haunted house, I felt very accomplished and less stressed.”","“My friends kept laughing as we were walking through the haunted house.”","“The haunted house was scary at first, but I knew everyone was just acting, so I felt less scared after a few minutes.”","“The sense of relief I felt at the end of the haunted house was similar to the feelings I have when I finish a scary movie.”"],"a":0,"r":"Choice A is the best answer. This choice illustrates both “feeling frightened in controlled situations” (the haunted house) and the benefit of a boosted mood (“less stressed”) and confidence (“very accomplished”). Choice B is incorrect. This choice isn’t the best illustration of the claim. While laughing may indicate a good mood, this choice provides no evidence of “feeling frightened” or boosted confidence. Another choice provides better evidence. Choice C is incorrect. This choice isn’t the best illustration of the claim. This choice demonstrates “feeling frightened” in a controlled environment, but it doesn’t provide strong evidence of boosted mood or confidence. Another choice provides better evidence. Choice D is incorrect. This choice isn’t the best illustration of the claim. While a “sense of relief” could be interpreted as a boosted mood, this choice doesn’t provide direct evidence of “feeling frightened” or of increased confidence. This choice simply suggests that haunted houses and scary movies have a similar effect. Another choice provides better evidence for the researcher’s claim."},{"i":"b29c520a","c":"graph","d":"E","s":"","o":["jet fuel.","POP biofuel.","ethanol.","gasoline."],"a":1,"r":"Choice B is the best answer because it most effectively uses data from the graph to complete the sentence about which fuel has the highest energy density. Of the four bars in the graph, the highest (indicating the greatest energy density in MJ/L) is for POP biofuel. According to the graph, the energy densities of the fuels shown are approximately 40 MJ/L for POP biofuel, 36 MJ/L for gasoline, 34 MJ/L for jet fuel, and 23 MJ/L for ethanol. Choice A is incorrect. The task is to find the fuel in the graph with the highest bar (indicating the greatest energy density in MJ/L), and jet fuel has the third-highest bar in the graph, not the highest. According to the graph, the energy densities of the fuels shown are approximately 40 MJ/L for POP biofuel, 36 MJ/L for gasoline, 34 MJ/L for jet fuel, and 23 MJ/L for ethanol. Choice C is incorrect. The task is to find the fuel in the graph with the highest bar (indicating the greatest energy density in MJ/L), and ethanol has the lowest bar in the graph, not the highest. According to the graph, the energy densities of the fuels shown are approximately 40 MJ/L for POP biofuel, 36 MJ/L for gasoline, 34 MJ/L for jet fuel, and 23 MJ/L for ethanol. Choice D is incorrect. The task is to find the fuel in the graph with the highest bar (indicating the greatest energy density in MJ/L), and gasoline has the second-highest bar in the graph, not the highest. According to the graph, the energy densities of the fuels shown are approximately 40 MJ/L for POP biofuel, 36 MJ/L for gasoline, 34 MJ/L for jet fuel, and 23 MJ/L for ethanol."},{"i":"403fb4e4","c":"graph","d":"H","s":"","o":["most of the farmers who mainly cultivated cereals and most of the farmers who mainly cultivated non–root vegetables in south Ondo were women.","more women in central Ondo mainly cultivated root crops than mainly cultivated cereals.","most of the farmers who mainly cultivated non–root vegetables in north and south Ondo were women.","a relatively equal proportion of women across the three regions of Ondo mainly cultivated cereals."],"a":2,"r":"Choice C is the best answer because it uses data from the graph to effectively complete the example of Eludoyin and his colleagues’ findings concerning female farmers in some regions of Ondo State, Nigeria. The graph presents values for the percentage of Ondo State small-scale farmers who are female, by type of crop and region. The graph shows that of the farmers mainly cultivating non-root vegetables, approximately 57% in north Ondo and approximately 54% in south Ondo are female; in other words, most of those farmers are female, which exemplifies the idea that female farmers make up the majority (more than half) of the farmers cultivating specific types of crops in some regions. Choice A is incorrect because it inaccurately cites data from the graph: the graph shows that in south Ondo, most of the farmers mainly cultivating non-root vegetables are women (approximately 54%), but that only about 35% (less than half) of the farmers mainly cultivating cereals are women. Choice B is incorrect because it inaccurately cites data from the graph: the graph shows that more women in central Ondo mainly cultivate cereals than mainly cultivate root crops (approximately 36% and 20%, respectively). Additionally, it doesn’t effectively complete the example because the graph shows that female farmers don’t make up the majority (more than half) of the farmers for any type of crop in central Ondo. Choice D is incorrect because it doesn’t effectively complete the example; it simply states that a relatively equal proportion of women across the three regions mainly cultivate cereals, which doesn’t address the value for that proportion and thus doesn’t show that a majority (more than half) of the farmers cultivating certain crops are female."},{"i":"4c335aea","c":"fss","d":"H","s":"In a recent analysis of lyrical trends in 350,000 songs, researchers cite increases in certain measures, such as the ratio of choruses to verses, as evidence music lyrics are becoming more repetitive. For instance, from 1970 to 2020, ______ chorus-to-verse ratios trended similarly, with each genre’s data indicating that relative to the number of unique verses, the number of repeated choruses in songs increased.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["rocks and raps","rock’s and rap’s","rocks and rap’s","rock and rap’s"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of possessive nouns. The singular possessive nouns \"rock’s\" and \"rap’s\" correctly indicate that the chorus-to-verse ratios belong to the genres of rock and rap. Choice A is incorrect because the context requires the singular possessive nouns \"rock’s\" and \"rap’s,\" not the plural nouns \"rocks\" and \"raps.\" Choice C is incorrect because the context requires the singular possessive noun \"rock’s,\" not the plural noun \"rocks.\" Choice D is incorrect because the context requires the singular possessive noun \"rock’s,\" not the singular noun \"rock.\" This choice incorrectly suggests that there was a single chorus-to-verse ratio for rock and rap together, whereas the ratio was calculated for each genre individually."},{"i":"18382e67","c":"fss","d":"H","s":"In Marisol’s 1968 sculpture Mi Mama y Yo, gone are the types of pop culture references that made the Parisian-born Venezuelan American artist a star at the height of the pop art movement. In ______ place is a far more personal subject: a sculptural depiction of the artist as a young girl with her mother.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["its","they’re","their","it’s"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of possessive determiners. The plural possessive determiner \"their\" agrees in number with the plural noun \"types\" and thus indicates that the more personal subject matter of Marisol’s 1968 sculpture takes the place of those types of pop culture references that made Marisol a star. Choice A is incorrect because the singular possessive determiner \"its\" doesn’t agree in number with the plural noun \"types.\" Choice B is incorrect because \"they’re\" is the contraction for \"they are,\" not a possessive determiner. Choice D is incorrect because \"it’s\" is the contraction for \"it is\" or \"it has,\" not a possessive determiner."},{"i":"67614549","c":"fss","d":"M","s":"After winning the 1860 presidential election, Abraham Lincoln appointed Edward Bates, Salmon P . Chase, and William H. Seward to his cabinet. Lincoln’s decision was surprising, since each of these men had run against him, but historians have praised it, noting that Lincoln ______ his rivals’ diverse talents to strengthen his administration.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has leveraged","is leveraging","will leverage","leveraged"],"a":3,"r":"Choice D is the best answer. The subject of the verb is “Lincoln,” and the first sentence tells us that we’re talking about something that Abraham Lincoln did in 1860. So the simple past tense “leveraged” fits the logic of the text. Choice A is incorrect. This choice creates a tense issue. “Has leveraged” is the present perfect tense, which is used for an action that began in the past and continues into the present. Lincoln started leveraging his rivals’ talents in 1860—it’s definitely not still happening today. So the present perfect tense isn’t appropriate. Choice B is incorrect. This choice creates a tense issue. “Is leveraging” is the present tense, but Lincoln leveraged his rivals’ talents in 1860, so the present tense isn’t appropriate. Choice C is incorrect. This choice creates a tense issue. “Will leverage” is the future tense, but Lincoln leveraged his rivals’ talents in 1860, so the future tense isn’t appropriate."},{"i":"cabe71d4","c":"bound","d":"E","s":"Both Sona Charaipotra, an Indian American, and Dhonielle Clayton, an African American, grew up frustrated by the lack of diverse characters in books for young people. In 2011, these two writers joined forces to found CAKE Literary, a book packaging ______ specializes in the creation and promotion of stories told from diverse perspectives for children and young adults.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["company,","company that","company","company, that"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use and punctuation of an integrated relative clause. This choice correctly uses the relative pronoun “that” and no punctuation to create an integrated relative clause that provides essential information about the noun phrase (“a book packaging company”) that it modifies. Choice A is incorrect because it doesn’t use a relative pronoun to link the verb phrase beginning with “specializes” to the noun phrase that it modifies (“a book packaging company”). Choice C is incorrect because it doesn’t use a relative pronoun to link the verb phrase beginning with “specializes” to the noun phrase that it modifies (“a book packaging company”). Choice D is incorrect because no punctuation is needed between the integrated relative clause beginning with “that specializes” and the noun phrase that it modifies (“a book packaging company”)."},{"i":"5cc85f01","c":"bound","d":"M","s":"A conceptual artist and designer embraced by both the art world and the fashion ______ Mary Ping was chosen to curate the exhibition Front Row: Chinese American Designers for the Museum of Chinese in America.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["world","world:","world;","world,"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation between a supplementary phrase and a main clause. This choice correctly uses a comma to mark the boundary between the supplementary phrase (“A conceptual artist…world”), which describes Mary Ping, and the main clause (“Mary…America”). Choice A is incorrect because it fails to mark the boundary between the supplementary phrase (“A conceptual artist…world”) and the main clause (“Mary…America”) with appropriate punctuation. Choice B is incorrect because a colon can’t be used in this way to join the supplementary phrase (“A conceptual artist…world”) and the main clause (“Mary…America”). In this context, the colon incorrectly suggests that the information in the supplementary phrase is an explanation or amplification of the information in the main clause (Mary Ping being chosen to curate the exhibition), which isn’t the case. Choice C is incorrect because a semicolon can’t be used in this way to join the supplementary phrase (“A conceptual artist… world”) and the main clause (“Mary…America”). Semicolons are conventionally used to separate two main clauses or to separate items in a complex series."},{"i":"9922b364","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Ibn Sina was a Persian philosopher and physician. His book The Canon of Medicine recorded the most advanced medical knowledge of his time. It was published in the year 1025 CE. It was used as a medical textbook in Middle Eastern and European universities for centuries. The student wants to identify the year that The Canon of Medicine was published.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Ibn Sina’s book The Canon of Medicine was published in the year 1025 CE.","A Persian philosopher and physician wrote a medical textbook called The Canon of Medicine.","The Canon of Medicine was a medical textbook used by Middle Eastern and European universities for centuries.","Ibn Sina recorded the most advanced medical knowledge of his time in his book The Canon of Medicine."],"a":0,"r":"Choice A is the best answer. The sentence identifies the year in which the book was published. Choice B is incorrect. While the sentence provides information about the book’s author, it doesn’t identify the year in which the book was published. Choice C is incorrect. While the sentence provides information about the book’s historical use, it doesn’t identify the year in which the book was published. Choice D is incorrect. While the sentence provides information about the book’s contents, it doesn’t identify the year in which the book was published."},{"i":"4c43bf61","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: The International Center for the Arts of the Americas (ICAA) is directed by Mari Carmen Ramírez. Ramírez oversaw an initiative to create an online archive of historical documents related to the history of Latin American and Latino visual art. The ICAA digitized over 10,000 documents, including the writings of Latin American and Latino artists and critics. The creation of the archive didn’t require historical documents to be removed from their countries of origin. Scholars now have more access to these documents. The student wants to explain an advantage of the ICAA’s archive being digital.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Over 10,000 documents related to the history of Latin American and Latino visual art are part of the ICAA archive.","By offering online versions of historical documents, the ICAA’s archive provides more access to these materials without removing them from their countries of origin.","Among the historical documents in the ICAA’s archive are the writings of Latin American and Latino artists and critics.","The ICAA’s director, Mari Carmen Ramírez, oversaw the creation of an online archive of historical documents related to Latin American and Latino visual art."],"a":1,"r":"Choice B is the best answer. The sentence explains an advantage of the ICAA’s archive being digital, noting that the archive provides more access to historical documents since they don’t have to be removed from their countries of origin. Choice A is incorrect. The sentence emphasizes the number of documents in the ICAA archive; it doesn’t explain an advantage of the archive being digital. Choice C is incorrect. The sentence notes the types of historical documents the ICAA’s archive contains; it doesn’t explain an advantage of the archive being digital. Choice D is incorrect. The sentence identifies who oversaw the creation of the ICAA’s online archive; it doesn’t explain an advantage of the archive being digital."},{"i":"be44fea0","c":"trans","d":"M","s":"While studying jorō spiders, a large species originally from East Asia, University of Georgia researchers wondered if the spiders’ rapid spread throughout the southeastern US was a result of aggressive behavior. ______ they discovered that jorō spiders are gentle giants who react to even minor disturbances by “freezing” in place for an hour or more.\n\nWhich choice completes the text with the most logical transition?","o":["Therefore,","Instead,","For example,","In other words,"],"a":1,"r":"Choice B is the best answer. “Instead” logically signals that the information about the researchers’ discovery in this sentence—that jorō spiders are gentle giants who “freeze” in place when disturbed—contradicts their initial hypothesis about the spiders’ aggressiveness described in the previous sentence. Choice A is incorrect because “therefore” illogically signals that the discovery about jorō spiders’ gentleness is a result of the initial hypothesis about their aggressive behavior. Instead, the sentence presents information that contradicts the initial hypothesis. Choice C is incorrect because “for example” illogically signals that the discovery about jorō spiders’ gentleness exemplifies the initial hypothesis about their aggressive behavior. Instead, the sentence presents information that contradicts the initial hypothesis. Choice D is incorrect because “in other words” illogically signals that the discovery about jorō spiders’ gentleness is merely restating or rephrasing the initial hypothesis about their aggressive behavior. Instead, the sentence presents information that contradicts the initial hypothesis."},{"i":"855247c7","c":"trans","d":"M","s":"Mary Ellen Pleasant, a successful entrepreneur during the gold rush era, earned the moniker “Mother of Human Rights in California” after successfully challenging discrimination in the state. ______ in 1866, she sued a streetcar company for denying her and other Black riders service, a suit she eventually won when the California Supreme Court declared it illegal for carriers to exclude passengers based on race.\n\nWhich choice completes the text with the most logical transition?","o":["For this reason,","Then,","In addition,","Specifically,"],"a":3,"r":"Choice D is the best answer. \"Specifically\" logically signals that the information about Pleasant’s 1866 lawsuit provides specific, precise details elaborating on the previous point that Pleasant successfully challenged discrimination in California. Choice A is incorrect because \"for this reason\" illogically signals that Pleasant’s 1866 lawsuit was a result of her successful challenge to discrimination in California. Instead, this sentence provides specific details elaborating on her challenge to discrimination in the state. Choice B is incorrect because \"then\" illogically signals that Pleasant’s 1866 lawsuit was subsequent to or resulted from her successful challenge to discrimination in California. Instead, this sentence provides specific, precise details elaborating on how she challenged discrimination in the state. Choice C is incorrect because \"in addition\" illogically signals that the information about Pleasant’s 1866 lawsuit is merely additional to the previous point that Pleasant successfully challenged discrimination in California. Instead, this sentence provides specific details elaborating on how she did so."},{"i":"49ecf985","c":"trans","d":"E","s":"On March 3, 1991, Switzerland’s government lowered the minimum voting age for its citizens from 20 to 18 years old. ______ many people in Switzerland gained a new opportunity to participate in their country’s political process.\n\nWhich choice completes the text with the most logical transition?","o":["Nevertheless,","As a result,","By contrast,","Similarly,"],"a":1,"r":"Choice B is the best answer. \"As a result\" logically signals that the information in this sentence—that many people in Switzerland gained a new opportunity to participate in their country’s political process—is a result or consequence of the previous information about the Swiss government lowering the voting age. Choice A is incorrect because \"nevertheless\" illogically signals that the information that follows is despite the information in the previous sentence about the Swiss government lowering the voting age. Instead, people gained a new opportunity to participate in Switzerland’s political process as a result or consequence of that change. Choice C is incorrect because \"by contrast\" illogically signals that the information in this sentence contrasts with the information in the previous sentence about the Swiss government lowering the voting age. Instead, people gained a new opportunity to participate in Switzerland’s political process as a result or consequence of that change. Choice D is incorrect because \"similarly\" illogically signals that the information in this sentence is similar to the information about the Swiss government lowering the voting age in the previous sentence. Instead, people gained a new opportunity to participate in Switzerland’s political process as a result or consequence of that change."}],"img":{"b
