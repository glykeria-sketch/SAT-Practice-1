<script>
const D={"t":"SATPractice3","q":[{"i":"6c086e70","c":"vocab","d":"H","s":"Businesses typically try to promote themselves, but research by Michael Luca, Abhishek Nagaraj, and Gauri Subramani suggests that some do not ______ their marketing. The researchers studied restaurants in Texas and found that those listed on a popular review website (which can be done at no cost) had revenue increases of 5 percent on average, but 33 percent of restaurants studied never listed on the site.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["adorn","optimize","endorse","counteract"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of business marketing practices. In this context, \"optimize\" means make the most effective possible use of available opportunities. The text indicates that though businesses typically try to promote themselves, they don’t always make use of effective tools for doing so, pointing to research showing that 33 percent of restaurants failed to use a free listing service that increased revenue by 5 percent on average for restaurants that did use the service. The text therefore suggests that by foregoing a free and effective marketing tool, some businesses aren’t making the best use of, or optimizing, marketing opportunities. Choice A is incorrect because in this context, \"adorn\" would mean decorate or enhance the appearance of, and there’s nothing in the text to suggest that by failing to use a free and effective promotional tool, some businesses aren’t enhancing the appearance of their own marketing. The example in the text illustrates that some businesses aren’t utilizing an effective marketing opportunity, not that they aren’t improving the appearance of their marketing. Choice C is incorrect because in this context, \"endorse\" would mean openly approve or recommend, and the text’s discussion of the fact that some businesses have overlooked an effective marketing tool doesn’t support the idea that those businesses therefore don’t approve of their own marketing. Choice D is incorrect because in this context, saying that businesses don’t \"counteract\" their marketing would suggest that they don’t actively undermine it or make it ineffective. The text begins by stating that businesses typically try to promote themselves but then continues to imply that some businesses fail to take advantage of good opportunities to do so, citing the example of businesses that failed to use a free and effective marketing tool. Though it’s possible that those businesses that did use the site therefore didn’t unintentionally counteract their own marketing, the first sentence conveys that the text’s focus is on things that some businesses do and that some businesses don’t do when trying to promote themselves, and it wouldn’t make sense to say that any businesses would actively try to undermine their own marketing in pursuit of that goal."},{"i":"d8d33cc5","c":"vocab","d":"E","s":"The early British postal system required the cost of mail delivery to be paid upon receipt, a system which encouraged inventive strategies by the intended recipient to avoid payment. To improve this system, ______ were proposed in 1837, including the use of a postage stamp, a small receipt pasted to the mail indicating that delivery costs had been paid by the sender.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["investigations","expansions","reforms","possessions"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the early British postal system. In this context, \"reforms\" most nearly means attempts at improving something. The text indicates that the pay-upon-delivery postage method led to fee avoidance on the part of recipients. It then says that action was taken to improve the postal system, giving examples such as the move to having the sender pay and affixing stamps to indicate payment had been received. These represent revisions to the system intended to improve its functioning; therefore, \"reforms\" most logically completes the text. Choice A is incorrect. In this context, \"investigations\" most nearly means attempts to understand something. And although it is plausible that an attempt to improve the postal system would involve investigations, nothing in the text provides a logical basis for understanding the example of changes like affixing stamps to letters as an investigation. Choice B is incorrect. In this context, \"expansions\" most nearly means additions to something. Although the text indicates that some new policies were adopted, nothing in the text suggests that the overall number of policies increased, which expansions would seem to entail. Choice D is incorrect. In this context, \"possessions\" most nearly means items of personal property or things that otherwise belong to, or are part of, something. The text provides no logical context for understanding changes like affixing stamps to letters as possessions."},{"i":"3f37eb3b","c":"vocab","d":"M","s":"People sometimes dismiss a claim if it comes from a source they regard as self-interested, but from a strictly logical perspective, the source of a claim is ______: it has no direct bearing on whether the claim is true.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["indistinct","irrelevant","indisputable","implicit"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion about people’s tendency to dismiss claims from sources perceived as self-interested, or acting for their own advantage. In this context, \"irrelevant\" means not applicable to the matter at hand. The text explains that as a matter of logical reasoning, the source of a claim has nothing to do with the claim’s truthfulness—a claim is either true or false in actuality, regardless of where it originates. This context suggests that even though people may distrust a claim based on its source, the source of the claim is actually irrelevant. Choice A is incorrect because in this context, \"indistinct\" would mean uncertain or not clearly recognizable. Instead of suggesting that the source of a claim can’t be determined with certainty, the text suggests that recognizing a source and having an opinion of it simply doesn’t matter because as a matter of logic, a claim is true or false in actuality, regardless of where it originates. Choice C is incorrect because in this context, \"indisputable\" would mean impossible to question or deny. Although the text suggests that it isn’t logical to assume a claim is false just because its source appears to be self-interested, it doesn’t go so far as to suggest that the source of a claim can’t be questioned—the text instead makes the point that from a logical standpoint, the source of a claim doesn’t matter because the claim is either true or false in and of itself. Choice D is incorrect because in this context, \"implicit\" would mean suggested or understood without being directly expressed. Nothing in the text suggests that logically, the source of a claim is only suggested; instead of addressing whether sources can be directly identified, the text focuses on the idea that sources don’t matter because a claim is true or false in actuality, regardless of where it originates."},{"i":"d5235d39","c":"vocab","d":"E","s":"The Mule Bone, a 1930 play written by Zora Neale Hurston and Langston Hughes, is perhaps the best-known of the few examples of ______ in literature. Most writers prefer working alone, and given that working together cost Hurston and Hughes their friendship, it is not hard to see why.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["characterization","interpretation","collaboration","commercialization"],"a":2,"r":"Choice C is the best answer because it logically and precisely completes the text’s discussion of The Mule Bone, a play that Zora Neale Hurston and Langston Hughes wrote together. In this context, “collaboration” means working together with someone to write a literary work. The text indicates that most writers prefer to work alone and that working together destroyed the friendship between Hurston and Hughes. This establishes that The Mule Bone is a relatively rare example of collaboration in literature. Choice A is incorrect because in this context, “characterization” would mean a literary work’s portrayal of characters’ psychological experiences and motivations, but the text doesn’t discuss characterization in The Mule Bone specifically or in collaborative works more generally. Choice B is incorrect because in this context, “interpretation” would mean the explanation of a literary work’s meaning or significance, but the text doesn’t discuss how readers or critics have interpreted The Mule Bone; instead, the text discusses how the play was written collaboratively and how the writing process affected the two authors. Choice D is incorrect because in this context, “commercialization” would mean writing a literary work in such a way as to ensure its commercial appeal, but the text never discusses commercial appeal as a factor in the writing of The Mule Bone specifically or the writing of collaborative works more generally."},{"i":"5f56fdec","c":"purpose","d":"H","s":"The following text is from George Marion McClellan’s 1895 poem “Eternity.” My spirit swoons, and all my senses cry For Ocean’s breast and covering of the sky. Rock me to sleep, ye waves, and outward bound, Just let me drift far out from toil and care, Where lapping of the waves shall be the sound, Which mingled with the winds that gently bear Me on between a peaceful sea and sky, To make my soothing slumberous lullaby.\n\nWhich choice best states the main purpose of the text?","o":["To illustrate the increasing intensity of the speaker’s desire to escape ongoing hardship by gliding on the ocean","To contrast the demands of the speaker’s everyday life with the serenity of being rocked to sleep by the ocean","To convey the speaker’s longing for the ocean to impart a sense of inner tranquility","To justify the speaker’s qualms about being transported by the ocean to a quiet destination"],"a":2,"r":"Choice C is the best answer because it most accurately states the main purpose of the text, which is to convey the speaker’s longing for the ocean to impart a sense of inner tranquility, or peace. The text begins by expressing the speaker’s strong desire to be on the ocean, appealing directly to the waves to rock the speaker to sleep. The poem then describes the \"slumberous lullaby\" formed by the sound of the waves and the winds on which the speaker wishes to be carried \"gently...between a peaceful sea and sky.\" All these details serve to emphasize the speaker’s desire for the ocean to give them a sense of inner tranquility. Choice A is incorrect. Given the poem’s expression of a longing to achieve tranquility by drifting on the ocean, it can be inferred that the speaker desires to escape something unpleasant in daily life. However, the poem doesn’t refer directly to any such hardship—ongoing or otherwise. And since the poem doesn’t establish that the speaker is experiencing a desire to escape ongoing hardship, it can’t be said that such a desire increases in intensity. Choice B is incorrect. The speaker does express a desire for the serenity of being rocked to sleep by the ocean, and it can be inferred that this desire is a response to demands that make the speaker’s daily life stressful. However, the poem doesn’t refer directly to such demands or contrast them with the tranquility of drifting on the ocean. Choice D is incorrect because the text doesn’t suggest the speaker has any qualms, or reservations, about being transported by the ocean. On the contrary, the speaker actively desires to \"drift far out\" and be carried by the waves and wind. Moreover, the poem doesn’t suggest that this drifting would have any particular destination."},{"i":"48e4021d","c":"purpose","d":"E","s":"The following text is from Holly Goldberg Sloan’s 2017 novel Short. More than two years ago my parents bought a piano from some people who were moving to Utah. Mom and Dad gave it to my brothers and me for Christmas. I had to act really happy because it was such a big present, but I pretty much hated the thing from the second it was carried into the hallway upstairs, which is right next to my bedroom. The piano glared at me. It was like a songbird in a cage. It wanted to be set free. ©2017 by Holly Goldberg Sloan Which choice best states the main purpose of the text?","o":["It explains why the narrator always wanted a piano close to her bedroom.","It establishes how the narrator feels about the piano.","It suggests that the narrator’s brothers are talented piano players.","It describes the event that led the narrator’s parents to buy a piano."],"a":1,"r":"Choice B is the best answer because it best states the main purpose of the text, which is to establish the narrator’s feelings about the piano. The narrator reveals that she “had to act really happy” about the piano even though she “pretty much hated the thing” as soon as it was placed upstairs near her bedroom. The narrator also describes the piano as glaring at her and compares it to a caged bird that wants to be set free. These details establish the narrator’s feelings about the piano, suggesting that it makes her uneasy. Choice A is incorrect because the text indicates that the narrator hated having the piano upstairs right next to her bedroom, not that she wanted a piano to be close to her bedroom. Choice C is incorrect because the only information provided in the text about the narrator’s brothers is that they were given the piano along with the narrator. Choice D is incorrect because the text does not describe the event that led the narrator’s parents to buy the piano from the people moving to Utah. Instead, the text focuses on the narrator’s feelings about the piano after it was given to her and her brothers."},{"i":"74446089","c":"func","d":"M","s":"For his 1986 album Keyboard Fantasies, Beverly Glenn-Copeland wrote songs grounded in traditional soul and folk music, then accompanied them with futuristic synthesizer arrangements featuring ambient sounds and complex rhythms. The result was so strange, so unprecedented, that the album attracted little attention when first released. In recent years, however, a younger generation of musicians has embraced the stylistic experimentation of Keyboard Fantasies. <u>Alternative R&amp;B musicians Blood Orange and Moses Sumney, among other contemporary recording artists, cite the album as an influence.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It urges contemporary musicians to adopt the unique sound of Keyboard Fantasies.","It responds to criticism of Keyboard Fantasies by some younger musicians.","It offers examples of younger musicians whose work has been impacted by Keyboard Fantasies.","It contrasts Keyboard Fantasies with the recordings of two younger musicians."],"a":2,"r":"Choice C is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The text’s subject is Beverly Glenn-Copeland’s 1986 album Keyboard Fantasies, notable for its innovative, experimental arrangements. According to the text, the album was not initially admired, but in recent years it has become popular among younger musicians. The underlined portion of the text mentions two of those musicians, Blood Orange and Moses Sumney, who “cite the album as an influence.” Therefore, the underlined portion of the text offers examples of younger musicians whose work has been impacted by Keyboard Fantasies. Choice A is incorrect because even though the underlined sentence states that Blood Orange and Moses Sumney were influenced by Keyboard Fantasies, it doesn’t say that all other musicians should also embrace the album’s experimental style. Choice B is incorrect. Although the text states that Keyboard Fantasies was not admired on its first release, the text doesn’t present any criticism of the album by younger musicians: it only presents two younger musicians who cite it as an influence. Choice D is incorrect because the underlined sentence doesn’t mention any differences between Keyboard Fantasies and the work of Blood Orange and Moses Sumney."},{"i":"47598085","c":"func","d":"M","s":"<u>Yawn contagion occurs when one individual yawns in response to another’s yawn.<\/u> Studies of this behavior in primates have focused on populations in captivity, but biologist Elisabetta Palagi and her colleagues have shown that it can occur in wild primate populations as well. In their study, which focused on a wild population of gelada monkeys (Theropithecus gelada) in Ethiopia, the researchers further reported that yawn contagion most commonly occurred in males and across different social groups instead of within a single social group.\n\nWhich choice best describes the function of the first sentence in the text as a whole?","o":["It defines a phenomenon that is discussed in the text.","It introduces a problem that is examined in the text.","It makes a claim that is challenged in the text.","It presents a hypothesis that is evaluated in the text."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the first sentence functions in the text as a whole. The first sentence introduces what yawn contagion is, explaining that it occurs when an individual yawns in response to the yawn of another individual. The text goes on to describe Elisabetta Palagi and her colleagues’ study of this phenomenon in a wild population of gelada monkeys. According to the text, the study showed that wild primate populations experience yawn contagion and that the behavior occurs most commonly in male monkeys and across social groups. Thus, the function of the first sentence is to define the phenomenon of yawn contagion that is discussed in the text. Choice B is incorrect. Although the first sentence introduces the text’s discussion of yawn contagion, it doesn’t present this behavior, or anything else, as a problem. Choice C is incorrect because the first sentence doesn’t present a claim but instead explains what yawn contagion is. Moreover, the text doesn’t challenge anything; it’s an informative text that describes the findings of a research study about yawning in wild primate populations. Choice D is incorrect. Although the text describes a scientific study, and most scientific studies are guided by a hypothesis, the text doesn’t say what Palagi and her colleagues’ hypothesis was; the text discusses their findings instead."},{"i":"805e361d","c":"structure","d":"E","s":"Companies are providing consumers with more opportunities to purchase customized products than ever before. Whether buying customized sneakers, jewelry, or clothing, consumers can participate in the design of products to meet their specific needs and tastes. In turn, companies profit too: studies have shown that consumers are willing to pay more and wait longer for a customized product. Still, it can be difficult for companies to offer customization while keeping costs low, as the standard methods of mass production may not be able to accommodate making a unique product each time.\n\nWhich choice best describes the overall structure of the text?","o":["It discusses several recent innovations in product manufacturing and then suggests some potential applications of those innovations.","It describes a company’s recent success with new products and then explains multiple factors that may have contributed to that success.","It introduces a trend in consumer products and then explains how the trend both benefits and poses a challenge to companies.","It presents two contrasting product-marketing techniques and then provides examples of one of those techniques."],"a":2,"r":"Choice C is the best answer because it presents the best description of the overall structure of the text. The text begins by stating that companies are increasingly giving consumers opportunities to customize products, allowing them to make design choices when buying certain sneakers, jewelry, and clothing. The text then indicates that although this trend benefits companies because they can successfully charge buyers more for customized products and don’t have to rush production, it also poses a challenge because producing unique items may require different and more expensive methods than the ones typically used for mass production, raising the companies’ costs. Thus, the text first introduces a trend in consumer products and then explains how the trend both benefits and poses a challenge to companies. Choice A is incorrect because the text doesn’t present the customization of various products as a recent innovation—the fact that there are \"more opportunities\" now indicates that there were opportunities before—and no other innovations, in product manufacturing or otherwise, are discussed. Choice B is incorrect because the text doesn’t discuss any particular company or example and instead speaks broadly about the trend of companies providing customizable products. Choice D is incorrect. Although the text discusses companies offering something that consumers like and are willing to pay more for—the ability to customize products—it doesn’t characterize this as a product-marketing technique and doesn’t compare it to any other kind of offering or technique."},{"i":"88bb0f6f","c":"cross","d":"E","s":"Text 1 A team led by Bernardo Strassburg has found that rewilding farmland (returning the land to its natural state) could help preserve biodiversity and offset carbon emissions. The amount of farmland that would need to be restored, they found, is remarkably low. Rewilding a mere 15% of the world’s current farmland would prevent 60% of expected species extinctions and help absorb nearly 299 gigatons of carbon dioxide—a clear win in the fight against the biodiversity and climate crises.\n\nText 2 While Strassburg’s team’s findings certainly offer encouraging insight into the potential benefits of rewilding, it’s important to consider potential effects on global food supplies. The researchers suggest that to compensate for the loss of food-producing land, remaining farmland would need to produce even more food. Thus, policies focused on rewilding farmland must also address strategies for higher-yield farming.\n\nWhich choice best describes a difference in how the author of\n\nText 1 and the author of\n\nText 2 view Strassburg’s team’s study?","o":["The author of Text 2 approaches the study’s findings with some caution, whereas the author of Text 1 is optimistic about the reported potential environmental benefits.","The author of Text 2 claims that the percentage of farmland identified by Strassburg’s team is too low for rewilding to achieve meaningful results, whereas the author of Text 1 thinks the percentage is sufficient.","The author of Text 2 believes that the results described by Strassburg’s team are achievable in the near future, whereas the author of Text 1 argues that they likely aren’t.","The author of Text 2 focuses on rewilding’s effect on carbon emissions, whereas the author of Text 1 focuses on its effect on biodiversity."],"a":0,"r":"Choice A is the best answer. Text 1 is extremely positive about Strassburg’s team’s findings, calling the potential results \"a clear win in the fight against the biodiversity and climate crises.\" Text 2 is not as positive, arguing that while the findings point to \"potential benefits,\" we also need to consider the \"potential effects on global food supplies.\" Choice B is incorrect. This isn’t a difference between the two views. Text 1 does present the 15% number as enough to achieve meaningful results, but that’s not what Text 2 takes issue with: rather, Text 2 argues that we need to consider the effect that rewilding this much farmland would have on food supplies. Choice C is incorrect. This isn’t a difference between the two views. Neither text mentions the timeline for achieving the results described by Strassburg’s team. Choice D is incorrect. This isn’t a difference between the two views. Text 1 focuses on rewilding’s effects on both carbon emissions and biodiversity. Text 2 doesn’t focus on rewilding’s effect on carbon emissions at all. Instead, it focuses on a third factor: global food supplies."},{"i":"c889e52e","c":"main","d":"E","s":"In 1935 Hallie Flanagan was chosen to lead the Federal Theatre Project (FTP). This project was part of the new Works Progress Administration (WPA), a program created by President Franklin D. Roosevelt to provide jobs for unemployed people during the Great Depression. As the director of the FTP , Flanagan created jobs for over 12,500 performers, designers, and other theater professionals across the country. She also kept ticket prices low for the shows they staged, which meant that many people could afford to experience theater for the first time.\n\nWhich choice best states the main idea of the text?","o":["Jobs provided by the FTP were intended mainly for performers, designers, and other theater professionals.","President Roosevelt created the WPA to provide jobs for unemployed people.","During the Great Depression, many people couldn’t afford to buy theater tickets.","As the director of the FTP , Flanagan succeeded in creating many jobs and introducing people to theater."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text begins by stating that Flanagan was chosen in 1935 to lead the Federal Theatre Project (FTP), which was part of a program created by President Franklin D. Roosevelt. The text then explains that as the director of the FTP , Flanagan created jobs for more than 12,500 theater professionals and ensured that ticket prices stayed low so that many people could afford to experience theater for the first time. Thus, the main idea of the text is that as the FTP’s director, Flanagan succeeded in creating many jobs and introducing people to theater. Choice A is incorrect. The text does suggest that jobs provided by the FTP were intended mainly for theater professionals, but this isn’t the text’s main idea. The focus of the text is Hallie Flanagan’s work as the director of the FTP , with the text’s main point being that Flanagan succeeded in creating many jobs and introducing people to theater. Choice B is incorrect. The text does state that President Roosevelt created the WPA to provide jobs for unemployed people, but this is supporting information, not the text’s main idea. The focus of the text is Hallie Flanagan’s work as the director of the FTP , which was part of the WPA, and the text’s main point is that Flanagan succeeded in creating many jobs and introducing people to theater. Choice C is incorrect. It’s true that many people couldn’t afford to buy theater tickets during the Great Depression, but this isn’t the text’s main idea. The focus of the text is Hallie Flanagan’s work as the director of the FTP , with the text’s main point being that Flanagan succeeded in creating many jobs and introducing people to theater."},{"i":"1ba5ad7a","c":"main","d":"H","s":"Many literary theorists distinguish between fabula, a narrative’s content, and syuzhet, a narrative’s arrangement and presentation of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative—he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by interactions between the artist, the work, and the audience.\n\nWhich choice best states the main idea of the text?","o":["Literary theorist Mikhail Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives.","Literary theorist Mikhail Bakhtin claimed that meaning is not inherent in a narrative but is created when an audience encounters a narrative so that narratives are interpreted differently by different people.","The storytelling methods used in The Godfather Part II may seem unusually complicated, but they can be easily understood when two concepts from literary theory are utilized.","Narratives that are told out of chronological order are more difficult for audiences to understand than are narratives presented chronologically."],"a":0,"r":"Choice A is the best answer because it most accurately states the main idea of the text. The text begins by explaining that many literary theorists rely on the concepts of fabula (a narrative’s content) and syuzhet (a narrative’s arrangement and presentation of events) and illustrates these concepts by explaining how they can be applied to the film The Godfather Part II. The text then discusses how Mikhail Bakhtin, a literary theorist, argued that fabula and syuzhet can’t fully describe a narrative, since systematic categorizations such as these fail to account for all the ways in which interactions between the artist, the work, and the audience produce meaning. Thus, the main idea is that Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives. Choice B is incorrect because according to the text, Mikhail Bakhtin believed that meaning was created through the interactions of the artist, narrative, and audience, not simply through the interaction between the audience and narrative; moreover, the text doesn’t address whether Bakhtin focused on the ways in which different people interpret narratives differently. Choice C is incorrect. Although the text implies that the storytelling methods used in The Godfather Part II are complicated, it discusses the film only to illustrate how the concepts of fabula and syuzhet may be applied to a narrative. The film’s storytelling methods aren’t the primary focus of the text. Choice D is incorrect. The text discusses The Godfather Part II, whose narrative doesn’t adhere to a single chronological order, only to illustrate the concepts of fabula (a narrative’s content) and syuzhet (a narrative’s arrangement and presentation of events). The primary focus of this text isn’t the structure of this film or of other narratives that are told out of chronological order; moreover, the text doesn’t consider whether such structures make it harder for audiences to understand narratives."},{"i":"a44c7bd4","c":"infer","d":"H","s":"Some ethicists hold that the moral goodness of an individual’s actions depends solely on whether the actions themselves are good, irrespective of the context in which they are carried out. Philosopher L. Sebastian Purcell has shown that surviving works of Aztec (Nahua) philosophy express a very different view. Purcell reveals that these works posit an ethical system in which an individual’s actions are judged in light of how well they accord with the individual’s role in society and how well they contribute to the community. To the extent that these works are representative of Aztec thought, Purcell’s analysis suggests that ______ Which choice most logically completes the text?","o":["the Aztecs would have disputed the idea that the morality of an individual’s actions can be assessed by appealing to standards of behavior that are independent of the individual’s social circumstances.","the Aztecs would not have accepted the notion that the morality of an individual’s actions can be fairly evaluated by people who do not live in the same society as that individual.","actions by members of Aztec society who contributed a great deal to their community could be judged as morally good even if those actions were inconsistent with behaviors the Aztecs regarded as good in all contexts.","similar actions performed by people in different social roles in Aztec society would have been regarded as morally equivalent unless those actions led to different outcomes for the community."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion about Aztec (Nahua) ethics. The text indicates that, according to Purcell’s interpretation of available Aztec philosophical works, the Aztec ethical system views an individual’s actions in relation to that individual’s societal role and how the actions affect the community. The text contrasts this view with another held by some ethicists, namely that actions are morally good or bad regardless of the context in which they occur. Thus, Purcell’s analysis suggests that the Aztecs would have asserted that the morality of an individual’s actions are rooted in that person’s position in the community and the actions’ effects and therefore cannot be determined in the absence of that context. Choice B is incorrect. Although the text indicates that morally judging an action according to Aztec ethics requires an understanding of the action’s effects and the individual’s social circumstances, it does not specify that only members of that society can acquire this information. Choice C is incorrect because it implies that the Aztecs considered some actions good or bad regardless of the surrounding context, which contradicts the text’s claim that the Aztecs believed that the morality of an individual’s action is dependent on the action’s effects on the community and the person’s specific circumstances. Choice D is incorrect. Although the text indicates that in Aztec ethics the morality of an action depends in part on how it affects the community, this is only one of the two factors—the other being the person’s societal role—that need to be considered. Therefore, it is possible that two actions with the same effect on the community could be considered morally distinct if they are performed by individuals in different social roles."},{"i":"fd1095d7","c":"infer","d":"H","s":"To address the susceptibility of materials used in components of high-performance machinery, such as aircraft engines, to creep (deformation that is induced by persistent mechanical stress and that often occurs at elevated temperatures), materials researchers have developed silicon carbide (SiC) fibers for producing aerospace composites. Testing the thermomechanical properties of several commercially available SiC fibers, Ramakrishna T . Bhatt et al. found that in comparison with two polymer-derived SiC fibers, a nitrogen-treated SiC fiber exhibited a lower minimum creep rate, a measure of the rate at which a stress-exposed material deforms at a constant temperature and uniaxial load. The finding suggests that ______ Which choice most logically completes the text?","o":["unlike the two polymer-derived SiC fibers, the nitrogen-treated SiC fiber can substantially inhibit creep, provided that temperatures and loads are consistent.","the two polymer-derived SiC fibers likely hold similar potential for reducing the creep resistance of materials exposed to stress and elevated temperatures, thus prolonging the life span of aerospace machinery.","composites based on the two polymer-derived SiC fibers have chemical properties that may improve the mechanical and thermal stability of aerospace equipment to a greater extent than do composites based on the nitrogen-treated SiC fiber.","aerospace composites containing the nitrogen-treated SiC fiber may have the ability to withstand mechanical stress for a longer period of time than can aerospace composites containing either of the two polymer-derived SiC fibers."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of silicon carbide (SiC) fibers and creep, or deformation related to ongoing mechanical stress and elevated temperatures. The text states that Bhatt et al. found that a nitrogen-treated SiC fiber had a lower minimum creep rate than two polymer-derived SiC fibers did. Because having a lower creep rate means that the material is slower to deform with exposure to stress, as the text explains, this finding suggests that aerospace composites made with the nitrogen-treated SiC fiber may be able to withstand mechanical stress for a longer period than those made with the other two polymer-derived SiC fibers can. Choice A is incorrect because it overstates the implications of the study’s findings, which have to do with the rate of a material’s deformation under stress, not the absolute degree of deformation. The text states that Bhatt et al. observed that a nitrogen-treated SiC fiber had a lower minimum creep rate than two polymer-derived SiC fibers did, meaning only that it deformed more slowly over time under constant stress, not that it underwent less deformation overall. Choice B is incorrect because the text doesn’t establish any similarity between the two polymer- derived SiC fibers other than that both had a higher creep rate than the nitrogen-treated SiC fiber did in Bhatt et al.’s study. Moreover, reducing a material’s resistance to creep would mean that the material becomes more susceptible to deformation with exposure to stress and elevated temperatures, which would be expected to shorten rather than prolong the lifespan of machinery made with that material. Choice C is incorrect because the text suggests that the stability of aerospace equipment may be better improved by composites containing nitrogen-treated SiC fiber than by composites containing the two polymer-derived SiC fibers, not the other way around. The text indicates that Bhatt et al. observed that the nitrogen-treated SiC fiber had a lower minimum creep rate than the other two fibers did, meaning that it was slower to degrade under exposure to mechanical stress and elevated temperatures—suggesting that it may remain stable for longer periods."},{"i":"39e440e4","c":"claim","d":"H","s":"Archaeologists have held that the Casarabe culture, which emerged in the southwestern Amazon basin in the first millennium CE, was characterized by a sparse, widely distributed population and little intervention in the surrounding wilderness. Recently, however, archaeologist Heiko Prümers and colleagues conducted a study of the region using remote-sensing technology that enabled them to create three-dimensional images of the jungle-covered landscape from above, and the researchers concluded that the Casarabe people developed a form of urbanism in the Amazon basin.\n\nWhich finding about the remote-sensing images, if true, would most directly support Prümers and colleagues’ conclusion?","o":["They show shapes consistent with widely separated settlements of roughly equal small size surrounded by uncultivated jungle.","They show shapes consistent with long-distance footpaths running from Casarabe territories to large cities outside the region inhabited by the Casarabe people.","They show shapes consistent with scattered small farms created by clearing jungle areas near sources of fresh water.","They show shapes consistent with monumental platforms and dense central settlements linked to smaller settlements by a system of canals and roadways."],"a":3,"r":"Choice D is the best answer. This finding, if true, would support the archaeologists’ conclusion. Dense central settlements linked to smaller ones would provide evidence of cities and suburbs—in other words, “a form of urbanism.” Choice A is incorrect. This finding, if true, would weaken the archaeologists’ conclusion. Widely separated, small settlements with jungle in between would support the long-held belief that the Casarabe culture “was characterized by a sparse, widely distributed population and little intervention in the surrounding wilderness.” Choice B is incorrect. This choice wouldn’t support the researchers’ conclusion. These large cities are located outside Casarabe territory, which doesn’t show evidence of Casarabe urbanism. Choice C is incorrect. This finding wouldn’t support the archaeologists’ conclusion. Scattered small farms in jungle clearings are not good evidence to support the existence of cities (“a form of urbanism”)."},{"i":"29f5c8c2","c":"claim","d":"M","s":"Fish whose DNA has been modified to include genetic material from other species are known as transgenic. Some transgenic fish have genes from jellyfish that result in fluorescence (that is, they glow in the dark). Although these fish were initially engineered for research purposes in the 1990s, they were sold as pets in the 2000s and can now be found in the wild in creeks in Brazil. A student in a biology seminar who is writing a paper on these fish asserts that their escape from Brazilian fish farms into the wild may have significant negative long-term ecological effects.\n\nWhich quotation from a researcher would best support the student’s assertion?","o":["“In one site in the wild where transgenic fish were observed, females outnumbered males, while in another the numbers of females and males were equivalent.”","“Though some presence of transgenic fish in the wild has been recorded, there are insufficient studies of the impact of those fish on the ecosystems into which they are introduced.”","“The ecosystems into which transgenic fish are known to have been introduced may represent a subset of the ecosystems into which the fish have actually been introduced.”","“Through interbreeding, transgenic fish might introduce the trait of fluorescence into wild fish populations, making those populations more vulnerable to predators.”"],"a":3,"r":"Choice D is the best answer because this quotation would best support the student’s assertion that the escape of transgenic fish from Brazilian fish farms into the wild may have significant negative long-term ecological effects. The text explains that transgenic fish have DNA that includes genetic material from other species, that some transgenic fish have genes from jellyfish that make them glow in the dark, and that glow-in-the- dark transgenic fish can now be found in the wild in Brazilian creeks. The quotation indicates why the escape of these fish may have negative long-term ecological effects: glow-in-the-dark transgenic fish might introduce fluorescence into wild fish populations by breeding with wild fish, causing wild fish to glow in the dark and thereby allowing predators to prey on them much more easily. Choice A is incorrect because this quotation doesn’t mention any negative effects of the introduction of fluorescent transgenic fish into the wild. The quotation merely compares the ratio of females to males at two sites in the wild where transgenic fish have been observed. Choice B is incorrect because this quotation doesn’t support the idea that the escape of fluorescent transgenic fish from Brazilian fish farms may have significant negative long-term ecological effects. Rather, the quotation suggests that more research is needed to understand the effects. Choice C is incorrect because this quotation supports the idea that transgenic fish may be present in more ecosystems than has been observed; it doesn’t address whether the presence of fluorescent transgenic fish affects these ecosystems."},{"i":"8af28416","c":"graph","d":"E","s":"","o":["Washington had between 600 and 800 organic farms.","New York had fewer than 800 organic farms.","Wisconsin and Iowa each had between 1,200 and 1,400 organic farms.","Pennsylvania had more than 1,200 organic farms."],"a":0,"r":"Choice A is the best answer because it uses data from the graph to accurately complete the text. The graph shows the number of organic farms located in each of six US states in 2016: between 2,600 and 2,800 in California; between 1,200 and 1,400 in Wisconsin; between 1,000 and 1,200 in New York; approximately 800 in Pennsylvania; and between 600 and 800 in both Iowa and Washington. The last sentence of the text provides information about the number of organic farms in 2016, first describing the number in California. The best completion of the sentence is the choice that accurately describes the number of organic farms in 2016 in another state, which the assertion that Washington had between 600 and 800 organic farms provides. Choice B is incorrect because it doesn’t accurately reflect the data from the graph. The graph indicates that there were between 1,000 and 1,200 organic farms in New York, not fewer than 800 organic farms. Choice C is incorrect because it doesn’t accurately reflect the data from the graph. While the graph indicates that there were between 1,200 and 1,400 organic farms in Wisconsin in 2016, there were only between 600 and 800 in Iowa. Choice D is incorrect because it doesn’t accurately reflect the data from the graph. The graph indicates that in 2016 there were approximately 800 organic farms in Pennsylvania, not more than 1,200."},{"i":"81498c6a","c":"graph","d":"E","s":"","o":["$31.78.","$23.72.","$22.98.","$28.94."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the text’s discussion of how much a grower could have expected to receive on average for a box of lemons in July 2021. The table lists the average prices received by US citrus growers in dollars per box for grapefruits, oranges, and lemons in June 2020, June 2021, July 2020, and July 2021. According to the table, the average price of a box of lemons in July 2021 was $31.78. Choice B is incorrect because the text indicates that the employee of a citrus grower wishes to know the average price for a box of lemons in July 2021. According to the table, $23.72 was the average price for a box of grapefruits in June 2021, not for a box of lemons in July 2021. Choice C is incorrect because the text indicates that the employee of a citrus grower wishes to know the average price for a box of lemons in July 2021. According to the table, $22.98 was the average price for a box of grapefruits in July 2021, not for a box of lemons in July 2021. Choice D is incorrect because the text indicates that the employee of a citrus grower wishes to know the average price for a box of lemons in July 2021. According to the table, $28.94 was the average price for a box of lemons in June 2021, not in July 2021."},{"i":"353890a1","c":"fss","d":"E","s":"Water is constantly moving and changing forms on Earth and in the atmosphere. This process is called the water cycle, and it is typically thought to consist of evaporation, condensation, and precipitation. However, the National Oceanic and Atmospheric Administration seeks ______ understanding of the water cycle to include transpiration, sublimation, and other types of water movement.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is expanding","to expand","has expanded","expands"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite to-infinitive verb “to expand” is correctly used to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do. Choice A is incorrect because it results in an ungrammatical sentence. The finite verb “is expanding” can’t be used in this way to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do. Choice C is incorrect because it results in an ungrammatical sentence. The finite verb “has expanded” can’t be used in this way to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb “expands” can’t be used in this way to form a subordinate clause that indicates what the National Oceanic and Atmospheric Administration seeks to do."},{"i":"f10b7ce4","c":"fss","d":"H","s":"In the list “Adorable Things” from Sei Shōnagon’s Pillow Book, the author delights in baby sparrows, a face drawn on a melon, and a young courtier in ceremonial garb. So shrewd an observer is Shōnagon, a lady-in-waiting to Empress Teishi, that her book’s musings on tenth-century Japanese courtly life ______ readers a thousand years later.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["fascinate","has fascinated","fascinates","is fascinating"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The plural verb \"fascinate\" agrees in number with the plural subject \"musings.\" Choice B is incorrect because the singular verb \"has fascinated\" doesn’t agree in number with the plural subject \"musings.\" Choice C is incorrect because the singular verb \"fascinates\" doesn’t agree in number with the plural subject \"musings.\" Choice D is incorrect because the singular verb \"is fascinating\" doesn’t agree in number with the plural subject \"musings.\""},{"i":"9eb43963","c":"fss","d":"M","s":"Water in the North Atlantic Ocean is pushed eastward by powerful winds, but the rotation of Earth and interference from nearby landmasses together cause ______ to swirl into a massive, churning whirlpool—also called the North Atlantic Gyre—that spins clockwise.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["these","those","them","it"],"a":3,"r":"Choice D is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"water\" and clearly indicates that the water swirls into a whirlpool. Choice A is incorrect. The plural pronoun \"these\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water—not another plural noun in the sentence, such as \"landmasses\" or \"winds\"—swirls into a whirlpool. Choice B is incorrect. The plural pronoun \"those\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water—not another plural noun in the sentence, such as \"landmasses\" or \"winds\"—swirls into a whirlpool. Choice C is incorrect. The plural pronoun \"them\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water—not another plural noun in the sentence, such as \"landmasses\" or \"winds\"—swirls into a whirlpool."},{"i":"f78997cf","c":"bound","d":"H","s":"Recent analysis of 32532 Thereus—an outer solar system object orbiting the Sun between Jupiter and Saturn—has determined its color to be gray, suggesting an icy composition. Such interpretations are ultimately ______ the object’s gray coloration may be an incidental effect of radiation, solar wind, or collisions with other objects rather than evidence of its physical makeup.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["speculative, though","speculative, though;","speculative; though","speculative, though,"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of punctuation in a sentence. This choice correctly uses a comma to separate the supplementary adverb \"though\" from the preceding main clause (\"Such interpretations are ultimately speculative\") and uses a semicolon to join the next main clause (\"the object’s...makeup\") to the rest of the sentence. Further, placing the semicolon after \"though\" indicates that the information in the preceding main clause (interpretations of an outer solar system object’s composition based on its color are ultimately speculative) is a qualification of the information in the previous sentence (the composition of an outer solar system object is suggested by its color). Choice A is incorrect because it fails to mark the boundary between the two main clauses with appropriate punctuation. Choice C is incorrect because placing the semicolon after \"speculative\" illogically indicates that the information in the next main clause (\"the object’s...makeup\") is a qualification of the information in the previous clause (\"Such...speculative\"). Choice D is incorrect because it results in a comma splice. Commas can’t be used in this way to punctuate a supplementary word or phrase between two main clauses."},{"i":"8772475b","c":"bound","d":"H","s":"For thousands of years, humans have used domesticated goats (Capra hircus) to clear land of unwanted vegetation. When it comes to their diets, goats are notoriously ______ they will devour all kinds of shrubs and weeds, leaving virtually no part of any plant unconsumed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["indiscriminate and","indiscriminate,","indiscriminate","indiscriminate:"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between two main clauses. In this choice, a colon is correctly used to mark the boundary between one main clause (\"goats are notoriously indiscriminate\") and another main clause (\"they will devour all kinds of shrubs and weeds\") and to introduce the following explanation of goats’ nondiscriminatory behavior when it comes to what they eat. Choice A is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Furthermore, the conjunction \"and\" fails to indicate that what follows is an explanation of goats’ nondiscriminatory behavior when it comes to their diets. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to join two main clauses (\"goats…indiscriminate\" and \"they…weeds\"). Choice C is incorrect because it results in a run-on sentence. The two main clauses (\"goats…indiscriminate\" and \"they…weeds\") are fused without punctuation and/or a conjunction."},{"i":"aec8d3e8","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Chemical leavening agents cause carbon dioxide to be released within a liquid batter, making the batter rise as it bakes. Baking soda and baking powder are chemical leavening agents. Baking soda is pure sodium bicarbonate. To produce carbon dioxide, baking soda needs to be mixed with liquid and an acidic ingredient such as honey. Baking powder is a mixture of sodium bicarbonate and an acid. To produce carbon dioxide, baking powder needs to be mixed with liquid but not with an acidic ingredient. The student wants to emphasize a difference between baking soda and baking powder.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["To make batters rise, bakers use chemical leavening agents such as baking soda and baking powder.","Baking soda and baking powder are chemical leavening agents that, when mixed with other ingredients, cause carbon dioxide to be released within a batter.","Baking soda is pure sodium bicarbonate, and honey is a type of acidic ingredient.","To produce carbon dioxide within a liquid batter, baking soda needs to be mixed with an acidic ingredient, whereas baking powder does not."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes a difference between baking soda and baking powder, noting that baking soda needs to be mixed with an acidic ingredient to produce carbon dioxide but baking powder doesn’t. Choice A is incorrect. The sentence focuses on what bakers use to make batters rise; it doesn’t emphasize a difference between baking soda and baking powder. Choice B is incorrect. The sentence provides a general description of baking soda and baking powder; it doesn’t emphasize a difference between them. Choice C is incorrect. The sentence explains what baking soda and honey are; it doesn’t emphasize a difference between baking soda and baking powder."},{"i":"f4b63a04","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: In 2013, paleontology professor Hesham Sallam and his students from Mansoura University in Egypt made a discovery. The team found a partial dinosaur skeleton at a site in Egypt’s Dakhla Oasis. The skeleton belonged to a dinosaur species that lived approximately 80 million years ago. The new species was named Mansourasaurus to recognize the team that discovered it. The student wants to explain the origin of the species’ name.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Mansourasaurus, a new species discovered in Egypt in 2013, lived approximately 80 million years ago.","A partial dinosaur skeleton found in Egypt’s Dakhla Oasis belonged to a species named Mansourasaurus.","Mansourasaurus, a species that lived approximately 80 million years ago, was discovered in 2013 by Egyptian paleontologist Hesham Sallam and a team of university students.","The new species was named Mansourasaurus to recognize the team that discovered it, a professor and students from Mansoura University."],"a":3,"r":"Choice D is the best answer. It explains where the dinosaur’s name came from. Choice A is incorrect. This choice does not explain the origin of the dinosaur’s name. Choice B is incorrect. This choice does not explain the origin of the dinosaur’s name. Choice C is incorrect. This choice does not explain the origin of the dinosaur’s name."},{"i":"be44fea0","c":"trans","d":"M","s":"While studying jorō spiders, a large species originally from East Asia, University of Georgia researchers wondered if the spiders’ rapid spread throughout the southeastern US was a result of aggressive behavior. ______ they discovered that jorō spiders are gentle giants who react to even minor disturbances by “freezing” in place for an hour or more.\n\nWhich choice completes the text with the most logical transition?","o":["Therefore,","Instead,","For example,","In other words,"],"a":1,"r":"Choice B is the best answer. “Instead” logically signals that the information about the researchers’ discovery in this sentence—that jorō spiders are gentle giants who “freeze” in place when disturbed—contradicts their initial hypothesis about the spiders’ aggressiveness described in the previous sentence. Choice A is incorrect because “therefore” illogically signals that the discovery about jorō spiders’ gentleness is a result of the initial hypothesis about their aggressive behavior. Instead, the sentence presents information that contradicts the initial hypothesis. Choice C is incorrect because “for example” illogically signals that the discovery about jorō spiders’ gentleness exemplifies the initial hypothesis about their aggressive behavior. Instead, the sentence presents information that contradicts the initial hypothesis. Choice D is incorrect because “in other words” illogically signals that the discovery about jorō spiders’ gentleness is merely restating or rephrasing the initial hypothesis about their aggressive behavior. Instead, the sentence presents information that contradicts the initial hypothesis."},{"i":"660d50dc","c":"trans","d":"E","s":"Samuel Coleridge-Taylor was a prominent classical music composer from England who toured the US three times in the early 1900s. The child of a West African father and an English mother, Coleridge-Taylor emphasized his mixed-race ancestry. For example, he referred to himself as Anglo- African. ______ he incorporated the sounds of traditional African music into his classical music compositions.\n\nWhich choice completes the text with the most logical transition?","o":["In addition,","Actually,","However,","Regardless,"],"a":0,"r":"Choice A is the best answer. “In addition” logically signals that the detail in this sentence—that Coleridge-Taylor included traditional African music in his classical compositions—adds to the information in the previous sentence. Specifically, the previous sentence indicates one way in which Coleridge-Taylor emphasized his mixed-race ancestry, and the claim that follows indicates a second, additional way. Choice B is incorrect because “actually” illogically signals that the detail in this sentence is surprising in light of the information in the previous sentence. Instead, the detail adds to the information, indicating a second, additional way in which Coleridge-Taylor emphasized his mixed-race ancestry. Choice C is incorrect because “however” illogically signals that the detail in this sentence contrasts with the information in the previous sentence. Instead, the detail adds to the information, indicating a second, additional way in which Coleridge-Taylor emphasized his mixed-race ancestry. Choice D is incorrect because “regardless” illogically signals that the detail in this sentence is true despite the information in the previous sentence. Instead, the detail adds to the information, indicating a second, additional way in which Coleridge-Taylor emphasized his mixed-race ancestry."}],"img":{"8af28416":"iVBORw0KGgoAAAANSUhEUgAAArwAAAI4BAMAAAB6tSe+AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABNtUlEQVR42u1dd3wUxRf/zl5Jz80m9JZNQpN6CU360UUEAiIqohyggIAYREAENKDS0YAoXYOi0oSAIB1C+dHL0WvIhV5zc6Gm3fz+yN3l7pIQQBJIst8PH7I3Ozu7+923b95783YGkCFDhgwZMmTIkCFDhgwZMmTIkCFDRgECebJqtNATRUEo/CWA+ktZ15AIlNp0ropSK2kEQRK10UxdmScZ7AqdnPepJhQqdlURUIerNywG3DYsoSIAEK1TDWG6gnpEEADBKKujVjbfW78XIOlEEiJZGRYo0DgMlalddt2inc9XbXyholcdA/fI9zvXBm3cvDa+AQBluIt8q3XuEQDQBqVtzKuuhrbKkElFuFWC3XRA0+1olLFLHeXc2HuFSzeoo+EROQAA3gfcUqa9slHf6Ka+wWkU3zSGuOncxqgG6z84V3ncfi0UB/8t038dhGXTAG89gA+naNsvQoml+upnI0rt06o2TRt9LhBtl6CdNBZtxBmbWs4PV8/cr8Oo3egyRQvFvH+Uh1YXKoWsjoZHZOPPAJQdC+FyYIUi20tNV6wpET0iKARuUdXiPcderDLY/VqF7YRO0pb5vVpE1V6TgSYEoL92UR6tpq/gf1H function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
