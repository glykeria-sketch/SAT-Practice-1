<script>
const D={"t":"Practicetest32","q":[{"i":"a4f50d30","c":"vocab","d":"E","s":"Scientists previously thought that all electric eels belong to a single species, but a team of researchers led by zoologist C. David de Santana proved this idea wrong by ______ that there are in fact three distinct species of electric eels.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["pretending","complaining","requiring","demonstrating"],"a":3,"r":"Choice D is the best answer. “Demonstrating” means “showing,” and the text describes how de Santana disproved a previous belief in only one species of electric eel by showing that three electric eel species actually exist. Choice A is incorrect. Pretending that there are three species of electric eel might be a fun game for marine biologists, but it wouldn’t prove the existence of more than one species. Choice B is incorrect. Complaining won’t prove anything about eels, so de Santana could not have proved wrong the idea of only one species of electric eel by complaining about it. Choice C is incorrect. “Requiring” means “needing.” It wouldn’t make sense to say that de Santana “needed” there to be three distinct species of electric eel."},{"i":"d5235d39","c":"vocab","d":"E","s":"The Mule Bone, a 1930 play written by Zora Neale Hurston and Langston Hughes, is perhaps the best-known of the few examples of ______ in literature. Most writers prefer working alone, and given that working together cost Hurston and Hughes their friendship, it is not hard to see why.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["characterization","interpretation","collaboration","commercialization"],"a":2,"r":"Choice C is the best answer because it logically and precisely completes the text’s discussion of The Mule Bone, a play that Zora Neale Hurston and Langston Hughes wrote together. In this context, “collaboration” means working together with someone to write a literary work. The text indicates that most writers prefer to work alone and that working together destroyed the friendship between Hurston and Hughes. This establishes that The Mule Bone is a relatively rare example of collaboration in literature. Choice A is incorrect because in this context, “characterization” would mean a literary work’s portrayal of characters’ psychological experiences and motivations, but the text doesn’t discuss characterization in The Mule Bone specifically or in collaborative works more generally. Choice B is incorrect because in this context, “interpretation” would mean the explanation of a literary work’s meaning or significance, but the text doesn’t discuss how readers or critics have interpreted The Mule Bone; instead, the text discusses how the play was written collaboratively and how the writing process affected the two authors. Choice D is incorrect because in this context, “commercialization” would mean writing a literary work in such a way as to ensure its commercial appeal, but the text never discusses commercial appeal as a factor in the writing of The Mule Bone specifically or the writing of collaborative works more generally."},{"i":"dba9eaf8","c":"vocab","d":"H","s":"Within baleen whale species, some individuals develop an accessory spleen—a seemingly functionless formation of splenetic tissue outside the normal spleen. Given the formation’s greater prevalence among whales known to make deeper dives, some researchers hypothesize that its role isn’t ______; rather, the accessory spleen may actively support diving mechanisms.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["replicable","predetermined","operative","latent"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of baleen whale accessory spleens. In this context, “latent” means dormant or functionless. The text sets up a contrast between the idea that baleen whale accessory spleens appear not to have a function and the research indicating that the accessory spleen may actually have a role in supporting the whales’ diving mechanisms. This context therefore conveys the idea that the assumption that baleen whale accessory spleens are latent may be incorrect. Choice A is incorrect because it wouldn’t make sense to say that the role of the accessory spleen is “replicable,” or capable of being reproduced. The text indicates that the role of the accessory spleen seems to have no function, but some researchers think it does have a role; the text doesn’t address whether the role of the accessory spleen could or couldn’t be reproduced. Choice B is incorrect because suggesting that the role of the accessory spleen is “predetermined,” or decided in advance, wouldn’t make sense in context. Although the researchers may agree that the role of the accessory spleen or any other organ hasn’t been determined in advance, the text focuses on the idea that the accessory spleen was thought to have been functionless but may in fact serve an active role for baleen whales. Choice C is incorrect because it’s the opposite of what the context of the text is conveying. The second sentence of the text indicates that baleen whale accessory spleens may not be useless, not that they aren’t “operative,” or functional."},{"i":"995358b4","c":"vocab","d":"M","s":"In a 2022 study, Nicolás M. Morato and colleagues attempted to resolve a long-standing paradox: although water is critical to most reactions that enable life, during the earliest stages of Earth’s history—when most of the planet’s surface was covered by oceans—the presence of water likely ______ the formation of proteins and other biomolecules that are found in all living organisms.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["reflected","hampered","imitated","exploited"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of a scientific paradox regarding water and life during Earth’s early history. In this context, “hampered” means hindered or impeded. The text discusses a paradox, or a situation that seems to contradict itself, and indicates that one half of the paradox is that the presence of water is necessary to support most biochemical reactions that enable life. The contradictory idea, then, would be a case of the presence of water not supporting such reactions; this context suggests that the other half of the paradox is that when oceans covered most of the planet, the water likely hindered or impeded a biochemical process (the formation of biomolecules) that is important for all living organisms. Choice A is incorrect. In this context, “reflected” would mean showed or gave an indication. The text focuses on a paradox, or a seemingly self- contradictory situation, having to do with the role of water in supporting life; since the first part of the paradox has to do with water usually being essential for enabling life, the second part of the paradox should have to do with water having a negative effect on life, and water being an indication of a biomolecular process important for life wouldn’t be a negative thing. Choice C is incorrect. In this context, “imitated” would mean mimicked or copied, and it isn’t clear what it would mean to say that water being present on early Earth’s surface somehow copied the creation of biomolecules in living organisms. Choice D is incorrect. In this context, “exploited” would mean used or took advantage of, and it isn’t clear what it would mean to say that the presence of water—the fact of water being present—on early Earth’s surface somehow took advantage of a biomolecular process occurring in living organisms."},{"i":"9c759a09","c":"purpose","d":"E","s":"The following text is from Georgia Douglas Johnson’s 1922 poem “Benediction.” Go forth, my son, Winged by my heart’s desire! Great reaches, yet unknown, Await For your possession. I may not, if I would, Retrace the way with you, My pilgrimage is through, But life is calling you!\n\nWhich choice best states the main purpose of the text?","o":["To express hope that a child will have the same accomplishments as his parent did","To suggest that raising a child involves many struggles","To warn a child that he will face many challenges throughout his life","To encourage a child to embrace the experiences life will offer"],"a":3,"r":"Choice D is the best answer because it accurately states the text’s main purpose. The poem begins with the speaker urging a child to “go forth” with her encouragement (“my heart’s desire”). The speaker goes on to suggest that new experiences (“Great reaches, yet unknown”) lie ahead for the son that “life is calling” him to seek out. Thus, the main purpose is to encourage a child to embrace the experiences available to him in his life. Choice A is incorrect because the speaker encourages the child to pursue new experiences (“Great reaches”) without knowing exactly what those experiences will be (“yet unknown”) or suggesting that they should match the speaker’s own accomplishments. Choice B is incorrect because the speaker focuses on positive possibilities for her son (“Great reaches, yet unknown”) and her enthusiastic encouragement to embrace those possibilities (“life is calling you!”), while there is no mention of raising a child or associated struggles. Choice C is incorrect because the speaker frames the possibilities for her son in a positive light when she says that “great reaches, yet unknown” are waiting for him, and this positive outlook for the son is consistent throughout the text."},{"i":"19688783","c":"purpose","d":"M","s":"The following text is from Lucy Maud Montgomery’s 1908 novel Anne of Green Gables. Anne, an eleven-year-old girl, has come to live on a farm with a woman named Marilla in Nova Scotia, Canada. Anne reveled in the world of color about her. “Oh, Marilla,” she exclaimed one Saturday morning, coming dancing in with her arms full of gorgeous boughs, “I’m so glad I live in a world where there are Octobers. It would be terrible if we just skipped from September to November, wouldn’t it? Look at these maple branches. Don’t they give you a thrill—several thrills? I’m going to decorate my room with them.” “Messy things,” said Marilla, whose aesthetic sense was not noticeably developed. “You clutter up your room entirely too much with out-of-doors stuff, Anne. Bedrooms were made to sleep in.”\n\nWhich choice best states the main purpose of the text?","o":["To demonstrate that Anne has a newly developed appreciation of nature","To describe an argument that Anne and Marilla often have","To emphasize Marilla’s disapproval of how Anne has decorated her room","To show that Anne and Marilla have very different personalities"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text. The text begins by noting that Anne “reveled in the world of color about her”—that is, she takes great delight in colorful things. It then relates a scene when she enthusiastically enters the house with autumn foliage and announces that she will decorate her room with it. The focus of the text then shifts to Marilla, who has an undeveloped “aesthetic sense,” or appreciation of beauty, as can be seen when she dismisses the maple leaves as “messy things” and criticizes Anne for cluttering her room with objects from outside. This episode thus illustrates that Anne and Marilla differ in their appreciation of beauty and, more generally, in their basic character: Anne is exuberant and joyful, while Marilla is stern and critical. Therefore, the purpose of the text is to show that Anne and Marilla have very different personalities. Choice A is incorrect because the text presents Anne’s appreciation of nature as a basic personality trait, not as a newfound enthusiasm, and never indicates how recently she developed that appreciation. Choice B is incorrect. Although the text portrays Anne and Marilla as having different personalities and attitudes toward natural beauty and home decoration, it doesn’t show them engaging in an argument about this difference or suggest that they often argue about it. Choice C is incorrect. Although the text does indicate that Marilla disapproves of how Anne plans to decorate her room, Marilla’s disapproval is a supporting detail that serves to develop her personality, which the text as a whole contrasts with Anne’s personality."},{"i":"93ce86d0","c":"func","d":"H","s":"Curious about how people visually perceive objects in their dreams, Stephen LaBerge and team recruited lucid dreamers—people aware that they’re dreaming as it’s happening—for a research study. These participants were reliably able to signal when they had entered a dream state; the team then observed participants’ eye movements as they slept. <u>The smoothness with which participants’ eyes tracked objects in their dreams closely matched how sighted people who are awake visually track objects around them,<\/u> suggesting to the team that the brain perceives dream objects as the product of something other than pure imagination.\n\nWhich choice best states the function of the underlined portion in the text as a whole?","o":["To offer key evidence that undermines LaBerge and team’s initial hypothesis","To show the unexpected result that led LaBerge and team to change the focus of their study","To illustrate an important real-world implication of LaBerge and team’s main finding","To identify a comparable circumstance that helps justify LaBerge and team’s conclusion"],"a":3,"r":"Choice D is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The text first establishes that in order to investigate visual perception of objects in dreams, LaBerge and team observed the eye movements of lucid dreamers (people who are aware of their dreaming as it occurs) when these participants signaled that they were in a dream state. The underlined portion then describes a finding that rests on a comparison: the way participants’ eyes tracked objects in dream states was very similar to how sighted people track real objects when awake. Finally, the text states that the team concluded from this finding that objects in dreams are perceived as more than just products of imagination—implying that the team thinks the eye movements are an indication that the brain treats dream objects as more real than imaginary. Thus, the function of the underlined portion is to identify a circumstance that is comparable to one in the study and that helps justify LaBerge and team’s conclusion, presenting the close similarity of visual tracking in wakeful and dreaming scenarios as support for the implicit idea that the brain perceives dream objects not as imaginary but as somewhat or fully real objects. Choice A is incorrect because the text never presents LaBerge and team’s initial hypothesis, only what question they were interested in studying and what they found. So although the underlined portion does present evidence, that evidence doesn’t serve to undermine any hypothesis in the text. Choice B is incorrect because the text gives no indication that LaBerge and team changed the focus of their study at any point or that the finding described in the underlined portion (or any other finding) was unexpected or surprising. Choice C is incorrect. Rather than illustrating an implication of the main finding by LaBerge and team, the underlined portion only presents the finding itself, stating that the team found that the movements of lucid dreamers’ eyes while dreaming were very similar to those of sighted people visually tracking objects while awake. The next part of the text indicates what the finding implied to the team but still doesn’t offer a real-world example as illustration."},{"i":"3e6ad72d","c":"func","d":"H","s":"A study by a team including finance professor Madhu Veeraraghavan suggests that exposure to sunshine during the workday can lead to overly optimistic behavior. <u>Using data spanning from 1994 to 2010 for a set of US companies, the team compared over 29,000 annual earnings forecasts to the actual earnings later reported by those companies.<\/u> The team found that the greater the exposure to sunshine at work in the two weeks before a manager submitted an earnings forecast, the more the manager’s forecast exceeded what the company actually earned that year.\n\nWhich choice best states the function of the underlined sentence in the overall structure of the text?","o":["To summarize the results of the team’s analysis","To present a specific example that illustrates the study’s findings","To explain part of the methodology used in the team’s study","To call out a challenge the team faced in conducting its analysis"],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The first sentence presents the implications of Veeraraghavan’s team’s study: sunshine exposure during work hours can cause overly optimistic behavior. The underlined sentence then describes the data the team consulted and how they were used (comparing predictions about earnings to what the companies actually earned), and the final sentence presents what the team found in their examination of the data. Thus, the underlined sentence mainly functions to explain part of the methodology used in the team’s study. Choice A is incorrect because the underlined sentence explains in part how the team conducted their analysis of the effect of sunshine but doesn’t address what the team found; a broad summary is instead given in the other two sentences. Choice B is incorrect because the underlined sentence doesn’t present any specific examples from the team’s comparisons of 29,000 earnings predictions to actual earnings; it simply explains in part how the team conducted their analysis. Choice D is incorrect because the underlined sentence simply explains in part how the team conducted their analysis; the text never mentions any challenges that the team encountered in their study."},{"i":"81da17d3","c":"cross","d":"E","s":"Text 1 Italian painters in the 1500s rarely depicted themselves in their work. Even more rare were self-portrait paintings that portrayed the artist as a painter. At the time, painting was not yet respected as a profession, so painters mostly chose to emphasize other qualities in their self-portraits, like their intellect or social status. <u>In the city of Bologna, the first artist to depict themself painting was a man named Annibale Carracci.<\/u> A painting of his from around 1585 shows Carracci in front of an easel holding a palette.\n\nText 2 In their self-portraits, Bolognese artists typically avoided referring to the act of painting until the mid-1600s. However, Lavinia Fontana’s 1577 painting, Self-Portrait at the Keyboard, stands out as the earliest example of such a work by an artist from Bologna. Although the artist is depicted playing music, in the background, one can spot a painting easel by a window.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the underlined claim in\n\nText 1?","o":["Carracci and Fontana were among the most well-respected painters in Bologna at the time.","The depiction of Fontana in Self-Portrait at the Keyboard was intended to underscore the artist’s creativity.","Fontana likely inspired the reference to an easel and palette in Carracci’s painting.","Self-Portrait at the Keyboard was painted earlier than Carracci’s painting and also refers to the artist’s craft."],"a":3,"r":"Choice D is the best answer. The author of Text 2 states that Fontana’s painting, which depicts a painting easel in the background, was made in 1577, eight years before Carracci’s painting. Therefore, they might argue that Caracci was not “the first artist” to depict themself as a painter. Choice A is incorrect. The texts don’t support this choice. Neither text mentions the reputation or status of either Carracci or Fontana. Choice B is incorrect. The author of Text 2 does not comment on the intention or meaning of Fontana’s self-depiction in Self-Portrait at the Keyboard. This choice also holds little connection to the underlined claim. Choice C is incorrect. The texts don’t support this choice. The author of Text 2 does not suggest any inspirational relationship between Fontana and Carracci. The author of Text 2 is concerned with showing that Fontana’s painting is the earliest example of an artist referring to painting in their self-portrait, but makes no mention of her influence on others."},{"i":"d0f51067","c":"main","d":"H","s":"Modern dog breeds are largely the result of 160 years of owners crossbreeding certain dogs in order to select for particular physical appearances. Owners often say that some breeds are also more likely than others to have particular personality traits—basset hounds are affectionate; boxers are easy to train—but Kathleen Morrill and colleagues found through a combination of owner surveys and DNA sequencing of 2,000 dogs that while physical traits are predictably heritable among purebred dogs, behavior varies widely among dogs of the same breed.\n\nWhich choice best states the main idea of the text?","o":["Dog breeds would not exist without many years of human intervention in dogs’ reproduction.","Research fails to confirm a commonly held belief about dog breeds and behavior.","The dog breeds most popular among owners have often changed over the past 160 years.","A study of dog breeds is notable for its usage of both opinion surveys and DNA sequencing."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The text indicates that dog owners typically claim that some dog breeds are “more likely than others to have particular personality traits.” In other words, the text points out that a commonly held belief about dog breeds is that their personality traits are heritable. The text then states that Kathleen Morrill and colleagues undertook research about dog trait heritability and found that “behavior varies widely among dogs of the same breed.” Because Morrill and colleagues found evidence for variability rather than consistency in the behavior of dogs of the same breed, the statement that research fails to uphold a commonly held belief about dog breeds and behavior accurately reflects the main idea of the text. Choice A is incorrect. Although the text mentions that humans have long intervened in dogs’ reproduction by intentionally crossbreeding certain dogs, it doesn’t argue that such intervention is essential to the existence of dog breeds. Choice C is incorrect because the text doesn’t discuss the popularity of any dog breeds; breeds are mentioned as having certain traits, but the text says nothing about the popularity of these breeds or traits. Choice D is incorrect. Although the text briefly mentions that Morrill and colleagues conducted a study about dog traits using both surveys and DNA sequencing, this is not the main focus of the text. The text concerns the study’s results about the heritability of dog traits, not the particular methodology used by Morrill and colleagues."},{"i":"995d55fd","c":"main","d":"M","s":"A subject of much speculation, distinctive sets of parallel ridges mark the icy crust of Europa, Jupiter’s smallest moon. Researchers now claim that the ridges’ formation mechanism mirrors that of a strikingly similar pair on Greenland’s ice sheet. There, surface water seeped through fissures in the sheet and formed a water pocket that subsequently disrupted the overlying ice, forcing fragments of it upward and outward into peaks, as the pocket froze and expanded. Although Europa lacks liquid surface water, the same process could be driven by the moon’s subsurface ocean.\n\nWhich choice best states the main idea of the text?","o":["Researchers think that the ridges on Europa and the ridges in Greenland may have been formed by the same process even though Europa, unlike Greenland, doesn’t have liquid water on its surface.","The primary difference between the ridges on Europa and the ridges in Greenland is that unlike the Europa ridges, the Greenland ridges are parallel.","The pair of ridges found on Greenland’s ice sheet appear to have formed long before the recently discovered sets of ridges on Europa formed.","Researchers don’t understand why Europa is marked by so many sets of ridges when the moon doesn’t have any liquid water on its surface that could have collected and expanded under the icy crust."],"a":0,"r":"Choice A is the best answer because it accurately states the main idea of the text. The text focuses on formations of parallel ice ridges on Jupiter’s moon Europa that are said to be formed by the same mechanism that formed a parallel set of ridges on Greenland’s ice sheet. The text indicates that in Greenland, water on the surface seeps to the lower portion of the ice sheet, resulting in uplift that creates the ridges, and it states that although Europa lacks liquid water on its surface, the same process could be driven by an ocean below Europa’s surface. In other words, the main idea of the text is that parallel ridges in the ice on Europa and Greenland are likely caused by similar processes even though in Greenland the process begins with liquid water on the surface while Europa lacks liquid water on the surface. Choice B is incorrect because the text states outright that the ridges on Europa are parallel and furthermore refers to Greenland’s ridges as \"strikingly similar\" to those on Europa. Choice C is incorrect because the text makes no mention of when any of the ice ridges formed, either separately or relative to one another. Choice D is incorrect because the text does not indicate any uncertainty about the reason for the ice ridges on Europa and, in fact, clearly states that researchers now claim to know the mechanism that created the ridges."},{"i":"5632ffb4","c":"infer","d":"H","s":"In a study of the cognitive abilities of white-faced capuchin monkeys (Cebus imitator), researchers neglected to control for the physical difficulty of the tasks they used to evaluate the monkeys. The cognitive abilities of monkeys given problems requiring little dexterity, such as sliding a panel to retrieve food, were judged by the same criteria as were those of monkeys given physically demanding problems, such as unscrewing a bottle and inserting a straw. The results of the study, therefore, ______ Which choice most logically completes the text?","o":["could suggest that there are differences in cognitive ability among the monkeys even though such differences may not actually exist.","are useful for identifying tasks that the monkeys lack the cognitive capacity to perform but not for identifying tasks that the monkeys can perform.","should not be taken as indicative of the cognitive abilities of any monkey species other than C. imitator.","reveal more about the monkeys’ cognitive abilities when solving artificial problems than when solving problems encountered in the wild."],"a":0,"r":"Choice A is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the study of capuchin monkeys’ cognitive abilities. The text explains that the study failed to distinguish between outcomes for the tasks performed by the capuchin monkeys, such that simpler tasks requiring less dexterity, or skill, were judged by the same criteria as tasks that demanded more dexterity. Because the study didn’t account for this discrepancy, the researchers might have assumed that observed differences in performance were due to the abilities of the monkeys rather than the complexity of the tasks. In other words, the results may suggest cognitive differences among the monkeys even though such differences may not really exist. Choice B is incorrect because the text focuses on the fact that the tasks assigned to the capuchin monkeys in the study varied in difficulty and that the variety wasn’t taken into consideration. The text doesn’t suggest that the capuchin monkeys couldn’t perform certain tasks, just that some tasks were more difficult to do. Choice C is incorrect because the text doesn’t suggest that the study’s results are indicative of the abilities of capuchin monkeys but not of other monkey species; in fact, the text suggests that the results may not even be an accurate reflection of capuchin monkeys’ abilities. Choice D is incorrect because the text doesn’t indicate that the researchers compared results for artificial tasks with those for tasks encountered in the wild, although the tasks described in the text—sliding a panel and putting a straw in a bottle—are presumably artificial."},{"i":"c4d43991","c":"infer","d":"E","s":"Archaeologists have been debating the origin of a rare form of lead found in Shang dynasty (1766–1046 BCE) bronze artifacts since its presence was discovered in China in the 1990s. Different researchers have proposed theories on which regions of the world would have had the raw materials containing the specific lead in these artifacts, but no conclusive evidence has been presented. What is intriguing is that bronze artifacts from China dated after the Shang dynasty do not contain this form of lead, suggesting that ______ Which choice most logically completes the text?","o":["Shang dynasty bronze pieces are rare and therefore more valuable than those from other time periods.","the source of some of the raw materials used to make bronze was exploited only until the end of the Shang dynasty.","bronze was used for a short time during the Shang dynasty before different metals were used to make artifacts.","methods used to analyze bronze artifacts are not useful on pieces that are dated after the Shang dynasty."],"a":1,"r":"Choice B is the best answer. The passage tells us that Shang dynasty bronze artifacts contained \"a rare form of lead,\" but that bronze artifacts after this time did not contain that lead. Although we don’t know where that specific type of bronze came from, we can conclude that that source was not used after the end of the Shang dynasty—otherwise, post-Shang dynasty pieces would also contain that rare form of lead. Choice A is incorrect. Despite these pieces containing \"a rare form of lead,\" there is no direct claim in the passage that Shang dynasty bronze is itself more rare or valuable than bronze pieces from other periods. Therefore, there’s no basis for this inference. Choice C is incorrect. Although the passage mentions that the nature of the bronze in Chinese artifacts changed after the Shang dynasty, bronze was still used to create artifacts after this time. The passage in fact explicitly states \"bronze artifacts from China dated after the Shang dynasty…,\" indicating that bronze was still used in China after the Shang dynasty. Choice D is incorrect. There’s no mention in the passage of methods used to analyze bronze artifacts, so there’s no basis for this inference."},{"i":"9aa5efc4","c":"claim","d":"M","s":"Born in 1891 to a Quechua-speaking family in the Andes Mountains of Peru, Martín Chambi is today considered to be one of the most renowned figures of Latin American photography. In a paper for an art history class, a student claims that Chambi’s photographs have considerable ethnographic value—in his work, Chambi was able to capture diverse elements of Peruvian society, representing his subjects with both dignity and authenticity.\n\nWhich finding, if true, would most directly support the student’s claim?","o":["Chambi took many commissioned portraits of wealthy Peruvians, but he also produced hundreds of images carefully documenting the peoples, sites, and customs of Indigenous communities of the Andes.","Chambi’s photographs demonstrate a high level of technical skill, as seen in his strategic use of illumination to create dramatic light and shadow contrasts.","During his lifetime, Chambi was known and celebrated both within and outside his native Peru, as his work was published in places like Argentina, Spain, and Mexico.","Some of the peoples and places Chambi photographed had long been popular subjects for Peruvian photographers."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would support the claim about Chambi’s photographs. The text describes a student advancing the claim that Chambi’s photographs “have considerable ethnographic value”—meaning that they are valuable as records of cultures—and that they “capture diverse elements of Peruvian society” in a respectful way. If it’s true that Chambi carefully photographed people from a range of different communities in Peru as well as photographed the customs and sites of different communities, that would lend support to the claim that the photographs have ethnographic value as depictions of diverse elements of society in Peru. Choice B is incorrect because the student’s claim is that Chambi’s photographs have considerable ethnographic value because they depict diverse elements of Peruvian society; the student doesn’t claim anything about the technical skill demonstrated in the photographs. Choice C is incorrect because neither Chambi’s reputation nor the locations where his photographs may have been published would be relevant to the student’s claim that his photographs are valuable as an ethnographic record of Peru’s diverse society. Choice D is incorrect because the popularity among other photographers of the people and places that Chambi photographed would be irrelevant to the student’s claim that Chambi’s photographs are valuable as an ethnographic record of Peru’s diverse society."},{"i":"5f6adeee","c":"claim","d":"E","s":"Biologists have generally believed that the diet of jaguars consists mostly of land-based mammals, but researchers studying a population of jaguars living in the Brazilian Pantanal, a tropical wetland, claim that jaguars can survive on a diet of more fish and aquatic reptiles than mammals.\n\nWhich finding, if true, would most directly support the researchers’ claim?","o":["Aquatic reptile and fish remains were detected more often than were mammal remains in an analysis of jaguar waste matter found in the area.","Exceptionally high numbers of yacare caiman, an aquatic reptile, were found living in the area.","Aquatic prey like the reptiles and fish in the area provide a source of omega-3 fatty acids that aren’t often found in land mammals.","When jaguars in the area preyed on mammals, they tended to prefer semiaquatic ones like capybaras."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would support the researchers’ claim about the diets of jaguars in the Brazilian Pantanal. The text notes that jaguars generally eat land-based mammals, but researchers claim that jaguars in the Pantanal can survive on a diet that includes more fish and aquatic reptiles than mammals. Finding that the remains of aquatic reptiles and fish appear more often in these jaguars’ waste than the remains of mammals do would support the researchers’ claim, since it would suggest that fish and aquatic reptiles are a more significant part of the jaguars’ diet than mammals are. Choice B is incorrect because finding that a particular aquatic reptile exists in high numbers in the area would not support the researchers’ claim about the jaguars’ diet. The mere presence of many aquatic reptiles nearby does not mean that the jaguars eat those reptiles, let alone survive on more aquatic reptiles and fish than mammals. Choice C is incorrect. Although finding that aquatic reptiles and fish can provide nutrients that land mammals typically do not provide could help explain why some animals eat those reptiles and fish, it would not indicate whether the jaguars in particular eat those reptiles and fish and thus would not support the researchers’ claim. Choice D is incorrect because finding that when preying on mammals, jaguars prefer semiaquatic mammals, such as capybaras, would be irrelevant to the researchers’ claim that the jaguars can survive on a diet of more fish and aquatic reptiles than mammals. The type of mammals the jaguars tend to eat does not indicate anything about whether fish and aquatic reptiles are part of the jaguars’ diet."},{"i":"af125459","c":"graph","d":"E","s":"","o":["5–6 meters below the surface.","4–5 meters below the surface.","3–4 meters below the surface.","6–7 meters below the surface."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the statement about the depth at which the highest number of tools made from clamshells that Neanderthals collected from the beach was found. The table presents the depths at which Neanderthal clamshell tools were found, and, for each depth, the number of those tools made from clamshells that washed up on the beach and the number made from clamshells harvested from the seafloor. The table indicates that the highest number made from clamshells collected from the beach was 99 and that these tools were found at a depth of 3–4 meters. Choice A is incorrect because the table indicates that 18 tools made from clamshells collected from the beach were found at a depth of 5–6 meters, which is fewer than the 99 tools found at a depth of 3–4 meters. Choice B is incorrect because the table indicates that 2 tools made from clamshells collected from the beach were found at a depth of 4–5 meters, which is fewer than the 99 tools found at a depth of 3–4 meters. Choice D is incorrect because the table indicates that 1 tool made from clamshells collected from the beach was found at a depth of 6–7 meters, which is fewer than the 99 tools found at a depth of 3–4 meters."},{"i":"0014477f","c":"graph","d":"E","s":"","o":["47.3 square miles.","77.1 square miles.","32.4 square miles.","595.7 square miles."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the comparison between Pueblo tribal nations. The student identifies that the total area of Taos Pueblo is 156.2 square miles and needs to complete the comparison with the total area of Nambé Pueblo. According to the table, Nambé Pueblo has a total area of 32.4 square miles. Choice A is incorrect because according to the table, 47.3 square miles is the area of Pueblo de San Ildefonso, not of Nambé Pueblo. Choice B is incorrect because according to the table, 77.1 square miles is the area of Santa Clara Pueblo, not of Nambé Pueblo. Choice D is incorrect because according to the table, 595.7 square miles is the area of Pueblo of Acoma, not of Nambé Pueblo."},{"i":"fced396a","c":"fss","d":"H","s":"The Herfindahl-Hirschman Index (HHI), a commonly used measure of competition between companies in a particular market, ranges from a score of zero to 10,000 points. Compared with that of a highly concentrated market—that is, a market controlled by very few companies—______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["a market that is less concentrated will have a much lower HHI score.","the HHI score of a less concentrated market will be much lower.","when a market is less concentrated, its HHI score will be much lower.","a less concentrated market will have an HHI score that is much lower."],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"the HHI...market\" the subject of the sentence and places it immediately after the modifying phrase \"compared...market.\" In doing so, this choice clearly establishes that the HHI score of a less concentrated market—and not another noun in the sentence—is being compared with the HHI score of a highly concentrated market. Choice A is incorrect because it results in a dangling modifier. The placement of \"a market that is less concentrated\" immediately after the modifying phrase illogically suggests that a market is being compared with an HHI score. Choice C is incorrect because it results in a confusing, illogical sentence. The placement of the modifier \"when a market is less concentrated\" after \"a highly concentrated market\" is contradictory. Furthermore, it’s ambiguous what \"its\" is referring to in \"its HHI score,\" resulting in an illogical comparison. Choice D is incorrect because it results in a dangling modifier. The placement of \"a less concentrated market\" immediately after the modifying phrase illogically suggests that a market is being compared with an HHI score."},{"i":"d46ac7e7","c":"fss","d":"E","s":"A second-generation Japanese American, Wataru Misaka ______ in World War II (1941-45) and won two amateur national basketball championships at the University of Utah when he joined the New York Knicks for the 1947-48 season, becoming the first non-white basketball player in the US’s top professional league.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["already served","was already serving","already serves","had already served"],"a":3,"r":"Choice D is the best answer. Misaka served in World War II before he joined the New York Knicks in 1947. To show that a past occurrence took place before another past occurrence, we need to use “had” + the past tense form of the verb. This is called the past perfect tense. Choice A is incorrect. Misaka served in World War II before he joined the Knicks. Both events are in the past, but his service in World War II happened earlier, so we need a verb that makes it clear that his service (and the two national championships) had ended by the time he joined the Knicks. Choice B is incorrect. “Was already serving” forms the continuous past tense, which we use when we’re showing a past action that was ongoing. Misaka served in World War II before he joined the Knicks. Both events are in the past, but they’re not happening at the same time, so we shouldn’t use the continuous past tense here. Choice C is incorrect. Misaka served in World War II in the past, so we shouldn’t use the present tense “serves.”"},{"i":"15d6d837","c":"fss","d":"E","s":"Literary agents estimate that more than half of all nonfiction books credited to a celebrity or other public figure are in fact written by ghostwriters, professional authors who are paid to write other ______ but whose names never appear on book covers.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["people’s stories","peoples story’s","peoples stories","people’s story’s"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of plural and possessive nouns. The plural possessive noun “people’s” and the plural noun “stories” correctly indicate that there are multiple stories from multiple people. Choice B is incorrect because the context requires the plural possessive noun “people’s” and the plural noun “stories,” not the plural noun “peoples” and the singular possessive noun “story’s.” Choice C is incorrect because the context requires the plural possessive noun “people’s,” not the plural noun “peoples.” Choice D is incorrect because the context requires the plural noun “stories,” not the singular possessive noun “story’s.”"},{"i":"615f001e","c":"bound","d":"H","s":"Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this ______ the hole’s small size restricts light to a single ray, all light passing through the hole can only arrive at a single destination, eliminating diffraction and ensuring a clear image.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["works because","works. Because","works, it’s because","works: it’s because"],"a":1,"r":"Choice B is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used to correctly mark the boundary between one sentence (\"A ray...works\") and another (\"Because...image\"). Choice A is incorrect because it results in a run-on sentence. The two sentences (\"A ray…works\" and \"Because…image\") are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice D is incorrect because it results in a comma splice. Since the contraction \"it’s\" creates a main clause, the comma after \"single ray\" can’t be used in this way to mark the boundary between two main clauses (\"it’s...ray\" and \"all light…image\")."},{"i":"fcab3630","c":"bound","d":"M","s":"In his Naturalis historia, Pliny the Elder praised Hipparchus’s star catalog, a second-century BCE list of roughly 850 different stars’ celestial positions. For centuries, scholars dreamed about locating a copy of this legendary lost ______ fantasy (partially) became reality in 2022, when researchers uncovered traces of the star catalog on a palimpsest, a reused parchment.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["work, that","work that","work. That","work and that"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"For…work\") and another (\"That…parchment\"). Choice A is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice B is incorrect because it results in a run-on sentence. The sentences (\"For…work\" and \"that…parchment\") are fused without punctuation and/or a conjunction. Choice D is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join sentences."},{"i":"5bb7dc03","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Started in 1925, the Scripps National Spelling Bee is a US-based spelling competition. The words used in the competition have diverse linguistic origins. In 2008, Sameer Mishra won by correctly spelling the word “guerdon.” “Guerdon” derives from the Anglo-French word “guerdun.” In 2009, Kavya Shivashankar won by correctly spelling the word “Laodicean.” “Laodicean” derives from the ancient Greek word “Laodíkeia.” The student wants to emphasize a difference in the origins of the two words.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["“Guerdon,” the final word of the 2008 Scripps National Spelling Bee, is of Anglo-French origin, while the following year’s final word, “Laodicean,” derives from ancient Greek.","In 2008, Sameer Mishra won the Scripps National Spelling Bee by correctly spelling the word “guerdon”; however, the following year, Kavya Shivashankar won based on spelling the word “Laodicean.”","Kavya Shivashankar won the 2009 Scripps National Spelling Bee by correctly spelling “Laodicean,” which derives from the ancient Greek word “Laodíkeia.”","The Scripps National Spelling Bee uses words from diverse linguistic origins, such as “guerdon” and “Laodicean.”"],"a":0,"r":"Choice A is the best answer. Noting that “guerdon” is of Anglo-French origin and “Laodicean” is of ancient Greek origin, the sentence uses “while” to emphasize a difference in the origins of the two words. Choice B is incorrect. While the sentence emphasizes two words used in the Scripps National Spelling Bee, it doesn’t emphasize (or mention) the words’ linguistic origins. Choice C is incorrect. While the sentence specifies the linguistic origin of one word used in the Scripps National Spelling Bee, it doesn’t mention the other word or emphasize a difference in the two words’ origins. Choice D is incorrect. While the sentence makes a generalization about words used in the Scripps National Spelling Bee, it doesn’t emphasize a difference in the words’ origins."},{"i":"5b8b69a2","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Archaeologist Jon Erlandson and colleagues argue that humans first arrived in the Americas by sea. They propose that humans traveled between Pacific Ocean islands and coastlines from northeast Asia to the Americas. Many of these islands and coastal zones were later submerged as glaciers melted and sea levels rose. The researchers think that “a coastal route, including kelp forests and estuaries, would have provided a rich mix of marine, estuarine, riverine, and terrestrial resources” such as seaweeds, fish, and birds. This proposed scenario is known as the kelp highway hypothesis. The student wants to summarize the kelp highway hypothesis.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Pacific Ocean islands and coastlines likely contained “a rich mix of marine, estuarine, riverine, and terrestrial resources” such as seaweeds, fish, and birds, according to researchers.","One argument about how humans first arrived in the Americas is the kelp highway hypothesis proposed by Jon Erlandson and colleagues.","Humans may have first arrived in the Americas by sea, traveling between Pacific Ocean islands and coastlines and subsisting on a variety of resources.","As glaciers melted and sea levels rose, many Pacific Ocean islands and coastal zones were submerged."],"a":2,"r":"Choice C is the best answer. This choice summarizes the main idea of the kelp highway hypothesis, providing a high-level overview of how the hypothesis explains human migration to the Americas. Choice A is incorrect. This choice describes one aspect of the proposed scenario but doesn’t discuss human migration, which is the main focus of the kelp highway hypothesis. Choice B is incorrect. This choice introduces the kelp highway hypothesis but doesn’t explain what it entails. Choice D is incorrect. This choice describes one element of the proposed scenario but doesn’t discuss human migration, which is the main focus of the kelp highway hypothesis."},{"i":"072666a3","c":"trans","d":"E","s":"The tiny transistors that control the flow of electricity in modern devices may one day be made of wood. Researchers in Switzerland have found a way to use heat and chemicals to widen the grooves in dry pieces of balsa wood. ______ these grooves become wide enough that electrical conductors can be passed through them.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","Previously,","In contrast,","As a result,"],"a":3,"r":"Choice D is the best answer. “As a result” logically signals that the information in this sentence—that the widened grooves in balsa wood can accommodate electrical conductors—is a direct consequence of the researchers’ method described in the previous sentence (using heat and chemicals to widen the grooves). Choice A is incorrect because “for example” illogically signals that this sentence provides an example of the researchers’ method described in the previous sentence. Instead, the sentence indicates a consequence of that method. Choice B is incorrect because “previously” illogically signals that this sentence describes an event that occurred before the researchers’ development of the method described in the previous sentence. Instead, the sentence indicates a consequence of that method. Choice C is incorrect because “in contrast” illogically signals that the information in this sentence contrasts with the previous sentence’s description of the researchers’ method. Instead, the sentence indicates a consequence of that method."},{"i":"5c58cec0","c":"trans","d":"E","s":"To guarantee the validity of experimental results, scientists rely on precise, unchanging standards of measurement. ______ metrologists (scientists who study measurement) developed the SI, or International System of Units. The SI’s units of measurement are based on unchanging values in nature, such as the mass of an electron or the speed of light.\n\nWhich choice completes the text with the most logical transition?","o":["In contrast,","Regardless,","In addition,","For this reason,"],"a":3,"r":"Choice D is the best answer. \"For this reason\" logically signals that the information that follows—that metrologists developed the SI based on unchanging values in nature—is a result of the previous claim that scientists rely on precise, unchanging standards of measurement to guarantee the validity of experimental results. Choice A is incorrect because \"in contrast\" illogically signals that the information that follows contrasts with the previous claim that scientists rely on precise, unchanging standards of measurement. Instead, the information that metrologists developed the SI based on unchanging values in nature is a result of that claim. Choice B is incorrect because \"regardless\" illogically signals that the information that follows is true despite the previous claim that scientists rely on precise, unchanging standards of measure. Instead, the information that metrologists developed the SI based on unchanging values in nature is a result of that claim. Choice C is incorrect because \"in addition\" illogically signals that the information that follows is merely an additional fact related to the previous claim that scientists rely on precise, unchanging standards of measurement. Instead, the information that metrologists developed the SI based on unchanging values in nature is a result of that claim."},{"i":"a064955f","c":"trans","d":"E","s":"In most deer species, males grow antlers, and females don’t. ______ reindeer are different. They are the only deer species in which the females grow antlers, too.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","Next,","However,","Thus,"],"a":2,"r":"Choice C is the best answer. \"However\" logically signals that the claim about reindeer in this sentence contrasts with the information about most deer species in the previous sentence. Choice A is incorrect because \"similarly\" illogically signals that the claim in this sentence is similar to the previous information about most deer species. Instead, it contrasts with that information. Choice B is incorrect because \"next\" illogically signals that the claim about reindeer in this sentence is the next step in a process. Instead, it contrasts with the previous information about most deer species. Choice D is incorrect because \"thus\" illogically signals that the claim in this sentence results from the previous information about most deer species. Instead, it contrasts with that information."}],"img":{"af125459":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFEBAMAAAA3vfCZAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABEMklEQVR42u1dZ0BUxxb+5t7dpcrOBRQ7dxGNsS5YY13sMZbFlqJJsEZj8oKxxySisZtELIldsXezltgL9g5r1yiwoCY22FmwIGXn/VgQsCSKcfflZb8/C7fMzPnm3JlzzjTACSeccMIJJ5z420D+3wUUCkcKzf075Il7ChnwBmxPPH6qthbwpqKc91w5AICvqIW3JNkuKSkAeGvypeaTmwLRQEAFnTK0YEGkvPRovmTL5Xsk6HECAACxZ949+qQwea/aXhNlgMj2rhJ1uGjJ5flcATUkKKJD8eQDBKoIAEtzr+7QwiX5rEd4XhrdAACN3CPIOutVm3wNARDP5KvavKe8AAAaIOZqdw95nvbDDnnceAO/nBhly5jIbW1XR+QmnlMgEUm2Bz6O0wMASk9/fE8wAIA6UkjLJ9ssAgACMQGApx7kx6uynbUXX8LsDY13IG8CS1MIwUKAmggdSLCOK2QTHVzjMg8oYxCD5XmCLwBFdaWnEZ80XauGGIKgYFEHXxlFKWqBA7zj/MB7OqAm/FFT5ugYaKwpC9RbKKelvo0BRbAwnuL3CoMfXa98um2Mr1YIEEIQUMOyQkb6Wy14IBUCtcVH80CgKcADgWYAAv29IRMZ/UIswRCagE+vOFqERizXfbeo5aIWog48QtMU4D3BUBNoBsFXRhPCa8nBQV/pUptADAGFS9Oq+8SQAIhoWhimFIXR3suQ6mydOrdx1WtlH7aueqX7nCV1WNfqilGpdVfcm2qqaBqp/2bOW7sbK5RxX5RvL2xJ7lFbNlWadrEcVlpjZ1viqzdY7jH7k8C+Yy+uBQCOmdx0a8gfa5VjPBuAQTk2q4vWY8/PXg22ipv5hLL9O82KptZlrqUrBDcL7usxsfn29ubPyM/ldFE8a5zi54wuy7L71pzXt/x7wxpG3OsnftWnwW5xWXYneUkLXVTT8ulfzSgVmnI6LfPjiucHD53uWrNrdt+vyw5p2M10PeIqLWPIPi6p3cb98emQhms+qth5nPyfny5l function card(q,n){const a=ans[q.i];
