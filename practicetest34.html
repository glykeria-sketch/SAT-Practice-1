<script>
const D={"t":"Practicetest34","q":[{"i":"6c086e70","c":"vocab","d":"H","s":"Businesses typically try to promote themselves, but research by Michael Luca, Abhishek Nagaraj, and Gauri Subramani suggests that some do not ______ their marketing. The researchers studied restaurants in Texas and found that those listed on a popular review website (which can be done at no cost) had revenue increases of 5 percent on average, but 33 percent of restaurants studied never listed on the site.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["adorn","optimize","endorse","counteract"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of business marketing practices. In this context, \"optimize\" means make the most effective possible use of available opportunities. The text indicates that though businesses typically try to promote themselves, they don’t always make use of effective tools for doing so, pointing to research showing that 33 percent of restaurants failed to use a free listing service that increased revenue by 5 percent on average for restaurants that did use the service. The text therefore suggests that by foregoing a free and effective marketing tool, some businesses aren’t making the best use of, or optimizing, marketing opportunities. Choice A is incorrect because in this context, \"adorn\" would mean decorate or enhance the appearance of, and there’s nothing in the text to suggest that by failing to use a free and effective promotional tool, some businesses aren’t enhancing the appearance of their own marketing. The example in the text illustrates that some businesses aren’t utilizing an effective marketing opportunity, not that they aren’t improving the appearance of their marketing. Choice C is incorrect because in this context, \"endorse\" would mean openly approve or recommend, and the text’s discussion of the fact that some businesses have overlooked an effective marketing tool doesn’t support the idea that those businesses therefore don’t approve of their own marketing. Choice D is incorrect because in this context, saying that businesses don’t \"counteract\" their marketing would suggest that they don’t actively undermine it or make it ineffective. The text begins by stating that businesses typically try to promote themselves but then continues to imply that some businesses fail to take advantage of good opportunities to do so, citing the example of businesses that failed to use a free and effective marketing tool. Though it’s possible that those businesses that did use the site therefore didn’t unintentionally counteract their own marketing, the first sentence conveys that the text’s focus is on things that some businesses do and that some businesses don’t do when trying to promote themselves, and it wouldn’t make sense to say that any businesses would actively try to undermine their own marketing in pursuit of that goal."},{"i":"3654202f","c":"vocab","d":"E","s":"Radar and sonar can detect objects or people through walls, but they are too costly for consumer use. Researchers Fadel Adib and Dina Katabi have shown, however, that there may be a comparatively ______ alternative: small changes to the Wi-Fi technology used in smartphones can give users a cheap way to count people or even identify their gestures through walls.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["infrequent","inexpensive","unmistakable","impractical"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of ways to detect people through walls. In this context, \"inexpensive\" means less costly or low in price. The passage describes two kinds of methods that can be used to \"detect objects or people through walls\": radar and sonar, and changes to the Wi-Fi technology used in smartphones. The word \"comparatively\" before the blank indicates that the best answer would be one that helps to describe a comparison between the two. Radar and sonar are described as \"costly,\" while the method that uses Wi-Fi technology is described as \"cheap\"; therefore, it would be comparatively affordable, or inexpensive. Choice A is incorrect because the text indicates that a small modification to the smartphones that many consumers already own would presumably result in consumers using that technology to detect objects or people through walls more regularly, or frequently; therefore, it would not be true that such technology would be comparatively infrequent, or uncommon. Choice C is incorrect because there is nothing in the text to indicate that either radar and sonar or changes to smartphone Wi-Fi technology are capable of being misunderstood or mistaken for something else; therefore, it would not make sense to describe changes to Wi-Fi smartphone technology as comparatively unmistakable, or indisputable. Choice D is incorrect because the text indicates that a small modification to the smartphones that many consumers already own and carry with them would be more functional or practical than radar and sonar, not more impractical, or unrealistic."},{"i":"5e57efec","c":"vocab","d":"H","s":"Economist Marco Castillo and colleagues showed that nuisance costs—the time and effort people must spend to make donations—reduce charitable giving. Charities can mitigate this effect by compensating donors for nuisance costs, but those costs, though variable, are largely ______ donation size, so charities that compensate donors will likely favor attracting a few large donors over many small donors.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["supplemental to","predictive of","independent of","subsumed in"],"a":2,"r":"Choice C is the best answer. We’re told that charities that pay donors back for nuisance costs will attract a few large donors instead of many small donors. This suggests that nuisance costs are not linked to donation size. Choice A is incorrect. This doesn’t fit the logic of the text. If nuisance costs are supplemental to (meaning in addition to) donation size, that wouldn’t result in charities that compensate donors for those costs attracting a few large donors over many small donors. Choice B is incorrect. This doesn’t fit the logic of the text. If nuisance costs can predict donation size, that wouldn’t necessarily result in charities that compensate donors for those costs attracting a few large donors over many small donors. Choice D is incorrect. This doesn’t fit the logic of the text. If nuisance costs are subsumed in (meaning included in) donation size, that wouldn’t result in charities that compensate donors for those costs attracting a few large donors over many small donors."},{"i":"f99847ed","c":"vocab","d":"H","s":"For her 2021 art installation Anthem, Wu Tsang joined forces with singer and composer Beverly Glenn-Copeland to produce a piece that critics found truly ______: they praised Tsang for creatively transforming a museum rotunda into a dynamic exhibit by projecting filmed images of Glenn- Copeland onto a massive 84-foot curtain and filling the space with the sounds of his and other voices singing.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["restrained","inventive","inexplicable","mystifying"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the art installation Anthem. In this context, “inventive” means characterized by invention and creativity. The text explains that critics’ responses to the installation involved praise for Tsang’s creative transformation of a space into a dynamic exhibit with huge images and lots of sound. This context conveys that the critics found the piece particularly creative. Choice A is incorrect because the text indicates that critics praised the installation for being dynamic and including huge images and lots of sound, and it wouldn’t make sense to describe such an exhibit as “restrained,” or limited and not extravagant or showy. Choice C is incorrect because it wouldn’t make sense to say that critics found the installation “inexplicable,” or incapable of being explained or interpreted, since the critics were able to explain their praise for the installation’s transformation of a space with huge images and lots of sound. Choice D is incorrect because the text focuses on the idea that critics praised Tsang for creatively transforming a space into a dynamic exhibit, not that they found the installation “mystifying,” or bewildering and hard to understand. Nothing in the text suggests that the critics couldn’t understand the piece."},{"i":"aa7fc89b","c":"purpose","d":"M","s":"The following text is adapted from Susan Glaspell’s 1912 short story “‘Out There.’” An elderly shop owner is looking at a picture that he recently acquired and hopes to sell. It did seem that the picture failed to fit in with the rest of the shop. A persuasive young fellow who claimed he was closing out his stock let the old man have it for what he called a song. It was only a little out-of-the-way store which subsisted chiefly on the framing of pictures. The old man looked around at his views of the city, his pictures of cats and dogs, his flaming bits of landscape. “Don’t belong in here,” he fumed. And yet the old man was secretly proud of his acquisition. There was a hidden dignity in his scowling as he shuffled about pondering the least ridiculous place for the picture.\n\nWhich choice best states the main purpose of the text?","o":["To reveal the shop owner’s conflicted feelings about the new picture","To convey the shop owner’s resentment of the person he got the new picture from","To describe the items that the shop owner most highly prizes","To explain differences between the new picture and other pictures in the shop"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text. The text begins by stating that the new picture “failed to fit in” with the other items that the shop owner has. The text goes on to illustrate that point by describing the other pictures the shop owner has, indicating that the shop owner is fuming because he doesn’t think the new picture belongs in the store. In the second paragraph, however, the text indicates that the shop owner is “secretly proud of his acquisition.” The main purpose of the text is thus to reveal the shop owner’s conflicted feelings about the new picture. Choice B is incorrect because the text doesn’t suggest that the shop owner resents the young man who sold him the new picture; in fact, the text gives no indication of the owner’s feelings about the young man at all. Choice C is incorrect. Although the text indicates that the new picture is different from the other items in the shop, there’s no suggestion that the shop owner prizes either the new picture or the pictures of the city, pets, and landscapes more than he prizes any other items. Choice D is incorrect because the text doesn’t describe what the new picture looks like; rather, the text identifies some of the other kinds of images that the shop owner has and states that they’re different from the new picture without explaining how they’re different."},{"i":"82cb7dda","c":"purpose","d":"H","s":"The field of study called affective neuroscience seeks instinctive, physiological causes for feelings such as pleasure or displeasure. Because these sensations are linked to a chemical component (for example, the release of the neurotransmitter dopamine in the brain when one receives or expects a reward), they can be said to have a partly physiological basis. These processes have been described in mammals, but Jingnan Huang and his colleagues have recently observed that some behaviors of honeybees (such as foraging) are also motivated by a dopamine-based signaling process.\n\nWhat choice best describes the main purpose of the text?","o":["It describes an experimental method of measuring the strength of physiological responses in humans.","It illustrates processes by which certain insects can express how they are feeling.","It summarizes a finding suggesting that some mechanisms in the brains of certain insects resemble mechanisms in mammalian brains.","It presents research showing that certain insects and mammals behave similarly when there is a possibility of a reward for their actions."],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to summarize a finding suggesting that some mechanisms in the brains of certain insects resemble mechanisms in mammalian brains. The text begins by explaining that feelings such as pleasure and displeasure are linked to chemical processes in the brain, such as the release of dopamine when one receives a reward. The text then indicates that such processes have been seen in mammals but that researchers have recently observed similar processes involving dopamine in honeybees. Taken together, this information serves to sum up the discovery that some mechanisms in the brains of certain insects may resemble mechanisms linked to feelings such as pleasure and displeasure in mammals. Choice A is incorrect because the text doesn’t describe any experiments or experimental methods. Instead, the text describes a phenomenon that has been observed in mammals and then presents the recent observations of Huang and colleagues that this phenomenon is also seen in honeybees. Choice B is incorrect because there’s nothing in the text to suggest that certain insects can express how they’re feeling through particular processes. The text does indicate that certain honeybee behaviors such as foraging are linked to dopamine, but it doesn’t suggest that these behaviors enable honeybees to communicate feelings or sensations. Choice D is incorrect because the text presents research showing that certain honeybee behaviors such as foraging are linked to dopamine and therefore may be motivated by similar mechanisms to those in mammalian brains, not that honeybees and mammals behave similarly when there is the possibility of reward for their actions."},{"i":"e818241b","c":"func","d":"H","s":"Astronomers are confident that the star Betelgeuse will eventually consume all the helium in its core and explode in a supernova. <u>They are much less confident, however, about when this will happen, since that depends on internal characteristics of Betelgeuse that are largely unknown.<\/u> Astrophysicist Sarafina El-Badry Nance and colleagues recently investigated whether acoustic waves in the star could be used to determine internal stellar states but concluded that this method could not sufficiently reveal Betelgeuse’s internal characteristics to allow its evolutionary state to be firmly fixed.\n\nWhich choice best describes the function of the second sentence in the overall structure of the text?","o":["It describes a serious limitation of the method used by Nance and colleagues.","It presents the central finding reported by Nance and colleagues.","It identifies the problem that Nance and colleagues attempted to solve but did not.","It explains how the work of Nance and colleagues was received by others in the field."],"a":2,"r":"Choice C is the best answer because it best describes how the second sentence functions in the text as a whole. The first sentence establishes something astronomers believe with some certainty: that Betelgeuse will explode in a supernova. The second sentence then introduces a problem: astronomers aren’t certain when Betelgeuse will explode because they don’t have enough information about the star’s internal characteristics. Finally, the third sentence indicates that researcher Sarafina El-Badry Nance and colleagues investigated a possible method of obtaining the necessary information about Betelgeuse’s internal characteristics, though they found that the method wouldn’t be sufficient. Thus, the function of the second sentence is to identify the problem that Nance and colleagues attempted to solve but didn’t. Choice A is incorrect because the second sentence introduces the general problem Nance and colleagues hoped to solve, not a serious limitation of how Nance and colleagues tried to solve it. It is the third sentence that introduces Nance and colleagues, but no serious limitation of their approach to studying a method of determining internal stellar states is described. Choice B is incorrect because the second sentence introduces the general problem Nance and colleagues hoped to solve, not the central finding they ultimately reported. It is the third sentence that presents Nance and colleagues’ conclusion that a potential method for determining internal stellar states would be insufficient. Choice D is incorrect because the second sentence doesn’t indicate how other astronomers or astrophysicists responded to the work done by Nance and colleagues; the text doesn’t address this information at all."},{"i":"236fee8e","c":"func","d":"M","s":"Archeological excavation of Market Street Chinatown, a nineteenth-century Chinese American community in San Jose, California, provided the first evidence that Asian food products were imported to the United States in the 1800s: bones from a freshwater fish species native to Southeast Asia. <u>Jinshanzhuang—Hong Kong–based import/export firms—likely coordinated the fish’s transport from Chinese-operated fisheries in Vietnam and Malaysia to North American markets.<\/u> This route reveals the (often overlooked) multinational dimensions of the trade networks linking Chinese diaspora communities.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It explains why efforts to determine the country of origin of the items mentioned in the previous sentence remain inconclusive.","It provides information that helps support a claim about a discovery’s significance that is presented in the following sentence.","It traces the steps that were taken to locate and recover the objects that are described in the previous sentence.","It outlines a hypothesis that additional evidence discussed in the following sentence casts some doubt on."],"a":1,"r":"Choice B is the best answer. The underlined sentence provides information about import/export firms, showing how Chinese communities across the world were connected by trade routes. Choice A is incorrect. The underlined sentence never suggests that the countries of origin of the fish are in question—in fact, it tells us exactly where they came from. Choice C is incorrect. The passage never describes the steps taken to discover the fish bones described in the previous sentence. Choice D is incorrect. The underlined sentence doesn’t outline a hypothesis but instead provides evidence. And the following sentence agrees with the underlined sentence, so we could eliminate this choice just for saying that the following sentence \"casts some doubt on\" the underlined one—partly wrong is all wrong."},{"i":"de2c2f57","c":"cross","d":"H","s":"Text 1 The fossil record suggests that mammoths went extinct around 11 thousand years (kyr) ago. In a 2021 study of environmental DNA (eDNA)— genetic material shed into the environment by organisms—in the Arctic, Yucheng Wang and colleagues found mammoth eDNA in sedimentary layers formed millennia later, around 4 kyr ago. To account for this discrepancy, Joshua H. Miller and Carl Simpson proposed that arctic temperatures could preserve a mammoth carcass on the surface, allowing it to leach DNA into the environment, for several thousand years.\n\nText 2 Wang and colleagues concede that eDNA contains DNA from both living organisms and carcasses, but for DNA to leach from remains over several millennia requires that the remains be perpetually on the surface. Scavengers and weathering in the Arctic, however, are likely to break down surface remains well before a thousand years have passed.\n\nWhich choice best describes how\n\nText 1 and\n\nText 2 relate to each other?","o":["Text 1 discusses two approaches to studying mammoth extinction without advocating for either, whereas Text 2 advocates for one approach over the other.","Text 1 presents findings by Wang and colleagues and gives another research team’s attempt to explain those findings, whereas Text 2 provides additional detail that calls that explanation into question.","Text 1 describes Wang and colleagues’ study and a critique of their methodology, whereas Text 2 offers additional details showing that methodology to be sound.","Text 1 argues that new research has undermined the standard view of when mammoths went extinct, whereas Text 2 suggests a way to reconcile the standard view with that new research."],"a":1,"r":"Choice B is the best answer. Text 1 introduces Wang and colleagues’ study and its surprising results, and then mentions Miller and Simpson’s hypothesis as a possible way to explain them. Text 2, however, challenges Miller and Simpson’s hypothesis by pointing out the difficulties of preserving mammoth carcasses on the surface for thousands of years: “scavengers and weathering” are the additional details that complicate the Miller/Simpson hypothesis. Choice A is incorrect. Neither text compares two different approaches for studying mammoth extinction. Text 1 describes one study and one hypothesis pertaining to it. Text 2 critiques that hypothesis. Choice C is incorrect. Text 1 does not describe a critique of Wang and colleagues’ methodology, but rather an interpretation of their results by Miller and Simpson. Text 2 does not offer additional details showing that methodology to be sound, but rather casts doubt on the Miller/Simpson explanation. Choice D is incorrect. Both components mentioned here (the new “undermining” research and the theory for reconciling this discovery) are contained in Text 1. Text 2 then shows how the attempt to reconcile the standard view and new research is flawed, and still fails to explain the discrepancy."},{"i":"e47d2524","c":"main","d":"M","s":"Microplastics are tiny pieces of plastic waste. Areas of the ocean with higher concentrations of microplastic particles also have smaller and fewer waves. A study by Yukun Sun and colleagues found that the concentration of microplastic particles cannot be the only reason for this reduced wave activity because the concentration of particles that would have the observed effect is much higher than that found in these areas of the ocean. However, they found that surfactants, chemicals often used to manufacture plastics, are released into the water from microplastics and have a much stronger wave-reducing effect.\n\nAccording to the text, what did Sun and colleagues discover about surfactants?","o":["They have a much stronger effect on wave activity than microplastics alone do.","They are mainly composed of water.","They are helpful for removing microplastics from the ocean.","They can be used to contain microplastics within certain areas of the ocean."],"a":0,"r":"Choice A is the best answer because it presents a statement about surfactants that is supported by the text. The text indicates that higher concentrations of microplastics have been associated with waves that are relatively small and few. According to the text, however, a study by Sun and colleagues found that concentrations of microplastic particles can’t be the only reason for the reduced wave activity because a much higher concentration of particles is needed to produce that observed effect. Instead, the text indicates that Sun and colleagues found that surfactants are released from microplastics into the ocean and have a much stronger wave-reducing effect than microplastics alone do. Choice B is incorrect because the text doesn’t discuss what surfactants are made of. Instead, it indicates that surfactants are frequently used to manufacture microplastics and that Sun and colleagues discovered that surfactants are released from microplastics into the ocean. Choice C is incorrect because the text doesn’t discuss how microplastics can be removed from the ocean. Instead, the text indicates that Sun and colleagues discovered that surfactants are released into the ocean from microplastics and have a much stronger wave-reducing effect than microplastics alone do. Choice D is incorrect because the text doesn’t indicate that surfactants can be used to contain microplastics within certain areas of the ocean. Instead, the text indicates that Sun and colleagues discovered that surfactants are released from microplastics into the ocean and have a much stronger wave-reducing effect than microplastics alone do."},{"i":"11c68ded","c":"main","d":"M","s":"A contraction of “you all,” the pronoun “y’all” has long been used as a plural version of “you” in the South and in Black communities around the US. In recent decades, most other English-speaking communities in the US have begun to use “y’all.” What explains its rise in popularity? Many varieties of English have no pronoun that specifically addresses more than one person and instead must use “you” to address both one person and more than one. But “y’all” always refers to two or more people. As a result, it conveys the speaker’s meaning more precisely than “you” can. Which question does the text most directly attempt to answer?","o":["How many other plural versions of the pronoun “you” are there in English, besides “y’all”?","Why has the pronoun “y’all” become more widely used in the US?","When was the first recorded use of the pronoun “y’all” in the English language?","Is “y’all” commonly used in English-speaking regions of the world besides the US?"],"a":1,"r":"Choice B is the best answer because it presents a question that the text is attempting to answer: why has the pronoun \"y’all\" become more widely used in the US? The text begins by explaining where and how the plural pronoun \"y’all\" originated and then goes on to state that its use has been rising in popularity, even in areas outside of its place of origin. The text then attributes this rise in popularity to the fact that many varieties of English do not have a pronoun to address more than one person, and thus \"you\" must function as both a singular and plural pronoun. Choice A is incorrect because while the text states that \"y’all\" is used as a plural of \"you\" in English, it does not discuss other plural forms of the word. Choice C is incorrect because while the text discusses the general origins of the pronoun \"y’all,\" it does not state when the use of the pronoun was first recorded in the English language. Choice D is incorrect because though the text addresses the use of the pronoun \"y’all\" within English-speaking communities in the US, it does not address its use outside of that geographic area."},{"i":"d8b78a2b","c":"infer","d":"M","s":"Red velvet cake has been a favorite dessert of many for years, but the recipe’s origins are unclear. A bakery in Dallas, Texas, argued that it created the first recipe for the cake when the bakery opened in the 1860s. The Adams Extract Co., which sells baking products, claims to have created the recipe in the 1930s to help market their red dye. A US hotel and a Canadian department store also publicly stated that the red velvet cake sold in each of their establishments in the 1930s was an original creation, each alleging that it was the recipe author. No clear evidence has emerged to favor one of these claims over the others, however. It thus seems that ______ Which choice most logically completes the text?","o":["red velvet cake was first baked sometime before the 1860s.","we cannot say at present who actually baked the first red velvet cake.","none of the supposed inventors of red velvet cake are likely to have invented it.","the bakery in Dallas, Texas, probably invented red velvet cake."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically completes the text’s discussion of competing claims about the origins of red velvet cake. The text states that the origins of the recipe for red velvet cake \"are unclear.\" The text then presents four different entities that claim to have created the first red velvet cake recipe: a Dallas bakery (1860s), the Adams Extract Co. (1930s), a US hotel (1930s), and a Canadian department store (1930s). Lastly, the text states that \"no clear evidence has emerged to favor one of these claims over the others.\" Given this information, it most logically follows that it’s not possible to determine who baked the first red velvet cake, as there is insufficient evidence to determine which claim, if any, is correct. Choice A is incorrect because the text doesn’t provide information indicating that red velvet cake existed before the 1860s. According to the text, the earliest claim for creating red velvet cake comes from a bakery in Dallas, Texas, that asserted it developed the first recipe for the cake at the time of the bakery’s opening in the 1860s. There’s no textual support for the conclusion that the cake existed before this earliest claimed date, since the text presents only competing claims starting from the 1860s and extending to the 1930s without evidence of earlier origins. Choice C is incorrect because the text doesn’t support the conclusion that none of the supposed inventors of red velvet cake likely invented the cake. The text states that multiple entities claim to have invented the recipe and that \"no clear evidence has emerged to favor one of these claims over the others.\" This lack of decisive evidence doesn’t logically lead to the conclusion that all the claims are false; it merely indicates that the cake’s true origins can’t be determined with the available evidence. The text leaves open the possibility that one of the claimants could indeed be the actual inventor. Choice D is incorrect because the text provides no basis for concluding that the Dallas bakery is \"probably\" the inventor of red velvet cake. While the text mentions that this bakery claims to have created the recipe in the 1860s (making it the earliest claim), the text explicitly states that there’s no definitive evidence supporting any of the claims about the cake’s origins over the others. The text presents all claims as equally lacking in definitive supporting evidence."},{"i":"f2250478","c":"infer","d":"H","s":"Among social animals that care for their young, such as chickens, macaque monkeys, and humans, newborns appear to show an innate attraction to faces and face-like stimuli. Elisabetta Versace and her colleagues used an image of three black dots arranged in the shape of eyes and a nose or mouth to test whether this trait also occurs in Testudo tortoises, which live alone and do not engage in parental care. They found that tortoise hatchlings showed a significant preference for the image, suggesting that ______ Which choice most logically completes the text?","o":["face-like stimuli are likely perceived as harmless by newborns of social species that practice parental care but as threatening by newborns of solitary species without parental care.","researchers should not assume that an innate attraction to face-like stimuli is necessarily an adaptation related to social interaction or parental care.","researchers can assume that the attraction to face-like stimuli that is seen in social species that practice parental care is learned rather than innate.","newly hatched Testudo tortoises show a stronger preference for face-like stimuli than adult Testudo tortoises do."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the study by Versace and colleagues. The text indicates that newborn animals of some species are attracted to faces and to stimuli that resemble faces. These species, the text says, share two characteristics: they’re social and they practice parental care, meaning that parents care for their young. The text goes on to describe Versace and colleagues’ experiment, which showed that Testudo tortoises, which aren’t social and don’t practice parental care, were attracted to a stimulus that resembles a face. Since Versace and colleagues have shown that a species that isn’t social and doesn’t practice parental care nevertheless has the innate characteristic of being attracted to face-like stimuli, it follows that this characteristic shouldn’t be assumed to be an adaptation related to social interaction or parental care. Choice A is incorrect because the text indicates that the tortoise hatchlings, which are solitary and don’t practice parental care, were attracted to the face-like stimuli, not that they perceived the stimuli as threatening. Choice C is incorrect because the phenomenon discussed in the text is an attraction to faces and face-like stimuli on the part of newborn animals, which can’t show any learned characteristics since they were just born. Additionally, the text tells us that the tortoises Versace and colleagues studied aren’t social and don’t practice parental care, so any findings about those tortoises wouldn’t be relevant to the question of whether an attraction to faces in social species that practice parental care is innate or learned. Choice D is incorrect because the text gives no indication that adult tortoises were tested on face-like stimuli and, if adults were in fact tested, no information about how they responded is provided. Since no information about adult tortoises’ responses is provided, no conclusion comparing those responses to the responses of newly hatched tortoises can be supported."},{"i":"b32c4b3a","c":"claim","d":"H","s":"The Intertropical Convergence Zone (ITCZ), a band of clouds that encircles Earth in the tropics and is a major rainfall source, shifts position in response to temperature variations across Earth’s hemispheres. Data from Huagapo Cave in Peru suggest the ITCZ shifted south during the Little Ice Age (circa 1300–1850), but a shift as far into South America as Huagapo should have led to dry conditions in Central America, which is inconsistent with climate models. To resolve the issue, geologist Yemane Asmerom and colleagues collected data from Yok Balum Cave in Central America and compared them with the Huagapo data. They concluded that during the Little Ice Age, the ITCZ may have expanded northward and southward rather than simply shifted.\n\nWhich finding from Asmerom and colleagues’ study, if true, would most directly support their conclusion?","o":["Neither the Yok Balum data nor the Huagapo data show significant local variations in temperature during the Little Ice Age.","Both the Yok Balum data and the Huagapo data show increased temperatures and prolonged dry conditions during the Little Ice Age.","The Yok Balum data show prolonged dry conditions during the same portions of the Little Ice Age in which the Huagapo data show heightened levels of rainfall.","The Yok Balum data and the Huagapo data show strongly correlated patterns of high rainfall during the Little Ice Age."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would support Asmerom and colleagues’ conclusion that the ITCZ may have expanded northward and southward rather than shifting south during the Little Ice Age. The text indicates that the ITCZ, a band of clouds in the tropics that is a significant rainfall source, can change position. Data from Peru’s Huagapo Cave suggest that the ITCZ shifted south during the Little Ice Age. But according to the text, if the ITCZ moved into South America in that way, then Central America should have been drier than climate models suggest it was. In other words, rainfall should have been reduced in Central America because the ITCZ, a significant rainfall source, had shifted into South America, but climate models do not show such a reduction in Central America. The text goes on to say that Asmerom and colleagues tried to resolve this apparent conflict by collecting data from Yok Balum cave in Central America and comparing them with data from Huagapo, which led the researchers to conclude that the ITCZ may have expanded both northward and southward rather than simply shifting south. If it is true that Yok Balum in Central America and Huagapo in South America show strongly correlated patterns of high rainfall during the Little Ice Age, such a finding would support Asmerom and colleagues’ conclusion by suggesting that the two areas were affected by the same rainfall source, and thus that the ITCZ may have expanded rather than shifted. Choice A is incorrect because there is no information in the text about how, if at all, the ITCZ affects temperature in areas where it is located. Rather, the text states that temperature variations across Earth’s hemispheres can shift the position of the ITCZ. Finding that neither Yok Balum nor Huagapo data show evidence of significant local variations in temperature during the Little Ice Age would have no clear bearing on Asmerom and colleagues’ claim. Choice B is incorrect because finding that both Yok Balum and Huagapo experienced prolonged dry conditions during the Little Ice Age would not support Asmerom and colleagues’ conclusion that the ITCZ, a major source of rainfall, may have expanded northward and southward rather than simply shifting south. Dry conditions in both locations would suggest that the ITCZ did not cover either location. Additionally, finding that temperatures were elevated in both locations would have no clear bearing on Asmerom and colleagues’ conclusion, since there is no information in the text that indicates how, if at all, the ITCZ affects temperature. Choice C is incorrect because finding that Yok Balum experienced prolonged dry conditions at the same time that Huagapo experienced high rainfall would weaken Asmerom and colleagues’ conclusion, not strengthen it. Such a finding would suggest that the ITCZ shifted south and left Central America dry rather than expanding both northward and southward."},{"i":"c538954d","c":"claim","d":"M","s":"Sense and Sensibility is an 1811 novel by Jane Austen. In the novel, Austen describes Marianne Dashwood’s ability to persuade others of the rightness of her artistic judgments, as is evident when Marianne visits with John Willoughby, a potential suitor: ______ Which quotation from Sense and Sensibility most effectively illustrates the claim?","o":["“Above all, when she heard him declare, that of music and dancing he was passionately fond, she gave him such a look of approbation as secured the largest share of his discourse to herself for the rest of his stay.”","“Their taste was strikingly alike. The same books, the same passages were idolized by each—or if any difference appeared, any objection arose, it lasted no longer than till the force of her arguments and the brightness of her eyes could be displayed.”","“It was only necessary to mention any favourite amusement to engage her to talk. She could not be silent when such points were introduced, and she had neither shyness nor reserve in their discussion.”","“They speedily discovered that their enjoyment of dancing and music was mutual, and that it arose from a general conformity of judgment in all that related to either. Encouraged by this to a further examination of his opinions, she proceeded to question him on the subject of books.”"],"a":1,"r":"Choice B is the best answer. By showing that \"any difference\" in taste was quickly overcome by \"the force of [Marianne’s] arguments,\" this choice effectively demonstrates Marianne’s \"ability to persuade others.\" Choice A is incorrect. This choice doesn’t effectively illustrate the claim. This choice shows that Marianne and John share an interest in music and dancing, but it doesn’t provide evidence of Marianne’s \"ability to persuade others.\" Choice C is incorrect. This choice doesn’t effectively illustrate the claim. This choice shows that Marianne enjoys talking about her interests, but it doesn’t provide evidence of Marianne’s \"ability to persuade others.\" Choice D is incorrect. This choice doesn’t effectively illustrate the claim. This choice shows that Marianne and John share many interests and generally agree on music and dancing, but it doesn’t provide evidence of Marianne’s \"ability to persuade others.\""},{"i":"4411e15b","c":"graph","d":"H","s":"","o":["the selection process that enabled the Navajo-Churro to retain its somewhat coarse outer fiber also resulted in inner fiber that, at its softest, is softer than either the mouflon’s or the Merino’s inner fiber.","the Navajo-Churro more closely resembles its ancestor, the mouflon, in the uniform softness of its inner fiber, while the Merino more closely resembles the mouflon in the variable diameter of its outer fiber.","domestication resulted in a counterintuitive increase in the inner fiber’s minimum diameter, making the inner fiber of the Merino and the Navajo-Churro less suitable for delicate garments than the mouflon’s inner fiber is.","the domestication of the mouflon and the subsequent selection process that produced the Merino and the Navajo-Churro resulted in greater softness of outer and inner fiber alike."],"a":0,"r":"Choice A is the best answer because it accurately uses data from the table to complete the statement about the fibers of three types of sheep. The text discusses some qualities of outer and inner fibers of mouflons, Spanish Merino sheep, and Navajo-Churro sheep and indicates that sheep fibers with finer, or smaller, diameters are softer than fibers with larger diameters. The text then sets up a conclusion that can be made by comparing the fibers of all three sheep types. The table shows that the minimum diameter of the Navajo-Churro’s inner fibers is 10 microns, which is smaller than the minimum diameters of the inner fibers of both the mouflon (15 microns) and the Spanish Merino (17 microns). Thus, comparing the fiber characteristics of all three sheep reveals that at its softest, the inner fiber of the Navajo-Churro is softer than either the mouflon’s or the Merino’s inner fiber. Choice B is incorrect because it doesn’t accurately describe the data in the table. The table shows that the softness of Navajo-Churro inner fiber isn’t uniform (since the diameter of Navajo-Churro inner fiber ranges from 10 microns to 35 microns) and that the diameter of the outer fiber of the mouflon isn’t variable (rather, it is a uniform 150 microns). Choice C is incorrect because it doesn’t accurately describe the data in the table. The text indicates that both Spanish Merino sheep and Navajo-Churro sheep were domesticated from mouflon sheep. The table doesn’t show that domestication increased the minimum diameter of inner fibers for both Spanish Merino sheep and Navajo-Churro sheep from the 15-micron diameter of mouflon inner fibers: the minimum diameter of Spanish Merino increased to 17 microns, but the minimum diameter of Navajo- Churro inner fibers decreased to 10 microns. Choice D is incorrect because it doesn’t accurately describe the data in the table. The text explains that sheep fibers with finer, or smaller, diameters are softer than fibers with larger diameters. The table does show that Spanish Merino outer fibers are finer, and thus softer, than mouflon outer fibers and that at their finest, Navajo-Churro outer fibers are softer than mouflon outer fibers, but it also shows that Spanish Merino inner fibers are less soft than mouflon inner fibers, since their minimum diameter is greater than 15 microns, and that Navajo-Churro inner fibers can be less soft than mouflon inner fibers, since the diameter ranges up to 35 microns."},{"i":"0ec15b5a","c":"graph","d":"M","s":"","o":["sales and related occupations.","installation, maintenance, and repair occupations.","construction and resource extraction occupations.","management, business, and financial services occupations."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to complete the text. The text discusses self-employed workers in the US, and the table shows the US incorporated and unincorporated self-employment rates in four occupational fields in 2015. According to the table, the incorporated self-employment rate was 8.9% for the management, business, and financial services occupational field, which is higher than the incorporated self-employment rate shown for any other occupational field. Choice A is incorrect because according to the table, the incorporated self-employment rate was 5.8% for the sales and related occupational field, which is lower than the 8.9% for the management, business, and financial services occupational field. Choice B is incorrect because according to the table, the incorporated self-employment rate was 2.7% for the installation, maintenance, and repair occupational field, which is lower than the 8.9% for the management, business, and financial services occupational field. Choice C is incorrect because according to the table, the incorporated self-employment rate was 4.4% for the construction and resource extraction occupational field, which is lower than the 8.9% for the management, business, and financial services occupational field."},{"i":"2ee50d41","c":"fss","d":"E","s":"The classic children’s board game Chutes and Ladders is a version of an ancient Nepalese game, Paramapada Sopanapata. In both games, players encounter “good” or “bad” spaces while traveling along a path; landing on one of the good spaces ______ a player to skip ahead and arrive closer to the end goal.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["allows","are allowing","have allowed","allow"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject–verb agreement. The singular verb “allows” agrees in number with the singular subject “landing.” Choice B is incorrect because the plural verb “are allowing” doesn’t agree in number with the singular subject “landing.” Choice C is incorrect because the plural verb “have allowed” doesn’t agree in number with the singular subject “landing.” Choice D is incorrect because the plural verb “allow” doesn’t agree in number with the singular subject “landing.”"},{"i":"a94b7fd6","c":"fss","d":"E","s":"With residents from Mexico, China, El Salvador, and many other countries, Los Angeles has long been a city of cultural diversity. Even back in the 1860s, nearly 30% of the city’s population ______ from outside the United States.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is being","was","is","will be"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the past tense verb \"was,\" used in conjunction with the prepositional phrase \"from outside the United States,\" correctly indicates that in the 1860s nearly 30% of the population in Los Angeles wasn’t from the US. Choice A is incorrect because the present progressive tense verb \"is being\" doesn’t indicate that the claim about Los Angeles’s population refers to the population back in the 1860s. Choice C is incorrect because the present tense verb \"is\" doesn’t indicate that the claim about Los Angeles’s population refers to the population back in the 1860s. Choice D is incorrect because the future tense verb \"will be\" doesn’t indicate that the claim about Los Angeles’s population refers to the population back in the 1860s."},{"i":"ecba68b5","c":"fss","d":"H","s":"Mathematician Grigori Perelman, sometimes in conjunction with mathematicians Richard S. Hamilton and Shing-Tung Yau, ______ credited with proving the Poincaré conjecture. Having built on Hamilton’s previous work to solve the proof, Perelman has insisted that Hamilton receive credit. Yau later found and closed gaps in Perelman’s proof, persuading some mathematicians that he deserves credit as well.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are","have been","are being","is"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The singular verb \"is credited\" agrees in number with the singular subject \"mathematician Grigori Perelman.\" Choice A is incorrect because the plural verb \"are credited\" doesn’t agree in number with the singular subject \"mathematician Grigori Perelman.\" Choice B is incorrect because the plural verb \"have been credited\" doesn’t agree in number with the singular subject \"mathematician Grigori Perelman.\" Choice C is incorrect because the plural verb \"are being credited\" doesn’t agree in number with the singular subject \"mathematician Grigori Perelman.\""},{"i":"fa07bcb6","c":"bound","d":"E","s":"Ganga is a folk singing tradition that originated in the Dinaric Alps in southern Europe. Ganga singers sing different melodies at the same time. The clashing notes can echo a long way across the mountains, which is why ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["ganga has been used as a communication method?","ganga has been used as a communication method.","has ganga been used as a communication method.","has ganga been used as a communication method?"],"a":1,"r":"Choice B is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a period to punctuate a declarative sentence ending with a relative clause that presents an indirect question (“why ganga has been used as a communication method.”) Choice A is incorrect. It’s unconventional to use a question mark to punctuate a declarative sentence that presents an indirect question. Choice C is incorrect. The structure requires a declarative clause at the end of the sentence, not an interrogative clause that asks a direct question, such as “has ganga been used as a communication method.” Choice D is incorrect. The structure requires a declarative clause at the end of the sentence, not an interrogative clause that asks a direct question, such as “has ganga been used as a communication method.”"},{"i":"c468db1c","c":"bound","d":"H","s":"A group of ecologists led by Axel Mithöfer at the Max Planck Institute for Chemical Ecology in Germany examined the defensive responses of two varieties of the sweet potato ______ TN57, which is known for its insect resistance, and TN66, which is much more susceptible to pests.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["plant.","plant;","plant","plant:"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between a main clause and a supplementary phrase. In this choice, a colon is correctly used to mark the boundary between the main clause (“A group…plant”) and the supplementary element (“TN57…pests”) and to introduce the following elaboration on the specific varieties of sweet potato plants that were examined. Choice A is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “TN57.” Choice B is incorrect because a semicolon can’t be used in this way to join the main clause (“A group…plant”) and the supplementary element (“TN57…pests”). A semicolon is conventionally used to join two main clauses, whereas a colon is conventionally used to introduce an element that explains or amplifies the information in the preceding clause. Choice C is incorrect because it fails to mark the boundary between the main clause (“A group...plant”) and the supplementary element (“TN57...pests”) with appropriate punctuation."},{"i":"7572131d","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Elizabeth Catlett’s sculpture Recognition (1970) shows two African American figures with rounded, indistinct features. The figures reach out to each other in a pose that symbolizes a close, supportive relationship. Her sculpture Students Aspire (1978) shows two African American figures with sharply defined features. The figures hold an equal sign above their heads with one hand and embrace each other with the other hand. This pose symbolizes their support for each other in the pursuit of equality. The student wants to emphasize a similarity between the two sculptures.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Catlett’s Students Aspire depicts two figures supporting each other in the pursuit of equality.","Recognition and Students Aspire both show African American figures in poses that symbolize supportive relationships.","Catlett completed Recognition in 1970 and Students Aspire in 1978.","The figures in Recognition have features that are rounded and indistinct, while the figures in Students Aspire have sharply defined features."],"a":1,"r":"Choice B is the best answer. The sentence emphasizes a similarity between the sculptures Recognition and Students Aspire, noting that both sculptures show African American figures in poses that symbolize supportive relationships. Choice A is incorrect. The sentence describes one of the sculptures; it doesn’t emphasize a similarity between the two sculptures. Choice C is incorrect. The sentence specifies the different years the sculptures were completed in; it doesn’t emphasize a similarity between the two sculptures. Choice D is incorrect. The sentence emphasizes a difference between the two sculptures, noting that the figures in the sculptures have different feature definition; it doesn’t emphasize a similarity between the two sculptures."},{"i":"bb275f0d","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Cities tend to have a wide range of flowering vegetation in parks, yards, and gardens. This vegetation provides a varied diet for honeybees, strengthening bees’ immune systems. On average, 62.5 percent of bees in an urban area will survive a harsh winter. Rural areas are often dominated by monoculture crops such as corn or wheat. On average, only 40 percent of honeybees in a rural area will survive a harsh winter. The student wants to make and support a generalization about honeybees.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Cities tend to have a wider range of flowering vegetation than do rural areas, which are often dominated by monoculture crops.","In urban areas, over 60 percent of honeybees, on average, will survive a harsh winter, whereas in rural areas, only 40 percent will.","The strength of honeybees’ immune systems depends on what the bees eat, and a varied diet is more available to bees in an urban area than to those in a rural area.","Honeybees are more likely to thrive in cities than in rural areas because the varied diet available in urban areas strengthens the bees’ immune systems."],"a":3,"r":"Choice D is the best answer because the sentence makes and supports a generalization about honeybees. It claims that honeybees living in urban areas are more likely to thrive than rural bees, and it supports the claim with information about the effect of a varied diet on urban bees’ immune systems. Choice A is incorrect. While the sentence makes a generalization, it doesn’t mention honeybees. Choice B is incorrect. While the sentence provides data about honeybee survival, it doesn’t make a generalization about honeybees based on this information. Choice C is incorrect. While the sentence makes a generalization about honeybees’ diets and immune systems, it doesn’t provide adequate support for this generalization."},{"i":"cf11282b","c":"trans","d":"M","s":"Scientists were able to isolate a relatively pure sample of selenium in 1817, the same year they first discovered the element’s existence. ______ the isolation process took longer for molybdenum, which was isolated in its pure form three years after scientists first discovered it.\n\nWhich choice completes the text with the most logical transition?","o":["By contrast,","Thus,","Similarly,","For instance,"],"a":0,"r":"Choice A is the best answer. \"By contrast\" logically signals that the information in this sentence—that isolating molybdenum was a relatively long process—contrasts with the previous information that isolating selenium was a short process. Choice B is incorrect because \"thus\" illogically signals that the information in this sentence is a result of the previous information about selenium’s short isolation process. Instead, the sentence presents contrasting information about molybdenum’s longer isolation process. Choice C is incorrect because \"similarly\" illogically signals that the information in this sentence is similar to the previous information about selenium’s short isolation process. Instead, the sentence presents contrasting information about molybdenum’s longer isolation process. Choice D is incorrect because \"for instance\" illogically signals that the information in this sentence exemplifies the previous information about selenium’s short isolation process. Instead, the sentence presents contrasting information about molybdenum’s longer isolation process."},{"i":"1996c104","c":"trans","d":"E","s":"The liquid metals in Earth’s core circulate constantly, and this circulation generates electrical currents that flow between Earth’s North and South magnetic poles. These electrical currents, ______ create a barrier around Earth that protects us from radiation and charged particles coming from space.\n\nWhich choice completes the text with the most logical transition?","o":["in turn,","likewise,","nevertheless,","in reality,"],"a":0,"r":"Choice A is the best answer. \"In turn\" logically signals that the information in the sentence—that the electrical currents create a protective barrier function card(q,n){const a=ans[q.i];

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
