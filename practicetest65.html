<script>
const D={"t":"Practicetest65","q":[{"i":"22a41819","c":"vocab","d":"H","s":"Rejecting the premise that the literary magazine Ebony and Topaz (1927) should present a unified vision of Black American identity, editor Charles S. Johnson fostered his contributors’ diverse perspectives by promoting their authorial autonomy. Johnson’s self-effacement diverged from the editorial stances of W.E.B. Du Bois and Alain Locke, whose decisions for their publications were more ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["proficient","dogmatic","ambiguous","unpretentious"],"a":1,"r":"Choice B is the best answer. A person who is \"dogmatic\" believes strongly that their principles and opinions are true. Because Du Bois and Locke are implied to have one \"unified vision\" of Black American identity that they prioritize over the \"diverse perspectives\" of different writers, they can be described as dogmatic. Choice A is incorrect. \"Proficient\" means \"skilled.\" Du Bois and Locke are contrasted with Johnson, but nothing in the text suggests that Johnson was not skilled at making editorial decisions. Based on the text, the three editors just have different styles; they’re not necessarily more or less skilled. Choice C is incorrect. \"Ambiguous\" means \"unclear\" or \"open to multiple interpretations.\" However, it’s actually Johnson who encouraged multiple interpretations (\"diverse perspectives\"). Since Du Bois and Locke are said to \"diverge\" from Johnson, we can assume that the views they published were not ambiguous, but instead clear and firm (a \"unified vision\"). Choice D is incorrect. \"Unpretentious\" means \"not trying to impress others with greater skill or importance than is actually possessed.\" Du Bois and Locke are contrasted with Johnson, but nothing in the text suggests that Johnson is pretentious (trying to impress others)."},{"i":"dc0bca21","c":"vocab","d":"E","s":"It would be a mistake to ______ the exhibit that artist and curator Joe Baker, who is a member of the Lenape (Delaware) people, has organized at the Brooklyn Public Library. The exhibit, which includes Lenape beadwork from the 1850s as well as modern works that use traditional patterns, is essential viewing.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["complicate","amplify","overlook","assemble"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of an exhibit at the Brooklyn Public Library. In this context, \"overlook\" means to ignore or to miss. The text states that artist and curator Joe Baker organized an exhibit that features Lenape beadwork in historical and modern works. The text describes the exhibit as \"essential viewing,\" suggesting that it’s an important exhibit that people should make an effort to visit; this context conveys that it would be a mistake to overlook the exhibit. Choice A is incorrect. In this context, \"complicate\" would mean to add difficulty, and there’s no reason to think the text would need to directly caution against complicating Baker’s exhibit; the text focuses on the idea that the exhibit is \"essential viewing,\" not on the idea of a potential difficulty that could be raised. Choice B is incorrect. In this context, \"amplify\" means to increase, and there’s no reason to believe the text would indicate that it would be a mistake to increase an exhibit the text describes as \"essential viewing.\" Choice D is incorrect because it wouldn’t make sense to say that it would be a mistake to \"assemble,\" or put together, Baker’s exhibit: the text makes it clear that the exhibit has already been put together and, further, praises the exhibit as \"essential viewing.\""},{"i":"93665100","c":"vocab","d":"H","s":"Seminole/Muscogee director Sterlin Harjo ______ television’s tendency to situate Native characters in the distant past: this rejection is evident in his series Reservation Dogs, which revolves around teenagers who dress in contemporary styles and whose dialogue is laced with current slang.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["repudiates","proclaims","foretells","recants"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Sterlin Harjo’s approach to representing Native characters on television. As used in this context, “repudiates” means rejects or refuses to have anything to do with. The text indicates that television shows tend to depict Native characters as living long ago, but that Harjo’s series Reservation Dogs focuses on Native teenagers in the present day, representing a “rejection” of the typical approach to depicting Native characters. This context thus indicates that Harjo repudiates television’s general tendency regarding Native characters. Choice B is incorrect because the text describes Harjo’s “rejection” of the typical approach to representing Native characters on television, so it wouldn’t make sense to say that Harjo “proclaims,” or declares or affirms, television’s general tendency regarding Native characters. Harjo is described as refusing to follow the pattern of depicting Native characters in the distant past, not as proclaiming that pattern. Choice C is incorrect because the text describes television’s tendency to represent Native characters in the distant past as something that is already occurring, not as something that Harjo “foretells,” or predicts will happen in the future. The text is focused on Harjo’s “rejection” of this pattern, not on any predictions he may have about it. Choice D is incorrect because saying that Harjo “recants” something would mean that he withdraws a previously held belief, and it wouldn’t make sense to say that Harjo recants television’s tendency to represent Native characters as living in the past. No beliefs previously held by Harjo are mentioned. Additionally, a tendency isn’t a belief and thus isn’t something that can be recanted."},{"i":"84a7fbca","c":"vocab","d":"E","s":"When Mexican-American archaeologist Zelia Maria Magdalena Nuttall published her 1886 research paper on sculptures found at the ancient Indigenous city of Teotihuacan in present-day Mexico, other researchers readily ______ her work as groundbreaking; this recognition stemmed from her convincing demonstration that the sculptures were much older than had previously been thought.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["acknowledged","ensured","denied","underestimated"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Nuttall’s 1886 research paper. In this context, “acknowledged” means recognized as having a certain status. The text indicates that other researchers recognized Nuttall’s work as groundbreaking because of its “convincing demonstration” related to the age of the ancient sculptures. In other words, the researchers recognized the groundbreaking status of Nuttall’s work. Choice B is incorrect because in this context, “ensured” would mean to have guaranteed or made sure something was the case. The text states that other researchers gave Nuttall’s work recognition after it was published, but there’s no indication that they contributed to the work or had any involvement that would have allowed them to make sure the work would be groundbreaking. Choice C is incorrect because the text doesn’t suggest that other researchers “denied,” or refused to admit or accept, that Nuttall’s work was groundbreaking; on the contrary, it indicates that researchers praised the work, recognizing it as groundbreaking due to its “convincing demonstration” related to the age of the ancient sculptures. Choice D is incorrect because the text doesn’t suggest that other researchers “underestimated,” or undervalued, Nuttall’s work; on the contrary, it indicates that researchers praised the work, recognizing it as groundbreaking due to its “convincing demonstration” related to the age of the ancient sculptures."},{"i":"2d77660e","c":"purpose","d":"M","s":"In the late 1800s, Spanish-language newspapers flourished in cities across Texas. San Antonio alone produced eleven newspapers in Spanish between 1890 and 1900. But El Paso surpassed all other cities in the state. This city produced twenty-two newspapers in Spanish during that period. El Paso is located on the border with Mexico and has always had a large population of Spanish speakers. Thus, it is unsurprising that this city became such a rich site for Spanish-language journalism.\n\nWhich choice best states the main purpose of the text?","o":["To compare Spanish-language newspapers published in Texas today with ones published there during the late 1800s","To explain that Spanish-language newspapers thrived in Texas and especially in El Paso during the late 1800s","To argue that Spanish-language newspapers published in El Paso influenced the ones published in San Antonio during the late 1800s","To explain why Spanish-language newspapers published in Texas were so popular in Mexico during the late 1800s"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text begins by stating that there were many Spanish-language newspapers in cities across Texas in the late 1800s, citing San Antonio as a city that produced eleven such newspapers. The text then goes on to note that in El Paso, there were twenty-two newspapers published in Spanish in the late 1800s, more than any other Texas city. The text then concludes by explaining that the reason for this large number of Spanish-language newspapers was likely El Paso’s location near Mexico and its large population of Spanish speakers. Therefore, the main purpose of the text is to explain that Spanish-language newspapers thrived in Texas cities, especially in El Paso, in the late 1800s. Choice A is incorrect because the text doesn’t discuss Spanish-language newspapers published in Texas today, let alone compare them with newspapers that were published in the 1800s. Choice C is incorrect. Although the text characterizes El Paso as a particularly rich site for Spanish-language journalism in the late 1800s, the text doesn’t discuss whether newspapers published in El Paso influenced the newspapers published in other cities across Texas, including San Antonio. Choice D is incorrect because the text doesn’t mention whether Spanish-language newspapers published in Texas were also widely read in Mexico. The text only focuses on the popularity of Spanish-language newspapers within Texas, and especially in El Paso."},{"i":"03c9f327","c":"purpose","d":"H","s":"The following text is from Charlotte Brontë’s 1847 novel Jane Eyre. Jane, the narrator, works as a governess at Thornfield Hall. I went on with my day’s business tranquilly; but ever and anon vague suggestions kept wandering across my brain of reasons why I should quit Thornfield; and I kept involuntarily framing advertisements and pondering conjectures about new situations: these thoughts I did not think to check; they might germinate and bear fruit if they could.\n\nWhich choice best states the main purpose of the text?","o":["To convey a contrast between Jane’s outward calmness and internal restlessness","To emphasize Jane’s loyalty to the people she works for at Thornfield Hall","To demonstrate that Jane finds her situation both challenging and deeply fulfilling","To describe Jane’s determination to secure employment outside of Thornfield Hall"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to show that while Jane calmly goes about her daily tasks, she is experiencing internal agitation about possibly seeking a new job. At the start of the text, Jane says, “I went on with my day’s business tranquilly,” indicating that she is outwardly calm. This outward calmness is then contrasted with her intense internal restlessness, as Jane says that thoughts of leaving her job keep running through her mind, that she is “involuntarily framing advertisements” (meaning that she can’t stop herself from thinking up potential listings for jobs), and that she often wonders what new “situations” (or jobs) would be like. Choice B is incorrect because the text gives no indication of Jane’s feelings, either positive or negative, about the people she works for at Thornfield Hall. And rather than emphasizing that Jane feels particularly loyal to her employers, the text focuses on her constant consideration of leaving her job. Choice C is incorrect because the text gives no indication that Jane finds her current situation fulfilling, or satisfying. Given that much of the text is focused on Jane’s thoughts about possibly leaving her job for a new one, it might be the case that she finds her situation challenging, but there is no evidence in the text that Jane also finds that situation satisfying—she says nothing positive about her current job at all, in fact. Choice D is incorrect because the text describes Jane as wondering about getting a new job, not as determined to definitely do so. Jane keeps thinking about reasons why she “should” quit her current job (indicating that she hasn’t yet decided to) and imagining possible new situations she could find, but she says at the end of the text that these thoughts “might germinate and bear fruit if they could,” meaning that the thoughts haven’t yet led to a decision—that Jane isn’t yet determined to get a new job somewhere else."},{"i":"d168e7c5","c":"func","d":"M","s":"The following text is from Annie Dillard’s 1987 autobiographical novel An American Childhood. The narrator is a young girl living in Pittsburgh. I walked. My mother had given me the freedom of the streets as soon as I could say our telephone number. I walked and memorized the neighborhood. I made a mental map and located myself upon it. At night in bed I rehearsed the small world’s scheme and set challenges: <u>Find the store using backyards only. Imagine a route from the school to my friend’s house.<\/u> ©1987 by Annie Dillard Which choice best describes the function of the underlined portion in the text as a whole?","o":["It describes the narrator trying to memorize her telephone number.","It provides examples of what the narrator thinks about at night.","It gives directions to the narrator’s favorite local store.","It portrays the narrator’s relationship with her mother."],"a":1,"r":"Choice B is the best answer because it accurately describes how the underlined portion functions in the text as a whole. In the text, the narrator explains that she walks around her neighborhood, making a \"mental map\" of the area that she imagines herself navigating through. She then states that she rehearses \"the small world’s scheme\"—that is, imagines moving through her mental map—and challenges herself to use the map in her mind while lying in bed at night. The underlined portion presents two such challenges (getting to the store through backyards and traveling from school to a friend’s house) and thus provides examples of what the narrator thinks about at night. Choice A is incorrect because the underlined portion makes no mention of memorizing a telephone number. Although the narrator mentions that she had to learn the home telephone number before her mother would give her permission to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about memorizing the telephone number. Choice C is incorrect. Although the underlined portion refers to navigation tasks like finding a route to a store only through backyards, the text contains no specific directions to any store, nor is any store identified as the narrator’s favorite. Choice D is incorrect because the underlined portion makes no mention of the narrator’s mother and doesn’t address the narrator’s relationship with her. Although the narrator mentions that her mother gave her permission as a child to walk around the neighborhood, there is nothing in the underlined portion or the rest of the text about the mother or her relationship to her child."},{"i":"02e49a0c","c":"func","d":"E","s":"Genetic studies have led researchers to suggest that turtles are most closely related to the group that includes modern crocodiles. But studies of fossils have suggested instead that turtles are most closely related to other groups, such as the one that contains modern snakes. <u>However, many of the fossil studies have relied on incomplete data sets.<\/u> For a 2022 investigation, biologist Tiago R. Simões and colleagues examined more than 1,000 reptile fossils collected worldwide. From this large data set, they found clear agreement with the results of the genetic studies.\n\nWhich choice best describes the function of the underlined sentence?","o":["It offers an overview of the tools scientists use to examine fossils.","It describes a limitation of some studies about the origin of turtles.","It summarizes previous research on the evolution of crocodiles.","It criticizes a widely held belief about genetic studies of reptiles."],"a":1,"r":"Choice B is the best answer. The sentence mentions that some fossil studies have relied on incomplete data sets, suggesting that these studies are limited in what they can tell us about turtles’ origins. Choice A is incorrect. While the sentence mentions the incompleteness of the data sets studied, it doesn’t mention any tools or techniques used to examine fossils. Choice C is incorrect. The sentence doesn’t mention anything about the evolution of crocodiles. Choice D is incorrect. This sentence doesn’t directly mention or criticize any \"widely held belief,\" and it focuses on a limitation of fossil studies of reptiles, not genetic studies."},{"i":"c885c38b","c":"cross","d":"H","s":"Text 1 Conventional wisdom long held that human social systems evolved in stages, beginning with hunter-gatherers forming small bands of members with roughly equal status. The shift to agriculture about 12,000 years ago sparked population growth that led to the emergence of groups with hierarchical structures: associations of clans first, then chiefdoms, and finally, bureaucratic states.\n\nText 2 In a 2021 book, anthropologist David Graeber and archaeologist David Wengrow maintain that humans have always been socially flexible, alternately forming systems based on hierarchy and collective ones with decentralized leadership. The authors point to evidence that as far back as 50,000 years ago some hunter-gatherers adjusted their social structures seasonally, at times dispersing in small groups but also assembling into communities that included esteemed individuals.\n\nBased on the texts, how would Graeber and Wengrow (Text 2) most likely respond to the “conventional wisdom” presented in\n\nText 1?","o":["By conceding the importance of hierarchical systems but asserting the greater significance of decentralized collective societies","By disputing the idea that developments in social structures have followed a linear progression through distinct stages","By acknowledging that hierarchical roles likely weren’t a part of social systems before the rise of agriculture","By challenging the assumption that groupings of hunter-gatherers were among the earliest forms of social structure"],"a":1,"r":"Choice B is the best answer because it describes the most likely way that Graeber and Wengrow (Text 2) would respond to the “conventional wisdom” presented in Text 1. According to Text 1, the conventional wisdom about human social systems is that they developed through stages, beginning with hunter-gatherer bands, then moving to clan associations, then chiefdoms, and finally arriving at states with bureaucratic structures. Text 2 indicates that Graeber and Wengrow believe that human social systems have been flexible, shifting between different types of structures, including both hierarchical and collective systems, and that these shifts may have even occurred seasonally. This suggests that Graeber and Wengrow would dispute the idea that developments in social structures have followed a linear progression through distinct stages. Choice A is incorrect because nothing in Text 2 suggests that Graeber and Wengrow believe that decentralized collective societies are more significant than hierarchical systems. Text 2 is focused on Graeber and Wengrow’s view that humans have flexibly shifted among various social structures, not on the importance of particular structures relative to others. Choice C is incorrect because Text 2 doesn’t include any information suggesting that Graeber and Wengrow believe that hierarchies didn’t emerge until after the rise of agriculture. In fact, Text 2 indicates that Graeber and Wengrow cite evidence suggesting that some hunter-gatherer groups formed social structures with hierarchical elements (“communities that included esteemed individuals”) 50,000 years ago, long before the rise of agriculture, which Text 1 says occurred around 12,000 years ago. Choice D is incorrect because there’s no information in Text 2 suggesting that Graeber and Wengrow would challenge the assumption that groupings of hunter-gatherers were among the earliest forms of social structure. Although Text 1 does indicate that hunter- gatherer groups are assumed to be the earliest human social system, Text 2 says only that Graeber and Wengrow believe that some hunter- gatherer groups made use of different social structures at different times. Text 2 doesn’t imply that Graeber and Wengrow doubt that hunter- gatherer groups preceded most other social structures."},{"i":"dcca0dfc","c":"main","d":"H","s":"The following text is from Mick Herron’s 2023 novel The Secret Hours. The narrator is describing members of a government committee. Finally, and adding much-needed gravitas, was Sir Winston Day, whose features seemed moulded to adorn a bust, or possibly a stamp, and whose forehead was so evidently bulging with grey matter that it would have been impertinent to inquire too closely into the actual achievements his half century of public service had produced. His recently published memoirs possibly cast light on this enigma, but given that such details were not provided until after the thirty-page mark, they might as well have remained state secrets. ©2023 by Mick Herron Based on the text, which choice best describes Sir Winston Day?","o":["He has the appearance of a distinguished figure, but it is uncertain whether he has accomplished anything to earn distinction.","He looks like a person worthy of respect, but his memoirs reveal that some of his actions were dishonorable.","He would be a celebrated public figure if his achievements did not have to be kept secret.","He has maintained a modest profile even though he has served the public capably for many years."],"a":0,"r":"Choice A is the best answer because it accurately describes Sir Winston Day as he is portrayed in the text. The text indicates that Sir Winston’s “features seemed moulded to adorn a bust, or possibly a stamp,” suggesting that he appeared distinguished. But the text also indicates that his “actual achievements” during his long public service constitute an “enigma,” or mystery, highlighting the point with a joke about Sir Winston’s uninteresting memoirs (any information about his achievements past the first thirty pages “might as well have remained state secrets” since, it’s implied, no one bothered to read that far). Thus, the text suggests that Sir Winston appears distinguished even though his known accomplishments, if any, are relatively few. Choice B is incorrect because nothing in the text indicates that Sir Winston behaved dishonorably. Rather, the text indicates that his “actual achievements” during his long public service constitute an enigma, or mystery, suggesting that he may have done very little, not that what he has done was disreputable. Choice C is incorrect. Although the text says that Sir Winston’s achievements that appear “after the thirty-page mark” in his memoirs “might as well have remained state secrets,” this is a joke about the public’s lack of interest in the memoirs, not a sincere claim that secrecy was intended. Choice D is incorrect because the text does not associate Sir Winston with modesty, nor does it suggest that he was a capable public servant. Rather, by indicating that Sir Winston’s “features seemed moulded to adorn a bust, or possibly a stamp,” the text suggests that Sir Winston’s appearance communicated importance, not modesty. The text further indicates that his “actual achievements” during his long public service constitute an enigma, or mystery, suggesting that he may have done very little, not that he was particularly capable."},{"i":"de0a5b4e","c":"main","d":"E","s":"In 2022, researchers rediscovered ancient indigenous glyphs, or drawings, on the walls of a cave in Alabama. The cave’s ceiling was only a few feet high, affording no position from which the glyphs, being as wide as ten feet, could be viewed or photographed in their entirety. However, the researchers used a technique called photogrammetry to assemble numerous photos of the walls into a 3D model. They then worked with representatives of tribes originally from the region, including the Chickasaw Nation, to understand the significance of the animal and humanoid figures adorning the cave.\n\nAccording to the text, what challenge did the researchers have to overcome to examine the glyphs?","o":["The cave was so remote that the researchers couldn’t easily reach it.","Some of the glyphs were so faint that they couldn’t be photographed.","The researchers were unable to create a 3D model of the cave.","The cave’s dimensions prevented the researchers from fully viewing the glyphs."],"a":3,"r":"Choice D is the best answer. The text describes the very low ceiling of the cave, making it impossible to photograph the very wide glyphs all at once. Choice A is incorrect. The text doesn’t say this. It never suggests that the cave was remote or difficult to access, just that the cave itself was difficult to photograph well. Choice B is incorrect. The text doesn’t say this. The glyphs were so wide that they couldn’t be photographed completely. Choice C is incorrect. The text states the opposite of this. The researchers “used a technique called photogrammetry to assemble numerous photos of the walls into a 3D model.”"},{"i":"26f5c4ba","c":"infer","d":"H","s":"In 2022, Crystal Reeck and colleagues studied whether the decision-making modes that guide consumers influence their choice between nonenvironmentally friendly standard electricity plans and environmentally friendly green plans that cap electricity usage. Study participants who self-reported using either an Affect Mode or Role Mode—which prioritize choices that have a stronger positive emotional or social impact, respectively—were more likely to select a green plan. Conversely, participants using a Calculation Mode—which aims to minimize both financial cost and personal inconvenience—were more likely to select a standard plan, even when the green option was cheaper. This finding suggests that participants using a Calculation Mode ______ Which choice most logically completes the text?","o":["were equally unlikely to factor the financial savings of the green plan into their decision-making as were participants using either the Affect or Role Modes.","may have been less strongly motivated to appear socially responsible with their choice of plan than they realized.","may have determined that the green plan imposed additional burdens on them that were not sufficiently offset by the potential financial savings.","were less likely to believe that the green plan was truly cost-effective than were participants using either the Affect or Role Modes."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the influence of decision-making modes on consumers’ choices of different electricity plans. The Affect Mode describes choices based on the decision-maker’s preferred emotional outcome, the Role Mode describes choices based on the decision-maker’s social motivations, and the Calculation Mode describes choices based on minimizing financial costs and maximizing the decision-maker’s convenience. Thus, if those using a Calculation Mode disfavor the green plan, it would be due to some financial or convenience burden the green plan imposes that the other doesn’t. The text indicates that the green plan had a lower financial cost but was nonetheless rejected by participants using the Calculation Mode. It therefore follows that the green plan likely imposed a convenience burden that outweighed potential financial savings for these participants. Choice A is incorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves social motivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience. Thus, unlike the Affect or Role Modes, the Calculation Mode would almost certainly involve taking price differences into account. Choice B is incorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves social motivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience. Thus, there is no reason to think that participants using the Calculation Mode at any point took social responsibility into account, let alone think that they discovered a disparity between their expectations and reality. Choice D is incorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves social motivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience. Thus, the text doesn’t indicate that cost-effectiveness is a factor for participants using the Affect or Role Modes, and there is no basis to compare their beliefs in the truthfulness of the green-plan description with those of the Calculation Mode users."},{"i":"485962a6","c":"infer","d":"M","s":"Astronomers investigated the Arabia Terra region of Mars because it appears to contain irregularly shaped craters that may have been caused by massive volcanic explosions. In their investigations of Arabia Terra, the researchers found remnants of ash deposits in an amount and thickness that would result from a massive volcanic eruption. However, erosion and past resurfacing events could have modified the surface of the planet. Therefore, ______ Which choice most logically completes the text?","o":["the current makeup of the Arabia Terra region might not accurately reflect the volcanic activity of Mars’s past.","eruptions from Mars’s volcanoes were likely not as massive as astronomers previously believed.","ash was most likely expelled from multiple different volcanoes on Mars’s surface.","the craters found in the Arabia Terra region were necessarily created by events other than volcanic eruptions."],"a":0,"r":"Choice A is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the Arabia Terra region of Mars. According to the text, there are craters in Arabia Terra that could be the result of volcanic activity, and researchers have found evidence of ash deposits consistent with a large eruption. The text goes on to note, however, that erosion and other events could have altered the surface of Mars. This observation suggests that current conditions on Mars’s surface are not necessarily a reliable guide to past events—some signs of past events could have been transformed or erased entirely—and thus the current makeup of Arabia Terra may not accurately reflect past volcanic activity. Choice B is incorrect because the text suggests only that past events could have changed Mars’s surface such that its current appearance isn’t a reliable guide to past activity, not that it’s likely that past eruptions were not as massive as astronomers previously believed. Nothing in the text supports a conclusion about the likely size of past eruptions. Choice C is incorrect because the observation that resurfacing events could have changed the appearance of Mars doesn’t imply that the ash discussed in the text likely came from multiple volcanoes. Although it’s possible that the ash came from different volcanoes, there’s no information in the text supporting a conclusion about how likely that possibility is. Choice D is incorrect because nothing in the text suggests that the Arabia Terra craters had to have been created by something other than volcanic eruptions. Although the text does suggest that the evidence consistent with volcanic eruptions shouldn’t be taken as definitive proof of past eruptions, that doesn’t mean that the craters couldn’t have been created by eruptions, only that we can’t be certain they were."},{"i":"2644644a","c":"claim","d":"H","s":"In countries with right-hand traffic, drivers who want to make a left turn at a traffic intersection with stoplights have to wait for either a gap in oncoming traffic or a designated left-turn signal to turn green. At busy intersections, this often causes a backup of vehicles waiting to turn left or being prevented from proceeding by left-turning vehicles in front of them. Transportation researcher Vikash V . Gayah claims that in urban areas eliminating the option to turn left at busy intersections—both with and without dedicated left-turn signals—would improve traffic flow and, as a result, reduce overall travel times even if such a restriction would require drivers to sometimes travel a slightly longer distance.\n\nWhich finding, if true, would most directly support the researcher’s claim?","o":["In a town that installed left-turn signals at all busy intersections, seven out of ten survey respondents agreed with the statement “the streets in my community are easier to navigate by motor vehicle than before.”","A traffic study of intersections in a large city shows that on average drivers wait longer to make a left turn at intersections without left-turn signals than at intersections with such signals.","After a city eliminated left turns at busy intersections, a package-delivery company reports that its drivers have been able to reach more addresses in the city daily, on average, and therefore deliver more packages there annually.","Statistics reveal that school buses in a city that eliminated left turns at most intersections took on average two minutes longer to complete their routes after the restriction took effect than they did before."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would most directly support Vikash V . Gayah’s claim that eliminating the option to turn left at busy intersections would improve traffic flow and reduce overall travel times. The text begins by describing a problem encountered by drivers in countries with right-hand traffic—namely that drivers wanting to make a left turn must wait for either gaps in oncoming traffic or for designated left-turn signals before proceeding. The resulting backup of vehicles causes increased traffic congestion at busy intersections that slows overall travel times. According to Gayah, eliminating left turns from busy intersections in urban areas would ease the congestion caused by vehicles waiting to turn left. If vehicles spend less time waiting at intersections for left turns, faster overall travel times would result even if some drivers would have to drive slightly longer distances to make the desired left turn. Drivers for package-delivery companies, who presumably spend most of the day driving to destinations across the city in which they are based, would likely provide a good indication of overall traffic patterns across the city. A finding that after a city had eliminated left turns at busy intersections, package-delivery companies were able to complete more daily deliveries on average—which implies faster travel times between package destinations—would therefore support the claim that overall travel times would decrease if left turns were eliminated at busy intersections. Choice A is incorrect because a finding that a majority of survey respondents agreed with the statement that implementing left-turn signals at all busy intersections made navigating streets in their communities easier wouldn’t support the claim that eliminating the option to turn left altogether at some busy intersections—both with and without dedicated left-turn signals—would improve the flow of traffic and overall traffic times. In fact, the text emphasizes that designated left-turn signals contribute to increased congestion because they require drivers to wait to turn left, which results in a backup of vehicles. Installing such signals at all busy intersections would thus potentially compound the problem of congestion, not improve it. Moreover, although making streets easier for drivers to navigate might indicate that left-turn signals are beneficial to drivers, it doesn’t indicate that overall travel times would necessarily be reduced. Choice B is incorrect because a study concluding that drivers wait longer to make left turns at intersections without dedicated left-turn signals than at intersections with such signals wouldn’t support the claim that eliminating the option to turn left altogether would reduce overall travel times. In fact, the finding would merely support the idea that installing left-turn signals would likely reduce the time drivers spend waiting at busy intersections that didn’t previously have left-turn signals, not that overall travel times would be reduced. Choice D is incorrect because the finding that after a restriction eliminating left turns at most intersections took effect, school buses took longer to complete their routes than they did before the restriction was implemented would contradict rather than support the researcher’s claim that eliminating left turns would reduce overall travel times."},{"i":"0021d326","c":"claim","d":"E","s":"Olms are salamanders that live in underwater caves. Scientists once thought that olms stay in their caves all their lives. However, Raoul Manenti and team claim that <u>olms regularly come to the surface to perform important activities such as finding food.<\/u> Which finding, if true, would most strongly support the underlined claim?","o":["Researchers determine that olms don’t breed often.","Researchers confirm that olms live in only a few cave systems.","Researchers discover that earthworms from surface soils are a major part of olms’ diet.","Researchers learn that olms’ brains differ from other salamanders’ brains."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would most strongly support Manenti and team’s claim that olms regularly come to the surface to find food. The text explains that scientists previously believed olms remained in their underwater caves throughout their lives, but Manenti’s team claims that olms actually surface regularly to perform important activities like finding food. Since earthworms from surface soils would not be present in underwater caves, the finding that such earthworms constitute a major part of olms’ diet would provide compelling evidence that olms regularly leave their underwater cave environment to obtain food from the surface, thus supporting the underlined claim. Choice A is incorrect because information about olms’ breeding frequency wouldn’t support the claim about their leaving their underwater habitats to obtain food. While breeding patterns might be relevant to understanding olm behavior in general, this finding doesn’t address whether olms surface to find food, which is the specific behavior that the underlined claim addresses. Choice B is incorrect because learning that olms live in only a few cave systems wouldn’t support the claim about their regular visits to the surface. This finding would provide information about the geographic distribution of olm habitats but wouldn’t address whether olms leave these caves to find food or perform other activities on the surface. Choice D is incorrect because the differences between olms’ brains and other salamanders’ brains have no clear connection to olms’ movement beyond their underwater habitats or to their feeding habits. A finding about the uniqueness of olms’ brains wouldn’t address whether olms leave their caves to find food or support Manenti and team’s claim about olms’ motivation for coming to the surface."},{"i":"cbdd5287","c":"graph","d":"H","s":"","o":["DptA confers defense against A. sicerae regardless of the presence of DptB.","DptB protects against only one bacteria species, whereas DptA protects against multiple species.","DptB may have developed as a specific defense against A. sicerae.","defense against A. sicerae is strongest when both DptA and DptB are present."],"a":2,"r":"Choice C is the best answer because it most logically completes the text based on supporting data in the graph. The text indicates that in the fly D. melanogaster, DptA and DptB are genes that encode peptides that both fight pathogens and promote beneficial microbes. Researchers tested D. melanogaster’s resistance to P . rettgeri and A. sicerae bacteria based on which variation of the peptide-encoding gene the flies exhibit: DptA silenced (referred to as type A), DptB silenced (type B), or both silenced (type AB). The text also indicates that resistance to P . rettgeri correlates with DptA activity but not with DptB activity (which would manifest as type B flies surviving at a higher rate than other fly types when exposed to P . rettgeri). The graph shows the post–A. sicerae infection results, which indicate that DptB activity was most strongly associated with survival, whereas DptA activity was not (manifesting in the graph as the type A flies having greater survival rates than the other fly types). In other words, when DptA activity was silenced, the flies showed relatively high survival rates, but when DptB activity was silenced, whether on its own or in conjunction with DptA activity being silenced, survival rates were low, suggesting that DptB may have developed as a specific defense against A. sicerae. Choice A is incorrect. The graph suggests that DptA activity is associated with a low rate of survival, not a high one. Furthermore, the graph shows results for flies where DptA alone was silenced, DptB alone was silenced, and both were silenced and thus does not show any flies with activity in both DptA and DptB, which would be necessary to determine whether DptA conferred defense against A. sicerae in the presence of DptB. Choice B is incorrect. Only two bacteria species were considered in the text: P . rettgeri and A. sicerae. The text and graph taken together suggest that activity in DptA is associated with resistance to P . rettgeri while DptB activity is not, and that DptB activity is associated with resistance to A. sicerae while DptA is not. There is no further information to suggest one genetic type confers resistance to a greater number of pathogens than the other. Choice D is incorrect. The graph does not address flies with activity in both DptA and DptB. All flies represented in the graph had one or both of DptA and DptB silenced, or inactive."},{"i":"23b5cb59","c":"graph","d":"E","s":"","o":["170 electoral college votes.","103 electoral college votes.","62 electoral college votes.","44 electoral college votes."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the statement about the 15th US presidential election. The table shows the total number of electoral college votes and the total number of popular votes received by each of three candidates. The table shows that Polk received 170 electoral college votes. Choice B is incorrect because the table shows that Polk received 170 electoral college votes, not 103. According to the table, none of the candidates received a total of 103 votes of either type (electoral college or popular). Choice C is incorrect because the table shows that Polk received 170 electoral college votes, not 62. According to the table, none of the candidates received a total of 62 votes of either type (electoral college or popular). Choice D is incorrect because the table shows that Polk received 170 electoral college votes, not 44. According to the table, none of the candidates received a total of 44 votes of either type (electoral college or popular)."},{"i":"d2b81427","c":"fss","d":"H","s":"In assessing the films of Japanese director Akira Kurosawa, ______ have missed his equally deep engagement with Japanese artistic traditions such as Noh theater.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["many critics have focused on Kurosawa’s use of Western literary sources but","Kurosawa’s use of Western literary sources has been the focus of many critics, who","there are many critics who have focused on Kurosawa’s use of Western literary sources, but they","the focus of many critics has been on Kurosawa’s use of Western literary sources; they"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “many critics” the subject of the sentence and places it immediately after the modifying phrase “in assessing…Kurosawa.” In doing so, this choice clearly establishes that it is the critics—and not another noun in the sentence—who assess Kurosawa’s films. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “Kurosawa’s…sources” immediately after the modifying phrase illogically suggests that his use of Western literary sources is what assesses Kurosawa’s films. Choice C is incorrect because it results in a dangling modifier. The placement of the function word “there” immediately after the modifying phrase illogically suggests that “there” is what assesses Kurosawa’s films. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “the focus… critics” immediately after the modifying phrase illogically suggests that the critics’ focus is what assesses Kurosawa’s films."},{"i":"43b88827","c":"fss","d":"M","s":"In October of 1648, representatives from 96 different parties convened to sign the final treaties of the Peace of Westphalia. The treaties, which brought an end to the Thirty Years’ War, ______ signed in the cities of Osnabrück and Münster, both located in the Holy Roman Empire–controlled region of Westphalia.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["were","is","was","has been"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The plural verb “were signed” agrees in number with the plural subject “the treaties.” Choice B is incorrect because the singular verb “is signed” doesn’t agree in number with the plural subject “the treaties.” Choice C is incorrect because the singular verb “was signed” doesn’t agree in number with the plural subject “the treaties.” Choice D is incorrect because the singular verb “has been signed” doesn’t agree in number with the plural subject “the treaties.”"},{"i":"60a4c088","c":"fss","d":"E","s":"What makes the theremin a unique musical instrument? You play it without touching it. When you place your ______ the pitch will shift as your hands move through the air.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["hand’s between the two antenna’s,","hands between the two antennas,","hands’ between the two antennas’,","hands’ between the two antennas,"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of plural nouns in a sentence. The plural noun \"hands\" and the plural noun \"antennas\" correctly indicate that two hands are placed between two antennas when playing the theremin. Choice A is incorrect because the context requires the plural nouns \"hands\" and \"antennas,\" not the singular possessive nouns \"hand’s\" and \"antenna’s.\" Choice C is incorrect because the context requires the plural nouns \"hands\" and \"antennas,\" not the plural possessive nouns \"hands’\" and \"antennas’.\" Choice D is incorrect because the context requires the plural noun \"hands,\" not the plural possessive noun \"hands’.\""},{"i":"6ea8c23f","c":"bound","d":"H","s":"In 2018, a team of researchers led by Dr. Caitlin Whalen compiled every available measurement of ocean mixing rates from the past two decades. With this novel data set, the team was able to determine how current-driven mixing varies across ______ and what impact it has on the distribution of heat and nutrients in the ocean.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["regions,","regions:","regions;","regions"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation between coordinates in a sentence. The two elements \"how…regions\" and \"what…ocean\" work together as coordinates to complete the description of what the team was able to determine. Because there are only two coordinates in this case (as opposed to a series of three or more), no punctuation is needed between them. Choice A is incorrect because no punctuation is needed between the coordinates \"how…regions\" and \"what…ocean.\" Choice B is incorrect because no punctuation is needed between the coordinates \"how…regions\" and \"what…ocean.\" Choice C is incorrect because no punctuation is needed between the coordinates \"how…regions\" and \"what…ocean.\""},{"i":"9579581e","c":"bound","d":"H","s":"As cheesemaking practices spread throughout Europe and Asia during and after the Neolithic, divergent strategies for preserving milk ______ whereas rennet-coagulated cheesemaking became key to milk preservation in Europe and Southwest Asia, acid-heat coagulation methods became common among nomadic herding populations of the northeastern Eurasian steppe.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["emerged","emerged and","emerged:","emerged,"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use within a sentence. A colon can be used between two main clauses to signal that what follows is an elaboration of what came before. In this choice, the colon correctly introduces the following explanation of the divergent milk preservation strategies that emerged. Choice A is incorrect because it results in a run-on sentence. The main clause (\"As…emerged\") and the subordinate clause followed by another main clause (\"whereas…steppe\") are fused without punctuation and/or a conjunction. Choice B is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join a main clause (\"As…emerged\") and a subordinate clause followed by another main clause (\"whereas…steppe\"). Choice D is incorrect because it results in a comma splice. A comma can’t be used in this way to join a main clause (\"As… emerged\") and a subordinate clause followed by another main clause (\"whereas…steppe\")."},{"i":"e3484c07","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Bioluminescence is the emission of light by living organisms. This light is produced by chemical reactions in organisms’ cells. Jellyfish emit flashes of blue light. This behavior serves to startle predators. Black dragonfish emit a steady red light. This behavior helps them locate prey in deep waters. The student wants to emphasize a difference between the behavior of jellyfish and that of black dragonfish.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Both jellyfish and black dragonfish are organisms that emit light, which is produced by chemical reactions in these organisms’ cells.","Black dragonfish emit a steady red light, which helps them locate prey in deep waters.","Bioluminescence, the emission of light by living organisms, results from chemical reactions in organisms’ cells.","Jellyfish emit light to startle predators, whereas black dragonfish do so to locate prey."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes a difference between the behavior of jellyfish and that of black dragonfish, noting that jellyfish and black dragonfish emit light as part of different behaviors (protection and predation, respectively). Choice A is incorrect. The sentence emphasizes a similarity between jellyfish and black dragonfish; it doesn’t emphasize a difference between the behavior of the two animals. Choice B is incorrect. The sentence emphasizes the type of bioluminescence exhibited by black dragonfish, noting that it’s used in predation; it doesn’t emphasize a difference between the behavior of the two animals. Choice C is incorrect. The sentence defines bioluminescence and explains how it works; the sentence doesn’t mention either animal or emphasize a difference between them."},{"i":"54c1b2dd","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In 1851, German American artist Emanuel Leutze painted Washington Crossing the Delaware. His huge painting (149 × 255 inches) depicts the first US president crossing a river with soldiers in the Revolutionary War. In 2019, Cree artist Kent Monkman painted mistikôsiwak (Wooden Boat People): Resurgence of the People. Monkman’s huge painting (132 × 264 inches) was inspired by Leutze’s. It portrays Indigenous people in a boat rescuing refugees. The student wants to emphasize a similarity between the two paintings.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Monkman, a Cree artist, finished his painting in 2019; Leutze, a German American artist, completed his in 1851.","Although Monkman’s painting was inspired by Leutze’s, the people and actions the two paintings portray are very different.","Leutze’s and Monkman’s paintings are both huge, measuring 149 × 255 inches and 132 × 264 inches, respectively.","Leutze’s painting depicts Revolutionary War soldiers, while Monkman’s depicts Indigenous people and refugees."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes a similarity between the two paintings, noting that Leutze’s painting (which measures 149 × 255 inches) and Monkman’s painting (which measures 132 × 264 inches) are both very large. Choice A is incorrect. The sentence mentions that Monkman’s painting was completed in 2019 and Leutze’s was completed in 1851; it doesn’t emphasize a similarity between the two paintings. Choice B is incorrect. While the sentence acknowledges that one painting was inspired by the other, it emphasizes differences between the two paintings; it doesn’t emphasize a similarity between them. Choice D is incorrect. The sentence mentions a difference between the two paintings; it doesn’t emphasize a similarity between them."},{"i":"db8fe023","c":"trans","d":"E","s":"A potter choosing which type of clay to use for a piece considers two key factors: the desired look of the piece and its intended use. ______ earthenware clay is often used for decorative pieces because of its rustic look. This type of clay is not often used in industrial settings, though, because it is less durable than other clays.\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","Regardless,","In conclusion,","For example,"],"a":3,"r":"Choice D is the best answer. The previous sentence tells us that potters think about the look and use of a piece when selecting clay. This sentence provides a specific example of a type of clay selected for its appearance, so the transition \"for example\" fits perfectly. Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea. But this sentence does more than just restate the previous idea. Instead, it provides a more specific example of the idea presented in the first sentence. Choice B is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with the previous sentence. Both sentences suggest that desired look plays a role in the selection of clay types for pottery pieces. Choice C is incorrect. This choice uses a concluding transition. But this sentence doesn’t sum up the previous sentence. Instead, it gives a specific example of the idea presented in the previous sentence."},{"i":"1872cd6d","c":"trans","d":"H","s":"When printing paper money for the colony of Pennsylvania in the 1730s, Benjamin Franklin—then a Philadelphia shop owner—took steps to combat the circulation of counterfeit notes, such as weaving blue threads and muscovite (a reflective mineral) into the paper he used. ______ he stamped the notes with detailed imprints of sage leaves that proved difficult for forgers to replicate.\n\nWhich choice completes the text with the most logical transition?","o":["Specifically,","That said,","For example,","Moreover,"],"a":3,"r":"Choice D is the best answer. \"Moreover\" logically signals that the information in this sentence—that Franklin stamped imprints on paper money to make forgery more difficult—adds to the previous information by describing Franklin’s other strategy for combatting forgers: weaving materials into the paper used for printing money. Choice A is incorrect because \"specifically\" illogically signals that the information in this sentence provides specific, precise details elaborating on the previous information about Franklin’s other strategy for combatting forgers (weaving materials into paper). Instead, this information about stamping imprints on money adds new information. Choice B is incorrect because \"that said\" illogically signals that the information in this sentence is an exception to the previous information about Franklin’s other strategy for combatting forgers (weaving materials into paper). Instead, this information about stamping imprints on money adds new information. Choice C is incorrect because \"for example\" illogically signals that the information in this sentence serves as an example of the previous information about Franklin’s other strategy for combatting forgers (weaving materials into paper). Instead, this information about stamping imprints on money adds new information."},{"i":"480ade7e","c":"trans","d":"H","s":"In response to adverse environmental conditions, many plants produce abscisic acid (ABA), a stress hormone. ABA triggers a slowdown in the biological processes of most plants. ______ when the mustard plant Schrenkiella parvula produces ABA in response to an environmental stressor, the hormone triggers accelerated growth.\n\nWhich choice completes the text with the most logical transition?","o":["Moreover,","In contrast,","For example,","Thus,"],"a":1,"r":"Choice B is the best answer. “In contrast” logically signals that the information in this sentence—that ABA triggers accelerated growth in the mustard plant Schrenkiella parvula—contrasts with the previous information about ABA triggering a slowdown in most plants’ biological processes. Choice A is incorrect because “moreover” illogically signals that the information in this sentence about the mustard plant merely adds to the previous information about the effects of ABA. Instead, it contrasts with that information. Choice C is incorrect because “for example” illogically signals that the information in this sentence about the mustard plant provides an example consistent with the previous information about the effects of ABA. Instead, it contrasts with that information. Choice D is incorrect because “thus” illogically signals that the information in this sentence about the mustard plant is a consequence, or result, of the previous information about the effects of ABA. Instead, it contrasts with that information."}],"img":{"cbdd5287":"iVBORw0KGgoAAAANSUhEUgAAArwAAAJTBAMAAAAYhtgnAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABivElEQVR42u1dd3xUxRb+5m5L39kk9HaT0OuGIh2WLlJcelUXkCpiaFJUDCBSlUREQnkSipSAEkBA+tI7LL0nG5pIyc6GTpKd98emZxeCJhDC/X7vSXbm3rl3vjn3zDlnGiBBggQJEiRIkCBBggQJEiRIkCBBgoS3ASTlLwrQLFyW5vIsJL3ToBn+spNICfFPc5E26d8m9nxhsghvjWhPE0QA0Php85NAic4MUJzMKHJJEvzZ/PDkFI0wK4n45fZ/iiwTyfyIdfbcAnoBwGcR69vIxgPUgZC/w3B76PDrp8LNAF1qkiYpebn9n8oAWV4tSVYF2gLA9KqB9YkoqYYMqNsDnYnS0Oov2rmHoftFqlx9SNvjIIXCBJSh8qC+rUcT+YSgSVDpZ2zEcoAsWCocXwayAWj2ebUgDFc23rEJmAzUJ8PI1+vR47D2TVREyJX0tl2rVajzXx/bK7hMucjn2pBJoxJPd+sdTBNc/JAfcrFwmT8bKtHuEWqYb36pZ6BFbh1sMHMGuJXQ8k9O6dFeXvnYWCAOFDK9W7652indzVSiN0kfVEwwrNX57b/iYeAz2O/FabGrZmXs/UaMd1ghcnCa+MMVg8/CuCViZVOoRasB0437n958HMg/JdhzAUAJR+wJwHfuBDMsAYtiAuOuMCbRa4e86UR9gq4HeW/SrlhGRn0q7unsRcqM2AWc7RUJEOaJBLGNGbHa1sIvw5gNqAQbBUASjxk5AMbtBdl+3ymC0lGfWCYvezM1yZX0/n7pZry/iC0hloFQfdCxVPj/ZpC/FsUCOCcwehtWJN6oN5c+61Ok0PPpAzSANenOKxEoDM4AAkoZEregPszoVsLCqCFckl47qo2dvzzR7XiCNhoUZMcj+uFoY7wuChSijELMRyn4RQ9YEsqueTBOCQYs0eY3MoBrAAqIQiDHNTvJDJroj6OtdIGOStJrV70NJ2GXbt2150eP7XlGH/UsKz7YfrfW0WPrg+XbMO7KmuhzasKNck6w3vjs3PZbDPSfSPeybU6DAKBI3H4gSoNdB2qDg1UGu/354E6r8CmDBKT4AAQQqlICeIs+SzX1RaExgAA/kECRapIuFICqIqUA/EUQuynsDfj4AQRVAQIQUPj4wT9Qsn7TOxI05b/Cn2itc+w3UwI7hVlqsjcYOMmNcpz8PU9LbFgnzU8J2SwETSQOJEiQIEGCBAkScpGfkd6noC+6Qhr7+U9us1NoJHZeGbJjWgAtFcEpKcNSJFQmAiCqy9rkrFzlgQhvg25QLTEB8LUPrqcIqT1krtAD4PlrnLRn6IifRO+rgTeOg68INdegpEhEiKC/EtKYorq/CIFSn0B8GMhLUghNFH1L/AFZIxCfqtJHn1X8ukm+dTNtrVik2LpJtlZ5Sh6+QblyW7Bq1T0DXIMGzTtE/vhNtXUvvj5c7u7QXzD/sM597jadxFsWUURXNKhIcBtVZDF9xV
