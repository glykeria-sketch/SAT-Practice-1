<script>
const D={"t":"Practicetest51","q":[{"i":"85083d4d","c":"vocab","d":"M","s":"Disproving the common misconception of Native art as ______, the painters whose work appears in the collection at the National Museum of the American Indian employ a range of styles. There are artists working in the traditional arts of their specific tribal communities, artists working in European modernist or American abstract expressionist art traditions, and artists blending various traditions into something wholly new.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["uncontroversial","individualistic","theoretical","homogeneous"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the art at the National Museum of the American Indian. In this context, \"homogenous\" means uniform or highly similar. The text explains that the painters whose works are included in this museum’s collection employ an array of artistic styles, both Native and non-Native, traditional and new. Given this high degree of stylistic diversity, it is a misconception that Native art is uniform, or homogenous. Choice A is incorrect because the text doesn’t consider whether Native art is controversial, or causes disagreement or discussion; instead, the text discusses the stylistic diversity of the collection of the National Museum of the American Indian. Choice B is incorrect. Although the text indicates that some of the artists whose work is represented in the collection of the National Museum of the American Indian blend various artistic traditions into highly individual styles of their own, this is not the primary focus of the text. Instead, the text is concerned with how Native art is often mistakenly perceived as uniform, when in fact it is stylistically diverse. Choice C is incorrect because the text never implies that people mistakenly conceive of Native art as theoretical, or concerned with philosophical or abstract issues; instead, the text’s discussion of Native art is framed around this art’s stylistic diversity versus the misconception of it as homogenous."},{"i":"a4ca92fd","c":"vocab","d":"E","s":"Beginning in the 1950s, Navajo Nation legislator Annie Dodge Wauneka continuously worked to promote public health; this ______ effort involved traveling throughout the vast Navajo homeland and writing a medical dictionary for speakers of Diné bizaad, the Navajo language.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["impartial","offhand","persistent","mandatory"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Annie Dodge Wauneka’s work as a Navajo Nation legislator. As used in this context, “persistent” means existing continuously. The text states that Wauneka “continuously worked to promote public health,” traveling extensively and authoring a medical dictionary; this indicates that Wauneka’s effort was persistent. Choice A is incorrect because describing Wauneka’s effort related to public health as “impartial,” or not partial or biased and treating all things equally, wouldn’t make sense in context. The text suggests that Wauneka’s continuous work was partial in one way, as she focused specifically on promoting public health throughout the Navajo homeland and to speakers of the Navajo language. Choice B is incorrect because the text emphasizes that Wauneka’s effort to promote public health as a Navajo Nation legislator was continuous and extensive, involving wide travels and the authoring of a medical dictionary. Because this work clearly involved care and dedication, it wouldn’t make sense to describe it as “offhand,” or casual and informal. Choice D is incorrect because nothing in the text suggests that Wauneka’s effort to promote public health was “mandatory,” or required by law or rule, even though Wauneka was a Navajo Nation legislator. Rather than suggesting that Wauneka’s effort was required for any reason, the text emphasizes the continuous and extensive nature of her work."},{"i":"bdab32fc","c":"vocab","d":"E","s":"Cucurbits, a group of plants that includes squash and melons, relied on mastodons to spread their seeds in the Ice Age. When these animals died out, cucurbits faced extinction in turn, having lost their means of seed dispersal. Around this time, however, the ancestors of Indigenous peoples in North America began raising cucurbits as crops, thus ______ the plants’ survival.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["verifying","multiplying","comforting","ensuring"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of cucurbits. In this context, “ensuring” means guaranteeing, or making sure of, the cucurbits’ survival. The text states that cucurbits faced extinction in the past because their means of seed dispersal disappeared, but the ancestors of Indigenous peoples in North America began farming cucurbits around that same time, so the crops were no longer threatened. Therefore, the context supports the idea that the ancestors of Indigenous peoples in North America helped with ensuring the cucurbits’ survival. Choice A is incorrect because in this context verifying means making sure that something is accurate. In the text, the ancestors of Indigenous peoples in North America were ensuring the survival, not the accuracy of, the cucurbits. Choice B is incorrect. Although the cucurbit crops themselves were multiplying, or growing in number, as a result of the work of the ancestors of Indigenous peoples in North America, it wouldn’t make sense in context to say that the survival of the plants was multiplying. Choice C is incorrect because according to the text, in raising cucurbits as crops, the ancestors of Indigenous peoples in North America were attempting to help the plants grow and survive; they weren’t attempting to comfort, or free the plants from pain."},{"i":"b93428a6","c":"vocab","d":"E","s":"Animal researcher Amalia P .M. Bastos led a 2021 study about a wild kea parrot that used small stones as tools to preen its feathers. Skeptical colleagues had initially suggested to Bastos that the kea’s interactions with the stones might simply be ______, but Bastos and her team showed that the kea was using the stones deliberately.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["intriguing","obvious","accidental","observable"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Bastos’s study of a wild kea parrot. In this context, \"accidental\" means unplanned or unintentional. The text first describes Bastos’s study, which concerns a kea that is observed using small stones to preen its feathers. The text then mentions colleagues who are skeptical (that is, they have doubt) about Bastos’s findings, and finally describes how Bastos and her team responded to the skepticism of those colleagues. Given that the colleagues mentioned in the text expressed skepticism regarding Bastos’s findings, the best answer choice must be one that completes the text in a manner such that the skeptics’ opinion regarding the kea’s use of stones disagrees with that held by Bastos and her team. Since Bastos and her team showed that the kea’s use of stones was deliberate (that is, intentional), the skeptics’ opinion in this context must be that the kea’s use of stones was unintentional, or accidental. Choice A is incorrect because the best answer choice is one that portrays skepticism, or doubt, of Bastos’s claim that the kea’s usage of stones was deliberate, or intentional. If the skeptics found the kea’s usage of stones \"intriguing,\" or fascinating, this would not be at odds with the position of Bastos and her team; in fact, it is reasonable to believe that someone who agreed that the kea’s stone usage was deliberate would also find it intriguing. Choice B is incorrect because if the skeptics believed that the kea’s usage of small stones was \"obvious,\" or evident, this would not be contrary to the observation of Bastos and her team that the kea’s usage of stones was deliberate: in fact, these opinions would be consistent with each other. Choice D is incorrect because if the skeptics believed that the kea’s usage of small stones was \"observable,\" or visible, this would not conflict with the claim of Bastos and her team that the kea’s usage of stones was deliberate: instead, these positions would agree."},{"i":"2af2016f","c":"purpose","d":"M","s":"A study by Dr. Paul Hanel and colleagues concluded that people are more likely to behave politely when listening to ideas they disagree with if they think about values before they engage in a discussion. Study participants were assigned to one of two groups. The experimental group spent a few minutes writing about one of their personal values before they had a group discussion on a controversial topic. And the control group spent a few minutes writing about a drink (tea, milk, etc.) before their group discussion on that topic. Hanel and colleagues found that the experimental group’s discussion was more civil than the control group’s discussion was.\n\nWhich choice best describes the main purpose of the text?","o":["To describe a widely held belief and how a study’s results support that belief","To argue that researchers were surprised by the results of a certain study","To suggest ways to improve a certain study’s experimental design","To explain a study’s conclusion and how a research team arrived at that conclusion"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain a study’s conclusion and how researchers involved in the study arrived at that conclusion. The text begins by summarizing the main conclusion of the study conducted by Paul Hanel and colleagues: when confronted with ideas they disagree with in discussions about controversial topics, people are more likely to respond politely if they think about their personal values before engaging in such discussions. The text then goes on to describe the design of Hanel and colleagues’ experiment. By comparing interactions between members of an experimental group (who had been prompted to write about their personal values beforehand) to those between members of a control group (who had been prompted to write about a beverage), the team found that people in the experimental group behaved more civilly, or politely, than people in the control group did during discussions about a controversial topic. This finding led to the conclusion described at the beginning of the text. Choice A is incorrect. Although the text discusses the results of a study, it doesn’t provide any indication that the conclusion the study supported —that when facing disagreement, people behave more politely when they have thought about their values—is a belief that is widely held. Choice B is incorrect because the text doesn’t indicate that the researchers found the results of their study to be surprising, or contrary to what they expected. In fact, there’s no indication provided in the text about how the researchers felt about the study’s results or that the results should be considered surprising. Choice C is incorrect. Although the text discusses the experimental design of a study, it doesn’t suggest any improvements to that design; instead, it focuses on how the design enabled the researchers to draw a particular conclusion."},{"i":"ff97fd53","c":"purpose","d":"M","s":"In 1973, poet Miguel Algarín started inviting other writers who, like him, were Nuyorican—a term for New Yorkers of Puerto Rican heritage—to gather in his apartment to present their work. The gatherings were so well attended that Algarín soon had to rent space in a cafe to accommodate them. Thus, the Nuyorican Poets Cafe was born. Moving to a permanent location in 1981, the Nuyorican Poets Cafe expanded its original scope beyond the written word, hosting art exhibitions and musical performances as well. Half a century since its inception, it continues to foster emerging Nuyorican talent.\n\nWhich choice best describes the overall purpose of the text?","o":["To explain what motivated Algarín to found the Nuyorican Poets Cafe","To situate the Nuyorican Poets Cafe within the cultural life of New York as a whole","To discuss why the Nuyorican Poets Cafe expanded its scope to include art and music","To provide an overview of the founding and mission of the Nuyorican Poets Cafe"],"a":3,"r":"Choice D is the best answer. The text presents a brief history of the Nuyorican Poets Cafe, from how it got started in the ’70s, to its expansion in the ’80s, to its ongoing mission today. Choice A is incorrect. This isn’t the overall purpose. The text never mentions Algarín’s motivations. Choice B is incorrect. This isn’t the overall purpose. The text never discusses the cultural life of New York as a whole. Choice C is incorrect. This is too narrow. One sentence mentions that the Nuyorican Poets Cafe expanded its scope to include art and music, but this is only one point in the broader history of the Nuyorican Poets Cafe, which is the overall focus of the text."},{"i":"b3e145e4","c":"func","d":"E","s":"In the 1950s, scientists didn’t know much about the ocean floor. <u>Many scientists at the time believed that the ocean floor was mostly flat.<\/u> But geologist Marie Tharp and her research partner, Bruce Heezen, proved that this idea was wrong. Using sonar data collected from the Atlantic Ocean, Tharp and Heezen showed that the floor was filled with canyons, mountains, and valleys.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It identifies a scientific belief that Tharp and Heezen showed to be wrong.","It describes the design of Tharp and Heezen’s experiment.","It emphasizes a disagreement between Tharp and Heezen.","It presents data to support a claim that Tharp and Heezen made."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence of the text establishes that scientists didn’t know much about the ocean floor in the 1950s. The second sentence, which is underlined, describes what many scientists thought at the time—that the ocean floor was mostly flat. The remainder of the text establishes that the ocean floor is far from flat, citing research conducted by Marie Tharp and Bruce Heezen. Thus, the purpose of the underlined sentence is to identify a scientific belief that Tharp and Heezen showed to be wrong. Choice B is incorrect. Although Tharp and Heezen’s work with sonar data in the Atlantic Ocean is mentioned later in the text, the underlined sentence doesn’t describe the design of their experiment. Instead, it identifies a belief held by scientists that Tharp and Heezen demonstrated to be wrong. Choice C is incorrect because the underlined sentence presents a belief held by many scientists in the 1950s; nowhere does the text mention a disagreement between Tharp and Heezen, whom the text describes as research partners working together to map the ocean floor. Choice D is incorrect because the underlined sentence doesn’t present data in support of a claim; instead, it presents a scientific belief that Tharp and Heezen’s work showed to be wrong."},{"i":"47598085","c":"func","d":"M","s":"<u>Yawn contagion occurs when one individual yawns in response to another’s yawn.<\/u> Studies of this behavior in primates have focused on populations in captivity, but biologist Elisabetta Palagi and her colleagues have shown that it can occur in wild primate populations as well. In their study, which focused on a wild population of gelada monkeys (Theropithecus gelada) in Ethiopia, the researchers further reported that yawn contagion most commonly occurred in males and across different social groups instead of within a single social group.\n\nWhich choice best describes the function of the first sentence in the text as a whole?","o":["It defines a phenomenon that is discussed in the text.","It introduces a problem that is examined in the text.","It makes a claim that is challenged in the text.","It presents a hypothesis that is evaluated in the text."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the first sentence functions in the text as a whole. The first sentence introduces what yawn contagion is, explaining that it occurs when an individual yawns in response to the yawn of another individual. The text goes on to describe Elisabetta Palagi and her colleagues’ study of this phenomenon in a wild population of gelada monkeys. According to the text, the study showed that wild primate populations experience yawn contagion and that the behavior occurs most commonly in male monkeys and across social groups. Thus, the function of the first sentence is to define the phenomenon of yawn contagion that is discussed in the text. Choice B is incorrect. Although the first sentence introduces the text’s discussion of yawn contagion, it doesn’t present this behavior, or anything else, as a problem. Choice C is incorrect because the first sentence doesn’t present a claim but instead explains what yawn contagion is. Moreover, the text doesn’t challenge anything; it’s an informative text that describes the findings of a research study about yawning in wild primate populations. Choice D is incorrect. Although the text describes a scientific study, and most scientific studies are guided by a hypothesis, the text doesn’t say what Palagi and her colleagues’ hypothesis was; the text discusses their findings instead."},{"i":"2c50ed1a","c":"cross","d":"E","s":"Text 1 Literary scholars have struggled with the vastness of Nigerian writer Wole Soyinka’s collective works of drama (spanning over 20 plays in total). It is best, however, to understand Soyinka’s body of work as a dramatist chronologically. Soyinka’s progression as a playwright can be considered to fall into three periods, with each one representing a particular thematic and stylistic cohesion: the 1960s, the two decades between 1970 and 1990, and lastly, from roughly 1990 onwards.\n\nText 2 It is tempting to impose a linear sense of order on the expanse of Wole Soyinka’s body of work as a dramatist. However, critics who have considered Soyinka’s plays to fit neatly into three phases overlook potential commonalities in Soyinka’s work that span across these phases. Additionally, this view may discount significant differences in the styles and content of plays written around the same time.\n\nWhich choice best describes a difference in how the author of\n\nText 1 and the author of\n\nText 2 view the study of Soyinka’s works of drama?","o":["While the author of Text 1 believes that thinking about Soyinka’s works of theater in phases is useful, the author of Text 2 views such an approach as limiting.","Although the author of Text 1 claims that Soyinka’s style as a dramatist has evolved over time, the author of Text 2 argues that Soyinka’s style has remained consistent throughout his career.","The author of Text 1 considers Soyinka’s plays to showcase his strongest writing, whereas the author of Text 2 believes that Soyinka’s poetry is where he is most skilled.","The author of Text 1 argues that Soyinka’s early plays were his most politically charged, whereas the author of Text 2 claims that Soyinka’s most recent plays are the most politicized."],"a":0,"r":"Choice A is the best answer. The author of Text 1 states that Soyinka’s progression as a playwright can be considered to fall into three periods, implying that this is a helpful way to understand his works. The author of Text 2, on the other hand, challenges this view and says that it overlooks potential commonalities and differences in Soyinka’s work across what Text 1 calls distinctive stylistic phases. Choice B is incorrect. This choice overstates the central claim of Text 2. The author of Text 2 argues against the chronological progression supported in Text 1, but does not go so far as to say that Soyinka’s style remained consistent. In fact, Text 2 points out “significant differences in styles and content” among Soyinka’s plays. Choice C is incorrect. Neither of the texts mention Soyinka’s poetry, nor do they rank his dramatic writing relative to his other work. Choice D is incorrect. Neither text discusses the political aspects of Soyinka’s plays, nor do they make any claims about whether they have changed over time."},{"i":"6675c5c3","c":"main","d":"E","s":"The following text is from Shyam Selvadurai’s 1994 novel Funny Boy. The seven-year-old narrator lives with his family in Sri Lanka. Radha Aunty is the narrator’s aunt. Radha Aunty, who was the youngest in my father’s family, had left for America four years ago when I was three, and I could not remember what she looked like. I went into the corridor to look at the family photographs that were hung there. But all the pictures were old ones, taken when Radha Aunty was a baby or young girl. Try as I might, I couldn’t get an idea of what she looked like now. My imagination, however, was quick to fill in this void. ©1994 by Shyam Selvadurai.\n\nAccording to the text, why does the narrator consult some family photographs?","o":["He wants to use the photographs as inspiration for a story he is writing.","He is curious about how his father dressed a long time ago.","He hopes the photographs will help him recall what his aunt looked like.","He wants to remind his aunt of an event that is shown in an old photograph."],"a":2,"r":"Choice C is the best answer. The text states that the narrator couldn’t remember what his Radha Aunty looked like, so he went to look at the family photographs she was in. Choice A is incorrect. There’s no mention of any story that the narrator is writing. Rather, we’re told that the narrator couldn’t remember what his aunt looked like, so he went to look at the family photographs she was in. Choice B is incorrect. The text doesn’t mention how the narrator’s father dressed. Rather, we’re told that the narrator couldn’t remember what his aunt looked like, so he went to look at the family photographs she was in. Choice D is incorrect. The text doesn’t mention any events shown in the photographs. Rather, we’re told that the narrator couldn’t remember what his aunt looked like, so he went to look at the family photographs she was in."},{"i":"95146ebb","c":"main","d":"M","s":"The ice melted on a Norwegian mountain during a particularly warm summer in 2019, revealing a 1,700-year-old sandal to a mountaineer looking for artifacts. The sandal would normally have degraded quickly, but it was instead well preserved for centuries by the surrounding ice. According to archaeologist Espen Finstad and his team, the sandal, like those worn by imperial Romans, wouldn’t have offered any protection from the cold in the mountains, so some kind of insulation, like fabric or animal skin, would have needed to be worn on the feet with the sandal. What does the text indicate about the discovery of the sandal?","o":["Temperatures contributed to both protecting and revealing the sandal.","The discovery revealed that the Roman Empire had more influence on Norway than archaeologists previously assumed.","Archaeologists would have found the sandal eventually without help from the general public.","The sandal would have degraded if it hadn’t been removed from the ice."],"a":0,"r":"Choice A is the best answer. A \"particularly warm summer\" revealed the sandal, and centuries of ice kept it \"well preserved.\" Choice B is incorrect. This choice doesn’t reflect the information in the text. The sandal is similar to Roman sandals, but there is no indication that it was a result of Roman influence. Choice C is incorrect. The text doesn’t support this choice. We don’t have enough information to know whether or not archaeologists would have found the sandal without people like the treasure-hunting mountaineer. Choice D is incorrect. The text says the opposite of this choice. The sandal was preserved by the ice for centuries."},{"i":"5cd55c77","c":"infer","d":"H","s":"During their larval phase, numerous species of coral reef fish are drawn toward areas where light is present. To better understand how artificial light at night (ALAN) might affect some coral reef fish, researchers explored the effect of exposure to low levels of ALAN on the reproductive success of the common clownfish (Amphiprion ocellaris). While exposure to low levels of ALAN had no significant effect on spawning frequency and egg fertilization in A. ocellaris, incubation in the presence of ALAN completely inhibited hatching. These findings suggest that ______ Which choice most logically completes the text?","o":["A. ocellaris that settle in areas with low levels of ALAN have significantly higher rates of successful egg fertilization than A. ocellaris that settle in areas without ALAN do.","the reproductive success of A. ocellaris would be at risk if they were to selectively settle in regions that are regularly exposed to low levels of ALAN.","the reproductive success of A. ocellaris is more greatly affected by the presence of low levels of ALAN during incubation than the reproductive success of other species of coral reef fish is.","the spawning frequency of A. ocellaris was more strongly affected by the presence of low levels of ALAN than egg fertilization was, though both were less affected than incubation."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of artificial light at night (ALAN) and the common clownfish (A. ocellaris). The text indicates that researchers found that when A. ocellaris is exposed to low levels of ALAN, spawning frequency and egg fertilization aren’t significantly affected but hatching is completely inhibited—that is, the eggs never hatch. Therefore, if A. ocellaris were to settle only in regions where the fish would be regularly exposed to low levels of ALAN, their eggs would stop hatching and their reproductive success would be at risk. Choice A is incorrect because the text indicates that exposure to low levels of ALAN had no significant effect on egg fertilization for A. ocellaris, so there’s no reason to expect there would be any significant difference in rates of successful egg fertilization between areas with low levels of ALAN and areas without ALAN. Choice C is incorrect because the text doesn’t discuss the particular effects of low levels of ALAN on any species of coral reef fish besides A. ocellaris. For this reason, there’s no support in the text for the idea that the reproductive success of A. ocellaris is more greatly affected by the presence of low levels of ALAN than the reproductive success of other species of coral reef fish is. Choice D is incorrect. The text does indicate that A. ocellaris incubation was most strongly affected by low levels of ALAN, but it doesn’t indicate that there was a greater effect on spawning frequency than on egg fertilization; in fact, the text states that there was no significant effect on either."},{"i":"96d1c1fe","c":"infer","d":"H","s":"Tatiana R. Feuerborn and colleagues analyzed the genomes of more than a hundred domesticated dogs from sites in Siberia dating from 11,000 years ago to the present. They found that the dogs constituted a genetically isolated population of Arctic breeds until approximately 2,000 years ago, at which point there was substantial interbreeding with Near Eastern dog breeds. Furthermore, beginning around 2,000 years ago, some sites contain artifacts consistent with a Near East origin, like glass beads, but the people show no evidence of having traveled extensively outside Siberia. From this, Feuerborn and colleagues concluded that around 2,000 years ago ______ Which choice most logically completes the text?","o":["dogs and artifacts like glass beads began to be transported from the Near East to Siberia.","people from Siberia began to reach the Near East, where they acquired dogs and artifacts such as glass beads.","glass beads and other artifacts from the Near East began to be exchanged for dogs from Siberia.","dogs from the Near East began to be exchanged for glass beads and other artifacts from Siberia."],"a":0,"r":"Choice A is the best answer because it presents the conclusion that most logically follows from the text’s discussion of Feuerborn and colleagues’ findings about sites in Siberia. The text states that genomic analysis of many domesticated dogs from Siberian sites dating from the last 11,000 years revealed that the dogs represented a genetically isolated population of breeds (that is, they didn’t reproduce with dogs of any outside breeds) until about 2,000 years ago, when there is evidence that the dogs began interbreeding with breeds from the Near East. The text also indicates that around the same time, the sites began to contain glass beads and other artifacts seeming to be from the Near East, even though there is no evidence that the people of those sites traveled widely outside Siberia. Because there is evidence of Near East dog breeds and Near East artifacts at Siberian sites beginning about 2,000 years ago but no evidence of the people’s travel to the Near East around that time, it’s reasonable to infer that Feuerborn and colleagues concluded that dogs and artifacts like glass beads were transported to Siberia from the Near East, starting around 2,000 years ago. Choice B is incorrect because the text explicitly states that there is no evidence that the people of the Siberian sites 2,000 years ago traveled extensively beyond Siberia, which they would’ve had to do to reach the Near East; therefore, it wouldn’t make sense to conclude that the presence of Near East dog breeds and artifacts like glass beads suggests that people from Siberia began arriving in the Near East around 2,000 years ago. Choice C is incorrect because the text addresses the presence of Near East dog breeds (and evidence of interbreeding with Siberian dogs) and artifacts like glass beads at Siberian sites starting about 2,000 years ago, suggesting only that the dogs and artifacts started to arrive in Siberia around that time. The text doesn’t suggest the purpose of the arrival of the Near East dogs and artifacts or give any indication of Siberian dog breeds being transported elsewhere through trade. Choice D is incorrect because the text addresses the presence of Near East dog breeds and artifacts like glass beads at Siberian sites starting about 2,000 years ago, suggesting only that the dogs and artifacts started to arrive in Siberia around that time; it doesn’t suggest the purpose of this arrival and makes no mention of Siberian glass beads or other artifacts of Siberian origin."},{"i":"e1ee5f5c","c":"claim","d":"E","s":"Just Patty is a 1911 novel by Jean Webster. Patty and her friends have just been informed that they will no longer be roommates while at school. Patty talks to Mrs. Trent, the head of the school, about the situation. The narrator presents Patty as trying hard to convince Mrs. Trent to allow the group to continue sharing a room: ______ Which quotation from Just Patty most effectively illustrates the claim?","o":["“[Mrs. Trent’s] lips twitched. It was a fact, deplored by her assistants, that her sense of humour frequently ran away with her sense of justice.”","“[Mrs. Trent] nodded dismissal, and the three of them found themselves in the hall again. They looked at one another for a moment of blank silence.”","“Patty’s eyes suddenly brightened. She seized [her friends] by [the] elbow and shoved them into the empty schoolroom.”","“Patty did use all the diplomacy at her command. Having dwelt touchingly upon their long friendship, and their sorrow at being separated, she passed lightly to the matter of their new roommates.”"],"a":3,"r":"Choice D is the best answer because the quotation directly illustrates Patty trying hard to convince Mrs. Trent to allow the group to continue sharing a room. The phrase \"Patty did use all the diplomacy at her command\" explicitly shows her making a determined effort to be persuasive. The quotation further details Patty’s specific tactics: she \"dwelt touchingly upon their long friendship, and their sorrow at being separated.\" These details illustrate the claim by suggesting that Patty carefully crafted and delivered an emotional appeal to Mrs. Trent about the effects of changing the group’s rooming situation. Choice A is incorrect because although the quotation describes a reaction by Mrs. Trent, it does not reveal anything about the events or conversation that might have prompted this reaction. Instead of depicting Patty’s efforts to be persuasive during such a conversation, the quotation focuses on Mrs. Trent’s character traits; specifically, it describes the relationship between her \"sense of humour\" and her \"sense of justice.\" While the latter trait may be relevant to Patty’s situation, the quotation doesn’t show the extent of her efforts to convince Mrs. Trent to reconsider the change in rooming arrangements. Choice B is incorrect because this quotation describes the reaction of a group of three students immediately after an encounter with Mrs. Trent. It shows the outcome of an implied conversation but does not provide any evidence about the topic or nature of the conversation itself, and therefore does not illustrate Patty’s efforts during a conversation to convince Mrs. Trent to change her mind about the rooming situation. Choice C is incorrect because although this quotation suggests that Patty can be assertive (she abruptly grabbed her friends and \"shoved them into the empty schoolroom\"), it doesn’t show Patty asserting herself by trying to convince Mrs. Trent to reconsider the proposed rooming arrangements. The quotation doesn’t allude to Mrs. Trent or to Patty’s desire to continue sharing a room with a group of friends."},{"i":"a13541c0","c":"claim","d":"M","s":"Sandra Cisneros’s 1984 novella The House on Mango Street made a lasting impact on US literature. Its depiction of Mexican American culture inspired later authors to examine their own heritage within their fictional works. Also influential was the book’s portrayal of the main character, Esperanza, during a pivotal year of her youth. <u>This insightful depiction of a preteen girl encouraged authors who, like Cisneros herself, are Latina to use fictional works to examine experiences from their own youth.<\/u> Which statement, if true, would most strongly support the claim in the underlined sentence?","o":["In interviews, a number of Latina authors say that The House on Mango Street inspired them to write about their own adolescence in their novels.","In published writings, several prominent authors who are not Latina say that reading The House on Mango Street influenced their approach to writing fiction.","The House on Mango Street has sold over six million copies and is one of the most commonly read books among high school and university students in the US.","Since 1984, new novels about young Latina characters by Latina authors have often been compared to The House on Mango Street."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would most strongly support the claim in the underlined sentence. The text begins by explaining that the portrayal of Mexican American culture in Sandra Cisneros’s The House on Mango Street inspired later authors to explore their own heritage. Noting that Cisneros’s novella was also influential for its depiction of a formative year in a female character’s youth, the text then claims that this depiction inspired other Latina authors to use fiction to explore their own experiences of youth. Since this claim addresses how Cisneros encouraged Latina authors specifically to portray their youthful experiences, it would be directly supported by such authors stating that her novella influenced them to write about their own adolescence, or the transitional period between childhood and adulthood. Choice B is incorrect. The text states that with its portrayal of Mexican American culture, The House on Mango Street inspired later authors to explore their own heritage, and since this statement isn’t limited to only Latina authors, it can be inferred that authors who aren’t Latina were also likely influenced by the novella. But because the claim in the underlined sentence concerns the novella’s influence on Latina authors specifically, the finding that the book also influenced authors who weren’t Latina would fail to provide support for the claim. Choice C is incorrect because the finding that The House on Mango Street has sold millions of copies and is widely read among students in the US doesn’t relate directly to the text’s claim that the novella has influenced Latina authors specifically. Choice D is incorrect. While comparisons of new novels about young Latina characters by Latina authors to Cisneros’s The House on Mango Street would likely be founded on similarities between those novels and Cisneros’s novella, such similarities wouldn’t necessarily be evidence of the novella’s influence; such similarities might arise if Cisneros and younger Latina authors alike depicted certain basic cultural and historical features of their communities. Testimony from younger Latina authors about how The House on Mango Street had inspired them would be far more persuasive evidence of the novella’s influence."},{"i":"81498c6a","c":"graph","d":"E","s":"","o":["$31.78.","$23.72.","$22.98.","$28.94."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the text’s discussion of how much a grower could have expected to receive on average for a box of lemons in July 2021. The table lists the average prices received by US citrus growers in dollars per box for grapefruits, oranges, and lemons in June 2020, June 2021, July 2020, and July 2021. According to the table, the average price of a box of lemons in July 2021 was $31.78. Choice B is incorrect because the text indicates that the employee of a citrus grower wishes to know the average price for a box of lemons in July 2021. According to the table, $23.72 was the average price for a box of grapefruits in June 2021, not for a box of lemons in July 2021. Choice C is incorrect because the text indicates that the employee of a citrus grower wishes to know the average price for a box of lemons in July 2021. According to the table, $22.98 was the average price for a box of grapefruits in July 2021, not for a box of lemons in July 2021. Choice D is incorrect because the text indicates that the employee of a citrus grower wishes to know the average price for a box of lemons in July 2021. According to the table, $28.94 was the average price for a box of lemons in June 2021, not in July 2021."},{"i":"239d3535","c":"graph","d":"E","s":"","o":["Toronto","Montréal","Québec City","Halifax"],"a":1,"r":"Choice B is the best answer because the graph shows that Montréal had the largest population in 1891 among the four cities represented. According to the data points in the graph for the year 1891, Montréal’s population was approximately 220,000, which is greater than the respective populations of Toronto (approximately 180,000), Québec City (approximately 60,000), and Halifax (approximately 40,000). Choice A is incorrect because Toronto’s population in 1891 was approximately 180,000, which is the second largest among the four cities shown but still clearly smaller than Montréal’s population of approximately 220,000. Choice C is incorrect because Québec City had a population of approximately 60,000 in 1891, making it only the third largest of the four cities shown. Choice D is incorrect because Halifax had a population of approximately 40,000 people in 1891. Of the four cities shown in the graph, Halifax has the smallest population, not the largest."},{"i":"988c78eb","c":"fss","d":"E","s":"Former First Lady of the United States Eleanor Roosevelt and Indian activist and educator Hansa Mehta were instrumental in drafting the United Nations’ Universal Declaration of Human Rights, a document that ______ the basic freedoms to which all people are entitled.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have outlined","were outlining","outlines","outline"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb “outlines” agrees in number with the singular subject “document.” Choice A is incorrect because the plural verb “have outlined” doesn’t agree in number with the singular subject “document.” Choice B is incorrect because the plural verb “were outlining” doesn’t agree in number with the singular subject “document.” Choice D is incorrect because the plural verb “outline” doesn’t agree in number with the singular subject “document.”"},{"i":"e060dd6b","c":"fss","d":"H","s":"Recordings of electrical activity in the brain, ______ increased activity in brain areas associated with suppressing motor functions.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["electrograms show that while responding to hypothetical match scenarios, the most highly skilled soccer players have","the most highly skilled soccer players responding to hypothetical match scenarios have electrograms that show","responses to hypothetical match scenarios show that the most highly skilled soccer players have electrograms with","hypothetical match scenario responses show that the most highly skilled soccer players captured in electrograms have"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun “electrograms” the subject of the sentence and places it immediately after the modifying phrase “recordings of electrical activity in the brain.” In doing so, this choice clearly establishes that electrograms—and not other nouns or noun phrases in the sentence—are recordings of electrical activity in the brain. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “the most highly skilled soccer players” immediately after the modifying phrase illogically suggests that the players are recordings of electrical activity in the brain. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “responses to hypothetical match scenarios” immediately after the modifying phrase illogically suggests that these responses are recordings of electrical activity in the brain. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “hypothetical match scenario responses” immediately after the opening phrase illogically suggests that these responses are recordings of electrical activity in the brain."},{"i":"56770dda","c":"fss","d":"E","s":"In his 1963 exhibition Exposition of Music—Electronic Television, Korean American artist Nam June Paik showed how television images could be manipulated to express an artist’s perspective. Today, Paik ______ considered the first video artist.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["will be","had been","was","is"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the present tense verb \"is,\" used in conjunction with the word \"today,\" correctly indicates that Paik is currently considered the first video artist. Choice A is incorrect because the future tense verb \"will be\" doesn’t indicate that Paik is currently considered the first video artist. Choice B is incorrect because the past perfect tense verb \"had been\" doesn’t indicate that Paik is currently considered the first video artist. Choice C is incorrect because the past tense verb \"was\" doesn’t indicate that Paik is currently considered the first video artist."},{"i":"f2eaaf5d","c":"bound","d":"E","s":"At eight paragraphs long, the preamble to the constitution of ______ country in Western Asia—is much longer than the one-paragraph preamble to the United States Constitution.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Bahrain—a","Bahrain, a","Bahrain a","Bahrain: a"],"a":0,"r":"Choice A is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. The dash after “Bahrain” pairs with the dash after “Asia” to separate the supplementary element “a country in Western Asia” from the rest of the sentence. Choice B is incorrect because a comma can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice C is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence. Choice D is incorrect because a colon can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence."},{"i":"75eb5242","c":"bound","d":"E","s":"Many companies have simplified their products’ packaging designs in recent years, but ______ Researcher Lan Anh Nu Ton and her colleagues designed a research study to find out.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["consumers actually do prefer this simpler style.","do consumers actually prefer this simpler style?","do consumers actually prefer this simpler style.","consumers actually do prefer this simpler style?"],"a":1,"r":"Choice B is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a question mark to punctuate the interrogative clause “do consumers actually prefer this simpler style,” which asks a direct question at the end of the sentence. This is the question that the researchers in the next sentence were trying to investigate. Choice A is incorrect because the context requires an interrogative clause. The declarative clause “consumers actually do prefer this simpler style” incorrectly indicates the consumers’ preference was already known, whereas the researchers had yet to find this out. Choice C is incorrect because a period can’t be used in this way to punctuate an interrogative clause at the end of a sentence. Choice D is incorrect because a question mark can’t be used in this way to punctuate a declarative clause, such as “consumers actually do prefer this simpler style,” at the end of a sentence."},{"i":"b0620764","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Phobetor, a name drawn from Greek mythology, is an exoplanet that orbits the star PSR B1257+12, also known as Lich. Phobetor’s mass is 0.01 times that of Jupiter, or 0.01 Jupiter masses. Mastika, which means “gem” or “jewel” in Malay, is an exoplanet that orbits the star HD 179949, also known as Gumala. Mastika’s mass is 0.92 Jupiter masses. The student wants to make and support a generalization about exoplanets.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Exoplanets that are named Phobetor orbit Lich, and those that are named Mastika orbit Gumala.","Even though Phobetor and Mastika are both exoplanets, their masses are different: Phobetor’s mass is 0.01 Jupiter masses, and Mastika’s is 0.92 Jupiter masses.","Many stars have both a designation and a proper name; for instance, PSR B1257+12 is also known as Lich, and HD 179949 is also known as Gumala.","Exoplanet names have diverse origins, a fact that can be seen in the cases of Phobetor, a name drawn from Greek mythology, and Mastika, which means “gem” or “jewel” in Malay."],"a":3,"r":"Choice D is the best answer. The sentence makes and supports a generalization about exoplanets, noting that the names of exoplanets have diverse origins and supporting this with the examples of the origins of \"Phobetor\" and \"Mastika.\" Choice A is incorrect. The sentence misrepresents information from the notes, implying that there are multiple exoplanets with the same names. Additionally, the sentence provides no support for its generalization. Choice B is incorrect. The sentence contrasts the masses of two specific exoplanets; it doesn’t make and support a generalization about exoplanets. Choice C is incorrect. The sentence makes and supports a generalization about stars, not exoplanets."},{"i":"6c9df5d1","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Some powerful works of literature have so influenced readers that new legislation has been passed as a result. The Interesting Narrative of the Life of Olaudah Equiano (1789) is the autobiography of a man who endured slavery on both sides of the Atlantic. Equiano’s book contributed to the passage of the Slave Trade Act of 1807. The Jungle (1906) is a fictional work by Upton Sinclair that describes unsanitary conditions in US meatpacking plants. Sinclair’s book contributed to the passage of the Pure Food and Drug Act in 1906. The student wants to emphasize a difference between the two books.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Although both are powerful works of literature that contributed to new legislation, Equiano’s book is an autobiography, while Sinclair’s is fictional.","They may have written about different topics, but Equiano and Sinclair both influenced readers.","The 1807 Slave Trade Act resulted in part from a book by Equiano, while the 1906 Pure Food and Drug Act resulted in part from a book by Sinclair.","The Interesting Narrative of the Life of Olaudah Equiano and The Jungle are two works of literature that contributed to new legislation (concerning the slave trade and food safety, respectively)."],"a":0,"r":"Choice A is the best answer. This choice emphasizes a difference between the two books by using relevant information from the notes to contrast their genres. Choice B is incorrect. This choice mentions a difference between the books (their different topics), but it emphasizes a similarity between the books (their influence on readers). Choice C is incorrect. This choice provides information about the books that reflects both a similarity (both resulted in new laws) and a difference (the specific laws that resulted), without emphasizing either. Choice D is incorrect. This choice doesn’t emphasize a difference between the two books. Instead, it emphasizes a similarity."},{"i":"eea351c4","c":"trans","d":"M","s":"“Wishcycling”—putting nonrecyclable items into recycling bins under the mistaken belief that those items can be recycled—ultimately does more harm than good. Nonrecyclable items, such as greasy pizza boxes, can contaminate recyclable materials, rendering entire batches unusable. ______ nonrecyclable products can damage recycling plants’ machinery.\n\nWhich choice completes the text with the most logical transition?","o":["Fittingly,","On the contrary,","Moreover,","Nevertheless,"],"a":2,"r":"Choice C is the best answer. The first sentence tells us that “wishcycling” is harmful, the previous sentence gives us an example, and this sentence gives us another example. So “moreover”—a transition that indicates the addition of another supporting point—fits perfectly here. Choice A is incorrect. This choice uses a transition that means “appropriately” or “suitably,” which doesn’t make sense in context. This sentence adds another example of how “wishcycling” is harmful, so we’re looking for an addition transition. Choice B is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with the previous sentence. Both provide examples of how “wishcycling” is harmful. Choice D is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with the previous sentence. Both provide examples of how “wishcycling” is harmful."},{"i":"9502ec65","c":"trans","d":"H","s":"When soil becomes contaminated by toxic metals, it can be removed from the ground and disposed of in a landfill. ______ contaminated soil can be detoxified via phytoremediation: plants that can withstand high concentrations of metals absorb the pollutants and store them in their shoots, which are then cut off and safely disposed of, preserving the health of the plants.\n\nWhich choice completes the text with the most logical transition?","o":["Alternatively,","Specifically,","For example,","As a result,"],"a":0,"r":"Choice A is the best answer. “Alternatively” logically signals that the soil decontamination method described in this sentence—removing toxic metals from the soil via phytoremediation—offers an alternative to the previously described method (removing the contaminated soil from the ground). Choice B is incorrect because “specifically” illogically signals that the soil decontamination method described in this sentence specifies or elaborates on an aspect of the previously described method (removing the contaminated soil from the ground). Instead, phytoremediation is an alternative to that method. Choice C is incorrect because “for example” illogically signals that the soil decontamination method described in this sentence is an example of the previously described method (removing the contaminated soil from the ground). Instead, phytoremediation is an alternative to that method. Choice D is incorrect because “as a result” illogically signals that the soil decontamination method described in this sentence is a result or consequence of the previously described method (removing the contaminated soil from the ground). Instead, phytoremediation is an alternative to that method."},{"i":"911c7a87","c":"trans","d":"E","s":"After appropriate permissions are granted, a typical archaeological dig begins with a surveyor making a detailed grid of the excavation site. Then, the site is carefully dug, and any artifacts found are recorded and mapped onto the site grid. ______ the artifacts are removed, cataloged, and analyzed in a laboratory.\n\nWhich choice completes the text with the most logical transition?","o":["For instance,","On the contrary,","Earlier,","Finally,"],"a":3,"r":"Choice D is the best answer. \"Finally\" logically signals that the actions in this sentence—the removal, cataloging, and analysis of artifacts—are the next and final steps in a process, following the previous actions of surveying, digging, recording, and mapping. Choice A is incorrect because \"for instance\" illogically signals that the actions in this sentence are an example of the actions in the previous sentence. Instead, the removal, cataloging, and analysis of artifacts are the next and final steps in a process. Choice B is incorrect because \"on the contrary\" illogically signals that the actions in this sentence are directly opposed to the actions in the previous sentence. Instead, the removal, cataloging, and analysis of artifacts are the next and final steps in a process. Choice C is incorrect because \"earlier\" illogically signals that the actions in this sentence occur before the actions in the previous sentence. Instead, the removal, cataloging, and analysis of artifacts are the next and final steps in a process."}],"img":{"81498c6a":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEABAMAAACjdLjjAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA21klEQVR42u1dd0BTV/t+zs2AgJCT4MIBN8GNI4LWuoNo1bqiVautI3bYYW3RT39aay2uto7aaLV1trgVF7i3cdRRV8BdRYLbKuQGZZOc3x+AJozU+n1FS/P8oeSecc957nve+77vPQNwww033HDDDTfc+OdAoQJAHX47/F3wp5hHUME1AkIBKIqrqwOfn4eCON5CSfOvlm3sKXqJs13TA1scf+uAfHZi8y
