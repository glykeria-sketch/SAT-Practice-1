<script>
const D={"t":"SATPractice5","q":[{"i":"aaa3ee7c","c":"vocab","d":"H","s":"Critics have asserted that fine art and fashion rarely ______ in a world where artists create timeless works for exhibition and designers periodically produce new styles for the public to buy. Luiseño/Shoshone-Bannock beadwork artist and designer Jamie Okuma challenges this view: her work can be seen in the Metropolitan Museum of Art and purchased through her online boutique.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["prevail","succumb","diverge","intersect"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion about the relationship between fine art and fashion. As used in this context, “intersect” means to connect or overlap. The text indicates that Jamie Okuma challenges the position held by critics because her work can be seen at an art museum and can be bought by the public from her online boutique. The text also presents the critics’ view as being influenced by a perception that fine artists create works that are “timeless” and meant for exhibition, whereas fashion designers periodically produce new styles that are meant for purchase. This context suggests that the critics believe that fine art and fashion tend not to overlap—in other words, that they rarely intersect. Choice A is incorrect because it wouldn’t make sense in context to say that critics contend that fine art and fashion rarely “prevail,” or prove to be triumphant or widespread. The text indicates that Okuma is an example of an artist who demonstrates that it’s possible to make fine art that is also available to the public as fashion. Choice B is incorrect because it wouldn’t make sense in context to say that fine art and fashion rarely “succumb,” or surrender. The text establishes that unlike what critics believe, Okuma creates works that are in art museums and available for the public to purchase, suggesting that critics believe fine art and fashion rarely overlap, not that they rarely succumb. Choice C is incorrect because saying that critics believe that fine art and fashion rarely “diverge,” or disagree or move in different directions, wouldn’t make sense in context. The text presents Okuma’s work as both fine art and fashion, thereby undermining what the critics assert. This suggests that the critics believe that fine art and fashion rarely intersect rather than that the two rarely diverge."},{"i":"e8c26398","c":"vocab","d":"M","s":"To develop a method for measuring snow depth with laser beams, NASA physicist Yongxiang Hu relied on ______; identifying broad similarities between two seemingly different phenomena, Hu used information about how ants move inside colonies to calculate how the particles of light that make up laser beams travel through snow.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a collaboration","an accessory","a contradiction","an analogy"],"a":3,"r":"Choice D is the best answer. The text after the semicolon tells us that Hu \"identif[ied] broad similarities between two seemingly different phenomena,\" comparing ants with light particles. Since an analogy seeks similarities between seemingly unrelated phenomena, this fits the context perfectly. Choice A is incorrect. \"A collaboration\" refers to \"an act of working with others,\" but what comes after the semicolon doesn’t describe collaboration with other researchers. Instead, it shows a comparison between two different (but ultimately similar) scientific phenomena. Choice B is incorrect. \"An accessory\" can refer to \"something added to increase attractiveness or usefulness.\" No accessories are described in this text. Choice C is incorrect. \"A contradiction\" means \"a set of ideas or things that are opposed to or inconsistent with each other.\" The text describes how Hu used the similarity between ant and light particle movement to develop his method, so a word that refers to difference would not make sense here."},{"i":"a20b7511","c":"vocab","d":"E","s":"Scholars long thought that the initial spread of silk beyond China occurred in the second century CE, but this view has been ______ by new archaeological evidence from South Asia that reveals that the people of the Indus Civilization made use of silk at least 1,000 years earlier.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["investigated","misinterpreted","anticipated","contradicted"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the initial spread of silk beyond China. In this context, “contradicted” means opposed or challenged. The text indicates that new archaeological evidence about silk use in South Asia has done something to a long-held thought about the initial spread of silk. According to the text, the new evidence reveals that people used silk in South Asia 1,000 years before the second century CE, which directly challenges the previous belief that silk first spread beyond China in the second century CE. Choice A is incorrect because the text indicates that an archaeological finding about silk use has done something to a long-held thought about the initial spread of silk, and it wouldn’t make sense to suggest that the finding could have “investigated,” or examined, a belief; evidence can’t examine anything. Choice B is incorrect because the text indicates that an archaeological finding about silk use has done something to a long- held thought about the initial spread of silk, and it wouldn’t make sense to suggest that the finding could have “misinterpreted,” or incorrectly understood, a belief; evidence can’t try to understand anything. Choice C is incorrect. In this context, “anticipated” would mean expected or predicted. The text indicates that a new archaeological finding about silk use has done something to a long-held thought about the initial spread of silk, and a new finding can’t predict a belief that is already established."},{"i":"b940952c","c":"vocab","d":"E","s":"On the basis of extensive calculations and models, astronomers in the 1990s predicted that the collision of two neutron stars or a neutron star and a black hole could release a massive burst of gamma rays in an event called a kilonova. This ______ was confirmed with observations in 2017.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["theory","evidence","constant","experiment"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of a prediction about a kilonova. In this context, a \"theory\" is an explanation that is considered scientifically acceptable. The text states that astronomers predicted in the 1990s that a collision between a black hole and a neutron star or between two neutron stars could release a massive gamma ray burst called a kilonova, explaining that they determined this possibility based on their extensive work with existing data and simulations (\"calculations and models\"). In other words, the prediction was a theory—a well-supported explanation—that, as the text indicates, was later confirmed with observations in 2017. Choice B is incorrect because the text indicates that it is the prediction made by astronomers in the 1990s that was confirmed in 2017, and a prediction of an event isn’t \"evidence,\" or proof, of that event’s existence, even when the prediction is based on extensive study. Further, there would be no need for later confirmation of something that was already recognized as evidence. Choice C is incorrect because in this context, a \"constant\" is a situation or factor that doesn’t change. The text indicates that it is the prediction made by astronomers in the 1990s that was confirmed in 2017, and there is no reason to describe the prediction as a constant because the text doesn’t suggest that the prediction was completely unchanged over time—it addresses only the making of the prediction and its later confirmation. Choice D is incorrect because the text indicates that it is the prediction made by astronomers in the 1990s that was confirmed in 2017; although a prediction might be informed by an \"experiment,\" or a controlled test, a prediction is an idea rather than a test."},{"i":"4eee64fa","c":"purpose","d":"H","s":"Space scientists Anna-Lisa Paul, Stephen M. Elardo, and Robert Ferl planted seeds of Arabidopsis thaliana in samples of lunar regolith—the surface material of the Moon—and, serving as a control group, in terrestrial soil. They found that while all the seeds germinated, the roots of the regolith-grown plants were stunted compared with those in the control group. Moreover, unlike the plants in the control group, the regolith-grown plants exhibited red pigmentation, reduced leaf size, and inhibited growth rates—indicators of stress that were corroborated by postharvest molecular analysis.\n\nWhich choice best states the main purpose of the text?","o":["It describes an experiment that addressed an unresolved question about the extent to which lunar regolith resembles terrestrial soils.","It compares two distinct methods of assessing indicators of stress in plants grown in a simulated lunar environment.","It presents evidence in support of the hypothesis that seed germination in lunar habitats is an unattainable goal.","It discusses the findings of a study that evaluated the effects of exposing a plant species to lunar soil conditions."],"a":3,"r":"Choice D is the best answer. The text describes an experiment wherein space scientists compared plant growth in terrestrial and lunar soil conditions. It then discusses the findings of the study, including the fact that all the seeds germinated but that the plants grown in lunar soil exhibited signs of stress. Choice A is incorrect. The text doesn’t address this question, and never describes any specific characteristics of either soil. It merely describes the outcome of an experiment that exposed a plant species to lunar soil conditions. Choice B is incorrect. The text never compares methods of assessing indicators of stress—instead, it simply mentions several stress indicators observed in the study (red pigmentation, reduced leaf size, and inhibited growth rates). Choice C is incorrect. The text doesn’t present any evidence that we could never achieve seed germination in lunar habitats, and in fact states that the seeds in the lunar soil did germinate."},{"i":"d4732483","c":"purpose","d":"H","s":"Studying late nineteenth- and early twentieth-century artifacts from an agricultural and domestic site in Texas, archaeologist Ayana O. Flewellen found that Black women employed as farm workers utilized hook-and-eye closures to fasten their clothes at the waist, giving themselves a silhouette similar to the one that was popular in contemporary fashion and typically achieved through more restrictive garments such as corsets. Flewellen argues that this sartorial practice shows that these women balanced hegemonic ideals of femininity with the requirements of their physically demanding occupation.\n\nWhich choice best states the main purpose of the text?","o":["To describe an unexpected discovery that altered a researcher’s view of how rapidly fashions among Black female farmworkers in late nineteenth- and early twentieth-century Texas changed during the period","To discuss research that investigated the ways in which Black female farmworkers in late nineteenth- and early twentieth-century Texas used fashion practices to resist traditional gender ideals","To evaluate a scholarly work that offers explanations for the impact of urban fashion ideals on Black female farmworkers in late nineteenth- and early twentieth-century Texas","To summarize the findings of a study that explored factors influencing a fashion practice among Black female farmworkers in late nineteenth- and early twentieth-century Texas"],"a":3,"r":"Choice D is the best answer. The text provides an overview of a scholarly work discussing the fashion practices of Black female farmworkers in late 19th- and early 20th-century Texas, and how these practices were influenced by both the fashion ideals of the time and the demands of farmwork. Choice A is incorrect. The text never discusses the rate of fashion change among Black female farmworkers. The text also never categorizes Flewellen’s findings as \"unexpected.\" Choice B is incorrect. The text actually explains that Black female farmworkers were trying to achieve traditional feminine ideals, not resist them. Choice C is incorrect. The text doesn’t evaluate a scholarly work but rather simply describes it. Furthermore, the text is focused on \"agricultural and domestic\" fashion, not urban fashion as this choice suggests."},{"i":"236fee8e","c":"func","d":"M","s":"Archeological excavation of Market Street Chinatown, a nineteenth-century Chinese American community in San Jose, California, provided the first evidence that Asian food products were imported to the United States in the 1800s: bones from a freshwater fish species native to Southeast Asia. <u>Jinshanzhuang—Hong Kong–based import/export firms—likely coordinated the fish’s transport from Chinese-operated fisheries in Vietnam and Malaysia to North American markets.<\/u> This route reveals the (often overlooked) multinational dimensions of the trade networks linking Chinese diaspora communities.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It explains why efforts to determine the country of origin of the items mentioned in the previous sentence remain inconclusive.","It provides information that helps support a claim about a discovery’s significance that is presented in the following sentence.","It traces the steps that were taken to locate and recover the objects that are described in the previous sentence.","It outlines a hypothesis that additional evidence discussed in the following sentence casts some doubt on."],"a":1,"r":"Choice B is the best answer. The underlined sentence provides information about import/export firms, showing how Chinese communities across the world were connected by trade routes. Choice A is incorrect. The underlined sentence never suggests that the countries of origin of the fish are in question—in fact, it tells us exactly where they came from. Choice C is incorrect. The passage never describes the steps taken to discover the fish bones described in the previous sentence. Choice D is incorrect. The underlined sentence doesn’t outline a hypothesis but instead provides evidence. And the following sentence agrees with the underlined sentence, so we could eliminate this choice just for saying that the following sentence \"casts some doubt on\" the underlined one—partly wrong is all wrong."},{"i":"39857700","c":"func","d":"H","s":"The following text is from Edith Wharton’s 1905 novel The House of Mirth. Lily Bart and a companion are walking through a park. Lily had no real intimacy with nature, but she had a passion for the appropriate and could be keenly sensitive to a scene which was the fitting background of her own sensations. <u>The landscape outspread below her seemed an enlargement of her present mood, and she found something of herself in its calmness, its breadth, its long free reaches.<\/u> On the nearer slopes the sugar-maples wavered like pyres of light; lower down was a massing of grey orchards, and here and there the lingering green of an oak-grove.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It creates a detailed image of the physical setting of the scene.","It establishes that a character is experiencing an internal conflict.","It makes an assertion that the next sentence then expands on.","It illustrates an idea that is introduced in the previous sentence."],"a":3,"r":"Choice D is the best answer because it best describes how the underlined sentence functions in the text as a whole. The first sentence of the text establishes that Lily can be “keenly sensitive to” scenes that serve as a “fitting background” for her feelings—that is, she’s very aware of when a setting seems to reflect her mood. The next sentence, which is underlined, then demonstrates this awareness: Lily views the landscape she’s in as a large-scale reflection of her current mood, identifying with elements such as its calmness. Thus, the function of the underlined sentence is to illustrate an idea introduced in the previous sentence. Choice A is incorrect because the underlined sentence describes the scene only in very general terms, referring to its calmness, breadth, and long stretches of land. It’s the next sentence that adds specific details about colors, light, and various trees nearby. Choice B is incorrect because nothing in the underlined sentence suggests that Lily is experiencing an internal conflict. In fact, the sentence indicates that Lily thinks the landscape reflects her own feeling of calmness. Choice C is incorrect because the only assertion in the underlined sentence is that Lily feels that broad aspects of the landscape, such as its calmness, reflect her current mood, and that assertion isn’t expanded on in the next sentence. Instead, the next sentence describes specific details of the scene without connecting them to Lily’s feelings."},{"i":"34d7bb25","c":"structure","d":"H","s":"According to Indian economist and sociologist Radhakamal Mukerjee (1889–1968), the Eurocentric concepts that informed early twentieth- century social scientific methods—for example, the idea that all social relations are reducible to struggles between individuals—had little relevance for India. Making the social sciences more responsive to Indians’ needs, Mukerjee argued, required constructing analytical categories informed by India’s cultural and ecological circumstances. Mukerjee thus proposed the communalist “Indian village” as the ideal model on which to base Indian economic and social policy.\n\nWhich choice best describes the overall structure of the text?","o":["The text recounts Mukerjee’s early training in the social scientific disciplines and then lists social policies whose implementation Mukerjee oversaw.","The text mentions some of Mukerjee’s economic theories and then traces their impact on other Indian social scientists of the twentieth century.","The text presents Mukerjee’s critique of the social sciences and then provides an example of his attempts to address issues he identified in his critique.","The text explains an influential economic theory and then demonstrates how that theory was more important to Mukerjee’s work than other social scientists have acknowledged."],"a":2,"r":"Choice C is the best answer. The text does indeed present Mukerjee’s critique of the social sciences—that they were too Eurocentric—and then provides an example of how he attempted to address the issues he identified: by suggesting a social science model based on the Indian village. Choice A is incorrect. The text doesn’t discuss Mukerjee’s early training or his oversight of the implementation of social policies at all. Choice B is incorrect. The text never discusses any other Indian social scientists. Choice D is incorrect. The text never mentions other social scientists’ responses to Mukerjee’s work."},{"i":"6a1dc7c5","c":"cross","d":"H","s":"Text 1 Virginia Woolf’s 1928 novel Orlando is an oddity within her body of work. Her other major novels consist mainly of scenes of everyday life and describe their characters’ interior states in great detail, whereas Orlando propels itself through a series of fantastical events and considers its characters’ psychology more superficially. Woolf herself sometimes regarded the novel as a minor work, even admitting once that she “began it as a joke.”\n\nText 2 Like Woolf’s other great novels, Orlando portrays how people’s memories inform their experience of the present. Like those works, it examines how people navigate social interactions shaped by gender and social class. Though it is lighter in tone—more entertaining, even—this literary “joke” nonetheless engages seriously with the themes that motivated the four or five other novels by Woolf that have achieved the status of literary classics.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the assessment of Orlando presented in\n\nText 1?","o":["By conceding that Woolf’s talents were best suited to serious novels but asserting that the humor in Orlando is often effective","By agreeing that Orlando is less impressive than certain other novels by Woolf but arguing that it should still be regarded as a classic","By acknowledging that Orlando clearly differs from Woolf’s other major novels but insisting on its centrality to her body of work nonetheless","By concurring that the reputation of Orlando as a minor work has led readers to overlook this novel but maintaining that the reputation is unearned"],"a":2,"r":"Choice C is the best answer because it reflects how the author of Text 2 would most likely respond to the assessment of Orlando in Text 1. Both authors agree that Orlando is unusual for Woolf: Text 1 states that the novel examines its characters’ psychologies more superficially than Woolf’s other novels do, and Text 2 describes it as being lighter in tone. However, while Text 1 calls Orlando an “oddity” and mentions that Woolf “began it as a joke,”Text 2 asserts that Orlando engages the same themes as Woolf’s other great novels. Hence, the author of Text 2 would most likely accept that Orlando differs from Woolf’s other novels but would also insist on its importance in the context of Woolf’s work as a writer. Choice A is incorrect. Text 2 does suggest that the humor in Orlando is effective. However, there’s nothing in Text 2 to suggest that the author would agree that Woolf’s talents were best suited to serious novels. Rather, the author of Text 2 compares Orlando favorably to other novels by Woolf that are implied to be darker in tone. Choice B is incorrect because the author of Text 2 does not indicate that Orlando is less impressive than Woolf’s other novels, but instead points out that it engages the same themes as other novels by Woolf that are considered classics. Choice D is incorrect because there’s nothing in Text 1 or Text 2 to suggest that readers have generally ignored Orlando because of its reputation."},{"i":"6540a976","c":"main","d":"M","s":"To understand how Paleolithic artists navigated dark caves, archaeologist Mª Ángeles Medina-Alcaide and her team tested different lighting methods in a cave in Spain using replicas of artifacts found in European caves with art. They used three different Paleolithic light sources— torches, animal-fat lamps, and fireplaces—determining that each likely had a specific purpose. For instance, the team learned that the animal-fat lamps were less useful than torches while walking because the lamps didn’t illuminate the cave floor.\n\nWhich choice best states the main idea of the text?","o":["Medina-Alcaide and her team’s study demonstrated that fireplaces were essential to the creators of Paleolithic cave art.","Medina-Alcaide and her team discovered that Paleolithic cave artists in Spain used animal-fat lamps more often than they used torches.","Medina-Alcaide and her team were reluctant to draw many conclusions from their study because of the difficulty they had replicating light sources based on known artifacts.","Medina-Alcaide and her team tested Paleolithic light sources and learned some details about how Paleolithic artists traveled within dark caves."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text indicates that archaeologist Mª Ángeles Medina-Alcaide and her team used replicas of Paleolithic light sources to understand how Paleolithic artists moved through dark caves. The researchers learned, for example, that torches were more helpful for moving through caves than animal-fat lamps were. Thus, the main idea of the text is that Medina-Alcaide and her team tested Paleolithic light sources and learned some details about how Paleolithic artists traveled within dark caves. Choice A is incorrect because the text doesn’t address the usefulness of fireplaces for Paleolithic cave artists; it only mentions fireplaces briefly as one of the three lighting methods the researchers tested. Choice B is incorrect because the text doesn’t discuss how often Paleolithic cave artists used each kind of light source tested. Although the text does compare animal-fat lamps with another lighting method, the point of that comparison is that animal-fat lamps were less useful than torches when walking, not that one method was used more often than another. Choice C is incorrect because the text doesn’t discuss either how difficult it was for Medina-Alcaide and her team to replicate light sources or how the team felt about drawing conclusions from their study. Instead, the text reveals that the team was able to conclude that each light source likely had a distinct purpose."},{"i":"e677fa6c","c":"main","d":"M","s":"The following text is adapted from Edgar Allan Poe’s 1849 story “Landor’s Cottage.” During a pedestrian trip last summer, through one or two of the river counties of New York, I found myself, as the day declined, somewhat embarrassed about the road I was pursuing. The land undulated very remarkably; and my path, for the last hour, had wound about and about so confusedly, in its effort to keep in the valleys, that I no longer knew in what direction lay the sweet village of B——, where I had determined to stop for the night.\n\nWhich choice best states the main idea of the text?","o":["The narrator remembers a trip he took and admits to getting lost.","The narrator recalls fond memories of a journey that he took through some beautiful river counties.","The narrator describes what he saw during a long trip through a frequently visited location.","The narrator explains the difficulties he encountered on a trip and how he overcame them."],"a":0,"r":"Choice A is the best answer. The narrator is “embarrassed” about the route he took, which ends up leaving him lost and confused about how to get to his destination for the evening. Choice B is incorrect. This choice doesn’t match the passage. The narrator is embarrassed, rather than fond, and he doesn’t describe the beauty of the place. Choice C is incorrect. This choice doesn’t match the passage. We don’t know from this excerpt whether or not the narrator has visited this part of New York multiple times. Choice D is incorrect. This choice doesn’t match the passage. The narrator doesn’t explain how he overcame being lost in this excerpt."},{"i":"1d0b5bf4","c":"infer","d":"E","s":"To create the poems in her 2017 collection One Last Word, poet Nikki Grimes used a writing method called the golden shovel. This method often involves choosing a line from an existing poem and then using each word from that line as the last word of each line in a new poem. Grimes wanted the poems in One Last Word to honor important Black poets of the past, so she chose lines by poets such as Langston Hughes and Georgia Douglas Johnson. Writing in this way can be challenging and might seem as though it would produce awkward poems. However, reviewers praised One Last Word as a beautiful and powerful tribute to the poets who inspired it. This reaction suggests that ______ Which choice most logically completes the text?","o":["most reviewers didn’t understand Grimes’s goal for One Last Word.","Grimes successfully used the golden shovel method to achieve her goal for One Last Word.","Langston Hughes and Georgia Douglas Johnson are two of Grimes’s favorite poets.","Grimes inspired many other writers to create poems using the golden shovel method."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Nikki Grimes’s poetry collection One Last Word. The text explains that Grimes used a writing method called the golden shovel to create the poems in her book. According to the text, the method involves basing a new poem on a line from an existing poem. The text then mentions Langston Hughes and Georgia Douglas Johnson as examples of important Black poets whose lines of poetry form the basis of Grimes’s poems. The text goes on to say that this writing method is difficult and that the resulting poems can be awkward, but reviewers have positively reviewed Grimes’s book. If the reviewers of One Last Word specifically note that the work is a “beautiful and powerful tribute to the poets who inspired it,” then they must have appreciated how Grimes used the golden shovel method to pay tribute to other poets. This suggests that Grimes was successful in using the golden shovel method to achieve her goal of honoring Black poets in her book. Choice A is incorrect because the reaction suggests that most reviewers did understand Grimes’s goal for her book. According to the text, the reviewers noted that the poems in her book were a “beautiful and powerful tribute to the poets who inspired it.” Earlier, the text claims that Grimes intended the poems “to honor important Black poets of the past,” so in their praise of her book, the reviewers clearly indicated that they understood Grimes’s goal. Choice C is incorrect. Although it’s likely that Grimes sought to honor Hughes and Johnson in her book of poetry because they’re among her favorite poets, this fact isn’t suggested by the reviewers’ positive reaction to her book. Instead, the reaction suggests that Grimes was successful in her use of the golden shovel method. Choice D is incorrect because the text doesn’t discuss whether other writers were inspired by Grimes to use the golden shovel method in their poetry. The text mentions the poets Hughes and Johnson as examples of poets honored in Grimes’s book and describes reviewers’ positive reception of her book, but it doesn’t detail Grimes’s impact on other writers."},{"i":"e9521fd1","c":"infer","d":"H","s":"The Uto-Aztecan language family is divided into a northern branch, which includes the Shoshone language of present-day Idaho and Utah, and a southern one, whose best-known representative is Nahuatl, the language of the Aztec Empire in Mexico. Lexical similarities across the family, including of botanical terms, confirm descent from a single language spoken millennia ago, and the family’s geographical distribution suggests an origin in what is now the US Southwest. However, vocabulary pertaining to maize isn’t shared between northern and southern branches, despite the crop’s universal cultivation among Uto-Aztecan tribes. Given archaeological evidence that maize originated in Mexico and diffused northward into what became the US Southwest, some linguists reason that ______ Which choice most logically completes the text?","o":["northern Uto-Aztecan tribes likely obtained the crop directly from a southern Uto-Aztecan tribe rather than from a non-Uto-Aztecan tribe.","variation in maize-related vocabulary within each branch of the Uto-Aztecan family likely reflects regionally specific methods for cultivating the crop.","southern Uto-Aztecan tribes likely acquired maize at roughly the same time as northern Uto-Aztecan tribes did, though from different sources.","the family’s division into northern and southern branches likely preceded the acquisition of the crop by the Uto-Aztecan tribes."],"a":3,"r":"Choice D is the best answer because it most logically completes the discussion of Uto-Aztecan languages. The text explains that the northern and southern branches of the Uto-Aztecan language family descended from a single language (believed to have originated in what is now the US Southwest), resulting in similarities across the family’s languages; however, the branches don’t have similar vocabulary for maize, even though maize has been cultivated by all Uto-Aztecan tribes. The text also indicates that maize originated in Mexico and spread northward into what is now the US Southwest—the area where the Uto-Aztecan language family originated. It follows, then, that the language family had already divided into northern and southern branches before maize reached that area; if maize had been present before the division occurred, the family’s origin language would have had terminology for it that likely would have been reflected in the branches, meaning they would have had similar vocabulary for maize. If maize arrived after the division occurred, however, the tribes in the two regions likely would have developed vocabulary pertaining to maize separately, at the times when they acquired the crop. Choice A is incorrect because the text focuses on vocabulary pertaining to maize in the branches of the Uto-Aztecan language family, and referring only to how some Uto-Aztecan tribes obtained maize wouldn’t directly address the role of language. Moreover, if northern Uto-Aztecan tribes had acquired maize from a southern Uto-Aztecan tribe, it’s reasonable to assume that the northern tribes might have also picked up southern Uto-Aztecan terminology for maize in that exchange. Choice B is incorrect because the text discusses the fact that the northern and southern branches of the Uto-Aztecan language family don’t have shared vocabulary pertaining to maize, not the idea that there are variations in such vocabulary within each branch—that is, the text focuses on differences between the two branches, not on differences between languages within a branch. Choice C is incorrect because the text focuses on vocabulary pertaining to maize in the branches of the Uto-Aztecan language family, and referring only to the timing and source of maize acquisition wouldn’t directly address the role of language. Furthermore, the text implies that southern Uto-Aztecan tribes probably acquired maize before the northern tribes did, given the evidence that maize originated in Mexico—the location of the best-known representative of the southern branch of the Uto-Aztecan language family—before spreading to the north."},{"i":"37e15265","c":"claim","d":"H","s":"“The Young Girl” is a 1920 short story by Katherine Mansfield. In the story, the narrator takes an unnamed seventeen-year-old girl and her younger brother out for a meal. In describing the teenager, Mansfield frequently contrasts the character’s pleasant appearance with her unpleasant attitude, as when Mansfield writes of the teenager, ______ Which quotation from “The Young Girl” most effectively illustrates the claim?","o":["“I heard her murmur, ‘I can’t bear flowers on a table.’ They had evidently been giving her intense pain, for she positively closed her eyes as I moved them away.”","“While we waited she took out a little, gold powder-box with a mirror in the lid, shook the poor little puff as though she loathed it, and dabbed her lovely nose.”","“I saw, after that, she couldn’t stand this place a moment longer, and, indeed, she jumped up and turned away while I went through the vulgar act of paying for the tea.”","“She didn’t even take her gloves off. She lowered her eyes and drummed on the table. When a faint violin sounded she winced and bit her lip again. Silence.”"],"a":1,"r":"Choice B is the best answer because it most effectively illustrates the claim in the text that in describing the teenaged girl, Mansfield contrasts the character’s pleasant appearance with her unpleasant attitude. In the quotation, Mansfield describes the teenager as having a “lovely nose” (a compliment about her appearance) but also as treating her makeup puff “as though she loathed it” (a judgment suggesting her unpleasant attitude). Choice A is incorrect because the teenager′s reaction to the flowers doesn’t make it clear that she has an unpleasant attitude, and nothing in the quotation indicates that any part of her appearance is pleasant. Choice C is incorrect because the quotation suggests that the teenager has an unpleasant attitude (being upset with the location and leaving the table before the narrator has paid for the meal) but doesn’t give any indication that she has a pleasant appearance. Choice D is incorrect because the quotation suggests that the teenager may have an unpleasant attitude (lowering her eyes, wincing, and sitting in silence) but doesn’t give any indication that any part of her appearance is pleasant."},{"i":"29cde5fa","c":"claim","d":"M","s":"“Mr. Cornelius Johnson, Office-Seeker” is a 1900 short story by Paul Laurence Dunbar. In the story, the narrator describes Mr. Cornelius Johnson’s appearance as conveying his exaggerated sense of his importance: ______ Which quotation from “Mr. Cornelius Johnson, Office-Seeker” most effectively illustrates the claim?","o":["“He carried himself always as if he were passing under his own triumphal arch.”","“The grey Prince Albert was scrupulously buttoned about his form, and a shiny top hat replaced the felt of the afternoon.”","“It was a beautiful day in balmy May and the sun shone pleasantly on Mr. Cornelius Johnson’s very spruce Prince Albert suit of grey as he alighted from the train in Washington.”","“Mr. Cornelius Johnson always spoke in a large and important tone.”"],"a":0,"r":"Choice A is the best answer. This quote most effectively illustrates the claim. The claim is that the narrator describes Mr. Johnson as arrogant and self-important. This basically says that Mr. Johnson always looks like he’s congratulating himself for something, which definitely supports the idea that Mr. Johnson is arrogant! . Choice B is incorrect. This quote doesn’t illustrate the claim. The claim is that the narrator describes Mr. Johnson’s appearance as conveying his arrogance. This describes his appearance, but the description doesn’t suggest a sense of arrogance. Choice C is incorrect. This quote doesn’t illustrate the claim. The claim is that the narrator describes Mr. Johnson’s appearance as conveying his arrogance. This doesn’t describe Mr. Johnson’s appearance very much, and it doesn’t suggest a sense of arrogance. Choice D is incorrect. This quote doesn’t effectively illustrate the claim. It describes Mr. Johnson’s tone of voice as “large and important,” but it doesn’t describe his appearance as conveying a sense of self- importance."},{"i":"d83c3d54","c":"graph","d":"M","s":"","o":["The lowest amount of grass cover was approximately 58,000 square meters, and the highest amount of forest cover was approximately 75,000 square meters.","There was more grass cover than forest cover in 1987, and this difference increased dramatically in 1993 and again in 2006.","There was less grass cover than bare soil in 1987 but more grass cover than bare soil in 1993 and 2006, whereas there was more forest cover than bare soil in all three years.","Grass cover increased from 1987 to 1993 and from 1993 to 2006, whereas forest cover decreased in those periods."],"a":3,"r":"Choice D is the best answer because it describes data from the graph that support Martinez and colleagues’ conclusion that the Jordanelle Dam led to changes that benefited grass plants but not trees. The graph shows characteristics of the banks of the Provo River downstream of the Jordanelle Dam in three different years—1987, 1993, and 2006. Specifically, the graph shows the amount of grass cover, bare soil, and forest cover in those years. The text indicates that the Jordanelle Dam was built in 1992, meaning that the data from the graph for 1987 reflect conditions before the dam was built, whereas the data for 1993 and 2006 reflect conditions after the dam was built. The data show that grass cover increased substantially from 1987 to 1993 and again from 1993 to 2006. The data also show that forest cover declined over those periods. Together, these data support Martinez and colleagues’ conclusion that the dam was beneficial for grass plants but not for trees—grass cover increased significantly after the dam was built, while forest cover declined. Choice A is incorrect. Although it is true that, in the graph, the lowest value for grass cover is approximately 58,000 square meters and the highest value for forest cover is approximately 75,000 square meters, both values are from 1987, before the Jordanelle Dam was built in 1992. Therefore, this information alone cannot support Martinez and colleagues’ conclusion about changes in grass and tree cover following the construction of the dam. Choice B is incorrect because it presents an inaccurate description of data from the graph. The graph shows that there was more forest cover than grass cover in 1987, not that there was more grass cover than forest cover that year. Choice C is incorrect because, while it accurately reflects data from the graph when it compares grass cover and forest cover to bare soil, these data alone cannot support Martinez and colleagues’ conclusion that the dam led to changes that benefited grass plants but not trees. An increase in grass cover relative to bare soil following the construction of the dam might indicate that the dam benefited grass plants, but the fact that there was more forest cover than bare soil in all three years doesn’t indicate that the dam failed to benefit trees."},{"i":"dd349efc","c":"graph","d":"M","s":"","o":["47% of participants believe that it is somewhat or very likely that a robot could work effectively as a teacher, but 37% of respondents believe that it is somewhat or very unlikely that a robot could do so.","9% of participants were neutral about whether a robot could work effectively as a television news anchor, which is the same percent of participants who were neutral when asked about a robot working as a surgeon.","82% of participants believe that it is somewhat or very likely that a robot could work effectively as a tour guide, but only 16% believe that it is somewhat or very likely that a robot could work as a surgeon.","62% of participants believe that it is somewhat or very unlikely that a robot could work effectively as a firefighter."],"a":2,"r":"Choice C is the best answer because it effectively uses data from the table to complete the example of variations in participants’ evaluations. The table shows participants’ evaluations of the likelihood that robots could work effectively in different occupations. The text asserts that participants’ evaluations varied widely depending on the occupation being considered and introduces an example supporting that assertion. The data from the table showing that 82% of participants believe that it is somewhat or very likely that a robot could work effectively as a tour guide but only 16% of participants believe that it is somewhat or very likely that a robot could work effectively as a surgeon illustrate this assertion: those data show participants’ views changing substantially with the occupation being considered. Choice A is incorrect because it does not describe data that illustrate the assertion that participants’ evaluations varied widely depending on which occupation was being considered. Although this choice accurately describes data in the table, data about participants’ responses when considering a single occupation—teaching—could not be an example of people’s views changing substantially depending on the occupation being considered. Choice B is incorrect because it identifies a similarity in participants’ responses when considering two different occupations, but the assertion that the example is intended to illustrate is that participants’ evaluations varied widely depending on the occupation being considered. Although this choice accurately describes data in the table, those data do not illustrate the assertion in the text. Choice D is incorrect because it does not describe data that illustrate the assertion that participants’ evaluations varied widely depending on which occupation was being considered. Although this choice accurately describes data in the table, data showing participants’ evaluation of just one occupation could not be an example of participants’ evaluations changing depending on the occupation under evaluation."},{"i":"872a002e","c":"fss","d":"H","s":"The present-day city of Dushanbe, Tajikistan, was for years the capital of the Tajik Autonomous Soviet Socialist Republic, one of many nominally autonomous republics within the Soviet Union. Like ______ peer autonomous Soviet socialist republics, the Tajik Republic was established along ethnolinguistic lines: most of the republic’s residents spoke Persian.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["their","they’re","its","it’s"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of possessive determiners. The singular possessive determiner \"its\" agrees in number with the singular subject \"the Tajik Republic\" and thus indicates that the other republics were its peers. Choice A is incorrect because the plural possessive determiner \"their\" doesn’t agree in number with the singular subject \"the Tajik Republic.\" Choice B is incorrect because \"they’re\" is the contraction for \"they are,\" not a possessive determiner. Choice D is incorrect because \"it’s\" is the contraction for \"it is\" or \"it has,\" not a possessive determiner."},{"i":"166efaa2","c":"fss","d":"E","s":"Public-awareness campaigns about the need to reduce single-use plastics can be successful, says researcher Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent reduction in plastic-bag use after cashiers were instructed to ask customers whether ______ wanted a bag.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["they","one","you","it"],"a":0,"r":"Choice A is the best answer. The convention being tested is pronoun–antecedent agreement. The plural pronoun “they” agrees in number with the plural antecedent “customers.” Choice B is incorrect because the singular pronoun “one” doesn’t agree in number with the plural antecedent “customers.” Choice C is incorrect because the second person pronoun “you” isn’t conventional as a substitute for “customers.” It suggests that the audience (“you”) is the customer. Choice D is incorrect because the singular pronoun “it” doesn’t agree in number with the plural antecedent “customers.”"},{"i":"898f182c","c":"fss","d":"E","s":"Richard Spikes was a prolific African American inventor known for his contributions to automotive engineering. Between 1907 and 1946, he patented many inventions, ______ an automobile turn signal, a safety brake, and—most famously—the first automatic gearshift.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["included","includes","including","will include"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of nonfinite verb forms within a sentence. The nonfinite present participle \"including\" is correctly used to form a participial phrase that supplements the main clause \"he patented many inventions,\" listing several of Spikes’s patented inventions. Choice A is incorrect because the finite past tense verb \"included\" can’t be used in this way to supplement the main clause \"he patented many inventions.\" Choice B is incorrect because the finite present tense verb \"includes\" can’t be used in this way to supplement the main clause \"he patented many inventions.\" Choice D is incorrect because the finite future tense verb \"will include\" can’t be used in this way to supplement the main clause \"he patented many inventions.\""},{"i":"c468db1c","c":"bound","d":"H","s":"A group of ecologists led by Axel Mithöfer at the Max Planck Institute for Chemical Ecology in Germany examined the defensive responses of two varieties of the sweet potato ______ TN57, which is known for its insect resistance, and TN66, which is much more susceptible to pests.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["plant.","plant;","plant","plant:"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between a main clause and a supplementary phrase. In this choice, a colon is correctly used to mark the boundary between the main clause (“A group…plant”) and the supplementary element (“TN57…pests”) and to introduce the following elaboration on the specific varieties of sweet potato plants that were examined. Choice A is incorrect because it results in a rhetorically unacceptable sentence fragment beginning with “TN57.” Choice B is incorrect because a semicolon can’t be used in this way to join the main clause (“A group…plant”) and the supplementary element (“TN57…pests”). A semicolon is conventionally used to join two main clauses, whereas a colon is conventionally used to introduce an element that explains or amplifies the information in the preceding clause. Choice C is incorrect because it fails to mark the boundary between the main clause (“A group...plant”) and the supplementary element (“TN57...pests”) with appropriate punctuation."},{"i":"67667d72","c":"bound","d":"M","s":"Humans were long thought to have begun occupying the Peruvian settlement of Machu Picchu between 1440 and 1450 CE. However, a team led by anthropologist Dr. Richard Burger used accelerator mass spectrometry to uncover evidence that it was occupied ______ 1420 CE, according to Burger, humans were likely inhabiting the area.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["earlier. In","earlier, in","earlier, which in","earlier in"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (“However...earlier”) and another (“In...area”). The supplementary phrase “in 1420 CE” modifies “humans,” the subject of the third sentence. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Moreover, the subordinating conjunction “which” creates a confusing and illogical sentence that suggests that the supplementary phrase beginning with “in” modifies the previous information (“However...earlier”) rather than the information that follows. Choice D is incorrect because it results in a run- on sentence. The sentences (“However...earlier” and “in...area”) are fused without punctuation and/or a conjunction."},{"i":"7aac173e","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Architect Julian Abele studied Gregorian and neo-Gothic architecture in Europe. Abele worked for an architecture firm that was hired in 1924 to design buildings for Duke University’s new campus. Most of the buildings on Duke’s campus were designed in the Gregorian or neo-Gothic architectural styles. At the time, Abele was not formally credited with designing the buildings. Based on the buildings’ architectural styles, historians believe Abele designed most of the campus buildings. The student wants to specify why historians believe Abele designed most of Duke’s campus buildings.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Given that most of the buildings on Duke’s campus feature architectural styles that Abele had studied in Europe, historians believe Abele is the one who designed them.","Though Abele wasn’t formally credited at the time, historians believe he designed most of the buildings on Duke’s campus.","Most of Duke’s campus buildings, which were designed by a firm Abele worked for, were designed in the Gregorian and neo-Gothic architectural styles.","Abele, an architect who studied Gregorian and neo-Gothic architecture in Europe, is believed to have designed most of the buildings on Duke’s campus."],"a":0,"r":"Choice A is the best answer. The sentence specifies why historians believe Abele designed most of Duke’s campus buildings, noting that most of the buildings feature architectural styles that Abele had studied. Choice B is incorrect. While the sentence explains that historians believe Abele designed most of Duke’s campus buildings, it doesn’t specify why historians hold that belief. Choice C is incorrect because the sentence emphasizes the architectural styles of Duke’s campus buildings; it doesn’t specify why historians believe Abele designed the buildings. Choice D is incorrect. While the sentence explains that Abele is believed to have designed most of the buildings on Duke’s campus, it doesn’t specify why historians believe that he designed the buildings."},{"i":"114bbce6","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Earthquakes start at a point called a “focus” and spread out from there as seismic waves. The two types of seismic waves that travel beneath Earth’s surface are primary waves (P waves) and secondary waves (S waves). P waves travel more quickly beneath Earth’s surface than do S waves. P waves compress and expand the ground, causing it to move backward and forward. S waves cause the ground to move from side to side. The student wants to emphasize a similarity between P waves and S waves.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["P waves and S waves both travel beneath Earth’s surface, causing the ground to move.","P waves travel away from an earthquake’s starting point at a higher rate of speed than do S waves.","Spreading out from the focus of an earthquake, P waves move the ground backward and forward.","Although P waves and S waves start at the same point, they behave very differently."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes a similarity between P waves and S waves, noting that they both travel beneath Earth’s surface, thereby causing the ground to move. Choice B is incorrect. The sentence emphasizes a difference between P waves and S waves, noting that P waves travel faster than S waves; it doesn’t emphasize a similarity between the two types of waves. Choice C is incorrect. The sentence emphasizes how P waves move; it doesn’t emphasize a similarity between P waves and S waves. Choice D is incorrect. While the sentence acknowledges that P waves and S waves start at the same point, it doesn’t emphasize a similarity; instead, the sentence emphasizes a difference between the two types of waves, noting that they behave very differently."},{"i":"7d56630a","c":"trans","d":"E","s":"In studying whether jellyfish sleep, researchers Michael Abrams, Claire Bedbrook, and Ravi Nath attempted to answer three questions. ______ is there a period each day when the pulse rates of jellyfish decline? Second, do jellyfish respond more slowly to stimuli during that period? Finally, if prevented from sleeping, are jellyfish adversely affected?\n\nWhich choice completes the text with the most logical transition?","o":["As a result,","First,","Additionally,","However,"],"a":1,"r":"Choice B is the best answer. “First” logically signals that the question in this sentence—whether there is a daily period during which jellyfish pulse rates decline—is the first in a sequence of three questions the researchers attempted to answer about jellyfish sleep behavior. Choice A is incorrect because “as a result” illogically signals that the question in this sentence is a result of the three questions the researchers attempted to answer. Instead, it is the first of those three questions. Choice C is incorrect because “additionally” illogically signals that the question in this sentence is an additional question related to the three questions the researchers attempted to answer. Instead, it is the first of those three questions. Choice D is incorrect because “however” illogically signals that the question in this sentence contrasts with the three questions the researchers attempted to answer. Instead, it is the first of those three questions."},{"i":"388b45aa","c":"trans","d":"M","s":"Establishing Coordinated Universal Time (UTC) is no easy task. Each month, readings of a single second from atomic clocks around the world are taken and sent to the International Bureau of Weights and Measures (BIPM) in France. ______ BIPM metrologists perform the meticulous work of assembling these minutely disparate readings into a globally shared time standard.\n\nWhich choice completes the text with the most logical transition?","o":["There,","In particular,","For example,","Conversely,"],"a":0,"r":"Choice A is the best answer. \"There\" indicates that the work of calculating Coordinated Universal Time takes place at the International Bureau of Weights and Measures in France. Because \"there\" indicates a location, it fits the context perfectly. Choice B is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. This sentence is describing where the work of coordinating Coordinated Universal Time takes place, not giving an example of the work described in the previous sentence. Choice C is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. This sentence is describing where the work of coordinating Coordinated Universal Time takes place, not giving an example of the work described in the previous sentence. Choice D is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the previous sentence. They both describe the work involved in calculating Coordinated Universal Time."}],"img":{"d83c3d54":"iVBORw0KGgoAAAANSUhEUgAAArwAAAIaBAMAAAAw0YODAAAAMFBMVEX4+Pj function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}
function fb(q){const a=ans[q.i],S=seg(q.r);
 if(a===undefined)return `<p class="v bad">Not answered. The correct answer is ${L[q.a]}.</p><p>${S[L[q.a]]||q.r}</p>`;
 const own=S[L[a]]||q.r;
 return a===q.a?`<p class="v ok">Correct.</p><p>${own}</p>`:`<p class="v bad">Not quite. You chose ${L[a]}.</p><p>${own}</p><p class="v ok">The correct answer is ${L[q.a]}.</p><p>${S[L[q.a]]||""}</p>`}
function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
function sum(){const d=Object.keys(ans).length,ok=Q.filter(q=>ans[q.i]===q.a).length;$("#sum").textContent=done?`Score: ${ok} of ${Q.length} correct (${Math.round(100*ok/Q.length)}%)`:`${d} of ${Q.length} answered`}
function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;

 else if(t.id==="mi"){miss=!miss;draw()}
