<script>
const D={"t":"Practicetest31","q":[{"i":"b92c13fa","c":"vocab","d":"E","s":"According to statistician Nassim Nicholas Taleb, the best way to predict the amount of time a nonperishable entity (such as a building or a technology) will continue to exist is to examine how long it has survived so far. In this view, an item’s age is the strongest ______ how much longer it will last.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["uncertainty about","indicator of","motivation for","criticism of"],"a":1,"r":"Choice B is the best answer. “Indicator” means “something that shows or suggests,” which matches Taleb’s argument that an item’s age can suggest how much longer it will last. Choice A is incorrect. The passage tells us that examining an item’s age is the best way to predict how much longer it will last. Therefore, according to Taleb’s theory, an item’s age should add more certainty about how much longer it will last. Choice C is incorrect. A “motivation” is “a reason for doing.” Items don’t have feelings and motivations, so it wouldn’t make sense to say that their age is a motivation for how much longer they will last. Choice D is incorrect. “Criticism” can mean “describing faults or problems” or “an analysis of an artistic work.” Neither of these definitions makes sense here. An item’s age can’t criticize how much longer it will last."},{"i":"7f935017","c":"vocab","d":"H","s":"The following text is from a 1955 translation of Samuel Beckett’s 1951 novel Molloy(translated by the author and Patrick Bowles). In the text, Molloy has arrived at the town ramparts, an elevated walkway atop the city walls. And having cleared the ramparts I had to confess the sky was clearing, prior to its winding in the other shroud, night. Yes, the great cloud was ravelling, discovering here and there a pale and dying sky, and the sun, already down, was manifest in the livid tongues of fire darting towards the zenith, falling and darting again, ever more pale and languid, and doomed no sooner lit to be extinguished. ©1955 by Grove Press, Inc.\n\nAs used in the text, what does the word “manifest” most nearly mean?","o":["Realized","Perceptible","Situated","Dwindling"],"a":1,"r":"Choice B is the best answer because as used in the text, “manifest” most nearly means perceptible or detectable. The text indicates that the sun was “already down,” meaning it was below the horizon and not directly visible. However, the sun’s presence was nonetheless perceptible or manifest in the “tongues of fire” (or beams of light) that still flickered in the darkening sky. Choice A is incorrect. Although in some contexts “manifest” can mean “realized” or “brought into being,” that is not the context here. Rather, the text is about how the sun’s presence was perceptible or manifest in the “darting” beams of light that could still be seen in the sky. Choice C is incorrect. This choice would suggest that the sun is situated, or located, in the light it emits, which is not supported by the surrounding context. Rather, the text is about how the sun’s presence was perceptible or manifest in the remaining light that could still be seen in the sky. Choice D is incorrect. Although the text is about the decreasing light in the scene at sunset, the text’s use of “manifest” is about how the sun’s presence was nonetheless perceptible or manifest in the “tongues of fire” still visible in the sky as night approached."},{"i":"9cdcd902","c":"vocab","d":"E","s":"Charles “Teenie” Harris was a photographer for the Pittsburgh Courier from 1936 to 1975. During his career he took over 70,000 photographs documenting everyday life in Pittsburgh’s Black communities. The Carnegie Museum of Art maintains thousands of his photographs, carefully ______ them so that audiences can continue to view them well into the future.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["replacing","inventing","preserving","counting"],"a":2,"r":"Choice C is the best answer. \"Preserving\" means \"maintaining\" or \"keeping in good condition,\" so preserving the photographs means that audiences should be able to view them for a long time. Choice A is incorrect. \"Replacing\" means \"putting something new in place of\" the photographs. Replacing the photos will make it so that audiences can’t view them at all. Choice B is incorrect. \"Inventing\" means \"creating a new idea, process, or thing.\" The museum can’t invent photographs that already exist. Choice D is incorrect. Counting the photographs will not help audiences view them well into the future."},{"i":"631a1b64","c":"vocab","d":"E","s":"Since the Hubble Space Telescope was launched into space in 1990, astronauts have needed to complete regular missions to repair the telescope and keep it working smoothly. Researchers hope that robots will soon be able to make these repairs. Employing robots instead of humans to make repairs will be helpful, as ______ astronauts to maintain the telescope can be expensive.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["straightening","forgetting about","relying on","reducing"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of repairing the Hubble Space Telescope. In this context, “relying on” means depending on. The text states that astronauts have regularly had to go on missions to repair the Hubble Space Telescope but that robots might soon be able to make the repairs, which would be helpful because involving astronauts in the process is expensive. It is most reasonable to assume that it is the need to send astronauts on missions that is expensive; thus, the context suggests that employing robots for repairs will be helpful because depending on repeatedly sending humans to space is costly. Choice A is incorrect. In this context, “straightening” would mean physically aligning or removing curves and bends. It’s not clear how astronauts would be physically straightened to maintain the telescope or why that would be expensive. Choice B is incorrect because the text suggests that it is the ongoing involvement of astronauts—the need to send them to space regularly—that is expensive. Nothing in the text indicates that astronauts have been forgotten about or that forgetting about them would be expensive. Choice D is incorrect. In this context, “reducing” would most likely mean lowering in status, and nothing in the text suggests that astronauts are diminished in any way by repairing the telescope (indeed, they have regularly done repairs for years). Further, it isn’t clear how a decrease in status would be expensive."},{"i":"975b0602","c":"purpose","d":"H","s":"A number of Indigenous politicians have been elected to the United States Congress since 2000 as members of the country’s two established political parties. In Canada and several Latin American countries, on the other hand, Indigenous people have formed their own political parties to advance candidates who will advocate for the interests of their communities. This movement has been particularly successful in Ecuador, where Guadalupe Llori, a member of the Indigenous party known as Pachakutik, was elected president of the National Assembly in 2021.\n\nWhich choice best states the main purpose of the text?","o":["To trace the history of an Indigenous political movement and speculate about its future development","To argue that Indigenous politicians in the United States should form their own political party","To highlight two approaches to achieving political representation for Indigenous people","To consider how Indigenous politicians in the United States have influenced Indigenous politicians in Canada and Latin America"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to illustrate two approaches that Indigenous politicians have taken to achieve political representation for their communities. The text begins by explaining that one approach is exemplified by Indigenous politicians in the United States who, in an effort to ensure that the interests of their communities are represented in government, joined preexisting political parties and were subsequently elected to Congress. The text goes on to highlight a second approach adopted by Indigenous leaders in Canada and several Latin American countries: rather than joining established political parties, many Indigenous politicians in these countries have instead formed their own parties to promote candidates for office who support causes that are important to their communities. Choice A is incorrect because the text’s focus is on the contrasting approaches adopted by different Indigenous political movements in different countries; thus, it isn’t accurate to say that the text traces the history of one political movement. Moreover, the text only discusses examples from 2000 to 2021, a relatively short period of time; therefore, it provides very little in the way of discussion of larger historical developments, nor does it make any predictions about how these movements might continue to develop in the future. Choice B is incorrect because the text never urges Indigenous politicians in the US to alter their strategy of striving for representation through the established political parties, nor does it suggest that this strategy is inferior to that of Indigenous politicians in Canada and Latin America, who have formed their own parties. In fact, the text notes that both strategies have resulted in the election of Indigenous politicians to national governments. Choice D is incorrect because the text never suggests that Indigenous politicians in the US have influenced those in Canada and Latin America; instead, it stresses how Indigenous politicians’ approach toward achieving representation in the US government has differed from the approach Indigenous politicians have taken to achieve representation in national governments elsewhere in the Americas."},{"i":"5f56fdec","c":"purpose","d":"H","s":"The following text is from George Marion McClellan’s 1895 poem “Eternity.” My spirit swoons, and all my senses cry For Ocean’s breast and covering of the sky. Rock me to sleep, ye waves, and outward bound, Just let me drift far out from toil and care, Where lapping of the waves shall be the sound, Which mingled with the winds that gently bear Me on between a peaceful sea and sky, To make my soothing slumberous lullaby.\n\nWhich choice best states the main purpose of the text?","o":["To illustrate the increasing intensity of the speaker’s desire to escape ongoing hardship by gliding on the ocean","To contrast the demands of the speaker’s everyday life with the serenity of being rocked to sleep by the ocean","To convey the speaker’s longing for the ocean to impart a sense of inner tranquility","To justify the speaker’s qualms about being transported by the ocean to a quiet destination"],"a":2,"r":"Choice C is the best answer because it most accurately states the main purpose of the text, which is to convey the speaker’s longing for the ocean to impart a sense of inner tranquility, or peace. The text begins by expressing the speaker’s strong desire to be on the ocean, appealing directly to the waves to rock the speaker to sleep. The poem then describes the \"slumberous lullaby\" formed by the sound of the waves and the winds on which the speaker wishes to be carried \"gently...between a peaceful sea and sky.\" All these details serve to emphasize the speaker’s desire for the ocean to give them a sense of inner tranquility. Choice A is incorrect. Given the poem’s expression of a longing to achieve tranquility by drifting on the ocean, it can be inferred that the speaker desires to escape something unpleasant in daily life. However, the poem doesn’t refer directly to any such hardship—ongoing or otherwise. And since the poem doesn’t establish that the speaker is experiencing a desire to escape ongoing hardship, it can’t be said that such a desire increases in intensity. Choice B is incorrect. The speaker does express a desire for the serenity of being rocked to sleep by the ocean, and it can be inferred that this desire is a response to demands that make the speaker’s daily life stressful. However, the poem doesn’t refer directly to such demands or contrast them with the tranquility of drifting on the ocean. Choice D is incorrect because the text doesn’t suggest the speaker has any qualms, or reservations, about being transported by the ocean. On the contrary, the speaker actively desires to \"drift far out\" and be carried by the waves and wind. Moreover, the poem doesn’t suggest that this drifting would have any particular destination."},{"i":"0f2933b9","c":"func","d":"H","s":"The following text is from William Shakespeare’s circa 1611 play The Winter’s Tale. Camillo has been away from his home in Sicily and serves in the court of Polixenes, the king of Bohemia. He has asked Polixenes for permission to return to Sicily. POLIXENES: I pray thee, good Camillo, be no more importunate. ’Tis a sickness denying thee anything, a death to grant this. CAMILLO: It is fifteen years since I saw my country. Though I have for the most part been aired abroad, I desire to lay my bones there. Besides, the penitent king, my master, hath sent for me, <u>to whose feeling sorrows I might be some allay—or I o’erween [presume] to think so<\/u>—which is another spur to my departure.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It establishes Camillo’s hope that Polixenes will be comforted knowing that Camillo isn’t departing at his own discretion.","It suggests that Camillo feels compelled to persuade Polixenes that Camillo’s decision to leave the court is justified.","It conveys Camillo’s recognition that one benefit his presence may afford the king of Sicily is merely speculative.","It bolsters the idea that Camillo’s primary motivation to return home is his concern for the king of Sicily’s well-being in his absence."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. In the text, Camillo explains to Polixenes that he wants to return home after his long absence and that Sicily’s king has summoned him. In the underlined portion, Camillo adds that he also wants to return because he might provide comfort to the king’s sorrows (“to whose feeling sorrows I might be some allay”) but then clarifies that his belief about being able to comfort the king is a presumption—that is, something he thinks is true but can’t be certain of. Thus, the underlined portion indicates that Camillo recognizes that one benefit his presence may offer is merely speculative. Choice A is incorrect because the underlined portion conveys Camillo’s hope that he might comfort the king of Sicily, which does suggest a personal choice contributing to Camillo’s decision to leave; the idea that Camillo isn’t choosing to leave is established in a different part of the text, when he says “the penitent king, my master, hath sent for me.” Choice B is incorrect because the underlined portion doesn’t suggest Camillo feels compelled to justify his decision to leave. Rather than expressing a need to persuade Polixenes that his departure is warranted, Camillo’s statement simply reveals his awareness that he assumes rather than knows with certainty that his presence will comfort the king of Sicily. Choice D is incorrect because nothing in the text indicates that Camillo’s primary motivation for returning to Sicily is his concern for the king’s well-being; Camillo mentions first that he wants to return home because he has been away for so long, then adds that the king has summoned him and that he hopes his presence will comfort the king. The underlined portion simply conveys Camillo’s awareness that offering comfort is a hope rather than a certainty; it doesn’t suggest that the king’s well-being is his main concern."},{"i":"9b01bcf4","c":"func","d":"H","s":"The 1967 release of Harold Cruse’s book The Crisis of the Negro Intellectual isolated him from almost all other scholars and activists of the American Civil Rights Movement—though many of those thinkers disagreed with each other, he nonetheless found ways to disagree with them all. He thought that activists who believed that Black people such as himself should culturally assimilate were naïve. <u>But he also sharply criticized Black nationalists such as Marcus Garvey who wanted to establish independent, self-contained Black economies and societies, even though Cruse himself identified as a Black nationalist.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It describes a direction that Cruse felt the Civil Rights Movement ought to take.","It indicates that Cruse’s reputation as a persistent antagonist of other scholars is undeserved.","It describes a controversy that Cruse’s work caused within the Black nationalist movement.","It helps explain Cruse’s position with respect to the community of civil rights thinkers."],"a":3,"r":"Choice D is the best answer. The text as a whole claims that Cruse disagreed with virtually all other Civil Rights scholars and activists. The underlined sentence describes one way that Cruse both did and didn’t fit in with those thinkers: he criticized Black nationalists, even though he identified as one. Choice A is incorrect. The underlined sentence doesn’t do this. It describes Cruse’s criticisms—it never mentions what Cruse did want the movement to do instead. Choice B is incorrect. This conflicts with the text, which argues that Cruse did disagree with almost all other scholars of the Civil Rights Movement. Choice C is incorrect. This is a step too far. The text never says that Cruse’s work caused controversy within the Black nationalist movement."},{"i":"82c05b34","c":"cross","d":"M","s":"Text 1 The live music festival business is growing in event size and genre variety. With so many consumer options, organizers are finding ways to cement festival attendance as a special experience worth sharing. This phenomenon is linked to the growing “experiential economy,” where many find it gratifying to purchase lived experiences. To ensure a profitable event, venues need to consider the overall consumer experience, not just the band lineup.\n\nText 2 Music festival appearances are becoming a more important part of musicians’ careers. One factor in this shift is the rising use of streaming services that allow access to huge numbers of songs for a monthly fee, subsequently reducing sales of full-length albums. With this shift in consumer behavior, musicians are increasingly dependent on revenue from live performances.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Consumers are more interested in paying subscription fees to stream music than in attending music festivals in person.","Consumers’ growing interest in purchasing experiences is mostly confined to the music industry.","Changing consumer behaviors are leading to changes in music-related businesses.","The rising consumer demand for live music festivals also generates higher demand for music streaming platforms."],"a":2,"r":"Choice C is the best answer. Both authors mention how consumer behaviors have shifted, and how this affects different aspects of the music industry. Text 1 states that consumers enjoy purchasing “lived experiences,” and that this influences how organizers design music festivals. Text 2 states that consumers are using streaming services more, and that this reduces album sales and increases the importance of live performances for musicians. Choice A is incorrect. Neither text claims that consumers prefer streaming to festivals, or that these are mutually exclusive options. Text 1 implies that festivals are popular and profitable, and Text 2 never suggests that streaming services diminish the demand for live music. Choice B is incorrect. This choice misreads Text 1, which identifies music festivals as just one example of a broader trend of purchasing “lived experiences.” Text 2 doesn’t mention growing interest in purchasing experiences, in the music industry or otherwise. Choice D is incorrect. Neither text establishes a cause/effect relationship between the demand for festivals and the demand for streaming platforms. Text 1 does not mention streaming platforms at all, and Text 2 does not imply that streaming platforms benefit from the popularity of festivals."},{"i":"16ce90d9","c":"main","d":"H","s":"In 2018, scientists discovered an immense aggregation of Muusoctopus robustus (pearl octopuses) along a hydrothermal vent 3,200 meters beneath the ocean’s surface. Water temperatures at this site—named the Octopus Garden—climb as high as 11°C, much warmer than the ambient 1.6°C typical at this depth. Based on observations made over three years, scientists concluded that temperatures at the site likely confer reproductive benefits and that the site is used exclusively for reproduction—6,000 M. robustus adults, hatchlings, and eggs were observed at the garden, but no juveniles were present.\n\nWhich statement about M. robustus and the Octopus Garden is best supported by the text?","o":["M. robustus leave the Octopus Garden upon reaching an intermediary stage of development.","The M. robustus population at the Octopus Garden remains stable despite variations in water temperature.","M. robustus nests in the Octopus Garden contain on average fewer but larger eggs than nests at similar ocean depths.","The Octopus Garden provides an ideal feeding ground for M. robustus hatchlings."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the M. robustus population at the Octopus Garden. The text states that the scientists concluded that the site is likely used only for reproduction because over three years they saw many adults, freshly hatched octopuses, and eggs but didn’t see any juveniles. This suggests that the M. robustus octopuses that hatch at the Octopus Garden leave the site when they reach an intermediary state of development, returning only as adults for reproductive purposes. Choice B is incorrect because the text never discusses the stability of the M. robustus population at the site, only that the scientists observed 6,000 adults, hatchlings, and eggs there. Further, the text presents the site’s temperatures as likely beneficial. Choice C is incorrect because the text doesn’t provide any details about the eggs at the site and makes no mention of nests; it indicates only that eggs are present along with hatchlings and adults. Choice D is incorrect because the text makes no mention of the hatchlings feeding at the Octopus Garden, indicating only that the temperatures at the site are probably beneficial and that the site is likely used for reproduction."},{"i":"a842db60","c":"main","d":"E","s":"To make her art more widely available, graphic artist Elizabeth Catlett turned to linocuts. In linocut printing, an artist carves an image into a sheet of linoleum to create a stamp that is used to mass-produce prints. In the linocut series The Black Woman (1946–1947), Catlett depicts the everyday experiences of Black women alongside the achievements of well-known Black women. This pairing invites the viewer to draw connections among the women. The linocut process enabled Catlett’s work to reach a wide audience and supported her aim to unite Black women through her art.\n\nAccording to the text, what is significant about Catlett’s use of linocut printing?","o":["Linocut printing involved using materials that were readily available to Catlett.","Linocut printing helped Catlett use art to connect people, especially Black women.","Catlett became commercially successful once she started using linocut printing.","Catlett was one of the first Black artists to use linocut printing."],"a":1,"r":"Choice B is the best answer. The last sentence states that the linocut process “supported her [Catlett’s] aim to unite Black women through her art.” Choice A is incorrect. The text briefly describes the linocut printing process but doesn’t discuss the availability of the materials used in the process. Choice C is incorrect. The text says that the linocut process “enabled Catlett’s work to reach a wide audience,” but that doesn’t mean that linocuts made her “commercially successful.” In other words, we don’t know how much money she made off her linocuts—we only know that more people were able to see her work. Choice D is incorrect. The text says that Catlett depicted Black women in her linocuts, but not that she was one of the first Black artists to use linocut printing."},{"i":"d1539546","c":"infer","d":"H","s":"Tides can deposit large quantities of dead vegetation within a salt marsh, smothering healthy plants and leaving a salt panne—a depression devoid of plants that tends to trap standing water—in the marsh’s interior. Ecologist Kathryn Beheshti and colleagues found that burrowing crabs living within these pannes improve drainage by loosening the soil, leading the pannes to shrink as marsh plants move back in. At salt marsh edges, however, crab-induced soil loosening can promote marsh loss by accelerating erosion, suggesting that the burrowing action of crabs ______ Which choice most logically completes the text?","o":["can be beneficial to marshes with small pannes but can be harmful to marshes with large pannes.","may promote increases in marsh plants or decreases in marsh plants, depending on the crabs’ location.","tends to be more heavily concentrated in areas of marsh interiors with standing water than at marsh edges.","varies in intensity depending on the size of the panne relative to the size of the surrounding marsh."],"a":1,"r":"Choice B is the best answer. The text says that crab burrowing in the pannes enables plants to grow there again. It also says that crab burrowing at the edges of the marsh speeds up marsh loss. This suggests that burrowing crabs can either help or hurt marshes, depending on where they’re located. Choice A is incorrect. This inference isn’t supported. The text never discusses pannes of different sizes. Choice C is incorrect. This inference isn’t supported. The text never suggests that crabs do more burrowing in the pannes (the areas with standing water) than they do at the edges. Rather, the text says that the burrowing that happens in the pannes is beneficial, while the burrowing that happens at the edges is harmful. Choice D is incorrect. This inference isn’t supported. The text never discusses the intensity of crab burrowing, nor does it discuss the size of the panne relative to the size of the marsh."},{"i":"eca09a92","c":"infer","d":"E","s":"If an animal has been extinct for a long time, how can scientists learn what color it was? One group of scientists came up with a possible answer. When the scientists examined the fossilized feather of an extinct bird, they found melanosomes in it. Melanosomes produce pigment, or grains of color, inside cells. Because melanosomes are shaped differently depending on which colors they produce, the scientists hypothesized that they could ______ Which choice most logically completes the text?","o":["show how melanosomes can be found in fossils belonging to animals from other extinct species.","determine the colors of the bird based on the appearance of the melanosomes in the feather.","explain why the melanosomes in the feather were so well preserved.","identify the colors of extinct animals whose fossils lack melanosomes."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of a hypothesis by one group of scientists about how to determine the colors of a long-extinct animal. The text explains that the scientists found melanosomes in the fossilized feather of an extinct bird and that melanosomes are responsible for producing color inside cells. The text also explains that melanosomes have different shapes depending on the colors they produce. Given this information, it follows that the scientists hypothesized that they could determine the colors of the extinct bird by examining the shapes of the melanosomes in the feather. Choice A is incorrect because the text never suggests that the scientists were seeking to show how melanosomes can be found in fossils belonging to animals from other extinct species. Rather, the text indicates that the scientists were seeking to identify an extinct bird’s colors, and the text strongly suggests that the scientists hypothesized that they could achieve their goal by examining the shapes of the melanosomes in the bird’s fossilized feather. Choice C is incorrect because the text never suggests that the scientists were seeking to explain why the melanosomes in the feather were so well preserved. Rather, the text indicates that the scientists were seeking to identify an extinct bird’s colors, and the text strongly suggests that the scientists hypothesized that they could achieve their goal by examining the shapes of the melanosomes in the bird’s fossilized feather. Choice D is incorrect because the text suggests only one method of identifying the colors of extinct animals: by examining the shapes of melanosomes found in fossils. The text doesn’t discuss other methods for learning the colors of extinct animals and therefore provides no support for the idea that the scientists could identify the colors of extinct animals whose fossils lack melanosomes."},{"i":"df91532e","c":"claim","d":"H","s":"In the “language nest” model of education, Indigenous children learn the language of their people by using it as the medium of instruction and socialization at pre-K or elementary levels. In their 2016 study of a school in an Anishinaabe community in Ontario, Canada, scholars Lindsay Morcom and Stephanie Roy (who are Anishinaabe themselves) found that the model not only imparted fluency in the Anishinaabe language but also enhanced students’ pride in Anishinaabe culture overall. Given these positive effects, Morcom and Roy predict that the model increases the probability that as adults, former students of the school will transmit the language to younger generations in their community.\n\nWhich finding, if true, would most strongly support the researchers’ prediction?","o":["Anishinaabe adults who didn’t attend the school feel roughly the same degree of cultural pride as the former students of the school feel.","After transferring to the school, new students experience an increase in both fluency and academic performance overall.","As adults, former students of the school are just as likely to continue living in their community as individuals who didn’t attend the school.","As they complete secondary and higher education, former students of the school experience no loss of fluency or cultural pride."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would support the researchers’ prediction about the language nest model of education. The text states that Morcom and Roy studied the effects of the language nest model of education on students at an Anishinaabe school, and they found that the model—which is used with students during pre-K or elementary school—increased students’ fluency in the Anishinaabe language and pride in Anishinaabe culture. The researchers predicted that the students’ positive early experiences with the Anishinaabe language would lead them to be more likely to later share the language with younger generations. If former students maintain full fluency and cultural pride after finishing secondary and higher education, it follows that they would be both able and motivated to share what they know with others; this would likely result in a higher probability of transmitting the language to younger generations, as the researchers predict. Choice A is incorrect because finding that Anishinaabe adults who didn’t attend the school feel approximately the same degree of cultural pride as those adults who did attend wouldn’t support the researchers’ prediction that former students will be more likely to share their knowledge with younger generations. This finding would identify a similarity between the groups rather than a factor that might make former students more likely than other adults to transmit the language to younger people. Choice B is incorrect because finding that new students experience increased performance in language fluency and academics would suggest that the school has a positive effect on students when they attended but wouldn’t reveal anything about those students’ later actions as adults (such as their likelihood of sharing their knowledge with younger generations). Choice C is incorrect because finding that Anishinaabe adults who attended the school are equally likely to stay in the community as adults who didn’t attend the school wouldn’t support the researchers’ prediction that former students will be more likely to share their knowledge with younger generations. This finding would identify a similarity between the groups rather than a factor that might make former students more likely than other adults to transmit the language to younger people."},{"i":"3bfcb73b","c":"claim","d":"H","s":"An archaeological team led by Piotr Bieliński and Sultan al-Bakri found remnants of a 4,000-year-old Bronze Age board game at a site in Oman. Little is left of the game except a stone board, which is carved with a grid and has places to hold game pieces. Some scholars claim that the game was largely played by traders.\n\nWhich finding, if true, would most directly support the scholars’ claim?","o":["Other examples of the game dating to the same period have been found in the remains of several homes in the region, including in one home that may have belonged to a trader.","Similar games have been found in other sites dating to the same period that were connected to the site in Oman via trade routes.","The other known examples of the game dating to the same period have been found along routes that seem to have been used primarily by traders at the time.","Remnants of other goods have been found at the site in Oman that probably also reached the location through trade."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would most directly support the scholars’ claim about the board game. The text explains that the remains of a 4,000-year-old board game were found in Oman. The text then states that scholars claim this board game was played mostly by traders. If the other known examples of this board game from the same time period were discovered along routes that seem to have been used primarily by traders, this finding would directly support the scholars’ claim because it suggests that the game was largely played by traders who brought it with them for entertainment as they traveled. Choice A is incorrect because this finding would suggest only that a single trader may have possessed examples of the board game, perhaps for the purpose of trading or selling the game to residents of Oman. For this reason, the finding wouldn’t directly support the scholars’ claim that the majority of the game’s players were traders. Choice B is incorrect because this finding doesn’t mention the board game at all, referring only to similar games found at other sites, and would therefore provide no direct support for the scholars’ claim about the board game. Choice D is incorrect because this finding doesn’t mention the board game at all, referring only to the remains of other goods found at the site in Oman, and would therefore provide no direct support for the scholars’ claim about the board game."},{"i":"e1546fd6","c":"graph","d":"M","s":"","o":["at 5–45 meters below the surface, the average concentration of phosphate was about the same in the seawater in the lava-affected area as in the seawater outside of the lava-affected area.","for both depth ranges measured, the average concentrations of nitrate were substantially higher in the seawater in the lava-affected area than in the seawater outside of the lava-affected area.","for both depth ranges measured in the seawater in the lava-affected area, the average concentrations of nitrate were substantially higher than the average concentrations of phosphate.","in the seawater outside of the lava-affected area, there was little change in the average concentration of nitrate from 75–125 meters below the surface to 5–45 meters below the surface."],"a":1,"r":"Choice B is the best answer. The claim is that the lava freed the deep nitrate, allowing it to float upward. The table supports this by showing that there was more nitrate in the lava-affected seawater at various depths above 300 meters (the depth to which the lava plunged) than in unaffected seawater. Choice A is incorrect. This choice doesn’t complete the statement in a way that supports the claim. The claim is about nitrate, not phosphate. Choice C is incorrect. This choice doesn’t complete the statement in a way that supports the claim. The claim is only about nitrate—the concentrations of phosphate aren’t relevant. Choice D is incorrect. This choice doesn’t complete the statement in a way that supports the claim. It doesn’t say anything about the seawater inside the lava-affected area."},{"i":"224428ac","c":"graph","d":"M","s":"","o":["The number of captive California condors steadily decreased between 2014 and 2020.","The numbers of California condors living both in captivity and in the wild decreased only slightly from 2019 to 2020.","The difference between the number of captive and wild California condors remained relatively steady between 2014 and 2017.","The number of wild California condors increased overall from 2014 to 2020 and exceeded the number of those living in captivity."],"a":3,"r":"Choice D is the best answer because it best describes data from the graph that support the biologists’ claim. The text accompanying the graph describes the efforts of the California Condor Recovery Program, which is working to protect the condor from extinction. The program captured some condors in 1987 in order to breed them and has been reintroducing captive birds into the wild since 1992. Many biologists claim the program has been a success, as the text explains, and it is reasonable to infer that an indication of the program’s success would be an increase in the wild condor population compared to the captive condor population. The graph shows the wild and captive condor populations in California between 2014 and 2020. In 2014 there were slightly more than 200 wild condors in California, but by 2020 there were more than 300. Meanwhile, over the same period the captive condor population remained under 200. Thus, the biologists’ claim about the program’s success is supported by data from the graph showing that the number of wild California condors increased overall from 2014 to 2020 and exceeded the number of those living in captivity. Choice A is incorrect because it does not accurately describe data from the graph. The number of captive California condors did not steadily decrease between 2014 and 2020: rather, it increased slightly during some years and decreased slightly during others, generally remaining at slightly less than 200. Choice B is incorrect. Even though the graph does show a slight decrease in both the captive and wild condor populations from 2019 to 2020, such a decrease during a particular year would not demonstrate the program’s success. Choice C is incorrect because it does not accurately describe data from the graph. The difference between the number of captive and wild California condors did not remain relatively steady between 2014 and 2017. While the number of captive condors remained roughly the same during that period, the number of wild condors increased, so the difference between the number of captive and wild condors increased as well."},{"i":"e8926747","c":"fss","d":"E","s":"Eighteen letters written by Louisa May Alcott, author of the popular novel Little Women (1868), can be found at the New York Historical Society. ______ letters demonstrate Alcott’s keen business sense in her interactions with publishers.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["One","That","This","These"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of determiners in a sentence. The plural determiner \"these\" agrees in number with the plural noun \"letters\" that it modifies. This choice clearly indicates that the letters demonstrate Alcott’s business sense. Choice A is incorrect because the singular determiner \"one\" doesn’t agree in number with the plural noun \"letters.\" Choice B is incorrect because the singular determiner \"that\" doesn’t agree in number with the plural noun \"letters.\" Choice C is incorrect because the singular determiner \"this\" doesn’t agree in number with the plural noun \"letters.\""},{"i":"cf08e2fd","c":"fss","d":"E","s":"From 1912 to 1951, Charlotta Bass owned and operated the newspaper The California Eagle. While it was under Bass’s leadership, The Eagle ______ one of the US’s most influential Black-owned newspapers.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["will become","became","is becoming","to become"],"a":1,"r":"Choice B is the best answer. The conventions being tested are the use of verbs to express tense and the use of verb forms within a sentence. In this choice, the past tense verb \"became\" is consistent with the other past tense verbs (\"owned,\" \"operated,\" and \"was\") used to indicate that, at a period of time in the past, Bass’s leadership resulted in her newspaper becoming one of the most influential Black-owned newspapers in the US. In addition, \"became\" supplies the main clause with a finite (tensed) verb, which is required to perform the action of the subject (in this case, \"The Eagle\"). Choice A is incorrect because the future tense verb \"will become\" isn’t consistent with the other past tense verbs used to discuss Bass and her newspaper. Choice C is incorrect because the present progressive verb \"is becoming\" isn’t consistent with the other past tense verbs used to discuss Bass and her newspaper. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to become\" doesn’t supply the main clause with a finite verb."},{"i":"265e7f4c","c":"fss","d":"E","s":"The Globe Theatre in London is a reconstruction of the famed venue where many of Shakespeare’s plays were first performed. In 1613, a prop cannon ______ during a performance and ignited the Globe’s thatched roof. No one was hurt, but in two hours the original Globe was gone.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["malfunctions","will malfunction","has malfunctioned","malfunctioned"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the past tense verb \"malfunctioned\" is consistent with the other past tense verbs (\"ignited\" and \"was\") used to describe the destruction of the original Globe Theatre. Choice A is incorrect because the present tense verb \"malfunctions\" isn’t consistent with the other past tense verbs used to describe the destruction of the original Globe Theatre. Choice B is incorrect because the future tense verb \"will malfunction\" isn’t consistent with the other past tense verbs used to describe the destruction of the original Globe Theatre. Choice C is incorrect because the present perfect tense verb \"has malfunctioned\" isn’t consistent with the other past tense verbs used to describe the destruction of the original Globe Theatre."},{"i":"403d7bb5","c":"bound","d":"M","s":"According to Naomi Nakayama of the University of Edinburgh, the reason seeds from a dying dandelion appear to float in the air while ______ is that their porous plumes enhance drag, allowing the seeds to stay airborne long enough for the wind to disperse them throughout the surrounding area.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["falling,","falling:","falling;","falling"],"a":3,"r":"Choice D is the best answer. The word “falling” occurs in the middle of a clause and isn’t part of a supplement, so we don’t need any punctuation after it. We can see this more clearly if we simplify the rest of the sentence: “The reason seeds appear to float while falling is that their plumes enhance drag.” . Choice A is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. The word “falling” occurs in the middle of a clause and isn’t part of a supplement, so we don’t need any punctuation after it. We can see this more clearly if we simplify the sentence: “The reason seeds appear to float while falling is that their plumes enhance drag.” . Choice B is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. The word “falling” occurs in the middle of a clause and isn’t part of a supplement, so we don’t need any punctuation after it. We can see this more clearly if we simplify the sentence: “The reason seeds appear to float while falling is that their plumes enhance drag.” . Choice C is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. The word “falling” occurs in the middle of a clause and isn’t part of a supplement, so we don’t need any punctuation after it. We can see this more clearly if we simplify the sentence: “The reason seeds appear to float while falling is that their plumes enhance drag.” ."},{"i":"be34a3df","c":"bound","d":"M","s":"In 2008, two years after the death of science fiction writer Octavia Butler, the Huntington Library in ______ received a collection of more than 8,000 items, including Butler’s private notes, research materials, manuscripts, photos, and drawings. Today, the Octavia E. Butler Collection is one of the most researched archives at the library.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["California,","California:","California—","California"],"a":3,"r":"Choice D is the best answer. No punctuation should separate the subject of the sentence (“the Huntington Library in California”) from its verb (“received”). Choice A is incorrect. No punctuation should separate the subject of the sentence (“the Huntington Library in California”) from its verb (“received”). Choice B is incorrect. No punctuation should separate the subject of the sentence (“the Huntington Library in California”) from its verb (“received”). Choice C is incorrect. No punctuation should separate the subject of the sentence (“the Huntington Library in California”) from its verb (“received”)."},{"i":"113f16da","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Some animals have evolved to physically resemble another animal, plant, or object. This is known as mimicry. Crab spiders mimic the appearance of flowers. This helps crab spiders ambush their prey. Katydids mimic the appearance of leaves. This helps katydids hide from their predators. The student wants to emphasize a difference in how katydids and crab spiders use mimicry.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Katydids mimic the appearance of flowers, and crab spiders mimic that of leaves.","Katydids and crab spiders are two examples of animals that use mimicry.","Unlike crab spiders, which use mimicry to ambush prey, katydids use mimicry to hide from predators.","Animals that use mimicry have evolved to resemble another animal, plant, or object."],"a":2,"r":"Choice C is the best answer. The sentence uses \"unlike\" to emphasize a difference in how katydids and crab spiders use mimicry, noting that crab spiders use mimicry to ambush prey while katydids use it to hide from predators. Choice A is incorrect. While the sentence does contrast katydids and crab spiders, it misrepresents the information in the notes. Katydids mimic the appearance of leaves (not flowers), whereas crab spiders mimic the appearance of flowers (not leaves). Choice B is incorrect. While the sentence indicates that katydids and crab spiders use mimicry, it doesn’t emphasize a difference in how they use it. Choice D is incorrect. The sentence describes what mimicry is; it doesn’t emphasize a difference in how katydids and crab spiders specifically use mimicry."},{"i":"f1d8550e","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Jordan Bennett is a Mi’Kmaq visual artist. The Mi’Kmaq are a First Nations people in North America. Bennett’s paintings pay homage to traditional Mi’Kmaq craftsmanship and have been displayed in over 75 exhibitions. His 2017 exhibition Wije’wi was held at the Grenfell Art Gallery. His 2018 exhibition Ketu’elmita’jik was held at the Art Gallery of Nova Scotia. The student wants to emphasize the order in which two of Jordan Bennett’s exhibitions were held.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Jordan Bennett’s 2017 exhibition Wije’wi was followed a year later by his exhibition Ketu’elmita’jik.","Jordan Bennett’s paintings, some of which appeared in 2017 and 2018 exhibitions, pay homage to traditional Mi’Kmaq craftsmanship.","Mi’Kmaq visual artist Jordan Bennett has displayed his work in over 75 exhibitions, including Wije’wi and Ketu’elmita’jik.","Jordan Bennett’s 2018 exhibition Ketu’elmita’jik was held at the Art Gallery of Nova Scotia; another was held at the Grenfell Art Gallery."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes the order in which two of Jordan Bennett’s exhibitions were held, indicating that Wije’wi took place in 2017 and Ketu’elmita’jik took place a year later (2018). Choice B is incorrect. While the sentence mentions that exhibitions of Jordan Bennett’s paintings took place in 2017 and 2018, it doesn’t identify the exhibitions or emphasize the order in which they were held. Choice C is incorrect. While the sentence mentions two of Jordan Bennett’s exhibitions, it doesn’t indicate the order in which they were held. Choice D is incorrect. While the sentence mentions two of Jordan Bennett’s exhibitions and specifies when one of them was held, it doesn’t state when the exhibition at the Grenfell Art Gallery occurred. Thus, the order in which the two exhibitions were held isn’t clearly established in the sentence."},{"i":"6a5939c2","c":"trans","d":"E","s":"Paleontologists once thought that early apes lived in tropical forests, but recent research suggests that they may have actually lived in savannas. Tropical forests are humid and have many trees spaced close together. ______ savannas are drier, and their trees are spaced further apart.\n\nWhich choice completes the text with the most logical transition?","o":["For instance,","In comparison,","Firstly,","In conclusion,"],"a":1,"r":"Choice B is the best answer. \"In comparison\" logically signals that the description of savannas in this sentence—that they are drier and their trees are spaced further apart—forms a comparison with the description of tropical forests in the previous sentence. Choice A is incorrect because \"for instance\" illogically signals that the description of savannas in this sentence exemplifies the description of tropical forests in the previous sentence. Instead, this description forms a comparison with the description of tropical forests. Choice C is incorrect because \"firstly\" illogically signals that the description of savannas in this sentence indicates the first in a series of things. Instead, this description forms a comparison with the description of tropical forests in the previous sentence. Choice D is incorrect because \"in conclusion\" illogically signals that the description of savannas in this sentence concludes or summarizes information in the previous sentences. Instead, this description forms a comparison with the description of tropical forests in the previous sentence."},{"i":"0d3ebdce","c":"trans","d":"E","s":"Neuroscientist Karen Konkoly wanted to determine whether individuals can understand and respond to questions during REM sleep. She first taught volunteers eye movements they would use to respond to basic math problems while asleep (a single left-right eye movement indicated the number one). ______ she attached electrodes to the volunteers’ faces to record their eye movements during sleep.\n\nWhich choice completes the text with the most logical transition?","o":["Specifically,","Next,","For instance,","In sum,"],"a":1,"r":"Choice B is the best answer. “Next” logically signals that the action described in this sentence—Konkoly recording participants’ eye movements— is the next step in Konkoly’s experiment. Choice A is incorrect because “specifically” illogically signals that this sentence specifies or elaborates on an aspect of the action described in the previous sentence. Instead, it describes the next step in Konkoly’s experiment. Choice C is incorrect because “for instance” illogically signals that the action described in this sentence is an example of the action described in the previous sentence. Instead, it is the next step in Konkoly’s experiment. Choice D is incorrect because “in sum” illogically signals that this sentence summarizes or concludes the action described in the previous sentence. Instead, it describes the next step in Konkoly’s experiment."},{"i":"f5959727","c":"trans","d":"H","s":"Modernista architects championed nature in their designs. ______ the wavy staircase and ornate floral tilework of Hospital de Sant Pau, a Modernista hospital designed by Lluís Domènech i Montaner, couldn’t exactly grow in a forest. Still, one sees natural influences in Domènech i Montaner’s penchant for curves (rather than right angles) and plant- and animal-inspired flourishes.\n\nWhich choice completes the text with the most logical transition?","o":["Furthermore,","Similarly,","Of course,","Thus,"],"a":2,"r":"Choice C is the best answer. \"Of course\" logically signals that the information in this sentence—that \"the wavy staircase and ornate floral tilework\" of the Modernista hospital couldn’t actually grow in a forest—acknowledges an obvious limitation of, or qualification to, the previous claim that Modernista architects championed nature in their designs. Choice A is incorrect because \"furthermore\" illogically signals that the information in this sentence merely adds to the previous claim that Modernista architects championed nature in their designs. Instead, the sentence acknowledges an obvious limitation in how literally that natural influence was expressed in the hospital’s features. Choice B is incorrect because \"similarly\" illogically signals that the information in this sentence is similar to the previous claim that Modernista architects championed nature in their designs. Instead, the sentence acknowledges an obvious limitation in how literally that natural influence was expressed in the hospital’s features. Choice D is incorrect because \"thus\" illogically signals that the information in this sentence is a result of the previous claim that Modernista architects championed nature in their designs. Instead, the sentence acknowledges an obvious limitation in how literally that natural influence was expressed in the hospital’s features."}],"img":{"e1546fd6":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFfB
