<script>
const D={"t":"Practicetest61","q":[{"i":"e3f05561","c":"vocab","d":"E","s":"In the 1970s, video cameras became increasingly affordable for ordinary consumers and gave Ulysses Jenkins and other artists capabilities that were previously unavailable except to television broadcasters. Jenkins recognized and took full advantage of this ______ access to powerful technology to create groundbreaking works of video art, such as Mass of Images (1978).\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["newfound","delicate","inevitable","habitual"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Ulysses Jenkins’s video art. As used in this context, “newfound” means recently discovered or established. The text indicates that in the 1970s, video cameras became cheaper and therefore more widely available than they had been in the past. The text goes on to say that this development provided Jenkins and other artists with capabilities that they previously didn’t have. As a result, Jenkins began producing groundbreaking works of video art. This context supports the idea that Jenkins took advantage of newfound access to video cameras. Choice B is incorrect because “delicate” means fine in texture or structure or easily broken, neither of which would make sense in this context. The text doesn’t focus on describing what video art looks like or whether it’s breakable. Choice C is incorrect because “inevitable” means impossible to avoid, which wouldn’t make sense in this context. The text doesn’t discuss the likelihood of artists, or anyone else, gaining access to video cameras. Choice D is incorrect because “habitual” means doing something regularly or repeatedly. Although the text does suggest that Jenkins created multiple pieces of video art, its focus is on the fact that video cameras had only just become widely available to artists in the 1970s. Jenkins’s ability to take advantage of video cameras to make art was therefore newfound, not habitual, at the time."},{"i":"d91e5499","c":"vocab","d":"E","s":"A team of paleontologists has found a rich fossil deposit near Gulgong, Australia. The fossils are so well preserved that the team has been able to ______ detailed information about the life forms that left them behind, such as color patterns and how they interacted with other species.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["occupy","hoard","reserve","obtain"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the fossil deposit. In this context, \"obtain\" means gain or acquire. According to the text, a team of paleontologists has found fossils that are very well preserved. For this reason, the text suggests, the paleontologists have been able to gain detailed information from the fossils, such as the color patterns of the life forms that left them behind. Choice A is incorrect because \"occupy\" means engage or inhabit, neither of which would make sense in context. It’s unclear what it would mean for detailed information revealed by fossils to be engaged or inhabited. Choice B is incorrect because the text gives no indication that the paleontologists wanted to \"hoard,\" or collect and hide, the detailed information revealed by the well-preserved fossils. Choice C is incorrect because the text gives no indication that the paleontologists wanted to \"reserve,\" or withhold, the detailed information revealed by the well- preserved fossils."},{"i":"6cf906fc","c":"vocab","d":"E","s":"The following text is adapted from José Martí’s 1891 poem “At the Salon” (translated by Cecil Charles in 1898). The speaker describes a painting featuring a female figure. From the sterile soil no ray Of hope in a blade of green, Nor sheltering roof is seen— Though the skies are heavy and gray. Ah, this is the woman fair Who stole away my heart In the splendid halls of art Yester-e’en as I wandered there!\n\nAs used in the text, what does the word “sheltering” most nearly mean?","o":["Protective","Restrictive","Affectionate","Suspicious"],"a":0,"r":"Choice A is the best answer because as used in the text, \"sheltering\" most nearly means protective. In the text, the speaker describes a painting featuring a female figure. The speaker ultimately confesses to falling in love with the woman in the painting, who has \"stole[n] away\" the speaker’s heart, but first the speaker describes elements of the painting’s setting. These include sterile soil, barren fields with \"no ray / Of hope in a blade of green\"—a description that conveys a mood of melancholy and forlornness, possibly reflecting the speaker’s own sadness at falling in love with an image that can’t return the speaker’s love. The text continues by stating that there’s no \"sheltering roof\" in the painting, even though the \"skies are heavy and gray,\" showing signs of an impending storm. Generally, a roof’s intended purpose is to provide protection from the elements, and in this context, a roof would offer shelter and protection from the gathering storm. Choice B is incorrect because nothing in the text suggests that a roof would be restrictive—that is, that it would limit or restrain something in some way. Although a roof would provide some cover from stormy winds and rain, it wouldn’t limit the wind and rain, only deflect them. Choice C is incorrect because there’s nothing in the text to suggest that if a \"sheltering roof\" were present in the painting, it would be affectionate, or loving and tender. In the text, the immediate context in which the word \"sheltering\" appears refers to the absence of a roof that would provide protection from the oncoming storm depicted in the painting, not to the idea that such a shelter would be loving and tender if it were present. Choice D is incorrect because in this context, suspicious would mean questionable or dubious, and there’s nothing in the text to suggest that if any roofs were present in the painting, they would be questionable or cause any suspicion."},{"i":"afd2a9eb","c":"vocab","d":"E","s":"Manul cats are small, shy felines. They live mostly alone in out-of-the-way parts of Asia, such as on Mount Everest. These cats have been difficult to research because their habitats are so ______ large populations of humans.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["full of","drawn to","responsible for","distant from"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of manul cats. The text states that manul cats live in \"out- of-the-way parts of Asia\" (citing the famously remote Mount Everest as an example) and indicates that it is difficult to research the cats because of the location of their habitats. By emphasizing that the habitats are remote in relation to humans, the text conveys that being \"distant from,\" or far from, large groups of humans makes manul cats challenging to study. Choice A is incorrect because saying that the habitats of manul cats are \"full of large populations of humans\" would indicate that the cats cohabitate with many humans, which would directly contradict the text’s claim that the cats live in \"out-of-the-way\" areas. Choice B is incorrect because the missing words describe an aspect of manul cats’ habitats, or the areas where they live, and it wouldn’t make sense to say that areas could be \"drawn to,\" or attracted by, large groups of humans. Choice C is incorrect. In this context, \"responsible for\" would mean either having an obligation to care for something or being the cause of something, and it wouldn’t make sense to say that the habitats of manul cats (the areas where the cats live) would need to care for humans or that the habitats somehow created large human populations."},{"i":"7d8224f9","c":"purpose","d":"M","s":"In 1154, Muhammad al-Idrisi completed a collection of maps of the lands known to medieval Arabic and European scholars. This collection was titled Al-Kitāb al-Rujārī (The Book of Roger), after the Norman king Roger II who hired him to create it. To create the collection, al-Idrisi consulted Arabic and Greek maps and interviewed travelers about the lands they visited. He included these travelers’ stories alongside the map illustrations.\n\nWhich choice best states the main purpose of the text?","o":["To discuss the benefits of studying mapmaking","To explain how travelers created maps","To describe a collection of medieval maps and how it was created","To compare medieval Arabic and Greek mapmaking techniques"],"a":2,"r":"Choice C is the best answer because it most accurately states the main purpose of the text, which is to describe a collection of medieval maps and how it was created. The text begins by mentioning Muhammad al-Idrisi’s collection of maps of lands known to medieval Arabic and European scholars. It then states that the Norman king Roger II hired al-Idrisi to create the collection and details al-Idrisi’s methods of creation: consulting Arabic and Greek maps and interviewing travelers. In short, the text presents a collection of medieval maps and then goes on to describe how that collection came to be. Choice A is incorrect because the text describes a collection of maps and the process of creating that collection but does not discuss the benefits of studying mapmaking in general. Choice B is incorrect because though the text mentions that al-Idrisi interviewed travelers, the text does not describe how those travelers created maps. Choice D is incorrect because though the text mentions that al-Idrisi consulted Arabic and Greek maps, the text does not offer a comparison of Arabic and Greek mapmaking techniques."},{"i":"19688783","c":"purpose","d":"M","s":"The following text is from Lucy Maud Montgomery’s 1908 novel Anne of Green Gables. Anne, an eleven-year-old girl, has come to live on a farm with a woman named Marilla in Nova Scotia, Canada. Anne reveled in the world of color about her. “Oh, Marilla,” she exclaimed one Saturday morning, coming dancing in with her arms full of gorgeous boughs, “I’m so glad I live in a world where there are Octobers. It would be terrible if we just skipped from September to November, wouldn’t it? Look at these maple branches. Don’t they give you a thrill—several thrills? I’m going to decorate my room with them.” “Messy things,” said Marilla, whose aesthetic sense was not noticeably developed. “You clutter up your room entirely too much with out-of-doors stuff, Anne. Bedrooms were made to sleep in.”\n\nWhich choice best states the main purpose of the text?","o":["To demonstrate that Anne has a newly developed appreciation of nature","To describe an argument that Anne and Marilla often have","To emphasize Marilla’s disapproval of how Anne has decorated her room","To show that Anne and Marilla have very different personalities"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text. The text begins by noting that Anne “reveled in the world of color about her”—that is, she takes great delight in colorful things. It then relates a scene when she enthusiastically enters the house with autumn foliage and announces that she will decorate her room with it. The focus of the text then shifts to Marilla, who has an undeveloped “aesthetic sense,” or appreciation of beauty, as can be seen when she dismisses the maple leaves as “messy things” and criticizes Anne for cluttering her room with objects from outside. This episode thus illustrates that Anne and Marilla differ in their appreciation of beauty and, more generally, in their basic character: Anne is exuberant and joyful, while Marilla is stern and critical. Therefore, the purpose of the text is to show that Anne and Marilla have very different personalities. Choice A is incorrect because the text presents Anne’s appreciation of nature as a basic personality trait, not as a newfound enthusiasm, and never indicates how recently she developed that appreciation. Choice B is incorrect. Although the text portrays Anne and Marilla as having different personalities and attitudes toward natural beauty and home decoration, it doesn’t show them engaging in an argument about this difference or suggest that they often argue about it. Choice C is incorrect. Although the text does indicate that Marilla disapproves of how Anne plans to decorate her room, Marilla’s disapproval is a supporting detail that serves to develop her personality, which the text as a whole contrasts with Anne’s personality."},{"i":"a68239ed","c":"func","d":"E","s":"The following text is adapted from Oscar Wilde’s 1897 nonfiction work De Profundis. People whose desire is solely for self-realisation never know where they are going. They can’t know. In one sense of the word it is of course necessary to know oneself: that is the first achievement of knowledge. But to recognise that the soul of a man is unknowable, is the ultimate achievement of wisdom. The final mystery is oneself. When one has weighed the sun in the balance, and measured the steps of the moon, and mapped out the seven heavens star by star, there still remains oneself. <u>Who can calculate the orbit of his own soul?<\/u> Which choice best describes the function of the underlined question in the text as a whole?","o":["It reinforces the text’s skepticism about the possibility of truly achieving self-knowledge.","It speculates that some readers will share the doubts expressed in the text about the value of self-knowledge.","It cautions readers that the text’s directions for how to achieve self-knowledge are hard to follow.","It concedes that the definition of self-knowledge advanced in the text is unpopular."],"a":0,"r":"Choice A is the best answer. The text repeatedly claims that true self-knowledge can’t possibly be achieved, and this rhetorical question emphasizes that point. Choice B is incorrect. The underlined question doesn’t do this. The text never expresses doubts about the value of self-knowledge—rather, the text expresses doubts about the possibility of achieving self-knowledge. Choice C is incorrect. The underlined question doesn’t do this. The text doesn’t provide directions for how to achieve self-knowledge—rather, it claims that true self-knowledge is impossible to achieve. Choice D is incorrect. The underlined question doesn’t do this. The text doesn’t ever define self-knowledge, and popularity isn’t mentioned in the text at all."},{"i":"cf46f239","c":"func","d":"H","s":"The following text is adapted from Herman Melville’s 1855 novel Israel Potter. Israel is a young man wandering through New England during the late eighteenth century. He hired himself out for three months; at the end of that time to receive for his wages two hundred acres of land lying in New Hampshire. [...] His employer proving false to the contract in the matter of the land, and there being no law in the country to force him to fulfil it, Israel—<u>who, however brave-hearted, and even much of a dare-devil upon a pinch, seems nevertheless to have evinced, throughout many parts of his career, a singular patience and mildness<\/u>—was obliged to look round for other means of livelihood than clearing out a farm for himself in the wilderness.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It implies that Israel treasures a particular characteristic of his personality when that characteristic should usually be regarded as a flaw.","It suggests that if not for a certain aspect of his character, Israel might not have been as easily thwarted in his ambition to establish a farm.","It shows why Israel would not have been able to undertake the enormous amount of labor necessary to run a farm even if he had owned the necessary property.","It explains why, when the situation requires it, Israel is able to undertake courageous acts that others would generally avoid."],"a":1,"r":"Choice B is the best answer because it best describes the function of the underlined portion in the text as a whole. The text describes the failed attempt of Israel Potter to establish a farm in New England during the late eighteenth century: according to his contract, he was to receive two hundred acres in exchange for three months’ work, but his employer then refused to fulfill the bargain and Israel had no recourse to law to obtain the land he was owed. Israel was therefore forced to find another means of supporting himself. To explain why Israel was particularly susceptible to his employer’s dishonesty, the underlined portion states that though Israel was \"brave-hearted, and even much of a dare-devil upon a pinch,\" he also possessed \"a singular patience and mildness.\" In other words, Israel could be courageous in certain circumstances, but he was usually meek and disinclined to argument, from which it is reasonable to infer that Israel was often taken advantage of. Thus, the underlined portion suggests that if not for a certain aspect of his character, Israel might not have been as easily thwarted in his ambition to establish a farm. Choice A is incorrect because although the underlined portion describes aspects of Israel’s personality, it does not address how he feels about his own personality. Choice C is incorrect because the underlined portion addresses Israel’s occasional courage and frequent meekness but does not address whether he would have the skills and resolve necessary to operate a farm if he owned sufficient property. Choice D is incorrect. Though the underlined portion does indicate that Israel could be courageous in certain circumstances, it does not say that he undertook acts of courage that others avoided, but rather that he was habitually meek. Even if the underlined portion did say that Israel was more courageous than most, this would not explain why he found himself under the circumstances described in the text—that is, as a consequence of his meek nature, cheated of the property to which he had a right."},{"i":"17bf10de","c":"cross","d":"H","s":"Text 1 Despite its beautiful prose, The Guns of August, Barbara Tuchman’s 1962 analysis of the start of World War I, has certain weaknesses as a work of history. It fails to address events in Eastern Europe just before the outbreak of hostilities, thereby giving the impression that Germany was the war’s principal instigator. Had Tuchman consulted secondary works available to her by scholars such as Luigi Albertini, she would not have neglected the influence of events in Eastern Europe on Germany’s actions.\n\nText 2 Barbara Tuchman’s The Guns of August is an engrossing if dated introduction to World War I. Tuchman’s analysis of primary documents is laudable, but her main thesis that European powers committed themselves to a catastrophic outcome by refusing to deviate from military plans developed prior to the conflict is implausibly reductive.\n\nWhich choice best describes a difference in how the authors of\n\nText 1 and\n\nText 2 view Barbara Tuchman’s The Guns of August?","o":["The author of Text 1 argues that Tuchman should have relied more on the work of other historians, while the author of Text 2 implies that Tuchman’s most interesting claims result from her original research.","The author of Text 1 believes that the scope of Tuchman’s research led her to an incorrect interpretation, while the author of Text 2 believes that Tuchman’s central argument is overly simplistic.","The author of Text 1 asserts that the writing style of The Guns of August makes it worthwhile to read despite any perceived deficiency in Tuchman’s research, while the author of Text 2 focuses exclusively on the weakness of Tuchman’s interpretation of events.","The author of Text 1 claims that Tuchman would agree that World War I was largely due to events in Eastern Europe, while the author of Text 2 maintains that Tuchman would say that Eastern European leaders were not committed to military plans in the same way that other leaders were."],"a":1,"r":"Choice B is the best answer. Both texts are critical of The Guns of August, but for different reasons: the author of Text 1 argues that Tuchman missed an important factor leading up to the war because she didn’t consult secondary sources, and the author of Text 2 argues that Tuchman’s main thesis is \"reductive,\" which is a close synonym for \"overly simplistic.\" Choice A is incorrect. This doesn’t accurately describe the difference. This choice’s summary of Text 1 is accurate, but Text 2 never says that Tuchman’s most interesting claims result from her original research. Choice C is incorrect. This doesn’t accurately describe the difference. Text 1 never says that The Guns of August is worthwhile to read despite its research weaknesses. Text 2 does call out a weakness of Tuchman’s interpretation of events, but it also praises her analysis of primary sources. Choice D is incorrect. This doesn’t accurately describe the difference. Text 1 actually says that Tuchman \"fails to address\" the influence of events in Eastern Europe, while Text 2 says that Tuchman’s thesis was that European powers (not Eastern European leaders) were committed to military plans."},{"i":"0d81b7d9","c":"main","d":"M","s":"Paleontologist Alan Tennyson and colleagues studied fossil bones found in New Zealand that are more than 55 million years old. The researchers determined that the fossil bones belonged to two previously unknown species of prehistoric penguins. Moreover, they estimated that one of the two penguin species was more than three times the size of the emperor penguin, which is the largest penguin species that exists today.\n\nBased on the text, which choice best describes the two previously unknown penguin species?","o":["They are frequently studied by paleontologists.","They are no longer living species.","They were smaller than penguin species that exist today.","They spent little of their lives in water."],"a":1,"r":"Choice B is the best answer because it presents a statement about the two previously unknown penguin species that is supported by the text. According to the text, Alan Tennyson and colleagues studied fossil bones belonging to two previously unknown penguin species that are described as prehistoric, or ancient. The text goes on to say that one of the two species was considerably larger than the emperor penguin, which is currently the largest penguin in existence. Thus, the text indicates that the other species aren’t in existence today, or that the two previously unknown penguin species are no longer living species. Choice A is incorrect. Although the text states that Alan Tennyson is a paleontologist who studied the fossils of two previously unknown penguin species, it doesn’t say whether these penguins are frequently studied by paleontologists. Choice C is incorrect because the text says that one of the two previously unknown penguin species was three times larger than the emperor penguin (a penguin alive today), not that they were both smaller than penguin species that exist today. Choice D is incorrect because the text doesn’t discuss whether the two previously unknown penguin species spent any time in water."},{"i":"1e85caa9","c":"main","d":"E","s":"The following text is from Edith Nesbit’s 1902 novel Five Children and It. Five young siblings have just moved with their parents from London to a house in the countryside that they call the White House. It was not really a pretty house at all; it was quite ordinary, and mother thought it was rather inconvenient, and was quite annoyed at there being no shelves, to speak of, and hardly a cupboard in the place. Father used to say that the ironwork on the roof and coping was like an architect’s nightmare. But the house was deep in the country, with no other house in sight, and the children had been in London for two years, without so much as once going to the seaside even for a day by an excursion train, and so the White House seemed to them a sort of Fairy Palace set down in an Earthly Paradise.\n\nWhich choice best states the main idea of the text?","o":["Although their parents believe the house has several drawbacks, the children are enchanted by it.","The children don’t like the house nearly as much as their parents do.","Each member of the family admires a different characteristic of the house.","The house is beautiful and well built, but the children miss their old home in London."],"a":0,"r":"Choice A is the best answer. The text lists complaints about the house made by the mother and father, but then it says that the children thought the house was a \"Fairy Palace\" and \"Earthly Paradise.\" Choice B is incorrect. The text states the opposite of this. It describes how the mother and father dislike the house and says the children think the house seems like paradise. Choice C is incorrect. This isn’t what the text says. Only the children are said to admire the house; mother and father both complain about the house. Choice D is incorrect. The text states the opposite of this. It tells us the house was ugly and poorly built (\"an architect’s nightmare\") and suggests the children were tired of London."},{"i":"f9bd4e61","c":"infer","d":"H","s":"German theater practitioner Bertolt Brecht (1898–1956) believed that theater should elicit an intellectual rather than an emotional response from audiences, provoking them to consider social and political realities that extend beyond the characters and events depicted onstage. Brecht’s influence can be seen in English playwright Caryl Churchill’s 1979 play Cloud 9: although the play sometimes invites empathetic reactions, it primarily works to engage audiences in an interrogation of patriarchy and colonialism, which it does by placing audiences at a distance, thereby encouraging them to ______ Which choice most logically completes the text?","o":["focus on the characters’ beliefs about social and political issues as revealed by the characters’ actions.","reflect on social and political phenomena not directly related to patriarchy and colonialism.","recognize pertinent social and political parallels between Germany during Brecht’s time and England at the time when Churchill was writing Cloud 9.","be dispassionate as they think critically about the social and political questions raised by the play."],"a":3,"r":"Choice D is the best answer. Churchill’s play was influenced by Brecht’s belief that theater should elicit an intellectual rather than an emotional response from audiences, making them think about social and political issues that also exist outside of the play. Therefore, it makes sense that Churchill would strive to have audiences think dispassionately (i.e., without emotion) and critically about the social and political questions raised by the play. Choice A is incorrect. The passage mentions that Churchill was influenced by Brecht’s belief that plays should provoke audience members “to consider social and political realities that extend beyond the characters and events depicted onstage,” so there’s no basis for an inference about audience members deeply engaging with characters’ beliefs and actions. Choice B is incorrect. Reflecting on things that aren’t related to patriarchy and colonialism wouldn’t “engage audiences in an interrogation of patriarchy and colonialism.” That creates a confusing contradiction. Choice C is incorrect. No mention is made of social and political issues in Germany during Brecht’s time, so there’s no basis for this inference."},{"i":"f39507a3","c":"infer","d":"H","s":"One challenge when researching whether holding elected office changes a person’s behavior is the problem of ensuring that the experiment has an appropriate control group. To reveal the effect of holding office, researchers must compare people who hold elected office with people who do not hold office but who are otherwise similar to the office-holders. Since researchers are unable to control which politicians win elections, they therefore ______ Which choice most logically completes the text?","o":["struggle to find valid data about the behavior of politicians who do not currently hold office.","can only conduct valid studies with people who have previously held office rather than people who presently hold office.","should select a control group of people who differ from office-holders in several significant ways.","will find it difficult to identify a group of people who can function as an appropriate control group for their studies."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the challenge researchers face when studying the effects of holding elected office on a person’s behavior. The text explains that it’s hard for researchers to test for the effects that elected office has on people because finding people to serve as a control group is difficult. The text indicates that a control group needs to be made up of people who share characteristics of the group being tested but don’t have the variable being tested (in this case, holding elected office). Because researchers aren’t able to influence who wins elections, they’re also unable to determine who would serve as an appropriately similar member of a control group. Thus, it logically follows that researchers will find it difficult to identify a group of people who can function as an appropriate control group for their studies. Choice A is incorrect because the text focuses on the struggle to put together a control group for experiments; it doesn’t suggest that finding information about politicians’ behavior is difficult. Choice B is incorrect because the experiments mentioned in the text are testing the effects of holding elected office on a person’s behavior. Studying people who have already held elected office wouldn’t provide an opportunity to note any behavioral changes that the position might cause. Choice C is incorrect because the text defines people in a control group as those \"who are otherwise similar to the office-holders\"; selecting people who differ from the office-holders wouldn’t fit the criteria for an appropriate control group."},{"i":"628e1305","c":"claim","d":"E","s":"“Valia” is a 1907 short story by Leonid Andreyev. In the story, the author emphasizes that the setting where the character Valia is reading is nearly silent: ______ Which quotation from “Valia” most effectively illustrates the claim?","o":["“The hand in which he carried his book was getting stiff with cold, but he would not ask his mother to take the book from him.”","“Valia was reading a huge, very huge book, almost half as large as himself.”","“Valia approached the window and examined the toys.”","“Everything in the room was quiet, so quiet that the only thing to be heard was the rustling of the pages he turned.”"],"a":3,"r":"Choice D is the best answer because this quotation most effectively illustrates the claim that the author emphasizes the near silence of the setting where the character Valia is reading. In the quotation, the author highlights the near silence of the setting by twice using the word “quiet” to describe the room. The author also calls attention to the fact that Valia is reading in a nearly silent setting by noting that the only sound to be heard is that of the pages being turned. Choice A is incorrect because this quotation suggests that Valia is in a chilly setting that causes his hand to become cold, not that he’s in a nearly silent setting. Choice B is incorrect because this quotation emphasizes the size of the book Valia is reading, not a quality of the setting where he’s reading it. Choice C is incorrect because this quotation describes Valia approaching a window and looking at toys, not reading in a quiet setting."},{"i":"af9e3240","c":"claim","d":"H","s":"Electra is a circa 420–410 BCE play by Sophocles, translated in 1870 by R.C. Jebb. Electra, who is in mourning for her dead father and her long- absent brother, is aware of the intensity of her grief but believes it to be justified: ______ Which quotation from Electra most effectively illustrates the claim?","o":["“O thou pure sunlight, and thou air, earth’s canopy, how often have ye heard the strains of my lament, the wild blows dealt against this bleeding breast, when dark night fails!”","“Send to me my brother; for I have no more the strength to bear up alone against the load of grief that weighs me down.”","“I know my own passion, it escapes me not; but, seeing that the causes are so dire, will never curb these frenzied plaints, while life is in me.”","“But never will I cease from dirge and sore lament, while I look on the trembling rays of the bright stars, or on this light of day.”"],"a":2,"r":"Choice C is the best answer. Electra states that she “knows her own passion,” which shows that she’s aware of the intensity of her grief. But she also claims that the “causes are so dire”—meaning the reasons for her grief are so awful—that she can’t let it go, which shows that she believes her grief is justified. Choice A is incorrect. This quotation doesn’t show that Electra believes her grief is justified. It shows that Electra is aware of its intensity, but it doesn’t suggest that she believes she has a legitimate reason for feeling that way. Choice B is incorrect. This quotation doesn’t show that Electra believes her grief is justified. It shows that Electra is aware of its intensity, but it doesn’t suggest that she believes she has a legitimate reason for feeling that way. Choice D is incorrect. This quotation doesn’t show that Electra believes her grief is justified. It shows that Electra is aware of the intensity of her grief, but it doesn’t suggest that she has a legitimate reason for feeling that way."},{"i":"84136d69","c":"graph","d":"M","s":"","o":["6.3% of respondents said it was most effective to use efficient cars or hybrids.","2.8% of respondents said it was most effective to change the thermostat setting.","12.9% of respondents said it was most effective to use a bike or public transportation.","3.6% of respondents said it was most effective to use efficient light bulbs."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to complete the text’s discussion of Attari and her team’s survey results. The text states that the team asked respondents to identify the most effective action people can take to save energy, with the team classifying each action as either an efficiency or a curtailment. According to the text, respondents named curtailments more often than they did efficiencies. The text then offers an example that begins by citing a curtailment, turning off the lights, that was selected by a relatively high percentage of respondents (19.6%). Given that the example is presented in support of the idea that more respondents selected curtailments than efficiencies, the most effective way to complete the example is by citing an efficiency, using efficient light bulbs, that was selected by a relatively low percentage of respondents (only 3.6%). Choice A is incorrect because it inaccurately describes data in the table. The data indicate that 6.3% of respondents said the most effective action was to change the thermostat setting, not to use efficient cars or hybrids. Choice B is incorrect because it inaccurately describes data in the table. The data indicate that 2.8% of respondents said the most effective action was to use efficient cars/hybrids, not to change the thermostat setting. Choice C is incorrect because it mentions a curtailment (using a bike or public transportation) and not an efficiency. The text states that a research team asked respondents to identify the most effective action people can take to save energy, with the team classifying each action as either an efficiency or a curtailment. According to the text, respondents named curtailments more often than they did efficiencies. The text then offers an example that begins by citing a curtailment, turning off the lights, that was selected by a relatively high percentage of respondents (19.6%). Given that the example is presented in support of the idea that more people selected curtailments than efficiencies, the most effective way to complete the example is not by referring to another curtailment but rather by referring to an efficiency that was selected by a relatively low percentage of respondents."},{"i":"0cf13ece","c":"graph","d":"E","s":"","o":["1999","2012","2020","1992"],"a":3,"r":"Choice D is the best answer because it accurately reflects the data in the table. According to the table, the dolphin with ID FB43 has a recording year of 1992. Choice A is incorrect. None of the dolphins in the table have a recording year of 1999. Choice B is incorrect. The table shows 2012 as the recording year for the dolphin with ID FB07, not ID FB43. Choice C is incorrect. None of the dolphins in the table have a recording year of 2020."},{"i":"56315bd0","c":"fss","d":"M","s":"Solarpunk is an art movement that imagines renewable energy–powered technology infused complementarily into nature. In Paolo Bacigalupi’s solarpunk short story “Efficiency,” an artificial intelligence that absorbs sustainable energies, redistributing them through intricate networks of weights and generators, ______ Chicago’s energy grid.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have been powering","power","powers","are powering"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb \"powers\" agrees in number with the singular subject \"an artificial intelligence.\" Choice A is incorrect because the plural verb \"have been powering\" doesn’t agree in number with the singular subject \"an artificial intelligence.\" Choice B is incorrect because the plural verb \"power\" doesn’t agree in number with the singular subject \"an artificial intelligence.\" Choice D is incorrect because the plural verb \"are powering\" doesn’t agree in number with the singular subject \"an artificial intelligence.\""},{"i":"fff4c7f4","c":"fss","d":"E","s":"American poet Emily Dickinson wrote many of her poems on scraps of paper, but she also took steps to collect these works. From 1858 to around 1864, for example, she copied more than 800 of ______ into forty homemade booklets (known as fascicles).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["them","this","that","it"],"a":0,"r":"Choice A is the best answer. The pronoun \"them\" agrees with the plural antecedents \"poems\" and \"works.\" Choice B is incorrect. \"This\" is a singular pronoun, but its antecedents, \"poems\" and \"works,\" are plural. Choice C is incorrect. \"That\" is a singular pronoun, but its antecedents, \"poems\" and \"works,\" are plural. Choice D is incorrect. \"It\" is a singular pronoun, but its antecedents, \"poems\" and \"works,\" are plural."},{"i":"4320b4ad","c":"fss","d":"E","s":"For decades after World War II, the women who had worked for the US military as wartime codebreakers ______ their vital efforts a secret.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to keep","having kept","keeping","kept"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, “the women”), and this choice supplies the finite past tense verb “kept” to indicate what the women did. Choice A is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive “to keep” doesn’t supply the main clause with a finite verb. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite perfect participle “having kept” doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite present participle “keeping” doesn’t supply the main clause with a finite verb."},{"i":"60dd03bc","c":"bound","d":"E","s":"Located in the northern United States, the Great Lakes Basin contains roughly 35,000 islands. Lake Superior has Grand Island, for example. Lake Michigan has Belle Isle. Lake Huron, though, is home ______ the largest island of them all: Manitoulin Island.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to;","to—","to","to,"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between a preposition and its complement. No punctuation is needed between the preposition \"to\" and its complement \"the largest island of them all.\" The complement completes the meaning of the preposition in the phrase \"home to the largest island of them all,\" and any punctuation within it results in an ungrammatical sentence. Choice A is incorrect because no punctuation is needed between the preposition and its complement. Choice B is incorrect because no punctuation is needed between the preposition and its complement. Choice D is incorrect because no punctuation is needed between the preposition and its complement."},{"i":"2fd05c15","c":"bound","d":"H","s":"In crafting her fantasy fiction, Nigerian-born British author Helen Oyeyemi has drawn inspiration from the classic nineteenth-century fairy tales of the Brothers Grimm. Her 2014 novel Boy, Snow, Bird, for instance, is a complex retelling of the story of Snow White, while her 2019 novel ______ offers a delicious twist on the classic tale of Hansel and Gretel.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Gingerbread—","Gingerbread,","Gingerbread","Gingerbread:"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation between a subject and a verb. When, as in this case, a subject (“her 2019 novel Gingerbread”) is immediately followed by a verb (“offers”), no punctuation is needed. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice D is incorrect because no punctuation is needed between the subject and the verb."},{"i":"0fab0c90","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: The Gullah are a group of African Americans who have lived in parts of the southeastern United States since the 18th century. Gullah culture is influenced by West African and Central African traditions. Louise Miller Cohen is a Gullah historian, storyteller, and preservationist. She founded the Gullah Museum of Hilton Head Island, South Carolina, in 2003. Vermelle Rodrigues is a Gullah historian, artist, and preservationist. She founded the Gullah Museum of Georgetown, South Carolina, in 2003. The student wants to emphasize the duration and purpose of Cohen’s and Rodrigues’s work.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["At the Gullah Museums in Hilton Head Island and Georgetown, South Carolina, visitors can learn more about the Gullah people who have lived in the region for centuries.","Louise Miller Cohen and Vermelle Rodrigues have worked to preserve the culture of the Gullah people, who have lived in the United States since the 18th century.","Since 2003, Louise Miller Cohen and Vermelle Rodrigues have worked to preserve Gullah culture through their museums.","Influenced by the traditions of West and Central Africa, Gullah culture developed in parts of the southeastern United States in the 18th century."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes both the duration (the length of time) and the purpose of Cohen’s and Rodrigues’s work by noting that the women have been working since 2003 to preserve Gullah culture. Choice A is incorrect. While the sentence emphasizes what visitors to Cohen’s and Rodrigues’s museums can learn, it doesn’t mention the duration or purpose of the women’s work. Choice B is incorrect. While the sentence emphasizes the purpose of Cohen’s and Rodrigues’s work, it doesn’t mention the duration of that work (the length of time the women have been working to preserve Gullah culture). Choice D is incorrect. While the sentence emphasizes where and when Gullah culture developed, it doesn’t mention the duration or purpose of Cohen’s and Rodrigues’s work."},{"i":"e3bbf2bf","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: In World War I, US soldiers who were members of the Choctaw Nation in Oklahoma participated in the Choctaw Code Talkers program. The Choctaw Code Talkers were trained to relay coded military information in their native language. In World War II, the US Army recruited Navajo (Diné) soldiers to transmit coded messages in their native language. These soldiers were known as the Navajo Code Talkers. The student wants to emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["US soldiers who were members of the Choctaw Nation in Oklahoma used their native language to relay coded information.","In World War II, one group of Navajo (Diné) soldiers was known as the Navajo Code Talkers.","Both the Choctaw Code Talkers and the Navajo Code Talkers transmitted coded military messages in the soldiers’ native languages.","The Choctaw Code Talkers, not the Navajo Code Talkers, served in World War I."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes a similarity between the Choctaw Code Talkers and the Navajo Code Talkers by explaining that both groups used their native languages to transmit coded messages for the military. Choice A is incorrect. The sentence describes the Choctaw Code Talkers; it doesn’t emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers. Choice B is incorrect. The sentence introduces the Navajo Code Talkers; it doesn’t emphasize a similarity between the Choctaw Code Talkers and the Navajo Code Talkers. Choice D is incorrect. The sentence emphasizes a difference between the Choctaw Code Talkers and the Navajo Code Talkers; it doesn’t emphasize a similarity."},{"i":"ddb77846","c":"trans","d":"M","s":"My interest in old public libraries has led me to seek them out whenever I visit a new part of the United States. ______ I could visit every state in the US and still not find the oldest public library in the Western Hemisphere. That library, the Biblioteca Palafoxiana, is located in Puebla, Mexico.\n\nWhich choice completes the text with the most logical transition?","o":["As a result,","Nevertheless,","Earlier,","In other words,"],"a":1,"r":"Choice B is the best answer. \"Nevertheless\" logically signals that the claim in the sentence—that the speaker could visit every state in the US and not find the oldest public library in the Western Hemisphere—is true despite the previous claim about the speaker seeking out old public libraries. Choice A is incorrect because \"as a result\" illogically signals that the claim in the sentence is a consequence of the previous claim about the speaker seeking out old public libraries. Instead, the claim is true despite the previous claim. Choice C is incorrect because \"earlier\" illogically signals that the claim in the sentence occurs earlier in a chronological sequence of events than the previous claim about the speaker seeking out old public libraries. Instead, the claim is true despite the previous claim. Choice D is incorrect because \"in other words\" illogically signals that the claim in the sentence is merely a paraphrase or restatement of the previous claim about the speaker seeking out old public libraries. Instead, the claim is true despite the previous claim."},{"i":"b7c404d1","c":"trans","d":"M","s":"With her room-sized installation The Interstitium, Iranian American artist Laleh Mehran succeeded in creating a space that felt, as intended, both “familiar and distant.” ______ with a video screen placed at the far end of the coal slag-encrusted room, her installation was reminiscent of a typical movie theater—albeit one found in a subterranean coal mine.\n\nWhich choice completes the text with the most logical transition?","o":["Next,","Nevertheless,","Indeed,","Instead,"],"a":2,"r":"Choice C is the best answer. \"Indeed\" logically signals that the information in this sentence—that Laleh Mehran’s installation resembled both a typical movie theater and a coal mine—supports the previous sentence’s claim that the space Mehran created felt both \"familiar and distant.\" Choice A is incorrect because \"next\" illogically signals that the description of Laleh Mehran’s installation in this sentence is the next step in a process. Rather, it supports the previous sentence’s claim about Mehran’s installation. Choice B is incorrect because \"nevertheless\" illogically signals that the information in this sentence is true despite the claim about Laleh Mehran’s installation in the previous sentence. Rather, it supports that claim. Choice D is incorrect because \"instead\" illogically signals that this sentence presents an alternative to the previous sentence’s claim about Laleh Mehran’s installation. Rather, it supports that claim."},{"i":"fc5e83cc","c":"trans","d":"E","s":"When following musical scores, professional opera singers like soprano Ana María Martínez take vocal directions from descriptive notations, typically in Italian, that appear alongside the musical notes. ______ these descriptive terms might guide the performer to sing giocoso (playfully) or lento (at a slow tempo).\n\nWhich choice completes the text with the most logical transition?","o":["On the other hand,","All the same,","For example,","In the second place,"],"a":2,"r":"Choice C is the best answer. \"For example\" logically signals that this sentence supports the previous information about the descriptive notations opera singers use by providing specific examples of these notations: giocoso (playfully) and lento (at a slow tempo). Choice A is incorrect because \"on the other hand\" illogically signals that the information in this sentence contrasts with the previous information about the descriptive notations opera singers use. Instead, the sentence provides examples of these notations. Choice B is incorrect because \"all the same\" illogically signals that the information in this sentence is true despite the previous information about the descriptive notations opera singers use. Instead, the sentence provides examples of these notations. Choice D is incorrect because \"in the second place\" illogically signals that the information in this sentence is a second point that is separate from the previous information about the descriptive notations opera singers use. Instead, the sentence provides examples of these notations."}],"img":{"84136d69":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEyBAMAAADqxh5FAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABIyUlEQVR42u1dd0AUxxf+Zvfu6NwsxQ4soMbuAvZ6aNSYWE5jS2yHPTHRM9ZEo2hiiUbFlsR+llhAI3bFwtm7HBpjh8Pe4PZAUYG7/f0BCipGIhA0v/v+gL272Zk337yZee/t7Axggw022GCDDTbY8M6A4yjN/sT2Bkhw5jXh6BvuJb6vfifL7aZXv2Nyz5twvv8tepOubtqU/clpExgkZF5Xv3Loea1z/M1sFABAw6vanF8CAKo9JxAAuQMAvoqwHA2YmdX6S7ny2/jqhf8WvWeBAB48qwJIE3RTY4xwpgnYAKAhHcyzKrQHW4PCn7rJeNSkpAmYdmB28KwAHGEOs/Bj/HkIbDBDWQqZr1dZiho8C7fKEwBZGkUQWesnME3g2xRME6DKLKYG4BTppGMF+DYBG0xIMOvvBgZBQGvAzQNoCtaPaeIrEP59p9cAbPlFETl6LUXptaFL95E/lt2dLnSNEGgDuPLTdpSMGO8Svt9u5xaXBWftojY2CFd3XaiSpwdHzQd2wt9J+Nzx+K9y/eiIEmH1eRK1utrC/Yqdm1zoqNY3AMepWvuo1YnNdN0WqsIXaT6PUGHG5vrhofDiWfXohb7H1wlTw/luERUuVtIMtIta function card(q,n){const a=ans[q.i];
