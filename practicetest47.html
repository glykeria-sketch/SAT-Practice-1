<script>
const D={"t":"Practicetest47","q":[{"i":"490b205f","c":"vocab","d":"M","s":"In editor Lisa Yaszek’s introduction to her anthology The Future Is Female! More Classic Science Fiction Stories by Women, Yaszek identifies an increasing sense of ______ feminist mode of writing in the 1970s, in contrast to many woman-authored science fiction stories of the 1920s to 1960s whose politics were less deliberately signaled.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a prudently","an overtly","a cordially","an inadvertently"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Yaszek’s introduction to her science fiction anthology. In this context \"overtly\" means openly or without concealment. The text draws a contrast between the lack of \"deliberately signaled\" political themes in woman-authored science fiction from the 1920s to the 1960s and what Yaszek notes about woman-authored science fiction from the 1970s. This contrast implies that the work from the 1970s did clearly reflect feminist political themes. In other words, the text indicates that unlike women who wrote science fiction in the 1920s to the 1960s, the women who wrote science fiction in the 1970s expressed overtly feminist themes. Choice A is incorrect. In this context \"prudently\" would mean cautiously, which might plausibly describe the women who wrote science fiction from the 1920s to the 1960s, in that they tended to avoid revealing their political views; however, the text contrasts these authors with the women writing science fiction in the 1970s, thereby suggesting that the authors writing in the 1970s were not restrained in that way. Choice C is incorrect because in this context \"cordially\" would mean politely, and nothing in the text indicates that politeness was a significant factor for women writing science fiction either from the 1920s to the 1960s or in the 1970s. The text draws a contrast between the lack of \"deliberately signaled\" political themes in woman-authored science fiction from the 1920s to the 1960s and what Yaszek notes about woman-authored science fiction from the 1970s. It’s unclear how \"less deliberately signaled\" politics and an increasing sense of politeness toward feminism would constitute a meaningful contrast. Choice D is incorrect because in this context, \"inadvertently\" would mean unintentionally, and nothing in the text suggests that Yaszek thought the feminist elements of the woman-authored science fiction from the 1970s arose without deliberate effort."},{"i":"bcc91b1e","c":"vocab","d":"E","s":"The spacecraft OSIRIS-REx briefly made contact with the asteroid 101955 Bennu in 2020. NASA scientist Daniella DellaGiustina reports that despite facing the unexpected obstacle of a surface mostly covered in boulders, OSIRIS-REx successfully ______ a sample of the surface, gathering pieces of it to bring back to Earth.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["attached","collected","followed","replaced"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the OSIRIS-REx spacecraft’s contact with the asteroid 101955 Bennu. In this context, “collected” means acquired and took away. The text indicates that although the boulders on the asteroid’s surface caused some unforeseen problems, OSIRIS-REx was able to gather a sample to return to Earth. This context suggests that OSIRIS-REx successfully collected a sample of 101955 Bennu. Choice A is incorrect because in this context “attached” means connected or affixed. The text indicates that OSIRIS-REx gathered pieces of 101955 Bennu to bring to Earth; it doesn’t suggest that the spacecraft attached anything to the asteroid. Choice C is incorrect because in this context “followed” means tracked or traveled behind and the text discusses OSIRIS-REx’s brief encounter with 101955 Bennu during which the spacecraft gathered a sample to bring to Earth. The text doesn’t suggest that the spacecraft tracked the sample, and it’s not clear what it would mean for the spacecraft to travel behind the sample it collected. Choice D is incorrect because in this context “replaced” means put back or returned. The text indicates that OSIRIS-REx gathered pieces of 101955 Bennu to bring to Earth but doesn’t suggest that anything was returned to the asteroid."},{"i":"7b43c0cc","c":"vocab","d":"M","s":"Steiger Butte Drum, a family ensemble from the Klamath Tribes of the Pacific Northwest, collaborated with composer Michael Gordon to create Natural History, a work featuring traditional drumming and vocals alongside an orchestra and chorus. Steiger Butte Drum’s participation is ______ to the piece: members not only contributed to its composition but also must be included in all performances.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["tangential","subsequent","analogous","integral"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of Steiger Butte Drum’s contributions to the musical work Natural History. In this context, “integral” means essential or necessary to the whole. The text states that Steiger Butte Drum not only took part in the piece’s creation, collaborating with composer Michael Gordon on it, but also “must be included in all performances.” This context clearly indicates that the ensemble’s participation is essential, or integral, to the piece, both in its creation and its performance. Choice A is incorrect because in this context, “tangential” would mean peripheral or of little relevance to something. The text emphasizes the importance of Steiger Butte Drum’s involvement in both the composition and performance of Natural History, indicating their role is central, not tangential. Choice B is incorrect because in this context, “subsequent” would mean following after or coming later than something else. The text doesn’t establish a temporal sequence where the participation of Steiger Butte Drum followed after the creation of Natural History; rather, it indicates that the ensemble was involved with the piece from the beginning, having worked with Michael Gordon during the creation process. Choice C is incorrect because in this context, “analogous” would mean similar or comparable to something else, and the text doesn’t compare Steiger Butte Drum’s participation in the creation and performances of Natural History to anything else; instead, it describes the nature and importance of the ensemble’s involvement."},{"i":"84f9b577","c":"vocab","d":"E","s":"The following text is from Jhumpa Lahiri’s 2003 novel The Namesake. Gogol, a child, is at a beach in Massachusetts with his father. On the beach Gogol collects rocks, digs tunnels in the sand. He and his father wander barefoot, their pant legs rolled halfway up their calves. ©2003 by Jhumpa Lahiri As used in the text, what does the word “collects” most nearly mean?","o":["Increases","Makes","Ignores","Gathers"],"a":3,"r":"Choice D is the best answer because as used in the text, \"collects\" most nearly means gathers or accumulates. In the text, Gogol \"collects\" (or gathers) rocks and digs in the sand while strolling the beach with his father. Thus, \"gathers\" is the best answer. Choice A is incorrect because in this context, \"increases\" would mean expands or inflates, which is not something a child could logically do to rocks. Rather, the text indicates that Gogol \"collects\" or gathers rocks while strolling the beach with his father. Choice B is incorrect because in this context, \"makes\" would suggest that Gogol is creating or manufacturing rocks, which doesn’t make sense. Rather, the text indicates that Gogol \"collects\" or gathers rocks while strolling the beach with his father. Choice C is incorrect because in this context, \"ignores\" would mean disregards or avoids, but in the text Gogol \"collects rocks,\" which indicates that he’s engaging with the rocks, not ignoring them."},{"i":"1090b367","c":"purpose","d":"M","s":"Today composer Scott Joplin is mainly celebrated for his catchy ragtime pieces “Maple Leaf Rag” and “The Entertainer.” However, by overlooking his less famous works, listeners will miss the full range of Joplin’s creativity. For instance, his waltz “Pleasant Moments” and his opera Treemonisha skillfully blend ragtime and classical music. These masterpieces deserve as much fame as Joplin’s biggest hits.\n\nWhich choice best states the main purpose of the text?","o":["To describe the similarities and differences between ragtime music and opera","To argue that more attention should be given to Joplin’s lesser-known works","To encourage music lovers to listen to music by many different composers","To explain how Joplin learned to compose and perform ragtime music"],"a":1,"r":"Choice B is the best answer because it best states the main purpose of the text, which is to make a case for the importance of Scott Joplin’s less famous works. The text begins by introducing Joplin’s most popular works and then goes on to assert that gaining a full understanding of Joplin’s creativity requires a consideration of his lesser-known pieces as well. The text concludes by characterizing the lesser-known works \"Pleasant Moments\" and Treemonisha as masterpieces that deserve to be famous. These details indicate that the text’s main purpose is to argue that more attention should be given to Joplin’s lesser-known works. Choice A is incorrect. Although the text discusses some of the ragtime music and an opera that Joplin composed, it does not compare the two types of music in general. Instead, the text argues that Joplin’s lesser-known works, including his opera, deserve as much attention as his more famous ragtime pieces receive. Choice C is incorrect because the text discusses only Joplin’s music and does not ask music lovers to listen to a variety of composers. Instead, the text encourages listeners to pay attention to Joplin’s lesser-known works in order to gain a full understanding of his creativity. Choice D is incorrect because the text does not discuss how Joplin learned to compose and perform ragtime music. Instead, the text focuses on Joplin’s less famous works and makes a case for their importance."},{"i":"fb8b56bc","c":"purpose","d":"E","s":"The following text is adapted from George Bernard Shaw’s 1912 play Pygmalion. Henry Higgins has just arrived at the house of his mother (Mrs. Higgins). She is expecting her friends to visit soon. MRS. HIGGINS: I’m serious, Henry. You offend all my friends: they stop coming whenever they meet you. HIGGINS: Nonsense! I know I have no small talk; but people don’t mind. MRS. HIGGINS: Oh! don’t they? Small talk indeed! What about your large talk? Really, dear, you mustn’t stay.\n\nWhich choice best states the main purpose of the text?","o":["To describe what Henry’s mother does when she goes out with her friends","To show that Henry’s mother wants him to leave","To present a detailed account of what Henry’s home looks like","To explain why Henry often visits his mother"],"a":1,"r":"Choice B is the best answer because it most accurately states the main purpose of the text, which is to show that Henry’s mother, Mrs. Higgins, wants Henry to leave her house. In the text, Mrs. Higgins complains that Henry offends all her friends and that they stop coming when he’s also visiting. She then tells him directly, \"you mustn’t stay.\" The overall exchange conveys Mrs. Higgins’s intention for Henry to leave so as not to drive away her friends with his behavior. Choice A is incorrect because the text doesn’t indicate what Henry’s mother does when she’s out with her friends. Instead, it focuses on what goes on when Henry and her friends visit her at the same time, indicating that since her friends find Henry’s company disagreeable, she wishes him to leave before they arrive. Choice C is incorrect because the text doesn’t contain an account of what Henry’s home looks like. The setting is established as the house of Henry’s mother, and the dialogue focuses solely on her wish that Henry should depart before her friends arrive. Choice D is incorrect because the text doesn’t mention how often Henry visits his mother nor does it provide any explanation for why he visits his mother. Instead, it indicates that she thinks her friends dislike Henry and that she therefore wants him to depart before they arrive."},{"i":"1c6b1fa0","c":"func","d":"E","s":"In 1801, a Blackfoot chief named Ac Ko Mok Ki drew a finely detailed map of the Upper Missouri region. <u>This work demonstrates a vast amount of topographic knowledge, as the map features specific names of mountains and rivers, as well as the first-known sketch of the drainage network of the Missouri River.<\/u> The map is especially notable because Ac Ko Mok Ki also included details about the numerous tribes that lived in the area.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It emphasizes Ac Ko Mok Ki’s desire to represent other tribes on the map.","It explains how Ac Ko Mok Ki developed an interest in mapmaking.","It identifies some reasons why the map is impressive.","It details how the map was used for hunting and trading purposes."],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The text presents information about a map drawn by Blackfoot chief Ac Ko Mok Ki in 1801. The underlined sentence states that the map \"demonstrates a vast amount of topographic knowledge\" and mentions that it features the \"specific names of mountains and rivers\" and includes the first-known sketch of the Missouri River’s drainage network. These are all characteristics that indicate that the map was executed with remarkable skill. Thus, the underlined sentence identifies some reasons why the map is impressive. Choice A is incorrect. Though the sentence after the underlined sentence in the text mentions that Ac Ko Mok Ki included information about other tribes on his map, the underlined sentence itself does not address this topic. Choice B is incorrect because nothing in the underlined sentence indicates how Ac Ko Mok Ki became interested in mapmaking, only that his mapmaking skills are impressive. Choice D is incorrect because though the underlined sentence describes several features of the map, it does not specifically describe how the map was used."},{"i":"a2f64e58","c":"func","d":"H","s":"<u>Individual elephants and Arctic herbivores such as caribou tend to have fixed geographic ranges throughout their lifetimes,<\/u> which had prompted some researchers to speculate that the Arctic woolly mammoth, an extinct elephantid, might have exhibited similar behavior. Mammoth tusks grew in sequential layers, incorporating ingested minerals and organics, and so each ivory stratum reflects the ratio of strontium isotopes ( 87 Sr/ 86 Sr) in the local environment; thus, the sequence of strata shows where the animal roamed during life. Recent analysis of the strontium ratios in the strata of one Arctic woolly mammoth tusk in relation to the geographic distribution of strontium ratios in the environment shows the animal’s range begin to expand as it reached sexual maturity, only to contract again in its final 1.5 years.\n\nWhich choice best describes the function of the underlined statement in the text as a whole?","o":["It discusses a characteristic shared by certain animals in order to explain why researchers raised a possibility that turned out not to be supported by data described later in the text.","It illustrates a pattern of behavior among certain animals in order to present a theory about exceptions to that pattern that is weakened by a finding described later in the text.","It describes a similarity in the behavior of certain animals in order to show why a method described later in the text did not reveal whether another animal also showed that behavior.","It introduces a trait shared by certain animals in order to contextualize a hypothesis about the origin of that trait that is advanced later in the text."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined statement functions in the text as a whole. The underlined statement mentions a category of animals that have a feature in common: they tend to have fixed geographic ranges throughout their lifetimes. The text then presents the speculation of some researchers that the Arctic woolly mammoth might also share this characteristic. However, an examination of the content of strontium in the strata (or layers) of a woolly mammoth tusk indicated that contrary to the researchers’ hypothesis, the mammoth had an expanding range in its environment that contracted in its last 1.5 years of life. Thus, the underlined statement discusses a characteristic shared by certain animals in order to explain why researchers raised a possibility that turned out not to be supported by data described later in the text. Choice B is incorrect. Though the underlined statement presents a pattern of behavior (the habit of certain animals of staying within a fixed geographic range), the rest of the text does not present a theory of exceptions to that pattern; rather, the researchers are merely concerned with whether one particular animal has behavior consistent with the pattern. Choice C is incorrect. Though the underlined statement does describe a similarity in the behavior of certain animals (their tendency to stay within a fixed geographic range), this is not done in order to show why a method described later in the text failed to show whether another animal showed that behavior; rather, the method of analysis of strata of a woolly mammoth tusk showed that the mammoth’s behavior was different from that of the animals mentioned in the underlined statement. Choice D is incorrect. Though the underlined statement mentions a trait shared by a number of animals (their fixed geographic range), the rest of the text does not present a hypothesis regarding the origin of that trait; rather, the researchers are concerned with whether another particular animal shares that trait."},{"i":"eae66bf9","c":"cross","d":"M","s":"Text 1 In 2021, a team led by Amir Siraj hypothesized that the Chicxulub impactor—the object that struck the Yucatán Peninsula sixty-six million years ago, precipitating the mass extinction of the dinosaurs—was likely a member of the class of long-period comets. As evidence, Siraj cited the carbonaceous chondritic composition of samples from the Chicxulub impact crater as well as of samples obtained from long-period comet Wild 2 in 2006.\n\nText 2 Although long-period comets contain carbonaceous chondrites, asteroids are similarly rich in these materials. Furthermore, some asteroids are rich in iridium, as Natalia Artemieva points out, whereas long-period comets are not. Given the prevalence of iridium at the crater and, more broadly, in geological layers deposited worldwide following the impact, Artemieva argues that an asteroid is a more plausible candidate for the Chicxulub impactor.\n\nBased on the texts, how would Artemieva likely respond to Siraj’s hypothesis, as presented in\n\nText 1?","o":["By insisting that it overestimates how representative Wild 2 is of long-period comets as a class","By arguing that it does not account for the amount of iridium found in geological layers dating to the Chicxulub impact","By praising it for connecting the composition of Chicxulub crater samples to the composition of certain asteroids","By concurring that carbonaceous chondrites are prevalent in soil samples from sites distant from the Chicxulub crater"],"a":1,"r":"Choice B is the best answer. Siraj’s hypothesis is that the Chicxulub impactor was a long-period comet. But Artemieva points to the iridium found in the crater and in “geological layers that were deposited worldwide after the impact” as evidence that it was actually an asteroid, not a long- period comet. Choice A is incorrect. We can’t infer that this is how Artemieva would respond to Siraj’s hypothesis. Text 2 never discusses whether Wild 2 is representative of long-period comets in general. Rather, Text 2 presents Artemieva’s argument that the Chicxulub impactor was an asteroid, not a long-term comet. Choice C is incorrect. We can’t infer that this is how Artemieva would respond to Siraj’s hypothesis. Siraj’s hypothesis doesn’t make this connection: rather, Siraj hypothesizes that the Chicxulub impactor was a long-term comet. Choice D is incorrect. We can’t infer that this is how Artemieva would respond to Siraj’s hypothesis. “Soil samples from sites distant from the Chicxulub crater” is too vague. Only soil samples from sites that are connected to the impact in some way are involved in either hypothesis."},{"i":"b69d821d","c":"main","d":"H","s":"The following text is Vita Sackville-West’s circa 1920 poem “Evening.” Spars are ships’ masts, moorings are ropes that hold docked ships in place, and a riding-light is a light that a ship shines when it is anchored. When little lights in little ports come out, Quivering down through water with the stars, And all the fishing fleet of slender spars Range at their moorings, veer with tide about; When race of wind is stilled and sails are furled, And underneath our single riding-light The curve of black-ribbed deck gleams palely white, And slumbrous waters pool a slumbrous world; —Then, and then only, have I thought how sweet Old age might sink upon a windy youth, Quiet beneath the riding-light of truth, Weathered through storms, and gracious in retreat.\n\nWhich choice best states the main idea of the text?","o":["The tranquility of a port in the evening can incline a person to appreciate the stillness of old age.","The difficulty of bringing a ship into port is apt training for dealing with the types of struggles encountered in old age.","A person who leads a long life that is varied and active may find it difficult to stay in a calm place.","The contrast between the peacefulness of a port at night and its activity during the day reflects the contrast between the calm of old age and the vibrancy of youth."],"a":0,"r":"Choice A is the best answer because it best states the main idea of the text. The speaker describes an evening scene observed from a boat: \"little lights in little ports come out\" and are reflected in the water’s surface \"with the stars,\" fishing boats are moored, \"sails are furled\" (rolled up), and the riding-light is shining. The speaker emphasizes the calmness of the scene, noting that the \"race of wind is stilled\" and the atmosphere is sleepy (\"slumbrous waters pool a slumbrous world\"), and then indicates that the calmness prompts thoughts of how old age might be \"sweet\" and \"quiet\" and \"gracious in retreat\" after \"a windy youth\" with \"storms.\" Thus, the main idea is that the tranquility of a port in the evening can lead a person to appreciate the potential stillness of old age. Choice B is incorrect because the speaker isn’t discussing the difficulty of bringing a ship into port but describing the calmness of the port at night. And rather than suggesting that old age involves struggles, the speaker suggests that after \"a windy youth\" with \"storms\" to be weathered, old age will be \"sweet,\" \"quiet,\" and \"gracious\"—that is, old age will be tranquil like a port at night. Choice C is incorrect because the speaker isn’t suggesting that a person who has lived a varied and active life might find it difficult to stay in a calm place in old age. On the contrary, the speaker suggests that after a \"windy youth\" with \"storms,\" old age can be welcomed as something \"sweet,\" \"quiet,\" and \"gracious,\" just like a calm port at night. Choice D is incorrect. Although the speaker does touch on the idea of a \"windy youth\" followed by \"sweet old age,\" the speaker doesn’t tie that idea to a contrast between daytime activity and nighttime peacefulness at a port. The speaker doesn’t address any activity during the day at a port, only briefly mentioning that the \"race of wind is stilled\" at the end of the day, and instead focuses on the tranquility of the port at night and how it prompts thoughts of \"quiet\" and \"gracious\" old age."},{"i":"db2da2bf","c":"main","d":"H","s":"In 2019, 20 previously unknown moons were confirmed to be orbiting Saturn. Three of the moons have prograde orbits (orbiting in the direction the planet spins), and the other 17 have retrograde orbits (orbiting in the opposite direction of the planet’s spin). All but one of the 20 moons are thought to be remnants of bodies that orbited Saturn until they broke apart in collisions. Although the one exceptional moon orbits in the same direction as the planet’s spin, its orbit is highly eccentric compared to the rest, which may suggest that it has a different origin than the other 19 moons.\n\nBased on the text, which choice best describes the moon with the eccentric orbit?","o":["It doesn’t have a retrograde orbit, but it likely has the same origin as the moons with retrograde orbits.","Its orbit is so tilted with respect to the other moons’ orbits that it’s neither prograde nor retrograde.","It has a prograde orbit that is likely the result of having collided with another body orbiting Saturn.","It has a prograde orbit and may not be a remnant of an earlier body that orbited Saturn."],"a":3,"r":"Choice D is the best answer because it most accurately describes the moon with the eccentric orbit. The text indicates that three of the 20 newly discovered moons have prograde orbits, meaning that they orbit Saturn in the same direction as the planet’s spin, while the other 17 moons have retrograde orbits, meaning that they orbit Saturn in the opposite direction of the planet’s spin. The text then states that 19 of the 20 moons appear to be the remains of earlier bodies that orbited Saturn but were broken apart in collisions. The one exception is a moon that orbits Saturn in the same direction as the planet’s spin, meaning that the exceptional moon’s orbit is prograde. The text goes on to state that the exceptional moon’s orbit is so eccentric that the moon may have formed through a different process than the other 19 moons. The moon with the eccentric orbit, therefore, has a prograde orbit and may not be a remnant of an earlier body that orbited Saturn. Choice A is incorrect because nothing in the text supports the idea that the moon with the eccentric orbit likely has the same origin as the moons with retrograde orbits. Although it’s true that the moon has a prograde orbit (and thus doesn’t have a retrograde orbit), the only information the text provides about the moon’s origin is that it may be different than the origin of the other 19 moons. Choice B is incorrect because the text states that the moon in question orbits Saturn in the same direction as the planet’s spin, meaning that the moon’s orbit is prograde, not that its orbit is neither prograde nor retrograde. Choice C is incorrect because the text merely notes that the moon in question has a prograde orbit without giving any indication of what likely caused that orbit."},{"i":"b4da6aaf","c":"infer","d":"E","s":"The musical Hadestown was produced off-Broadway in New York in 2016. A revised version of the musical premiered on Broadway in 2019, in a larger production. In a review of the Broadway production, theater critic Jesse Green enthusiastically praised the musical’s storytelling. However, Green also explained that he had seen the earlier version of Hadestown in 2016 and had found the storytelling to be very confusing. This suggests that in Green’s view, ______ Which choice most logically completes the text?","o":["the 2016 version of Hadestown had fewer storytelling problems than the 2019 version did.","Hadestown should have had a larger production in 2019 than it actually did.","the 2019 version of Hadestown was less enjoyable than the 2016 version.","Hadestown improved greatly between 2016 and its premiere on Broadway."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of critic Jesse Green’s review of the 2016 and 2019 productions of Hadestown. The text states that Green found the storytelling in the 2016 off-Broadway version to be \"very confusing\" but that he \"enthusiastically praised\" the storytelling in the revised 2019 Broadway version. This stark contrast in Green’s opinions suggests that he believed the musical had significantly improved between 2016 and its 2019 Broadway premiere. Choice A is incorrect because it contradicts the information in the text. The text indicates that Green found the storytelling in the 2016 version to be \"very confusing,\" while he \"enthusiastically praised\" the storytelling in the 2019 version. This suggests that the 2019 version had fewer, not more, storytelling problems. Choice B is incorrect because the text doesn’t provide any information about Green’s opinion on the size of the 2019 Broadway production. While it mentions that the 2019 production was larger than the 2016 production, there’s no indication in the text that Green thought the 2019 production should have been even larger than it was. Choice C is incorrect because it contradicts the information in the text. The text’s description of Green’s enthusiastic praise for the 2019 production suggests that he found this version more enjoyable, not less enjoyable, than the 2016 version, which he described as \"very confusing.\""},{"i":"25fc2534","c":"infer","d":"M","s":"Marine archaeologists have found much of the wooden hull of a sixteenth-century ship in a flooded quarry in southeast England. When it is exposed to air and water, wood rots quickly unless it is protected by sediment that shields it from oxygen. Therefore, the discovered ship was likely ______ Which choice most logically completes the text?","o":["covered by a protective sediment layer in the quarry.","one of several other ships buried in the same quarry.","a confirmation of previous theories about the type of wood that was used in sixteenth-century ships.","first constructed much earlier than previously thought."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the discovered ship. The text states that much of the ship’s wooden hull was found in a quarry. The text also states that wood rots quickly unless it is protected by sediment, which shields the wood from exposure to oxygen. It is therefore reasonable to infer that the surviving portion of the ship’s hull was covered by an oxygen-shielding layer of sediment. Choice B is incorrect because nothing in the text suggests other ships have been or are likely to be found in the same quarry. The fact that much of this ship’s wood survived for centuries in the quarry does raise the possibility that there might be other preserved ships, but the text provides no support for such a conclusion. Choice C is incorrect because the text does not address the type of wood used in sixteenth-century ships or any theories pertaining to wood choice in ships. Choice D is incorrect because the text states only that the ship is from the sixteenth century, with no other dates offered for its construction, and thus there is no basis to consider alternative ages for the ship. Additionally, even if the ship was constructed earlier, it is not logically connected to the text’s discussion of how it was preserved."},{"i":"29cde5fa","c":"claim","d":"M","s":"“Mr. Cornelius Johnson, Office-Seeker” is a 1900 short story by Paul Laurence Dunbar. In the story, the narrator describes Mr. Cornelius Johnson’s appearance as conveying his exaggerated sense of his importance: ______ Which quotation from “Mr. Cornelius Johnson, Office-Seeker” most effectively illustrates the claim?","o":["“He carried himself always as if he were passing under his own triumphal arch.”","“The grey Prince Albert was scrupulously buttoned about his form, and a shiny top hat replaced the felt of the afternoon.”","“It was a beautiful day in balmy May and the sun shone pleasantly on Mr. Cornelius Johnson’s very spruce Prince Albert suit of grey as he alighted from the train in Washington.”","“Mr. Cornelius Johnson always spoke in a large and important tone.”"],"a":0,"r":"Choice A is the best answer. This quote most effectively illustrates the claim. The claim is that the narrator describes Mr. Johnson as arrogant and self-important. This basically says that Mr. Johnson always looks like he’s congratulating himself for something, which definitely supports the idea that Mr. Johnson is arrogant! . Choice B is incorrect. This quote doesn’t illustrate the claim. The claim is that the narrator describes Mr. Johnson’s appearance as conveying his arrogance. This describes his appearance, but the description doesn’t suggest a sense of arrogance. Choice C is incorrect. This quote doesn’t illustrate the claim. The claim is that the narrator describes Mr. Johnson’s appearance as conveying his arrogance. This doesn’t describe Mr. Johnson’s appearance very much, and it doesn’t suggest a sense of arrogance. Choice D is incorrect. This quote doesn’t effectively illustrate the claim. It describes Mr. Johnson’s tone of voice as “large and important,” but it doesn’t describe his appearance as conveying a sense of self- importance."},{"i":"0113152f","c":"claim","d":"E","s":"American fashion designer Patrick Kelly was known for his love of colorful buttons. Many of his signature dresses feature bold assortments of buttons throughout the garment. In a paper, a fashion design student claims that Kelly’s use of buttons as decoration was inspired by his childhood observations of the styles and actions of the women in his family.\n\nWhich quotation from a work by a historian would be the most effective evidence for the student to include in support of this claim?","o":["“Although some of the assortments of buttons appear to be mismatched pieces scattered randomly throughout Kelly’s dresses, his most famous designs feature carefully crafted patterns of matching buttons.”","“Many of Kelly’s contemporaries were inspired by his designs to incorporate buttons, as well as zippers and snaps, as decorative items in their work.”","“Kelly’s grandmother, who would repair clothing when he was a child, frequently added mismatched buttons to the clothes to draw attention away from any flaws in the garments.”","“Kelly was destined to be a designer from a young age: he learned how to sew clothing from his aunt Bertha, and his love of drawing was developed by his mother.”"],"a":2,"r":"Choice C is the best answer. This quotation draws a direct connection between the use of buttons and Kelly’s stylish female relatives. Choice A is incorrect. This choice mentions Kelly’s use of buttons, but it doesn’t connect that design choice to the influence of women in Kelly’s family. Choice B is incorrect. This choice discusses how other designers were inspired by Kelly, which doesn’t provide evidence that Kelly was inspired by his family. Choice D is incorrect. While this choice does refer to fashionable women in Kelly’s family, it doesn’t connect their influence to Kelly’s use of buttons."},{"i":"56f477fb","c":"graph","d":"H","s":"","o":["Provisioning services represent 73% of the services reported for the West region and 33% of those for the Central region, but they represent 75% of the services reported overall.","None of the percentages shown for provisioning services are lower than 33%, and the overall percentage shown for provisioning services is 75%.","Provisioning services are shown for each region, while no cultural services are shown for some regions.","The greatest percentage shown for provisioning services is 88% for the North region, and the least shown for provisioning services is 33% for the Central region."],"a":1,"r":"Choice B is the best answer. The finding that all the regions reported at least some effects on provisioning services supports the first part of the assertion. And the fact that provisioning services comprise 75% of the reported services overall supports the second part of the assertion. Choice A is incorrect. This choice doesn’t fully support the assertion. It doesn’t include the finding that all the regions (not just Central and West) reported at least some effects on provisioning services. Choice C is incorrect. This choice doesn’t fully support the assertion. It doesn’t demonstrate that provisioning services represent the majority of the reported services overall. Choice D is incorrect. This choice doesn’t fully support the assertion. It doesn’t demonstrate that provisioning services represent the majority of the reported services overall."},{"i":"e2829dd7","c":"graph","d":"M","s":"","o":["the four groups of mice differed greatly in their activity levels before treatment but showed identical activity levels at the end of the monitoring period.","saline-treated females showed substantially more activity at certain points in the monitoring period than saline-treated males did.","CNO-treated females showed more activity relative to saline-treated females than CNO-treated males showed relative to saline-treated males.","CNO-treated females showed a substantial increase and then decline in activity over the monitoring period, whereas CNO-treated males showed a substantial decline in activity followed by a steep increase."],"a":2,"r":"Choice C is the best answer. The graph shows that the CNO-treated females were way more active than the CNO-treated males, while the saline- treated males and females (the control groups) had very similar activity levels. This supports the claim that there were sex-specific differences in the mice’s response to neuron activation. Choice A is incorrect. This choice misreads the graph. All four groups of mice started at nearly the same activity level before treatment (see how all four points are very close together at -4 minutes, meaning four minutes before treatment). Choice B is incorrect. This choice doesn’t complete the assertion. The assertion is about the mice’s response to neuron activation, so we need to include the data about the CNO-treated females and males. Choice D is incorrect. This choice misreads the graph. The line for the CNO-treated males does not show a “substantial decline” until around 122 minutes, and there is no “steep increase” afterward."},{"i":"77bf77cd","c":"fss","d":"E","s":"Farouk El-Baz, a geologist and space scientist, ______ part of the team that selected the lunar landing sites for the Apollo program during the 1960s and 1970s.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are","was","have been","were"],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-verb agreement. The singular verb \"was\" agrees in number with the singular subject \"Farouk El-Baz.\" Choice A is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"Farouk El-Baz.\" Choice C is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"Farouk El-Baz.\" Choice D is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"Farouk El-Baz.\""},{"i":"2c49940e","c":"fss","d":"M","s":"French philosopher René Descartes doubted whether he could prove his own existence. Eventually, he found proof in his famous phrase “I think, therefore I am.” The ______ complexity: only those who exist would be able to ponder their existence.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["phrases’ simplicity masks its","phrases simplicity masks their","phrase’s simplicity masks their","phrase’s simplicity masks its"],"a":3,"r":"Choice D is the best answer. The conventions being tested are the use of possessive nouns and the use of possessive determiners. The singular possessive noun \"phrase’s\" correctly indicates that there is only one simple phrase. The singular possessive determiner \"its\" agrees in number with the singular possessive noun \"phrase’s,\" reinforcing the idea that there is only one simple yet complex phrase. Choice A is incorrect because the context requires the singular possessive noun \"phrase’s,\" not the plural possessive noun \"phrases’.\" Choice B is incorrect because the context requires the singular possessive noun \"phrase’s\" and the corresponding singular possessive determiner \"its,\" not the plural noun \"phrases\" and the corresponding plural possessive determiner \"their.\" Choice C is incorrect because the context requires the singular possessive determiner \"its,\" not the plural possessive determiner \"their.\""},{"i":"2b6e1c06","c":"fss","d":"H","s":"A government body officially known as the Althing, ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["the world’s oldest parliaments include one which first met in 930 CE, Iceland’s.","Iceland’s parliament is one of the oldest in the world, first meeting in 930 CE.","the first meeting of one of the oldest parliaments in the world, Iceland’s, was in 930 CE.","930 CE was the year when Iceland’s parliament, one of the oldest parliaments in the world, first met."],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"Iceland’s parliament\" the subject of the sentence and places it immediately after the modifying phrase \"a government body officially known as the Althing.\" In doing so, this choice clearly establishes that Iceland’s parliament—and not another noun in the sentence—is the government body known as the Althing. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase \"the world’s oldest parliaments\" immediately after the modifying phrase illogically suggests that the world’s oldest parliaments are a government body known as the Althing. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase \"the first meeting\" immediately after the modifying phrase illogically suggests that the first meeting of Iceland’s parliament was a government body known as the Althing. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase \"930 CE\" immediately after the modifying phrase illogically suggests that the year 930 CE is a government body known as the Althing."},{"i":"04bfd364","c":"bound","d":"E","s":"The intense pressure found in the deep ocean can affect the structure of proteins in fish’s cells, distorting the proteins’ shape. The chemical trimethylamine N-oxide (TMAO) counters this effect, ensuring that proteins retain their original ______ is found in high concentrations in the cells of the deepest-dwelling fish.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["configurations. TMAO","configurations TMAO","configurations, TMAO","configurations and TMAO"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “configurations” is used correctly to mark the boundary between one sentence (“The intense…configurations”) and another (“TMAO…fish”). The supplementary phrase (“ensuring…configurations”) modifies the main clause of the first sentence (“The chemical…effect”), and “TMAO” is the subject of the second sentence. Choice B is incorrect because it results in a run-on sentence. The sentences (“The intense…configurations” and “TMAO…fish”) are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice D is incorrect. Without a comma preceding it, the conjunction “and” can’t be used in this way to join sentences."},{"i":"a7c85001","c":"bound","d":"E","s":"Researchers Amit Kumar and Nicholas Epley investigated how ______ In a series of experiments conducted in 2022, they found that people performing small acts of kindness underestimated the positive effect their actions had on others.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["do people perceive acts of kindness.","do people perceive acts of kindness?","people perceive acts of kindness?","people perceive acts of kindness."],"a":3,"r":"Choice D is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a period to punctuate a declarative sentence that asks an indirect question (\"Researchers Amit Kumar and Nicholas Epley investigated how people perceive acts of kindness\"). Choice A is incorrect. The structure of the sentence requires a declarative clause at the end of the sentence that states what Kumar and Epley did, not an interrogative clause that asks a direct question, such as \"how do people perceive acts of kindness.\" Choice B is incorrect. The structure of the sentence requires a declarative clause at the end of the sentence that states what Kumar and Epley did, not an interrogative clause that asks a direct question, such as \"how do people perceive acts of kindness?\" Choice C is incorrect. It’s unconventional to use a question mark in this way to punctuate a declarative sentence that asks an indirect question, such as \"Researchers…kindness.\""},{"i":"2c61e0b9","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: British musicians John Lennon and Paul McCartney shared writing credit for numerous Beatles songs. Many Lennon-McCartney songs were actually written by either Lennon or McCartney, not by both. The exact authorship of specific parts of many Beatles songs, such as the verse for “In My Life,” is disputed. Mark Glickman, Jason Brown, and Ryan Song used statistical methods to analyze the musical content of Beatles songs. They concluded that there is 18.9% probability that McCartney wrote the verse for “In My Life,” stating that the verse is “consistent with Lennon’s songwriting style.” The student wants to make a generalization about the kind of study conducted by Glickman, Brown, and Song.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Based on statistical analysis, Glickman, Brown, and Song claim that John Lennon wrote the verse of “In My Life.”","There is only an 18.9% probability that Paul McCartney wrote the verse for “In My Life”; John Lennon is the more likely author.","It is likely that John Lennon, not Paul McCartney, wrote the verse for “In My Life.”","Researchers have used statistical methods to address questions of authorship within the field of music."],"a":3,"r":"Choice D is the best answer. The sentence uses information from the notes to make a generalization about the kind of study Glickman, Brown, and Song conducted. Specifically, the sentence indicates that the study was of a kind that used statistical methods to address questions of authorship within the field of music. Choice A is incorrect because the sentence summarizes the methodology and findings of a particular analysis of a single song; it doesn’t make a generalization about the kind of study conducted. Choice B is incorrect because the sentence mentions the data and conclusion of a particular analysis of a single song; it doesn’t make a generalization about the kind of study conducted. Choice C is incorrect because the sentence focuses on a specific conclusion from a particular analysis of a single song; it doesn’t make a generalization about the kind of study conducted."},{"i":"0778b4ac","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Chromosomes are cellular structures that contain genes. Genes carry critical instructions for determining an organism’s physical traits. Members of the same species typically have the same number of chromosomes. The pineapple (Ananas comosus) and the melon (Cucumis melo) are species of fruits. The pineapple has fifty chromosomes. The melon has twenty-four chromosomes. The student wants to specify how many chromosomes the pineapple has.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The pineapple’s chromosomes contain genes, which are critical to determining an organism’s physical traits.","The pineapple (Ananas comosus) has fifty chromosomes.","The pineapple (Ananas comosus) and the melon (Cucumis melo) both have chromosomes, but the pineapple has more than the melon does.","The melon, a species of fruit, has twenty-four structures called chromosomes."],"a":1,"r":"Choice B is the best answer. The sentence directly specifies how many chromosomes the pineapple has, as indicated in the notes: fifty. Choice A is incorrect. While the sentence mentions the pineapple’s chromosomes, it doesn’t specify how many it has. Choice C is incorrect. The sentence indicates that the pineapple has more chromosomes than the melon; it doesn’t specify the exact number of chromosomes the pineapple has. Choice D is incorrect. The sentence specifies how many chromosomes the melon has, not how many the pineapple has."},{"i":"d54e16ee","c":"trans","d":"M","s":"Originally coined by economist Joan Robinson to refer to markets with multiple sellers of a product but only one buyer, the term “monopsony” can also refer to markets where demand for labor is limited. In a product monopsony, the single buyer can force sellers to lower their prices. ______ in a labor monopsony, employers can force workers to accept lower wages.\n\nWhich choice completes the text with the most logical transition?","o":["Earlier,","Instead,","Similarly,","In particular,"],"a":2,"r":"Choice C is the best answer. “Similarly” logically signals that the information in this sentence about a labor monopsony is similar to the information in the previous sentence about a product monopsony. In both types of markets, one party (an employer or a buyer) has the power to force another party (a worker or seller) to accept less money (for labor or products). Choice A is incorrect because “earlier” illogically signals that the information in this sentence about a labor monopsony occurs earlier (in a chronological sequence) than the information about a product monopsony. Instead, it is similar to the information about a product monopsony. Choice B is incorrect because “instead” illogically signals that the information in this sentence about a labor monopsony is an alternative to the previous information about a product monopsony. Instead, it is similar to the information about a product monopsony. Choice D is incorrect because “in particular” illogically signals that the information in this sentence about a labor monopsony provides specific details elaborating on the previous information about a product monopsony. Instead, it is similar to the information about a product monopsony."},{"i":"63c73b50","c":"trans","d":"E","s":"In 2018, Kurt Luther and Vikram Mohanty created the web-based tool Civil War Photo Sleuth (CWPS). A user uploading an unknown Civil War soldier’s photograph to CWPS first tags the photo with all known information. ______ CWPS’s facial-recognition software analyzes twenty-seven different physical features and looks for matches to tagged images already in the database.\n\nWhich choice completes the text with the most logical transition?","o":["Then,","In fact,","Likewise,","For example,"],"a":0,"r":"Choice A is the best answer. “Then” indicates that the events in this sentence took place after the events in the previous sentence. Only after users upload images of unknown soldiers can those images be analyzed. Choice B is incorrect. This transition is used to emphasize the truth of a statement that modifies the previous statement. But this sentence doesn’t modify the step described in the previous statement: instead, it introduces an entirely new step in the process. So “in fact” wouldn’t make sense here. Choice C is incorrect. This choice uses a transition that indicates the addition of a new but related idea, which doesn’t make sense here. Analyzing the physical features in the uploaded photographs isn’t a similar idea, but rather the next step in the process. Choice D is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. Analyzing physical features is not an example of uploading and tagging an image."},{"i":"47547d07","c":"trans","d":"E","s":"In June, female loggerhead sea turtles will swim back to the sandy beaches where they were born to lay eggs of their own. First, the turtle will dig her nest in the sand. ______ she will lay up to 100 eggs in the nest. Finally, she will cover it all with sand, before returning to the ocean.\n\nWhich choice completes the text with the most logical transition?","o":["By contrast,","Similarly,","Next,","For example,"],"a":2,"r":"Choice C is the best answer. “Next” logically signals that the egg laying in this sentence is the next step in the sequence of events described in the other sentences. Choice A is incorrect because “by contrast” illogically signals that the egg laying in this sentence contrasts with the nest digging in the previous sentence. Instead, the egg laying follows the nest digging as the next step in the sequence of events. Choice B is incorrect because “similarly” illogically signals that the egg laying in this sentence is similar to the nest digging in the previous sentence. Though the two actions are related, they are not similar. Instead, the egg laying follows the nest digging as the next step in the sequence of events. Choice D is incorrect because “for example” illogically signals that the egg laying in this sentence is an example of the nest digging in the previous sentence. Instead, the egg laying follows the nest digging as the next step in the sequence of events."}],"img":{"56f477fb":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFVBAMAAAD/NyGnAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABQMElEQVR42u1dd3gTx9N+91TcrT3b9OKzTa9nsOlFNi2EAKKnUEwLoQUZ0ugCQgslAhKaKaIXQxCQUEwTNXRErzayIVSXk2lu0n1/2AabGCzxwyHOp3l4sHSa3dt9d25vZnZ2FnCQgxzkIAc5yEEO+rcQ8QNo1kcJl/UhJ0MXDl7+by7/6iea4yoF6Y+uOfl8KAn8O9/LO3m9ukqymxNS+NGlB26G4xAADmjopgIAwrnlAEFylbol3FLmHpJXH0smbM3+uPrVVeYecT4sPUZBM2sGUB3EmFn4SY6aSmff5cwDml2zXJN10fQfkN4dkqvgSSfpTiZA6jqCZ6iX82EJfHjGP4SCqY0S2+CmAoI4lOMRRHnC+fDVw0kt4h/EhABjsQFSlXctP7CBqA1JCKSBgCwFjeaU3EZqA83kO2g5DuXagsSGMpShJM4riPBQSnlIOcYfElIbcNNUGx6ghA8PCUd4JoSU44ELoQyV0EIOL7rTQ6UiBj6ufO0Ll2vHncOqVn1Rndm4QXbtBPBJhKrxfbipII9aK929Q7b76BqXCRt2zdpeNTJszKxFkTwdykuZqB2Nt48kq1a7HN/aPYqbEcXRUqOV4w9Xf15yk7rqxunxASeOyE7sA3m4qY6uKk9ix8wK3+4ycc9OZuOuUq35acX3aIjrVqbug+NM1J+SqF1ybfclQVG/g9zYXEdXlS/s8H5ML34tnbjWTdvDbUKvkuom8jnVXfRN6x5sQnG1aKzLNrg9PuGhHuU+p6ebrv9ij85CpfqqDTLjjHJPy6hR4rHSRdekB19GZrjc1O/oRVftUyeednfVVFO76kZLTGMDLq7xUA9x14wFuVt6pakHSFxEEdNCj9Cw9jKhXhMX7aXu7F1I9q1yWdG+uK6p06FPnPSXnRfruoL85bbyfPcC7j5T4AAzjHXf4fEZRC/gXCQE0SoKrO5k03PnKHMj/qI1kZDpozz1U7jlm1tVf7y16b7NA88bpcdROuZWPHC/7QJFo5+tRiHUgJK3m5Q4IoxcYhJCeNVtWAXvExLX6BoW2l1NDcsJiX+QeLkaoEhPEC5yZ8to3TZ/JGR4JQREKmDplhZyYG9go9ney/4g5mJrXKu5QnycZr3bpHDDS0U0TaL3+mw1i5SK1FukIAIoLzFQSlELCkJF7N3HcoyJY293Gbh/ZtLkDAVXpqUqFgyA/scXPDn6JYcX8wyJAfB/0UXz+24l26SXPxHAlW3VwwucIKzpArCiFRK6qyqIwBL8tljWuR37rVvZDLctnl82RjH3IT2pn9fRrgKFFakDZrUaCBDQdZULN7yCT73WSB7sWdOHwEz6hgmdwsVyXjc7dYwFEazH6iYABJ2axXRaZG0WdqM3Yy0lOxir6HDQX0WJJ8OhYrMmGf7lzCTDz+C9ovmWuz4hh+Pos2cDdlEQweDHH2mxtZylVp2ESeFgigebVrpDpBReSVWTkyc+Ox+XLF4wGLw64Mmk5uf6dtjkFWzpNITxveRXRRMHUqmucbulkE8Oh+d+grNLf+l1tJop3vKgVepD94znGW4bvkwyWgT0nqu2GsWM1tMr
