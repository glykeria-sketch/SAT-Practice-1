<script>
const D={"t":"Practicetest69","q":[{"i":"49bbe4d7","c":"vocab","d":"E","s":"For painter Jacob Lawrence, being ______ was an important part of the artistic process. Because he paid close attention to all the details of his Harlem neighborhood, Lawrence’s artwork captured nuances in the beauty and vitality of the Black experience during the Harlem Renaissance and the Great Migration.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["skeptical","observant","critical","confident"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Jacob Lawrence’s artistic process. In this context, “observant” means watchful and perceptive. The text emphasizes that the “close attention” Lawrence paid to “all the details” of his neighborhood allowed him to reflect subtle elements of “the beauty and vitality of the Black experience” in his artwork. This context indicates that being observant of his surroundings was an important part of Lawrence’s work as an artist. Choice A is incorrect because the text gives no indication that Lawrence was “skeptical,” or had an attitude of doubt in general or about particular things, let alone that skepticism was important to him as an artist. Rather than indicating that he was skeptical, the text focuses on how Lawrence paid careful attention to everything around him and reflected his observations in his artwork. Choice C is incorrect because the text gives no indication that Lawrence was “critical,” which in this context would mean inclined to criticize harshly or unfairly. Rather than indicating that Lawrence found fault in things, the text suggests that he paid careful attention to everything around him and that his artwork reflects this careful attention. Choice D is incorrect because the text doesn’t suggest that Lawrence was “confident,” or self-assured. Rather than addressing how Lawrence felt about himself and how that feeling affected his artistic process, the text emphasizes the careful attention Lawrence paid to everything around him—attention that allowed him to capture subtle elements of a particular place and time in his artwork."},{"i":"3d658a5a","c":"vocab","d":"H","s":"Some foraging models predict that the distance bees travel when foraging will decline as floral density increases, but biologists Shalene Jha and Claire Kremen showed that bees’ behavior is inconsistent with this prediction if flowers in dense patches are ______: bees will forage beyond patches of low species richness to acquire multiple resource types.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["depleted","homogeneous","immature","dispersed"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Jha and Kremen’s finding about bees’ foraging behavior. In this context, “homogeneous” means uniform or of the same kind. The text indicates that some models predict that the distance that bees travel when they’re foraging declines as the density of flowers increases. The text goes on to say, however, that Jha and Kremen identified a circumstance in which bees don’t behave this way. Specifically, if bees encounter “patches of low species richness”—that is, patches in which the flowers are largely from the same species—they’ll travel beyond those patches to get varied food resources. This context thus suggests that bees don’t behave as some models predict if the dense patches of flowers the bees encounter are homogeneous. Choice A is incorrect because the text indicates that Jha and Kremen found that bees will behave differently than some models predict if the bees encounter flower patches that are not rich in species, not if the flowers are “depleted,” or emptied or reduced in quality or quantity. Although it could be true that bees are likely to leave depleted patches in search of more resources, the text doesn’t indicate that Jha and Kremen investigated that possibility. Choice C is incorrect because there’s no information in the text suggesting that bees will not behave as some models predict if flowers in patches are “immature,” or not fully developed. Instead, the text indicates that Jha and Kremen found that bees will behave contrary to some models’ predictions if the flower patches are not rich in species. Choice D is incorrect because the text indicates that bees’ behavior will be inconsistent with the predictions of some models if the flower patches that the bees encounter are of low species richness, not if the flowers are in patches that are “dispersed,” or widely scattered. Although the text does describe bees as leaving patches that are not rich in species to forage elsewhere, there’s no suggestion that Jha and Kremen found that the distance between dense flower patches affects whether the bees behave as some models predict."},{"i":"5514fd1f","c":"vocab","d":"E","s":"Archaeologist Erika Karuzas works with the Confederated Salish and Kootenai Tribes of Montana to preserve culturally significant sites. In 2015 they decided that creating a new national trail connecting many of these sites would ______ their preservation efforts, because the US government provides some protections to national trails that aren’t given to other areas.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["inspire","ignore","promote","reduce"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the preservation efforts undertaken by Erika Karuzas and the Confederated Salish and Kootenai Tribes of Montana. In this context, \"promote\" means play a part in the success or growth of something or someone. The text indicates that Karuzas and the Confederated Salish and Kootenai Tribes work to preserve culturally important sites. It goes on to say that their decision to create a national trail connecting the sites was motivated by the fact that such a trail would receive protections from the US government that the sites wouldn’t otherwise receive. Thus, such a decision would promote the preservation efforts. Choice A is incorrect because \"inspire\" means motivate or influence, which wouldn’t make sense in context. The text establishes that Karuzas and the Confederated Salish and Kootenai Tribes of Montana work to preserve culturally significant sites and that their decision to create a new national trail occurred as a result of a desire to add protections to the sites that they wouldn’t otherwise receive. Thus, creating the trail wouldn’t inspire the efforts to preserve the sites; instead, it would promote the efforts. Choice B is incorrect because \"ignore\" means overlook, which wouldn’t make sense in context. The text indicates that Karuzas and the Confederated Salish and Kootenai Tribes of Montana work to preserve culturally significant sites and that they decided to create a national trail connecting the sites because such a trail would receive protections from the US government that the sites wouldn’t otherwise receive. Thus, the creation of the trail would promote, not ignore, the preservation efforts. Choice D is incorrect because \"reduce\" means decrease or restrict, which wouldn’t make sense in context. The text indicates that Karuzas and the Confederated Salish and Kootenai Tribes of Montana work to preserve culturally significant sites and that they decided to create a national trail connecting the sites because such a trail would receive protections from the US government that the sites wouldn’t otherwise receive. The decision would therefore promote, not reduce, the preservation efforts."},{"i":"359b891c","c":"vocab","d":"E","s":"Painter Alma W. Thomas was fascinated by the colors and shapes found in nature. The flowers and trees in the garden at her home in Washington, DC, ______ her work. For example, Thomas’s use of broken brushstrokes was inspired by the way that light would shine through the leaves of a tree in front of her house.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["restricted","announced","distracted","influenced"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of painter Alma W. Thomas’s work. In this context, \"influenced\" means to have had an effect on something’s development. The text indicates that there is a connection between Thomas’s work and the flowers and trees in her home’s garden, giving the example of Thomas’s brushstrokes being inspired by light shining through the leaves of a tree in front of her house. This context conveys that Thomas’s work was influenced by the flowers and trees in the garden. Choice A is incorrect because the text conveys that Thomas drew inspiration for her work from the plants in her garden, which suggests that the flowers and trees contributed positively to her work, not that they \"restricted,\" or limited, her work. Choice B is incorrect because it wouldn’t make sense to suggest that flowers and trees in a garden could have \"announced,\" or made known, a painter’s work. Choice C is incorrect because the text conveys that Thomas drew inspiration for her work from the plants in her garden, which suggests that the flowers and trees contributed positively to her work, not that they were a distraction. Further, it’s not clear how an artist’s work could itself be \"distracted.\""},{"i":"c0e1b70a","c":"purpose","d":"M","s":"The following text is adapted from Etsu Inagaki Sugimoto’s 1925 memoir A Daughter of the Samurai. As a young woman, Sugimoto moved from feudal Japan to the United States. The standards of my own and my adopted country differed so widely in some ways, and my love for both lands was so sincere, that sometimes I had an odd feeling of standing upon a cloud in space, and gazing with measuring eyes upon two separate worlds. At first I was continually trying to explain, by Japanese standards, all the queer things that came every day before my surprised eyes; for no one seemed to know the origin or significance of even the most familiar customs, nor why they existed and were followed.\n\nWhich choice best describes the main purpose of the text?","o":["To convey the narrator’s experience of observing and making sense of differences between two cultures she embraces","To establish the narrator’s hope of forming connections with new companions by sharing customs she learned as a child","To reveal the narrator’s recognition that she is hesitant to ask questions about certain aspects of a culture she is newly encountering","To emphasize the narrator’s wonder at discovering that the physical distance between two countries is greater than she had expected"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text. The narrator asserts that she loves both her “own” country (Japan) and her “adopted country” (the United States) even though the two countries differ “widely.” She also indicates that, at first, she would try to explain unfamiliar experiences that she had in the United States using the standards ingrained in her from growing up in Japan. Thus, the main purpose of the text is to convey the narrator’s experience of observing and making sense of the differences between two cultures she embraces. Choice B is incorrect because the text makes no reference to possible companions. Although the text does indicate that the narrator sometimes used the cultural framework she acquired growing up in Japan to explain some experiences she’s had, there is no suggestion that this was in service of making friends. And although “no one seemed to know” strongly implies that the narrator has interacted with other people in the United States, there is no indication that these conversations involved her discussing Japanese customs. Choice C is incorrect because nothing in the text suggests that the narrator was hesitant to ask questions. In fact, the narrator indicates that “no one seemed to know the origin” of various customs, which provides evidence that, rather than being hesitant, she sought information from several people. Choice D is incorrect because the text makes no reference to the physical distance between Japan and the United States. Although the narrator indicates that the two countries differ “widely” and likens them to “two separate worlds,” these descriptions relate to cultural aspects of the countries and the narrator’s feelings about the two countries, not the physical distance between them."},{"i":"1782cdd7","c":"purpose","d":"E","s":"In many agricultural environments, the banks of streams are kept forested to protect water quality, but it’s been unclear what effects these forests may have on stream biodiversity. To investigate the issue, biologist Xingli Giam and colleagues studied an Indonesian oil palm plantation, comparing the species richness of forested streams with that of nonforested streams. Giam and colleagues found that species richness was significantly higher in forested streams, a finding the researchers attribute to the role leaf litter plays in sheltering fish from predators and providing food resources.\n\nWhich choice best states the main purpose of the text?","o":["It discusses research intended to settle a debate about how agricultural yields can be increased without negative effects on water quality.","It explains the differences between stream-protection strategies used in oil palm plantations and stream-protection strategies used in other kinds of agricultural environments.","It describes findings that challenge a previously held view about how fish that inhabit streams in agricultural environments attempt to avoid predators.","It presents a study that addresses an unresolved question about the presence of forests along streams in agricultural environments."],"a":3,"r":"Choice D is the best answer. The author first describes an unresolved question: what effect do bank forests have on stream biodiversity? Then the author presents a study that answers the question: bank forests increase stream biodiversity. Choice A is incorrect. This isn’t the main purpose of the text. The text never mentions agricultural yields. Choice B is incorrect. This isn’t the main purpose of the text. The text never mentions other kinds of agricultural environments. Choice C is incorrect. This isn’t the main purpose of the text. The text never mentions any previously held view about how fish in these streams try to avoid predators."},{"i":"ea9dfe27","c":"func","d":"E","s":"The following text is from Joan Didion’s memoir The Year of Magical Thinking. In the text, the author discusses her home life. [I]n California we heated our houses by building fires. We built fires even on summer evenings, because the fog came in. <u>Fires said we were home, we had drawn the circle, we were safe through the night.<\/u> ©2005 by Joan Didion Which choice best describes the function of the underlined portion in the text as a whole?","o":["It illustrates that a fire provides comfort beyond physical warmth.","It summarizes the information that came before it in the text.","It explains that the house remains cold even in summer.","It suggests that the author feels comfortable in her home with or without a fire."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first two sentences of the text establish that in California, houses were heated by building fires year-round. The underlined portion then indicates that the fires didn’t merely provide physical warmth: they also represented being \"home\" and feeling protected. The underlined portion thus illustrates that a fire provides comfort beyond physical warmth. Choice B is incorrect because the underlined portion doesn’t summarize information that came before it. Whereas the previous two sentences describe fires’ ability to provide physical warmth to homes, the underlined portion focuses on the psychological comfort the fires offered. Choice C is incorrect. Although the text’s second sentence mentions that fires were built in the summer because fog came in, which may have cooled the house, this detail isn’t the focus of the underlined portion. Instead, the underlined portion indicates that fires were built for reasons beyond physical warmth: to create a sense of being home and safe. Choice D is incorrect because the underlined portion focuses on the emotional significance the author places on having a fire going inside the home. There is no indication that the author feels equally comfortable without a fire present."},{"i":"1b5d4e3e","c":"func","d":"E","s":"Were penguins always flightless? <u>Theresa Cole and her team argue that penguins could fly at some point, but that they lost that ability more than 60 million years ago as they adapted to marine life.<\/u> After examining various penguin fossils and genetic information, the researchers concluded that over time penguins developed underwater vision, blood oxygenation, and bone density better suited for swimming than flying. Thus, environmental conditions might have driven penguins to change from flyers to swimmers.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It defines a scientific term used in the sentence that follows.","It contradicts a description in the sentence that follows.","It provides an answer to the question in the previous sentence.","It notes that the question in the previous sentence has not been researched."],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The text begins with a question: have penguins always been unable to fly? The underlined sentence then presents an answer that has been offered by researchers, indicating that Theresa Cole and her team believe that penguins were once able to fly but lost that ability long ago as they began living in the sea. The text then describes the research that led to that answer. Thus, the function of the underlined sentence is to provide an answer to the question in the previous sentence. Choice A is incorrect because none of the terms used in the sentence that follows are defined in the underlined sentence; no definitions are given at all. Instead, the sentence presents Theresa Cole and her team’s answer to the earlier question about penguins’ ability to fly. Choice B is incorrect because there is no contradiction between the underlined sentence and the sentence that follows since both convey that at some point penguins underwent adaptations that limited their ability to fly and helped them swim and live in the sea. Instead of contradicting later information, the underlined sentence presents an answer to the earlier question about penguins’ ability to fly. Choice D is incorrect because the question in the previous sentence is about penguins’ ability to fly and the underlined sentence presents Theresa Cole and her team’s answer to that question based on their research into penguin flight, which is described in the rest of the text."},{"i":"27d9bb69","c":"cross","d":"M","s":"Text 1 Many studies in psychology have shown that people seek out information even when they know in advance that they have no immediate use for it and that they won’t directly benefit from it. Such findings support the consensus view among researchers of curiosity: namely, that curiosity is not instrumental but instead represents a drive to acquire information for its own sake.\n\nText 2 While acknowledging that acquiring information is a powerful motivator, Rachit Dubey and colleagues ran an experiment to test whether emphasizing the usefulness of scientific information could increase curiosity about it. They found that when research involving rats and fruit flies was presented as having medical applications for humans, participants expressed greater interest in learning about it than when the research was not presented as useful.\n\nBased on the texts, how would Dubey and colleagues (Text 2) most likely respond to the consensus view discussed in\n\nText 1?","o":["By suggesting that curiosity may not be exclusively motivated by the desire to merely acquire information","By conceding that people may seek out information that serves no immediate purpose only because they think they can use it later","By pointing out that it is challenging to determine when information-seeking serves no goal beyond acquiring information","By disputing the idea that curiosity can help explain apparently purposeless information-seeking behaviors"],"a":0,"r":"Choice A is the best answer. The researchers in Text 2 recognize that acquiring information is a powerful motivator, but showed that this motivation can still be affected by other factors, like whether or not the information is expected to be useful or not. This suggests that other desires may play a part in driving people to acquire information. Choice B is incorrect. The consensus view in Text 1 is that people acquire information regardless of whether they think they can use it later. Dubey and colleagues acknowledge this fact (so they don’t claim people seek out information “only” because it might be useful later). Choice C is incorrect. This choice misreads the results of Dubey and colleagues’ study in Text 2. Neither text discusses the difficulty of determining the motivation for information-seeking. Choice D is incorrect. This choice contradicts Text 2, which starts with Dubey and colleagues “acknowledging that acquiring information is a powerful motivator” (i.e., agreeing that curiosity explains the seeking of apparently purposeless information). The research in Text 2 simply suggests that more than just curiosity can motivate information-seeking behavior when the information has a purpose."},{"i":"2592e0de","c":"main","d":"E","s":"Bicycles were first mass-produced in the late nineteenth century throughout Europe and North America, allowing individuals remarkable freedom to travel longer distances quickly and comfortably. This freedom, coupled with the affordability of the vehicle, made the bicycle immensely popular. Individuals were able to live farther from their workplaces, easily visit neighboring towns, and participate in new leisure and sport activities. Bicycling quickly became a popular social endeavor, with enthusiasts forming local cycling clubs to enjoy these newfound activities with others.\n\nWhich choice best states the main idea of the text?","o":["The widespread adoption of the bicycle in the late nineteenth century provided new opportunities for people.","The affordability of the bicycle in the late nineteenth century made it the preferred way to travel.","The popularity of the bicycle in the late nineteenth century gave rise to the first cycling clubs.","The mass production of the bicycle in the late nineteenth century made it safer for people to use."],"a":0,"r":"Choice A is the best answer. The text discusses how the mass production of bicycles in the late nineteenth century allowed people to travel longer distances, live farther from their workplaces, visit neighboring towns, and participate in new activities and social clubs. All of these are new opportunities that were provided by the widespread adoption of the bicycle. Choice B is incorrect. The text never says this. It does say that the bicycle was “affordable,” and that the “freedom to travel longer distances quickly and comfortably” made the bicycle “popular,” but it never says that the bicycle was more popular than any other way of traveling (like cars or trains or horses). Choice C is incorrect. This is a detail mentioned in the text, but not the main idea. Cycling clubs are only one of the new opportunities that arose from the popularity of the mass-produced bicycle. A “main idea” should capture more of the information in the text. Choice D is incorrect. The text never says this. It doesn’t mention the safety of the mass-produced bicycle at all."},{"i":"78b265b2","c":"main","d":"E","s":"In 2014, Amelia Quon and her team at NASA set out to build a helicopter capable of flying on Mars. Because Mars’s atmosphere is only one percent as dense as Earth’s, the air of Mars would not provide enough resistance to the rotating blades of a standard helicopter for the aircraft to stay aloft. For five years, Quon’s team tested designs in a lab that mimicked Mars’s atmospheric conditions. The craft the team ultimately designed can fly on Mars because its blades are longer and rotate faster than those of a helicopter of the same size built for Earth.\n\nAccording to the text, why would a helicopter built for Earth be unable to fly on Mars?","o":["Because Mars and Earth have different atmospheric conditions","Because the blades of helicopters built for Earth are too large to work on Mars","Because the gravity of Mars is much weaker than the gravity of Earth","Because helicopters built for Earth are too small to handle the conditions on Mars"],"a":0,"r":"Choice A is the best answer because it presents an explanation about a helicopter that is directly supported by the text. The text states that Mars’s atmosphere is much less dense than Earth’s, and as a result, the air on Mars doesn’t provide the resistance required to support the blades of a helicopter built for Earth and to keep the helicopter aloft. In other words, a helicopter built for Earth can’t fly on Mars because of the differences in the two planets’ atmospheres. Choice B is incorrect because instead of stating that the blades of helicopters built for Earth are too large to work on Mars, the text indicates that the helicopter built to fly on Mars actually has even longer blades than a helicopter built for Earth. Choice C is incorrect because the text never addresses the role of gravity on Mars or on Earth; instead, it focuses on atmospheric conditions. Choice D is incorrect because the text doesn’t indicate that helicopters built for Earth are too small to operate in the conditions on Mars. In fact, the text states that the size of the helicopter built to fly on Mars is the same size as a helicopter built for Earth, even though it has longer blades that rotate faster."},{"i":"6409016a","c":"infer","d":"M","s":"The Household, Income and Labour Dynamics in Australia Survey (HILDA) examines trends in economic well-being among 25,000 people in Australia unfolding over many years. As is true of most longitudinal studies, this need for years of data collection results in high costs. By contrast, a relatively straightforward fitness study, such as one that is merely trying to identify the percentage of regular exercisers in a city who do weight training, may not need a large budget because ______ Which choice most logically completes the text?","o":["longitudinal methods are probably suitable for the fitness study.","it would be easy for HILDA researchers to add questions to their economic well-being study.","25,000 people is more than enough for HILDA to find trends in economic well-being.","the fitness study can be done well without years of data collection."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the costs of studies. The text indicates that HILDA is a longitudinal study—it involves repeated observations over a long time—and that the \"need for years of data collection\" is what causes it and most other longitudinal studies to have high costs. The text then contrasts such studies with more straightforward studies, using the example of a fitness study that wants only to find out how many regular exercisers in a particular location do weight training, that may not demand a large budget. The contrast emphasized in the text most directly suggests that the fitness study may cost less than a study like HILDA because the fitness study aims only to determine a current percentage and thus can be completed well without extending data collection over years. Choice A is incorrect because the text explicitly introduces the idea of a less expensive, straightforward fitness study as a contrast to many longitudinal studies that, like HILDA, have high costs because they require data collection over many years. The fitness study is described as trying merely to gather information about a current behavior (how many regular exercisers do weight training) rather than track trends over time, which suggests that costs could remain low because expensive longitudinal methods would not be needed, not because they would be suitable. Choice B is incorrect because the idea that HILDA researchers could easily add questions to their study might be relevant to the costs of that survey but would be completely irrelevant as an explanation for why an unrelated fitness study may not need a large budget; the studies have no direct bearing on each other. Choice C is incorrect because the idea that HILDA involves more people than necessary would be relevant to the costs of that survey but would be completely irrelevant as an explanation for why an unrelated fitness study may not need a large budget; the studies have no direct bearing on each other."},{"i":"72cbdbc6","c":"infer","d":"E","s":"Researchers Eugeni Vidal-Tortosa and Robin Lovelace looked at the relationship between street lighting in a city and people’s willingness to ride a bicycle. Their results suggest that poor street lighting can deter new or inexperienced cyclists from riding in a city but has little effect on experienced cyclists. Therefore, increasing the number of streetlights in a city could potentially ______ Which choice most logically completes the text?","o":["decrease the number of new or inexperienced cyclists riding in the city.","increase the number of experienced cyclists riding in the city.","decrease the number of experienced cyclists riding in the city.","increase the number of new or inexperienced cyclists riding in the city."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the relationship between street lighting and people’s cycling behavior. According to the text, Eugeni Vidal-Tortosa and Robin Lovelace found that poor street lighting deters new or inexperienced cyclists from riding their bikes in a city but has little effect on experienced cyclists. This finding establishes a causal relationship between street lighting and the willingness of new or inexperienced cyclists to ride a bicycle in the city: if poor lighting discourages new or inexperienced cyclists from riding, then improving lighting conditions by increasing the number of streetlights would logically remove this deterrent, potentially leading to an increase in the number of new or inexperienced cyclists willing to ride in the city. Choice A is incorrect because it contradicts the logical relationship established in the text. If poor street lighting deters new or inexperienced cyclists from riding in the city, then increasing the number of streetlights (improving lighting conditions) would be expected to encourage more of these cyclists to ride, not decrease their numbers. Choice B is incorrect because the text explicitly states that street lighting didn’t have an effect on experienced cyclists. If lighting conditions don’t significantly influence experienced cyclists’ decisions to ride, then increasing the number of streetlights wouldn’t necessarily increase the number of experienced cyclists riding in the city. Choice C is incorrect. The text indicates that street lighting didn’t affect experienced cyclists, so increasing the number of streetlights wouldn’t decrease the participation of these cyclists. Instead, their numbers would be expected to remain about the same."},{"i":"068f939b","c":"claim","d":"H","s":"The ancient Greek concept of “mimesis,” a term used in the works of Plato, Aristotle, and other Greek philosophers in discussions of representational art—visual, performance, or literary art that aims to depict the real world—is a foundational concept of the Western philosophy of aesthetics. Mimesis is typically translated as “imitation” in modern editions of ancient Greek texts, but scholar Stephen Halliwell warns that this is overly reductive: “imitation” implies that art merely copies—and is thus by definition entirely derivative of—a reality that exists outside and prior to the work of art, and translating “mimesis” thusly obscures the multifaceted ways in which the ancient Greeks understood the relationship between art and reality.\n\nWhich statement, if true, would most directly support the claim by Halliwell presented in the text?","o":["One of the earliest appearances of mimesis’s root word, mimos, can be found in an ancient Greek tragedy in reference to dramatic impersonation, and the mim- root came to be generally associated with the musical and poetic arts by the fifth century BCE.","Both Plato’s and Aristotle’s theorizations of mimesis examine the psychological effects that works of art induce in the viewer or listener.","Although several of Plato’s earliest philosophical works discuss aesthetic ideas, the term “mimesis” doesn’t appear in Plato’s discussions of art until Cratylus, a relatively late work.","Although Plato’s writings typically characterize representational art as an inferior reflection of the physical world, Aristotle suggests that mimesis can refer to art’s capacity to envision hypothetical conditions that could, but don’t yet, exist."],"a":3,"r":"Choice D is the best answer because it presents a statement that would support Halliwell’s claim that \"imitation\" is an overly simplified translation of the word \"mimesis\" in the context of ancient Greek philosophical discussions of representational art and that, because it suggests a view of art as merely copying things that exist in reality, the translation obscures the fact that Plato, Aristotle, and other ancient Greeks understood the relationship between art and reality in varied ways. If Plato’s works tend to treat representational art as an inferior or inadequate reflection of the physical world (consistent with the idea of mere imitation), while Aristotle’s works suggest that the term \"mimesis\" can refer to art’s ability to show conditions that don’t currently exist but could exist (going beyond imitation into novel creation), that evidence would support the claim that the term \"mimesis\" means more than just \"imitation\" and that ancient Greek philosophers held different views of the relationship between art and reality. Choice A is incorrect because information about the root word mimos first being used in drama and the root mim- coming to be associated with music and poetry wouldn’t indicate anything about the meaning of the specific term \"mimesis\" as it was used by ancient Greek philosophers in discussions of representational art; thus, the information would have no bearing on Halliwell’s claim that a common translation of the specific term is an oversimplification. Choice B is incorrect because the issue of art’s psychological effects on audiences gets at how people respond to works of art instead of how art itself is related to reality, so the idea that Plato and Aristotle both addressed such effects in their considerations of mimesis wouldn’t have any bearing on Halliwell’s claim that a common translation of that term oversimplifies the relationship between art and reality. Further, this idea would touch on one general similarity in approaches to mimesis instead of illustrating the multifaceted, or varied, ways Halliwell claims ancient Greek philosophers understood art’s relation to reality. Choice C is incorrect because the idea that Plato discussed aesthetics in his early works but didn’t use the term \"mimesis\" until later doesn’t give any indication of how Plato or any other ancient Greek philosophers understood the relation between art and reality, so it would have no bearing on Halliwell’s claim that a common translation of the term \"mimesis\" is oversimplified and fails to reflect the varied ways the philosophers understood that relationship."},{"i":"67b59a67","c":"claim","d":"M","s":"Plants like potatoes, tomatoes, and soybeans are susceptible to bacterial wilt disease caused by the bacteria Ralstonia solanacearum. A multinational team of scientists led by Zhong Wei studied whether other microbes in the soil might influence the degree to which plants are affected by the disease. The team sampled soil surrounding individual tomato plants over time and compared the results of plants that became diseased with those that remained healthy. They concluded that the presence of certain microbes in the soil might explain the difference between healthy and diseased plants.\n\nWhich finding, if true, would most directly support the team’s conclusion?","o":["The soil surrounding healthy plants contained significantly higher concentrations of microbes known to inhibit Ralstonia solanacearum than the soil surrounding diseased plants did.","The soil surrounding the plants contained high concentrations of Ralstonia solanacearum regardless of whether the plants were affected by wilt disease.","The soil surrounding healthy plants tended to have significantly higher moisture levels than the soil surrounding diseased plants did.","By the end of the experiment, over half the plants had been affected by wilt disease regardless of differences in the types and concentrations of microbes in the surrounding soil."],"a":0,"r":"Choice A is the best answer. This choice provides evidence that directly links the presence of R. solanacearum-inhibiting microbes in the soil to the health of tomato plants. Choice B is incorrect. This choice would weaken the team’s conclusion. It suggests that the presence of the disease-causing bacteria had no effect on the health of the tomato plants. Choice C is incorrect. This choice doesn’t support the team’s conclusion. The conclusion is about microbes, not soil moisture. Choice D is incorrect. This choice would weaken the team’s conclusion. It suggests that the presence of the bacteria-inhibiting microbe in soil had no effect on the health of the tomato plants."},{"i":"35ec767c","c":"graph","d":"H","s":"","o":["the origins of vocabulary pertaining to the crop vary across languages in the region, with the words for corn in Cherokee and the Muskogean languages showing no demonstrable relationship to Totozoquean vocabulary.","the region is linguistically diverse, being home not only to Chitimacha and Caddo, but also to the Muskogean language family (including Chickasaw, Choctaw, and Muscogee) and to one Iroquoian language (Cherokee).","corn-related vocabulary underwent changes when entering other, unrelated languages, as can be seen by the divergence of the Caddo word from the Chitimacha word it originated in.","words for corn in the languages of the Muskogean family evolved from a common root, with the Muscogee word having lost certain consonant sounds still present in the Chickasaw and Choctaw words."],"a":0,"r":"Choice A is the best answer. The table provides evidence that the words for corn in the Cherokee and Muskogean languages appear unrelated to those in Caddo language, which is described as closely related to the Totozoquean language family. This supports the claim that corn cultivation spread across the Southeast without necessarily spreading Totozoquean vocabulary along with it. Choice B is incorrect. This choice emphasizes the diversity of Southeastern languages in general, but we’re specifically looking for information about words associated with corn. Choice C is incorrect. This choice shows how words for corn can change and evolve, but we’re looking for an example that shows how some words for corn can be completely unrelated. Choice D is incorrect. This choice shows words for corn that share a common root, but we’re looking for an example that shows how some words for corn can be unrelated."},{"i":"7edfb2c5","c":"graph","d":"M","s":"","o":["Artifacts K5_106 and K3_9 were exposed to temperatures above 400°C.","Artifacts L5_239 and K3_18 were exposed to temperatures of approximately 550°C and 650°C, respectively.","All of the artifacts were exposed to temperatures above 100°C.","Artifact K3_9 was exposed to a higher temperature than was artifact K5_106."],"a":1,"r":"Choice B is the best answer. Campfires typically reach over 400°C, so human artifacts that were exposed to temperatures higher than this may indicate some human control over fire. Choice A is incorrect. This choice misreads the graph. Neither artifact K3_9 nor K5_106 was exposed to temperatures above even 200°C. Choice C is incorrect. This choice doesn’t support the claim. Campfires typically reach over 400°C, so exposure to temperatures of 100°C wouldn’t demonstrate exposure to fire. Choice D is incorrect. This choice doesn’t support the claim. Both artifacts K3_9 and K5_106 were exposed to temperatures of less than 200°C. Since campfires typically reach over 400°C, this wouldn’t demonstrate exposure to fire."},{"i":"9eb43963","c":"fss","d":"M","s":"Water in the North Atlantic Ocean is pushed eastward by powerful winds, but the rotation of Earth and interference from nearby landmasses together cause ______ to swirl into a massive, churning whirlpool—also called the North Atlantic Gyre—that spins clockwise.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["these","those","them","it"],"a":3,"r":"Choice D is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"water\" and clearly indicates that the water swirls into a whirlpool. Choice A is incorrect. The plural pronoun \"these\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water—not another plural noun in the sentence, such as \"landmasses\" or \"winds\"—swirls into a whirlpool. Choice B is incorrect. The plural pronoun \"those\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water—not another plural noun in the sentence, such as \"landmasses\" or \"winds\"—swirls into a whirlpool. Choice C is incorrect. The plural pronoun \"them\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water—not another plural noun in the sentence, such as \"landmasses\" or \"winds\"—swirls into a whirlpool."},{"i":"c52652c9","c":"fss","d":"E","s":"The human brain is primed to recognize faces—so much so that, due to a perceptual tendency called pareidolia, ______ will even find faces in clouds, wooden doors, pieces of fruit, and other faceless inanimate objects. Researcher Susan Magsamen has focused her work on better understanding this everyday phenomenon.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["she","they","it","those"],"a":2,"r":"Choice C is the best answer. \"It\" is a singular pronoun used to stand in for objects. Since the antecedent in this case is the singular noun phrase \"the human brain,\" \"it\" is a perfect pronoun to use here. Choice A is incorrect. Although \"she\" is a singular pronoun, it is reserved for people and animals, not objects like \"the human brain.\" Choice B is incorrect. \"They\" is a plural pronoun, but we need a singular pronoun to represent the antecedent \"the human brain.\" Choice D is incorrect. \"Those\" is a plural pronoun, but we need a singular pronoun to represent the antecedent \"the human brain.\""},{"i":"f4fd123c","c":"fss","d":"H","s":"The African Games Co-production Market, one of over 180 annual international conferences supporting video game development, ______ the growth of the African gaming industry by helping start-up studios in Africa find partners.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["promote","are promoting","promotes","have promoted"],"a":2,"r":"Choice C is the best answer. The subject of the sentence is “The African Games Co-production Market.” That’s one market, so it’s a singular noun, which means it needs a singular verb. “Promotes” is the only singular verb among the choices. Choice A is incorrect. This choice creates a subject-verb agreement error. The subject “The African Games Co-production Market” is singular, but the verb “promote” is plural. Choice B is incorrect. This choice creates a subject-verb agreement error. The subject “The African Games Co- production Market” is singular, but the verb “are promoting” is plural. Choice D is incorrect. This choice creates a subject-verb agreement error. The subject “The African Games Co-production Market” is singular, but the verb “have promoted” is plural."},{"i":"e3c1b4f7","c":"bound","d":"H","s":"Digital artist Jung (Lulu) Chen primarily uses a suite of software tools to create illustrations for children’s books. To manifest the warm and welcoming atmospheres that are a signature of her ______ she occasionally relies on more traditional art techniques, such as painting with watercolors.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["work, though,","work, though","work; though,","work, though;"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. The comma after \"work\" pairs with the comma after \"though\" to separate the supplementary element \"though\" from the rest of the sentence. This supplementary element signals that what follows is an exception to Chen using software tools to create illustrations, and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice B is incorrect because the comma after \"work\" must be paired with a comma after \"though\" to separate the supplementary element from the rest of the sentence. Choice C is incorrect because a semicolon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because a semicolon can’t be paired with a comma in this way to separate the supplementary element from the rest of the sentence."},{"i":"70ced8dc","c":"bound","d":"E","s":"Typically, underlines, scribbles, and notes left in the margins by a former owner lower a book’s ______ when the former owner is a famous poet like Walt Whitman, such markings, known as marginalia, can be a gold mine to literary scholars.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["value, but","value","value,","value but"],"a":0,"r":"Choice A is the best answer. The convention being tested is the coordination of independent clauses within a sentence. An independent clause is a phrase containing a subject and a verb that can stand on its own as a sentence. This choice uses a comma and the coordinating conjunction “but” to join the first independent clause (“underlines…lower a book’s value”) and the second independent clause (“such markings…can be a gold mine to scholars”) to create a compound sentence. Choice B is incorrect because it results in a run-on sentence. The two independent clauses are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between two independent clauses. Choice D is incorrect because a comma is needed to mark the boundary between two coordinated independent clauses."},{"i":"86b78078","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Samuel Selvon was a Trinidadian author. The Lonely Londoners is one of his most celebrated novels. Selvon published the novel in 1956. It is about a group of men who emigrate from the Caribbean to Great Britain after World War II. Some of The Lonely Londoners’ characters also appear in Selvon’s later novel Moses Ascending. The student wants to introduce Samuel Selvon and his novel The Lonely Londoners to a new audience.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In 1956, Trinidadian author Samuel Selvon published one of his most celebrated novels, The Lonely Londoners, which is about a group of men who emigrate from the Caribbean to Great Britain after World War II.","Samuel Selvon wrote the novel Moses Ascending after he wrote The Lonely Londoners.","The Lonely Londoners, a celebrated novel that was published in 1956, depicts post–World War II Caribbean migration from the perspective of a Trinidadian author.","Some of the characters who appear in Samuel Selvon’s Moses Ascending also appear in The Lonely Londoners."],"a":0,"r":"Choice A is the best answer. By noting that Selvon is a Trinidadian author and indicating that The Lonely Londoners, published in 1956, is about a group of men who emigrate from the Caribbean to Great Britain after World War II, the sentence effectively introduces Samuel Selvon and his novel to a new audience. Choice B is incorrect. The sentence indicates the order in which two of Selvon’s novels were written; it doesn’t introduce Samuel Selvon and The Lonely Londoners to a new audience. Choice C is incorrect. While the sentence describes the novel The Lonely Londoners, it doesn’t mention its author, Samuel Selvon, by name and thus doesn’t effectively introduce him to a new audience. Choice D is incorrect. The sentence indicates that two of Selvon’s novels include the same characters; it doesn’t introduce Samuel Selvon and The Lonely Londoners to a new audience."},{"i":"23da9791","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Scientists have long sought to determine the origin of glass in Chile’s Atacama Desert. A 2017 study concluded that ancient grass fires had melted the area’s sandy soil into glass. In 2021, a different study revealed that the mineral signatures of glass samples were consistent with the mineral signatures of comet samples collected by NASA. That study concluded that the glass had formed as a result of a cometary explosion close to the desert’s surface. The student wants to describe how scientific understanding about the glass’s origin has evolved.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Scientists have long sought to determine the origin of the glass, with one study concluding that it formed when ancient grass fires melted the area’s sandy soil.","Studies in 2017 and 2021 offered different explanations for the origin of the glass.","Mineral signatures of glass samples are consistent with those of comet samples collected by NASA, according to new research.","A 2017 study concluded that ancient grass fires had caused the glass’s formation, but new research suggests that the glass formed as a result of a cometary explosion close to the desert’s surface."],"a":3,"r":"Choice D is the best answer. The sentence describes how scientific understanding of the glass’s origin has evolved, explaining that new research suggests the glass formed as a result of a cometary explosion instead of being caused by grass fires (as was previously believed). Choice A is incorrect. The sentence explains the conclusion of the older study; it doesn’t describe how scientific understanding of the glass’s origin has evolved. Choice B is incorrect. While the sentence indicates that the two studies provided different explanations, it doesn’t describe how scientific understanding of the glass’s origin has evolved. Choice C is incorrect. The sentence references a recent finding but doesn’t effectively describe how scientific understanding of the glass’s origin has evolved."},{"i":"82ec9628","c":"trans","d":"M","s":"Archaeologist Sue Brunning explains why the seventh-century ship burial site at Sutton Hoo in England was likely the tomb of a king. First, the gold artifacts inside the ship suggest that the person buried with them was a wealthy and respected leader. ______ the massive effort required to bury the ship would likely only have been undertaken for a king.\n\nWhich choice completes the text with the most logical transition?","o":["Instead,","Still,","Specifically,","Second,"],"a":3,"r":"Choice D is the best answer. “Second” logically signals that the information in this sentence—that the effort to bury the ship would likely only have been made for a king—joins the information in the previous sentence (“first…”) in supporting Brunning’s claim that the burial site was likely the tomb of a king. Choice A is incorrect because “instead” illogically signals that the information in this sentence presents an alternative or substitute to the previous information about the gold artifacts inside the ship. Rather, this sentence presents a second piece of information that supports Brunning’s claim. Choice B is incorrect because “still” illogically signals that the information in this sentence exists in contrast to or despite the previous information about the gold artifacts inside the ship. Instead, this sentence presents a second piece of information that supports Brunning’s claim. Choice C is incorrect because “specifically” illogically signals that the information in this sentence specifies or elaborates on the previous information about the gold artifacts inside the ship. Instead, this sentence presents a second piece of information that supports Brunning’s claim."},{"i":"29ae4d48","c":"trans","d":"M","s":"In the early 1970s, Albert Popa took up graffiti art, spraying his work onto what was at the time an unconventional surface: concrete. ______ Albert’s son David has chosen an unusual canvas for his new art project, Fractured. In this remarkable work, the artist draws charcoal faces onto fragmented ice floes in Finland, creating the visual effect of a face slowly fracturing.\n\nWhich choice completes the text with the most logical transition?","o":["However,","Indeed,","Second,","Likewise,"],"a":3,"r":"Choice D is the best answer. \"Likewise\" logically signals that the information about Albert’s son David is similar to the previous information about Albert Popa. Both artists have used unconventional surfaces for their work: Albert used concrete, and David is using ice floes. Choice A is incorrect because \"however\" illogically signals that the information about David contrasts with the previous information about Albert Popa. Instead, it is similar to the previous information about Albert Popa. Choice B is incorrect because \"indeed\" illogically signals that the information about David emphasizes or strengthens the previous point about Albert Popa. Instead, it is similar to the previous information; it highlights a similarity between father and son. Choice C is incorrect because \"second\" illogically signals that the information about David is a second point or reason separate from the previous information about Albert Popa. Instead, it is similar to the previous information; it highlights a similarity between father and son."},{"i":"ecb31049","c":"trans","d":"H","s":"The Sun and other stars are powered by nuclear fusion reactions, in which two atoms collide to form a single heavier atom, releasing energy. Scientists have long believed that fusion has the potential to meet humanity’s clean energy needs. ______ prior to December 2022, no fusion reaction in a laboratory setting had ever generated a net energy gain.\n\nWhich choice completes the text with the most logical transition?","o":["For this reason,","Moreover,","Specifically,","That said,"],"a":3,"r":"Choice D is the best answer. Scientists believe in fusion’s potential as an energy source, but have struggled to actually make it work—in other words, there is a contradiction between scientists’ beliefs and their reality. “That said” is a disagreement transition that works perfectly in this context. Choice A is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. Scientists not being able to generate extra energy from lab fusion reactions isn’t an effect of them believing in fusion’s potential. Choice B is incorrect. This transition indicates the addition of another supporting point. But this sentence is not adding a supporting point to the previous sentence—scientists not being able to successfully generate energy from fusion isn’t another point in favor of fusion meeting humanity’s clean energy needs. Choice C is incorrect. This choice uses a transition that introduces or elaborates on a particular example. But this sentence doesn’t give an example of scientists’ belief in fusion’s potential to meet humanity’s clean energy needs—in fact, it contrasts that optimistic belief with the reality of past failures to successfully employ fusion for energy production."}],"img":{"35ec767c":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFeBAMAAACV8NFkAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABgPUlEQVR42u1dd0BUx/P/7LtC5/YAe+FRTOw+wF4PNfZymmiM0XimWZJvRI0aSxLsNXpo7A17j1ijqPFU7IXD3pDDXrk9rJS7/f1xqIigIJiQ/Jg/9Hhld/az82ZnZmd3gQIqoAIqoAIqoAIqoPxGAn35m6gpAM+XV/xAAPLidjAAkMAXtykAkLT/kb4gn5dF0Eyrpf9P0N11gb5orOrBAQDuFIAIgKAVXMIx78XD8QCA/S/+XgIAbSThDAAIES9LrXslNA1nsXW6yl6CLhifd8QrUJP/Gryu+lLDZRri4esbBJQS22pkGndRLim3Un9Kg76DzEjPIAgIgjxAva8hRCJGoRFR+4tEhOThD7jqFEahIXx9JdIQPlQi7YE/hQPwlATqUWxxK381qkIeDHmw5yrRUxT8BC8RghFoBA85RVCgDL6oKsLfF4VEoeF/C97KVKabOJdW3rJmrZa4UTft0O2lfLf/6ZTkFbm50OGjwBl5jNPhMKftYZNWqy+u1ex10J922TG8YuQiZy1O1ZsUBoeI4vpJczTzpxkqzA2ZKRhbrdHSSOqv2L7FRWpR+Wz9SRsdI0MnrpEmRha6H7x6a+XNJVdHEcGA8ocXu60+pTx/yEXsrDyyRH4kUnYkqsI87X8K3noUssSSofU1B8saqPuYtR7xJf/nq2sgbHLTznXvO4FgorO+fsDNBj5R3V1DbhY3nHQwbHEQrrlrzrhLuNbG9yrIyVLix04R2/2NRxSWFTLjWkUIWl4US434xVXb1UFf3/d0G5zpXjLkkaM0yyGicheN
