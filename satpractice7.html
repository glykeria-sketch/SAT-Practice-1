<script>
const D={"t":"SATPractice7","q":[{"i":"cf9a3f34","c":"vocab","d":"E","s":"The following text is adapted from Elizabeth von Arnim’s 1922 novel The Enchanted April. Mrs. Wilkins and her friend Rose are traveling in Italy. “I’m going to have one of these gorgeous oranges,” said Mrs. Wilkins, staying where she was and reaching across to a black bowl piled with them. “Rose, how can you resist them. Look—have this one. Do have this beauty—” And she held out a big one.\n\nAs used in the text, what does the phrase “reaching across to” most nearly mean?","o":["Joining with","Gaining on","Stretching toward","Arriving at"],"a":2,"r":"Choice C is the best answer because as used in the text \"reaching across to\" most nearly means stretching toward. The text begins with Mrs. Wilkins stating that she wants to have one of the oranges that she’s admiring. The text then indicates that Mrs. Wilkins, staying where she is, holds out a big orange to her friend. This context suggests that when the text describes Mrs. Wilkins as reaching across to the bowl of oranges, it means that she is stretching toward the bowl. Choice A is incorrect because the text never suggests that Mrs. Wilkins is joining with, or becoming attached to, the bowl of oranges. Rather, the text indicates that she is stretching toward the bowl so she can pick out oranges for herself and her friend Rose to eat. Choice B is incorrect because the text never suggests that Mrs. Wilkins is gaining on, or overtaking in a competition or race, the bowl of oranges. The text suggests instead that the bowl is sitting still on a surface and that Mrs. Wilkins is extending her arm toward the bowl so she can pick out oranges for herself and her friend Rose to eat. Choice D is incorrect because the text doesn’t indicate that Mrs. Wilkins is arriving at the bowl of oranges. In fact, the text states that Mrs. Wilkins stays where she is when reaching across to the bowl, meaning that she remains at a distance from it."},{"i":"c977cfcf","c":"vocab","d":"M","s":"According to a team of neuroeconomists from the University of Zurich, ease of decision making may be linked to communication between two brain regions, the prefrontal cortex and the parietal cortex. Individuals tend to be more decisive if the information flow between the regions is intensified, whereas they make choices more slowly when information flow is ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["reduced","evaluated","determined","acquired"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of how the flow of information between two regions of the brain may affect the ease of people’s decision making. In this context, \"reduced\" means decreased. The text presents the finding from a team of neuroeconomists that decision making may be connected to communication between the prefrontal cortex and the parietal cortex. In presenting this finding, the text suggests a contrast between people who tend to be more decisive and people who make decisions more slowly. According to the text, people tend to be more decisive when the flow of information between the two brain regions is intensified, or strengthened. On the other hand, this context suggests that people make choices more slowly when the flow of information between the two brain regions is decreased. Choice B is incorrect because \"evaluated\" means assessed, which wouldn’t make sense in context. According to the text, people tend to be more decisive when the flow of information between two brain regions is intensified, or strengthened. This suggests that people’s ease of decision making varies based on the rate of information traveling between the regions, not based on an effort to assess the information. Choice C is incorrect because \"determined\" means judged or influenced, neither of which would make sense in context. According to the text, people tend to be more decisive when the flow of information between two brain regions is intensified, or strengthened. This suggests that people’s ease of decision making varies based on the rate of information traveling between the regions, not based on an effort to judge or influence the information. Choice D is incorrect because \"acquired\" means developed or attained, neither of which would make sense in context. According to the text, people tend to be more decisive when the flow of information between two brain regions is intensified, or strengthened. This suggests that people’s ease of decision making varies based on the rate of information traveling between the regions, not based on the development or attainment of the information."},{"i":"1c7fe9be","c":"vocab","d":"M","s":"At the turn of the twentieth century, Black residents of Richmond, Virginia, had few formal options for banking and other financial services. To ______ this situation, Maggie Lena Walker chartered the St. Luke Penny Savings Bank in 1903. The bank went on to provide home loans and savings opportunities to thousands of Black families over the following decades.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["prolong","rectify","retain","highlight"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of how Maggie Lena Walker addressed the lack of financial services available to Black residents in Richmond, Virginia, at the turn of the twentieth century. In this context, \"rectify\" means to correct or remedy something undesirable. The text indicates that by chartering the St. Luke Penny Savings Bank in 1903, Walker took action to provide local Black residents with greater access to financial services like home loans and savings opportunities. This context supports the idea that she aimed to rectify the undesirable situation affecting these residents. Choice A is incorrect because in this context, \"prolong\" would mean to lengthen something in time. The text indicates that at the turn of the twentieth century, Black residents in Richmond, Virginia, were faced with a lack of formal banking options. The text then states that Walker founded a new bank that provided these residents with financial services. Therefore, instead of prolonging the situation, she took steps to rectify, or correct, it. Choice C is incorrect because in this context, \"retain\" would mean to continue to have or to keep something. According to the text, at the turn of the twentieth century, Black residents in Richmond, Virginia, had few formal banking options, and Walker chartered a new institution to provide these residents with expanded financial services; therefore, she took steps to rectify, not retain, the situation. Choice D is incorrect because in this context, \"highlight\" would mean to emphasize or call attention to something, but the text indicates that Walker took concrete steps beyond merely drawing attention to the situation Black residents were facing in Richmond, Virginia, at the turn of the twentieth century. According to the text, Walker worked to rectify, or correct, the lack of formal banking options that were available to these residents by establishing a bank that provided them with home loans and savings opportunities."},{"i":"83687083","c":"vocab","d":"E","s":"Due to their often strange images, highly experimental syntax, and opaque subject matter, many of John Ashbery’s poems can be quite difficult to ______ and thus are the object of heated debate among scholars.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["delegate","compose","interpret","renounce"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of John Ashbery’s poems. As used in this context, “interpret” would mean decipher the meaning of. The text indicates that Ashbery’s poems have many unusual features, that it’s difficult to tell what exactly the poems’ subject matter is, and that scholars strongly disagree about the poems. This context conveys the idea that it’s difficult to interpret Ashbery’s poems. Choice A is incorrect because “delegate” means to assign someone as a representative of another person or to entrust something to someone else, neither of which would make sense in context. The text is focused only on the difficulty that readers have interpreting Ashbery’s poems due to their many unusual features; it doesn’t suggest anything about the poems being difficult to delegate. Choice B is incorrect because describing Ashbery’s poems as difficult to “compose,” or put together or produce, would make sense only if the text were about Ashbery’s experience of writing the poems. It could be true that it was difficult for Ashbery to compose his poems, but the text doesn’t address this; it instead discusses how readers interpret and engage with the poems. Choice D is incorrect because describing Ashbery’s poems as being difficult to “renounce,” or give up or refuse, wouldn’t make sense in context. The text focuses on the idea that features of Ashbery’s poems are odd or unclear and have caused heated scholarly debate. This context suggests that the poems are difficult to interpret, not that the poems are difficult to renounce."},{"i":"a2dd51c1","c":"purpose","d":"E","s":"In most building demolitions, the building materials are destroyed and sent to landfills. City officials in Portland, Oregon, wanted to reduce this waste. The officials passed a law requiring demolition companies to deconstruct some buildings instead. Deconstruction involves carefully taking buildings apart piece by piece. Damage to the materials is avoided so that they can be reused in new constructions. A 2019 study found that 27 percent of materials from deconstructions in Portland were able to be reused. The remaining materials were processed for recycling instead of going to a landfill.\n\nWhich choice best states the main purpose of the text?","o":["To explain an effort made by the city of Portland to reduce demolition waste and some results of that effort","To show that popular support for measures that reduce demolition waste has increased since 2019","To argue that building deconstruction is not as effective as other measures at reducing demolition waste","To discuss laws aimed to reduce demolition waste in Portland and compare them to similar laws in other cities"],"a":0,"r":"Choice A is the best answer. The author first describes a Portland law aimed at reducing demolition waste, and then goes on to explain that 27% of materials from building deconstructions were able to be reused and the rest were recycled. Choice B is incorrect. The text never discusses the popularity of the law. Choice C is incorrect. The text never compares building deconstruction to other measures designed to reduce demolition waste. Choice D is incorrect. The text never mentions laws in cities other than Portland, Oregon."},{"i":"213a25d1","c":"purpose","d":"M","s":"The following text is from Paul Laurence Dunbar’s 1913 poem “The Poet and His Song.” A song is but a little thing, And yet what joy it is to sing! In hours of toil it gives me zest, And when at eve I long for rest; When cows come home along the bars, And in the fold I hear the bell, As Night, the shepherd, herds his stars, I sing my song, and all is well.\n\nWhich choice best states the main purpose of the text?","o":["To convey how engaging in song makes the speaker feel","To compare the speaker to a singing shepherd","To portray the speaker’s excitement about farming","To describe the pieces of music the speaker enjoys hearing"],"a":0,"r":"Choice A is the best answer because is accurately states the main purpose of the text. The text begins by declaring that although a song is \"but a little thing,\" or seemingly insignificant, singing it brings joy and gives the speaker of the text \"zest,\" or excitement, in \"hours of toil.\" The remainder of the text explores the idea that as night is falling, singing allows the speaker to feel that \"all is well.\" Thus, the main purpose of the text is to convey how engaging in song makes the speaker feel. Choice B is incorrect. Although the text mentions a shepherd, it neither indicates that the shepherd is singing nor does it compare the shepherd to the speaker. Choice C is incorrect. The text indicates that the speaker works hard, engaging in \"hours of toil,\" and it can be inferred that the speaker likely lives in a rural area, since cows and a cowbell can be heard nearby. However, the text does not suggest that the speaker is a farmer or feels excited about farming. Moreover, the shepherd in the text is not a literal reference to someone who herds sheep but instead a figurative description of the moon as the shepherd of the stars. Choice D is incorrect because in the text, the speaker is singing a song, not listening to others sing one. Moreover, the text describes the feelings that the speaker has when singing a song, not the song itself."},{"i":"03eeecf3","c":"func","d":"M","s":"The following text is from H.D.’s 1916 poem “Mid-Day.” In the poem, the speaker is on a path in an outdoor setting. <u>A slight wind shakes the seed-pods<\/u>— my thoughts are spent as the black seeds. My thoughts tear me, I dread their fever. I am scattered in its whirl. I am scattered like the hot shrivelled seeds.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It illustrates a change in the natural environment that the speaker implies is responsible for the growing misgivings described in the text.","It establishes an example of consistency in the natural landscape that the speaker then contrasts with the unpredictability of human emotions.","It presents an observation of an occurrence in the natural world that the speaker then expands on to convey a sense of a turbulent interior state.","It evokes the ordinariness of an event in nature to suggest that the critical self-evaluation the speaker engages in is a common pursuit."],"a":2,"r":"Choice C is the best answer because it best describes the function of the underlined portion in the text as a whole. In the text, the speaker mentions the occurrence in nature of seedpods being shaken by a slight wind. The speaker then goes on to compare the black seeds to thoughts, using language that indicates that the speaker’s state of mind is unsettled (e.g., \"my thoughts are spent\"; \"My thoughts tear me, I dread their fever\"). The text concludes with a comparison between the speaker’s \"scattered\" state of mind and the \"hot shrivelled seeds.\" Thus, the underlined portion of the text presents an observation of an occurrence in the natural world that the speaker then expands on to convey a sense of a turbulent interior state. Choice A is incorrect because the text does not indicate that the seedpods are the cause of the speaker’s state of mind; thus, they could not be responsible for any misgivings the speaker has. Choice B is incorrect because the text does not contrast the natural landscape with the speaker’s state of mind or describe the wind shaking the seedpods as consistent; rather, the text suggests that the state of the natural world and the speaker’s state of mind are similar in that both are unsettled. Choice D is incorrect because there is no indication in the text that the speaker regularly engages in critical self-evaluation, only that in this particular instance the speaker’s state of mind is turbulent."},{"i":"e23f50b9","c":"func","d":"M","s":"The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and—more affordably—steam baths. <u>While such amenities were available mainly to town dwellers,<\/u> regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.\n\nWhich choice best describes the function of the underlined portion?","o":["It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.","It describes a limitation of earlier historians’ studies of medieval European bathing habits.","It concedes that not all people in medieval Europe had access to public bathhouses.","It explains why Janega decided to study the popularity of public bathhouses in medieval Europe."],"a":2,"r":"Choice C is the best answer because it most effectively describes the function of the underlined portion. The text discusses the long-standing misconception that people in medieval Europe were uninterested in cleanliness and hygiene. As evidence that this idea is false, the text cites historian Eleanor Janega’s assertion that in medieval Europe, towns usually had at least one bathhouse, where people could take immersion baths or steam baths for a fee. The underlined portion then notes that mainly town dwellers had access to these bathhouses. The remainder of the text explains that those who lacked such access were nonetheless able to bathe in outdoor waterways or take sponge baths at home. Therefore, the underlined portion concedes that some people in medieval Europe lacked access to public bathhouses. Choice A is incorrect. The underlined portion establishes that amenities such as steam baths were mainly available to town dwellers, which suggests in turn that steam baths were largely unavailable to people in rural areas. Thus, the distinction made by the underlined portion is not between the popularity of steam baths in towns versus their lack of popularity in rural areas but instead between their presence in towns and absence in rural areas. Choice B is incorrect. Although the text does explain that recent historians have disproved the idea that medieval Europeans rarely bathed, it doesn’t attribute that misconception to earlier historians of medieval Europe or suggest that their research was subject to limitations. Moreover, the underlined portion addresses a limitation of life in medieval Europe, not of historical research. Choice D is incorrect because the underlined portion doesn’t address why historian Eleanor Janega decided to study the popularity of public bathhouses in medieval Europe—nor does any portion of the text. The text mentions Janega in passing, but it doesn’t go into detail about why she decided to study the popularity of public bathhouses in medieval Europe."},{"i":"b4d29611","c":"structure","d":"M","s":"Michelene Pesantubbee, a historian and citizen of the Choctaw Nation, has identified a dilemma inherent to research on the status of women in her tribe during the 1600s and 1700s: the primary sources from that era, travel narratives and other accounts by male European colonizers, underestimate the degree of power conferred on Choctaw women by their traditional roles in political, civic, and ceremonial life. Pesantubbee argues that the Choctaw oral tradition and findings from archaeological sites in the tribe’s homeland supplement the written record by providing crucial insights into those roles.\n\nWhich choice best describes the overall structure of the text?","o":["It details the shortcomings of certain historical sources, then argues that research should avoid those sources altogether.","It describes a problem that arises in research on a particular topic, then sketches a historian’s approach to addressing that problem.","It lists the advantages of a particular research method, then acknowledges a historian’s criticism of that method.","It characterizes a particular topic as especially challenging to research, then suggests a related topic for historians to pursue instead."],"a":1,"r":"Choice B is the best answer. The text begins by stating a problem with research on the status of Choctaw women in the 1600s and 1700s: written primary sources underestimate the power they had in their traditional roles. Then it presents one historian’s solution: looking to oral tradition and archeological findings for more insight into these roles. Choice A is incorrect. This isn’t the overall structure. The text never says that research should avoid written primary sources, just that research should also use oral tradition and archeological sites as sources. Choice C is incorrect. This isn’t the overall structure. The text never mentions the advantages of using written primary sources. Choice D is incorrect. This isn’t the overall structure. The text never says that the status of Choctaw women during the 1600s and 1700s is too challenging to research. And it doesn’t mention any other topics to research instead."},{"i":"159ef46d","c":"cross","d":"E","s":"Text 1 Although food writing is one of the most widely read genres in the United States, literary scholars have long neglected it. And within this genre, cookbooks attract the least scholarly attention of all, regardless of how well written they may be. This is especially true of works dedicated to regional US cuisines, whose complexity and historical significance are often overlooked.\n\nText 2 With her 1976 cookbook The Taste of Country Cooking, Edna Lewis popularized the refined Southern cooking she had grown up with in Freetown, an all-Black community in Virginia. She also set a new standard for cookbook writing: the recipes and memoir passages interspersing them are written in prose more elegant than that of most novels. <u>Yet despite its inarguable value as a piece of writing, Lewis’s masterpiece has received almost no attention from literary scholars.<\/u> Based on the two texts, how would the author of\n\nText 1 most likely regard the situation presented in the underlined sentence in\n\nText 2?","o":["As typical, because scholars are dismissive of literary works that achieve popularity with the general public","As unsurprising, because scholars tend to overlook the literary value of food writing in general and of regional cookbooks in particular","As justifiable, because Lewis incorporated memoir into The Taste of Country Cooking, thus undermining its status as a cookbook","As inevitable, because The Taste of Country Cooking was marketed to readers of food writing and not to readers of other genres"],"a":1,"r":"Choice B is the best answer. Text 1 states that literary scholars ignore regional cookbooks most of all, even when they have historical significance and are well written. So the author of Text 1 wouldn’t be surprised that scholars ignored Edna Lewis’s cookbook. Choice A is incorrect. We can’t infer that this is how the author of Text 1 would regard the situation. Text 1 never suggests that scholars are dismissive of popular works in general. Instead, Text 1 says that scholars ignore food writing specifically, despite its popularity—and despite the fact that it can be historically significant and complex. Choice C is incorrect. We can’t infer that this is how the author of Text 1 would regard the situation. Text 1 never suggests that elements of other genres should be kept out of cookbooks. Choice D is incorrect. We can’t infer that this is how the author of Text 1 would regard the situation. Text 1 never discusses how food writing is or should be marketed."},{"i":"cf956802","c":"main","d":"E","s":"When fashion designer Lloyd Henri Kiva New opened his store in Scottsdale, Arizona, in 1945, he quickly became known for creating delicately crafted leather goods, like belts and hats. He was perhaps most renowned for his colorful handbags, which he made by hand using a long and painstaking process. As he gained more customers, New began using sewing machines and other tools to help him produce bags more efficiently, though he continued to handcraft the crucial details that made each bag unique.\n\nBased on the text, what would have been the most likely consequence if New had not begun using sewing machines?","o":["He would have been unable to ensure that each bag included unique, handcrafted details.","He would have struggled to meet the increasing demand for his bags.","He would have had to individually design each bag he produced.","He would not have been able to generate as much interest in his bags."],"a":1,"r":"Choice B is the best answer because it presents the most likely consequence if New had not begun using sewing machines. The text states that New gained new customers and that sewing machines allowed him to make bags more efficiently, or in less time than he could when sewing by hand. It’s reasonable to conclude that if New hadn’t reduced the time it took to make each bag by starting to use sewing machines, it would have been hard for him to keep up with the increased demand. Choice A is incorrect because the text indicates that New added unique, handcrafted details to his bags before he started using sewing machines and continued to do so after he started using them. Choice C is incorrect because the text doesn’t suggest that individually designing each bag would have been a consequence of not using sewing machines, since New was already designing unique details for each bag before he started using sewing machines and continued to do so after he started using them. Choice D is incorrect because the text indicates that people were already interested in New’s bags before he started using sewing machines. Rather than allowing New to generate more interest in his bags, sewing machines helped New keep up with the interest that had already grown."},{"i":"d5c2a4d4","c":"main","d":"M","s":"The following text is adapted from Guy de Maupassant’s nineteenth-century short story “The Trip of Le Horla” (translated by Albert M. C. McMaster, A. E. Henderson, Mme. Quesada, et al.). The narrator is part of a group traveling in a hot-air balloon at night. The earth no longer seems to exist, it is buried in milky vapors that resemble a sea. We are now alone in space with the moon, which looks like another balloon travelling opposite us; and our balloon, which shines in the air, appears like another, larger moon, a world wandering in the sky amid the stars, through infinity. We no longer speak, think nor live; we float along through space in delicious inertia. The air which is bearing us up has made of us all beings which resemble itself, silent, joyous, irresponsible beings, peculiarly alert, although motionless.\n\nWhich choice best states the main idea of the text?","o":["The narrator feels a growing sense of isolation even though his companions are nearby during the balloon ride.","The narrator and his companions are completely absorbed in the change in perspective they gain while riding in the balloon.","The narrator and his companions are troubled by the disorienting effects of the altitude while riding in the balloon.","The narrator is pleasantly surprised by his companions’ unrestrained enthusiasm about the sensation of riding in the balloon."],"a":1,"r":"Choice B is the best answer because it most accurately states the main idea of the text. The narrator describes the view he and his companions have from the balloon: the earth lies beneath \"milky vapors,\" and the balloon itself looks like another moon. The narrator goes on to explain how the people riding in the balloon are affected by the ride, explaining that they are immersed in the experience: floating along in \"delicious inertia,\" or inactivity, like \"silent, joyous, irresponsible beings.\" Thus, the main idea is that the narrator and his companions are completely absorbed in the change in perspective they gain while riding in the balloon. Choice A is incorrect because the narrator never describes himself as feeling isolated from his companions; instead, he characterizes riding in the balloon as an experience he is sharing with them. And although he does imply a sense of isolation, it is isolation from those on the ground, as when he says of himself and his companions, \"We are now alone.\" Choice C is incorrect because the narrator doesn’t suggest that he or his companions are troubled by the effects of the balloon ride. Instead, he describes himself and his companions as \"joyous\" and the experience of floating in the balloon as \"delicious.\" Choice D is incorrect because nothing in the text suggests that the narrator is surprised by his companions’ response to the balloon ride. In fact, the text indicates that the narrator and his companions are having the same experience: they’re described as \"silent\" and \"motionless,\" rather than as having unrestrained enthusiasm."},{"i":"5632ffb4","c":"infer","d":"H","s":"In a study of the cognitive abilities of white-faced capuchin monkeys (Cebus imitator), researchers neglected to control for the physical difficulty of the tasks they used to evaluate the monkeys. The cognitive abilities of monkeys given problems requiring little dexterity, such as sliding a panel to retrieve food, were judged by the same criteria as were those of monkeys given physically demanding problems, such as unscrewing a bottle and inserting a straw. The results of the study, therefore, ______ Which choice most logically completes the text?","o":["could suggest that there are differences in cognitive ability among the monkeys even though such differences may not actually exist.","are useful for identifying tasks that the monkeys lack the cognitive capacity to perform but not for identifying tasks that the monkeys can perform.","should not be taken as indicative of the cognitive abilities of any monkey species other than C. imitator.","reveal more about the monkeys’ cognitive abilities when solving artificial problems than when solving problems encountered in the wild."],"a":0,"r":"Choice A is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the study of capuchin monkeys’ cognitive abilities. The text explains that the study failed to distinguish between outcomes for the tasks performed by the capuchin monkeys, such that simpler tasks requiring less dexterity, or skill, were judged by the same criteria as tasks that demanded more dexterity. Because the study didn’t account for this discrepancy, the researchers might have assumed that observed differences in performance were due to the abilities of the monkeys rather than the complexity of the tasks. In other words, the results may suggest cognitive differences among the monkeys even though such differences may not really exist. Choice B is incorrect because the text focuses on the fact that the tasks assigned to the capuchin monkeys in the study varied in difficulty and that the variety wasn’t taken into consideration. The text doesn’t suggest that the capuchin monkeys couldn’t perform certain tasks, just that some tasks were more difficult to do. Choice C is incorrect because the text doesn’t suggest that the study’s results are indicative of the abilities of capuchin monkeys but not of other monkey species; in fact, the text suggests that the results may not even be an accurate reflection of capuchin monkeys’ abilities. Choice D is incorrect because the text doesn’t indicate that the researchers compared results for artificial tasks with those for tasks encountered in the wild, although the tasks described in the text—sliding a panel and putting a straw in a bottle—are presumably artificial."},{"i":"2a075bd1","c":"infer","d":"H","s":"Indigenous cultures possess unique knowledge of the medicinal uses of plants. According to a 2021 study, 73 percent of the medicinal uses of plants native to North America are reflected in the vocabulary of a single Indigenous language. However, as more and more Indigenous people exclusively speak a globally dominant language, such as English, their ancestral languages fade from daily use. These facts lend added importance to tribal nations’ efforts to preserve their languages. By ensuring the continued use of Cherokee, Ojibwe, and the hundreds of other Indigenous languages in what is now the United States, tribal nations are also ______ Which choice most logically completes the text?","o":["increasing the number of medicinal plants represented in the vocabularies of Indigenous languages.","transmitting terms for medicinal plants from Indigenous languages to globally dominant languages.","preserving knowledge about the medicinal value of plants native to the tribal nations’ lands.","ensuring that citizens of tribal nations have physical access to medicinal plants."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the relationship between Indigenous languages and knowledge of the medicinal uses of plants. The text states that Indigenous cultures possess special knowledge of the medicinal uses of plants, which is reflected in their vocabulary. The text then discusses how tribal nations are working to preserve their languages, whose daily use is declining as globally dominant languages become increasingly dominant in Indigenous communities. Given that the languages of tribal nations in what is now the United States function as repositories of knowledge about plants’ medicinal uses, it logically follows that continued use of those languages will assist with passing on knowledge about the medicinal value of plants native to the tribal nations’ lands. Choice A is incorrect because the text states that preserving Indigenous languages will increase the knowledge, not the number, of medicinal plants. Choice B is incorrect because the text is concerned with how vocabulary about the medicinal value of plants can be preserved through the continued daily use of Indigenous languages, not with how such vocabulary can be incorporated into globally dominant, non-Indigenous languages. Moreover, the text explains that the exclusive use of globally dominant languages in Indigenous communities comes at an expense to the continued daily use of those communities’ languages. Given this relationship, it is unlikely globally dominant languages would borrow Indigenous vocabulary pertaining to plants’ medicinal uses. Choice D is incorrect because the text doesn’t discuss physical access to medicinal plants, instead focusing on Indigenous knowledge and language surrounding the medicinal uses of plants."},{"i":"3f4ab688","c":"claim","d":"H","s":"In a research paper, a student criticizes some historians of modern African politics, claiming that they have evaluated Patrice Lumumba, the first prime minister of what is now the Democratic Republic of the Congo, primarily as a symbol rather than in terms of his actions.\n\nWhich quotation from a work by a historian would best illustrate the student’s claim?","o":["“Lumumba is a difficult figure to evaluate due to the starkly conflicting opinions he inspired during his life and continues to inspire today.”","“The available information makes it clear that Lumumba’s political beliefs and values were largely consistent throughout his career.”","“Lumumba’s practical accomplishments can be passed over quickly; it is mainly as the personification of Congolese independence that he warrants scholarly attention.”","“Many questions remain about Lumumba’s ultimate vision for an independent Congo; without new evidence coming to light, these questions are likely to remain unanswered.”"],"a":2,"r":"Choice C is the best answer because it illustrates the student’s claim about some historians viewing Lumumba primarily as a symbol. This quotation argues that Lumumba “warrants” (or deserves) “scholarly attention” as a symbol and not for his “practical accomplishments”—that is, his actions as prime minister—which “can be passed over quickly,” or dismissed as being of comparatively little importance. Thus, the quotation expresses the view that the student criticizes some historians for holding. Choice A is incorrect. Although this quotation touches on the difficulty of evaluating Lumumba’s legacy, it doesn’t address how historians of modern African politics view him as a symbol. Choice B is incorrect. While this quotation mentions Lumumba’s political beliefs, it doesn’t discuss historians viewing him as a symbol. Choice D is incorrect. This quotation touches on Lumumba’s vision for his country, but it doesn’t discuss historians viewing him as a symbol."},{"i":"73c091d2","c":"claim","d":"E","s":"Many trees produce growth rings as they age, with each ring in a tree’s trunk representing one year in the tree’s life. This often makes it fairly easy to determine how old a tree was when it was cut down. To do so, you look at the tree stump and count the dark rings you see. But a researcher claims that this method often can’t be used to identify the age of olive trees. Which detail, if true, would most directly support the researcher’s claim?","o":["The oldest olive tree in the world is likely over 1,100 years old.","Narrow growth rings can suggest that an olive tree experienced harsh conditions.","Many olive trees have growth rings that are difficult to see.","Olive trees thrive in areas with hot, dry summers."],"a":2,"r":"Choice C is the best answer because it presents a detail that, if true, would most directly support the researcher’s claim about the difficulty of determining olive tree age by ring counting. The text explains that for many trees, counting the dark rings visible in a tree stump is a reliable method for determining the tree’s age. However, if olive trees have growth rings that are difficult to see, it would be hard to count the individual rings. Therefore, the ring-counting method would be challenging or impossible to use for olive trees. This directly supports the researcher’s claim that the ring-counting method often can’t be used for olive trees because it identifies a specific characteristic of olive trees that could render this approach impracticable. Choice A is incorrect because the probable age of the oldest olive tree doesn’t explain why counting rings wouldn’t work for determining olive tree age. The older age of some olive trees might make counting more tedious but doesn’t pose an insurmountable obstacle to adopting the method. The researcher’s claim is about the feasibility of the ring-counting method for olive trees, not about the potential impracticality of employing this method for particularly long-lived trees. Choice B is incorrect because the fact that narrow growth rings might indicate harsh growing conditions has no direct bearing on the claim that counting rings often can’t be used to determine olive tree age. It is possible that growth rings that are too narrowly spaced might be difficult to count, but the researcher’s claim relates to the inapplicability of the ring-counting method to olive trees in general rather than to olive trees that have experienced harsh conditions. Moreover, as long as they are visible, even narrow growth rings might permit the ring-counting method to be used to determine tree age. Choice D is incorrect because the ideal climate conditions for olive trees don’t explain why counting rings wouldn’t work as a method for determining their age. While growing conditions might affect ring formation patterns, the simple fact that olive trees thrive in hot, dry environments doesn’t directly address why the conventional method of counting rings would be ineffective for determining their age."},{"i":"a9040290","c":"graph","d":"E","s":"","o":["strong enough to generate about 150 thousand more MWh of electricity from wind turbines.","so weak that the electricity from wind turbines was about 175 thousand MWh less than predicted.","so weak that the electricity from wind turbines was about 150 thousand MWh less than predicted.","strong enough to generate about 175 thousand more MWh of electricity from wind turbines."],"a":0,"r":"Choice A is the best answer. The claim is that when winds are stronger than forecasted, wind turbines can generate more energy than predicted. The supporting graph shows the additional amount (above the predicted amount) that the turbines generated under those conditions, with the West generating about 150 thousand additional MWh. Choice B is incorrect. This choice doesn’t complete the example. The graph shows the additional amount of electricity that the wind turbines generated. The West bar is greater than 0, so the West generated more than the predicted amount. Choice C is incorrect. This choice doesn’t complete the example. The graph shows the additional amount of electricity that the wind turbines generated. The West bar is greater than 0, so the West generated more than the predicted amount. Choice D is incorrect. This choice misreads the graph. The graph shows us that the West (the bar on the left) generated about 150 thousand additional MWh."},{"i":"a0203977","c":"graph","d":"M","s":"","o":["in each year shown, the revenue from tourism by residents of those countries was greater than the revenue from international tourism.","Japan’s international tourism revenue was higher in 2016 than it was in 2018.","South Korea’s annual international tourism revenue decreased from 2016 to 2017.","in each year shown, Thailand had higher international tourism income than any of the other countries."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the text, providing an example that illustrates that the annual increases in international tourism revenue in 2017 and 2018 weren’t universal. The table shows the annual spending by international tourists (which indicates annual international tourism revenue) in 2016–2018 in four Asian countries. According to the table, annual spending by international tourists in South Korea was $21.0 billion in 2016 and then decreased to $17.2 billion in 2017. This decrease shows that not all of the countries included in the table saw increases in annual international tourism revenue in 2017. Choice A is incorrect because the table doesn’t provide any data regarding revenue from tourism by residents of those countries. Even if that data were provided, it wouldn’t be relevant to the claim that the trend of annual increases in international tourism revenue in 2017 and 2018 was not universal. Choice B is incorrect because the data in the table do not support the statement that Japan’s international tourism revenue was higher in 2016 than it was in 2018: the table indicates that Japan’s annual international tourism revenue was $33.5 billion in 2016, which is less than Japan’s annual international tourism revenue of $45.3 billion in 2018. Choice D is incorrect. Although the table does indicate that Thailand’s revenue from international tourism was higher than that of the other three Asian countries in 2016, 2017, and 2018, this information has no direct bearing on the text’s claim that not all the Asian countries represented in the table saw an increase in revenue from international tourism."},{"i":"4c06427b","c":"fss","d":"M","s":"Interest in mechanotransduction, the mechanism by which cells sense and convert mechanical stimuli into biochemical signals, is expanding because of innovative work by biomedical scientists—many of whom, like neuroscience and biophysics expert Elba Serrano, ______ this mechanism to better understand how the body’s neurological and biomechanical systems interact.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is studying","has studied","study","studies"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. The plural verb \"study\" agrees in number with the plural subject \"many.\" Choice A is incorrect because the singular verb \"is studying\" doesn’t agree in number with the plural subject \"many.\" Choice B is incorrect because the singular verb \"has studied\" doesn’t agree in number with the plural subject \"many.\" Choice D is incorrect because the singular verb \"studies\" doesn’t agree in number with the plural subject \"many.\""},{"i":"d4f173ec","c":"fss","d":"E","s":"To illustrate Albert Einstein’s special theory of relativity, picture two jugglers: one juggling on a steadily moving parade float, the other juggling while standing still on a sidewalk. The laws of physics are identical for both ______ motion relative to each other. But what, Einstein wondered, about the speed of light?\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["jugglers’, regardless of they’re","jugglers, regardless of there","juggler’s, regardless of their","jugglers, regardless of their"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of plural nouns and possessive determiners. The plural noun \"jugglers\" and the plural possessive determiner \"their\" correctly indicate that there are multiple jugglers whose motion is being discussed. Choice A is incorrect because the context requires the plural noun \"jugglers\" and the plural possessive determiner \"their,\" not the plural possessive noun \"jugglers’\" and the contraction \"they’re.\" Choice B is incorrect because the context requires the plural possessive determiner \"their,\" not the word \"there,\" which means \"in that place.\" Choice C is incorrect because the context requires the plural noun \"jugglers,\" not the singular possessive noun \"juggler’s.\""},{"i":"e8926747","c":"fss","d":"E","s":"Eighteen letters written by Louisa May Alcott, author of the popular novel Little Women (1868), can be found at the New York Historical Society. ______ letters demonstrate Alcott’s keen business sense in her interactions with publishers.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["One","That","This","These"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of determiners in a sentence. The plural determiner \"these\" agrees in number with the plural noun \"letters\" that it modifies. This choice clearly indicates that the letters demonstrate Alcott’s business sense. Choice A is incorrect because the singular determiner \"one\" doesn’t agree in number with the plural noun \"letters.\" Choice B is incorrect because the singular determiner \"that\" doesn’t agree in number with the plural noun \"letters.\" Choice C is incorrect because the singular determiner \"this\" doesn’t agree in number with the plural noun \"letters.\""},{"i":"a9e5b788","c":"bound","d":"H","s":"In discussing Mary Shelley’s 1818 epistolary novel Frankenstein, literary theorist Gayatri Spivak directs the reader’s attention to the character of Margaret Saville. As Spivak points out, Saville is not the protagonist of Shelley’s ______ as the recipient of the letters that frame the book’s narrative, she’s the “occasion” of it.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["novel","novel,","novel; rather,","novel, rather,"],"a":2,"r":"Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a semicolon to join a main clause (“Saville...novel”) and a second main clause (“she’s...it”) preceded by supplementary elements (“rather...narrative”). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice D is incorrect because it results in a comma splice. Without a conjunction following it, the comma after “novel” can’t be used in this way to join the two main clauses."},{"i":"148be4da","c":"bound","d":"E","s":"Human-made (synthetic) fibers used in clothes and many other consumer products are more durable than most natural plant ______ the manufacture of synthetic fibers requires toxic chemical solvents that can pollute air and water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["fibers,","fibers but","fibers","fibers, but"],"a":3,"r":"Choice D is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction “but” to join the first main clause (“Human-made...fibers”) and the second main clause (“the manufacture...water”). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice B is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."},{"i":"459df2ba","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Modularity of mind is the notion that the mind is at least partly composed of innate neural structures (modules) that perform fast, necessary tasks. 1983: cognitive scientist Jerry A. Fodor hypothesized that low-level cognitive systems (e.g., perception, language) are modular. In Fodorian modularity, high-level systems (e.g., reasoning) are not modular. 2003: cognitive scientist Peter Carruthers proposed the massive modularity hypothesis (MMH). MMH expands modularity to include all cognitive systems. The student wants to compare Fodor’s hypothesis with Carruthers’s.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["In considering some but not all cognitive systems modular, Fodorian modularity is not as expansive in its definition of modularity as MMH is.","Following Fodor’s 1983 hypothesis, Carruthers proposed that modularity of mind includes all cognitive systems.","The hypotheses of Fodor and Carruthers differ in whether they consider low-level cognitive systems, such as perception and language, modular.","In 2003, Carruthers proposed the massive modularity hypothesis, disagreeing with Fodor’s earlier hypothesis that the mind is composed of innate neural structures."],"a":0,"r":"Choice A is the best answer. The sentence compares Fodor’s hypothesis with Carruthers’s, noting that because Fodorian modularity considers some but not all cognitive systems modular, it is not as expansive in its definition of modularity as Carruthers’s MMH, which includes all cognitive systems. Choice B is incorrect. The sentence describes Carruthers’s hypothesis—that modularity of mind includes all cognitive systems—but indicates only that this hypothesis followed Fodor’s 1983 hypothesis rather than making a comparison between the hypotheses. Choice C is incorrect. The sentence misrepresents a difference between Fodor’s and Carruthers’s hypotheses. According to the information in the notes, both Fodor and Carruthers consider low-level cognitive systems modular, and their difference lies in whether they also consider high-level systems modular. Choice D is incorrect. The sentence misrepresents a difference between Fodor’s and Carruthers’s hypotheses. According to the information in the notes, both Fodor and Carruthers consider the mind to be at least partly composed of innate neural structures (modules). Their difference lies in whether they consider high-level systems modular."},{"i":"24014c3f","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Severo Ochoa discovered the enzyme PNPase in 1955. PNPase is involved in both the creation and degradation of mRNA. Ochoa incorrectly hypothesized that PNPase provides the genetic blueprints for mRNA. The discovery of PNPase proved critical to deciphering the human genetic code. Deciphering the genetic code has led to a better understanding of how genetic variations affect human health. The student wants to emphasize the significance of Ochoa’s discovery.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Ochoa’s 1955 discovery of PNPase proved critical to deciphering the human genetic code, leading to a better understanding of how genetic variations affect human health.","Ochoa first discovered PNPase, an enzyme that he hypothesized contained the genetic blueprints for mRNA, in 1955.","In 1955, Ochoa discovered the PNPase enzyme, which is involved in both the creation and degradation of mRNA.","Though his discovery of PNPase was critical to deciphering the human genetic code, Ochoa incorrectly hypothesized that the enzyme was the source of mRNA’s genetic blueprints."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes the significance of Ochoa’s discovery, noting that it proved critical to deciphering the human genetic code, which resulted in a better understanding of how genetic variations affect human health. Choice B is incorrect. While the sentence explains what Ochoa discovered, it doesn’t emphasize the significance of the discovery. Choice C is incorrect. While the sentence explains what Ochoa discovered, it doesn’t emphasize the significance of the discovery. Choice D is incorrect. While the sentence mentions that Ochoa’s discovery was crucial, it emphasizes Ochoa’s incorrect hypothesis, not the significance of the discovery."},{"i":"56336696","c":"trans","d":"E","s":"When using sumac for dyeing cloth, textile artists first soak it in water to release its color. Then, they add the cloth to the dyebath and simmer it for hours, perhaps even days. ______ they will remove the cloth, at which point it will have turned a vibrant red color.\n\nWhich choice completes the text with the most logical transition?","o":["Nevertheless,","Likewise,","Eventually,","In other words,"],"a":2,"r":"Choice C is the best answer. \"Eventually\" logically signals that the information in this sentence—that textile artists will remove the cloth when it has turned red—is the final step in the chronological sequence of the dyeing process described in the previous sentences. Choice A is incorrect because \"nevertheless\" illogically signals that the information in this sentence is true despite the previous information about simmering the cloth in the dyebath. Instead, the removal of the cloth is the final step in the dyeing process. Choice B is incorrect because \"likewise\" illogically signals that the information in this sentence is similar to the previous information about simmering the cloth in the dyebath. Instead, the removal of the cloth is the final step in the dyeing process. Choice D is incorrect because \"in other words\" illogically signals that the information in this sentence is a paraphrase or restatement of the previous information about simmering the cloth in the dyebath. Instead, the removal of the cloth is the final step in the dyeing process."},{"i":"9502ec65","c":"trans","d":"H","s":"When soil becomes contaminated by toxic metals, it can be removed from the ground and disposed of in a landfill. ______ contaminated soil can be detoxified via phytoremediation: plants that can withstand high concentrations of metals absorb the pollutants and store them in their shoots, which are then cut off and safely disposed of, preserving the health of the plants.\n\nWhich choice completes the text with the most logical transition?","o":["Alternatively,","Specifically,","For example,","As a result,"],"a":0,"r":"Choice A is the best answer. “Alternatively” logically signals that the soil decontamination method described in this sentence—removing toxic metals from the soil via phytoremediation—offers an alternative to the previously described method (removing the contaminated soil from the ground). Choice B is incorrect because “specifically” illogically signals that the soil decontamination method described in this sentence specifies or elaborates on an aspect of the previously described method (removing the contaminated soil from the ground). Instead, phytoremediation is an alternative to that method. Choice C is incorrect because “for example” illogically signals that the soil decontamination method described in this sentence is an example of the previously described method (removing the contaminated soil from the ground). Instead, phytoremediation is an alternative to that method. Choice D is incorrect because “as a result” illogically signals that the soil decontamination method described in this sentence is a result or consequence of the previously described method (removing the contaminated soil from the ground). Instead, phytoremediation is an alternative to that method."}],"img":{"a9040290":"iVBORw0KGgoAAAANSUhEUgAAArwAAAHmBAMAAABjaUB8AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABD/ElEQVR42u1dd3wTt/t+dLbjDBLrEvZILgkbChf2KjW7ZZpZoKU1u4z2G0ahrNZAmaUlrDLbhr06wiyzmL3BYbdA4gAtoxDLYSex9fsjAbIw/BrMSO75fCA+6STdPXr16n2lkwQoUKBAgQIFChQoUKBAgQIFChQoUKDgdQV9YTcpyATRRZx2HEAoAGIAVAZ/AP5pookREPypSk4TpgKAUIAAgABQEIGmXBbPjfQuf8wyyUR5/68BzRoAKgZ4mDsiGJ+kSaqxAiNXL/GKSL2WARSWQdGbyKAAysEjCu8WkkFAgQ9yYQtQ3ZAyt/7qqVTPBuB5B4BgBjwi/clYBKe5TR0FzKsc5mVKqRpVOGiKsAerUhgvJvvcxlwh9faXRq/w+tCr/tVAem5r8PNA1m8TLUjVxqofnBUmbuREc3iAR/vpQOtZlIxcRMm3Jlrc85PpJdDvAAq+exbqbWNAAcfR406m2fY/NDtXY8TAdqsKUI9tpiq1PugtkUG4pZeWkfJquVf/tSh4MDAX6oaiJdYID0NvVj6juVI2ooKkjWo1+gPDNyHAyDabhP0SMDuP5HmyTrTPopaRfVVn6ESPPUUii+4paspXaaXKCgwLCfMyjQzZpz5dvMA6/+ttihg+baCfo13sbVLvgjbqi7dVa32NU1uPpKuLH8mF0itf9OdHLp4/us5j5Nk28QBz/PSrHBsDdP51cIUYK0gxbgwddYCHfbmFEhxhRL3gnyoJI2/I/8ZGgwElVi0Gbc72a1dfsN1iN3+1s47bzRyOh2GaY0iWKhwPsTmYz28/BZe6sBC5j94B44uTeMSDCxaeIILDCQ4CIBl2SgB1o9EG0epEIHNSGw8GIwwnOAPyDakHBiRWKa+zqoeWJxZwO7kIateBElBHQEAk+Ck/RwMbgROUMMTnPnpJoYuzoAMgcEo5B6g/A/UDQODHAGgW/JnXBoBQDn9YQQGu4+Cs95bIR90hTZzUkUuUUE7AdXYwDoalsgXOqzFJ3SwUgE33Es2G14dezy3zIz4mABzJ4XedVr0WToAlgGA/DBYRaNNv/myrQUt2yVrmhAg/h1FdVARo0R2tU/Ow40o8S9Y function card(q,n){const a=ans[q.i];
