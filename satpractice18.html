<script>
const D={"t":"SATPractice18","q":[{"i":"bdab32fc","c":"vocab","d":"E","s":"Cucurbits, a group of plants that includes squash and melons, relied on mastodons to spread their seeds in the Ice Age. When these animals died out, cucurbits faced extinction in turn, having lost their means of seed dispersal. Around this time, however, the ancestors of Indigenous peoples in North America began raising cucurbits as crops, thus ______ the plants’ survival.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["verifying","multiplying","comforting","ensuring"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of cucurbits. In this context, “ensuring” means guaranteeing, or making sure of, the cucurbits’ survival. The text states that cucurbits faced extinction in the past because their means of seed dispersal disappeared, but the ancestors of Indigenous peoples in North America began farming cucurbits around that same time, so the crops were no longer threatened. Therefore, the context supports the idea that the ancestors of Indigenous peoples in North America helped with ensuring the cucurbits’ survival. Choice A is incorrect because in this context verifying means making sure that something is accurate. In the text, the ancestors of Indigenous peoples in North America were ensuring the survival, not the accuracy of, the cucurbits. Choice B is incorrect. Although the cucurbit crops themselves were multiplying, or growing in number, as a result of the work of the ancestors of Indigenous peoples in North America, it wouldn’t make sense in context to say that the survival of the plants was multiplying. Choice C is incorrect because according to the text, in raising cucurbits as crops, the ancestors of Indigenous peoples in North America were attempting to help the plants grow and survive; they weren’t attempting to comfort, or free the plants from pain."},{"i":"3654202f","c":"vocab","d":"E","s":"Radar and sonar can detect objects or people through walls, but they are too costly for consumer use. Researchers Fadel Adib and Dina Katabi have shown, however, that there may be a comparatively ______ alternative: small changes to the Wi-Fi technology used in smartphones can give users a cheap way to count people or even identify their gestures through walls.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["infrequent","inexpensive","unmistakable","impractical"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of ways to detect people through walls. In this context, \"inexpensive\" means less costly or low in price. The passage describes two kinds of methods that can be used to \"detect objects or people through walls\": radar and sonar, and changes to the Wi-Fi technology used in smartphones. The word \"comparatively\" before the blank indicates that the best answer would be one that helps to describe a comparison between the two. Radar and sonar are described as \"costly,\" while the method that uses Wi-Fi technology is described as \"cheap\"; therefore, it would be comparatively affordable, or inexpensive. Choice A is incorrect because the text indicates that a small modification to the smartphones that many consumers already own would presumably result in consumers using that technology to detect objects or people through walls more regularly, or frequently; therefore, it would not be true that such technology would be comparatively infrequent, or uncommon. Choice C is incorrect because there is nothing in the text to indicate that either radar and sonar or changes to smartphone Wi-Fi technology are capable of being misunderstood or mistaken for something else; therefore, it would not make sense to describe changes to Wi-Fi smartphone technology as comparatively unmistakable, or indisputable. Choice D is incorrect because the text indicates that a small modification to the smartphones that many consumers already own and carry with them would be more functional or practical than radar and sonar, not more impractical, or unrealistic."},{"i":"afd2a9eb","c":"vocab","d":"E","s":"Manul cats are small, shy felines. They live mostly alone in out-of-the-way parts of Asia, such as on Mount Everest. These cats have been difficult to research because their habitats are so ______ large populations of humans.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["full of","drawn to","responsible for","distant from"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of manul cats. The text states that manul cats live in \"out- of-the-way parts of Asia\" (citing the famously remote Mount Everest as an example) and indicates that it is difficult to research the cats because of the location of their habitats. By emphasizing that the habitats are remote in relation to humans, the text conveys that being \"distant from,\" or far from, large groups of humans makes manul cats challenging to study. Choice A is incorrect because saying that the habitats of manul cats are \"full of large populations of humans\" would indicate that the cats cohabitate with many humans, which would directly contradict the text’s claim that the cats live in \"out-of-the-way\" areas. Choice B is incorrect because the missing words describe an aspect of manul cats’ habitats, or the areas where they live, and it wouldn’t make sense to say that areas could be \"drawn to,\" or attracted by, large groups of humans. Choice C is incorrect. In this context, \"responsible for\" would mean either having an obligation to care for something or being the cause of something, and it wouldn’t make sense to say that the habitats of manul cats (the areas where the cats live) would need to care for humans or that the habitats somehow created large human populations."},{"i":"83fd3cf4","c":"vocab","d":"H","s":"Despite stated claims of global relevance, much major research on income inequality performed in the 2010s suffered from a myopic focus on a few countries in North America and Western Europe, partly due to limited data availability. Researchers would later ______ this shortcoming after gaining new access to banking records located in nations in Africa, such as Tunisia, and Eastern Europe, such as Hungary.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["presuppose","categorize","mitigate","validate"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of research on income inequality in the 2010s. In this context, \"mitigate\" means to make less severe or reduce the negative effects of something. The text first identifies a shortcoming in the research: a \"myopic focus on a few countries\" despite claims of \"global relevance.\" The text then explains that researchers later gained access to new data from previously excluded regions (Africa and Eastern Europe). This context supports the idea that with these new data, researchers would be able to reduce, or mitigate, the identified shortcoming by incorporating a broader range of geographic regions into their studies of income inequality. Choice A is incorrect because in this context, \"presuppose\" would mean to assume in advance that something is true, and it wouldn’t make logical sense to say that researchers later assumed as true in advance a shortcoming they had already encountered. Choice B is incorrect because in this context, \"categorize\" would mean to classify or place into groups. The text indicates that researchers did something about the shortcoming that characterized research on income inequality in the 2010s—limited geographic scope—after they gained access to new data from previously excluded regions. Categorizing a shortcoming doesn’t require access to or analysis of new data; it could be done without any new information, but by analyzing new data, researchers went beyond merely categorizing the shortcoming and instead took action to address it. Choice D is incorrect because in this context, \"validate\" would mean to confirm or substantiate something. The text indicates that researchers did something about a known shortcoming of research on income inequality in the 2010s—limited geographic scope—after they gained access to new data from previously excluded regions. Confirming an already known shortcoming doesn’t require access to or analysis of new data; it could be done without any new information, but by analyzing new data, researchers went beyond merely validating the shortcoming and instead took action to make the shortcoming less severe."},{"i":"1d9a09c0","c":"purpose","d":"E","s":"The following text is adapted from Jason Reynolds’s 2016 novel Ghost. The narrator, who is in middle school, is at a bus stop. I just go there [to the bus stop] to look at the people working out. See, the gym across the street has this big window—like the whole wall is a window—and they have those machines that make you feel like you walking up steps and so everybody just be facing the bus stop, looking all crazy like they’re about to pass out. And trust me, there ain’t nothing funnier than that. So I check that out for a little while like it’s some kind of movie: The About to Pass Out Show, starring stair-stepper person one through ten. ©2016 by Jason Reynolds Which choice best states the main purpose of the text?","o":["To give a reason why the narrator is excited to start middle school","To describe an activity that the narrator finds amusing","To explain a problem that the narrator has overcome","To discuss a movie that the narrator saw in a theater"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text describes how the narrator watches people working out at a gym through a window near a bus stop. The narrator says that \"there ain’t nothing funnier\" than watching people try to work out on the stair climber machine. Thus, the main purpose of the text is to describe an activity that the narrator finds amusing. Choice A is incorrect because the text isn’t about the narrator beginning middle school. The text describes how the narrator finds people working out at a gym amusing and makes no mention of school life. Choice C is incorrect because the text doesn’t mention any problems that the narrator currently has or has overcome. It just describes how the narrator finds watching people work out amusing. Choice D is incorrect because the narrator invents the made-up movie mentioned in the text. The text doesn’t indicate that the narrator has seen a movie in a theater. The focus of the text is on the narrator watching people at the gym, not watching a movie."},{"i":"0ed94d4c","c":"purpose","d":"E","s":"Jackie Ormes’s Torchy Brown in Dixie to Harlem (1937–38) was the first comic strip by a Black woman to appear in a widely read newspaper. The strip tells the story of Torchy, a young woman who leaves Mississippi to become a performer in New York City. Torchy’s story reflects the experience of the Great Migration (1910–1970), when millions of Black Americans left the South in search of opportunities in other parts of the United States. Torchy Brown thus shows how Ormes used comics to comment humorously on issues affecting Black Americans, which she continued to do throughout her career.\n\nWhich choice best states the main purpose of the text?","o":["To show how Ormes’s Torchy Brown inspired other Black women to write comic strips in the 1930s","To illustrate how the subjects Ormes addressed in her comic strips changed over the course of her career","To give an example of how Ormes presented the experiences of Black Americans in her comic strips","To claim that several characters in Torchy Brown were based on people that Ormes knew personally"],"a":2,"r":"Choice C is the best answer. The text describes how Torchy Brown depicted the experiences of a young Black woman experiencing America’s Great Migration. It further states that Ormes continued to use comics throughout her career to humorously comment on important issues impacting Black Americans. Choice A is incorrect. The text never mentions other Black women comic strip writers. Choice B is incorrect. The text never mentions any changes in the subjects Ormes addressed. Choice D is incorrect. The text never mentions the inspiration for characters in Torchy Brown."},{"i":"749f3334","c":"func","d":"M","s":"The following text is from Charlotte Forten Grimké’s 1888 poem “At Newport.” Oh, deep delight to watch the gladsome waves Exultant leap upon the rugged rocks; <u>Ever repulsed, yet ever rushing on— Filled with a life that will not know defeat;<\/u> To see the glorious hues of sky and sea. The distant snowy sails, glide spirit like, Into an unknown world, to feel the sweet Enchantment of the sea thrill all the soul, Clearing the clouded brain, making the heart Leap joyous as it own bright, singing waves!\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It portrays the surroundings as an imposing and intimidating scene.","It characterizes the sea’s waves as a relentless and enduring force.","It conveys the speaker’s ambivalence about the natural world.","It draws a contrast between the sea’s waves and the speaker’s thoughts."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The text presents the speaker’s experience of viewing the sea. In the underlined portion, the speaker focuses on the idea that the waves hitting rocks on the shore are a relentless and enduring force: they are constantly pushed back (“ever repulsed”) but always return (“ever rushing on”), as though they have an energy that can’t be overcome (“a life that will not know defeat”). Choice A is incorrect. Although the underlined portion characterizes the waves as a relentless force (always “repulsed” but still “rushing on” and never being defeated), the speaker doesn’t suggest that the surroundings are intimidating. Instead, the speaker presents the scene in a positive way, describing the “deep delight” of the “gladsome,” or cheerful, waves and feeling “the heart / Leap joyous” while viewing the sea. Choice C is incorrect because the underlined portion doesn’t suggest that the speaker is ambivalent, or has mixed feelings about, the natural world. Instead, it presents a single view of one part of the immediate surroundings: the speaker characterizes the sea’s waves as an unstoppable force, since they are constantly pushed back but always return (“ever repulsed, yet ever rushing on”). Choice D is incorrect. Although the text later suggests the speaker’s view of her own thoughts by referring to a “clouded brain” and a heart that leaps joyously, this reference neither occurs within the underlined portion nor establishes a clear contrast with the relentless determination of the waves. The underlined portion addresses only the speaker’s view of the waves and doesn’t suggest what her own thoughts might be."},{"i":"ea9dfe27","c":"func","d":"E","s":"The following text is from Joan Didion’s memoir The Year of Magical Thinking. In the text, the author discusses her home life. [I]n California we heated our houses by building fires. We built fires even on summer evenings, because the fog came in. <u>Fires said we were home, we had drawn the circle, we were safe through the night.<\/u> ©2005 by Joan Didion Which choice best describes the function of the underlined portion in the text as a whole?","o":["It illustrates that a fire provides comfort beyond physical warmth.","It summarizes the information that came before it in the text.","It explains that the house remains cold even in summer.","It suggests that the author feels comfortable in her home with or without a fire."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first two sentences of the text establish that in California, houses were heated by building fires year-round. The underlined portion then indicates that the fires didn’t merely provide physical warmth: they also represented being \"home\" and feeling protected. The underlined portion thus illustrates that a fire provides comfort beyond physical warmth. Choice B is incorrect because the underlined portion doesn’t summarize information that came before it. Whereas the previous two sentences describe fires’ ability to provide physical warmth to homes, the underlined portion focuses on the psychological comfort the fires offered. Choice C is incorrect. Although the text’s second sentence mentions that fires were built in the summer because fog came in, which may have cooled the house, this detail isn’t the focus of the underlined portion. Instead, the underlined portion indicates that fires were built for reasons beyond physical warmth: to create a sense of being home and safe. Choice D is incorrect because the underlined portion focuses on the emotional significance the author places on having a fire going inside the home. There is no indication that the author feels equally comfortable without a fire present."},{"i":"8963273a","c":"structure","d":"M","s":"Musician Joni Mitchell, who is also a painter, uses images she creates for her album covers to emphasize ideas expressed in her music. For the cover of her album Turbulent Indigo (1994), Mitchell painted a striking self-portrait that closely resembles Vincent van Gogh’s Self-Portrait with Bandaged Ear (1889). The image calls attention to the album’s title song, in which Mitchell sings about the legacy of the postimpressionist painter. In that song, Mitchell also hints that she feels a strong artistic connection to Van Gogh—an idea that is reinforced by her imagery on the cover.\n\nWhich choice best describes the overall structure of the text?","o":["It presents a claim about Mitchell, then gives an example supporting that claim.","It discusses Van Gogh’s influence on Mitchell, then considers Mitchell’s influence on other artists.","It describes a similarity between two artists, then notes a difference between them.","It describes the songs on Turbulent Indigo, then explains how they relate to the album’s cover."],"a":0,"r":"Choice A is the best answer because it accurately describes the organization of the elements within the text. The text begins with the claim that Joni Mitchell’s album covers use images she creates in order to emphasize ideas embedded in her albums. It then goes on to provide an example of how Mitchell’s self-portrait on the cover of Turbulent Indigo resembles a painting by Van Gogh, which the text indicates helps emphasize the strong connection Mitchell feels toward Van Gogh, a connection that is also expressed in the album’s title song. Choice B is incorrect because there are no references in the text to artists other than Joni Mitchell and Van Gogh. Choice C is incorrect because there is nothing in the text that calls attention to any similarities or differences between Joni Mitchell and Van Gogh. Instead, it mentions that Mitchell feels a strong “artistic connection” to Van Gogh. Choice D is incorrect because the text discusses the cover before referring to any songs, and it only references one song from the album not all the songs."},{"i":"c8a2af72","c":"cross","d":"M","s":"Text 1 French Impressionist artist Edgar Degas insisted that his paintings be kept in their original frames after they were sold. Like many Impressionist painters, Degas used painted frames that stood in contrast to the gold frames frequently seen at the Paris Salon, a prestigious art exhibition that was sponsored by the French government and promoted traditional painting styles. Impressionist painters likely chose these colorful frames to distinguish themselves from what was considered conventional at the time.\n\nText 2 Impressionist painters often focused on the interplay of color and light in their works. As such, those Impressionists who placed their works in painted frames instead of the more traditional gold ones did so for aesthetic reasons: a frame’s color was likely chosen because it would harmonize with the colors or subjects in a painting. Gold, conversely, could distract from the subtleties in a painted scene.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Gold frames were considered especially desirable by those who purchased works from Impressionist painters.","The colors in an Impressionist painting were often chosen to complement the colors of the frame it would be placed in.","Many Impressionist painters were intentional about the frames they selected for their works.","Degas’s preferred framing style was different from that of most Impressionist painters."],"a":2,"r":"Choice C is the best answer because it presents the statement about the use of painted frames in Impressionist painting that both authors would be most likely to agree with. Text 1 discusses painter Edgar Degas’s insistence that his works remain in their original painted frames, which contrasted with the gold frames that were typical of the Paris art scene at the time. The text then argues that the preference of Degas and other French Impressionist painters for colorful frames can likely be attributed to their desire \"to distinguish themselves from what was considered conventional at the time.\" Text 2 also notes that Impressionist painters \"placed their works in painted frames\" but argues that they probably did so for a purely aesthetic reason: to ensure that \"the frame’s color...would harmonize with the colors or subjects in a painting.\" Though differing on Impressionist painters’ rationale for using painted frames, the authors of both texts would agree that many Impressionist painters were intentional about the frames they selected for their works. Choice A is incorrect because neither text suggests that gold frames were considered desirable by those purchasing Impressionist works. Indeed, it can be inferred from the fact that Impressionist painters used painted frames that those who purchased those works wouldn’t have had a strong preference for gold frames. Choice B is incorrect because neither text suggests that Impressionist painters chose colors for their paintings based on planned frame colors. Indeed, Text 2 states that frame colors were chosen to \"harmonize with the colors or subjects in a painting,\" implying that the color scheme of paintings predated and took precedence over the choice of the colors of frames. Choice D is incorrect because Text 1 presents Degas’s preference for painted frames as being typical of Impressionist painters’ attitudes toward the framing of their works. Moreover, although Text 2 doesn’t specifically discuss Degas, it concurs with Text 1’s assertion that these painters preferred painted frames. Thus, both texts position painted frames as a hallmark of French Impressionist painting, not as a deviation from it."},{"i":"e47d2524","c":"main","d":"M","s":"Microplastics are tiny pieces of plastic waste. Areas of the ocean with higher concentrations of microplastic particles also have smaller and fewer waves. A study by Yukun Sun and colleagues found that the concentration of microplastic particles cannot be the only reason for this reduced wave activity because the concentration of particles that would have the observed effect is much higher than that found in these areas of the ocean. However, they found that surfactants, chemicals often used to manufacture plastics, are released into the water from microplastics and have a much stronger wave-reducing effect.\n\nAccording to the text, what did Sun and colleagues discover about surfactants?","o":["They have a much stronger effect on wave activity than microplastics alone do.","They are mainly composed of water.","They are helpful for removing microplastics from the ocean.","They can be used to contain microplastics within certain areas of the ocean."],"a":0,"r":"Choice A is the best answer because it presents a statement about surfactants that is supported by the text. The text indicates that higher concentrations of microplastics have been associated with waves that are relatively small and few. According to the text, however, a study by Sun and colleagues found that concentrations of microplastic particles can’t be the only reason for the reduced wave activity because a much higher concentration of particles is needed to produce that observed effect. Instead, the text indicates that Sun and colleagues found that surfactants are released from microplastics into the ocean and have a much stronger wave-reducing effect than microplastics alone do. Choice B is incorrect because the text doesn’t discuss what surfactants are made of. Instead, it indicates that surfactants are frequently used to manufacture microplastics and that Sun and colleagues discovered that surfactants are released from microplastics into the ocean. Choice C is incorrect because the text doesn’t discuss how microplastics can be removed from the ocean. Instead, the text indicates that Sun and colleagues discovered that surfactants are released into the ocean from microplastics and have a much stronger wave-reducing effect than microplastics alone do. Choice D is incorrect because the text doesn’t indicate that surfactants can be used to contain microplastics within certain areas of the ocean. Instead, the text indicates that Sun and colleagues discovered that surfactants are released from microplastics into the ocean and have a much stronger wave-reducing effect than microplastics alone do."},{"i":"995d55fd","c":"main","d":"M","s":"A subject of much speculation, distinctive sets of parallel ridges mark the icy crust of Europa, Jupiter’s smallest moon. Researchers now claim that the ridges’ formation mechanism mirrors that of a strikingly similar pair on Greenland’s ice sheet. There, surface water seeped through fissures in the sheet and formed a water pocket that subsequently disrupted the overlying ice, forcing fragments of it upward and outward into peaks, as the pocket froze and expanded. Although Europa lacks liquid surface water, the same process could be driven by the moon’s subsurface ocean.\n\nWhich choice best states the main idea of the text?","o":["Researchers think that the ridges on Europa and the ridges in Greenland may have been formed by the same process even though Europa, unlike Greenland, doesn’t have liquid water on its surface.","The primary difference between the ridges on Europa and the ridges in Greenland is that unlike the Europa ridges, the Greenland ridges are parallel.","The pair of ridges found on Greenland’s ice sheet appear to have formed long before the recently discovered sets of ridges on Europa formed.","Researchers don’t understand why Europa is marked by so many sets of ridges when the moon doesn’t have any liquid water on its surface that could have collected and expanded under the icy crust."],"a":0,"r":"Choice A is the best answer because it accurately states the main idea of the text. The text focuses on formations of parallel ice ridges on Jupiter’s moon Europa that are said to be formed by the same mechanism that formed a parallel set of ridges on Greenland’s ice sheet. The text indicates that in Greenland, water on the surface seeps to the lower portion of the ice sheet, resulting in uplift that creates the ridges, and it states that although Europa lacks liquid water on its surface, the same process could be driven by an ocean below Europa’s surface. In other words, the main idea of the text is that parallel ridges in the ice on Europa and Greenland are likely caused by similar processes even though in Greenland the process begins with liquid water on the surface while Europa lacks liquid water on the surface. Choice B is incorrect because the text states outright that the ridges on Europa are parallel and furthermore refers to Greenland’s ridges as \"strikingly similar\" to those on Europa. Choice C is incorrect because the text makes no mention of when any of the ice ridges formed, either separately or relative to one another. Choice D is incorrect because the text does not indicate any uncertainty about the reason for the ice ridges on Europa and, in fact, clearly states that researchers now claim to know the mechanism that created the ridges."},{"i":"4f9f8ea6","c":"infer","d":"H","s":"Birds of many species ingest foods containing carotenoids, pigmented molecules that are converted into feather coloration. Coloration tends to be especially saturated in male birds’ feathers, and because carotenoids also confer health benefits, the deeply saturated colors generally serve to communicate what is known as an honest signal of a bird’s overall fitness to potential mates. However, ornithologist Allison J. Shultz and others have found that males in several species of the tanager genus Ramphocelus use microstructures in their feathers to manipulate light, creating the appearance of deeper saturation without the birds necessarily having to maintain a carotenoid-rich diet. These findings suggest that ______ Which choice most logically completes the text?","o":["individual male tanagers can engage in honest signaling without relying on carotenoid consumption.","feather microstructures may be less effective than deeply saturated feathers for signaling overall fitness.","scientists have yet to determine why tanagers have a preference for mates with colorful appearances.","a male tanager’s appearance may function as a dishonest signal of the individual’s overall fitness."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of Shultz’s finding about male tanagers. The text explains that because carotenoids both contribute to deeply saturated feathers and offer health benefits, having deeply saturated feathers is usually “an honest signal” (a true indication) that a bird is generally fit. However, Shultz and others have found that certain male tanagers can appear to have deeply saturated feathers even if they haven’t consumed a diet rich in carotenoids, thanks to microstructures in their feathers that manipulate light. If those birds aren’t necessarily eating carotenoid-rich diets, they may actually be less fit than other birds that appear to have similarly saturated feathers; this suggests that a male tanager’s appearance may function as a dishonest signal, or a false indication, of the bird’s overall fitness. Choice A is incorrect because Shultz’s finding suggests that some tanagers can signal fitness without consuming the carotenoids that contribute to fitness, thereby making those signals dishonest, not that tanagers can give honest signals of their fitness without consuming carotenoids. Choice B is incorrect because Shultz’s finding suggests that the microstructures in certain tanagers’ feathers can give a dishonest signal of fitness, not that the microstructures are less effective than actual pigmentation for signaling fitness. Whether the signal of fitness is honest or dishonest has no bearing on how effective the signal is: a signal is effective if potential mates behave as though it’s true, regardless of whether it’s actually true. Since there’s no information in the text about how potential mates respond to the dishonest signals of some tanagers, there’s no support for the idea that the dishonest signals are less effective than the honest signals. Choice C is incorrect because Shultz’s finding suggests that certain male tanagers may appear to be fitter than they actually are, not that scientists haven’t determined why tanagers prefer mates with colorful appearances."},{"i":"d1539546","c":"infer","d":"H","s":"Tides can deposit large quantities of dead vegetation within a salt marsh, smothering healthy plants and leaving a salt panne—a depression devoid of plants that tends to trap standing water—in the marsh’s interior. Ecologist Kathryn Beheshti and colleagues found that burrowing crabs living within these pannes improve drainage by loosening the soil, leading the pannes to shrink as marsh plants move back in. At salt marsh edges, however, crab-induced soil loosening can promote marsh loss by accelerating erosion, suggesting that the burrowing action of crabs ______ Which choice most logically completes the text?","o":["can be beneficial to marshes with small pannes but can be harmful to marshes with large pannes.","may promote increases in marsh plants or decreases in marsh plants, depending on the crabs’ location.","tends to be more heavily concentrated in areas of marsh interiors with standing water than at marsh edges.","varies in intensity depending on the size of the panne relative to the size of the surrounding marsh."],"a":1,"r":"Choice B is the best answer. The text says that crab burrowing in the pannes enables plants to grow there again. It also says that crab burrowing at the edges of the marsh speeds up marsh loss. This suggests that burrowing crabs can either help or hurt marshes, depending on where they’re located. Choice A is incorrect. This inference isn’t supported. The text never discusses pannes of different sizes. Choice C is incorrect. This inference isn’t supported. The text never suggests that crabs do more burrowing in the pannes (the areas with standing water) than they do at the edges. Rather, the text says that the burrowing that happens in the pannes is beneficial, while the burrowing that happens at the edges is harmful. Choice D is incorrect. This inference isn’t supported. The text never discusses the intensity of crab burrowing, nor does it discuss the size of the panne relative to the size of the marsh."},{"i":"194dd448","c":"claim","d":"M","s":"“John of God, the Water-Carrier” is a 1913 short story by María Cristina Mena. In the story, the narrator presents John as being a hard worker who is fully dedicated to his job as water carrier, or aguador: ______ Which quotation from “John of God, the Water-Carrier” most effectively illustrates the claim?","o":["“Very happy, he would jog home, the heavy silver pieces in his leather pockets making a discreet and dulcet ‘trink-trak’ between his jugs and his body.”","“He learned that the city aguador may not blow his whistle to halt the traffic while he gravely crosses the street, but must wait for the passing of many vehicles, some with horses and some outlandishly without.”","“From early morn to the fall of the afternoon he would go from fountain to fountain and from portal to portal, his lean body so accustomed to bending that he never thought of straightening it, his head bowed as if in prayer.”","“When his first jugs had worn out—the sweet-scented, porous red clay becomes perforated in time—he had buried them to their necks in the corner where he slept, and they were now his treasury.”"],"a":2,"r":"Choice C is the best answer because it most effectively illustrates the claim in the text that John is hard-working and dedicated to his job. In the quotation, John is portrayed as spending “early morn to the fall of the afternoon” working hard as a water carrier. John is also described as “so accustomed to bending” while doing his work “that he never thought of straightening” his body, instead remaining deeply focused on his work. These details portray John as a dedicated worker. Choice A is incorrect because this quotation portrays John as happy about heading home after being paid. It doesn’t showcase John being hard at work. Choice B is incorrect because this quotation doesn’t pertain to John’s commitment to his work; it describes difficulties the traffic in the city causes John in the performance of his work. Choice D is incorrect because this quotation doesn’t pertain to John’s commitment to his work; it discusses what John does with his worn-out water jugs."},{"i":"2584bcfb","c":"claim","d":"M","s":"Matthew D. Rocklage and team examined whether consumer ratings of movies can predict box office success. The team considered both numeric star ratings and written reviews in their research. To analyze the written reviews, the team measured the emotionality—the degree to which a written review expresses an emotional reaction—of user reviews on a movie rating website, assigning each review an emotionality score. After reviewing this research, a student argues that the emotionality of movie reviews is unrelated to a movie’s success at the box office.\n\nWhich finding, if true, would most directly weaken the student’s conclusion?","o":["Movies that had the highest average emotionality scores received the lowest average star ratings on the movie rating website.","The average emotionality score of a movie’s reviews was a positive predictor of that movie’s box office earnings.","More than half of the movies that the team examined received an average star rating of 3 out of 5 stars.","The movies that were most successful at the box office tended to have high average star ratings."],"a":1,"r":"Choice B is the best answer. This choice weakens the student’s conclusion by suggesting that the emotionality of movie reviews is related to box office success: the higher the emotionality score, the better the movie performs at the box office. Choice A is incorrect. While this choice does mention emotionality scores, it only connects them to star ratings, not to box office success. Choice C is incorrect. The fact that many movies received an average star rating doesn’t tell us anything about the relationship between emotionality and box office success. Choice D is incorrect. While this choice suggests that star ratings can predict box office success, it doesn’t address the issue of emotionality in written reviews, which is the focus of the student’s conclusion."},{"i":"2c06139b","c":"graph","d":"H","s":"","o":["The difference in average tadpole body mass was small between the low and medium population density conditions and substantially larger between the low and high population density conditions.","Tadpoles in the low and medium population density conditions had substantially lower average bufadienolide concentrations but had greater average body masses than those in the high population density condition.","Tadpoles in the high population density condition displayed a relatively modest increase in the average amount of bufadienolide but roughly double the average bufadienolide concentration compared to those in the low population density condition.","Tadpoles produced approximately the same number of different bufadienolide toxins per individual across the population density conditions, but average tadpole body mass decreased as population density increased."],"a":1,"r":"Choice B is the best answer. This data shows that the tadpoles in the high-density pond (meaning those with the most competition) didn’t grow as big as the other two groups but produced more bufadienolide. Choice A is incorrect. This doesn’t fully support the conclusion. It doesn’t include any data about bufadienolide production. Choice C is incorrect. This doesn’t fully support the conclusion. It doesn’t include any data about growth. Choice D is incorrect. This doesn’t fully support the conclusion. It doesn’t demonstrate that the tadpoles in the high-density pond produced more bufadienolide overall. The fact that they didn’t produce more kinds of bufadienolide isn’t relevant to the conclusion."},{"i":"ccf414c9","c":"graph","d":"M","s":"","o":["the percentage of 2016 cookbook sales that were e-books with the percentage of 2016 science fiction and fantasy sales that were e-books.","the percentage of 2006 romance sales that were e-books with the percentage of 2016 romance sales that were e-books.","the percentage of 2006 romance sales that were e-books with the 2006 science fiction and fantasy sales that were e-books.","the percentage of 2011 travel guide sales that were e-books with the percentage of 2016 travel guide sales that were e-books."],"a":0,"r":"Choice A is the best answer because it uses data from the table to effectively support the claim that book genres that typically require the reader to start at the beginning of the story and read straight through are more commercially successful as e-books than other genres. For each of three years, the table presents four book genres and the percentage of total sales for each genre in e-book format. Cookbooks, a nonfiction genre, do not require the reader to read straight through. According to the table, 10.5 percent of total cookbook sales in 2016 were in the e-book format. The 2016 percentage of e-book sales was 36.7 percent in the science fiction and fantasy genre, which are typically stories read straight through from start to finish. The higher percentage of total sales of the story-based e-books in 2016 supports the claim in the text. Choice B is incorrect because it compares the e-book sales of romance books in 2006 to those in 2016. Romance books are meant to be read straight through from start to finish. The text claims that books that are not stories and do not require reading straight through are not as commercially successful in e-book format as those that do. As this choice is only comparing e-book sales for one genre, it does not support the claim. Choice C is incorrect because both science fiction and fantasy and romance novels are fiction books meant to be read straight through from beginning to end. The text claims that books that are not stories and do not require reading straight through are less commercially successful in e-book format than those that do. As this choice does not compare e-book sales of story genres to e-book sales in genres that are not stories, it does not support the claim. Choice D is incorrect. Although the data in the table show that the travel guide e-books made up a greater percentage of total sales in 2016 than in 2011, this doesn’t illustrate the claim in the text that e-books in nonfiction genres not meant to be read straight through are less commercially successful. The claim cannot be supported without comparing the percentage of e-book sales between fiction and nonfiction book genres from the table."},{"i":"37e5c794","c":"fss","d":"H","s":"Despite being cheap, versatile, and easy to produce, ______ they are made from nonrenewable petroleum, and most do not biodegrade in landfills.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["there are two problems associated with commercial plastics:","two problems are associated with commercial plastics:","commercial plastics’ two associated problems are that","commercial plastics have two associated problems:"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-modifier placement. This choice ensures that the modifying phrase “despite being cheap, versatile, and easy to produce” appears immediately before the noun it modifies, “commercial plastics,” clearly establishing that the commercial plastics—and not another noun in the sentence—are being described as cheap, versatile, and easy to produce. Choice A is incorrect because it results in a dangling modifier. The placement of the function word “there” immediately after the modifying phrase illogically and confusingly suggests that “there” is cheap, versatile, and easy to produce. Choice B is incorrect because it results in a dangling modifier. The placement of the noun “two problems” immediately after the modifying phrase illogically suggests that the “problems” are cheap, versatile, and easy to produce. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “commercial plastics’ two associated problems” immediately after the modifying phrase illogically suggests that the “problems” are cheap, versatile, and easy to produce."},{"i":"2d6f8304","c":"fss","d":"E","s":"In 2019, New Zealand produced 88,465 hectograms per hectare (hg/ha) of wheat, and Portugal produced 23,298 hg/ha. This is the type of information on global food production that the United Nations’ Food and Agriculture Organization ______ since 1945.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is collecting","has collected","will collect","collects"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the present perfect tense verb “has collected,” used in conjunction with the phrase “since 1945,” correctly indicates that the Food and Agriculture Organization has collected this type of information in the past and continues to do so in the present. Choice A is incorrect because the present progressive tense verb “is collecting” is inconsistent with the phrase “since 1945,” which indicates that the action occurred in the past and continues into the present. Choice C is incorrect because the future tense verb “will collect” is inconsistent with the phrase “since 1945,” which indicates that the action occurred in the past and continues into the present. Choice D is incorrect because the present tense verb “collects” is inconsistent with the phrase “since 1945,” which indicates that the action occurred in the past and continues into the present."},{"i":"56315bd0","c":"fss","d":"M","s":"Solarpunk is an art movement that imagines renewable energy–powered technology infused complementarily into nature. In Paolo Bacigalupi’s solarpunk short story “Efficiency,” an artificial intelligence that absorbs sustainable energies, redistributing them through intricate networks of weights and generators, ______ Chicago’s energy grid.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have been powering","power","powers","are powering"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb \"powers\" agrees in number with the singular subject \"an artificial intelligence.\" Choice A is incorrect because the plural verb \"have been powering\" doesn’t agree in number with the singular subject \"an artificial intelligence.\" Choice B is incorrect because the plural verb \"power\" doesn’t agree in number with the singular subject \"an artificial intelligence.\" Choice D is incorrect because the plural verb \"are powering\" doesn’t agree in number with the singular subject \"an artificial intelligence.\""},{"i":"78e978b5","c":"bound","d":"H","s":"The Organisation for Economic Co-operation and Development (OECD) tracks comparative price list data for its thirty-eight member countries. For instance, in July 2021, a hypothetical basket of goods priced at 100 US dollars (USD) in the United States would have cost 62 USD and 110 USD in fellow OECD ______ and Luxembourg, respectively.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["nations, Chile","nations; Chile","nations: Chile","nations Chile"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed to set off the coordinated noun phrase \"Chile and Luxembourg\" from the title that describes the two countries, \"fellow OECD nations.\" Because the proper nouns \"Chile and Luxembourg\" are essential information identifying the \"fellow OECD nations,\" no punctuation is necessary. Choice A is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Further, setting the countries’ names off with commas suggests that they could be removed without affecting the coherence of the sentence, which isn’t the case. Choice B is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Choice C is incorrect because no punctuation is needed between the country names (\"Chile and Luxembourg\") and the title (\"fellow OECD nations\") describing them. Placing a colon after \"nations\" would confusingly suggest that these were the costs of the basket of goods for \"fellow OECD nations\" in general, not for Chile and Luxembourg specifically."},{"i":"85b8b9c5","c":"bound","d":"E","s":"Many mechanical calculators were powered by a notched cylinder mechanism called the Leibniz wheel. Leibniz wheel calculators were popular in the first half of the twentieth ______ these ingenious devices were eventually replaced by electronic calculators.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["century","century,","century, but","century that"],"a":2,"r":"Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and a coordinating conjunction (\"but\") to join the first main clause (\"Leibniz...century\") and the second main clause (\"these ingenious...calculators\"). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice D is incorrect because joining the two main clauses in this way with the subordinating conjunction \"that\" results in an ungrammatical and illogical sentence."},{"i":"804928b6","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Mary Kang is a Korean American portrait photographer. She is based in New York City and in Austin, Texas. One of Kang’s photographs features artist Dominique Fung. In the portrait, Fung is seated on the floor. Five of Fung’s paintings are resting against the wall behind her. The student wants to describe where Fung is in the photograph to an audience already familiar with Kang and Fung.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Dominique Fung is in a photograph by Mary Kang, a portrait photographer based in New York City and Austin, Texas.","Mary Kang is a photographer based in both New York City and Austin, Texas.","Five paintings by artist Dominique Fung can be seen in the background of Mary Kang’s photograph.","In Kang’s portrait of her, Fung is seated on the floor, with five of her paintings resting against the wall behind her."],"a":3,"r":"Choice D is the best answer. The sentence describes Fung’s location in Kang’s photograph, noting that Fung is seated on the floor. Additionally, because the sentence is intended for an audience already familiar with the artists, it omits the artists’ first names and other biographical information about them. Choice A is incorrect. The sentence indicates that Fung appears in Kang’s photograph; it doesn’t describe Fung’s location in Kang’s photograph. Choice B is incorrect. The sentence identifies Kang and where she is based; it doesn’t describe Fung’s location in Kang’s photograph. Choice C is incorrect. The sentence describes the background of Kang’s photograph; it doesn’t describe Fung’s location in Kang’s photograph."},{"i":"164a32e7","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Claude McKay (1889–1948) was a Jamaican American writer. Songs of Jamaica (1912) and Constab Ballads (1912) are two acclaimed poetry collections that McKay published while living in Jamaica. McKay moved to Harlem in New York City in 1914. He is best known as a poet and novelist of the Harlem Renaissance, a literary and cultural movement of the 1920s and 1930s. His most famous works include the poetry collection Harlem Shadows (1922) and the novel Home to Harlem (1928). The student wants to emphasize Claude McKay’s accomplishments before moving to Harlem.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Jamaican American writer Claude McKay is the author of works such as Songs of Jamaica (1912), Constab Ballads (1912), Harlem Shadows (1922), and Home to Harlem (1928).","Although he is best known as a Harlem Renaissance writer, Claude McKay had published two acclaimed poetry collections in 1912 while living in Jamaica: Songs of Jamaica and Constab Ballads.","In 1914, Claude McKay moved to Harlem, where he would become known as a poet and novelist of the Harlem Renaissance (a literary and cultural movement of the 1920s and 1930s).","Before moving to Harlem, Claude McKay—author of the poetry collection Harlem Shadows (1922) and the novel Home to Harlem (1928)—lived in Jamaica."],"a":1,"r":"Choice B is the best answer. This choice contrasts McKay’s fame as a Harlem Renaissance writer with his earlier achievements as a Jamaican poet, and it names the two collections he published before moving to Harlem. Choice A is incorrect. This choice doesn’t emphasize McKay’s accomplishments before moving to Harlem. It lists some of his works but doesn’t distinguish between those he wrote in Jamaica and those he wrote in Harlem. Choice C is incorrect. This choice doesn’t emphasize McKay’s accomplishments before moving to Harlem. It only mentions the year he moved and what he would become known for afterwards. Choice D is incorrect. This choice doesn’t emphasize McKay’s accomplishments before moving to Harlem. It mentions that he lived in Jamaica, but it doesn’t name any of the works he published there."},{"i":"11df9b99","c":"trans","d":"M","s":"Because an achiral molecule is symmetrical, flipping it yields a structurally identical molecule. A flipped chiral molecule, ______ can be compared to a glove that has been turned inside out: it produces a structurally inverted molecule rather than an identical one.\n\nWhich choice completes the text with the most logical transition?","o":["in other words,","by contrast,","for example,","similarly,"],"a":1,"r":"Choice B is the best answer. This sentence compares a chiral molecule to an achiral one. It discusses how when a chiral molecule is flipped, it results in something very different than when an achiral molecule is flipped. So the transition \"by contrast\" fits the context perfectly. Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea in different words. But this sentence doesn’t restate the same idea as the previous sentence. Instead, it makes a new point about a different type of molecule (chiral instead of achiral). Choice C is incorrect. This choice uses a transition that introduces an example, which doesn’t make sense here. The second sentence isn’t an example of the first sentence’s claim about achiral molecules: it actually introduces an entirely different idea that focuses on chiral molecules. Choice D is incorrect. This choice uses a transition that indicates the addition of an agreeing idea. But this sentence shows a contrast with the first sentence—namely, that a chiral molecule acts very differently from an achiral molecule when flipped."},{"i":"ad729337","c":"trans","d":"H","s":"With its clichéd imagery of suburban lawns and power lines, John Ashbery’s 2004 poem “Ignorance of the Law Is No Excuse” may seem barren terrain for critical analysis. ______ cultural critic Lauren Berlant finds fertile ground in just its first two stanzas, devoting most of a book chapter to deciphering the “weight of the default space” Ashbery creates in this poem.\n\nWhich choice completes the text with the most logical transition?","o":["Likewise,","Nonetheless,","In turn,","That is,"],"a":1,"r":"Choice B is the best answer. “Nonetheless” is a transition that indicates disagreement. The first sentence describes the unlikelihood of finding much for critical analysis in Ashbery’s poem (“barren terrain”), while the second sentence describes how Berlant did in fact find much to analyze in Ashbery’s poem (“fertile ground”), so the transition “nonetheless” fits perfectly. Choice A is incorrect. This choice uses a transition that indicates the addition of a new but similar idea, which doesn’t make sense here. The idea in this sentence directly contradicts the idea in the previous sentence. Choice C is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense in this context—a poem seemingly having little opportunity for critical analysis would not cause someone to write an extensive critical analysis (in fact, we might expect the opposite). Choice D is incorrect. This choice uses a transition that indicates a restatement of the same idea in other words. But the text isn’t restating the first idea here. Instead, it’s offering a contradiction to the idea expressed in the first sentence."}],"img":{"2c06139b":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEhBAMAAABvhG5wAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABaCklEQVR42u19d1xT1/v/+9ybhDBzEnCj3ADuQRDcK4BabR1xa1s1autobcXaYaut0Vr3QGtbVxW1WkdVnHWgBPcAiXsCQVxVITcsEUju748AAqICou3n++N5vZQk99znnPM+z3nu8zznnOcCFVRBFVRBFVRBFVRB/wnylCsBgFHbvnoDAGy/AUEAQADy/H1eIEoFh9wCAIhn3iW/vA/yAuUra3I/KOQK70KcKKiNgW8BbnktAOBF/3fRFcdarwIAY7B1dQ4AMJZYNUCBY6DAUDU6aJ+DuB2ksZaLAAAHNQBMid6de2mv7Q9DJxYo/32gbSww3xQ75NnP7FE2QWyrmzGAAHACAMTELs4r0u0NQ8C8Qd7ZXlfqs4FgAnjPIJAgXgY/CnKs/g748+gtU5o5yquhAesrdOSoNwf4U4W3Cn4eyKx7qTHry6hY+0ilGnDwO8N4UX8g0MxCCX/aavwK+FNXVxWoWwDbze5H+IH1xIShQTFulHVDEEhfWFi2siiMVYNVAYysGUUm46UG7nu3QG3KenHUywP+/7vyS+5g8jxV282G+St0bVYEzxYf2AVWb2eovjnEYV/qb5JQDDnKRgWvWFFp/1HxgV3E/sDOGpuuSE5HAeLzmLzc6/yHNQIfHKB0FmpVuVZv8w6HU/fc8Ztk/5Ghu5ba7d/ttOkSYbZsrJMz95704JrGx4HutMnyI87HG/6lbbBFSzc6nnFWz91MJ22mxkl1DuxEI7tr14Fj+FByYLfj8uPi01GSA0ffJAKiN8lc4HF1728tO+x3HxvbcFDSRumM94nQ5pRuxKjEc++fvyQyosZdURI9cXDkyXS7K5dhGbk function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}
function fb(q){const a=ans[q.i],S=seg(q.r);
 if(a===undefined)return `<p class="v bad">Not answered. The correct answer is ${L[q.a]}.</p><p>${S[L[q.a]]||q.r}</p>`;
 const own=S[L[a]]||q.r;
 return a===q.a?`<p class="v ok">Correct.</p><p>${own}</p>`:`<p class="v bad">Not quite. You chose ${L[a]}.</p><p>${own}</p><p class="v ok">The correct answer is ${L[q.a]}.</p><p>${S[L[q.a]]||""}</p>`}
function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
function sum(){const d=Object.keys(ans).length,ok=Q.filter(q=>ans[q.i]===q.a).length;$("#sum").textContent=done?`Score: ${ok} of ${Q.length} correct (${Math.round(100*ok/Q.length)}%)`:`${d} of ${Q.length} answered`}
function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
