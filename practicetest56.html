<script>
const D={"t":"Practicetest56","q":[{"i":"83fd3cf4","c":"vocab","d":"H","s":"Despite stated claims of global relevance, much major research on income inequality performed in the 2010s suffered from a myopic focus on a few countries in North America and Western Europe, partly due to limited data availability. Researchers would later ______ this shortcoming after gaining new access to banking records located in nations in Africa, such as Tunisia, and Eastern Europe, such as Hungary.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["presuppose","categorize","mitigate","validate"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of research on income inequality in the 2010s. In this context, \"mitigate\" means to make less severe or reduce the negative effects of something. The text first identifies a shortcoming in the research: a \"myopic focus on a few countries\" despite claims of \"global relevance.\" The text then explains that researchers later gained access to new data from previously excluded regions (Africa and Eastern Europe). This context supports the idea that with these new data, researchers would be able to reduce, or mitigate, the identified shortcoming by incorporating a broader range of geographic regions into their studies of income inequality. Choice A is incorrect because in this context, \"presuppose\" would mean to assume in advance that something is true, and it wouldn’t make logical sense to say that researchers later assumed as true in advance a shortcoming they had already encountered. Choice B is incorrect because in this context, \"categorize\" would mean to classify or place into groups. The text indicates that researchers did something about the shortcoming that characterized research on income inequality in the 2010s—limited geographic scope—after they gained access to new data from previously excluded regions. Categorizing a shortcoming doesn’t require access to or analysis of new data; it could be done without any new information, but by analyzing new data, researchers went beyond merely categorizing the shortcoming and instead took action to address it. Choice D is incorrect because in this context, \"validate\" would mean to confirm or substantiate something. The text indicates that researchers did something about a known shortcoming of research on income inequality in the 2010s—limited geographic scope—after they gained access to new data from previously excluded regions. Confirming an already known shortcoming doesn’t require access to or analysis of new data; it could be done without any new information, but by analyzing new data, researchers went beyond merely validating the shortcoming and instead took action to make the shortcoming less severe."},{"i":"e5e7f264","c":"vocab","d":"E","s":"The general store was essential to daily life in the rural United States during the 1800s because it provided the supplies that the people living in nearby communities needed. Also, the store was a ______ of information. People socializing at the general store would share news and help spread it throughout their communities.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["source","rival","condition","waste"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the role of the general store in US rural communities during the 1800s. In this context, \"source\" means a place where something originates or is obtained. The text states that people would share news while socializing at the general store. This context supports the idea that the store served as a source of information in rural communities. Choice B is incorrect because \"rival\" would mean competitor or opponent. The text doesn’t indicate that the general store was a rival of anything. Instead, the text describes the general store as a place that enabled the sharing of information within rural communities. Choice C is incorrect because in this context, \"condition\" would mean state, circumstance, or requirement. Although the text implies that visiting the store was helpful for acquiring information since people shared news there, it wouldn’t make sense to say that the general store was a condition of information. Choice D is incorrect because \"waste\" would mean something that is unused, discarded, or spent unnecessarily, which would not make sense in context. The text describes the general store as an essential part of daily life and a place for socializing and information sharing. The store was therefore a source, not a waste, of information."},{"i":"b11bb2a3","c":"vocab","d":"E","s":"The following text is adapted from Amy Lowell’s 1912 poem “Summer.” It is summer, glorious, deep-toned summer, The very crown of nature’s changing year When all her surging life is at its full. To me alone it is a time of pause, A void and silent space between two worlds, When inspiration lags, and feeling sleeps, Gathering strength for efforts yet to come.\n\nAs used in the text, what does the phrase “a void” most nearly mean?","o":["A useless","An empty","A forgotten","An incomplete"],"a":1,"r":"Choice B is the best answer because as used in the text, a span of time is described as \"a void\" space, which most nearly means an empty or vacant one. In the text, the speaker describes summertime in counterintuitive terms: although nature’s \"surging life is at its full\" during the season, the speaker feels summer to be \"a time of pause, / A void and silent space between two worlds.\" The speaker says further that during summer, \"feeling sleeps / Gathering strength\" for future efforts. Thus, the speaker regards summer as an empty stretch of time, to be followed by a period of greater activity. Choice A is incorrect. Although the text does present summer as a time of inactivity, it doesn’t characterize that inactivity as useless, or as having no purpose; in fact, the speaker regards summer as a time when \"feeling\" gathers \"strength for efforts yet to come.\" Choice C is incorrect. Although the text characterizes summer as a time \"when inspiration lags, and feeling sleeps,\" it doesn’t discuss the season’s relationship to the speaker’s memory or suggest that summer can easily be forgotten. Choice D is incorrect. In some contexts, \"void\" can mean devoid of, or lacking, a particular element, and such a lack could be conceived of as incompleteness. However, the text doesn’t portray summer as not being complete or whole; instead, it characterizes vacancy or inactivity as being an essential quality of the season, as experienced by the speaker."},{"i":"6c64a8f3","c":"vocab","d":"M","s":"Ecologist Exequiel Ezcurra and colleagues found that the inhabitants of the Mexica empire used natural landmarks to track time with a high degree of ______. By observing the sun’s position in relation to various points on the mountains surrounding the Basin of Mexico, the Mexica were able to precisely identify the dates when significant events such as solstices occurred.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["precariousness","exactitude","resilience","inconspicuousness"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the method the inhabitants of the Mexica empire used to track time. In this context, \"exactitude\" means precision. The text indicates that the Mexica used the sun’s position relative to various natural landmarks to track the passage of time, explaining that such methods allowed the Mexica to accurately determine the dates of important events such as solstices. This context supports the idea that the Mexica people were able to track time with a high degree of precision, or exactitude. Choice A is incorrect because in this context \"precariousness\" would mean instability, and there’s nothing in the text to suggest that the method used by the Mexica people to track time was unstable or produced unstable results. Rather, the text indicates that the method yielded precise results, allowing the Mexica to accurately determine the dates of significant events. Choice C is incorrect because in this context \"resilience\" would mean persistence, and there’s nothing in the text to suggest that the Mexica worked stubbornly in spite of obstacles in order to track time. Choice D is incorrect because in this context \"inconspicuousness\" would mean discreetness, and there’s nothing in the text to suggest that the Mexica wanted to track time without being noticed."},{"i":"975b0602","c":"purpose","d":"H","s":"A number of Indigenous politicians have been elected to the United States Congress since 2000 as members of the country’s two established political parties. In Canada and several Latin American countries, on the other hand, Indigenous people have formed their own political parties to advance candidates who will advocate for the interests of their communities. This movement has been particularly successful in Ecuador, where Guadalupe Llori, a member of the Indigenous party known as Pachakutik, was elected president of the National Assembly in 2021.\n\nWhich choice best states the main purpose of the text?","o":["To trace the history of an Indigenous political movement and speculate about its future development","To argue that Indigenous politicians in the United States should form their own political party","To highlight two approaches to achieving political representation for Indigenous people","To consider how Indigenous politicians in the United States have influenced Indigenous politicians in Canada and Latin America"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to illustrate two approaches that Indigenous politicians have taken to achieve political representation for their communities. The text begins by explaining that one approach is exemplified by Indigenous politicians in the United States who, in an effort to ensure that the interests of their communities are represented in government, joined preexisting political parties and were subsequently elected to Congress. The text goes on to highlight a second approach adopted by Indigenous leaders in Canada and several Latin American countries: rather than joining established political parties, many Indigenous politicians in these countries have instead formed their own parties to promote candidates for office who support causes that are important to their communities. Choice A is incorrect because the text’s focus is on the contrasting approaches adopted by different Indigenous political movements in different countries; thus, it isn’t accurate to say that the text traces the history of one political movement. Moreover, the text only discusses examples from 2000 to 2021, a relatively short period of time; therefore, it provides very little in the way of discussion of larger historical developments, nor does it make any predictions about how these movements might continue to develop in the future. Choice B is incorrect because the text never urges Indigenous politicians in the US to alter their strategy of striving for representation through the established political parties, nor does it suggest that this strategy is inferior to that of Indigenous politicians in Canada and Latin America, who have formed their own parties. In fact, the text notes that both strategies have resulted in the election of Indigenous politicians to national governments. Choice D is incorrect because the text never suggests that Indigenous politicians in the US have influenced those in Canada and Latin America; instead, it stresses how Indigenous politicians’ approach toward achieving representation in the US government has differed from the approach Indigenous politicians have taken to achieve representation in national governments elsewhere in the Americas."},{"i":"2d77660e","c":"purpose","d":"M","s":"In the late 1800s, Spanish-language newspapers flourished in cities across Texas. San Antonio alone produced eleven newspapers in Spanish between 1890 and 1900. But El Paso surpassed all other cities in the state. This city produced twenty-two newspapers in Spanish during that period. El Paso is located on the border with Mexico and has always had a large population of Spanish speakers. Thus, it is unsurprising that this city became such a rich site for Spanish-language journalism.\n\nWhich choice best states the main purpose of the text?","o":["To compare Spanish-language newspapers published in Texas today with ones published there during the late 1800s","To explain that Spanish-language newspapers thrived in Texas and especially in El Paso during the late 1800s","To argue that Spanish-language newspapers published in El Paso influenced the ones published in San Antonio during the late 1800s","To explain why Spanish-language newspapers published in Texas were so popular in Mexico during the late 1800s"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text begins by stating that there were many Spanish-language newspapers in cities across Texas in the late 1800s, citing San Antonio as a city that produced eleven such newspapers. The text then goes on to note that in El Paso, there were twenty-two newspapers published in Spanish in the late 1800s, more than any other Texas city. The text then concludes by explaining that the reason for this large number of Spanish-language newspapers was likely El Paso’s location near Mexico and its large population of Spanish speakers. Therefore, the main purpose of the text is to explain that Spanish-language newspapers thrived in Texas cities, especially in El Paso, in the late 1800s. Choice A is incorrect because the text doesn’t discuss Spanish-language newspapers published in Texas today, let alone compare them with newspapers that were published in the 1800s. Choice C is incorrect. Although the text characterizes El Paso as a particularly rich site for Spanish-language journalism in the late 1800s, the text doesn’t discuss whether newspapers published in El Paso influenced the newspapers published in other cities across Texas, including San Antonio. Choice D is incorrect because the text doesn’t mention whether Spanish-language newspapers published in Texas were also widely read in Mexico. The text only focuses on the popularity of Spanish-language newspapers within Texas, and especially in El Paso."},{"i":"97ca2cda","c":"func","d":"E","s":"In the early days of television in the 1940s, many people thought that US television programs would rely on the financial support of ad agencies and commercial sponsors, much like radio did. But advertisers hesitated to jump into a new space, <u>particularly at a time when the manufacturing of new television sets was stalled due to the US’s involvement in World War II.<\/u> Broadcasters, like the National Broadcasting Company (NBC), needed to persuade advertisers to support their programming despite not knowing whether there would be a robust television audience to begin with.\n\nWhich choice best describes the function of the underlined phrase in the text as a whole?","o":["It compares the beginnings of radio programming with the beginnings of television programming in the United States.","It identifies a specific reason behind some advertisers’ hesitance to support television.","It describes how broadcasters attempted to convince advertisers to support television.","It explains why a type of television programming was popular at the time."],"a":1,"r":"Choice B is the best answer because it accurately describes the function of the underlined phrase in the text as a whole. According to the text, advertisers were reluctant to support television in its early days. The underlined phrase then indicates that this reluctance was partly due to the US’s involvement in World War II, which hindered television production. Thus, the underlined phrase identifies a specific reason behind some advertisers’ hesitance to support television. Choice A is incorrect. The text merely mentions that television was expected to be financed through advertising, as radio was at the time. Nothing in the text compares the origins of radio and television. Choice C is incorrect. The underlined phrase focuses on a reason advertisers were reluctant to support television, not measures taken to convince advertisers to support television. Choice D is incorrect. The underlined phrase focuses on a reason advertisers were reluctant to support television, not what types of television programming were popular."},{"i":"5336f2e4","c":"func","d":"H","s":"The following text is adapted from Zora Neale Hurston’s 1921 short story “John Redding Goes to Sea.” John is a child who lives in a town in the woods. Perhaps ten-year-old John was puzzling to the folk there in the Florida woods for he was an imaginative child and fond of day-dreams. The St. John River flowed a scarce three hundred feet from his back door. On its banks at this point grow numerous palms, luxuriant magnolias and bay trees. On the bosom of the stream float millions of delicately colored hyacinths. <u>[John Redding] loved to wander down to the water’s edge, and, casting in dry twigs, watch them sail away down stream to Jacksonville, the sea, the wide world and [he] wanted to follow them.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It provides an extended description of a location that John likes to visit.","It reveals that some residents of John’s town are confused by his behavior.","It illustrates the uniqueness of John’s imagination compared to the imaginations of other children.","It suggests that John longs to experience a larger life outside the Florida woods."],"a":3,"r":"Choice D is the best answer because it accurately describes how the underlined sentence functions in the text as a whole. The text establishes that John has a strong imagination and then goes on to describe the St. John River near John’s home in the Florida woods. The underlined sentence depicts John sending twigs sailing down the river while he imagines them reaching “Jacksonville, the sea, the wide world,” where he wishes he could follow. This suggests that John longs to expand his life experiences beyond the Florida woods. Choice A is incorrect because the second and third sentences of the text provide an extended description of the riverbank where John likes to go, whereas the underlined sentence describes what John does at that location. Choice B is incorrect because the first sentence of the text suggests that John’s behavior “was puzzling” to others around him, whereas the underlined sentence concerns the content of John’s imaginings. Choice C is incorrect because the underlined sentence elaborates on John’s imagination but doesn’t mention any other children to whom John could be compared."},{"i":"f653b273","c":"cross","d":"M","s":"Text 1 A tiny, unusual fossil in a piece of 99-million-year-old amber is of the extinct species Oculudentavis khaungraae. The O. khaungraae fossil consists of a rounded skull with a thin snout and a large eye socket. Because these features look like they are avian, or related to birds, researchers initially thought that the fossil might be the smallest avian dinosaur ever found.\n\nText 2 Paleontologists were excited to discover a second small fossil that is similar to the strange O. khaungraae fossil but has part of the lower body along with a birdlike skull. Detailed studies of both fossils revealed several traits that are found in lizards but not in dinosaurs or birds. Therefore, paleontologists think the two creatures were probably unusual lizards, even though the skulls looked avian at first.\n\nBased on the texts, what would the paleontologists in\n\nText 2 most likely say about the researchers’ initial thought in\n\nText 1?","o":["It is understandable because the fossil does look like it could be related to birds, even though O. khaungraae is probably a lizard.","It is confusing because it isn’t clear what caused the researchers to think that O. khaungraae might be related to birds.","It is flawed because the researchers mistakenly assumed that O. khaungraae must be a lizard.","It is reasonable because the O. khaungraae skull is about the same size as the skull of the second fossil but is shaped differently."],"a":0,"r":"Choice A is the best answer because it reflects what the paleontologists in Text 2 would most likely say about what the researchers in Text 1 initially thought. Text 1 focuses on the discovery of a strange fossil consisting of the skull of the extinct species Oculudentavis khaungraae. According to Text 1, the fossil has features that appear to be avian, or related to birds, which led researchers to initially think that the fossil might be a very small avian dinosaur. Text 2 begins by noting the discovery of a second fossil similar to the one discussed in Text 1, then explains that based on detailed studies of both fossils, paleontologists think that the two creatures were probably unusual lizards, even though the skulls appeared avian at first. This suggests that the paleontologists in Text 2 recognize that the fossils do indeed look like they could be related to birds. For this reason, the paleontologists in Text 2 would most likely say that the initial thought of the researchers in Text 1—that the fossil was avian—is understandable, even if the fossil is probably not avian but rather is from a lizard. Choice B is incorrect because Text 2 indicates that the fossils initially looked avian, so the paleontologists described in Text 2 wouldn’t be confused by the researchers in Text 1 initially thinking that O. khaungraae might be related to birds. The paleontologists would find that initial thought understandable, not confusing. Choice C is incorrect because Text 1 never mentions lizards, so it wouldn’t make sense for the paleontologists in Text 2 to say that the researchers in Text 1 mistakenly assumed that O. khaungraae must be a lizard. Choice D is incorrect. Although the paleontologists in Text 2 might agree that the initial thought of the researchers in Text 1 was reasonable, nothing in Text 2 suggests that the two skulls were shaped differently."},{"i":"b38935ab","c":"main","d":"M","s":"Historians point to the rule of the Piast dynasty as crucial to the formation of the Polish state. However, some differentiate between members of the dynasty like Mieszko II Lambert, who ruled as king from 1025 to 1031 CE, and less well-documented figures like Siemomysł, who is said to have ruled in the 10th century but whose historical actuality is disputed. Siemomysł appears in the Gesta principum Polonorum, a chronicle of medieval Polish history written between 1112 and 1118. However, the chronicle’s documentation of Siemomysł relies on oral tradition, unlike its records of later rulers.\n\nAccording to the text, what is a difference between how historians view Siemomysł and how they view Mieszko II Lambert?","o":["Historians agree that Mieszko II Lambert existed, but disagree about whether Siemomysł existed.","Historians believe that the Gesta principum Polonorum provides more evidence for Siemomysł’s existence than it does for Mieszko II Lambert’s existence.","Historians agree that Siemomysł ruled Poland much later than Mieszko II Lambert.","Historians find the orally transmitted stories affirming the existence of Mieszko II Lambert to be more convincing than similar stories about Siemomysł."],"a":0,"r":"Choice A is the best answer because it presents a statement about how historians view Siemomysł and Mieszko II Lambert that is supported by the text. The text states that the Piast dynasty had a number of different members. The text refers to two of the rulers in the Piast dynasty by name: Mieszko II Lambert, whose rule was known to have occurred from 1025 to 1031 CE, and Siemomysł (\"whose historical actuality is disputed\"), for whom less is known and who therefore is the subject of debate among historians. The text further casts doubt about Siemomysł by stating that he is \"said to have ruled\" during the 10th century, or the 900s, which suggests the possibility that he didn’t rule. The text also mentions that the chronicle’s documentation of Siemomysł relies on oral tradition, unlike its records of later rulers, including Mieszko II Lambert. This indicates that historians agree that Mieszko II Lambert was an actual historical figure, but they disagree about whether Siemomysł existed. Choice B is incorrect because the text states that the Gesta principum Polonorum’s documentation of Siemomysł comes from oral tradition— spoken rather than written documentation—unlike its records of rulers who came after Siemomysł. This suggests that the chronicle provides less reliable evidence rather than more evidence for Siemomysł’s existence in the 900s (or the 10th century) than it does for later rulers like Mieszko II Lambert, who ruled from 1025 to 1031 CE. Choice C is incorrect because the text indicates the opposite: Siemomysł supposedly ruled earlier in the 10th century, while Mieszko II Lambert ruled from 1025 to 1031 CE. The 10th century spans the years from 901 to 1000 CE, so Siemomysł is believed to have ruled earlier than Mieszko II Lambert did, not later as this choice states. Choice D is incorrect. Although the text mentions that information in the written chronicle Gesta principum Polonorum draws its information about Siemomysł from the oral tradition, it doesn’t mention orally transmitted stories about Mieszko II Lambert. Instead, it states that the chronicle’s documentation of Siemomysł relies on oral tradition unlike the records of later rulers do, which suggests that the documentation of later rulers such as Mieszko II Lambert did not rely on oral tradition. Thus, no comparison can be made about how convincing the orally transmitted stories of each ruler are to historians."},{"i":"3a1f02b0","c":"main","d":"E","s":"The following text is adapted from Frances Hodgson Burnett’s 1911 novel The Secret Garden. Mary, a young girl, recently found an overgrown hidden garden. Mary was an odd, determined little person, and now she had something interesting to be determined about, she was very much absorbed, indeed. She worked and dug and pulled up weeds steadily, only becoming more pleased with her work every hour instead of tiring of it. It seemed to her like a fascinating sort of play.\n\nWhich choice best states the main idea of the text?","o":["Mary hides in the garden to avoid doing her chores.","Mary is getting bored with pulling up so many weeds in the garden.","Mary is clearing out the garden to create a space to play.","Mary feels very satisfied when she’s taking care of the garden."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text describes Mary’s activities in an overgrown hidden garden, saying that she was “very much absorbed” and was “only becoming more pleased with her work every hour” rather than getting tired of it. She also thinks of garden activities as a “fascinating sort of play.” Thus, the main idea of the text is that Mary feels very satisfied when taking care of the garden. Choice A is incorrect because the text never makes any mention of Mary’s chores. Choice B is incorrect because the text indicates that Mary finds pulling up weeds to be fascinating, not boring. Choice C is incorrect because Mary thinks of garden activities in and of themselves as play, not as something necessary to do to create a space to play."},{"i":"1755eaf0","c":"infer","d":"H","s":"Like many other genera of wild bees, bumblebees have in recent decades experienced population collapse caused by, among other factors, habitat destruction and climate variation. Bumblebees are also one of the most researched bee genera, second only to honeybees. As a result, ecologists have gained much of their insight about wild-bee declines from bumblebees. In a 2021 paper, zoologist Guillaume Ghisbain notes that bumblebees are among the relatively few wild-bee genera that display social behaviors and dietary generalism (ability to obtain nectar and pollen from a diversity of plant species), two traits that are associated with increased resilience to some specific environmental changes. Ghisbain therefore contends that ______ Which choice most logically completes the text?","o":["although bumblebees and many other wild bees have experienced similar population declines in the past, compared with other wild bees, bumblebees are likely at greater risk of being harmed by climate variation than by habitat destruction.","although bumblebees have been more extensively studied than most wild bees, researchers should not use bumblebees to draw conclusions about the decline of other wild bees, even ones with feeding patterns and levels of sociability that are similar to those of bumblebees.","because bumblebees and other bees with generalist diets are less negatively affected by environmental stress than bees with specialized diets are, they are less likely to experience major population changes in the future than bees with specialized diets are.","because the responses of bumblebees and other wild bees to environmental threats are not always comparable, researchers need to exercise caution when extrapolating information about wild-bee population declines from bumblebees."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of wild-bee declines. The text establishes that bumblebees and other wild bees have been experiencing population collapse as a result of habitat destruction, climate variation, and other factors. The text then indicates that because bumblebees are very extensively researched, ecologists rely heavily on findings about them to understand wild-bee declines in general. However, the text then introduces Ghisbain’s observation that unlike most other wild-bee genera, bumblebees have certain traits (social behaviors and dietary generalism) linked to increased resilience to certain environmental changes. In other words, bumblebees aren’t necessarily representative of wild bees as a whole because they are likely more tolerant of some pressures. Therefore, it logically follows that Ghisbain would urge researchers to exercise caution when using bumblebee data to draw conclusions about other wild-bee population declines, since bumblebees and other wild bees don’t always respond comparably to environmental threats. Choice A is incorrect because the text doesn’t indicate that climate variation is more of a threat to bumblebees than habitat destruction is or that it is a bigger threat to bumblebees than it is to other wild bees. The text simply indicates that climate variation and habitat destruction are among the factors that have caused population collapses for bumblebees and other wild-bee genera. Choice B is incorrect. As it is presented in the text, Ghisbain notes that bumblebees may respond to environmental changes differently than many other wild-bee genera do; this suggests that bumblebees shouldn’t be treated as representative of all wild bees, but there’s no reason to think that Ghisbain would go so far as to assert that bumblebee data shouldn’t be used to draw conclusions about other wild-bee genera that are similar to bumblebees in their dietary and social traits, even if there are relatively few. The text suggests caution in extrapolation, not a complete rejection of using bumblebee research. Choice C is incorrect. Although the text indicates that dietary generalism is linked to increased resilience to specific environmental changes (that is, to some but not all environmental stresses), it doesn’t suggest that bumblebees and other bees with this trait are less likely than bees with specialized diets to experience major population changes. In fact, the text makes it clear that like many other wild-bee genera—most of which don’t display dietary generalism—bumblebees are already experiencing population collapse."},{"i":"08395130","c":"infer","d":"H","s":"The Hubble Space Telescope (HST) is projected to maintain operation until at least 2030, but it has already revolutionized high-resolution imaging of solar-system bodies in visible and ultraviolet (UV) light wavelengths, notwithstanding that only about 6% of the bodies imaged by the HST are within the solar system. NASA researcher Cindy L. Young and colleagues assert that a new space telescope dedicated exclusively to solar-system observations would permit an extensive survey of minor solar-system bodies and long-term UV observation to discern how solar- system bodies change over time. Young and colleagues’ recommendation therefore implies that the HST ______ Which choice most logically completes the text?","o":["will likely continue to be used primarily to observe objects outside the solar system.","will no longer be used to observe solar system objects if the telescope recommended by Young and colleagues is deployed.","can be modified to observe the features of solar system objects that are of interest to Young and colleagues.","lacks the sensors to observe the wavelengths of light needed to discern how solar system bodies change over time."],"a":0,"r":"Choice A is the best answer. The HST will operate until at least 2030, but it’s only observing stuff inside our solar system 6% of the time. If we could get a different telescope to observe stuff inside our solar system 100% of the time and take more extensive images of certain things, then the HST could continue to be used mainly for observing stuff outside the solar system. Choice B is incorrect. This inference is too strong to be supported by the text. Even if the new telescope is deployed, the HST might still be used as it’s being used now. Based on the text, the new telescope would just be used for more extensive and long-term imaging of solar system bodies, which doesn’t necessarily overlap with the HST . Choice C is incorrect. This inference isn’t supported. The text never mentions the possibility of modifying the HST , so there is no basis to make this inference. Rather, the researchers suggest using a different telescope to more closely observe certain objects. Choice D is incorrect. This inference is too strong to be supported. The text doesn’t give us enough info to assume that the HST lacks any particular sensors."},{"i":"1d08c7ee","c":"claim","d":"M","s":"Pulitzer Prize–winning writer Héctor Tobar has built a multifaceted career as both a journalist and an author of short stories and novels. In an essay about Tobar’s work, a student claims that Tobar blends his areas of expertise by applying journalism techniques to his creation of works of fiction.\n\nWhich quotation from a literary critic best supports the student’s claim?","o":["“For one novel, an imagined account of a real person’s global travels, Tobar approached his subject like a reporter, interviewing people the man had met along the way and researching the man’s own writings.”","“Tobar got his start as a volunteer for El Tecolote, a community newspaper in San Francisco, and wrote for newspapers for years before earning a degree in creative writing and starting to publish works of fiction.”","“Many of Tobar’s notable nonfiction articles are marked by the writer’s use of techniques usually associated with fiction, such as complex narrative structures and the incorporation of symbolism.”","“The protagonist of Tobar’s third novel is a man who wants to be a novelist and keeps notes about interesting people he encounters so he can use them when developing characters for his stories.”"],"a":0,"r":"Choice A is the best answer. The example of Tobar approaching his subject “like a reporter,” including conducting “interviews” and “research,” shows Tobar applying journalism techniques to his fiction-writing. Choice B is incorrect. This choice doesn’t support the claim. It tells us about Tobar’s initial career as a journalist, but it doesn’t say anything about him “applying journalism techniques” to his fiction-writing. Choice C is incorrect. This choice doesn’t support the claim. It tells us that Tobar applied fiction techniques to his nonfiction writing, but we’re looking for evidence of the other way around: that Tobar applied journalism techniques to his fiction-writing. Choice D is incorrect. This choice doesn’t support the claim. It tells us that a character in one of Tobar’s novels applied a journalism technique to his fiction-writing, but it doesn’t tell us that Tobar did that himself."},{"i":"abbea24d","c":"claim","d":"E","s":"“The Mountain” is a 1914 poem by Robert Frost. In the poem, the speaker visits a town next to a mountain. The speaker claims to feel protected by the mountain, saying ______ Which quotation from “The Mountain” most effectively illustrates the claim?","o":["“A dry ravine emerged under boughs / Into the pasture.”","“The mountain stood there to be pointed at.”","“I felt it like a wall / Behind which I was sheltered from a wind.”","“I crossed the river and swung round the mountain.”"],"a":2,"r":"Choice C is the best answer because it most effectively uses a quotation from \"The Mountain\" to illustrate the claim that the speaker feels protected by the mountain. In the quotation, the speaker recounts that the mountain felt like a wall that offers shelter from the wind. That the speaker felt sheltered by the mountain suggests that it offered the speaker a sense of being protected. Choice A is incorrect because this quotation doesn’t express the speaker’s feeling of being protected by the mountain. Instead, it notes that the speaker has seen a dry ravine and a pasture. Choice B is incorrect because this quotation doesn’t express the speaker’s feeling of being protected by the mountain. Instead, it simply states that there is a mountain, which is meant to be viewed. Choice D is incorrect because this quotation doesn’t express the speaker’s feeling of being protected by the mountain. Instead, it indicates that the speaker has gone around the mountain."},{"i":"80fd9454","c":"graph","d":"H","s":"","o":["The tadpoles consumed a higher percentage of the striped burrowing frog eggs than they did of the eggs of the dainty green tree frog.","The tadpoles left a certain percentage of the eggs of each of the five species unharmed, thus ultimately allowing them to hatch.","The tadpoles consumed a lower percentage of the short-footed frog eggs than they did of the eggs of their own species.","The tadpoles consumed the same percentage of the dainty green tree frog eggs as they did of the little red tree frog eggs."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to support the student’s argument about the role of bufadienolide in the egg preferences of cane toad tadpoles. For each of five amphibian species included in the 2022 study, the table gives the percentage of available eggs that the cane toad tadpoles ate. According to the table, the tadpoles ate 10% of striped burrowing frog eggs and 1% of dainty green tree frog eggs, which suggests a preference for striped burrowing frog eggs over dainty green tree frog eggs. The table also indicates that neither of these species’ eggs produces bufadienolide. Thus, these data suggest that something other than the presence or absence of bufadienolide is needed to adequately explain the tadpoles’ egg preferences. Choice B is incorrect. Although the table shows that for each of the five amphibian species, the cane toad tadpoles ate less than 100% of that species’ eggs, which demonstrates that the tadpoles did indeed leave some eggs for each species unharmed, this fact alone is irrelevant to the tadpoles’ preferences for some species’ eggs over other species’ eggs. Choice C is incorrect. Although the table indicates that the cane toad tadpoles ate 90% of the cane toad eggs and 7% of the short-footed frog eggs, which suggests that they prefer cane toad eggs over short-footed frog eggs, the table also indicates that cane toad eggs produce bufadienolide, whereas short-footed frog eggs do not. Therefore, these data are not sufficient to exclude that bufadienolide alone could explain the tadpoles’ preference for some species’ eggs over other species’ eggs. Choice D is incorrect. Although the table shows that for both dainty green tree frog eggs and little red tree frog eggs, the cane toad tadpoles ate 1% of those species’ eggs, it also indicates that neither produces bufadienolide. Thus, these data alone don’t indicate bufadienolide’s role in the tadpoles’ egg preferences."},{"i":"b470d853","c":"graph","d":"E","s":"","o":["Zion National Park.","Rocky Mountain National Park.","Yellowstone National Park.","Grand Canyon National Park."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the graph to complete the statement about the US national park with the highest number of recreation visits during a three-month period. The line graph shows the number of recreation visits to four US national parks for the months of June, July, and August 2021. According to the graph, the number of recreation visits to Yellowstone National Park in June was approximately 940,000; in July, the number of visits was approximately 1,080,000; and in August, the number of visits was approximately 920,000. In all three months, the number of visits to Yellowstone was higher than the number of visits to any other park in each month. Choice A is incorrect. According to the graph, the number of recreation visits to Zion National Park was approximately 680,000 in June, about 580,000 in July, and about 470,000 in August, each of which is lower than the number of visits to Yellowstone in the same months. Choice B is incorrect. According to the graph, the number of recreation visits to Rocky Mountain National Park was approximately 670,000 in June, about 900,000 in July, and about 750,000 in August, each of which is lower than the number of visits to Yellowstone in the same months. Choice D is incorrect. According to the graph, the number of recreation visits to Grand Canyon National Park was approximately 540,000 in June, about 560,000 in July, and about 430,000 in August, each of which is lower than the total visits to Yellowstone in the same months."},{"i":"dd6a0326","c":"fss","d":"M","s":"African American Percy Julian was a scientist and entrepreneur whose work helped people around the world to see. Named in 1999 as one of the greatest achievements by a US chemist in the past hundred years, ______ led to the first mass-produced treatment for glaucoma.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Julian synthesized the alkaloid physostigmine in 1935; it","in 1935 Julian synthesized the alkaloid physostigmine, which","Julian’s 1935 synthesis of the alkaloid physostigmine","the alkaloid physostigmine was synthesized by Julian in 1935 and"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “Julian’s 1935 synthesis” the subject of the sentence and places it immediately after the modifying phrase “named…years.” In doing so, this choice clearly establishes that Julian’s 1935 synthesis of the alkaloid physostigmine—and not another noun in the sentence—was named in 1999 as one of the greatest achievements by a US chemist in the past hundred years. Choice A is incorrect because it results in a dangling modifier. The placement of the noun “Julian” immediately after the modifying phrase illogically suggests that Julian himself was named as one of the greatest achievements by a US chemist in the past hundred years. Choice B is incorrect because it results in a dangling modifier. The placement of the prepositional phrase “in 1935” immediately after the modifying phrase illogically and confusingly suggests that “in 1935” was named as one of the greatest achievements by a US chemist in the past hundred years. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “the alkaloid physostigmine” immediately after the modifying phrase illogically and confusingly suggests that the alkaloid physostigmine itself (not the synthesis of it) was named as one of the greatest achievements by a US chemist in the past hundred years."},{"i":"c7cb5186","c":"fss","d":"H","s":"In a US national election, one might expect major-party campaigns to focus on the most populous states. However, if polls and past voting data suggest that the outcome in a given state is a foregone conclusion, a campaign will not invest its resources there. Ultimately, a state’s voting record and polling data, not its population size, ______ its importance to campaigns.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["determines","determining","has determined","determine"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms in a sentence. The plural verb “determine” supplies the main clause with a finite main verb and agrees in number with the plural subject “a state’s voting record and polling data.” Choice A is incorrect because the singular verb “determines” doesn’t agree in number with the plural subject “a state’s voting record and polling data.” Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle “determining” doesn’t supply the main clause with a finite plural verb. Choice C is incorrect because the singular verb “has determined” doesn’t agree in number with the plural subject “a state’s voting record and polling data.”"},{"i":"684b8bd2","c":"fss","d":"M","s":"Far from being modern inventions, ______ more than 5,000 years ago.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Sumerians in ancient Mesopotamia used drinking straws","drinking straws were used by Sumerians in ancient Mesopotamia","the use of drinking straws by Sumerians in ancient Mesopotamia happened","ancient Mesopotamia was home to Sumerians who used drinking straws"],"a":1,"r":"Choice B is the best answer. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” must be describing “drinking straws,” because those are the only possible inventions in this sentence. Choice A is incorrect. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” can’t be describing “Sumerians,” because they are a group of people, not an invention. Choice C is incorrect. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” can’t be describing “the use of drinking straws,” because it is not “the use” of drinking straws that is an invention—it is the drinking straws themselves. Choice D is incorrect. Modifiers and their subjects must go next to each other. The modifier “far from being modern inventions” can’t be describing “Ancient Mesopotamia,” because that is a place, not an invention."},{"i":"d75d57a0","c":"bound","d":"E","s":"While many video game creators strive to make their graphics ever more ______ others look to the past, developing titles with visuals inspired by the “8-bit” games of the 1980s and 1990s. (The term “8-bit” refers to a console whose processor could only handle eight bits of data at once.) Which choice completes the text so that it conforms to the conventions of Standard English?","o":["lifelike but","lifelike","lifelike,","lifelike, but"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation between a subordinate clause and a main clause. This choice correctly uses a comma to mark the boundary between the subordinate clause (“While…lifelike”) and the main clause (“others look to the past”). Choice A is incorrect because it results in an incomplete sentence with no main clause. Choice B is incorrect because it fails to mark the boundary between the subordinate clause (“While…lifelike”) and the main clause (“others…past”). Choice D is incorrect because it results in an incomplete sentence with no main clause."},{"i":"a1e0c981","c":"bound","d":"E","s":"In her book The Woman Warrior: Memoirs of a Girlhood Among Ghosts, author Maxine Hong Kingston examines themes ______ childhood, womanhood, and Chinese American identity by intertwining autobiography and mythology.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["of:","of","of—","of,"],"a":1,"r":"Choice B is the best answer. “Themes of childhood” is one noun phrase, with “themes of” implicitly carrying over to the other items on the list (“themes of childhood, [themes of] womanhood, and [themes of] Chinese American identity”). Choice A is incorrect. This choice inappropriately breaks up the introduction of a list. Also, “In her book…themes of” is not an independent clause, thanks to the dangling “of” at the end, so it can’t precede a colon. Choice C is incorrect. This choice inappropriately breaks up the introduction of a list. Also, “In her book…themes of” is not an independent clause, thanks to the dangling “of” at the end, so it can’t precede a single dash. Choice D is incorrect. This choice inappropriately breaks up the introduction of a list. “Themes of” implicitly carries over to each item on the list (“themes of childhood, [themes of] womanhood, and [themes of] Chinese American identity”), so we don’t want to use a comma to separate it."},{"i":"d8aa8ba2","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In astronomy, the mass of stars can be described in units called solar masses. One solar mass is roughly equal to the mass of the Sun. The mass of the star Proxima Centauri is 0.122 solar masses. The mass of the star Sirius A is 2.063 solar masses. The student wants to emphasize the mass of Sirius A.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The mass of stars, like Proxima Centauri, can be described in units called solar masses.","In astronomy, the mass of stars can be described in units called solar masses, and one solar mass is roughly equal to the mass of the Sun.","The Sun is more massive than Proxima Centauri, which has a mass of 0.122 solar masses.","With a mass of 2.063 solar masses, Sirius A is more massive than the Sun."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes the mass of Sirius A, noting that it has a mass of 2.063 solar masses and that it is larger than the Sun. Choice A is incorrect. The sentence makes a generalization about how the mass of stars can be measured; it doesn’t emphasize the mass of Sirius A. Choice B is incorrect. The sentence introduces solar masses as a unit of measurement; it doesn’t emphasize the mass of Sirius A. Choice C is incorrect. The sentence emphasizes the mass of Proxima Centauri, not the mass of Sirius A."},{"i":"70538b9a","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In the 1930s, the Imperial Sugar Cane Institute in India sought to limit the country’s dependence on imported sugarcane. The institute enlisted botanist Janaki Ammal to breed a local variety of sugarcane. She crossbred the imported sugarcane species Saccharum officinarum with grasses native to India. She succeeded in creating sugarcane hybrids well suited to India’s climate. The student wants to emphasize Janaki Ammal’s achievement.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["By crossbreeding the imported sugarcane species Saccharum officinarum with grasses native to India, Ammal succeeded in creating sugarcane hybrids well suited to India’s climate.","In the 1930s, the Imperial Sugar Cane Institute, which enlisted Ammal, sought to limit dependence on imported sugarcane.","Ammal was enlisted by the Imperial Sugar Cane Institute at a time when a local variety of sugarcane needed to be produced.","As part of efforts to breed a local variety of sugarcane, an imported sugarcane species called Saccharum officinarum was crossbred with grasses native to India."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes Janaki Ammal’s achievement, explaining that she successfully created sugarcane hybrids that are well suited to India’s climate by crossbreeding an imported sugarcane species with grasses native to India. Choice B is incorrect. The sentence emphasizes the goal of the Imperial Sugar Cane Institute in the 1930s; it doesn’t emphasize Janaki Ammal’s achievement. Choice C is incorrect. While the sentence mentions Ammal, it doesn’t emphasize her achievement of successfully creating sugarcane hybrids. Choice D is incorrect. While the sentence mentions the achievement of crossbreeding imported sugarcane species with grasses native to India, it doesn’t emphasize the achievement as belonging to Janaki Ammal."},{"i":"080a7b51","c":"trans","d":"M","s":"Imagine a magazine that a reader has thrown away. This magazine is post-consumer waste, as it became waste after reaching the consumer. ______ the paper scraps left over from printing the magazine are pre-consumer waste, as they became waste before reaching the consumer.\n\nWhich choice completes the text with the most logical transition?","o":["By contrast,","For example,","As a result,","Specifically,"],"a":0,"r":"Choice A is the best answer. “By contrast” logically signals that the information in this sentence—that paper scraps left over from printing a magazine are pre-consumer waste—contrasts with the previous information about magazines being post-consumer waste. Choice B is incorrect because “for example” illogically signals that the information in this sentence exemplifies the previous information about post-consumer waste. Instead, the paper scraps being pre-consumer waste contrasts with the previous information. Choice C is incorrect because “as a result” illogically signals that the information in this sentence is a result or consequence of the previous information about post- consumer waste. Instead, the paper scraps being pre-consumer waste contrasts with the previous information. Choice D is incorrect because “specifically” illogically signals that the information in this sentence provides specific, precise details elaborating on the previous information about post-consumer waste. Instead, the paper scraps being pre-consumer waste contrasts with the previous information."},{"i":"52b31d7b","c":"trans","d":"M","s":"In November 1934, Amrita Sher-Gil was living in what must have seemed like the ideal city for a young artist: Paris. She was studying firsthand the color-saturated style of France’s modernist masters and beginning to make a name for herself as a painter. ______ Sher-Gil longed to return to her childhood home of India; only there, she believed, could her art truly flourish.\n\nWhich choice completes the text with the most logical transition?","o":["Still,","Therefore,","Indeed,","Furthermore,"],"a":0,"r":"Choice A is the best answer. “Still” logically signals that the information about Sher-Gil in this sentence—that she longed to leave Paris and return to India—contrasts with what one would expect after reading about Sher-Gil’s experiences in Paris in the previous sentences. Choice B is incorrect because “therefore” illogically signals that the information about Sher-Gil in this sentence is a result or consequence of the descriptions in the previous sentences. Instead, this information contrasts with what one would expect after reading about Sher-Gil’s experienc
