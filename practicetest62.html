<script>
const D={"t":"Practicetest62","q":[{"i":"441e2b9e","c":"vocab","d":"E","s":"Researchers and conservationists stress that biodiversity loss due to invasive species is ______. For example, people can take simple steps such as washing their footwear after travel to avoid introducing potentially invasive organisms into new environments.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["preventable","undeniable","common","concerning"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of how biodiversity loss due to invasive species can be avoided. As used in this context, “preventable” means able to be stopped or kept from happening. The text indicates that “people can take simple steps” to avoid bringing possible invasive species into new environments. It presents these steps as an example of how biodiversity loss due to invasive species is preventable. Choice B is incorrect because it wouldn’t make sense to say that a simple step like washing your shoes after traveling is an example of biodiversity loss due to invasive species being “undeniable,” or something that can’t be proved to be wrong. Although the text may suggest that biodiversity loss due to invasive species is something that really happens, the word that completes the text must make the first sentence into an assertion that is illustrated by the second sentence, and the second sentence illustrates the idea that biodiversity loss due to invasive species is preventable, not undeniable. Choice C is incorrect because it wouldn’t make sense to say that a simple step like washing your shoes after traveling is an example of biodiversity loss due to invasive species being “common,” or something that happens regularly. Additionally, the text doesn’t provide any information about how frequently invasive species cause biodiversity loss. Choice D is incorrect because it wouldn’t make sense to say that a simple step like washing your shoes after traveling is an example of biodiversity loss due to invasive species being “concerning,” or something that is troubling or causes worry. Although the text implies that the phenomenon of biodiversity loss due to invasive species is itself a concerning phenomenon, the word that completes the text must make the first sentence into an assertion that is illustrated by the second sentence, and the second sentence illustrates the idea that biodiversity loss due to invasive species is preventable, not concerning."},{"i":"b4c6cff6","c":"vocab","d":"M","s":"The following text is adapted from Karel Čapek’s 1920 play R.U.R. (Rossum’s Universal Robots), translated by Paul Selver and Nigel Playfair in 1923. Fabry and Busman are telling Miss Glory why their company manufactures robots. FABRY: One Robot can replace two and a half workmen. The human machine, Miss Glory, was terribly imperfect. It had to be removed sooner or later. BUSMAN: It was too expensive. FABRY: It was not effective. It no longer answers the requirements of modern engineering. Nature has no idea of keeping pace with modern labor.\n\nAs used in the text, what does the word “answers” most nearly mean?","o":["Explains","Rebuts","Defends","Fulfills"],"a":3,"r":"Choice D is the best answer because as used in the text, “answers” most nearly means fulfills. In the text, Fabry and Busman claim that the robots manufactured by their company are more efficient than human workers, which they refer to as “the human machine.” Fabry observes that the human machine “no longer answers the requirements of modern engineering.” That is, human workers are incapable of meeting the rigorous needs of modern, industrialized workplaces. Choice A is incorrect. Although in some contexts “answers” can mean explains, it doesn’t have that meaning in this context because the topic under discussion is human beings’ inability to perform labor efficiently, not their inability to engage in discussion or explanation. Choice B is incorrect. Although in some contexts “answers” can mean rebuts, or proves a claim or argument to be false, it wouldn’t make sense to speak of proving requirements to be false; requirements might or might not be reasonable, but they can’t be verified as truthful or untruthful, as claims or accusations can. Choice C is incorrect. Although in some contexts, “answers” can mean defends against criticism, or justifies, it doesn’t have that meaning in this context because the opinion that Fabry expresses is that human workers can no longer fulfill the requirements of modern workplaces, not that they have ceased to justify those requirements or to defend them against criticism; indeed, there is no suggestion in the text that workers ever defended those requirements."},{"i":"ce8c03a8","c":"vocab","d":"M","s":"The Illustrated History of San Mateo County, published in 1878, features several illustrations by Grafton Tyler Brown showing the California county’s farms, residences, and businesses. It was ______ for a business to be featured, since being included suggested that a business was an important part of the community.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["risky","misleading","advantageous","unremarkable"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of businesses being featured in The Illustrated History of San Mateo County. In this context, \"advantageous\" means beneficial or providing a favorable position. The text explains that being included in the book \"suggested that a business was an important part of the community,\" and it can be inferred that an enhanced reputation within the local community would benefit a business, commercially or otherwise. This context supports the idea that being featured in this publication would be advantageous. Choice A is incorrect because in this context, \"risky\" would suggest that being featured in The Illustrated History of San Mateo County might have negative consequences for a business. However, the text implies only positive outcomes since inclusion indicated importance within the local community. Choice B is incorrect because \"misleading\" would mean deceptive or deliberately giving a wrong impression, but the text doesn’t indicate there was something deceptive about being featured in The Illustrated History of San Mateo County; rather, it suggests that inclusion indicated community importance. Choice D is incorrect because \"unremarkable\" would mean common or ordinary, which doesn’t make sense in context. The text suggests that inclusion in The Illustrated History of San Mateo County instead conferred a special status on a business by conveying its importance in the local community."},{"i":"6286dd96","c":"vocab","d":"E","s":"The following text is adapted from Frances Hodgson Burnett’s 1905 novel A Little Princess. Sara is a young student at a school in London. Sara not only could tell stories, but she adored telling them. When she sat or stood in the midst of a circle and began to invent wonderful things, her green eyes grew big and shining, her cheeks flushed, and, without knowing that she was doing it, she began to act and made what she told lovely or alarming by the raising or dropping of her voice.\n\nAs used in the text, what does the word “invent” most nearly mean?","o":["Mislead","Disguise","Create","Discover"],"a":2,"r":"Choice C is the best answer because as used in the text, \"invent\" most nearly means create or make up. The text begins by stating that Sara likes to tell stories and thoroughly enjoys telling them. The rest of the text describes how she looks and acts when she invents, or creates, \"wonderful things\" in her stories (\"what she told\"). Choice A is incorrect. Although the text suggests that Sara makes up \"wonderful things,\" nothing suggests that she does so to mislead, or intentionally deceive, others; there is no reason to assume that Sara’s listeners don’t know that she’s creating the stories she shares. Choice B is incorrect because nothing in the text suggests that Sara is disguising, or trying to cover up or conceal, \"wonderful things\" when she tells stories; rather, she is creating them and presenting them in ways that make them \"lovely or alarming\" for her listeners. Choice D is incorrect because nothing in the text suggests that Sara is discovering, or unexpectedly finding, \"wonderful things\" in the stories she loves to tell; rather, that she is making things up as she tells the stories."},{"i":"1d9a09c0","c":"purpose","d":"E","s":"The following text is adapted from Jason Reynolds’s 2016 novel Ghost. The narrator, who is in middle school, is at a bus stop. I just go there [to the bus stop] to look at the people working out. See, the gym across the street has this big window—like the whole wall is a window—and they have those machines that make you feel like you walking up steps and so everybody just be facing the bus stop, looking all crazy like they’re about to pass out. And trust me, there ain’t nothing funnier than that. So I check that out for a little while like it’s some kind of movie: The About to Pass Out Show, starring stair-stepper person one through ten. ©2016 by Jason Reynolds Which choice best states the main purpose of the text?","o":["To give a reason why the narrator is excited to start middle school","To describe an activity that the narrator finds amusing","To explain a problem that the narrator has overcome","To discuss a movie that the narrator saw in a theater"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text describes how the narrator watches people working out at a gym through a window near a bus stop. The narrator says that \"there ain’t nothing funnier\" than watching people try to work out on the stair climber machine. Thus, the main purpose of the text is to describe an activity that the narrator finds amusing. Choice A is incorrect because the text isn’t about the narrator beginning middle school. The text describes how the narrator finds people working out at a gym amusing and makes no mention of school life. Choice C is incorrect because the text doesn’t mention any problems that the narrator currently has or has overcome. It just describes how the narrator finds watching people work out amusing. Choice D is incorrect because the narrator invents the made-up movie mentioned in the text. The text doesn’t indicate that the narrator has seen a movie in a theater. The focus of the text is on the narrator watching people at the gym, not watching a movie."},{"i":"975b0602","c":"purpose","d":"H","s":"A number of Indigenous politicians have been elected to the United States Congress since 2000 as members of the country’s two established political parties. In Canada and several Latin American countries, on the other hand, Indigenous people have formed their own political parties to advance candidates who will advocate for the interests of their communities. This movement has been particularly successful in Ecuador, where Guadalupe Llori, a member of the Indigenous party known as Pachakutik, was elected president of the National Assembly in 2021.\n\nWhich choice best states the main purpose of the text?","o":["To trace the history of an Indigenous political movement and speculate about its future development","To argue that Indigenous politicians in the United States should form their own political party","To highlight two approaches to achieving political representation for Indigenous people","To consider how Indigenous politicians in the United States have influenced Indigenous politicians in Canada and Latin America"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to illustrate two approaches that Indigenous politicians have taken to achieve political representation for their communities. The text begins by explaining that one approach is exemplified by Indigenous politicians in the United States who, in an effort to ensure that the interests of their communities are represented in government, joined preexisting political parties and were subsequently elected to Congress. The text goes on to highlight a second approach adopted by Indigenous leaders in Canada and several Latin American countries: rather than joining established political parties, many Indigenous politicians in these countries have instead formed their own parties to promote candidates for office who support causes that are important to their communities. Choice A is incorrect because the text’s focus is on the contrasting approaches adopted by different Indigenous political movements in different countries; thus, it isn’t accurate to say that the text traces the history of one political movement. Moreover, the text only discusses examples from 2000 to 2021, a relatively short period of time; therefore, it provides very little in the way of discussion of larger historical developments, nor does it make any predictions about how these movements might continue to develop in the future. Choice B is incorrect because the text never urges Indigenous politicians in the US to alter their strategy of striving for representation through the established political parties, nor does it suggest that this strategy is inferior to that of Indigenous politicians in Canada and Latin America, who have formed their own parties. In fact, the text notes that both strategies have resulted in the election of Indigenous politicians to national governments. Choice D is incorrect because the text never suggests that Indigenous politicians in the US have influenced those in Canada and Latin America; instead, it stresses how Indigenous politicians’ approach toward achieving representation in the US government has differed from the approach Indigenous politicians have taken to achieve representation in national governments elsewhere in the Americas."},{"i":"47598085","c":"func","d":"M","s":"<u>Yawn contagion occurs when one individual yawns in response to another’s yawn.<\/u> Studies of this behavior in primates have focused on populations in captivity, but biologist Elisabetta Palagi and her colleagues have shown that it can occur in wild primate populations as well. In their study, which focused on a wild population of gelada monkeys (Theropithecus gelada) in Ethiopia, the researchers further reported that yawn contagion most commonly occurred in males and across different social groups instead of within a single social group.\n\nWhich choice best describes the function of the first sentence in the text as a whole?","o":["It defines a phenomenon that is discussed in the text.","It introduces a problem that is examined in the text.","It makes a claim that is challenged in the text.","It presents a hypothesis that is evaluated in the text."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the first sentence functions in the text as a whole. The first sentence introduces what yawn contagion is, explaining that it occurs when an individual yawns in response to the yawn of another individual. The text goes on to describe Elisabetta Palagi and her colleagues’ study of this phenomenon in a wild population of gelada monkeys. According to the text, the study showed that wild primate populations experience yawn contagion and that the behavior occurs most commonly in male monkeys and across social groups. Thus, the function of the first sentence is to define the phenomenon of yawn contagion that is discussed in the text. Choice B is incorrect. Although the first sentence introduces the text’s discussion of yawn contagion, it doesn’t present this behavior, or anything else, as a problem. Choice C is incorrect because the first sentence doesn’t present a claim but instead explains what yawn contagion is. Moreover, the text doesn’t challenge anything; it’s an informative text that describes the findings of a research study about yawning in wild primate populations. Choice D is incorrect. Although the text describes a scientific study, and most scientific studies are guided by a hypothesis, the text doesn’t say what Palagi and her colleagues’ hypothesis was; the text discusses their findings instead."},{"i":"ac9a3a26","c":"func","d":"H","s":"According to historian Vicki L. Ruiz, Mexican American women made crucial contributions to the labor movement during World War II. At the time, food processing companies entered into contracts to supply United States armed forces with canned goods. Increased production quotas conferred greater bargaining power on the companies’ employees, many of whom were Mexican American women: <u>employees insisted on more favorable benefits, and employers, who were anxious to fulfill the contracts, complied.<\/u> Thus, labor activism became a platform for Mexican American women to assert their agency.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It elaborates on a claim about labor relations in a particular industry made earlier in the text.","It offers an example of a trend in the World War II–era economy discussed earlier in the text.","It notes a possible exception to the historical narrative of labor activism sketched earlier in the text.","It provides further details about the identities of the workers discussed earlier in the text."],"a":0,"r":"Choice A is the best answer because it best describes how the underlined portion functions in the text as a whole. The text says that the increased production quotas of food processing companies during World War II enabled employees to make better bargains in exchange for their labor. The underlined portion presents an example of this increased bargaining power: employees requested more favorable benefits, and employers complied because they were under pressure to fulfill the demanding terms of their contracts. Thus, the underlined portion of the text elaborates on a claim about labor relations in a particular industry (food processing) made earlier in the text. Choice B is incorrect because there is no indication in the text that the economic factors that influenced food processing also influenced other parts of the economy; thus, the bargaining described in the underlined portion of the text cannot be called an example of a trend. Choice C is incorrect because the underlined portion supports the historical narrative of labor activism in food processing that is sketched in the text, instead of noting an exception to that narrative. Choice D is incorrect because while the underlined portion does discuss the demands that workers made in exchange for their labor, it does not discuss the identities of the workers."},{"i":"dc043599","c":"cross","d":"E","s":"Text 1 Most scientists agree that the moon was likely formed after a collision between Earth and a large planet named Theia. This collision likely created a huge debris field, made up of material from both Earth and Theia. Based on models of this event, scientists believe that the moon was formed from this debris over the course of thousands of years.\n\nText 2 Researchers from NASA’s Ames Research Center used a computer to model how the moon could have formed. Although simulations of the moon’s formation have been done in the past, the team from NASA ran simulations that were much more detailed. They found that the formation of the moon was likely not a slow process that took many years. Instead, it’s probable that the moon’s formation happened immediately after impact, taking just a few hours.\n\nWhich choice best describes a difference in how the author of\n\nText 1 and the author of\n\nText 2 view the evidence for the formation of the moon?","o":["The author of Text 1 argues that the formation of the moon occurred much earlier than the author of Text 2 argues.","The author of Text 1 suggests there is more evidence confirming the existence of Theia than the author of Text 2 suggests.","The author of Text 1 claims that the moon’s surface is more similar to Earth’s surface than the author of Text 2 claims.","The author of Text 1 believes that the moon formed more slowly than the author of Text 2 believes."],"a":3,"r":"Choice D is the best answer. Text 1 states that the moon was formed from the debris “over the course of thousands of years,” while Text 2 states that the moon’s formation happened “immediately after impact, taking just a few hours.” This shows a clear difference in how the authors view the evidence for the speed of the moon’s formation. Choice A is incorrect. While Text 2 suggests that the moon formed over “just a few hours” and Text 1 says it took “thousands of years,” neither one mentions when that formation occurred. Choice B is incorrect. While Theia isn’t mentioned in Text 2, neither text describes or disputes evidence of Theia’s existence. Choice C is incorrect. Neither text makes any claims about the similarity or difference between the moon’s surface and Earth’s surface."},{"i":"92c2564d","c":"main","d":"M","s":"Utah is home to Pando, a colony of about 47,000 quaking aspen trees that all share a single root system. Pando is one of the largest single organisms by mass on Earth, but ecologists are worried that its growth is declining in part because of grazing by animals. The ecologists say that strong fences could prevent deer from eating young trees and help Pando start thriving again.\n\nAccording to the text, why are ecologists worried about Pando?","o":["It isn’t growing at the same rate it used to.","It isn’t producing young trees anymore.","It can’t grow into new areas because it is blocked by fences.","Its root system can’t support many more new trees."],"a":0,"r":"Choice A is the best answer because it presents an explanation that is directly stated in the text for why ecologists are worried about Pando. The text states that Pando is a colony of about 47,000 quaking aspen trees that represents one of the largest organisms on Earth. According to the text, ecologists are worried that Pando’s growth is declining, partly because animals are feeding on the trees. In other words, the ecologists are worried that Pando isn’t growing at the same rate it used to. Choice B is incorrect. Rather than indicating that Pando isn’t producing young trees anymore, the text reveals that Pando is indeed producing young trees, stating that those trees can be protected from grazing deer by strong fences. Choice C is incorrect because the text states that fences can be used to prevent deer from eating Pando’s young trees, not that Pando itself can’t grow in new areas because it’s blocked by fences. Choice D is incorrect because the text offers no evidence that Pando’s root system is incapable of supporting new trees or is otherwise a cause of worry for ecologists."},{"i":"baef99a5","c":"main","d":"E","s":"The following text is adapted from Oscar Wilde’s 1891 novel The Picture of Dorian Gray. Dorian Gray is taking his first look at a portrait that Hallward has painted of him. Dorian passed listlessly in front of his picture and turned towards it. When he saw it he drew back, and his cheeks flushed for a moment with pleasure. A look of joy came into his eyes, as if he had recognized himself for the first time. He stood there motionless and in wonder, dimly conscious that Hallward was speaking to him, but not catching the meaning of his words. The sense of his own beauty came on him like a revelation. He had never felt it before.\n\nAccording to the text, what is true about Dorian?","o":["He wants to know Hallward’s opinion of the portrait.","He is delighted by what he sees in the portrait.","He prefers portraits to other types of paintings.","He is uncertain of Hallward’s talent as an artist."],"a":1,"r":"Choice B is the best answer because it presents a statement about Dorian that is directly supported by the text. The narrator of the text says that when Dorian sees his portrait, “his cheeks flushed for a moment with pleasure” and “a look of joy came into his eyes.” The narrator goes on to say that Dorian looked at the portrait “in wonder” and presents him as being so entranced by the portrait that he doesn’t notice what Hallward is saying to him. All these details support the description of Dorian as being delighted by what he sees in the portrait. Choice A is incorrect because Dorian isn’t depicted as interested in Hallward’s opinion of the portrait but rather as so enraptured by the painting that he’s hardly even aware of Hallward. Choice C is incorrect because the portrait of Dorian is the only painting that is mentioned in the text, so there’s no evidence that Dorian prefers portraits to other types of paintings. Although Dorian is depicted as delighted with this particular portrait, there’s no way of knowing from the text whether he likes portraits better than other kinds of paintings. Choice D is incorrect because nothing in the text suggests that Dorian is uncertain about Hallward’s talent. Instead, the text is focused on Dorian’s delight with the portrait."},{"i":"ca5a3fb4","c":"infer","d":"M","s":"The practice of logging (cutting down trees for commercial and other uses) is often thought to be at odds with forest conservation (the work of preserving forests). However, a massive study in forest management and preservation spanning 700,000 hectares in Oregon’s Malheur National Forest calls that view into question. So far, results of the study suggest that forest plots that have undergone limited logging (the careful removal of a controlled number of trees) may be more robust than plots that haven’t been logged at all. These results, in turn, suggest that ______ Which choice most logically completes the text?","o":["logging may be useful for maintaining healthy forests, provided it is limited.","other forest management strategies are more effective than limited logging.","as time passes, it will be difficult to know whether limited logging has any benefits.","the best way to support forest health may be to leave large forests entirely untouched."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the potential effects of logging on forest conservation. The text begins by stating that logging practices are often thought of as being contrary to forest conservation efforts. Then, the text presents the results of a research study examining the effect of limited logging practices on specific forest plots, finding that the plots with limited logging may be \"more robust\" (healthier) than the plots that hadn’t been logged at all. Given these results, it follows that logging may be a useful practice for maintaining healthy forests if it is practiced in a limited way. Choice B is incorrect because the study referenced in the text only provides information on limited logging as a potential forest management strategy. There is no information in the text about how other forest management strategies support forest conservation efforts. Therefore, the text does not support the assertion that other forest management strategies are more successful than limited logging. Choice C is incorrect because the text presents a research study with findings that specific plots of forest with limited logging may be more robust than the forest plots that were not logged. Rather than suggesting that it is hard to know whether limited logging might be beneficial, the text suggests that the practice could be useful in forest conservation efforts. Choice D is incorrect. The text discusses the results of a research study that compares the health of forest plots with limited logging to forest plots that were not logged. It does not take a position on the best way to support forest health but rather presents a research study with findings that question conventionally held thoughts regarding the practice of logging."},{"i":"b1fab3e1","c":"infer","d":"M","s":"Violins made by Antonio Stradivari and other craftspeople in the sixteenth to eighteenth centuries in Cremona, Italy, produce a sound that is considered superior to that of modern stringed instruments. Some experts have claimed that the type of wood used to create Cremonese violins is responsible for their prized sound, but modern and Cremonese violins are made of the same kinds of wood: maple and spruce. New analysis, however, has revealed unique indications that the wood in the older violins was chemically treated by the makers, leading researchers to suggest that ______ Which choice most logically completes the text?","o":["Cremonese violins probably were not considered superior to other instruments at the time they were made.","the sound quality of Cremonese violins results in part from a method the craftspeople used to alter the wood.","if modern violins were made of a wood other than maple or spruce, they likely would sound as good as Cremonese violins.","the current process of making violins is the same process that was used centuries ago by Cremonese craftspeople."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the sound quality of Cremonese and modern violins. The text states that violins made in Cremona in the sixteenth to eighteenth centuries sound superior to modern violins. It then indicates that some experts attribute the difference to different woods being used to make these violins, but both Cremonese and modern violins are made of the same woods (maple and spruce); thus this cannot account for the difference. The text then says that recent analysis suggests the wood in Cremonese violins was chemically treated by the craftspeople who made them, thereby providing an alternate explanation for the sound differences: the chemical alteration that is present in the Cremonese violins but absent from the modern ones. Choice A is incorrect because the text does not discuss how the sound quality of Cremonese violins compares with the sound quality of other instruments made during the sixteenth to eighteenth centuries. Instead it focuses on how the sound of the Cremonese violins compares with that of modern violins. Choice C is incorrect. The text states that there are differences in sound quality between the Cremonese and modern violins, and that both types of violin are made with maple or spruce. Thus the type of wood alone does not determine a violin’s sound quality. Furthermore, even if the type of wood alone could account for differences in sound quality, the text makes no mention of other woods, so there is no basis to judge how modern violins would sound if they were made using woods besides maple and spruce. Choice D is incorrect because the text states that there is evidence that Cremonese craftspeople chemically treated the wood used in Cremonese violins. This evidence is attributed to “new analysis,” which strongly suggests that this process was unknown to modern violin makers before that analysis. If the chemical treatment was unknown until recently, the manufacturing process for modern violins must differ with respect to the previously unknown practice of chemically treating the wood."},{"i":"6f626ae5","c":"claim","d":"E","s":"“To You” is an 1856 poem by Walt Whitman. In the poem, Whitman suggests that readers, whom he addresses directly, have not fully understood themselves, writing, ______ Which quotation from “To You” most effectively illustrates the claim?","o":["“You have not known what you are, you have slumber’d upon yourself / all your life, / Your eyelids have been the same as closed most of the time.”","“These immense meadows, these interminable rivers, you are immense / and interminable as they.”","“I should have made my way straight to you long ago, / I should have blabb’d nothing but you, I should have chanted nothing / but you.”","“I will leave all and come and make the hymns of you, / None has understood you, but I understand you.”"],"a":0,"r":"Choice A is the best answer because it presents the quotation that most directly illustrates the claim that Whitman’s poem suggests that its readers haven’t fully understood themselves. This quotation makes that point directly by saying to readers, “You have not known what you are.” The quotation goes on to reinforce this point using a metaphor of sleep, saying that readers have “slumber’d” and that their “eyelids have been the same as closed most of the time.” Choice B is incorrect because this quotation doesn’t suggest that readers haven’t fully understood themselves but instead characterizes readers as “immense” and “interminable.” Although immense and interminable things can be difficult to understand, this quotation doesn’t make that point. Choice C is incorrect because this quotation doesn’t suggest that readers haven’t fully understood themselves but instead conveys the speaker’s regret over not having celebrated readers sooner. In fact, this quotation says nothing at all about readers themselves—it’s focused solely on the speaker’s feelings about readers. Choice D is incorrect because this quotation doesn’t suggest that readers haven’t fully understood themselves; instead, this quotation makes the point that the speaker has understood readers and is determined to create “hymns” about them."},{"i":"98d0a5d7","c":"claim","d":"H","s":"Almost all works of fiction contain references to the progression of time, including the time of day when events in a story take place. In a 2020 study, Allen Kim, Charuta Pethe, and Steven Skiena claim that an observable pattern in such references reflects a shift in human behavior prompted by the spread of electric lighting in the late nineteenth century. The researchers drew this conclusion from an analysis of more than 50,000 novels spanning many centuries and cultures, using software to recognize and tally both specific time references—that is, clock phrases, such as 7 a.m. or 2:30 p.m.—and implied ones, such as mentions of meals typically associated with a particular time of day.\n\nWhich finding from the study, if true, would most directly support the researchers’ conclusion?","o":["Novels published after the year 1800 include the clock phrase 10 a.m. less often than novels published before the year 1800 do.","Novels published after 1880 contain significantly more references to activities occurring after 10 p.m. than do novels from earlier periods.","Among novels published in the nineteenth century, implied time references become steadily more common than clock phrases as publication dates approach 1900.","The time references of noon (12 p.m.) and midnight (12 a.m.) are used with roughly the same frequency in the novels."],"a":1,"r":"Choice B is the best answer because it presents a finding that, if true, would most directly support the researchers’ conclusion that an observable pattern in time references in novels reflects a shift in human behavior prompted by the spread of electric lighting in the late nineteenth century. If novels published after 1880 contain significantly more references to activities occurring after 10 p.m. than novels from earlier periods do, this would suggest a change in human behavior and daily routines enabled by the availability of electric lighting. Before electric lighting—which provided illumination more easily than other available forms of light—many activities ceased after nightfall, so references to late-night activities would be less common in earlier novels. An increase in such references after 1880 would align with the researchers’ conclusion, reflecting an increase in late-night activities made possible by electric lighting. Choice A is incorrect because a decrease in references to 10 a.m. after the year 1800 would not support the researchers’ conclusion involving a shift in human behavior prompted by the spread of electric lighting toward the end of the 1800s. The time of 10 a.m. is in the morning and, in most places, characterized by daylight, so a change in references to that time would not be clearly linked to the impact of electric lighting. Choice C is incorrect because while an increase in implied time references relative to clock phrases in nineteenth-century novels could suggest a change in writing style or conventions, it does not directly support the conclusion involving a shift in human behavior prompted by the spread of electric lighting. The text indicates that the researchers’ conclusion is based on the content of the time references themselves, not the phrasing used. Choice D is incorrect. If references to noon and midnight are used with roughly the same frequency in all the novels analyzed by the researchers, this would reflect a lack of change in human behavior with regard to time and therefore would not support the researchers’ conclusion involving a shift in human behavior that occurred in response to the spread of electric lighting."},{"i":"df37c087","c":"graph","d":"H","s":"","o":["The Ultra-Fast Robot Hand and the Yale Model T each weigh more than 450 grams.","The Ultra-Fast Robot Hand and the Yale Model T each weigh more than the Permanent Magnet Hand does.","The Yale Model T has a lower holding force than the Permanent Magnet Hand despite weighing more.","The Ultra-Fast Robot Hand weighs only slightly more than the Yale Model T does."],"a":3,"r":"Choice D is the best answer because it describes data in the graph that support Meng and colleagues’ conclusion that the Ultra-Fast Robot Hand has a higher payload capacity than the Yale Model T . According to the text, payload capacity is calculated by using a ratio of a robot’s holding force to the robot’s weight, and higher ratios indicate a greater payload capacity. The Ultra-Fast Robot Hand has a holding force of 56 newtons, four times greater than that of the Yale Model T . Additionally, the graph shows that the Ultra-Fast Robot Hand has a weight of approximately 500 grams, slightly more than the Yale Model T’s weight of approximately 480 grams. Therefore, the Ultra-Fast Robot Hand has a higher ratio of holding force to weight than the Yale Model T . Since higher ratios correspond to greater payload capacity, the information from the graph indicating that the Ultra-Fast Robot Hand weighs only slightly more than the Yale Model T combined with the information in the text ultimately supports the conclusion that the Ultra-Fast Robot Hand has a higher payload capacity than the Yale Model T . Choice A is incorrect. Although, according to the graph, it’s true that both the Ultra-Fast Robot Hand and the Yale Model T weigh more than 450 grams, this statement doesn’t support Meng and colleagues’ conclusion that the Ultra-Fast Robot Hand has a higher payload capacity than the Yale Model T . This statement emphasizes a similarity, not a distinction, between the two robots. Choice B is incorrect. Although, according to the graph, it’s true that the Ultra-Fast Robot Hand and the Yale Model T both weigh more than the Permanent Magnet Hand does, this statement doesn’t support Meng and colleagues’ conclusion that the Ultra-Fast Robot Hand has a higher payload capacity than the Yale Model T . This statement emphasizes a similarity, not a distinction, between the Ultra-Fast Robot Hand and the Yale Model T . Furthermore, the comparison to the Permanent Magnet Hand is irrelevant to the claim about the relative ratios and payload capacities of the Ultra-Fast Robot Hand and the Yale Model T . Choice C is incorrect. Although the text states that the Yale Model T has a lower holding force than the Permanent Magnet Hand, the graph provides no information about holding force. Moreover, information about the Permanent Magnet Hand is irrelevant to the conclusion by Meng and colleagues, which only concerns the Ultra-Fast Robot Hand and the Yale Model T ."},{"i":"3dc911d6","c":"graph","d":"E","s":"","o":["from 2003 to 2023, the House of Representatives had a higher percentage of those members than the Senate did.","from 1953 to 2003, those members constituted a majority in both houses of Congress.","the percentage of those members decreased substantially in both houses of Congress from 1973 to 2013.","the percentage of those members remained fairly consistent, regardless of house, from 1993 to 2023."],"a":2,"r":"Choice C is the best answer because it accurately uses data from the graph to complete the statement regarding the research institute’s findings about veteran representation in Congress. The graph shows that the percentage of veterans in both houses of Congress decreased dramatically from 1973 to 2013. In 1973, the House of Representatives consisted of approximately 74% veterans, and the Senate was made up of approximately 79% veterans. By 2013, veteran members of both houses had fallen to approximately 17%–18%. This represents a substantial decrease of more than 50% in each house over this 40-year period. Choice A is incorrect because from 2003 to 2023, the House of Representatives did not consistently have a higher percentage of veterans than the Senate did. According to the graph, in 2003 the Senate was made up of approximately 35% veterans, while the House consisted of approximately 23% veterans. In 2013, the number of veterans in the Senate was still slightly higher (approximately 18%) than in the House (approximately 17%). Only in 2023 did the House have a marginally higher percentage than the Senate. Choice B is incorrect because veterans did not constitute a majority in both houses throughout the entire period shown in the graph from 1953 to 2003. According to the graph, both houses had a majority of veterans in 1953 (approximately 62% in the House and approximately 74% in the Senate) and in 1973 (approximately 74% in the House and approximately 79% in the Senate), but by 1993 the House had fallen below 50% to approximately 40% veterans. By 2003, both houses were well below 50%. Choice D is incorrect because the percentage of veterans in Congress did not remain consistent from 1993 to 2023. The graph shows significant changes in the number of members reporting past military service during this period, particularly the continued decline from 1993 to 2003. In 1993, the House had approximately 40% veterans and the Senate had approximately 63% veterans, but by 2003 these percentages had dropped to approximately 23% and 35%, respectively. Furthermore, there was a large gap between the two houses in 1993 that narrowed considerably by 2013, which contradicts the claim that the percentage of veterans across both houses “remained fairly consistent” during this period."},{"i":"3bceeb93","c":"fss","d":"H","s":"When they were first discovered in Australia in 1798, duck-billed, beaver-tailed platypuses so defied categorization that one scientist assigned them the name Ornithorhynchus paradoxus: “paradoxical bird-snout.”The animal, which lays eggs but also nurses ______ young with milk, has since been classified as belonging to the monotremes group.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["they’re","their","its","it’s"],"a":2,"r":"Choice C is the best answer. The singular possessive pronoun \"its\" agrees with the singular antecedent \"the animal\" and indicates that the \"young\" belong to it. Choice A is incorrect. This choice creates a pronoun-antecedent agreement error. \"They’re\" is a contraction of \"they are,\" a plural pronoun and verb, but the antecedent \"the animal\" is singular. Also, we don’t need the extra verb \"are\" — we already have a main verb in this clause, so adding \"are\" would be confusing and ungrammatical. Choice B is incorrect. This choice creates a pronoun-antecedent agreement error. \"Their\" is a plural pronoun, but the subject of the sentence is \"the animal,\" a singular noun. Choice D is incorrect. This choice creates a confusing and ungrammatical sentence. \"It’s\" is a contraction for \"it is.\" We already have the verb \"nurses\" in this clause, so we shouldn’t add the verb \"is.\""},{"i":"f10b7ce4","c":"fss","d":"H","s":"In the list “Adorable Things” from Sei Shōnagon’s Pillow Book, the author delights in baby sparrows, a face drawn on a melon, and a young courtier in ceremonial garb. So shrewd an observer is Shōnagon, a lady-in-waiting to Empress Teishi, that her book’s musings on tenth-century Japanese courtly life ______ readers a thousand years later.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["fascinate","has fascinated","fascinates","is fascinating"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-verb agreement. The plural verb \"fascinate\" agrees in number with the plural subject \"musings.\" Choice B is incorrect because the singular verb \"has fascinated\" doesn’t agree in number with the plural subject \"musings.\" Choice C is incorrect because the singular verb \"fascinates\" doesn’t agree in number with the plural subject \"musings.\" Choice D is incorrect because the singular verb \"is fascinating\" doesn’t agree in number with the plural subject \"musings.\""},{"i":"a2816c7f","c":"fss","d":"H","s":"American abstract artist Richard ______ his installations to make passersby keenly aware of how one’s movements are affected by the physical features of one’s environment, assembles large-scale steel plates into sculptures that dominate the outdoor spaces they occupy.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Serra is intending","Serra, intends","Serra, intending","Serra intends"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verb forms within a sentence. This choice pairs the comma after \"Serra\" with the comma after \"environment\" and uses the nonfinite present participle \"intending\" to correctly form a supplementary phrase describing the reaction Serra intends his sculptures to provoke. This supplementary phrase appears between the noun phrase that it modifies (\"American abstract artist Richard Serra\") and the finite present tense verb (\"assembles\"), which functions as the sentence’s main verb and describes what Serra does. Choice A is incorrect because it results in an ungrammatical sentence. The finite present continuous tense verb \"is intending\" can’t be used in this way in conjunction with the finite present tense verb \"assembles,\" which already functions as the main verb in the sentence. Choice B is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"intends\" can’t be used in this way to supplement the noun phrase \"American abstract artist Richard Serra.\" Choice D is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"intends\" can’t be used in this way in conjunction with the finite present tense verb \"assembles,\" which already functions as the main verb in the sentence."},{"i":"1b97cce9","c":"bound","d":"H","s":"Hegra is an archaeological site in present-day Saudi Arabia and was the second largest city of the Nabataean Kingdom (fourth century BCE to first century CE). Archaeologist Laila Nehmé recently traveled to Hegra to study its ancient ______ into the rocky outcrops of a vast desert, these burial chambers seem to blend seamlessly with nature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["tombs. Built","tombs, built","tombs and built","tombs built"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “tombs” is used correctly to mark the boundary between one sentence (“Archaeologist...tombs”) and another (“Built...nature”). Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice C is incorrect. Without a comma preceding it, the conjunction “and” can’t be used in this way to join the two sentences. Choice D is incorrect because it results in a run-on sentence. The sentences (“Archaeologist...tombs” and “Built...nature”) are fused without punctuation and/or a conjunction."},{"i":"fdb16e20","c":"bound","d":"H","s":"Quantum particles of light—photons—provide an unhackable means of transmitting encryption keys over networks, as attempts to observe particles in quantum states will invariably alter the particles ______ dismantle any information they transmit.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["and in the process,","and, in the process,","and in the process—","and, in the process"],"a":1,"r":"Choice B is the best answer. This choice uses paired punctuation in the form of two commas to set off the nonessential phrase \"in the process.\" Choice A is incorrect. The phrase \"in the process\" is a nonessential element and needs to be set off with paired punctuation. We need a comma after \"and\" to match the one after \"process.\" Choice C is incorrect. The phrase \"in the process\" is a nonessential element and needs to be set off with paired punctuation, so we would need a dash after \"and\" to match the one following \"process.\" Choice D is incorrect. The phrase \"in the process\" is a nonessential element and needs to be set off with paired punctuation. We would need a comma after \"process\" to match the one following \"and.\""},{"i":"e2eb70b9","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Traditionally, manufacturers have dyed denim jeans blue by dipping them in a solution containing indigo powder. Indigo doesn’t dissolve in just water, so manufacturers must mix hazardous chemicals with water to dissolve the powder. Textile researcher Smriti Rai discovered a process for dyeing blue jeans without chemicals. Rai added indigo powder to a hydrogel containing nanocellulose and produced a dye that could be spread directly onto the denim. Nanocellulose is a natural, plant-based substance that separates the molecules of indigo powder. The student wants to emphasize a difference between the two approaches to dyeing blue jeans.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Though created using a different process, Rai’s dye contains the same ingredient as the dye produced by blue jean manufacturers.","Nanocellulose is a natural, plant-based substance that separates the molecules of indigo powder, which doesn’t dissolve in water.","The traditional approach to dyeing blue jeans is to dip them in a solution containing hazardous chemicals.","Rai’s approach substitutes a natural, plant-based substance for the hazardous chemicals that manufacturers have traditionally used."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes a difference between the two approaches to dyeing blue jeans, noting that Rai’s approach uses a natural, plant-based substance in place of hazardous chemicals. Choice A is incorrect. The sentence emphasizes a similarity between the dyes used in the two approaches, noting that the dyes contain the same ingredient; it doesn’t emphasize a difference between the two approaches to dyeing blue jeans. Choice B is incorrect. The sentence explains what nanocellulose is; it doesn’t emphasize a difference between the two approaches to dyeing blue jeans. Choice C is incorrect. The sentence explains the traditional approach to dyeing blue jeans; it doesn’t emphasize a difference between the traditional approach and Rai’s approach."},{"i":"7f2781fd","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Certhidea olivacea is a perching bird that can be found on the Galápagos Island of Pinzón. Creagrus furcatus is a seabird that can be found on the Galápagos Island of Darwin. Conservation organizations evaluate the risk that species will become extinct in the near future. C. olivacea faces a high risk of extinction. C. furcatus faces little risk of becoming extinct in the near future. The student wants to compare the extinction risk faced by C. olivacea with that faced by C. furcatus.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["According to conservation organizations, C. olivacea has a higher risk of becoming extinct in the near future than C. furcatus.","C. furcatus faces a high risk of extinction, while C. olivacea faces little risk of becoming extinct in the near future.","Conservation organizations have evaluated both C. furcatus’s and C. olivacea’s risk of becoming extinct in the near future.","C. olivacea is a perching bird that faces a high risk of extinction."],"a":0,"r":"Choice A is the best answer. The sentence compares the extinction risks of the two species, noting that C. olivacea has a higher risk of becoming extinct in the near future than C. furcatus. Choice B is incorrect. While the sentence does compare the extinction risks of the two species, it misrepresents information from the notes; C. olivacea faces a higher risk of becoming extinct in the near future than C. furcatus, not the other way around. Choice C is incorrect. While the sentence mentions that conservation organizations have evaluated both species for extinction risk, it doesn’t compare the extinction risks of the two species. Choice D is incorrect. While the sentence states that C. olivacea faces a high risk of extinction, it doesn’t mention C. furcatus or compare the extinction risks of the two species."},{"i":"0839a4b9","c":"trans","d":"M","s":"The Coastal Futures Conservatory in Virginia is known for creating aural representations of ecological data. One such effort combines underwater audio recorded in seagrass beds with data that track rising carbon levels in the seagrass. As carbon levels increase, the audio is correspondingly distorted; ______ listeners can “hear” the changes in the carbon levels.\n\nWhich choice completes the text with the most logical transition?","o":["furthermore,","by comparison,","for instance,","thus,"],"a":3,"r":"Choice D is the best answer. \"Thus\" logically signals that the information in this clause—that listeners can \"hear\" carbon levels increasing—is a result of the previous information about the audio distorting as carbon levels increase. Choice A is incorrect because \"furthermore\" illogically signals that the information in this clause merely adds to the previous information about the audio distorting as carbon levels rise. Instead, the listeners’ ability to \"hear\" carbon levels increasing is a result of that distortion. Choice B is incorrect because \"by comparison\" illogically signals that the information in this clause is being compared to the information about the audio distorting as carbon levels rise. Instead, the listeners’ ability to \"hear\" carbon levels increasing is a result of that distortion. Choice C is incorrect because \"for instance\" illogically signals that the information in this clause is an example of how the audio distorts as carbon levels rise. Instead, the audio was distorted for the express purpose of representing ecological data; the listeners’ ability to \"hear\" carbon levels increasing is a direct, intended result of the distortion, not merely an example of it."},{"i":"c071eca2","c":"trans","d":"H","s":"Iraqi artist Nazik Al-Malaika, celebrated as the first Arabic poet to write in free verse, didn’t reject traditional forms entirely; her poem “Elegy for a Woman of No Importance” consists of two ten-line stanzas and a standard number of syllables. Even in this superficially traditional work, ______ Al-Malaika was breaking new ground by memorializing an anonymous woman rather than a famous man.\n\nWhich choice completes the text with the most logical transition?","o":["therefore,","in fact,","moreover,","though,"],"a":3,"r":"Choice D is the best answer. The first sentence tells us that Al-Malaika sometimes used \"traditional forms\". The second tells us that even when she used traditional forms, Al-Malaika was \"breaking new ground\". To connect these ideas, we need a contrast word like \"but.\" \"Though\" is a contrast word similar to \"but.\" Choice A is incorrect. This isn’t a logical transition. The first sentence tells us that Al-Malaika sometimes used \"traditional forms\". The second tells us that even when she used traditional forms, Al-Malaika was \"breaking new ground\". To connect these ideas, we need a contrast word like \"but.\" \"Therefore\" doesn’t show contrast; it shows cause and effect. Choice B is incorrect. This isn’t a logical transition. The first sentence tells us that Al-Malaika sometimes used \"traditional forms\". The second tells us that even when she used traditional forms, Al-Malaika was \"breaking new ground\". To connect these ideas, we need a contrast word like \"but.\" \"In fact\" is a phrase that usually emphasizes the truth of the previous statement. Choice C is incorrect. This isn’t a logical transition. The first sentence tells us that Al-Malaika sometimes used \"traditional forms\". The second tells us that even when she used traditional forms, Al-Malaika was \"breaking new ground\". To connect these ideas, we need a contrast word like \"but.\" \"Moreover\" doesn’t show contrast—it introduces additional information that continues or supports the previous idea."},{"i":"92fe0ed7","c":"trans","d":"E","s":"Geoscientists have long considered Hawaii’s Mauna Loa volcano to be Earth’s largest shield volcano by volume, measuring approximately 74,000 cubic kilometers. ______ according to a 2020 study by local geoscientist Michael Garcia, Hawaii’s Pūhāhonu shield volcano is significantly larger, boasting a volume of about 148,000 cubic kilometers.\n\nWhich choice completes the text with the most logical transition?","o":["Secondly,","Consequently,","Moreover,","However,"],"a":3,"r":"Choice D is the best answer. “However” logically signals that this sentence, which indicates that the Pūhāhonu volcano may be larger than the Mauna Loa volcano, offers a contrast to or refutation of the previous assumption that Mauna Loa is the largest shield volcano. Choice A is incorrect because “secondly” illogically signals that this sentence merely offers an additional or secondary point concerning the previous assumption that Mauna Loa is the largest shield volcano. Instead, the sentence offers a contrast to or refutation of that assumption. Choice B is incorrect because “consequently” illogically signals that this sentence offers a result or consequence of the previous assumption that Mauna Loa is the largest shield volcano. Instead, the sentence offers a contrast to or refutation of that assumption. Choice C is incorrect because “moreover” illogically signals that this sentence merely adds to the previous assumption that Mauna Loa is the largest shield volcano. Instead, the sentence offers a contrast to or refutation of that assumption."}],"img":{"df37c087":"iVBORw0KGgoAAAANSUhEUgAAArwAAAIsBAMAAADi8mczAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABNaElEQVR42u1dd1wURxt+ZveOo98cWKPCAvbGYo/17DGxnDXNcmpiLJ+KKWqiSbBrNAkmFkSj2GsSLLGX09jr2Y2NQ40dbg4r7eb740ABOWMSCAr7/H7K7ezuzOyz777zltlZQIECBQoUKFCgQIECBQoUKFCgQIECBa8EyAsVZXsMTftNqUJjtgxREArAFwBqODgjoEC5MdD5+Oh6pjFNsvIeCABlABJIAQI0AwD6QvclNyC8jPSW0wtrURwAagFAS4AXouCEEHwC9I+cZRwNDgBp/wMj0k/9ABR4G9BERFJw4EMAYJTrFXqf4IperIVqAHAAAKwAmjGAWzkp9iWWrYnYGZNB0AmAJun0zQYDrIDv/vnhAMDg+D9UofcJUmX1j2jA3t+LGhh5fgGb/Jtq/B7A5YKxWN1wXPp121FxTpj4wT4yZyEvviUYUN8IhcsWg6bW7uoYuZFSIP7yBr0wZwH4lLXQbDO6vzX1rQOKInZAtbNUJf1e1W7PsIGuOxsYu48aSJcHgs4OOivuBeBFycWmS4VbTUp8/L+AjUVWA26hJzCi9B63A/Iy0qGk8X3gNaPGXHnUQP337UfSKYFn1SdVawtJivQ6pPd+qYt6T5ejlfRW8dcj1O/reXrzZSRUuDSMX3IoBNdtJ4XE7YHm401K2AsBQaa9eD/1DLlhZvxXb1lHgLenGfVfzzF4/jrP8Pblz0qmwueuJQ8E5WWklye0PlTjmFCut4UnN/f47U2AUYCk4hgPAEATEA9mj0e7UvdWaMZzoPrrNQXVcC+YADJcBAcY function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}
function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
