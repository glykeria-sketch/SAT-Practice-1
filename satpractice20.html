<script>
const D={"t":"SATPractice20","q":[{"i":"5fe53347","c":"vocab","d":"E","s":"Botanist Al Kovaleski has pointed out that maple trees already thrive in a wide variety of climates and thus may ______ changes in climate better than some other tree species do. The alterations maples may undergo in response to a changing climate are likely to be relatively small and easily achieved.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["relocate from","refer to","originate from","adapt to"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of how maple trees may respond to changes in climate. As used in this context, \"adapt to\" means to adjust to new conditions. The text first notes that maple trees already thrive in a wide variety of climates and then goes on to say that alterations maples may undergo are likely to be relatively small and easily achieved. This context supports the idea that maple trees will more easily adjust or adapt to a changing climate. Choice A is incorrect. Although the text discusses how maple trees adjust to change, the trees do not \"relocate from,\" or physically move from one place to another. Choice B is incorrect because \"refer to\" means to mention or allude to something, and the trees are not doing either of these actions. Choice C is incorrect because the text is discussing how maple trees may respond to changes in climate, not where they \"originate from,\" or came from originally."},{"i":"45a109a3","c":"vocab","d":"E","s":"The following text is from Bram Stoker’s 1897 novel Dracula. The narrator is being driven in a carriage through a remote region at night. The baying of the wolves sounded nearer and nearer, as though they were closing round on us from every side. I grew dreadfully afraid, and the horses shared my fear. The driver, however, was not in the least disturbed; he kept turning his head to left and right, but I could not see anything through the darkness.\n\nAs used in the text, what does the word “disturbed” most nearly mean?","o":["Disorganized","Alarmed","Offended","Interrupted"],"a":1,"r":"Choice B is the best answer because as used in the text, “disturbed” most nearly means alarmed. The text portrays the narrator traveling in a carriage as wolves howl in the surrounding darkness. The text contrasts the reaction of both the narrator and the horses pulling the carriage with that of the driver of the carriage: the narrator and horses are “dreadfully afraid,” but the driver is “not in the least disturbed.” In other words, the driver is not alarmed by the wolves nearby. Choice A is incorrect. Although in some contexts, “disturbed” can mean disorganized, the text doesn’t portray a character acting in a disorganized manner; instead, the driver continues to drive the carriage, even though the horses pulling it are alarmed. Choice C is incorrect. Although in some contexts, “disturbed” can mean offended, the text doesn’t portray one character feeling offended, or upset, by another’s actions; instead, it contrasts the fear felt by the narrator with another character’s lack of fear. Choice D is incorrect. Although in some contexts, “disturbed” can mean interrupted, the text doesn’t portray an action being interrupted; indeed, the travel depicted in the scene continues despite the threat of the wolves outside the carriage."},{"i":"b92c13fa","c":"vocab","d":"E","s":"According to statistician Nassim Nicholas Taleb, the best way to predict the amount of time a nonperishable entity (such as a building or a technology) will continue to exist is to examine how long it has survived so far. In this view, an item’s age is the strongest ______ how much longer it will last.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["uncertainty about","indicator of","motivation for","criticism of"],"a":1,"r":"Choice B is the best answer. “Indicator” means “something that shows or suggests,” which matches Taleb’s argument that an item’s age can suggest how much longer it will last. Choice A is incorrect. The passage tells us that examining an item’s age is the best way to predict how much longer it will last. Therefore, according to Taleb’s theory, an item’s age should add more certainty about how much longer it will last. Choice C is incorrect. A “motivation” is “a reason for doing.” Items don’t have feelings and motivations, so it wouldn’t make sense to say that their age is a motivation for how much longer they will last. Choice D is incorrect. “Criticism” can mean “describing faults or problems” or “an analysis of an artistic work.” Neither of these definitions makes sense here. An item’s age can’t criticize how much longer it will last."},{"i":"757077f9","c":"vocab","d":"M","s":"During a 2014 archaeological dig in Spain, Vicente Lull and his team uncovered the skeleton of a woman from El Algar, an Early Bronze Age society, buried with valuable objects signaling a high position of power. This finding may persuade researchers who have argued that Bronze Age societies were ruled by men to ______ that women may have also held leadership roles.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["waive","concede","refute","require"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the significance of the 2014 archaeological finding at El Algar. In this context, “concede” means to admit something is true after first resisting that admission. The text indicates that some researchers believe “Bronze Age societies were ruled by men.” But the Bronze Age burial of a woman at El Algar included “valuable objects signaling a high position of power,” which would raise the possibility that “women may have also held leadership roles.” Thus, the text is calling into question the notion that only men were leaders in these societies and speculating that people holding this view may reconsider their opinion. Choice A is incorrect because “waive” means to refrain from insisting that something, such as a right or a requirement, be observed; the word isn’t used, however, in contexts where someone acknowledges that an opinion they hold may be invalid, as is the case in the text. Choice C is incorrect. According to the text, the finding from the El Algar burial site undermines the view that Bronze Age societies were exclusively ruled by men. However, “refute” means to demonstrate that something is false and would not make sense in context. Lull and team’s finding supports the view that women may have also held leadership roles, not that they did not participate in such roles. Choice D is incorrect because in this context, “require” means to demand or specify as mandatory. However, it would not make sense for contemporary researchers to demand that Bronze Age “women may have also held leadership roles.”"},{"i":"65406d2c","c":"purpose","d":"H","s":"Dubautia carrii is a species in a family of plants known collectively as the silversword alliance, all of which grow only on the Hawaiian Islands. Members of this alliance exhibit an extraordinary range of phenotypes, with some species maturing into vines and others into shrubs and trees. All species in the alliance descended from a single ancestral tarweed plant that arrived on the islands around 5 million years ago. The tarweed’s descendants diversified into distinct species as they adapted to live in the wide variety of habitats found on the Hawaiian Islands.\n\nWhich choice best states the main purpose of the text?","o":["To indicate the specific tarweed ancestor of all plants that grow on the Hawaiian Islands and explain why the plants have such varied physical characteristics","To describe the specific habitat where Dubautia carrii are found and identify other plants that share a common ancestor with them","To describe the silversword alliance and explain how the plant family became so varied","To advance the claim that all plants on the Hawaiian Islands are part of the silversword alliance and list possible ancestors of the plants that make up the alliance"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to describe the family of plants known as the silversword alliance and explain why the plants came to exhibit \"an extraordinary range of phenotypes.\" The text introduces the silversword alliance as a family of plants unique to the Hawaiian Islands, presenting those that mature into vines and those that mature into shrubs and trees as examples of different phenotypes. The text concludes by explaining that these plants are all descendants of \"a single ancestral tarweed plant\" that arrived 5 million years ago in the Hawaiian Islands, where a \"wide variety of habitats\" drove the plant’s descendants to adapt and thus differentiate themselves, diversifying into a group of related but distinct species with different physical characteristics. Choice A is incorrect. Although the text explains why the plants within the silversword alliance have varied physical characteristics, the text doesn’t suggest that tarweed is the ancestor of all plants on the Hawaiian Islands. The text states instead that all members of the silversword alliance descend from a single tarweed ancestor. Choice B is incorrect because while Dubautia carrii is mentioned as an example of a species in the silversword alliance, no details about its particular habitat are provided. And although the text indicates that the Hawaiian Islands are home to \"a wide variety of habitats,\" it doesn’t describe the specific habitat where Dubautia carrii is found. The text discusses the silversword alliance as a whole rather than focusing on Dubautia carrii or any one species within this family. Choice D is incorrect. Although the silversword alliance is only found on the Hawaiian Islands and includes \"an extraordinary range of phenotypes,\" the text doesn’t claim that all plants on the Hawaiian Islands are part of the alliance. Furthermore, the text indicates that these plants all \"descended from a single ancestral tarweed plant,\" not that there are multiple possible candidates for that ancestor plant."},{"i":"2af2016f","c":"purpose","d":"M","s":"A study by Dr. Paul Hanel and colleagues concluded that people are more likely to behave politely when listening to ideas they disagree with if they think about values before they engage in a discussion. Study participants were assigned to one of two groups. The experimental group spent a few minutes writing about one of their personal values before they had a group discussion on a controversial topic. And the control group spent a few minutes writing about a drink (tea, milk, etc.) before their group discussion on that topic. Hanel and colleagues found that the experimental group’s discussion was more civil than the control group’s discussion was.\n\nWhich choice best describes the main purpose of the text?","o":["To describe a widely held belief and how a study’s results support that belief","To argue that researchers were surprised by the results of a certain study","To suggest ways to improve a certain study’s experimental design","To explain a study’s conclusion and how a research team arrived at that conclusion"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain a study’s conclusion and how researchers involved in the study arrived at that conclusion. The text begins by summarizing the main conclusion of the study conducted by Paul Hanel and colleagues: when confronted with ideas they disagree with in discussions about controversial topics, people are more likely to respond politely if they think about their personal values before engaging in such discussions. The text then goes on to describe the design of Hanel and colleagues’ experiment. By comparing interactions between members of an experimental group (who had been prompted to write about their personal values beforehand) to those between members of a control group (who had been prompted to write about a beverage), the team found that people in the experimental group behaved more civilly, or politely, than people in the control group did during discussions about a controversial topic. This finding led to the conclusion described at the beginning of the text. Choice A is incorrect. Although the text discusses the results of a study, it doesn’t provide any indication that the conclusion the study supported —that when facing disagreement, people behave more politely when they have thought about their values—is a belief that is widely held. Choice B is incorrect because the text doesn’t indicate that the researchers found the results of their study to be surprising, or contrary to what they expected. In fact, there’s no indication provided in the text about how the researchers felt about the study’s results or that the results should be considered surprising. Choice C is incorrect. Although the text discusses the experimental design of a study, it doesn’t suggest any improvements to that design; instead, it focuses on how the design enabled the researchers to draw a particular conclusion."},{"i":"c502943e","c":"func","d":"E","s":"The following text is adapted from Cynthia Kadohata’s 2004 novel Kira-Kira. <u>[Uncle Katsuhisa] was as loud as my father was quiet.<\/u> Even when he wasn’t talking, he made a lot of noise, clearing his throat and sniffing and tapping his fingers. ©2004 by Cynthia Kadohata Which choice best describes the function of the underlined sentence?","o":["It lists the kinds of topics Uncle Katsuhisa enjoys discussing.","It suggests that Uncle Katsuhisa dislikes meeting new people.","It contrasts Uncle Katsuhisa with the narrator’s father.","It describes a conversation between the narrator and the narrator’s father."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The underlined sentence establishes a difference between Uncle Katsuhisa and the narrator’s father by describing Uncle Katsuhisa as \"loud\" and the narrator’s father as \"quiet.\" The text then elaborates on that contrast, describing some ways Uncle Katsuhisa is very noisy even when he isn’t speaking. Choice A is incorrect because the text doesn’t indicate what kinds of topics Uncle Katsuhisa enjoys discussing, only that he is loud even when he isn’t speaking. Choice B is incorrect because the text never indicates how Uncle Katsuhisa feels about meeting new people, only how loud he is. Choice D is incorrect because the text never describes a conversation occurring between any people; it refers to talking only when stating that Uncle Katsuhisa is loud even when he isn’t speaking."},{"i":"570970cd","c":"func","d":"H","s":"The following text is adapted from Indian Boyhood, a 1902 memoir by Ohiyesa (Charles A. Eastman), a Santee Dakota writer. In the text, Ohiyesa recalls how the women in his tribe harvested maple syrup during his childhood. Now the women began to test the trees—moving leisurely among them, axe in hand, and striking a single quick blow, to see if the sap would appear. <u>The trees, like people, have their individual characters; some were ready to yield up their life-blood, while others were more reluctant.<\/u> Now one of the birchen basins was set under each tree, and a hardwood chip driven deep into the cut which the axe had made. From the corners of this chip—at first drop by drop, then more freely—the sap trickled into the little dishes.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It portrays the range of personality traits displayed by the women as they work.","It foregrounds the beneficial relationship between humans and maple trees.","It demonstrates how human behavior can be influenced by the natural environment.","It elaborates on an aspect of the maple trees that the women evaluate."],"a":3,"r":"Choice D is the best answer because it best describes the function of the underlined sentence in the text’s overall portrayal of how the women in Ohiyesa’s tribe harvested maple syrup. The text states that the women used an axe to strike the maple trees in order to find out which ones would produce sap. The underlined sentence compares the trees to people, with the sap described as the trees’ “life-blood.” Some of the trees are ready to give out their sap, while others are unwilling to do so. Using personification, the sentence provides greater detail about the aspect of the maple trees—their potential to give sap—that the women are evaluating. Choice A is incorrect because the personalities of the women are not discussed in the text. Although the underlined sentence does mention “individual characters,” this reference is not to the women in the text but rather to the maple trees, which the sentence compares to people with individual character traits. Choice B is incorrect because the underlined sentence focuses on the trees’ willingness or refusal to yield sap, not on the beneficial relationship between the women and the trees. Additionally, although the text does suggest that the women and their tribe benefit from the maple trees since the trees allow the women to harvest syrup, there is nothing in the text to suggest that the trees benefit from this relationship in turn. Choice C is incorrect because the underlined sentence is comparing maple trees to humans, not addressing the influence of the natural environment on how the actual humans in the text, the women, behave."},{"i":"f61c22f3","c":"structure","d":"H","s":"Changes to vegetation cover and other human activities influence carbon and nitrogen levels in soil, though how deep these effects extend is unclear. Hypothesizing that differences in land use lead to differences in carbon and nitrogen levels that are not restricted to the topsoil layer (0– 30 cm deep), Chukwuebuka Okolo and colleagues sampled soils across multiple land-use types (e.g., grazing land, cropland, forest) within each of several Ethiopian locations. They found, though, that across land-use types, carbon and nitrogen decreased to comparably low levels beyond depths of 30 cm.\n\nWhich choice best describes the overall structure of the text?","o":["It describes a phenomenon that scientists do not fully understand, explains a research team’s hypothesis about that phenomenon, and then describes a finding that led the team to refine the hypothesis.","It introduces an unresolved scientific question, presents a research team’s hypothesis pertaining to that question, and then describes an observation made by the team that conflicts with that hypothesis.","It discusses a process that scientists are somewhat unclear about, introduces competing hypotheses about that process, and then explains how a research team concluded that one of those hypotheses is likely correct.","It explains a hypothesis that has been the subject of scientific debate, discusses how a research team tested that hypothesis, and then presents data the team collected that validate the hypothesis."],"a":1,"r":"Choice B is the best answer because it most accurately describes the overall structure of the text. The text begins by explaining that human activities influence carbon and nitrogen levels in soil, but how deeply these effects are seen in the soil remains an unresolved question. Next, the text summarizes Okolo and colleagues’ hypothesis regarding this question—which is that the different effects on carbon and nitrogen levels associated with different types of land use would also be observed below the topsoil layer—and then briefly explains the methods they used to test this hypothesis. Finally, the text states that the researchers found that at depths below the topsoil layer, carbon and nitrogen decreased to similarly low levels across all land-use types, a finding that conflicts with the team’s hypothesis presented earlier in the text. Thus, the text introduces an unresolved scientific question, presents a research team’s hypothesis pertaining to that question, and then describes an observation that the team made that conflicted with their hypothesis. Choice A is incorrect. Although the text introduces a phenomenon (the fact that human activities influence carbon and nitrogen levels in the soil) that isn’t fully understood by scientists and explains a research team’s hypothesis about the phenomenon, the text doesn’t describe how the team refined their hypothesis when a research finding contradicted it. Choice C is incorrect because the text doesn’t discuss a process at all; rather, it poses an unsolved scientific question and presents a hypothesis that Okolo and colleagues tested to answer that question. Moreover, the text only describes one hypothesis; it doesn’t mention any competing hypotheses, nor does it suggest that Okolo’s team was able to determine which hypothesis was correct. Choice D is incorrect because the text doesn’t begin by presenting a hypothesis that is under scientific debate; rather, it presents a question that scientists have been unable to answer and then introduces a hypothesis formulated by Okolo and colleagues. While the text does explain how Okolo’s team tested their hypothesis, the text goes on to say that their data conflicted with their hypothesis, not that the data validated, or supported, their hypothesis."},{"i":"7bf79a90","c":"cross","d":"M","s":"Text 1 Microbes are tiny organisms in the soil, water, and air all around us. They thrive even in very harsh conditions. That’s why Noah Fierer and colleagues were surprised when soil samples they collected from an extremely cold, dry area in Antarctica didn’t seem to contain any life. The finding doesn’t prove that there are no microbes in that area, but the team says it does suggest that the environment severely restricts microbes’ survival.\n\nText 2 Microbes are found in virtually every environment on Earth. So it’s unlikely they would be completely absent from Fierer’s team’s study site, no matter how extreme the environment is. There were probably so few organisms in the samples that current technology couldn’t detect them. But since a spoonful of typical soil elsewhere might contain billions of microbes, the presence of so few in the Antarctic soil samples would show how challenging the conditions are.\n\nBased on the texts, Fierer’s team and the author of\n\nText 2 would most likely agree with which statement about microbes?","o":["Most microbes are better able to survive in environments with extremely dry conditions than in environments with harsh temperatures.","A much higher number of microbes would probably be found if another sample of soil were taken from the Antarctic study site.","Microbes are likely difficult to detect in the soil at the Antarctic study site because they tend to be smaller than microbes found in typical soil elsewhere.","Most microbes are probably unable to withstand the soil conditions at the Antarctic study site."],"a":3,"r":"Choice D is the best answer because it presents a statement about microbes with which Fierer’s team (Text 1) and the author of Text 2 would most likely agree. Text 1 states that microbes usually thrive in very harsh conditions, and so Fierer’s team was surprised when samples collected from an extremely cold and dry area of Antarctica didn’t appear to contain any life. Fierer’s team says that though this doesn’t conclusively prove there are no microbes in the area, it suggests that microbes would have a notably difficult time surviving in the environment. The author of Text 2 says it’s unlikely that there would be no microbes at all in the Antarctic study site from which Fierer’s team retrieved soil samples and that there may have been hard-to-detect microbes in the samples. However, the presence of only a few microbes in the Antarctic samples rather than the billions found in a typical soil sample (which would presumably be much easier to detect) would illustrate conditions in the Antarctic soil that make it difficult for microbes to thrive. Since Fierer’s team says that the seeming absence of microbes in the Antarctic samples suggests an unusually harsh environment and the author of Text 2 says that even if there are a few undetectable microbes in the samples, the relatively tiny number of microbes would also suggest an unusually harsh environment, then Fierer’s team and the author of Text 2 would most likely agree that most microbes are unable to withstand the soil conditions at the Antarctic study site. Choice A is incorrect. The samples taken by Fierer’s team were from an area of Antarctica that is described in part as extremely dry, and these samples didn’t appear to have any life. Therefore, even though these samples also came from an extremely cold area, Fierer’s team wouldn’t argue based on the evidence available that microbes were better able to survive in dry conditions than in areas with harsh temperatures. Moreover, the author of Text 2 says that microbes are found in virtually every environment on Earth but doesn’t compare dry environments and harsh environments. Choice B is incorrect. Nothing in Text 1 indicates that another collection of samples from the Antarctic study site might yield different results from the samples already taken by Fierer’s team. The author of Text 2 does state that microbes are found in virtually every environment on Earth and suggests that new technology may be better able to detect so few microbes in a soil sample, but the author of Text 2 concludes that the unusual absence of microbes in the Antarctic samples is evidence of the harsh Antarctic environment. Therefore, there is no reason to believe that the author of Text 2 thinks that another sample drawn from that same harsh environment would yield a much higher number of microbes. Choice C is incorrect. The author of Text 2 does speculate that there may have been so few microbes in the Antarctic samples that current technology couldn’t detect them, but the author doesn’t speculate that this is due to the size of the microbes. Moreover, nothing that Fierer’s team says suggests that they are speculating that their samples might have microbes that are smaller than microbes in typical soil samples."},{"i":"487a05f8","c":"main","d":"E","s":"The following text is adapted from Sylvia Acevedo’s 2018 memoir Path to the Stars: My Journey from Girl Scout to Rocket Scientist. The narrator is traveling by car with her family to Mexico City. Mario and Laura are her brother and sister. Mario and I played games to see how many different license plates we could spot, and Laura liked to look for children in the back seats of the cars we passed. We were used to the forty-five-minute drive to El Paso and familiar with the six-hour ride to Chihuahua, but I wondered what the long journey to Mexico City would be like. ©2018 by Sylvia Acevedo According to the text, what did the narrator and Mario do while riding in the car?","o":["They read books.","They sang songs.","They went to sleep.","They played games."],"a":3,"r":"Choice D is the best answer because it most accurately describes what the narrator and Mario did while riding in the car. The text describes a car trip that the narrator is taking with her family. The text states that during the car ride, the narrator and Mario \"played games\" to see how many different license plates they could spot. Choice A is incorrect because the text doesn’t mention the narrator and Mario reading during the car ride and instead describes them playing games. Choice B is incorrect because the text doesn’t mention the narrator and Mario singing songs during the car ride and instead describes them playing games. Choice C is incorrect because the text doesn’t mention the narrator and Mario sleeping during the car ride and instead describes them playing games."},{"i":"aa0968dd","c":"main","d":"H","s":"Poetry in Classical Nahuatl, the language of the Aztec Empire, relies on difrasismo, or a parallel noun construction that conventionally operates as a single metaphor. For example, the common difrasismo in cuauhtli in ocelotl (literally, “the eagle, the jaguar”) signifies “warrior.”The device’s function is both formal—providing structure to lines of verse—and ritual: semantic relations among the two nouns and the concept they signify can be tenuous, as in the previous example, such that difrasismos are often only intelligible according to the conceptual associations observed in Aztec ceremonial culture.\n\nWhich statement about the difrasismo in cuauhtli in ocelotl is most strongly supported by the text?","o":["Its metaphorical significance derives from the semantic equivalence of the two nouns constituting the difrasismo.","Its unintelligibility may cause its formal function within a line of verse to go unnoticed by present-day readers.","Its apparent obscurity can be resolved when considered in the proper cultural context.","Its frequency in Classical Nahuatl poetry confirms its intelligibility to the Aztec audience."],"a":2,"r":"Choice C is the best answer because it presents a statement about the difrasismo in cuauhtli in ocelotl that is directly supported by the text. The text begins by describing difrasismo, a device used in Classical Nahuatl poetry. The text then mentions the device’s two functions: a formal one (giving structure to lines of verse) and a ritualistic one. The text indicates that the relation between the words in a difrasismo may appear tenuous without the additional information supplied by Aztec ceremonial culture but that the meaning becomes intelligible in the context of that information. Therefore, the difrasismo’s apparent obscurity can be resolved when considered in the proper cultural context. Choice A is incorrect because the text doesn’t indicate that the two nouns used in a difrasismo are semantically equivalent; instead, the text indicates that the two nouns used in a difrasismo make up a single metaphor whose meaning is often intelligible only in the context of information supplied by Aztec ceremonial culture. Choice B is incorrect because the text doesn’t indicate that there’s a relationship between the formal function of the difrasismo and the difrasismo’s intelligibility. Additionally, the text suggests that present-day readers who are familiar with Aztec ceremonial culture wouldn’t find the difrasismo to be unintelligible. Choice D is incorrect because the text doesn’t indicate that the frequency of difrasismo’s use in Classical Nahuatl is a necessary feature of intelligibility: the text indicates that an infrequently used difrasismo would presumably also be intelligible to members of an Aztec audience who are sufficiently familiar with Aztec ceremonial culture."},{"i":"9391b7cc","c":"infer","d":"H","s":"If some artifacts recovered from excavations of the settlement of Kuulo Kataa, in modern Ghana, date from the thirteenth century CE, that may lend credence to claims that the settlement was founded before or around that time. There is other evidence, however, strongly supporting a fourteenth century CE founding date for Kuulo Kataa. If both the artifact dates and the fourteenth century CE founding date are correct, that would imply that ______ Which choice most logically completes the text?","o":["artifacts from the fourteenth century CE are more commonly recovered than are artifacts from the thirteenth century CE.","the artifacts originated elsewhere and eventually reached Kuulo Kataa through trade or migration.","Kuulo Kataa was founded by people from a different region than had previously been assumed.","excavations at Kuulo Kataa may have inadvertently damaged some artifacts dating to the fourteenth century CE."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of artifacts and Kuulo Kataa’s founding date. If it were true both that Kuulo Kataa was founded in the fourteenth century CE and that artifacts found in excavations of the settlement are from the thirteenth century CE, it would be reasonable to conclude that the artifacts weren’t created in the Kuulo Kataa settlement. That would suggest, then, that the artifacts originated somewhere else and eventually reached the settlement through trading or as people migrated. Choice A is incorrect because the existence of thirteenth-century CE artifacts recovered during excavations of a settlement founded in the fourteenth century CE isn’t logically connected to artifacts from one century being more commonly recovered than artifacts from another century. Rather than suggesting anything about how frequently artifacts from different times are found, the existence of artifacts confirmed as predating the settlement’s founding suggests that those items arrived in Kuulo Kataa during or after its establishment. Choice C is incorrect because the text focuses on time periods and says nothing about which region the founders of Kuulo Kataa have been thought to come from; similarly, the text doesn’t suggest anything about where the thirteenth-century CE artifacts originated other than not from Kuulo Kataa. Therefore, it isn’t logical to conclude that the mere existence of artifacts confirmed as predating the Kuulo Kataa settlement suggests that the founders of the settlement came from a particular region other than one previously assumed. Choice D is incorrect because the existence of artifacts from the thirteenth century CE at a site dated to the fourteenth century CE doesn’t imply that fourteenth-century objects were damaged during excavations. There’s nothing in the text to suggest that any objects were damaged; rather, the existence of artifacts confirmed as predating the settlement’s founding suggests that those items were brought to Kuulo Kataa during or after its establishment."},{"i":"c4d43991","c":"infer","d":"E","s":"Archaeologists have been debating the origin of a rare form of lead found in Shang dynasty (1766–1046 BCE) bronze artifacts since its presence was discovered in China in the 1990s. Different researchers have proposed theories on which regions of the world would have had the raw materials containing the specific lead in these artifacts, but no conclusive evidence has been presented. What is intriguing is that bronze artifacts from China dated after the Shang dynasty do not contain this form of lead, suggesting that ______ Which choice most logically completes the text?","o":["Shang dynasty bronze pieces are rare and therefore more valuable than those from other time periods.","the source of some of the raw materials used to make bronze was exploited only until the end of the Shang dynasty.","bronze was used for a short time during the Shang dynasty before different metals were used to make artifacts.","methods used to analyze bronze artifacts are not useful on pieces that are dated after the Shang dynasty."],"a":1,"r":"Choice B is the best answer. The passage tells us that Shang dynasty bronze artifacts contained \"a rare form of lead,\" but that bronze artifacts after this time did not contain that lead. Although we don’t know where that specific type of bronze came from, we can conclude that that source was not used after the end of the Shang dynasty—otherwise, post-Shang dynasty pieces would also contain that rare form of lead. Choice A is incorrect. Despite these pieces containing \"a rare form of lead,\" there is no direct claim in the passage that Shang dynasty bronze is itself more rare or valuable than bronze pieces from other periods. Therefore, there’s no basis for this inference. Choice C is incorrect. Although the passage mentions that the nature of the bronze in Chinese artifacts changed after the Shang dynasty, bronze was still used to create artifacts after this time. The passage in fact explicitly states \"bronze artifacts from China dated after the Shang dynasty…,\" indicating that bronze was still used in China after the Shang dynasty. Choice D is incorrect. There’s no mention in the passage of methods used to analyze bronze artifacts, so there’s no basis for this inference."},{"i":"25290c8d","c":"claim","d":"M","s":"“On Virtue” is a 1766 poem by Phillis Wheatley. Wheatley addresses the poem directly to the quality of virtue, imploring it to assist her in reaching a future goal: ______ Which quotation from “On Virtue” most effectively illustrates the claim?","o":["“Attend me, Virtue, thro’ my youthful years! / O leave me not to the false joys of time! / But guide my steps to endless life and bliss.”","“I cease to wonder, and no more attempt / Thine height t’explore, or fathom thy profound.”","“O thou bright jewel in my aim I strive / To comprehend thee. Thine own words declare / Wisdom is higher than a fool can reach.”","“But, O my soul, sink not into despair, / Virtue is near thee, and with gentle hand / Would now embrace thee, hovers o’er thine head.”"],"a":0,"r":"Choice A is the best answer because it most effectively illustrates the claim that Wheatley addresses her poem \"On Virtue\" to the quality of virtue, imploring it to assist her in reaching a future goal. In the quotation, Wheatley begs virtue to accompany her, or \"attend [her],\" through her youth and to \"guide [her] steps to\" the future goal of \"endless life and bliss.\" Choice B is incorrect because this quotation suggests the difficulty of fully comprehending virtue. Rather than asking virtue for help, Wheatley presents it as a quality that is impossible to entirely understand because it is so grand and deep. Choice C is incorrect because this quotation describes Wheatley’s effort to comprehend virtue despite virtue itself declaring that such wisdom is beyond her grasp, or \"higher than a fool can reach.\" Choice D is incorrect because rather than asking virtue for help in this quotation, Wheatley urges herself to \"sink not into despair\" because virtue is always nearby."},{"i":"0d7f4966","c":"claim","d":"H","s":"Jean-Bernard Caron and colleagues recently discovered a cache of jellyfish fossils in the Burgess Shale, a site in the Canadian Rockies that is rich in fossils from the Cambrian period (over 500 million years ago). Caron and colleagues claim that these are the oldest jellyfish fossils ever discovered. In the past twenty years, two sites in China and the United States have yielded fossils of a similar age that some experts believe are most likely jellyfish due to their shapes and the appearance of projecting tentacles. But Caron and colleagues argue that the apparent tentacles are in fact the comb rows of ctenophores, gelatinous animals that are only distantly related to jellyfish.\n\nWhich statement, if true, would most directly weaken the claim by Caron and colleagues about the fossils found in China and the United States?","o":["Sites in the Canadian Rockies from later periods than the Cambrian period have yielded fossils that have been conclusively identified as ctenophore fossils.","The fossils found in China and the United States are so poorly preserved that though they cannot be conclusively identified as jellyfish, they cannot be conclusively identified as ctenophores either.","While ctenophore fossils have been discovered in China and the United States, they have never been discovered in the Burgess Shale.","The fossils discovered by Caron and colleagues in the Burgess Shale were better preserved than the fossils discovered by other researchers in China and the United States."],"a":1,"r":"Choice B is the best answer because it presents a statement that, if true, would most directly weaken Caron and colleagues’ claim that the apparent tentacles in the Chinese and American fossils are actually ctenophore comb rows. If the fossils are so poorly preserved that they cannot be conclusively identified as either organism, neither the claim that they are jellyfish nor, as Caron claims, that they are ctenophores would be supported. Choice A is incorrect. Caron’s claim is that fossils from the US and China are ctenophores, not jellyfish. These fossils are said to be \"of a similar age\" to the Cambrian fossils found in the Canadian Rockies. And nothing in the text or this choice suggests that the presence or absence of ctenophores after the Cambrian would have any bearing on whether the Cambrian fossils from the US and China are ctenophores. Choice C is incorrect. Caron’s claim is that fossils from the US and China are ctenophores, not jellyfish. Nothing in the text suggests that the presence or absence of ctenophores in the Burgess Shale (in Canada) would affect whether the fossils found in the US and China are ctenophores. Choice D is incorrect. Caron’s claim is that fossils from the US and China are ctenophores, not jellyfish. Although fossil quality is a plausible issue for the research described in the text, nothing in the text or this choice suggests that the fossils from US and China would have been too poorly preserved for proper identification."},{"i":"d5b9ed0d","c":"graph","d":"M","s":"","o":["On average, participants’ ratings of the helpfulness of the review were substantially higher than were participants’ ratings of the reviewed product regardless of which type of review participants had seen.","Compared with participants who saw the control review, participants who saw the low-anger review rated the review as slightly more helpful, whereas participants who saw the high-anger review rated the review as less helpful.","Participants who saw the low-anger review rated the review as slightly more helpful than participants who saw the control review did, but participants’ attitude toward the reviewed product was slightly worse when participants saw the low-anger review than when they saw the no- anger review.","Compared with participants who saw the low-anger review, participants who saw the high-anger review rated the review as less helpful and had a less positive attitude toward the reviewed product."],"a":1,"r":"Choice B is the best answer. The claim is that low anger does not negatively affect readers’ perceptions of the review, while high anger does negatively affect readers’ perceptions of the review. This choice accurately expresses the supporting data from the “helpfulness of review” part of the graph: that low-anger reviews were rated as slightly more helpful than no-anger reviews, while high-anger reviews were rated as less helpful than no-anger reviews. Choice A is incorrect. This choice does not support the conclusion. The conclusion is only about how participants feel about the review itself— the participants’ ratings of the reviewed product are not relevant. Choice C is incorrect. This choice does not support the conclusion. The conclusion is only about how participants feel about the review itself—the participants’ attitude towards the reviewed product is not relevant. Choice D is incorrect. This choice does not support the conclusion. The conclusion is only about how participants feel about the review itself— the participants’ attitude towards the reviewed product is not relevant."},{"i":"a16128e2","c":"graph","d":"H","s":"","o":["national governments of countries in Region 1 experienced declines in efficiency in the period from 2000 to 2014, relative to the period from 1970 to 2000.","countries in Region 1 experienced a slower rate of economic growth in the period from 2000 to 2014 than countries in Region 2 did, despite increasing national government efficiency in Region 1.","national governments of most countries in Region 2 became more efficient in the period from 2000 to 2014 than they had been in the period from 1970 to 2000, but those of several countries in this region did not.","national governments of countries in Region 1 and in Region 2 generally became more efficient in the period from 2000 to 2014 than they had been in the period from 1970 to 2000, but at different rates."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the graph to complete the statement about Mahtta et al.’s proposal regarding factors that affect urban land expansion (ULE). According to the text, ULE is influenced by urban population growth and by gross domestic product (GDP) growth per capita. Reasoning that efficient national governments provide urban services and infrastructure needed to attract economic investment, Mahtta et al. suggest that, as governments become more efficient at providing urban services and infrastructure, GDP growth per capita will account for more ULE and urban population growth will account for less. But according to the graph, Region 1 saw an increase in the percentage attributed to urban population growth from 1970–2000 (between 60 and 65%) to 2000–2014 (between 70 and 75%) and a decrease in the percentage attributed to GDP growth per capita from 1970–2000 (between 35 and 40%) to 2000–2014 (about 25%). Because the percentage attributed to GDP growth per capita decreased (the opposite of what Mahtta et al. claimed would happen if the governments had become more efficient), the data suggest that the governments of Region 1 became less efficient at providing urban services and infrastructure over that period. Choice B is incorrect. Neither the graph nor the text gives the regions’ relative levels of economic growth or what effect Mahtta et al. would expect such growth to have. Furthermore, Mahtta et al.’s proposal suggests that Region 1’s decline in the percentage of ULE attributed to GDP growth per capita from 1970–2000 (between 35 and 40%) to 2000–2014 (about 25%) would suggest decreasing, not increasing, government efficiency over this time. Choice C is incorrect. Neither the text nor the graph provides information about the relative efficiencies of different governments in Region 2. Choice D is incorrect. Mahtta et al.’s proposal suggests that more efficient governments will have a higher percentage of their ULE driven by GDP growth per capita and a lower percentage driven by urban population growth. For Region 2, the percentage of ULE attributed to GDP growth per capita increased from 1970–2000 (between 10 and 15%) to 2000–2014 (between 45 and 50%), but the opposite is true for Region 1, which saw the percentage of ULE attributed to GDP growth per capita decline over the same period. Thus, whereas the data suggest governments in Region 2 became more efficient, the data for Region 1 suggest that those governments became less efficient, not more."},{"i":"2c49940e","c":"fss","d":"M","s":"French philosopher René Descartes doubted whether he could prove his own existence. Eventually, he found proof in his famous phrase “I think, therefore I am.” The ______ complexity: only those who exist would be able to ponder their existence.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["phrases’ simplicity masks its","phrases simplicity masks their","phrase’s simplicity masks their","phrase’s simplicity masks its"],"a":3,"r":"Choice D is the best answer. The conventions being tested are the use of possessive nouns and the use of possessive determiners. The singular possessive noun \"phrase’s\" correctly indicates that there is only one simple phrase. The singular possessive determiner \"its\" agrees in number with the singular possessive noun \"phrase’s,\" reinforcing the idea that there is only one simple yet complex phrase. Choice A is incorrect because the context requires the singular possessive noun \"phrase’s,\" not the plural possessive noun \"phrases’.\" Choice B is incorrect because the context requires the singular possessive noun \"phrase’s\" and the corresponding singular possessive determiner \"its,\" not the plural noun \"phrases\" and the corresponding plural possessive determiner \"their.\" Choice C is incorrect because the context requires the singular possessive determiner \"its,\" not the plural possessive determiner \"their.\""},{"i":"aa443c4b","c":"fss","d":"H","s":"Recent pollen analyses of the Aran Islands have led some researchers to propose that the now treeless islands were once wooded. This hypothesis ______ that certain trees, such as P . sylvestris, survived without interruption or human intervention throughout the Holocene cannot stand, researchers Michael O’Connell and Karen Molloy counter, unless other explanations can first be ruled out.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["suggesting","suggested","suggests","has suggested"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite present participle \"suggesting\" is correctly used to form a restrictive participial phrase (\"suggesting...Holocene\") within the main clause (\"This hypothesis...cannot stand...\"). This participial phrase functions as part of the sentence’s subject (\"This...Holocene\"), providing essential identifying information about what the hypothesis states—namely, that certain trees survived without interruption or human intervention throughout the Holocene. Choice B is incorrect because it results in an ungrammatical sentence. The finite verb \"suggested\" can’t be used in this way within the subject of the sentence. Choice C is incorrect because it results in an ungrammatical sentence. The finite verb \"suggests\" can’t be used in this way within the subject of the sentence. Choice D is incorrect because it results in an ungrammatical sentence. The finite verb \"has suggested\" can’t be used in this way within the subject of the sentence."},{"i":"9f737b2a","c":"fss","d":"M","s":"In Death Valley National Park’s Racetrack Playa, a flat, dry lakebed, are 162 rocks—some weighing less than a pound but others almost 700 pounds—that move periodically from place to place, seemingly of their own volition. Racetrack-like trails in the ______ mysterious migration.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["playas sediment mark the rock’s","playa’s sediment mark the rocks","playa’s sediment mark the rocks’","playas’ sediment mark the rocks’"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of plural and possessive nouns. The singular possessive noun “playa’s” and the plural possessive noun “rocks’” correctly indicate that the sediment is that of one playa (the Racetrack Playa) and that there are multiple rocks that have mysteriously migrated across the sediment. Choice A is incorrect because the context requires the singular possessive noun “playa’s” and the plural possessive noun “rocks’,” not the plural noun “playas” and the singular possessive noun “rock’s.” Choice B is incorrect because the context requires the plural possessive noun “rocks’,” not the plural noun “rocks.” Choice D is incorrect because the context requires the singular possessive noun “playa’s,” not the plural possessive noun “playas’.”"},{"i":"cdbbbf94","c":"bound","d":"M","s":"As British scientist Peter Whibberley has observed, “the Earth is not a very good timekeeper.” Earth’s slightly irregular rotation rate means that measurements of time must be periodically adjusted. Specifically, an extra “leap second” (the 86,401st second of the day) is ______ time based on the planet’s rotation lags a full nine-tenths of a second behind time kept by precise atomic clocks.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["added, whenever","added; whenever","added. Whenever","added whenever"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation between a verb and a preposition. When, as in this case, a verb (“is added”) is immediately followed by a preposition (“whenever”), no punctuation is needed. Choice A is incorrect because no punctuation is needed between the verb and the preposition. Choice B is incorrect because no punctuation is needed between the verb and the preposition. Choice C is incorrect because no punctuation is needed between the verb and the preposition."},{"i":"dddfa043","c":"bound","d":"E","s":"Before the Erie Canal was completed in 1825, transporting goods by wagon between New York City and the Midwest took up to forty-five days and cost one hundred dollars per ton. By linking the Hudson River to Lake ______ canal reduced transport time to nine days and cut costs to six dollars per ton.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Erie; the","Erie (the","Erie, the","Erie: the"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation between a supplementary phrase and a main clause. This choice correctly uses a comma to mark the boundary between the introductory supplementary phrase (“By linking the Hudson River to Lake Erie”), which identifies how the canal reduced transport time, and the main clause (“the canal reduced transport time to nine days and cut costs to six dollars per ton”). Choice A is incorrect because a semicolon can’t be used in this way to mark the boundary between a supplementary phrase (“By…Erie”) and the main clause (“the canal...ton”). Choice B is incorrect because an open parenthesis can’t be used in this way to mark the boundary between a supplementary phrase (“By…Erie”) and the main clause (“the canal...ton”). Choice D is incorrect because a colon can’t be used in this way to mark the boundary between an introductory supplementary phrase (“By…Erie”) and the main clause (“the canal...ton”)."},{"i":"d6dec50e","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In 2019, Emily Shepard and colleagues in the UK and Germany studied the effect of wind on auks’ success in landing at cliffside nesting sites. They found as wind conditions intensified, the birds needed more attempts in order to make a successful landing. When the wind was still, almost 100% of landing attempts were successful. In a strong breeze, approximately 40% of attempts were successful. In near-gale conditions, only around 20% of attempts were successful. The student wants to summarize the study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["For a 2019 study, researchers from the UK and Germany collected data on auks’ attempts to land at cliffside nesting sites in different wind conditions.","Emily Shepard and her colleagues wanted to know the extent to which wind affected auks’ success in landing at cliffside nesting sites, so they conducted a study.","Knowing that auks often need multiple attempts to land at their cliffside nesting sites, Emily Shepard studied the birds’ success rate, which was only around 20% in some conditions.","Emily Shepard’s 2019 study of auks’ success in landing at cliffside nesting sites showed that as wind conditions intensified, the birds’ success rate decreased."],"a":3,"r":"Choice D is the best answer. The sentence effectively summarizes the study, noting who conducted it, when it was conducted, and what its results showed: that auks’ landing success rate decreased as wind conditions intensified. Choice A is incorrect. While the sentence presents the methodology of the study—that is, the approach taken by the researchers—it fails to summarize the study as a whole. Choice B is incorrect. While the sentence presents the aim, or goal, of the study, it fails to summarize the study as a whole. Choice C is incorrect. While the sentence indicates what Shepard studied, it fails to mention a key factor: the effect of wind. It thus fails to summarize the study as a whole."},{"i":"af76771f","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Sue is the nickname of a dinosaur fossil specimen housed at the Field Museum of Natural History. The Field Museum of Natural History is located in Chicago, Illinois. Sue is a member of the genus Tyrannosaurus. Big Mike is the nickname of a dinosaur fossil specimen housed at the Museum of the Rockies. The Museum of the Rockies is located in Bozeman, Montana. Big Mike is a member of the genus Tyrannosaurus. The student wants to emphasize a similarity between the two specimens.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Field Museum of Natural History, where Sue is housed, is located in Chicago, Illinois.","Big Mike is the nickname of a Tyrannosaurus fossil specimen housed at the Museum of the Rockies in Bozeman, Montana.","The dinosaur fossil specimens Sue and Big Mike are both members of the genus Tyrannosaurus.","While Sue is housed at the Field Museum of Natural History, Big Mike is housed at the Museum of the Rockies."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes a similarity between the two specimens, noting that Sue and Big Mike are members of the same genus: Tyrannosaurus. Choice A is incorrect. The sentence only provides information about where one of the specimens (Sue) can be found; it doesn’t emphasize a similarity between the two specimens. Choice B is incorrect. The sentence only provides information about one specimen (Big Mike); it doesn’t emphasize a similarity between the two specimens. Choice D is incorrect. The sentence contrasts the locations of Sue and Big Mike; it doesn’t emphasize a similarity between the two specimens."},{"i":"911c7a87","c":"trans","d":"E","s":"After appropriate permissions are granted, a typical archaeological dig begins with a surveyor making a detailed grid of the excavation site. Then, the site is carefully dug, and any artifacts found are recorded and mapped onto the site grid. ______ the artifacts are removed, cataloged, and analyzed in a laboratory.\n\nWhich choice completes the text with the most logical transition?","o":["For instance,","On the contrary,","Earlier,","Finally,"],"a":3,"r":"Choice D is the best answer. \"Finally\" logically signals that the actions in this sentence—the removal, cataloging, and analysis of artifacts—are the next and final steps in a process, following the previous actions of surveying, digging, recording, and mapping. Choice A is incorrect because \"for instance\" illogically signals that the actions in this sentence are an example of the actions in the previous sentence. Instead, the removal, cataloging, and analysis of artifacts are the next and final steps in a process. Choice B is incorrect because \"on the contrary\" illogically signals that the actions in this sentence are directly opposed to the actions in the previous sentence. Instead, the removal, cataloging, and analysis of artifacts are the next and final steps in a process. Choice C is incorrect because \"earlier\" illogically signals that the actions in this sentence occur before the actions in the previous sentence. Instead, the removal, cataloging, and analysis of artifacts are the next and final steps in a process."},{"i":"30438650","c":"trans","d":"M","s":"Jhumpa Lahiri’s story collection Interpreter of Maladies features multiple stories about romantic relationships. In “This Blessed House,” newlyweds argue over whether to replace items left by the previous owners of their new home. ______ in “A Temporary Matter,” a husband and wife attempt to rekindle their relationship during a four-night blackout.\n\nWhich choice completes the text with the most logical transition?","o":["Granted,","For example,","Likewise,","Hence,"],"a":2,"r":"Choice C is the best answer. \"Likewise\" is a transition that indicates the addition of a new but related idea. In this sentence, the author is providing another similar example to that discussed in the previous sentence. Therefore, \"likewise\" works best in this context. Choice A is incorrect. This choice uses a transition that means \"admittedly.\" But the text isn’t admitting or conceding anything here. Instead, these two examples work together to support the claim made in the first sentence. Choice B is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. The second story is not an example of the story in the previous sentence—it’s another, similar story. And while both stories exemplify the first sentence in the text, the transition we’re looking for isn’t actually connected to that sentence. Choice D is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. The first story didn’t result in the events of the second story."}],"img":{"d5b9ed0d":"iVBORw0KGgoAAAANSUhEUgAAArwAAALABAMAAACDdLzKAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABVmklEQVR42u2dd3wURRvHf7N7d+m5uYTesknodZNQlCJHFWkeTVBBjyJSRAOogIBvUHrRANJFA4p0CEgHIfQOR+/kQqgCubnQQsrt+0cKd5AECAkmZL4fPmT39nZv9rfPPvM8M7OzAIfD4XA4HA6Hw+FwOBwOh8PJzRCAOq5yshNdqroUkACIuqe11gGCDo6XIb0LRQHi6+frJOm4qqkIS5eGpKgoCfMJpS6GFGkJABEAKlJUnrMehNiJTpLFJqkXRqAAoSi06eCiUjLlsqaiWlfjNAAKogmmEgCBUoCmKOcsAegCtA7qp8/IfVAAKCslX6zqp4M8pP/OVnKdvMqdg2uF4WtZ9z5j+jTohr571XLNX+ezipvrl/noLMaME+b+6QLEHP5NVm02Cr+uU3c/J5Oh69Ck8wKUP2RQLQ+OnbsGpPdM+vFewHbo7mHlo720SOVQl82ybuLO/G694mrMFtq21M/92nW17m/n3dXdjcsbzkHZghFV/qgT0qVBpTbVJaAeShg7N1rr2rWx+mGRHc5/twz55Icu+vXecss2692DGwOd22pOVg4FyC54/l05xGeabkOhHa4jWkr53HpR6KPytpUWaplou2yl6r6HwO5sHSidt0nKPwelyEgiHTIDwuC5YV0uX4e8hRy4+aDg8A16y0/L9cTD1MW0VqvbAlw+UmjYqTYAbMDc8zrMYSXcChSYF5vv5RVbtVYNakvdAcBSjUGhCrHJnb6x2pgiKTjTvD8AxVqUeA32jKvYHwzHSjFFZwNYtxmS9+DWmrf7AzoQkxILgEAxQ/E0qwoOjtF/3jq/+15c/5AVcZlEAYWAXAEF0ymI/XIcCAMjSGreFIAy4zRNGDLY1uxtANQKWCgDro8MTuzTMfK9jhSAIhFtsrwUFEy5Oa6zMmS0Kb/L6wX4/FzarAPRAneNjFARDXfGP5AYFGqFLuFPAApGVTsVE0WSflEaom6kUcMUgEr7A3Z6MCFpJCiTYgyaywAUEDNgRZLqstn0SQzL5/KSSJCjh1rSy0iobERcy7MKjfx1bKL7ahNlhF3a7HpgLAAB5/v/fOi408HB5MbhZXFVjgcTCWzYvp9/+ueU88UhDEdmx5XcbUw+pKRYQbWDDu040++gnN9DBwmAvwQd4EUpRF+Csd4UopQc4PqSIJqSOpNASWgoa1b5AV6+0AHU3w/wDyD+FCCBEHyTo2ABoAQg/hR+vjyxeMae16 function card(q,n){const a=ans[q.i];
