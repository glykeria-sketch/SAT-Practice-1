<script>
const D={"t":"SATPractice10","q":[{"i":"b4c6cff6","c":"vocab","d":"M","s":"The following text is adapted from Karel Čapek’s 1920 play R.U.R. (Rossum’s Universal Robots), translated by Paul Selver and Nigel Playfair in 1923. Fabry and Busman are telling Miss Glory why their company manufactures robots. FABRY: One Robot can replace two and a half workmen. The human machine, Miss Glory, was terribly imperfect. It had to be removed sooner or later. BUSMAN: It was too expensive. FABRY: It was not effective. It no longer answers the requirements of modern engineering. Nature has no idea of keeping pace with modern labor.\n\nAs used in the text, what does the word “answers” most nearly mean?","o":["Explains","Rebuts","Defends","Fulfills"],"a":3,"r":"Choice D is the best answer because as used in the text, “answers” most nearly means fulfills. In the text, Fabry and Busman claim that the robots manufactured by their company are more efficient than human workers, which they refer to as “the human machine.” Fabry observes that the human machine “no longer answers the requirements of modern engineering.” That is, human workers are incapable of meeting the rigorous needs of modern, industrialized workplaces. Choice A is incorrect. Although in some contexts “answers” can mean explains, it doesn’t have that meaning in this context because the topic under discussion is human beings’ inability to perform labor efficiently, not their inability to engage in discussion or explanation. Choice B is incorrect. Although in some contexts “answers” can mean rebuts, or proves a claim or argument to be false, it wouldn’t make sense to speak of proving requirements to be false; requirements might or might not be reasonable, but they can’t be verified as truthful or untruthful, as claims or accusations can. Choice C is incorrect. Although in some contexts, “answers” can mean defends against criticism, or justifies, it doesn’t have that meaning in this context because the opinion that Fabry expresses is that human workers can no longer fulfill the requirements of modern workplaces, not that they have ceased to justify those requirements or to defend them against criticism; indeed, there is no suggestion in the text that workers ever defended those requirements."},{"i":"359902ae","c":"vocab","d":"M","s":"The following text is adapted from Nathaniel Hawthorne’s 1837 story “Dr. Heidegger’s Experiment.” The main character, a physician, is experimenting with rehydrating a dried flower. At first [the rose] lay lightly on the surface of the fluid, appearing to imbibe none of its moisture. Soon, however, a singular change began to be visible. The crushed and dried petals stirred and assumed a deepening tinge of crimson, as if the flower were reviving from a deathlike slumber.\n\nAs used in the text, what does the phrase “a singular” most nearly mean?","o":["A lonely","A disagreeable","An acceptable","An extraordinary"],"a":3,"r":"Choice D is the best answer because as used in the text, “singular” most nearly means extraordinary. The text portrays an experiment in which a character rehydrates a dried rose by infusing it with moisture. After prolonged contact with the liquid, the rose begins to absorb it, undergoing an exceptional transformation: its color deepens, its previously “crushed and dried” petals shift, and the entire flower revives “from a deathlike slumber.” In other words, an extraordinary change is visible in the flower. Choice A is incorrect. Although in some contexts “singular” can mean of or relating to an individual or to a single instance of something, this usage doesn’t imply loneliness or an otherwise unsatisfactory condition of isolation. Moreover, the text doesn’t attribute such a condition to the rose. Choice B is incorrect. Although “singular” has several related meanings, none of them relate to being disagreeable or unpleasant. Moreover, the text doesn’t portray the change undergone by the rose as necessarily disagreeable. Choice C is incorrect because “singular” means extraordinary, not acceptable. The change is portrayed as striking, not barely satisfactory."},{"i":"79fe7550","c":"vocab","d":"H","s":"Researcher Haesung Jung led a 2020 study showing that individual acts of kindness can ______ prosocial behavior across a larger group. Jung and her team found that bystanders who witness a helpful act become more likely to offer help to someone else, and in doing so, can inspire still others to act.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["require","remember","foster","discourage"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Jung and her team’s study of acts of kindness. In this context, “foster” means encourage or promote the development of. The text indicates that Jung and her team found that seeing a helpful (or prosocial) act makes a bystander more likely to help someone else, which can in turn inspire additional people to help others. That is, the team showed that single acts of kindness can foster additional prosocial acts across a group. Choice A is incorrect because nothing in the text suggests that Jung and her team found that single acts of kindness “require,” or depend on or make obligatory, broader prosocial (or helpful) behavior across a group. There’s no suggestion in the text that individual acts of kindness can only occur if other prosocial acts have already occurred, and the text indicates only that an act of kindness can inspire additional helpful acts, not that it necessarily will do so. Choice B is incorrect because the text focuses on a possible direct effect of individual acts of kindness, or single helpful actions, and it wouldn’t make sense to suggest that actions can “remember,” or hold a memory of, something. Choice D is incorrect because the text doesn’t indicate that Jung and her team found that single acts of kindness can “discourage,” or hinder, prosocial (or helpful) behavior across a group. On the contrary, the text states that Jung and her team found that seeing a helpful act makes a bystander more likely to help someone else, which can in turn inspire even more people to help others."},{"i":"1455b754","c":"vocab","d":"H","s":"While recent scholarship has undermined claims that the works of twelfth-century Islamic philosopher Ibn Rushd were ______ other Muslim philosophers of his time, it is indisputable that his location in the Muslim-ruled area of what is now Spain meant that his works were primarily available thousands of miles west of the era’s center of Islamic thought.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["controversial among","antagonistic toward","imitated by","inconsequential to"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the twelfth-century Islamic philosopher Ibn Rushd. As used in this context, \"inconsequential to\" means not significant to. According to the text, Ibn Rushd’s works were primarily available in Spain, where he lived, far from central areas of the Muslim world, a fact that could support the conclusion that his influence on Muslim contemporaries was limited. The text implies, however, that recent scholarship has shown that his works still had an impact on other Muslim philosophers of his time. This context supports the idea that his works weren’t inconsequential to Islamic thought in this period. Choice A is incorrect because the issue under consideration in the text is whether other Muslim philosophers of Ibn Rushd’s time had access to his works, not whether his works were \"controversial among,\" or causing dispute among, other philosophers. Choice B is incorrect. The text implies that other Muslim philosophers of Ibn Rushd’s era were aware of his works, not that they were \"antagonistic toward,\" or hostile toward, them. There is no suggestion that Ibn Rushd’s writings elicited hostility from his contemporaries. Choice C is incorrect because in this context, \"imitated by\" would mean followed as a model by. Although the text implies that Ibn Rushd’s works were at least somewhat available in regions that were at the center of Islamic thought during the period, it doesn’t specifically address in what ways his works influenced contemporary Muslim philosophers. Thus, the text doesn’t support the idea that other philosophers modeled their own works after Ibn Rushd’s works."},{"i":"d9e55268","c":"purpose","d":"M","s":"The following text is adapted from Louise Erdrich’s 2020 novel The Night Watchman. Louis Pipestone is collecting signatures for a petition from fellow members of the Turtle Mountain Band of Chippewa on the tribe’s reservation in North Dakota. Louis Pipestone tended the petition like a garden. He kept it with him at all times. In town, his eyes sharpened when he noticed a tribal member who hadn’t yet signed. Wherever they were—at the gas pump, mercantile [general store], at Henry’s [Café], on the road, or outside the clinic and hospital—Louis cornered them. If they were waiting for a baby to be born, he’d have them sign. If they were laughing, if they were arguing. If they were taking a child home from school, they signed. ©2020 by Louise Erdrich Which choice best states the main purpose of the text?","o":["To suggest that some tribal members refuse to sign the petition because they dislike Louis Pipestone","To show that attitudes toward the petition within the tribal community change over time","To demonstrate that most tribal members are enthusiastic about signing the petition","To portray Louis Pipestone’s strong commitment to collecting signatures for the petition"],"a":3,"r":"Choice D is the best answer because it most accurately states the text’s main purpose. The text indicates that Louis always had his petition with him, asked everyone he encountered to sign it if they hadn’t already, and lists several comical circumstances in which he might try to get someone to sign. Thus, the main purpose of the text is to illustrate Louis’s dedicated focus on getting people to sign the petition. Choice A is incorrect. Although the text suggests that Louis was aggressive in seeking signatures for the petition—for example, saying that he \"cornered\" people—nothing in the text addresses how those people feel toward Louis, let alone that they are refusing his request. Choice B is incorrect because, other than portraying Louis’s commitment to gathering signatures, the text doesn’t discuss community members’ attitudes toward Louis or the petition. Choice C is incorrect because the text never mentions the attitudes of the people Louis approaches toward the petition, but the text does indicate that he \"cornered\" prospective signatories, strongly suggesting that their enthusiasm was neither needed nor considered."},{"i":"e5da61f1","c":"purpose","d":"E","s":"The following text is adapted from Charles Chesnutt’s 1899 short story “Mars Jeems’s Nightmare.”The narrator and his wife have recently moved to the southern United States, and Julius is their carriage driver. Julius [was] very useful when we moved to our new residence. He had a thorough knowledge of the neighborhood, was familiar with the roads and the watercourses, knew the qualities of the various soils and what they would produce, and where the best hunting and fishing were to be had. He was a marvelous hand in the management of horses and dogs.\n\nWhich choice best states the main purpose of the text?","o":["To compare the narrator’s reaction to a new home with his wife’s reaction","To give an example of Julius’s knowledge about soil","To show that the narrator and Julius often hunt and fish together","To explain different ways in which Julius was helpful"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain different ways in which Julius was helpful. The text begins with the narrator stating that Julius was very helpful to him and his wife when they moved to their new residence. The narrator then provides a list of examples to illustrate Julius’s helpfulness. For instance, the narrator states that Julius was familiar with the neighborhood’s roads, which suggests that he was helpful in navigating them, and that Julius helped manage the horses and dogs. The text’s many examples of Julius’s usefulness reinforce just how helpful he was and in how many different ways. Choice A is incorrect because the text doesn’t portray either the narrator’s or his wife’s reaction to their new home. Rather, the text focuses on how Julius was useful to the narrator and his wife in their new home. Choice B is incorrect. Although the text states that Julius was knowledgeable about the soil, this is one of several supporting details that illustrate how helpful Julius was. Moreover, the text merely states that Julius was knowledgeable about soil; it doesn’t provide an example of that knowledge. Choice C is incorrect because there’s nothing in the text to suggest the frequency with which the narrator and Julius hunted and fished together. In fact, it’s unclear from the text whether the narrator and Julius hunted and fished together at all. The text merely indicates that Julius knew the best places to hunt and fish—a detail that supports the text’s main purpose by conveying Julius’s usefulness."},{"i":"066a3295","c":"func","d":"E","s":"Researchers have found a nearly 164,000-year-old molar from a member of the archaic human species known as Denisovans in a cave in Laos, suggesting that Denisovans lived in a wider range of environments than indicated by earlier evidence. <u>Before the discovery, Denisovans were thought to have lived only at high altitudes in relatively cold climates in what are now Russia and China,<\/u> but the discovery of the tooth in Laos suggests that they may have lived at low altitudes in relatively warm climates in Southeast Asia as well.\n\nWhich choice best states the function of the underlined portion in the text as a whole?","o":["It dismisses as untrue the research presented in the previous sentence.","It defines a term used in the description that follows in the rest of the sentence.","It emphasizes the main goal of the research introduced in the previous sentence.","It provides context that clarifies the significance of the information that follows in the rest of the sentence."],"a":3,"r":"Choice D is the best answer. The text describes how a new discovery expands our understanding of Denisovans. The underlined portion describes what we used to believe about Denisovans, which helps the reader understand the significance of the discovery of the molar: it suggests that they lived in more places than we’d previously thought. Choice A is incorrect. The underlined portion doesn’t do this. Instead, it explains what we used to believe about Denisovans before the discovery —it doesn’t dismiss the new discovery as false. Choice B is incorrect. The underlined portion doesn’t do this. No term is defined here. Choice C is incorrect. The underlined portion doesn’t do this. The text never tells us what the “goal” of the research was, just what its discovery was."},{"i":"3e6ad72d","c":"func","d":"H","s":"A study by a team including finance professor Madhu Veeraraghavan suggests that exposure to sunshine during the workday can lead to overly optimistic behavior. <u>Using data spanning from 1994 to 2010 for a set of US companies, the team compared over 29,000 annual earnings forecasts to the actual earnings later reported by those companies.<\/u> The team found that the greater the exposure to sunshine at work in the two weeks before a manager submitted an earnings forecast, the more the manager’s forecast exceeded what the company actually earned that year.\n\nWhich choice best states the function of the underlined sentence in the overall structure of the text?","o":["To summarize the results of the team’s analysis","To present a specific example that illustrates the study’s findings","To explain part of the methodology used in the team’s study","To call out a challenge the team faced in conducting its analysis"],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The first sentence presents the implications of Veeraraghavan’s team’s study: sunshine exposure during work hours can cause overly optimistic behavior. The underlined sentence then describes the data the team consulted and how they were used (comparing predictions about earnings to what the companies actually earned), and the final sentence presents what the team found in their examination of the data. Thus, the underlined sentence mainly functions to explain part of the methodology used in the team’s study. Choice A is incorrect because the underlined sentence explains in part how the team conducted their analysis of the effect of sunshine but doesn’t address what the team found; a broad summary is instead given in the other two sentences. Choice B is incorrect because the underlined sentence doesn’t present any specific examples from the team’s comparisons of 29,000 earnings predictions to actual earnings; it simply explains in part how the team conducted their analysis. Choice D is incorrect because the underlined sentence simply explains in part how the team conducted their analysis; the text never mentions any challenges that the team encountered in their study."},{"i":"5e732e67","c":"structure","d":"E","s":"Many films from the early 1900s have been lost. These losses include several films by the first wave of Black women filmmakers. We know about these lost movies only from small pieces of evidence. For example, an advertisement for Jennie Louise Touissant Welcome’s documentary Doing Their Bit still exists. There’s a reference in a magazine to Tressie Souders’s film A Woman’s Error. And Maria P . Williams’s The Flames of Wrath is mentioned in a letter and a newspaper article, and one image from the movie was discovered in the 1990s.\n\nWhich choice best describes the overall structure of the text?","o":["The text identifies a complex problem, then presents examples of unsuccessful attempts to solve that problem.","The text summarizes a debate among researchers, then gives reasons for supporting one side in that debate.","The text describes a general situation, then illustrates that situation with specific examples.","The text discusses several notable individuals, then explains commonly overlooked differences between those individuals."],"a":2,"r":"Choice C is the best answer. The first three sentences describe the general situation: these early films have been lost, and we only know about them from small pieces of evidence. The rest of the text offers specific examples of the small pieces of evidence. Choice A is incorrect. This isn’t the overall structure. The fact that we only know about these lost early films from small pieces of evidence isn’t presented as a “complex problem”—that’s too extreme. And the examples presented are not “unsuccessful attempts” to solve it. If anything, the examples represent a success, because we discovered that these films existed in the first place. Choice B is incorrect. This isn’t the overall structure. There’s no “debate” presented in the text, so there’s no “side” for the text to support. Choice D is incorrect. This isn’t the overall structure. The text doesn’t discuss any “differences” between the filmmakers."},{"i":"84dbd633","c":"cross","d":"H","s":"Text 1 The Cretaceous-Paleogene (K-Pg) mass extinction event is usually attributed solely to an asteroid impact near Chicxulub, Mexico. Some scientists argue that <u>volcanic activity was the true cause, as the K-Pg event occurred relatively early in a long period of eruption of the Deccan Traps range that initially produced huge amounts of climate-altering gases.<\/u> These dissenters note that other mass extinctions have coincided with large volcanic eruptions, while only the K-Pg event lines up with an asteroid strike.\n\nText 2 In a 2020 study, Pincelli Hull and her colleagues analyzed ocean core samples and modeled climate changes around the K-Pg event. The team concluded that Deccan Traps gases did affect global conditions prior to the event, but that the climate returned to normal well before the extinctions began—extinctions that instead closely align with the Chicxulub impact.\n\nBased on the texts, how would Hull’s team (Text 2) most likely respond to the argument in the underlined portion of\n\nText 1?","o":["By agreeing that the Chicxulub impact changed the climate and that the Deccan Traps eruption caused the K-Pg event","By declaring that the changes in climate caused by the Deccan Traps eruption weren’t the main cause of the K-Pg event","By questioning why those scientists assume that the Chicxulub impact caused the Deccan Traps eruption","By asserting that the Deccan Traps eruption had a more significant effect on global conditions than those scientists claim"],"a":1,"r":"Choice B is the best answer because it describes how Hull’s team would most likely respond to the argument in the underlined portion of Text 1, which asserts that volcanic activity in the Deccan Traps range led to changes in the climate and caused the K-Pg mass extinction event. According to Text 2, although Hull’s team found that activity in the Deccan Traps did indeed alter the climate before the K-Pg event, the team determined that the climate had returned to normal before mass extinctions began. This finding and the observation that the K-Pg extinctions closely align with the Chicxulub asteroid impact suggest that Hull’s team would likely dispute the claim in the underlined portion of Text 1 and say that the climate changes caused by the Deccan Traps activity were not the main cause of the extinctions. Choice A is incorrect because Text 2 describes how Hull’s team found that the climate had recovered from the changes brought about by the Deccan Traps activity before the K-Pg event occurred, which suggests that Hull’s team would disagree that the Deccan Traps activity caused the K-Pg event. Additionally, the claim in the underlined portion of Text 1 says nothing about how the Chicxulub impact changed the climate, so while Hull’s team might believe that the impact did in fact change the climate, they could not be said to agree with the claim in Text 1 on this point. Choice C is incorrect because there is no indication in either text that any scientists assume that the Chicxulub impact caused the Deccan Traps activity, so there is no reason to conclude that Hull’s team would question why the scientists referred to in Text 1 make such an assumption. Choice D is incorrect because Text 2 describes how Hull’s team found that the climate had recovered from the changes brought about by the Deccan Traps activity before the K-Pg event occurred, which suggests that Hull’s team would say that the Deccan Traps activity had a less enduring effect on global conditions than the scientists referenced in Text 1 believe, not that the effect on global conditions was more significant than those scientists claim."},{"i":"f7bd14de","c":"main","d":"H","s":"Several scholars have argued that conditions in England in the late ninth through early eleventh centuries—namely, burgeoning literacy amid running conflicts between England’s Anglo-Saxon kingdoms and Danish invaders—were especially conducive to the production of the Old English epic poem Beowulf, and they have dated the poem’s composition accordingly. It is not inconceivable that Beowulf emerged from such a context, but privileging contextual fit over the linguistic evidence of an eighth- or even seventh-century composition requires a level of justification that thus far has not been presented.\n\nWhich choice best states the main idea of the text?","o":["Although there are some grounds for believing that Beowulf was composed between the late ninth and early eleventh centuries, advocates for that view tend to rely on evidence that has been called into question by advocates for an earlier date.","Although several scholars have dated Beowulf to the late ninth through early eleventh centuries, others have argued that doing so privileges a controversial interpretation of the social conditions of the period.","Although Beowulf fits well with the historical context of England in the late ninth through early eleventh centuries, it fits equally well with the historical context of England in the seventh and eighth centuries.","Although the claim of a late ninth- through early eleventh-century composition date for Beowulf has some plausibility, advocates for the claim have not compellingly addressed evidence suggesting an earlier date."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text states that some scholars have dated the composition of Beowulf to the late ninth through early eleventh centuries due to the poem’s fit with that period’s historical context. The text goes on to say that while it is “not inconceivable that Beowulf emerged from such a context”—that is, it is possible that Beowulf was composed during the late ninth through eleventh centuries—there is linguistic evidence that the poem was composed earlier, in the seventh or eighth century. According to the text, favoring the historical context over the linguistic evidence requires justification that scholars have not yet supplied. In other words, the text suggests that scholars who favor the later composition date need to explain why the poem’s fit with historical context should take precedence over the linguistic evidence, but they have not yet done so. Thus, the main idea of the text is that while there is some plausibility to the later composition date, advocates for the later date have not compellingly addressed evidence suggestive of an earlier date. Choice A is incorrect because the text says that scholars who date the poem to the late ninth through early eleventh centuries have failed to account for the linguistic evidence that the poem may have been composed earlier, not that the evidence those scholars cite in favor of their view is unreliable or that anyone has cast doubt on that evidence. In other words, the text does not suggest that there are problems with the evidence cited by advocates of the later composition date, only that there is other evidence of an earlier composition date that those advocates need to consider. Choice B is incorrect because nothing in the text suggests that those scholars who date the poem to the late ninth through early eleventh centuries are giving priority to a controversial view of the social conditions at that time. The text makes no reference to any controversy about how scholars interpret that historical period. Instead, the text suggests that scholars who date the poem on the basis of its fit with the historical context of England in the late ninth through early eleventh centuries have failed to account for linguistic evidence that the poem may have been composed earlier. Choice C is incorrect because the text says nothing about how well the poem fits the historical context of England in the seventh and eighth centuries, let alone that it fits that historical context as well as it fits the historical context of the late ninth through early eleventh centuries. Rather, the text says that there is linguistic evidence that the poem may have been composed in the seventh or eighth century."},{"i":"b168ce48","c":"main","d":"E","s":"The average age at which people in the United States start businesses is 35. Economist Andrés Hincapié studied why young adults are relatively less likely to start businesses and whether there are ways to increase entrepreneurship in early adulthood. Hincapié found that one impediment is lack of knowledge about the practical details of how businesses are started; he further found that simply providing young adults with good informational resources on the topic significantly alleviates this problem.\n\nBased on the text, what would Hincapié most likely say is a promising way to increase entrepreneurship in early adulthood?","o":["Creating social networks of young adults who are interested in starting a business","Encouraging young adults to brainstorm business ideas","Providing young adults with practical information about how to start a business","Giving young adults training opportunities at a variety of businesses"],"a":2,"r":"Choice C is the best answer because it presents a conclusion about increasing entrepreneurship in early adulthood that can be reasonably inferred from the text. The text explains that Andrés Hincapié investigated why young adults are less likely than older adults to start businesses and found that lack of knowledge of practical aspects of starting a business is a barrier. The text then states that Hincapié found that providing relevant informational resources greatly helps address that problem. Offering young adults practical information about how to start a business would be an example of providing relevant informational resources, so Hincapié would most likely say it is a promising way to increase early adult entrepreneurship. Choice A is incorrect because creating social networks of young adults interested (but presumably inexperienced) in starting a business wouldn’t involve a clear source of practical information for those young adults, and the text indicates that Hincapié identified offering relevant informational resources about starting a business as a way to significantly reduce the problem of young adults’ low participation in entrepreneurship. Choice B is incorrect because encouraging young people to brainstorm business ideas wouldn’t involve a clear source of practical information for those young adults, and the text indicates that Hincapié identified offering relevant informational resources about starting a business as a way to significantly reduce the problem of young adults’ low participation in entrepreneurship. Choice D is incorrect because providing young adults with training opportunities at existing businesses would give those young people exposure to businesses that already exist but not necessarily information about how to start a business, and the text indicates that Hincapié identified offering relevant informational resources about starting a business as a way to significantly reduce the problem of young adults’ low participation in entrepreneurship."},{"i":"ac285054","c":"infer","d":"H","s":"The domestic sweet potato (Ipomoea batatas) descends from a wild plant native to South America. It also populates the Polynesian Islands, where evidence confirms that Native Hawaiians and other Indigenous peoples were cultivating the plant centuries before seafaring first occurred over the thousands of miles of ocean separating them from South America. To explain how the sweet potato was first introduced in Polynesia, botanist Pablo Muñoz-Rodríguez and colleagues analyzed the DNA of numerous varieties of the plant, concluding that Polynesian varieties diverged from South American ones over 100,000 years ago. Given that Polynesia was peopled only in the last three thousand years, the team concluded that ______ Which choice most logically completes the text?","o":["the cultivation of the sweet potato in Polynesia likely predates its cultivation in South America.","Polynesian peoples likely acquired the sweet potato from South American peoples only within the last three thousand years.","human activity likely played no role in the introduction of the sweet potato in Polynesia.","Polynesian sweet potato varieties likely descend from a single South American variety that was domesticated, not wild."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the sweet potato in Polynesia. The text indicates that the sweet potato is found in Polynesia but originated in South America, and that the sweet potato was being cultivated by Native Hawaiians and other Indigenous peoples in Polynesia long before sea voyages between South America and Polynesia began. The text goes on to note that research by Muñoz-Rodríguez and colleagues has established that the Polynesian varieties of sweet potato split from South American varieties more than 100,000 years ago, which is thousands of years before humans settled in Polynesia. If Polynesian peoples were cultivating the sweet potato before sea voyages between Polynesia and South America began, and if Polynesian varieties of sweet potato diverged from South American varieties well before people were in Polynesia, it can reasonably be concluded that humans didn’t play a role in bringing the sweet potato to Polynesia. Choice A is incorrect. The text doesn’t provide any information about when the sweet potato began to be cultivated in South America, so there’s no support for the conclusion that cultivation began in Polynesia before it began in South America. Choice B is incorrect because the text indicates that the sweet potato was being cultivated in Polynesia long before sea journeys between Polynesia and South America began. Therefore, it wouldn’t be reasonable to conclude that Polynesian peoples acquired the sweet potato from South American peoples. Additionally, the text indicates that the Polynesian varieties of sweet potato diverged from the South American varieties thousands of years before people settled in Polynesia, which suggests that the sweet potato was already present in Polynesia when people arrived. Choice D is incorrect because the text states that the domestic sweet potato, which is found in Polynesia, descends from a wild South American plant, not from a domesticated South American plant. The only people that the text describes as cultivating the sweet potato are Native Hawaiians and other Indigenous peoples of Polynesia."},{"i":"d95a0bb8","c":"infer","d":"H","s":"The ratio of methane to other atmospheric constituents—represented by a measure called the methane mole fraction—influences a variety of meteorological phenomena, notably precipitation and humidity. For Titan, Saturn’s largest moon, the observational data that exist are too sparse and discrepant to fully constrain the range of the methane mole fraction at various atmospheric levels. Juan Lora and colleagues point out that outputs of the IPSL atmospheric model of Titan, which track closely to observations in some respects, reflect how the model’s developers responded to this challenge: by prescribing a uniform methane mole fraction for the lowest level of the atmosphere. It is therefore important to note that ______ Which choice most logically completes the text?","o":["some disagreements between the model’s simulations of Titan’s precipitation and humidity and the moon’s actual precipitation and humidity are to be expected.","further observations of Titan may clarify the moon’s methane mole fraction sufficiently for the model to employ a single value rather than a range.","even though the model’s outputs sometimes agree with observational data, Titan’s real methane mole fraction is likely higher than the methane mole fraction used in the model.","inconsistencies across the model’s simulations of Titan’s precipitation and humidity could be attributable to variations in the moon’s methane mole fraction."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of modeling the atmosphere of Titan. The text establishes that the methane mole fraction (the ratio of methane to other atmospheric components) influences precipitation, humidity, and other meteorological phenomena and that observational data for Titan are too lacking (“too sparse and discrepant”) to fully determine the range of this measure across the moon’s various atmospheric levels. The text indicates that because of this limitation, researchers developed an atmospheric model (IPSL) that uses a simplified approach: it applies a uniform methane mole fraction for the lowest atmospheric level. Since it is very unlikely that the actual methane distribution across atmospheric levels on Titan is uniform, and since the methane mole fraction directly affects precipitation and humidity, it logically follows that the model’s simplified treatment of the methane mole fraction would lead to some disagreements between the model’s simulations and Titan’s actual precipitation and humidity. Choice B is incorrect because the text makes it clear that the model already uses a single value for Titan’s methane mole fraction instead of a range. Further, the text suggests that the single value is a simplification of what is likely a more complex reality, so there’s no reason to assume that a single value would be more desirable than a range. Choice C is incorrect. The text strongly suggests that Titan’s actual methane mole fraction differs from the uniform value used in the model, even though some of the model’s outputs align closely with observations, but nothing in the text indicates how the actual value would differ. There’s no reason to assume that the actual methane mole fraction is higher than what the model uses. The “lowest level” mentioned in the text refers to the atmosphere and not Titan’s methane mole fraction. Choice D is incorrect because the text makes it clear that the model doesn’t reflect the actual variations in the methane mole fraction across Titan’s atmospheric levels, since observational data are too limited. Because the model uniformly applies a set methane mole fraction, no inconsistencies in the simulations would be attributable to actual variations in the moon’s methane mole fraction."},{"i":"dc47c2ac","c":"claim","d":"M","s":"Although most songbirds build open, cupped nests, some species build domed nests with roofs that provide much more protection. <u>Many ecologists have assumed that domed nests would provide protection from weather conditions and thus would allow species that build them to have larger geographic ranges than species that build open nests do.<\/u> To evaluate this assumption, a research team led by evolutionary biologist Iliana Medina analyzed data for over 3,000 species of songbirds.\n\nWhich finding from Medina and her colleagues’ study, if true, would most directly challenge the assumption in the underlined sentence?","o":["Species that build open nests tend to have higher extinction rates than species that build domed nests.","Species that build open nests tend to be smaller in size than species that build domed nests.","Species that build open nests tend to use fewer materials to build their nests than species that build domed nests do.","Species that build open nests tend to have larger ranges than species that build domed nests."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would challenge the assumption that many ecologists have made about the connection between the building of domed nests and geographic range in songbirds. The text says that many ecologists have assumed that since domed nests provide protection from weather conditions, songbird species that build such nests should be able to have larger geographic ranges than songbird species that build open nests do. If Medina and her colleagues found that species that build open nests tend to have larger geographic ranges than species that build domed nests do, their finding would show the opposite of what the ecologists have assumed. It would therefore challenge the ecologists’ assumption. Choice A is incorrect because nothing in the text suggests that there’s a relationship between songbird species’ extinction rates and their geographic ranges. The finding that species that build open nests tend to have higher extinction rates than species that build domed nests do would therefore have no clear bearing on the ecologists’ assumption that domed nests allow species that build them to have larger geographic ranges than those of species that build open nests. Choice B is incorrect because nothing in the text suggests that there’s a relationship between songbird species’ sizes and their geographic ranges. The finding that species that build open nests tend to be smaller in size than species that build domed nests are would therefore have no clear bearing on the ecologists’ assumption that domed nests allow species that build them to have larger geographic ranges than those of species that build open nests. Choice C is incorrect because although the text indicates that many ecologists have assumed that there’s a connection between how songbird species build their nests and the species’ geographic ranges, the text says that this assumption is based on the shape of the nests—that is, whether the nests are domed or open—not the number of materials used. The finding that species that build open nests tend to use fewer materials to build their nests than species that build domed nests do would therefore have no clear bearing on the ecologists’ assumption that domed nests allow species that build them to have larger geographic ranges than those of species that build open nests."},{"i":"c83e0b43","c":"claim","d":"H","s":"O Pioneers! is a 1913 novel by Willa Cather. In the novel, Cather depicts Alexandra Bergson as a person who takes comfort in understanding the world around her: ______ Which quotation from O Pioneers! most effectively illustrates the claim?","o":["“She looked fixedly up the bleak street as if she were gathering her strength to face something, as if she were trying with all her might to grasp a situation which, no matter how painful, must be met and dealt with somehow.“","“She had never known before how much the country meant to her. The chirping of the insects down in the long grass had been like the sweetest music. She had felt as if her heart were hiding down there, somewhere, with the quail and the plover and all the little wild things that crooned or buzzed in the sun. Under the long shaggy ridges, she felt the future stirring.“","“Alexandra drove off alone. The rattle of her wagon was lost in the howling of the wind, but her lantern, held firmly between her feet, made a moving point of light along the highway, going deeper and deeper into the dark country.”","“Alexandra drew her shawl closer about her and stood leaning against the frame of the mill, looking at the stars which glittered so keenly through the frosty autumn air. She always loved to watch them, to think of their vastness and distance, and of their ordered march. It fortified her to reflect upon the great operations of nature, and when she thought of the law that lay behind them, she felt a sense of personal security.”"],"a":3,"r":"Choice D is the best answer because it most effectively uses a quotation from O Pioneers! to illustrate the claim that Alexandra Bergson takes comfort in understanding the world around her. In the quotation, Alexandra is described as enjoying looking at the stars and feeling a “sense of personal security” when she contemplates nature’s order and its governing laws. This suggests that Alexandra takes comfort in understanding the world around her. Choice A is incorrect because the quotation expresses how Alexandra Bergson attempts to meet difficult situations with determination, not how she takes comfort in understanding the world around her. Choice B is incorrect because the quotation expresses “how much the country meant to” Alexandra Bergson, not how she takes comfort in understanding the world around her. In detailing some of the wildlife surrounding Alexandra, the quotation conveys that nature is important to her but not necessarily that it gives her comfort. Choice C is incorrect because the quotation describes Alexandra driving her wagon down a highway at night; it doesn’t describe how she takes comfort in understanding the world around her or address how she’s feeling as she drives off."},{"i":"a04807d8","c":"graph","d":"E","s":"","o":["2016.","2018.","2019.","2017."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to complete the statement about the year when both museums had the highest number of visits. The table shows the number of visits (in millions) from 2016 to 2019 to two museums: the National Museum of the American Indian and the National Museum of African American History and Culture. It indicates that the highest number of visits to the National Museum of the American Indian was 1.2 million in 2017 and that the highest number of visits to the National Museum of African American History and Culture was 2.4 million, also in 2017. Choice A is incorrect because the table shows that in 2016, the National Museum of the American Indian had 1.1 million visits and that the National Museum of African American History and Culture had 0.73 million visits, both of which are lower than the number of visits these museums had in 2017. Choice B is incorrect because the table shows that in 2018, the National Museum of the American Indian had 1.1 million visits and that the National Museum of African American History and Culture had 1.9 million visits, both of which are lower than the number of visits these museums had in 2017. Choice C is incorrect because the table shows that in 2019, the National Museum of the American Indian had 0.96 million visits and that the National Museum of African American History and Culture had 2.0 million visits, both of which are lower than the number of visits these museums had in 2017."},{"i":"94978129","c":"graph","d":"M","s":"","o":["Among the five languages in the table, Thai and Hungarian have the lowest rates of speech and the lowest rates of information conveyed.","Vietnamese conveys information at approximately the same rate as Spanish despite being spoken at a slower rate.","Among the five languages in the table, the language that is spoken the fastest is also the language that conveys information the fastest.","Serbian and Spanish are spoken at approximately the same rate, but Serbian conveys information faster than Spanish does."],"a":1,"r":"Choice B is the best answer because it provides the most direct support from the table for the claim that two languages can convey similar amounts of information even if they’re spoken at different rates. The table shows the approximate rates at which five languages are spoken and the rates at which those five languages convey information. Vietnamese is spoken at around 5.3 syllables per second, whereas Spanish is spoken at around 7.7 syllables per second, but the two languages convey information at very similar rates: Vietnamese at a rate of around 42.5 bits per second and Spanish at a rate of around 42.0 bits per second. Thus, the description of Vietnamese conveying information at around the same rate that Spanish does despite being spoken more slowly supports the claim in the text that languages can convey the same amount of information even if spoken at different rates. Choice A is incorrect because it isn’t true that Thai and Hungarian have the lowest rates of speech of the five languages shown. According to the table, Hungarian is spoken at around 5.9 syllables per second, which is faster than Vietnamese (5.3 syllables per second). Additionally, even if this statement were true, the assertion that two languages are spoken the slowest and convey information the slowest wouldn’t support the claim that languages can convey the same amount of information even if they’re spoken at different rates. Choice C is incorrect because it isn’t true that the fastest-spoken language (Spanish, at 7.7 syllables per second) also conveys information the fastest: Spanish conveys information at 42.0 bits per second, which is slower than the 42.5 bits-per-second rate at which Vietnamese conveys information. Additionally, even if this statement were true, the assertion that the language spoken the fastest also conveys information the fastest has no bearing on the claim that languages can convey the same amount of information even if they’re spoken at different rates. Choice D is incorrect because it isn’t true that Serbian conveys information faster than Spanish does. According to the table, Serbian conveys information at a rate of around 39.1 bits per second, which is slower than the 42.0 bits-per-second rate at which Spanish conveys information."},{"i":"74253458","c":"fss","d":"E","s":"Cycads are palmlike plants with cones. ______ plants were abundant throughout the Mesozoic Era (66 to 252 million years ago).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["These","That","Each","This"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of determiners. The plural demonstrative determiner “these” agrees in number with the plural noun “plants” that it modifies. This choice clearly indicates that the plants, referring to cycads from the previous sentence, were abundant throughout the Mesozoic Era. Choice B is incorrect because the singular demonstrative determiner “that” doesn’t agree in number with the plural noun “plants.” Choice C is incorrect because the singular determiner “each” doesn’t agree in number with the plural noun “plants.” Choice D is incorrect because the singular demonstrative determiner “this” doesn’t agree in number with the plural noun “plants.”"},{"i":"1448f43f","c":"fss","d":"E","s":"Unsupervised machine learning is an approach that computer scientists like Nina Miolane use to engineer artificial intelligence technologies. It involves training computer algorithms to organize unlabeled data sets. Multitask learning is another approach. ______ involves training computer models to perform multiple tasks at the same time.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Those","They","It","Some"],"a":2,"r":"Choice C is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"multitask learning\" and clearly indicates what multitask learning involves. Choice A is incorrect because the plural demonstrative pronoun \"those\" doesn’t agree in number with the singular antecedent \"multitask learning.\" Choice B is incorrect because the plural pronoun \"they\" doesn’t agree in number with the singular antecedent \"multitask learning.\" Choice D is incorrect because the indefinite pronoun \"some\" is ambiguous in this context; the resulting sentence leaves unclear what exactly \"involves training computer models.\""},{"i":"e6f2dba6","c":"fss","d":"E","s":"According to the traditional RYB (red-yellow-blue) color model, yellow is a complementary color to purple. However, yellow ______ considered complementary to blue in modern color theory.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is","having been","to be","being"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, \"yellow\"), and this choice supplies the present tense verb \"is considered\" to indicate that yellow is considered a complementary color to blue in modern color theory. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having been considered\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to be considered\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"being considered\" doesn’t supply the main clause with a finite verb."},{"i":"1b97cce9","c":"bound","d":"H","s":"Hegra is an archaeological site in present-day Saudi Arabia and was the second largest city of the Nabataean Kingdom (fourth century BCE to first century CE). Archaeologist Laila Nehmé recently traveled to Hegra to study its ancient ______ into the rocky outcrops of a vast desert, these burial chambers seem to blend seamlessly with nature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["tombs. Built","tombs, built","tombs and built","tombs built"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period after “tombs” is used correctly to mark the boundary between one sentence (“Archaeologist...tombs”) and another (“Built...nature”). Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice C is incorrect. Without a comma preceding it, the conjunction “and” can’t be used in this way to join the two sentences. Choice D is incorrect because it results in a run-on sentence. The sentences (“Archaeologist...tombs” and “Built...nature”) are fused without punctuation and/or a conjunction."},{"i":"b1e8b87f","c":"bound","d":"E","s":"Winding through the ice atop Norway’s Jotunheim Mountains is the Lendbreen pass, an ancient route that was used by hunters, farmers, traders, and travelers in the Middle Ages before eventually falling into disuse. Recently, archeologists have ______ knives, horseshoes, wool tunics, and thousands of other artifacts from the icy pass.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["unearthed:","unearthed,","unearthed—","unearthed"],"a":3,"r":"Choice D is the best answer. No punctuation should separate the verb \"unearthed\" and its objects (i.e, what was \"unearthed\"): \"knives, horseshoes, wool tunics, and thousands of other artifacts.\" Choice A is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a colon. Choice B is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a comma. Choice C is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a dash."},{"i":"2c7dced2","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Sister Rosetta Tharpe (1915–1973) was a gospel musician. She was known for her passionate vocals and electric guitar performances. In 2018, Tharpe was inducted into the Rock and Roll Hall of Fame for her major impact on the genre. According to songwriter Roxie Moore, “[Tharpe] would sing until you cried and then she would sing until you danced for joy.” According to guitarist Celisse Henderson, “Tharpe is the unquestioned founding mother of rock ’n’ roll.” The student wants to use a quotation to support a claim about Tharpe’s contribution to rock ’n’ roll.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Gospel musician Sister Rosetta Tharpe had a major impact on rock ’n’ roll, and she was known for her passionate electric guitar performances.","Celisse Henderson believes that Sister Rosetta Tharpe had a major impact on the development of rock ’n’ roll.","Sister Rosetta Tharpe had such a major impact on rock ’n’ roll that Celisse Henderson called her “the unquestioned founding mother” of the genre.","A gospel musician, Sister Rosetta Tharpe had the ability to “sing until you cried” and also “until you danced for joy,” according to Roxie Moore."],"a":2,"r":"Choice C is the best answer. The sentence uses the quotation from Henderson to support a claim about Tharpe’s contribution to rock ’n’ roll, noting that the impact Tharpe had on the genre led Henderson to call her \"the unquestioned founding mother of rock ’n’ roll.\" Choice A is incorrect. While the sentence makes the claim that Tharpe had a major impact on rock ’n’ roll, it doesn’t use a quotation to support this claim. Choice B is incorrect. The sentence presents Henderson’s opinion that Tharpe had a major impact on rock ’n’ roll, but it doesn’t use a quotation to support this claim. Choice D is incorrect. While the sentence includes a quotation about audience reactions to Tharpe’s music, the sentence describes Tharpe as a gospel musician; it doesn’t support a claim about her contribution to rock ’n’ roll."},{"i":"ff3865b3","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: A wok is a cooking pan that originated in China during the Han dynasty (206 BCE–220 CE). The wok’s round, wide base helps to cook food evenly. The wok’s high, angled sides help to contain oil splatters. Grace Young is a cook and culinary historian. Her book The Breath of a Wok (2004) traces the history of the wok. The student wants to describe the wok’s shape.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Grace Young’s 2004 book, The Breath of a Wok, traces the history of the cooking pan.","Able to cook food evenly and contain oil splatters, the wok is the subject of Grace Young’s 2004 book.","A wok is a cooking pan with a round, wide base and high, angled sides.","The design of a wok, a type of cooking pan that originated in China during the Han dynasty, helps the pan cook food evenly and contain oil splatters."],"a":2,"r":"Choice C is the best answer. It summarizes the information that describes the wok’s shape from the second and third bullet points. Choice A is incorrect. This choice doesn’t describe the shape of a wok. Choice B is incorrect. This choice doesn’t describe the shape of a wok, just some of its features. Choice D is incorrect. This choice doesn’t describe the shape of a wok, only some of its benefits or functions."},{"i":"6036ad0e","c":"trans","d":"E","s":"In 2014, Nestor Gomez won his first-ever storytelling competition, relating a tale about his life as a Guatemalan immigrant living in Chicago. ______ in 2017, Gomez created the show 80 Minutes Around the World as a platform for others to share stories about their immigration experiences.\n\nWhich choice completes the text with the most logical transition?","o":["Instead,","For example,","Later,","In other words,"],"a":2,"r":"Choice C is the best answer. \"Later\" logically signals that the information in the sentence—that in 2017 Gomez created a platform for others to share stories about their immigration experiences—occurs later in a chronological series of events than the previous information about Gomez winning his first storytelling competition in 2014. Choice A is incorrect because \"instead\" illogically signals that Gomez created a platform for others to share stories about their immigration experiences as an alternative to winning his first storytelling competition. Rather, Gomez created the platform later—in a chronological series of events—than when he won the competition. Choice B is incorrect because \"for example\" illogically signals that the information about Gomez creating a platform for others to share stories exemplifies his winning his first storytelling competition. Rather, Gomez created the platform later —in a chronological series of events—than when he won the competition. Choice D is incorrect because \"in other words\" illogically signals that the information about Gomez creating a platform for others to share stories is merely a paraphrase or restatement of the previous information about Gomez winning his first storytelling competition. Rather, Gomez created the platform later—in a chronological series of events—than when he won the competition."},{"i":"20e4ff59","c":"trans","d":"E","s":"Famous for its four-degree tilt, the leaning Garisenda Tower is a popular attraction in Bologna’s city center. However, measurements taken in 2023 showed that the tower was rotating in a concerning way. ______ city officials closed the area around the tower so experts could explore solutions to stabilize the historical twelfth-century structure.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","As a result,","For example,","In comparison,"],"a":1,"r":"Choice B is the best answer. \"As a result\" logically signals that the action described in this sentence—closing the area around Garisenda Tower to explore stabilization solutions—occurred as a consequence or result of measurements revealing the tower’s concerning rotation. Choice A is incorrect because \"similarly\" illogically signals that the action of closing the tower area is similar to the discovery of concerning rotation described in the previous sentence. Instead, closing the area around the tower to explore solutions occurred as a result of the measurements revealing the rotation. Choice C is incorrect because \"for example\" illogically signals that the action of closing the tower area serves as an example of the tower’s concerning rotation described in the previous sentence. Instead, closing the area around the tower to explore solutions occurred as a result of the measurements revealing the rotation. Choice D is incorrect because \"in comparison\" illogically signals that the action of closing the tower area is being compared to the discovery of concerning rotation described in the previous sentence. Instead, closing the area around the tower to explore solutions occurred as a result of the measurements revealing the rotation."}],"img":{"94978129":"iVBORw0KGgoAAAANSUhEUgAAArwAAAFEBAMAAAA3vfCZAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABKoUlEQVR42u1dd0BT19t+zs0gzJwEXKhwGdaBI4h7Buxyx1r3ilrrqNaorVq1FkfdrXG1ddW4FW0bZ+uOe6JxL4SAWxk3iIORnO8PQAE3Foq/L88/cG/OPeM5733P+77n3HMABxxwwAEHHHDAgaIFRe5
