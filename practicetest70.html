<script>
const D={"t":"Practicetest70","q":[{"i":"3566120b","c":"vocab","d":"H","s":"The following text is adapted from Oscar Wilde’s 1895 play The Importance of Being Earnest. CECIL Y: Have we got to part? ALGERNON: I am afraid so. It’s a very painful parting. CECIL Y: It is always painful to part from people whom one has known for a very brief space of time. The absence of old friends one can endure with equanimity. But even a momentary separation from anyone to whom one has just been introduced is almost unbearable.\n\nAs used in the text, what does the word “endure” most nearly mean?","o":["Regret","Persist","Tolerate","Encourage"],"a":2,"r":"Choice C is the best answer because as used in the text, “endure” most nearly means tolerate. In the text, Cecily and Algernon discuss parting, or saying goodbye. Cecily remarks on the deep pain of saying goodbye to people whom one has only known briefly and then comments on the equanimity, or calm steadiness, one experiences when separated from old friends. The text sets up an ironic contrast: one can easily tolerate, or put up with, the absence of close friends, but even a very short separation from a new acquaintance is unbearable. Choice A is incorrect. Nothing in the text suggests that Cecily associates regret, or a feeling of sorrow, with the absence of old friends. Rather, the text sets up an ironic contrast between the feeling of calm steadiness one feels when separated from old friends and the unbearable pain of being separated from new acquaintances. Choice B is incorrect. Although in some contexts “endure” can mean persist, or proceed stubbornly, it doesn’t have that meaning in this context because what is being endured is the absence of old friends. Whereas one can persist despite the absence of someone else, one can’t persist the absence itself. Choice D is incorrect because the text doesn’t convey that Cecily encourages, or urges, old friends to be absent. Although it may be that Cecily prefers new acquaintances to friends she has known for a long time, the text focuses on her feelings as a result of others’ absences, not on her treatment of others."},{"i":"fa014d2d","c":"vocab","d":"E","s":"The invention in 1958 of the integrated circuit (or microchip) radically altered the semiconductor industry. In fact, some historians argue that it fundamentally ______ the industry by enabling it to take advantage of mass production methods for the first time.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["overwhelmed","bypassed","obstructed","transformed"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the invention of the integrated circuit. As used in this context, \"transformed\" means substantially changed in some way. The text states that the invention radically altered the semiconductor industry, with some historians claiming that it had a fundamental effect on the industry by allowing for mass production for the first time. This context conveys that the invention of the integrated circuit transformed the semiconductor industry. Choice A is incorrect. Although the text indicates that the invention of the integrated circuit significantly affected (\"radically altered\") the semiconductor industry, it doesn’t indicate that the invention \"overwhelmed\" the industry, which in this context would mean that it overcame the industry such that the industry struggled or was defeated. Instead, the text conveys that the invention’s effect was positive, since it allowed the semiconductor industry to begin making use of mass production methods. Choice B is incorrect because it wouldn’t make sense in context to say that the invention of the integrated circuit \"bypassed\" the semiconductor industry, which would mean it intentionally avoided the industry. The text indicates that the invention directly affected the semiconductor industry, since it made it possible for the industry to begin engaging in mass production methods. Choice C is incorrect because the text doesn’t indicate that the invention of the integrated circuit \"obstructed\" the semiconductor industry, which would mean that it blocked or hindered the industry in some way. Instead, the text indicates that the invention’s effect was positive, since it made it possible for the semiconductor industry to begin engaging in mass production methods."},{"i":"83687083","c":"vocab","d":"E","s":"Due to their often strange images, highly experimental syntax, and opaque subject matter, many of John Ashbery’s poems can be quite difficult to ______ and thus are the object of heated debate among scholars.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["delegate","compose","interpret","renounce"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of John Ashbery’s poems. As used in this context, “interpret” would mean decipher the meaning of. The text indicates that Ashbery’s poems have many unusual features, that it’s difficult to tell what exactly the poems’ subject matter is, and that scholars strongly disagree about the poems. This context conveys the idea that it’s difficult to interpret Ashbery’s poems. Choice A is incorrect because “delegate” means to assign someone as a representative of another person or to entrust something to someone else, neither of which would make sense in context. The text is focused only on the difficulty that readers have interpreting Ashbery’s poems due to their many unusual features; it doesn’t suggest anything about the poems being difficult to delegate. Choice B is incorrect because describing Ashbery’s poems as difficult to “compose,” or put together or produce, would make sense only if the text were about Ashbery’s experience of writing the poems. It could be true that it was difficult for Ashbery to compose his poems, but the text doesn’t address this; it instead discusses how readers interpret and engage with the poems. Choice D is incorrect because describing Ashbery’s poems as being difficult to “renounce,” or give up or refuse, wouldn’t make sense in context. The text focuses on the idea that features of Ashbery’s poems are odd or unclear and have caused heated scholarly debate. This context suggests that the poems are difficult to interpret, not that the poems are difficult to renounce."},{"i":"4974b053","c":"vocab","d":"M","s":"Although science fiction was dominated mostly by white male authors when Octavia Butler, a Black woman, began writing, she did not view the genre as ______: Butler broke into the field with the publication of several short stories and her 1976 novel Patternmaster, and she later became the first science fiction writer to win a prestigious MacArthur Fellowship.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["legitimate","impenetrable","compelling","indecipherable"],"a":1,"r":"Choice B is the best answer because it most logically completes the discussion of Octavia Butler’s career. In this context, “impenetrable” means impossible to enter. The text indicates that the field of science fiction was dominated by white males when Butler, a Black woman, started writing, but she published several science fiction short stories and a novel and later won a prestigious award; that is, Butler pursued science fiction writing and had success. This context suggests that Butler didn’t view the genre as impossible to enter. Choice A is incorrect. In this context, “legitimate” would mean genuinely good or valid. Nothing in the text suggests that Butler didn’t think the science fiction genre was good or valid; in fact, it indicates that she pursued and made a successful career of publishing work in that field. Choice C is incorrect. In this context, “compelling” would mean attracting or demanding attention. The text indicates that Butler chose to write science fiction, so it wouldn’t make sense to say that she didn’t see the field as drawing her attention. Choice D is incorrect. To say that Butler didn’t consider science fiction “indecipherable,” or impossible to understand, would suggest that Butler did understand it. However, the text doesn’t address Butler’s ability to interpret works in the genre; rather, it focuses on Butler’s successful pursuit of writing science fiction."},{"i":"0b5ecf0e","c":"purpose","d":"H","s":"During Rome’s republican period, which ended in the first century BCE, libraries were predominantly owned by wealthy individuals who tightly controlled access to their book collections. The first public library became available in Rome in 28 BCE and was soon followed by one commissioned by Emperor Augustus. As modern scholar Fabio Fernandes notes, however, these two traditions aren’t as distinct as they seem, as both the emperor and the private library owners viewed their libraries as extensions of their personal patronage, just on vastly differing scales.\n\nWhich choice best states the main purpose of the text?","o":["To give a brief overview of public access to libraries throughout Rome’s republican period","To contend that early imperial leaders in Rome wielded too much influence over libraries","To assert that private and early public libraries in ancient Rome had an essential similarity","To call into question the notion that private Roman libraries disappeared during the first century BCE"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text. The text describes two types of libraries in first- century BCE Rome—private libraries controlled by wealthy individuals, and the public libraries like that commissioned by Emperor Augustus—and then notes that \"these two traditions aren’t as distinct as they seem.\" It explains that both private-library owners and the emperor saw their libraries as \"extensions of their personal patronage, just on vastly differing scales,\" because the emperor’s patronage extended to the whole citizenry of Rome. Thus, both private and public libraries in ancient Rome were fundamentally tied to relevant principles of patronage. Choice A is incorrect because the text mentions that Rome’s republican period only to say that it \"ended in the first century BCE,\" thus it doesn’t support any conclusions about possible occurrences \"throughout Rome’s republican period.\" Choice B is incorrect. The text neither discusses \"early imperial leaders in Rome,\" nor whether their level of influence was appropriate. Rather it discusses the end of \"Rome’s republican period\" in relation to libraries, who created them, and who got to use them without passing judgment on propriety. Choice D is incorrect. Although the text indicates that Rome’s republican period \"ended in the first century BCE,\" a period that also saw the first public library come into use (28 BCE), nothing in the text suggests that private libraries disappeared at that time."},{"i":"975b0602","c":"purpose","d":"H","s":"A number of Indigenous politicians have been elected to the United States Congress since 2000 as members of the country’s two established political parties. In Canada and several Latin American countries, on the other hand, Indigenous people have formed their own political parties to advance candidates who will advocate for the interests of their communities. This movement has been particularly successful in Ecuador, where Guadalupe Llori, a member of the Indigenous party known as Pachakutik, was elected president of the National Assembly in 2021.\n\nWhich choice best states the main purpose of the text?","o":["To trace the history of an Indigenous political movement and speculate about its future development","To argue that Indigenous politicians in the United States should form their own political party","To highlight two approaches to achieving political representation for Indigenous people","To consider how Indigenous politicians in the United States have influenced Indigenous politicians in Canada and Latin America"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to illustrate two approaches that Indigenous politicians have taken to achieve political representation for their communities. The text begins by explaining that one approach is exemplified by Indigenous politicians in the United States who, in an effort to ensure that the interests of their communities are represented in government, joined preexisting political parties and were subsequently elected to Congress. The text goes on to highlight a second approach adopted by Indigenous leaders in Canada and several Latin American countries: rather than joining established political parties, many Indigenous politicians in these countries have instead formed their own parties to promote candidates for office who support causes that are important to their communities. Choice A is incorrect because the text’s focus is on the contrasting approaches adopted by different Indigenous political movements in different countries; thus, it isn’t accurate to say that the text traces the history of one political movement. Moreover, the text only discusses examples from 2000 to 2021, a relatively short period of time; therefore, it provides very little in the way of discussion of larger historical developments, nor does it make any predictions about how these movements might continue to develop in the future. Choice B is incorrect because the text never urges Indigenous politicians in the US to alter their strategy of striving for representation through the established political parties, nor does it suggest that this strategy is inferior to that of Indigenous politicians in Canada and Latin America, who have formed their own parties. In fact, the text notes that both strategies have resulted in the election of Indigenous politicians to national governments. Choice D is incorrect because the text never suggests that Indigenous politicians in the US have influenced those in Canada and Latin America; instead, it stresses how Indigenous politicians’ approach toward achieving representation in the US government has differed from the approach Indigenous politicians have taken to achieve representation in national governments elsewhere in the Americas."},{"i":"df45f0eb","c":"func","d":"H","s":"<u>Several studies have found negligible electoral consequences for governments that impose fiscal austerity measures, yet some European governments recently suffered electorally due to their austerity programs.<\/u> Evelyne Huebscher and colleagues attribute this incongruity to governments’ tendency—not followed in the recent European cases—to implement austerity programs strategically to avoid electoral costs (e.g., setting spending cuts to take effect only after the next election), which has obscured the inherent political risks of austerity measures in the election data scholars have examined.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It explains a discrepancy between what has been observed in study settings and what has been observed in real-world settings that the text goes on to assert is attributable to the studies not using real-world data.","It identifies a conflict between research findings and recent events that the text goes on to suggest is a consequence of a complicating factor in the data used to generate those findings.","It presents a long-standing divergence in research findings that the text goes on to say is due to different groups of researchers using data that derive from different electoral circumstances.","It describes a recent exception to a general pattern in research findings that the text goes on to explain is a result of researchers underestimating the significance of inconsistencies in the data they’ve analyzed."],"a":1,"r":"Choice B is the best answer because it best describes how the underlined sentence functions in the text as a whole. The underlined sentence explains that contrary to what several studies would suggest, recent European governments suffered electorally after the launch of fiscal austerity programs. The text goes on to indicate that the researchers generated their findings from data that didn’t reveal the true political risk of austerity measures because the data were based on cases in which governments had set austerity programs to take effect after the next election, a practice the European governments that recently suffered electorally didn’t adhere to, thus introducing a complicating factor resulting in a conflict between the research findings and recent events. Choice A is incorrect because the underlined sentence doesn’t indicate that the discrepancy described in the text is between observations made in study settings and observations made in real-world settings. Rather, the underlined sentence indicates that the outcome of recent events is contrary to what would be expected based on the findings of several studies. Additionally, there is nothing in the text to suggest that the studies mentioned did not use real-world data; instead, the text indicates that the data used was generated under potentially different circumstances than the recent events. Choice C is incorrect because the underlined sentence doesn’t present a long-standing divergence in research findings but rather a discrepancy between past research findings and recent events that the text goes on to attribute to researchers’ use of data that didn’t reveal the true political risk of austerity measures. Choice D is incorrect because while the underlined sentence notes that there have been some recent exceptions to a general pattern observed in several research studies, it does not go on to attribute this exception to the researchers underestimating inconsistencies in the data. Rather, the text goes on to attribute this to a circumstance (fiscal austerity measures being implemented before an election rather than after) which adds a complicating factor into the data not accounted for in past studies."},{"i":"0f2933b9","c":"func","d":"H","s":"The following text is from William Shakespeare’s circa 1611 play The Winter’s Tale. Camillo has been away from his home in Sicily and serves in the court of Polixenes, the king of Bohemia. He has asked Polixenes for permission to return to Sicily. POLIXENES: I pray thee, good Camillo, be no more importunate. ’Tis a sickness denying thee anything, a death to grant this. CAMILLO: It is fifteen years since I saw my country. Though I have for the most part been aired abroad, I desire to lay my bones there. Besides, the penitent king, my master, hath sent for me, <u>to whose feeling sorrows I might be some allay—or I o’erween [presume] to think so<\/u>—which is another spur to my departure.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It establishes Camillo’s hope that Polixenes will be comforted knowing that Camillo isn’t departing at his own discretion.","It suggests that Camillo feels compelled to persuade Polixenes that Camillo’s decision to leave the court is justified.","It conveys Camillo’s recognition that one benefit his presence may afford the king of Sicily is merely speculative.","It bolsters the idea that Camillo’s primary motivation to return home is his concern for the king of Sicily’s well-being in his absence."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. In the text, Camillo explains to Polixenes that he wants to return home after his long absence and that Sicily’s king has summoned him. In the underlined portion, Camillo adds that he also wants to return because he might provide comfort to the king’s sorrows (“to whose feeling sorrows I might be some allay”) but then clarifies that his belief about being able to comfort the king is a presumption—that is, something he thinks is true but can’t be certain of. Thus, the underlined portion indicates that Camillo recognizes that one benefit his presence may offer is merely speculative. Choice A is incorrect because the underlined portion conveys Camillo’s hope that he might comfort the king of Sicily, which does suggest a personal choice contributing to Camillo’s decision to leave; the idea that Camillo isn’t choosing to leave is established in a different part of the text, when he says “the penitent king, my master, hath sent for me.” Choice B is incorrect because the underlined portion doesn’t suggest Camillo feels compelled to justify his decision to leave. Rather than expressing a need to persuade Polixenes that his departure is warranted, Camillo’s statement simply reveals his awareness that he assumes rather than knows with certainty that his presence will comfort the king of Sicily. Choice D is incorrect because nothing in the text indicates that Camillo’s primary motivation for returning to Sicily is his concern for the king’s well-being; Camillo mentions first that he wants to return home because he has been away for so long, then adds that the king has summoned him and that he hopes his presence will comfort the king. The underlined portion simply conveys Camillo’s awareness that offering comfort is a hope rather than a certainty; it doesn’t suggest that the king’s well-being is his main concern."},{"i":"6977d22b","c":"cross","d":"H","s":"Text 1 Ecologists have long wondered how thousands of microscopic phytoplankton species can live together near ocean surfaces competing for the same resources. According to <u>conventional wisdom,<\/u> one species should emerge after outcompeting the rest. So why do so many species remain? Ecologists’ many efforts to explain this phenomenon still haven’t uncovered a satisfactory explanation.\n\nText 2 Ecologist Michael Behrenfeld and colleagues have connected phytoplankton’s diversity to their microscopic size. Because these organisms are so tiny, they are spaced relatively far apart from each other in ocean water and, moreover, experience that water as a relatively dense substance. This in turn makes it hard for them to move around and interact with one another. Therefore, says Behrenfeld’s team, direct competition among phytoplankton probably happens much less than previously thought.\n\nBased on the texts, how would Behrenfeld and colleagues (Text 2) most likely respond to the “conventional wisdom” discussed in\n\nText 1?","o":["By arguing that it is based on a misconception about phytoplankton species competing with one another","By asserting that it fails to recognize that routine replenishment of ocean nutrients prevents competition between phytoplankton species","By suggesting that their own findings help clarify how phytoplankton species are able to compete with larger organisms","By recommending that more ecologists focus their research on how competition among phytoplankton species is increased with water density"],"a":0,"r":"Choice A is the best answer because based on Text 2, it represents how Behrenfeld and colleagues would most likely respond to the “conventional wisdom” discussed in Text 1. The conventional wisdom cited holds the opinion that when there is species diversity within a phytoplankton population, “one species should emerge after outcompeting the rest”—that is, after being so successful in competing for resources that the other species vanish from the population. However, Text 2 explains that according to Behrenfeld and colleagues, phytoplankton are so small and spaced so far apart in the water that there is “much less” direct competition for resources within phytoplankton populations than scientists had previously thought. Choice B is incorrect because Text 2 never discusses whether routine replenishment of ocean nutrients affects competition between phytoplankton species. Choice C is incorrect because the interspecies competition discussed in both texts is specifically between phytoplankton species, and neither text considers whether phytoplankton compete for resources with larger nonphytoplankton species. Choice D is incorrect because according to Text 2, Behrenfeld and colleagues argue that water density decreases, not increases, competition between phytoplankton species."},{"i":"69d662af","c":"main","d":"E","s":"The following text is adapted from Ann Petry’s 1946 novel The Street. Lutie lives in an apartment in Harlem, New York. The glow from the sunset was making the street radiant. The street is nice in this light, [Lutie] thought. It was swarming with children who were playing ball and darting back and forth across the sidewalk in complicated games of tag. Girls were skipping double dutch rope, going tirelessly through the exact center of a pair of ropes, jumping first on one foot and then the other. ©1946 by Ann Petry Which choice best describes what is happening in the text?","o":["Lutie is observing the appearance of the street at a particular time of day and the events occurring on it.","Lutie is annoyed by the noise of children playing games on her street.","Lutie is puzzled by the rules of certain children’s games.","Lutie is spending time alone in her apartment because she doesn’t want to interact with her neighbors."],"a":0,"r":"Choice A is the best answer because it most accurately states what is happening in the text. The narrator notes that Lutie thinks the street looks nice in the light of the sunset. The narrator goes on to describe what Lutie can see in the street: children playing ball or tag and girls skipping rope. Thus, what is happening in the text is that Lutie is observing the appearance of the street at a particular time of day and the events occurring on it. Choice B is incorrect. Although Lutie is observing children playing games on her street, the text doesn’t suggest that she is annoyed by the noise of the games. Instead, the text says that Lutie thinks the street looks nice in the light of the sunset. Choice C is incorrect. Although Lutie is observing children playing games on her street, the text doesn’t suggest that she is puzzled by the rules of the games. Choice D is incorrect because there is no evidence in the text that Lutie doesn’t want to interact with her neighbors or that she is in her apartment alone. All the text indicates about Lutie is that she is watching the events on the street and thinks the street looks nice in the light of the sunset."},{"i":"2df56712","c":"main","d":"H","s":"Electronic music pioneer Wendy Carlos is credited with the music for three feature films: A Clockwork Orange (1971), The Shining (1980), and Tron (1982). However, her musical score for A Clockwork Orange is mostly made up of her arrangements of Ludwig van Beethoven’s work. Also, almost all the music that she and Rachel Elkind composed for The Shining was unused by director Stanley Kubrick. It did not appear in the film. Of the three films, Tron is the one in which audiences can hear the most of Carlos’s original compositions.\n\nWhich choice best states the main idea of the text?","o":["Of the three films for which Carlos is credited, Tron features the most original music from her.","The director of The Shining used most of the music that Carlos composed for it.","Beethoven is widely considered to be a more important composer than Carlos.","Carlos is a notable innovator among film composers in the 1970s and 1980s."],"a":0,"r":"Choice A is the best answer because it best states the main idea of the text. The text indicates that Wendy Carlos scored three feature films: A Clockwork Orange, The Shining, and Tron. It also indicates that Carlos’s work on A Clockwork Orange consisted primarily of electronic arrangements of Beethoven compositions and that very little of what she and Rachel Elkind composed for The Shining was used in the film. But the soundtrack for Tron consists largely of music composed by Carlos, so it contains more of her original music than do the soundtracks for the other two films. Thus, the main idea of the text is that of the three films for which Carlos is credited, Tron features the most original music from her. Choice B is incorrect because it directly contradicts the text’s claim that \"very little of what she and Rachel Elkind composed for The Shining was used in the film.\" Choice C is incorrect because the text doesn’t address the perceived quality of different composers, instead, it discusses how much of Carlos’s original work was used in each of the three films she scored. Choice D is incorrect because it doesn’t relate to any of the major themes of the text: the work Wendy Carlos did for three feature films, how much of that work was composed by Carlos, and how much of her original work was ultimately used in the film."},{"i":"5105ca38","c":"infer","d":"M","s":"Several artworks found among the ruins of the ancient Roman city of Pompeii depict a female figure fishing with a cupid nearby. Some scholars have asserted that the figure is the goddess Venus, since she is known to have been linked with cupids in Roman culture, but University of Leicester archaeologist Carla Brain suggests that cupids may have also been associated with fishing generally. The fact that a cupid is shown near the female figure, therefore, ______ Which choice most logically completes the text?","o":["is not conclusive evidence that the figure is Venus.","suggests that Venus was often depicted fishing.","eliminates the possibility that the figure is Venus.","would be difficult to account for if the figure is not Venus."],"a":0,"r":"Choice A is the best answer because it presents the conclusion that most logically completes the text’s discussion about the significance of the cupid found at Pompeii. The text indicates that the cupid is near a statue of a female figure who is fishing, and it goes on to indicate that because Venus is associated with cupids, some scholars believe the female figure to be the goddess Venus. But the text then says that, according to archaeologist Carla Brain, cupids may have also been associated with the activity of fishing, which, if true, would suggest that the mere appearance of a cupid near a female figure engaged in fishing does not indicate with certainty that the figure is Venus (that is, the cupid might be associated with fishing, and the figure might be anyone at all). Choice B is incorrect because the text says nothing about how often Venus was depicted fishing in Roman art: it only implies that in certain instances a female figure may or may not be Venus. Choice C is incorrect because Carla Brain’s proposed explanation for the presence of the cupids makes no reference to the female figure, and so the possibility that the figure in the artworks is in fact Venus cannot be definitively eliminated. Choice D is incorrect because there is nothing in the text to suggest that the only reasonable way to interpret the figure is as Venus."},{"i":"1bf2173e","c":"infer","d":"H","s":"In a three-year study of parasitic infections by Anomotaenia brevis tapeworms in Temnothorax nylanderi ants, entomologist Susanne Foitzik and colleagues found something unexpected: rather than reducing its host’s fitness, as is typical of parasites, A. brevis greatly extends the lifespan of a T . nylanderi worker ant and seems to halt the effects of aging. Furthermore, those infected receive special treatment, ceasing their share of labor to sustain the colony and remaining in the nest as uninfected workers feed, groom, and transport them. By contrast, the researchers observed that uninfected workers in parasitized colonies have shortened lifespans, most likely because the ______ Which choice most logically completes the text?","o":["uninfected workers are at high risk for direct exposure to A. brevis in the course of providing social care to the infected workers in the nest.","need to compensate for reduced contributions within the colony while also caring for infected workers is burdensome to the uninfected workers.","high level of activity maintained by the uninfected workers makes them better able than infected workers to quickly disperse when the nest is attacked by a predator.","average lifespan of T . nylanderi worker ants in colonies without parasitic activity typically falls well below three years, the range covered by the study."],"a":1,"r":"Choice B is the best answer. The text describes a study examining the relationship between a species of parasitic tapeworm, A. brevis, and its host insect, the T . nylanderi ant. According to the text, researchers were surprised to find that the tapeworm extends the life of its ant host, rather than reducing it. The text goes on to state that the infected ants end up doing less work to sustain the colony and that as a result, the uninfected ants take on the infected ants’ share of labor in addition to caring for them in their infected state. The study’s researchers also observed that the uninfected ants have shorter lifespans than expected. If the infected ants, who are doing less work in the colony, have longer lifespans, it can be inferred that the less an ant works, the longer it will live. The opposite of this statement can also be inferred: the more an ant works, the shorter its life. So, since the workload within the colony is being redistributed so that the infected ants work less while the uninfected ants work more (as they take on the neglected duties of the infected ants and also care for those ants), then it can be inferred that the lifespans of the uninfected ants are shortened because the need to compensate for reduced contributions within the colony while also caring for infected workers is burdensome to the uninfected workers. Choice A is incorrect because the text does not indicate how A. brevis is transmitted to the ants or assert that uninfected ants are more likely to be directly exposed to A. brevis while caring for infected ants. Choice C is incorrect because the text makes no mention of the relative abilities of infected and uninfected ants to escape predators: in fact, predators are not mentioned in the text at all. Choice D is incorrect because the text does not supply any information about the average lifespans of the ants in colonies without parasitic activity; the text only indicates factors that lengthen and shorten the lifespans of ants in parasitized colonies."},{"i":"f2b3b53b","c":"claim","d":"M","s":"External shopping cues are a type of marketing that uses obvious messaging—a display featuring a new product, for example, or a “buy one, get one free” offer—to entice consumers to make spontaneous purchases. In a study, data scientist Sam K. Hui and colleagues found that this effect can also be achieved with a less obvious cue: rearranging a store’s layout. The researchers explain that trying to find items in new locations causes shoppers to move through more of the store, exposing them to more products and increasing the likelihood that they’ll buy an item they hadn’t planned on purchasing. Which response from a survey given to shoppers who made a purchase at a retail store best supports the researchers’ explanation?","o":["“I needed to buy some cleaning supplies, but they weren’t in their regular place. While I was looking for them, I saw this interesting notebook and decided to buy it, too.”","“I didn’t buy everything on my shopping list today. I couldn’t find a couple of the items in the store, even though I looked all over for them.”","“The store sent me a coupon for a new brand of soup, so I came here to find out what kinds of soup that brand offers. I decided to buy a few cans because I had the coupon.”","“This store is larger than one that’s closer to where I live, and it carries more products. I came here to buy some things that the other store doesn’t always have.”"],"a":0,"r":"Choice A is the best answer because it best supports the researchers’ explanation of the results of rearranging a store’s layout. According to the text, Sam K. Hui and colleagues found that rearranging a store’s layout can encourage customers to make spontaneous purchases. The text states that the researchers explain that a change in layout causes shoppers to hunt for items’ new locations, which exposes the shoppers to more products and increases the likelihood that they’ll make an unplanned purchase. This quotation from a surveyed shopper indicates that the shopper spontaneously purchased a notebook while looking for cleaning supplies that weren’t in their usual place. The quotation therefore supports the researchers’ explanation that rearranging a store’s layout can lead shoppers to make unanticipated purchases. Choice B is incorrect because it doesn’t support the researchers’ explanation that rearranging a store’s layout can lead shoppers to make unanticipated purchases. Instead of attributing an unplanned purchase to a change in layout, the quotation notes that the shopper searched for but couldn’t find some items, and as a result the shopper purchased less, not more, than what was anticipated. Choice C is incorrect because the quotation attributes what was purchased to coupons that the shopper received, not to a new store layout. Thus, the quotation doesn’t support the researchers’ explanation that rearranging a store’s layout can lead shoppers to make unanticipated purchases. Choice D is incorrect because the quotation attributes what was purchased to the size and stock of the store, not to a new store layout. The shopper simply purchased products that the shopper wanted in a particular store because other stores didn’t carry those products, so the quotation doesn’t support the researchers’ explanation that rearranging a store’s layout can lead shoppers to make spontaneous purchases."},{"i":"c2c61e7d","c":"claim","d":"H","s":"Researchers hypothesized that a decline in the population of dusky sharks near the mid-Atlantic coast of North America led to a decline in the population of eastern oysters in the region. Dusky sharks do not typically consume eastern oysters but do consume cownose rays, which are the main predators of the oysters.\n\nWhich finding, if true, would most directly support the researchers’ hypothesis?","o":["Declines in the regional abundance of dusky sharks’ prey other than cownose rays are associated with regional declines in dusky shark abundance.","Eastern oyster abundance tends to be greater in areas with both dusky sharks and cownose rays than in areas with only dusky sharks.","Consumption of eastern oysters by cownose rays in the region substantially increased before the regional decline in dusky shark abundance began.","Cownose rays have increased in regional abundance as dusky sharks have decreased in regional abundance."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would most directly support the researchers’ hypothesis about the connection between the dusky shark population decline and the eastern oyster population decline. The text indicates that although dusky sharks don’t usually eat eastern oysters, they do consume cownose rays, which are the main predators of eastern oysters. An increase in the abundance of cownose rays in the region in response to a decline in the abundance of dusky sharks would directly support the researchers’ hypothesis: a higher number of cownose rays would consume more eastern oysters, driving down the oyster population. Choice A is incorrect because a finding that there’s an association between a decline in the regional abundance of some of dusky sharks’ prey and the regional abundance of dusky sharks wouldn’t directly support the researchers’ hypothesis that a decline in dusky sharks has led to a decline in eastern oysters in the region. Although such a finding might help explain why shark abundance has declined, it would reveal nothing about whether the shark decline is related to the oyster decline. Choice B is incorrect because a finding that eastern oyster abundance tends to be greater when dusky sharks and cownose rays are present than when only dusky sharks are present wouldn’t support the researchers’ hypothesis that a decline in dusky sharks has led to a decline in eastern oysters in the region. The text indicates that the sharks prey on the rays, which are the main predators of the oysters; if oyster abundance is found to be greater when rays are present than when rays are absent, that would suggest that rays aren’t keeping oyster abundance down, and thus that a decline in rays’ predators, which would be expected to lead to an increase in the abundance of rays, wouldn’t bring about a decline in oyster abundance as the researchers hypothesize. Choice C is incorrect because a finding that consumption of eastern oysters by cownose rays increased substantially before dusky sharks declined in regional abundance wouldn’t support the researchers’ hypothesis that the decline in dusky sharks has led to a decline in eastern oysters in the region. Such a finding would suggest that some factor other than shark abundance led to an increase in rays’ consumption of oysters and thus to a decrease in oyster abundance, thereby weakening the researchers’ hypothesis."},{"i":"ccb1ab92","c":"graph","d":"H","s":"","o":["didn’t show significantly less REM sleep during the second day after returning to land than they did during the first day.","showed no significant differences from one another in baseline levels of REM sleep.","didn’t consistently demonstrate a significant increase in REM sleep after their period of deprivation in the water.","showed no significant difference between REM sleep after returning to land and REM sleep while in the water."],"a":2,"r":"Choice C is the best answer. If REM sleep were homeostatically regulated in fur seals, then all the seals would compensate with REM levels significantly over baseline after going weeks without REM. We’d also expect the seals to maintain those elevated REM levels for some time. Since seals B and C return very quickly to baseline REM levels, this suggests that REM sleep in fur seals may not be regulated homeostatically. Choice A is incorrect. This doesn’t support the conclusion. If REM sleep were homeostatically regulated in fur seals, then we’d suspect the seals to sustain REM levels well above baseline for a prolonged period in order to compensate for weeks of REM deprivation while in the water. Whether or not there’s a reduction in REM sleep from day 1 to day 2 doesn’t tell us how REM sleep on those days relates to baseline, which is where our focus should be. Choice B is incorrect. The y-axis of this graph doesn’t depict baseline levels of REM sleep, but rather shows REM sleep as a percent of baseline. Choice D is incorrect. The graph doesn’t depict REM sleep while in the water for the seals in the study. Additionally, we’re told fur seals get no REM sleep while in the water, which is significantly different to the values shown in the graph for after they return to land."},{"i":"702eb7e3","c":"graph","d":"H","s":"","o":["aligned closely with uncertainty about tax and public spending policy in 2005 but differed from uncertainty about tax and public spending policy by a large amount in 2009.","was substantially lower than uncertainty about tax and public spending policy each year from 2005 to 2010.","reached its highest level between 2005 and 2010 in the same year that uncertainty about trade policy and tax and public spending policy reached their lowest levels.","was substantially lower than uncertainty about trade policy in 2005 and substantially higher than uncertainty about trade policy in 2010."],"a":3,"r":"Choice D is the best answer because it uses data from the graph to effectively illustrate the text’s claim about general economic policy uncertainty in the United Kingdom. The graph presents values for economic policy uncertainty in tax and public spending policy, trade policy, and general economic policy in the UK from 2005 to 2010. The graph shows that in 2005, the value for general economic policy uncertainty (approximately 90) was substantially lower than the value for uncertainty about trade policy specifically (approximately 160). It also shows that in 2010, the value for general economic policy uncertainty (approximately 120) was substantially higher than the value for uncertainty about trade policy (approximately 70). The substantial differences between these values in 2005 and 2010 support the claim that a general measure may not fully reflect uncertainty about specific areas of policy. Choice A is incorrect because the graph shows that the level of general economic policy uncertainty was similar to the level of uncertainty about tax and public spending policy in both 2005 (with values of approximately 90 and 100, respectively) and 2009 (with values of approximately 80 and 75, respectively). Choice B is incorrect because the graph shows that general economic policy uncertainty was higher than uncertainty about tax and public spending policy in 2006, 2007, and 2009, not that it was lower each year from 2005 to 2010. Choice C is incorrect because the graph shows that general economic policy uncertainty reached its highest level in 2010, which was when uncertainty about tax and public spending policy also reached its highest level, not its lowest level."},{"i":"e6f2dba6","c":"fss","d":"E","s":"According to the traditional RYB (red-yellow-blue) color model, yellow is a complementary color to purple. However, yellow ______ considered complementary to blue in modern color theory.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is","having been","to be","being"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, \"yellow\"), and this choice supplies the present tense verb \"is considered\" to indicate that yellow is considered a complementary color to blue in modern color theory. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having been considered\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to be considered\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"being considered\" doesn’t supply the main clause with a finite verb."},{"i":"d47bb0a4","c":"fss","d":"E","s":"Objects ranging from the Kikkoman soy sauce bottle to the Yamaha VMAX motorcycle to the Komachi bullet train ______ designed by twentieth- century industrial designer Kenji Ekuan.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["was","is","has been","were"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The plural verb \"were\" agrees in number with the plural subject \"objects.\" Choice A is incorrect because the singular verb \"was\" doesn’t agree in number with the plural subject \"objects.\" Choice B is incorrect because the singular verb \"is\" doesn’t agree in number with the plural subject \"objects.\" Choice C is incorrect because the singular verb \"has been\" doesn’t agree in number with the plural subject \"objects.\""},{"i":"c9a677e9","c":"fss","d":"H","s":"In his 2011 book, historian Sebouh David Aslanian quantifies the reading patterns of early modern Armenian merchants from New Julfa. Aslanian’s macroanalysis ______ nearly 1,000 book titles published between 1512 and 1800 shows not only the steady popularity of religious texts but also a broadening interest in secular books, especially those on history and geography.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["examined","examines","had examined","examining"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms within a sentence. The sentence’s subject is “Aslanian’s macroanalysis,” and its finite main verb is “shows.” This choice correctly uses the nonfinite present participle “examining” to form an integrated participial phrase (“examining...1800”) that describes the macroanalysis, indicating what it examined. Choice A is incorrect because using the finite verb “examined” creates an ungrammatical sentence. The sentence already has the finite main verb “shows,” so “examined” can’t also function as a second main verb here without additional punctuation or conjunctions. Choice B is incorrect because using the finite verb “examines” creates an ungrammatical sentence. The sentence already has the finite main verb “shows,” so “examines” can’t also function as a second main verb here without additional punctuation or conjunctions. Choice C is incorrect because using the finite verb “had examined” creates an ungrammatical sentence. The sentence already has the finite main verb “shows,” so “had examined” can’t also function as a second main verb here without additional punctuation or conjunctions."},{"i":"78b88c04","c":"bound","d":"H","s":"Joshua Hinson, director of the language revitalization program of the Chickasaw Nation in Oklahoma, helped produce the world’s first Indigenous-language instructional app, Chickasaw ______ Chickasaw TV , in 2010; and a Rosetta Stone language course in Chickasaw, in 2015.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Basic; in 2009, an online television network;","Basic; in 2009, an online television network,","Basic, in 2009; an online television network,","Basic, in 2009, an online television network,"],"a":2,"r":"Choice C is the best answer. The convention being tested is the punctuation of items in a complex series. It’s conventional to use a semicolon to separate items in a complex series with internal punctuation, and in this choice, the semicolon after “2009” is conventionally used to separate the first item (“the world’s…2009”) and the second item (“an online…2010”) in the series of things that Hinson helped create. Further, the comma after “Basic” correctly pairs with the comma after “app,” and the comma after “network” correctly pairs with the comma after “TV” to set off the supplemental elements (“Chickasaw Basic” and “Chickasaw TV”) that provide the names of the app and the TV network, respectively. Altogether, the punctuation in this choice results in a sentence that clearly indicates that Hinson helped make a language app in 2009, an online TV network in 2010, and a language course in 2015. Choice A is incorrect because it fails to punctuate the complex series in a way that makes clear that Hinson helped make a language app in 2009, an online TV network in 2010, and a language course in 2015. Choice B is incorrect because it fails to punctuate the complex series in a way that makes clear that Hinson helped make a language app in 2009, an online TV network in 2010, and a language course in 2015. Choice D is incorrect because the comma after “2009” doesn’t match the semicolon used to separate the second and third items in the complex series."},{"i":"3fee46f2","c":"bound","d":"H","s":"Sociologist Todd Gitlin co-opted the term “recombinant,” normally used in reference to genetic engineering, to describe serialized television shows of the 1980s. Gitlin’s use of the term referenced TV studios’ practice of repackaging successful narrative formulas as new ______ even shows that varied only slightly from other shows still attracted sizeable audiences.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["content, in that era","content; in that era,","content in that era,","content, in that era,"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. This choice uses a semicolon in a conventional way to join the first main clause (\"Gitlin’s…content\") and the second main clause beginning with a supplementary phrase (\"in… audiences\"). Further, placing a comma after \"era\" separates the supplementary phrase \"in that era\" from the rest of the main clause that follows (\"even…audiences\"). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Further, this choice fails to mark the boundary between the supplementary phrase \"in that era\" and the rest of the main clause that follows (\"even…audiences\"). Choice C is incorrect because it results in a run-on sentence. The two main clauses (\"Gitlin’s…content\" and \"in… audiences\") are fused without punctuation and/or a conjunction. Choice D is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."},{"i":"25adba4e","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: In 1897, twenty Black US Army infantrymen rode bicycles from Montana to Missouri. The 1,900-mile journey took forty-one days. The goal was to test the idea of forming a military bicycle corps. In 2022, Erick Cedeño, a Black long-distance cyclist, reenacted the journey. Cedeño wanted to honor the infantrymen on the journey’s 125th anniversary. The student wants to emphasize how far the infantrymen traveled.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The US infantrymen rode their bicycles from Montana to Missouri—traveling a total of 1,900 miles.","The 125th anniversary of the infantrymen’s journey was in 2022.","The goal of the 1897 journey was to test the idea of forming a military bicycle corps.","Over a century later, Erick Cedeño honored the infantrymen by reenacting their 1897 journey."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes how far the infantrymen traveled, indicating that they rode their bicycles from Montana to Missouri, a total of 1,900 miles. Choice B is incorrect because the sentence mentions when the anniversary of the journey occurred; it doesn’t emphasize how far the infantrymen traveled. Choice C is incorrect because the sentence discusses the goal of the journey; it doesn’t emphasize how far the infantrymen traveled. Choice D is incorrect because the sentence notes that Cedeño honored the infantrymen by reenacting their journey; it doesn’t emphasize how far the infantrymen traveled."},{"i":"d436a2b2","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: Komodo dragons are the largest lizards in the world. They live on four islands in Komodo National Park, Indonesia. The park has a total of twenty-nine islands. The student wants to emphasize how many islands in Komodo National Park have Komodo dragons living on them.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Komodo dragons, the world’s largest lizards, live on islands in Komodo National Park, Indonesia.","The largest lizards in the world are found in Komodo National Park.","Only four of the twenty-nine islands in Komodo National Park have Komodo dragons living on them.","There are twenty-nine islands in Indonesia’s Komodo National Park."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes the number of islands in Komodo National Park that have Komodo dragons living on them, noting that four of the park’s twenty-nine islands have Komodo dragons. Choice A is incorrect. While the sentence does explain that Komodo dragons live on the islands of Komodo National Park, it doesn’t emphasize how many of those islands Komodo dragons live on. Choice B is incorrect. The sentence explains that Komodo National Park contains the world’s largest lizards; it doesn’t identify these lizards as Komodo dragons or emphasize how many of the park’s islands the lizards live on. Choice D is incorrect. The sentence specifies the total number of islands in Komodo National Park; it doesn’t emphasize how many of those islands have Komodo dragons."},{"i":"34a5ba1c","c":"trans","d":"E","s":"By 1936, Spanish Romani dancer Carmen Amaya was known all over Spain for her powerful style of flamenco dancing. However, in July of that year, the outbreak of the Spanish Civil War made it difficult for her to perform in her home country. ______ Amaya left Spain to perform abroad, dancing for audiences across North and South America.\n\nWhich choice completes the text with the most logical transition?","o":["In comparison,","As a result,","First of all,","For example,"],"a":1,"r":"Choice B is the best answer. “As a result” logically signals that the information in this sentence about Amaya leaving Spain to perform abroad is a result of the previous information about the Spanish Civil War. Choice A is incorrect because “in comparison” illogically signals that the information in this sentence is being compared to the previous information about the Spanish Civil War. Instead, Amaya leaving Spain is a result of that war. Choice C is incorrect because “first of all” illogically signals that the information in this sentence is the beginning of a sequence of events. Instead, Amaya leaving Spain is a result of the event (the outbreak of war) described in the previous sentence. Choice D is incorrect because “for example” illogically signals that the information in this sentence is an example supporting the previous statement about the Spanish Civil War. Instead, Amaya leaving Spain is a result of that war."},{"i":"1c36e3e1","c":"trans","d":"E","s":"The number of dark spots that appear on the Sun, known as sunspots, can vary greatly. For example, there were about 180 sunspots in November 2001. ______ there were only about 2 sunspots in December 2008.\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","Similarly,","Therefore,","By comparison,"],"a":3,"r":"Choice D is the best answer. The first sentence claims that the number of sunspots can vary greatly. To support this claim, the next two sentences compare two examples: one time when there were 180 sunspots and one time when there were only 2 sunspots. So the transition “by comparison” fits perfectly. Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea, which doesn’t make sense here. This sentence doesn’t restate the first example—it describes a totally different example. Choice B is incorrect. This choice uses a transition that indicates the addition of a similar idea, which doesn’t make sense here. This sentence describes a second example that is very different from the first example. Choice C is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. The first example didn’t result in the second example."},{"i":"47e238be","c":"trans","d":"H","s":"Seismologists Kaiqing Yuan and Barbara Romanowicz have proposed that the magma fueling Iceland’s more than 30 active volcano systems emerges from deep within Earth. The great depths involved—nearly 3,000 km—mark Iceland’s volcanoes as extreme outliers; ______ many of Earth’s volcanoes are fed by shallow pockets of magma found less than 15 km below the surface.\n\nWhich choice completes the text with the most logical transition?","o":["indeed,","nevertheless,","in addition,","consequently,"],"a":0,"r":"Choice A is the best answer. The second part of the sentence says that many volcanoes use shallow pockets of magma. This is an elaboration of the same underlying idea from the first part of the sentence, which says that the super deep magma of Icelandic volcanoes’ makes them outliers. “Indeed” is a transition used for elaborating on the same idea, so it fits the context perfectly. Choice B is incorrect. This choice uses a disagreement transition. But these two parts of the sentence agree with each other, so “nevertheless” doesn’t make sense. Choice C is incorrect. This choice uses a transition that indicates the addition of a new idea. But the second part of the sentence isn’t adding a new idea: it’s elaborating on the same idea expressed in the first part of the sentence. Choice D is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. The fact that Iceland’s deep-magma volcanoes are outliers doesn’t cause many other volcanoes to get fed by shallow pockets of magma."}],"img":{"ccb1ab92":"iVBORw0KGgoAAAANSUhEUgAAArwAAAJKBAMAAAA8X4t0AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABWJUlEQVR42u1dd3wTNxt+dLazE8sh7JFLwp4mYY/isDdmU6AlUDYdYZRNCZSy24Y9S0NZZRQCZU+zNziUPYIDhVJGLIed2Nb3h51FJoXwJeGe348g63Q63XPvvXrfVzoJkCBBggQJEiRIkCBBggQJEiRIkCBBQk4GyUQOQNPJIxKJKSj09Uwgh/jHk1QSICpA8M0DCkAEQQB1EFOvQpX0R5BEaVI471qrjud3yZJguzB+Brjs2kUL715L1lI4bQZq7l7lGpy6lPZNKsExH6bZ8hxCr3ByswEAZSAOpbVFKQMYYASE3VdDlk0zIp9aX8EHmNDfJ0HgefJEAAgHs2cZPlCzcwi9/NzZF0GY9bzTX1w4+0T/dMMEjNlBKYCze9TWfefIWQ37REcQF7mPM/kfIWh+hTfpvgqg5Xd75222kwIAd9g7S/btTQ2+PAyJ3mTdkqgS1GgnD2lFYjurUHNeaXJlmBYAqGBAfX+U8xPK+XBcaQtCm84rrRjVIdgp3wk1TOs/2/J8yeAwAIDHsJLk+5orHPp3Ukr0JuvaukyhFJzsNnBLxx20temIdzhEBqDznyFk/QI8eiqYAYwZo+GsouGS/Lw5yOOnX7TU6eS/d7HhmggYgcd3LtCrjw7LNjz4QM3OKboXZw4yBhM3ADjyQ2gRJd02XA4KgBc2VPBjAtmm0AUBr2ufr4q23p6+pYbqOSxq5qLHXRi4rafLH+JnYuCeOqtJkt5kunfvejC7MUC2qR+PnPqg0EyYACyeLCqpCohoGG4C8HobcHbAt8bjU4IAYgCnVMkZYQAndNhaHQf1YRRKItGbBCZQq8bBGwAEpcJwhJ+XbXRgHgDoxiAjNUL15JcYDogoBtyzRj3R3BafqhXh1KyNqU0oRIByVlQXCMqM1iDHBLNCotdmrzLzk8N6DgqHs5dDlp6+Ert0JkwAxcv2T/feUBpiX3MBZNzZB6BLz16Ou3lLoxx0Rsfi9p7+ScnAgBe3Lm89dYsaqOqV+aBRciXedHzziJRQgORRE/j5wFcEAQggEk8fUIgA4OMPAvj6QPChA2QiAMEHBBABwcdH8LE5FoJIJUozG3sgaeSPsTtpNBMxiiyCLLfEdVKB2028AmD7I+F9w1OiQIIECRIkSJAg4YN6y6mPW6a0jSVH7Z1cC0IzZlIaJE6f0gLXoQKhyb3dUp16vcGcLMzG5Uh
