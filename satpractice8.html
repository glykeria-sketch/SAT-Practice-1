<script>
const D={"t":"SATPractice8","q":[{"i":"5e57efec","c":"vocab","d":"H","s":"Economist Marco Castillo and colleagues showed that nuisance costs—the time and effort people must spend to make donations—reduce charitable giving. Charities can mitigate this effect by compensating donors for nuisance costs, but those costs, though variable, are largely ______ donation size, so charities that compensate donors will likely favor attracting a few large donors over many small donors.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["supplemental to","predictive of","independent of","subsumed in"],"a":2,"r":"Choice C is the best answer. We’re told that charities that pay donors back for nuisance costs will attract a few large donors instead of many small donors. This suggests that nuisance costs are not linked to donation size. Choice A is incorrect. This doesn’t fit the logic of the text. If nuisance costs are supplemental to (meaning in addition to) donation size, that wouldn’t result in charities that compensate donors for those costs attracting a few large donors over many small donors. Choice B is incorrect. This doesn’t fit the logic of the text. If nuisance costs can predict donation size, that wouldn’t necessarily result in charities that compensate donors for those costs attracting a few large donors over many small donors. Choice D is incorrect. This doesn’t fit the logic of the text. If nuisance costs are subsumed in (meaning included in) donation size, that wouldn’t result in charities that compensate donors for those costs attracting a few large donors over many small donors."},{"i":"6e3fdd1a","c":"vocab","d":"E","s":"During film’s early years, those who worked in the industry had a vested interest in convincing the public to embrace the new medium. As Sumiko Higashi argues, some filmmakers relied on film critics to influence the public’s ______ the world of cinema. Critics who drew similarities between film and traditional art forms, like drama, could help legitimize film as an art form.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["reproduction of","contribution to","application to","perception of"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the early years of film. In this context, “perception of” means understanding of or view of. The text states that people in the film industry had a personal stake (“a vested interest”) in getting the public to embrace film when the medium was new and indicates that some film critics helped legitimize film as an art form—that is, that they helped to make film something people accepted as a type of art. This context conveys that it was the critics’ ability to influence the public’s view of the world of cinema that some early filmmakers relied on. Choice A is incorrect because in this context, “reproduction of” would refer to a copy of something or the act of copying something, and it wouldn’t make sense to describe the general public as reproducing the world of cinema, or copying film as an entire art form. Choice B is incorrect. In this context, “contribution to” would refer to playing a significant part in causing something to happen. Although the text indicates that people in the early film industry had reasons to want the public to embrace film, it wouldn’t make sense to suggest that filmmakers relied on film critics to influence how the public contributed to the world of cinema; the text focuses on the public’s view of film once the world of cinema existed (embracing it, regarding it as legitimate art) and doesn’t suggest the general public was responsible for the medium’s existence. Choice C is incorrect because in this context, “application to” would refer to putting something to direct use, and it wouldn’t make sense to say that the general public needed to be used in a practical way in the world of cinema. The text focuses on the importance of the public’s view of film when the medium was new but not on the idea that the public needed to be directly involved in film."},{"i":"3d658a5a","c":"vocab","d":"H","s":"Some foraging models predict that the distance bees travel when foraging will decline as floral density increases, but biologists Shalene Jha and Claire Kremen showed that bees’ behavior is inconsistent with this prediction if flowers in dense patches are ______: bees will forage beyond patches of low species richness to acquire multiple resource types.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["depleted","homogeneous","immature","dispersed"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Jha and Kremen’s finding about bees’ foraging behavior. In this context, “homogeneous” means uniform or of the same kind. The text indicates that some models predict that the distance that bees travel when they’re foraging declines as the density of flowers increases. The text goes on to say, however, that Jha and Kremen identified a circumstance in which bees don’t behave this way. Specifically, if bees encounter “patches of low species richness”—that is, patches in which the flowers are largely from the same species—they’ll travel beyond those patches to get varied food resources. This context thus suggests that bees don’t behave as some models predict if the dense patches of flowers the bees encounter are homogeneous. Choice A is incorrect because the text indicates that Jha and Kremen found that bees will behave differently than some models predict if the bees encounter flower patches that are not rich in species, not if the flowers are “depleted,” or emptied or reduced in quality or quantity. Although it could be true that bees are likely to leave depleted patches in search of more resources, the text doesn’t indicate that Jha and Kremen investigated that possibility. Choice C is incorrect because there’s no information in the text suggesting that bees will not behave as some models predict if flowers in patches are “immature,” or not fully developed. Instead, the text indicates that Jha and Kremen found that bees will behave contrary to some models’ predictions if the flower patches are not rich in species. Choice D is incorrect because the text indicates that bees’ behavior will be inconsistent with the predictions of some models if the flower patches that the bees encounter are of low species richness, not if the flowers are in patches that are “dispersed,” or widely scattered. Although the text does describe bees as leaving patches that are not rich in species to forage elsewhere, there’s no suggestion that Jha and Kremen found that the distance between dense flower patches affects whether the bees behave as some models predict."},{"i":"a318c1ef","c":"vocab","d":"E","s":"The Cambrian explosion gets its name from the sudden appearance and rapid diversification of animal remains in the fossil record about 541 million years ago, during the Cambrian period. Some scientists argue that this ______ change in the fossil record might be because of a shift in many organisms to body types that were more likely to be preserved.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["catastrophic","elusive","abrupt","imminent"],"a":2,"r":"Choice C is the best answer because it most logically and precisely completes the text’s discussion of the fossil record from the Cambrian period. In this context, “abrupt” means sudden. The text explains that the fossil record reflects the unexpected appearance and rapid diversification, or increase in variety, of animal remains during the Cambrian period. This context establishes that these remains’ entry into the fossil record was sudden. Choice A is incorrect. Although the word “explosion” appears in the name of the event marked by the fossil record change, the text never suggests that the change was “catastrophic,” or disastrous. In context, “explosion” refers to the rapid diversification, or the swift increase in variety, of animal remains in the fossil record—a phenomenon that the text presents in a relatively neutral manner, without commenting on whether it was negative or positive. Choice B is incorrect because the text never suggests that the change toward greater diversification is “elusive,” or difficult to locate, in the fossil record. Rather, the text notes that the change occurred about 541 million years ago, suggesting that scientists have indeed been able to locate it. Choice D is incorrect because it wouldn’t make sense in context to describe the change in the fossil record as “imminent,” or about to occur, since the text indicates that the change already occurred millions of years ago."},{"i":"2d77660e","c":"purpose","d":"M","s":"In the late 1800s, Spanish-language newspapers flourished in cities across Texas. San Antonio alone produced eleven newspapers in Spanish between 1890 and 1900. But El Paso surpassed all other cities in the state. This city produced twenty-two newspapers in Spanish during that period. El Paso is located on the border with Mexico and has always had a large population of Spanish speakers. Thus, it is unsurprising that this city became such a rich site for Spanish-language journalism.\n\nWhich choice best states the main purpose of the text?","o":["To compare Spanish-language newspapers published in Texas today with ones published there during the late 1800s","To explain that Spanish-language newspapers thrived in Texas and especially in El Paso during the late 1800s","To argue that Spanish-language newspapers published in El Paso influenced the ones published in San Antonio during the late 1800s","To explain why Spanish-language newspapers published in Texas were so popular in Mexico during the late 1800s"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text begins by stating that there were many Spanish-language newspapers in cities across Texas in the late 1800s, citing San Antonio as a city that produced eleven such newspapers. The text then goes on to note that in El Paso, there were twenty-two newspapers published in Spanish in the late 1800s, more than any other Texas city. The text then concludes by explaining that the reason for this large number of Spanish-language newspapers was likely El Paso’s location near Mexico and its large population of Spanish speakers. Therefore, the main purpose of the text is to explain that Spanish-language newspapers thrived in Texas cities, especially in El Paso, in the late 1800s. Choice A is incorrect because the text doesn’t discuss Spanish-language newspapers published in Texas today, let alone compare them with newspapers that were published in the 1800s. Choice C is incorrect. Although the text characterizes El Paso as a particularly rich site for Spanish-language journalism in the late 1800s, the text doesn’t discuss whether newspapers published in El Paso influenced the newspapers published in other cities across Texas, including San Antonio. Choice D is incorrect because the text doesn’t mention whether Spanish-language newspapers published in Texas were also widely read in Mexico. The text only focuses on the popularity of Spanish-language newspapers within Texas, and especially in El Paso."},{"i":"975b0602","c":"purpose","d":"H","s":"A number of Indigenous politicians have been elected to the United States Congress since 2000 as members of the country’s two established political parties. In Canada and several Latin American countries, on the other hand, Indigenous people have formed their own political parties to advance candidates who will advocate for the interests of their communities. This movement has been particularly successful in Ecuador, where Guadalupe Llori, a member of the Indigenous party known as Pachakutik, was elected president of the National Assembly in 2021.\n\nWhich choice best states the main purpose of the text?","o":["To trace the history of an Indigenous political movement and speculate about its future development","To argue that Indigenous politicians in the United States should form their own political party","To highlight two approaches to achieving political representation for Indigenous people","To consider how Indigenous politicians in the United States have influenced Indigenous politicians in Canada and Latin America"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to illustrate two approaches that Indigenous politicians have taken to achieve political representation for their communities. The text begins by explaining that one approach is exemplified by Indigenous politicians in the United States who, in an effort to ensure that the interests of their communities are represented in government, joined preexisting political parties and were subsequently elected to Congress. The text goes on to highlight a second approach adopted by Indigenous leaders in Canada and several Latin American countries: rather than joining established political parties, many Indigenous politicians in these countries have instead formed their own parties to promote candidates for office who support causes that are important to their communities. Choice A is incorrect because the text’s focus is on the contrasting approaches adopted by different Indigenous political movements in different countries; thus, it isn’t accurate to say that the text traces the history of one political movement. Moreover, the text only discusses examples from 2000 to 2021, a relatively short period of time; therefore, it provides very little in the way of discussion of larger historical developments, nor does it make any predictions about how these movements might continue to develop in the future. Choice B is incorrect because the text never urges Indigenous politicians in the US to alter their strategy of striving for representation through the established political parties, nor does it suggest that this strategy is inferior to that of Indigenous politicians in Canada and Latin America, who have formed their own parties. In fact, the text notes that both strategies have resulted in the election of Indigenous politicians to national governments. Choice D is incorrect because the text never suggests that Indigenous politicians in the US have influenced those in Canada and Latin America; instead, it stresses how Indigenous politicians’ approach toward achieving representation in the US government has differed from the approach Indigenous politicians have taken to achieve representation in national governments elsewhere in the Americas."},{"i":"4c4db685","c":"func","d":"M","s":"On painter William H. Johnson’s return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. <u>Turning away from landscapes painted in an expressionist style—a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist’s subjective experience of reality—Johnson began painting portraits of Black Americans in a bold new way.<\/u> Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It elaborates on the previous sentence’s statement about a transitional moment in Johnson’s artistic career.","It provides information about Johnson’s travels in support of a claim about his artistic influences, which is advanced in the following sentence.","It recounts a moment in Johnson’s personal life that enabled the success of his subsequent career, which is summarized in the following sentence.","It presents evidence that calls into question the previous sentence’s characterization of Johnson’s artistic development."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The first sentence of the text indicates that Johnson returned to the US in 1938 at which time his painting style suddenly changed. The second sentence is underlined and gives more detail about this stylistic change, noting that his earlier work consisted largely of landscapes in an expressionist style and his new works were highly stylized portraits of Black Americans. In other words, the function of the underlined sentence is to elaborate on a transitional moment in Johnson’s painting career. Choice B is incorrect. Although the text does mention that Johnson spent a decade in Europe, it does not discuss what other travel Johnson might have done. Furthermore, although the text mentions African, American, and Scandinavian artistic elements in Johnson’s work, it does not indicate that he traveled to different locations to learn about these practices. Choice C is incorrect because the text does not focus on Johnson’s personal life nor does it address how successful his career was in general. Choice D is incorrect because, rather than call it into question, the underlined sentence continues the discussion of Johnson’s career by adding further relevant detail of Johnson’s artistic transformation."},{"i":"b3e145e4","c":"func","d":"E","s":"In the 1950s, scientists didn’t know much about the ocean floor. <u>Many scientists at the time believed that the ocean floor was mostly flat.<\/u> But geologist Marie Tharp and her research partner, Bruce Heezen, proved that this idea was wrong. Using sonar data collected from the Atlantic Ocean, Tharp and Heezen showed that the floor was filled with canyons, mountains, and valleys.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It identifies a scientific belief that Tharp and Heezen showed to be wrong.","It describes the design of Tharp and Heezen’s experiment.","It emphasizes a disagreement between Tharp and Heezen.","It presents data to support a claim that Tharp and Heezen made."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence of the text establishes that scientists didn’t know much about the ocean floor in the 1950s. The second sentence, which is underlined, describes what many scientists thought at the time—that the ocean floor was mostly flat. The remainder of the text establishes that the ocean floor is far from flat, citing research conducted by Marie Tharp and Bruce Heezen. Thus, the purpose of the underlined sentence is to identify a scientific belief that Tharp and Heezen showed to be wrong. Choice B is incorrect. Although Tharp and Heezen’s work with sonar data in the Atlantic Ocean is mentioned later in the text, the underlined sentence doesn’t describe the design of their experiment. Instead, it identifies a belief held by scientists that Tharp and Heezen demonstrated to be wrong. Choice C is incorrect because the underlined sentence presents a belief held by many scientists in the 1950s; nowhere does the text mention a disagreement between Tharp and Heezen, whom the text describes as research partners working together to map the ocean floor. Choice D is incorrect because the underlined sentence doesn’t present data in support of a claim; instead, it presents a scientific belief that Tharp and Heezen’s work showed to be wrong."},{"i":"3e63fce0","c":"structure","d":"M","s":"A team of researchers discovered that Matabele ants can identify an infected wound in a member of the colony and then treat the infection by covering the wound with antimicrobial secretions that the ants produce. The team found that the mortality rate for Matabele ants with infected injuries was reduced by 90% with this treatment, and they are hopeful that this discovery could aid in the development of new antibiotics for human use.\n\nWhich choice best describes the overall structure of the text?","o":["It summarizes research findings on Matabele ants and then identifies an area for further research.","It introduces a study of Matabele ants and then explains the research methods used in the study.","It describes unique properties of Matabele ants and then speculates on how those properties evolved.","It identifies an issue concerning Matabele ants and then proposes a solution to address the issue."],"a":0,"r":"Choice A is the best answer because it most accurately describes the overall structure of the text. The text first presents what researchers found from studying Matabele ants: the ants can tell when colony members have infected wounds and can largely successfully treat those infections with their antimicrobial secretions. The text then indicates that the findings about the ants could help with the future development of antibiotics for humans. Thus, the text summarizes research findings and then identifies an area for further research. Choice B is incorrect. Although the text introduces a study about Matabele ants, it never discusses how the researchers did their work or any methods they used to produce their findings. Choice C is incorrect. Although the text does describe properties of Matabele ants—their ability to detect and largely successfully treat infected wounds in colony members—it never addresses evolution or how these properties might have changed. Choice D is incorrect because the text doesn’t present anything about Matabele ants as an issue or problem to be solved. Instead, it discusses beneficial abilities the ants have (detecting and treating infected wounds) and suggests that understanding those abilities might be useful for human medicine."},{"i":"dc043599","c":"cross","d":"E","s":"Text 1 Most scientists agree that the moon was likely formed after a collision between Earth and a large planet named Theia. This collision likely created a huge debris field, made up of material from both Earth and Theia. Based on models of this event, scientists believe that the moon was formed from this debris over the course of thousands of years.\n\nText 2 Researchers from NASA’s Ames Research Center used a computer to model how the moon could have formed. Although simulations of the moon’s formation have been done in the past, the team from NASA ran simulations that were much more detailed. They found that the formation of the moon was likely not a slow process that took many years. Instead, it’s probable that the moon’s formation happened immediately after impact, taking just a few hours.\n\nWhich choice best describes a difference in how the author of\n\nText 1 and the author of\n\nText 2 view the evidence for the formation of the moon?","o":["The author of Text 1 argues that the formation of the moon occurred much earlier than the author of Text 2 argues.","The author of Text 1 suggests there is more evidence confirming the existence of Theia than the author of Text 2 suggests.","The author of Text 1 claims that the moon’s surface is more similar to Earth’s surface than the author of Text 2 claims.","The author of Text 1 believes that the moon formed more slowly than the author of Text 2 believes."],"a":3,"r":"Choice D is the best answer. Text 1 states that the moon was formed from the debris “over the course of thousands of years,” while Text 2 states that the moon’s formation happened “immediately after impact, taking just a few hours.” This shows a clear difference in how the authors view the evidence for the speed of the moon’s formation. Choice A is incorrect. While Text 2 suggests that the moon formed over “just a few hours” and Text 1 says it took “thousands of years,” neither one mentions when that formation occurred. Choice B is incorrect. While Theia isn’t mentioned in Text 2, neither text describes or disputes evidence of Theia’s existence. Choice C is incorrect. Neither text makes any claims about the similarity or difference between the moon’s surface and Earth’s surface."},{"i":"8a8236e1","c":"main","d":"E","s":"Scent is tightly interwoven with our daily lives, often evoking significant memories and important social events. This connection is of growing interest to archaeologists who hope to use it to better understand ancient rituals, trade, social hierarchies, and medicine. Although the speed at which odor molecules dissipate makes identifying ancient scents challenging, advancements in biomolecular technologies show promise in unlocking ancient aromas from preserved artifacts. Archaeological studies making use of these advancements may provide new insights into past societies.\n\nAccording to the text, what is one reason some archaeologists are interested in recovering scents from ancient artifacts?","o":["They are investigating whether people’s sense of smell has declined in recent centuries.","They believe the scents could illuminate important aspects of ancient life.","They think that ancient scents would be enjoyable to people today.","They hope to develop new medicines using ancient scent molecules."],"a":1,"r":"Choice B is the best answer. The text states that archaeologists are interested in using scents to better understand \"ancient rituals, trade, social hierarchies, and medicine,\" all of which are important aspects of ancient life. Choice A is incorrect. The text doesn’t say anything about investigating if people’s sense of smell has declined in recent centuries. It says that scents fade over time—not that people have gotten worse at smelling scents. Choice C is incorrect. The text says that archaeologists are interested in using scents to better understand \"ancient rituals, trade, social hierarchies, and medicine,\" but it doesn’t say anything about ancient scents being enjoyable to people today. Choice D is incorrect. The text doesn’t say anything about developing new medicines. Rather, it says that archaeologists are interested in using scents to better understand \"ancient rituals, trade, social hierarchies, and medicine.\""},{"i":"b69d821d","c":"main","d":"H","s":"The following text is Vita Sackville-West’s circa 1920 poem “Evening.” Spars are ships’ masts, moorings are ropes that hold docked ships in place, and a riding-light is a light that a ship shines when it is anchored. When little lights in little ports come out, Quivering down through water with the stars, And all the fishing fleet of slender spars Range at their moorings, veer with tide about; When race of wind is stilled and sails are furled, And underneath our single riding-light The curve of black-ribbed deck gleams palely white, And slumbrous waters pool a slumbrous world; —Then, and then only, have I thought how sweet Old age might sink upon a windy youth, Quiet beneath the riding-light of truth, Weathered through storms, and gracious in retreat.\n\nWhich choice best states the main idea of the text?","o":["The tranquility of a port in the evening can incline a person to appreciate the stillness of old age.","The difficulty of bringing a ship into port is apt training for dealing with the types of struggles encountered in old age.","A person who leads a long life that is varied and active may find it difficult to stay in a calm place.","The contrast between the peacefulness of a port at night and its activity during the day reflects the contrast between the calm of old age and the vibrancy of youth."],"a":0,"r":"Choice A is the best answer because it best states the main idea of the text. The speaker describes an evening scene observed from a boat: \"little lights in little ports come out\" and are reflected in the water’s surface \"with the stars,\" fishing boats are moored, \"sails are furled\" (rolled up), and the riding-light is shining. The speaker emphasizes the calmness of the scene, noting that the \"race of wind is stilled\" and the atmosphere is sleepy (\"slumbrous waters pool a slumbrous world\"), and then indicates that the calmness prompts thoughts of how old age might be \"sweet\" and \"quiet\" and \"gracious in retreat\" after \"a windy youth\" with \"storms.\" Thus, the main idea is that the tranquility of a port in the evening can lead a person to appreciate the potential stillness of old age. Choice B is incorrect because the speaker isn’t discussing the difficulty of bringing a ship into port but describing the calmness of the port at night. And rather than suggesting that old age involves struggles, the speaker suggests that after \"a windy youth\" with \"storms\" to be weathered, old age will be \"sweet,\" \"quiet,\" and \"gracious\"—that is, old age will be tranquil like a port at night. Choice C is incorrect because the speaker isn’t suggesting that a person who has lived a varied and active life might find it difficult to stay in a calm place in old age. On the contrary, the speaker suggests that after a \"windy youth\" with \"storms,\" old age can be welcomed as something \"sweet,\" \"quiet,\" and \"gracious,\" just like a calm port at night. Choice D is incorrect. Although the speaker does touch on the idea of a \"windy youth\" followed by \"sweet old age,\" the speaker doesn’t tie that idea to a contrast between daytime activity and nighttime peacefulness at a port. The speaker doesn’t address any activity during the day at a port, only briefly mentioning that the \"race of wind is stilled\" at the end of the day, and instead focuses on the tranquility of the port at night and how it prompts thoughts of \"quiet\" and \"gracious\" old age."},{"i":"08395130","c":"infer","d":"H","s":"The Hubble Space Telescope (HST) is projected to maintain operation until at least 2030, but it has already revolutionized high-resolution imaging of solar-system bodies in visible and ultraviolet (UV) light wavelengths, notwithstanding that only about 6% of the bodies imaged by the HST are within the solar system. NASA researcher Cindy L. Young and colleagues assert that a new space telescope dedicated exclusively to solar-system observations would permit an extensive survey of minor solar-system bodies and long-term UV observation to discern how solar- system bodies change over time. Young and colleagues’ recommendation therefore implies that the HST ______ Which choice most logically completes the text?","o":["will likely continue to be used primarily to observe objects outside the solar system.","will no longer be used to observe solar system objects if the telescope recommended by Young and colleagues is deployed.","can be modified to observe the features of solar system objects that are of interest to Young and colleagues.","lacks the sensors to observe the wavelengths of light needed to discern how solar system bodies change over time."],"a":0,"r":"Choice A is the best answer. The HST will operate until at least 2030, but it’s only observing stuff inside our solar system 6% of the time. If we could get a different telescope to observe stuff inside our solar system 100% of the time and take more extensive images of certain things, then the HST could continue to be used mainly for observing stuff outside the solar system. Choice B is incorrect. This inference is too strong to be supported by the text. Even if the new telescope is deployed, the HST might still be used as it’s being used now. Based on the text, the new telescope would just be used for more extensive and long-term imaging of solar system bodies, which doesn’t necessarily overlap with the HST . Choice C is incorrect. This inference isn’t supported. The text never mentions the possibility of modifying the HST , so there is no basis to make this inference. Rather, the researchers suggest using a different telescope to more closely observe certain objects. Choice D is incorrect. This inference is too strong to be supported. The text doesn’t give us enough info to assume that the HST lacks any particular sensors."},{"i":"b5e9f3c2","c":"infer","d":"H","s":"Ancestral Puebloans, the civilization from which present-day Pueblo tribes descended, emerged as early as 1500 B.C.E. in an area of what is now the southwestern United States and dispersed suddenly in the late 1200s C.E., abandoning established villages with systems for farming crops and turkeys. Recent analysis comparing turkey remains at Mesa Verde, one such village in southern Colorado, to samples from modern turkey populations in the Rio Grande Valley of north central New Mexico determined that the latter birds descended in part from turkeys cultivated at Mesa Verde, with shared genetic markers appearing only after 1280. Thus, researchers concluded that ______ Which choice most logically completes the text?","o":["conditions of the terrains in the Rio Grande Valley and Mesa Verde had greater similarities in the past than they do today.","some Ancestral Puebloans migrated to the Rio Grande Valley in the late 1200s and carried farming practices with them.","Indigenous peoples living in the Rio Grande Valley primarily planted crops and did not cultivate turkeys before 1280.","the Ancestral Puebloans of Mesa Verde likely adopted the farming practices of Indigenous peoples living in other regions."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of Ancestral Puebloans’ migration to the Rio Grande Valley. The text states that in the late 1200s C.E., the Ancestral Puebloan civilization abandoned villages in its original homeland, which included the Mesa Verde site. The text goes on to say that recent genetic analysis has demonstrated that the modern turkey population in the Rio Grande Valley descends partly from the ancient turkeys raised at Mesa Verde, and that the genetic markers shared by the two turkey populations first appeared at Mesa Verde only after 1280 C.E. Therefore, it can reasonably be concluded that some Ancestral Puebloans migrated to the Rio Grande Valley in the late 1200s and carried their agricultural practices—including the farming of turkeys—to their new home. Choice A is incorrect because the text never compares the condition of the Rio Grande Valley’s terrain to that of Mesa Verde’s terrain, either in the present or in the past. Choice C is incorrect. Although genetic analysis has demonstrated that the modern turkey population in the Rio Grande valley descended in part from the turkey population raised by the Ancestral Puebloans of Mesa Verde before their migration to the valley in 1280, this finding doesn’t eliminate the possibility that Indigenous peoples living in the valley before 1280 might also have farmed turkeys. Choice D is incorrect. The text doesn’t consider the possibility that before their migration to the Rio Grande Valley after 1280, the Ancestral Puebloans of Mesa Verde might have adopted turkey farming from an outside Indigenous civilization in another region; instead, the text provides evidence suggesting that the Ancestral Puebloans brought turkey farming to another region—the Rio Grande Valley—after 1280."},{"i":"4d38c2ea","c":"claim","d":"H","s":"Gorgets, or necklaces with large pendants, have been part of the ceremonial attire of tribes from the US Southeast for centuries. One of the oldest examples, the Fairfield Gorget, was found in Fairfield, Missouri, in 1958. Its overall design resembles that of other art from the region during the Mississippian period (900–1600 CE). Yet the image on the gorget is of a jaguar—a species whose range doesn’t extend to Missouri. Jaguar images are common in ancient Mexican art, and Mexico lies squarely in the species’ range. Therefore, some scholars argue that <u>long- distance trade in Mexican art objects brought the imagery to Missouri, where a local artist could have adopted it and incorporated it into the Fairfield Gorget.<\/u> Which finding, if true, would most strongly support the underlined explanation?","o":["The Fairfield Gorget is dated not to the Mississippian period but instead to the earlier Woodland period, which ended around 900 CE.","The range of the jaguar is shown to have expanded dramatically after the Mississippian period came to a close around 1600 CE.","An ancient Mexican art object is found at a site that dates to the Mississippian period and is close to where the Fairfield Gorget was found.","Certain works by present-day artists from Southeastern tribes reflect outside cultural influences, including contemporary Mexican art."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would most strongly support the underlined explanation that the jaguar imagery on the Fairfield Gorget could have been inspired by art objects brought to Missouri from Mexico. The text describes the Fairfield Gorget as one of the oldest examples of these necklaces, noting that it’s similar to other art from the Mississippian period except for its image of a jaguar. The text goes on to explain that this is unusual because the jaguar’s range didn’t include Missouri. The Fairfield Gorget’s artist likely wouldn’t have encountered a live jaguar, but since such jaguar images were common in ancient Mexican art (and the jaguar’s range did include Mexico), perhaps some of that art inspired the gorget’s artist. Therefore, evidence that an ancient Mexican art object had been found at a site that was close to the Fairfield Gorget in both location and time period would strongly support the explanation that long-distance trade from Mexico took place during the Mississippian period and that jaguar imagery could have reached Missouri by those means. Choice A is incorrect. The underlined explanation indicates that Mexican artistic influence preceded the creation of the Fairfield Gorget. An artifact from Mexico that appeared in Missouri only after the gorget was created cannot support such a claim. Choice B is incorrect. The underlined explanation pertains to whether the jaguar image on the Fairfield Gorget was suggested to the Mississippian artist who made it by encounters with depictions of jaguars in Mexican art. The appearance of jaguars in Missouri after the Mississippian period cannot provide evidence for such a claim. Choice D is incorrect. The underlined explanation pertains to influence that Mexican art might have had on Mississippian art, restricted to the period from 900 CE to 1600 CE. The actions of contemporary artists cannot provide evidence for centuries-old networks of artistic influence and exchange."},{"i":"df91532e","c":"claim","d":"H","s":"In the “language nest” model of education, Indigenous children learn the language of their people by using it as the medium of instruction and socialization at pre-K or elementary levels. In their 2016 study of a school in an Anishinaabe community in Ontario, Canada, scholars Lindsay Morcom and Stephanie Roy (who are Anishinaabe themselves) found that the model not only imparted fluency in the Anishinaabe language but also enhanced students’ pride in Anishinaabe culture overall. Given these positive effects, Morcom and Roy predict that the model increases the probability that as adults, former students of the school will transmit the language to younger generations in their community.\n\nWhich finding, if true, would most strongly support the researchers’ prediction?","o":["Anishinaabe adults who didn’t attend the school feel roughly the same degree of cultural pride as the former students of the school feel.","After transferring to the school, new students experience an increase in both fluency and academic performance overall.","As adults, former students of the school are just as likely to continue living in their community as individuals who didn’t attend the school.","As they complete secondary and higher education, former students of the school experience no loss of fluency or cultural pride."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would support the researchers’ prediction about the language nest model of education. The text states that Morcom and Roy studied the effects of the language nest model of education on students at an Anishinaabe school, and they found that the model—which is used with students during pre-K or elementary school—increased students’ fluency in the Anishinaabe language and pride in Anishinaabe culture. The researchers predicted that the students’ positive early experiences with the Anishinaabe language would lead them to be more likely to later share the language with younger generations. If former students maintain full fluency and cultural pride after finishing secondary and higher education, it follows that they would be both able and motivated to share what they know with others; this would likely result in a higher probability of transmitting the language to younger generations, as the researchers predict. Choice A is incorrect because finding that Anishinaabe adults who didn’t attend the school feel approximately the same degree of cultural pride as those adults who did attend wouldn’t support the researchers’ prediction that former students will be more likely to share their knowledge with younger generations. This finding would identify a similarity between the groups rather than a factor that might make former students more likely than other adults to transmit the language to younger people. Choice B is incorrect because finding that new students experience increased performance in language fluency and academics would suggest that the school has a positive effect on students when they attended but wouldn’t reveal anything about those students’ later actions as adults (such as their likelihood of sharing their knowledge with younger generations). Choice C is incorrect because finding that Anishinaabe adults who attended the school are equally likely to stay in the community as adults who didn’t attend the school wouldn’t support the researchers’ prediction that former students will be more likely to share their knowledge with younger generations. This finding would identify a similarity between the groups rather than a factor that might make former students more likely than other adults to transmit the language to younger people."},{"i":"94c726fb","c":"graph","d":"E","s":"","o":["0.59 million metric tons of copper in 1995.","0.44 million metric tons of copper in 1995.","0.26 million metric tons of copper in 1995.","2.49 million metric tons of copper in 1995."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the statement about copper mining. The table shows the amount of copper mined in each of four countries in 1995 and 2020. According to the text, a student who consults the table notes that the country that mined 0.55 million metric tons of copper in 2020 had mined a different amount in 1995. The table indicates that Kazakhstan is the country that mined 0.55 million metric tons of copper in 2020 and 0.26 million metric tons of copper in 1995. Choice A is incorrect because it doesn’t provide the amount of copper mined in 1995 by Kazakhstan, the country that mined 0.55 million metric tons of copper in 2020. According to the table, Canada mined 0.73 million metric tons of copper in 1995 and 0.59 million metric tons in 2020. It didn’t mine 0.55 million metric tons in either year. Choice B is incorrect because it doesn’t provide the amount of copper mined in 1995 by Kazakhstan, the country that mined 0.55 million metric tons of copper in 2020. According to the table, Indonesia mined 0.44 million metric tons of copper in 1995 and 0.51 million metric tons in 2020. It didn’t mine 0.55 million metric tons in either year. Choice D is incorrect because it doesn’t provide the amount of copper mined in 1995 by Kazakhstan, the country that mined 0.55 million metric tons of copper in 2020. According to the table, Chile mined 2.49 million metric tons of copper in 1995 and 5.73 million metric tons in 2020. It didn’t mine 0.55 million metric tons in either year."},{"i":"ff18829b","c":"graph","d":"M","s":"","o":["providing medicinal plants than to improving the local microclimate.","improving community members’ sense of attachment to the neighborhood than to offering educational opportunities.","improving the local microclimate than to providing medicinal plants.","improving the local microclimate than to providing tourist attractions."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the graph to complete the assertion about urban agriculture. The graph shows the average survey ratings, on a scale of 0 to 5, from three groups of people—project leaders, stakeholders, and the general public— concerning the contributions of urban agriculture. According to the graph, project leaders gave an average rating of approximately 2 to urban agriculture’s contributions to the provision of medicinal plants, which is lower than the average rating of approximately 3 that project leaders gave to urban agriculture’s contributions to both improving the local microclimate and improving a sense of attachment to the neighborhood. This shows that project leaders rated urban agriculture as contributing less to providing medicinal plants than to improving the local microclimate. Choice B is incorrect because the graph doesn’t provide data about urban agriculture’s contribution to educational opportunities; therefore, this comparison can’t be made. Choice C is incorrect because it contradicts the data shown in the graph. On average, project leaders gave a rating of approximately 3 to urban agriculture’s contributions to improving the local microclimate, which is higher, not lower, than the average rating of approximately 2 that they gave to its contributions to providing medicinal plants. Choice D is incorrect because the graph doesn’t provide data about urban agriculture’s contribution to providing tourist attractions; therefore, this comparison can’t be made."},{"i":"9127635a","c":"fss","d":"H","s":"Star actress Kiki Omeili, who has appeared in 47 Nollywood films, is one of numerous luminaries to be pictured in Nigerian portraitist Iké Udé’s exhibition Nollywood Portraits. ______ referred to Nollywood—Nigeria’s $3 billion film industry—as “Africa’s vivid mirror par excellence,” honors its legacy with his vivid classical portraits of Omeili and her peers.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Udé, has","Udé has","Udé","Udé, having"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms and punctuation within a sentence. The sentence’s subject is “Udé,” and its finite main verb is “honors.”This choice correctly uses the nonfinite participle “having referred” to form a supplementary element (“having...excellence”) describing Udé. The comma after “Udé” appropriately marks the boundary before that supplementary element. Choice A is incorrect because using the finite verb “has referred” creates an ungrammatical sentence. The sentence already has the finite main verb “honors,” so “has referred” can’t also function as a second main verb here without additional punctuation or conjunctions. Moreover, no punctuation is needed when a subject (“Udé”) is immediately followed by a finite verb (“has referred”). Choice B is incorrect because using the finite verb “has referred” creates an ungrammatical sentence. The sentence already has the finite main verb “honors,” so “has referred” can’t also function as a second main verb here without additional punctuation or conjunctions. Choice C is incorrect because using the finite verb “referred” creates an ungrammatical sentence. The sentence already has the finite main verb “honors,” so “referred” can’t also function as a second main verb here without additional punctuation or conjunctions."},{"i":"a75d5984","c":"fss","d":"H","s":"Several advantages—the ability to react strongly with chip components, to avoid interference from other waves, and to be confined within tiny circuits—______ acoustic waves as a promising alternative to electrical waves for transmitting data on computer chips; as a result, researchers are invested in developing more acoustic wave–based chips.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have positioned","positioning","by positioning","having positioned"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject. In this case, the subject is \"several advantages,\" and the present perfect tense verb \"have positioned\" supplies the finite verb to indicate what has made acoustic waves a promising alternative to electrical waves. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"positioning\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The prepositional phrase \"by positioning\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having positioned\" doesn’t supply the main clause with a finite verb."},{"i":"2b6e1c06","c":"fss","d":"H","s":"A government body officially known as the Althing, ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["the world’s oldest parliaments include one which first met in 930 CE, Iceland’s.","Iceland’s parliament is one of the oldest in the world, first meeting in 930 CE.","the first meeting of one of the oldest parliaments in the world, Iceland’s, was in 930 CE.","930 CE was the year when Iceland’s parliament, one of the oldest parliaments in the world, first met."],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"Iceland’s parliament\" the subject of the sentence and places it immediately after the modifying phrase \"a government body officially known as the Althing.\" In doing so, this choice clearly establishes that Iceland’s parliament—and not another noun in the sentence—is the government body known as the Althing. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase \"the world’s oldest parliaments\" immediately after the modifying phrase illogically suggests that the world’s oldest parliaments are a government body known as the Althing. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase \"the first meeting\" immediately after the modifying phrase illogically suggests that the first meeting of Iceland’s parliament was a government body known as the Althing. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase \"930 CE\" immediately after the modifying phrase illogically suggests that the year 930 CE is a government body known as the Althing."},{"i":"fa07bcb6","c":"bound","d":"E","s":"Ganga is a folk singing tradition that originated in the Dinaric Alps in southern Europe. Ganga singers sing different melodies at the same time. The clashing notes can echo a long way across the mountains, which is why ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["ganga has been used as a communication method?","ganga has been used as a communication method.","has ganga been used as a communication method.","has ganga been used as a communication method?"],"a":1,"r":"Choice B is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a period to punctuate a declarative sentence ending with a relative clause that presents an indirect question (“why ganga has been used as a communication method.”) Choice A is incorrect. It’s unconventional to use a question mark to punctuate a declarative sentence that presents an indirect question. Choice C is incorrect. The structure requires a declarative clause at the end of the sentence, not an interrogative clause that asks a direct question, such as “has ganga been used as a communication method.” Choice D is incorrect. The structure requires a declarative clause at the end of the sentence, not an interrogative clause that asks a direct question, such as “has ganga been used as a communication method.”"},{"i":"6fac7f45","c":"bound","d":"H","s":"Butterfly is a 1988 painting by the Japanese artist Ay-O. Like many of Ay-O’s paintings, Butterfly, which portrays a swimmer performing the butterfly stroke, attempts to make use of the entire visual light ______ sporting rainbow-striped goggles, the rainbow-hued swimmer splashes through a wavy rainbow of water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["spectrum","spectrum:","spectrum while","spectrum, while"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of a colon within a sentence. In this choice, the colon correctly introduces the following description of how the painting makes use of the entire visual light spectrum by depicting a rainbow-hued swimmer. Choice A is incorrect because it results in a run-on sentence. The main clauses (\"Like…spectrum\" and \"sporting…water\") are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a run-on sentence. The main clauses (\"Like…spectrum\" and \"while… water\") are fused without punctuation. Furthermore, the conjunction \"while\" fails to indicate that what follows is a description of how the painting makes use of the entire visual light spectrum. Choice D is incorrect because it results in a logically confusing sentence. The conjunction \"while,\" which suggests that what follows is occurring at the same time as or despite what came before, fails to indicate that what follows is a description of how the painting makes use of the entire visual light spectrum."},{"i":"e2eb70b9","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Traditionally, manufacturers have dyed denim jeans blue by dipping them in a solution containing indigo powder. Indigo doesn’t dissolve in just water, so manufacturers must mix hazardous chemicals with water to dissolve the powder. Textile researcher Smriti Rai discovered a process for dyeing blue jeans without chemicals. Rai added indigo powder to a hydrogel containing nanocellulose and produced a dye that could be spread directly onto the denim. Nanocellulose is a natural, plant-based substance that separates the molecules of indigo powder. The student wants to emphasize a difference between the two approaches to dyeing blue jeans.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Though created using a different process, Rai’s dye contains the same ingredient as the dye produced by blue jean manufacturers.","Nanocellulose is a natural, plant-based substance that separates the molecules of indigo powder, which doesn’t dissolve in water.","The traditional approach to dyeing blue jeans is to dip them in a solution containing hazardous chemicals.","Rai’s approach substitutes a natural, plant-based substance for the hazardous chemicals that manufacturers have traditionally used."],"a":3,"r":"Choice D is the best answer. The sentence emphasizes a difference between the two approaches to dyeing blue jeans, noting that Rai’s approach uses a natural, plant-based substance in place of hazardous chemicals. Choice A is incorrect. The sentence emphasizes a similarity between the dyes used in the two approaches, noting that the dyes contain the same ingredient; it doesn’t emphasize a difference between the two approaches to dyeing blue jeans. Choice B is incorrect. The sentence explains what nanocellulose is; it doesn’t emphasize a difference between the two approaches to dyeing blue jeans. Choice C is incorrect. The sentence explains the traditional approach to dyeing blue jeans; it doesn’t emphasize a difference between the traditional approach and Rai’s approach."},{"i":"6249b173","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In 2018 researchers Adwait Deshpande, Shreejata Gupta, and Anindya Sinha were observing wild macaques in India’s Bandipur National Park. They saw macaques calling out to and gesturing at humans who were eating or carrying food. They designed a study to find out if the macaques were intentionally communicating to try to persuade the humans to share their food. In the study trials, macaques frequently called out to and gestured at humans holding food. In the study trials, macaques called out to and gestured at empty-handed humans less frequently. The student wants to present the study’s results.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Macaques in the study called out to and gestured more frequently at humans holding food than at empty-handed humans.","In 2018, researchers who had observed macaques in India’s Bandipur National Park calling out to and gesturing at humans designed a study.","The researchers hoped to find out if the macaques were intentionally communicating to try to persuade humans to share their food.","The researchers studied how macaques behaved around both humans holding food and empty-handed humans."],"a":0,"r":"Choice A is the best answer. This choice presents the study’s results from the last two bullet points. Choice B is incorrect. This choice describes the background and motivation of the study but not the outcome or findings. Choice C is incorrect. This choice describes the research question or hypothesis of the study but not the evidence or conclusion. Choice D is incorrect. This choice describes the method or design of the study but not the actual results."},{"i":"6916c8e5","c":"trans","d":"E","s":"Laetitia Ky’s hair is her art. Inspired by hairstyles from various African tribes, the Ivorian artist uses wire and thread to sculpt her hair into all kinds of shapes. ______ she once made her hair into the shape of the continent of Africa—including the island of Madagascar!\n\nWhich choice completes the text with the most logical transition?","o":["Soon,","Elsewhere,","For example,","However,"],"a":2,"r":"Choice C is the best answer. “For example” logically signals that the following information about Ky—that she once shaped her hair to look like Africa—is an example supporting the previous statement that she makes different shapes with her hair. Choice A is incorrect because “soon” illogically signals that the event described in this sentence occurred soon after the statement about Ky making different shapes with her hair. Instead, the sentence provides an example of one of these shapes. Choice B is incorrect because “elsewhere” illogically signals that the event described in this sentence occurred in a different place than the statement about Ky making different shapes with her hair. Instead, the sentence provides an example of one of these shapes. Choice D is incorrect because “however” illogically signals that the information in this sentence contrasts with the statement that Ky makes different shapes with her hair. Instead, the sentence provides an example of one of these shapes."},{"i":"2ba97187","c":"trans","d":"H","s":"Upon first approaching artist Kurt Wenner’s Dies Irae, a colorful scene painted on the surface of a cobblestone street in Mantua, Italy, one might assume a deep hole filled with life-sized, classically styled sculptures had opened up in the street. ______ by expertly applying the principles of perspective, Wenner created merely the illusion of depth.\n\nWhich choice completes the text with the most logical transition?","o":["Additionally,","On the contrary,","As a result,","Next,"],"a":1,"r":"Choice B is the best answer. \"On the contrary\" logically signals that the information in this sentence—that Dies Irae’s appearance of depth is merely an illusion—contrasts with the previous statement about a viewer’s possible assumption regarding the street painting. Choice A is incorrect because \"additionally\" illogically signals that this sentence is simply additional information about a viewer’s possible assumption regarding the street painting. Instead, the information about how Wenner achieved the illusion of depth contrasts with the previous sentence’s description of the illusion. Choice C is incorrect because \"as a result\" illogically signals that the information in this sentence is a result of, or caused by, a viewer’s possible assumption regarding the street painting. Instead, the information about how Wenner achieved the illusion of depth contrasts with the previous sentence’s description of the illusion. Choice D is incorrect because \"next\" illogically signals that the information in this sentence is the next step in a process. Instead, the information about how Wenner achieved the illusion of depth contrasts with the previous sentence’s description of the illusion."}],"img":{"94c726fb":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEHBAMAAAC+cYhbAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAAn4klEQVR42u19d0AUV/f2c2d2Yal7F0EjUoZmjTIgaOyLWGNbe+xoYo1GjBqNJaJRk/yMBlM0ljeuPVGjYNckigWNLa4aibGxIJYgsrOoFFl2vj8QhGUXMeX91rzz/MMy596Ze585c+45d87cC0iQIEGCBAkSJLxsIAChNJjlaPnjHXhQoOQgBwBMgEf5Qv04IFCisDKExsI/YUMj5/ijJUcoBUAOcg4PIcsFwFBgJ0DR7fyDuLJVmSscat7YKXFYGb2JGBavaeUUp0Y4mBCQaAIEcw4nIM+HUy6CaYO51cJ4Eg7AXUOiwQTxJIoCnnzdPcA2bENjygRzTDCPYM4jTGK0HBpdJue0u1o7x+703hI/+FNt/W1xYA9udn5C5Q+4hikOp9cNPfbO+qPeP8QD7poWW+IUp060WB0D+YE9vgUElxBS/UCyy6lk59+TZaeOT1hrJ91i7KQdfscZF+qhF6m695g3ycbekf0Jatzd73JAYLZrul9QjHLc+r3bB/7vjgkHRDJn7Aj2571tx4HU3Pdz5gGRUFwr+PoEs/kKs/nUK5s3+020 function card(q,n){const a=ans[q.i];
