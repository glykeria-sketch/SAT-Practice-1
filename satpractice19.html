<script>
const D={"t":"SATPractice19","q":[{"i":"37219ba2","c":"vocab","d":"E","s":"The following text is from John Muir’s 1913 autobiography The Story of My Boyhood and Youth. Muir describes being on a boat. The water was so clear that it was almost invisible, and when we floated slowly out over the plants and fishes, we seemed to be miraculously sustained in the air while exploring a veritable fairyland.\n\nAs used in the text, what does the word “clear” most nearly mean?","o":["Simple","Understandable","Obvious","Transparent"],"a":3,"r":"Choice D is the best answer because as used in the text, \"clear\" most nearly means transparent, or see-through. Muir states that the water beneath the boat \"was so clear that it was almost invisible,\" suggesting that those on the boat were able to see through the water and easily observe plants and fish below the surface. Choice A is incorrect. In some contexts \"clear\" can mean \"simple,\" or uncomplicated, but Muir is describing the water, and water isn’t typically described as either simple or complicated. Muir emphasizes the water’s transparency, not its simplicity. Choice B is incorrect. In some contexts \"clear\" can mean \"understandable,\" or reasonable or easily comprehended, but Muir is describing the water, and it doesn’t make much sense to describe water as understandable. Muir emphasizes the water’s transparency, not how easily the water can be understood. Choice C is incorrect. Although \"clear\" can mean \"obvious,\" or easily seen or understood, in some contexts, Muir’s description emphasizes that the water \"was almost invisible\" and that the boat seemed to be \"sustained in the air,\" suggesting that the water was almost impossible to see, not that it was obvious."},{"i":"7f935017","c":"vocab","d":"H","s":"The following text is from a 1955 translation of Samuel Beckett’s 1951 novel Molloy(translated by the author and Patrick Bowles). In the text, Molloy has arrived at the town ramparts, an elevated walkway atop the city walls. And having cleared the ramparts I had to confess the sky was clearing, prior to its winding in the other shroud, night. Yes, the great cloud was ravelling, discovering here and there a pale and dying sky, and the sun, already down, was manifest in the livid tongues of fire darting towards the zenith, falling and darting again, ever more pale and languid, and doomed no sooner lit to be extinguished. ©1955 by Grove Press, Inc.\n\nAs used in the text, what does the word “manifest” most nearly mean?","o":["Realized","Perceptible","Situated","Dwindling"],"a":1,"r":"Choice B is the best answer because as used in the text, “manifest” most nearly means perceptible or detectable. The text indicates that the sun was “already down,” meaning it was below the horizon and not directly visible. However, the sun’s presence was nonetheless perceptible or manifest in the “tongues of fire” (or beams of light) that still flickered in the darkening sky. Choice A is incorrect. Although in some contexts “manifest” can mean “realized” or “brought into being,” that is not the context here. Rather, the text is about how the sun’s presence was perceptible or manifest in the “darting” beams of light that could still be seen in the sky. Choice C is incorrect. This choice would suggest that the sun is situated, or located, in the light it emits, which is not supported by the surrounding context. Rather, the text is about how the sun’s presence was perceptible or manifest in the remaining light that could still be seen in the sky. Choice D is incorrect. Although the text is about the decreasing light in the scene at sunset, the text’s use of “manifest” is about how the sun’s presence was nonetheless perceptible or manifest in the “tongues of fire” still visible in the sky as night approached."},{"i":"b35e2fdc","c":"vocab","d":"H","s":"A casual description of Scherezade García’s 2019 mural Blame It on the Bean: The Power of Coffee can make the work seem ______—a painting that is housed in a coffee shop and that depicts three women drinking coffee may not sound particularly ambitious—but in fact the work is a complex, dynamic meditation on gender and the legacy of colonialism that demands serious attention.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["unassuming","shrewd","incongruous","pretentious"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Scherezade García’s mural Blame It on the Bean: The Power of Coffee. In this context, “unassuming” means ordinary or unremarkable. The text draws a contrast between a “casual description” of the mural’s ordinary location (a coffee shop) and subject matter (three women drinking coffee)—details that would make it seem relatively unambitious—and a characterization of the painting as a “dynamic meditation” on gender and colonialism deserving of “serious attention.”This context suggests that the mural has significant depth and complexity, but a superficial description of it might make the mural seem ordinary and unremarkable—that is, unassuming. Choice B is incorrect because in this context, “shrewd” would mean clever or astute, and there’s nothing in the text to suggest that a casual yet misleading description that only mentions the apparent simplicity of the mural’s location and subject matter would make the mural seem particularly clever or astute. Though it’s possible that the text’s assertion that the mural is a “complex, dynamic meditation” demanding “serious attention” might convey the idea that it’s a particularly clever or astute—that is, shrewd—artwork, the text wouldn’t suggest that a casual description that fails to account for the work’s complexity would likewise characterize the work as shrewd. Choice C is incorrect because in this context, “incongruous” would mean unsuitable for its surroundings or internally inconsistent. The “casual description” presented in the text indicates that the painting is housed in a coffee shop and depicts women drinking coffee, which would imply that the mural may in fact be well suited to its surroundings, not that it’s ill suited to its location. Moreover, none of the details mentioned in this description would suggest that the painting contains internal inconsistencies of any kind. Choice D is incorrect because in this context, “pretentious” would mean expressive of exaggerated importance, which wouldn’t fit the contrast established in the text between a “casual description” of the painting and the work’s deeper themes. Though the text argues that the painting is worthy of “serious attention,” which would suggest its importance, the text doesn’t suggest that the casual description would by contrast imply that the painting’s importance is exaggerated. Rather, by merely mentioning the mural’s relatively ordinary location and subject matter without reference to this complexity, the casual description conveys that the painting is more unassuming and understated than it actually is, not that it expresses an exaggerated self-importance."},{"i":"9ccf463e","c":"vocab","d":"E","s":"The following text is from Nella Larsen’s 1928 novel Quicksand. The trees in their spring beauty sent through her restive mind a sharp thrill of pleasure. Seductive, charming, and beckoning as cities were, they had not this easy unhuman loveliness.\n\nAs used in the text, what does the word “beckoning” most nearly mean?","o":["Demanding","Signaling","Inviting","Shifting"],"a":2,"r":"Choice C is the best answer because as used in the text, “beckoning” most nearly means “inviting,” or attractive. The text portrays a woman who is looking at “trees in their spring beauty.” She compares them to cities, which have their own pleasures even if they do not have the “easy unhuman loveliness” of trees: she thinks of cities as “seductive” and “charming,” both adjectives that signify something that is enticing, or attractive. Therefore, cities that are seductive and charming would also be described as inviting people closer to them. Choice A is incorrect because there is no indication in this context that cities are “demanding,” or requiring effort. Choice B is incorrect. Though “signaling,” or communicating something, might be considered a key feature of the act of “beckoning,” in the context here, “beckoning” suggests that cities have attractive qualities that naturally draw people to them. Such attractive qualities are not described by the word “signaling” alone. Therefore, “signaling” is an incorrect answer because it is insufficiently precise. Choice D is incorrect because there is no reason to think in this context that the cities are “shifting,” or changing shape."},{"i":"0b5ecf0e","c":"purpose","d":"H","s":"During Rome’s republican period, which ended in the first century BCE, libraries were predominantly owned by wealthy individuals who tightly controlled access to their book collections. The first public library became available in Rome in 28 BCE and was soon followed by one commissioned by Emperor Augustus. As modern scholar Fabio Fernandes notes, however, these two traditions aren’t as distinct as they seem, as both the emperor and the private library owners viewed their libraries as extensions of their personal patronage, just on vastly differing scales.\n\nWhich choice best states the main purpose of the text?","o":["To give a brief overview of public access to libraries throughout Rome’s republican period","To contend that early imperial leaders in Rome wielded too much influence over libraries","To assert that private and early public libraries in ancient Rome had an essential similarity","To call into question the notion that private Roman libraries disappeared during the first century BCE"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text. The text describes two types of libraries in first- century BCE Rome—private libraries controlled by wealthy individuals, and the public libraries like that commissioned by Emperor Augustus—and then notes that \"these two traditions aren’t as distinct as they seem.\" It explains that both private-library owners and the emperor saw their libraries as \"extensions of their personal patronage, just on vastly differing scales,\" because the emperor’s patronage extended to the whole citizenry of Rome. Thus, both private and public libraries in ancient Rome were fundamentally tied to relevant principles of patronage. Choice A is incorrect because the text mentions that Rome’s republican period only to say that it \"ended in the first century BCE,\" thus it doesn’t support any conclusions about possible occurrences \"throughout Rome’s republican period.\" Choice B is incorrect. The text neither discusses \"early imperial leaders in Rome,\" nor whether their level of influence was appropriate. Rather it discusses the end of \"Rome’s republican period\" in relation to libraries, who created them, and who got to use them without passing judgment on propriety. Choice D is incorrect. Although the text indicates that Rome’s republican period \"ended in the first century BCE,\" a period that also saw the first public library come into use (28 BCE), nothing in the text suggests that private libraries disappeared at that time."},{"i":"7a0e31ea","c":"purpose","d":"M","s":"The following text is from Betty Smith’s 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, visits the library often. Francie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in alphabetical order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B’s. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine architecture. For all her enthusiasm, she had to admit that some of the B’s had been hard going. But Francie was a reader. ©1947 by Betty Smith Which choice best states the main purpose of the text?","o":["To illustrate Francie’s enjoyment of an unusual topic","To explain why Francie prefers reading over other activities","To portray Francie’s determination to meet a goal","To describe a book that Francie greatly admires"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to portray Francie’s determination to reach her goal of reading all the books in the world. The text indicates that to achieve this aim, Francie works systematically and persistently: she reads all the books in the library in alphabetical order and devotes much time and effort to the project, finishing one book per day over a long period of time. The text then suggests that even though she progresses slowly (\"she was still in the B’s\") and that she struggled with some books (\"some of the B’s had been hard going\"), she doesn’t give up because she thinks of herself as \"a reader.\" These details show Francie’s resolve. Choice A is incorrect. Although the text mentions several topics (bees and buffaloes, Bermuda vacations, and Byzantine architecture) that Francie has read about, it doesn’t indicate that any of these topics are unusual or that she especially enjoyed reading about one of these topics in particular. If anything, the text suggests that she may have found some of these topics to be dull, saying that she even read the \"dry ones\"—that is, the boring books—and that some of the books were \"hard going,\" meaning they were difficult to get through. Choice B is incorrect because the text doesn’t discuss Francie’s involvement in other activities, only her dedication to reading. Although it’s possible that Francie dedicates herself to reading because she prefers it to other activities, the text doesn’t indicate whether this is the case. Choice D is incorrect. Although the text mentions one author (Abbott) whose book Francie has read as well as several topics (bees and buffaloes, Bermuda vacations, and Byzantine architecture) she has encountered, the text doesn’t say whether Francie admires any of the books she’s read so far. Instead, the text focuses on the time and effort she devotes to reaching her goal of reading all the books in the world—even ones she doesn’t enjoy."},{"i":"1c6b1fa0","c":"func","d":"E","s":"In 1801, a Blackfoot chief named Ac Ko Mok Ki drew a finely detailed map of the Upper Missouri region. <u>This work demonstrates a vast amount of topographic knowledge, as the map features specific names of mountains and rivers, as well as the first-known sketch of the drainage network of the Missouri River.<\/u> The map is especially notable because Ac Ko Mok Ki also included details about the numerous tribes that lived in the area.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It emphasizes Ac Ko Mok Ki’s desire to represent other tribes on the map.","It explains how Ac Ko Mok Ki developed an interest in mapmaking.","It identifies some reasons why the map is impressive.","It details how the map was used for hunting and trading purposes."],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The text presents information about a map drawn by Blackfoot chief Ac Ko Mok Ki in 1801. The underlined sentence states that the map \"demonstrates a vast amount of topographic knowledge\" and mentions that it features the \"specific names of mountains and rivers\" and includes the first-known sketch of the Missouri River’s drainage network. These are all characteristics that indicate that the map was executed with remarkable skill. Thus, the underlined sentence identifies some reasons why the map is impressive. Choice A is incorrect. Though the sentence after the underlined sentence in the text mentions that Ac Ko Mok Ki included information about other tribes on his map, the underlined sentence itself does not address this topic. Choice B is incorrect because nothing in the underlined sentence indicates how Ac Ko Mok Ki became interested in mapmaking, only that his mapmaking skills are impressive. Choice D is incorrect because though the underlined sentence describes several features of the map, it does not specifically describe how the map was used."},{"i":"cef79fb9","c":"func","d":"M","s":"The Bayeux Tapestry, from eleventh-century France, depicts 75 scenes over 250 feet of fabric. It was likely produced by workers embroidering in sections and then joining the resulting panels together. It’s plausible that the workshop that produced the tapestry had never produced one so large, and some researchers claim that a close examination of the joins—the places where the panels are stitched together—suggests that the workers developed and refined their joining process over the course of production. <u>For example, the first join the workers completed exhibits a clear misalignment of the borders of the two panels, whereas the later joins are virtually invisible.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It identifies the people and events depicted in the Bayeux Tapestry.","It supports an argument about the workers who produced the Bayeux Tapestry.","It compares the Bayeux Tapestry with other tapestries from eleventh-century France.","It describes how researchers determined where the Bayeux Tapestry was produced."],"a":1,"r":"Choice B is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The text discusses the Bayeux Tapestry, making the point that the workers who produced the huge tapestry in the eleventh century might not have ever produced a tapestry so large before. The text goes on to suggest that because of this lack of previous experience, the workers developed and refined the process of joining the tapestry’s panels over time as they worked. The last sentence of the text then provides an example of an observation that suggests the workers’ process changed: clear misalignment of the borders of the two panels the workers joined first and virtually invisible joins completed later. Thus, the underlined sentence serves to support an argument about the workers who produced the tapestry. Choice A is incorrect because the example given in the last sentence of the text has to do with how the panels of the Bayeux Tapestry were joined by the workers, not with what is depicted in those panels; the text never identifies any people or places depicted in the tapestry. Choice C is incorrect because the last sentence compares how early panels in the Bayeux Tapestry were joined with how later panels in the same tapestry were joined; it doesn’t make any comparison between the Bayeux Tapestry and other tapestries from the same time in France. Choice D is incorrect because the last sentence doesn’t address the location where the Bayeux Tapestry was created; the first sentence of the text presents it as a given that the tapestry was created in France, but nothing in the text indicates how that origin was determined."},{"i":"190857f0","c":"structure","d":"M","s":"Why do sand cats purr but lions roar? Researchers hypothesize that this difference between the two feline species may be partly due to a U- shaped bone in their throats called the hyoid. Sand cats, which are much smaller than lions, have a rigid hyoid that rumbles when the cat’s larynx vibrates, resulting in a purr. By contrast, lions have a somewhat flexible hyoid, and the bone is attached to the skull with a stretchy ligament that sand cats lack. These traits allow lions and most other species of big cats to produce powerful roars. The same traits may also prevent most big cats from purring.\n\nWhich choice best describes the overall structure of the text?","o":["The text presents a theory about two species, then discusses facts that weaken it.","The text compares the habitats of two species, then explains how those habitats are changing.","The text describes a behavior shared by two species, then discusses other behaviors shared by them.","The text poses a question about two species, then presents a possible answer."],"a":3,"r":"Choice D is the best answer because it best describes the overall structure of the text. The text begins by posing a question about two different cat species: \"Why do sand cats purr but lions roar?\" The remainder of the text then presents a possible answer to this question by explaining a hypothesis about differences in these cats’ hyoid bone structure. The text details how sand cats have rigid hyoids that produce purring sounds when their larynx vibrates, while lions have more flexible hyoids attached to the skull with a stretchy ligament that enables roaring but may prevent purring. Choice A is incorrect because the text doesn’t present facts that weaken the theory about two cat species; rather, it asks a question about two species and then discusses a potential answer. Choice B is incorrect because the text doesn’t discuss the habitats of sand cats and lions at all, nor does it mention any changes to their habitats. Choice C is incorrect because the text doesn’t describe a behavior shared by the two cat species mentioned. On the contrary, it specifically focuses on the different vocalization behaviors of each species (purring versus roaring) and why those differences may exist."},{"i":"96f3accc","c":"cross","d":"H","s":"Text 1 When the 50-second-long film Arrival of the Train—which depicts what its title says, a train pulling into a station—was first shown publicly in 1896, spectators, naïve to the new medium of film and seeing a train appearing to come directly at them, leaped from their seats and fled the room. This moment marks a major cultural shift: a new way of representing and seeing the world had arrived with that train, and nothing would ever be the same.\n\nText 2 The fact that there is no contemporary evidence that the first audience of Arrival of the Train was alarmed has not stopped the story from becoming canonical, even among film historians. But that phenomenon itself is highly revealing. Our belief that the coming of film was transformative is so strong that we invented and keep retelling a founding myth that divides cultural history into a (naïve) “before” and (sophisticated) “after.”\n\nBased on the texts, the author of\n\nText 2 would most likely agree with which statement about the description of the first showing of Arrival of the Train in\n\nText 1?","o":["It is more motivated by a perception of the significance of the invention of film than by facts.","It expresses a view about the transformative nature of film that film historians tend to regard as naïve.","It is not based on evidence and reflects film historians’ belief that they are more sophisticated than today’s audiences.","It reflects a misconception that is widely believed because it captures early film audiences’ sense that the new medium was alarming."],"a":0,"r":"Choice A is the best answer because it provides a statement about the description of the first showing of Arrival of the Train in Text 1 that, based on the texts, the author of Text 2 would most likely agree with. Text 1 indicates that members of the audience, unaccustomed to the new medium of film and believing that they were looking at a real oncoming train, allegedly reacted to the film with alarm. Text 1 then goes on to treat this anecdote as a factual account of the film’s first showing, interpreting it as a moment that marked a \"major cultural shift.\" In contrast, the author of Text 2 indicates that though the story of the film’s first showing has become \"canonical,\" or widely accepted, there is no contemporary evidence to support the idea that the audience reacted as Text 1 describes. Text 2 goes on to explain that this factually questionable description likely persists because it functions as a \"founding myth\" that reinforces a widespread belief in the profoundly transformative nature of the invention of film. This indicates that the author of Text 2 would likely see the description in Text 1 as motivated primarily by cultural perceptions about film’s significance rather than by documented historical facts. Choice B is incorrect because the author of Text 2 doesn’t suggest that film historians regard the view about film’s transformative nature as naïve. On the contrary, Text 2 states that the story of the first showing of Arrival of the Train has become \"canonical, even among film historians,\" indicating that historians broadly accept this narrative as a compelling illustration of film’s impact, not that they regard either the narrative or the views it conveys about the transformative nature of film as naïve. Text 2 refers to a \"(naïve) ‘before’\" in cultural history, but this is describing how the myth itself characterizes pre-film audiences, not how historians regard views about the transformative nature of film. Choice C is incorrect. While the author of Text 2 does indicate that the story of the audience’s reaction to Arrival of the Train described in Text 1 is a myth that lacks evidence, the text doesn’t suggest that the story reflects the fact that film historians believe themselves to be more sophisticated than modern audiences are. Rather, Text 2 suggests that the story persists because of a collective cultural belief, which historians share, in the profound impact of the invention of film. Moreover, the \"naïve\" versus \"sophisticated\" distinction mentioned in Text 2 refers to how the myth characterizes audiences before and after the invention of film; it doesn’t characterize modern audiences versus film historians. Choice D is incorrect. Although the author of Text 2 would agree that the description of the first showing of Arrival of the Train in Text 1 reflects a misconception, the author wouldn’t agree that widespread belief in the misconception can be attributed to the fact that it accurately captures early audiences’ actual sense of alarm. In fact, the misconception identified by the author of Text 2 concerns the accuracy of the audience’s alleged reaction; the author questions whether early audiences were alarmed at all, stating there is \"no contemporary evidence\" that they reacted in this way. According to Text 2, the description is widely believed not because it accurately captures historical reactions but because it serves as a \"founding myth\" that supports a belief in film’s transformative cultural impact."},{"i":"8fb67890","c":"main","d":"M","s":"Archaeologists have discovered a runestone in Norway that may contain the earliest example of written words in Scandinavia. Carbon dating at the discovery site revealed that the stone was likely carved between 1 and 250 CE. Runologist Kristel Zilmer believes the stone will be helpful in learning more about the use of runic alphabets in early Iron Age Scandinavia.\n\nWhich choice best states the main topic of the text?","o":["Battles of the Iron Age","A runestone found in Norway","A new method for dating rock samples","The research interests of Kristel Zilmer"],"a":1,"r":"Choice B is the best answer because it most accurately states the main topic of the text. The text begins by stating that archaeologists in Norway have discovered what may be the oldest known runestone (a stone with an inscription in the runic alphabets used in the region in ancient times). According to the text, the object was created between 1 and 250 CE. The text then mentions a researcher who comments on the runestone’s significance to the study of runic alphabets. Thus, the main focus throughout the text is a runestone found in Norway. Choice A is incorrect because the text mentions the Iron Age only to indicate the era when the runestone was created and when runic alphabets were in use; there’s no discussion of battles during this era. Choice C is incorrect because the text mentions the carbon dating method just once and does so only to indicate the age of the runestone; moreover, the text doesn’t suggest that this method is new. Choice D is incorrect. Although the text indicates that Zilmer is a runologist, or a scholar of runestones, it does so in a single sentence, so Zilmer’s scholarly interests are therefore not a primary focus of the text."},{"i":"602b47c7","c":"main","d":"M","s":"Biologists have predicted that birds’ feather structures vary with habitat temperature, but this hadn’t been tested in mountain environments. Ornithologist Sahas Barve studied feathers from 249 songbird species inhabiting different elevations—and thus experiencing different temperatures—in the Himalaya Mountains. He found that feathers of high-elevation species not only have a greater proportion of warming downy sections to flat and smooth sections than do feathers of low-elevation species, but high-elevation species’ feathers also tend to be longer, providing a thicker layer of insulation.\n\nWhich choice best states the main idea of the text?","o":["Barve’s investigation shows that some species of Himalayan songbirds have evolved feathers that better regulate body temperature than do the feathers of other species, contradicting previous predictions.","Barve found an association between habitat temperature and feather structure among Himalayan songbirds, lending new support to a general prediction.","Barve discovered that songbirds have adapted to their environment by growing feathers without flat and smooth sections, complicating an earlier hypothesis.","The results of Barve’s study suggest that the ability of birds to withstand cold temperatures is determined more strongly by feather length than feather structure, challenging an established belief."],"a":1,"r":"Choice B is the best answer. The text describes how Barve found an association between habitat temperature and feather structure among Himalayan songbirds, which supports the general prediction that birds’ feather structures vary with habitat temperature. Choice A is incorrect. Barve’s study isn’t said to contradict previous predictions. In fact, the study supports the prediction described in the first sentence, which is that birds’ feather structures vary with habitat temperature. Choice C is incorrect. Barve’s study isn’t said to “complicate an earlier hypothesis.” In fact, the study supports the earlier prediction described in the first sentence, which is that birds’ feather structures vary with habitat temperature. Choice D is incorrect. The text doesn’t compare the importance of feather length and feather structure, and it doesn’t say that Barve’s study challenges any established beliefs. In fact, the study supports the prediction described in the first sentence, which is that birds’ feather structures vary with habitat temperature."},{"i":"01989d77","c":"infer","d":"E","s":"Microbes that live in shallow lakes and ponds produce methane, a harmful greenhouse gas. Ecologist Ralf Aben and his team wanted to see how different types of shallow-water plants might affect the amount of methane that escapes into the atmosphere. Aben’s team set up some water tanks with soil and microbes from local ponds. Some tanks had a type of underwater plant that grows in the soil called watermilfoil. Other tanks had either duckweed, a type of plant that floats on the water’s surface, or algae. Aben and his team found that tanks with duckweed and algae released higher levels of methane than tanks with watermilfoil did. This finding suggests that ______ Which choice most logically completes the text?","o":["the presence of some kinds of underwater plants like watermilfoil helps prevent methane from escaping shallow lakes and ponds.","shallow lakes and ponds release more methane than deeper bodies of water because shallow bodies of water usually have more plants than deep bodies of water do.","shallow lakes and ponds are more likely to contain algae than to contain either watermilfoil or duckweed.","having a mix of algae, underwater plants, and floating plants is the best way to reduce the amount of methane in shallow lakes and ponds."],"a":0,"r":"Choice A is the best answer. The passage tells us that “tanks with duckweed (a floating plant) and algae released higher levels of methane than tanks with watermilfoil (an underwater plant) did.” This suggests that the presence of some kinds of underwater plants like watermilfoil may help prevent methane from escaping shallow lakes and ponds. Choice B is incorrect. The passage doesn’t mention deeper bodies of water at all, so there’s no basis for this inference. Choice C is incorrect. The passage doesn’t compare the likelihood of shallow lakes and ponds containing algae, watermilfoil, or duckweed. Choice D is incorrect. The study didn’t include any tanks with a mix of plants, so there’s no basis for this inference."},{"i":"4ba0695d","c":"infer","d":"H","s":"The alpaca was domesticated by Indigenous peoples in the Andes about 7,000 years ago. But which wild species did it descend from, the vicuña or guanaco? A research team led by Ruiwen Fan may have solved the mystery, concluding that the alpaca is the domesticated form of the vicuña but that the modern alpaca gets only 64 percent of its genetic material from its wild ancestor. The rest comes from the domesticated llama. The llama, meanwhile, gets 95.5 percent of its genetic material from its own wild ancestor, the guanaco, and the rest from the alpaca. The llama and alpaca apparently interbred widely for only a handful of generations between 400 and 600 years ago. Assuming that the findings of Fan’s team are valid, it can be inferred that ______ Which choice most logically completes the text?","o":["modern llama populations have a greater degree of genetic diversity, on average, than modern alpaca populations do.","the domestication process of the alpaca may have involved some introduction of genetic material from the llama.","the period of interbreeding resulted in a greater genetic difference between alpacas and their wild ancestors than between llamas and their wild ancestors.","if they were subjected to genetic testing, modern populations of guanacos and vicuñas would likely show traces of ancient interbreeding as well."],"a":2,"r":"Choice C is the best answer because it presents the inference that most logically follows from the text’s discussion of the genetic material of alpacas. The text states that modern alpacas get only 64 percent of their genetic material from their wild ancestor (the vicuña), while llamas get 95.5 percent of their genetic material from their wild ancestor (the guanaco). These data imply that relative to llamas, alpacas have experienced a much greater genetic shift away from their wild ancestors (36 percent of their genetic material derives from another source, compared to 4.5 percent of llamas’ genetic material). Moreover, the text establishes that the remainder of alpacas’ genetic material derives from llamas, and the remainder of llamas’ genetic material derives from alpacas, reflecting a period of interbreeding. Taken together, these details support the inference that the period of interbreeding had a more significant impact on the genetic material of alpacas than on that of llamas, thereby reducing the percentage of alpacas’ genetic material that derives from wild ancestors and placing alpacas at a greater remove from these ancestors. Choice A is incorrect because the text doesn’t provide information about genetic diversity within modern llama and alpaca populations. While the text discusses the percentage of genetic material each domesticated species inherited from its wild ancestor and from interbreeding, it does not address the level of genetic variation within each species. Therefore, it isn’t logical to infer that modern llama populations have a greater degree of genetic diversity than modern alpaca populations do. Choice B is incorrect because it contradicts the chronology presented in the text. The text states that alpacas were domesticated about 7,000 years ago, but the interbreeding with llamas occurred \"between 400 and 600 years ago.\" The genetic mixing happened thousands of years after domestication, not during it; in addition, the text does not provide details about what the process of domestication might entail. Therefore, it isn’t logical to infer that llama genetic material was introduced during the domestication process of alpacas. Choice D is incorrect because though the text notes that guanacos and vicuñas contributed to the genetic material of alpacas and llamas, it only discusses alpacas’ and llamas’ genetic composition. Therefore, the text does not support the inference that modern populations of guanacos and vicuñas would likely show traces of ancient interbreeding."},{"i":"08ff903e","c":"claim","d":"E","s":"A museum curator is writing a biographical statement about Trinidadian-born Chinese dancer, choreographer, and teacher Dai Ailian for a new exhibit on Chinese dance. The curator claims that some of the pieces Dai created shortly after arriving in mainland China in 1941, such as the solo dance Yao Drum, reflect a desire to represent the dances of local communities Dai visited during her travels through China.\n\nWhich quotation from a work by a dance historian would be the most effective evidence for the curator to include in support of this claim?","o":["“There is no sound or music accompanying Dai’s movements in Yao Drum, aside from the sounds of drumsticks beating against a drum and against each other.”","“Unlike some of the works Dai created in the early 1940s, Yao Drum does not feature a narrative structure, humorous elements, or references to real-life events.”","“Yao Drum was inspired by a ceremonial dance Dai witnessed during her time performing field research among the Yao people in the province of Guizhou in 1941 or 1942.”","“Yao Drum is notable for its intense physicality, with Dai performing sharp jumps, swift turns, and dramatic sweeps of her legs through the air as she moves in circles on the stage.”"],"a":2,"r":"Choice C is the best answer. This choice clearly states that Yao Drum was inspired by a ceremonial dance of the Yao people. This directly supports the curator’s claim that some of Dai’s pieces “represent the dances of local communities” she visited. Choice A is incorrect. This choice discusses the sound and music in Yao Drum, but it doesn’t connect these elements to “the dances of local communities,” which is the focus of the claim. Choice B is incorrect. This choice doesn’t mention the dances of local communities, but instead discusses how Yao Drum is different from some of Dai’s earlier works. Choice D is incorrect. This choice describes the choreography of Yao Drum, but it doesn’t connect these elements to “the dances of local communities,” which is the focus of the claim."},{"i":"03e5cf33","c":"claim","d":"M","s":"Many insects are iridescent, or have colors that appear to shimmer and change when seen from different angles. Scientists have assumed that this feature helps to attract mates but could also attract predators. But biologist Karin Kjernsmo and a team had the idea that the shifting appearance of colors might actually make it harder for other animals to see iridescent insects. To test this idea, the team put beetle forewings on leaves along a forest path and then asked human participants to look for them. Some of the wings were naturally iridescent. Others were painted with a nonchanging color from the iridescent spectrum, such as purple or blue.\n\nWhich finding, if true, would most directly support the team’s idea?","o":["On average, participants found most of the purple wings and blue wings and far fewer of the iridescent wings.","On average, participants found the iridescent wings faster than they found the purple wings or blue wings.","Some participants reported that the purple wings were easier to see than the blue wings.","Some participants successfully found all of the wings on the leaves."],"a":0,"r":"Choice A is the best answer because it presents the finding that, if true, would most strongly support the research team’s idea about the effect of iridescence, or colors that appear to shimmer and change. The text indicates that although some scientists have assumed that iridescence could attract predators, Kjernsmo’s team wondered if iridescent insects might be harder for other animals to see. The team tested this idea by asking human participants to look for both iridescent beetle wings and beetle wings that weren’t iridescent but that had been painted colors such as purple or blue. If participants located most of the purple or blue wings but far fewer of the iridescent wings, that finding would support the team’s idea since it would suggest that noniridescent wings are easier to see than iridescent wings. Choice B is incorrect because if participants located the iridescent wings more quickly than the purple or blue wings, that finding would weaken the team’s idea, not support the team’s idea, since it would suggest that the iridescent wings were easier to see than the noniridescent wings. Choice C is incorrect because finding that some participants believed that the purple wings were easier to see than the blue wings would be irrelevant to the team’s idea. The purple and blue wings were both noniridescent, so any difference in how easy those two colors were to see would have nothing to do with the idea that iridescent insects are harder to see than noniridescent insects. Choice D is incorrect because if some participants found all the wings, that wouldn’t support the team’s idea that iridescent insects may be harder to see than noniridescent insects. If anything, this finding might weaken the team’s idea since it could suggest that iridescence had no effect on how difficult the wings were to see."},{"i":"54be8f96","c":"graph","d":"H","s":"","o":["1.51 days, which is the shortest rotational period of any of the TRAPPIST planets.","6.1 days, and its rotational period is also 6.1 days.","9.21 days, which is the same as the rotational period of TRAPPIST -1f.","6.1 days, and its rotational period is 0.92 days."],"a":1,"r":"Choice B is the best answer because it correctly uses data from the table to illustrate the relationship between orbital and rotational periods described in the text. For Earth and each of four TRAPPIST -1 exoplanets, the table provides the orbital period and radius (in relation to the radius of Earth). The text explains that for each TRAPPIST -1 exoplanet, gravitational forces cause the rotational period (how long the planet takes to spin once on its axis) to equal the orbital period (how long the planet takes to orbit the star). According to the table, TRAPPIST -1e has an orbital period of 6.1 days. Since the text states that the orbital and rotational periods are equal for these planets, TRAPPIST -1e’s rotational period must also be 6.1 days. Choice A is incorrect because the table shows that TRAPPIST -1e has an orbital period (and thus a rotational period) of 6.1 days, not 1.51 days, which is the orbital period (and thus the rotational period) of TRAPPIST -1b. Furthermore, comparing the length of TRAPPIST -1e’s rotational period to those of the other exoplanets would not logically complete the example, which should illustrate how the orbital and rotational periods of a planet in TRAPPIST -1 are the same length. Choice C is incorrect because the table shows that TRAPPIST -1e has an orbital period (and thus a rotational period) of 6.1 days, not 9.21 days, which the table shows is the orbital period (and thus rotational period) of TRAPPIST -1f. Additionally, comparing the rotational periods of two exoplanets would not logically complete the example, which should illustrate how the orbital and rotational periods of a planet in TRAPPIST -1 are the same length. Choice D is incorrect because although it correctly identifies TRAPPIST -1e’s orbital period as 6.1 days, it incorrectly states that its rotational period is 0.92 days. This contradicts the text’s statement that the orbital and rotational periods are equal for TRAPPIST -1 exoplanets. The value 0.92 actually represents TRAPPIST -1e’s radius in relation to Earth’s radius, not its rotational period."},{"i":"24c1b7e4","c":"graph","d":"H","s":"","o":["The periods of undivided Congresses were associated with increases in nondefense outlays, whereas all the periods of divided Congresses except one were associated with reductions in defense outlays.","All the periods of divided Congresses were associated with reductions in total outlays, although two periods were also associated with increases in nondefense outlays.","The periods of undivided Congresses were associated with increases in total outlays, whereas all the periods of divided Congresses were associated with reductions in either nondefense outlays or defense outlays.","All the periods of divided Congresses except one were associated with reductions in total outlays, whereas the periods of undivided Congresses were associated with increases in total outlays."],"a":3,"r":"Choice D is the best answer. The claim is that divided Congresses are necessary but insufficient—that is, we need divide Congresses, but they are not enough—to decrease government size, as measured by total federal outlays. This choice accurately expresses the supporting data from the “change in total outlays” part of the graph. Within the data set, divided Congresses sometimes decreased total outlays, but undivided ones never did. Choice A is incorrect. The claim is only about government size, as measured by total federal outlays—defense and nondefense outlays aren’t relevant. Choice B is incorrect. The claim is only about government size as measured by total federal outlays—nondefense outlays aren’t relevant. Choice C is incorrect. The claim is only about government size as measured by total federal outlays—specific information about defense or nondefense outlays isn’t relevant."},{"i":"f768090a","c":"fss","d":"H","s":"Walt Whitman’s Leaves of Grass first appeared in 1855 as a slim collection of twelve poems, but Whitman would revise and expand it substantially over the next four decades. These extensive ______ the addition of hundreds of new poems, the removal of some existing ones, and the insertion of prefatory material, reflected the poet’s evolving literary perspective and experience of the US Civil War.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["changes, including","changes would include","changes included","changes, include"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite present participle \"including\" is correctly used to form a supplementary element that interrupts the main clause \"These extensive changes…reflected the poet’s evolving literary perspective and experience of the US Civil War.\" This supplementary element, offset by commas after \"changes\" and \"material,\" provides examples of the changes Whitman made to Leaves of Grass. Choice B is incorrect because it results in an ungrammatical sentence. The finite modal verb \"would include\" can’t be used in this way to form a supplementary element within the main clause. Choice C is incorrect because it results in an ungrammatical sentence. The finite past tense verb \"included\" can’t be used in this way to form a supplementary element within the main clause. Choice D is incorrect because it results in an ungrammatical sentence. The finite present tense verb \"include\" can’t be used in this way to form a supplementary element within the main clause."},{"i":"f4fd123c","c":"fss","d":"H","s":"The African Games Co-production Market, one of over 180 annual international conferences supporting video game development, ______ the growth of the African gaming industry by helping start-up studios in Africa find partners.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["promote","are promoting","promotes","have promoted"],"a":2,"r":"Choice C is the best answer. The subject of the sentence is “The African Games Co-production Market.” That’s one market, so it’s a singular noun, which means it needs a singular verb. “Promotes” is the only singular verb among the choices. Choice A is incorrect. This choice creates a subject-verb agreement error. The subject “The African Games Co-production Market” is singular, but the verb “promote” is plural. Choice B is incorrect. This choice creates a subject-verb agreement error. The subject “The African Games Co- production Market” is singular, but the verb “are promoting” is plural. Choice D is incorrect. This choice creates a subject-verb agreement error. The subject “The African Games Co-production Market” is singular, but the verb “have promoted” is plural."},{"i":"5b8f9cf2","c":"fss","d":"H","s":"In the canon of North African literature, Moroccan author Driss Chraïbi’s 1954 novel The Simple Past (Le Passé simple) looms large. A coming-of- age story, a social meditation, and a sober gaze into the dark maw of French colonialism, ______ interrogates systemic power with memorable intensity.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Morocco gained its independence two years before the publication of Chraïbi’s debut novel, which","Chraïbi’s debut novel, published two years before Morocco gained its independence,","Chraïbi wrote a debut novel that, published two years before Morocco gained its independence,","published two years before Morocco gained its independence, Chraïbi wrote a debut novel that"],"a":1,"r":"Choice B is the best answer. Subject-modifier placement requires a modifier and its subject to be next to each other. The subject of the modifier \"a coming-of-age story…colonialism\" is Chraïbi’s novel The Simple Past, so the subject \"Chraïbi’s debut novel\" fits perfectly after this introductory modifying phrase. Choice A is incorrect. Modifiers and their subjects must go next to each other. The introductory modifier \"a coming-of-age story…colonialism\" is describing Chraïbi’s novel, not Morocco. However, this choice places Morocco directly next to that modifier. Choice C is incorrect. Modifiers and their subjects must go next to each other. The introductory modifier \"a coming-of-age story…colonialism\" all describes Chraïbi’s novel, not Chraïbi himself. However, this choice places Chraïbi directly next to that modifier. Choice D is incorrect. Modifiers and their subjects must go next to each other. The modifier \"a coming-of-age story…\" is describing Chraïbi’s novel, so that needs to be the subject immediately after the modifier. This choice adds another modifier that describes Chraïbi’s novel, but then puts \"Chraïbi\" himself—not the novel—right after that modifier, which doesn’t make sense. Chraïbi wasn’t \"published two years before\" Moroccan independence; his novel The Simple Past was."},{"i":"2c9c6ca9","c":"bound","d":"H","s":"The term “retroflex” derives from Latin and means “bent back,” an apt descriptor for the branch of consonants—retroflex consonants— pronounced with the tongue curling up and back in the mouth. In many languages, including English, these consonants are ______ in some dialects of Mandarin, however, four such consonants (“ch,” “sh,” “zh,” and “r”) are relatively common.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["rare and","rare,","rare","rare;"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation within a sentence. This choice uses a semicolon in a conventional way to join the first main clause (\"In many…rare\") and the second main clause (\"in some…common\") in this sentence. Choice A is incorrect. Joining the first main clause (\"In many…rare\") and the second main clause (\"in some...common\") with the conjunction \"and\" conflicts with the use of \"however\" later in the sentence, resulting in a confusing and illogical sentence. Choice B is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice C is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."},{"i":"d073983d","c":"bound","d":"M","s":"Known for her massive photorealistic paintings of African American figures floating or swimming in pools, Calida Garcia ______ was the logical choice to design the book cover for Ta-Nehisi Coates’s The Water Dancer, a novel about an African American man who can travel great distances through water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Rawles—","Rawles:","Rawles,","Rawles"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation between a subject and a verb. When, as in this case, a subject (“Calida Garcia Rawles”) is immediately followed by a verb (“was”), no punctuation is needed. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice C is incorrect because no punctuation is needed between the subject and the verb."},{"i":"1d79a59d","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Leaders of the Province of Guatemala proclaimed independence for Central America from the Spanish Empire on September 15, 1821. The accompanying Declaration of Independence was written by Honduran scholar and politician José Cecilio del Valle. The 1812 Spanish Constitution had provided some degree of independence for Central America, but it was repealed by the Spanish king in 1814. Valle, a loyal advisor to the Spanish Empire’s administrators in Central America, had long opposed independence. He changed his mind after Colonel Rafael del Riego’s 1820 revolt, which demanded the return of rights lost in 1814. The student wants to place the 1821 Declaration of Independence in the context of Valle’s changing political beliefs.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Colonel Riego’s revolt was the inspiration that Valle, a long-standing opponent of Central American independence, needed to change his political beliefs.","Long an opponent of Central American independence, Valle changed his mind after an 1820 revolt and wrote the 1821 declaration.","A change in Valle’s political beliefs that occurred when the Spanish king repealed the 1812 constitution led to Valle writing Central America’s Declaration of Independence.","The writing of Central America’s Declaration of Independence may not have happened were it not for Colonel Riego’s 1820 revolt."],"a":1,"r":"Choice B is the best answer. The sentence places the Declaration of Independence in the context of Valle’s changing political beliefs, noting that Valle was long an opponent of Central American independence but changed his mind after an 1820 revolt and then wrote the Declaration of Independence in 1821. Choice A is incorrect. The sentence states that Valle’s political beliefs changed after Riego’s revolt but doesn’t indicate how these changed beliefs provide context for the 1821 Declaration of Independence. Choice C is incorrect because it misrepresents information from the notes. Valle’s political beliefs changed after Riego’s 1820 revolt, not when the Spanish king repealed the 1812 constitution. Choice D is incorrect. While the sentence indicates a relationship between Colonel Riego’s 1820 revolt and Central America’s Declaration of Independence, it doesn’t mention Valle’s changing political beliefs."},{"i":"bc56170b","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Most, but not all, of the Moon’s oxygen comes from the Sun, via solar wind. Cosmochemist Kentaro Terada from Osaka University wondered if some of the unaccounted-for oxygen could be coming from Earth. In 2008, he analyzed data from the Japanese satellite Kaguya. Kaguya gathered data about gases and particles it encountered while orbiting the Moon. Based on the Kaguya data, Terada confirmed his suspicion that Earth is sending oxygen to the Moon. The student wants to emphasize the aim of the research study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["As it orbited the Moon, the Kaguya satellite collected data that was later analyzed by cosmochemist Kentaro Terada.","Before 2008, Kentaro Terada wondered if the Moon was receiving some of its oxygen from Earth.","Cosmochemist Kentaro Terada set out to determine whether some of the Moon’s oxygen was coming from Earth.","Kentaro Terada’s study determined that Earth is sending a small amount of oxygen to the Moon."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes the aim, or goal, of the research study, noting what Terada set out to do: determine whether some of the Moon’s oxygen was coming from Earth. Choice A is incorrect. The sentence focuses on how the Kaguya satellite collected data; it doesn’t emphasize the aim of the research study. Choice B is incorrect. While the sentence mentions what Terada was curious about before conducting the research study, it doesn’t emphasize his study’s aim. Choice D is incorrect. The sentence presents the research study’s conclusion; it doesn’t emphasize the study’s aim."},{"i":"17e49403","c":"trans","d":"M","s":"When, in the 1800s, geologists first realized that much of Earth had once been covered by great sheets of ice, some theorized that the phenomenon was cyclical, occurring at regular intervals. Each Ice Age is so destructive, though, that it largely erases the geological evidence of its predecessor. ______ geologists were unable to confirm the theory of cyclical Ice Ages until the 1960s.\n\nWhich choice completes the text with the most logical transition?","o":["Hence,","Moreover,","Nevertheless,","Next,"],"a":0,"r":"Choice A is the best answer. “Hence” logically signals that the information in this sentence—that geologists couldn’t confirm the theory of cyclical Ice Ages until the 1960s—is a consequence of the previous information about the destructiveness of each Ice Age and the erasure of necessary geological evidence. Choice B is incorrect because “moreover” illogically signals that the information in this sentence is merely additional to the previous information about the destructiveness of each Ice Age. Instead, the sentence identifies a specific consequence of that information. Choice C is incorrect because “nevertheless” illogically signals that the information in this sentence is true despite the previous information about the destructiveness of each Ice Age. Instead, the sentence identifies a specific consequence of that information. Choice D is incorrect because “next” illogically signals that the information in this sentence is the next step in a process. Instead, the sentence identifies a specific consequence of the previous information."},{"i":"a6155e60","c":"trans","d":"E","s":"Every chemical compound has a spectroscopic fingerprint, a pattern of reflected light unique to that compound. ______ upon analyzing the light reflected by the bright regions on the surface of the dwarf planet Ceres, Maria Cristina De Sanctis of Rome’s National Institute of Astrophysics was able to determine that the regions contain large amounts of the compound sodium carbonate.\n\nWhich choice completes the text with the most logical transition?","o":["Regardless,","Meanwhile,","Thus,","In comparison,"],"a":2,"r":"Choice C is the best answer. “Thus” logically signals that the action described in this sentence—the researcher being able to determine the chemical makeup of the planet’s bright regions based on how they reflect light—is a result or consequence of the previous information about spectroscopic fingerprints. Choice A is incorrect because “regardless” illogically signals that the action described in this sentence occurs despite the previous information about spectroscopic fingerprints. Instead, the finding in this sentence is a result or consequence of that information. Choice B is incorrect because “meanwhile” illogically signals that the action described in this sentence either occurs at the same time as or offers an alternative to the previous information about spectroscopic fingerprints. Instead, the finding in this sentence is a result or consequence of that information. Choice D is incorrect because “in comparison” illogically signals that the action described in this sentence is being compared with the previous information about spectroscopic fingerprints. Instead, the finding in this sentence is a result or consequence of that information."}],"img":{"54be8f96":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEyBAMAAADqxh5FAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA3NElEQVR42u1dZ3gUVRd+7+xsNglJ9k4KHTIbEFSEbAgdgQlFipRFQEAQlqKgoCwWQEFZFBBUZOmKqAtIB4n0EiB0pC5NVEiyoYiUZO+GmrJ7vx8JECCBEMoXwr7PkyezM3duee+ZM+ecOXMH8MADDzzwwAMPPCiAkHR37qG3NoX2NFAKJBIFABJIIVEQBFKik2QAQNYhAEA5ekdFgTSnBlX6m8cDszYigSBaOOl1nzDf9luHFbd+eG+j4xxxbeK2QzyNBnE7xIzjxs/EuGNe8a6jpM5MguFxf94s/OatWQEAiHF/kpu7bm15WwAZoBBdcWYAEOQuQP/CyS45KJwJDBMaIawRSCTCqu2kEYhEUBSAxqhrBobRMrSNrLlG66HNc7FqZ/8AY0tFdQpCzEzgUxCBBiESgc+hC8rLQpieRKK/QRUFlDU2MKj0QpgSJAtBMq0mC+VRjYq1zfBeIUQRqKOpLOqFsBYTuwRjdLD85AYtPrmmtO6tlYZMNZSprC1zfODk+qXK63v3/ursufAEu8+glgmNzGCs8taNQeUny1psqM3ST4LT2WXcDribWAGAF+/YocOgsxtbqRd7zbnQfn5GhyErG16qpCTYw61iy2m006qTtpebrPKr+uvFJivDvzp6MfAkyld7twqPBWUpu+K7rF0WeXxIyMBpZeoURuk9XfNyuP4vjX2hl3OBaP9GNxdH6tM/TxfX4
