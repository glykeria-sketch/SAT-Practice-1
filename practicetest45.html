<script>
const D={"t":"Practicetest45","q":[{"i":"571cf537","c":"vocab","d":"H","s":"The author’s claim about the relationship between Neanderthals and Homo sapiens is ______, as it fails to account for several recent archaeological discoveries. To be convincing, his argument would need to address recent finds of additional hominid fossils, such as the latest Denisovan specimens and Homo longi.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["disorienting","tenuous","nuanced","unoriginal"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the author’s claim about the relationship between Neanderthals and Homo sapiens. As used in this context, “tenuous” means lacking substance. The end of the first sentence states that the author’s claim didn’t consider certain key pieces of evidence—“recent archaeological discoveries”—and is therefore weak. Choice A is incorrect because it wouldn’t make sense in context to refer to the author’s claim as “disorienting,” or confusing. The text suggests that the author’s claim is insubstantial, not that it’s difficult to grasp. Choice C is incorrect because referring to the claim as “nuanced,” or subtle, wouldn’t make sense in context. According to the text, the claim is incomplete because it didn’t consider certain key information about recent archaeological finds; it doesn’t suggest that what’s in the claim lacks precision. Choice D is incorrect because saying that the claim is “unoriginal,” or imitative, wouldn’t make sense in context. The text faults the claim because it doesn’t consider certain key information about recent archaeological finds; it doesn’t suggest that the author’s claim lacks originality."},{"i":"4830ab87","c":"vocab","d":"M","s":"The way in which individual elements are balanced within a photographic image tends to affect how viewers perceive it: symmetry tends to give the elements equal importance, asymmetry emphasizes differences, and radial balance (organizing the elements around a central point) emphasizes the center over the periphery. What a photograph conveys is therefore largely ______ how it is balanced.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["inhibited by","contingent on","obligated to","reserved for"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of visual balance in photography. In this context, \"contingent on\" means conditional upon, or determined by. The text indicates that different ways of balancing elements in a photograph convey different ideas to viewers (for example, symmetrical composition tends to emphasize similarity among elements, whereas asymmetry tends to emphasize difference). Thus, there is a strong connection between what a photograph conveys and how its elements are balanced. Therefore, what a photo conveys is contingent on how it is balanced. Choice A is incorrect. In this context, \"inhibited by\" most nearly means hindered or undermined by. The text indicates that different ways of balancing elements in a photograph convey different ideas to viewers, thereby indicating a relationship between image balance and what is conveyed. Although this explanation is consistent with a photographer choosing asymmetrical balance even while intending to convey similarity (associated with symmetrical balance), there is nothing to indicate that messages generally are inhibited by balance. Rather the implication is that balance is a tool photographers can use to craft their messages. Choice C is incorrect. In this context, \"obligated to\" means duty bound toward or answerable to. In context, it would not make sense to assert that a photograph’s message is obligated to how that photograph is balanced. Choice D is incorrect. In this context, \"reserved for\" most nearly means solely available to someone or held aside for some purpose. The text as a whole does not support the claim that a photograph’s message is reserved for how that photograph is balanced."},{"i":"e8fb0744","c":"vocab","d":"H","s":"As an undergraduate researcher in anthropology, Jennifer C. Chen contributed to a groundbreaking study challenging the accepted view that among prehistoric peoples, female participation in hunting was ______. The research team’s review of data from late Pleistocene and early Holocene burials in the Americas revealed that, in fact, as many as half of the hunters in those populations were female.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["inevitable","satisfactory","negligible","commonplace"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the study of female participation in hunting among prehistoric peoples. In this context, “negligible” means not significant enough to be worth considering. The text says that the study challenged the accepted view of female participation in hunting among prehistoric peoples. The text goes on to say that the researchers found that “in fact, as many as half” the hunters in the groups studied were female. The phrase “in fact” establishes a contrast indicating that the finding that as many as half the hunters were female differs from the accepted view. This context suggests, then, that the accepted view is that female participation in hunting was negligible. Choice A is incorrect because the text indicates that the study challenged the accepted view by showing that as many as half of hunters among prehistoric peoples were female, which suggests that the accepted view is that female participation was low, not that female participation was “inevitable,” or unavoidable. Nothing in the text suggests that the accepted view is that prehistoric peoples could not avoid female participation in hunting. Choice B is incorrect because nothing in the text suggests that the accepted view of female participation in hunting among prehistoric peoples is that such participation was “satisfactory,” or sufficient to meet a requirement or demand. There is no information in the text about any demands or requirements regarding female participation in hunting, let alone any information about how much female participation in hunting would be enough to satisfy those demands or requirements. Instead, the text indicates that the study challenged the accepted view by showing that as many as half the hunters in the groups studied were female, suggesting that the accepted view is that female participation in hunting was low. Choice D is incorrect because the text indicates that the study challenged the accepted view by showing that as many as half of hunters among the prehistoric peoples studied were female, which suggests that the accepted view is that female participation was low, not that female participation was “commonplace,” or ordinary or unremarkable. Although the study under discussion suggests that female participation may have been commonplace, that study is presented as challenging the accepted view, not as reinforcing the accepted view."},{"i":"f0be91b2","c":"vocab","d":"M","s":"Drivers who strongly believe that the toll they must pay to use the Lewis and Clark Bridge, which spans the Ohio River to connect Indiana and Kentucky, is currently too high are unlikely to be ______ a proposal to increase the toll. Advocates for a higher toll are likely to have more success if they instead direct their arguments toward a more persuadable segment of the population.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["receptive to","apprised of","incensed by","cited in"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of driver attitudes toward a toll increase. In this context, \"receptive to\" would mean open to or willing to consider something. The text focuses on drivers who think the current toll for the Lewis and Clark Bridge is too high, suggesting that advocates for increasing that toll would have better success presenting their arguments to \"a more persuadable segment of the population\" rather than to those drivers. This context suggests that the drivers who strongly believe the toll is already too high are not persuadable—that is, that they are unlikely to be willing to consider the toll-increase proposal. Choice B is incorrect because \"apprised of\" means informed about or made aware of something, and nothing in the text suggests that the drivers who think a toll is already too high wouldn’t be informed of a proposal for an even higher toll; in fact, the text implies that advocates of the proposal would \"direct their arguments\" in favor of the increase to those drivers, even though they would likely be more successful focusing on people who are more open to hearing their arguments. Choice C is incorrect. In this context, \"incensed by\" would mean angered or outraged by something. The text focuses on drivers who feel that a current toll is too high, and it wouldn’t make sense to suggest that those drivers would be unlikely to be angered by a proposal for the toll to be increased; indeed, drivers who think the toll is already too high likely would be angered by a move to raise it even higher. Choice D is incorrect. In this context, \"cited in\" would mean referred to or mentioned in something. Although it’s reasonable to suggest that a proposal to raise a toll might not make any mention of drivers who think the toll is already too high, the text focuses on how those drivers and other people are likely to react to arguments in favor of the proposal, not on whether those drivers would be cited in the proposal itself."},{"i":"47904792","c":"purpose","d":"E","s":"Animals use many objects as tools to achieve goals more easily. Such goals include grooming, finding food, and protecting themselves. For a long time, people thought tool use was unique to primates. Dolphins and other animals, though, have busted the myth that tool use requires hands. Inventively, dolphins use sponges to protect their noses from scratches when foraging on the seafloor. Palm cockatoos also get creative. They use leaves to pad their beaks when opening nuts.\n\nWhich choice best states the main purpose of the text?","o":["To question the belief that birds are intelligent","To compare tool use in humans with tool use in palm cockatoos","To establish that tool use doesn’t indicate intelligence","To argue that a variety of animals use tools"],"a":3,"r":"Choice D is the best answer because it most accurately states the main purpose of the text. The text first states that animals make use of objects as tools to help them achieve different goals. The text then explains that although people used to think only primates use tools, tool use by dolphins (aquatic mammals) and palm cockatoos (birds) has shown that primates are not the only animals that use tools. Thus, the main purpose of the text is to argue that a variety of animals, not just primates, use tools. Choice A is incorrect because the text doesn’t mention intelligence at all, focusing just on the idea that animals use tools. Further, the text mentions one kind of bird (palm cockatoos) only as an example of a non-primate that uses tools and describes its use of tools as creative, not unintelligent. Choice B is incorrect. Although the text mentions tool use in primates (a group that includes humans) and in palm cockatoos, it doesn’t compare humans’ tool use with palm cockatoos’ tool use. The text mentions palm cockatoos only as one example out of the variety of animals that use tools and never directly mentions tool use in humans. Choice C is incorrect because the text discusses tool use but never makes any mention of intelligence. Rather than establishing that tool use doesn’t indicate intelligence, the text describes certain tool use as inventive and creative."},{"i":"0b5ecf0e","c":"purpose","d":"H","s":"During Rome’s republican period, which ended in the first century BCE, libraries were predominantly owned by wealthy individuals who tightly controlled access to their book collections. The first public library became available in Rome in 28 BCE and was soon followed by one commissioned by Emperor Augustus. As modern scholar Fabio Fernandes notes, however, these two traditions aren’t as distinct as they seem, as both the emperor and the private library owners viewed their libraries as extensions of their personal patronage, just on vastly differing scales.\n\nWhich choice best states the main purpose of the text?","o":["To give a brief overview of public access to libraries throughout Rome’s republican period","To contend that early imperial leaders in Rome wielded too much influence over libraries","To assert that private and early public libraries in ancient Rome had an essential similarity","To call into question the notion that private Roman libraries disappeared during the first century BCE"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text. The text describes two types of libraries in first- century BCE Rome—private libraries controlled by wealthy individuals, and the public libraries like that commissioned by Emperor Augustus—and then notes that \"these two traditions aren’t as distinct as they seem.\" It explains that both private-library owners and the emperor saw their libraries as \"extensions of their personal patronage, just on vastly differing scales,\" because the emperor’s patronage extended to the whole citizenry of Rome. Thus, both private and public libraries in ancient Rome were fundamentally tied to relevant principles of patronage. Choice A is incorrect because the text mentions that Rome’s republican period only to say that it \"ended in the first century BCE,\" thus it doesn’t support any conclusions about possible occurrences \"throughout Rome’s republican period.\" Choice B is incorrect. The text neither discusses \"early imperial leaders in Rome,\" nor whether their level of influence was appropriate. Rather it discusses the end of \"Rome’s republican period\" in relation to libraries, who created them, and who got to use them without passing judgment on propriety. Choice D is incorrect. Although the text indicates that Rome’s republican period \"ended in the first century BCE,\" a period that also saw the first public library come into use (28 BCE), nothing in the text suggests that private libraries disappeared at that time."},{"i":"df45f0eb","c":"func","d":"H","s":"<u>Several studies have found negligible electoral consequences for governments that impose fiscal austerity measures, yet some European governments recently suffered electorally due to their austerity programs.<\/u> Evelyne Huebscher and colleagues attribute this incongruity to governments’ tendency—not followed in the recent European cases—to implement austerity programs strategically to avoid electoral costs (e.g., setting spending cuts to take effect only after the next election), which has obscured the inherent political risks of austerity measures in the election data scholars have examined.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It explains a discrepancy between what has been observed in study settings and what has been observed in real-world settings that the text goes on to assert is attributable to the studies not using real-world data.","It identifies a conflict between research findings and recent events that the text goes on to suggest is a consequence of a complicating factor in the data used to generate those findings.","It presents a long-standing divergence in research findings that the text goes on to say is due to different groups of researchers using data that derive from different electoral circumstances.","It describes a recent exception to a general pattern in research findings that the text goes on to explain is a result of researchers underestimating the significance of inconsistencies in the data they’ve analyzed."],"a":1,"r":"Choice B is the best answer because it best describes how the underlined sentence functions in the text as a whole. The underlined sentence explains that contrary to what several studies would suggest, recent European governments suffered electorally after the launch of fiscal austerity programs. The text goes on to indicate that the researchers generated their findings from data that didn’t reveal the true political risk of austerity measures because the data were based on cases in which governments had set austerity programs to take effect after the next election, a practice the European governments that recently suffered electorally didn’t adhere to, thus introducing a complicating factor resulting in a conflict between the research findings and recent events. Choice A is incorrect because the underlined sentence doesn’t indicate that the discrepancy described in the text is between observations made in study settings and observations made in real-world settings. Rather, the underlined sentence indicates that the outcome of recent events is contrary to what would be expected based on the findings of several studies. Additionally, there is nothing in the text to suggest that the studies mentioned did not use real-world data; instead, the text indicates that the data used was generated under potentially different circumstances than the recent events. Choice C is incorrect because the underlined sentence doesn’t present a long-standing divergence in research findings but rather a discrepancy between past research findings and recent events that the text goes on to attribute to researchers’ use of data that didn’t reveal the true political risk of austerity measures. Choice D is incorrect because while the underlined sentence notes that there have been some recent exceptions to a general pattern observed in several research studies, it does not go on to attribute this exception to the researchers underestimating inconsistencies in the data. Rather, the text goes on to attribute this to a circumstance (fiscal austerity measures being implemented before an election rather than after) which adds a complicating factor into the data not accounted for in past studies."},{"i":"54c6128b","c":"func","d":"M","s":"When ancient oak planks were unearthed during subway construction in Rome, Mauro Bernabei and his team examined the growth rings in the wood to determine where these planks came from. By comparing the growth rings on the planks to records of similar rings in oaks from Europe, the team could trace the wood to the Jura region of France, hundreds of kilometers from Rome. <u>Because timber could only have been transported from distant Jura to Rome by boat, the team’s findings suggest the complexity of Roman trade routes.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It presents a conclusion about Roman trade routes based on the team’s findings.","It questions how the team was able to conclude that the planks were used to build a boat.","It explains why the planks were made from oak rather than a different kind of wood.","It describes common methods used in Roman subway construction."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence explains that Bernabei and his team studied growth rings to obtain information about the ancient oak planks found during a construction project in Rome. The next sentence presents what the researchers learned: the wood from the planks came from France’s Jura region, which is far from Rome. The underlined sentence then presents the implications of the findings about the planks: the wood must have been brought to Rome by boat, a difficult task that suggests Roman trade routes were complex. Thus, the underlined sentence mainly functions to present a conclusion about Roman trade routes based on the team’s findings. Choice B is incorrect because the text doesn’t suggest that the team thought the ancient planks were used in the construction of a boat, nor does the underlined sentence question that conclusion. Instead, the text states that the wood could only have been transported from Jura to Rome in a boat. Choice C is incorrect because the underlined sentence simply offers a conclusion drawn from the team’s findings about the likely place of origin of the ancient planks; the text never mentions why oak was chosen for the planks instead of other wood. Choice D is incorrect because neither the underlined sentence nor the text as a whole addresses any methods that Romans used in constructing subways. Instead, the underlined sentence offers a conclusion drawn from the team’s findings about the likely place of origin of the ancient wooden planks discovered."},{"i":"8889d6e2","c":"cross","d":"M","s":"Text 1 An excavation in Chiquihuite Cave in central Mexico has upended the belief that approximately 13,000 years ago, a group known as the Clovis people were the first human inhabitants of North America. More than 200 crude stone tools were found embedded in a layer of earth that is up to 33,150 years old, <u>revealing that humans occupied the cave thousands of years before the Clovis people reached the continent.<\/u>\n\nText 2 The objects uncovered in Chiquihuite Cave are intriguing, but it is premature to characterize them as tools. The stone pieces are so roughly shaped that they may have simply fractured from rocks during natural geological activity in the cave. Moreover, their unearthing has thus far not been accompanied by discoveries of other signs of human activity or even traces of human DNA from surfaces.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the underlined claim in\n\nText 1?","o":["By suggesting that it draws a plausible connection between two groups of people but will need to be confirmed with further study","By asserting that it rests on an assumption about the stone pieces that is not sufficiently supported by available evidence","By acknowledging that it will most likely be proved correct when the stone pieces undergo more detailed analysis","By pointing out that it fails to account for evidence that the Clovis people were active on the continent as early as is commonly thought"],"a":1,"r":"Choice B is the best answer because it reflects how the author of Text 2 would most likely respond to the underlined claim about the Clovis people in Text 1. Text 1 explains that the idea that the Clovis people were the first human inhabitants of North America has been overturned by the unearthing of stone tools in Chiquihuite Cave in Mexico. The tools were found in a layer of earth that is over 33,000 years old—much older than the Clovis people’s arrival 13,000 years ago. The text ends with the claim that the tools reveal that humans lived in the cave long before the Clovis people reached the continent. Text 2, on the other hand, disputes the idea that the stone pieces are definitely tools. Text 2 states that the pieces are so roughly shaped that they may have simply naturally broken off from rocks and, moreover, that no other signs of human activity have been found in the cave. In other words, Text 2 argues that there is no proof yet that humans made the pieces as tools or were even present in the cave. Therefore, the author of Text 2 would most likely say that the claim that humans occupied Chiquihuite Cave long before the Clovis people reached North America rests on an assumption about the stone pieces—that they are human-made tools—that is not sufficiently supported by available evidence. Choice A is incorrect because Text 1 doesn’t claim that human inhabitants of Chiquihuite Cave and the Clovis people had any connection; the author of Text 1 focuses only on the timing of each group’s presence in North America. Further, the author of Text 2 makes no mention of the Clovis people and indicates that it isn’t clear yet that any human group did inhabit Chiquihuite Cave. Choice C is incorrect because nothing in Text 2 suggests that the author believes the stone pieces probably are human-made tools and will be confirmed as such by further analysis; instead, the author of Text 2 emphasizes the current lack of evidence of human activity in the cave. Choice D is incorrect because Text 2 focuses on the issue of characterizing the stone pieces as tools made by humans, not on the timing of any particular group’s activity in North America; further, Text 1 seems to support the common belief that the Clovis people reached North America 13,000 years ago and challenges only the idea that they were the continent’s first inhabitants. Therefore, there’s no reason to think the author of Text 2 would say that the author of Text 1 overlooks evidence that the Clovis people were active as early as is commonly thought."},{"i":"b7d51f84","c":"main","d":"M","s":"In West Africa, jalis have traditionally been keepers of information about family histories and records of important events. They have often served as teachers and advisers, too. New technologies may have changed some aspects of the role today, but jalis continue to be valued for knowing and protecting their peoples’ stories.\n\nWhich choice best states the main idea of the text?","o":["Even though there have been some changes in their role, jalis continue to preserve their communities’ histories.","Although jalis have many roles, many of them like teaching best.","Jalis have been entertaining the people within their communities for centuries.","Technology can now do some of the things jalis used to be responsible for."],"a":0,"r":"Choice A is the best answer because it best states the main idea of the text. According to the text, jalis’ traditional role has been to maintain information about families’ histories and significant events. The text goes on to say that although technological changes have altered jalis’ role somewhat, jalis are still valued for preserving the histories of their communities. Choice B is incorrect because the text says nothing about jalis’ views of the various tasks they perform. There is no information to support the idea that many jalis prefer teaching to other tasks. Choice C is incorrect because the text doesn’t describe jalis as being sources of entertainment. Rather, jalis are presented as valued sources of knowledge. Additionally, the text gives no indication of how long jalis have been serving their communities. Choice D is incorrect because the main focus of the text is on jalis’ role and their continued value despite the effects of technology, not on what technology can now do. Although the text indicates that jalis’ role has changed as a result of technological changes, the text doesn’t present any specific information about technology performing tasks that jalis once performed."},{"i":"b7f79059","c":"main","d":"M","s":"The following text is from Ezra Pound’s 1909 poem “Hymn III,” based on the work of Marcantonio Flaminio. As a fragile and lovely flower unfolds its gleaming foliage on the breast of the fostering earth, if the dew and the rain draw it forth; So doth my tender mind flourish, if it be fed with the sweet dew of the fostering spirit, Lacking this, it beginneth straightway to languish, even as a floweret born upon dry earth, if the dew and the rain tend it not.\n\nBased on the text, in what way is the human mind like a flower?","o":["It becomes increasingly vigorous with the passage of time.","It draws strength from changes in the weather.","It requires proper nourishment in order to thrive.","It perseveres despite challenging circumstances."],"a":2,"r":"Choice C is the best answer because it presents a description of how the human mind is like a flower that is directly supported by the text. The text compares the needs of a “fragile and lovely flower” to those of the speaker’s “tender mind”: both need to be fed if they’re going to survive. Without such feeding, they’ll “beginneth straightway to languish,” or weaken. Thus, the text suggests that the human mind is like a flower in that they both need proper nourishment in order to thrive. Choice A is incorrect because the text doesn’t address the passage of time or describe either the human mind or a flower as becoming increasingly vigorous. Choice B is incorrect because the text doesn’t suggest that human minds or flowers draw strength from changes in weather. The references to rain in the text pertain to a flower’s need for water rather than the general effects of changing weather. Choice D is incorrect because the text doesn’t suggest that the human mind or a flower will persist regardless of challenging circumstances. In fact, the text indicates that they’ll both languish right away if not given what they need."},{"i":"bcf2f169","c":"infer","d":"M","s":"Ana Castillo’s 1986 novel The Mixquiahuala Letters is a story told entirely through expressive letters from the narrator to her friend—letters that Castillo suggests could be read in several different orders. As they began reading it in class, some students remarked that they found the novel’s letter format daunting and its treatment of gender relations old-fashioned. The professor, however, pointed out that the novel is written in modern-sounding language and addresses issues that still matter today, suggesting that The Mixquiahuala Letters ______ Which choice most logically completes the text?","o":["has more to say about gender relations than other novels from the same period.","is more relevant to contemporary audiences than it may seem at first.","is easier to read than many contemporary novels that focus on friendship.","is best understood after multiple readings in different orders."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Ana Castillo’s 1986 novel The Mixquiahuala Letters. The text states that the novel consists entirely of letters from the narrator to her friend—a format that some students reading the novel in a class found intimidating. According to the text, those students also found the novel’s treatment of gender to be old-fashioned. In response to the students’ concerns, their professor emphasized the novel’s relevance: it’s written in modern-sounding language and addresses issues that still matter. This, in turn, suggests that The Mixquiahuala Letters is more relevant to contemporary audiences than it may initially seem. Choice A is incorrect because the professor’s response to the students only mentions The Mixquiahuala Letters: it doesn’t compare the novel to others from the same period. Choice C is incorrect because nothing in the professor’s response to the students compares The Mixquiahuala Letters to contemporary novels about friendship. Choice D is incorrect because the professor’s response to the students doesn’t address the idea of reading the novel’s letters multiple times and in different orders."},{"i":"123bd312","c":"infer","d":"M","s":"Herbivorous sauropod dinosaurs could grow more than 100 feet long and weigh up to 80 tons, and some researchers have attributed the evolution of sauropods to such massive sizes to increased plant production resulting from high levels of atmospheric carbon dioxide during the Mesozoic era. However, there is no evidence of significant spikes in carbon dioxide levels coinciding with relevant periods in sauropod evolution, such as when the first large sauropods appeared, when several sauropod lineages underwent further evolution toward gigantism, or when sauropods reached their maximum known sizes, suggesting that ______ Which choice most logically completes the text?","o":["fluctuations in atmospheric carbon dioxide affected different sauropod lineages differently.","the evolution of larger body sizes in sauropods did not depend on increased atmospheric carbon dioxide.","atmospheric carbon dioxide was higher when the largest known sauropods lived than it was when the first sauropods appeared.","sauropods probably would not have evolved to such immense sizes if atmospheric carbon dioxide had been even slightly higher."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the relationship between atmospheric carbon dioxide and sauropod body size. The text establishes that sauropods evolved to reach enormous sizes, and it notes that some scientists have asserted that the cause of this phenomenon was increased plant production that resulted from increased atmospheric carbon dioxide. The text goes on to state, however, that atmospheric carbon dioxide levels didn’t increase around the time of important periods in sauropods’ evolution of larger body sizes. If significant periods of sauropod evolution toward larger sizes occurred without increased atmospheric carbon dioxide levels, that suggests that the evolution of larger sizes didn’t depend on increased carbon dioxide in the atmosphere. Choice A is incorrect because the text doesn’t describe any fluctuations in atmospheric carbon dioxide, so there’s no evidence in the text to support the conclusion that such fluctuations had different effects on different sauropod lineages. All that the text says about atmospheric carbon dioxide levels is that there weren’t increases at particular points that correspond with key moments in sauropod evolution. Choice C is incorrect because the text indicates that there weren’t significant increases in atmospheric carbon dioxide around the time of important periods in sauropods’ evolution toward larger body sizes, not that atmospheric carbon dioxide was higher when the largest sauropods lived than when sauropods first appeared. Choice D is incorrect because the text indicates that atmospheric carbon dioxide levels didn’t increase at important periods in sauropod evolution, not that higher levels would have affected that evolution. The text provides no information about how higher levels of atmospheric carbon dioxide might have affected sauropods."},{"i":"33b1b285","c":"claim","d":"H","s":"Founded in 1965 and originally established as a cultural extension of the United Farm Workers—a union representing many Mexican American agricultural workers at the time—the theater troupe El Teatro Campesino has achieved recognition as a source of inspiration for subsequent Chicano theater companies and as a contributor to the dramatic arts. In an article about the company, a theater historian posits that a significant stylistic influence on El Teatro’s early performances was the audience-mediated slapstick comedy of carpa theater, vaudeville-style shows popular in Mexico and the US Southwest in the 1920s and ’30s.\n\nWhich quotation from the article would best illustrate the theater historian’s claim?","o":["“The company presented actos, short comedy sketches, that often relied on exaggerated physical humor to groups of agricultural workers, whose reactions—enthusiastic cheers of appreciation and, occasionally, loud boos of disapproval—promoted improvisation.”","“The company was focused on the reality of the present situation and discovered that humor was often found in that reality; consequently, comedy became a tool to convey social critique while entertaining and inspiring audiences.”","“The company relied heavily on satire, humor, and references to contemporary popular culture as well as a make-do aesthetic—often referred to as rasquache—that reflected not only the troupe’s limited financial resources but also its sociopolitical message.”","“The members of the company, which in addition to founder Luis Valdez consisted entirely of nonprofessional actors, traveled into farm fields, where they, with minimal props and costumes, performed comedy in the form of brief humorous vignettes.”"],"a":0,"r":"Choice A is the best answer because it most effectively illustrates the theater historian’s claim that El Teatro Campesino’s early performances were influenced stylistically by carpa theater, vaudeville-style shows with “audience-mediated slapstick comedy.”The quotation indicates that El Teatro presented comedic sketches that often featured exaggerated physical humor and that the performers improvised based on the cheers and boos from the audience; thus, it illustrates that El Teatro’s performances were similar to carpa theater in the physical, slapstick nature of their comedy and in the way the performances were mediated, or shaped, by the audience’s reactions. Choice B is incorrect. Although the quotation refers to El Teatro’s use of comedy and mentions audiences, it focuses on the company’s use of comedic aspects of reality as a tool to critique society while providing audiences with entertainment and inspiration; it doesn’t give any indication that El Teatro’s performances featured slapstick, or very physical, comedy or that they were directly shaped by the audience. Choice C is incorrect. Although the quotation refers to El Teatro’s aesthetic, or style, and mentions comedy, it indicates only that the company relied on satire and humor and had a style that reflected their limited financial means and sociopolitical message; it doesn’t give any indication that El Teatro’s performances featured slapstick, or very physical, comedy or that they were directly shaped by the audience. Choice D is incorrect. Although the quotation refers to El Teatro’s performance of comedy, it mentions only that the company performed brief humorous vignettes, or short humorous scenes, in farm fields; it doesn’t give any indication that El Teatro’s performances featured slapstick, or very physical, comedy or that they were directly shaped by the audience."},{"i":"356ad646","c":"claim","d":"M","s":"Baltimore, Maryland, has installed engineered structures along 71% of its shoreline to protect infrastructure from wave erosion and other hazards, a practice known as shoreline hardening. To evaluate the responses of waterbirds to two types of hardening structures—riprap and bulkheads—Diann Prosser et al. surveyed waterbird communities consisting of the tundra swan, the great blue heron, and 62 other species at different sites in the Chesapeake Bay on the US East Coast. Utilizing the Index of Waterbird Community Integrity (IWCI), on which a high score corresponds to high community integrity, the researchers found that bulkheads are more strongly negatively correlated with waterbird community integrity than is riprap.\n\nWhich finding, if true, would most directly illustrate the researchers’ finding?","o":["The difference in average IWCI scores for waterbird communities at Stony and Old Road, two sites with a higher percentage of shoreline consisting of bulkheads than of riprap, was statistically insignificant.","Waterbird communities at Old Road, a site with a relatively high percentage of shoreline consisting of bulkheads, had lower average IWCI scores than did waterbird communities at Miles, a site with a relatively high percentage of shoreline consisting of riprap.","Waterbird communities at Curtis, a site with a high percentage of shoreline consisting of bulkheads and riprap, had lower average IWCI scores than did waterbird communities at Onancock, a site with a low percentage of shoreline consisting of bulkheads and riprap.","Waterbird communities at Curtis, a site with equal percentages of shoreline consisting of bulkheads and riprap, had higher average IWCI scores than did waterbird communities at Miles, a site with different percentages of shoreline consisting of bulkheads and riprap."],"a":1,"r":"Choice B is the best answer because it presents a finding that, if true, would most directly illustrate the researchers’ finding about waterbird responses to shoreline hardening structures. The text explains that using the IWCI, an index on which higher scores indicate higher community integrity, researchers found that bulkheads are more strongly negatively correlated with waterbird community integrity than riprap is—that is, that bulkheads reduce the integrity of waterbird communities more than riprap does. The finding that waterbird communities at a site with a relatively high percentage of bulkheads along the shoreline (Old Road) had lower average IWCI scores than waterbird communities at a site with a relatively high percentage of riprap along the shoreline (Miles) did would illustrate the researchers’ finding, since it would be an example of lower waterbird community integrity in a location with substantial bulkhead presence than in a location with substantial riprap presence. Choice A is incorrect because a finding of similar waterbird community integrity in two sites predominated by bulkheads wouldn’t reveal anything about waterbird community integrity at sites predominated by riprap or how waterbird community integrity compares between the two types of sites. Thus, the finding wouldn’t illustrate the discovery of a difference in how bulkheads and riprap correlate with waterbird community integrity. Choice C is incorrect because it presents a finding that compares waterbird community integrity at sites with different overall amounts of shoreline hardening but without distinguishing between bulkheads and riprap. Such a distinction would be necessary to illustrate the researchers’ finding of a difference in how bulkheads and riprap each correlate with waterbird community integrity. Choice D is incorrect because it presents a finding that addresses a difference in waterbird community integrity between one site with equal percentages of bulkheads and riprap along its shoreline (Curtis) and one site with unequal percentages of bulkheads and riprap (Miles) but without indicating whether bulkheads or riprap were more prevalent at Miles. This finding wouldn’t provide any clear information about how bulkheads and riprap each correlate with waterbird community integrity, so it wouldn’t illustrate the researchers’ finding of a difference between those correlations."},{"i":"6317295c","c":"graph","d":"M","s":"","o":["J0614-03 has the shortest amount of time between consecutive pulses of all the RRATs in the table.","J0545-03 and J0121+53 have the same amount of time between consecutive pulses.","J1654-2335 has the longest amount of time between consecutive pulses of all the RRATs in the table.","J0103+54 and J0121+53 both have more than one second of time between consecutive pulses."],"a":0,"r":"Choice A is the best answer because it most accurately uses data from the table to complete the statement about certain rotating radio transients (RRATs). The table contains information about the right ascensions, periods, and frequencies of various pulsar stars called RRATs. According to the text, the period of an RRAT is defined as the time between consecutive pulses. The table shows that the period of RRAT J0614- 03 is 0.136 seconds, which is the lowest number of all the periods of the RRATs listed in the table. If the period is the time between consecutive pulses, and J0614-03 has the shortest period, then J0614-03 has the shortest amount of time between consecutive pulses of all the RRATs in the table. Choice B is incorrect because according to the table, J0545-03 has a period of 1.074 seconds and J0121+53 has a period of 2.725 seconds. According to the text, the period of an RRAT is the time between consecutive pulses. Therefore, since J0545-03 and J0121+53 have different periods, they do not have the same amount of time between consecutive pulses. Choice C is incorrect because according to the table, J1654- 2335 has a period of 0.545 seconds, which is not the longest period of all the RRATs listed in the table. According to the text, the period of an RRAT is the time between consecutive pulses, and both J0545-03 and J0121+53 have longer periods than J1654-2335, so J1654-2335 does not have the longest time between consecutive pulses of all the RRATs in the table. Choice D is incorrect because according to the table, J0103+54 has a period of 0.354 seconds, and J0121+53 has a period of 2.725 seconds. According to the text, the period of an RRAT is the time between consecutive pulses, and only J0121+53 has more than one second of time between consecutive pulses, not J0103+54."},{"i":"ede3f942","c":"graph","d":"E","s":"","o":["13.50 square miles.","53.68 square miles.","9.36 square miles.","39.21 square miles."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to support the statement about the tribal nation of Los Coyotes Band of Cahuilla and Cupeño Indians in California. The text states that most tribal nations in California are less than 50 square miles in total area and provides Los Coyotes Band of Cahuilla and Cupeño Indians as an example. According to the table, the tribal nation of Los Coyotes Band of Cahuilla and Cupeño Indians covers 39.21 square miles in Southern California, which is less than 50 square miles. Choice A is incorrect because it cites the area of La Jolla Band of Luiseño Indians (13.50 square miles), not that of Los Coyotes Band of Cahuilla and Cupeño Indians. Choice B is incorrect because it cites the area of the Agua Caliente Band of Cahuilla Indians (53.68 square miles), not that of Los Coyotes Band of Cahuilla and Cupeño Indians. Additionally, this area is greater than 50 square miles and therefore wouldn’t be an effective example for illustrating the text’s statement that most tribal nations in California are less than 50 square miles in total area. Choice C is incorrect because it cites the area of the Pauma Band of Luiseño Mission Indians (9.36 square miles), not that of Los Coyotes Band of Cahuilla and Cupeño Indians."},{"i":"96a904c5","c":"fss","d":"M","s":"The musical scores of Japanese composer Hiroyuki Sawano are famous for their mysterious titles. Laden with emojis and seemingly meaningless words, and driven largely by Sawano’s “personal feeling and mood,” ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["the listener can approach each piece free from expectations because of the titles.","the titles allow the listener to approach each piece free from expectations.","each piece can be approached by the listener free from expectations because of the titles.","the listener’s approach to each piece because of the titles can be free from expectations."],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “the titles” the subject of the sentence and places it immediately after the modifying phrases “laden with emojis and seemingly meaningless words, and driven largely by Sawano’s ‘personal feeling and mood.’” In doing so, this choice clearly establishes that the titles—and not another noun in the sentence —are being described as laden with emojis and driven by Sawano’s personal feeling. Choice A is incorrect because it results in a dangling modifier. The placement of “the listener” immediately after the modifying phrases illogically suggests that the listener, rather than the titles, is laden with emojis and driven by Sawano’s personal feeling. Choice C is incorrect because it results in a dangling modifier. The placement of “each piece” (i.e., musical score) immediately after the modifying phrases illogically suggests that the pieces, rather than the titles of the pieces, are laden with emojis and driven by Sawano’s personal feeling. Choice D is incorrect because it results in a dangling modifier. The placement of “the listener’s approach” immediately after the modifying phrases illogically suggests that the listener’s approach, rather than the titles, is laden with emojis and driven by Sawano’s personal feeling."},{"i":"e92a7ad3","c":"fss","d":"E","s":"In the Inca Empire (1438–1533), ayllus ______ family clans that ranged in size from small groups to thousands of people.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is","was","has been","were"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The plural verb \"were\" agrees in number with the plural subject \"ayllus,\" which are described as plural \"family clans.\" Choice A is incorrect because the singular verb \"is\" doesn’t agree in number with the plural subject \"ayllus.\" Choice B is incorrect because the singular verb \"was\" doesn’t agree in number with the plural subject \"ayllus.\" Choice C is incorrect because the singular verb \"has been\" doesn’t agree in number with the plural subject \"ayllus.\""},{"i":"37e5c794","c":"fss","d":"H","s":"Despite being cheap, versatile, and easy to produce, ______ they are made from nonrenewable petroleum, and most do not biodegrade in landfills.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["there are two problems associated with commercial plastics:","two problems are associated with commercial plastics:","commercial plastics’ two associated problems are that","commercial plastics have two associated problems:"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-modifier placement. This choice ensures that the modifying phrase “despite being cheap, versatile, and easy to produce” appears immediately before the noun it modifies, “commercial plastics,” clearly establishing that the commercial plastics—and not another noun in the sentence—are being described as cheap, versatile, and easy to produce. Choice A is incorrect because it results in a dangling modifier. The placement of the function word “there” immediately after the modifying phrase illogically and confusingly suggests that “there” is cheap, versatile, and easy to produce. Choice B is incorrect because it results in a dangling modifier. The placement of the noun “two problems” immediately after the modifying phrase illogically suggests that the “problems” are cheap, versatile, and easy to produce. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “commercial plastics’ two associated problems” immediately after the modifying phrase illogically suggests that the “problems” are cheap, versatile, and easy to produce."},{"i":"aecdb820","c":"bound","d":"H","s":"Featuring works by the photographers Lola Álvarez Bravo and Else “Yva” Neuländer-Simon, the 2021 exhibition The New Woman Behind the Camera set out to provide a wide-ranging overview of photography by women in the 1920s through the ______ given the collection’s breadth of more than 120 photos, its efforts were largely successful.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["1950s, and","1950s and","1950s","1950s,"],"a":0,"r":"Choice A is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction \"and\" to join the first main clause (\"Featuring...1950s\") and the second main clause (\"given...successful\"). Choice B is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice D is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses."},{"i":"435809d8","c":"bound","d":"H","s":"On March 23, 2021, a gust of wind wreaked havoc on global trade. Ever Given, an international shipping container vessel, became lodged in Egypt’s Suez Canal, a major shipping route between Europe and Asia. The vessel took six days to ______ it’s as heavy as two thousand blue whales when fully loaded.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["dislodge in part due to its sheer size,","dislodge, in part due to its sheer size:","dislodge, in part due to its sheer size,","dislodge, in part, due to its sheer size"],"a":1,"r":"Choice B is the best answer. The convention being tested is punctuation between main clauses and a supplementary element. This choice correctly uses a comma to mark the boundary between the main clause (\"The vessel took six days to dislodge\") and the supplementary element (\"in part due to its sheer size\") that provides additional information on why the vessel was difficult to dislodge. Additionally, this choice correctly uses a colon to introduce another main clause that describes the vessel’s size (\"it’s as heavy as two thousand blue whales when fully loaded\"). Choice A is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between two main clauses (\"The vessel…size\" and \"it’s…loaded\"). Additionally, it fails to mark the boundary between the main clause (\"The vessel took six days to dislodge\") and the supplementary element (\"in part due to its sheer size\"). Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between two main clauses (\"The vessel…size\" and \"it’s…loaded\"). Choice D is incorrect because it results in a run-on sentence. The two main clauses (\"The vessel…size\" and \"it’s…loaded\") are fused without punctuation and/or a conjunction."},{"i":"0acc26b2","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Astronomers estimate that the number of comets orbiting the Sun is in the billions. 81P/Wild is one of many comets whose orbit has changed over time. 81P/Wild’s orbit once lay between the orbits of Uranus and Jupiter. The comet’s orbit is now positioned between the orbits of Jupiter and Mars. The student wants to make and support a generalization about the orbits of comets.\n\nWhich choice most effectively uses relevant information from the notes to accomplish these goals?","o":["Astronomers estimate that the number of comets orbiting the Sun is in the billions; the comets’ orbits may change over time.","Like Uranus, Jupiter, and Mars, billions of comets orbit the Sun.","One example of a comet is 81P/Wild, whose orbit around the Sun once lay between Uranus’s and Jupiter’s orbits but is now positioned between those of Jupiter and Mars.","A comet’s orbit around the Sun may change over time: the orbit of comet 81P/Wild once lay between the orbits of Uranus and Jupiter but is now positioned between those of Jupiter and Mars."],"a":3,"r":"Choice D is the best answer. The sentence makes a generalization—that a comet’s orbit around the Sun may change over time—and supports the generalization with the example of the orbit of comet 81P/Wild, which once lay between the orbits of Uranus and Jupiter but is now positioned between the orbits of Jupiter and Mars. Choice A is incorrect. The sentence emphasizes the number of comets orbiting the Sun and makes a generalization about their orbits, but it doesn’t support the generalization with an example. Choice B is incorrect. The sentence makes a generalization about comets and compares them to the planets Uranus, Jupiter, and Mars; it doesn’t make and support a generalization about comets’ orbits. Choice C is incorrect. While the sentence provides an example of a comet whose orbit has changed, it doesn’t make a generalization about the orbits of comets."},{"i":"48d0bb34","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Sam Maloof (1916–2009) was an American woodworker and furniture designer. He was the son of Lebanese immigrants. He received a “genius grant” from the John D. and Catherine T . MacArthur Foundation in 1985. The Museum of Fine Arts in Boston, Massachusetts, owns a rocking chair that Maloof made from walnut wood. The armrests and the seat of the chair are sleek and contoured, and the back consists of seven spindle-like slats. The student wants to describe the rocking chair to an audience unfamiliar with Sam Maloof.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["With its sleek, contoured armrests and seat, the walnut rocking chair in Boston’s Museum of Fine Arts is just one piece of furniture created by American woodworker Sam Maloof.","Sam Maloof was born in 1916 and died in 2009, and during his life, he made a chair that you can see if you visit the Museum of Fine Arts in Boston.","Furniture designer Sam Maloof was a recipient of one of the John D. and Catherine T . MacArthur Foundation’s “genius grants.”","The rocking chair is made from walnut, and it has been shaped such that its armrests and seat are sleek and contoured."],"a":0,"r":"Choice A is the best answer. The sentence effectively describes the rocking chair to an audience unfamiliar with Sam Maloof, noting its sleek, contoured armrests and seat and explaining that Sam Maloof (the walnut chair’s creator) was an American woodworker. Choice B is incorrect. While the sentence explains who Sam Maloof was and mentions a chair, it doesn’t describe the chair. Choice C is incorrect. While the sentence explains who Sam Maloof was, it doesn’t describe the rocking chair. Choice D is incorrect. While the sentence describes the rocking chair, it doesn’t explain who Sam Maloof was."},{"i":"2b5e0731","c":"trans","d":"E","s":"With darkness falling, a mother elephant loses sight of her calf and wants to make sure it is safe. ______ she releases an infrasonic call for the calf to hear. Infrasonic sound is below the range of human hearing, but many animals can hear these sounds from several miles away.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","For this reason,","Nowadays,","Similarly,"],"a":1,"r":"Choice B is the best answer. \"For this reason\" is a cause-and-effect transition. The cause in this case is that the mother elephant wants to know that her calf is safe, so the effect is that she lets out an infrasonic call for the calf to hear. Therefore, \"for this reason\" fits perfectly in this context. Choice A is incorrect. This choice uses a transition that introduces an example of a previous idea. But the second sentence doesn’t provide an example of the events described in the first sentence. Instead, it describes what happens next: the mother elephant calls for her calf. Choice C is incorrect. This choice uses a transition that indicates a shift from the past to the current time, which doesn’t make sense here. Both sentences use the present tense, as they’re describing the same time period. Choice D is incorrect. This choice uses a transition that indicates commonality or agreement between two ideas. But this sentence isn’t similar to the events in the first sentence. Instead, it describes the events that happen next."},{"i":"4d2736f0","c":"trans","d":"H","s":"In her poetry collection Thomas and Beulah, Rita Dove interweaves the titular characters’ personal stories with broader historical narratives. She places Thomas’s journey from the American South to the Midwest in the early 1900s within the larger context of the Great Migration. ______ Dove sets events from Beulah’s personal life against the backdrop of the US Civil Rights Movement.\n\nWhich choice completes the text with the most logical transition?","o":["Specifically,","Thus,","Regardless,","Similarly,"],"a":3,"r":"Choice D is the best answer. “Similarly” logically signals that the information in the sentence—that Dove situates Beulah’s life in the context of the US Civil Rights Movement—is similar to the previous information about Thomas and the Great Migration. Both sentences support the first sentence’s claim that Dove portrays her characters in the context of broader historical narratives. Choice A is incorrect because “specifically” illogically signals that the information about Beulah in this sentence provides specific details elaborating on the previous information about Thomas. Instead, it’s similar to the previous information about Thomas. Choice B is incorrect because “thus” illogically signals that the information about Beulah in this sentence is a result or consequence of the previous information about Thomas. Instead, it’s similar to the previous information about Thomas. Choice C is incorrect because “regardless” illogically signals that the information about Beulah in this sentence is true despite the previous information about Thomas. Instead, it’s similar to the previous information about Thomas."},{"i":"9f1a0d91","c":"trans","d":"H","s":"“Tulip mania”—the rapid rise and sudden fall of the price of tulip bulbs in seventeenth-century Amsterdam—is often cited as an example of the perils of rampant market speculation. However, recent research has demonstrated that the episode was neither as frenzied nor as disastrous as has been thought. The popular myth surrounding it, ______ should be regarded with some skepticism.\n\nWhich choice completes the text with the most logical transition?","o":["for example,","by contrast,","nevertheless,","therefore,"],"a":3,"r":"Choice D is the best answer. This sentence is arguing that new evidence contradicting popular beliefs about “tulip mania” should cast doubt on those beliefs. “Therefore” is a cause-and-effect transition, which fits perfectly in this context. Choice A is incorrect. This choice uses an exemplification transition, which doesn’t make sense here. Skepticism about the popular beliefs is not an example of recent evidence contradicting those beliefs—rather, skepticism is an effect of that recent evidence. Choice B is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the previous sentence. Instead, it connects a cause from the previous sentence (new evidence that tulip mania was not as disastrous as thought) to an effect (that we should look with skepticism upon the myth about its disastrousness). Choice C is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the previous sentence. Instead, it connects a cause from the previous sentence (new evidence that tulip mania was not as disastrous as thought) to an effect (that we should look with skepticism upon the myth about its disastrousness)."}],"img":{"6317295c":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEPBAMAAABSIgo2AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA1D0lEQVR42u1deXwTRRt+ZnM1vTJJW27abWkBubqlXHKm0AJ+CKSUQxQh3IcHAbnkkCIoAgpFFEVAKoeiooRLEBWCcgrYVJAbmnIqQjPh6Jlkvz/KUWghiVCgmuf3o2R359pn3pl533dmZwAvvPDCCy+88MKLJx4k4u47tMjv7jw4CkDK37qlKfKc0LtSkfAUADRqzT0S/K9h8v71d1xriOn2BXeEl+w/AkCZUsgiD6X9GA/QCAAQlPobATufLEwlIDKVAnjPelJ7KxFJaiG/wn+R3hl4latGYyGJpIiEptosQYs2IIkAgoUaG+CXXNnA1VemcImQJFZaCmVypVSuNTdLkOmkO4NoeBwk1Sh64Q1IBQTXDRe41gA68VwkSUJENQTzJI5rjfBYxXrEPra3lD6ujEWkhmzQjfV5aWz1th+df+nDcjktXxpad28H0ShbYR8ST8TwC+Zn+i5i4/mMFnVrtwFhl/iecTT+0Mys3VHyJmOvWZ9VH0hVwSjZeanDR1enG1Z1Dk2FyGrN+KKVo476eo3QFpMnDA1tYRkSVX56bqf/mvROiPrJ77M+4btCY47U4zcFJg4LsizkLJNkehKa/IZiLbifpmKXfFPyGd+Uc8r5U6Dc8J7hTzl7neijY1b46a9W7Xu9cjI6jd3D6V5VrmlZznREYQE60nraeLl5VuQhSxOZabfc/FX5A+tUMf0eVz/MPbZmM2oDVhdkLK+blhqzKFq1Os1JuF/Jtz+nilVSvq0bCGe7StqQXTa1cjt3PCfZCkR0fH9zwfY0sUqq6AR38nLQ8csUOFvB+ewIcWuamHksfwegRobp0GFUOWk/8TQg3QX7RXIq98vfwP5j9OaPne1EEAJOQ2Md05PRejbY2/U5lGTEGR42Gyr4v9zX3tZg8+mWQokNEBe8FlifCwiTdutEARGwUjAErrjqE9Kb40FVMVxVUBFhdHYTMI70qCySgLZ6SJiY33wFwX+M3jBGOLot6UVb1w5pMbFqdk5QXRW0M6tSZPUffpriyrJ4a3o1beDvwaE5TSfFgsOWlEMNrdcETT8mVVPKBfg0ZBT4nnBvFnTtYqO7GjjBbOAYV4MSUbbVRlXpEVq1GNiwbl0i/teGtq0QnZZDsxfS9l+fH7rjErZ8bBy/c9qxzwYiW5njMCH3rwnt87e9UP6TJT2mvtd0IxwsD31+7uY76Ps6azbUzjAVWPobfmGXMbtiXk7Byg4bzDPWDALsrBLmfmr6Tdzj13a6acYvA4LFtLycGQv/c4oZBQgAtLhhH7hpjBQJO7Ku/v45/JfNipuoTW6zoC7JkKPF
