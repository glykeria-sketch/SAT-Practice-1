<script>
const D={"t":"Practicetest59","q":[{"i":"c5b1afe5","c":"vocab","d":"M","s":"Bicycle sharing systems allow users to rent a bicycle at one location within a city and return it to any other designated location in that city, which can cause serious problems of bicycle supply and user demand within the city’s system. Tohru Ikeguchi uses open-source data and statistical modeling to identify when a high number of users making one-way trips is likely to leave some locations within the system ______ bicycles and other areas with insufficient supply.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["susceptible to","contingent on","saturated with","depleted of"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Ikeguchi’s model of bicycle supply. In this context, “saturated with” means thoroughly or completely supplied with. The text explains a problem encountered by some bicycle-sharing programs: users can return bicycles to different locations than where the users picked up the bicycles to start, which can result in a mismatch between bicycle supply (that is, where the bicycles are currently located) and user demand (that is, the locations where users are hoping to pick up bicycles). The text goes on to explain that Ikeguchi developed a way to identify when this mismatch is likely to occur. This context suggests that Ikeguchi’s method will show when it is likely that some locations have an insufficient supply and other locations, by implicit contrast, are saturated with bicycles. Choice A is incorrect because nothing in the text suggests that some locations are “susceptible to,” or sensitive to or easily influenced by, bicycles. The text describes the phenomenon of bicycles being redistributed away from locations where users want them, not anything about those locations being influenced by the bicycles. Choice B is incorrect because the text describes situations in which some locations have an insufficient supply of bicycles because the bicycles have been relocated elsewhere, which suggests that the other locations have many bicycles, not that the other locations are “contingent on,” or dependent on, the bicycles. Nothing in the text suggests that the locations themselves depend on the bicycles for anything. Choice D is incorrect because it would not make sense in context to say that some locations are “depleted of,” or empty of, bicycles while others have an insufficient supply. The text describes situations in which bicycles have been relocated such that there is a mismatch between bicycle supply and user demand—the bicycles are no longer at the locations where users want to pick them up. This means that some locations do not have enough bicycles, while other locations must have many bicycles, not be depleted of bicycles."},{"i":"1107e7dc","c":"vocab","d":"M","s":"Economists often assert that countries looking to increase their reliance on solar energy should expand their capacity for storage; having an ample reserve of stored energy can mitigate the effects of ______ solar energy collection caused by unpredictable shifts in cloud cover and haze.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["developments of","fluctuations in","calibrations with","incentives for"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of solar energy collection and storage. In this context, \"fluctuations in\" means irregular changes in. The text notes that economists recommend that countries that want to rely more on solar energy (energy captured from sunlight) should attempt to expand their storage capacity. The text goes on to explain that having a large amount of stored solar energy can lessen the negative effect of \"unpredictable shifts in cloud cover and haze\"—that is, unpredictable changes in environmental conditions that at times limit sunlight. This context suggests that having ample solar energy stored and ready to use can mitigate the issue of fluctuations in solar energy collection caused by irregular patterns of sunlight availability. Choice A is incorrect because in this context, \"developments of solar energy collection\" would most clearly refer to the creation of ways to collect solar energy (energy captured from sunlight). The text focuses on collection and the idea that having stored energy can mitigate, or make less bad, the effects of a problem caused by unpredictable changes that affect sunlight (\"cloud cover and haze\"); there’s no reason to think that the creation of new collection methods would be viewed as a problem that would need to be mitigated. Choice C is incorrect because in this context, \"calibrations with\" would most clearly refer to precise adjustments for a particular purpose. The text focuses on the collection of solar energy (energy captured from sunlight) and the idea that having stored energy can mitigate, or make less bad, the effects of a problem caused by unpredictable changes that affect sunlight (\"cloud cover and haze\"); there’s no reason to think that precision in something related to solar energy collection would be viewed as a problem that would need to be mitigated. Choice D is incorrect. The text focuses on the collection of solar energy (energy captured from sunlight) and the idea that having stored energy can mitigate, or make less bad, the effects of a problem caused by unpredictable changes that affect sunlight (\"cloud cover and haze\"); nothing in the text suggests that \"incentives for,\" or rewards for, solar energy collection would be viewed as a problem that would need to be mitigated, especially in countries that want to rely more on solar energy than they already do."},{"i":"7a327791","c":"vocab","d":"E","s":"Novelist Leon Forrest admired William Faulkner’s writing style. Forrest’s novel Divine Days contains a long passage in tribute to Faulkner that is a perfect ______ of Faulkner’s style: anyone familiar with Faulkner’s writing would see the resemblance.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["forgetting","rejection","imitation","opinion"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of novelist Leon Forrest’s admiration of William Faulkner’s writing style. In this context, \"imitation\" means something that resembles or reproduces something else. The text states that Forrest admired Faulkner’s style and that anyone familiar with Faulkner’s style would be able to see the stylistic similarities between a particular passage in Forrest’s novel Divine Days and Faulkner’s writing, a fact that supports the idea that Forrest’s novel pays tribute to Faulkner by reproducing, or imitating, Faulkner’s style. Choice A is incorrect because in this context, a \"forgetting\" would mean an instance in which something is overlooked or not remembered. The text emphasizes Forrest’s admiration for Faulkner’s style and the fact that Forrest’s writing in some instances closely resembles Faulkner’s stylistically. It therefore wouldn’t make sense to say that in trying to pay tribute to Faulkner’s style, Forrest failed to remember it. Choice B is incorrect because in this context, a \"rejection\" would mean a dismissal of something as unworthy. The text emphasizes Forrest’s admiration for Faulkner’s writing style, stating that parts of Forrest’s writings indicate efforts to copy that style. It wouldn’t make sense therefore to suggest that Forrest had rejected or dismissed Faulkner’s style as unworthy. Choice D is incorrect because in this context, an \"opinion\" would mean a view or judgment. Although the text focuses on Forrest’s admiration of Faulkner, which suggests that Forrest had formed a positive judgment of Faulkner’s style, the word opinion wouldn’t make sense in this sentence: the sentence doesn’t say that the passage from Forrest’s novel expresses his view of Faulkner’s style; rather, it suggests that stylistically, the passage closely resembles, or imitates, Faulkner’s writing."},{"i":"b35e2fdc","c":"vocab","d":"H","s":"A casual description of Scherezade García’s 2019 mural Blame It on the Bean: The Power of Coffee can make the work seem ______—a painting that is housed in a coffee shop and that depicts three women drinking coffee may not sound particularly ambitious—but in fact the work is a complex, dynamic meditation on gender and the legacy of colonialism that demands serious attention.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["unassuming","shrewd","incongruous","pretentious"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of Scherezade García’s mural Blame It on the Bean: The Power of Coffee. In this context, “unassuming” means ordinary or unremarkable. The text draws a contrast between a “casual description” of the mural’s ordinary location (a coffee shop) and subject matter (three women drinking coffee)—details that would make it seem relatively unambitious—and a characterization of the painting as a “dynamic meditation” on gender and colonialism deserving of “serious attention.”This context suggests that the mural has significant depth and complexity, but a superficial description of it might make the mural seem ordinary and unremarkable—that is, unassuming. Choice B is incorrect because in this context, “shrewd” would mean clever or astute, and there’s nothing in the text to suggest that a casual yet misleading description that only mentions the apparent simplicity of the mural’s location and subject matter would make the mural seem particularly clever or astute. Though it’s possible that the text’s assertion that the mural is a “complex, dynamic meditation” demanding “serious attention” might convey the idea that it’s a particularly clever or astute—that is, shrewd—artwork, the text wouldn’t suggest that a casual description that fails to account for the work’s complexity would likewise characterize the work as shrewd. Choice C is incorrect because in this context, “incongruous” would mean unsuitable for its surroundings or internally inconsistent. The “casual description” presented in the text indicates that the painting is housed in a coffee shop and depicts women drinking coffee, which would imply that the mural may in fact be well suited to its surroundings, not that it’s ill suited to its location. Moreover, none of the details mentioned in this description would suggest that the painting contains internal inconsistencies of any kind. Choice D is incorrect because in this context, “pretentious” would mean expressive of exaggerated importance, which wouldn’t fit the contrast established in the text between a “casual description” of the painting and the work’s deeper themes. Though the text argues that the painting is worthy of “serious attention,” which would suggest its importance, the text doesn’t suggest that the casual description would by contrast imply that the painting’s importance is exaggerated. Rather, by merely mentioning the mural’s relatively ordinary location and subject matter without reference to this complexity, the casual description conveys that the painting is more unassuming and understated than it actually is, not that it expresses an exaggerated self-importance."},{"i":"be947479","c":"purpose","d":"E","s":"Jazz tap is a dance form that was first developed in African American communities. Jazz tap was heavily influenced by jazz music, which became widely popular in the United States in the 1920s. Tap dancers were inspired by jazz music’s quick rhythms and by the way jazz musicians would make up melodies as they played. As jazz music continued to develop in the 1930s and 1940s, jazz tap evolved with it. Because of jazz music’s influence, jazz tap quickly developed into a dance form that was very different from earlier kinds of tap dance.\n\nWhich choice best states the main purpose of the text?","o":["It explains why audiences prefer some kinds of music over others.","It discusses the development of a dance form.","It describes how to play a musical instrument.","It emphasizes the popularity of a famous dancer."],"a":1,"r":"Choice B is the best answer because it best describes the main purpose of the text. The text indicates where and when jazz tap first developed (in African American communities in the 1920s) and what influenced it (the quick rhythms and improvisations in jazz music) and then explains that it evolved alongside jazz music in the 1930s and 1940s, resulting in a very different form of tap dance than had existed before. Therefore, the main purpose of the text is to discuss jazz tap’s development. Choice A is incorrect. Although the text indicates that jazz music became widely popular in the US in the 1920s and describes some of jazz music’s qualities, the text never explains why audiences prefer some kinds of music—jazz or otherwise—over others. Choice C is incorrect because the text never mentions any musical instruments and doesn’t describe how to play one. Choice D is incorrect because the text discusses jazz tap generally and never identifies a particular dancer, famous or otherwise."},{"i":"9c759a09","c":"purpose","d":"E","s":"The following text is from Georgia Douglas Johnson’s 1922 poem “Benediction.” Go forth, my son, Winged by my heart’s desire! Great reaches, yet unknown, Await For your possession. I may not, if I would, Retrace the way with you, My pilgrimage is through, But life is calling you!\n\nWhich choice best states the main purpose of the text?","o":["To express hope that a child will have the same accomplishments as his parent did","To suggest that raising a child involves many struggles","To warn a child that he will face many challenges throughout his life","To encourage a child to embrace the experiences life will offer"],"a":3,"r":"Choice D is the best answer because it accurately states the text’s main purpose. The poem begins with the speaker urging a child to “go forth” with her encouragement (“my heart’s desire”). The speaker goes on to suggest that new experiences (“Great reaches, yet unknown”) lie ahead for the son that “life is calling” him to seek out. Thus, the main purpose is to encourage a child to embrace the experiences available to him in his life. Choice A is incorrect because the speaker encourages the child to pursue new experiences (“Great reaches”) without knowing exactly what those experiences will be (“yet unknown”) or suggesting that they should match the speaker’s own accomplishments. Choice B is incorrect because the speaker focuses on positive possibilities for her son (“Great reaches, yet unknown”) and her enthusiastic encouragement to embrace those possibilities (“life is calling you!”), while there is no mention of raising a child or associated struggles. Choice C is incorrect because the speaker frames the possibilities for her son in a positive light when she says that “great reaches, yet unknown” are waiting for him, and this positive outlook for the son is consistent throughout the text."},{"i":"662892ad","c":"func","d":"E","s":"Wakako Yamauchi is best known for And the Soul Shall Dance, her 1977 play about a Japanese American family in Southern California. The play is based on a short story Yamauchi had published three years earlier. Adapting the story wasn’t easy. Theater relies on dialogue between characters, but the original story features little dialogue and instead describes its characters’ silent thoughts. <u>To transform the story into a play, Yamauchi created situations where characters reveal their thoughts by speaking them aloud during conversations with each other.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It offers information about how Yamauchi adapted her short story into a play.","It argues that Yamauchi’s play influenced later playwrights.","It explains why Yamauchi’s short story is better known than the play adaptation is.","It describes how Yamauchi chose the actors who performed in the play."],"a":0,"r":"Choice A is the best answer because it best describes how the underlined sentence functions in the text as a whole. According to the text, it was hard for Yamauchi to adapt her short story into the play And the Soul Shall Dance because the story had included little dialogue, instead describing the characters’ silent thoughts. The underlined sentence offers information about how Yamauchi ultimately succeeded in adapting the story into a play: it explains that Yamauchi created situations where the characters of the play could reveal their internal thoughts while speaking with each other. Choice B is incorrect because neither the underlined sentence nor the text as a whole makes any mention of playwrights other than Yamauchi or how the play might have influenced them. Choice C is incorrect because the text states that Yamauchi is best known for her play And the Soul Shall Dance, which conveys that the play is better known than the short story it’s based on is. Choice D is incorrect because neither the underlined sentence nor the text as a whole mentions the actors who performed in the play or Yamauchi’s approach to choosing them."},{"i":"2e744883","c":"func","d":"H","s":"Historians have argued that a crucial component of the Civil Rights Movement’s success in the 1960s was the Southern Christian Leadership Conference’s Citizen Education Program (CEP), which invited promising activists from across the South to its one-week training sessions in Dorchester, Georgia. Led by experienced organizers such as Dorothy Cotton and Septima Clark, CEP attendees<u>—more than 7,000 in all—<\/u> participated in workshops on topics ranging from public speaking to legal doctrine before returning home and using their newly acquired knowledge to spearhead local civil rights initiatives.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It underscores the extent of the CEP’s impact on the Civil Rights Movement of the 1960s.","It illustrates the CEP organizers’ efforts to educate participants on a wide variety of topics.","It suggests that CEP attendees held a diverse array of opinions about the Southern Christian Leadership Conference’s political philosophy.","It establishes that criticism of the CEP was limited to a few individuals in the Southern Christian Leadership Conference."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first sentence of the text states that the CEP had a positive impact on the Civil Rights Movement in the 1960s. The next sentence explains that the CEP organized workshops for attendees, who later used the knowledge they gained to lead civil rights initiatives. And the underlined portion indicates the number of activists—more than 7,000—who participated in the workshops. Thus, the underlined portion provides a number that underscores the extent of the CEP’s impact on the Civil Rights Movement in the 1960s. Choice B is incorrect. Although the sentence that contains the underlined portion mentions some CEP workshop topics, the underlined portion itself addresses the number of participants in the CEP workshops, not the number of topics covered. Choice C is incorrect. Although the underlined portion refers to attendees of the CEP workshops, nothing in the underlined portion or the text as a whole addresses the Southern Christian Leadership Conference’s philosophy or the attendees’ opinions thereof. Choice D is incorrect because neither the underlined portion nor the text as a whole mentions any criticism of the CEP by members of the Southern Christian Leadership Conference."},{"i":"84dbd633","c":"cross","d":"H","s":"Text 1 The Cretaceous-Paleogene (K-Pg) mass extinction event is usually attributed solely to an asteroid impact near Chicxulub, Mexico. Some scientists argue that <u>volcanic activity was the true cause, as the K-Pg event occurred relatively early in a long period of eruption of the Deccan Traps range that initially produced huge amounts of climate-altering gases.<\/u> These dissenters note that other mass extinctions have coincided with large volcanic eruptions, while only the K-Pg event lines up with an asteroid strike.\n\nText 2 In a 2020 study, Pincelli Hull and her colleagues analyzed ocean core samples and modeled climate changes around the K-Pg event. The team concluded that Deccan Traps gases did affect global conditions prior to the event, but that the climate returned to normal well before the extinctions began—extinctions that instead closely align with the Chicxulub impact.\n\nBased on the texts, how would Hull’s team (Text 2) most likely respond to the argument in the underlined portion of\n\nText 1?","o":["By agreeing that the Chicxulub impact changed the climate and that the Deccan Traps eruption caused the K-Pg event","By declaring that the changes in climate caused by the Deccan Traps eruption weren’t the main cause of the K-Pg event","By questioning why those scientists assume that the Chicxulub impact caused the Deccan Traps eruption","By asserting that the Deccan Traps eruption had a more significant effect on global conditions than those scientists claim"],"a":1,"r":"Choice B is the best answer because it describes how Hull’s team would most likely respond to the argument in the underlined portion of Text 1, which asserts that volcanic activity in the Deccan Traps range led to changes in the climate and caused the K-Pg mass extinction event. According to Text 2, although Hull’s team found that activity in the Deccan Traps did indeed alter the climate before the K-Pg event, the team determined that the climate had returned to normal before mass extinctions began. This finding and the observation that the K-Pg extinctions closely align with the Chicxulub asteroid impact suggest that Hull’s team would likely dispute the claim in the underlined portion of Text 1 and say that the climate changes caused by the Deccan Traps activity were not the main cause of the extinctions. Choice A is incorrect because Text 2 describes how Hull’s team found that the climate had recovered from the changes brought about by the Deccan Traps activity before the K-Pg event occurred, which suggests that Hull’s team would disagree that the Deccan Traps activity caused the K-Pg event. Additionally, the claim in the underlined portion of Text 1 says nothing about how the Chicxulub impact changed the climate, so while Hull’s team might believe that the impact did in fact change the climate, they could not be said to agree with the claim in Text 1 on this point. Choice C is incorrect because there is no indication in either text that any scientists assume that the Chicxulub impact caused the Deccan Traps activity, so there is no reason to conclude that Hull’s team would question why the scientists referred to in Text 1 make such an assumption. Choice D is incorrect because Text 2 describes how Hull’s team found that the climate had recovered from the changes brought about by the Deccan Traps activity before the K-Pg event occurred, which suggests that Hull’s team would say that the Deccan Traps activity had a less enduring effect on global conditions than the scientists referenced in Text 1 believe, not that the effect on global conditions was more significant than those scientists claim."},{"i":"668f75cb","c":"main","d":"M","s":"The following text is from Ahmet Hamdi Tanpinar’s 1961 novel The Time Regulation Institute (translated from the Turkish in 2014 by Maureen Freely and Alexander Dawe). The narrator was once involved with the Time Regulation Institute, a fictional bureaucracy that regulates the time of Turkey’s clocks. I may be the most humble and absurd man in the world and, as my wife says, the most slovenly creature you may ever meet—that is, before the founding of our institute—but I did come to know a truly great man who possessed a natural genius for invention. I spent years at his side. I watched the way he worked. I witnessed how an idea would suddenly catch fire in his mind and take shape, like a tree sprouting shoots and branches, before coming into being. ©2014 by Maureen Freely and Alexander Dawe Which choice best states the main idea of the text?","o":["A person was fortunate enough to have found love despite his obvious shortcomings.","An exceptionally talented person professes humility to avoid intimidating others.","A person appreciates the extensive time he passed in the company of someone he deeply admired.","A truly brilliant person lets ideas mature in his mind before expressing them aloud."],"a":2,"r":"Choice C is the best answer because it most accurately describes the main idea of the text: a person appreciates the extensive time he passed in the company of a man he deeply admired. The speaker says that he spent \"years\" (a long period of time) in the company of a \"truly great man\" with \"a natural genius for invention.\" These phrases indicate the speaker’s feelings of admiration. Choice A is incorrect because though the text indicates that the speaker feels professional admiration for the \"truly great man,\" the text does not indicate that the speaker feels love for him; nor does the text indicate that the speaker’s humility, absurdity, and slovenly nature proved to be an obstacle to this professional relationship. Choice B is incorrect because though the speaker describes himself as humble, the text does not indicate that he is exceptionally talented; nor does the text indicate that the \"truly great man\" professes humility or is concerned with whether he intimidates others. Choice D is incorrect because the text does not indicate how either the speaker or the \"truly great man\" express their ideas."},{"i":"66c47028","c":"main","d":"M","s":"In 1934 physicist Eugene Wigner posited the existence of a crystal consisting entirely of electrons in a honeycomb-like structure. The so-called Wigner crystal remained largely conjecture, however, until Feng Wang and colleagues announced in 2021 that they had captured an image of one. The researchers trapped electrons between two semiconductors and then cooled the apparatus, causing the electrons to settle into a crystalline structure. By inserting an ultrathin sheet of graphene above the crystal, the researchers obtained an impression—the first visual confirmation of the Wigner crystal.\n\nWhich choice best states the main idea of the text?","o":["Researchers have obtained the most definitive evidence to date of the existence of the Wigner crystal.","Researchers have identified an innovative new method for working with unusual crystalline structures.","Graphene is the most important of the components required to capture an image of a Wigner crystal.","It’s difficult to acquire an image of a Wigner crystal because of the crystal’s honeycomb structure."],"a":0,"r":"Choice A is the best answer because it most accurately states the main idea of the text. According to the text, Eugene Wigner hypothesized that a crystal could exist that would be composed of electrons and have a honeycomb-like shape. The text goes on to say that the existence of the Wigner crystal remained unconfirmed until Feng Wang and colleagues were able to make an impression of one using two semiconductors and an ultrathin sheet of graphene. Thus, the main idea is that researchers have obtained the most definitive evidence to date of the existence of the Wigner crystal. Choice B is incorrect because the text focuses on one kind of crystal—the Wigner crystal— and doesn’t discuss crystalline structures in general. And although the text conveys that Wang and colleagues figured out a way to capture an image of a Wigner crystal, it doesn’t address the idea of applying this approach to other types of crystals. Choice C is incorrect because the text describes in general the process Wang and colleagues followed to obtain an impression of the Wigner crystal; it doesn’t address the relative importance of each component in that process. Choice D is incorrect because the text doesn’t state that researchers had a hard time getting an impression of the Wigner crystal because of its honeycomb structure. Nothing in the text indicates why it took so long to prove the existence of this crystal or take an impression of it."},{"i":"e1504a2a","c":"infer","d":"M","s":"The Cretaceous pterosaur Tupandactylus navigans is known for having an anomalously oversized head crest. Until an almost complete fossil skeleton was found in Brazil, paleontologists had been able to study only skull specimens from T . navigans, though it was presumed that, like other pterosaurs, the species’s primary form of locomotion was powered flight. Examining the fuller skeleton in 2016, Victor Beccari and his team determined that T . navigans had long hind legs, short wings, and an unusually long neck—characteristics that, combined with the creature’s large-crested head, would have made sustained flight difficult and walking upright relatively comfortable.\n\nBased on these findings the team suggests that T . navigans likely ______ Which choice most logically completes the text?","o":["flew for longer distances than did other pterosaur species that had oversized head crests.","had longer wings than other pterosaur species considered to have been comfortable walking.","had a smaller head than researchers expected based on the earlier T . navigans skull specimens.","flew for shorter distances and spent more time walking than researchers previously thought."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the Cretaceous pterosaur Tupandactylus navigans. The text first describes what paleontologists initially speculated to be true of T . navigans based on observing only fossilized skulls of the pterosaur rather than complete skeletons—namely, that T . navigans had an oversized head crest and that, like other pterosaurs, its main mode of movement must have been flight. The text goes on to describe what researcher Victor Beccari and his team concluded based on studying a nearly complete fossilized skeleton of T . navigans, which provided additional information that fossilized skulls alone could not. Beccari and colleagues determined that T . navigans had long hind legs, short wings, and an unusually long neck, in addition to the oversized head crest previously observed by paleontologists. Taken together, these characteristics would have made sustained flight difficult and upright walking comfortable, which would make T . navigans different from other pterosaurs that moved mainly through flight. Thus, Beccari and colleagues suggest that previously held speculations of paleontologists are inaccurate: that instead of moving mainly through powered flight, T . navigans likely flew for shorter distances and spent more time walking than researchers previously thought. Choice A is incorrect because Beccari and his team determined, based on their examination of a nearly complete skeleton, that T . navigans would have found \"sustained flight difficult,\" which would differentiate it from most other pterosaurs that moved mainly through flight. Therefore, Beccari’s team would not suggest that T . navigans flew for longer distances than did other pterosaur species with large head crests. Choice B is incorrect because the fossilized skeleton studied by Beccari and colleagues was notable for its short wings, and because no indication in the text is made that other pterosaurs were thought by paleontologists to be comfortable walking. Therefore, Beccari’s team would not suggest that T . navigans had longer wings than other pterosaur species considered to have been comfortable walking. Choice C is incorrect because the text indicates that Beccari and his team agree with the paleontologists mentioned earlier in the text that T . navigans had a large-crested head. Therefore, Beccari’s team would not suggest that T . navigans had a smaller head than researchers previously expected."},{"i":"54057e3f","c":"infer","d":"M","s":"Although military veterans make up a small proportion of the total population of the United States, they occupy a significantly higher proportion of the jobs in the civilian government. One possible explanation for this disproportionate representation is that military service familiarizes people with certain organizational structures that are also reflected in the civilian government bureaucracy, and this familiarity thus ______ Which choice most logically completes the text?","o":["makes civilian government jobs especially appealing to military veterans.","alters the typical relationship between military service and subsequent career preferences.","encourages nonveterans applying for civilian government jobs to consider military service instead.","increases the number of civilian government jobs that require some amount of military experience to perform."],"a":0,"r":"Choice A is the best answer because it presents the conclusion that most logically follows from the text’s discussion of military veterans working in civilian government jobs in the United States. The text indicates that the proportion of military veterans working in civilian government jobs is considerably higher than the proportion of military veterans in the population as a whole. The text also notes that the unusually high representation of military veterans in these jobs may be a result of the organizational structures shared by civilian government entities and the military. Hence, it’s reasonable to infer that it’s the familiarity of the structures of civilian government that makes jobs there particularly attractive to military veterans. Choice B is incorrect because the text doesn’t address what a typical relationship between military service and later career preferences would be, and there’s no indication that it’s atypical for veterans to work in civilian government jobs after they’ve left the military. On the contrary, the text suggests that many military veterans are drawn to such jobs. Choice C is incorrect because the text is focused on the high representation of military veterans in civilian government jobs and doesn’t address nonveterans or their possible interest in military service. Choice D is incorrect because the text conveys that military veterans may be particularly interested in civilian government jobs due to the familiarity of organizational structures that are already in place, but there’s no reason to think that this interest would mean that more civilian government jobs will start to require military experience."},{"i":"71904085","c":"claim","d":"H","s":"Linguist Deborah Tannen has cautioned against framing contentious issues in terms of two highly competitive perspectives, such as pro versus con. According to Tannen, this debate-driven approach can strip issues of their complexity and, when used in front of an audience, can be less informative than the presentation of multiple perspectives in a noncompetitive format. To test Tannen’s hypothesis, students conducted a study in which they showed participants one of three different versions of local news commentary about the same issue. Each version featured a debate between two commentators with opposing views, a panel of three commentators with various views, or a single commentator.\n\nWhich finding from the students’ study, if true, would most strongly support Tannen’s hypothesis?","o":["On average, participants perceived commentators in the debate as more knowledgeable about the issue than commentators in the panel.","On average, participants perceived commentators in the panel as more knowledgeable about the issue than the single commentator.","On average, participants who watched the panel correctly answered more questions about the issue than those who watched the debate or the single commentator did.","On average, participants who watched the single commentator correctly answered more questions about the issue than those who watched the debate did."],"a":2,"r":"Choice C is the best answer because it presents the finding that, if true, would most strongly support Tannen’s hypothesis. According to the text, Tannen’s hypothesis is that multiple perspectives presented in a noncompetitive format is more informative than a debate between opposing viewpoints is. If participants who saw a panel of three commentators with various views about an issue answered more questions about the issue correctly than did participants who saw a debate, that would support Tannen’s hypothesis since it would show that participants who heard multiple varied perspectives were better informed than were participants who heard a debate between opposing viewpoints. Choice A is incorrect because finding that participants perceived commentators in the debate as more knowledgeable than commentators in the panel is irrelevant to Tannen’s hypothesis, which is that presenting multiple perspectives on an issue is more informative to the audience than presenting opposing views of the issue is. Participants’ perception of how knowledgeable panelists are has no bearing on how much participants learn from the panelists. Choice B is incorrect because finding that participants perceived commentators in the panel as more knowledgeable than a single commentator is irrelevant to Tannen’s hypothesis, which is that presenting multiple perspectives on an issue is more informative to the audience than presenting opposing views of the issue is. Participants’ perception of how knowledgeable panelists are has no bearing on how much participants learn from the panelists, and Tannen’s hypothesis says nothing about how informative single commentators are. Choice D is incorrect because finding that participants who watched a single commentator answered more questions correctly than participants who watched the debate did wouldn’t be relevant to Tannen’s hypothesis, which is that hearing multiple varying perspectives is more informative than hearing a debate. Tannen’s hypothesis says nothing about how informative single commentators are."},{"i":"98fd50f2","c":"claim","d":"M","s":"Among the most visited art museums in the world, the Galleria dell’Accademia in Florence had approximately 1.7 million visitors in 2019. The Galleria dell’Accademia also offers virtual tours that art lovers can view online for free. Although there were initial concerns that people who viewed the virtual tours would then consider an in-person visit unnecessary, museum administrators claim that their surveys of in-person visitors show that those concerns were unjustified.\n\nWhich statement, if true, would most directly support the administrators’ claim?","o":["Many surveyed visitors to the Galleria dell’Accademia indicated that the virtual tours convinced them to plan an in-person visit.","Most surveyed visitors to the Galleria dell’Accademia indicated that they were unaware of the virtual tours before their first in-person visit.","Most surveyed visitors to the Galleria dell’Accademia indicated that they lived somewhere other than Florence.","Many surveyed visitors to the Galleria dell’Accademia indicated that they would likely view the virtual tours in order to reminisce about their in- person visit."],"a":0,"r":"Choice A is the best answer because it presents a finding that, if true, would most directly support the museum administrators’ claim that concerns about virtual tours replacing in-person visits were unjustified. The text explains that after the Galleria dell’Accademia began offering online tours, there were concerns that if people viewed these virtual tours, they would consider an in-person visit to be unnecessary. The finding that many visitors who were surveyed indicated that the virtual tours actually convinced them to plan an in-person visit directly contradicts these concerns. Rather than deterring in-person visits, virtual tours actively encouraged them, providing strong support for the administrators’ claim that the initial concerns were unfounded. Choice B is incorrect. The finding that most surveyed visitors were unaware of the virtual tours before their first in-person visit wouldn’t directly address whether virtual tours affect decisions about in-person visits. This finding would only indicate that these particular visitors didn’t have the opportunity to be influenced by virtual tours when making their decision to visit. Choice C is incorrect because the geographic location of visitors wouldn’t address the impact of virtual tours on people’s decisions to visit the museum in person. Whether visitors live in Florence or elsewhere would suggest nothing about whether virtual tours influenced their choice. This information is irrelevant to the administrators’ claim about the relationship between virtual tours and in-person visits. Choice D is incorrect because visitors’ intentions to view virtual tours after their in-person visit wouldn’t address the initial concerns that virtual tours might make in-person visits seem unnecessary. This finding indicates that some visitors plan to use virtual tours as a way to remember their visit, but it provides no information about whether virtual tours influenced their decision to visit in person in the first place, which is what the administrators’ claim addresses."},{"i":"02848335","c":"graph","d":"H","s":"","o":["Both the ETL applied through spin coating and the ETL applied through spray coating showed a power conversion efficiency greater than 10% at their lowest performing thickness.","The lowest performing ETL applied through spray coating had a higher power conversion efficiency than the highest performing ETL applied through spin coating.","The highest performing ETL applied through spray coating showed a power conversion efficiency of approximately 13%, while the highest performing ETL applied through spin coating showed a power conversion efficiency of approximately 11%.","There was a substantial difference in power conversion efficiency between the lowest and highest performing ETLs applied through spray coating."],"a":1,"r":"Choice B is the best answer because it describes data from the graph that support Taylor and colleagues’ conclusion that spray coating holds promise for improving the power conversion efficiency of ETLs in perovskite solar cells. The text explains that perovskite solar cells’ efficiency at converting light into electricity is diminished by their electron transport layer (ETL), which is applied through spin coating, but that Taylor’s team devised a new spray coating method for applying the ETL that improves its power conversion efficiency. The graph displays data on the power conversion efficiency of solar cells in tests conducted by Taylor’s team, with bars for both the highest- and lowest-performing ETLs in two data categories: spray coating and spin coating. According to the graph, the lowest-performing ETL applied through spray coating had a power conversion efficiency of between 14% and 16%, while the highest-performing ETL applied through spin coating had a power conversion efficiency of less than 14%. These data confirm that ETLs applied through novel spray coating are more efficient than those applied though traditional spin coating. Thus, the data support Taylor and colleagues’ conclusion about spray coating’s potential value. Choice A is incorrect. Although this claim correctly describes the data in the graph by stating that both the lowest-performing ETL applied through spin coating and the lowest-performing ETL applied through spray coating had a power conversion efficiency greater than 10%, this relationship in the data doesn’t support or relate to Taylor and colleagues’ conclusion that spray coating promises greater efficiency for solar cells than traditional spin coating does. Choice C is incorrect. This claim does address the greater power conversion efficiency of the highest- performing ETL applied through spray coating, compared with the highest-performing ETL applied through spin coating. However, it also incorrectly cites the value for the efficiency of the highest-performing ETL applied through spray coating as approximately 13%, instead of a value between 14% and 16%, and the value for the efficiency of the highest-performing ETL applied through spin coating as approximately 11%, instead of a value between 12% and 14%, as shown in the graph. Choice D is incorrect because Taylor and colleagues’ conclusion is based on the difference in the power conversion efficiency of ETLs applied through spray coating and that of ETLs applied through spin coating, not on the difference between the highest- and lowest-performing ETLs applied through just spray coating."},{"i":"94c726fb","c":"graph","d":"E","s":"","o":["0.59 million metric tons of copper in 1995.","0.44 million metric tons of copper in 1995.","0.26 million metric tons of copper in 1995.","2.49 million metric tons of copper in 1995."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the statement about copper mining. The table shows the amount of copper mined in each of four countries in 1995 and 2020. According to the text, a student who consults the table notes that the country that mined 0.55 million metric tons of copper in 2020 had mined a different amount in 1995. The table indicates that Kazakhstan is the country that mined 0.55 million metric tons of copper in 2020 and 0.26 million metric tons of copper in 1995. Choice A is incorrect because it doesn’t provide the amount of copper mined in 1995 by Kazakhstan, the country that mined 0.55 million metric tons of copper in 2020. According to the table, Canada mined 0.73 million metric tons of copper in 1995 and 0.59 million metric tons in 2020. It didn’t mine 0.55 million metric tons in either year. Choice B is incorrect because it doesn’t provide the amount of copper mined in 1995 by Kazakhstan, the country that mined 0.55 million metric tons of copper in 2020. According to the table, Indonesia mined 0.44 million metric tons of copper in 1995 and 0.51 million metric tons in 2020. It didn’t mine 0.55 million metric tons in either year. Choice D is incorrect because it doesn’t provide the amount of copper mined in 1995 by Kazakhstan, the country that mined 0.55 million metric tons of copper in 2020. According to the table, Chile mined 2.49 million metric tons of copper in 1995 and 5.73 million metric tons in 2020. It didn’t mine 0.55 million metric tons in either year."},{"i":"8d53e7a0","c":"fss","d":"M","s":"Slam poet Elizabeth Acevedo’s debut novel The Poet X, winner of the 2018 National Book Award for Young People’s Literature, is composed of ______ protagonist, fifteen-year-old Xiomara Batista.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["poems putatively written by the novel’s","poem’s putatively written by the novel’s","poem’s putatively written by the novels’","poems putatively written by the novels’"],"a":0,"r":"Choice A is the best answer. Nothing belongs to the “poems” in the sentence, so it should not be possessive—just a simple plural noun. The protagonist does belong to the novel—it’s the protagonist of the novel—so “novel” needs to be a singular possessive noun. Choice B is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This choice uses the singular possessive “poem’s,” but the text indicates that it should be the simple plural “poems”: there is more than one poem, and nothing belongs to the poems. Choice C is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This choice uses the singular possessive “poem’s,” but the text indicates that it should be the simple plural “poems”: there is more than one poem, and nothing belongs to the poems. This choice also uses the plural possessive “novels’,” which is incorrect because there is only one novel. Choice D is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This choice uses the plural possessive “novels’,” which is incorrect because there is only one novel, so it should be the singular possessive “novel’s.” ."},{"i":"f40ca576","c":"fss","d":"E","s":"Each year in the fall, when the weather starts to cool in the northern hemisphere, millions of North American monarch butterflies journey south. Searching for food and warmer habitats, they ______ thousands of miles—from as far north as Canada all the way down to Mexico—on this annual migration.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["flew","were flying","had flown","fly"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verbs to express tense. In this choice, the present tense verb “fly” is consistent with the other present tense verb ( “journey”) used to describe the butterflies’ yearly migration. Together, these simple present tense verbs correctly indicate that the migration is a current, yearly occurrence. Choice A is incorrect. The simple past tense verb “flew” isn’t consistent with the other present tense verb used to describe the butterflies’ yearly migration. Choice B is incorrect. The past progressive tense verb “were flying” isn’t consistent with the other present tense verb used to describe the butterflies’ yearly migration. Choice C is incorrect. The past perfect tense verb “had flown” isn’t consistent with the other present tense verb used to describe the butterflies’ yearly migration."},{"i":"dd428136","c":"fss","d":"M","s":"Cheng Dang and her colleagues at the University of Washington recently ran simulations to determine the extent to which individual snow ______ affect the amount of light reflecting off a snowy surface.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["grain’s physical properties’","grains’ physical properties","grains’ physical property’s","grains physical properties"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of plural and possessive nouns. The plural possessive noun “grains’” and the plural noun “properties” correctly indicate that the simulations involved multiple snow grains and that those snow grains had several properties. Choice A is incorrect because the context requires the plural possessive noun “grains’” and the plural noun “properties,” not the singular possessive noun “grain’s” and the plural possessive noun “properties’.” Choice C is incorrect because the context requires the plural noun “properties,” not the singular possessive noun “property’s.” Choice D is incorrect because the context requires the plural possessive noun “grains’,” not the plural noun “grains.”"},{"i":"e15c50b2","c":"bound","d":"E","s":"A standard Argo float, a type of autonomous robot, measures temperature and salinity in the upper regions of ice-free oceans. More advanced floats can measure a wider range of ______ and monitor seasonal ice zones.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["variables: travel to greater depths","variables, travel to greater depths,","variables travel to greater depths,","variables, travel to greater depths;"],"a":1,"r":"Choice B is the best answer. The convention being tested is the punctuation of items in a series. The comma after “variables” is used conventionally to separate the first and second items in the series, and the comma after “depths” is used conventionally to separate the second and third items. Choice A is incorrect because a colon can’t be used in this way to separate items in a simple series. Choice C is incorrect because a comma is needed after “variables” to separate the first and second items in the series. Choice D is incorrect because a semicolon can’t be used in this way to separate items in a simple series."},{"i":"59a246dc","c":"bound","d":"H","s":"When external forces are applied to common glass made from silicates, energy builds up around minuscule defects in the material, resulting in fractures. Recently, engineer Erkka Frankberg of Tampere University in Finland used the chemical ______ to make a glassy solid that can withstand higher strain than silicate glass can before fracturing.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["compound, aluminum oxide","compound aluminum oxide,","compound, aluminum oxide,","compound aluminum oxide"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation around noun phrases. No punctuation is needed because the noun phrase “aluminum oxide” is a restrictive appositive, meaning that it provides essential identifying information about the noun phrase before it, “the chemical compound,” and thus doesn’t require punctuation around it. Choice A is incorrect because no punctuation is needed. Choice B is incorrect because no punctuation is needed. Choice C is incorrect because the noun phrase “aluminum oxide” is a restrictive appositive. Setting the phrase off with punctuation suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case."},{"i":"2b89bfe5","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In 1999, astronomer Todd Henry studied the differences in surface temperature between the Sun and nearby stars. His team mapped all stars within 10 parsecs (approximately 200 trillion miles) of the Sun. The surface temperature of the Sun is around 9,800°F , which classifies it as a G star. 327 of the 357 stars in the study were classified as K or M stars, with surface temperatures under 8,900°F (cooler than the Sun). 11 of the 357 stars in the study were classified as A or F stars, with surface temperatures greater than 10,300°F (hotter than the Sun). The student wants to emphasize how hot the Sun is relative to nearby stars.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["At around 9,800°F , which classifies it as a G star, the Sun is hotter than most but not all of the stars within 10 parsecs of it.","Astronomer Todd Henry determined that the Sun, at around 9,800°F , is a G star, and several other stars within a 10-parsec range are A or F stars.","Of the 357 stars within ten parsecs of the Sun, 327 are classified as K or M stars, with surface temperatures under 8,900°F .","While most of the stars within 10 parsecs of the Sun are classified as K, M, A, or F stars, the Sun is classified as a G star due to its surface temperature of 9,800°F ."],"a":0,"r":"Choice A is the best answer. Noting that the Sun (9,800°F) is hotter than most stars within 10 parsecs of it, the sentence emphasizes how hot the Sun is relative to nearby stars. Choice B is incorrect. The sentence explains that astronomer Todd Henry determined the classifications for the Sun and several other stars nearby; it doesn’t emphasize how hot the Sun is relative to nearby stars. Choice C is incorrect. The sentence explains that the majority of stars near the Sun are classified as K or M stars; it doesn’t indicate the Sun’s temperature or emphasize how hot it is relative to nearby stars. Choice D is incorrect. While the sentence indicates that the Sun is classified differently than most nearby stars due to its surface temperature, it doesn’t emphasize how hot the Sun is relative to nearby stars."},{"i":"88308a39","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Shaun Tan is an Australian author. In 2008, he published Tales from Outer Suburbia, a book of fifteen short stories. The stories describe surreal events occurring in otherwise ordinary suburban neighborhoods. In 2018, he published Tales from the Inner City, a book of twenty-five short stories. The stories describe surreal events occurring in otherwise ordinary urban settings. The student wants to emphasize a similarity between the two books by Shaun Tan.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Shaun Tan’s book Tales from Outer Suburbia, which describes surreal events occurring in otherwise ordinary places, contains fewer short stories than Tales from the Inner City does.","Tales from Outer Suburbia was published in 2008, and Tales from the Inner City was published in 2018.","Unlike Tales from the Inner City, Shaun Tan’s book Tales from Outer Suburbia is set in suburban neighborhoods.","Shaun Tan’s books Tales from Outer Suburbia and Tales from the Inner City both describe surreal events occurring in otherwise ordinary places."],"a":3,"r":"Choice D is the best answer. The sentence uses “both” to emphasize a thematic similarity between Tan’s two books, noting that both Tales from Outer Suburbia and Tales from the Inner City describe surreal events occurring in otherwise ordinary places. Choice A is incorrect. The sentence emphasizes a difference (one contains fewer stories than the other), not a similarity, between the two books. Choice B is incorrect. The sentence indicates that Tan’s books were published ten years apart; it doesn’t emphasize a similarity between the two books. Choice C is incorrect. The sentence uses “unlike” to emphasize a difference between Tales from Outer Suburbia and Tales from the Inner City; it doesn’t emphasize a similarity between the two books."},{"i":"87d8a2ff","c":"trans","d":"E","s":"During a 2021 launch, Rocket Labs’ Electron rocket experienced an unexpected failure: its second-stage booster shut down suddenly after ignition. ______ instead of downplaying the incident, Rocket Labs’ CEO publicly acknowledged what happened and apologized for the loss of the rocket’s payload, which had consisted of two satellites.\n\nWhich choice completes the text with the most logical transition?","o":["Afterward,","Additionally,","Indeed,","Similarly,"],"a":0,"r":"Choice A is the best answer. “Afterward” logically signals that the events described in this sentence—the CEO’s public acknowledgment and apology—occurred after the rocket booster’s failure and are part of a chronological sequence of events. Choice B is incorrect because “additionally” illogically signals that the events described in this sentence merely occurred in addition to the rocket booster’s failure. Instead, they occurred after the rocket booster’s failure and are part of a chronological sequence of events. Choice C is incorrect because “indeed” illogically signals that the events described in this sentence emphasize or strengthen a statement made in the previous sentence. Instead, they occurred after the rocket booster’s failure and are part of a chronological sequence of events. Choice D is incorrect because “similarly” illogically signals that the events described in this sentence are similar to the rocket booster’s failure. Instead, they occurred after the rocket booster’s failure and are part of a chronological sequence of events."},{"i":"56336696","c":"trans","d":"E","s":"When using sumac for dyeing cloth, textile artists first soak it in water to release its color. Then, they add the cloth to the dyebath and simmer it for hours, perhaps even days. ______ they will remove the cloth, at which point it will have turned a vibrant red color.\n\nWhich choice completes the text with the most logical transition?","o":["Nevertheless,","Likewise,","Eventually,","In other words,"],"a":2,"r":"Choice C is the best answer. \"Eventually\" logically signals that the information in this sentence—that textile artists will remove the cloth when it has turned red—is the final step in the chronological sequence of the dyeing process described in the previous sentences. Choice A is incorrect because \"nevertheless\" illogically signals that the information in this sentence is true despite the previous information about simmering the cloth in the dyebath. Instead, the removal of the cloth is the final step in the dyeing process. Choice B is incorrect because \"likewise\" illogically signals that the information in this sentence is similar to the previous information about simmering the cloth in the dyebath. Instead, the removal of the cloth is the final step in the dyeing process. Choice D is incorrect because \"in other words\" illogically signals that the information in this sentence is a paraphrase or restatement of the previous information about simmering the cloth in the dyebath. Instead, the removal of the cloth is the final step in the dyeing process."},{"i":"de0bcf4f","c":"trans","d":"E","s":"Spanish surrealist Oscar Dominguez, like many of his contemporaries, wanted to incorporate elements of chance and randomness in his artistic process. ______ he employed techniques that produced random, unpredictable results, such as decalcomania, which involved pressing a blank canvas onto a paint-covered surface to generate abstract patterns.\n\nWhich choice completes the text with the most logical transition?","o":["With this in mind,","On the contrary,","In conclusion,","Regardless,"],"a":0,"r":"Choice A is the best answer. \"With this in mind\" logically signals that the activity described in this sentence—Dominguez’s use of techniques like decalcomania to produce unpredictable abstract patterns—is a result of his desire to include random elements in his art. Choice B is incorrect. \"On the contrary\" illogically signals that the activity in this sentence opposes or is contrary to Dominguez’s desire to use random elements in his art. Instead, his use of decalcomania is a result of that desire. Choice C is incorrect. \"In conclusion\" illogically signals that the activity in this sentence is a conclusion or summary of Dominguez’s desire to use random elements in his art. Instead, his use of decalcomania is a result of that desire. Choice D is incorrect. \"Regardless\" illogically signals that the activity in this sentence occurs despite Dominguez’s desire to use random elements in his art. Instead, his use of decalcomania is a result of that desire."}],"img":{"02848335":"iVBORw0KGgoAAAANSUhEUgAAArwAAAJ1BAMAAADJcz4MAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABiOElEQVR42u1dd1wURxt+Zu+Oo98sYC8s2PsiRI317F3PGv2M8ewaNcEYY0vBEmsSMSa2aMRYEmuwdz1717M3lMOo0ajcHDak3Hx/gAoHSInEts/vp9ztzezsPPvuO2+ZmQUUKFCgQIECBQoUKFCgQIECBQoUKFDwZoAm/yWp/mQGohD3Inb8qQO7AOAtp8efID0/6FcZTj+rx9cDQORn5cizE5Hh8ivojfC60es0a5mUxAp7LsUFfp9Mn1HOn/Gr0T+rln/WcKmPtYy9PQAhBAQAT/4HBoBo61BFdgHXH5uudhRTYWvloHQl/TljBccWo7+jC0SSfJg66Bg3g8ItAJdgIUq9fY0mWBOqMrpckpyaLoR6F4DmF2TXJof8wtBY/G4t6bms2Ip1mjaaI6FCh+WDgUIGOF0dv2Ntb5S75BcqzF2o6rM1GM22fEBVIcCoA8KvBxVuAbgGa3aVHzwoj8n9mkvYpjxr3DfKcA2lUO0rEO5xumzoGcxxHdNCimhX2FDfNWRQ3V9IROAmoMBnxVQbxV+kP9TnimvMBUK+VF3y2a/aH1TY4BKGfLtrhNbo8Sp6o37t+G3oMb/OVPeO93UbhPAfPYLIITM4GNEe+VuLeZf9ZpKCPn8m6CNWuovhrqzc9KO+T44tBGJGdgm0WE0WproUoaYN1rjXeXJ3nfbwUa3haBg0Xx9aPCXPq+jMaze08eLasKJIqCi0WEtvxH5xlZtAQAFiRhQsnK1Vu9fp+wlLQOz/BnNbYdgDIgGAfx4IwBdUZQKxiH0/QiQgWBBXTzZBZInk+Uj5TtOLmV+CgOB0rRPBJ7STa+oouN0PnEvwBYC77U0YOT5cRELTTkRnI4RZAQICERQA45Ry2CeO3w1QO6DbVwPg4FYOhV4AoBSnpOJhe4pGd018cJWCAXEuIAmy2gOM0LjRptW1IwHQhB85bvK2u0QQDh2zgsECJBgZp7vqROoYkNADWFcDuGpwsQhUoRcAZQzLts0xn9yR4M6HHVvDKAUffOxi/JWDczl4VKLO9PDLCCkSbof7g049OgwMHCDzrsgUEpCw7aiE819eAgXitlymq68CsTVPhdiZ4s49NXa9pCTjVaic9MjDzw+CX5IRKwLefqAgxSgB/CkoBACiCBEgoII/ARUCAOoFwR/uBgBeFK9Get+s6EMax5imH2J4fpAMVNjLjNR/8VhXW6fwmIvwlhQOFChQoECBAgUKXqYbl4EBnI4nRkja0oo7nKFXQTImO4OjJMmVI5SK6d6Adxlqmpwry0DiCstQSVBLpQCgKX12HwiFqkOb5ELC9hAAJCkVR9RG8spk+HWLmGllgDMk53gBAPVSSikBNEZoZQoAXkncMoC0Zsj3+SBDUjHNXyEA5ToGABws6VxcoRcCAO968I function card(q,n){const a=ans[q.i];

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
