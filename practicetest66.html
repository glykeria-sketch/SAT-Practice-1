<script>
const D={"t":"Practicetest66","q":[{"i":"0d402146","c":"vocab","d":"E","s":"US traffic signals didn’t always contain the familiar three lights (red, yellow, and green). Traffic lights only ______ red and green lights until the three-light traffic signal was developed in the 1920s.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["avoided","featured","appreciated","disregarded"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of traffic signals. As used in this context, “featured” means had as a characteristic or part. The text indicates that although US traffic signals have lights of three different colors (red, yellow, and green), this wasn’t the case until the 1920s, when the three-light signal was first developed. Before then, the text suggests, traffic signals had fewer lights (as indicated by the word “only” in the second sentence). This context supports the idea that before the 1920s, traffic signals featured only red and green lights. Choice A is incorrect because “avoided” means kept away from someone or something or prevented something from occurring, neither of which would make sense in context. The text doesn’t discuss keeping away from someone or something but instead focuses on what US traffic signals look like. The text states that they didn’t have lights of three different colors until the three-light signal was developed in the 1920s. Choice C is incorrect because “appreciated” means admired or increased in value, neither of which would make sense in context. The text focuses solely on the fact that US traffic signals have contained lights of three colors only since the three-light signal was developed in the 1920s. The text doesn’t mention how this characteristic or traffic signals in general are perceived or what their value is. Moreover, the blank portion of the text describes “traffic signals,” which are lifeless objects and therefore unable to admire or increase the value of something. Choice D is incorrect because “disregarded” means ignored or treated something as unworthy of notice, neither of which would make sense in context. The text doesn’t discuss how people react to traffic signals; rather, it addresses the idea that US traffic signals have contained lights of three colors only since the three-light signal was developed in the 1920s. Moreover, the blank portion of the text describes “traffic signals,” which are lifeless objects and therefore unable to ignore or treat something in a particular manner."},{"i":"0ed8f24f","c":"vocab","d":"H","s":"K.D. Leka and colleagues found that the Sun’s corona provides an advance indication of solar flares—intense eruptions of electromagnetic radiation that emanate from active regions in the Sun’s photosphere and can interfere with telecommunications on Earth. Preceding a flare, the corona temporarily exhibits increased brightness above the region where the flare is ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["antecedent","impending","innocuous","perpetual"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of advance indications of solar flares. In this context the word \"impending\" means imminent or approaching. The text mentions a study by Leka and colleagues that found that the Sun’s corona provides an advance indication of solar flares. The text then points out why such an advance indication would be useful—solar flares can interfere with communications on Earth—and concludes by describing the characteristic of the corona that gives warning of a solar flare. The text indicates that this characteristic—increased brightness in a particular region of the corona—comes before the appearance of the flare. Therefore, in context, the best answer would indicate that the flare is approaching, or impending. Choice A is incorrect. The best answer would be one that indicates that the increased brightness of the Sun’s corona precedes the appearance of the flare. But if the flare were \"antecedent,\" or previous, then the flare would instead precede the appearance of the increased brightness of the corona, a statement that is logically inconsistent. Choice C is incorrect. The word \"innocuous,\" or harmless, does not logically complete the text; since solar flares can interfere with communications on Earth, they cannot reasonably be described as innocuous. Choice D is incorrect. If the solar flares have an advance indication of their appearance, then there must therefore be a time before the appearance of the flares when they do not exist. But the word \"perpetual,\" or never-ending, would in context indicate that the flare exists at the same time as the advance indication provided by the Sun’s corona, which would not make logical sense."},{"i":"4480fae9","c":"vocab","d":"E","s":"The following text is adapted from Sui Sin Far’s 1912 short story “Mrs. Spring Fragrance.” Mr. and Mrs. Spring Fragrance immigrated to the United States from China. Mrs. Spring Fragrance was unaware that Mr. Spring Fragrance, tired with the day’s business, had thrown himself down on the bamboo settee on the veranda, and that although his eyes were engaged in scanning the pages of the Chinese World, his ears could not help receiving the words which were borne to him through the open window.\n\nAs used in the text, what does the word “receiving” most nearly mean?","o":["Denying","Entering","Carrying","Hearing"],"a":3,"r":"Choice D is the best answer because as used in the text, “receiving” most nearly means hearing, or perceiving sound. The text describes Mr. Spring Fragrance as he reads a newspaper, focusing on his eyes and ears. While his eyes look at the newspaper, he is unwillingly distracted by words coming through a nearby open window (that is, “his ears could not help receiving the words”). The words are being perceived specifically by his ears and not his eyes, and ears are the organs of sense with which one hears, so therefore Mr. Spring Fragrance is hearing the words through the open window. Choice A is incorrect because there is no indication in the text that Mr. Spring Fragrance is denying, or refusing the truth of, the words coming to him through the window. He is merely distracted by them. Choice B is incorrect because it wouldn’t make sense to say that Mr. Spring Fragrance’s ears couldn’t help entering, or coming into, the words coming to him through the window. Instead, the text indicates that the opposite occurs: that is, when Mr. Spring Fragrance hears the words, they enter his ears, but his ears don’t enter the words. Choice C is incorrect because it doesn’t make sense in this context to think of Mr. Spring Fragrance as carrying the words coming to him through the window, even though the word “carry” can have a number of different meanings depending on context: for example, he is not lifting them, he is not supporting them, and he is not accepting blame for them (as one “carries the blame” for a mistake)."},{"i":"9ccf463e","c":"vocab","d":"E","s":"The following text is from Nella Larsen’s 1928 novel Quicksand. The trees in their spring beauty sent through her restive mind a sharp thrill of pleasure. Seductive, charming, and beckoning as cities were, they had not this easy unhuman loveliness.\n\nAs used in the text, what does the word “beckoning” most nearly mean?","o":["Demanding","Signaling","Inviting","Shifting"],"a":2,"r":"Choice C is the best answer because as used in the text, “beckoning” most nearly means “inviting,” or attractive. The text portrays a woman who is looking at “trees in their spring beauty.” She compares them to cities, which have their own pleasures even if they do not have the “easy unhuman loveliness” of trees: she thinks of cities as “seductive” and “charming,” both adjectives that signify something that is enticing, or attractive. Therefore, cities that are seductive and charming would also be described as inviting people closer to them. Choice A is incorrect because there is no indication in this context that cities are “demanding,” or requiring effort. Choice B is incorrect. Though “signaling,” or communicating something, might be considered a key feature of the act of “beckoning,” in the context here, “beckoning” suggests that cities have attractive qualities that naturally draw people to them. Such attractive qualities are not described by the word “signaling” alone. Therefore, “signaling” is an incorrect answer because it is insufficiently precise. Choice D is incorrect because there is no reason to think in this context that the cities are “shifting,” or changing shape."},{"i":"e5da61f1","c":"purpose","d":"E","s":"The following text is adapted from Charles Chesnutt’s 1899 short story “Mars Jeems’s Nightmare.”The narrator and his wife have recently moved to the southern United States, and Julius is their carriage driver. Julius [was] very useful when we moved to our new residence. He had a thorough knowledge of the neighborhood, was familiar with the roads and the watercourses, knew the qualities of the various soils and what they would produce, and where the best hunting and fishing were to be had. He was a marvelous hand in the management of horses and dogs.\n\nWhich choice best states the main purpose of the text?","o":["To compare the narrator’s reaction to a new home with his wife’s reaction","To give an example of Julius’s knowledge about soil","To show that the narrator and Julius often hunt and fish together","To explain different ways in which Julius was helpful"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain different ways in which Julius was helpful. The text begins with the narrator stating that Julius was very helpful to him and his wife when they moved to their new residence. The narrator then provides a list of examples to illustrate Julius’s helpfulness. For instance, the narrator states that Julius was familiar with the neighborhood’s roads, which suggests that he was helpful in navigating them, and that Julius helped manage the horses and dogs. The text’s many examples of Julius’s usefulness reinforce just how helpful he was and in how many different ways. Choice A is incorrect because the text doesn’t portray either the narrator’s or his wife’s reaction to their new home. Rather, the text focuses on how Julius was useful to the narrator and his wife in their new home. Choice B is incorrect. Although the text states that Julius was knowledgeable about the soil, this is one of several supporting details that illustrate how helpful Julius was. Moreover, the text merely states that Julius was knowledgeable about soil; it doesn’t provide an example of that knowledge. Choice C is incorrect because there’s nothing in the text to suggest the frequency with which the narrator and Julius hunted and fished together. In fact, it’s unclear from the text whether the narrator and Julius hunted and fished together at all. The text merely indicates that Julius knew the best places to hunt and fish—a detail that supports the text’s main purpose by conveying Julius’s usefulness."},{"i":"82cb7dda","c":"purpose","d":"H","s":"The field of study called affective neuroscience seeks instinctive, physiological causes for feelings such as pleasure or displeasure. Because these sensations are linked to a chemical component (for example, the release of the neurotransmitter dopamine in the brain when one receives or expects a reward), they can be said to have a partly physiological basis. These processes have been described in mammals, but Jingnan Huang and his colleagues have recently observed that some behaviors of honeybees (such as foraging) are also motivated by a dopamine-based signaling process.\n\nWhat choice best describes the main purpose of the text?","o":["It describes an experimental method of measuring the strength of physiological responses in humans.","It illustrates processes by which certain insects can express how they are feeling.","It summarizes a finding suggesting that some mechanisms in the brains of certain insects resemble mechanisms in mammalian brains.","It presents research showing that certain insects and mammals behave similarly when there is a possibility of a reward for their actions."],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to summarize a finding suggesting that some mechanisms in the brains of certain insects resemble mechanisms in mammalian brains. The text begins by explaining that feelings such as pleasure and displeasure are linked to chemical processes in the brain, such as the release of dopamine when one receives a reward. The text then indicates that such processes have been seen in mammals but that researchers have recently observed similar processes involving dopamine in honeybees. Taken together, this information serves to sum up the discovery that some mechanisms in the brains of certain insects may resemble mechanisms linked to feelings such as pleasure and displeasure in mammals. Choice A is incorrect because the text doesn’t describe any experiments or experimental methods. Instead, the text describes a phenomenon that has been observed in mammals and then presents the recent observations of Huang and colleagues that this phenomenon is also seen in honeybees. Choice B is incorrect because there’s nothing in the text to suggest that certain insects can express how they’re feeling through particular processes. The text does indicate that certain honeybee behaviors such as foraging are linked to dopamine, but it doesn’t suggest that these behaviors enable honeybees to communicate feelings or sensations. Choice D is incorrect because the text presents research showing that certain honeybee behaviors such as foraging are linked to dopamine and therefore may be motivated by similar mechanisms to those in mammalian brains, not that honeybees and mammals behave similarly when there is the possibility of reward for their actions."},{"i":"749f3334","c":"func","d":"M","s":"The following text is from Charlotte Forten Grimké’s 1888 poem “At Newport.” Oh, deep delight to watch the gladsome waves Exultant leap upon the rugged rocks; <u>Ever repulsed, yet ever rushing on— Filled with a life that will not know defeat;<\/u> To see the glorious hues of sky and sea. The distant snowy sails, glide spirit like, Into an unknown world, to feel the sweet Enchantment of the sea thrill all the soul, Clearing the clouded brain, making the heart Leap joyous as it own bright, singing waves!\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It portrays the surroundings as an imposing and intimidating scene.","It characterizes the sea’s waves as a relentless and enduring force.","It conveys the speaker’s ambivalence about the natural world.","It draws a contrast between the sea’s waves and the speaker’s thoughts."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The text presents the speaker’s experience of viewing the sea. In the underlined portion, the speaker focuses on the idea that the waves hitting rocks on the shore are a relentless and enduring force: they are constantly pushed back (“ever repulsed”) but always return (“ever rushing on”), as though they have an energy that can’t be overcome (“a life that will not know defeat”). Choice A is incorrect. Although the underlined portion characterizes the waves as a relentless force (always “repulsed” but still “rushing on” and never being defeated), the speaker doesn’t suggest that the surroundings are intimidating. Instead, the speaker presents the scene in a positive way, describing the “deep delight” of the “gladsome,” or cheerful, waves and feeling “the heart / Leap joyous” while viewing the sea. Choice C is incorrect because the underlined portion doesn’t suggest that the speaker is ambivalent, or has mixed feelings about, the natural world. Instead, it presents a single view of one part of the immediate surroundings: the speaker characterizes the sea’s waves as an unstoppable force, since they are constantly pushed back but always return (“ever repulsed, yet ever rushing on”). Choice D is incorrect. Although the text later suggests the speaker’s view of her own thoughts by referring to a “clouded brain” and a heart that leaps joyously, this reference neither occurs within the underlined portion nor establishes a clear contrast with the relentless determination of the waves. The underlined portion addresses only the speaker’s view of the waves and doesn’t suggest what her own thoughts might be."},{"i":"ea9dfe27","c":"func","d":"E","s":"The following text is from Joan Didion’s memoir The Year of Magical Thinking. In the text, the author discusses her home life. [I]n California we heated our houses by building fires. We built fires even on summer evenings, because the fog came in. <u>Fires said we were home, we had drawn the circle, we were safe through the night.<\/u> ©2005 by Joan Didion Which choice best describes the function of the underlined portion in the text as a whole?","o":["It illustrates that a fire provides comfort beyond physical warmth.","It summarizes the information that came before it in the text.","It explains that the house remains cold even in summer.","It suggests that the author feels comfortable in her home with or without a fire."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The first two sentences of the text establish that in California, houses were heated by building fires year-round. The underlined portion then indicates that the fires didn’t merely provide physical warmth: they also represented being \"home\" and feeling protected. The underlined portion thus illustrates that a fire provides comfort beyond physical warmth. Choice B is incorrect because the underlined portion doesn’t summarize information that came before it. Whereas the previous two sentences describe fires’ ability to provide physical warmth to homes, the underlined portion focuses on the psychological comfort the fires offered. Choice C is incorrect. Although the text’s second sentence mentions that fires were built in the summer because fog came in, which may have cooled the house, this detail isn’t the focus of the underlined portion. Instead, the underlined portion indicates that fires were built for reasons beyond physical warmth: to create a sense of being home and safe. Choice D is incorrect because the underlined portion focuses on the emotional significance the author places on having a fire going inside the home. There is no indication that the author feels equally comfortable without a fire present."},{"i":"c106b9f7","c":"cross","d":"E","s":"Text 1 American sculptor Edmonia Lewis is best known for her sculptures that represent figures from history and mythology, such as The Death of Cleopatra and Hagar. Although Lewis sculpted other subjects, her career as a sculptor is best represented by the works in which she depicted these historical and mythical themes.\n\nText 2 Art historians have typically ignored the many portrait busts Edmonia Lewis created. Lewis likely carved these busts (sculptures of a person’s head) frequently throughout her long career. She is known for her sculptures that represent historical figures, but Lewis likely supported herself financially by carving portrait busts for acquaintances who paid her to represent their features. Thus, Lewis’s portrait busts are a central aspect of her career as a sculptor.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Lewis’s portrait busts have overshadowed her other work.","The Death of Cleopatra is Lewis’s most famous piece.","Sculpting representations of historical figures was a short-lived trend.","Lewis’s works are varied in the subjects they depict."],"a":3,"r":"Choice D is the best answer. Author 1 acknowledges that Lewis sculpted other subjects besides historical and mythical figures, suggesting a variety of subjects depicted. Author 2 mentions that Lewis carved portrait busts as well as historical sculptures, which also implies variation among Lewis’s subjects. Choice A is incorrect. Neither text suggests that Lewis’s portrait busts have received more attention or appreciation than her other work. Author 1 briefly mentions her “other works,” but mostly focuses on her historical and mythical works. Author 2 states that art historians have typically ignored her portrait busts, which suggests that they haven’t overshadowed her other work. Choice B is incorrect. Neither text explicitly states that The Death of Cleopatra is Lewis’s most famous piece. Author 1 mentions it as one example of her historical works, but does not single it out as being more important or influential than Hagar. Author 2 does not mention it at all, focusing instead on her portrait busts. Choice C is incorrect. This choice isn’t supported by the texts. Neither text suggests that sculpting historical figures was a trend that faded quickly."},{"i":"251e5281","c":"main","d":"H","s":"Studies of ocean wave breaking have predominantly focused on traveling waves (those propagating along the horizontal plane), so Mark McAllister et al. utilized a circular wave tank to produce and study spike waves, axisymmetric standing waves that can erupt vertically when traveling waves propagating in opposing directions intersect. Traveling waves break when wave steepness (height-to-length ratio) passes a critical threshold; breaking thus constrains wave height. McAllister et al. found that spike waves can exceed that constraint, as other factors than just steepness (e.g., jet stability and cavity shape) mediate spike-wave breaking.\n\nWhich choice best states the main idea of the text?","o":["Previous studies have suggested that steepness mediates breaking in traveling waves, but the study by McAllister et al. shows that jet stability and cavity shape may also influence breaking in such waves.","The process of breaking limits the height of traveling waves, but the study by McAllister et al. suggests that spike waves can exceed those limits if their height-to-length ratio reaches a critical threshold.","McAllister et al. suggest that spike waves can form when traveling waves propagating in opposing directions intersect and that spike waves tend to be higher than traveling waves.","The study by McAllister et al. suggests that when traveling waves intersect in specific ways, the resulting wave may be higher than would be expected based on the properties of traveling waves."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text begins by explaining that most studies of ocean wave breaking have focused on traveling waves (those that move horizontally) but that McAllister et al. studied spike waves, which form when traveling waves moving in opposing directions intersect. The text establishes that while traveling waves break when their steepness exceeds a critical threshold (limiting their height), McAllister et al. found that spike waves can exceed these constraints because factors like jet stability and cavity shape can mitigate the effects of steepness. Thus, the main idea of the text is that spike waves resulting from traveling waves intersecting in specific ways can reach heights greater than what would be expected based on the general properties of traveling waves. Choice A is incorrect because it misrepresents the information in the text; the text indicates that McAllister et al. showed that jet stability and cavity shape (along with steepness) influence breaking in spike waves, not in traveling waves. Further, the information about specific influences is not the main focus of the text. Choice B is incorrect because it misrepresents the information in the text; the text indicates that McAllister et al. found that spike waves can pass the steepness threshold at which traveling waves break because factors like jet stability and cavity shape affect the breaking of spike waves, not because they’ve simply reached a critical threshold of steepness. Choice C is incorrect. Although the text does explain that spike waves can form when traveling waves intersect, it presents this as a known fact that McAllister et al.’s study was based on, not as something the researchers suggested. Further, the text indicates that spike waves can exceed a threshold that limits traveling wave height but doesn’t focus on the idea that spike waves typically are higher than traveling waves."},{"i":"7921b86b","c":"main","d":"E","s":"Oluwaseyi Moejoh cofounded U-recycle Initiative Africa when she was only a teenager. Moejoh and her team founded the organization to teach young people how their actions affect the environment and why recycling is important. For example, the organization put on an exhibit of art made using recycled materials.\n\nAccording to the text, what is one reason Moejoh and others founded U-recycle Initiative Africa?","o":["To bring attention to overlooked African artists","To teach young people why recycling is important","To help adults gain important outdoor skills","To give teenagers advice about starting businesses"],"a":1,"r":"Choice B is the best answer because it describes a reason that Moejoh and team founded U-recycle Initiative Africa. The text mentions two reasons the initiative was founded: to teach young people about how they affect the environment and to teach them “why recycling is important.” Thus, teaching the importance of recycling to young people accurately describes a motivation that the text cites as a reason for the initiative’s founding. Choice A is incorrect. Although art is mentioned in the text, there are no details about artists or whether they are being overlooked. Choice C is incorrect because the text is explicitly about young people and their relationship to the environment and recycling. There is no mention of adults or outdoor skills. Choice D is incorrect. Although the text discusses young people, which likely includes teenagers, there is no mention of starting businesses."},{"i":"3882ddf6","c":"infer","d":"M","s":"To investigate the history of plate subduction—when one of Earth’s tectonic plates slides beneath another—Sarah M. Aarons and colleagues compared ancient rocks from the Acasta Gneiss Complex in Canada to modern rocks. Using isotope analysis, the researchers found that Acasta rocks dating to about 4.02 billion years ago (bya) most strongly resemble modern rocks formed in a plume setting (an area in which hot rocks from Earth’s mantle flow upward into the crust). By contrast, they found that Acasta rocks dating to about 3.75 bya and 3.6 bya have an isotope composition that is similar to that of modern rocks formed in a subduction setting. Aarons’s team therefore concluded that ______ Which choice most logically completes the text?","o":["subduction-like processes began occurring in some locations no later than 3.75 bya.","subduction replaced mantle plume formation as the most common geological process by about 4.02 bya.","the majority of the rocks in the Acasta Gneiss Complex formed through subduction.","the rocks in the Acasta Gneiss Complex are of a more recent origin than scientists previously thought."],"a":0,"r":"Choice A is the best answer. Because researchers found “Acasta rocks dating to about 3.75 bya” were similar to “modern rocks formed in a subduction setting,” we can infer that subduction-like processes must have begun occurring in the Acasta Gneiss Complex by this time. Choice B is incorrect. We only know about geological processes at the Acasta Gneiss Complex, so we do not have information to make inferences about geological processes in general. Also, notice that the rocks dated to 4.02 bya were found to still be formed in a plume setting, so the transition must have happened after this time. Choice C is incorrect. There’s no mention in the passage of what proportion of the rocks within Acasta Gneiss Complex were formed through subduction, so there’s no basis for this inference. Choice D is incorrect. The passage discusses various rocks in the Acasta Gneiss Complex that are dated to different periods of time, but nothing in the passage suggests that these dates are or were wrong."},{"i":"fc1259dd","c":"infer","d":"E","s":"Archaeologist Christiana Kohler and her team excavated the Egyptian tomb of Queen Merneith, the wife of a First Dynasty pharaoh. Some scholars claim that she also ruled Egypt on her own and was actually the first female pharaoh. The team found a tablet in Merneith’s tomb with writing suggesting that she was in charge of the country’s treasury and other central offices. Whether Merneith was a pharaoh or not, this discovery supports the idea that Merneith likely ______ Which choice most logically completes the text?","o":["had an important role in Egypt’s government.","lived after rather than before the First Dynasty of Egypt.","traveled beyond Egypt’s borders often.","created a new form of writing in Egypt."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of the evidence found in Queen Merneith’s tomb. The text begins by mentioning archaeologists’ efforts to excavate the tomb of Queen Merneith, the wife of a pharaoh who some scholars think was actually the first female pharaoh. The text states that a tablet discovered in her tomb suggests she \"was in charge of the country’s treasury and other central offices,\" which supports the idea that she had an important role in Egypt’s government. Choice B is incorrect because since the text explicitly states that Merneith’s husband was a First Dynasty pharaoh, it can be inferred that she lived during the First Dynasty, not after it. Choice C is incorrect because the text does not provide any evidence that Merneith traveled beyond Egypt’s borders often. The text is focused on the archaeological discovery in her tomb and the implications about her potential role as a ruler in Egypt but does not mention anything about her traveling habits. Choice D is incorrect because the text does not mention anything about Merneith creating a new form of writing in Egypt. The text discusses the discovery of a tablet with writing suggesting her governmental role but does not imply that this writing represented a new form created by Merneith."},{"i":"4d38c2ea","c":"claim","d":"H","s":"Gorgets, or necklaces with large pendants, have been part of the ceremonial attire of tribes from the US Southeast for centuries. One of the oldest examples, the Fairfield Gorget, was found in Fairfield, Missouri, in 1958. Its overall design resembles that of other art from the region during the Mississippian period (900–1600 CE). Yet the image on the gorget is of a jaguar—a species whose range doesn’t extend to Missouri. Jaguar images are common in ancient Mexican art, and Mexico lies squarely in the species’ range. Therefore, some scholars argue that <u>long- distance trade in Mexican art objects brought the imagery to Missouri, where a local artist could have adopted it and incorporated it into the Fairfield Gorget.<\/u> Which finding, if true, would most strongly support the underlined explanation?","o":["The Fairfield Gorget is dated not to the Mississippian period but instead to the earlier Woodland period, which ended around 900 CE.","The range of the jaguar is shown to have expanded dramatically after the Mississippian period came to a close around 1600 CE.","An ancient Mexican art object is found at a site that dates to the Mississippian period and is close to where the Fairfield Gorget was found.","Certain works by present-day artists from Southeastern tribes reflect outside cultural influences, including contemporary Mexican art."],"a":2,"r":"Choice C is the best answer because it presents a finding that, if true, would most strongly support the underlined explanation that the jaguar imagery on the Fairfield Gorget could have been inspired by art objects brought to Missouri from Mexico. The text describes the Fairfield Gorget as one of the oldest examples of these necklaces, noting that it’s similar to other art from the Mississippian period except for its image of a jaguar. The text goes on to explain that this is unusual because the jaguar’s range didn’t include Missouri. The Fairfield Gorget’s artist likely wouldn’t have encountered a live jaguar, but since such jaguar images were common in ancient Mexican art (and the jaguar’s range did include Mexico), perhaps some of that art inspired the gorget’s artist. Therefore, evidence that an ancient Mexican art object had been found at a site that was close to the Fairfield Gorget in both location and time period would strongly support the explanation that long-distance trade from Mexico took place during the Mississippian period and that jaguar imagery could have reached Missouri by those means. Choice A is incorrect. The underlined explanation indicates that Mexican artistic influence preceded the creation of the Fairfield Gorget. An artifact from Mexico that appeared in Missouri only after the gorget was created cannot support such a claim. Choice B is incorrect. The underlined explanation pertains to whether the jaguar image on the Fairfield Gorget was suggested to the Mississippian artist who made it by encounters with depictions of jaguars in Mexican art. The appearance of jaguars in Missouri after the Mississippian period cannot provide evidence for such a claim. Choice D is incorrect. The underlined explanation pertains to influence that Mexican art might have had on Mississippian art, restricted to the period from 900 CE to 1600 CE. The actions of contemporary artists cannot provide evidence for centuries-old networks of artistic influence and exchange."},{"i":"39e440e4","c":"claim","d":"H","s":"Archaeologists have held that the Casarabe culture, which emerged in the southwestern Amazon basin in the first millennium CE, was characterized by a sparse, widely distributed population and little intervention in the surrounding wilderness. Recently, however, archaeologist Heiko Prümers and colleagues conducted a study of the region using remote-sensing technology that enabled them to create three-dimensional images of the jungle-covered landscape from above, and the researchers concluded that the Casarabe people developed a form of urbanism in the Amazon basin.\n\nWhich finding about the remote-sensing images, if true, would most directly support Prümers and colleagues’ conclusion?","o":["They show shapes consistent with widely separated settlements of roughly equal small size surrounded by uncultivated jungle.","They show shapes consistent with long-distance footpaths running from Casarabe territories to large cities outside the region inhabited by the Casarabe people.","They show shapes consistent with scattered small farms created by clearing jungle areas near sources of fresh water.","They show shapes consistent with monumental platforms and dense central settlements linked to smaller settlements by a system of canals and roadways."],"a":3,"r":"Choice D is the best answer. This finding, if true, would support the archaeologists’ conclusion. Dense central settlements linked to smaller ones would provide evidence of cities and suburbs—in other words, “a form of urbanism.” Choice A is incorrect. This finding, if true, would weaken the archaeologists’ conclusion. Widely separated, small settlements with jungle in between would support the long-held belief that the Casarabe culture “was characterized by a sparse, widely distributed population and little intervention in the surrounding wilderness.” Choice B is incorrect. This choice wouldn’t support the researchers’ conclusion. These large cities are located outside Casarabe territory, which doesn’t show evidence of Casarabe urbanism. Choice C is incorrect. This finding wouldn’t support the archaeologists’ conclusion. Scattered small farms in jungle clearings are not good evidence to support the existence of cities (“a form of urbanism”)."},{"i":"37a49687","c":"graph","d":"E","s":"","o":["more common silver-biddy and milkfish were collected in the winter than in either of the other two seasons.","the common silver-biddy was collected more frequently than the other two species in all three seasons.","in the spring, researchers collected more Red Sea goldfish than they collected from the other two species.","in the fall, researchers collected 10 common silver-biddy but collected no milkfish or Red Sea goatfish."],"a":0,"r":"Choice A is the best answer. The claim is about which fish were collected more in winter than in other seasons. By comparing the number of common silver-biddy and milkfish collected in each season, we can see that more of these fish were collected in winter than in any other season. Choice B is incorrect. The claim is about which fish were collected more in winter than in other seasons. This statement compares collections across the three species of fish, rather than comparing collections of individual types of fish across seasons. Choice C is incorrect. The claim is about which fish were collected more in winter than in other seasons. This statement is about spring, rather than winter. Choice D is incorrect. The claim is about which fish were collected more in winter than in other seasons. This statement is about fall, rather than winter, fish collections."},{"i":"23e2421a","c":"graph","d":"M","s":"","o":["around 175 suggestions were coded as neither additive nor subtractive, whereas around 575 suggestions were coded as additive.","more than 350 suggestions were coded as invalid, whereas fewer than 100 suggestions were coded as subtractive.","fewer than 100 suggestions were coded as subtractive, whereas more than 550 suggestions were coded as additive.","around 575 suggestions were coded as additive, whereas around 175 suggestions were coded as subtractive."],"a":2,"r":"Choice C is the best answer. This choice shows that people suggested removing things to achieve improvements a lot less often than they suggested adding things, which supports the claim that people tend not to think of removing things as a likely way to improve the university. Choice A is incorrect. This choice doesn’t support the claim. We are looking to prove that people suggested subtractive means of achieving improvements less often than other means, but this choice doesn’t address how often people made subtractive suggestions. Choice B is incorrect. This choice doesn’t support the claim. Invalid responses were incomprehensible, so we can’t compare what they were suggesting to what was being suggested in subtractive responses. Choice D is incorrect. This choice misreads the graph. Fewer than 100 suggestions were coded as subtractive. 175 is the approximate number of suggestions coded as “neither additive or subtractive.”"},{"i":"1d971f75","c":"fss","d":"E","s":"Photographer Ansel Adams’s landscape portraits are iconic pieces of American art. However, many of the ______ of landscapes were intended not as art but as marketing; a concessions company at Yosemite National Park had hired Adams to take pictures of the park for restaurant menus and brochures.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["photographer’s early photo’s","photographers early photo’s","photographer’s early photos","photographers early photos"],"a":2,"r":"Choice C is the best answer. There’s only one photographer (Adams), and the photos are his, so the singular possessive \"photographer’s\" is correct. There’s more than one photo, and nothing belongs to the photos, so the simple plural \"photos\" is correct. Choice A is incorrect. This choice uses the singular possessive \"photo’s,\" which isn’t correct. There’s more than one photo, and they don’t possess anything, so the noun should be the simple plural \"photos.\" Choice B is incorrect. This choice uses the simple plural \"photographers\" and the singular possessive \"photo’s,\" which aren’t correct. There’s only one photographer (Adams) and there’s more than one photo. Choice D is incorrect. This choice uses the simple plural \"photographers,\" which isn’t correct. There’s only one photographer (Adams)."},{"i":"c88ba1b7","c":"fss","d":"H","s":"In the late nineteenth and early twentieth centuries, automobiles were commonly referred to as horseless carriages after the older technology they still resembled. Known as the Brass Era, this period in automotive design is remembered for its grandeur and artistry, its vehicles ______ by collectors for their ornate detailing and gleaming brass fittings.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are highly prized","had been highly prized","highly prized","were highly prized"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verb forms in a sentence. The nonfinite past participle phrase \"highly prized\" is correctly used to form a supplementary element that modifies the main clause \"this…artistry,\" describing memorable features of Brass Era automotive design. Choice A is incorrect because it results in a comma splice. Using the finite present tense verb phrase \"are highly prized\" creates a second main clause in the sentence, and two main clauses can’t be joined in this way with only a comma after \"artistry.\" Choice B is incorrect because it results in a comma splice. Using the finite past perfect tense verb phrase \"had been highly prized\" creates a second main clause in the sentence, and two main clauses can’t be joined in this way with only a comma after \"artistry.\" Choice D is incorrect because it results in a comma splice. Using the finite past tense verb phrase \"were highly prized\" creates a second main clause in the sentence, and two main clauses can’t be joined in this way with only a comma after \"artistry.\""},{"i":"775f3eb9","c":"fss","d":"E","s":"In his groundbreaking book Bengali Harlem and the Lost Histories of South Asian America, Vivek Bald uses newspaper articles, census records, ships’ logs, and memoirs to tell the ______ who made New York City their home in the early twentieth century.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["story’s of the South Asian immigrants","story’s of the South Asian immigrants’","stories of the South Asian immigrants","stories’ of the South Asian immigrant’s"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of plural and possessive nouns. The plural nouns “stories” and “immigrants” correctly indicate that the memoir tells multiple stories of multiple immigrants. Choice A is incorrect because the context requires the plural noun “stories,” not the singular possessive noun “story’s.” Choice B is incorrect because the context requires the plural nouns “stories” and “immigrants,” not the singular possessive noun “story’s” and the plural possessive noun “immigrants’.” Choice D is incorrect because the context requires the plural nouns “stories” and “immigrants,” not the plural possessive noun “stories’” and the singular possessive noun “immigrant’s.”"},{"i":"155239cf","c":"bound","d":"E","s":"By analyzing ice cores from Greenland and Antarctica, a research team at Sweden’s Lund University discovered evidence of a solar storm that occurred 9,200 years ago. Scientists had previously thought the Sun to be in a relatively “quiet” phase at that ______ the Lund team’s finding suggests otherwise.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["time but","time, but","time,","time"],"a":1,"r":"Choice B is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction \"but\" to join the first main clause (\"Scientists...time\") and the second main clause (\"the Lund...otherwise\"). Choice A is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Choice C is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice D is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."},{"i":"b0a525be","c":"bound","d":"M","s":"Santa Clara Pueblo artist Roxanne Swentzell’s sculpture Mud Woman Rolls On consists of five human figures made of clay and plant fiber and arranged in descending size; each figure holds the smaller one in front of it. The arrangement of the figures, according to ______ represents her idea that “we all come from the Earth, generation after generation.”\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Swentzell","Swentzell,","Swentzell:","Swentzell—"],"a":1,"r":"Choice B is the best answer. The phrase “according to Swentzell” is an aside that interrupts the flow of the sentence, so it needs to be separated from the sentence with a pair of matching punctuation marks: two commas, two dashes, or a pair of parentheses. We already have a comma before “according,” so we must add a comma after “Swentzell.” . Choice A is incorrect. This choice creates a punctuation error. The phrase “according to Swentzell” is an aside that interrupts the flow of the sentence, so it needs to be separated from the sentence with a pair of matching punctuation marks: one before and one after the phrase. Choice C is incorrect. This choice creates a punctuation error. “The arrangement of the figures, according to Swentzell” is not an independent clause, so it can’t come before a colon. Choice D is incorrect. This choice creates a punctuation error. The phrase “according to Swentzell” is an aside that interrupts the flow of the sentence, so it needs to be separated from the sentence with a pair of matching punctuation marks. We already have a comma at the beginning, so we have to use another comma here to match. We can’t just switch to a dash! ."},{"i":"b07a7634","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Digital Light Synthesis (DLS) is a form of additive manufacturing that utilizes light to rapidly cure liquid resin into high-quality, 3D objects. Step 1: Ultraviolet (UV) light images are projected up into a pool of liquid resin, where the object’s first layer takes shape. Step 2: The partially cured resin object is raised, leaving a thin space (a “dead zone”) beneath it for oxygen and liquid resin to flow through. Step 3: The UV light passes through the dead zone—maintaining the flow of resin—and partially cures additional layers of the object. Step 4: When the resin object is complete, it is baked in an oven to complete the curing. The student wants to describe how DLS cures 3D objects.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["DLS is a form of additive manufacturing that creates a “dead zone” in which UV light solidifies layer by layer before being baked in an oven, creating a high-quality, 3D object.","DLS cures 3D objects by passing through a “dead zone,” adding layers to the object, then curing the object in an oven.","In DLS, UV light images are projected into a liquid resin pool to cure a 3D object layer by layer; once solidified, the object is baked in an oven.","In DLS, UV light is projected into layers of liquid resin until the resin solidifies and passes through a “dead zone,” wherein the curing is completed."],"a":2,"r":"Choice C is the best answer. The sentence describes how DLS cures 3D objects, noting that UV light is projected into resin to cure the object in layers, after which the object is baked to complete the curing process. Choice A is incorrect. While the sentence does describe some elements of the curing process, the description misrepresents information in the notes; this sentence suggests that the UV light, rather than the 3D object, is baked in an oven. Choice B is incorrect. While the sentence does describe some elements of the curing process, the description misrepresents information in the notes: the UV light, not DLS, passes through the dead zone. Choice D is incorrect. While the sentence does describe some elements of the curing process, the description misrepresents information in the notes. This sentence suggests that curing is complete when the already-solidified resin passes through the dead zone; rather, liquid resin passes through the dead zone and is solidified in layers, after which curing is completed in the oven."},{"i":"cfade68d","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Marcela Guerrero is a curator at the Whitney Museum of American Art in New York. She curated the Whitney’s 2018 exhibition Pacha, Llaqta, Wasichay: Indigenous Space, Modern Architecture, New Art. This exhibition featured works by seven emerging Latino artists. She curated the Whitney’s 2020 exhibition Vida Americana: Mexican Muralists Remake American Art, 1925–1945. This exhibition included nearly 200 works by twentieth-century Latino and Mexican artists. The student wants to describe the exhibition that Guerrero curated in 2018.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Held at the Whitney Museum of American Art, the exhibition Vida Americana: Mexican Muralists Remake American Art, 1925–1945 included nearly 200 works by twentieth-century Mexican and Latino artists.","Pacha, Llaqta, Wasichay: Indigenous Space, Modern Architecture, New Art, an exhibition at the Whitney Museum of American Art, featured works by seven emerging Latino artists.","In both 2018 and 2020, Marcela Guerrero curated exhibitions at the Whitney Museum of American Art in New York.","While one exhibition that Marcela Guerrero curated featured works by emerging artists, another included works by twentieth-century artists."],"a":1,"r":"Choice B is the best answer. The sentence describes the 2018 exhibition Guerrero curated, noting that the exhibition, which was titled Pacha, Llaqta, Wasichay: Indigenous Space, Modern Architecture, New Art, featured the works of seven emerging Latino artists. Choice A is incorrect. The sentence describes the exhibition Guerrero curated in 2020; it doesn’t describe her 2018 exhibition. Choice C is incorrect. The sentence emphasizes a similarity between the two exhibitions Guerrero curated; it doesn’t describe her 2018 exhibition. Choice D is incorrect. The sentence emphasizes a difference between the two exhibitions Guerrero curated; it doesn’t describe her 2018 exhibition."},{"i":"249508d9","c":"trans","d":"M","s":"With his room-sized installation Unicorn/My Private Sky, Norwegian artist Børre Sæthre succeeds in creating a whimsical yet perplexing experience. ______ when visitors set foot inside the fantastically blue room and encounter the life-sized stuffed unicorn preening at the far end of it, they are both dazzled and confused—as if stepping into a strange and enchanting new world.\n\nWhich choice completes the text with the most logical transition?","o":["Second,","Instead,","Indeed,","Nevertheless,"],"a":2,"r":"Choice C is the best answer. \"Indeed\" logically signals that the description of the art installation in this sentence—its blue room and preening unicorn that leave visitors \"dazzled and confused\"—offers additional emphasis in support of the previous sentence’s claim about the installation’s \"whimsical yet perplexing experience.\" Choice A is incorrect because \"second\" illogically signals that the description in this sentence is a second, separate claim from the previous sentence’s claim about the installation’s \"whimsical yet perplexing experience.\" Instead, the specific details describing the installation emphasize and support the previous claim. Choice B is incorrect because \"instead\" illogically signals that the description in this sentence is an alternative to the previous sentence’s claim about the installation’s \"whimsical yet perplexing experience.\" Rather, the specific details describing the installation emphasize and support that claim. Choice D is incorrect because \"nevertheless\" illogically signals that the description in this sentence is true despite the previous sentence’s claim about the installation’s \"whimsical yet perplexing experience.\" Instead, the specific details describing the installation emphasize and support that claim."},{"i":"d3b7d7a3","c":"trans","d":"H","s":"Many historical accounts of the 1930s focus on the widespread movement of people from dust bowl–ravaged Great Plains states to faraway California. However, a 2016 study of 1940 census data complicates this popular narrative; ______ researchers determined, migrants in states hardest hit by prolonged droughts and dust storms—Colorado, Kansas, Oklahoma, and Texas—merely relocated within the region.\n\nWhich choice completes the text with the most logical transition?","o":["for this reason,","more often,","additionally,","nevertheless,"],"a":1,"r":"Choice B is the best answer. “More often” logically signals that the historical outcome in this clause—dust bowl migrants’ relocation within the Great Plains region—was more common than the movement to California described in many historical accounts. Choice A is incorrect because “for this reason” illogically signals that the historical outcome in this clause was caused by either the narrative about widespread movement to California or the 2016 study’s complication of that narrative. Instead, dust bowl migrants’ regional relocation was found to be more common than the movement to California described in many historical accounts. Choice C is incorrect because “additionally” illogically signals that the historical outcome in this clause merely adds to either the narrative about widespread movement to California or the 2016 study’s complication of that narrative. Instead, dust bowl migrants’ regional relocation was found to be more common than the movement to California described in many historical accounts. Choice D is incorrect because “nevertheless” illogically signals that the historical outcome in this clause is true despite either the narrative about widespread movement to California or the 2016 study’s complication of that narrative. While the findings about dust bowl migrants’ regional relocation did challenge the previous narrative, they did not challenge the study’s findings, and this choice creates a confusing ambiguity. Instead, dust bowl migrants’ regional relocation was found to be more common than the movement to California described in many historical accounts."},{"i":"00221c00","c":"trans","d":"H","s":"In 1815, while in exile in Jamaica, Venezuelan revolutionary Simón Bolívar penned a letter praising England’s republican government and expressing hope that Latin American nations seeking independence from Spain might achieve something similar. The letter was addressed to a local merchant, Henry Cullen; ______ though, Bolívar’s goal was to persuade political leaders from England and Europe to support his cause.\n\nWhich choice completes the text with the most logical transition?","o":["additionally,","ultimately,","accordingly,","consequently,"],"a":1,"r":"Choice B is the best answer. “Ultimately” means “in the long run” or “at the highest level.” Although Bolívar wrote to a local merchant, his ultimate goal was to send a message to political leaders in Europe. Therefore, “ultimately” fits perfectly in this context. Choice A is incorrect. This choice uses a transition that indicates the addition of an agreeing idea. However, the second part of the sentence actually disagrees with the first part. Bolívar addressed the letter to Cullen, but he was really sending a message to someone else. Notice how the contrast word “though” also acts as a transition between these ideas. Choice C is incorrect. This choice uses a cause-and-effect transition. Bolívar’s writing of the letter to Cullen would not cause him to have a goal of persuading European powers to support him. Choice D is incorrect. This choice uses a cause-and-effect transition. Bolívar’s writing of the letter to Cullen would not cause him to have a goal of persuading European powers to support him."}],"img":{"37a49687":"iVBORw0KGgoAAAANSUhEUgAAArwAAAJsBAMAAADtqm1fAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABcFElEQVR42u1dd0AUx9t+ZvcK/ebAXhewl3iKXaOHLfacNRqjIhpbNDlNTCzJ5xmNsf0SrLEkir1HLLEg6qmxF87e5bBEY+HmsAN38/0BKgjqEUVR9vlDud3Z2d1n333mfd+Z2QFkyJAhQ4YMGTJkyJAhQ4YMGTJkyJDx7oGk/E9dKyYjPXwBkoo+Y9q94hiJAISSZxgm/lo/AEIwABASBICitWigaegmrXI8ve5hUOuf/PKz0jQG6zVNcjegyeOf5PG+fjMXlgGIYicAoN+ytQDoSbU5pVzFlIdzLPkoKefSW+AePEOeWmtE2te9NojSgt3phGB85YoiAHE1AKhPBAQDwF+qsJRC4cn/C2sAAErTm5UPIRvRyxdJHO2glr5d0W3FRBQ/b0Czk7xqfx3RrlgoDlzME6+rz+L79agOtb7dD3PRNGoD4DwYXZl8v4GoNhuA3OMvbhOjJkMrSMKsuTT/gV6fTVTvN6D/QgKU2W+o/tnHOVaePWuEFzDMQBHdv5XP19soPsx1QrzsZfzqawqviZ0N/fyB8s307js+DGkBz5Bf6k0Q1+c1EwwD/dBtbnHhbLHdwGcUaB7aX9qlDi8fMp7uK1Z8rTTO77j677I7gCpKq+dE+kZvSZGN6NW4FbMDiPO9cPDw1lL499Y69aqChgODKD4e/nD6ChtwLiqvd5erk/uDU6+t50iBW5TDd6zbCvieE93P7wDAgDrfenwLgi6LHcoH50WfS+U1e5QTTvkDBwLuODjLseJANEs11AaKODgA2GCnJb9mNjAUZQ6JA0hIhL/VQTgI8wF8rn9iBpwHzXh4fTKiYQfsFCgMJwVHQK+WvlYAJPA7bzBYgcY9pTetDNnJejlWzFlCQFgRxAGgtKh9YwT/NNkMrGAAYmCjd1jRvwEOjbiz/AjAuRy10XOWloECdp2F2SEwQnBrrO0+AIabQ5yg0ED4pWYz/oZvKTtZrx3X8zARrWksA function card(q,n){const a=ans[q.i];
