<script>
const D={"t":"Practicetest28","q":[{"i":"bce4d106","c":"vocab","d":"H","s":"Archaeologists have identified a plethora of beads fashioned from Tritia gibbosula shells in many Middle Stone Age (MSA) sites across western North Africa, including El Mnasra Cave, Morocco. In a 2021 paper, El Mehdi Sehasseh et al. attribute these artifacts’ apparent ______ to the evolution and propagation of symbolic behavior (e.g., use of personal ornaments) in humans and the widespread availability of T . gibbosula during the MSA.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["heterogeneity","ubiquity","expediency","fecundity"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of beads found in Middle Stone Age sites. In this context, “ubiquity” means widespread presence or commonness. The text states that archaeologists have encountered “a plethora,” or an abundance, of beads made from Tritia gibbosula shells “in many Middle Stone Age (MSA) sites across western North Africa.” In this context, the abundance of beads therefore suggests their ubiquity. Choice A is incorrect because in this context, “heterogeneity” would mean variety or diversity among the beads. The text doesn’t suggest that the beads varied significantly from one another; rather, it focuses on their widespread presence across multiple sites. Moreover, the text mentions that all the beads were “fashioned from Tritia gibbosula shells,” suggesting consistency rather than heterogeneity. Choice C is incorrect because the text doesn’t emphasize the beads’ “expediency,” or convenience or practicality. The text doesn’t support the idea of convenience (there’s no indication, for example, that the beads were easy to use or make) but rather focuses on the beads’ abundant presence at MSA sites. Choice D is incorrect. While “fecundity” can suggest abundant production, it specifically refers to fertility, and the text doesn’t connect the beads to this theme. Instead, the text attributes their widespread presence to the development of symbolic behavior in humans and the natural availability of Tritia gibbosula during the MSA."},{"i":"ba974387","c":"vocab","d":"E","s":"The following text is adapted from Mary Seacole’s 1857 autobiography Wonderful Adventures of Mrs. Seacole in Many Lands. That journey across the Isthmus [of Panama], insignificant in distance as it was, was by no means an easy one. It seemed as if nature had determined to throw every conceivable obstacle in the way of those who should seek to join the two great oceans of the world.\n\nAs used in the text, what does the word “conceivable” most nearly mean?","o":["Obvious","Imaginable","Straightforward","Uninterrupted"],"a":1,"r":"Choice B is the best answer because as used in the text, \"conceivable\" most nearly means capable of being thought of or imagined. The text describes a journey that, despite being \"insignificant in distance,\" was \"by no means an easy one\" because of the variety of obstacles that \"nature had determined to throw…in the way.\" To emphasize the difficulty of the journey, the author portrays nature as actively scheming to present travelers with every obstacle that can be thought of—i.e., every imaginable obstacle. Choice A is incorrect because in this context, \"conceivable\" does not mean obvious, or evident. Instead, by referring to \"every conceivable obstacle,\" the text suggests a wide variety of challenges by evoking all the potential difficulties nature could present, not just those that the travelers might reasonably expect or foresee. Choice C is incorrect because in this context, \"conceivable\" does not mean straightforward, or easy to negotiate. The text is not indicating that the obstacles were simple to respond to and overcome. Rather, the text suggests that a wide range of obstacles made the journey difficult. Choice D is incorrect because in this context, \"conceivable\" does not mean uninterrupted. Although the text suggests that the obstacles were frequent and numerous, it does not emphasize the obstacles’ continuity; instead, the text conveys their unexpected variety and range."},{"i":"95f037ad","c":"vocab","d":"E","s":"The works of Chicana artist Ester Hernandez are now ______ in museums both in the United States and abroad, but the murals she contributed to as a member of Las Mujeres Muralistas early in her artistic career were displayed in outdoor public spaces across San Francisco.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["invented","adjusted","featured","recommended"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Ester Hernandez’s art. In this context, \"featured\" means shown prominently. The text focuses on where Hernandez’s works have been and continue to be displayed, explaining that her early works, which consisted of murals, could be viewed in outdoor spaces in San Francisco. The central contrast developed in the text is between where her early works could be viewed and where her works can be viewed now, which is in museums across the United States and around the world. The context therefore supports the idea that Hernandez’s works are now shown, or featured, in museums globally. Choice A is incorrect because in this context \"invented\" would mean created something for the first time, which isn’t supported since the text doesn’t discuss where Hernandez creates her works or whether they’re original or innovative. Choice B is incorrect because \"adjusted\" in this context would mean adapted. Although the text mentions that many of Hernandez’s early works were outdoor murals and thus it may be reasonable to infer that Hernandez altered her approach to creating art so that her works could be displayed in indoor venues instead, the text makes no mention of how Hernandez’s works might have been adapted for such venues. The text focuses on where Hernandez’s works have been and continue to be displayed, not on how she or anyone else may have adapted, or adjusted, her works. Choice D is incorrect because \"recommended\" in this context would mean endorsed or put forth as a suggestion for something that is worth seeing. Although it may be reasonable to say that in choosing to display certain works, museum curators believe such works are worth seeing, the text doesn’t discuss the reasons why museums display Hernandez’s works. Instead, the text mainly develops a contrast between where Hernandez’s early works could once be viewed and where her work can be viewed now."},{"i":"0f040c50","c":"vocab","d":"E","s":"The following text is from Yann Martel’s 2001 novel Life of Pi. The narrator’s family owned a zoo when he was a child. It was a huge zoo, spread over numberless acres, big enough to require a train to explore it, though it seemed to get smaller as I grew older, train included. ©2001 by Yann Martel As used in the text, what does the word “spread” most nearly mean?","o":["Hidden","Discussed","Extended","Coated"],"a":2,"r":"Choice C is the best answer because as used in the text, “spread” most nearly means extended. The text states that the zoo is “huge,” that it covers “numberless acres,” and that it is large enough that a train is needed to explore it. Thus, the text’s emphasis on the zoo’s size suggests that the zoo extended, or stretched, over a large area of land. Choice A is incorrect because if the zoo covers “numberless acres,” then it could not reasonably be described as hidden, or concealed from view. Choice B is incorrect because there is nothing in the text to suggest that the zoo was discussed, or talked about. Rather, the text focuses on the zoo’s large size. Choice D is incorrect. Although in some contexts “spread” can mean coated, it doesn’t have that meaning in this context because to coat something means to apply a thin layer of a liquid substance, such as oil or paint, to a surface. Therefore, it would not be accurate to say that the zoo coated the acres on which it sits."},{"i":"6f5fc289","c":"purpose","d":"M","s":"The following text is adapted from Charles Dickens’s 1854 novel Hard Times. Coketown is a fictional town in England. [Coketown] contained several large streets all very like one another, and many small streets still more like one another, inhabited by people equally like one another, who all went in and out at the same hours, with the same sound upon the same pavements, to do the same work, and to whom every day was the same as yesterday and tomorrow, and every year the counterpart of the last and the next.\n\nWhich choice best states the main purpose of the text?","o":["To emphasize the uniformity of both the town and the people who live there","To explain the limited work opportunities available to the town’s residents","To reveal how the predictability of the town makes it easy for people lose track of time","To argue that the simplicity of life in the town makes it a pleasant place to live"],"a":0,"r":"Choice A is the best answer. The author describes Coketown as having streets that are all very similar and residents who live similarly and do the same work. This repetition of similarities emphasizes how everything in Coketown is alike. Choice B is incorrect. While the text mentions that all the residents “do the same work,” it never explains what that work is or why everyone does it. Besides, the idea that they all do the same work is just one of several similarities among the townspeople described in the text. Choice C is incorrect. While the last sentence states that “every day was the same as yesterday and tomorrow, and every year the counterpart of the last and the next,” it never suggests that people actually “lose track of time.” This is also too narrow to be the main idea, since time is just one of many aspects of Coketown that the text describes as always being the same. Choice D is incorrect. The text never mentions whether life is simple in Coketown, and the town sounds as though it’s probably a pretty dull place to live, rather than a pleasant one."},{"i":"c4900368","c":"purpose","d":"M","s":"The following text is from the 1924 poem “Cycle” by D’Arcy McNickle, who was a citizen of the Confederated Salish and Kootenai Tribes. There shall be new roads wending, A new beating of the drum— Men’s eyes shall have fresh seeing, Grey lives reprise their span— But under the new sun’s being, Completing what night began, There’ll be the same backs bending, The same sad feet shall drum— When this night finds its ending And day shall have come.....\n\nWhich choice best states the main purpose of the text?","o":["To consider how the repetitiveness inherent in human life can be both rewarding and challenging","To question whether activities completed at one time of day are more memorable than those completed at another time of day","To refute the idea that joy is a more commonly experienced emotion than sadness is","To demonstrate how the experiences of individuals relate to the experiences of their communities"],"a":0,"r":"Choice A is the best answer because it accurately states the main purpose of the text. The text begins by discussing the promise of the future, with positive references to renewal such as “new roads,” “new beating of the drum,” and “fresh seeing.” But with the “new sun,” the text continues, there will still be “the same backs bending” and “the same sad feet” drumming, indicating that these difficulties will follow people into this new day. The poem thus considers both the rewards and challenges associated with the repetitiveness of human life. Choice B is incorrect because the text doesn’t say anything about how memorable activities are, let alone compare the memorability of activities completed at different times of the day. Choice C is incorrect. Although the text contrasts hope with difficulty, it does not compare the relative frequency of joyful feelings with that of sad feelings. Choice D is incorrect because the text makes no distinction between the experiences of individuals and the experiences of their communities."},{"i":"cef79fb9","c":"func","d":"M","s":"The Bayeux Tapestry, from eleventh-century France, depicts 75 scenes over 250 feet of fabric. It was likely produced by workers embroidering in sections and then joining the resulting panels together. It’s plausible that the workshop that produced the tapestry had never produced one so large, and some researchers claim that a close examination of the joins—the places where the panels are stitched together—suggests that the workers developed and refined their joining process over the course of production. <u>For example, the first join the workers completed exhibits a clear misalignment of the borders of the two panels, whereas the later joins are virtually invisible.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It identifies the people and events depicted in the Bayeux Tapestry.","It supports an argument about the workers who produced the Bayeux Tapestry.","It compares the Bayeux Tapestry with other tapestries from eleventh-century France.","It describes how researchers determined where the Bayeux Tapestry was produced."],"a":1,"r":"Choice B is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The text discusses the Bayeux Tapestry, making the point that the workers who produced the huge tapestry in the eleventh century might not have ever produced a tapestry so large before. The text goes on to suggest that because of this lack of previous experience, the workers developed and refined the process of joining the tapestry’s panels over time as they worked. The last sentence of the text then provides an example of an observation that suggests the workers’ process changed: clear misalignment of the borders of the two panels the workers joined first and virtually invisible joins completed later. Thus, the underlined sentence serves to support an argument about the workers who produced the tapestry. Choice A is incorrect because the example given in the last sentence of the text has to do with how the panels of the Bayeux Tapestry were joined by the workers, not with what is depicted in those panels; the text never identifies any people or places depicted in the tapestry. Choice C is incorrect because the last sentence compares how early panels in the Bayeux Tapestry were joined with how later panels in the same tapestry were joined; it doesn’t make any comparison between the Bayeux Tapestry and other tapestries from the same time in France. Choice D is incorrect because the last sentence doesn’t address the location where the Bayeux Tapestry was created; the first sentence of the text presents it as a given that the tapestry was created in France, but nothing in the text indicates how that origin was determined."},{"i":"cf46f239","c":"func","d":"H","s":"The following text is adapted from Herman Melville’s 1855 novel Israel Potter. Israel is a young man wandering through New England during the late eighteenth century. He hired himself out for three months; at the end of that time to receive for his wages two hundred acres of land lying in New Hampshire. [...] His employer proving false to the contract in the matter of the land, and there being no law in the country to force him to fulfil it, Israel—<u>who, however brave-hearted, and even much of a dare-devil upon a pinch, seems nevertheless to have evinced, throughout many parts of his career, a singular patience and mildness<\/u>—was obliged to look round for other means of livelihood than clearing out a farm for himself in the wilderness.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It implies that Israel treasures a particular characteristic of his personality when that characteristic should usually be regarded as a flaw.","It suggests that if not for a certain aspect of his character, Israel might not have been as easily thwarted in his ambition to establish a farm.","It shows why Israel would not have been able to undertake the enormous amount of labor necessary to run a farm even if he had owned the necessary property.","It explains why, when the situation requires it, Israel is able to undertake courageous acts that others would generally avoid."],"a":1,"r":"Choice B is the best answer because it best describes the function of the underlined portion in the text as a whole. The text describes the failed attempt of Israel Potter to establish a farm in New England during the late eighteenth century: according to his contract, he was to receive two hundred acres in exchange for three months’ work, but his employer then refused to fulfill the bargain and Israel had no recourse to law to obtain the land he was owed. Israel was therefore forced to find another means of supporting himself. To explain why Israel was particularly susceptible to his employer’s dishonesty, the underlined portion states that though Israel was \"brave-hearted, and even much of a dare-devil upon a pinch,\" he also possessed \"a singular patience and mildness.\" In other words, Israel could be courageous in certain circumstances, but he was usually meek and disinclined to argument, from which it is reasonable to infer that Israel was often taken advantage of. Thus, the underlined portion suggests that if not for a certain aspect of his character, Israel might not have been as easily thwarted in his ambition to establish a farm. Choice A is incorrect because although the underlined portion describes aspects of Israel’s personality, it does not address how he feels about his own personality. Choice C is incorrect because the underlined portion addresses Israel’s occasional courage and frequent meekness but does not address whether he would have the skills and resolve necessary to operate a farm if he owned sufficient property. Choice D is incorrect. Though the underlined portion does indicate that Israel could be courageous in certain circumstances, it does not say that he undertook acts of courage that others avoided, but rather that he was habitually meek. Even if the underlined portion did say that Israel was more courageous than most, this would not explain why he found himself under the circumstances described in the text—that is, as a consequence of his meek nature, cheated of the property to which he had a right."},{"i":"c19b2f77","c":"cross","d":"M","s":"Text 1 Little is known about how plate tectonics—wherein slabs of Earth’s crust move over, under, away from, and against one another—began. <u>Some researchers contend<\/u> that tectonic movements began around 3 billion years ago, often noting that computer models of Earth’s mantle temperature at the time indicate that the mantle would have been sufficiently molten to enable the plates to move.\n\nText 2 Ultimately, any plausible claim about the inception of tectonic movement must rest on empirical evidence from the geological record. Researcher Wriju Chowdhury and his team analyzed the geochemistry of zircon crystals to gain insight into the chemical composition of the magma from which the crystals formed and, based on the data, compellingly argue that plate tectonics may have been occurring as early as 4.2 billion years ago.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to what “some researchers contend” as described in\n\nText 1?","o":["By suggesting that the temperature of Earth’s mantle 3 billion years ago was likely insufficient to allow for the level of tectonic movement predicted by computer models","By distinguishing between computer models of Earth’s mantle temperature that reliably predict the onset of plate tectonics and those that do not","By indicating that computer models of Earth’s mantle temperature are still being improved such that new models tend to be much more reliable than their predecessors","By asserting that a more definitive form of evidence than the computer models suggests a different timeline for the onset of plate tectonics on Earth"],"a":3,"r":"Choice D is the best answer because it reflects how the author of Text 2 would most likely respond to what the researchers mentioned in Text 1 contend. Text 1 discusses the lack of knowledge of how plate tectonics on Earth began. Text 1 also mentions researchers who contend that movements of tectonic plates began around 3 billion years ago. As support for this assertion, these researchers cite computer models (which are simulations, not empirical evidence) of the temperature in Earth’s mantle that show that at that time, the mantle would have been sufficiently molten for plates to move. However, the author of Text 2 asserts that empirical evidence from the geological record is necessary to make plausible claims about when tectonic movement began. Text 2 mentions an analysis performed by Wriju Chowdhury and his team of the geochemistry of zircon crystals (which would constitute empirical evidence). Chowdhury and his team argue, based on this analysis, that tectonic plates may have begun to move as early as 4.2 billion years ago. Therefore, since the author of Text 2 would consider Chowdhury et al.’s empirical evidence to be more conclusive than the computer models cited in Text 1, the author of Text 2 would most likely assert that a more definitive form of evidence than the computer models suggests a different timeline for the onset of plate tectonics on Earth. Choice A is incorrect because the author of Text 2 makes no claims about the temperature of Earth’s mantle and therefore wouldn’t argue that the temperature of Earth’s mantle 3 billion years ago was insufficient to allow tectonic movement. Choice B is incorrect because the author of Text 2 claims that empirical evidence is needed to fix the earliest date of tectonic movement. Computer models are simulations, not empirical evidence, so the author of Text 2 wouldn’t distinguish between different kinds of computer models but would instead argue that no computer models can reliably predict the onset of plate tectonics. Choice C is incorrect because the author of Text 2 wouldn’t consider any computer model to be able to provide evidence to support a plausible claim about tectonic movement, no matter how much such models were improved. The author of Text 2 would only accept empirical evidence."},{"i":"b633cc4f","c":"main","d":"E","s":"Few animals are known to spit: among them are humans, cobras, and camels. But in January 2022 at a nature preserve in southern England, bird- watcher Clare Jacobs observed a gray seal spitting a jet of water at a white-tailed eagle flying overhead. Seals had never been seen spitting before. Biologist Sean Twiss, who studies gray seals, believes that the seal may have been attempting to scare the eagle away from a food source or that the seal may have just been playing.\n\nWhich choice best states the main topic of the text?","o":["Bird-watching in southern England","A previously unseen behavior of gray seals","How white-tailed eagles defend their territory against other predators","Differences between gray seals and white-tailed eagles"],"a":1,"r":"Choice B is the best answer because it most accurately states the main topic of the text. The text begins by noting that few animals are known to spit, and then it focuses on Clare Jacobs’s January 2022 observation of a gray seal spitting water at a white-tailed eagle. The text explicitly notes that this behavior had never before been observed in seals, highlighting that this was a previously unseen behavior. The text concludes with biologist Sean Twiss’s hypotheses about why the seal might have been spitting. Thus, the main topic is the observation of a previously unseen behavior (spitting) of gray seals. Choice A is incorrect because while the text does mention bird-watcher Clare Jacobs making an observation in southern England, bird-watching itself is not the main topic. The reference to bird-watching is incidental to the central focus of the novel behavior of a gray seal spitting water at an eagle. Choice C is incorrect because the text only mentions a white-tailed eagle as the target of a seal’s spitting behavior; it doesn’t provide any information about how these eagles typically behave when defending territory or interacting with other predators. Choice D is incorrect because the text doesn’t discuss differences between gray seals and white-tailed eagles. While both animals are mentioned, the text is focused on the seal’s unusual spitting behavior rather than comparing the two animals in any way."},{"i":"7ffae38a","c":"main","d":"M","s":"The following text is adapted from Jack London’s 1903 novel The Call of the Wild. Buck is a sled dog living with John Thornton in Yukon, Canada. Thornton alone held [Buck]. The rest of mankind was as nothing. Chance travellers might praise or pet him; but he was cold under it all, and from a too demonstrative man he would get up and walk away. When Thornton’s partners, Hans and Pete, arrived on the long-expected raft, Buck refused to notice them till he learned they were close to Thornton; after that he tolerated them in a passive sort of way, accepting favors from them as though he favored them by accepting.\n\nWhich choice best states the main idea of the text?","o":["Buck has become less social since he began living with Thornton.","Buck mistrusts humans and does his best to avoid them.","Buck has been especially well liked by most of Thornton’s friends.","Buck holds Thornton in higher regard than any other person."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. After establishing that Buck views most people “as nothing,” the text explains that Buck won’t acknowledge people other than Thornton unless they appear friendly toward Thornton, and even then he’s only reluctantly accepting. Thus, the text focuses on the idea that Thornton has a special status in Buck’s mind, with Buck holding him in higher regard than other people. Choice A is incorrect because the text conveys that Buck isn’t social with people other than Thornton but doesn’t address Buck’s life or temperament before he lived with Thornton. Choice B is incorrect because the text conveys that Buck doesn’t really care about people other than Thornton and is aloof toward them. However, there’s no indication that Buck mistrusts and avoids people generally; indeed, he accepts Thornton, who is a human. Choice C is incorrect because the text refers to random travelers praising and petting Buck and Thornton’s partners giving Buck favors, but there’s no indication that any of these people are Thornton’s friends or that they have a particular fondness for Buck."},{"i":"ac285054","c":"infer","d":"H","s":"The domestic sweet potato (Ipomoea batatas) descends from a wild plant native to South America. It also populates the Polynesian Islands, where evidence confirms that Native Hawaiians and other Indigenous peoples were cultivating the plant centuries before seafaring first occurred over the thousands of miles of ocean separating them from South America. To explain how the sweet potato was first introduced in Polynesia, botanist Pablo Muñoz-Rodríguez and colleagues analyzed the DNA of numerous varieties of the plant, concluding that Polynesian varieties diverged from South American ones over 100,000 years ago. Given that Polynesia was peopled only in the last three thousand years, the team concluded that ______ Which choice most logically completes the text?","o":["the cultivation of the sweet potato in Polynesia likely predates its cultivation in South America.","Polynesian peoples likely acquired the sweet potato from South American peoples only within the last three thousand years.","human activity likely played no role in the introduction of the sweet potato in Polynesia.","Polynesian sweet potato varieties likely descend from a single South American variety that was domesticated, not wild."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the sweet potato in Polynesia. The text indicates that the sweet potato is found in Polynesia but originated in South America, and that the sweet potato was being cultivated by Native Hawaiians and other Indigenous peoples in Polynesia long before sea voyages between South America and Polynesia began. The text goes on to note that research by Muñoz-Rodríguez and colleagues has established that the Polynesian varieties of sweet potato split from South American varieties more than 100,000 years ago, which is thousands of years before humans settled in Polynesia. If Polynesian peoples were cultivating the sweet potato before sea voyages between Polynesia and South America began, and if Polynesian varieties of sweet potato diverged from South American varieties well before people were in Polynesia, it can reasonably be concluded that humans didn’t play a role in bringing the sweet potato to Polynesia. Choice A is incorrect. The text doesn’t provide any information about when the sweet potato began to be cultivated in South America, so there’s no support for the conclusion that cultivation began in Polynesia before it began in South America. Choice B is incorrect because the text indicates that the sweet potato was being cultivated in Polynesia long before sea journeys between Polynesia and South America began. Therefore, it wouldn’t be reasonable to conclude that Polynesian peoples acquired the sweet potato from South American peoples. Additionally, the text indicates that the Polynesian varieties of sweet potato diverged from the South American varieties thousands of years before people settled in Polynesia, which suggests that the sweet potato was already present in Polynesia when people arrived. Choice D is incorrect because the text states that the domestic sweet potato, which is found in Polynesia, descends from a wild South American plant, not from a domesticated South American plant. The only people that the text describes as cultivating the sweet potato are Native Hawaiians and other Indigenous peoples of Polynesia."},{"i":"e503ae04","c":"infer","d":"H","s":"With the ongoing expansion of e-commerce, consumers are expecting faster and faster delivery of goods, but delivery companies continue to struggle with last-mile logistics (the final step in delivery to consumers) due to challenges such as complex and inefficient delivery routes. Innovations to mitigate these challenges have been emerging—the use of aerial drones, for example—but these innovations tend to engender their own complications (e.g., regulations on the use of drones in residential airspace), leading researchers to conclude that ______ Which choice most logically completes the text?","o":["consumers’ expectations for reduced delivery times may be outstripping what is viable for delivery companies to provide.","a better understanding of consumers’ expectations for delivery is needed so that companies can better plan for fluctuations in delivery volume.","rapid delivery is a leading factor in consumer satisfaction, and therefore delivery companies would benefit from investing resources in reducing delivery times.","there may not be sufficient incentive for delivery companies to attempt to solve the problems associated with last-mile logistics."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of consumer expectations and the struggles delivery companies face. The text states that while consumers expect ever-faster delivery of goods, delivery companies \"continue to struggle with last- mile logistics.\" The text further explains that innovations aimed at addressing this challenge have a tendency to cause complications of their own. Because escalating consumer demands for speed are paired with persistent, complex delivery obstacles and new problems arising from attempted solutions, it logically follows that consumer expectations for delivery times may be exceeding what companies can feasibly provide. Choice B is incorrect because the text doesn’t address the idea of delivery volumes at all and makes it clear that companies are already aware of and trying to address consumers’ expectations for delivery. Further, the challenge presented at the end of the text relates to new problems that tend to arise with solutions for logistical problems, not to a lack of understanding of what consumers want or how delivery volumes fluctuate. Choice C is incorrect. The text does suggest that rapid delivery is important for customer satisfaction and thus is a beneficial investment for companies, but that idea is already presented in the beginning of the text and doesn’t logically follow as a conclusion from the information about innovations companies are exploring to solve last-mile logistics problems; the idea that the potential solutions tend to introduce new issues points to the feasibility of meeting consumer expectations, not to the general fact that it would be beneficial to reduce delivery times. Choice D is incorrect because the text doesn’t suggest that there may be insufficient incentive for delivery companies to try to solve last-mile logistics problems—on the contrary, the text directly indicates that delivery companies are already actively pursuing innovations to try to address those problems, citing the example of the use of aerial drones, even though the innovations can introduce new complications."},{"i":"c384987b","c":"claim","d":"E","s":"Scientists have long believed that giraffes are mostly silent and communicate only visually with one another. But biologist Angela Stöger and her team analyzed hundreds of hours of recordings of giraffes in three European zoos and found that giraffes make a very low-pitched humming sound. The researchers claim that the giraffes use these sounds to communicate when it’s not possible for them to signal one another visually.\n\nWhich finding, if true, would most directly support Stöger and her team’s claim?","o":["Giraffes have an excellent sense of vision and can see in color.","The giraffes only produced the humming sounds at night when they couldn’t see one another.","Wild giraffes have never been recorded making humming sounds.","Researchers observed other animals in European zoos humming."],"a":1,"r":"Choice B is the best answer because it presents a finding that, if true, would support Stöger and her team’s claim that giraffes use humming to communicate when they cannot signal to one another visually. The text indicates that scientists have long thought that giraffes produce little sound and exclusively rely on visual signals to communicate with one another. The text goes on to say, however, that Stöger and her team have recorded giraffes in three European zoos making a low-pitched humming sound, which the team claims the giraffes use to communicate when they cannot see each other. If the giraffes produced these sounds when visual communication was impossible and never produced them otherwise, that would support Stöger and her team’s claim about the circumstance in which giraffes make the sound. Choice A is incorrect because finding that giraffes have excellent vision and can see in color would have no bearing on Stöger and her team’s claim that giraffes produce a low-pitched humming noise to communicate when they cannot communicate visually. As presented in the text, Stöger and her team’s claim is restricted to circumstances in which giraffes cannot signal one another visually; if the giraffes are unable to signal visually, their sense of vision is irrelevant to their communication. Choice C is incorrect because finding that wild giraffes have never been recorded making humming noises would not support Stöger and her team’s claim about the function of the humming noise that the researchers recorded from the giraffes in European zoos. The text provides no information about whether researchers have even attempted to record low- pitched humming in wild giraffes, so nothing can be concluded about the implications of the lack of such recordings. Choice D is incorrect because finding that other animals in European zoos had been observed humming would not support Stöger and her team’s claim, since it would not indicate anything about why giraffes produce humming sounds. Different species could produce similar sounds for different purposes, so scientists could not conclude anything about the function of giraffe humming from a finding that some other animals in zoos also hum."},{"i":"99fdf71c","c":"claim","d":"M","s":"“When Dawn Comes to the City” is a 1922 poem by Claude McKay, who immigrated to the United States from the island nation of Jamaica as an adult. The poem conveys McKay’s contrasting feelings about New York City—his adopted home in the US—and his home country: ______ Which quotation from “When Dawn Comes to the City” most effectively illustrates the claim?","o":["“A lonely newsboy hurries by, / Humming a recent ditty; / Red streaks strike through the gray of the sky, / The dawn comes to the city [New York City].”","“Dark figures start for work; / I watch them sadly shuffle on, / ’Tis dawn, dawn in New York. / But I would be on the island of the sea, / In the heart of the island of the sea.”","“And the shaggy Nannie goat is calling, calling, calling / From her little trampled corner of the long wide lea / That stretches to the waters of the hill-stream falling / Sheer upon the flat rocks joyously!”","“The tired cars go grumbling by, / The moaning, groaning cars, / And the old milk carts go rumbling by / Under the same dull stars.”"],"a":1,"r":"Choice B is the best answer because it presents a quotation illustrating the claim that the poem conveys McKay’s contrasting feelings about New York City and Jamaica. McKay first presents a somewhat negative view of New York City, describing watching “dark figures” who “sadly shuffle” to work at dawn, and then indicates that he would instead like to be “in the heart of the island of the sea.” Choice A is incorrect because the quotation focuses on a description of only one place (New York City, with its “lonely newsboy” and “red streaks” in the sky at dawn) rather than on different feelings about two places. Choice C is incorrect because the quotation focuses on a description of only one place (which isn’t named) rather than on McKay’s different feelings about two places. Choice D is incorrect because though McKay presents a negative image of an unnamed place with “tired cars” that grumble, moan, and groan, and “old milk carts“ that rumble by under “dull stars,” the quotation focuses on McKay’s feelings about only one place rather than on different feelings about two places."},{"i":"cebfb2c6","c":"graph","d":"M","s":"","o":["they are much younger than the samples brought back from any of the Apollo missions.","they were collected from the same landing site as the Apollo 11 mission.","they are closest in age to the samples brought back by the Apollo 17 mission.","they helped confirm the predicted ages of the lunar samples from the Apollo missions."],"a":0,"r":"Choice A is the best answer because it effectively uses data from the table to complete the claim about the significance of the Chang’e 5 lunar samples. The table shows the approximate ages of lunar samples from four different missions: three Apollo missions and the Chang’e 5 mission. The Chang’e 5 samples are said to be approximately 2 billion years old, while the Apollo samples are each said to be more than 3 billion years old. In other words, based on the data in the table, the Chang’e 5 samples are much younger than those from the Apollo missions. Choice B is incorrect because the table shows that the Chang’e 5 samples were taken from a landing site at Oceanus Procellarum, which none of the Apollo missions are shown to have visited. Choice C is incorrect because the table shows the Apollo 17 samples as approximately 3.8 billion years old, the Apollo 15 samples as approximately 3.3 billion years old, and the Chang’e 5 samples as approximately 2 billion years old, and therefore, the Chang’e samples are closer in age to the Apollo 15 samples than they are to the Apollo 17 samples. Choice D is incorrect because nothing in the text or table suggests that the Chang’e 5 samples were used to confirm the ages of the Apollo samples."},{"i":"53c6c179","c":"graph","d":"H","s":"","o":["Between 1970 and 2000, the median age of first marriage rose more sharply for men in England and Wales than it did for men in the United States.","In England and Wales, the median age of first marriage was consistently higher for men than for women between 1900 and 2000, but this was not always the case in the United States.","The median age of first marriage for men in England and Wales was lower in 1970 than in 1950 or 1990.","Between 1900 and 2000, the median age of first marriage for women in England and Wales was consistently higher than for women in the United States, as was the case for men."],"a":0,"r":"Choice A is the best answer. The student concluded that country-specific factors influence changes to median age of first marriage. This choice describes a time period when the rate of change differed between countries, suggesting that country-specific factors may have played a role in these changes. Choice B is incorrect. This choice misreads the graph. The median age of first marriage was consistently higher for men than for women in the United States during the time period depicted. Choice C is incorrect. The student concluded that country-specific factors influence changes to median age of first marriage. However, this choice doesn’t provide any contrasts between countries and thus doesn’t support the idea of country- specific factors influencing median age of first marriage. Choice D is incorrect. The students’ conclusion is about changes that occurred during the 20th century. This choice provides broad information about the century as a whole, so it doesn’t give insight into how median age at first marriage changed over time."},{"i":"3a1239d2","c":"fss","d":"H","s":"If an animal can recognize itself in a reflective surface (“the mirror test”), it is considered to have self-awareness. In a recent study, scientists ______ for evidence of self-awareness in snakes, species that rely primarily on olfactory rather than visual processing, adapted the test to foreground smell, modifying the scent trails of North American eastern garter snakes and African ball pythons.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["searched","searching","were searching","have searched"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verb forms within a sentence. The nonfinite present participle “searching” is correctly used to form a supplementary element that modifies the subject “scientists,” indicating that the scientists who adapted the test were looking for evidence of self-awareness in snakes. Choice A is incorrect because it results in an ungrammatical sentence. The finite past tense verb “searched” can’t be used in this way to form a supplementary element that indicates what evidence the scientists who adapted the test were looking for. Choice C is incorrect because it results in an ungrammatical sentence. The finite past progressive verb “were searching” can’t be used in this way to form a supplementary element that indicates what evidence the scientists who adapted the test were looking for. Choice D is incorrect because it results in an ungrammatical sentence. The finite present perfect verb “have searched” can’t be used in this way to form a supplementary element that indicates what evidence the scientists who adapted the test were looking for."},{"i":"36944347","c":"fss","d":"M","s":"Official measurements of the Mississippi River’s length vary: according to the US Geologic Survey, the river is 2,300 miles long, whereas the Environmental Protection Agency records its length as 2,320 miles. This disparity can be explained in part by the fact that rivers such as the Mississippi expand and contract as ______ sediment.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["they accumulate","one accumulates","it accumulates","we accumulate"],"a":0,"r":"Choice A is the best answer. The noun that goes with \"expand and contract\" is \"rivers,\" a plural noun. \"They\" is a third-person plural pronoun, so it can correctly stand in for \"rivers.\" Choice B is incorrect. This choice creates a pronoun-antecedent agreement error. \"One\" is a singular pronoun, but the noun that goes with \"expand and contract\" is \"rivers,\" a plural noun. Choice C is incorrect. This choice creates a pronoun-antecedent agreement error. \"It\" is a singular pronoun, but the noun that goes with \"expand and contract\" is \"rivers,\" a plural noun. Choice D is incorrect. This choice creates a pronoun- antecedent agreement error. The noun that goes with \"expand and contract\" is the plural noun \"rivers.\" Rivers are not people, so \"we\" can’t be used to stand in for it."},{"i":"a30567fd","c":"fss","d":"H","s":"Nuhād al-Ḥaddād, known as Fairuz, was one of the most beloved Lebanese singers of the twentieth century. Her broad singing repertoire—which included traditional forms, such as the Arabic qasida and maqam, alongside modern pop and jazz styles—lent Fairuz a timeless, cross- generational appeal, ______ her the moniker “the soul of Lebanon.”\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["earned","had earned","earning","earn"],"a":2,"r":"Choice C is the best answer. The word \"earning\" is being used to introduce an additional modifying phrase, which describes how Fairuz’s repertoire lent her cross-generational appeal. When a verb ends in -ing and doesn’t have a helper verb like \"is\" before it, it can be used to modify a noun or verb. This is appropriate here. Choice A is incorrect. The underlined verb is being used to introduce additional descriptive information, which is set off from the rest of the sentence by a comma. Because there is no subject here, a finite form of the verb (like \"earned\") creates an error. We need another form of the verb that doesn’t require a subject and can introduce descriptive information. Choice B is incorrect. The underlined verb is being used to introduce additional descriptive information, which is set off from the rest of the sentence by a comma. Because there is no subject here, a finite form of the verb (like \"had earned\") creates an error. We need another form of the verb that doesn’t require a subject and can introduce descriptive information. Choice D is incorrect. The underlined verb is being used to introduce additional descriptive information, which is set off from the rest of the sentence by a comma. Because there is no subject here, a finite form of the verb (like \"earn\") creates an error. We need another form of the verb that doesn’t require a subject and can introduce descriptive information."},{"i":"b1e8b87f","c":"bound","d":"E","s":"Winding through the ice atop Norway’s Jotunheim Mountains is the Lendbreen pass, an ancient route that was used by hunters, farmers, traders, and travelers in the Middle Ages before eventually falling into disuse. Recently, archeologists have ______ knives, horseshoes, wool tunics, and thousands of other artifacts from the icy pass.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["unearthed:","unearthed,","unearthed—","unearthed"],"a":3,"r":"Choice D is the best answer. No punctuation should separate the verb \"unearthed\" and its objects (i.e, what was \"unearthed\"): \"knives, horseshoes, wool tunics, and thousands of other artifacts.\" Choice A is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a colon. Choice B is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a comma. Choice C is incorrect. This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a dash."},{"i":"12013e06","c":"bound","d":"M","s":"In rural Minnesota, ecologist Leroy Walston conducted a study to determine whether seeding solar panel fields with wildflowers could bolster pollinator populations in nearby food crops. Walston’s findings indicate that—assuming solar panel installers’ ______ practice has the potential to increase the number of native bees in crops near solar fields throughout the Midwest by up to 20 percent.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["cooperation, this","cooperation—this","cooperation: this","cooperation this"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly uses a dash after “cooperation” to pair with the dash after “that” to separate the supplementary element “assuming solar panel installers’ cooperation” from the rest of the sentence. Choice A is incorrect because a comma can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice C is incorrect because a colon can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because it fails to use appropriate punctuation to separate the supplemental element from the rest of the sentence."},{"i":"6351062d","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In the late 1890s, over 14,000 unique varieties of apples were grown in the US. The rise of industrial agriculture in the mid-1900s narrowed the range of commercially grown crops. Thousands of apple varieties considered less suitable for commercial growth were lost. Today, only 15 apple varieties dominate the market, making up 90% of apples purchased in the US. The Lost Apple Project, based in Washington State, attempts to find and grow lost apple varieties. The student wants to emphasize the decline in unique apple varieties in the US and specify why this decline occurred.\n\nWhich choice most effectively uses relevant information from the notes to accomplish these goals?","o":["The Lost Apple Project is dedicated to finding some of the apple varieties lost following a shift in agricultural practices in the mid-1900s.","While over 14,000 apple varieties were grown in the US in the late 1890s, only 15 unique varieties make up most of the apples sold today.","Since the rise of industrial agriculture, US farmers have mainly grown the same few unique apple varieties, resulting in the loss of thousands of varieties less suitable for commercial growth.","As industrial agriculture rose to prominence in the mid-1900s, the number of crops selected for cultivation decreased dramatically."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes the decline in unique apple varieties in the US and specifies why this decline occurred, noting that thousands of apple varieties were lost because US farmers started mainly growing the same few unique varieties. Choice A is incorrect. The sentence introduces the Lost Apple Project; it doesn’t emphasize the decline in unique apple varieties in the US and specify why this decline occurred. Choice B is incorrect. While the sentence emphasizes the decline in unique apple varieties in the US, it doesn’t explain why this decline occurred. Choice D is incorrect. The sentence emphasizes the general decline of crop varieties in the mid-1900s; it doesn’t emphasize the specific decline in unique apple varieties in the US."},{"i":"24014c3f","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Severo Ochoa discovered the enzyme PNPase in 1955. PNPase is involved in both the creation and degradation of mRNA. Ochoa incorrectly hypothesized that PNPase provides the genetic blueprints for mRNA. The discovery of PNPase proved critical to deciphering the human genetic code. Deciphering the genetic code has led to a better understanding of how genetic variations affect human health. The student wants to emphasize the significance of Ochoa’s discovery.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Ochoa’s 1955 discovery of PNPase proved critical to deciphering the human genetic code, leading to a better understanding of how genetic variations affect human health.","Ochoa first discovered PNPase, an enzyme that he hypothesized contained the genetic blueprints for mRNA, in 1955.","In 1955, Ochoa discovered the PNPase enzyme, which is involved in both the creation and degradation of mRNA.","Though his discovery of PNPase was critical to deciphering the human genetic code, Ochoa incorrectly hypothesized that the enzyme was the source of mRNA’s genetic blueprints."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes the significance of Ochoa’s discovery, noting that it proved critical to deciphering the human genetic code, which resulted in a better understanding of how genetic variations affect human health. Choice B is incorrect. While the sentence explains what Ochoa discovered, it doesn’t emphasize the significance of the discovery. Choice C is incorrect. While the sentence explains what Ochoa discovered, it doesn’t emphasize the significance of the discovery. Choice D is incorrect. While the sentence mentions that Ochoa’s discovery was crucial, it emphasizes Ochoa’s incorrect hypothesis, not the significance of the discovery."},{"i":"b5972710","c":"trans","d":"E","s":"Niger ratified the Outer Space Treaty, an international agreement with over 100 signing nations that acts as the foundation for the laws of space, on February 1, 1967. Jordan, ______ has yet to officially ratify the treaty; it only signed it.\n\nWhich choice completes the text with the most logical transition?","o":["in contrast,","specifically,","for example,","similarly,"],"a":0,"r":"Choice A is the best answer. \"In contrast\" logically signals that the information in this sentence—that Jordan has yet to officially ratify the treaty— contrasts with the previous information about Niger having already ratified the treaty. Choice B is incorrect because \"specifically\" illogically signals that the information in this sentence specifies or elaborates on the previous information about Niger ratifying the treaty. Instead, the sentence changes subjects from Niger to Jordan, presenting contrasting information about Jordan’s treaty status. Choice C is incorrect because \"for example\" illogically signals that the information in this sentence exemplifies the previous information about Niger ratifying the treaty. Instead, the sentence explains that Jordan has yet to ratify the treaty. Choice D is incorrect because \"similarly\" illogically signals that the information in this sentence is similar to the previous information about Niger ratifying the treaty. Instead, the sentence presents contrasting information that Jordan has yet to ratify the treaty."},{"i":"ac8eb085","c":"trans","d":"E","s":"“O2 Arena,” an award-winning science fiction story by Nigerian author Oghenechovwe Donald Ekpeki, takes place in an alternate version of Nigeria where breathable air is a rare commodity that is owned and sold by companies. ______ people must purchase it with currency called O2 credits.\n\nWhich choice completes the text with the most logical transition?","o":["As a result,","In any case,","Nevertheless,","Earlier,"],"a":0,"r":"Choice A is the best answer. The second sentence describes a consequence of the system laid out in the first sentence: because air is owned and sold by companies in this world, people have to buy it. Choice B is incorrect. This choice uses a transition that means “no matter what happens” or “whatever the situation is,” which doesn’t make sense here. There’s only one situation described in the text: a fictional world in which companies own all the breathable air, forcing people to buy it. Choice C is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the previous sentence. They both describe the same fictional situation. Choice D is incorrect. This choice uses a transition that indicates a shift back in time, which doesn’t make sense here. Both sentences use the present tense, as they’re describing the same fictional time period."},{"i":"9e3a215b","c":"trans","d":"M","s":"A 2022 study by researchers Hala Altamimi and Qiaozhen Liu investigated the relationship between nonprofit arts organizations’ spending and performance. ______ the researchers examined the correlation between how much 22,328 US arts nonprofits spent on overhead—operational costs such as equipment and fundraising—and how many people attended their events (a measure of overall success).\n\nWhich choice completes the text with the most logical transition?","o":["Thus,","In addition,","By comparison,","Specifically,"],"a":3,"r":"Choice D is the best answer. \"Specifically\" logically signals that the information in this sentence—that the researchers examined the overhead costs and attendance at events of 22,328 nonprofits—provides specific, precise details elaborating on how the researchers investigated the relationship between nonprofits’ spending and performance. Choice A is incorrect. \"Thus\" illogically signals that the information in this sentence is a result or consequence of the researchers’ investigation of nonprofits’ spending and performance. Instead, it specifies how they examined that correlation. Choice B is incorrect. \"In addition\" illogically signals that the information in this sentence is merely an additional fact about the researchers’ investigation of nonprofits’ spending and performance. Instead, it specifies how they examined that correlation. Choice C is incorrect. \"By comparison\" illogically signals that the information in this sentence is being compared to the researchers’ investigation of nonprofits’ spending and performance. Instead, it specifies how they examined that correlation."}],"img":{"cebfb2c6":"iVBORw0KGgoAAAANSUhEUgAAArwAAAE4BAMAAABLXT0jAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABDE0lEQVR42u1dd1wURxt+Zq8BAjeL2I0sYK+L2Es8sPfDXpJ4do3tNLFFTbDXJNg1aoKaxNixx5J42Fv0sMYGhy0mCjeHGgtw8/0BIiAoIqJ+uef3U253Z2Znnnln5p133p0BHHDAAQcccMABB95heNBnvwX5+efVnrtHvJFBFNKLpgtC/FKuKSCSpOfkP8WuJvEoBSAAAJyDCQZLaajELpkuThvlmyupGHcKSWZVcy6ZRwAYclUH4FrShTcQD9idgpPeoQcoQEHof4He0CKhpAqZqVNUhqJmCMVGAzw9qFKGUgKUsuoQMB1EUhCfAChl4ispozXhaAi/AIVMfGWnUCEQQgBQe7afrNARvwClRMl11T74k2vwBwJVhyjskiJRISsCoPBTegsBRAqEQp/7cqzM9TcS9pduQL0p9R/U9hoxK44xhZN++aq4XtsTm//k1iVue0yPqpJFC5VhifNWW83t9uY7e13L+zi0aJ+6TWydvVptg4wurWOb+Vkt9Xu43nfRnv719Kk6tYgY/5Vm2gUUGn12ev9GJSWz1TDDrNJ1lU4NkL+qVk5r3XkmckAxs+X/X3qdQsm+Bhpz57xxeXrcKBpMnEKvO4e30oRVzGfpgDyb6uXbD7oImtBi+U5X8jbW87lPMO4wCgj3bxQJ/8R5U+tCITecwm5pdLS8cWe+a8Xa3ii//GuCcTvQkp7bN5DYBvuenQ9yweQ2ziXknka+qand417R8TeKGO8VlHO9sELu88sgnj8EHvdkv3DlLuN5FX9h417vcssTrhSG/dvjrTgYCIeVREZqE0KFExyTfwq1XiZ3Yzeewt49H1CnQ2zqunAWicJxG/4OumLZuJfTydvChT0e2srHicvVuhw8XjUQnH2x1Lx4XcS99X9Xvsvw3Rfm/wK9ULh90xSUP2y/HKCo//A+ocR2q4+1fW3qKcFCQBknEAEoe7cC4Dl4QUCjqmZGqBZUEASn3sFbF3cDYXGQhShwCtwfPN9X27ELEjvWE0GLAe47uloJ3bpLP/eX1lQWrITTSZd0/wV6834aIubHtYr3VOUKVgPq9Gn9UVtDoqDQbN6Hf9r2DOeEKfxl/+4URCA9OAXrXQ1C/koSaByvH2x2P3hfPmiRQCUklGhgogQieJ+q7nsrBYr7vIYcqLL5JgW23BVA9lvp2QivPPmrntJyISJa+g+oDqrLB1D7Ukih0DpH6Ue7DWQu1MFff0/HHibrtoKM3a+YAww8cWDW7nxGF+9la31CgY8u6wpd2hLqpC/ndPmg2 function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="re"){if(!done&&Object.keys(ans).length&&!confirm("Clear all your answers and start over?"))return;ans={};done=false;miss=false;draw();scrollTo(0,0)}
 else if(t.id==="sub")submit();
 else if(t.id==="mi"){miss=!miss;draw()}
 else if(t.dataset.k!==undefined&&!done){const a=t.closest("article"),q=Q[a.dataset.n-1];ans[q.i]=+t.dataset.k;a.outerHTML=card(q,+a.dataset.n);sum()}});
draw();
</script></body></html>
