<script>
const D={"t":"Practicetest30","q":[{"i":"ab1bd603","c":"vocab","d":"M","s":"The following text is adapted from Upton Sinclair’s 1906 novel The Jungle. Marija is helping to manage her sister’s wedding. It was [Marija’s] task to see that all things went in due form, and after the best home traditions; and, flying wildly hither and thither, bowling every one out of the way, and scolding and exhorting all day with her tremendous voice, Marija was too eager to see that others conformed to the proprieties to consider them herself.\n\nAs used in the text, what does the word “consider” most nearly mean?","o":["Take into account and follow","Admire steadily and praise","Come to a decision about","Have an opinion on"],"a":0,"r":"Choice A is the best answer because as used in the text, \"consider\" most nearly means to take into account and follow. The text explains that Marija’s job was to make sure that her sister’s wedding proceeded in certain ways (\"in due form\") and that she loudly directed everyone’s actions all day. The text then indicates that Marija was so focused on ensuring that others \"conformed to the proprieties\"—that is, that they behaved in appropriate ways—that she failed to \"consider them herself\"; that is, she didn’t take standards of appropriate behavior into account and follow them in her own actions. Choice B is incorrect. In some contexts, \"consider\" can mean to think about something in a positive way—which can involve admiration—but the text doesn’t suggest that Marija was so busy imposing \"proprieties\" (standards of appropriate behavior) on others that she didn’t admire and praise them herself. The context suggests it’s more likely that Marija did speak positively of \"due form\" and \"the best home traditions\" while ensuring others behaved in certain ways. Choice C is incorrect. In some contexts, \"consider\" can mean to come to a decision, but the text doesn’t suggest that Marija wasn’t able to make a decision for herself about the \"proprieties\" (standards of appropriate behavior) she ensured everyone else conformed to. Rather, the context conveys that Marija knew very clearly which behaviors others should follow as \"due form\" and \"the best home traditions.\" Choice D is incorrect. In some contexts, \"consider\" can mean to have an opinion, but the text doesn’t suggest that Marija wasn’t able to have an opinion on the \"proprieties\" (standards of appropriate behavior) she was ensuring others conformed to. Rather, the context conveys that Marija had strong feelings about which behaviors were \"due form\" and \"the best home traditions.\""},{"i":"45a109a3","c":"vocab","d":"E","s":"The following text is from Bram Stoker’s 1897 novel Dracula. The narrator is being driven in a carriage through a remote region at night. The baying of the wolves sounded nearer and nearer, as though they were closing round on us from every side. I grew dreadfully afraid, and the horses shared my fear. The driver, however, was not in the least disturbed; he kept turning his head to left and right, but I could not see anything through the darkness.\n\nAs used in the text, what does the word “disturbed” most nearly mean?","o":["Disorganized","Alarmed","Offended","Interrupted"],"a":1,"r":"Choice B is the best answer because as used in the text, “disturbed” most nearly means alarmed. The text portrays the narrator traveling in a carriage as wolves howl in the surrounding darkness. The text contrasts the reaction of both the narrator and the horses pulling the carriage with that of the driver of the carriage: the narrator and horses are “dreadfully afraid,” but the driver is “not in the least disturbed.” In other words, the driver is not alarmed by the wolves nearby. Choice A is incorrect. Although in some contexts, “disturbed” can mean disorganized, the text doesn’t portray a character acting in a disorganized manner; instead, the driver continues to drive the carriage, even though the horses pulling it are alarmed. Choice C is incorrect. Although in some contexts, “disturbed” can mean offended, the text doesn’t portray one character feeling offended, or upset, by another’s actions; instead, it contrasts the fear felt by the narrator with another character’s lack of fear. Choice D is incorrect. Although in some contexts, “disturbed” can mean interrupted, the text doesn’t portray an action being interrupted; indeed, the travel depicted in the scene continues despite the threat of the wolves outside the carriage."},{"i":"80ebb189","c":"vocab","d":"E","s":"As an architect in Los Angeles in the 1950s, Helen Liu Fong became known for avoiding ______ designs in her buildings. Instead of using standard shapes and colors, she typically explored innovative forms and daring hues.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["creative","bold","traditional","understandable"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Helen Liu Fong’s architectural designs. In this context, “traditional” means conventional. The text states that rather than use “standard shapes and colors,” Fong pursued “innovative” and “daring” design choices in her work. Fong’s style is depicted as inventive, so it therefore makes sense in this context that she avoided mainstream, traditional designs in her buildings. Choice A is incorrect because the text indicates that Fong’s work is innovative and experimental. Thus, Fong’s design choices could reasonably be considered creative, or original. She likely would have pursued creative designs, not avoided them. Choice B is incorrect because the text indicates that Fong used “daring” hues in her designs. Thus, Fong likely would have pursued bold, or brave and vivid design choices; she wouldn’t have avoided them. Choice D is incorrect because the text doesn’t address whether Fong’s designs are understandable, or reasonable or expected. The text focuses on certain characteristics of Fong’s designs, not on how people received or understood them."},{"i":"f773a56b","c":"vocab","d":"E","s":"As Mexico’s first president from an Indigenous community, Benito Juarez became one of the most ______ figures in his country’s history: among the many significant accomplishments of his long tenure in office (1858–1872), Juarez consolidated the authority of the national government and advanced the rights of Indigenous peoples.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["unpredictable","important","secretive","ordinary"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Juarez. In this context, “important” means marked by significant work or consequence. The text indicates that Juarez, who was the first president of Mexico from an Indigenous community, became a certain kind of figure in Mexico’s history. It then supports that claim by describing some of the “many significant accomplishments” from Juarez’s long tenure in office. This context conveys that Juarez is a significant and consequential figure in Mexico’s history. Choice A is incorrect because the text focuses on Juarez’s role as the first president of Mexico from an Indigenous community and on his many major accomplishments during his lengthy time in office; nothing in the text suggests that Juarez was “unpredictable,” or tended to behave in ways that couldn’t be predicted. Choice C is incorrect because nothing in the text suggests that Juarez was a particularly “secretive” figure, or that he tended to keep things private or hidden from others. Instead, the text focuses on things that are known about Juarez: that he was the first president of Mexico from an Indigenous community, that he had a lengthy tenure, and that his many major accomplishments included consolidating the national government’s authority and advancing Indigenous rights. Choice D is incorrect because the text focuses on the idea that Juarez, who was the first president of Mexico from an Indigenous community, had many major accomplishments during his lengthy time in office. Rather than suggesting that Juarez was an “ordinary,” or common and typical, figure in Mexico’s history, this context conveys that Juarez was instead a notable figure."},{"i":"1d9a09c0","c":"purpose","d":"E","s":"The following text is adapted from Jason Reynolds’s 2016 novel Ghost. The narrator, who is in middle school, is at a bus stop. I just go there [to the bus stop] to look at the people working out. See, the gym across the street has this big window—like the whole wall is a window—and they have those machines that make you feel like you walking up steps and so everybody just be facing the bus stop, looking all crazy like they’re about to pass out. And trust me, there ain’t nothing funnier than that. So I check that out for a little while like it’s some kind of movie: The About to Pass Out Show, starring stair-stepper person one through ten. ©2016 by Jason Reynolds Which choice best states the main purpose of the text?","o":["To give a reason why the narrator is excited to start middle school","To describe an activity that the narrator finds amusing","To explain a problem that the narrator has overcome","To discuss a movie that the narrator saw in a theater"],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text. The text describes how the narrator watches people working out at a gym through a window near a bus stop. The narrator says that \"there ain’t nothing funnier\" than watching people try to work out on the stair climber machine. Thus, the main purpose of the text is to describe an activity that the narrator finds amusing. Choice A is incorrect because the text isn’t about the narrator beginning middle school. The text describes how the narrator finds people working out at a gym amusing and makes no mention of school life. Choice C is incorrect because the text doesn’t mention any problems that the narrator currently has or has overcome. It just describes how the narrator finds watching people work out amusing. Choice D is incorrect because the narrator invents the made-up movie mentioned in the text. The text doesn’t indicate that the narrator has seen a movie in a theater. The focus of the text is on the narrator watching people at the gym, not watching a movie."},{"i":"4eee64fa","c":"purpose","d":"H","s":"Space scientists Anna-Lisa Paul, Stephen M. Elardo, and Robert Ferl planted seeds of Arabidopsis thaliana in samples of lunar regolith—the surface material of the Moon—and, serving as a control group, in terrestrial soil. They found that while all the seeds germinated, the roots of the regolith-grown plants were stunted compared with those in the control group. Moreover, unlike the plants in the control group, the regolith-grown plants exhibited red pigmentation, reduced leaf size, and inhibited growth rates—indicators of stress that were corroborated by postharvest molecular analysis.\n\nWhich choice best states the main purpose of the text?","o":["It describes an experiment that addressed an unresolved question about the extent to which lunar regolith resembles terrestrial soils.","It compares two distinct methods of assessing indicators of stress in plants grown in a simulated lunar environment.","It presents evidence in support of the hypothesis that seed germination in lunar habitats is an unattainable goal.","It discusses the findings of a study that evaluated the effects of exposing a plant species to lunar soil conditions."],"a":3,"r":"Choice D is the best answer. The text describes an experiment wherein space scientists compared plant growth in terrestrial and lunar soil conditions. It then discusses the findings of the study, including the fact that all the seeds germinated but that the plants grown in lunar soil exhibited signs of stress. Choice A is incorrect. The text doesn’t address this question, and never describes any specific characteristics of either soil. It merely describes the outcome of an experiment that exposed a plant species to lunar soil conditions. Choice B is incorrect. The text never compares methods of assessing indicators of stress—instead, it simply mentions several stress indicators observed in the study (red pigmentation, reduced leaf size, and inhibited growth rates). Choice C is incorrect. The text doesn’t present any evidence that we could never achieve seed germination in lunar habitats, and in fact states that the seeds in the lunar soil did germinate."},{"i":"749f3334","c":"func","d":"M","s":"The following text is from Charlotte Forten Grimké’s 1888 poem “At Newport.” Oh, deep delight to watch the gladsome waves Exultant leap upon the rugged rocks; <u>Ever repulsed, yet ever rushing on— Filled with a life that will not know defeat;<\/u> To see the glorious hues of sky and sea. The distant snowy sails, glide spirit like, Into an unknown world, to feel the sweet Enchantment of the sea thrill all the soul, Clearing the clouded brain, making the heart Leap joyous as it own bright, singing waves!\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It portrays the surroundings as an imposing and intimidating scene.","It characterizes the sea’s waves as a relentless and enduring force.","It conveys the speaker’s ambivalence about the natural world.","It draws a contrast between the sea’s waves and the speaker’s thoughts."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The text presents the speaker’s experience of viewing the sea. In the underlined portion, the speaker focuses on the idea that the waves hitting rocks on the shore are a relentless and enduring force: they are constantly pushed back (“ever repulsed”) but always return (“ever rushing on”), as though they have an energy that can’t be overcome (“a life that will not know defeat”). Choice A is incorrect. Although the underlined portion characterizes the waves as a relentless force (always “repulsed” but still “rushing on” and never being defeated), the speaker doesn’t suggest that the surroundings are intimidating. Instead, the speaker presents the scene in a positive way, describing the “deep delight” of the “gladsome,” or cheerful, waves and feeling “the heart / Leap joyous” while viewing the sea. Choice C is incorrect because the underlined portion doesn’t suggest that the speaker is ambivalent, or has mixed feelings about, the natural world. Instead, it presents a single view of one part of the immediate surroundings: the speaker characterizes the sea’s waves as an unstoppable force, since they are constantly pushed back but always return (“ever repulsed, yet ever rushing on”). Choice D is incorrect. Although the text later suggests the speaker’s view of her own thoughts by referring to a “clouded brain” and a heart that leaps joyously, this reference neither occurs within the underlined portion nor establishes a clear contrast with the relentless determination of the waves. The underlined portion addresses only the speaker’s view of the waves and doesn’t suggest what her own thoughts might be."},{"i":"2aaee77f","c":"func","d":"E","s":"Some bird species don’t raise their own chicks. Instead, adult females lay their eggs in other nests, next to another bird species’ own eggs. <u>Female cuckoos have been seen quickly laying eggs in the nests of other bird species when those birds are out looking for food.<\/u> After the eggs hatch, the noncuckoo parents will typically raise the cuckoo chicks as if they were their own offspring, even if the cuckoos look very different from the other chicks.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It introduces a physical feature of female cuckoos that is described later in the text.","It describes the appearance of the cuckoo nests mentioned earlier in the text.","It offers a detail about how female cuckoos carry out the behavior discussed in the text.","It explains how other birds react to the female cuckoo behavior discussed in the text."],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The first two sentences establish that birds of some species don’t raise their own young; instead, they lay their eggs in the nests of birds of other species. The underlined sentence then states that female cuckoo birds engage in this behavior, having been observed specifically laying their eggs in other nests while the other birds are out finding food. According to the text, the cuckoo chicks are then raised by the other birds. Thus, the underlined sentence provides a particular detail about how female cuckoos carry out the behavior of laying eggs for other birds to raise. Choice A is incorrect. Rather than mentioning a physical feature of female cuckoos, the underlined sentence introduces a specific behavior of female cuckoos: laying eggs in the nests of birds of other species when the other birds are away. The only reference to physical features is the last sentence’s general mention of cuckoo chicks looking different from chicks of other species. Choice B is incorrect because the underlined sentence refers to the nests of birds other than cuckoos and doesn’t describe how any nests look, cuckoo or otherwise. Instead, the sentence addresses how female cuckoos use other birds’ nests. Choice D is incorrect because the underlined sentence describes only female cuckoo behavior (laying eggs in the nests of birds of other species when the other birds are away); it’s the last sentence of the text that addresses the other birds’ reaction, indicating that those birds usually raise the cuckoo chicks once they’ve hatched."},{"i":"35e21b06","c":"cross","d":"H","s":"Text 1 Dominique Potvin and colleagues captured five Australian magpies (Gymnorhina tibicen) to test a new design for attaching tracking devices to birds. As the researchers fitted each magpie with a tracker attached by a small harness, they noticed some magpies without trackers pecking at another magpie’s tracker until it broke off. The researchers suggest that this behavior could be evidence of magpies attempting to help another magpie without benefiting themselves.\n\nText 2 It can be tempting to think that animals are deliberately providing help when we see them removing trackers and other equipment from one another, especially when a species is known to exhibit other cooperative behaviors. At the same time, it can be difficult to exclude the possibility that individuals are simply interested in the equipment because of its novelty, curiously pawing or pecking at it until it detaches.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the researchers’ perspective in\n\nText 1 on the behavior of the magpies without trackers?","o":["That behavior might have been due to the novelty of the magpies’ captive setting rather than to the novelty of the tracker.","That behavior likely indicates that the magpies were deliberately attempting to benefit themselves by obtaining the tracker.","That behavior may not be evidence of selflessness in Gymnorhina tibicen because not all the captured magpies demonstrated it.","That behavior might be adequately explained without suggesting that the magpies were attempting to assist the other magpie."],"a":3,"r":"Choice D is the best answer because it reflects how the author of Text 2 would most likely respond to the researchers’ perspective in Text 1 on the behavior of the magpies without trackers. According to Text 1, Dominique Potvin and colleagues observed magpies without trackers pecking at a tracker on another magpie until the device fell off. The researchers suggested that the birds might have been attempting to help the other bird, with no benefit to themselves. Text 2 generally discusses scenarios in which animals have been observed removing trackers from each other. The text cautions that it shouldn’t be assumed that these animals are helping one another deliberately, since they might simply be pecking at trackers out of curiosity, causing them to fall off eventually. Therefore, the author of Text 2 would most likely respond to Potvin and colleagues’ perspective in Text 1 by saying that the behavior of the magpies without trackers could be adequately explained without suggesting that they were attempting to assist the other magpie. Choice A is incorrect because Text 2 never discusses the novelty, or the newness and unusual quality, of the captive settings in which animals have been observed to remove trackers from other animals, nor does it suggest that such novelty might account for this behavior. Instead, the text suggests that it’s the novelty of the tracking equipment itself that might cause the behavior: interested in the trackers because they’re unusual, animals might paw or peck at them until they fall off. Choice B is incorrect because Text 2 never suggests that when animals remove trackers from other animals, they do so because they wish to obtain the trackers for themselves. Instead, Text 2 argues that animals paw or peck at trackers because they are merely curious about them. Choice C is incorrect because Text 2 doesn’t argue that when captured animals are observed removing trackers from each other, their behavior should be regarded as selfless only if all of them participate in it. Instead, the text argues that the behavior may not be selfless at all and may instead be attributed to animals’ curiosity about the new and unusual trackers."},{"i":"923ebfe3","c":"main","d":"M","s":"Businesses selling clothing and other fashion items face obstacles in trying to forecast how much product to order: tastes and styles change quickly, while manufacturing clothing takes a significant amount of time. Researchers Youran Fu and Marshall Fisher have found that combining sellers’ own data with information gathered from social media can dramatically improve the accuracy of such forecasts—by 24 to 57 percent in the cases they directly studied. Better predictions mean demand is easier to meet without retailers becoming overstocked.\n\nWhich choice best states the main idea of the text?","o":["Using multiple data sources can enhance the ability of sellers in the fashion industry to anticipate demand.","Social media is revolutionizing how both sellers and researchers view the fashion industry.","Becoming overstocked is the main preoccupation of sellers trying to forecast demand for fashion items.","Retailers can use their own data to accurately predict how tastes and styles are evolving."],"a":0,"r":"Choice A is the best answer because it most accurately states the main idea of the text. The text explains that fashion retailers face challenges in forecasting product demand due to rapidly changing tastes and lengthy manufacturing times. It then presents research by Fu and Fisher showing that combining retailers’ own data with social media information significantly improves forecast accuracy. The text concludes by noting that better predictions help retailers meet demand without becoming overstocked. Thus, the main idea is that using multiple data sources (retailers’ own data combined with social media information) can enhance fashion retailers’ ability to anticipate demand. Choice B is incorrect because the text doesn’t claim that social media is revolutionizing, or fundamentally changing, how sellers and researchers view the fashion industry. The text never addresses the way the fashion industry is viewed; rather, it discusses a practical approach sellers in the industry can take to better match production with demand. Choice C is incorrect. Although avoiding overstocking is mentioned as a benefit of an approach that can help fashion sellers better predict demand, the text doesn’t focus on overstocking or characterize it as the main concern of sellers. Rather, the text is focused on discussing the approach itself. Choice D is incorrect because the text suggests that fashion sellers encounter obstacles when using their own data to try to forecast demand as tastes and styles change; the text focuses on the idea that instead of using their own data alone, retailers should combine their own data with social media information to more accurately forecast demand."},{"i":"1a2b29c9","c":"main","d":"H","s":"The following text is adapted from María Cristina Mena’s 1914 short story “The Vine-Leaf.” It is a saying in the capital of Mexico that Dr. Malsufrido carries more family secrets under his hat than any archbishop. The doctor’s hat is, appropriately enough, uncommonly capacious, rising very high, and sinking so low that it seems to be supported by his ears and eyebrows, and it has a furry look, as if it had been brushed the wrong way, which is perhaps what happens to it if it is ever brushed at all. When the doctor takes it off, the family secrets do not fly out like a flock of parrots, but remain nicely bottled up beneath a dome of old and highly polished ivory.\n\nBased on the text, how do people in the capital of Mexico most likely regard Dr. Malsufrido?","o":["Many have come to tolerate him despite his disheveled appearance.","Few feel concerned that he will divulge their confidences.","Some dislike how freely he discusses his own family.","Most would be unimpressed by him were it not for his professional expertise."],"a":1,"r":"Choice B is the best answer. The text describes a saying in the capital that Malsufrido keeps more secrets than an archbishop. It also says that when he takes off his hat, “the family secrets do not fly out… but remain nicely bottled up,” suggesting that he will not betray his confidences. Choice A is incorrect. This choice doesn’t reflect the text. While his hat is large and appears to have been brushed in the wrong direction, Dr. Malsufrido does not seem to be regarded as ill-dressed or disheveled. Choice C is incorrect. This choice is the opposite of what the text says. The secrets of families (his and others’) remain “bottled up” in his head. Choice D is incorrect. This choice isn’t supported by the text. His professional expertise is not discussed in the passage."},{"i":"d047abca","c":"infer","d":"M","s":"Narwhals are shy whales that live in the remote Arctic Ocean. Some of them have a long tusk, like a unicorn horn, with sensitive nerves. Narwhals are known for this tusk, but many actually don’t have one and its purpose is unknown. One group of scientists came up with a possible purpose in 2014. The scientists suggested that the tusk may help narwhals determine when water around them is likely to start freezing and become dangerous for them. Marine biologist Kristin Laidre disagrees with that idea, though. She reasons that if the narwhal’s tusk serves such an important purpose, then it’s most likely that ______ Which choice most logically completes the text?","o":["some narwhals would seek a new habitat.","fewer marine animals would also have tusks.","more narwhals would have a tusk.","narwhals would become less shy over time."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Kristin Laidre’s reasoning about the purpose of the tusk that many, but not all, narwhals have. The text explains that one group of scientists thinks the tusk may help narwhals detect the threat of freezing water and that Laidre disagrees with that idea, given the importance of avoiding a dangerous situation. It’s logical to suggest that if the tusk serves such an important purpose for narwhals, the trait would be more common among them—specifically, that more narwhals would have a tusk. Choice A is incorrect because there’s no reason to think Laidre would say that if the tusk has the important function of helping narwhals detect when the water around them is about to freeze (meaning that it isn’t always freezing), some narwhals would choose a different habitat altogether. Indeed, if it’s true that the tusk helps narwhals avoid areas with dangerous conditions when they occur in their Arctic Ocean habitat, the tusk would likely enable the narwhals to continue living in that habitat rather than drive them elsewhere entirely. Choice B is incorrect because the text focuses only on narwhals and makes no mention of other marine animals or how having a tusk might affect them. And if anything, it would be more logical to expect a very important trait to be more widespread, not less common, among other similar types of animals. Choice D is incorrect. Although the text describes narwhals as shy, it doesn’t indicate that the scientists’ conclusion has anything to do with shyness. And because shyness and detection of the threat of freezing water aren’t logically connected, there’s no reason to think that Laidre would expect narwhals to become less shy over time if the tusk serves that important purpose."},{"i":"fcae209f","c":"infer","d":"E","s":"The Nacional tree is a rare variety of cacao. Nacionals were thought to have gone extinct by the twentieth century due to a fungus. This fungus can spread from tree to nearby tree through the air and causes disease. But around 2013, cacao expert Servio Pachard located some of these Nacional trees. The trees were in the Piedra de Plata coastal forest, within a hard-to-reach valley in Ecuador. Conservationists inferred that the Nacional trees in Piedra de Plata might have avoided the diseases that wiped out the other Nacionals because ______ Which choice most logically completes the text?","o":["early twentieth-century scientists did not know why so many Nacionals were becoming infected.","the ability of the fungus to travel through the air was only recently discovered.","they were too far from the other Nacional trees infected by the fungus to become infected themselves.","the chocolate made from their pods was highly valued."],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the Nacional trees’ survival in Piedra de Plata. The text states that the fungus that caused Nacional trees elsewhere to become diseased spreads from tree to nearby tree through the air. The text also mentions that the surviving Nacional trees were found in a hard-to-reach valley in Ecuador. Given this information, it’s logical to conclude that these trees might have avoided infection because they were geographically isolated from infected Nacional trees, which prevented the airborne fungus from reaching them. Choice A is incorrect because early twentieth-century scientists’ lack of knowledge about the infection that affected many Nacionals doesn’t explain how the trees in the Piedra de Plata coastal forest survived. The text is concerned with the physical factors that allowed certain trees to avoid infection, not with scientists’ understanding of the disease. Choice B is incorrect. Although the text mentions that the fungus spreads through the air, it doesn’t indicate when this ability was discovered. Moreover, even if the ability to move through the air was recently discovered, that wouldn’t explain how the trees in Piedra de Plata avoided infection in the past. Choice D is incorrect because the value of the chocolate made from Nacional pods doesn’t explain how the trees in the Piedra de Plata coastal forest avoided disease. The text focuses on the physical spread of the fungus that caused most Nacionals to become diseased, not on economic factors related to the trees’ products."},{"i":"0a77c362","c":"claim","d":"E","s":"“Aunt Sue’s Stories” is a 1926 poem by Langston Hughes. In the poem, the speaker indicates that the stories Aunt Sue tells are based on Aunt Sue’s personal experiences, saying that ______ Which choice most effectively uses a quotation from “Aunt Sue’s Stories” to illustrate the claim?","o":["dark shadows “cross and recross / Aunt Sue’s stories.”","a listening child “knows that Aunt Sue / Never got her stories out of any book at all, / But that they came / Right out of her own life.”","the stories are told during “Summer nights on the front porch.”","the people in the stories “Mingle themselves softly / In the flow of old Aunt Sue’s voice, / Mingle themselves softly.”"],"a":1,"r":"Choice B is the best answer because it most effectively illustrates the speaker of the poem’s claim that the stories Aunt Sue tells are based on Aunt Sue’s personal experiences. In the quotation, the speaker conveys the listening child’s point of view that Aunt Sue’s stories originate from her personal experiences and are not taken from books or other external sources. The listening child explicitly contrasts two possible sources for Aunt Sue’s stories: a book (whose potentially fictitious stories are implied to be written by someone else) or “her own life.” By having the child confidently assert that Aunt Sue “never got her stories out of any book at all,” the speaker indicates that Aunt Sue’s stories are instead informed by her lived experiences. Choice A is incorrect because it describes an element or image that recurs within Aunt Sue’s stories rather than indicating that these stories have a real-life basis. The reference to dark shadows that “cross and recross” the stories functions as imagery on a literal, visual level and may also evoke figurative darkness, but this detail by itself doesn’t suggest that the stories are based on Aunt Sue’s personal experiences. Choice C is incorrect because it identifies the setting of Aunt Sue’s storytelling rather than describing the real-life basis of the stories themselves. The quotation states that Aunt Sue tells her stories on “summer nights on the front porch,” which establishes when and where the storytelling occurs; however, no information is provided about the origins of the stories that Aunt Sue tells within this setting. Choice D is incorrect because it describes the movement or circulation of characters in the stories as Aunt Sue speaks rather than establishing that these stories have a real-life basis. The quotation primarily evokes the sounds of Aunt Sue’s voice and the seemingly easy “flow” of this voice in her storytelling. Although the characters who “mingle…in the flow of old Aunt Sue’s voice” are to some extent created or animated by her voice, no information is provided about the characters themselves or their relationship to Aunt Sue’s actual experiences."},{"i":"09f9edb0","c":"claim","d":"H","s":"In the 1980s, many musicians and journalists in the English-speaking world began to draw attention to music from around the globe—such as mbaqanga from South Africa and quan họ from Vietnam—that can’t be easily categorized according to British or North American popular music genres, typically referring to such music as “world music.” While some scholars have welcomed this development for bringing diverse musical forms to prominence in countries where they’d previously been overlooked, musicologist Su Zheng claims that the concept of world music homogenizes highly distinct traditions by reducing them all to a single category.\n\nWhich finding about mbaqanga and quan họ, if true, would most directly support Zheng’s claim?","o":["Mbaqanga and quan họ developed independently of each other and have little in common musically.","Mbaqanga is significantly more popular in the English-speaking world than quan họ is.","Mbaqanga and quan họ are now performed by a diverse array of musicians with no direct connections to South Africa or Vietnam.","Mbaqanga and quan họ are highly distinct from British and North American popular music genres but similar to each other."],"a":0,"r":"Choice A is the best answer. Zheng’s claim is that the idea of world music “homogenizes” (meaning makes similar) distinct kinds of music by reducing them to one category. In other words, Zheng thinks the concept of world music is a harmful oversimplification of diverse musical forms. To support this claim, we need evidence that these musical traditions are so different from one another that they should not fall into the same category. If it’s true that mbaqanga and quan họ developed separately and have little in common musically, then it wouldn’t make sense to lump them into the same category. Choice B is incorrect. If true, this wouldn’t affect the claim. To support the claim, we need evidence that these musical traditions are so different from one another that they should not fall into the same category. A difference in popularity doesn’t necessarily mean that the two musical traditions shouldn’t be categorized together: instead, we need to know if the music itself is similar or different. Choice C is incorrect. If true, this wouldn’t affect the claim. To support the claim, we need evidence that these musical traditions are so different from each other that they should not fall into the same category. This choice doesn’t do that. Choice D is incorrect. If true, this would actually weaken the claim. Zheng thinks it’s reductive or oversimplifying to put distinct musical traditions into a single category. But if mbaqanga and quan họ are similar to each other, then it would make sense to put them in the same category."},{"i":"8a668840","c":"graph","d":"M","s":"","o":["The monthly hours of sunshine in both Anchorage and Fairbanks hold steady in June and July before beginning to decline in August.","The monthly hours of sunshine in both Anchorage and Fairbanks increase from April to June and then decrease from June to September.","Anchorage and Fairbanks both have less than 200 monthly hours of sunshine from April to September.","Anchorage and Fairbanks both have more than 300 monthly hours of sunshine from April to June and less than 200 hours from July to September."],"a":1,"r":"Choice B is the best answer because it best describes data from the graph that support the student’s conclusion about weather patterns in Anchorage and Fairbanks. According to the graph, the amount of sunshine increases in both cities from April to June: in Anchorage, the number of monthly hours increases from about 250 to just under 300, and in Fairbanks the number of monthly hours increases from about 300 to just under 350. Also according to the graph, the amount of sunshine decreases in both cities from June to September: in Anchorage the number of monthly hours decreases from just under 300 to about 125, and in Fairbanks the number of monthly hours decreases from just under 350 to about 125. Thus, the monthly hours of sunshine in both cities follow a similar pattern, increasing from April to June and then decreasing from June to September. Choice A is incorrect because, according to the graph, the monthly hours of sunshine in both Anchorage and Fairbanks decrease from June to July. They don’t hold steady. In June there are slightly less than 300 hours of sunshine in Anchorage and slightly less than 350 hours in Fairbanks. Then, in July there are approximately 250 hours of sunshine in both cities. Choice C is incorrect because the graph shows that Anchorage and Fairbanks have less than 200 monthly hours of sunshine only in August and September. For the rest of the months represented in the graph, both cities have more than 200 monthly hours of sunshine. Choice D is incorrect because, according to the graph, Anchorage doesn’t have more than 300 monthly hours of sunshine from April to June. In addition, both cities have more than 200 hours of sunshine in July, although the amount of sunshine does decrease to less than 200 monthly hours in August and September."},{"i":"5cf5c0d3","c":"graph","d":"H","s":"","o":["Dark Cloud acted in significantly fewer films than did Lillian St. Cyr, who is credited with 66 performances.","Edwin Carewe’s 47 credited acting roles includes only films made after 1934.","Lillian St. Cyr acted in far more than 66 films and Edwin Carewe directed more than 58.","James Young Deer actually directed 33 films and acted in only 10."],"a":2,"r":"Choice C is the best answer because it uses data from the table to effectively exemplify the idea that the film outputs of the four individuals included in the table should be considered bare minimums—that is, that we should assume that the individuals actually had higher outputs than those recorded. The table presents the years during which the individuals were active and the number of known films the individuals are credited in. The table indicates that Lillian St. Cyr has 66 film credits as an actor and that Edwin Carewe has 58 film credits as a director; it follows that if some films and records for the era were lost, it’s possible that Lillian St. Cyr acted in far more than 66 films and that Edwin Carewe directed more than 58 films. Choice A is incorrect because it doesn’t effectively exemplify the idea that the film outputs of the four individuals included in the table should be considered bare minimums. Rather than addressing the idea that the individuals likely had higher outputs than those presented in the table, this choice simply compares data from the table to make the point that Dark Cloud has fewer credited acting roles than Lillian St. Cyr (35 and 66, respectively). Choice B is incorrect because it misrepresents data from the table, even though it may exemplify the idea that the film outputs of the four individuals included in the table should be considered bare minimums by implying that Edwin Carewe acted in more than 47 films. The table indicates that Edwin Carewe was active from 1912 to 1934, meaning that his 47 credited acting roles were in films made before or during 1934, not after that time. Choice D is incorrect because it doesn’t effectively exemplify the idea that the film outputs of the four individuals included in the table should be considered bare minimums. Instead of addressing the idea that the individuals likely had higher outputs than those recorded, this choice suggests that James Young Deer actually acted in and directed fewer films than presented in the table (only 33 known films as a director instead of 35, and only 10 known films as an actor instead of 33)."},{"i":"7b419faf","c":"fss","d":"E","s":"In 1903, environmentalist John Muir guided President Theodore Roosevelt on a scenic, sprawling trip through California’s Yosemite Valley. Upon returning from the three-day excursion, Roosevelt ______ to conserve the nation’s wilderness areas, a vow he upheld for his remaining six years in office.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is vowing","vowed","will vow","vows"],"a":1,"r":"Choice B is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the past tense verb “vowed” is consistent with the other past tense verbs (“guided” and “upheld”) used to narrate the events surrounding President Roosevelt’s decision to conserve the nation’s wilderness areas. Choice A is incorrect because the present progressive tense verb “is vowing” isn’t consistent with the past tense verbs used to narrate the events surrounding President Roosevelt’s decision to conserve the nation’s wilderness areas. Choice C is incorrect because the future tense verb “will vow” isn’t consistent with the past tense verbs used to narrate the events surrounding President Roosevelt’s decision to conserve the nation’s wilderness areas. Choice D is incorrect because the simple present tense verb “vows” isn’t consistent with the past tense verbs used to narrate the events surrounding President Roosevelt’s decision to conserve the nation’s wilderness areas."},{"i":"cd4b1a7e","c":"fss","d":"E","s":"How did whales, once no bigger than seals, evolve to become the largest animals on Earth? Brazilian biologist Mariana Nery believes the answer might be found in whales’ DNA. In January 2023, Nery and her colleagues ______ a study showing changes over time in four whale genes associated with body size.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["published","publishing","having published","to publish"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, Nery and her colleagues), and this choice supplies the finite past tense verb \"published\" to indicate that these biologists shared their findings about changes in whale genes associated with body size. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"publishing\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having published\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to publish\" doesn’t supply the main clause with a finite verb."},{"i":"512f0ac9","c":"fss","d":"H","s":"Working from an earlier discovery of Charpentier’s, chemists Emmanuelle Charpentier and Jennifer Doudna—winners of the 2020 Nobel Prize in Chemistry—re-created and then reprogrammed the so-called “genetic scissors” of a species of DNA-cleaving bacteria ______ a tool that is revolutionizing the field of gene technology.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to forge","forging","forged","and forging"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of finite and nonfinite verb forms within a sentence. The nonfinite to-infinitive “to forge” is correctly used to form a nonfinite (infinitive) clause that explains why the chemists re-created and reprogrammed the DNA-cleaving bacteria. Choice B is incorrect. Without a comma separating the main clause (“chemists...bacteria”) from the participle “forging,” this choice illogically suggests that the bacteria are forging a tool, which doesn’t make sense. Choice C is incorrect. Without a coordinating conjunction such as “and” placed before it, the finite past tense verb “forged” can’t be used in this way to describe the chemists’ actions. Choice D is incorrect. If read as a finite verb, the present progressive verb “forging” isn’t consistent with the past tense verbs used in this sentence to describe the actions of the chemists. If read as a nonfinite verb, the participle “forging” can’t be used in this way because there is no following main clause for it to modify."},{"i":"85b8b9c5","c":"bound","d":"E","s":"Many mechanical calculators were powered by a notched cylinder mechanism called the Leibniz wheel. Leibniz wheel calculators were popular in the first half of the twentieth ______ these ingenious devices were eventually replaced by electronic calculators.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["century","century,","century, but","century that"],"a":2,"r":"Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and a coordinating conjunction (\"but\") to join the first main clause (\"Leibniz...century\") and the second main clause (\"these ingenious...calculators\"). Choice A is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice B is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice D is incorrect because joining the two main clauses in this way with the subordinating conjunction \"that\" results in an ungrammatical and illogical sentence."},{"i":"ace95f84","c":"bound","d":"M","s":"By analyzing the level of radioactive decay within a fossil specimen, scientists can establish the age of that fossil with a high degree of precision. When radioactive elements aren’t present, scientists turn to ______ analysis of Earth’s sediment layers (strata)—to estimate how old a fossil is based on the age of the strata in which the fossil is found.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["stratigraphy—the","stratigraphy (the","stratigraphy: the","stratigraphy, the"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. The dash after \"stratigraphy\" pairs with the dash after \"(strata)\" to separate the supplementary element \"the analysis of Earth’s sediment layers (strata)\" from the rest of the sentence. This supplementary element functions to define the term \"stratigraphy,\" and the pair of dashes indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice B is incorrect because a parenthesis can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice C is incorrect because a colon can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice D is incorrect because a comma can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence."},{"i":"964c6055","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Two opposing theories of vision divided scholars for many centuries. The ancient Greek mathematician Euclid (circa 300 BCE) supported the extramission theory. This theory held that the eyes emit a form of radiation that illuminates objects in its range. The ancient Greek philosopher Aristotle (384–322 BCE) supported the intromission theory. This theory held that objects emit a form of radiation that reaches the eyes. In the eleventh century, Arab mathematician Ibn al-Haytham (965–1040 CE) largely settled the debate with the first conclusive experiments supporting intromission. The student wants to provide a historical overview of the two theories.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Scholars were divided between the extramission and intromission theories of vision until Ibn al-Haytham’s eleventh-century experiments largely settled the debate in support of intromission.","Through two opposing theories of vision—extramission and intromission—Euclid, Aristotle, and Ibn al-Haytham held that a form of radiation is emitted either from objects or from the eyes.","While Ibn al-Haytham largely settled the debate in the eleventh century, Aristotle supported the theory of intromission centuries before.","Before the eleventh century, the ancient Greek philosopher Aristotle supported the intromission theory, which held that objects emit a form of radiation that reaches the eyes."],"a":0,"r":"Choice A is the best answer. The sentence provides a historical overview of the two theories, noting that scholars were divided between them before Ibn al-Haytham’s experiments supporting intromission largely settled the debate in the eleventh century. Choice B is incorrect. While the sentence identifies the two theories and the scholars that supported them, it doesn’t provide a historical overview of the theories. Choice C is incorrect. While the sentence indicates Aristotle supported intromission theory centuries before Ibn al-Haytham settled the debate, it doesn’t mention extramission theory or provide a historical overview of both theories. Choice D is incorrect. The sentence provides information about intromission theory but doesn’t mention extramission theory or provide a historical overview of both theories."},{"i":"fdd9a360","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: The popular wood-wide web theory posits that trees can communicate and exchange resources with one another via common mycorrhizal networks (CMNs) of fungi. Ecologist Dr. Suzanne Simard first suggested this theory in 1997. She described trees as “super-cooperators.” In the 2022 study “The Decay of the Wood-Wide Web?,” mycologist Dr. Justine Karst and colleagues evaluated dozens of CMN studies. They write that CMNs “have captured the interest of broad audiences. We are concerned, however, that recent claims about CMNs in forests are disconnected from evidence.” The student wants to use a quotation to emphasize a potential problem with the wood-wide web theory.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Describing trees as “super-cooperators,” Simard first suggested that trees can exchange resources with one another in 1997.","In “The Decay of the Wood-Wide Web?,” Karst and colleagues note that common mycorrhizal networks “have captured the interest of broad audiences.”","After evaluating dozens of CMN studies, Karst and colleagues expressed concern that recent claims about common mycorrhizal networks are “disconnected from evidence.”","Despite the concerns expressed in the 2022 study “The Decay of the Wood-Wide Web?,” the wood-wide web theory remains popular."],"a":2,"r":"Choice C is the best answer. This choice uses a quotation to convey the authors’ criticism and challenge to the wood-wide web theory due to an absence of evidence. Choice A is incorrect. This choice doesn’t emphasize a potential problem with the wood-wide web theory. It uses a quotation to introduce the theory and its originator. It doesn’t mention any criticism or challenge to the theory. Choice B is incorrect. This choice uses a quotation, but it doesn’t emphasize a potential problem with the wood-wide web theory. It uses a quotation to describe the appeal and interest of the theory, but it doesn’t indicate why the authors are concerned or what evidence they have. Choice D is incorrect. This choice doesn’t use a quotation at all. It paraphrases the main idea of the 2022 study, but it doesn’t include any specific words or phrases from the notes. It also doesn’t emphasize a potential problem with the theory, but rather its popularity."},{"i":"e268c452","c":"trans","d":"E","s":"The traditional process of Turkish paper marbling (ebru) generally proceeds like this: First, the artisan fills a shallow tray with a water bath solution. Next, the artisan adds inks or paints to the solution, which can then be manipulated into intricate designs. ______ the artisan slips paper in and out of the liquid, transferring the design onto the paper.\n\nWhich choice completes the text with the most logical transition?","o":["Actually,","Therefore,","Nevertheless,","Finally,"],"a":3,"r":"Choice D is the best answer. “Finally” logically signals that the information in this sentence—that the artisan slips paper in and out of the liquid to transfer the design onto paper—is the final step in the process of Turkish paper marbling, which began with what happens “first” (filling a tray with a solution) and continued with what happens “next” (adding inks or paints to the solution). Choice A is incorrect because “actually” illogically signals that the information in this sentence about slipping paper in and out of liquid to transfer a design onto paper is unexpected in light of the previously described steps. Instead, the sentence describes the final step in the process of Turkish paper marbling. Choice B is incorrect because “therefore” illogically signals that the information in this sentence about slipping paper in and out of liquid to transfer a design onto paper is a consequence of the previously described steps. Instead, the sentence describes the final step in the process of Turkish paper marbling. Choice C is incorrect because “nevertheless” illogically signals that the information in this sentence about slipping paper in and out of liquid to transfer a design onto paper contrasts with the previously described steps. Instead, the sentence describes the final step in the process of Turkish paper marbling."},{"i":"ad729337","c":"trans","d":"H","s":"With its clichéd imagery of suburban lawns and power lines, John Ashbery’s 2004 poem “Ignorance of the Law Is No Excuse” may seem barren terrain for critical analysis. ______ cultural critic Lauren Berlant finds fertile ground in just its first two stanzas, devoting most of a book chapter to deciphering the “weight of the default space” Ashbery creates in this poem.\n\nWhich choice completes the text with the most logical transition?","o":["Likewise,","Nonetheless,","In turn,","That is,"],"a":1,"r":"Choice B is the best answer. “Nonetheless” is a transition that indicates disagreement. The first sentence describes the unlikelihood of finding much for critical analysis in Ashbery’s poem (“barren terrain”), while the second sentence describes how Berlant did in fact find much to analyze in Ashbery’s poem (“fertile ground”), so the transition “nonetheless” fits perfectly. Choice A is incorrect. This choice uses a transition that indicates the addition of a new but similar idea, which doesn’t make sense here. The idea in this sentence directly contradicts the idea in the previous sentence. Choice C is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense in this context—a poem seemingly having little opportunity for critical analysis would not cause someone to write an extensive critical analysis (in fact, we might expect the opposite). Choice D is incorrect. This choice uses a transition that indicates a restatement of the same idea in other words. But the text isn’t restating the first idea here. Instead, it’s offering a contradiction to the idea expressed in the first sentence."},{"i":"6081831f","c":"trans","d":"E","s":"When Chinese director Chloé Zhao accepted the Oscar in 2021 for her film Nomadland, she made Academy Award history. ______ only one other woman, Kathryn Bigelow of the United States, had been named best director at the Oscars, making Zhao the second woman and the first Asian woman to win the award.\n\nWhich choice completes the text with the most logical transition?","o":["As a result,","Previously,","However,","Likewise,"],"a":1,"r":"Choice B is the best answer. “Previously” logically signals that the event described in this sentence—Bigelow being named best director— occurred before Zhao’s win. The fact that only one other woman had won the award before puts Zhao’s win in perspective. Choice A is incorrect because “as a result” illogically signals that the event described in this sentence occurred as a result or consequence of Zhao’s win. Instead, it occurred before Zhao was named best director and puts Zhao’s win in perspective. Choice C is incorrect because “however” illogically signals that the event described in this sentence occurred in spite of or in contrast to Zhao’s win. Instead, it occurred before Zhao was named best director and puts Zhao’s win in perspective. Choice D is incorrect because “likewise” illogically signals that this sentence merely adds a second, similar piece of information to the information about Zhao’s win. Instead, the fact that only one other woman had won the award before puts Zhao’s win in perspective."}],"img":{"8a668840":"iVBORw0KGgoAAAANSUhEUgAAArwAAAIEBAMAAAAJDeBoAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABBaElEQVR42u1dd0AUxxf+ZveODjcH2NsClphYFrAkavQANWo0OWOLJhrsGkvQNFsSNL+oiQ1rrPGMvQYTNRZU7F3B3jmMvXBzdik3vz8AaXcqCgi43x/KzezM7nz79s17b97OAgoUKFCgQIECBQoUKFCgQIECBQoUKMjnoKn/UPKsI16gTAEAaAFIT38RlQ5QJ/+WQGgKcSSNQCKMlkH80zMaBMA37ed7A2yQT7zspDftXjTXQdydyoKK2m0DSusBAJMhDLfCkssiGX2W/ZmuYikBFpDUA4S9LUEBkNQm9obUqvkuOhDfN0p6v5oIhyepIuok2RkAp2R6d0K1I6uGIC6AcMI/IF3R7+keAApVVKYWZXam/iW56CAMyKOBCfmCXic/eG1Bsw2SXbsz6L5MqnBWL9wPQXcQDm7iY3fjLdjr2rboPHYPQOasIz//C+J8aGtxqg6u3XERKh/Q3/thElqpm531JbMnM9Qu1bDtv2LERPrNnIFjwwDUXwj7ZntpreYTWwGk8tDQYge  return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
function sum(){const d=Object.keys(ans).length,ok=Q.filter(q=>ans[q.i]===q.a).length;$("#sum").textContent=done?`Score: ${ok} of ${Q.length} correct (${Math.round(100*ok/Q.length)}%)`:`${d} of ${Q.length} answered`}
function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="re"){if(!done&&Object.keys(ans).length&&!confirm("Clear all your answers and start over?"))return;ans={};done=false;miss=false;draw();scrollTo(0,0)}
 else if(t.id==="sub")submit();
 else if(t.id==="mi"){miss=!miss;draw()}
 else if(t.dataset.k!==undefined&&!done){const a=t.closest("article"),q=Q[a.dataset.n-1];ans[q.i]=+t.dataset.k;a.outerHTML=card(q,+a.dataset.n);sum()}});
draw();
</script></body></html>
