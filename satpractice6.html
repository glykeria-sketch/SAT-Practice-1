<script>
const D={"t":"SATPractice6","q":[{"i":"05575bca","c":"vocab","d":"E","s":"The following text is adapted from Lewis Carroll’s 1871 novel Through the Looking-Glass, and What Alice Found There. Alice, a child, is talking to her cat. “Do you hear the snow against the window-panes, Kitty? How nice and soft it sounds! Just as if someone was kissing the window all over outside.”\n\nAs used in the text, what does the word “soft” most nearly mean?","o":["Gentle","Sensitive","Shapeless","Bland"],"a":0,"r":"Choice A is the best answer because as used in the text, \"soft\" most nearly means gentle. The text portrays Alice speaking about the snow falling against the window, describing it as sounding \"nice\" and similar to someone \"kissing the window.\" These details most strongly suggest that Alice thinks the sound made by the snow falling against the window is gentle. Choice B is incorrect. Although in some contexts, \"gentle\" can mean sensitive, or caring about others’ feelings, that isn’t the meaning in this context; it doesn’t make sense to say that Alice thinks the sound of the snow cares about anything. Choice C is incorrect because the text doesn’t suggest that Alice thinks the sound of the snow is shapeless, or lacks a definite shape; she isn’t indicating how anything looks or feels but, rather, is describing how \"nice\" and gentle the snow sounds. Choice D is incorrect because the text doesn’t suggest that Alice thinks the sound of the snow is bland, or uninteresting; rather, she notices the sound and comments on how \"nice\" it is."},{"i":"a49500cc","c":"vocab","d":"E","s":"Predatory animals differ widely in how they ______ food for their young. Some leave dead prey nearby for their young to consume, some bring live prey to their young, and some feed their young directly from their own mouths.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["avoid","guess","provide","describe"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of how predators feed their young. As used in this context, \"provide\" means supply or make something that’s needed available. The text indicates that some predators supply prey for their young by either leaving dead prey nearby or by bringing live prey to them. Other predators, the text states, feed their young directly from their own mouths. This context supports the idea that predatory animals have various ways to provide food for their young. Choice A is incorrect because in this context, \"avoid\" would mean keep away from or refrain from, neither of which would make sense in context. Nothing in the text suggests that predators refrain from food for their young. Choice B is incorrect because in this context, \"guess\" would mean speculate or suppose, and it’s unclear what it would mean for predators to speculate food for their young. Choice D is incorrect because in this context, \"describe\" would mean explain, and it’s unclear what it would mean for predators to explain food for their young."},{"i":"10c236ce","c":"vocab","d":"H","s":"Text corpora such as the Bank of English are enormous collections of electronically stored texts that can be used for empirical testing of hypotheses regarding the frequency of typical word usage. If one has a ______ that the word “get” has a high incidence in English, for example, an analysis of a corpus can support that hypothesis by showing that “get” is the fifth most commonly used verb.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["recognition","scheme","supposition","synopsis"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of testing hypotheses regarding usage by means of text corpora. In this context, \"supposition\" refers to an assumption or hypothesis that is not yet proven. The text explains that text corpora can be used for \"empirical testing of hypotheses regarding the frequency of typical word usage\" and then provides a specific example of using corpus analysis to support a claim about the word \"get.\" The word \"supposition\" precisely conveys this idea of an assumption or hypothesis about word frequency that can then be tested against empirical data. Choice A is incorrect because it wouldn’t make sense to say that someone has a \"recognition\" that the word \"get\" has a high incidence in English. Recognition implies acknowledging something already established as true or valid, but the text indicates that corpus analysis is needed to support the claim about \"get,\" suggesting its high frequency wasn’t already established or previously known. Choice B is incorrect because it wouldn’t make sense to say that someone has a \"scheme\" that the word \"get\" has a high incidence in English. A scheme is a plan or systematic arrangement, but the context indicates what’s needed is a preliminary hypothesis that can be tested with corpus data, not a plan related to word frequency. Choice D is incorrect because it wouldn’t make sense to say that someone has a \"synopsis\" that the word \"get\" has a high incidence in English. A synopsis is a summary or outline, but the text is discussing an initial hypothesis about word frequency that requires testing, not a condensed statement of existing information."},{"i":"bcc91b1e","c":"vocab","d":"E","s":"The spacecraft OSIRIS-REx briefly made contact with the asteroid 101955 Bennu in 2020. NASA scientist Daniella DellaGiustina reports that despite facing the unexpected obstacle of a surface mostly covered in boulders, OSIRIS-REx successfully ______ a sample of the surface, gathering pieces of it to bring back to Earth.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["attached","collected","followed","replaced"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the OSIRIS-REx spacecraft’s contact with the asteroid 101955 Bennu. In this context, “collected” means acquired and took away. The text indicates that although the boulders on the asteroid’s surface caused some unforeseen problems, OSIRIS-REx was able to gather a sample to return to Earth. This context suggests that OSIRIS-REx successfully collected a sample of 101955 Bennu. Choice A is incorrect because in this context “attached” means connected or affixed. The text indicates that OSIRIS-REx gathered pieces of 101955 Bennu to bring to Earth; it doesn’t suggest that the spacecraft attached anything to the asteroid. Choice C is incorrect because in this context “followed” means tracked or traveled behind and the text discusses OSIRIS-REx’s brief encounter with 101955 Bennu during which the spacecraft gathered a sample to bring to Earth. The text doesn’t suggest that the spacecraft tracked the sample, and it’s not clear what it would mean for the spacecraft to travel behind the sample it collected. Choice D is incorrect because in this context “replaced” means put back or returned. The text indicates that OSIRIS-REx gathered pieces of 101955 Bennu to bring to Earth but doesn’t suggest that anything was returned to the asteroid."},{"i":"ea971260","c":"purpose","d":"E","s":"The following text is adapted from Louisa May Alcott’s 1869 novel An Old-Fashioned Girl. Polly, a teenager, is visiting her friend Fanny. Fanny’s friends did not interest Polly much; she was rather afraid of them [because] they seemed so much older and wiser than herself, even those younger in years. They talked about things of which she knew nothing and when Fanny tried to explain, she didn’t find them interesting; indeed, some of them rather shocked and puzzled her.\n\nWhich choice best states the main purpose of the text?","o":["To portray Polly’s reaction to Fanny’s friends","To identify the topics Polly talks about with Fanny’s friends","To explain how Fanny met some of her friends","To illustrate how Fanny’s friends feel about Polly"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text, which is to show how Polly reacted to some of Fanny’s other friends. The text describes Polly as being frightened of Fanny’s friends because they seemed “much older and wiser” to her and elaborates that they “talked about things of which” Polly was unfamiliar, uninterested, and shocked. Thus, the main purpose of the text is to describe Polly’s impressions of Fanny’s other friends. Choice B is incorrect because the text does not provide any of the topics Polly discussed with Fanny’s friends, stating only that Polly found the topics unfamiliar, uninteresting, and shocking. Choice C is incorrect because the text says nothing about how Fanny and her other friends first met. Choice D is incorrect because the focus of the text is on Polly’s feelings about Fanny’s other friends, not on the other friends’ feelings about Polly."},{"i":"0a04cac5","c":"purpose","d":"H","s":"The following text is adapted from Jane Austen’s 1814 novel Mansfield Park. The speaker, Tom, is considering staging a play at home with a group of his friends and family. We mean nothing but a little amusement among ourselves, just to vary the scene, and exercise our powers in something new. We want no audience, no publicity. We may be trusted, I think, in choosing some play most perfectly unexceptionable; and I can conceive no greater harm or danger to any of us in conversing in the elegant written language of some respectable author than in chattering in words of our own.\n\nWhich choice best states the main purpose of the text?","o":["To offer Tom’s assurance that the play will be inoffensive and involve only a small number of people","To clarify that the play will not be performed in the manner Tom had originally intended","To elaborate on the idea that the people around Tom lack the skills to successfully stage a play","To assert that Tom believes the group performing the play will be able to successfully promote it"],"a":0,"r":"Choice A is the best answer because it most accurately portrays the main purpose of the text. At the beginning of the text, Tom asserts that he and the other people staging the play are doing so only for “a little amusement among ourselves” and aren’t interested in attracting an audience or any attention with the production. Then, Tom promises that the play they chose is modest and appropriate, and he further reasons that using the well-written prose of “some respectable author” is better than using their own words. Overall, the main purpose of the text is to convey Tom’s promise that the play will be inoffensive and involve only a few people. Choice B is incorrect because the text doesn’t indicate that Tom had earlier intentions for the play’s performance or that anything has changed since the group first decided to stage a play. Instead, the text focuses on how harmless the entire endeavor will be. Choice C is incorrect. Although Tom mentions that using the words of a “respectable author” will be better than using their own words, he never addresses the idea that the people around him generally aren’t skilled enough to stage a play. Choice D is incorrect because in the text Tom specifically says that they “want no audience, no publicity,” which indicates that they don’t plan on promoting the play at all."},{"i":"2aaee77f","c":"func","d":"E","s":"Some bird species don’t raise their own chicks. Instead, adult females lay their eggs in other nests, next to another bird species’ own eggs. <u>Female cuckoos have been seen quickly laying eggs in the nests of other bird species when those birds are out looking for food.<\/u> After the eggs hatch, the noncuckoo parents will typically raise the cuckoo chicks as if they were their own offspring, even if the cuckoos look very different from the other chicks.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It introduces a physical feature of female cuckoos that is described later in the text.","It describes the appearance of the cuckoo nests mentioned earlier in the text.","It offers a detail about how female cuckoos carry out the behavior discussed in the text.","It explains how other birds react to the female cuckoo behavior discussed in the text."],"a":2,"r":"Choice C is the best answer because it best describes how the underlined sentence functions in the text as a whole. The first two sentences establish that birds of some species don’t raise their own young; instead, they lay their eggs in the nests of birds of other species. The underlined sentence then states that female cuckoo birds engage in this behavior, having been observed specifically laying their eggs in other nests while the other birds are out finding food. According to the text, the cuckoo chicks are then raised by the other birds. Thus, the underlined sentence provides a particular detail about how female cuckoos carry out the behavior of laying eggs for other birds to raise. Choice A is incorrect. Rather than mentioning a physical feature of female cuckoos, the underlined sentence introduces a specific behavior of female cuckoos: laying eggs in the nests of birds of other species when the other birds are away. The only reference to physical features is the last sentence’s general mention of cuckoo chicks looking different from chicks of other species. Choice B is incorrect because the underlined sentence refers to the nests of birds other than cuckoos and doesn’t describe how any nests look, cuckoo or otherwise. Instead, the sentence addresses how female cuckoos use other birds’ nests. Choice D is incorrect because the underlined sentence describes only female cuckoo behavior (laying eggs in the nests of birds of other species when the other birds are away); it’s the last sentence of the text that addresses the other birds’ reaction, indicating that those birds usually raise the cuckoo chicks once they’ve hatched."},{"i":"5336f2e4","c":"func","d":"H","s":"The following text is adapted from Zora Neale Hurston’s 1921 short story “John Redding Goes to Sea.” John is a child who lives in a town in the woods. Perhaps ten-year-old John was puzzling to the folk there in the Florida woods for he was an imaginative child and fond of day-dreams. The St. John River flowed a scarce three hundred feet from his back door. On its banks at this point grow numerous palms, luxuriant magnolias and bay trees. On the bosom of the stream float millions of delicately colored hyacinths. <u>[John Redding] loved to wander down to the water’s edge, and, casting in dry twigs, watch them sail away down stream to Jacksonville, the sea, the wide world and [he] wanted to follow them.<\/u> Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It provides an extended description of a location that John likes to visit.","It reveals that some residents of John’s town are confused by his behavior.","It illustrates the uniqueness of John’s imagination compared to the imaginations of other children.","It suggests that John longs to experience a larger life outside the Florida woods."],"a":3,"r":"Choice D is the best answer because it accurately describes how the underlined sentence functions in the text as a whole. The text establishes that John has a strong imagination and then goes on to describe the St. John River near John’s home in the Florida woods. The underlined sentence depicts John sending twigs sailing down the river while he imagines them reaching “Jacksonville, the sea, the wide world,” where he wishes he could follow. This suggests that John longs to expand his life experiences beyond the Florida woods. Choice A is incorrect because the second and third sentences of the text provide an extended description of the riverbank where John likes to go, whereas the underlined sentence describes what John does at that location. Choice B is incorrect because the first sentence of the text suggests that John’s behavior “was puzzling” to others around him, whereas the underlined sentence concerns the content of John’s imaginings. Choice C is incorrect because the underlined sentence elaborates on John’s imagination but doesn’t mention any other children to whom John could be compared."},{"i":"4ed09415","c":"structure","d":"H","s":"Vadamalai Elangovan and Ganapathi Marimuthu showed that high moonlight intensity inhibits the activity of the greater short-nosed fruit bat (Cynopterus sphinx), a result explicable in terms of benefits and costs: greater lunar intensity may not enable the bats to increase foraging success enough to offset the higher chance of detection by predatory owls or hawks. Most other nocturnal mammals respond to lunar intensity variations similarly to greater short-nosed fruit bats, but mongoose lemurs (Eulemur mongoz) display the opposite pattern, as their heavy reliance on visual foraging results in a different balance of reward and risk.\n\nWhich choice best describes the overall structure of the text?","o":["It discusses two different responses to the same natural phenomenon, explains why one of those responses occurs, and then suggests that the other response still needs to be explained.","It describes and accounts for a finding, characterizes the finding as representative of a general pattern, and then describes and accounts for an exception to that pattern.","It presents and explains a study result, indicates that the result is similar to the results of many other studies, and then attributes a conflicting study result to a difference in that study’s methods.","It introduces an observation of a behavioral pattern, presents an explanation for the pattern, and then describes an exception to the pattern that casts doubt on that explanation."],"a":1,"r":"Choice B is the best answer because it most accurately describes the overall structure of the text. The text begins by describing a study’s finding about greater short-nosed fruit bats—namely, that high moonlight intensity inhibits the bats’ activity—and also accounts for that finding, stating that this occurs because the potential increase in foraging success that greater lunar intensity enables doesn’t offset these bats’ increased vulnerability to predators (whose vision is also implied to become more acute under intense moonlight). The text goes on to characterize this finding as representative of a general pattern, stating that many nocturnal mammals behave similarly in response to changes in lunar intensity. The text concludes by describing an exception to this pattern, explaining that mongoose lemurs display an opposite tendency because they rely heavily on visual foraging. This strategy presumably would allow them to derive more benefit from greater lunar intensity than many other nocturnal mammals would, resulting in a \"different balance of reward and risk\" than exists for other nocturnal mammals. Therefore, the overall structure of the text is best described as a description and account of a finding, a characterization of that finding as representative of a pattern, and then a description and account of an exception to that pattern. Choice A is incorrect. Although the text discusses two different responses to variations in moonlight intensity, explaining that as moonlight intensity increases, greater short-nosed fruit bats and many other nocturnal mammals decrease their foraging activity but mongoose lemurs increase their foraging activity, it doesn’t leave one of these responses unexplained. The text accounts for both the typical response to increased lunar intensity (reduced activity due to predation risk) and the exception (increased activity due to a reliance on visual foraging) by making reference to a cost-benefit framework. Choice C is incorrect. Although the text presents a study′s finding about the effect of increased lunar intensity on greater short-nosed fruit bats’ activity before going on to contrast this behavior with the fact that mongoose lemurs display the opposite response to increased lunar intensity, the text doesn’t explicitly invoke other studies and doesn’t attribute this difference in observed behavior to the fact that the study of greater short-nosed fruit bats used different methods than studies of mongoose lemurs did. Rather, the text explains that the different observed behaviors can be attributed to differences in species’ foraging strategies. Choice D is incorrect. Although the text characterizes the behavior of mongoose lemurs in response to increased lunar intensity as an exception to a pattern of behavior observed in other nocturnal mammal species, this exception doesn’t cast any doubt on the explanation that is offered for the general pattern observed among other species. Instead, the text uses the same cost-benefit framework to explain why increased lunar intensity is associated with decreased activity by greater short-nosed fruit bats and other nocturnal mammals but with increased activity by mongoose lemurs."},{"i":"835d1ae6","c":"cross","d":"E","s":"Text 1 Historians studying pre-Inca Peru have looked to ceramic vessels to understand daily life among the Moche people. These mold-made sculptures present plants, animals, and human faces in precise ways—vessels representing human faces are so detailed that <u>scholars have interpreted facial markings to represent scars and other skin irregularities<\/u>. Some historians have even used these objects to identify potential skin diseases that may have afflicted people at the time.\n\nText 2 Art historian and archaeologist Lisa Trever has argued that the interpretation of Moche “portrait” vessels as hyper-realistic portrayals of identifiable people may inadvertently disregard the creativity of the objects’ creators. Moche ceramic vessels, Trever argues, are artworks in which sculptors could free their imagination, using realistic objects and people around them as inspiration to explore more abstract concepts.\n\nBased on the texts, what would Lisa Trever (Text 2) most likely say about the interpretation presented in the underlined portion of\n\nText 1?","o":["Depictions of human faces are significantly more realistic than depictions of plants and other animals are.","It is likely that some depictions of human faces with extensive markings are intended to portray the same historical individual.","Some vessels may have been damaged during their excavation and thus provide little insight into Moche culture.","Markings on depictions of human faces are not necessarily intended to portray particular details about the physical appearance of individuals."],"a":3,"r":"Choice D is the best answer. Trever thinks that the “hyper-realistic portrayal of identifiable people” interpretation ignores the sculptors’ imagination and creativity. We can infer that Trevor thinks the facial markings on the sculptures may not have represented real skin blemishes on real people. Choice A is incorrect. The text gives us no reason to think that Trever would respond to the underlined interpretation in this way. Neither text compares the depictions of human faces to the depictions of plants or animals, so we have no basis to draw this conclusion. Choice B is incorrect. The text gives us no reason to think that Trever would respond to the underlined interpretation in this way. There’s nothing in either text about multiple depictions representing the same person, so we have no basis to draw this conclusion. Choice C is incorrect. The text gives us no reason to think that Trever would respond to the underlined interpretation in this way. Neither text mentions the state of the vessels (damaged or intact), so we have no basis to draw this conclusion."},{"i":"36e2868f","c":"main","d":"H","s":"The following text is from Thomas Mann’s 1924 novel The Magic Mountain, translated by John E. Woods in 1995. The story of Hans Castorp that we intend to tell here—not for his sake (for the reader will come to know him as a perfectly ordinary, if engaging young man), but for the sake of the story itself, which seems to us to be very much worth telling (although in Hans Castorp’s favor it should be noted that it is his story, and that not every story happens to everybody)—is a story that took place long ago, and is, so to speak, covered with the patina of history and must necessarily be told with verbs whose tense is that of the deepest past. ©1995 by Alfred A. Knopf, Inc. What does the text most strongly suggest about the story of Hans Castorp?","o":["Though it is true that stories of even the most uninteresting people are themselves interesting because all people are unique, the reason this story is interesting is nonetheless difficult to understand because of the passage of time.","Even though it is a story of a person of no particular importance, its age and the manner in which it therefore must be told are both indicators that the story itself is important.","Like all stories about the lives of inconsequential people, this story must necessarily be related in a particular way if the reason the story is consequential is to be made evident to the audience.","It is a remarkable story that happened to an unremarkable person, though one could plausibly argue that because the story is valuable, some of its value accrues to the person at its center."],"a":3,"r":"Choice D is the best answer because it presents a statement about Hans Castorp’s story that is suggested by the text. The narrator of the text indicates that the story about Hans Castorp will be told not because there is something particularly notable about him, since he is pleasant but \"perfectly ordinary,\" but because the story itself is remarkable (\"very much worth telling\"). The narrator then notes that there is a benefit in being at the heart of the story—that it is \"in Hans Castorp’s favor\" that the story is his, and maybe uniquely so (\"not every story happens to everybody\"). Thus, the text suggests both that the story that will be told is a remarkable one that happened to an unremarkable person and that it is reasonable to argue that the person at the center of a valuable story takes on some of the story’s value. Choice A is incorrect. Although the narrator of the text makes the point that \"not every story happens to everybody,\" the narrator doesn’t state that stories are interesting simply because the people they are about are unique. Rather, the narrator suggests that one particular story is \"very much worth telling\" on its own and that Hans Castorp benefits from the fact that the story is remarkable and may be unique to him. Further, the narrator never suggests that the story will be hard to understand even though it is old. Choice B is incorrect. Although the narrator of the text suggests that Hans Castorp is of no particular importance, since he is a \"perfectly ordinary\" person, the narrator never reveals what makes the story of Castorp important, just that \"the story itself\" is \"very much worth telling.\" The narrator states that the story \"took place long ago,\" is \"covered with the patina of history,\" and can be told only \"with verbs whose tense is that of the deepest past,\" but the story’s age and the way it must be told aren’t presented as reasons the story is important; the narrator is simply providing details about how the story will be told. Choice C is incorrect because the narrator of the text doesn’t suggest that all stories about people who are \"perfectly ordinary\" (like Hans Castorp) must be told in particular ways to make it clear why those stories are consequential. Further, the narrator suggests that Hans Castorp’s story must be told \"with verbs whose tense is that of the deepest past\" because it took place so long ago, not because telling it that way will convey the story’s importance."},{"i":"1c69ff20","c":"main","d":"H","s":"For many years, the only existing fossil evidence of mixopterid eurypterids—an extinct family of large aquatic arthropods known as sea scorpions and related to modern arachnids and horseshoe crabs—came from four species living on the paleocontinent of Laurussia. In a discovery that expands our understanding of the geographical distribution of mixopterids, paleontologist Bo Wang and others have identified fossilized remains of a new mixopterid species, Terropterus xiushanensis, that lived over 400 million years ago on the paleocontinent of Gondwana.\n\nAccording to the text, why was Wang and his team’s discovery of the Terropterus xiushanensis fossil significant?","o":["The fossil constitutes the first evidence found by scientists that mixopterids lived more than 400 million years ago.","The fossil helps establish that mixopterids are more closely related to modern arachnids and horseshoe crabs than previously thought.","The fossil helps establish a more accurate timeline of the evolution of mixopterids on the paleocontinents of Laurussia and Gondwana.","The fossil constitutes the first evidence found by scientists that mixopterids existed outside the paleocontinent of Laurussia."],"a":3,"r":"Choice D is the best answer because it states why Wang and his team’s discovery of the Terropterus xiushanensis fossil was significant. The text explains that up until Wang and his team’s discovery, the only fossil evidence of mixopterids came from the paleocontinent of Laurussia. Wang and his team, however, identified fossil remains of a mixopterid species from the paleocontinent Gondwana. Therefore, the team’s discovery was significant because the fossil remains of a mixopterid species were outside of the paleocontinent Laurussia. Choice A is incorrect. Although the text states that Wang and his team identified fossilized remains of a mixopterid species that lived more than 400 million years ago, it doesn’t indicate that mixopterid fossils previously found by scientists dated to a more recent period than that. Choice B is incorrect. Although the text states that mixopterids are related to modern arachnids and horseshoe crabs, it doesn’t suggest that the fossil discovered by Wang and his team confirmed that this relationship is closer than scientists had previously thought. Choice C is incorrect because the team’s fossil established the presence of mixopterids on Gondwana, not on Laurussia. Moreover, the text only discusses the fossil in relation to the geographical distribution of mixopterids, not in relation to their evolution."},{"i":"b4da6aaf","c":"infer","d":"E","s":"The musical Hadestown was produced off-Broadway in New York in 2016. A revised version of the musical premiered on Broadway in 2019, in a larger production. In a review of the Broadway production, theater critic Jesse Green enthusiastically praised the musical’s storytelling. However, Green also explained that he had seen the earlier version of Hadestown in 2016 and had found the storytelling to be very confusing. This suggests that in Green’s view, ______ Which choice most logically completes the text?","o":["the 2016 version of Hadestown had fewer storytelling problems than the 2019 version did.","Hadestown should have had a larger production in 2019 than it actually did.","the 2019 version of Hadestown was less enjoyable than the 2016 version.","Hadestown improved greatly between 2016 and its premiere on Broadway."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of critic Jesse Green’s review of the 2016 and 2019 productions of Hadestown. The text states that Green found the storytelling in the 2016 off-Broadway version to be \"very confusing\" but that he \"enthusiastically praised\" the storytelling in the revised 2019 Broadway version. This stark contrast in Green’s opinions suggests that he believed the musical had significantly improved between 2016 and its 2019 Broadway premiere. Choice A is incorrect because it contradicts the information in the text. The text indicates that Green found the storytelling in the 2016 version to be \"very confusing,\" while he \"enthusiastically praised\" the storytelling in the 2019 version. This suggests that the 2019 version had fewer, not more, storytelling problems. Choice B is incorrect because the text doesn’t provide any information about Green’s opinion on the size of the 2019 Broadway production. While it mentions that the 2019 production was larger than the 2016 production, there’s no indication in the text that Green thought the 2019 production should have been even larger than it was. Choice C is incorrect because it contradicts the information in the text. The text’s description of Green’s enthusiastic praise for the 2019 production suggests that he found this version more enjoyable, not less enjoyable, than the 2016 version, which he described as \"very confusing.\""},{"i":"55688b3c","c":"infer","d":"M","s":"Dutch painters in the sixteenth and seventeenth centuries often showed tables filled with large wheels of cheese or carved shards of butter. Some art historians, noting that dairy products were a major component of the Dutch diet, interpret these depictions as reflections of everyday Dutch eating habits. However, a group of researchers recently reviewed hundreds of food-related paintings and found that lemons—which could only be acquired in the Netherlands at great cost, since they had to be imported from warmer climates—feature in Dutch paintings of the period more than three times as frequently as dairy products do, thereby casting doubt on the idea that ______ Which choice most logically completes the text?","o":["dairy products were a more significant component of the Dutch diet of the period than lemons were.","food was a more popular subject among Dutch painters than it was among painters from other countries at the time.","depictions of food in Dutch paintings of the period should be taken as realistic representations of Dutch eating habits.","Dutch painters of the period may have depicted foods for symbolic reasons rather than to show what Dutch people typically ate."],"a":2,"r":"Choice C is the best answer. The text tells us that lemons—an expensive imported product—feature in Dutch paintings of the period more frequently than dairy products do. Since it’s unlikely lemons were eaten more often than dairy, this fact casts doubt on the theory that these paintings realistically depicted Dutch diets. Choice A is incorrect. In fact, the text suggests the opposite: it says that dairy products were a \"major component of the Dutch diet,\" while lemons were an expensive import item, so we can infer that lemons were eaten much more rarely than dairy products. Choice B is incorrect. The passage doesn’t mention painters from other countries, so there’s no basis to make this inference. Choice D is incorrect. In fact, the text suggests that Dutch painters do have reasons for depicting foods other than to show what Dutch people typically ate. For example, lemons in a painting could indicate wealth or prosperity."},{"i":"38d75269","c":"claim","d":"E","s":"Janet Echelman is a sculptor and fiber artist. She has installed giant sculptures all over the world. Echelman uses bright and flowing materials, which mimic the wind. <u>However, while her sculptures appear as delicate as a breeze, they are actually very durable.<\/u> Which quotation from an article about Echelman’s sculptures, if true, would most effectively illustrate the underlined claim?","o":["“Echelman uses a special program that makes a 3D model of the sculpture.”","“The first part of planning a new sculpture is done using paper and pencil, and then a digital program is used to finalize the design.”","“The materials that Echelman uses to build her sculptures are both flexible and strong.”","“Each sculpture is designed to reflect local landmarks from the area in which it is eventually installed.”"],"a":2,"r":"Choice C is the best answer because it presents the quotation that most effectively illustrates the claim that Echelman’s sculptures appear delicate but are in fact quite durable. The text explains that Echelman’s sculptures include flowing shapes that mimic the wind. If it is true that the materials she uses are both flexible and strong, that would help explain why the works are durable even though they appear delicate. Choice A is incorrect because the claim in the text is not about how Echelman models her work before sculpting. Choice B is incorrect because the claim in the text is not about the planning and design phases of Echelman’s work. Choice D is incorrect because the claim in the text is not about how the sculptures relate to their locations."},{"i":"b28dc26d","c":"claim","d":"H","s":"The linguistic niche hypothesis (LNH) posits that the exotericity of languages (how prevalent non-native speakers are) and grammatical complexity are inversely related, which the LNH ascribes to attrition of complex grammatical rules as more non-native speakers adopt the language but fail to acquire those rules. Focusing on two characteristics that are positive indices of grammatical complexity, fusion (when new phonemes arise from the merger of previously distinct ones) and informativity (languages’ capacity for meaningful variation), Olena Shcherbakova and colleagues conducted a quantitative analysis for more than 1,300 languages and claim the outcome is inconsistent with the LNH.\n\nWhich finding, if true, would most directly support Shcherbakova and colleagues’ claim?","o":["Shcherbakova and colleagues’ analysis showed a slightly negative correlation between grammatical complexity and fusion and between grammatical complexity and informativity.","Shcherbakova and colleagues’ analysis showed a slightly negative correlation between grammatical complexity and exotericity.","Shcherbakova and colleagues’ analysis showed a slightly positive correlation between grammatical complexity and fusion.","Shcherbakova and colleagues’ analysis showed a slightly positive correlation between fusion and exotericity and between informativity and exotericity."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would support Shcherbakova and colleagues’ claim that the outcome of their study is inconsistent with the linguistic niche hypothesis (LNH). The text explains that the LNH holds that there is an inverse relationship between the prevalence of non-native speakers of a language (exotericity) and the grammatical complexity of that language—that is, that as the number of non-native speakers increases, grammatical complexity decreases, and vice versa. According to the text, Shcherbakova and colleagues focused on two positive indications of grammatical complexity—fusion and informativity—and analyzed their occurrence in over 1,300 languages. If the researchers found a slightly positive correlation between fusion and exotericity and between informativity and exotericity —meaning that to some extent, grammatical complexity increases as the number of non-native speakers of a language increases—their outcome would not be consistent with the assumption that exotericity and grammatical complexity are inversely related (the LNH). Choice A is incorrect because it wouldn’t be possible to say that a finding of a slightly negative correlation between grammatical complexity and both fusion and informativity is inconsistent or consistent with the LNH, since the finding would address only grammatical complexity (given that fusion and informativity are aspects of grammatical complexity) and wouldn’t move beyond that factor to address its relationship to the prevalence of non-native speakers of a language (exotericity), which is the relationship the LNH focuses on. Choice B is incorrect because a finding of a slightly negative correlation between grammatical complexity and the prevalence of non-native speakers of a language (exotericity)— meaning that as the number of non-native speakers increases, grammatical complexity somewhat decreases, and vice versa—would be consistent, not inconsistent, with the LNH, since the text indicates that according to the LNH, there is an inverse relationship between grammatical complexity and exotericity; a negative correlation reflects an inverse relationship. Choice C is incorrect because it wouldn’t be possible to say that a finding of a slightly positive correlation between grammatical complexity and fusion is inconsistent or consistent with the LNH, since the finding would address only grammatical complexity (given that fusion is a positive indication of grammatical complexity) and wouldn’t move beyond that factor to address its relationship to the prevalence of non-native speakers of a language (exotericity), which is the relationship the LNH focuses on."},{"i":"403fb4e4","c":"graph","d":"H","s":"","o":["most of the farmers who mainly cultivated cereals and most of the farmers who mainly cultivated non–root vegetables in south Ondo were women.","more women in central Ondo mainly cultivated root crops than mainly cultivated cereals.","most of the farmers who mainly cultivated non–root vegetables in north and south Ondo were women.","a relatively equal proportion of women across the three regions of Ondo mainly cultivated cereals."],"a":2,"r":"Choice C is the best answer because it uses data from the graph to effectively complete the example of Eludoyin and his colleagues’ findings concerning female farmers in some regions of Ondo State, Nigeria. The graph presents values for the percentage of Ondo State small-scale farmers who are female, by type of crop and region. The graph shows that of the farmers mainly cultivating non-root vegetables, approximately 57% in north Ondo and approximately 54% in south Ondo are female; in other words, most of those farmers are female, which exemplifies the idea that female farmers make up the majority (more than half) of the farmers cultivating specific types of crops in some regions. Choice A is incorrect because it inaccurately cites data from the graph: the graph shows that in south Ondo, most of the farmers mainly cultivating non-root vegetables are women (approximately 54%), but that only about 35% (less than half) of the farmers mainly cultivating cereals are women. Choice B is incorrect because it inaccurately cites data from the graph: the graph shows that more women in central Ondo mainly cultivate cereals than mainly cultivate root crops (approximately 36% and 20%, respectively). Additionally, it doesn’t effectively complete the example because the graph shows that female farmers don’t make up the majority (more than half) of the farmers for any type of crop in central Ondo. Choice D is incorrect because it doesn’t effectively complete the example; it simply states that a relatively equal proportion of women across the three regions mainly cultivate cereals, which doesn’t address the value for that proportion and thus doesn’t show that a majority (more than half) of the farmers cultivating certain crops are female."},{"i":"56f477fb","c":"graph","d":"H","s":"","o":["Provisioning services represent 73% of the services reported for the West region and 33% of those for the Central region, but they represent 75% of the services reported overall.","None of the percentages shown for provisioning services are lower than 33%, and the overall percentage shown for provisioning services is 75%.","Provisioning services are shown for each region, while no cultural services are shown for some regions.","The greatest percentage shown for provisioning services is 88% for the North region, and the least shown for provisioning services is 33% for the Central region."],"a":1,"r":"Choice B is the best answer. The finding that all the regions reported at least some effects on provisioning services supports the first part of the assertion. And the fact that provisioning services comprise 75% of the reported services overall supports the second part of the assertion. Choice A is incorrect. This choice doesn’t fully support the assertion. It doesn’t include the finding that all the regions (not just Central and West) reported at least some effects on provisioning services. Choice C is incorrect. This choice doesn’t fully support the assertion. It doesn’t demonstrate that provisioning services represent the majority of the reported services overall. Choice D is incorrect. This choice doesn’t fully support the assertion. It doesn’t demonstrate that provisioning services represent the majority of the reported services overall."},{"i":"ee4aa2aa","c":"fss","d":"H","s":"During a 2022 expedition led by research zoologist Andrea Quattrini, scientists discovered a new species of black coral off the coast of Puerto Rico. Like other black corals, the newly discovered species, which they named Aphanipathes puertoricoensis, has coiled branching structures that ______ it survive in the deep sea.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has helped","helps","helping","help"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms within a sentence. The plural verb “help” provides the relative clause beginning with “that” with a finite verb and agrees in number with the plural subject “coiled branching structures.” Choice A is incorrect because the singular verb “has helped” doesn’t agree in number with the plural subject “coiled branching structures.” Choice B is incorrect because the singular verb “helps” doesn’t agree in number with the plural subject “coiled branching structures.” Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite participle “helping” doesn’t supply a finite verb to the relative clause beginning with “that.”"},{"i":"d2b81427","c":"fss","d":"H","s":"In assessing the films of Japanese director Akira Kurosawa, ______ have missed his equally deep engagement with Japanese artistic traditions such as Noh theater.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["many critics have focused on Kurosawa’s use of Western literary sources but","Kurosawa’s use of Western literary sources has been the focus of many critics, who","there are many critics who have focused on Kurosawa’s use of Western literary sources, but they","the focus of many critics has been on Kurosawa’s use of Western literary sources; they"],"a":0,"r":"Choice A is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “many critics” the subject of the sentence and places it immediately after the modifying phrase “in assessing…Kurosawa.” In doing so, this choice clearly establishes that it is the critics—and not another noun in the sentence—who assess Kurosawa’s films. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “Kurosawa’s…sources” immediately after the modifying phrase illogically suggests that his use of Western literary sources is what assesses Kurosawa’s films. Choice C is incorrect because it results in a dangling modifier. The placement of the function word “there” immediately after the modifying phrase illogically suggests that “there” is what assesses Kurosawa’s films. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “the focus… critics” immediately after the modifying phrase illogically suggests that the critics’ focus is what assesses Kurosawa’s films."},{"i":"35360da9","c":"fss","d":"E","s":"The US Geological Survey wants to map every human-made structure in the United States, and it is asking volunteers to help. Cassie Tammy Wang and Ashish D’Souza are just two of the many volunteer map editors who ______ to the project since it began in 2012.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["contribute","will contribute","have contributed","will be contributing"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the present perfect tense verb “have contributed,” used in conjunction with the phrase “since it began in 2012,” correctly indicates that map editors have contributed in the past and continue to do so in the present. Choice A is incorrect because the present tense verb “contribute” is inconsistent with the phrase “since it began in 2012,” which suggests that the contributions occurred in the past and continue into the present. Choice B is incorrect because the future tense verb “will contribute” is inconsistent with the phrase “since it began in 2012,” which suggests that the contributions occurred in the past and continue into the present. Choice D is incorrect because the future tense verb “will be contributing” is inconsistent with the phrase “since it began in 2012,” which suggests that the contributions occurred in the past and continue into the present."},{"i":"60dd03bc","c":"bound","d":"E","s":"Located in the northern United States, the Great Lakes Basin contains roughly 35,000 islands. Lake Superior has Grand Island, for example. Lake Michigan has Belle Isle. Lake Huron, though, is home ______ the largest island of them all: Manitoulin Island.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to;","to—","to","to,"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation use between a preposition and its complement. No punctuation is needed between the preposition \"to\" and its complement \"the largest island of them all.\" The complement completes the meaning of the preposition in the phrase \"home to the largest island of them all,\" and any punctuation within it results in an ungrammatical sentence. Choice A is incorrect because no punctuation is needed between the preposition and its complement. Choice B is incorrect because no punctuation is needed between the preposition and its complement. Choice D is incorrect because no punctuation is needed between the preposition and its complement."},{"i":"b0115ef6","c":"bound","d":"E","s":"Technologies such as microphones and inkjet printers are made using piezoelectric materials, which generate an internal electric field when pressure is applied to them. The toxic nature of some of these materials recently led a team from the University of Sheffield to investigate how ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["could their use be better regulated?","their use could be better regulated.","their use could be better regulated?","could their use be better regulated."],"a":1,"r":"Choice B is the best answer. The convention being tested is end-of-sentence punctuation. This choice correctly uses a period to punctuate a declarative sentence that asks an indirect question (\"The toxic nature of some of these materials recently led a team from the University of Sheffield to investigate how their use could be better regulated\"). Choice A is incorrect because the structure requires a period and a declarative clause at the end of the sentence that states what the team investigated, not an interrogative clause that asks a direct question, such as \"how could their use be better regulated?\" Choice C is incorrect because it’s unconventional to use a question mark in this way to punctuate a declarative sentence. Choice D is incorrect because the structure requires a declarative clause at the end of the sentence that states what the team investigated, not an interrogative clause that asks a direct question, such as \"how could their use be better regulated?\""},{"i":"dede8260","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: When medical students mention their patients on social media, they may violate patient confidentiality. Terry Kind led a study to determine how many medical schools have student policies that mention social media use. Kind and her team reviewed 132 medical school websites, examining publicly available student policies. Only thirteen medical schools had guidelines that explicitly mention social media, and only five defined what constitutes acceptable social media use. The student wants to emphasize the study’s methodology.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The student policies of 132 medical schools can be found online, according to research by Terry Kind.","To find out how many medical schools have guidelines about student social media use, Terry Kind and her team examined the student policies of 132 medical schools.","Out of 132 medical schools, only thirteen had student policies that mentioned social media, and only five specified what use was acceptable.","Terry Kind and her team wanted to know how many medical schools have student social media policies in place about protecting patient confidentiality."],"a":1,"r":"Choice B is the best answer. The sentence effectively emphasizes Kind’s methodology: examining the student policies of 132 medical schools for guidelines about student social media use. Choice A is incorrect. The sentence specifies how many medical schools’ student policies are available online; it doesn’t emphasize the study’s methodology. Choice C is incorrect. The sentence emphasizes the study’s results, not the study’s methodology. Choice D is incorrect. The sentence emphasizes the aim of the study, not the study’s methodology."},{"i":"efa2be4f","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: The meter of a poem is the rhythmic structure or pattern of accents in its lines. Alliterative meter is structured by a pattern of repeated sounds. Quantitative meter is structured by a pattern of long and short syllables. The Old English poem Widsith uses an alliterative meter. The Sanskrit poem Meghadūta uses a quantitative meter. The student wants to emphasize a difference between the meters of the two poems.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The poem Widsith is written in Old English, but Meghadūta is written in Sanskrit.","Alliterative meter is a pattern of repeated sounds, but quantitative meter is a rhythmic structure or pattern of accents.","The Sanskrit poem Meghadūta uses a quantitative meter, while the meter of the Old English poem Widsith uses a pattern of long and short syllables.","The lines of the poem Meghadūta use a pattern of long and short syllables, whereas Widsith’s lines use a pattern of repeated sounds."],"a":3,"r":"Choice D is the best answer. Noting that Meghadūta uses a pattern of long and short syllables in its lines (quantitative meter) and Widsith uses a pattern of repeated sounds in its lines (alliterative meter), and signaling a contrast with “whereas,” the sentence emphasizes a difference between the meters of the two poems. Choice A is incorrect. The sentence indicates that the two poems were written in different languages; it doesn’t emphasize a difference between the meters of the two poems. Choice B is incorrect. The sentence mentions the meters of the two poems but misrepresents information from the notes; the overall definition of a meter (the rhythmic structure or pattern of accents in a poem’s lines) applies to both alliterative and quantitative meters, not just quantitative. Choice C is incorrect. While the sentence emphasizes a difference between the meters of the two poems, it misrepresents information from the notes; Widsith uses an alliterative meter, which is structured by a pattern of repeated sounds, not a pattern of long and short syllables."},{"i":"52b31d7b","c":"trans","d":"M","s":"In November 1934, Amrita Sher-Gil was living in what must have seemed like the ideal city for a young artist: Paris. She was studying firsthand the color-saturated style of France’s modernist masters and beginning to make a name for herself as a painter. ______ Sher-Gil longed to return to her childhood home of India; only there, she believed, could her art truly flourish.\n\nWhich choice completes the text with the most logical transition?","o":["Still,","Therefore,","Indeed,","Furthermore,"],"a":0,"r":"Choice A is the best answer. “Still” logically signals that the information about Sher-Gil in this sentence—that she longed to leave Paris and return to India—contrasts with what one would expect after reading about Sher-Gil’s experiences in Paris in the previous sentences. Choice B is incorrect because “therefore” illogically signals that the information about Sher-Gil in this sentence is a result or consequence of the descriptions in the previous sentences. Instead, this information contrasts with what one would expect after reading about Sher-Gil’s experiences in Paris. Choice C is incorrect because “indeed” illogically signals that the information about Sher-Gil in this sentence offers additional emphasis in support of the descriptions in the previous sentences. Instead, this information contrasts with what one would expect after reading about Sher-Gil’s experiences in Paris. Choice D is incorrect because “furthermore” illogically signals that the information about Sher-Gil in this sentence offers additional support for or confirmation of the descriptions in the previous sentences. Instead, this information contrasts with what one would expect after reading about Sher-Gil’s experiences in Paris."},{"i":"25361ec6","c":"trans","d":"M","s":"Scientists long debated the origins of chondrules, tiny glass beads that formed in meteors billions of years ago. For decades, different theories were proposed, from lightning strikes to powerful rock collisions, but none had sufficient evidentiary support. ______ scientists found strong evidence that chondrules were formed by shock waves in nearby nebulae.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","Therefore,","Similarly,","Finally,"],"a":3,"r":"Choice D is the best answer. \"Finally\" logically signals that the information in this sentence—that scientists found evidence that chondrules were formed by shock waves in nearby nebulae—indicates a conclusion to the scientific debate mentioned in the previous sentences. Choice A is incorrect because \"for example\" illogically signals that the information about the evidence for chondrule formation in this sentence exemplifies the information about the scientific debate regarding chondrule formation in the previous sentences. Instead, it indicates a conclusion to the debate. Choice B is incorrect because \"therefore\" illogically signals that the information in this sentence is a result of the previous information about the scientific debate regarding chondrule formation. Instead, it indicates a conclusion to the debate. Choice C is incorrect because \"similarly\" illogically signals that the information that follows is similar to the information about the scientific debate regarding chondrule formation in the previous sentences. Instead, it indicates a conclusion to the debate."}],"img":{"403fb4e4":"iVBORw0KGgoAAAANSUhEUgAAArwAAAKSBAMAAADCMhU2AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABXQ0lEQVR42u1dd2BT1Rf+7kvS3eYmZa++tmwUUvYqhCEOQAIIKoIGkSn6Ky62FlRkqRVlg5QlW8veEIZAmWFvmlI2tLkpu21yf38kadPSBVI6eN8f7ct7563vnXvuOecuQIIECRIkSJAgQYIECRIkSJAgQYIECYUexPUHzWynhFxAJebIGiXAEA0ghDj3tHb8r03T0y8ho5LOXBpBXHkEQGVOwqlTZz32aiDfNCvMsXux/X/1TWugoYBKLhGZBb0b6kU/sbPBE9pYVgOEflFsn4P3Kfa9S2t3kocDgJdEZBb0rkUo2u7Fa5+GVT2grRaNKv33kr+jheUL0PjgNDJyPkAn/IvZZyhmAu3F35f/hrJ7NqD6WQ2wG2h6Xj/8NOYsoSMWSmRmSu9I+a7S4Z9/rd5XT9jjGdnsj1f0w1rIOvYQTpWO8pzbA/BYExrWriewHiinu9NiAzlT+bp8b8mVwMiOKD2Pdi4T0ayl19x2mnx5AaFg86t47w23I3568+bExwcUd7x1fNZ5TewR68qjqtu3xFaRR8KgGLGv47YYECtgpo+3r5I9OhcrO3uzODB+mC4hgf3tJxq3Be64pM+X5y/gZl/Qfqqq72H0MbrHQKjyo8HvOKCE/Mf7v19/N0rdzn8tRJOVqiigBlSwATITNcp
