<script>
const D={"t":"Practicetest23","q":[{"i":"359902ae","c":"vocab","d":"M","s":"The following text is adapted from Nathaniel Hawthorne’s 1837 story “Dr. Heidegger’s Experiment.” The main character, a physician, is experimenting with rehydrating a dried flower. At first [the rose] lay lightly on the surface of the fluid, appearing to imbibe none of its moisture. Soon, however, a singular change began to be visible. The crushed and dried petals stirred and assumed a deepening tinge of crimson, as if the flower were reviving from a deathlike slumber.\n\nAs used in the text, what does the phrase “a singular” most nearly mean?","o":["A lonely","A disagreeable","An acceptable","An extraordinary"],"a":3,"r":"Choice D is the best answer because as used in the text, “singular” most nearly means extraordinary. The text portrays an experiment in which a character rehydrates a dried rose by infusing it with moisture. After prolonged contact with the liquid, the rose begins to absorb it, undergoing an exceptional transformation: its color deepens, its previously “crushed and dried” petals shift, and the entire flower revives “from a deathlike slumber.” In other words, an extraordinary change is visible in the flower. Choice A is incorrect. Although in some contexts “singular” can mean of or relating to an individual or to a single instance of something, this usage doesn’t imply loneliness or an otherwise unsatisfactory condition of isolation. Moreover, the text doesn’t attribute such a condition to the rose. Choice B is incorrect. Although “singular” has several related meanings, none of them relate to being disagreeable or unpleasant. Moreover, the text doesn’t portray the change undergone by the rose as necessarily disagreeable. Choice C is incorrect because “singular” means extraordinary, not acceptable. The change is portrayed as striking, not barely satisfactory."},{"i":"06b96bfc","c":"vocab","d":"E","s":"A musician and member of the Quechua of Peru, Renata Flores Rivera was eager to promote the Quechua language in her music, but she was ______ speaking it. She met this challenge by asking her grandmother, a native speaker of Quechua, to help her pronounce words in her song lyrics and also by taking classes in the language.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["prepared for","inexperienced with","skilled in","excited about"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Renata Flores Rivera’s use of Quechua in her music. In this context, “inexperienced with” means not accustomed to. The text indicates that Flores Rivera wanted to promote the Quechua language in her music and overcame a challenge by seeking help with pronunciation from her grandmother and by taking language classes. This context conveys the idea that Flores Rivera was not sufficiently familiar with Quechua to use it in her music without help. Thus, she was inexperienced with speaking the language, which she addressed by seeking help. Choice A is incorrect because describing Flores Rivera as “prepared for”—or ready for—speaking Quechua wouldn’t make sense in context. The text indicates that speaking Quechua presented a challenge, but if she were ready to speak the language, then there would be no challenge. Choice C is incorrect because describing Flores Rivera as “skilled in”—meaning good at or capable of—speaking Quechua wouldn’t make sense in context. The text indicates that speaking Quechua presented a challenge, but if she were capable of speaking the language, then there would be no challenge. Choice D is incorrect. Flores Rivera was likely “excited about”—or thrilled or delighted with—speaking Quechua, but this wouldn’t make sense in context. The text indicates that speaking Quechua presented a challenge, but if she were delighted with speaking the language, then there would be no challenge."},{"i":"01de46bb","c":"vocab","d":"E","s":"The Menominee and Anishinaabe peoples have been growing wild rice—known as manoomin in the Ojibwe language—in the Great Lakes region of North America for centuries, but climatic changes are causing lakes to get deeper, thereby threatening wild rice. These plants are extremely ______ to water depth during the “floating leaf” stage of development, and if the water is too deep, the buoyancy of the young wild-rice plants can literally uproot them from the lake bottom, destroying them.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["immune","sensitive","limited","receptive"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of wild rice. As used in this context, \"sensitive\" means vulnerable or easily affected. The text indicates that climate change is causing the lakes to get deeper, which consequently threatens the wild rice that grows in the area. The text goes on to state that deep water can cause young wild-rice plants to uproot from the bottom of the lake. This context supports the idea that the plants are sensitive to water depth during early stages of development. Choice A is incorrect because \"immune\" means protected or shielded, which wouldn’t make sense in this context. The text explains that deep water can cause young wild-rice plants to become uprooted and destroyed, indicating that these plants are harmed by deep water, not protected from it. Choice C is incorrect because \"limited\" means confined or restrained, which wouldn’t make sense in this context. The text explains that water depth can negatively affect young wild-rice plants but doesn’t suggest that water depth limits or restrains the plants. Choice D is incorrect because \"receptive\" means open or tolerant, which wouldn’t make sense in this context. The text doesn’t indicate that the wild-rice plants are open to or tolerant of an increase in water depth but rather the opposite: an increase in water depth can harm young wild-rice plants."},{"i":"e7d37666","c":"vocab","d":"H","s":"It is by no means ______ to recognize the influence of Dutch painter Hieronymus Bosch on Ali Banisadr’s paintings; indeed, Banisadr himself cites Bosch as an inspiration. However, some scholars have suggested that the ancient Mesopotamian poem Epic of Gilgamesh may have had a far greater impact on Banisadr’s work.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["substantial","satisfying","unimportant","appropriate"],"a":2,"r":"Choice C is the best answer because it most logically completes the sentence about the influences on Banisadr’s work. In context, “It is by no means” followed by “unimportant” conveys how it is relevant to recognize Bosch’s influence on Banisadr. The text points out that the artist himself cites Bosch as an inspiration, and then goes on to claim that The Epic of Gilgamesh has had a more significant influence than Bosch. Choice A is incorrect because “substantial,” which means weighty or meaningful, incorrectly suggests that it wouldn’t be meaningful to acknowledge Bosch’s influence on Banisadr. The phrase “indeed, Banisadr himself cites Bosch as an inspiration” doesn’t support this suggestion. Choice B is incorrect because “satisfying,” which means pleasing, incorrectly suggests that it wouldn’t be pleasing to acknowledge Bosch’s influence on Banisadr. The phrase “indeed, Banisadr himself cites Bosch as an inspiration” doesn’t support this suggestion. Choice D is incorrect because “appropriate,” which means suitable, incorrectly suggests that it wouldn’t be proper to acknowledge Bosch’s influence on Banisadr. The phrase “indeed, Banisadr himself cites Bosch as an inspiration” doesn’t support this suggestion."},{"i":"d9915c15","c":"purpose","d":"H","s":"In 2020, rap artist and professor A.D. Carson published the first peer-reviewed rap album about his experiences with Black masculinity called “i used to love to dream.” Typically in peer review, experts evaluate scholarly articles prior to publication. For Carson’s album, dubbed a “mixtap/e/ssay,” peer review involved both scholars and rap artists. In combining elements of a mixtape album with scholarly essays that connect Carson’s lyrics to historical and contemporary contexts for listeners both inside and outside academia, Carson’s album helped redefine how scholarship is created and shared.\n\nWhich choice best states the main purpose of the text?","o":["To compare the relative public impact of scholarly articles and albums","To capture one scholar’s opinion of a new rap album","To explain why a certain rap album is particularly innovative","To describe how each step of the peer review process unfolds"],"a":2,"r":"Choice C is the best answer because it best describes the main purpose of the text, which is to explain why a certain rap album is particularly innovative. The text mentions rap artist and professor A.D. Carson, who published \"the first peer-reviewed rap album.\" The text also describes the unusual process of having the work evaluated by both scholars and rap artists before its release, and details how the album combines elements of a mixtape album with elements of scholarly essays. All of these characteristics of the album and the way in which it was developed help to demonstrate the album’s novelty. Choice A is incorrect because though the text mentions an album that combines elements of scholarly essays and mixtapes, it does not compare the relative public impact of scholarly articles and albums. Choice B is incorrect because the text does not present the opinion of a scholar regarding the rap album. Choice D is incorrect because though the text mentions that the album was peer reviewed, it does not detail the steps of the review."},{"i":"213a25d1","c":"purpose","d":"M","s":"The following text is from Paul Laurence Dunbar’s 1913 poem “The Poet and His Song.” A song is but a little thing, And yet what joy it is to sing! In hours of toil it gives me zest, And when at eve I long for rest; When cows come home along the bars, And in the fold I hear the bell, As Night, the shepherd, herds his stars, I sing my song, and all is well.\n\nWhich choice best states the main purpose of the text?","o":["To convey how engaging in song makes the speaker feel","To compare the speaker to a singing shepherd","To portray the speaker’s excitement about farming","To describe the pieces of music the speaker enjoys hearing"],"a":0,"r":"Choice A is the best answer because is accurately states the main purpose of the text. The text begins by declaring that although a song is \"but a little thing,\" or seemingly insignificant, singing it brings joy and gives the speaker of the text \"zest,\" or excitement, in \"hours of toil.\" The remainder of the text explores the idea that as night is falling, singing allows the speaker to feel that \"all is well.\" Thus, the main purpose of the text is to convey how engaging in song makes the speaker feel. Choice B is incorrect. Although the text mentions a shepherd, it neither indicates that the shepherd is singing nor does it compare the shepherd to the speaker. Choice C is incorrect. The text indicates that the speaker works hard, engaging in \"hours of toil,\" and it can be inferred that the speaker likely lives in a rural area, since cows and a cowbell can be heard nearby. However, the text does not suggest that the speaker is a farmer or feels excited about farming. Moreover, the shepherd in the text is not a literal reference to someone who herds sheep but instead a figurative description of the moon as the shepherd of the stars. Choice D is incorrect because in the text, the speaker is singing a song, not listening to others sing one. Moreover, the text describes the feelings that the speaker has when singing a song, not the song itself."},{"i":"d2a90d4f","c":"func","d":"E","s":"The majority of plastics today wind up in landfills or are, at best, recycled into materials that have a very limited range of applications. To address this problem, chemist Guoliang Liu and colleagues designed a reactor that melts polyethylene and polypropylene—two widely used plastics—into a wax. The wax can then be transformed into a surfactant (<u>a chemical compound usable as a detergent<\/u>). With this promising new method, plastic waste could be turned into a range of useful cleaning products.\n\nWhich choice best states the function of the underlined portion of the text?","o":["It clarifies the meaning of a scientific term.","It describes an environmental concern.","It explains the significance of a scientific discovery.","It identifies a result that confused the team."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined phrase functions in the text as a whole. The text states that the wax produced by Liu and colleagues’ reactor can be turned into a surfactant. The underlined phrase, which is set off with parentheses, then provides a definition for the term \"surfactant,\" explaining that it’s a chemical compound that can be used as a detergent. Thus, the underlined portion of the text functions to clarify the meaning of a scientific term. Choice B is incorrect. Though the text as a whole focuses broadly on an environmental concern, the underlined phrase does not; it simply indicates what a surfactant is. Choice C is incorrect. Though the text as a whole focuses on a scientific discovery (Liu and colleagues’ solution to the problem of plastic recycling), the underlined phrase does not explain its significance; it simply defines a scientific term used in the discussion. Choice D is incorrect. Though the text as a whole includes discussion of the result found by Liu and colleagues, the underlined phrase does not discuss it; it simply defines a scientific term used in the discussion. Additionally, at no point in the text is it mentioned that the team was confused."},{"i":"48555763","c":"func","d":"M","s":"The following text is from Herman Melville’s 1854 novel The Lightning-rod Man. The stranger still stood in the exact middle of the cottage, where he had first planted himself. <u>His singularity impelled a closer scrutiny.<\/u> A lean, gloomy figure. Hair dark and lank, mattedly streaked over his brow. His sunken pitfalls of eyes were ringed by indigo halos, and played with an innocuous sort of lightning: the gleam without the bolt. The whole man was dripping. He stood in a puddle on the bare oak floor: his strange walking-stick vertically resting at his side.\n\nWhich choice best states the function of the underlined sentence in the overall structure of the text?","o":["It elaborates on the previous sentence’s description of the character.","It introduces the setting that is described in the sentences that follow.","It establishes a contrast with the description in the previous sentence.","It sets up the character description presented in the sentences that follow."],"a":3,"r":"Choice D is the best answer. This best states the function of the underlined sentence. The sentence basically says: “He stood out, so I looked more closely at him.”Then the rest of the text describes him in detail. Choice A is incorrect. This doesn’t state the function of the underlined sentence. The previous sentence basically says: “He was still standing in the middle of the cottage”—it doesn’t include any description of the character himself. Choice B is incorrect. This doesn’t state the function of the underlined sentence. The following sentences describe the character, not the setting. Choice C is incorrect. This doesn’t state the function of the underlined sentence. The underlined sentence basically says: “He stood out, so I looked more closely at him.”The previous sentence basically says: “He was still standing in the middle of the cottage.”There’s no contrast between these two sentences."},{"i":"059f7201","c":"cross","d":"M","s":"Text 1 Graphic novels are increasingly popular in bookstores and libraries, but they shouldn’t be classified as literature. By definition, literature tells a story or conveys meaning through language only; graphic novels tell stories through illustrations and use language only sparingly, in captions and dialogue. Graphic novels are experienced as series of images and not as language, making them more similar to film than to literature.\n\nText 2 Graphic novels present their stories through both language and images. Without captions and dialogue, readers would be unable to understand what is depicted in the illustrations: the story results from the interaction of text and image. Moreover, Alison Bechdel’s Fun Home and many other graphic novels feature text that is as beautifully written as the prose found in many standard novels. Therefore, graphic novels qualify as literary texts.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the overall argument presented in\n\nText 1?","o":["By asserting that language plays a more important role in graphic novels than the author of Text 1 recognizes","By acknowledging that the author of Text 1 has identified a flaw that is common to all graphic novels","By suggesting that the story lines of certain graphic novels are more difficult to understand than the author of Text 1 claims","By agreeing with the author of Text 1 that most graphic novels aren’t as well crafted as most literary works are"],"a":0,"r":"Choice A is the best answer because it most accurately states how the author of Text 2 would most likely respond to the argument presented in Text 1. In arguing that graphic novels shouldn’t be classified as literature and are more comparable to film, Text 1 claims that language plays a relatively limited role in graphic novels: images, not language, are the primary means by which graphic novels tell their stories, and language is used \"only sparingly\"—that is, comparatively very little—in the form of captions and dialogue. However, the author of Text 2 asserts that language in graphic novels is as equally vital for conveying meaning as images are, since without captions and dialogue, readers wouldn’t be able to make sense of the narrative. Moreover, the author of Text 2 argues that there are many graphic novels that are \"beautifully written\" and whose use of language is as accomplished as any standard novel. Because Text 1 argues that language is subordinate to images in graphic novels, whereas Text 2 highlights how language is an essential component of a graphic novel’s storytelling, it can reasonably be inferred that the author of Text 2 would say that language plays a more important role in graphic novels than the author of Text 1 recognizes. Choice B is incorrect. Although Text 1 indicates that graphic novels shouldn’t be classified as literature based on their limited use of language, there’s no indication that the author of Text 1 considers this limited use of language as a flaw, just that it doesn’t fit the particular definition of \"literature\" proposed in the text. Even if Text 1 had suggested that their use of language was a common flaw of graphic novels, the author of Text 2 emphasizes how many graphic novels are \"beautifully written,\" and would therefore say that their use of language is exemplary, not that it is flawed. Choice C is incorrect because Text 1 doesn’t claim that the story lines of graphic novels are generally relatively easy to understand; in addition, Text 2 argues that given their dependence on the interaction of image and text, the stories of graphic novels would be incomprehensible if their captions and dialogue were removed, not that the story lines of some graphic novels are more difficult to understand than Text 1 acknowledges. Choice D is incorrect because the author of Text 1 doesn’t imply that graphic novels aren’t well crafted, only that they use language too sparingly to fit the definition of \"literature,\" and that their use of images to convey stories makes them more comparable to film than to literature. Even if the author of Text 1 had implied that most graphic novels aren’t well crafted, Text 2 refers to the fact that many graphic novels are as beautifully written—that is, well crafted—as many standard novels; thus, it wouldn’t be accurate to say that the author of Text 2 would agree with the author of Text 1 that most graphic novels aren’t well crafted."},{"i":"487a05f8","c":"main","d":"E","s":"The following text is adapted from Sylvia Acevedo’s 2018 memoir Path to the Stars: My Journey from Girl Scout to Rocket Scientist. The narrator is traveling by car with her family to Mexico City. Mario and Laura are her brother and sister. Mario and I played games to see how many different license plates we could spot, and Laura liked to look for children in the back seats of the cars we passed. We were used to the forty-five-minute drive to El Paso and familiar with the six-hour ride to Chihuahua, but I wondered what the long journey to Mexico City would be like. ©2018 by Sylvia Acevedo According to the text, what did the narrator and Mario do while riding in the car?","o":["They read books.","They sang songs.","They went to sleep.","They played games."],"a":3,"r":"Choice D is the best answer because it most accurately describes what the narrator and Mario did while riding in the car. The text describes a car trip that the narrator is taking with her family. The text states that during the car ride, the narrator and Mario \"played games\" to see how many different license plates they could spot. Choice A is incorrect because the text doesn’t mention the narrator and Mario reading during the car ride and instead describes them playing games. Choice B is incorrect because the text doesn’t mention the narrator and Mario singing songs during the car ride and instead describes them playing games. Choice C is incorrect because the text doesn’t mention the narrator and Mario sleeping during the car ride and instead describes them playing games."},{"i":"2573d64b","c":"main","d":"M","s":"At over a thousand pages across two volumes, The Fifty-Year Mission, compiled by Edward Gross and Mark A. Altman, is presented as the “complete, uncensored, unauthorized oral history” as told by the people behind the media franchise Star Trek. The work aspires to be comprehensive by, for example, including accounts from cast and crew members of every Star Trek television series and film to date. But while The Fifty-Year Mission is clearly a unique and valuable resource, it has a shortcoming common among oral histories: it lacks a clear authorial point of view that could otherwise unite the various accounts into a cohesive whole.\n\nWhich choice best states the main idea of the text?","o":["The compilers of The Fifty-Year Mission had lofty goals for their oral history of the Star Trek franchise, but the published work lacks information about many key events in the franchise’s history.","The Fifty-Year Mission includes more accounts from people involved with Star Trek television shows than it does from people involved with Star Trek films.","The large amount of material compiled into The Fifty-Year Mission is surprising given that many of the people involved in the Star Trek franchise did not participate in the oral history project.","The Fifty-Year Mission represents a worthwhile attempt to thoroughly recount the history of the Star Trek franchise, but its approach has an important limitation."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. According to the text, Gross and Altman’s book is a \"valuable resource\" because it’s a \"complete, uncensored, unauthorized oral history\" that features accounts from people involved with \"every Star Trek television series and film\" made. However, the text also points out an inherent shortcoming of the oral history approach used by the book’s creators: the lack of an authorial voice that could unify the many accounts into a coherent narrative. Thus, the text’s main idea is that while the book’s attempt at presenting a comprehensive oral history of the Star Trek franchise is a worthwhile one, the approach the creators selected has an important limitation. Choice A is incorrect. While the goal of the book’s creators (providing a comprehensive history of the Star Trek franchise) could be described as lofty, the text’s criticism of the book is focused on the shortcomings of the oral history form, not on events in the Star Trek franchise that were not reflected in the book. Choice B is incorrect because the text doesn’t suggest that the book includes more accounts from people involved with television shows than with films. In fact, the text explicitly states that the book includes accounts from people involved with \"every Star Trek television series and film\" ever made. Choice C is incorrect because the text doesn’t indicate that many people involved with the Star Trek franchise failed to participate in the book’s oral history project. The only mention of the scope of participation states that the book includes accounts \"from cast and crew members of every Star Trek television series and film to date.\" This information implies a high level of participation from relevant individuals, not a lack of participation."},{"i":"25893fc7","c":"infer","d":"E","s":"In many cultures, a handshake can create trust between people. Engineer João Avelino and his team are designing a robot to shake hands with a human in order to improve human-robot interactions. The robot hand adjusts its movements and pressure to better imitate the feel of a human hand. The researchers want the robot’s handshake to feel realistic because ______ Which choice most logically completes the text?","o":["lifelike handshakes may make people more comfortable interacting with robots.","it’s easier to program a robot to perform handshakes than it is to program a robot to perform some other types of greetings.","people are less likely to interact with robots that don’t look like humans.","the robot in the researchers’ study may have uses other than interacting with humans."],"a":0,"r":"Choice A is the best answer. The text says that handshakes create trust, and that the engineers’ goal is to “improve human-robot interactions.” This suggests that they want the robot’s handshake to feel real because they want humans to trust the robot. Choice B is incorrect. This inference isn’t supported. The text never discusses any other types of greetings, so there is no basis to make this inference. Choice C is incorrect. This inference isn’t supported. The text never discusses the appearance of this robot or any other robots, so there is no basis to make this inference. Choice D is incorrect. This inference isn’t supported. The text never discusses any uses for the robot other than interacting with humans, so there is no basis to make this inference."},{"i":"6e0e0de1","c":"infer","d":"H","s":"Aerogels are highly porous foams consisting mainly of tiny air pockets within a solidified gel. These lightweight materials are often applied to spacecraft and other equipment required to withstand extreme conditions, as they provide excellent insulation despite typically being brittle and eventually fracturing due to degradation from repeated exposure to high heat. Now, Xiangfeng Duan of the University of California, Los Angeles, and colleagues have developed an aerogel with uniquely flexible properties. Unlike earlier aerogels, Duan’s team’s material contracts rather than expands when heated and fully recovers after compressing to just 5% of its original volume, suggesting that ______ Which choice most logically completes the text?","o":["the aerogel’s remarkable flexibility results from its higher proportion of air pockets to solidified gel as compared to other aerogels.","the aerogel’s overall strength is greater than that of other insulators but its ability to withstand exposure to intense heat is lower.","the aerogel will be more effective as an insulator for uses that involve gradual temperature shifts than for those that involve rapid heat increases.","the aerogel will be less prone to the structural weakness that ultimately causes most other aerogels to break down with use."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of aerogels. The text states that aerogels—highly porous foams—offer \"excellent insulation\" but typically break down after prolonged exposure to high heat. However, according to the text, Duan and colleagues developed an aerogel that \"contracts rather than expands when heated\" and recovers its original volume after this contraction. Thus, it is logical to conclude that Duan’s team’s aerogel material will be less prone to the structural weakness that caused earlier aerogels to break down. Choice A is incorrect. Although the text indicates that aerogels consist \"mainly of tiny air pockets within a solidified gel,\" it doesn’t mention the number or proportion of air pockets to solidified gel in typical aerogels or in the aerogel developed by Duan’s team. Choice B is incorrect because the text suggests that the aerogel developed by Duan’s team has a higher, not a lower, ability to withstand exposure to intense heat due to its contraction and subsequent recovery. Choice C is incorrect. Although the text discusses temperature tolerances of aerogels and says that they offer \"excellent insulation despite typically being brittle and eventually fracturing,\" it doesn’t discuss how different rates of temperature change can affect aerogels."},{"i":"a9390104","c":"claim","d":"M","s":"East Australian humpback whales migrate up to 10,000 kilometers each year to reach their breeding grounds. Researchers long believed that migrating whales live only on the extra energy they stored up during the feeding season. But marine biologist Vanessa Pirotta and her team aren’t so sure. They analyzed 20 years of observations of the migrating whales made by citizen scientists (members of the public who help collect data for scientific research). The team claims that the whales may not live only on their stored energy during migration.\n\nWhich finding, if true, would most directly support the team’s claim?","o":["Citizen scientists have observed many different types of marine animals feeding alongside the whales.","Citizen scientists have made many observations of the whales feeding as they migrate to their breeding grounds.","Citizen scientists have made more observations of the whales migrating to their breeding grounds than of the whales returning to their feeding grounds.","Citizen scientists have recently begun to observe the whales migrating to their breeding grounds earlier in the year."],"a":1,"r":"Choice B is the best answer because it presents a finding that, if true, would most directly support Pirotta and her team’s claim that East Australian humpback whales may not live only on stored energy during migration. The text explains that it has long been thought that East Australian humpback whales store extra energy during the feeding season and then use that energy to survive while traveling to their breeding grounds. If it were true that citizen scientists have often seen the whales feeding as they migrate to the breeding grounds, that would indicate that the whales sometimes feed and take in additional energy during the journey, meaning that they may not rely only on energy they stored before migrating. Choice A is incorrect because finding that citizen scientists have observed many different types of marine animals feeding alongside the whales would have no bearing on the team’s claim; the behavior of other animals is irrelevant, and without indicating the timing of the observed feeding, the finding wouldn’t reveal whether the whales rely only on previously stored energy or ever take in additional energy during migration. Choice C is incorrect because finding that citizen scientists have more often observed whales on the way to their breeding grounds than returning to their feeding grounds would have no bearing on the team’s claim. Since it would provide information about the timing of observations but not about the whales’ observed activities, the finding wouldn’t reveal whether the whales rely only on previously stored energy or ever take in additional energy during migration. Choice D is incorrect because finding that citizen scientists have recently started seeing the whales migrate to their breeding grounds earlier in the year would have no bearing on the team’s claim. Since it would provide information about a change in the timing of migration but not about the whales’ observed activities while migrating, the finding wouldn’t reveal whether the whales rely only on previously stored energy or ever take in additional energy during migration."},{"i":"e946a32e","c":"claim","d":"H","s":"Boldly mixing elements of poetry, fiction, drama, philosophy, and manifesto, Puerto Rican writer Giannina Braschi creates cross-genre literature that explores themes such as immigration and independence. Her works have inspired responses from individuals across different fields and in a wide range of formats, from musical compositions and a comic book to architecture and furniture design. In an essay, a student asserts that the production of these diverse creations by others is reflective of Braschi’s own approach to crafting literature.\n\nWhich quotation from a scholarly review of Braschi’s work best supports the student’s claim?","o":["“Braschi is the focus of a 2020 collection of essays in which fifteen scholars from seven different countries delved into the linguistic and structural patterns of her writings.”","“Braschi’s eagerness to push boundaries and blend genres within literature invites us to consider how other art forms might also engage with literature.”","“Before settling in New York City, where she would go on to become a college professor, Braschi studied both literature and philosophy in several cities around the world.”","“In addition to her creative literary works, Braschi has produced academic pieces analyzing writings by Miguel de Cervantes, Federico García Lorca, and other authors.”"],"a":1,"r":"Choice B is the best answer because it presents the quotation that best supports the student’s claim about Braschi. By describing how Braschi’s blending of genres invites her audience to think about how other art forms could also engage with literature, the quotation supports the idea that the diversity of responses to Braschi’s work reflects Braschi’s own approach to creating literature. Choice A is incorrect because the quotation describes scholars from different countries writing essays about Braschi’s use of language in her writings; it doesn’t address how Braschi’s creation of cross-genre literature inspires diverse types of responses, which is the claim the student makes. Choice C is incorrect because the quotation focuses on the fact that Braschi studied in several different cities, which doesn’t address the student’s claim that Braschi’s creation of cross-genre literature inspires diverse types of responses. Choice D is incorrect because the quotation lists some of the authors who Braschi has written academic works about, which is irrelevant to the student’s claim that Braschi’s creation of cross-genre literature inspires diverse types of responses."},{"i":"d5b9ed0d","c":"graph","d":"M","s":"","o":["On average, participants’ ratings of the helpfulness of the review were substantially higher than were participants’ ratings of the reviewed product regardless of which type of review participants had seen.","Compared with participants who saw the control review, participants who saw the low-anger review rated the review as slightly more helpful, whereas participants who saw the high-anger review rated the review as less helpful.","Participants who saw the low-anger review rated the review as slightly more helpful than participants who saw the control review did, but participants’ attitude toward the reviewed product was slightly worse when participants saw the low-anger review than when they saw the no- anger review.","Compared with participants who saw the low-anger review, participants who saw the high-anger review rated the review as less helpful and had a less positive attitude toward the reviewed product."],"a":1,"r":"Choice B is the best answer. The claim is that low anger does not negatively affect readers’ perceptions of the review, while high anger does negatively affect readers’ perceptions of the review. This choice accurately expresses the supporting data from the “helpfulness of review” part of the graph: that low-anger reviews were rated as slightly more helpful than no-anger reviews, while high-anger reviews were rated as less helpful than no-anger reviews. Choice A is incorrect. This choice does not support the conclusion. The conclusion is only about how participants feel about the review itself— the participants’ ratings of the reviewed product are not relevant. Choice C is incorrect. This choice does not support the conclusion. The conclusion is only about how participants feel about the review itself—the participants’ attitude towards the reviewed product is not relevant. Choice D is incorrect. This choice does not support the conclusion. The conclusion is only about how participants feel about the review itself— the participants’ attitude towards the reviewed product is not relevant."},{"i":"da438257","c":"graph","d":"H","s":"","o":["Processing imports with inputs were greater than both ordinary imports and processing imports with assembly in 2006.","From 2000 to 2006, processing imports with inputs rose much more sharply than processing imports with assembly did.","From 2000 to 2006, neither processing imports with inputs nor processing imports with assembly were greater than ordinary imports.","Processing imports with assembly were greater in 2006 than processing imports with inputs in 2000."],"a":1,"r":"Choice B is the best answer because it describes data from the graph that best support the student’s assertion that initial efforts at trade liberalization in China were shaped by firms having limited capital (assets available for use) and that this situation resolved during the 2000s. The text explains that an approach to trade liberalization involves engaging in processing imports, one type of which doesn’t require payment to a trade partner (processing with assembly) and one type of which requires upfront payment to a trade partner for raw materials (processing with inputs). The graph, which presents China’s imports for ordinary imports and both types of processing imports in the years 2000, 2003, and 2006, shows that while processing imports with assembly rose from about 250 hundred million dollars in 2000 to about 750 hundred million dollars in 2006, processing imports with inputs rose much more sharply, increasing from approximately 650 hundred million dollars in 2000 to about 2,300 hundred million dollars in 2006. Because processing with inputs requires firms to pay for materials (expending capital) and processing with assembly doesn’t, the sharper rise in processing imports with inputs suggests that Chinese firms’ assets—and thus their ability to engage in that type of processing imports—were relatively limited in (and before) 2000 and then substantially increased from 2000 to 2006. In other words, the data suggest that the situation of having limited capital resolved during the 2000s. Choice A is incorrect because the graph indicates that ordinary imports were greater than both types of processing imports in 2006, not that processing imports with inputs were greater than ordinary imports and processing imports with assembly that year. Choice C is incorrect because the observation that ordinary imports were greater than both types of processing imports in 2000, 2003, and 2006 doesn’t address a change within any type of imports from 2000 to 2006, and an indication of a change in that period that might be related to the availability of assets is needed to support the assertion that the situation of having limited capital resolved during the 2000s. Choice D is incorrect because the fact that processing imports with assembly were greater at the end of the period from 2000 to 2006 than processing imports with inputs were at the start of the same period doesn’t address a change within either type of imports during the period, and an indication of such a change that might be related to the availability of assets is needed to support the assertion that the situation of having limited capital resolved during the 2000s."},{"i":"898f182c","c":"fss","d":"E","s":"Richard Spikes was a prolific African American inventor known for his contributions to automotive engineering. Between 1907 and 1946, he patented many inventions, ______ an automobile turn signal, a safety brake, and—most famously—the first automatic gearshift.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["included","includes","including","will include"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of nonfinite verb forms within a sentence. The nonfinite present participle \"including\" is correctly used to form a participial phrase that supplements the main clause \"he patented many inventions,\" listing several of Spikes’s patented inventions. Choice A is incorrect because the finite past tense verb \"included\" can’t be used in this way to supplement the main clause \"he patented many inventions.\" Choice B is incorrect because the finite present tense verb \"includes\" can’t be used in this way to supplement the main clause \"he patented many inventions.\" Choice D is incorrect because the finite future tense verb \"will include\" can’t be used in this way to supplement the main clause \"he patented many inventions.\""},{"i":"2dd1b8bf","c":"fss","d":"H","s":"Compared to that of alumina glass, ______ silica glass atoms are so far apart that they are unable to re-form bonds after being separated.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["silica glass is at a significant disadvantage due to its more dispersed atomic arrangement:","silica glass has a more dispersed atomic arrangement, resulting in a significant disadvantage:","a significant disadvantage of silica glass is that its atomic arrangement is more dispersed:","silica glass’s atomic arrangement is more dispersed, resulting in a significant disadvantage:"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-modifier placement. This choice makes “silica glass’s atomic arrangement” the subject of the sentence and places it immediately after the modifying phrase “compared to that of alumina glass.” In doing so, this choice clearly establishes that silica glass’s atomic arrangement—and not another noun in the sentence—is being compared to the atomic arrangement (“that”) of alumina glass. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase “silica glass” immediately after the modifying phrase illogically suggests that silica glass itself (rather than its atomic arrangement) is being compared to alumina glass’s atomic arrangement. Choice B is incorrect because it results in a dangling modifier. The placement of the noun phrase “silica glass” immediately after the modifying phrase illogically suggests that silica glass itself (rather than its atomic arrangement) is being compared to alumina glass’s atomic arrangement. Choice C is incorrect because it results in a dangling modifier. The placement of the noun phrase “a significant disadvantage” immediately after the modifying phrase illogically suggests that “a significant disadvantage” is being compared to alumina glass’s atomic arrangement."},{"i":"8b017d4e","c":"fss","d":"H","s":"Supported by biochemical analyses of over 2,000 skeletons from the Middle Ages, ______ Which choice completes the text so that it conforms to the conventions of Standard English?","o":["vegetables and grains were, a 2022 study found, the primary components of early medieval rulers’ diets.","early medieval rulers’ diets were found, in a 2022 study, to have primarily consisted of vegetables and grains.","the primary components of early medieval rulers’ diets were vegetables and grains, according to a 2022 study.","findings from a 2022 study suggested that vegetables and grains were the primary components of early medieval rulers’ diets."],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase \"findings from a 2022 study\" the subject of the sentence and places it immediately after the modifying phrase \"supported...Ages.\" In doing so, this choice clearly establishes that the findings—and not another noun in the sentence—are supported by the biochemical analyses. Choice A is incorrect because it results in a dangling modifier. The placement of \"vegetables and grains\" immediately after the modifying phrase illogically suggests that vegetables and grains are supported by biochemical analyses. Choice B is incorrect because it results in a dangling modifier. The placement of \"early medieval rulers’ diets\" immediately after the modifying phrase illogically suggests that the rulers’ diets are supported by biochemical analyses. Choice C is incorrect because it results in a dangling modifier. The placement of \"the primary components\" immediately after the modifying phrase illogically suggests that the primary components are supported by biochemical analyses."},{"i":"1aa3f174","c":"bound","d":"M","s":"The Mesoamerican city of Teotihuacan featured a uniquely egalitarian urban housing infrastructure. Built between the first and seventh centuries CE, Teotihuacan housed its residents (as many as 200,000, by some ______ in a complex of comfortable apartments of comparable size.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["estimates)","estimates),","estimates—","estimates"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. This choice correctly completes the parenthetical element \"as many as 200,000, by some estimates\" with a closing parenthesis, pairing with the opening parenthesis that appears earlier in the sentence. This parenthetical element functions to specify the number of residents, and the use of parentheses indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice B is incorrect. While this choice completes the parenthetical element with a closing parenthesis, no comma is needed before the prepositional phrases (\"in...size\") that provide essential information about where the residents were housed. Choice C is incorrect because a dash can’t be paired with an opening parenthesis in this way to separate the parenthetical element from the rest of the sentence. Choice D is incorrect because it doesn’t close the parenthetical element that was opened earlier in the sentence."},{"i":"a12e3b8a","c":"bound","d":"M","s":"Customers who are satisfied with how a company resolves a service issue may regard that company more positively than they would if no such issue had occurred. This idea is known as the service recovery ______ research suggests that it has important implications for customer loyalty and retention.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["paradox,","paradox","paradox, and","paradox and,"],"a":2,"r":"Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a comma and the coordinating conjunction \"and\" to join the first main clause (\"This idea…paradox\") and the second main clause (\"research… retention\"). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice B is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction. Choice D is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction, not after it."},{"i":"114bbce6","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Earthquakes start at a point called a “focus” and spread out from there as seismic waves. The two types of seismic waves that travel beneath Earth’s surface are primary waves (P waves) and secondary waves (S waves). P waves travel more quickly beneath Earth’s surface than do S waves. P waves compress and expand the ground, causing it to move backward and forward. S waves cause the ground to move from side to side. The student wants to emphasize a similarity between P waves and S waves.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["P waves and S waves both travel beneath Earth’s surface, causing the ground to move.","P waves travel away from an earthquake’s starting point at a higher rate of speed than do S waves.","Spreading out from the focus of an earthquake, P waves move the ground backward and forward.","Although P waves and S waves start at the same point, they behave very differently."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes a similarity between P waves and S waves, noting that they both travel beneath Earth’s surface, thereby causing the ground to move. Choice B is incorrect. The sentence emphasizes a difference between P waves and S waves, noting that P waves travel faster than S waves; it doesn’t emphasize a similarity between the two types of waves. Choice C is incorrect. The sentence emphasizes how P waves move; it doesn’t emphasize a similarity between P waves and S waves. Choice D is incorrect. While the sentence acknowledges that P waves and S waves start at the same point, it doesn’t emphasize a similarity; instead, the sentence emphasizes a difference between the two types of waves, noting that they behave very differently."},{"i":"79c6a01e","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The engineer Robert Fulton designed the Clermont steamboat in 1807. He designed it in New York City. Clermont was the world’s first commercially successful steamboat. The city of Fulton, Missouri, is named after Robert Fulton. New York City’s Fulton Street is named after him. The student wants to indicate how Fulton, Missouri, got its name.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Fulton, Missouri, shares its name with Fulton Street in New York City.","Fulton Street is in New York City, where the steamboat Clermont was designed in 1807.","Designed in 1807 in New York City, Clermont was the first commercially successful steamboat.","Fulton, Missouri, is named after Robert Fulton, designer of the first commercially successful steamboat."],"a":3,"r":"Choice D is the best answer. The sentence indicates how Fulton, Missouri, got its name, noting that the city was named after the designer of the first commercially successful steamboat, Robert Fulton. Choice A is incorrect. The sentence indicates that Fulton, Missouri, has the same name as a street in New York City; it doesn’t indicate how the city of Fulton got its name. Choice B is incorrect. The sentence indicates that Fulton Street is in New York City; it doesn’t indicate how Fulton, Missouri, got its name. Choice C is incorrect. The sentence provides details about Fulton’s steamboat; it doesn’t indicate how Fulton, Missouri, got its name."},{"i":"d9dad012","c":"trans","d":"M","s":"The Inca of South America used intricately knotted string devices called quipus to record countable information, like population data and payments. ______ they may have used quipus to record more complex information, like stories and myths, according to researchers.\n\nWhich choice completes the text with the most logical transition?","o":["As a result,","In other words,","In addition,","For example,"],"a":2,"r":"Choice C is the best answer. \"In addition\" logically signals that the claim in this sentence—that the Inca of South America may have used quipus to record more complex information—is an additional point related to the previous statement about the Inca using quipus to record countable information. Choice A is incorrect because \"as a result\" illogically signals that the claim in the sentence is a consequence or result of the previous statement about the Inca using quipus to record countable information. Instead, the possibility that the Inca used quipus to record more complex information is an additional point about how the quipus were used. Choice B is incorrect because \"in other words\" illogically signals that the claim in the sentence is merely a paraphrase or restatement of the previous statement about the Inca using quipus to record countable information. Instead, the possibility that the Inca used quipus to record more complex information is an additional point about how the quipus were used. Choice D is incorrect because \"for example\" illogically signals that the claim in the sentence exemplifies the previous statement about the Inca using quipus to record countable information. Instead, the possibility that the Inca used quipus to record more complex information is an additional point about how the quipus were used."},{"i":"9c78f702","c":"trans","d":"E","s":"Phytoplankton play a crucial role in the ocean’s uptake of carbon from the atmosphere. When alive, these tiny marine organisms absorb atmospheric carbon via photosynthesis. ______ after they die, the phytoplankton sink to the seafloor, where the carbon in their cells gets stored in sediment, preventing it from cycling back into the atmosphere.\n\nWhich choice completes the text with the most logical transition?","o":["Specifically,","By contrast,","Nevertheless,","Then,"],"a":3,"r":"Choice D is the best answer. “Then” logically signals that the event described in this sentence—carbon in phytoplankton cells being trapped in sediment after the organisms have died—occurs later in a chronological sequence than the event described in the previous sentence (phytoplankton absorbing carbon while alive). Choice A is incorrect because “specifically” illogically signals that the information that follows provides specific, precise details elaborating on the previous information about what phytoplankton do when alive. Instead, this sentence explains what happens after phytoplankton die—a later step in the chronological sequence of events. Choice B is incorrect because “by contrast” illogically signals that the information that follows contrasts with the previous information about what phytoplankton do when alive. Instead, this sentence explains what happens after phytoplankton die—a later step in the chronological sequence of events. There is no contrast: in both life and death, phytoplankton contribute to the ocean’s carbon uptake. Choice C is incorrect because “nevertheless” illogically signals that the information that follows is in spite of the previous information about what phytoplankton do when alive. Instead, this sentence explains what happens after phytoplankton die—a later step in the chronological sequence of events. There is no contrast: in both life and death, phytoplankton contribute to the ocean’s carbon uptake."},{"i":"1c6e1d55","c":"trans","d":"H","s":"Historically, most conductors of major orchestras and opera companies have been European men, but a new, more diverse generation of artists is stepping up to the podium. Mexico’s Alondra de la Parra took over as conductor for the Queensland Symphony Orchestra in 2017, ______ and Colombia’s Lina Gonzalez-Granados did the same for the Los Angeles Opera in 2022.\n\nWhich choice completes the text with the most logical transition?","o":["in addition,","lastly,","granted,","for instance,"],"a":3,"r":"Choice D is the best answer. “For instance” logically signals that the details in this sentence—that Mexican conductor Alondra de la Parra and Colombian conductor Lina Gonzalez-Granados took new conducting positions—are examples supporting the previous claim about the new generation of artists. Choice A is incorrect because “in addition” illogically signals that the details in this sentence about de la Parra and Gonzalez-Granados are merely additional facts related to the previous claim about the new generation of artists. Instead, they are examples supporting that claim. Choice B is incorrect because “lastly” illogically signals that the details in this sentence about de la Parra and Gonzalez-Granados are the last step or a concluding summary of the previous claim about the new generation of artists. Instead, they are examples supporting that claim. Choice C is incorrect because “granted” illogically signals that the details in this sentence about de la Parra and Gonzalez-Granados are exceptions to the previous claim about the new generation of artists. Instead, they are examples supporting that claim."}],"img":{"d5b9ed0d":"iVBORw0KGgoAAAANSUhEUgAAArwAAALABAMAAACDdLzKAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABVmklEQVR42u2dd3wURRvHf7N7d+m5uYTesknodZNQlCJHFWkeTVBBjyJSRAOogIBvUHrRANJFA4p0CEgHIfQOR+/kQqgCubnQQsrt+0cKd5AECAkmZL4fPmT39nZv9rfPPvM8M7OzAIfD4XA4HA6Hw+FwOBwOh8PJzRCAOq5yshNdqroUkACIuqe11gGCDo6XIb0LRQHi6+frJOm4qqkIS5eGpKgoCfMJpS6GFGkJABEAKlJUnrMehNiJTpLFJqkXRqAAoSi06eCiUjLlsqaiWlfjNAAKogmmEgCBUoCmKOcsAegCtA7qp8/IfVAAKCslX6zqp4M8pP/OVnKdvMqdg2uF4WtZ9z5j+jTohr571XLNX+ezipvrl/ function seg(r){const m={};r.split(/(?=Choices? [A-D](?:,? (?:and )?[A-D])* (?:is|are) )/).forEach(p=>{const x=p.match(/^Choices? ([A-D])(?:,? (?:and )?([A-D]))?(?:,? (?:and )?([A-D]))? (?:is|are) /);if(x)[x[1],x[2],x[3]].forEach(l=>{if(l)m[l]=(m[l]?m[l]+" ":"")+p.trim()})});return m}
function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
