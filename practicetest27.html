<script>
const D={"t":"Practicetest27","q":[{"i":"a06c434d","c":"vocab","d":"H","s":"The work of Kiowa painter T .C. Cannon derives its power in part from the tension among his ______ influences: classic European portraiture, with its realistic treatment of faces; the American pop art movement, with its vivid colors; and flatstyle, the intertribal painting style that rejects the effect of depth typically achieved through shading and perspective.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["complementary","unknown","disparate","interchangeable"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of the artistic styles that have influenced Cannon’s work. As used in this context, “disparate” means distinct or dissimilar. The text indicates that a tension exists among the styles that have influenced Cannon’s work and goes on to describe how those styles differ: classic European portraiture favors realism, American pop art uses vivid colors, and intertribal flatstyle rejects the use of shading and perspective to achieve depth. This context suggests that the styles that have influenced Cannon’s work are disparate. Choice A is incorrect because the text indicates that there is a tension among the influences on Cannon’s artwork, so it wouldn’t make sense to say that the influences are “complementary,” or that they complete one another or make up for one another’s deficiencies. Choice B is incorrect because it wouldn’t make sense to characterize Cannon’s influences as “unknown,” or not familiar; it’s clear that the influences are known because the text goes on to list them. Choice D is incorrect because the text indicates that there is a tension among the influences on Cannon’s work, not that they are “interchangeable,” or capable of being used in one another’s place."},{"i":"adc8ea28","c":"vocab","d":"M","s":"The fossil remains of the individual known as Oase 1, discovered in Romania in 2002, can help paleoanthropologists not only ______ steps in the evolution of hominids but also illuminate the Pleistocene epoch generally, revealing important details about the time in which Oase 1 lived.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["exploit","discern","prioritize","yield"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the utility of the Oase 1 fossil to paleoanthropologists. As used in this context, \"discern\" means to detect or recognize something, especially something hidden or obscure. The text indicates that the Oase 1 fossil can help paleoanthropologists recognize patterns in the evolutionary process and shed light on (\"illuminate\") the period in which Oase 1 lived. Thus, the fossil will enable researchers to gain insights into, or discern, facts that are still not well understood. Choice A is incorrect because in this context, \"exploit\" would suggest that the paleoanthropologists are using \"steps in the evolution of hominids,\" which does not make logical sense. Rather, the text is about how the Oase 1 fossil could help paleoanthropologists learn about hominid evolution and the Pleistocene epoch more generally. Choice C is incorrect because in this context, \"prioritize\" would suggest that either the paleoanthropologists are placing more importance on \"steps in the evolution of hominids\" than they are on something else not identified in the text or that they are placing these steps in some sort of order. Rather, the text is about how the Oase 1 fossil could help paleoanthropologists learn about hominid evolution and the Pleistocene epoch more generally. Choice D is incorrect because to say that paleoanthropologists could \"yield\" or generate \"steps in the evolution of hominids\" doesn’t make sense. The researchers may develop new insights into those evolutionary steps, but they do not create those steps themselves. Rather, the context makes it clear that they are detecting or discovering patterns based on their study of the Oase 1 fossil."},{"i":"3ec184af","c":"vocab","d":"E","s":"Many ancient sculptures of people’s heads are missing their noses. This is because the nose is the most ______ part of a sculpture of a person’s head. It is delicate and sticks out from the rest of the sculpture, making it especially easy to break.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["recognizable","fragile","common","sophisticated"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of noses on ancient sculptures. In this context, \"fragile\" means weak or delicate. This matches the text’s description of noses on ancient sculptures, which are often missing from sculptures’ heads because they are \"especially easy to break.\" Therefore, this context indicates that noses on ancient sculptures are the most fragile part of the sculptures’ heads. Choice A is incorrect. In this context, \"recognizable\" would mean identifiable, and since the text indicates that noses are often missing from ancient statues, they therefore cannot be the most recognizable part of the statue. Choice C is incorrect because the text indicates that many ancient statues are missing noses, so noses wouldn’t be \"common,\" or frequent, aspects of ancient statues; they would conversely be uncommon. Choice D is incorrect because the text only indicates that noses on ancient statues often stick out and end up missing from the heads, which doesn’t relate to the noses being \"sophisticated,\" or knowledgeable or refined."},{"i":"a3761c7e","c":"vocab","d":"E","s":"Physicist Joseph Weber performed ______ work in gravitational wave research in the 1960s and 1970s, conducting key experiments that scientists later used as the basis for their own investigations that led to the first verified detection of a gravitational wave in 2015.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["foundational","supplementary","repetitive","ineffective"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of physicist Joseph Webster’s research on gravitational waves. In this context “foundational” means the basis on which something else develops. The text indicates that Webster’s experiments in the 1960s and 1970s were earlier than, and “key” to, the work of later scientists in the field; thus, Webster’s work was foundational to the later scientists’ experiments and the eventual detection of a gravitational wave in 2015. Choice B is incorrect because the text does not suggest that Webster’s work was supplementary, or an additional element of an existing, larger project, but rather it was “the basis for” later experiments. Choice C is incorrect because the text does not assert that Webster’s work was repetitive, or involved doing something the same way many times. Rather, the text indicates that Webster’s work formed the basis for later investigations in the field of gravitational wave research. Choice D is incorrect because the text does not state that Webster’s work was ineffective, or failed to produce the desired outcome. Rather, the text strongly implies that Webster’s work was productive and extremely important to later work in the field of gravitational wave research."},{"i":"be947479","c":"purpose","d":"E","s":"Jazz tap is a dance form that was first developed in African American communities. Jazz tap was heavily influenced by jazz music, which became widely popular in the United States in the 1920s. Tap dancers were inspired by jazz music’s quick rhythms and by the way jazz musicians would make up melodies as they played. As jazz music continued to develop in the 1930s and 1940s, jazz tap evolved with it. Because of jazz music’s influence, jazz tap quickly developed into a dance form that was very different from earlier kinds of tap dance.\n\nWhich choice best states the main purpose of the text?","o":["It explains why audiences prefer some kinds of music over others.","It discusses the development of a dance form.","It describes how to play a musical instrument.","It emphasizes the popularity of a famous dancer."],"a":1,"r":"Choice B is the best answer because it best describes the main purpose of the text. The text indicates where and when jazz tap first developed (in African American communities in the 1920s) and what influenced it (the quick rhythms and improvisations in jazz music) and then explains that it evolved alongside jazz music in the 1930s and 1940s, resulting in a very different form of tap dance than had existed before. Therefore, the main purpose of the text is to discuss jazz tap’s development. Choice A is incorrect. Although the text indicates that jazz music became widely popular in the US in the 1920s and describes some of jazz music’s qualities, the text never explains why audiences prefer some kinds of music—jazz or otherwise—over others. Choice C is incorrect because the text never mentions any musical instruments and doesn’t describe how to play one. Choice D is incorrect because the text discusses jazz tap generally and never identifies a particular dancer, famous or otherwise."},{"i":"e929fe98","c":"purpose","d":"E","s":"Composer Florence Price won first place for her score Symphony in E Minor at the 1932 Wanamaker Foundation Awards. The piece was performed the following year by the Chicago Symphony Orchestra, a significant recognition of its quality. Price continued to compose many musical pieces throughout her career, blending traditional Black spirituals with classical European Romantic musical traditions. In recent years, Price’s concertos and symphonies have been performed and recorded by several major orchestras, further preserving her work for others to enjoy.\n\nWhich choice best states the main purpose of the text?","o":["To provide examples of Price’s importance as a composer","To argue that more major orchestras should perform Price’s compositions","To describe the musical styles that inspired many of Price’s symphonies","To compare Price’s scores with those of classical European composers"],"a":0,"r":"Choice A is the best answer. The text provides an overview of Florence Price’s importance by describing her success at the 1932 Wanamaker Foundation Awards, her blending of Black spirituals and classical European Romantic musical traditions, and the recent performances and recordings of her concertos and symphonies by major orchestras. Choice B is incorrect. The text does mention that Price’s compositions have been performed and recorded by major orchestras, but it doesn’t argue that more orchestras should do so. Choice C is incorrect. The text does mention the blending of Black spirituals and classical European Romantic musical traditions, but only briefly, as part of a broader overview of Price’s career. Choice D is incorrect. The text mentions Price’s blending of Black spirituals with classical European Romantic musical traditions, but it doesn’t directly compare Price’s scores with those of classical European composers."},{"i":"e13171c4","c":"func","d":"E","s":"Historians Tiya Miles and Roy E. Finkenbine have both documented the assistance Indigenous peoples gave to Black freedom seekers leaving the South before the US Civil War. Much of the historical evidence of this help comes from Indigenous oral traditions and from autobiographies written by the freedom seekers. <u>One such narrative is Jermain Loguen’s autobiography, which tells about how Neshnabé (Potawatomi) villagers offered him food, lodging, and directions during his 1835 journey from Tennessee to Canada.<\/u> Which choice best describes the function of the underlined sentence?","o":["It provides an example of an autobiography that describes help given by an Indigenous people to a Black freedom seeker.","It shows why Loguen decided to write in great detail about his experiences traveling from Tennessee to Canada in his autobiography.","It argues that autobiographies are particularly important sources of information about geography in the United States before the Civil War.","It suggests that most historians believe that Neshnabé villagers were more successful in assisting freedom seekers than other people were."],"a":0,"r":"Choice A is the best answer. The previous sentence broadly mentions \"autobiographies written by the freedom seekers.\" This sentence identifies Loguen’s autobiography as a specific example. Choice B is incorrect. The sentence never explains why Loguen chose to write about his experiences. Choice C is incorrect. The previous sentence identifies autobiographies as useful sources of historical information about a specific topic, but not for \"information about geography.\" The underlined sentence provides details of one autobiography as an example of a source of information about that specific topic (interactions between Indigenous people and Black freedom seekers). Choice D is incorrect. The text never discusses other specific people who helped freedom seekers, and therefore can’t make a comparison between the Neshnabé and anyone else."},{"i":"6bc0ba75","c":"func","d":"H","s":"The mimosa tree evolved in East Asia, where the beetle Bruchidius terrenus preys on its seeds. In 1785, mimosa trees were introduced to North America, far from any B. terrenus. <u>But evolutionary links between predators and their prey can persist across centuries and continents.<\/u> Around 2001, B. terrenus was introduced in southeastern North America near where botanist Shu-Mei Chang and colleagues had been monitoring mimosa trees. Within a year, 93 percent of the trees had been attacked by the beetles.\n\nWhich choice best describes the function of the third sentence in the overall structure of the text?","o":["It states the hypothesis that Chang and colleagues had set out to investigate using mimosa trees and B. terrenus.","It presents a generalization that is exemplified by the discussion of the mimosa trees and B. terrenus.","It provides context that clarifies why the species mentioned spread to new locations.","It offers an alternative explanation for the findings of Chang and colleagues."],"a":1,"r":"Choice B is the best answer because it most accurately describes the function of the third sentence within the overall structure of the text. The third sentence makes a generalization, asserting that evolutionary links between predators and prey can persist across great expanses of time and distance. This generalization is exemplified by the text’s discussion of the relationship between mimosa trees and B. terrenus beetles. When mimosa trees were introduced to North America in 1785, no B. terrenus beetles were present, so the relationship between the trees and the beetles that exists in their native East Asia was disrupted. When the beetles were introduced to North America more than 200 years later, however, they quickly attacked mimosa trees, illustrating the generalization that links between predators and prey \"can persist across centuries and continents.\" Choice A is incorrect because the third sentence doesn’t indicate that Chang and colleagues were investigating any hypothesis. According to the text, Chang and colleagues were simply monitoring mimosa trees when the beetles happened to be introduced to the area. Choice C is incorrect because the third sentence doesn’t discuss any particular species, let alone the species mentioned elsewhere in the text, nor does the sentence explain why species spread to new locations. Choice D is incorrect because the third sentence offers a generalization about the relationship between predators and prey, not an explanation for the findings by Chang and colleagues that’s an \"alternative\" to an explanation presented elsewhere in the text."},{"i":"f7c02e89","c":"cross","d":"H","s":"Text 1 Films and television shows commonly include a long list of credits naming the people involved in a production. Credit sequences may not be exciting, but they generally ensure that everyone’s contributions are duly acknowledged. Because they are highly standardized, film and television credits are also valuable to anyone researching the careers of pioneering cast and crew members who have worked in the mediums.\n\nText 2 Video game scholars face a major challenge in the industry’s failure to consistently credit the artists, designers, and other contributors involved in making video games. Without a reliable record of which people worked on which games, questions about the medium’s development can be difficult to answer, and the accomplishments of all but its best-known innovators can be difficult to trace.\n\nBased on the texts, how would the author of\n\nText 1 most likely respond to the discussion in\n\nText 2?","o":["By recommending that the scholars mentioned in Text 2 consider employing the methods regularly used by film and television researchers","By pointing out that credits have a different intended purpose in film and television than in the medium addressed by the scholars mentioned in Text 2","By suggesting that the scholars mentioned in Text 2 rely more heavily on credits as a source of information than film and television researchers do","By observing that a widespread practice in film and television largely prevents the kind of problem faced by the scholars mentioned in Text 2"],"a":3,"r":"Choice D is the best answer because it reflects how the author of Text 1 would most likely respond to Text 2 based on the information provided. Text 2 discusses how the inconsistent use of credits to identify the contributors to video games can pose an obstacle to scholars of the medium, who rely on such credits to answer questions about the medium’s development. Text 1 notes that in film and television, on the other hand, credits are used consistently and are valuable to researchers studying the cast and crew members in these mediums. Since Text 1 asserts how the consistent use of credits benefits scholars of film and television, it can be inferred that this text’s author would respond to the discussion in Text 2 by observing that the kind of problem faced by scholars of video games—the inability to know who contributed to a particular production and how—is, in film and television studies, largely prevented by the widespread practice of credits in these mediums. Choice A is incorrect. Although Text 1 discusses a method used by film and television researchers—namely, relying on credits to research the careers of cast and crew members—the author doesn’t explicitly recommend that or any other method. Moreover, Text 1 states that films and television shows themselves, not their researchers, regularly use the method of listing credits. Choice B is incorrect. It can be inferred from Text 2 that when video games do feature credits, they have essentially the same function as credits in film and television—namely, to identify the individuals who worked on a particular production. Therefore, it is unlikely that the author of Text 1 would characterize video game credits as differing in purpose from film and television credits. Choice C is incorrect because, as Text 2 explains, credits are not consistently used in video games. Therefore, it is unlikely that the author of Text 1 would argue that scholars of the medium discussed in this text—video games—rely more heavily on credits than scholars of film and television, two mediums where credits consistently appear."},{"i":"8a8236e1","c":"main","d":"E","s":"Scent is tightly interwoven with our daily lives, often evoking significant memories and important social events. This connection is of growing interest to archaeologists who hope to use it to better understand ancient rituals, trade, social hierarchies, and medicine. Although the speed at which odor molecules dissipate makes identifying ancient scents challenging, advancements in biomolecular technologies show promise in unlocking ancient aromas from preserved artifacts. Archaeological studies making use of these advancements may provide new insights into past societies.\n\nAccording to the text, what is one reason some archaeologists are interested in recovering scents from ancient artifacts?","o":["They are investigating whether people’s sense of smell has declined in recent centuries.","They believe the scents could illuminate important aspects of ancient life.","They think that ancient scents would be enjoyable to people today.","They hope to develop new medicines using ancient scent molecules."],"a":1,"r":"Choice B is the best answer. The text states that archaeologists are interested in using scents to better understand \"ancient rituals, trade, social hierarchies, and medicine,\" all of which are important aspects of ancient life. Choice A is incorrect. The text doesn’t say anything about investigating if people’s sense of smell has declined in recent centuries. It says that scents fade over time—not that people have gotten worse at smelling scents. Choice C is incorrect. The text says that archaeologists are interested in using scents to better understand \"ancient rituals, trade, social hierarchies, and medicine,\" but it doesn’t say anything about ancient scents being enjoyable to people today. Choice D is incorrect. The text doesn’t say anything about developing new medicines. Rather, it says that archaeologists are interested in using scents to better understand \"ancient rituals, trade, social hierarchies, and medicine.\""},{"i":"f7bd14de","c":"main","d":"H","s":"Several scholars have argued that conditions in England in the late ninth through early eleventh centuries—namely, burgeoning literacy amid running conflicts between England’s Anglo-Saxon kingdoms and Danish invaders—were especially conducive to the production of the Old English epic poem Beowulf, and they have dated the poem’s composition accordingly. It is not inconceivable that Beowulf emerged from such a context, but privileging contextual fit over the linguistic evidence of an eighth- or even seventh-century composition requires a level of justification that thus far has not been presented.\n\nWhich choice best states the main idea of the text?","o":["Although there are some grounds for believing that Beowulf was composed between the late ninth and early eleventh centuries, advocates for that view tend to rely on evidence that has been called into question by advocates for an earlier date.","Although several scholars have dated Beowulf to the late ninth through early eleventh centuries, others have argued that doing so privileges a controversial interpretation of the social conditions of the period.","Although Beowulf fits well with the historical context of England in the late ninth through early eleventh centuries, it fits equally well with the historical context of England in the seventh and eighth centuries.","Although the claim of a late ninth- through early eleventh-century composition date for Beowulf has some plausibility, advocates for the claim have not compellingly addressed evidence suggesting an earlier date."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text states that some scholars have dated the composition of Beowulf to the late ninth through early eleventh centuries due to the poem’s fit with that period’s historical context. The text goes on to say that while it is “not inconceivable that Beowulf emerged from such a context”—that is, it is possible that Beowulf was composed during the late ninth through eleventh centuries—there is linguistic evidence that the poem was composed earlier, in the seventh or eighth century. According to the text, favoring the historical context over the linguistic evidence requires justification that scholars have not yet supplied. In other words, the text suggests that scholars who favor the later composition date need to explain why the poem’s fit with historical context should take precedence over the linguistic evidence, but they have not yet done so. Thus, the main idea of the text is that while there is some plausibility to the later composition date, advocates for the later date have not compellingly addressed evidence suggestive of an earlier date. Choice A is incorrect because the text says that scholars who date the poem to the late ninth through early eleventh centuries have failed to account for the linguistic evidence that the poem may have been composed earlier, not that the evidence those scholars cite in favor of their view is unreliable or that anyone has cast doubt on that evidence. In other words, the text does not suggest that there are problems with the evidence cited by advocates of the later composition date, only that there is other evidence of an earlier composition date that those advocates need to consider. Choice B is incorrect because nothing in the text suggests that those scholars who date the poem to the late ninth through early eleventh centuries are giving priority to a controversial view of the social conditions at that time. The text makes no reference to any controversy about how scholars interpret that historical period. Instead, the text suggests that scholars who date the poem on the basis of its fit with the historical context of England in the late ninth through early eleventh centuries have failed to account for linguistic evidence that the poem may have been composed earlier. Choice C is incorrect because the text says nothing about how well the poem fits the historical context of England in the seventh and eighth centuries, let alone that it fits that historical context as well as it fits the historical context of the late ninth through early eleventh centuries. Rather, the text says that there is linguistic evidence that the poem may have been composed in the seventh or eighth century."},{"i":"299c5303","c":"infer","d":"M","s":"As the name suggests, dramaturges originated in theater, where they continue to serve a variety of functions: conducting historical research for directors, compiling character biographies for actors, and perhaps most importantly, helping writers of plays and musicals to hone the works’ stories and characters. Performance scholar Susan Manning observes that many choreographers, like playwrights and musical theater writers, are concerned with storytelling and characterization. In fact, some choreographers describe the dances they create as expressions of narrative through movement; it is therefore unsurprising that ______ Which choice most logically completes the text?","o":["dramaturges can have a profound impact on the artistic direction of plays and musicals.","choreographers developing dances with narrative elements frequently engage dramaturges to assist in refining those elements.","dances by choreographers who incorporate narrative elements are more accessible to audiences than dances by choreographers who do not.","some directors and actors rely too heavily on dramaturges to complete certain research tasks."],"a":1,"r":"Choice B is the best answer. Dramaturges help playwrights with storytelling and characterization. Choreographers often tell stories through dance, so they are also concerned with storytelling and characterization. This suggests that the fact that choreographers seek the help of dramaturges with the storytelling aspects of their dances should be “unsurprising.” Choice A is incorrect. This inference isn’t supported. The beginning of the text does imply that this is true, but the end is leading to a conclusion about how choreographers use dramaturges. Choice C is incorrect. This inference isn’t supported. The text never mentions dances by choreographers who don’t incorporate narrative elements. Choice D is incorrect. This inference isn’t supported. The text mentions in passing that directors use dramaturges to conduct research, but it never suggests that directors and actors are too reliant on them. Also, the text is leading to a conclusion about how choreographers use dramaturges."},{"i":"93cad661","c":"infer","d":"E","s":"A main goal of the Association for the Advancement of Creative Musicians (AACM), an arts organization founded in 1965, is to advance new works by Black musicians. The AACM achieves this goal in part by focusing on young artists. By having established musicians and composers serve as mentors, the AACM gives young artists the benefits of expert technical training and creative guidance. Numerous organizations offer similar kinds of support to new generations of painters, writers, and other artists, suggesting that ______ Which choice most logically completes the text?","o":["artists of all ages benefit more from technical training than from creative guidance.","many arts organizations recognize the importance of providing opportunities for young artists to learn from experienced mentors.","most established artists could become even better artists by serving as mentors.","finding a mentor is more important for musicians than it is for painters, writers, and other types of artists."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the relationship between the AACM’s use of mentors to support young Black musicians and similar support that other organizations offer their young artists. According to the text, in service of AACM’s goal to support new works by Black musicians, AACM mentors provide beneficial training and guidance to young artists. The text goes on to say that many other art organizations support new artists in similar ways, suggesting that these organizations recognize the importance of providing opportunities for young artists to learn from mentors who are established in their field. Choice A is incorrect because the text gives no indication that technical training is more beneficial than creative guidance. The text states that AACM mentors offer both technical training and creative guidance to young artists and that other arts organizations offer similar kinds of support; however, nothing in the text suggests that young artists, or artists of any age, benefit more from technical training. Choice C is incorrect because the text is mainly concerned with the fact that established artists are mentoring young artists through AACM and other arts organizations. The text states that young musicians benefit from AACM mentors but does not address what mentors gain from the relationship, so there is no reason to conclude that most established artists could improve as artists by serving as mentors. Choice D is incorrect. Although the text indicates that mentors are beneficial to young musicians and that young people pursuing other kinds of art (including painting and writing) can also find mentors through arts organizations, the text gives no indication that mentors are more important for musicians than for other types of artists."},{"i":"94ca8ebd","c":"claim","d":"M","s":"A student is examining a long, challenging poem that was initially published in a quarterly journal without explanatory notes, then later republished in a stand-alone volume containing only that poem and accompanying explanatory notes written by the poet. The student asserts that the explanatory notes were included in the republication primarily as a marketing device to help sell the stand-alone volume.\n\nWhich statement, if true, would most directly support the student’s claim?","o":["The text of the poem as published in the quarterly journal is not identical to the text of the poem published in the stand-alone volume.","Many critics believe that the poet’s explanatory notes remove certain ambiguities of the poem and make it less interesting as a result.","The publishers of the stand-alone volume requested the explanatory notes from the poet in order to make the book attractive to readers who already had a copy of the poem in a journal issue.","Correspondence between the poet and the publisher reveals that the poet’s explanatory notes went through several drafts."],"a":2,"r":"Choice C is the best answer because it would most directly support the student’s claim about the motivation for including explanatory notes with the stand-alone volume of the poem. The text explains that the poem had previously been published without the notes in a quarterly journal. It stands to reason that readers who had purchased the journal issue containing the poem would be unlikely to purchase an unchanged version of the poem in a stand-alone volume. However, the inclusion of notes in that volume would encourage the purchase of a stand-alone volume, since the later text would differ from the original by including the author’s own explanation of the poem. Therefore, if it were true that the publishers of the stand-alone volume had requested the notes to make the book attractive to readers who already had a copy of the journal issue, this fact would support the student’s claim that the notes were included primarily as a marketing device. Choice A is incorrect because the student’s claim is about the motivation for including the explanatory notes in the stand-alone volume, not about changes that might have been made to the poem itself for publication in that volume; moreover, the text never suggests that such changes were made. Choice B is incorrect because the student’s claim is about why the explanatory notes were included in the stand-alone volume, not about how the notes affected readers’ and critics’ subsequent experience of the poem. Choice D is incorrect because the fact that the poet drafted multiple versions of the explanatory notes doesn’t directly address the issue of whether the notes were intended as a marketing device, as the student claims; the correspondence would support this claim only if it showed that the poet had revised the notes specifically to make them useful to the marketing of the stand-alone volume."},{"i":"85439572","c":"claim","d":"E","s":"Roasted green chiles are a popular ingredient in Southwestern cuisine, but the traditional roasting method of burning propane is not environmentally friendly. To see if solar power could provide a better alternative, engineer Kenneth Armijo and his team roasted batches of green chiles using between 38 and 42 heliostats, which are devices that concentrate sunlight. The team was successful in reaching the same roasting temperature used in traditional propane roasting, but they found that propane yielded faster results. While the fastest solar-roasted green chiles took six minutes, batches using propane took only four. Armijo hypothesizes that they can reduce the roasting time for solar-roasted green chiles by using more heliostats.\n\nWhich finding, if true, would most directly support Armijo’s hypothesis?","o":["The temperature inside the roasting drum is distributed more evenly when roasting green chiles with solar power than with propane.","Attempts to roast green chiles using 50 heliostats yields results in fewer than six minutes.","Green chile connoisseurs prefer the flavor of solar-roasted green chiles over the flavor of propane-roasted green chiles.","The skins of solar-roasted green chiles are easier to peel than the skins of propane-roasted green chiles."],"a":1,"r":"Choice B is the best answer. Armijo believes that using more heliostats will speed up the roasting process, and this finding shows that with 50 heliostats—more than the number of heliostats already used—the roasting time is indeed reduced. Choice A is incorrect. The evenness of temperature in the roasting drum doesn’t tell us about the speed of the roasting process, which is what Armijo’s hypothesis is concerned with. Choice C is incorrect. Armijo’s hypothesis is focused on the speed of the roasting process, not the flavor of the resulting roasted chiles. Choice D is incorrect. Though Armijo’s hypothesis mentions a benefit of solar-roasting green chiles (easier peeling), it doesn’t address the speed of the roasting process."},{"i":"11c00ab9","c":"graph","d":"E","s":"","o":["0.35.","0.61.","0.75.","0.52."],"a":2,"r":"Choice C is the best answer because it effectively uses data from the table to complete the example of the estimated impact of invasive mongooses on threatened mammals. The table shows the values for the estimated harmful impact of three invasive predator species (mongooses, dogs, and cats) on threatened birds, mammals, and reptiles. The text states that the values are on a scale from 0.25 (less impact) to 1.00 (greater impact). The table shows that the value for the estimated impact of invasive mongooses on threatened mammals is 0.75. Choice A is incorrect because the table shows that the value for the estimated impact of mongooses on threatened mammals is 0.75, not 0.35. The value 0.35 is not assigned to any of the categories in the table. Choice B is incorrect because the table shows that 0.61 is the value for the estimated impact of cats, not mongooses, on threatened mammals. Choice D is incorrect because the table shows that 0.52 is the value for the estimated impact of cats on threatened reptiles, not of mongooses on threatened mammals."},{"i":"5ff1ba73","c":"graph","d":"E","s":"","o":["there were 49 guilds in Bordeaux but 72 guilds in Lyon despite the two cities having nearly equal numbers of inhabitants.","Lyon had far fewer inhabitants than Paris did but had many more guilds.","there was one guild for every 661 inhabitants in Rouen but one guild for every 4,511 inhabitants in Paris.","Paris had 133 guilds and 600,000 inhabitants, or one guild for every 4,511 inhabitants."],"a":2,"r":"Choice C is the best answer. The claim we’re trying to prove is that guilds were much more numerous relative to population in some cities than others. This choice describes the guilds per number of inhabitants in two cities (Rouen and Paris), showing significant differences between guilds relative to population in these cities. Choice A is incorrect. This choice misreads the table. Bordeaux had 80,000 inhabitants, according to the table, while Lyon had 143,000, so it isn’t correct to say that they had \"nearly equal numbers of inhabitants.\" Lyon had almost twice as many inhabitants. Choice B is incorrect. This choice misreads the table. Although Lyon did have fewer inhabitants than Paris, it didn’t have more guilds—Paris had 133 guilds versus Lyon’s 72. Choice D is incorrect. This choice doesn’t support the claim. To show that guilds were more numerous relative to population in some cities than others, we would need to compare at least two cities, and this choice only mentions one."},{"i":"12bd5b75","c":"fss","d":"E","s":"With its towering, six-spired exterior of granitelike quartz monzonite, the Salt Lake Temple is one of the most instantly recognizable structures in the state of Utah. However, many people do not know that ______ built over the course of forty years, with construction beginning in 1853 and ending in 1893.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["it was","one was","they were","both were"],"a":0,"r":"Choice A is the best answer. The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"the Salt Lake Temple.\" Choice B is incorrect because the singular pronoun \"one\" is ambiguous in this context; the resulting sentence leaves unclear whether there is only one Salt Lake temple or multiple. Choice C is incorrect because the plural pronoun \"they\" doesn’t agree in number with the singular antecedent \"the Salt Lake Temple.\" Choice D is incorrect because the plural pronoun \"both\" doesn’t agree in number with the singular antecedent \"the Salt Lake Temple.\""},{"i":"d2cf0e11","c":"fss","d":"M","s":"Inventor John Friedman created a prototype of the first flexible straw by inserting a screw into a paper straw and, using dental floss, binding the straw tightly around the ______ When the floss and screw were removed, the resulting corrugations in the paper allowed the straw to bend easily over the edge of a glass.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["screw’s thread’s.","screws’ threads.","screw’s threads.","screws threads’."],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of plural and possessive nouns. The singular possessive noun “screw’s” and the plural noun “threads” correctly indicate that there is only one screw and it has multiple threads. Choice A is incorrect because the context requires the plural noun “threads,” not the singular possessive noun “thread’s.” Choice B is incorrect because the context requires the singular possessive noun “screw’s,” not the plural possessive noun “screws’.” Choice D is incorrect because the context requires the singular possessive noun “screw’s” and the plural noun “threads,” not the plural noun “screws” or the plural possessive noun “threads.’”"},{"i":"856b495d","c":"fss","d":"E","s":"In the early twentieth century, Joseph Kekuku and other Hawaiian ______ in the mainland United States to the bright and lilting sound of the kīkā kila, or Hawaiian steel guitar. The instrument soon became a fixture in American blues and country music.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["musicians introduced audiences","musicians’ introduced audiences’","musician’s introduced audience’s","musicians’ introduced audiences"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of plural nouns. The plural nouns \"musicians\" and \"audiences\" correctly indicate that there were multiple musicians introducing the music to multiple audiences. Choice B is incorrect because the context requires the plural nouns \"musicians\" and \"audiences,\" not the plural possessive nouns \"musicians’\" and \"audiences’.\" Choice C is incorrect because the context requires the plural nouns \"musicians\" and \"audiences,\" not the singular possessive nouns \"musician’s\" and \"audience’s.\" Choice D is incorrect because the context requires the plural noun \"musicians,\" not the plural possessive noun \"musicians’.\""},{"i":"626a1642","c":"bound","d":"H","s":"As a behavioral economist, Katy Milkman of the University of Pennsylvania recognizes that people sometimes make irrational economic decisions. Milkman’s research can thus address anomalies that neoclassical economic ______ assume that people are consistently rational decision-makers—cannot explain.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["models—which","models, which","models which","models which—"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of punctuation within a sentence. The dashes after \"models\" and \"decision- makers\" correctly separate the supplementary element \"which assume that people are consistently rational decision-makers\" from the rest of the sentence. This punctuation indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice B is incorrect because a comma can’t be paired with a dash in this way to separate the supplementary element from the rest of the sentence. Choice C is incorrect because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence. Choice D is incorrect because it interrupts the sentence at an illogical and grammatically incoherent point. The dash should be placed before \"which,\" not after it, to mark the beginning of the supplementary element."},{"i":"0f39b19c","c":"bound","d":"M","s":"After a spate of illnesses as a child, Wilma Rudolph was told she might never walk again. Defying all odds, Rudolph didn’t just walk, she ______ the 1960 Summer Olympics in Rome, she won both the 100- and 200-meter dashes and clinched first place for her team in the 4x100-meter relay, becoming the first US woman to win three gold medals in a single Olympics.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["ran—fast—during","ran—fast during","ran—fast, during","ran—fast. During"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (“Defying…fast”) and another sentence that begins with a supplementary phrase (“During…Olympics”). Choice A is incorrect. When a dash is present in a sentence (“ran—fast”), it’s not conventional to use another dash (“fast—during”) to mark the boundary between sentences because it creates a potentially confusing sentence. In this context, a period, semicolon, or colon would be clear and more conventional. Choice B is incorrect because it results in a run-on sentence. The sentences (“Defying…fast”) and (“during…Olympics”) are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences."},{"i":"9336f63b","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: A small number of US Navy sailors of Filipino descent served during the US Civil War (1861–1865). Stephen Amos was born in the Philippines around 1830. He enlisted in the US Navy in November 1863. Raphael Ignases was born in the Philippines around 1834. He enlisted in the US Navy in July 1861. The student wants to emphasize the historical significance of Stephen Amos’s enlistment date.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Both Stephen Amos and Raphael Ignases were US Navy sailors of Filipino descent, but Amos enlisted in the Navy in 1863, two years later than Ignases.","Stephen Amos was a US Navy sailor of Filipino descent, along with Raphael Ignases, who was born in the Philippines around 1834.","Stephen Amos enlisted in the US Navy in 1863, making him one of the few sailors of Filipino descent to serve in the US Civil War (1861–1865).","When Stephen Amos enlisted in the US Navy in November 1863, he joined sailors such as Raphael Ignases, who had been born in the Philippines around 1834."],"a":2,"r":"Choice C is the best answer. Noting the time frame of the US Civil War and the fact that Amos enlisted during this time frame, the sentence emphasizes that Amos’s enlistment date places him among the historically significant group of US Navy sailors of Filipino descent who served during the Civil War. Choice A is incorrect. The sentence identifies Amos and Ignases and notes that Amos’s enlistment date was later than Ignases’s; the sentence doesn’t explain the historical significance of the date. Choice B is incorrect. The sentence identifies Amos and Ignases as US Navy sailors of Filipino descent, noting Ignases’s birth year; the sentence doesn’t provide Amos’s enlistment date or its historical significance. Choice D is incorrect. The sentence provides Amos’s enlistment date and mentions that he served alongside a sailor of Filipino descent; it doesn’t explain the historical significance of the date."},{"i":"4223d4a6","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In 1965, Yale University historians claimed that a world map called the Vinland Map was drawn in the fifteenth century. Since that time, the map’s age has been the subject of debate. In 2021, researchers conducted a study to analyze the elemental composition of the map’s ink. Their analysis revealed that the ink contains a titanium compound not used in inks until the 1920s. The researchers concluded that the map was drawn in the twentieth century. The student wants to present the study and its findings.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Given the debate about the Vinland Map’s age, researchers in 2021 conducted a study to analyze the elemental composition of the map’s ink.","A 2021 study of the Vinland Map’s ink revealed that it contains a titanium compound not used in inks until the 1920s, indicating that the map was drawn in the twentieth century.","The Vinland Map, believed by some to have been drawn in the fifteenth century, was the focus of a 2021 study.","Aware that a certain titanium compound was not used in inks until the 1920s, researchers in 2021 studied the elemental composition of the Vinland Map’s ink."],"a":1,"r":"Choice B is the best answer. The sentence effectively presents the study and its findings, providing relevant information: a 2021 study of the Vinland Map found that the map’s ink contains a compound not used in inks until the twentieth century. Choice A is incorrect. While the sentence introduces the study, it does not present the study’s findings. Choice C is incorrect. While the sentence mentions the study, it does not effectively present the study or its findings. Choice D is incorrect. While the sentence introduces the study, it does not present the study’s findings."},{"i":"1ccfcea4","c":"trans","d":"E","s":"The French directors Colas Koola and Vivien Mermet-Guyenet (known as Koola and Viv) founded the video game studio BlueTwelve. They also love cats. ______ they created an award-winning cat video game, Stray (2021), that lets the player explore a dystopian city from the perspective of a clever orange house cat.\n\nWhich choice completes the text with the most logical transition?","o":["Intermittently,","On the other hand,","In fact,","Nevertheless,"],"a":2,"r":"Choice C is the best answer. \"In fact\" logically signals that the information in this sentence about the creation of the video game offers additional emphasis in support of the previous claim that video game studio founders Koola and Viv love cats. Choice A is incorrect because \"intermittently\" illogically signals that the information in this sentence occurs sporadically or in intervals. Instead, the creation of the video game offers additional emphasis in support of the previous claim about Koola and Viv. Choice B is incorrect because \"on the other hand\" illogically signals that the information in this sentence contrasts with the previous claim about Koola and Viv. Instead, the creation of the video game offers additional emphasis in support of that claim. Choice D is incorrect because \"nevertheless\" illogically signals that the information in this sentence is true despite the previous claim that Koola and Viv love cats. Instead, the creation of the video game offers additional emphasis in support of that claim."},{"i":"f33f0892","c":"trans","d":"E","s":"Although novels and poems are considered distinct literary forms, many authors have created hybrid works that incorporate elements of both. Bernardine Evaristo’s The Emperor’s Babe, ______ is a verse novel, a book-length narrative complete with characters and a plot but conveyed in short, crisp lines of poetry rather than prose.\n\nWhich choice completes the text with the most logical transition?","o":["by contrast,","consequently,","secondly,","for example,"],"a":3,"r":"Choice D is the best answer. “For example” logically signals that the information in this sentence—that The Emperor’s Babe is a novel conveyed in lines of poetry—exemplifies the claim in the previous sentence about hybrid works that incorporate elements of both novels and poems. Choice A is incorrect because “by contrast” illogically signals that the information in this sentence contrasts with the claim about hybrid works in the previous sentence. Instead, the information demonstrates that Evaristo’s novel is an example of a hybrid work. Choice B is incorrect because “consequently” illogically signals that the information in this sentence is a consequence, or result, of the claim about hybrid works in the previous sentence. Instead, the information demonstrates that Evaristo’s novel is an example of a hybrid work. Choice C is incorrect because “secondly” illogically signals that the information in this sentence is a second, separate claim from the previous sentence’s claim about hybrid works. Instead, the information demonstrates that Evaristo’s novel is an example of a hybrid work."},{"i":"c7e85c0a","c":"trans","d":"E","s":"The envelope-shaped paper bags common in the US 150 years ago were impractical for carrying goods. ______ because they were the only paper bags that could be mass-produced, these bags dominated the market. That all changed in the 1870s, when industrial designer Margaret Knight patented a machine to make flat-bottomed, foldable paper bags.\n\nWhich choice completes the text with the most logical transition?","o":["However,","For instance,","Thus,","In other words,"],"a":0,"r":"Choice A is the best answer. “However” logically signals that the information in this sentence—that envelope-shaped bags dominated the market —contrasts with the previous claim that these bags were impractical for carrying goods. Choice B is incorrect because “for instance” illogically signals that the information in this sentence is an example supporting the previous claim that envelope-shaped bags were impractical for carrying goods. Instead, the sentence contrasts with the previous claim about the bags. Choice C is incorrect because “thus” illogically signals that the information in this sentence is a result of the previous claim that envelope-shaped bags were impractical for carrying goods. Instead, the sentence contrasts with the previous claim about the bags. Choice D is incorrect because “in other words” illogically signals that the information in this sentence is a paraphrase of the previous claim that envelope-shaped bags were impractical for carrying goods. Instead, the sentence contrasts with the previous claim about the bags."}],"img":{"11c00ab9":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEwBAMAAACnDr9OAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABFTElEQVR42u1dd3xURdd+5m5Jz567Cb3kJiQgILChSWdDUYrChiYgJXRQyiIKCKgBRLosVZqygHSEUER6FkR4pS69JtnQgpBk74aatvf7I4WQAgRYX/zefX4/JTt3ypln2jln5s4FnHDCCSeccMIJJ/4x8GoCANAzoSwYrKAU72ueicwyfzB1VqhvzsdqyhMz+xHv75t/EeUAtQAGgFXPSJpHQqDcMwEyDZj6aVGc9m0gl8EetRVAgDI8K0gDAMwCb92zMQkgAsB2C0pTjgcumSm9Ey5n1tebnpIhj7qQHdNVDxBYVruxfdLVsTnaOUeeUyFPv6bpCgBnAQBeJniK2URnZF71GXpdDdT22qHMvAWPQHPe9vhv4Dog03JH1EJwE04DhVa5g8oJrOkBeOvUNVgoCwiBPASyYLetrAkDfAXlb1CaOF8hAP5cE9Qkzp+YJlAgL21pQ7DGVwN5FQrUuGynmsQFwCusga56E3AhKEcccVrUzOhpAaEA1uHTQHDVuSaQVefWa+QargghEKgxFXKziyWAC2Sh51goAK8kVBHRFAGBaILgJpwWvpoy8BUIUPijegiT1w3HJ2wo5BpWTqP4Uy43c01YoOZ12ZG/bgZWYKr34fKBXSslda5W91D0X03lq+9O7awC8ElVu9q6ONb6mSrmw2qxtUoMahQuW53Quzk9gsf8EmsXztmliZ3k0bRP6Wm+i+596GWJ56evWpTecMeD/quvfdFM+f3dAb9VlISVVRbfsJfSJU2+NkJ/T3v+++SPMEU1ek3SKVEE5AMU+/st/sjeoOpXNYSxniO7v9d81d+d5gujAFg+WL6taeeyJVr5GSA9Rk+xSucqUY2r3PD+LPZj4cDqxAWPVnnVB1bbB66+YW3tcx2QIvhdaY0Pnw4NKuYm1uvKBni0/m/33vjjvR64an50Nd4ufr0ar2vLbfPSTltf1Axv3eIiD8uE3yxtHO41/GGJyYa2svEoubyn7yG4mLw1//FWmNt7LIro777c/JFX2GB4tRs6/Ka7oZHrgTYyXU/ZtrJhS716QXZiAs6XNJ13WzJnrLvhhue4sC/gk1R2+I0yeqL1GFLO1l246Wbs7WGYqjSX6RZ82E84UjVkF+Spp7SDvcJn+lxvKx8PeH5NR8zl5WL3gDg305HiN6r569s0dDN1AlhYw5AbpYc/KBWONv2PuURUVZ5uXGObV5D5iPJ38wevyw73uhkkjz41dbElEYhP3B+tqmJQxQgzQt3vASB7/PF4Me1vOnYGe+O+Ne8+P4uwbGMbOwCV+bS9ieniH26V79mtD0tLY/XAqGKGNPbhMtlmU3rDb3GyrNEobKb0Dypr4u/eKHZI2PQ9kkocdBt7nL+/Ka5JQiJEEfCKsnjffPKbePkQJbDSW3HKRhv8VJGRwOWvwuwwpiXEHju7DGD7OyZQ7GXRHn3PLqYlnohWeY0XUtNTGCTPOUhP5PbGE2zK8ty7y/nIY34x8LMof/eKr8j+2/Te23v6l2MakiAyYo9q9gTZvu/McwBEcCpGNtgW1SMNY8IT3RYxSeBPAxKIrE/mG5a29G4xitGUVgGjOgEDx5KF/uwISK6+elTjoAKJ78T30BHT3O04nADb435L6062QiNLhEQMEsA40e7Wz7D4A2K43SEWFr8B3QgMiN+l40FqqOJClgO4O2oz9a0NYlzGkvWgQxuLV79PJMj7f0gioGEiec67yc73sxIjHhbevf+QTq2k/za9RWpWP2gRHvAkgIjUoTafhBD/C7UIAJP8ma3IexZVbSmu3tfqwV7+SGsaeoYxkA3+6X4Wvpi7/hzEg15XewWBWWE function card(q,n){const a=ans[q.i];
