<script>
const D={"t":"Practicetest50","q":[{"i":"cd2ce51f","c":"vocab","d":"M","s":"Like the 1945 play it reimagines—Federico García Lorca’s The House of Bernarda Alba—Marcus Gardley’s 2014 play The House That Will Not Stand prominently features women. In both plays, the all-female cast ______ an array of female characters, including a strong mother and several daughters dealing with individual struggles.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["engulfs","encourages","comprises","provokes"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Gardley’s play. In this context, “comprises” means constitutes or makes up the totality of, and the text indicates that The House That Will Not Stand had an “all-female cast” that stands in some relationship to “an array of female characters” in the play. Because all cast members are female, the characters must be played by these female cast members; therefore the cast constitutes, or comprises, the collection of characters. Choice A is incorrect. In this context, “engulfs” would mean encloses or overwhelms, and although it is fairly common to describe an actor as embodying (or personifying realistically) a character, there is nothing in the text to suggest that the cast members enclosed or overwhelmed the characters they played. Choice B is incorrect because in this context, “encourages” would mean inspires with courage or hope. Although the text does mention “a strong mother and several daughters dealing with individual struggles,” which might suggest that there are moments of encouragement among the characters during the play, there is nothing to suggest that the cast members encouraged the characters they portrayed. Choice D is incorrect because, in this context, “provokes” would mean instigates or incites to anger. Nothing in the text addresses provocation or what it might mean for actors to provoke the characters they are playing."},{"i":"c2c26e20","c":"vocab","d":"E","s":"The following text is adapted from Sadakichi Hartmann’s 1894 short story “Magnolia Blossoms.”The narrator is standing on the deck of a boat. What a night it was! My soul had left its body to lose itself in the wild unrestrained beauty around me—from where it came—and only left a trembling suggestion of its existence within me. The other passengers moved around me like shadows, and again and again my eyes drank in all the glory and wealth of that night.\n\nAs used in the text, what does the word “suggestion” most nearly mean?","o":["Trace","Opinion","Dispute","Command"],"a":0,"r":"Choice A is the best answer because as used in the text, “suggestion” most nearly means trace. The text portrays the narrator standing on the deck of a boat, admiring the view of nature afforded by this position: “My soul had left its body to lose itself in the wild unrestrained beauty around me,” says the narrator, “and only left a trembling suggestion of its existence within me.”This intense response to beauty is such that the narrator’s soul seems to disengage from its body, leaving behind only a barely detectible indication of its presence there. In other words, the narrator senses only a trace of soul left in the body. Choice B is incorrect. Although in some contexts “suggestion” can refer to an implied or indirectly expressed opinion, the text doesn’t portray the narrator expressing an opinion; instead, the narrator is explaining an experience of intense emotion. Choice C is incorrect. While “suggestion” might be used in some contexts to refer to the tactful expression of a differing viewpoint, it doesn’t refer to the dispute or difference of opinion itself. Moreover, the text doesn’t portray a dispute between characters with differing viewpoints. Choice D is incorrect. Although in some contexts, “suggestion” might be used to refer to a politely worded command, the text doesn’t portray a scenario in which someone receives such a command."},{"i":"dd19befa","c":"vocab","d":"H","s":"The familial structure of the black swan (Cygnus atratus) shows tremendous ______: breeding pairs with demonstrated success in rearing cygnets (young swans) have been observed to foster those of less successful pairs, and while rearing by female-male pairs is most common, male-male pairs sometimes rear cygnets too, achieving a significantly higher rate of survival to adulthood than female-male pairs.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["cohesion","elasticity","affection","reciprocity"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of black swan familial structures. In this context, “elasticity” means flexibility or adaptability. The text provides examples of flexible family arrangements among black swans: successful male- female breeding pairs are known to foster other pairs’ cygnets, and while they are less common, male-male pairs also successfully rear cygnets. This context therefore emphasizes the flexibility or elasticity of black swan familial structures, showing how this trait contributes to the success of the species. Choice A is incorrect. Although close family units may show “cohesion,” which refers to unity or harmony within a group, the text’s focus is on the variety and adaptability of black swan family structures. The examples given—fostering other pairs’ cygnets and forming male-male as well as female-male pairs—highlight flexibility rather than cohesion, emphasizing family structures that vary from the model in which a breeding pair raises its own young. Choice C is incorrect. While “affection,” or fondness, might be present in black swan relationships, the text doesn’t focus on emotional bonds but rather on the structural flexibility of black swan familial arrangements. The examples provided demonstrate adaptable breeding and rearing practices rather than affectionate behaviors. Choice D is incorrect because “reciprocity” would suggest mutual exchange or cooperation between parties. Although the text mentions the fostering of cygnets by different successful breeding pairs, it doesn’t establish that this is based on reciprocal exchanges. The focus is instead on the flexibility of family structures and the effectiveness of these varied structures in rearing young."},{"i":"b5898291","c":"vocab","d":"E","s":"The equipment from the Apollo Moon landings (1969–1972), such as radiation detectors and temperature probes, remains there to this day, but the data from these missions were mostly inaccessible until a recent data-transfer project made them ______. This project has allowed researcher Seiichi Nagihara to make use of the information in investigating temperature changes on the Moon.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["predictable","complicated","representative","available"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of how a data-transfer project affected data from equipment from the Apollo Moon landings. In this context, \"available\" means accessible or able to be used. The text explains that the Apollo equipment is still on the Moon, but the data it collected \"were mostly inaccessible\" until a data-transfer project was undertaken. The text then states that this project allowed a researcher to use the information that has been collected. This context makes it clear that the project made previously inaccessible data available, or accessible. Choice A is incorrect because saying that a project made data from the Apollo equipment on the Moon \"predictable\" would mean that the data could be known or declared in advance, and it’s not clear how that would be achieved, particularly with data that had been \"mostly inaccessible\" before the project. Rather than suggesting that the data-transfer project made the data predictable, the text conveys that it made the data available to be used as sources of information. Choice B is incorrect because the sentence indicates that data from the Apollo equipment on the Moon were \"mostly inaccessible\" until a recent data-transfer project did something to them, after which a researcher was able to make use of the data. This context conveys that the project made the data accessible and usable, not that it made them \"complicated,\" or complex or difficult to understand. Choice C is incorrect. In this context, \"representative\" would mean either standing as a symbol of something or serving as a typical example from a group, and the text gives no indication that data retrieved from the Apollo equipment on the Moon was merely an example or symbolic. Rather, the text focuses on the availability and usefulness of the data, indicating that a data-transfer project enabled a researcher to use data that had previously been \"mostly inaccessible.\""},{"i":"e5da61f1","c":"purpose","d":"E","s":"The following text is adapted from Charles Chesnutt’s 1899 short story “Mars Jeems’s Nightmare.”The narrator and his wife have recently moved to the southern United States, and Julius is their carriage driver. Julius [was] very useful when we moved to our new residence. He had a thorough knowledge of the neighborhood, was familiar with the roads and the watercourses, knew the qualities of the various soils and what they would produce, and where the best hunting and fishing were to be had. He was a marvelous hand in the management of horses and dogs.\n\nWhich choice best states the main purpose of the text?","o":["To compare the narrator’s reaction to a new home with his wife’s reaction","To give an example of Julius’s knowledge about soil","To show that the narrator and Julius often hunt and fish together","To explain different ways in which Julius was helpful"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain different ways in which Julius was helpful. The text begins with the narrator stating that Julius was very helpful to him and his wife when they moved to their new residence. The narrator then provides a list of examples to illustrate Julius’s helpfulness. For instance, the narrator states that Julius was familiar with the neighborhood’s roads, which suggests that he was helpful in navigating them, and that Julius helped manage the horses and dogs. The text’s many examples of Julius’s usefulness reinforce just how helpful he was and in how many different ways. Choice A is incorrect because the text doesn’t portray either the narrator’s or his wife’s reaction to their new home. Rather, the text focuses on how Julius was useful to the narrator and his wife in their new home. Choice B is incorrect. Although the text states that Julius was knowledgeable about the soil, this is one of several supporting details that illustrate how helpful Julius was. Moreover, the text merely states that Julius was knowledgeable about soil; it doesn’t provide an example of that knowledge. Choice C is incorrect because there’s nothing in the text to suggest the frequency with which the narrator and Julius hunted and fished together. In fact, it’s unclear from the text whether the narrator and Julius hunted and fished together at all. The text merely indicates that Julius knew the best places to hunt and fish—a detail that supports the text’s main purpose by conveying Julius’s usefulness."},{"i":"be947479","c":"purpose","d":"E","s":"Jazz tap is a dance form that was first developed in African American communities. Jazz tap was heavily influenced by jazz music, which became widely popular in the United States in the 1920s. Tap dancers were inspired by jazz music’s quick rhythms and by the way jazz musicians would make up melodies as they played. As jazz music continued to develop in the 1930s and 1940s, jazz tap evolved with it. Because of jazz music’s influence, jazz tap quickly developed into a dance form that was very different from earlier kinds of tap dance.\n\nWhich choice best states the main purpose of the text?","o":["It explains why audiences prefer some kinds of music over others.","It discusses the development of a dance form.","It describes how to play a musical instrument.","It emphasizes the popularity of a famous dancer."],"a":1,"r":"Choice B is the best answer because it best describes the main purpose of the text. The text indicates where and when jazz tap first developed (in African American communities in the 1920s) and what influenced it (the quick rhythms and improvisations in jazz music) and then explains that it evolved alongside jazz music in the 1930s and 1940s, resulting in a very different form of tap dance than had existed before. Therefore, the main purpose of the text is to discuss jazz tap’s development. Choice A is incorrect. Although the text indicates that jazz music became widely popular in the US in the 1920s and describes some of jazz music’s qualities, the text never explains why audiences prefer some kinds of music—jazz or otherwise—over others. Choice C is incorrect because the text never mentions any musical instruments and doesn’t describe how to play one. Choice D is incorrect because the text discusses jazz tap generally and never identifies a particular dancer, famous or otherwise."},{"i":"570970cd","c":"func","d":"H","s":"The following text is adapted from Indian Boyhood, a 1902 memoir by Ohiyesa (Charles A. Eastman), a Santee Dakota writer. In the text, Ohiyesa recalls how the women in his tribe harvested maple syrup during his childhood. Now the women began to test the trees—moving leisurely among them, axe in hand, and striking a single quick blow, to see if the sap would appear. <u>The trees, like people, have their individual characters; some were ready to yield up their life-blood, while others were more reluctant.<\/u> Now one of the birchen basins was set under each tree, and a hardwood chip driven deep into the cut which the axe had made. From the corners of this chip—at first drop by drop, then more freely—the sap trickled into the little dishes.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It portrays the range of personality traits displayed by the women as they work.","It foregrounds the beneficial relationship between humans and maple trees.","It demonstrates how human behavior can be influenced by the natural environment.","It elaborates on an aspect of the maple trees that the women evaluate."],"a":3,"r":"Choice D is the best answer because it best describes the function of the underlined sentence in the text’s overall portrayal of how the women in Ohiyesa’s tribe harvested maple syrup. The text states that the women used an axe to strike the maple trees in order to find out which ones would produce sap. The underlined sentence compares the trees to people, with the sap described as the trees’ “life-blood.” Some of the trees are ready to give out their sap, while others are unwilling to do so. Using personification, the sentence provides greater detail about the aspect of the maple trees—their potential to give sap—that the women are evaluating. Choice A is incorrect because the personalities of the women are not discussed in the text. Although the underlined sentence does mention “individual characters,” this reference is not to the women in the text but rather to the maple trees, which the sentence compares to people with individual character traits. Choice B is incorrect because the underlined sentence focuses on the trees’ willingness or refusal to yield sap, not on the beneficial relationship between the women and the trees. Additionally, although the text does suggest that the women and their tribe benefit from the maple trees since the trees allow the women to harvest syrup, there is nothing in the text to suggest that the trees benefit from this relationship in turn. Choice C is incorrect because the underlined sentence is comparing maple trees to humans, not addressing the influence of the natural environment on how the actual humans in the text, the women, behave."},{"i":"4c4db685","c":"func","d":"M","s":"On painter William H. Johnson’s return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. <u>Turning away from landscapes painted in an expressionist style—a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist’s subjective experience of reality—Johnson began painting portraits of Black Americans in a bold new way.<\/u> Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It elaborates on the previous sentence’s statement about a transitional moment in Johnson’s artistic career.","It provides information about Johnson’s travels in support of a claim about his artistic influences, which is advanced in the following sentence.","It recounts a moment in Johnson’s personal life that enabled the success of his subsequent career, which is summarized in the following sentence.","It presents evidence that calls into question the previous sentence’s characterization of Johnson’s artistic development."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined sentence in the text as a whole. The first sentence of the text indicates that Johnson returned to the US in 1938 at which time his painting style suddenly changed. The second sentence is underlined and gives more detail about this stylistic change, noting that his earlier work consisted largely of landscapes in an expressionist style and his new works were highly stylized portraits of Black Americans. In other words, the function of the underlined sentence is to elaborate on a transitional moment in Johnson’s painting career. Choice B is incorrect. Although the text does mention that Johnson spent a decade in Europe, it does not discuss what other travel Johnson might have done. Furthermore, although the text mentions African, American, and Scandinavian artistic elements in Johnson’s work, it does not indicate that he traveled to different locations to learn about these practices. Choice C is incorrect because the text does not focus on Johnson’s personal life nor does it address how successful his career was in general. Choice D is incorrect because, rather than call it into question, the underlined sentence continues the discussion of Johnson’s career by adding further relevant detail of Johnson’s artistic transformation."},{"i":"f1c9d2c1","c":"cross","d":"M","s":"Text 1 Stage lighting theorist Adolphe Appia was perhaps the first to argue that light must be considered alongside all the various elements of a stage to create a single, unified performance. Researcher Kelly Bremner, however, has noted that Appia lacked technical expertise in the use of light in the theater. As a result of Appia’s inexperience, Bremner argues, Appia’s theory of light called for lighting practices that weren’t possible until after the advent of electricity around 1881.\n\nText 2 Adolphe Appia was not an amateur in the practice of lighting. Instead, it is precisely his exposure to lighting techniques at the time that contributed to his theory on the importance of light. When working as an apprentice for a lighting specialist in his youth, Appia observed the use of portable lighting devices that could be operated by hand. This experience developed his understanding of what was possible in the coordination of elements on the stage.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the claim about Appia’s level of technical expertise made by Bremner in\n\nText 1?","o":["Many lighting technicians dismissed Appia’s ideas about light on the stage.","Appia likely gained a level of technical expertise during his time as an apprentice.","Theater practitioners who worked with Appia greatly admired his work.","Appia was unfamiliar with the use of music and sound in theater."],"a":1,"r":"Choice B is the best answer. The author of Text 2 directly contradicts Bremner’s claim that Appia lacked technical expertise by stating that Appia was “not an amateur in the practice of lighting.” His experience as a lighting specialist’s apprentice would have, the author of Text 2 argues, allowed Appia to “[develop] his understanding of what was possible” with the elements of theatrical design. Choice A is incorrect. Neither text describes how other lighting technicians responded to Appia’s ideas. Furthermore, this claim isn’t relevant to Bremner’s evaluation of Appia’s technical expertise. Choice C is incorrect. Neither text mentions anything about the opinions of theater practitioners who worked with Appia, so this answer choice does not relate to the claim about Appia’s level of technical expertise made by Bremner in Text 1. Choice D is incorrect. Neither text mentions anything about Appia’s familiarity with or ignorance of the use of music and sound in theater. Both focus on his expertise (or lack thereof) in lighting."},{"i":"409058ee","c":"main","d":"M","s":"To protect themselves when being attacked, hagfish—jawless marine animals that resemble eels—will release large quantities of slimy, mucus- like threads. Because these threads are unusually strong and elastic, scientist Atsuko Negishi and her colleagues have been trying to recreate them in a lab as an eco-friendly alternative to petroleum-based fibers that are often used in fabrics. The researchers want to reproduce the threads in the lab because farming hagfish for their slime would be expensive and potentially harmful to the hagfish.\n\nWhich choice best states the text’s main idea?","o":["The slimy threads that hagfish release might help researchers create a new kind of fabric.","Hagfish have inspired researchers to develop a new petroleum-based fabric.","Hagfish are not well suited to being raised in captivity.","The ability of hagfish to slime their attackers compensates for their being jawless."],"a":0,"r":"Choice A is the best answer. The text first describes hagfish slime and its properties, then it transitions to talking about the possibilities of using lab-made equivalents to use in eco-friendly fabrics. Choice B is incorrect. The text says the opposite of this choice. The researchers are developing an alternative to petroleum-based fabric. Choice C is incorrect. This choice is too narrow to be the main point of the text. Only one line describes how farming would be “potentially harmful” to the hagfish. Choice D is incorrect. This choice isn’t supported by the text. We don’t know from the text whether being jawless makes the hagfish more vulnerable."},{"i":"14189fbb","c":"main","d":"H","s":"Having written the impassioned call to arms “Letter to the Spanish Americans” in 1791, Peruvian intellectual Juan Pablo Viscardo y Guzmán is often considered a forerunner for the independence movements in Latin America. But Viscardo’s role in history would have remained insignificant were it not for Venezuelan revolutionary Francisco de Miranda, who was handed the unpublished letter after Viscardo’s death. Miranda not only helped circulate the letter, but his edits and footnotes to the text position Miranda as a central figure in the text’s creation.\n\nWhich choice best states the main idea of the text?","o":["The original authorship of “Letter to the Spanish Americans” is disputed by contemporary historians.","The majority of the most eloquently stated arguments in “Letter to the Spanish Americans” were written by Miranda.","Miranda played a crucial role in influencing the content and distribution of “Letter to the Spanish Americans.”","“Letter to the Spanish Americans” persuaded many people in Latin America to pursue national independence."],"a":2,"r":"Choice C is the best answer. The text describes how Miranda circulated, edited, and added footnotes to “Letter to the Spanish Americans,” and it claims that the letter and its author would have “remained insignificant” if it weren’t for Miranda’s efforts. Choice A is incorrect. The text only says that Viscardo wrote the letter and that Miranda edited it: it never suggests that the original authorship of the letter is up for debate. Choice B is incorrect. This contradicts the text. The text says that Miranda edited and footnoted the letter, but it identifies Viscardo as the letter’s author. It also never identifies certain arguments as more eloquent than others. Choice D is incorrect. This is outside the scope of the text. The paragraph describes Miranda’s role in the creation and distribution of the letter, but it doesn’t get into the effects of the letter on other people."},{"i":"6b8a7c74","c":"infer","d":"H","s":"One recognized social norm of gift giving is that the time spent obtaining a gift will be viewed as a reflection of the gift’s thoughtfulness. Marketing experts Farnoush Reshadi, Julian Givi, and Gopal Das addressed this view in their studies of norms specifically surrounding the giving of gift cards, noting that while recipients tend to view digital gift cards (which can be purchased online from anywhere and often can be redeemed online as well) as superior to physical gift cards (which sometimes must be purchased in person and may only be redeemable in person) in terms of usage, 94.8 percent of participants surveyed indicated that it is more socially acceptable to give a physical gift card to a recipient. This finding suggests that ______ Which choice most logically completes the text?","o":["gift givers likely overestimate the amount of effort required to use digital gift cards and thus mistakenly assume gift recipients will view them as less desirable than physical gift cards.","physical gift cards are likely preferred by gift recipients because the tangible nature of those cards offers a greater psychological sense of ownership than digital gift cards do.","physical gift cards are likely less desirable to gift recipients than digital gift cards are because of the perception that physical gift cards require unnecessary effort to obtain.","gift givers likely perceive digital gift cards as requiring relatively low effort to obtain and thus wrongly assume gift recipients will appreciate them less than they do physical gift cards."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of perceptions of digital versus physical gift cards. The text begins by explaining that the perception of \"the time spent obtaining a gift…as a reflection of the gift’s thoughtfulness\" is a social norm of gift giving. The text then explains that although those who receive digital gift cards view them as easier to use than physical gift cards, a marketing study nonetheless showed that 94.8% of participants found physical gift cards more \"socially acceptable\" to give. The text specifically contrasts the ease with which digital gift cards \"can be purchased online from anywhere\" with the fact that physical gift cards \"sometimes must be purchased in person\"—suggesting the greater difficulty of obtaining physical cards. Given the text’s initial premise that gift-giving norms equate the thoughtfulness of a gift with the effort involved in acquiring that gift, it is reasonable to infer that people perceive digital gift cards as requiring less effort to obtain and thus assume recipients will appreciate them less, even though recipients actually prefer gift cards in the more usable digital format. Choice A is incorrect. Although the text does discuss recipients’ preference of digital versus physical gift cards and the relative ease with which the two formats can be used, it doesn’t consider the misconceptions that gift givers may have of these factors. Moreover, the text establishes that recipients regard digital gift cards as easier to use and therefore preferable to physical gift cards. Choice B is incorrect because the text doesn’t consider whether recipients of gift cards feel a sense of ownership toward them, nor does the text touch on the greater tangibility of physical versus digital gift cards. Instead, the text contrasts the two formats of gift cards in terms of their respective usability and the difficulty involved in acquiring them and discusses how those factors influence people’s perceptions of the two formats. Choice C is incorrect because it contradicts the text, which explains that recipients regard digital gift cards as superior to physical ones because they are easier to use than physical cards, not because physical gift cards require greater effort to obtain than digital gift cards do. Moreover, the text doesn’t characterize the effort required to obtain physical gift cards as \"unnecessary.\""},{"i":"65502c46","c":"infer","d":"H","s":"In a 2017 article, historian Jasmine Kilburn-Toppin explains that in early modern London, members of the city’s guilds (trade and artisanal associations) were participants in a civic culture in which gift giving both signaled and conferred social status. Research on this phenomenon has tended to focus on philanthropic gifting by London’s largest guilds; for her part, Kilburn-Toppin focuses on the gifting of handmade objects and fixtures (such as decorative paneling or plasterwork) within the craft guilds, which were “composed of highly discerning producers and consumers of material cultures.” Given this characterization, it can reasonably be inferred that the gifting of such objects may have ______ Which choice most logically completes the text?","o":["ensured that knowledge of the materials and techniques used by members of the craft guilds stayed within the craft guilds.","emphasized ostentatious offerings in the case of the largest guilds and prosaic objects in the case of the craft guilds.","functioned as a way for craft guild members to maintain and enhance their professional reputations among their peers.","conferred greater social status when the recipient belonged to one of London’s largest guilds than when the recipient belonged to a craft guild."],"a":2,"r":"Choice C is the best answer because it logically completes the text’s discussion of the role of gift giving among members of guilds in early modern London. According to the text, members of these guilds participated in a culture where giving gifts \"both signaled and conferred social status\"—that is, it indicated people’s social standing and also gave them social standing—and occurred in the forms of both philanthropic gifting (donations for humanitarian purposes) by large guilds, which much research has focused on, and the gifting of handmade items between craft guild members, which Kilburn-Toppin focuses on. The text indicates that Kilburn-Toppin characterizes craft guild members as people who made and consumed items and were \"highly discerning,\" or were careful judges of quality. Because gift giving benefited one’s status and if craft guild members were particularly attentive to quality, it follows that gifting handmade items within the guilds—between people who had high standards for items they made and for items they received—may have been a way for members to maintain and enhance their professional reputations, or their professional statuses, among their peers. Choice A is incorrect because the text emphasizes the idea that members of guilds participated in gift giving both to display and receive social status, suggesting that the gifting of handmade items between the \"highly discerning\" members of craft guilds had to do with the members’ interest in quality and status; nothing in the text suggests that the practice of gifting those items within the craft guilds was intended to limit knowledge of materials and techniques to the members of those guilds. Choice B is incorrect because the text doesn’t distinguish between \"ostentatious,\" or very showy, and \"prosaic,\" or ordinary, gifts and because the characterization at the end of the text pertains specifically to the gifting of handmade items indicative of great taste, not prosaic items, between members of craft guilds. And while the text indicates that London’s largest guilds gave philanthropic gifts (donations for humanitarian purposes), it doesn’t indicate whether these gifts would have been considered ostentatious. Choice D is incorrect because the characterization presented at the end of the text pertains specifically to the \"highly discerning\" members of craft guilds giving their handmade items as gifts to one another within the craft guilds; the text doesn’t suggest anything about gifting those items to members of London’s largest guilds or how that might affect status differently from giving them to other craft guild members."},{"i":"25290c8d","c":"claim","d":"M","s":"“On Virtue” is a 1766 poem by Phillis Wheatley. Wheatley addresses the poem directly to the quality of virtue, imploring it to assist her in reaching a future goal: ______ Which quotation from “On Virtue” most effectively illustrates the claim?","o":["“Attend me, Virtue, thro’ my youthful years! / O leave me not to the false joys of time! / But guide my steps to endless life and bliss.”","“I cease to wonder, and no more attempt / Thine height t’explore, or fathom thy profound.”","“O thou bright jewel in my aim I strive / To comprehend thee. Thine own words declare / Wisdom is higher than a fool can reach.”","“But, O my soul, sink not into despair, / Virtue is near thee, and with gentle hand / Would now embrace thee, hovers o’er thine head.”"],"a":0,"r":"Choice A is the best answer because it most effectively illustrates the claim that Wheatley addresses her poem \"On Virtue\" to the quality of virtue, imploring it to assist her in reaching a future goal. In the quotation, Wheatley begs virtue to accompany her, or \"attend [her],\" through her youth and to \"guide [her] steps to\" the future goal of \"endless life and bliss.\" Choice B is incorrect because this quotation suggests the difficulty of fully comprehending virtue. Rather than asking virtue for help, Wheatley presents it as a quality that is impossible to entirely understand because it is so grand and deep. Choice C is incorrect because this quotation describes Wheatley’s effort to comprehend virtue despite virtue itself declaring that such wisdom is beyond her grasp, or \"higher than a fool can reach.\" Choice D is incorrect because rather than asking virtue for help in this quotation, Wheatley urges herself to \"sink not into despair\" because virtue is always nearby."},{"i":"9c407117","c":"claim","d":"H","s":"A student performs an experiment testing her hypothesis that a slightly acidic soil environment is more beneficial for the growth of the plant Brassica rapa parachinensis (a vegetable commonly known as choy sum) than a neutral soil environment. She plants sixteen seeds of choy sum in a mixture of equal amounts of coffee grounds (which are highly acidic) and potting soil and another sixteen seeds in potting soil without coffee grounds as the control for the experiment. The two groups of seeds were exposed to the same growing conditions and monitored for three weeks.\n\nWhich finding, if true, would most directly weaken the student’s hypothesis?","o":["The choy sum planted in the soil without coffee grounds were significantly taller at the end of the experiment than the choy sum planted in the mixture of soil and coffee grounds.","The choy sum grown in the soil without coffee grounds weighed significantly less at the end of the experiment than the choy sum grown in the mixture of soil and coffee grounds.","The choy sum seeds planted in the soil without coffee grounds sprouted significantly later in the experiment than did the seeds planted in the mixture of soil and coffee grounds.","Significantly fewer of the choy sum seeds planted in the soil without coffee grounds sprouted plants than did the seeds planted in the mixture of soil and coffee grounds."],"a":0,"r":"Choice A is the best answer because it describes an experimental outcome that would most directly weaken the student’s hypothesis. According to the text, the student hypothesizes that Brassica rapa parachinensis (choy sum) will benefit more from acidic soil than it will from neutral soil. The text then explains that the student planted 16 choy sum seeds in potting soil with coffee grounds added to increase acidity and another 16 seeds in soil without coffee grounds as a control (a group identical to the experimental group except for the experimental modification being tested). If the hypothesis were correct, the plants in the more acidic soil-and-coffee-grounds mixture would grow faster than those in the control group. However, choice A proposes a scenario in which the plants in soil without coffee grounds were “significantly taller” than those in the more acidic mixture—an outcome that weakens the hypothesis that higher acidity is beneficial to the plants’ growth. Choice B is incorrect. If the choy sum planted in the neutral soil produced less plant matter and therefore weighed less than the choy sum planted in the acidic soil-and-coffee-grounds mixture, this finding would strengthen the student’s hypothesis, not weaken it. Choice C is incorrect. If seeds planted in neutral soil (without coffee grounds) sprouted significantly later than seeds planted in the acidic soil-and-coffee-grounds mixture, this finding would strengthen, not weaken, the student’s hypothesis that acidic soil benefits choy sum. Choice D is incorrect. If seeds planted in the neutral soil (without coffee grounds) sprouted significantly fewer plants than seeds planted in the acidic soil-and-coffee-grounds mixture did, this finding would strengthen, not weaken, the student’s hypothesis that choy sum benefits from acidic soil."},{"i":"f452410b","c":"graph","d":"E","s":"","o":["a longer footprint, and a longer average stride.","a longer footprint, and a shorter average stride.","a shorter footprint, and a longer average stride.","a shorter footprint, and a shorter average stride."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the table to complete the claim about the tracks left by two therapods. The table indicates that the set of tracks labeled La Torre 6A has an estimated footprint length of 32.8 centimeters, an average stride length of 5.23 meters, and an estimated mean speed of 6.5–10.3 meters per second. For the set of tracks labeled La Torre 6B, on the other hand, the estimated footprint length is 28.9 centimeters, the average stride length is 5.57 meters, and the estimated mean speed is 8.8–12.4 meters per second. Therefore, the therapod that left the La Torre 6B tracks had a shorter footprint and a longer average stride than the one that left the La Torre 6A tracks. Choice A is incorrect. While it is true that of the two therapods, the one that left the La Torre 6B tracks had a longer average stride, it didn’t have a longer footprint: the table shows that its estimated footprint length is 28.9 centimeters, while La Torre 6A’s estimated footprint length is 32.8 centimeters. Choice B is incorrect because the table shows that of the two therapods, the one that left the La Torre 6B tracks had a footprint length estimated at 28.9 centimeters, which is shorter than the 32.8 centimeters estimated for the other set of tracks. Moreover, the therapod that left the La Torre 6B tracks had a longer average stride, not shorter: 5.57 meters, compared with 5.23 meters for the other set of tracks. Choice D is incorrect. While it is true that of the two therapods, the one that left the La Torre 6B tracks had a shorter footprint, it didn’t have a shorter average stride: the table shows that its average stride length is 5.57 meters, while La Torre 6A’s average stride length is 5.23 meters."},{"i":"faaf484f","c":"graph","d":"E","s":"","o":["South West area.","South Central area.","North East area.","North Central area."],"a":0,"r":"Choice A is the best answer because it most effectively uses data from the table to complete the statement about the bike path survey. The table presents the percent of residents from five city areas who are in favor of adding more bike paths. With 88 percent of residents in favor of adding bike paths, the city’s South West area has the highest level of demand. Choice B is incorrect because, according to the data in the table, 33 percent of residents in the South Central area of the city are in favor of additional bike paths. The area of the city that has 88 percent of its surveyed residents in favor of additional bike paths will best complete the statement. Choice C is incorrect because, according to the data in the table, 12 percent of residents in the North East area of the city are in favor of additional bike paths. The area of the city that has 88 percent of its surveyed residents in favor of additional bike paths will best complete the statement. Choice D is incorrect because, according to the data in the table, 26 percent of residents in the North Central area of the city are in favor of additional bike paths. The area of the city that has 88 percent of its surveyed residents in favor of additional bike paths will best complete the statement."},{"i":"6e193b19","c":"fss","d":"M","s":"Professional American football player Fred Cox invented one of the world’s most popular toys. In the 1970s, he came up with the idea for the Nerf football, which ______ of the harder and heavier regulation football.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["were a smaller, foam version","are smaller, foam versions","were smaller, foam versions","is a smaller, foam version"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement and agreement between nouns. The singular verb “is” and the singular noun “version” both agree in number with the relative pronoun “which.” In this context, “which” functions as a singular subject because it refers to the singular noun “the Nerf football.” Choice A is incorrect because the plural verb “were” doesn’t agree in number with the singular noun phrase “the Nerf football” that it’s modifying. Choice B is incorrect because the plural verb “are” and the plural noun “versions” don’t agree in number with the singular noun phrase “the Nerf football” that they’re modifying. Choice C is incorrect because the plural verb “were” and the plural noun “versions” don’t agree in number with the singular noun phrase “the Nerf football” that they’re modifying."},{"i":"dbd78791","c":"fss","d":"E","s":"Led by Syrian American astronomer Shadia Habbal, the Solar Wind Sherpas are an intrepid team of scientists who travel the globe to study solar winds, the streams of particles emanating from the Sun that are only visible from certain locations during a total solar eclipse. When such an eclipse is imminent, the Sherpas pack up their telescopes and ______ ready.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["get","had gotten","got","were getting"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the present tense verb “get” is consistent with the other present tense verbs (“are,” “travel,” and “pack”) used to describe the Sherpas and their activities. Choice B is incorrect. The past perfect verb “had gotten” isn’t consistent with the other present tense verbs used to describe the Sherpas and their activities. Choice C is incorrect. The past tense verb “got” isn’t consistent with the other present tense verbs used to describe the Sherpas and their activities. Choice D is incorrect. The past progressive verb “were getting” isn’t consistent with the other present tense verbs used to describe the Sherpas and their activities."},{"i":"57998dd3","c":"fss","d":"E","s":"Obsidian is a kind of volcanic glass formed when lava cools so quickly that the atoms inside it cannot arrange themselves in a crystalline structure. You ______ more about obsidian’s structure, which is classified as amorphous, in a later chapter.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["had learned","had been learning","will learn","have learned"],"a":2,"r":"Choice C is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the future tense verb “will learn,” used in conjunction with the phrase “in a later chapter,” correctly indicates that “you” (the reader) are going to learn about obsidian’s structure at some point in the future. Choice A is incorrect because the past perfect verb “had learned” doesn’t indicate that the subject is going to learn about obsidian’s structure in the future. Choice B is incorrect because the past perfect progressive verb “had been learning” doesn’t indicate that the subject is going to learn about obsidian’s structure in the future. Choice D is incorrect because the present perfect verb “have learned” doesn’t indicate that the subject is going to learn about obsidian’s structure in the future."},{"i":"707461d8","c":"bound","d":"H","s":"In 2021, Mexican biologist Martha Lydia Macías-Rubalcava led a review of the scientific literature related to endophytic fungi (i.e., fungi that live inside a host ______ researching 120 endophytic fungi–produced compounds, she found that their phytotoxicity can make them viable alternatives to chemical herbicides for controlling weeds.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["plant). By","plant), by","plant) and by","plant) by"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"In…plant\") and another (\"By…weeds\"). The prepositional phrase beginning with \"by\" modifies the subject of the next sentence, \"she,\" which refers to Macías-Rubalcava. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to join two sentences. Choice C is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join two sentences. Choice D is incorrect because it results in a run-on sentence. The two sentences are fused without punctuation and/or a conjunction."},{"i":"2bb7416a","c":"bound","d":"H","s":"In paleontology, the term “Elvis taxon” gets applied to a newly identified living species that was once presumed to be extinct. Like an Elvis impersonator who might bear a striking resemblance to the late musical icon Elvis Presley himself, an Elvis taxon is not the real thing, ______ is a misidentified look-alike.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["however but it","however it","however, it","however. It"],"a":3,"r":"Choice D is the best answer. The clause “Like an Elvis impersonator…real thing” and the clause “it is…look-alike” are both independent clauses, so making them into two separate sentences is grammatically correct. Choice A is incorrect. This choice creates a run-on sentence error. The clause “Like an Elvis impersonator…real thing” and the clause “it is…look- alike” are both independent clauses, so they need to be separated with at least a comma + a coordinating conjunction. This choice provides the coordinating conjunction “but,” but it’s missing a comma. Choice B is incorrect. This choice creates a run-on sentence error. The clause “Like an Elvis impersonator…real thing” and the clause “it is…look-alike” are both independent clauses, so they need to be separated with a semicolon, a colon, a dash, a period, or a comma + a coordinating conjunction. Choice C is incorrect. This choice creates a run-on sentence error. The clause “Like an Elvis impersonator…real thing” and the clause “it is…look-alike” are both independent clauses, so they need to be separated with at least a comma + a coordinating conjunction. This choice provides a comma, but it’s missing a coordinating conjunction."},{"i":"77e3b3b3","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: 2024: Spain and Portugal sponsored a workshop to address recent encounters between Iberian orcas and marine vessels off the Iberian Peninsula. Many of the 637 documented incidents involved pods of orcas damaging vessels by ramming, nudging, or biting the rudders. Studies of Iberian orcas suggest recent increases in tuna populations have reduced the time the orcas spend hunting by 99%. Researchers believe this shift has increased the number of interactions between marine vessels and understimulated orcas. The workshop advised mariners to avoid orcas pending further testing of the efficacy of TAST , a harmless acoustic deterrent. The student wants to make and support a claim about Iberian orca behavior.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The recent destructive behavior of Iberian orcas may be the result of understimulation, given that orcas’ interactions with marine vessels have increased as the orcas have spent less time hunting.","As supported by the workshop’s analysis of 637 encounters between vessels and Iberian orcas, TAST is a harmless and effective acoustic deterrent.","In 2024, Spain and Portugal sponsored a workshop that addressed incidents where pods of Iberian orcas were ramming, nudging, or biting the rudders of vessels.","Tuna populations have increased by approximately 99% off the Iberian Peninsula due to changes in the hunting behavior of Iberian orcas."],"a":0,"r":"Choice A is the best answer. The sentence makes and supports a claim about Iberian orca behavior, claiming that the orcas’ destructive behavior may be the result of understimulation and citing as support the fact that as orcas have spent less time hunting (a stimulating activity), encounters with vessels have increased. Choice B is incorrect. While the sentence makes a claim about an orca deterrent, it misrepresents information from the notes. The workshop advised avoiding orcas pending further testing of TAST’s efficacy; it didn’t claim that TAST was effective. Choice C is incorrect. The sentence describes a workshop that addressed the orcas’ behavior; it doesn’t make or support a claim about their behavior. Choice D is incorrect. While the sentence does make a claim about orcas’ hunting behavior, it misrepresents information from the notes; the notes state that increased tuna populations have reduced orcas’ hunting time by 99%, not that tuna populations have increased by 99% because of the orcas’ behavior."},{"i":"7fa2b1ee","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: In meteorology, an air mass is a large body of air with generally uniform humidity and temperature. Air masses are commonly classified by two-letter names. The first letter indicates the humidity of the air mass, while the second letter indicates the temperature. cA (continental arctic) means dry and cold, for example. mT (maritime tropical) means moist and warm. This classification system is based on the work of a Swedish meteorologist named Tor Bergeron (1891–1977). The student wants to provide an example of an air mass.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Air masses are large bodies of air with generally uniform humidity and temperature.","The air mass classification system uses two-letter names and is based on the work of Tor Bergeron, a Swedish meteorologist.","Air masses are commonly classified by a two-letter name that indicates humidity and temperature.","One type of air mass is known as a cA, or continental arctic, air mass because it is dry and cold."],"a":3,"r":"Choice D is the best answer. The sentence provides an example of an air mass: the cA, or continental arctic, air mass. Choice A is incorrect. The sentence provides a general definition of air masses; it doesn’t provide an example of a specific air mass. Choice B is incorrect. The sentence describes the system used to classify air masses; it doesn’t provide an example of a specific air mass. Choice C is incorrect. The sentence explains how air masses are classified; it doesn’t provide an example of a specific air mass."},{"i":"e965fd73","c":"trans","d":"E","s":"Preston Singletary is a Tlingit glass artist who often collaborates with other artists. ______ he has worked with Tewa pottery artist Jody Naranjo several times. Together, Singletary and Naranjo have created pottery-inspired glass pieces such as Sunset Stampede and Kiva Steps.\n\nWhich choice completes the text with the most logical transition?","o":["In conclusion,","For example,","However,","In comparison,"],"a":1,"r":"Choice B is the best answer. \"For example\" logically signals that this sentence—noting Singletary’s work with Jody Naranjo—provides an example supporting the previous point about Singletary’s collaborations with other artists. Choice A is incorrect because \"in conclusion\" illogically signals that the information in this sentence concludes or summarizes the previous point about Singletary’s collaborations with other artists. Instead, it provides an example in support of that point. Choice C is incorrect because \"however\" illogically signals that the information in this sentence contrasts with the previous point about Singletary’s collaborations with other artists. Instead, it provides an example in support of that point. Choice D is incorrect because \"in comparison\" illogically signals that the information in this sentence is being compared to the previous point about Singletary’s collaborations with other artists. Instead, it provides an example in support of that point."},{"i":"3a715eca","c":"trans","d":"H","s":"In retrospect, one of the lessons of the 2003 Human Genome Project is that a gene is affected by many factors, not the least of which is its interactions with the protein products of other genes. ______ rather than just focusing on the human genome, efforts to better understand gene mutations related to disease have begun to consider the human proteome, the complete set of proteins expressed by human genes.\n\nWhich choice completes the text with the most logical transition?","o":["In other words,","That said,","For example,","Accordingly,"],"a":3,"r":"Choice D is the best answer. \"Accordingly\" logically signals that this sentence states a result or consequence of the previous information about the 2003 Human Genome Project. Taking into account an important lesson of the 2003 project (that a gene is affected by interactions with the protein products of other genes), research has begun to consider the human proteome instead of just the genome. Choice A is incorrect because \"in other words\" illogically signals that the information in this sentence is a paraphrase or restatement of the previous information about the 2003 Human Genome Project. Instead, this sentence states a result or consequence of that information. Choice B is incorrect because \"that said\" illogically signals that the information in this sentence qualifies or contrasts with the previous information about the 2003 Human Genome Project. Instead, this sentence states a result or consequence of that information. Choice C is incorrect because \"for example\" illogically signals that this sentence provides an example supporting the previous information about the 2003 Human Genome Project. Instead, this sentence states a result or consequence of that information."},{"i":"e6b1e12c","c":"trans","d":"H","s":"Long thought to be sessile (immobile), adult Chelonibia testudinaria, barnacles that adhere to sea turtle shells, have been observed to shift slightly in position over time—a phenomenon that has been attributed to the barnacles’ passive displacement by water currents. ______ a research team found that adult C. testudinaria moved toward the heads of their sea turtle hosts and thus against the prevailing water flow, behavior consistent with self-initiated locomotion.\n\nWhich choice completes the text with the most logical transition?","o":["Contrary to this phenomenon,","Undermining this explanation,","Drawing a similar conclusion,","Confirming this hypothesis,"],"a":1,"r":"Choice B is the best answer. “Undermining this explanation” logically signals that the information in this sentence—that adult Chelonibia testudinaria showed behavior consistent with self-initiated locomotion—undermines or weakens the previous explanation that barnacle movement was a result of passive displacement by water currents. Choice A is incorrect because “contrary to this phenomenon” illogically signals that the information in this sentence about barnacles exhibiting behavior consistent with self-initiated locomotion opposes the previous information about barnacles shifting slightly in position over time. Instead, the sentence undermines or weakens the previous claim about passive displacement. That is, the sentence doesn’t oppose the fact that the barnacles shifted position: it challenges the previous sentence’s explanation for the movement. Choice C is incorrect because “drawing a similar conclusion” illogically signals that the information in this sentence about barnacles exhibiting behavior consistent with self-initiated locomotion is similar to the previous conclusion that barnacle movement is the result of passive displacement. Instead, the sentence undermines or weakens the previous sentence’s explanation for how the barnacles moved. Choice D is incorrect because “confirming this hypothesis” illogically signals that the information in this sentence about barnacles exhibiting behavior consistent with self-initiated locomotion confirms the hypothesis in the previous sentence that the barnacle movement was the result of passive displacement. Instead, the sentence undermines or weakens the previous sentence’s explanation for how the barnacles moved."}],"img":{"f452410b":"iVBORw0KGgoAAAANSUhEUgAAArwAAADVBAMAAABH8D7LAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAA7Y0lEQVR42u1dd1hUx9d+z91dOuxcFDUWuIBGY8GLYoqxLLaY2NYWu64l0USjaBKjMUbsXbElUUnEFgtGsUbBgr3LYkdFFlus7F3ERtn5/lgQ7JAQf0m+fR+fx7u3nDnzzrkz55w7MwB22GGHHXbYYUdhgf7zNRReD49+ucf+uYcNZXj6sbw3ik8/Wd32HwMAVU/bD09fz1z9pSduf1NHvp6SP3tGgUAIomf2aUH+jzXitCPrKMdY+wnZtSThrOSYlRhi+2Wrch8AJAE4R7a79tmYXQwALuttt3Yx39Hl0LYtgeU1knCd08Ws453zlm2Tk4wuSTlFqYz/MXp/pFUoKiGI+UHuW2kR6gMoKxfbC6cwQCVDLTvsUQUxwc9PVVQquQgQMiRVUQn1pY0iJLWMQAoC+8KAGkyoBtSRRZJUqM7gHFUyjOpjik4dDKhl1QEGh3jUKssQhOpyUR18qxPVB9VLBgJ0nv6oD5VOMKpYw/8UveisTjipObhrAq37tvapSqsMUEX/WjKdOYVCdXCzEDm35I3SK3e77f/WdfPlOvsBp7mhpVbucTq0cNNQ9bphkdLuUvNnYPUu5y2Ly2wC6rDemqhSFQ6shdNO0lWKbLV95LwtjOatKHZHB4d4tJgc5bxl4dEe0csxNTyk5vzQWtHJgIfscub98JD5kb7GSSWi1/2H6A3vfd0t5Au3iK+GUnJf55Dh6hC4hfV32AXHcwddF9atsKtO0LoyLWPKGPq6D5zsNBDw8IrybrnCQdy/qZlTxD1H+XJzz4Gsmb6udN07GKjDajulfdTc9yxo9WzM1Rg/U6WWkDSXqurPAA7x6OJ3pQ47fcoltoW80ssSXfTS/KLJgLfsbnhbde9SqXr7Tmh1Y/5DQ1vqwwOs84AHlS8AEDl+OxnGfMJW1+agW1P4msMtVx+pm6TsCDNH+WBNPOeAPriheU28NVJO3lEvdsIqo2nr/gVKiqmS6UufHQxgxpZ7apdKWgTe9oah7AEo7pGTTOppCS3jAHCkXDRhK8tAWIwu8/aujNv7Mm8rBIAb4w8K26/GvfXbg/nh/yF6XZb4WWa3szbqzQhmmB4Gr1UuyUhWiGIiPSUkS5TECRIxBcyHFMLw+nfBtC5jR/GM0NjZ8wzig+brQLgLb0ABlIxBg/rdBWeOVSYZ3BrqFGXMIR10MDEQFIgg+eNOiigJJgaJUNoPnEMB8HWjeAh4WD/jo1//Q/SyrOtZDfxdBwpXGjGRt+roLSGzjSFZ5GC41aDnqqAeseXQuivBkzOB1+OCY++vfZmIIiN8M+RLJ80S66yVQMzYq1kyAGIZlUwp61p3Vmh2Q2WXf4gQtCsVj4IarmHgYCBodwTWl2636R51752svY3c9rzjB4hMgKV85UYf6R5F167q+x/qewejJoVvUG9d63w4or2w6Y3DOiB function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
