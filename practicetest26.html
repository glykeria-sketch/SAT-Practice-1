<script>
const D={"t":"Practicetest26","q":[{"i":"84b5125b","c":"vocab","d":"E","s":"Artist Marilyn Dingle’s intricate, coiled baskets are ______ sweetgrass and palmetto palm. Following a Gullah technique that originated in West Africa, Dingle skillfully winds a thin palm frond around a bunch of sweetgrass with the help of a “sewing bone” to create the basket’s signature look that no factory can reproduce.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["indicated by","handmade from","represented by","collected with"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Marilyn Dingle’s baskets. In this context, to say that Dingle’s baskets are “handmade from” particular plants means that Dingle creates baskets herself using those plants but without using machines. The text says that Dingle “skillfully winds” parts of palmetto palm plants around sweetgrass plants to make baskets with an appearance that “no factory can reproduce.” This context suggests that Dingle’s baskets are handmade from sweetgrass and palmetto palm. Choice A is incorrect because the text describes how Dingle uses sweetgrass and palmetto palm to create her baskets, not how her baskets are “indicated by,” or signified by, sweetgrass and palmetto palm. Choice C is incorrect. Although Dingle’s baskets are described as being made using sweetgrass and palm, there’s nothing in the text to suggest that the baskets are “represented by,” or exemplified or portrayed by, sweetgrass and palmetto palm. Instead, the focus of the text is on Dingle’s use of sweetgrass and palmetto palm and the impossibility of replicating the appearance of her baskets using machines. Choice D is incorrect because there’s nothing in the text to suggest that Dingle’s baskets are “collected with,” or brought together in a group with, sweetgrass and palmetto palm. Instead, the text describes how Dingle uses those plants to make her baskets."},{"i":"16f2d678","c":"vocab","d":"E","s":"Although the government of the Soviet Union attempted to ______ Georgi Vladimov’s novel Faithful Ruslan, copies of the book circulated in secret among readers in several parts of the country.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["replicate","critique","import","suppress"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of Georgi Vladimov’s novel Faithful Ruslan. In this context, “suppress” means to prevent something, such as a book, from being accessed by the public. The text indicates that the novel was circulated secretly within the Soviet Union, a stratagem that was necessary because of the government’s efforts to suppress the book, or prevent it from being circulated and read. Choice A is incorrect because in this context, “replicate” would mean to copy or reproduce a book, and this meaning wouldn’t make sense in the text’s discussion of Faithful Ruslan. If the Soviet government had attempted to replicate Vladimov’s novel, there would be no reason for copies to circulate “in secret,” since the government would be actively making more copies available, not restricting access. Choice B is incorrect. Although a repressive government might well “critique” a novel, or evaluate it negatively, simply critiquing one wouldn’t necessarily lead to copies of it circulating “in secret.” Instead, the text suggests that the Soviet government took decisive action against Faithful Ruslan that necessitated its underground circulation and did not merely offer criticism of the novel. Choice C is incorrect because “import” means to bring a product, such as a book, into a country from elsewhere. However, the text suggests that copies of Faithful Ruslan were already present in the Soviet Union and that the government was trying to restrict their circulation rather than increasing access to the novel by importing copies from another country."},{"i":"6017ae31","c":"vocab","d":"H","s":"In 2016, Gabriela González and team announced that a chirping sound captured by Laser Interferometer Gravitational-Wave Observatory antennas was direct evidence of gravitational waves, which skeptics had argued would be too faint for detection. Detailed statistical analysis helped preclude claims of the event’s ______, confirming the signal at a confidence level of over 99%.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["inconspicuousness","discretion","ambiguity","probability"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Gabriela González and team’s detection of gravitational waves. In this context, \"ambiguity\" means uncertainty or doubtfulness. The text explains that although skeptics had thought that direct evidence of gravitational waves would be too faint to be detected, researchers led by González claimed that a chirping sound captured by Laser Interferometer Gravitational-Wave Observatory antennas nevertheless provided such evidence. The text goes on to say that detailed statistical analysis confirmed the observation of gravitational waves with a high degree of confidence—that is, with near certainty—a finding that helped to preclude, or rule out, any claims that the signal’s attribution to gravitational waves might be ambiguous or doubtful. Choice A is incorrect. In this context, \"inconspicuousness\" would mean the quality of being unnoticeable or difficult to detect. Although the text indicates that skeptics had doubted whether gravitational waves could be observed directly because of their presumed faintness (which suggests that gravitational waves were expected to be difficult to detect), the blank portion of the text isn’t referring to the possibility that gravitational waves are unnoticeable or undetectable. Instead, the focus of the last sentence is González’s team’s observation of a chirping sound that they attributed to gravitational waves, and it wouldn’t make sense to say that through statistical analysis, they ruled out the possibility that the sound they observed was undetectable. Rather, the skeptical view presented in the text suggests that there could be some ambiguity about the source of the chirping, but statistical analysis virtually eliminated this uncertainty. Choice B is incorrect because in this context, \"discretion\" would mean good judgment, and it wouldn’t make sense to say that an event, such as the detection of gravitational waves, would show judgment, much less that the event’s capacity to exercise good judgment would be precluded by statistical analysis confirming its attribution. Choice D is incorrect because in this context, \"probability\" would mean likelihood, and the text states that statistical analysis, which confirmed the signal with a high degree of confidence, suggests the likelihood that the chirping sound was produced by gravitational waves, not that the analysis helped to preclude this likelihood."},{"i":"e41dfaab","c":"vocab","d":"E","s":"In 1929 the Atlantic Monthly published several articles based on newly discovered letters allegedly exchanged between President Abraham Lincoln and a woman named Ann Rutledge. Historians were unable to ______ the authenticity of the letters, however, and quickly dismissed them as a hoax.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["validate","interpret","relate","accommodate"],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of letters allegedly exchanged between President Lincoln and Rutledge. In this context, “validate” means to confirm that something is real or correct. According to the text, it was alleged, or claimed, that the newly discovered letters had been written by Lincoln and Rutledge. The text also indicates that historians ultimately decided the letters were a hoax, or fraudulent. This context suggests that the historians couldn’t confirm that the letters were authentic. Choice B is incorrect. The text focuses on the authenticity of the letters, which were claimed to have been written by Lincoln and Rutledge and were then quickly dismissed as fraudulent by historians. Rather than conveying that the historians simply weren’t able to “interpret,” or explain in an understandable way, the letters’ authenticity, the text suggests that the historians decided the letters lacked authenticity altogether. Choice C is incorrect. The text states that the historians quickly dismissed the letters claimed to have been written by Lincoln and Rutledge as fraudulent; this suggests that rather than being unable to “relate,” or tell others about, the letters’ authenticity, the historians were able to share what they’d decided about the letters. Choice D is incorrect because it wouldn’t make sense to suggest that the historians couldn’t “accommodate,” or give consideration to, the authenticity of the letters claimed to have been written by Lincoln and Rutledge; the text states that the historians decided that the letters were fraudulent, which indicates that they did consider whether the letters were authentic."},{"i":"2af2016f","c":"purpose","d":"M","s":"A study by Dr. Paul Hanel and colleagues concluded that people are more likely to behave politely when listening to ideas they disagree with if they think about values before they engage in a discussion. Study participants were assigned to one of two groups. The experimental group spent a few minutes writing about one of their personal values before they had a group discussion on a controversial topic. And the control group spent a few minutes writing about a drink (tea, milk, etc.) before their group discussion on that topic. Hanel and colleagues found that the experimental group’s discussion was more civil than the control group’s discussion was.\n\nWhich choice best describes the main purpose of the text?","o":["To describe a widely held belief and how a study’s results support that belief","To argue that researchers were surprised by the results of a certain study","To suggest ways to improve a certain study’s experimental design","To explain a study’s conclusion and how a research team arrived at that conclusion"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain a study’s conclusion and how researchers involved in the study arrived at that conclusion. The text begins by summarizing the main conclusion of the study conducted by Paul Hanel and colleagues: when confronted with ideas they disagree with in discussions about controversial topics, people are more likely to respond politely if they think about their personal values before engaging in such discussions. The text then goes on to describe the design of Hanel and colleagues’ experiment. By comparing interactions between members of an experimental group (who had been prompted to write about their personal values beforehand) to those between members of a control group (who had been prompted to write about a beverage), the team found that people in the experimental group behaved more civilly, or politely, than people in the control group did during discussions about a controversial topic. This finding led to the conclusion described at the beginning of the text. Choice A is incorrect. Although the text discusses the results of a study, it doesn’t provide any indication that the conclusion the study supported —that when facing disagreement, people behave more politely when they have thought about their values—is a belief that is widely held. Choice B is incorrect because the text doesn’t indicate that the researchers found the results of their study to be surprising, or contrary to what they expected. In fact, there’s no indication provided in the text about how the researchers felt about the study’s results or that the results should be considered surprising. Choice C is incorrect. Although the text discusses the experimental design of a study, it doesn’t suggest any improvements to that design; instead, it focuses on how the design enabled the researchers to draw a particular conclusion."},{"i":"65406d2c","c":"purpose","d":"H","s":"Dubautia carrii is a species in a family of plants known collectively as the silversword alliance, all of which grow only on the Hawaiian Islands. Members of this alliance exhibit an extraordinary range of phenotypes, with some species maturing into vines and others into shrubs and trees. All species in the alliance descended from a single ancestral tarweed plant that arrived on the islands around 5 million years ago. The tarweed’s descendants diversified into distinct species as they adapted to live in the wide variety of habitats found on the Hawaiian Islands.\n\nWhich choice best states the main purpose of the text?","o":["To indicate the specific tarweed ancestor of all plants that grow on the Hawaiian Islands and explain why the plants have such varied physical characteristics","To describe the specific habitat where Dubautia carrii are found and identify other plants that share a common ancestor with them","To describe the silversword alliance and explain how the plant family became so varied","To advance the claim that all plants on the Hawaiian Islands are part of the silversword alliance and list possible ancestors of the plants that make up the alliance"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text, which is to describe the family of plants known as the silversword alliance and explain why the plants came to exhibit \"an extraordinary range of phenotypes.\" The text introduces the silversword alliance as a family of plants unique to the Hawaiian Islands, presenting those that mature into vines and those that mature into shrubs and trees as examples of different phenotypes. The text concludes by explaining that these plants are all descendants of \"a single ancestral tarweed plant\" that arrived 5 million years ago in the Hawaiian Islands, where a \"wide variety of habitats\" drove the plant’s descendants to adapt and thus differentiate themselves, diversifying into a group of related but distinct species with different physical characteristics. Choice A is incorrect. Although the text explains why the plants within the silversword alliance have varied physical characteristics, the text doesn’t suggest that tarweed is the ancestor of all plants on the Hawaiian Islands. The text states instead that all members of the silversword alliance descend from a single tarweed ancestor. Choice B is incorrect because while Dubautia carrii is mentioned as an example of a species in the silversword alliance, no details about its particular habitat are provided. And although the text indicates that the Hawaiian Islands are home to \"a wide variety of habitats,\" it doesn’t describe the specific habitat where Dubautia carrii is found. The text discusses the silversword alliance as a whole rather than focusing on Dubautia carrii or any one species within this family. Choice D is incorrect. Although the silversword alliance is only found on the Hawaiian Islands and includes \"an extraordinary range of phenotypes,\" the text doesn’t claim that all plants on the Hawaiian Islands are part of the alliance. Furthermore, the text indicates that these plants all \"descended from a single ancestral tarweed plant,\" not that there are multiple possible candidates for that ancestor plant."},{"i":"b3e145e4","c":"func","d":"E","s":"In the 1950s, scientists didn’t know much about the ocean floor. <u>Many scientists at the time believed that the ocean floor was mostly flat.<\/u> But geologist Marie Tharp and her research partner, Bruce Heezen, proved that this idea was wrong. Using sonar data collected from the Atlantic Ocean, Tharp and Heezen showed that the floor was filled with canyons, mountains, and valleys.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It identifies a scientific belief that Tharp and Heezen showed to be wrong.","It describes the design of Tharp and Heezen’s experiment.","It emphasizes a disagreement between Tharp and Heezen.","It presents data to support a claim that Tharp and Heezen made."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence of the text establishes that scientists didn’t know much about the ocean floor in the 1950s. The second sentence, which is underlined, describes what many scientists thought at the time—that the ocean floor was mostly flat. The remainder of the text establishes that the ocean floor is far from flat, citing research conducted by Marie Tharp and Bruce Heezen. Thus, the purpose of the underlined sentence is to identify a scientific belief that Tharp and Heezen showed to be wrong. Choice B is incorrect. Although Tharp and Heezen’s work with sonar data in the Atlantic Ocean is mentioned later in the text, the underlined sentence doesn’t describe the design of their experiment. Instead, it identifies a belief held by scientists that Tharp and Heezen demonstrated to be wrong. Choice C is incorrect because the underlined sentence presents a belief held by many scientists in the 1950s; nowhere does the text mention a disagreement between Tharp and Heezen, whom the text describes as research partners working together to map the ocean floor. Choice D is incorrect because the underlined sentence doesn’t present data in support of a claim; instead, it presents a scientific belief that Tharp and Heezen’s work showed to be wrong."},{"i":"764331f8","c":"func","d":"E","s":"The following text is from Louise Erdrich’s 1986 novel The Beet Queen. The narrator discusses her relationship with her young niece, Dot. Celestine, the narrator’s sister-in-law, is Dot’s mother. Dot was as impatient with babyhood as I. She tried at once to grow out of it. Celestine never saw that, because she, and only she, took pleasure in Dot’s helpless softness. Only Celestine was saddened by her daughter’s fierce progress. Day by day, Dot grew stronger. <u>In her shopping-cart stroller she exercised to exhaustion, bouncing for hours to develop her leg muscles.<\/u> ©1986 by Louise Erdrich Which choice best describes the function of the underlined sentence in the text as a whole?","o":["It offers a detail that shows how Dot is growing stronger.","It expresses hope that Celestine will mature psychologically.","It explores some of the narrator’s psychological characteristics.","It indicates how sad Celestine is by describing a behavior she engages in."],"a":0,"r":"Choice A is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. In the text, the narrator makes observations about her young niece, Dot, noting that Dot is making progress toward outgrowing babyhood and is growing stronger \"day by day.\" The description of Dot purposefully exercising by \"bouncing for hours\" reinforces the narrator’s earlier characterization of Dot. The underlined sentence thus offers a detail that shows how Dot is growing stronger. Choice B is incorrect. While a sentence earlier in the text mentions Celestine’s psychological state (sadness because Dot is growing fast), the underlined sentence doesn’t focus on Celestine at all. Instead, the sentence focuses on Dot’s physical activities to show that she is getting stronger. Choice C is incorrect because the underlined sentence describes Dot’s behavior, not the narrator’s psychological characteristics. While a sentence earlier in the text establishes that the narrator, like Dot, was \"impatient with babyhood,\" the underlined sentence specifically addresses Dot’s physical activities in her stroller. Choice D is incorrect. While an earlier sentence in the text mentions that Celestine is sad, the underlined sentence doesn’t focus on how Celestine feels nor does it describe a behavior that Celestine engages in. The sentence focuses entirely on Dot’s actions, describing her as \"bouncing for hours\" to show that she is growing stronger."},{"i":"6a1dc7c5","c":"cross","d":"H","s":"Text 1 Virginia Woolf’s 1928 novel Orlando is an oddity within her body of work. Her other major novels consist mainly of scenes of everyday life and describe their characters’ interior states in great detail, whereas Orlando propels itself through a series of fantastical events and considers its characters’ psychology more superficially. Woolf herself sometimes regarded the novel as a minor work, even admitting once that she “began it as a joke.”\n\nText 2 Like Woolf’s other great novels, Orlando portrays how people’s memories inform their experience of the present. Like those works, it examines how people navigate social interactions shaped by gender and social class. Though it is lighter in tone—more entertaining, even—this literary “joke” nonetheless engages seriously with the themes that motivated the four or five other novels by Woolf that have achieved the status of literary classics.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the assessment of Orlando presented in\n\nText 1?","o":["By conceding that Woolf’s talents were best suited to serious novels but asserting that the humor in Orlando is often effective","By agreeing that Orlando is less impressive than certain other novels by Woolf but arguing that it should still be regarded as a classic","By acknowledging that Orlando clearly differs from Woolf’s other major novels but insisting on its centrality to her body of work nonetheless","By concurring that the reputation of Orlando as a minor work has led readers to overlook this novel but maintaining that the reputation is unearned"],"a":2,"r":"Choice C is the best answer because it reflects how the author of Text 2 would most likely respond to the assessment of Orlando in Text 1. Both authors agree that Orlando is unusual for Woolf: Text 1 states that the novel examines its characters’ psychologies more superficially than Woolf’s other novels do, and Text 2 describes it as being lighter in tone. However, while Text 1 calls Orlando an “oddity” and mentions that Woolf “began it as a joke,”Text 2 asserts that Orlando engages the same themes as Woolf’s other great novels. Hence, the author of Text 2 would most likely accept that Orlando differs from Woolf’s other novels but would also insist on its importance in the context of Woolf’s work as a writer. Choice A is incorrect. Text 2 does suggest that the humor in Orlando is effective. However, there’s nothing in Text 2 to suggest that the author would agree that Woolf’s talents were best suited to serious novels. Rather, the author of Text 2 compares Orlando favorably to other novels by Woolf that are implied to be darker in tone. Choice B is incorrect because the author of Text 2 does not indicate that Orlando is less impressive than Woolf’s other novels, but instead points out that it engages the same themes as other novels by Woolf that are considered classics. Choice D is incorrect because there’s nothing in Text 1 or Text 2 to suggest that readers have generally ignored Orlando because of its reputation."},{"i":"16025337","c":"main","d":"H","s":"The following text is adapted from William Shakespeare’s 1609 poem “Sonnet 27.”The poem is addressed to a close friend as if he were physically present. Weary with toil, I [hurry] to my bed, The dear repose for limbs with travel tired; But then begins a journey in my head To work my mind, when body’s work’s expired: For then my thoughts—from far where I abide— [Begin] a zealous pilgrimage to thee, And keep my drooping eyelids open wide, What is the main idea of the text?","o":["The speaker is asleep and dreaming about traveling to see the friend.","The speaker is planning an upcoming trip to the friend’s house.","The speaker is too fatigued to continue a discussion with the friend.","The speaker is thinking about the friend instead of immediately falling asleep."],"a":3,"r":"Choice D is the best answer it most accurately states the main idea of the text. The speaker describes going to bed for “repose” (rest) but finding that his thoughts are focused on the friend the speaker is addressing, and the thoughts are keeping the speaker awake. Choice A is incorrect because the speaker isn’t asleep; the thoughts about the friend are keeping the speaker awake. Choice B is incorrect because the speaker isn’t talking about taking a literal trip; rather, the speaker uses the metaphor of a journey to describe internal thoughts. Choice C is incorrect because the speaker isn’t having a discussion with the friend."},{"i":"f8befe75","c":"main","d":"M","s":"Many intellectual histories of the Black Power movement of the 1960s and 1970s rely heavily on essays and other explicitly ideological works as primary sources, a tendency that can overrepresent the perspectives of a small number of thinkers, most of whom were male. Historian Ashley D. Farmer has shown that expanding the array of primary sources to encompass more types of print material—including political cartoons, advertisements, and artwork—leads to a much better understanding of the movement and the crucial and diverse roles that Black women played in shaping it.\n\nWhich choice best describes the main idea of the text?","o":["Farmer’s methods and research have enriched the historical understanding of the Black Power movement and Black women’s contributions to it.","Before Farmer’s research, historians had largely ignored the intellectual dimensions of the Black Power movement.","Other historians of the Black Power movement have criticized Farmer’s use of unconventional primary sources.","The figures in the Black Power movement whom historians tend to cite would have agreed with Farmer’s conclusions about women’s roles in the movement."],"a":0,"r":"Choice A is the best answer. It best describes the main idea of the text. The text starts by saying that historians of the Black Power movement are too reliant on openly ideological works, which were written mostly by men, as sources. The text then describes Farmer’s research: she has shown that including other kinds of sources leads to a better understanding of the Black Power movement and the role Black women played in it. Choice B is incorrect. This doesn’t describe the main idea of the text. In fact, it conflicts with the text. The text says that historians have relied on \"essays and other explicitly ideological works,\" which suggests that they have studied at least some of the intellectual dimensions of the Black Power movement. Choice C is incorrect. This doesn’t describe the main idea of the text. The text never mentions how other historians of the Black Power movement view Farmer’s use of unconventional sources. In fact, the text itself argues in favor of Farmer’s research, claiming that it has led to a \"much better understanding of the movement.\" Choice D is incorrect. This doesn’t describe the main idea of the text. The text never mentions what any figures in the Black Power movement thought about women’s roles in the movement."},{"i":"e6e6be2d","c":"infer","d":"H","s":"Overgrazing by purple sea urchins has caused many kelp forests along North America’s west coast to be replaced by urchin barrens—areas stripped of vegetation and covered in purple sea urchins. Urchins in barrens persist in a state of starvation that lessens their nutritional value— and thus their appeal—to many predators. Sarah Gravem and colleagues placed sunflower sea stars, a once-abundant predator species suffering massive population declines in recent years, in aquariums that each contained a nutritionally poor and a nutritionally rich purple sea urchin. The researchers found that the sea stars selected the nutritionally rich urchin in 42.7% of trials and the nutritionally poor urchin in 37.5% of trials, suggesting that ______ Which choice most logically completes the text?","o":["sunflower sea stars are willing to hunt sea urchins, but if given a choice, they will prey on other more nutritious marine animals instead.","sunflower sea stars are reluctant to feed on both nutritionally poor and nutritionally rich sea urchins and are therefore unlikely to thrive in kelp forests.","sunflower sea stars are less likely to consume sea urchins in barrens than other species of sea stars are, putting sunflower sea stars at a high risk of extinction.","sunflower sea stars do not always avoid foraging on nutritionally poor sea urchins, making sunflower sea star population recovery a potentially important tool for controlling urchin barrens."],"a":3,"r":"Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the researchers’ findings about purple sea urchins and sunflower sea stars. The text explains that urchin barrens are areas that used to be kelp forests but are now covered by purple sea urchins. The text suggests that because there is no more vegetation to be consumed in those areas, the urchins exist in a state of starvation that makes them less nutritional for many predators. The text goes on to explain that in a study with a choice between two purple sea urchins, sunflower sea stars (a predator species that has been substantially declining) consumed a nutritionally rich urchin 42.7% of the time and a nutritionally poor urchin 37.5% of the time. Because the sunflower sea stars didn’t always avoid consuming nutritionally poor urchins, even when nutritionally rich ones were available, it follows that helping sunflower sea star populations to grow could help control urchin barrens by increasing the number of sea stars that may consume and thus remove nutritionally poor purple sea urchins from barrens. Choice A is incorrect because the text indicates only that when presented with purple sea urchins, the sunflower sea stars in the study consumed both nutritionally rich and nutritionally poor ones. It doesn’t suggest that sunflower sea stars generally prefer other marine animals that are more nutritious; there’s no mention of other marine animals. Choice B is incorrect because the text doesn’t suggest that sunflower sea stars are generally reluctant to feed on sea urchins. In fact, the text indicates that the sunflower sea stars in the study did consume sea urchins, feeding on both nutritionally poor and nutritionally rich ones. Choice C is incorrect because the text addresses only the willingness of sunflower sea stars to consume the type of sea urchins found in barrens (nutritionally poor sea urchins), not how likely other species of sea stars are to consume them."},{"i":"b5e9f3c2","c":"infer","d":"H","s":"Ancestral Puebloans, the civilization from which present-day Pueblo tribes descended, emerged as early as 1500 B.C.E. in an area of what is now the southwestern United States and dispersed suddenly in the late 1200s C.E., abandoning established villages with systems for farming crops and turkeys. Recent analysis comparing turkey remains at Mesa Verde, one such village in southern Colorado, to samples from modern turkey populations in the Rio Grande Valley of north central New Mexico determined that the latter birds descended in part from turkeys cultivated at Mesa Verde, with shared genetic markers appearing only after 1280. Thus, researchers concluded that ______ Which choice most logically completes the text?","o":["conditions of the terrains in the Rio Grande Valley and Mesa Verde had greater similarities in the past than they do today.","some Ancestral Puebloans migrated to the Rio Grande Valley in the late 1200s and carried farming practices with them.","Indigenous peoples living in the Rio Grande Valley primarily planted crops and did not cultivate turkeys before 1280.","the Ancestral Puebloans of Mesa Verde likely adopted the farming practices of Indigenous peoples living in other regions."],"a":1,"r":"Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of Ancestral Puebloans’ migration to the Rio Grande Valley. The text states that in the late 1200s C.E., the Ancestral Puebloan civilization abandoned villages in its original homeland, which included the Mesa Verde site. The text goes on to say that recent genetic analysis has demonstrated that the modern turkey population in the Rio Grande Valley descends partly from the ancient turkeys raised at Mesa Verde, and that the genetic markers shared by the two turkey populations first appeared at Mesa Verde only after 1280 C.E. Therefore, it can reasonably be concluded that some Ancestral Puebloans migrated to the Rio Grande Valley in the late 1200s and carried their agricultural practices—including the farming of turkeys—to their new home. Choice A is incorrect because the text never compares the condition of the Rio Grande Valley’s terrain to that of Mesa Verde’s terrain, either in the present or in the past. Choice C is incorrect. Although genetic analysis has demonstrated that the modern turkey population in the Rio Grande valley descended in part from the turkey population raised by the Ancestral Puebloans of Mesa Verde before their migration to the valley in 1280, this finding doesn’t eliminate the possibility that Indigenous peoples living in the valley before 1280 might also have farmed turkeys. Choice D is incorrect. The text doesn’t consider the possibility that before their migration to the Rio Grande Valley after 1280, the Ancestral Puebloans of Mesa Verde might have adopted turkey farming from an outside Indigenous civilization in another region; instead, the text provides evidence suggesting that the Ancestral Puebloans brought turkey farming to another region—the Rio Grande Valley—after 1280."},{"i":"dd1757fd","c":"claim","d":"H","s":"Neural networks are computer models intended to reflect the organization of human brains and are often used in studies of brain function. According to an analysis of 11,000 such networks, Rylan Schaeffer and colleagues advise caution when drawing conclusions about brains from observations of neural networks. They found that when attempting to mimic grid cells (brain cells used in navigation), while 90% of the networks could accomplish navigation-related tasks, only about 10% of those exhibited any behaviors similar to those of grid cells. <u>But even this approximation of grid-cell activity has less to do with similarity between the neural networks and biological brains than it does with the rules programmed into the networks.<\/u> Which finding, if true, would most directly support the claim in the underlined sentence?","o":["The rules that allow for networks to exhibit behaviors like those of grid cells have no equivalent in the function of biological brains.","The networks that do not exhibit behaviors like those of grid cells were nonetheless programmed with rules that had proven useful in earlier neural-network studies.","Neural networks can often accomplish tasks that biological brains do, but they are typically programmed with rules to model multiple types of brain cells simultaneously.","Once a neural network is programmed, it is trained on certain tasks to see if it can independently arrive at processes that are similar to those performed by biological brains."],"a":0,"r":"Choice A is the best answer. While many networks can perform navigation tasks, or even mimic grid cells, it doesn’t mean they’re actually behaving like biological brains—this finding suggests that the rules that govern neural network behavior are completely unlike the way real brains work. Choice B is incorrect. Although it mentions the rules that are programmed into the networks, this finding wouldn’t clarify whether or not these rules have anything to do with the function of biological brains. Choice C is incorrect. This choice suggests that neural networks are modeled after multiple types of brain cells, which sidesteps the question of whether these rule-based networks are genuinely similar to biological brains. Choice D is incorrect. This choice doesn’t address the key point of the claim, which is that the apparent similarity between neural networks and biological brains is only due to the rules programmed into the networks. It focuses on training tasks, not the originally programmed rules."},{"i":"378c66d5","c":"claim","d":"H","s":"A member of the Otomi, an Indigenous people in Central Mexico, Octavio Medellín immigrated to the United States as a child, and his sculpture bears the impress of traditions on both sides of the border: US-based modernist sculpture, Mexican modernist painting, Otomi art, and the ancient sculpture of other Mexican Indigenous peoples, including the Maya. <u>In his 1950 masterpiece History of Mexico, Medellín fuses these influences into a style so idiosyncratic that it resists efforts to view his work through the lens of nationality or cultural identity.<\/u> Artists, he insisted, should strive for individual expression, even as they draw inspiration from their heritage and the communities where they live and work.\n\nWhich quotation from an art critic most directly challenges the underlined claim in the text?","o":["“Although a number of ancient Indigenous artistic traditions pictured human forms in profile, the forms populating the surface of A History of Mexico suggest a specifically Maya influence.”","“In A History of Mexico, the synthesis of ancient and modernist traditions functions as a stylistic parallel to the work’s subject matter: a survey of centuries of Mexican history.”","“Many critics focus on Indigenous influences in A History of Mexico and other key works by Medellín to the exclusion of influences from non- Indigenous art.”","“While A History of Mexico features modernist motifs, it relies primarily on angular human forms in profile—a staple of Maya sculpture—and thus invites classification as Indigenous art.”"],"a":3,"r":"Choice D is the best answer. This critic challenges the claim by arguing that A History of Mexico is not so idiosyncratic (unique) as to resist classification because its use of Maya-style human profiles actually “invites classification as Indigenous art.”Therefore, according to this critic, the work can be viewed, at least partially, through a lens of national or cultural identity. Choice A is incorrect. While it describes the Maya influence on a particular aspect of A History of Mexico, this quotation doesn’t push back on Medellín’s “idiosyncratic” (unique) style, nor does it try to categorize the entire work into a single cultural tradition. Choice B is incorrect. This choice doesn’t directly challenge the underlined claim, but rather supports it. It suggests that the work effectively blends a variety of artistic products to create a single work that can’t be defined by any one tradition. Instead, the work recalls many centuries of history and culture all at once. Choice C is incorrect. This choice supports rather than challenges the underlined claim. The quotation argues that other critics focus too much on Indigenous influences on the artwork instead of viewing all of the influences equally—that they should instead be viewing the work as an idiosyncratic whole instead of through one or two narrow cultural lenses."},{"i":"bc7b1a04","c":"graph","d":"H","s":"","o":["above 344 km/s but below 378 km/s.","above 297 km/s but below 344 km/s.","above 378 km/s.","below 297 km/s."],"a":0,"r":"Choice A is the best answer because it uses data from the table to give the range of velocities for the LMC from the 1980 value (344 km/s) to the 2006 value (378 km/s), thereby effectively completing the text. The text indicates that before 2006, all the estimated velocities of the LMC were within the range necessary to maintain orbit around the Milky Way galaxy. It then indicates that, according to Besla and colleagues, the 2006 estimate of 378 km/s is too high to maintain that orbit. This strongly implies that if the 1980 value (344 km/s) is below the orbital threshold, and if Besla and colleagues are correct that the 2006 value (378 km/s) is above that threshold, the maximum orbital velocity for the LMC must be somewhere in the range from above 344 km/s to below 378 km/s. Choice B is incorrect. The text indicates that the 2006 velocity estimate for the LMC (378 km/s) was the first estimate that exceeded the velocity needed to maintain orbit around the Milky Way. Thus, the 1980 estimate of 344 km/s and the 1994 estimate of 297 km/s must both be below the maximum possible orbital velocity for the LMC. Choice C is incorrect. The text states that Besla and colleagues’ analysis found that the velocity from the 2006 study (378 km/s) was too high for the LMC to maintain orbit around the Milky Way. Therefore, if a velocity of 378 km/s is too high, an even higher velocity will also be too high. Choice D is incorrect. The text indicates that the 2006 velocity estimate for the LMC (378 km/s) was the first to exceed the velocity range required to maintain orbit around the Milky Way. Thus, the 1994 estimate of 297 km/s must be below the maximum possible orbital velocity for the LMC."},{"i":"3fc06a91","c":"graph","d":"H","s":"","o":["1900 with the employment by sector in 1950.","1800 with the employment by sector in 2012.","1900 with the employment by sector in 2012.","1800 with the employment by sector in 1900."],"a":0,"r":"Choice A is the best answer because it presents data from the table that most effectively complete the statement about the rates at which employment shifted in France and the United States. The text states that over the last two hundred years employment in the agricultural sector has declined while employment in the service sector has risen in both France and the US, and the data from the table reflect these trends. The text asserts, however, that the transition from agriculture to services “happened at very different rates in the two countries.” This assertion is best supported by a comparison of data from 1900 and 1950: the table shows that in those years, employment in agriculture went from 43% to 32% in France (a decline of 11 percentage points) and from 41% to 14% in the US (a decline of 27 percentage points), and that employment in services went from 28% to 35% in France (an increase of 7 percentage points) and from 31% to 53% in the US (an increase of 22 percentage points). In other words, the rate of change was greater in the US than in France for both sectors. Choice B is incorrect because comparing the data for 1800 and 2012 would suggest a similar rate of change in the two countries, not very different rates: employment in agriculture went from 64% in 1800 to 3% in 2012 in France, which is close to the change from 68% in 1800 to 2% in 2012 in the US, while employment in services went from 14% in 1800 to 76% in 2012 in France, which is close to the change from 13% in 1800 to 80% in 2012 in the US. Choice C is incorrect because comparing the data for 1900 and 2012 would suggest a similar rate of change in the two countries rather than very different rates: employment in agriculture went from 43% in 1900 to 3% in 2012 in France, which is close to the change from 41% in 1900 to 2% in 2012 in the US, while employment in services went from 28% in 1900 to 76% in 2012 in France, which is close to the change from 31% in 1900 to 80% in 2012 in the US. Choice D is incorrect because comparing the data for 1800 and 1900 would suggest a similar rate of change in the two countries, not very different rates: employment in agriculture went from 64% in 1800 to 43% in 1900 in France, which is fairly close to the change from 68% in 1800 to 41% in 1900 in the US, while employment in services went from 14% in 1800 to 28% in 1900 in France, which is close to the change from 13% in 1800 to 31% in 1900 in the US."},{"i":"4a90a978","c":"fss","d":"E","s":"In 1990, California native and researcher Ellen Ochoa left her position as chief of the Intelligent Systems Technology Branch at a NASA research center ______ the space agency’s astronaut training program.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["to join","is joining","joined","joins"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of nonfinite verb forms in a sentence. The nonfinite to-infinitive verb \"to join\" is correctly used to form a subordinate clause that expresses why Ochoa left her position (to join the training program). Choice B is incorrect because the finite verb \"is joining\" can’t be used in this way to indicate Ochoa’s action of joining the training program. A conjunction such as \"and\" would be needed to coordinate \"is joining\" with the previous finite verb, \"left.\" Choice C is incorrect because the finite verb \"joined\" can’t be used in this way to indicate Ochoa’s action of joining the training program. A conjunction such as \"and\" would be needed to coordinate \"joined\" with the previous finite verb, \"left.\" Choice D is incorrect because the finite verb \"joins\" can’t be used in this way to indicate Ochoa’s action of joining the training program. A conjunction such as \"and\" would be needed to coordinate \"joins\" with the previous finite verb, \"left.\""},{"i":"a75d5984","c":"fss","d":"H","s":"Several advantages—the ability to react strongly with chip components, to avoid interference from other waves, and to be confined within tiny circuits—______ acoustic waves as a promising alternative to electrical waves for transmitting data on computer chips; as a result, researchers are invested in developing more acoustic wave–based chips.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["have positioned","positioning","by positioning","having positioned"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject. In this case, the subject is \"several advantages,\" and the present perfect tense verb \"have positioned\" supplies the finite verb to indicate what has made acoustic waves a promising alternative to electrical waves. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"positioning\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The prepositional phrase \"by positioning\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"having positioned\" doesn’t supply the main clause with a finite verb."},{"i":"8a9d2f4e","c":"fss","d":"H","s":"Researchers studying the “terra-cotta army,” the thousands of life-size statues of warriors found interred near the tomb of Emperor Qin Shi Huang of China, were shocked to realize that the shape of each statue’s ears, like the shape of each person’s ears, ______ unique.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are","is","were","have been"],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-verb agreement. The singular verb \"is\" agrees in number with the singular subject \"the shape.\" Choice A is incorrect because the plural verb \"are\" doesn’t agree in number with the singular subject \"the shape.\" Choice C is incorrect because the plural verb \"were\" doesn’t agree in number with the singular subject \"the shape.\" Choice D is incorrect because the plural verb \"have been\" doesn’t agree in number with the singular subject \"the shape.\""},{"i":"2b512e65","c":"bound","d":"M","s":"Eli Eisenberg, a genetics expert at Tel Aviv University in Israel, recently discovered that ______ have a special genetic ability called RNA editing that confers evolutionary advantages.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["cephalopods, ocean dwellers that include the squid, the octopus, and the cuttlefish","cephalopods—ocean dwellers—that include the squid, the octopus, and the cuttlefish,","cephalopods, ocean dwellers that include: the squid, the octopus, and the cuttlefish,","cephalopods—ocean dwellers that include the squid, the octopus, and the cuttlefish—"],"a":3,"r":"Choice D is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. In this choice, the dash after \"cephalopods\" pairs with the dash after \"cuttlefish\" to clearly separate the supplementary element \"ocean dwellers that include the squid, the octopus, and the cuttlefish\" from the rest of the sentence. This supplementary element functions to explain what cephalopods are, and the pair of dashes indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because it fails to use appropriate punctuation to separate the supplementary element that explains what cephalopods are from the rest of the sentence. Choice B is incorrect because it fails to use appropriate punctuation to separate the supplementary element that explains what cephalopods are from the rest of the sentence. Choice C is incorrect because it fails to use appropriate punctuation to separate the supplementary element that explains what cephalopods are from the rest of the sentence."},{"i":"60713427","c":"bound","d":"E","s":"Polyphenols are organic compounds ______ among their many roles, provide pigment that helps protect plants against ultraviolet radiation from sunlight.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["that—","that;","that,","that:"],"a":2,"r":"Choice C is the best answer. The convention being tested is the punctuation of a supplementary element within a sentence. The comma after “that” pairs with the comma after “roles” to separate the supplementary element “among their many roles” from the rest of the sentence. This supplementary element functions to clarify that polyphenols have many roles, and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence. Choice A is incorrect because a dash can’t be paired with a comma to separate the supplementary element from the rest of the sentence. Choice B is incorrect because a semicolon can’t be paired with a comma to separate the supplementary element from the rest of the sentence. Choice D is incorrect because a colon can’t be paired with a comma to separate the supplementary element from the rest of the sentence."},{"i":"ce282575","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: J.R.R. Tolkien’s 1937 novel The Hobbit features two maps. The novel opens with a reproduction of the map that the characters use on their quest. This map introduces readers to the fictional world they are about to enter. The novel closes with a map depicting every stop on the characters’ journey. That map allows readers to reconstruct the story they have just read. The student wants to contrast the purposes of the two maps in The Hobbit.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Hobbit’s opening map introduces readers to the fictional world they are about to enter, while the closing map allows them to reconstruct the story they have just read.","The Hobbit, a novel published by J.R.R. Tolkien in 1937, features a reproduction of a map that the characters use on their quest, as well as a map that appears at the end of the novel.","The Hobbit’s two maps, one opening and one closing the novel, each serve a purpose for readers.","In 1937, author J.R.R. Tolkien published The Hobbit, a novel featuring both an opening and a closing map."],"a":0,"r":"Choice A is the best answer. The sentence contrasts the purposes of the two maps in The Hobbit, noting that the opening map introduces readers to the book’s fictional world, while the closing map helps readers reconstruct the story. The word “while” helps signal a contrast between the purposes of the maps. Choice B is incorrect. While the sentence mentions the two maps, it doesn’t contrast the maps’ purposes. Choice C is incorrect. While the sentence mentions the two maps and notes that each has a purpose, it doesn’t specify what those purposes are or how they contrast. Choice D is incorrect. While the sentence mentions the two maps, it doesn’t contrast the maps’ purposes."},{"i":"bb43fc3c","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Pedestrian malls are outdoor streets in a city or town where vehicle traffic is prohibited. Many pedestrian malls were built in the 19th and 20th centuries in Europe and Asia. Qianmen Dajie is a famous pedestrian mall in Beijing. It has existed since the Ming dynasty (1368–1644 CE). Rue Mouffetard is a famous pedestrian mall in Paris. It has existed since the mid-Roman Empire (117–235 CE). The student wants to emphasize a similarity between the ages of the malls.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Qianmen Dajie pedestrian mall has roots as far back as the Ming dynasty; likewise, Rue Mouffetard has existed for centuries.","Both Qianmen Dajie and Rue Mouffetard are famous pedestrian malls, the former in Beijing and the latter in Paris.","Qianmen Dajie and Rue Mouffetard are pedestrian malls, outdoor streets closed to vehicle traffic.","Qianmen Dajie and Rue Mouffetard are examples of pedestrian malls, which proliferated in Europe in the 19th and 20th centuries."],"a":0,"r":"Choice A is the best answer. The sentence emphasizes a similarity between the ages of the two pedestrian malls, noting that both are relatively old—Qianmen Dajie has roots that go back hundreds of years and Rue Mouffetard has existed for centuries. Choice B is incorrect. The sentence emphasizes that both locations are famous pedestrian malls and notes that they are in different locations; it doesn’t emphasize a similarity in their ages. Choice C is incorrect. While the sentence emphasizes that both locations are pedestrian malls, it doesn’t emphasize a similarity in their ages. Choice D is incorrect. The sentence explains that Qianmen Dajie and Rue Mouffetard are examples of pedestrian malls and gives information about pedestrian malls in general; it doesn’t emphasize a similarity in the ages of these two malls specifically."},{"i":"1a8126aa","c":"trans","d":"M","s":"In 2019, researcher Patricia Jurado Gonzalez and food historian Nawal Nasrallah prepared a stew from a 4,000-year-old recipe found on a Mesopotamian clay tablet. When they tasted the dish, known as pašrūtum (“unwinding”), they found that it had a mild taste and inspired a sense of calm. ______ the researchers, knowing that dishes were sometimes named after their intended effects, theorized that the dish’s name, “unwinding,” referred to its function: to help ancient diners relax.\n\nWhich choice completes the text with the most logical transition?","o":["Therefore,","Alternately,","Nevertheless,","Likewise,"],"a":0,"r":"Choice A is the best answer. \"Therefore\" logically signals that the action described in this sentence—the researchers theorizing that the dish was named for its effect on diners—is a result or consequence of the previous observation that the dish had a calming effect. Choice B is incorrect because \"alternately\" illogically signals that the action described in this sentence offers an alternative or contrast to the previous observation that the dish had a calming effect. Instead, the action is a result or consequence of that observation. Choice C is incorrect because \"nevertheless\" illogically signals that the action described in this sentence occurs despite the previous observation that the dish had a calming effect. Instead, the action is a result or consequence of that observation. Choice D is incorrect because \"likewise\" illogically signals that this sentence merely adds a second, similar detail to the previous observation that the dish had a calming effect. Instead, this sentence describes an action that is a result or consequence of that observation."},{"i":"b6ebadf6","c":"trans","d":"E","s":"There are three basic steps you should follow when planning a scientific inquiry. First, thoroughly research the question you wish to answer. ______ come up with a prediction (also called a hypothesis) about the answer to your question. Third, develop an experiment that can test the accuracy of your hypothesis.\n\nWhich choice completes the text with the most logical transition?","o":["Therefore,","Instead,","For example,","Second,"],"a":3,"r":"Choice D is the best answer. \"Second\" logically signals that the activity described in this sentence—coming up with a prediction—is the next step in the three-part sequence of steps described in the text. Choice A is incorrect because \"therefore\" illogically signals that coming up with a prediction is a result or consequence of the activity described in the previous sentence: researching a question. While a prediction may be influenced by prior research, these activities are distinct steps in planning a scientific inquiry. Coming up with a prediction is the next step in the three-part sequence of steps described in the text. Choice B is incorrect because \"instead\" illogically signals that coming up with a prediction is an alternative to the activity described in the previous sentence: researching a question. Rather, coming up with a prediction is the next step in the three-part sequence of steps described in the text. Choice C is incorrect because \"for example\" illogically signals that coming up with a prediction is an example of the activity described in the previous sentence: researching a question. Instead, coming up with a prediction is the next step in the three-part sequence of steps described in the text."},{"i":"4703eafb","c":"trans","d":"M","s":"Following the American Revolutionary War, North American foodways underwent a radical transformation, fueled in large part by spiking consumer demand for certain grains. The cultivation, trade, and transportation of maize and wheat, ______ reconfigured the continent’s existing regional foodways into a globally oriented food system.\n\nWhich choice completes the text with the most logical transition?","o":["in particular,","alternatively,","by comparison,","second of all,"],"a":0,"r":"Choice A is the best answer. \"In particular\" logically signals that the information in this sentence—that maize and wheat supply chains transformed North American foodways into a global food system—provides specific, precise details elaborating on the more general information in the previous sentence about the transformation of North American foodways (with maize and wheat the \"certain grains\" at the center of it). Choice B is incorrect because \"alternatively\" illogically signals that the information in this sentence is an alternative option to the previous information about the transformation of North American foodways. Instead, the roles of maize and wheat in creating a global food system are specific, precise details elaborating on that information. Choice C is incorrect because \"by comparison\" illogically signals that the information in this sentence is being compared to the previous information about the transformation of North American foodways. Instead, the roles of maize and wheat in creating a global food system are specific, precise details elaborating on that information. Choice D is incorrect because \"second of all\" illogically signals that the information in this sentence is a second, separate claim from the previous claim that North American foodways were transformed. Instead, the roles of maize and wheat in creating a global food system are specific, precise details elaborating on that information, rather than a separate claim."}],"img":{"bc7b1a04":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEQBAMAAACgorp4AAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABJgElEQVR42u1dd3gTx9N+906Su7Vnm2rA50YvZ3ooQfQWQNQQqgidhCAgdPhFBEINiamhI1pCDTItQAIIQkIH0ZuNZWoI2FqZ7qL9/rANBgwmCXwB4nl48Glvd3b23bndmdm9PSCHciiHciiHciiHcuhNJj/JT4jI/JumX4hy2pUgQwqhAEDoEyUFJWuOFARAaNoP8ji9ngyKtH8C/a/AO8oRU972+Kd/zFkEAxTwCTUDANz1JDXGAkB2M2YACwBUsAGljc8AJZ5CQQMwIg1YD316JxDVaYoT8HTCPVEVfe0/o75NZeF4TZRVAmSEKcTHUK35VkkWaUApRRFqI5zmVsgxQK2IW/zkiJqiggC5YxehJhErWAk6mwQItDzEULSEKkQWdQQr8D4C5OEIk4mgU/nvDYEfECbn3QD6K/G4i8BEH2MZw7/QUtW/AS9nJE+fo6sHTUxpOsurKpeXlA2t0GikNPfKV/MntcDglA52cJCZUofahSu3u9S2TJXvU+/f+dOAQB04Gnq7DTm0f+a5Xhu7f+hblUz/pLSdnaQdfpvl+bt6+a3G7QxflCzXcNO4dprlFybUpYyCXEctpkxV+f1ntJeKl0rXvONl6ugZ2RTioWkY72YulPtY6TDrT5ot1p4Akg9F3HaTv/cwX82/u4xg6FRcf9rdeja3FaJ1tmibVEjZ6muoqL6aWLp2nI8OBXUnPCM7jPA1ThHu5ZvcZVkBfRwKGea7LwZOwquvsurXDvhXxl7hX0L4Yox0iLY30Q9MSG3opeMA99t5kZDcm71S/gTIuaGOSfPsDrBbCUcSgkp9QXe5/ea8GU+h9tf43PHGfIVbjp0VFkaHBO6miC/vI31g4qnmb2ocuB7JeXzrWFrQHFkwCOBA0sB8spOw/wy8HISiEBVWtHb+1pXmudlPrwUYoQQ8X49OH/YGkPKLfdlBxQFQQLoWZmDEo55BBqC+JslbvJUhDSjGVmSKYL/a1YrkhpHO3z6EP404LhEASXkiIco00Q5wcM/Kh3mc1tP4X4GXgFPipLeUCi4hD7s7vZZdFVRuwJ91W1C6J6BB5HEAYeXDdjEaJoEQygRhAJqeDO28rxKgb9AucsPFHUodJ1CkYHgLn7v3KJL9zClCiBA/sEa8uqoBAT6ilR3u2slJAXX5YMeVKBI9vaXtvwLvLcatKXbrgxtNH9wYiXvFh5k3NDpQLfW7agnWzrO25ssD8H0r+67qbV1e0rbDZUt5+DDl1sf6GdYvzFbk40n289Z7jUqmYFHk2sG6hMGLGLCKPXj4WfT9fG4YNP8btkkXzXDvPbdUG3BqTlP78F3W+x5trTkex8sSTXMfBFMzJaspS/jtiZz/HglvEmI0MxzkyXvkiTQGQEuB/B/aWBYoqqOfyJlDWY7Q2d8XZPKkmtKXKvpfecCzB5c8jRZ99JuQ7LmRHKj/w0/gP6GAmllXydP1LcthMT01LRN1ugh1curkoJlHUcpAOGWZeBBOGWVpf4n26RGXvmgE5 function card(q,n){const a=ans[q.i];
