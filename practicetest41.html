<script>
const D={"t":"Practicetest41","q":[{"i":"d4e8662d","c":"vocab","d":"M","s":"The percentage of US forest land that a 2023 federal report identified as being either mature or old growth exceeds other recent estimates. Given how little ______ there is among scientists regarding the scope of these categories, this discrepancy shouldn’t be surprising: forest researchers regularly dispute one another’s classifications.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["deliberation","vigilance","interest","consensus"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of US forest land classifications. In this context, \"consensus\" means agreement. The text indicates that a percentage given in a US forest land report differs from other estimates and that this discrepancy isn’t surprising, given that forest researchers regularly dispute one another’s classifications of parts of US forest land as either mature or old growth. This context conveys that there is little agreement when it comes to these categories. Choice A is incorrect because the text states that there is often dispute among forest researchers about classifications of US forest land as either mature or old growth, which directly indicates that when it comes to these categories, there is much \"deliberation,\" or discussion and consideration, not little deliberation. Choice B is incorrect because the text indicates that there is often dispute among forest researchers about classifications of US forest land as either mature or old growth; this doesn’t imply that there is little \"vigilance,\" or careful attention, among researchers when it comes to these categories but rather conveys that researchers do pay attention to forest land classifications and question one another’s decisions. Choice C is incorrect because the text indicates that there is often dispute among forest researchers about classifications of US forest land as either mature or old growth; this doesn’t imply that there is little \"interest,\" or concern, among researchers when it comes to these categories but rather conveys that researchers are concerned with forest land classifications and pay attention to one another’s classifications."},{"i":"a5e747f0","c":"vocab","d":"H","s":"Despite how ______ they may seem on first glance, the works of the philosopher Georg Hegel have proven to be quite influential. Readers who manage to penetrate Hegel’s frustratingly dense prose often find that his thrillingly original and profound ideas wind up shaping their own thinking.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["authoritative","opaque","empirical","facile"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Hegel’s works. In this context, \"opaque\" means difficult to understand or unclear. The text creates a contrast between the initial impression given by Hegel’s works and their influence and insight, noting that readers must \"penetrate Hegel’s frustratingly dense prose\" to access his important ideas. This context clearly establishes that Hegel’s writing is initially challenging to comprehend, or opaque. Choice A is incorrect because \"authoritative\" means influential or clearly accurate. Hegel’s works may be authoritative, but it wouldn’t make logical sense in context to say that although his works seem authoritative, they have been influential. Instead, the text focuses on the fact that Hegel’s works are challenging to read, but that working through the dense prose can be rewarding. Choice C is incorrect because referring to Hegel’s works as \"empirical,\" which means factual or verifiable, would suggest that they are based on observation or experience rather than theory. The text, however, doesn’t address this aspect of Hegel’s philosophy. Instead, it focuses on the difficulty of understanding his writing. Choice D is incorrect because describing Hegel’s works as \"facile,\" which means superficial or simplistic, would directly contradict the text’s characterization of his writing as \"frustratingly dense\" and requiring effort to understand."},{"i":"710799ae","c":"vocab","d":"M","s":"Cuttlefish appear to be surprisingly ______ at exercising self-control: in a 2021 study conducted by behavioral ecologist Alexandra Schnell, these cephalopods routinely demonstrated restraint by delaying gratification, waiting for a favorite treat instead of instantly devouring a readily available meal.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["awkward","imaginative","manageable","competent"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of self-control in cuttlefish. In this context, \"competent\" means capable. The text describes a study in which cuttlefish demonstrated an ability to exercise restraint by waiting for a favorite treat instead of eating a meal that was already available to them. That is, by delaying gratification, the cuttlefish in the study demonstrated that they were capable of, or competent at, exercising self-control. Choice A is incorrect because nothing in the text suggests that in demonstrating self-control, cuttlefish are \"awkward,\" or lacking skill or grace. If anything, the text indicates that cuttlefish appear to be surprisingly skilled at exercising self-control. Choice B is incorrect because in this context, \"imaginative\" would mean creative, and there’s nothing in the text to suggest that cuttlefish demonstrate creativity. Instead, the text focuses on the fact that cuttlefish seem to be capable of exercising restraint and self-control. Choice C is incorrect because in this context, \"manageable\" would mean capable of being controlled. Although the text indicates that the cuttlefish in the study demonstrated restraint by waiting for a favorite treat instead of devouring a readily available meal (which suggests their ability to control themselves), it doesn’t suggest that cuttlefish are thus also able to be managed or controlled by others."},{"i":"a756aa95","c":"vocab","d":"H","s":"The province of Xoconochco was situated on the Pacific coast, hundreds of kilometers southeast of Tenochtitlan, the capital of the Aztec Empire. Because Xoconochco’s location within the empire was so ______, cacao and other trade goods produced there could reach the capital only after a long overland journey.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["unobtrusive","concealed","approximate","peripheral"],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of the location of the province of Xoconochco within the Aztec Empire. As used in this context, “peripheral” means situated toward the outer bounds rather than the center. The text indicates that Xoconochco was located on a coast, hundreds of kilometers away from the capital of the Aztec Empire. The text also states that trade between the province and the capital required “a long overland journey.” This context suggests that Xoconochco was situated toward an edge of the empire’s territory rather than near its center. Choice A is incorrect because it wouldn’t make sense in context to refer to Xoconochco’s location within the Aztec Empire as “unobtrusive,” or not blatant or undesirably prominent; it’s not clear how a province’s physical location would or wouldn’t be blatant. Instead of focusing on how noticeable Xoconochco’s location was, the text emphasizes the province’s distance from the capital of the empire, pointing out that because of this distance trade between the two required “a long overland journey.” Choice B is incorrect because the text indicates that the province of Xoconochco was located on a coast far from the capital of the Aztec Empire, not that it was “concealed,” or kept out of sight or hidden from view. Nothing in the text suggests that Xoconochco was actually hidden such that people couldn’t see it, and being hidden wouldn’t necessarily result in trade between the province and the capital requiring “a long overland journey.” Choice C is incorrect because to say that Xoconochco’s location within the Aztec Empire was “approximate” would mean that the location either wasn’t precisely correct or was close to some other location. Neither of these meanings would make sense in context because the text indicates that Xoconochco’s location is known and that it was far from the empire’s capital, so there’s no reason to characterize the location as either not precisely correct or close to another location."},{"i":"a2dd51c1","c":"purpose","d":"E","s":"In most building demolitions, the building materials are destroyed and sent to landfills. City officials in Portland, Oregon, wanted to reduce this waste. The officials passed a law requiring demolition companies to deconstruct some buildings instead. Deconstruction involves carefully taking buildings apart piece by piece. Damage to the materials is avoided so that they can be reused in new constructions. A 2019 study found that 27 percent of materials from deconstructions in Portland were able to be reused. The remaining materials were processed for recycling instead of going to a landfill.\n\nWhich choice best states the main purpose of the text?","o":["To explain an effort made by the city of Portland to reduce demolition waste and some results of that effort","To show that popular support for measures that reduce demolition waste has increased since 2019","To argue that building deconstruction is not as effective as other measures at reducing demolition waste","To discuss laws aimed to reduce demolition waste in Portland and compare them to similar laws in other cities"],"a":0,"r":"Choice A is the best answer. The author first describes a Portland law aimed at reducing demolition waste, and then goes on to explain that 27% of materials from building deconstructions were able to be reused and the rest were recycled. Choice B is incorrect. The text never discusses the popularity of the law. Choice C is incorrect. The text never compares building deconstruction to other measures designed to reduce demolition waste. Choice D is incorrect. The text never mentions laws in cities other than Portland, Oregon."},{"i":"edbc6cca","c":"purpose","d":"E","s":"The following text is from Bram Stoker’s 1911 novel The Lair of the White Worm. Adam is meeting his great-uncle Richard at a port. The meeting so auspiciously begun proceeded well. Adam, seeing that the old man was interested in the novelty of the ship, suggested that he should stay the night on board, and that he would himself be ready to start at any hour and go anywhere that the other suggested. This affectionate willingness to fall in with his own plans quite won the old man’s heart. He warmly accepted the invitation, and at once they became not only on terms of affectionate relationship, but almost like old friends.\n\nWhich choice best states the main purpose of the text?","o":["It states the reasons why Adam and his great-uncle Richard decide to sleep on the ship rather than finding lodging on land.","It showcases how Adam’s flexibility and consideration strengthen his relationship with his great-uncle Richard.","It describes why Adam and his great-uncle Richard are excited for their upcoming journey on the ship.","It contrasts great-uncle Richard’s wary first impressions of Adam with his ultimate affection toward him."],"a":1,"r":"Choice B is the best answer because it most accurately describes the main purpose of the text, which is to showcase how Adam’s flexibility and consideration strengthen his relationship with his great-uncle Richard. The text begins by stating that the meeting between the two characters is proceeding well and then describes Adam’s thoughtful behavior: noticing his great-uncle’s interest in the ship, Adam suggests staying on board overnight and expresses willingness to accommodate his great-uncle’s schedule and destination preferences. The text goes on to describe the positive effect of Adam’s thoughtfulness and flexibility, indicating that Adam’s “affectionate willingness” to accommodate Richard’s preferences “quite won the old man’s heart.” The text concludes by suggesting that Adam’s ability to anticipate his great-uncle’s wishes and willingness to accommodate them result in the rapid development of affection and intimacy between them, stating that they soon became “almost like old friends.” Therefore, the text’s main purpose is to demonstrate how Adam’s flexibility and consideration strengthened his and his great-uncle’s relationship. Choice A is incorrect. Although the text explains Adam’s reason for suggesting that Richard spend the night on the ship rather than finding lodging on land (which is that Adam perceives Richard’s interest in the ship), this isn’t the text’s main purpose. Rather, Adam’s suggestion about where to sleep for the night serves as an example of the consideration Adam shows toward Richard, and the text mentions it mainly to explain how an affectionate relationship developed so quickly between them. Moreover, the text only states that Adam encourages Richard to stay on the ship; it doesn’t specify where Adam plans to spend the night. Choice C is incorrect because the text doesn’t describe why Adam and his great-uncle Richard are excited about their journey. While the text mentions that Adam is willing to “start at any hour and go anywhere,” it provides no details about any planned journey, its destination, or even whether they will be continuing by ship or some other mode of transportation, nor does the text mention anything about either character’s feelings of excitement about their plans. We learn only that Adam is accommodating about potential travel plans, not that either character is particularly eager about the journey itself. The text’s main focus is on Adam and Richard’s developing relationship, not on any anticipated travel experiences. Choice D is incorrect because the text doesn’t show a contrast between initial wariness and later affection. On the contrary, the text begins by stating that the meeting between Adam and his great- uncle Richard has begun in an “auspicious,” or promising, manner and is “proceed[ing] well,” suggesting that Richard’s impression is positive from the outset. There’s no indication of any initial suspicion, caution, or reserve on Richard’s part that later changes to affection. Instead, the text describes a consistently positive interaction that deepens from a good first impression into a stronger, more familiar relationship because of Adam’s considerate behavior."},{"i":"29741ebc","c":"func","d":"E","s":"In the past, historians who wanted to examine Frederick Douglass’s diary and other personal papers had to visit the Library of Congress in Washington, DC, to view them on microfilm <u>(film containing scaled-down reproductions of documents)<\/u>. But traveling to the library often added time and costs to research projects. Now, by going to the library’s website, researchers can access digitized versions of Douglass’s papers without physically going anywhere.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It gives information about a famous person.","It explains the meaning of a word.","It describes a debate among historians.","It summarizes an unexpected finding."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The underlined portion is a parenthetical phrase directly following the word “microfilm,” and it describes film containing small (“scaled-down”) images; the placement and focus of the portion indicate that it is serving to define the term “microfilm.” Choice A is incorrect. Although the text is about accessing the writings of a famous historical figure (Douglass), the underlined portion doesn’t give information about Douglass or any other person. Instead, it explains what microfilms are. Choice C is incorrect because the text never describes any kind of debate or disagreement; it simply describes a change in how researchers can access historical documents, with the underlined portion defining an important term. Choice D is incorrect because the text never makes any mention of a particular finding, unexpected or otherwise; it simply describes a change in how researchers do some of their work, with the underlined portion defining an important term."},{"i":"1f2d6173","c":"func","d":"H","s":"Scholarly accounts of the Chicano movement—a movement that advocated for the social, political, and cultural empowerment of Mexican Americans and reached its zenith in the 1960s and 1970s—<u>tend to focus on the most militant, outspoken figures in the movement,<\/u> making it seem uniformly radical. Geographer Juan Herrera has shown, however, that if we shift our focus toward the way the movement manifested in comparatively low-profile neighborhood institutions and projects, we see participants espousing an array of political orientations and approaches to community activism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It presents a trend in scholarship on the Chicano movement that the text claims has been reevaluated by researchers in light of Herrera’s work on the movement’s participants.","It identifies an aspect of the Chicano movement that the text implies was overemphasized by scholars due to their own political orientations.","It describes a common approach to studying the Chicano movement that, according to the text, obscures the ideological diversity of the movement’s participants.","It summarizes the conventional method for analyzing the Chicano movement, which the text suggests creates a misleading impression of the effectiveness of neighborhood institutions and projects."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined portion functions in the text as a whole. The text begins by mentioning scholarly accounts of the Chicano movement, which the underlined portion describes as tending \"to focus on the most militant, outspoken figures in the movement,\" making the movement as a whole seem uniformly radical. The text then indicates that the work of geographer Juan Herrera shows that focusing less on such militant figures and instead paying more attention to manifestations of the Chicano movement in less widely known neighborhood institutions and projects would reveal that the movement’s participants embraced a range of political orientations and approaches. Thus, the underlined portion describes a common approach to studying the Chicano movement that, according to the text, obscures the ideological diversity of the movement’s participants. Choice A is incorrect. Though the underlined portion does present a trend in scholarship on the Chicano movement, the text does not indicate that other scholars have reevaluated their methods in light of Herrera’s work. It only indicates that Herrera’s work suggests that the work of those other scholars does not provide a complete picture of the Chicano movement. Choice B is incorrect. Though the underlined portion does identify an aspect of the Chicano movement that the text indicates has been overemphasized, the text does not discuss the political orientations of the scholars whose work is mentioned in the text. Choice D is incorrect. Though the underlined portion does summarize the conventional method for analyzing the Chicano movement, the rest of the text does not address the effectiveness of \"comparatively low-profile neighborhood institutions and projects.\" Instead, the text suggests that those projects were led by people with a variety of approaches to community activism."},{"i":"12d81fc1","c":"cross","d":"M","s":"Text 1 Because literacy in Nahuatl script, the writing system of the Aztec Empire, was lost after Spain invaded central Mexico in the 1500s, it is unclear exactly how meaning was encoded in the script’s symbols. Although many scholars had assumed that the symbols signified entire words, linguist Alfonso Lacadena theorized in 2008 that they signified units of language smaller than words: individual syllables.\n\nText 2 The growing consensus among scholars of Nahuatl script is that many of its symbols could signify either words or syllables, depending on syntax and content at any given site within a text. For example, the symbol signifying the word huipil (blouse) in some contexts could signify the syllable “pil” in others, as in the place name “Chipiltepec.” Thus, for the Aztecs, reading required a determination of how such symbols functioned each time they appeared in a text.\n\nBased on the texts, how would the author of\n\nText 2 most likely characterize Lacadena’s theory, as described in\n\nText 1?","o":["By praising the theory for recognizing that the script’s symbols could represent entire words","By arguing that the theory is overly influenced by the work of earlier scholars","By approving of the theory’s emphasis on how the script changed over time","By cautioning that the theory overlooks certain important aspects of how the script functioned"],"a":3,"r":"Choice D is the best answer. Lacadena’s theory is that Nahuatl script symbols signified syllables, but the consensus described in Text 2 is that they can signify either symbols or full words, depending on the context. So the author of Text 2 would likely consider Lacadena’s theory too simplistic: it’s missing the importance of the context in determining the meaning of a symbol. Choice A is incorrect. This conflicts with Text 1’s description of Lacadena’s theory. Lacadena’s theory is that Nahuatl script symbols signified syllables. Choice B is incorrect. This conflicts with Text 1’s description of Lacadena’s theory. Text 1 states that Lacadena’s theory differed from what earlier scholars believed. Choice C is incorrect. We can’t infer that this is how the author of Text 2 would characterize Lacadena’s theory. Neither text mentions how or even if the script changed over time."},{"i":"89961e26","c":"main","d":"E","s":"Artist Justin Favela explained that he wanted to reclaim the importance of the piñata as a symbol in Latinx culture. To do so, he created numerous sculptures from strips of tissue paper, which is similar to the material used to create piñatas. In 2017, Favela created an impressive life-size piñata-like sculpture of the Gypsy Rose lowrider car, which was displayed at the Petersen Automotive Museum in Los Angeles, California. The Gypsy Rose lowrider was famously driven by Jesse Valadez, an early president of the Los Angeles Imperials Car Club.\n\nAccording to the text, which piece of Favela’s art was on display in the Petersen Automotive Museum in 2017?","o":["A painting of Los Angeles","A sculpture of a lowrider car","A painting of a piñata","A sculpture of Jesse Valadez"],"a":1,"r":"Choice B is the best answer. The text describes Favela’s approach to sculpture, and then describes the lowrider car that he depicted in 2017. Choice A is incorrect. This isn’t what the text says. The Petersen Automotive Museum is located in Los Angeles, but Favela’s artwork isn’t a painting, and it doesn’t depict L.A. Choice C is incorrect. This isn’t what the text says. Favela makes sculptures similar to piñatas, not paintings of them. Choice D is incorrect. This isn’t what the text says. Jesse Valadez owned the lowrider car that Favela depicted in sculpture."},{"i":"c188a397","c":"main","d":"M","s":"Recently, scientists looked at data collected by NASA’s InSight lander to learn more about seismic activity on Mars, known as marsquakes. The data show that the marsquakes all started from the same location on the planet. This discovery was surprising to scientists, as they expected that the marsquakes would originate from all over the planet because of the cooling of the planet’s surface. Now, scientists believe that there could be areas of active magma flows deep beneath the planet’s surface that trigger the marsquakes.\n\nAccording to the text, what was surprising to scientists studying the seismic activity data from NASA’s InSight lander?","o":["The surface temperature of Mars has been rising.","There were different types of seismic waves causing marsquakes.","NASA’s InSight lander collected less data than scientists had expected.","All the marsquakes started from the same location on the planet."],"a":3,"r":"Choice D is the best answer because it presents a statement about what surprised the scientists that is supported by the text. The text states that the marsquakes described in the data from NASA’s InSight lander originated from the same location on Mars. The text goes on to say that because they had expected the opposite (that marsquakes would originate from all over the planet) this discovery surprised the scientists. Choice A is incorrect because the text doesn’t say that the data from NASA’s InSight lander revealed any surprising information about the planet’s surface temperature. Instead, the text mentions the cooling of Mars’s surface as a reason the scientists expected that marsquakes had multiple origins. In addition, cooling would indicate that the temperature has been falling rather than rising. Choice B is incorrect. Although the text indicates that by studying seismic activity scientists found a possible explanation for what causes marsquakes, the text doesn’t say that they discovered that marsquakes are caused by different types of seismic waves. Rather, the text states that based on the data from NASA’s InSight lander, scientists now believe that this seismic activity happens because of areas of active magma that flow below the planet’s surface. Choice C is incorrect because the text doesn’t discuss the amount of data NASA’s InSight lander collected or whether scientists who studied the data found the amount to be as expected. Instead, the text focuses on what the data revealed about where on Mars the marsquakes originated."},{"i":"9869c261","c":"infer","d":"H","s":"Data collected by the Mars rover Curiosity at the Gale Crater’s Murray Formation are suggestive of hydrological deposition of sediment in the distant past. To characterize the nature of the depositional environment, Frances Rivera-Hernández et al. analyzed the grain size of Murray Formation sediment, finding that although there are intervals of coarse grains, most of the sediment consists of fine grains that show signs of cracking due to episodic desiccation. Rivera-Hernández et al. concluded that the coarse grains are sandstone, which tends to be deposited by flowing water, whereas the fine grains are mudstone, which is slowly deposited by settling out of suspension in low-flow water, leading the researchers to posit that ______ Which choice most logically completes the text?","o":["although the area of the Murray Formation experienced a prolonged period of dryness that prevented a lake from forming, water flowing from a distant source was present.","a lake existed at the Murray Formation for a prolonged period, though the lake occasionally experienced drying and there were periods in which one or more streams were present.","one or more streams existed at the Murray Formation for an extended period until being replaced by a lake that persisted for only a brief period before permanently drying.","a stream-fed lake was present at the Murray Formation for an extended period, and although the streams experienced occasional drying, the lake did not."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the sediments found at the Gale Crater’s Murray Formation on Mars. The text states that data gathered by the Curiosity rover suggest that bodies of water deposited sediment on Mars’s surface long ago. The text goes on to say that studying the sediment, Rivera-Hernández et al. found some coarse grains they believe are sandstone, which tends to be left by flowing water, and many more fine grains they believe are mudstone, which tends to slowly sink in low-flow water. The text further indicates that the researchers noted cracks in the fine grains that suggest there were cycles of desiccation, or drying, at the site. Taken together, this information suggests that a lake (a body of low-flow water) existed at the site for a prolonged period but occasionally experienced drying and that there were periods in which one or more streams (flowing water) were present, since the extended existence of a lake would account for the abundance of fine grains, periods of drying would account for the cracks in the fine grains, and periods with streams would account for the sections of coarse grains. Choice A is incorrect because the text indicates that an abundance of fine grains of sediment was found at the Murray Formation site, which suggests that a low-flow water source (such as a lake) was present. Further, the text makes no mention of where the water at the site may have originated from. Choice C is incorrect because the evidence described in the text doesn’t support the idea that there were streams at the Murray Formation for an extended period and a lake for just a short time. The abundance of fine grains suggests that a lake (a body of low-flow water) was present for an extended time, not just a short time, and the sections of coarse grains suggest that one or more streams (bodies of flowing water) were intermittently present while the lake existed, not at a separate time. Choice D is incorrect. Although the text suggests that both a low- flow body of water (such as a lake) and flowing water (such as streams) existed at the Murray Formation site, meaning that there could have been a stream-fed lake, the text explains that the fine grains that signify the presence of a lake exhibit cracking that indicates periods of desiccation, or drying, which suggests that a lake was present but did occasionally dry out."},{"i":"a44c7bd4","c":"infer","d":"H","s":"Some ethicists hold that the moral goodness of an individual’s actions depends solely on whether the actions themselves are good, irrespective of the context in which they are carried out. Philosopher L. Sebastian Purcell has shown that surviving works of Aztec (Nahua) philosophy express a very different view. Purcell reveals that these works posit an ethical system in which an individual’s actions are judged in light of how well they accord with the individual’s role in society and how well they contribute to the community. To the extent that these works are representative of Aztec thought, Purcell’s analysis suggests that ______ Which choice most logically completes the text?","o":["the Aztecs would have disputed the idea that the morality of an individual’s actions can be assessed by appealing to standards of behavior that are independent of the individual’s social circumstances.","the Aztecs would not have accepted the notion that the morality of an individual’s actions can be fairly evaluated by people who do not live in the same society as that individual.","actions by members of Aztec society who contributed a great deal to their community could be judged as morally good even if those actions were inconsistent with behaviors the Aztecs regarded as good in all contexts.","similar actions performed by people in different social roles in Aztec society would have been regarded as morally equivalent unless those actions led to different outcomes for the community."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion about Aztec (Nahua) ethics. The text indicates that, according to Purcell’s interpretation of available Aztec philosophical works, the Aztec ethical system views an individual’s actions in relation to that individual’s societal role and how the actions affect the community. The text contrasts this view with another held by some ethicists, namely that actions are morally good or bad regardless of the context in which they occur. Thus, Purcell’s analysis suggests that the Aztecs would have asserted that the morality of an individual’s actions are rooted in that person’s position in the community and the actions’ effects and therefore cannot be determined in the absence of that context. Choice B is incorrect. Although the text indicates that morally judging an action according to Aztec ethics requires an understanding of the action’s effects and the individual’s social circumstances, it does not specify that only members of that society can acquire this information. Choice C is incorrect because it implies that the Aztecs considered some actions good or bad regardless of the surrounding context, which contradicts the text’s claim that the Aztecs believed that the morality of an individual’s action is dependent on the action’s effects on the community and the person’s specific circumstances. Choice D is incorrect. Although the text indicates that in Aztec ethics the morality of an action depends in part on how it affects the community, this is only one of the two factors—the other being the person’s societal role—that need to be considered. Therefore, it is possible that two actions with the same effect on the community could be considered morally distinct if they are performed by individuals in different social roles."},{"i":"7fdba7ad","c":"claim","d":"E","s":"The Milky Way galaxy is composed of millions of stars in a relatively flat structure containing a thin disk and a thick disk. Based on computer simulations and analysis of data on the brightness, position, and chemical composition of about 250,000 stars in the thick disk (collected from two telescopes, one in China and one orbiting in space), astrophysicists Maosheng Xiang and Hans-Walter Rix claim that the thick disk of the Milky Way formed in two distinct phases rather than a single one.\n\nWhich finding, if true, would most directly support the researchers’ claim?","o":["The telescopes used by the researchers have detected stars of similar ages in galaxies other than the Milky Way.","There’s an age difference of about 2 billion years between certain stars in the thick disk.","The thin disk contains about twice as many stars that can be seen from Earth as the thick disk does.","The stars in the Milky Way tend to have very similar chemical compositions."],"a":1,"r":"Choice B is the best answer. A consistent age difference of 2 billion years between certain stars within the thick disk would support the claim that the thick disk formed in two phases instead of one, with the second phase beginning 2 billion years after the first phase. Choice A is incorrect. This choice doesn’t support the claim. The researchers base their claim on their study of stars inside the thick disk of the Milky Way. This choice makes a comparison to stars in other galaxies, which isn’t relevant. Choice C is incorrect. This choice doesn’t support the claim. The researchers base their claim on their study of stars inside the thick disk. This choice makes a comparison to the thin disk, which isn’t relevant. Choice D is incorrect. This choice doesn’t support the claim. It’s too general. The claim is specifically about the thick disk."},{"i":"47f2cddd","c":"claim","d":"E","s":"“The Rock and the Sea” is an 1893 poem by Charlotte Perkins Gilman. In the poem, a rock is portrayed as intending to confront and restrain the sea: ______ Which quotation from “The Rock and the Sea” most effectively illustrates the claim?","o":["“I am the Rock. Black midnight falls; / The terrible breakers rise like walls; / With curling lips and gleaming teeth / They plunge and tear at my bones beneath.”","“I am the Sea. I hold the land / As one holds an apple in his hand, / Hold it fast with sleepless eyes, / Watching the continents sink and rise.”","“I am the Rock, presumptuous Sea! / I am set to encounter thee. / Angry and loud or gentle and still, / I am set here to limit thy power, and I will!”","“I am the Sea. The earth I sway; / Granite to me is potter’s clay; / Under the touch of my careless waves / It rises in turrets and sinks in caves.”"],"a":2,"r":"Choice C is the best answer. This quotation focuses on the rock, which yells at the sea and announces its intent to “limit [the sea’s] power.” This matches the idea of confrontation and restraint in the claim we’re trying to support. Choice A is incorrect. This choice doesn’t illustrate the claim. While this quotation does focus on the rock, it suggests that the rock fears the sea. It lacks the sense of boldness and strength implied by the phrase “confront and restrain the sea.” Choice B is incorrect. This choice doesn’t illustrate the claim. This quotation focuses on the sea, not the rock. Choice D is incorrect. This choice doesn’t illustrate the claim. This quotation focuses on the sea, not the rock."},{"i":"a04807d8","c":"graph","d":"E","s":"","o":["2016.","2018.","2019.","2017."],"a":3,"r":"Choice D is the best answer because it most effectively uses data from the table to complete the statement about the year when both museums had the highest number of visits. The table shows the number of visits (in millions) from 2016 to 2019 to two museums: the National Museum of the American Indian and the National Museum of African American History and Culture. It indicates that the highest number of visits to the National Museum of the American Indian was 1.2 million in 2017 and that the highest number of visits to the National Museum of African American History and Culture was 2.4 million, also in 2017. Choice A is incorrect because the table shows that in 2016, the National Museum of the American Indian had 1.1 million visits and that the National Museum of African American History and Culture had 0.73 million visits, both of which are lower than the number of visits these museums had in 2017. Choice B is incorrect because the table shows that in 2018, the National Museum of the American Indian had 1.1 million visits and that the National Museum of African American History and Culture had 1.9 million visits, both of which are lower than the number of visits these museums had in 2017. Choice C is incorrect because the table shows that in 2019, the National Museum of the American Indian had 0.96 million visits and that the National Museum of African American History and Culture had 2.0 million visits, both of which are lower than the number of visits these museums had in 2017."},{"i":"5d453dcc","c":"graph","d":"M","s":"","o":["At each point on the political orientation scale, high-information voters were more likely than low-information voters to vote.","Only low-information voters who identify as independents had a voting probability below 50%.","The closer that low-information voters are to the ends of the political orientation scale, the more likely they were to vote.","High-information voters were more likely to identify as strong Democrats or strong Republicans than low-information voters were."],"a":0,"r":"Choice A is the best answer because it uses data from the graph to effectively support Charles and Stephens’s claim about how level of information affects voters. The graph shows the probability of voting for both high- and low-information voters in seven categories of political orientation. Charles and Stephens claim that “the more informed voters are about politics…the more likely they are to vote.”This statement correctly asserts that the graph shows a higher probability of voting for high-information voters than for low-information voters at each of the seven political orientations. Thus, this statement accurately cites data from the graph that support Charles and Stephens’s claim about how level of information affects voters. Choice B is incorrect. Although this statement is correct that the only probability in the graph below 50% is for low-information voters categorized as independent (orientation 4), the claim in question is about the relative likelihood that low- and high-information voters will vote, and without some reference to high-information voters, this statement cannot help support such a comparison. Choice C is incorrect. Although this statement is correct that the highest probabilities of voting for low-information voters are at the ends of the orientation scale (1 and 7), the claim in question is about the relative likelihood that low- and high-information voters will vote, and without some reference to high-information voters, this statement cannot help support such a comparison. Choice D is incorrect because the graph does not give any information about how many people are represented in any of the categories, so this statement is not based on data from the graph. Furthermore, even if we did have this information, the claim is about how level of information affects voters’ probability of voting, not whether they’re likely to strongly identify with a particular political party."},{"i":"cd2443c0","c":"fss","d":"M","s":"A pioneer in the field of taphonomy (the study of how organic remains become fossils), ______ may be just as prevalent in the fossil record as those of thick-shelled organisms.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["fossils of thin-shelled organisms, Anna Behrensmeyer demonstrated in a 2005 analysis,","Anna Behrensmeyer demonstrated in a 2005 analysis that fossils of thin-shelled organisms","it was demonstrated in a 2005 analysis by Anna Behrensmeyer that fossils of thin-shelled organisms","a 2005 analysis—by Anna Behrensmeyer—demonstrated that fossils of thin-shelled organisms"],"a":1,"r":"Choice B is the best answer. The convention being tested is subject-modifier placement. This choice makes the noun phrase “Anna Behrensmeyer” the subject of the sentence and places it immediately after the modifying phrase “a pioneer…fossils.” In doing so, this choice clearly establishes that Anna Behrensmeyer—and not another noun in the sentence—is a pioneer in the field of taphonomy. Choice A is incorrect because it results in a dangling modifier. The placement of the noun phrase “fossils of thin-shelled organisms” immediately after the modifying phrase illogically suggests that the “fossils” are a pioneer in the field of taphonomy. Choice C is incorrect because it results in a dangling modifier. The placement of the pronoun “it” immediately after the modifying phrase illogically suggests that “it” is a pioneer in the field of taphonomy. Choice D is incorrect because it results in a dangling modifier. The placement of the noun phrase “a 2005 analysis” immediately after the modifying phrase illogically suggests that “a 2005 analysis” is a pioneer in the field of taphonomy."},{"i":"bce9910f","c":"fss","d":"E","s":"Light of Truth is a bronze and marble sculpture by artist Richard Hunt. It honors civil rights icon Ida B. Wells. The sculpture ______ in a tree-lined plaza in Chicago, just a few blocks from where Wells lived.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are standing","have been standing","stands","were standing"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb \"stands\" agrees in number with the singular subject \"sculpture.\" Choice A is incorrect because the plural verb \"are standing\" doesn’t agree in number with the singular subject \"sculpture.\" Choice B is incorrect because the plural verb \"have been standing\" doesn’t agree in number with the singular subject \"sculpture.\" Choice D is incorrect because the plural verb \"were standing\" doesn’t agree in number with the singular subject \"sculpture.\""},{"i":"5b8f9cf2","c":"fss","d":"H","s":"In the canon of North African literature, Moroccan author Driss Chraïbi’s 1954 novel The Simple Past (Le Passé simple) looms large. A coming-of- age story, a social meditation, and a sober gaze into the dark maw of French colonialism, ______ interrogates systemic power with memorable intensity.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Morocco gained its independence two years before the publication of Chraïbi’s debut novel, which","Chraïbi’s debut novel, published two years before Morocco gained its independence,","Chraïbi wrote a debut novel that, published two years before Morocco gained its independence,","published two years before Morocco gained its independence, Chraïbi wrote a debut novel that"],"a":1,"r":"Choice B is the best answer. Subject-modifier placement requires a modifier and its subject to be next to each other. The subject of the modifier \"a coming-of-age story…colonialism\" is Chraïbi’s novel The Simple Past, so the subject \"Chraïbi’s debut novel\" fits perfectly after this introductory modifying phrase. Choice A is incorrect. Modifiers and their subjects must go next to each other. The introductory modifier \"a coming-of-age story…colonialism\" is describing Chraïbi’s novel, not Morocco. However, this choice places Morocco directly next to that modifier. Choice C is incorrect. Modifiers and their subjects must go next to each other. The introductory modifier \"a coming-of-age story…colonialism\" all describes Chraïbi’s novel, not Chraïbi himself. However, this choice places Chraïbi directly next to that modifier. Choice D is incorrect. Modifiers and their subjects must go next to each other. The modifier \"a coming-of-age story…\" is describing Chraïbi’s novel, so that needs to be the subject immediately after the modifier. This choice adds another modifier that describes Chraïbi’s novel, but then puts \"Chraïbi\" himself—not the novel—right after that modifier, which doesn’t make sense. Chraïbi wasn’t \"published two years before\" Moroccan independence; his novel The Simple Past was."},{"i":"36868920","c":"bound","d":"M","s":"Increasing the heat on an uncovered boiling pot of water does not increase the temperature of the water. What increases is the rate at which the water turns to ______ a pressure cooker pot, though, an airtight seal traps the vapor in the pot, creating pressure that allows the temperature of the water to increase past its boiling point.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["vapor. With","vapor with","vapor, with","vapor and with"],"a":0,"r":"Choice A is the best answer. The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\"What…vapor\") and another (\"With…point\"). Choice B is incorrect because it results in a run-on sentence. The sentences (\"What…vapor\" and \"with…point\") are fused without punctuation and/or a conjunction. Choice C is incorrect because it results in a comma splice. A comma can’t be used in this way to mark the boundary between sentences. Choice D is incorrect. Without a comma preceding it, the conjunction \"and\" can’t be used in this way to join sentences."},{"i":"8772475b","c":"bound","d":"H","s":"For thousands of years, humans have used domesticated goats (Capra hircus) to clear land of unwanted vegetation. When it comes to their diets, goats are notoriously ______ they will devour all kinds of shrubs and weeds, leaving virtually no part of any plant unconsumed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["indiscriminate and","indiscriminate,","indiscriminate","indiscriminate:"],"a":3,"r":"Choice D is the best answer. The convention being tested is punctuation use between two main clauses. In this choice, a colon is correctly used to mark the boundary between one main clause (\"goats are notoriously indiscriminate\") and another main clause (\"they will devour all kinds of shrubs and weeds\") and to introduce the following explanation of goats’ nondiscriminatory behavior when it comes to what they eat. Choice A is incorrect because when coordinating two longer main clauses such as these, it’s conventional to use a comma before the coordinating conjunction. Furthermore, the conjunction \"and\" fails to indicate that what follows is an explanation of goats’ nondiscriminatory behavior when it comes to their diets. Choice B is incorrect because it results in a comma splice. A comma can’t be used in this way to join two main clauses (\"goats…indiscriminate\" and \"they…weeds\"). Choice C is incorrect because it results in a run-on sentence. The two main clauses (\"goats…indiscriminate\" and \"they…weeds\") are fused without punctuation and/or a conjunction."},{"i":"e8494245","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Political scientist Graham Allison is known for his Thucydides trap theory. Allison’s theory states that whenever “a rising power is threatening to displace a ruling power,” conflict is likely. The theory is based on Thucydides’s explanation of the conflict between Athens and Sparta. Thucydides wrote that “the rise of Athens and the fear this instilled in Sparta” made conflict “inevitable.” History professor Edmund Stewart recently challenged the historical basis of the theory. Stewart claimed that Athens was not a rising power and that the rivals experienced a “clash of cultures” instead. The student wants to use a quotation to challenge Thucydides’s explanation of the conflict between Athens and Sparta.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["According to Allison’s Thucydides trap theory, whenever “a rising power is threatening to displace a ruling power,” conflict is likely.","Thucydides wrote that conflict between the two powers was “inevitable,” although Stewart later challenged the historical basis of this claim.","According to Stewart, a “clash of cultures” between Athens and Sparta caused the conflict, not Athens’s rise.","Thucydides explained that conflict was caused by “the rise of Athens and the fear this instilled in Sparta,” but Allison disagreed, seeing the conflict as an example of the Thucydides trap."],"a":2,"r":"Choice C is the best answer. Using a quotation from Stewart, the sentence challenges Thucydides’s explanation that the rise of Athens caused the conflict, suggesting that it was instead caused by a \"clash of cultures.\" Choice A is incorrect. While the sentence uses a quotation, the quotation doesn’t challenge Thucydides’s explanation of the conflict. Choice B is incorrect. While the sentence mentions that Stewart challenged Thucydides’s explanation of the conflict, it doesn’t use a quotation to challenge Thucydides’s explanation: the quoted word \"inevitable\" is from Thucydides. Choice D is incorrect. While the sentence appears to refute Thucydides’s explanation, it does so in a way that misrepresents the information in the notes; Allison’s Thucydides trap theory is based on Thucydides’s explanation of the conflict. Thus, Allison’s theory affirms, rather than challenges, Thucydides’s explanation."},{"i":"146233fc","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Lighthouses send out crucial light signals to help ships and other watercraft navigate at night. Before automation, lighthouses were run by lighthouse keepers. Maria Younghans was the lighthouse keeper at Biloxi Light in Mississippi. She held this position from 1867 to 1918. Flora McNeil was the lighthouse keeper at Bridgeport Breakwater Light in Connecticut. She held this position from 1904 to 1920. The student wants to emphasize the order in which the two lighthouse keepers began their careers.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["From 1867 to 1918, the nighttime waters of Mississippi were more navigable thanks to lighthouse keepers Flora McNeil and Maria Younghans.","Before automation, lighthouse keepers like Maria Younghans and Flora McNeil were crucial to ensuring safe navigation for watercraft.","Flora McNeil began her career as a lighthouse keeper years after Maria Younghans did.","Maria Younghans’s career as a lighthouse keeper ended in 1918, whereas Flora McNeil’s ended in 1920."],"a":2,"r":"Choice C is the best answer. The sentence emphasizes the order in which the two lighthouse keepers began their careers, noting that McNeil, who became the keeper at Bridgeport Breakwater Light in 1904, began her career years after Younghans, who became the keeper at Biloxi Light in 1867. Choice A is incorrect because it makes a generalization about the effects of McNeil’s and Younghans’s work; it doesn’t emphasize the order in which the two keepers began their careers. In addition, the sentence misrepresents information from the notes; McNeil was the keeper at a lighthouse in Connecticut from 1904 to 1920, not at a lighthouse in Mississippi from 1867 to 1918. Choice B is incorrect. The sentence claims that Younghans and McNeil were crucial to ensuring the safety of watercraft before lighthouses became automated; it doesn’t emphasize the order in which the two keepers began their careers. Choice D is incorrect. The sentence emphasizes when the lighthouse keepers’ respective careers ended; it doesn’t emphasize the order in which the two keepers began their careers."},{"i":"9fe7315b","c":"trans","d":"E","s":"Few New Yorkers have heard Thelma Pollard’s name. ______ many have seen her work in the famous Broadway musical The Phantom of the Opera. As the musical’s longtime makeup supervisor, Pollard put the iconic makeup on the face of the Phantom himself.\n\nWhich choice completes the text with the most logical transition?","o":["Similarly,","Therefore,","For example,","However,"],"a":3,"r":"Choice D is the best answer. \"However\" logically signals that the claim in this sentence—that many New Yorkers have seen Pollard’s work in a famous Broadway musical—is true despite the previous information that few New Yorkers have heard Pollard’s name. Choice A is incorrect because \"similarly\" illogically signals that the claim in this sentence is similar to the previous information that few New Yorkers have heard Pollard’s name. Instead, the claim that many New Yorkers have seen Pollard’s work is true despite the previous information. Choice B is incorrect because \"therefore\" illogically signals that the claim in this sentence is a result of the previous information that few New Yorkers have heard Pollard’s name. Instead, the claim that many New Yorkers have seen Pollard’s work is true despite the previous information. Choice C is incorrect because \"for example\" illogically signals that the claim in this sentence exemplifies the previous information that few New Yorkers have heard Pollard’s name. Instead, the claim that many New Yorkers have seen Pollard’s work is true despite the previous information."},{"i":"b5a399f1","c":"trans","d":"E","s":"Following the Mata Ortiz pottery technique, Mexican sculptor Juan Quezada Celado starts by creating the base of the pot with a slab of clay. ______ he builds the pot walls by layering coils of clay around the perimeter of the base. Celado then smooths out the pot’s walls with a hacksaw blade. At last, the pot is ready to be painted.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","However,","By contrast,","Next,"],"a":3,"r":"Choice D is the best answer. \"Next\" logically signals that the information in this sentence—which explains how Celado builds the pot’s walls—is the next step in Celado’s pot creation process. The sentences that follow further signal this information by completing the process. Choice A is incorrect because \"for example\" illogically signals that the information about Celado building pot walls in this sentence exemplifies the information in the previous sentence about how Celado’s pot creation process begins. Instead, it is the next step in this process. Choice B is incorrect because \"however\" illogically signals that the information in this sentence contrasts with the information in the previous sentence about how Celado’s pot creation process begins. Instead, it is the next step in this process. Choice C is incorrect because \"by contrast\" illogically signals that the information in this sentence contrasts with the information in the previous sentence about how Celado’s pot creation process begins. Instead, it is the next step in this process."},{"i":"2b08f514","c":"trans","d":"H","s":"The prime meridian, the global indicator of zero degrees longitude established in 1884, was originally determined using astronomically derived coordinates. ______ as decades passed, new calculations would reveal increasingly precise coordinates, yet the prime meridian remained unchanged; it wasn’t until the 1980s that, spurred by improved geodetic data, the prime meridian was officially moved—roughly one hundred meters east.\n\nWhich choice completes the text with the most logical transition?","o":["Specifically,","To that end,","Again and again,","Granted,"],"a":2,"r":"Choice C is the best answer. \"Again and again\" logically signals that the information in this sentence—that new calculations revealed increasingly precise coordinates for the location of the prime meridian—refers to events that occurred multiple times in the decades after the establishment of the prime meridian in 1884 (which is described in the preceding sentence). Choice A is incorrect because \"specifically\" illogically signals that the information in this sentence provides specific, precise details elaborating on the description of the prime meridian’s establishment in the previous sentence. Instead, the sentence indicates that increasingly precise coordinates were revealed on multiple occasions in the decades following the meridian’s establishment. Choice B is incorrect because \"to that end\" illogically signals that the information in this sentence is a means of accomplishing a goal established in the previous sentence about the prime meridian’s establishment. Instead, the sentence indicates that increasingly precise coordinates were revealed on multiple occasions in the decades following the meridian’s establishment. Choice D is incorrect because \"granted\" illogically signals that the information in this sentence is in opposition to the information about the prime meridian’s establishment in the previous sentence. Instead, the sentence indicates that increasingly precise coordinates were revealed on multiple occasions in the decades following the meridian’s establishment."}],"img":{"a04807d8":"iVBORw0KGgoAAAANSUhEUgAAArwAAADVBAMAAABH8D7LAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAAAv7UlEQVR42u1dZ0BUR9d+5m6hs7MgduHSbLEsIkaNZbEkmoiuNWqirvqmmURR3xgTU9AYNeqr2Lugxo66GmNPXGvsrBXUCAt2UXYWAak73w8QQXaNhRDjt88P2L1z58zMc8+eOWfaBeywww477LDDjn8IpPgXWuyz8HjiSwOhXNl5yAkJKnZdOhzEKj0EoEoAYuH3j5QPiaVEULV5VPVKIhCoLt4qClKQS1l0zQ/wBfDw7yuHhhoZe/j5dLHrNUZguojv1aU0tbOaXJsAYIsEACA5PQcAZOmQZrpU1J97reiZyHTAevUjnSYbbmLJLdI3GpUvPNSgegla5yvhXjupc4L2ldReNhZGX6g8AkgbCG1A2ggBgNCWDD1FmRoqphJEqRoBVEI9JJ4NA0TsUUnzYtAYQz8OlbQB5FGLJRVEQAo5shnSLqJCQ+KvRoA6LxPSGvsD4KkW/NReFHJJB2njJh6DGMbVBearJEFAf/8Z3QIjagGDa84svzZLy68o9yzgo9EzF7Vyk1iy+rq7ajKWv876qL0be4UrBv6sUH7/tqYuPbTqzrtiVf02YqjUJb/rQt34HqMeeKQ0qROaavCKnvPld7VbkXSxOnN0Am/6x7Yr2lVoPset+VVIA5pNbbGKd4lLOl05LC/C5JmY2u6t74Swcd8JbS+8z03G1YQ1+Pn8wSjmnXfm1aS3RytKBG/FpIOBs50//0MeHHmE4fPWRxdvZc5S+RWFSNDH660J7wjw37fj3sEtyPHwjFwVODG022iv1WIzeB8UPebNATZp8vYJAvNPc4zbqLy1QV5pNMzIvXNmreOtpcqjS5Sj4WZY9DkjokCJRzXROG27oe5/w2Od94rwAMSzhL6SxkFI+YGBwz0hJRd5OQfkh5SbQFJy0hMZ+Fy/ZQQWunBd0rdqC0yITTjFwM92MbJLazcqTMYJG/aBgJhiGZDdraMSCggKRdTu1rH67HuVkQiLCdGKqBOaUwnRejDHmoRyBk52DNXi3tWNd5TA function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}
function sum(){const d=Object.keys(ans).length,ok=Q.filter(q=>ans[q.i]===q.a).length;$("#sum").textContent=done?`Score: ${ok} of ${Q.length} correct (${Math.round(100*ok/Q.length)}%)`:`${d} of ${Q.length} answered`}
function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
function submit(){const left=Q.length-Object.keys(ans).length;if(left&&!confirm(`You have ${left} unanswered question${left>1?"s":""}. Submit anyway?`))return;done=true;miss=false;draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="re"){if(!done&&Object.keys(ans).length&&!confirm("Clear all your answers and start over?"))return;ans={};done=false;miss=false;draw();scrollTo(0,0)}
 else if(t.id==="sub")submit();
 else if(t.id==="mi"){miss=!miss;draw()}
 else if(t.dataset.k!==undefined&&!done){const a=t.closest("article"),q=Q[a.dataset.n-1];ans[q.i]=+t.dataset.k;a.outerHTML=card(q,+a.dataset.n);sum()}});
draw();
</script></body></html>
