<script>
const D={"t":"Practicetest58","q":[{"i":"9aa44886","c":"vocab","d":"M","s":"The following text is from F . Scott Fitzgerald’s 1925 novel The Great Gatsby. [Jay Gatsby] was balancing himself on the dashboard of his car with that resourcefulness of movement that is so peculiarly American—that comes, I suppose, with the absence of lifting work in youth and, even more, with the formless grace of our nervous, sporadic games. This quality was continually breaking through his punctilious manner in the shape of restlessness.\n\nAs used in the text, what does the word “quality” most nearly mean?","o":["Standard","Prestige","Characteristic","Accomplishment"],"a":2,"r":"Choice C is the best answer. “This quality” refers to Gatsby’s “resourcefulness of movement,” which is described as a characteristic or trait of his. Choice A is incorrect. This isn’t what “quality” means in this context. Here, “this quality” refers to Gatsby’s “resourcefulness of movement,” which is described as a characteristic or trait of his. “Standard” is a synonym for a different definition of “quality”: the degree of excellence of something. Choice B is incorrect. This isn’t what “quality” means in this context. Here, “this quality” refers to Gatsby’s “resourcefulness of movement,” which is described as a characteristic or trait of his. “Prestige” would suggest a high status or an admirable reputation, which doesn’t match that description. Choice D is incorrect. This isn’t what “quality” means in this context. Here, “this quality” refers to Gatsby’s “resourcefulness of movement,” which is described as a characteristic or trait of his. “Accomplishment” would suggest an achievement, which doesn’t match that description."},{"i":"e7b709fc","c":"vocab","d":"E","s":"Archaeologists studying an ancient amphitheater in Switzerland believe that it dates back to the fourth century CE. Their discoveries of a coin made between 337 and 341 CE and era-appropriate building materials ______ evidence for this theory.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["dismiss","provide","regulate","refuse"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the archaeologists’ study of the ancient amphitheater in Switzerland. In this context, “provide” means make available or supply. The text states that the archaeologists believe that the amphitheater dates to the fourth century CE. The text goes on to say that the archaeologists discovered a coin made between 337 and 341 CE (that is, made during the fourth century CE) and building materials appropriate to the era in question. This context suggests that these discoveries provide evidence for the archaeologists’ theory about the dating of the amphitheater. Choice A is incorrect because the archaeologists’ discoveries are presented as supplying evidence in favor of their theory about the dating of the amphitheater, not something that would “dismiss,” or reject serious consideration of, evidence for that theory. Choice C is incorrect because nothing in the text suggests that the archaeologists’ discoveries would “regulate,” or govern or bring order to, evidence for the archaeologists’ theory about the dating of the amphitheater. The discoveries are presented as supplying evidence for the archaeologists’ theory, not as changing how evidence for the theory is controlled or ordered. Choice D is incorrect because the archaeologists’ discoveries are presented as supplying evidence in favor of their theory about the dating of the amphitheater, not something that would “refuse,” or be unwilling to accept, evidence for the archaeologists’ theory."},{"i":"0462dac3","c":"vocab","d":"H","s":"Barring major archaeological discoveries, we are unlikely to ever have ______ account of ancient Egypt under the female pharaoh Hatshepsut, as much of the evidence of her reign was deliberately destroyed by her successors.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["an imaginative","a superficial","an exhaustive","a questionable"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of historical evidence about ancient Egypt under the reign of the pharaoh Hatshepsut. In this context, \"an exhaustive\" account would be a thorough one. The text states that much of the evidence from her reign was purposely destroyed—in other words, there is a lack of surviving records. This context conveys that unless there are major new archaeological discoveries, an exhaustive account of Hatshepsut’s reign is unlikely. Choice A is incorrect because in this context, \"an imaginative\" account would be an account based on imagination, or ideas and speculation, rather than facts. The text indicates that much of the evidence of Hatshepsut’s reign was deliberately destroyed, and a lack of evidence actually makes it more likely that accounts will be imaginative to some degree and not strictly factual. Choice B is incorrect because in this context, \"a superficial\" account would be one that is lacking in depth or concerned only with what is obvious. The text indicates that most evidence of Hatshepsut’s reign was purposely destroyed, which suggests that accounts of that time are likely already somewhat superficial, since there is little information available to support deeper knowledge. Further, it would be illogical to suggest that discovering major new evidence would make it more likely that accounts would be superficial. Choice D is incorrect because \"a questionable\" account would be one likely to be challenged or doubted, and since the text suggests that little evidence of Hatshepsut’s reign has survived, accounts of that time probably involve some speculation and thus may already be open to doubt. Further, it would be illogical to suggest that discovering major new evidence would make it more likely that accounts would be questionable."},{"i":"bcd924a5","c":"vocab","d":"E","s":"The unique subak water management system used to irrigate the rice paddy fields of the Indonesian island of Bali has a rich cultural, philosophical, and historical significance dating back to the ninth century. The many elements of subak—terraces, canals, and water temples— are ______: they are joined together into a single cohesive unit.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["outmoded","informal","interconnected","optional"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Bali’s subak water management system. In this context, “interconnected” would mean joined or linked together. The text describes the various components of the subak system—“terraces, canals, and water temples”—and then states that they are “joined together into a single cohesive unit.”This context indicates that these elements are connected with one another in an integrated system. Choice A is incorrect because “outmoded” would mean outdated or no longer in use. While the text does indicate that the subak system has “rich cultural, philosophical, and historical significance,” the text doesn’t suggest that the subak system is obsolete or not currently used. Choice B is incorrect because “informal” would suggest that the subak system lacks structure or organization. The text contradicts this by describing a complex system with specific components (“terraces, canals, and water temples”) that are “joined together into a single cohesive unit,” indicating formal organization rather than informality. Choice D is incorrect because “optional” would suggest that the various elements of the subak system are not necessary or required. The text indicates the opposite by stating that these elements are “joined together into a single cohesive unit,” suggesting that each component plays a necessary role in the functioning of the integrated system."},{"i":"d563bf65","c":"purpose","d":"E","s":"The following text is adapted from Jean Webster’s 1912 novel Daddy-Long-Legs. The narrator is a young college student writing letters detailing her weekly experiences. [The college is] organizing the Freshman basket-ball team and there’s just a chance that I shall make it. I’m little of course, but terribly quick and wiry and tough. While the others are hopping about in the air, I can dodge under their feet and grab the ball.\n\nWhich choice best states the main purpose of the text?","o":["To compare basketball with other sports","To provide details of how to play basketball","To state how players will be chosen for the basketball team","To explain why the narrator thinks she might make the basketball team"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text. In the first sentence of the text, the narrator states that she thinks there’s a chance she will become part of the basketball team at her college. She goes on to explain that she is \"quick\" and \"tough.\" Based on these characteristics, she thinks she has a chance to join the team. Thus, the main purpose of the text is to explain why the narrator thinks she might make the basketball team. Choice A is incorrect because the text focuses solely on basketball and doesn’t mention any other kinds of sports. Choice B is incorrect because the text doesn’t describe aspects of the game of basketball. Instead, it provides the narrator’s reasoning for thinking that she might make her school basketball team. Choice C is incorrect. Although the narrator explains why she thinks she will be chosen for the basketball team at her school, the text doesn’t go into the general decision-making process or the requirements for being picked for the team."},{"i":"e5ca7687","c":"purpose","d":"E","s":"Archaeologists studying the ancient city of Pompeii in Italy recently discovered a well-preserved food shop known as a thermopolium. The site contains food remains, artworks, and decorations. These items give researchers a better understanding of what daily life in Pompeii may have been like. For example, the archaeologists found a ceramic jar that they believe likely contained a meat and seafood stew.\n\nWhich choice best states the main purpose of the text?","o":["To compare ancient artworks with modern ones","To discuss the political system of Italy","To present a recent archaeological discovery","To describe a region’s climate"],"a":2,"r":"Choice C is the best answer because it most accurately describes the main purpose of the text. The text states that archaeologists recently discovered a well-preserved food shop, or thermopolium, in Pompeii, Italy. The text then further describes the contents of the discovery and provides an example of what was found. Thus, the overall purpose of the text is to present a recent archaeological discovery. Choice A is incorrect. Although the text states that archaeologists found ancient artworks, it doesn’t compare these artworks to modern ones or to any other artworks. Choice B is incorrect. Although the archaeological discovery discussed in the text was made in Italy, the text doesn’t provide any information about politics or government in Italy. Choice D is incorrect because the text doesn’t discuss the climate where the archaeological discovery was made or in any other region."},{"i":"ac9a3a26","c":"func","d":"H","s":"According to historian Vicki L. Ruiz, Mexican American women made crucial contributions to the labor movement during World War II. At the time, food processing companies entered into contracts to supply United States armed forces with canned goods. Increased production quotas conferred greater bargaining power on the companies’ employees, many of whom were Mexican American women: <u>employees insisted on more favorable benefits, and employers, who were anxious to fulfill the contracts, complied.<\/u> Thus, labor activism became a platform for Mexican American women to assert their agency.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It elaborates on a claim about labor relations in a particular industry made earlier in the text.","It offers an example of a trend in the World War II–era economy discussed earlier in the text.","It notes a possible exception to the historical narrative of labor activism sketched earlier in the text.","It provides further details about the identities of the workers discussed earlier in the text."],"a":0,"r":"Choice A is the best answer because it best describes how the underlined portion functions in the text as a whole. The text says that the increased production quotas of food processing companies during World War II enabled employees to make better bargains in exchange for their labor. The underlined portion presents an example of this increased bargaining power: employees requested more favorable benefits, and employers complied because they were under pressure to fulfill the demanding terms of their contracts. Thus, the underlined portion of the text elaborates on a claim about labor relations in a particular industry (food processing) made earlier in the text. Choice B is incorrect because there is no indication in the text that the economic factors that influenced food processing also influenced other parts of the economy; thus, the bargaining described in the underlined portion of the text cannot be called an example of a trend. Choice C is incorrect because the underlined portion supports the historical narrative of labor activism in food processing that is sketched in the text, instead of noting an exception to that narrative. Choice D is incorrect because while the underlined portion does discuss the demands that workers made in exchange for their labor, it does not discuss the identities of the workers."},{"i":"c6bd3447","c":"func","d":"M","s":"The following text is from Virginia Woolf’s 1919 novel Night and Day. The text describes a gathering of young artists and intellectuals. One person after another rose, and, as with <u>an ill-balanced axe, attempted to hew out<\/u> his conception of art a little more clearly, and sat down with the feeling that, for some reason which he could not grasp, his <u>strokes had gone awry<\/u>. As they sat down they turned almost invariably to the person sitting next them, and rectified and continued what they had just said in public.\n\nWhich choice best describes the function of the underlined portions in the text as a whole?","o":["To demonstrate individuals’ puzzlement over the reputation of a certain artwork","To highlight the physical effort involved in individuals’ construction of large-scale works of art","To draw attention to individuals’ discontent with the group’s conversation about art","To emphasize the extent of individuals’ struggles to articulate thoughts on art"],"a":3,"r":"Choice D is the best answer because it most accurately describes the function of the underlined portions in the text as a whole. The underlined portions describe the young artists and intellectuals at the gathering as trying to \"hew out,\" or give shape to, their views of art more clearly, but with each seeming to be using \"an ill-balanced axe\" and then feeling that the \"strokes had gone awry.\" In context, the metaphorical language comparing attempts to refine concepts of art to imprecisely cutting wood with an inadequate axe serves to emphasize how much the individuals at the gathering struggled to articulate, or express, their thoughts; indeed, the text explains that the individuals couldn’t quite grasp why their statements had gone awry and tended to try to rectify, or correct, them in continued discussion after they sat down. Choice A is incorrect because the underlined portions characterize aspects of the young artists and intellectuals’ attempts to present their general views of art more clearly, not their views of the reputation of a certain artwork; the text never mentions any specific artwork or its reputation. Choice B is incorrect. Although the underlined portions refer to a physical activity—cutting wood with an axe—the descriptions are metaphorical rather than literal. The text isn’t describing people constructing works of art, large-scale or otherwise; rather, it’s describing people talking at a gathering, using the idea of imprecisely cutting wood with an inadequate axe to suggest that each individual struggled when trying to present their view of art more clearly. Choice C is incorrect. Although the underlined portions do provide a reason for the young artists and intellectuals’ discontent, the text focuses on the fact that they were each dissatisfied with their own statements, not on how they felt about the group’s full conversation about art. Instead, the text explains that each individual tried to present their view of art more clearly but struggled (as if imprecisely cutting wood with an inadequate axe), couldn’t grasp what went awry, and then felt the need to rectify, or correct, what they had just said. It’s possible that the individuals were also discontented with the group’s conversation overall, but neither the underlined portions nor the text as a whole suggest that."},{"i":"5a4b147c","c":"cross","d":"E","s":"Text 1 On April 26th, 1777, Sybil Ludington rode 40 miles by horse through Putnam County, New York, to gather up local militia. British forces were burning nearby Danbury, Connecticut, and Ludington wanted to rally rebel troops to meet them. Although she was only 16 years old at the time, her brave feat made Ludington one of the heroes of the American Revolution. Since then, Ludington has been widely celebrated, inspiring postage stamps, statues, and even children’s TV series.\n\nText 2 Historian Paula D. Hunt researched the life and legacy of Sybil Ludington but found no evidence for her famous ride. Although many articles and books have been written about Ludington, Hunt believes writers may have been inventing details about Ludington as they retold her story. Ludington is revered by Americans today, but there simply isn’t a strong historical record of her heroic ride.\n\nBased on the texts, both authors would most likely agree with which statement?","o":["Sybil Ludington was crucial to the outcome of the Revolutionary War.","Historians have confirmed which route Sybil Ludington took.","Sybil Ludington was likely not a real person.","Many people have come to admire the story of Sybil Ludington’s ride."],"a":3,"r":"Choice D is the best answer. Both authors agree that Ludington’s story has been widely celebrated and revered by Americans, even if they disagree on its accuracy. Text 1 states that Ludington has inspired postage stamps, statues, and TV series, and Text 2 states that many articles and books have been written about her. Thus, both authors acknowledge the popularity of Ludington’s story. Choice A is incorrect. Neither author claims that Ludington had a significant impact on the war. Text 1 doesn’t mention how Ludington’s ride affected the war overall, and Text 2 suggests that Ludington’s ride may have been exaggerated or invented over time. Choice B is incorrect. Neither author claims that Ludington’s route has been verified by historians. Text 1 claims she rode 40 miles through Putnam County, but doesn’t cite any sources for this information, while Text 2 suggests the ride may not have even happened. Choice C is incorrect. This choice misreads text 2. Neither author claims that Ludington was not a real person, only that her ride may not have happened. Both authors seem to treat Ludington as a genuine historical figure."},{"i":"6540a976","c":"main","d":"M","s":"To understand how Paleolithic artists navigated dark caves, archaeologist Mª Ángeles Medina-Alcaide and her team tested different lighting methods in a cave in Spain using replicas of artifacts found in European caves with art. They used three different Paleolithic light sources— torches, animal-fat lamps, and fireplaces—determining that each likely had a specific purpose. For instance, the team learned that the animal-fat lamps were less useful than torches while walking because the lamps didn’t illuminate the cave floor.\n\nWhich choice best states the main idea of the text?","o":["Medina-Alcaide and her team’s study demonstrated that fireplaces were essential to the creators of Paleolithic cave art.","Medina-Alcaide and her team discovered that Paleolithic cave artists in Spain used animal-fat lamps more often than they used torches.","Medina-Alcaide and her team were reluctant to draw many conclusions from their study because of the difficulty they had replicating light sources based on known artifacts.","Medina-Alcaide and her team tested Paleolithic light sources and learned some details about how Paleolithic artists traveled within dark caves."],"a":3,"r":"Choice D is the best answer because it most accurately states the main idea of the text. The text indicates that archaeologist Mª Ángeles Medina-Alcaide and her team used replicas of Paleolithic light sources to understand how Paleolithic artists moved through dark caves. The researchers learned, for example, that torches were more helpful for moving through caves than animal-fat lamps were. Thus, the main idea of the text is that Medina-Alcaide and her team tested Paleolithic light sources and learned some details about how Paleolithic artists traveled within dark caves. Choice A is incorrect because the text doesn’t address the usefulness of fireplaces for Paleolithic cave artists; it only mentions fireplaces briefly as one of the three lighting methods the researchers tested. Choice B is incorrect because the text doesn’t discuss how often Paleolithic cave artists used each kind of light source tested. Although the text does compare animal-fat lamps with another lighting method, the point of that comparison is that animal-fat lamps were less useful than torches when walking, not that one method was used more often than another. Choice C is incorrect because the text doesn’t discuss either how difficult it was for Medina-Alcaide and her team to replicate light sources or how the team felt about drawing conclusions from their study. Instead, the text reveals that the team was able to conclude that each light source likely had a distinct purpose."},{"i":"2287b040","c":"main","d":"E","s":"In the 1960s, Chavela Vargas became an unlikely star in ranchera, a style of traditional Mexican music. Most ranchera singers had clear, polished voices and performed with a full band. But Vargas accompanied her raspy voice with just her guitar. Dressed in men’s trousers and a poncho, she would perform classic songs that had been written from a male point of view and were usually sung by men. She also altered those songs by performing them much more slowly than other ranchera singers did. The slower tempo allowed her to express the emotional quality of the lyrics more fully.\n\nAccording to the text, what is one way that Vargas differed from other ranchera singers?","o":["She possessed a voice that was clear and polished.","She avoided singing songs written from a male point of view.","She disliked performing classic songs.","She altered classic songs by slowing them down."],"a":3,"r":"Choice D is the best answer because it accurately describes an aspect of Chavela Vargas that the text indicates is unusual among ranchera artists. According to the text, Vargas differed from other ranchera singers by slowing the tempo of classic songs, which allowed her to express the emotional quality of the lyrics more fully. Choice A is incorrect because the text states that Vargas possessed an unusually raspy voice for a ranchera singer, not a clear and polished voice. Choice B is incorrect because the text indicates that Vargas was known to perform songs written from a male point of view, not that she avoided such songs. Choice C is incorrect because nothing in the text suggests that Vargas disliked performing classic songs. Rather, it suggests that she found innovative ways of performing them to emphasize their emotional content, which seems to suggest an affinity for such songs, not dislike."},{"i":"fd1095d7","c":"infer","d":"H","s":"To address the susceptibility of materials used in components of high-performance machinery, such as aircraft engines, to creep (deformation that is induced by persistent mechanical stress and that often occurs at elevated temperatures), materials researchers have developed silicon carbide (SiC) fibers for producing aerospace composites. Testing the thermomechanical properties of several commercially available SiC fibers, Ramakrishna T . Bhatt et al. found that in comparison with two polymer-derived SiC fibers, a nitrogen-treated SiC fiber exhibited a lower minimum creep rate, a measure of the rate at which a stress-exposed material deforms at a constant temperature and uniaxial load. The finding suggests that ______ Which choice most logically completes the text?","o":["unlike the two polymer-derived SiC fibers, the nitrogen-treated SiC fiber can substantially inhibit creep, provided that temperatures and loads are consistent.","the two polymer-derived SiC fibers likely hold similar potential for reducing the creep resistance of materials exposed to stress and elevated temperatures, thus prolonging the life span of aerospace machinery.","composites based on the two polymer-derived SiC fibers have chemical properties that may improve the mechanical and thermal stability of aerospace equipment to a greater extent than do composites based on the nitrogen-treated SiC fiber.","aerospace composites containing the nitrogen-treated SiC fiber may have the ability to withstand mechanical stress for a longer period of time than can aerospace composites containing either of the two polymer-derived SiC fibers."],"a":3,"r":"Choice D is the best answer because it most logically completes the text’s discussion of silicon carbide (SiC) fibers and creep, or deformation related to ongoing mechanical stress and elevated temperatures. The text states that Bhatt et al. found that a nitrogen-treated SiC fiber had a lower minimum creep rate than two polymer-derived SiC fibers did. Because having a lower creep rate means that the material is slower to deform with exposure to stress, as the text explains, this finding suggests that aerospace composites made with the nitrogen-treated SiC fiber may be able to withstand mechanical stress for a longer period than those made with the other two polymer-derived SiC fibers can. Choice A is incorrect because it overstates the implications of the study’s findings, which have to do with the rate of a material’s deformation under stress, not the absolute degree of deformation. The text states that Bhatt et al. observed that a nitrogen-treated SiC fiber had a lower minimum creep rate than two polymer-derived SiC fibers did, meaning only that it deformed more slowly over time under constant stress, not that it underwent less deformation overall. Choice B is incorrect because the text doesn’t establish any similarity between the two polymer- derived SiC fibers other than that both had a higher creep rate than the nitrogen-treated SiC fiber did in Bhatt et al.’s study. Moreover, reducing a material’s resistance to creep would mean that the material becomes more susceptible to deformation with exposure to stress and elevated temperatures, which would be expected to shorten rather than prolong the lifespan of machinery made with that material. Choice C is incorrect because the text suggests that the stability of aerospace equipment may be better improved by composites containing nitrogen-treated SiC fiber than by composites containing the two polymer-derived SiC fibers, not the other way around. The text indicates that Bhatt et al. observed that the nitrogen-treated SiC fiber had a lower minimum creep rate than the other two fibers did, meaning that it was slower to degrade under exposure to mechanical stress and elevated temperatures—suggesting that it may remain stable for longer periods."},{"i":"d95a0bb8","c":"infer","d":"H","s":"The ratio of methane to other atmospheric constituents—represented by a measure called the methane mole fraction—influences a variety of meteorological phenomena, notably precipitation and humidity. For Titan, Saturn’s largest moon, the observational data that exist are too sparse and discrepant to fully constrain the range of the methane mole fraction at various atmospheric levels. Juan Lora and colleagues point out that outputs of the IPSL atmospheric model of Titan, which track closely to observations in some respects, reflect how the model’s developers responded to this challenge: by prescribing a uniform methane mole fraction for the lowest level of the atmosphere. It is therefore important to note that ______ Which choice most logically completes the text?","o":["some disagreements between the model’s simulations of Titan’s precipitation and humidity and the moon’s actual precipitation and humidity are to be expected.","further observations of Titan may clarify the moon’s methane mole fraction sufficiently for the model to employ a single value rather than a range.","even though the model’s outputs sometimes agree with observational data, Titan’s real methane mole fraction is likely higher than the methane mole fraction used in the model.","inconsistencies across the model’s simulations of Titan’s precipitation and humidity could be attributable to variations in the moon’s methane mole fraction."],"a":0,"r":"Choice A is the best answer because it most logically completes the text’s discussion of modeling the atmosphere of Titan. The text establishes that the methane mole fraction (the ratio of methane to other atmospheric components) influences precipitation, humidity, and other meteorological phenomena and that observational data for Titan are too lacking (“too sparse and discrepant”) to fully determine the range of this measure across the moon’s various atmospheric levels. The text indicates that because of this limitation, researchers developed an atmospheric model (IPSL) that uses a simplified approach: it applies a uniform methane mole fraction for the lowest atmospheric level. Since it is very unlikely that the actual methane distribution across atmospheric levels on Titan is uniform, and since the methane mole fraction directly affects precipitation and humidity, it logically follows that the model’s simplified treatment of the methane mole fraction would lead to some disagreements between the model’s simulations and Titan’s actual precipitation and humidity. Choice B is incorrect because the text makes it clear that the model already uses a single value for Titan’s methane mole fraction instead of a range. Further, the text suggests that the single value is a simplification of what is likely a more complex reality, so there’s no reason to assume that a single value would be more desirable than a range. Choice C is incorrect. The text strongly suggests that Titan’s actual methane mole fraction differs from the uniform value used in the model, even though some of the model’s outputs align closely with observations, but nothing in the text indicates how the actual value would differ. There’s no reason to assume that the actual methane mole fraction is higher than what the model uses. The “lowest level” mentioned in the text refers to the atmosphere and not Titan’s methane mole fraction. Choice D is incorrect because the text makes it clear that the model doesn’t reflect the actual variations in the methane mole fraction across Titan’s atmospheric levels, since observational data are too limited. Because the model uniformly applies a set methane mole fraction, no inconsistencies in the simulations would be attributable to actual variations in the moon’s methane mole fraction."},{"i":"d5d3ea31","c":"claim","d":"M","s":"“The Yellow Wallpaper” is an 1892 short story by Charlotte Perkins Gilman. In the story, the narrator expresses mixed feelings about her surroundings: ______ Which quotation from “The Yellow Wallpaper” most effectively illustrates the claim?","o":["“This wallpaper has a kind of sub-pattern in a different shade, a particularly irritating one, for you can only see it in certain lights, and not clearly then.”","“By moonlight—the moon shines in all night when there is a moon—I wouldn’t know it was the same paper.”","“I’m really getting quite fond of the big room, all but that horrid [wall]paper.”","“The color is repellant, almost revolting; a smouldering, unclean yellow, strangely faded by the slow-turning sunlight.”"],"a":2,"r":"Choice C is the best answer because it most effectively illustrates the claim that the narrator of \"The Yellow Wallpaper\" has mixed feelings about her surroundings. She says she is \"really getting quite fond of the big room,\" a positive sentiment, but also describes the room’s wallpaper as \"horrid,\" a negative sentiment. Since some of her feelings about her surroundings are positive and others are negative, they are best described as mixed. Choice A is incorrect because though the narrator describes the room’s wallpaper as \"irritating,\" a negative sentiment, she does not mention a positive sentiment. Thus, the quotation does not effectively illustrate the claim that the narrator has mixed feelings about her surroundings. Choice B is incorrect because it describes how the appearance of the room’s wallpaper changes at night but does not mention the narrator’s feelings about her surroundings. Choice D is incorrect because though the narrator describes the room’s wallpaper as \"repellant,\" a negative sentiment, she does not mention a positive sentiment. Thus, the quotation does not effectively illustrate the claim that the narrator has mixed feelings about her surroundings."},{"i":"7cbb9764","c":"claim","d":"M","s":"Accomplished printmaker and sculptor Elizabeth Catlett (1915–2012) used her art to explore the Black experience in the United States. In a paper for an art history class, a student claims that Catlett had a particular talent for unifying various artistic traditions and styles in her work.\n\nWhich quotation from a scholar describing Catlett’s work would best support the student’s claim?","o":["“In Mother and Child, a sculpture of two Black figures, Catlett used an ancient Indigenous sculpting technique and combined the visual aesthetic of modern Mexican muralists with that of German artist Kathe Kollwitz.”","“In her collage New Generation, Catlett overlaid fabric onto the canvas to represent the clothing of a father and his toddler, positioned to evoke classic images of a mother and child.”","“Created in 1968, Catlett’s sculpture Black Unity, a stylized fist sculpted from mahogany and measuring two feet across, remains an important piece and has received renewed and well-deserved attention in recent years.”","“One series of Catlett’s prints, made by the artist using the linoleum cut method, depicts several notable African American women, including Harriet Tubman and Sojourner Truth.”"],"a":0,"r":"Choice A is the best answer because it presents a quotation about Elizabeth Catlett that supports the student’s claim that this artist had a talent for unifying various traditions and styles in her work. The quotation explains that to create the work, Catlett combined Indigenous sculpture with the visual aesthetic of modern muralists from Mexico as well as that of German artist Kathe Kollwitz. In other words, Catlett was able to unify several artistic traditions and styles within a single sculpture. Choice B is incorrect because in discussing the technique and subject matter of Catlett’s collage, the quotation makes no reference to particular traditions or styles. Choice C is incorrect because in describing the sculpture, the quotation doesn’t mention any artistic traditions or styles that Catlett may have synthesized to create the work. Choice D is incorrect because in discussing Catlett’s prints of notable African American women, the quotation doesn’t characterize those prints as having fused different traditions or styles."},{"i":"d74b9bc6","c":"graph","d":"M","s":"","o":["both Lake Neusiedl and Oulujärvi, which had fewer than 195 days of ice in the winter of 1980–81.","Lake Neusiedl, which had more days of ice in the winter of 2005–06 than it did in the winter of 1980–81.","Oulujärvi, which had fewer days of ice in the winter of 2005–06 than it did in the winter of 1980–81.","both Lake Neusiedl and Oulujärvi, which had more than 105 days of ice in the winter of 2005–06."],"a":2,"r":"Choice C is the best answer because it most effectively uses data from the graph to exemplify the researcher’s claim—namely, that the duration of ice on some lakes has declined between the early 1980s and the mid-2000s. According to the graph, Oulujärvi had surface ice for nearly 200 days in the winter of 1980–81 but only about 160 days of ice in the more recent winter of 2005–06, evidence of a clear decline in the duration of surface ice between these time periods. Choice A is incorrect because it focuses on only one period of time (the early 1980s). Thus, the data it cites don’t support the researcher’s claim, which compares the duration of surface ice across two specific periods of time (the early 1980s and the mid-2000s). Choice B is incorrect because although it accurately describes data from the graph, it contradicts the researcher’s claim about declining surface ice duration. It describes an increase, not a decline, in the duration of surface ice on Lake Neusiedl between the early 1980s and the mid-2000s (from about 80 days in 1980–81 to about 100 days in 2005–06). Therefore, the example of Lake Neusiedl wouldn’t logically support the claim that some lakes have seen a decline in the duration of surface ice. Choice D is incorrect because it provides information that doesn’t support the researcher’s claim about declining ice duration. The graph could indicate that both Lake Neusiedl and Oulujärvi had more than 105 days of ice in the winter of 2005–06, but on its own, this information doesn’t demonstrate a decline in ice duration between the early 1980s and the mid-2000s."},{"i":"55df0275","c":"graph","d":"H","s":"","o":["iron from SPC dust is 20%.","sodium from OCC dust is 100%.","iron from HTC dust is 90%.","sodium from AST dust is 75%."],"a":2,"r":"Choice C is the best answer because it most effectively completes the example regarding the ablation rate of iron. The table shows the ablation rates for three elements—iron, potassium, and sodium—found in cosmic dust that comes from one of four sources. The text says that the ablation rate for a given element in slower-moving SPC and AST dust was lower than the ablation rate for that same element in faster-moving HTC or OCC dust. The text then presents the first part of an example of this pattern, describing an ablation rate of 28% for iron in AST dust. The information that iron from HTC dust had an ablation rate of 90% is therefore the most effective way to complete this example—the comparison of a relatively low ablation rate for iron in slower-moving AST dust with a relatively high ablation rate for iron in faster-moving HTC dust illustrates the tendency of ablation rates for a given element to be lower in slower-moving dust than in faster-moving dust. Choice A is incorrect because the text indicates that SPC dust, like AST dust, moves relatively slowly; a comparison of the ablation rates of iron from two slower-moving dust sources could not be an example of the difference between ablation rates in slower-moving dust and faster-moving dust, which is the pattern that the example is supposed to illustrate. Choice B is incorrect because the example in the text is supposed to illustrate the difference in the ablation rates of the same element from slower-moving dust and faster-moving dust, and the first part of the example provides data about the ablation rate of iron, which means the second part of the example must also be about the ablation rate of iron, not the ablation rate of sodium. Choice D is incorrect because the example in the text is supposed to illustrate the difference in the ablation rates of the same element from slower-moving dust and faster-moving dust, and the first part of the example provides data about the ablation rate of iron, which means the second part of the example must also be about the ablation rate of iron, not the ablation rate of sodium. Additionally, any ablation rate from AST dust would be ineffective in this example since AST dust is referenced in the first part of the example and thus additional data focused on AST dust would not illustrate a variation across dust types."},{"i":"35ae047d","c":"fss","d":"E","s":"In 1929, Edwin Herbert Land invented a polarizing filter that was featured in a number of products, from sunglasses to 3D movies. A decade later, Land ______ his technology to invent the world’s first instant camera, the Polaroid Land camera.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["used","to have used","to use","using"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, Land), and this choice supplies the finite past tense verb \"used\" to indicate what Land did with the technology he had invented. Choice B is incorrect because it results in an ungrammatical sentence. The nonfinite perfect infinitive \"to have used\" doesn’t supply the main clause with a finite verb. Choice C is incorrect because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to use\" doesn’t supply the main clause with a finite verb. Choice D is incorrect because it results in an ungrammatical sentence. The nonfinite participle \"using\" doesn’t supply the main clause with a finite verb."},{"i":"97e7bedc","c":"fss","d":"M","s":"Oyster mushrooms typically get their nutrients from the damp logs on which they grow, but the fungi are also carnivorous, with the ability to kill and consume microscopic worms known as nematodes. As researcher Yen-Ping Hsueh has shown, the mushrooms release a toxin that is deadly to nematodes that ______ in contact with it.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["has come","comes","is coming","come"],"a":3,"r":"Choice D is the best answer. The convention being tested is subject-verb agreement. The plural verb \"come\" agrees in number with the plural subject \"nematodes.\" Choice A is incorrect because the singular verb \"has come\" doesn’t agree in number with the plural subject \"nematodes.\" Choice B is incorrect because the singular verb \"comes\" doesn’t agree in number with the plural subject \"nematodes.\" Choice C is incorrect because the singular verb \"is coming\" doesn’t agree in number with the plural subject \"nematodes.\""},{"i":"028752cd","c":"fss","d":"E","s":"The Dust Bowl was a period of severe drought that plagued the Great Plains of the US during the 1930s. During this time, dust storms ______ over 100 million acres of land. They even reached as far east as New York City.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are affecting","will have affected","will affect","affected"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the past tense verb \"affected,\" used in conjunction with the phrase \"during this time,\" correctly indicates that the dust storms occurred in the 1930s. Choice A is incorrect because the present progressive tense verb \"are affecting\" doesn’t indicate that the dust storms occurred in the 1930s. Choice B is incorrect because the future perfect tense verb \"will have affected\" doesn’t indicate that the dust storms occurred in the 1930s. Choice C is incorrect because the future tense verb \"will affect\" doesn’t indicate that the dust storms occurred in the 1930s."},{"i":"a153ad6a","c":"bound","d":"M","s":"While light is known as one of the fastest-moving substances, it slows down when passing through some types of matter. One such type of matter is a form of cooled, condensed gas called a Bose-Einstein condensate ______ Dutch physicist Lene Hau famously used a BEC to slow a beam of light to a complete halt.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["(BEC),","(BEC) and","(BEC);","(BEC)"],"a":2,"r":"Choice C is the best answer. The convention being tested is the coordination of main clauses within a sentence. This choice correctly uses a semicolon to join the first main clause (\"One…(BEC)\") and the second main clause (\"Dutch…halt\"). Choice A is incorrect because it results in a comma splice. Without a conjunction following it, a comma can’t be used in this way to join two main clauses. Choice B is incorrect because it results in a run-on sentence. Without a comma preceding it, a conjunction can’t be used in this way to join two main clauses. Choice D is incorrect because it results in a run-on sentence. The two main clauses are fused without punctuation and/or a conjunction."},{"i":"4dcedc31","c":"bound","d":"H","s":"For scientists to produce new iron nanoparticles of a specific size or strength, they must first be able to monitor reactions between oxygen and existing iron nanoparticles at a near-atomic level of detail. Fortunately, chemistry ______ and his colleagues at Temple University recently developed a new approach that does just that.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["professor Yugang Sun","professor Yugang Sun,","professor, Yugang Sun,","professor, Yugang Sun"],"a":0,"r":"Choice A is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed between the proper noun “Yugang Sun” and the title that describes Sun, “chemistry professor.” Furthermore, no punctuation is needed after “Sun” because “chemistry professor Yugang Sun and his colleagues at Temple University” functions as the coordinated subject of the sentence, and together Sun and colleagues performed the action of developing a new approach to producing iron nanoparticles. Choice B is incorrect because no punctuation is needed between the proper noun “Yugang Sun” and the coordinated noun phrase “and his colleagues at Temple University.” Choice C is incorrect because no punctuation is needed before or after the proper noun “Yugang Sun.” Setting off the professor’s name with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Choice D is incorrect because no punctuation is needed between the title “chemistry professor” and the proper noun “Yugang Sun.”"},{"i":"ed80971c","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: The Pueblo of Zuni is located about 150 miles west of Albuquerque, New Mexico. It is the traditional home of the A:shiwi (Zuni) people. The A:shiwi A:wan Museum and Heritage Center was established by tribal members in 1992. Its mission is stated on its website: “As a tribal museum and heritage center for the Zuni people and by the Zuni people we work to provide learning experiences that emphasize A:shiwi ways of knowing, as well as exploring modern concepts of knowledge and the transfer of knowledge.” The student wants to emphasize how long the museum has existed.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["The Pueblo of Zuni is home to the A:shiwi A:wan Museum and Heritage Center, which was founded by tribal members.","The A:shiwi A:wan Museum and Heritage Center has served the Pueblo of Zuni since 1992.","According to its website, the A:shiwi A:wan Museum and Heritage Center (founded in the 1990s) works to “emphasize A:shiwi ways of knowing.”","Knowledge has been one of the central themes of the A:shiwi A:wan Museum and Heritage Center from its founding."],"a":1,"r":"Choice B is the best answer. This choice effectively uses information from the notes to emphasize how long the museum has existed. It says that the museum has existed since 1992. Choice A is incorrect. This choice doesn’t emphasize how long the museum has existed. It doesn’t say when the museum was founded. Choice C is incorrect. This choice doesn’t emphasize how long the museum has existed. It doesn’t say the exact date of the museum’s founding. Rather, it emphasizes the museum’s mission. Choice D is incorrect. This choice doesn’t emphasize how long the museum has existed. It doesn’t say when the museum was founded."},{"i":"1d79a59d","c":"rs","d":"H","s":"While researching a topic, a student has taken the following notes: Leaders of the Province of Guatemala proclaimed independence for Central America from the Spanish Empire on September 15, 1821. The accompanying Declaration of Independence was written by Honduran scholar and politician José Cecilio del Valle. The 1812 Spanish Constitution had provided some degree of independence for Central America, but it was repealed by the Spanish king in 1814. Valle, a loyal advisor to the Spanish Empire’s administrators in Central America, had long opposed independence. He changed his mind after Colonel Rafael del Riego’s 1820 revolt, which demanded the return of rights lost in 1814. The student wants to place the 1821 Declaration of Independence in the context of Valle’s changing political beliefs.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Colonel Riego’s revolt was the inspiration that Valle, a long-standing opponent of Central American independence, needed to change his political beliefs.","Long an opponent of Central American independence, Valle changed his mind after an 1820 revolt and wrote the 1821 declaration.","A change in Valle’s political beliefs that occurred when the Spanish king repealed the 1812 constitution led to Valle writing Central America’s Declaration of Independence.","The writing of Central America’s Declaration of Independence may not have happened were it not for Colonel Riego’s 1820 revolt."],"a":1,"r":"Choice B is the best answer. The sentence places the Declaration of Independence in the context of Valle’s changing political beliefs, noting that Valle was long an opponent of Central American independence but changed his mind after an 1820 revolt and then wrote the Declaration of Independence in 1821. Choice A is incorrect. The sentence states that Valle’s political beliefs changed after Riego’s revolt but doesn’t indicate how these changed beliefs provide context for the 1821 Declaration of Independence. Choice C is incorrect because it misrepresents information from the notes. Valle’s political beliefs changed after Riego’s 1820 revolt, not when the Spanish king repealed the 1812 constitution. Choice D is incorrect. While the sentence indicates a relationship between Colonel Riego’s 1820 revolt and Central America’s Declaration of Independence, it doesn’t mention Valle’s changing political beliefs."},{"i":"f5a00eff","c":"trans","d":"H","s":"If the formation of Earth’s mantle had been purely a product of core differentiation—whereby heavier elements sink toward the core and lighter elements rise—the upper mantle would be depleted of heavy siderophile elements. Siderophiles are much more abundant in the mantle than predicted in that model, however. ______ extraterrestrial material containing siderophiles, likely from asteroid or comet impacts, almost certainly accreted to Earth following core differentiation.\n\nWhich choice completes the text with the most logical transition?","o":["That said,","Hence,","For example,","Likewise,"],"a":1,"r":"Choice B is the best answer. \"Hence\" correctly signals that the claim in this sentence regarding extraterrestrial material follows logically from the information in the previous sentences. The previous sentences establish that siderophile elements in the mantle are more abundant than predicted in the core-differentiation model. This sentence claims, logically, that these elements came from extraterrestrial material that accreted to Earth after core differentiation. Choice A is incorrect because \"that said\" illogically signals that the information in this sentence regarding extraterrestrial material is an exception to the previous information about siderophiles’ abundance in the mantle. Instead, it is a new claim that follows logically from the previous information. Choice C is incorrect because \"for example\" illogically signals that the information in this sentence regarding extraterrestrial material exemplifies the previous information about siderophiles’ abundance in the mantle. Instead, it is a new claim that follows logically from the previous information. Choice D is incorrect because \"likewise\" illogically signals that the information in this sentence regarding extraterrestrial material is merely similar to the previous information about siderophiles’ abundance in the mantle. Instead, it is a new claim that follows logically from the previous information."},{"i":"a3bf0a9d","c":"trans","d":"M","s":"In 2021, a model developed by astrophysicist Catherine Zucker and her research team revealed that the same supernovas responsible for the creation and ongoing expansion of the Local Bubble—a 14-million-year-old cavity in the Milky Way—are likely responsible for the formation of new stars. ______ this model detailed how the bubble’s expansion trapped interstellar clouds of gas and dust that became stars upon their eventual collapse.\n\nWhich choice completes the text with the most logical transition?","o":["Hence,","However,","Admittedly,","Specifically,"],"a":3,"r":"Choice D is the best answer. \"Specifically\" logically signals that the information in this sentence—that the Local Bubble’s expansion trapped clouds of gas and dust that formed new stars—provides specific, precise details elaborating on the more general information in the previous sentence about the relationship between the Local Bubble’s expansion and the formation of new stars. Choice A is incorrect because \"hence\" illogically signals that the information in this sentence is a result of the information in the previous sentence about the relationship between the Local Bubble’s expansion and the formation of new stars. Instead, this sentence provides specific, precise details elaborating on that information. Choice B is incorrect because \"however\" illogically signals that the information in this sentence contrasts with the information in the previous sentence about the relationship between the Local Bubble’s expansion and the formation of new stars. Instead, this sentence provides specific, precise details elaborating on that information. Choice C is incorrect because \"admittedly\" illogically signals that the information in this sentence provides an exception or caveat to the previous information about the relationship between the Local Bubble’s expansion and the formation of new stars. Instead, this sentence provides specific, precise details elaborating on that information."},{"i":"290a5d77","c":"trans","d":"E","s":"Guard cells are specialized cells that are part of a plant’s pores. These cells help regulate the amount of carbon dioxide a plant takes in. ______ they help regulate a plant’s water loss.\n\nWhich choice completes the text with the most logical transition?","o":["Additionally,","Previously,","In conclusion,","Instead,"],"a":0,"r":"Choice A is the best answer. \"Additionally\" logically signals that guard cells’ role in regulating water loss is an additional function of these specialized plant cells that is separate from the function of regulating carbon dioxide intake. Choice B is incorrect because \"previously\" illogically signals that the activity described in this sentence occurs earlier in a chronological sequence of events than the regulation of carbon dioxide intake described in the previous sentence. Instead, regulating water loss is an additional function of guard cells that is separate from the function of regulating carbon dioxide intake. Choice C is incorrect because \"in conclusion\" illogically signals that the description of guard cells’ role in regulating water loss concludes or summarizes the information about guard cells provided in the previous sentences. Instead, regulating water loss is one of the two distinct functions of guard cells described in the text. Choice D is incorrect because \"instead\" illogically signals that the activity described in this sentence happens in place of the activity of regulating carbon dioxide intake described in the previous sentence. Rather, regulating water loss is an additional function of guard cells."}],"img":{"d74b9bc6":"iVBORw0KGgoAAAANSUhEUgAAArwAAAI7BAMAAAD8IVUQAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABAzElEQVR42u2dd3wT5R/HP89lNC1t86SlLIFeW4bslDJkSQplr1RAlkhAVEDFojJFLEOZaquyUcveUoYICBL2hlRkKLSkID+Q0TwpsyN5fn+kQFvaAoVKgef9ekGT3Hrufd971j13BwgEAoFAIBAIBAKBQCAQCASCQg/N4TeS9zxUWHsIpIDcdEIHyCASzeJSCtD5+NHsllUU9M7nux/uX+OLh+espYZc4rkVVKvRSmOkILh7EDSb9i+paqAAAQ0AlIMAANUpASgFAGkMFFHCawbVw1r+mcukRvoiRzFDAgB8eyccpdq7a1bRuwJ5NOA2FwBQJVN4r4UyLmPm/zwDkQqbXr55w3r02OczCC+rN88D+k6JJiV/MxSvPxeH9T7r0bCovtNXazT9v1OtjPDruBvOQ1cPk0p7UexgxMvDRxPOgW779D5oQdvsoaU2mwgowBRz1mp64ZMbv/V+waO3LKWv0k4lR+/CxDaBwcCW8DmYVWx7meky3KO6t5USPUw/h8/2PS+/Ydyg/vc1UMValF1YJbKCz27VWhnqGKBjidjSyj+lHZUjdwfJkH4JrLBNEfy+X6y0o2HNX1/06GXsCF3h3XgnWvt6HwEurxod3MrTj+2zIl3XICFkqw5pqyLLOK09t+/kt36GnQN8+Sn6N87CaQUo8LO3Di3e1xy5arx21QpUXL6YOSxnqgQp49/g5+mLrRcUwfZhb2FNoHPZ function card(q,n){const a=ans[q.i];
