<script>
const D={"t":"SAT Practice Test 2","q":[{"i":"ba974387","c":"vocab","d":"E","s":"The following text is adapted from Mary Seacole’s 1857 autobiography Wonderful Adventures of Mrs. Seacole in Many Lands. That journey across the Isthmus [of Panama], insignificant in distance as it was, was by no means an easy one. It seemed as if nature had determined to throw every conceivable obstacle in the way of those who should seek to join the two great oceans of the world.\n\nAs used in the text, what does the word “conceivable” most nearly mean?","o":["Obvious","Imaginable","Straightforward","Uninterrupted"],"a":1,"r":"Choice B is the best answer because as used in the text, \"conceivable\" most nearly means capable of being thought of or imagined. The text describes a journey that, despite being \"insignificant in distance,\" was \"by no means an easy one\" because of the variety of obstacles that \"nature had determined to throw…in the way.\" To emphasize the difficulty of the journey, the author portrays nature as actively scheming to present travelers with every obstacle that can be thought of—i.e., every imaginable obstacle. Choice A is incorrect because in this context, \"conceivable\" does not mean obvious, or evident. Instead, by referring to \"every conceivable obstacle,\" the text suggests a wide variety of challenges by evoking all the potential difficulties nature could present, not just those that the travelers might reasonably expect or foresee. Choice C is incorrect because in this context, \"conceivable\" does not mean straightforward, or easy to negotiate. The text is not indicating that the obstacles were simple to respond to and overcome. Rather, the text suggests that a wide range of obstacles made the journey difficult. Choice D is incorrect because in this context, \"conceivable\" does not mean uninterrupted. Although the text suggests that the obstacles were frequent and numerous, it does not emphasize the obstacles’ continuity; instead, the text conveys their unexpected variety and range."},{"i":"f99847ed","c":"vocab","d":"H","s":"For her 2021 art installation Anthem, Wu Tsang joined forces with singer and composer Beverly Glenn-Copeland to produce a piece that critics found truly ______: they praised Tsang for creatively transforming a museum rotunda into a dynamic exhibit by projecting filmed images of Glenn- Copeland onto a massive 84-foot curtain and filling the space with the sounds of his and other voices singing.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["restrained","inventive","inexplicable","mystifying"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of the art installation Anthem. In this context, “inventive” means characterized by invention and creativity. The text explains that critics’ responses to the installation involved praise for Tsang’s creative transformation of a space into a dynamic exhibit with huge images and lots of sound. This context conveys that the critics found the piece particularly creative. Choice A is incorrect because the text indicates that critics praised the installation for being dynamic and including huge images and lots of sound, and it wouldn’t make sense to describe such an exhibit as “restrained,” or limited and not extravagant or showy. Choice C is incorrect because it wouldn’t make sense to say that critics found the installation “inexplicable,” or incapable of being explained or interpreted, since the critics were able to explain their praise for the installation’s transformation of a space with huge images and lots of sound. Choice D is incorrect because the text focuses on the idea that critics praised Tsang for creatively transforming a space into a dynamic exhibit, not that they found the installation “mystifying,” or bewildering and hard to understand. Nothing in the text suggests that the critics couldn’t understand the piece."},{"i":"b93428a6","c":"vocab","d":"E","s":"Animal researcher Amalia P .M. Bastos led a 2021 study about a wild kea parrot that used small stones as tools to preen its feathers. Skeptical colleagues had initially suggested to Bastos that the kea’s interactions with the stones might simply be ______, but Bastos and her team showed that the kea was using the stones deliberately.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["intriguing","obvious","accidental","observable"],"a":2,"r":"Choice C is the best answer because it most logically completes the text’s discussion of Bastos’s study of a wild kea parrot. In this context, \"accidental\" means unplanned or unintentional. The text first describes Bastos’s study, which concerns a kea that is observed using small stones to preen its feathers. The text then mentions colleagues who are skeptical (that is, they have doubt) about Bastos’s findings, and finally describes how Bastos and her team responded to the skepticism of those colleagues. Given that the colleagues mentioned in the text expressed skepticism regarding Bastos’s findings, the best answer choice must be one that completes the text in a manner such that the skeptics’ opinion regarding the kea’s use of stones disagrees with that held by Bastos and her team. Since Bastos and her team showed that the kea’s use of stones was deliberate (that is, intentional), the skeptics’ opinion in this context must be that the kea’s use of stones was unintentional, or accidental. Choice A is incorrect because the best answer choice is one that portrays skepticism, or doubt, of Bastos’s claim that the kea’s usage of stones was deliberate, or intentional. If the skeptics found the kea’s usage of stones \"intriguing,\" or fascinating, this would not be at odds with the position of Bastos and her team; in fact, it is reasonable to believe that someone who agreed that the kea’s stone usage was deliberate would also find it intriguing. Choice B is incorrect because if the skeptics believed that the kea’s usage of small stones was \"obvious,\" or evident, this would not be contrary to the observation of Bastos and her team that the kea’s usage of stones was deliberate: in fact, these opinions would be consistent with each other. Choice D is incorrect because if the skeptics believed that the kea’s usage of small stones was \"observable,\" or visible, this would not conflict with the claim of Bastos and her team that the kea’s usage of stones was deliberate: instead, these positions would agree."},{"i":"ab1bd603","c":"vocab","d":"M","s":"The following text is adapted from Upton Sinclair’s 1906 novel The Jungle. Marija is helping to manage her sister’s wedding. It was [Marija’s] task to see that all things went in due form, and after the best home traditions; and, flying wildly hither and thither, bowling every one out of the way, and scolding and exhorting all day with her tremendous voice, Marija was too eager to see that others conformed to the proprieties to consider them herself.\n\nAs used in the text, what does the word “consider” most nearly mean?","o":["Take into account and follow","Admire steadily and praise","Come to a decision about","Have an opinion on"],"a":0,"r":"Choice A is the best answer because as used in the text, \"consider\" most nearly means to take into account and follow. The text explains that Marija’s job was to make sure that her sister’s wedding proceeded in certain ways (\"in due form\") and that she loudly directed everyone’s actions all day. The text then indicates that Marija was so focused on ensuring that others \"conformed to the proprieties\"—that is, that they behaved in appropriate ways—that she failed to \"consider them herself\"; that is, she didn’t take standards of appropriate behavior into account and follow them in her own actions. Choice B is incorrect. In some contexts, \"consider\" can mean to think about something in a positive way—which can involve admiration—but the text doesn’t suggest that Marija was so busy imposing \"proprieties\" (standards of appropriate behavior) on others that she didn’t admire and praise them herself. The context suggests it’s more likely that Marija did speak positively of \"due form\" and \"the best home traditions\" while ensuring others behaved in certain ways. Choice C is incorrect. In some contexts, \"consider\" can mean to come to a decision, but the text doesn’t suggest that Marija wasn’t able to make a decision for herself about the \"proprieties\" (standards of appropriate behavior) she ensured everyone else conformed to. Rather, the context conveys that Marija knew very clearly which behaviors others should follow as \"due form\" and \"the best home traditions.\" Choice D is incorrect. In some contexts, \"consider\" can mean to have an opinion, but the text doesn’t suggest that Marija wasn’t able to have an opinion on the \"proprieties\" (standards of appropriate behavior) she was ensuring others conformed to. Rather, the context conveys that Marija had strong feelings about which behaviors were \"due form\" and \"the best home traditions.\""},{"i":"a2be625e","c":"purpose","d":"M","s":"The following text is from Sarah Orne Jewett’s 1899 short story “Martha’s Lady.” Martha is employed by Miss Pyne as a maid. Miss Pyne sat by the window watching, in her best dress, looking stately and calm; she seldom went out now, and it was almost time for the carriage. Martha was just coming in from the garden with the strawberries, and with more flowers in her apron. It was a bright cool evening in June, the golden robins sang in the elms, and the sun was going down behind the apple-trees at the foot of the garden. The beautiful old house stood wide open to the long-expected guest.\n\nWhich choice best states the main purpose of the text?","o":["To convey the worries brought about by a new guest","To describe how the characters have changed over time","To contrast the activity indoors with the stillness outside","To depict the setting as the characters await a visitor’s arrival"],"a":3,"r":"Choice D is the best answer because it most accurately reflects the main purpose of the text. The text portrays Miss Pyne as awaiting the arrival of a carriage while Martha brings strawberries and flowers from the garden into the house. The text also describes the surroundings of the scene, stating that Miss Pyne looks \"stately and calm,\" the evening is bright and cool, and birds are singing in the garden as the sun sets. Then the last sentence states that the house was \"wide open to the long-expected guest,\" which strongly suggests that Miss Pyne’s anticipation and Martha’s activities were in preparation for the guest who is expected to arrive in the carriage. Thus, the text depicts the setting and conveys what these characters are doing as they await the arrival of their visitor. Choice A is incorrect because there is nothing in the text to indicate that the characters feel any worry about the guest’s arrival. The text indicates that the guest was \"long-expected,\" but characterizing Miss Pyne as \"stately and calm\" conflicts with the idea that the characters are worried about the guest. Choice B is incorrect because the text describes a moment in time when two characters are awaiting the arrival of a visitor rather than an extended period over which characters could be seen changing. Choice C is incorrect. Although the text describes the activity indoors (Miss Pyne sitting calmly), it describes a higher level of activity, not stillness, outside (Martha bringing fruit and flowers and birds singing)."},{"i":"c0e1b70a","c":"purpose","d":"M","s":"The following text is adapted from Etsu Inagaki Sugimoto’s 1925 memoir A Daughter of the Samurai. As a young woman, Sugimoto moved from feudal Japan to the United States. The standards of my own and my adopted country differed so widely in some ways, and my love for both lands was so sincere, that sometimes I had an odd feeling of standing upon a cloud in space, and gazing with measuring eyes upon two separate worlds. At first I was continually trying to explain, by Japanese standards, all the queer things that came every day before my surprised eyes; for no one seemed to know the origin or significance of even the most familiar customs, nor why they existed and were followed.\n\nWhich choice best describes the main purpose of the text?","o":["To convey the narrator’s experience of observing and making sense of differences between two cultures she embraces","To establish the narrator’s hope of forming connections with new companions by sharing customs she learned as a child","To reveal the narrator’s recognition that she is hesitant to ask questions about certain aspects of a culture she is newly encountering","To emphasize the narrator’s wonder at discovering that the physical distance between two countries is greater than she had expected"],"a":0,"r":"Choice A is the best answer because it most accurately describes the main purpose of the text. The narrator asserts that she loves both her “own” country (Japan) and her “adopted country” (the United States) even though the two countries differ “widely.” She also indicates that, at first, she would try to explain unfamiliar experiences that she had in the United States using the standards ingrained in her from growing up in Japan. Thus, the main purpose of the text is to convey the narrator’s experience of observing and making sense of the differences between two cultures she embraces. Choice B is incorrect because the text makes no reference to possible companions. Although the text does indicate that the narrator sometimes used the cultural framework she acquired growing up in Japan to explain some experiences she’s had, there is no suggestion that this was in service of making friends. And although “no one seemed to know” strongly implies that the narrator has interacted with other people in the United States, there is no indication that these conversations involved her discussing Japanese customs. Choice C is incorrect because nothing in the text suggests that the narrator was hesitant to ask questions. In fact, the narrator indicates that “no one seemed to know the origin” of various customs, which provides evidence that, rather than being hesitant, she sought information from several people. Choice D is incorrect because the text makes no reference to the physical distance between Japan and the United States. Although the narrator indicates that the two countries differ “widely” and likens them to “two separate worlds,” these descriptions relate to cultural aspects of the countries and the narrator’s feelings about the two countries, not the physical distance between them."},{"i":"c966ad55","c":"func","d":"E","s":"The following text is from Srimati Svarna Kumari Devi’s 1894 novel The Fatal Garland (translated by A. Christina Albers in 1910). Shakti is walking near a riverbank that she visited frequently during her childhood. She crossed the woods she knew so well. <u>The trees seemed to extend their branches like welcoming arms.<\/u> They greeted her as an old friend. Soon she reached the river-side.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It suggests that Shakti feels uncomfortable near the river.","It indicates that Shakti has lost her sense of direction in the woods.","It emphasizes Shakti’s sense of belonging in the landscape.","It conveys Shakti’s appreciation for her long-term friendships."],"a":2,"r":"Choice C is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The first sentence of the text states that Shakti knows the woods she is walking in well. The next sentence, which is underlined, emphasizes Shakti’s familiarity with, and sense of security within, the woods by describing how the tree branches are friendly and “welcoming,” as they are depicted as extending open arms to her. The remainder of the text also shows that Shakti is comfortable and content in the woods by describing her as “an old friend” of the trees. Thus, the function of the underlined portion is to emphasize Shakti’s sense of belonging in the wooded landscape that she visits. Choice A is incorrect because the text and underlined portion suggest that Shakti is comfortable, not uncomfortable, in her surroundings: the trees around her are described as welcoming and reassuring. Moreover, the underlined portion discusses Shakti’s feelings in the forest, not the river, since she hasn’t reached the river yet. Choice B is incorrect because the text and underlined portion emphasize Shakti’s familiarity with the woods. The trees are inviting, and she feels like “an old friend” to the woods, so she isn’t lost or confused there. Choice D is incorrect because the third sentence uses the phrase “as an old friend” figuratively in reference to Shakti’s sense of familiarity with the landscape, not in reference to her long-standing friendships with other people, and the text and underlined portion never discuss her feelings about such friendships."},{"i":"662ebff2","c":"func","d":"H","s":"In response to concerns that some recent financial crises were exacerbated by consumers misunderstanding risks associated with credit cards, loans, and other financial products, policymakers in many countries have instituted risk-disclosure requirements on sellers of those products. Enrique Seira et al. investigated a variety of risk-disclosure messages sent to thousands of credit card customers and found that the messages had only small and short-lived effects on behavior. Seira et al. asserted that such effects may nevertheless be worth pursuing, <u>given the negligible cost of messaging<\/u>.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?","o":["It notes a factor that led Seira et al. to not dismiss risk-disclosure messaging altogether despite their evidence of its limited utility.","It acknowledges a type of risk-disclosure messaging that Seira et al. may not have fully accounted for in their study.","It describes a consideration that explains why Seira et al. recommended risk-disclosure messaging even though its effects may be small relative to its costs.","It points out a circumstance that Seira et al. conceded may make risk-disclosure messaging more effective than their study suggests."],"a":0,"r":"Choice A is the best answer because it most accurately describes the function of the underlined portion in the text as a whole. The text establishes that many countries have adopted risk-disclosure requirements for financial products due to concerns that consumers don’t understand the risks associated with the products. According to the text, Seira et al. found that the effects of such messaging on consumer behavior were small and temporary. The text then adds that the researchers assert that because the cost of the messaging is negligible, the approach may be worth doing even if the effects are limited. Thus, the underlined portion notes a factor—very low cost—that led the researchers to not completely dismiss risk-disclosure messaging despite their evidence of its limited utility. Choice B is incorrect because the underlined portion doesn’t refer to a particular type of risk-disclosure messaging, whether Seira et al. considered it or not; the underlined portion simply indicates that the cost of the messaging (broadly) is very low, which makes the approach worth pursuing even if its effects are limited. Choice C is incorrect. Although the underlined portion does describe a consideration that led the researchers to recommend risk-disclosure messaging despite the messaging’s small effects on consumer behavior, it directly states that the cost of such messaging is negligible, or very low—meaning that both the effects and the costs are small, not that the effects are small only relative to the costs. Choice D is incorrect because there’s no indication that Seira et al. suggest that risk-disclosure messaging could be more effective if it had lower costs; rather, the underlined portion indicates that Seira et al. believe the already negligible cost of messaging makes the approach worth pursuing even if its effects are limited."},{"i":"97360a00","c":"structure","d":"M","s":"The following text is adapted from Gwendolyn Bennett’s 1926 poem “Street Lamps in Early Spring.” Night wears a garment All velvet soft, all violet blue... And over her face she draws a veil As shimmering fine as floating dew... And here and there In the black of her hair The subtle hands of Night Move slowly with their gem-starred light.\n\nWhich choice best describes the overall structure of the text?","o":["It presents alternating descriptions of night in a rural area and in a city.","It sketches an image of nightfall, then an image of sunrise.","It makes an extended comparison of night to a human being.","It portrays how night changes from one season of the year to the next."],"a":2,"r":"Choice C is the best answer because it most accurately describes the overall structure of the text. Throughout the text, the speaker characterizes nighttime as if it were a person who wears clothing (“a garment” that is “velvet soft” and “violet blue”) and a veil “over her face” and who moves her hands “slowly with their gem-starred light” through her dark hair. Thus, the text is structured as an extended comparison of night to a human being. Choice A is incorrect because the text never mentions any particular location; instead, it focuses on presenting a single description of night as a person with certain clothing and features. Choice B is incorrect because the text doesn’t make any reference to the sun or sunrise; instead, it focuses on presenting a single image of night as a person with certain clothing and features. Choice D is incorrect. Rather than describing how nighttime changes seasonally (or in any other way), the text presents a single image of night as a person with certain clothing and features."},{"i":"059f7201","c":"cross","d":"M","s":"Text 1 Graphic novels are increasingly popular in bookstores and libraries, but they shouldn’t be classified as literature. By definition, literature tells a story or conveys meaning through language only; graphic novels tell stories through illustrations and use language only sparingly, in captions and dialogue. Graphic novels are experienced as series of images and not as language, making them more similar to film than to literature.\n\nText 2 Graphic novels present their stories through both language and images. Without captions and dialogue, readers would be unable to understand what is depicted in the illustrations: the story results from the interaction of text and image. Moreover, Alison Bechdel’s Fun Home and many other graphic novels feature text that is as beautifully written as the prose found in many standard novels. Therefore, graphic novels qualify as literary texts.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the overall argument presented in\n\nText 1?","o":["By asserting that language plays a more important role in graphic novels than the author of Text 1 recognizes","By acknowledging that the author of Text 1 has identified a flaw that is common to all graphic novels","By suggesting that the story lines of certain graphic novels are more difficult to understand than the author of Text 1 claims","By agreeing with the author of Text 1 that most graphic novels aren’t as well crafted as most literary works are"],"a":0,"r":"Choice A is the best answer because it most accurately states how the author of Text 2 would most likely respond to the argument presented in Text 1. In arguing that graphic novels shouldn’t be classified as literature and are more comparable to film, Text 1 claims that language plays a relatively limited role in graphic novels: images, not language, are the primary means by which graphic novels tell their stories, and language is used \"only sparingly\"—that is, comparatively very little—in the form of captions and dialogue. However, the author of Text 2 asserts that language in graphic novels is as equally vital for conveying meaning as images are, since without captions and dialogue, readers wouldn’t be able to make sense of the narrative. Moreover, the author of Text 2 argues that there are many graphic novels that are \"beautifully written\" and whose use of language is as accomplished as any standard novel. Because Text 1 argues that language is subordinate to images in graphic novels, whereas Text 2 highlights how language is an essential component of a graphic novel’s storytelling, it can reasonably be inferred that the author of Text 2 would say that language plays a more important role in graphic novels than the author of Text 1 recognizes. Choice B is incorrect. Although Text 1 indicates that graphic novels shouldn’t be classified as literature based on their limited use of language, there’s no indication that the author of Text 1 considers this limited use of language as a flaw, just that it doesn’t fit the particular definition of \"literature\" proposed in the text. Even if Text 1 had suggested that their use of language was a common flaw of graphic novels, the author of Text 2 emphasizes how many graphic novels are \"beautifully written,\" and would therefore say that their use of language is exemplary, not that it is flawed. Choice C is incorrect because Text 1 doesn’t claim that the story lines of graphic novels are generally relatively easy to understand; in addition, Text 2 argues that given their dependence on the interaction of image and text, the stories of graphic novels would be incomprehensible if their captions and dialogue were removed, not that the story lines of some graphic novels are more difficult to understand than Text 1 acknowledges. Choice D is incorrect because the author of Text 1 doesn’t imply that graphic novels aren’t well crafted, only that they use language too sparingly to fit the definition of \"literature,\" and that their use of images to convey stories makes them more comparable to film than to literature. Even if the author of Text 1 had implied that most graphic novels aren’t well crafted, Text 2 refers to the fact that many graphic novels are as beautifully written—that is, well crafted—as many standard novels; thus, it wouldn’t be accurate to say that the author of Text 2 would agree with the author of Text 1 that most graphic novels aren’t well crafted."},{"i":"70aacc03","c":"main","d":"H","s":"Elizabeth Asiedu has identified a negative correlation between the share of developing countries’ economies derived from natural-resource extraction and those countries’ receipts of foreign investment. This may appear counterintuitive—resource extraction requires initial investments (in extractive technology, for instance) at scales best met by multinational corporations—but Asiedu notes that natural-resource industries’ boom-bust cycle can destabilize local currencies and increase developing countries’ vulnerability to external shocks, creating levels of uncertainty to which foreign investors are typically averse.\n\nWhich choice best states the main idea of the text?","o":["Although it may seem surprising that foreign investment declines in developing countries as natural-resource extraction makes up a larger share of those countries’ economies, that decline happens because resource extraction requires initial investments too large for foreign investors to supply.","Although developing countries tend to become less dependent on foreign investment as natural-resource industries make up a larger share of their economies, this change may not occur if the boom-bust cycle of those industries destabilizes local currencies or increases countries’ vulnerability to external shocks.","Although one might expect that foreign investment would increase as natural-resource extraction makes up a larger share of developing countries’ economies, the opposite happens because heavy reliance on natural resources can lead to unattractive conditions for investors.","Although foreign investors tend to avoid initial investments in natural-resource industries in developing countries, foreign investment may increase significantly as those industries stabilize and the risks associated with them decline."],"a":2,"r":"Choice C is the best answer because it accurately states the main idea of the text. According to the text, contrary to what some might expect, foreign investment is typically lower in developing countries whose economies are more dependent on natural-resource extraction. The text explains that high reliance on natural-resource extraction can subject a developing country to economic shocks that can destabilize the local currency and introduce economic uncertainty that tends to keep investors away. In other words, although we may think otherwise, foreign investors are less willing to invest in projects in developing countries whose economies are heavily dependent on natural-resource extraction because those economies tend to exhibit instability that investors want to avoid. Choice A is incorrect. The text does indicate that foreign investment is typically lower in developing countries whose economies are more dependent on natural-resource extraction; the text further indicates that natural-resource extraction requires substantial initial investments (to acquire things like required technologies) for which there are fewer investors willing to participate at this stage than one might think. But the text does not implicate the cost of these initial investments as a reason why foreign investment is less widely available than some might think. Choice B is incorrect. The text indicates that greater dependence on natural-resource extraction makes a developing country less appealing to foreign investors because of associated economic instability. Rather than arguing that the goal of developing countries is to become less dependent on foreign investment, as the phrasing of choice B suggests, the text focuses only on why foreign investors become less involved with such countries, which suggests that more investment would be preferable. Choice D is incorrect. Although the text indicates that natural- resource extraction requires substantial initial investments (to acquire things like required technologies) and that there are fewer likely investors willing to participate at this stage than one might think, the text does not address what investors are likely to do over time as the industry stabilizes itself."},{"i":"34c2e387","c":"main","d":"H","s":"Jürgen Kocka and other historians of capitalism rarely discuss domestic capitalism in Africa before the period of European colonization, implicitly presenting capitalism as external to and imposed on Africa. Crislayne Alfagali and other Africanist scholars have shown, however, that in parts of Africa, returns-focused investment, the establishment of open markets for wage labor, and other features of capitalism predated colonization. One reason for this discrepancy is that historians of capitalism tend to focus on longitudinal economic data drawn from archival records, which do not exist for much of precolonial Africa.\n\nWhich statement about Alfagali and other Africanist scholars is best supported by information in the text?","o":["They likely make use of different types of evidence than historians of capitalism typically rely on.","They likely differ from historians of capitalism in the methods they use to derive longitudinal economic data from archival records.","They likely have a different view about which activities should be considered capitalist in nature than historians of capitalism do.","They likely view capitalism as having been more beneficial for Africa than historians of capitalism do."],"a":0,"r":"Choice A is the best answer because it presents a statement about Alfagali and other Africanist scholars that is supported by the text. The last sentence of the text explains that historians of capitalism generally rely on a type of data that requires \"archival records, which do not exist for much of precolonial Africa.\" Nevertheless, Alfagali and other Africanist scholars have demonstrated that features of capitalism including \"returns-focused investment,...open markets for wage labor, and other features of capitalism\" existed in parts of Africa before colonization. Because archival records typically used by historians of capitalism aren′t available for precolonial Africa, Alfagali and other Africanist scholars of precolonial capitalism in Africa likely used atypical sources for their studies. Choice B is incorrect because the text states that archival records containing longitudinal economic data \"do not exist for much of precolonial Africa.\" If these records don’t exist for precolonial Africa, then Alfagali and other Africanist scholars couldn’t derive data from them by any method. Choice C is incorrect because the text doesn’t suggest that Alfagali and other Africanist scholars define capitalism differently than other historians of capitalism do. On the contrary, the text simply asserts that specific features they found, such as \"returns-focused investment [and] open markets for wage labor,\" are \"features of capitalism,\" which implies scholarly agreement that these activities are capitalist in nature. Choice D is incorrect because the text doesn’t indicate any effects of capitalism in Africa, positive or negative. Rather, the text explains why precolonial Africa has been omitted from mainstream histories of capitalism and presents work by Alfagali and other Africanist scholars that challenges and corrects the historical record of precolonial capitalism."},{"i":"dbbbc5dd","c":"infer","d":"E","s":"Off-off-Broadway theaters emerged in the late 1950s as a rebellion against mainstream Broadway theaters in New York, freeing artists to create productions that were more experimental than typical Broadway shows. One such artist was playwright María Irene Fornés. Working with off-off Broadway theaters enabled Fornés not only to direct her own plays but also to direct them exactly as she intended them to be staged, regardless of how strange the results might have seemed to audiences accustomed to Broadway shows. In this way, Fornés ______ Which choice most logically completes the text?","o":["wrote plays that would have been too expensive to produce if someone else had directed the production.","recognized that staging an off-off-Broadway play was more complicated than staging a Broadway play.","would have been more famous if she had created plays that were mainstream instead of experimental.","illustrates the artistic opportunity offered by off-off Broadway theaters."],"a":3,"r":"Choice D is the best answer. The text says that off-off-Broadway theaters allowed artists to create more experimental shows, and then discusses how Fornés was free to direct her own “strange” plays however she wanted. This suggests that Fornés exemplifies the artistic freedom of off-off Broadway theaters. Choice A is incorrect. This inference isn’t supported. The text never discusses the costs of production, so we can’t logically make this claim. Choice B is incorrect. This inference isn’t supported. The text never discusses the complexity of staging plays either on Broadway or off-off Broadway, so there’s no basis to make this inference. Choice C is incorrect. This inference isn’t supported. The text never discusses fame at all, so there’s no basis to make this inference."},{"i":"7c1e5880","c":"infer","d":"M","s":"Scholars have noted that F . Scott Fitzgerald’s writings were likely influenced in part by his marriage to Zelda Fitzgerald, but many don’t recognize Zelda as a writer in her own right. Indeed, Zelda authored several works herself, such as the novel Save Me the Waltz and numerous short stories. Thus, those who primarily view Zelda as an inspiration for F . Scott’s writings ______ Which choice most logically completes the text?","o":["overlook the many other factors that motivated F . Scott to write.","risk misrepresenting the full range of Zelda’s contributions to literature.","may draw inaccurate conclusions about how F . Scott and Zelda viewed each other’s works.","tend to read the works of F . Scott and Zelda in an overly autobiographical light."],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Zelda Fitzgerald’s contributions to literature. The text begins by saying that many scholars view Zelda mainly in terms of her marriage to F . Scott Fitzgerald and “don’t recognize Zelda as a writer in her own right.” The text then mentions a novel and “numerous short stories” that she wrote and that such scholars tend to ignore. Therefore, those scholars who focus on Zelda only as an inspiration for F . Scott’s writings risk misrepresenting the full range of Zelda’s contributions to literature. Choice A is incorrect. Although the text does mention that Zelda Fitzgerald “likely influenced” her husband’s literary work, its focus is on Zelda’s own writing, not on her husband’s writing or factors that might have influenced it. Choice C is incorrect because the text does not discuss F . Scott and Zelda Fitzgerald’s opinions of each other’s works. Choice D is incorrect. Although the text does suggest that F . Scott Fitzgerald’s works were “likely influenced in part” by his marriage to Zelda, it does not discuss autobiographical interpretations of the works of either F . Scott or Zelda."},{"i":"5fb6ed10","c":"claim","d":"M","s":"The Land of Enchantment is a 1906 travel book by Lilian Whiting. In the book, which describes the experience of traveling through the southwestern United States by train, Whiting reflects on the escape from everyday life that such a journey provides: ______ Which quotation from The Land of Enchantment most effectively illustrates the claim?","o":["“The opportunities and advantages already offered and constantly increasing are greater than would at first be considered possible.”","“The social and the picturesque charm of the long journey is singularly enhanced by the leisurely stops made for refreshment.”","“The real journey begins, of course, at Chicago, and as these trains leave in the evening the traveller fares forth in the seclusion of his berth.”","“One experiences a certain sense of detachment from ordinary day and daylight duties that is exhilarating.”"],"a":3,"r":"Choice D is the best answer because. This quotation specifically describes a \"sense of detachment from ordinary day,\" which matches the claim’s focus on \"escape from everyday life.\" Choice A is incorrect. While this quotation describes new opportunities associated with Whiting’s experience, it doesn’t frame these opportunities as \"an escape,\" and it doesn’t directly compare Whiting’s journey with \"everyday life.\" Choice B is incorrect. While this quotation includes a positive characterization of Whiting’s journey, it doesn’t specifically address the idea of an \"escape from everyday life,\" which is the focus of the claim. Choice C is incorrect. This quotation focuses on where the journey begins, not on how it feels like an \"escape from everyday life.\""},{"i":"0fc0a773","c":"claim","d":"E","s":"The Minneapolis Institute of Art in Minneapolis, Minnesota, has over 90,000 works of art. Digital images of thousands of those works have been put online through the museum’s website and the Google Arts &amp; Culture project. One of the images is of Mississippi Delta, a drawing by Siah Armajani. In a paper, a student claims that <u>putting a work from the museum online increases the number of people who experience that work<\/u>.\n\nWhich finding, if true, would most directly support the underlined claim?","o":["The Minneapolis Institute of Art has several works by Siah Armajani.","Many people who have been to Minneapolis say that the Minneapolis Institute of Art is worth visiting.","Mississippi Delta has been praised by some art critics.","Each year, more people access the online image of Mississippi Delta than visit the Minneapolis Institute of Art in person."],"a":3,"r":"Choice D is the best answer because it presents a finding that, if true, would most directly support the student’s claim that putting a work online increases the number of people who experience it. The text states that the Minneapolis Institute of Art has more than 90,000 artworks. It goes on to explain that images of a subset of these works can be viewed online, such as an image of Armajani’s drawing Mississippi Delta. The text then presents a student’s claim that online images of art can increase the number of people who experience the work. If more people view Armajani’s drawing online than they do in person, this finding would support the student’s claim about the benefits of putting a work from the museum online. Thus, this finding would most directly support the claim because, if it were true, more people would view Mississippi Delta online than would visit the entire museum in person. Choice A is incorrect because information about the museum having several works by Armajani wouldn’t address the student’s claim about how putting artworks online affects the number of people who experience them. The quantity of works by one artist that are held in a museum collection wouldn’t support a claim about audience size or the impact of online accessibility. Choice B is incorrect because opinions about the museum would only relate to the institution’s reputation. This finding wouldn’t provide information about online accessibility or whether digital images increase the number of people who view specific artworks. Choice C is incorrect because critics’ praise for Mississippi Delta wouldn’t address the student’s claim about how online access increases the number of people who can experience a work. Although positive comments from art critics could affect interest in an artwork, this finding wouldn’t provide information about how many people experience the work or whether online accessibility increases that number."},{"i":"626a1308","c":"graph","d":"H","s":"","o":["2007 using TEXES at the Gemini Observatory.","2007 using T -ReCS at the Gemini Observatory.","2006 using VISIR at the European Southern Observatory.","2003 using LWS at the W.M. Keck Observatory."],"a":2,"r":"Choice C is the best answer because it effectively completes the text’s discussion of Moses and colleagues’ analysis of changes in Neptune’s temperature by using data from the table to identify the source of the earliest example of spectroscopy data included in this analysis. The text indicates that Moses and colleagues analyzed infrared imaging and spectroscopy data about Neptune obtained in different years by various instruments. The table lists the observatories where these instruments are housed, the type of data each instrument collected (infrared imaging or spectroscopy), and the years in which the instruments’ observations were made. According to the table, only two of these instruments obtained spectroscopy data: VISIR at the European Southern Observatory, which made its observations in 2006, and TEXES at the Gemini Observatory, which made its observations in later years (2007 and 2019). Although two other instruments are also included in the table, they obtained infrared imaging data, not spectroscopy data. Therefore, the earliest example of spectroscopy data included in the researchers’ analysis is the data obtained by VISIR at the European Southern Observatory in 2006. Choice A is incorrect. Although the table indicates that TEXES at the Gemini Observatory collected spectroscopy data in 2007 and 2019, the table also indicates that this type of data was collected in 2006 by VISIR at the European Southern Observatory. Because the VISIR data were collected in the previous year, the data obtained in 2007 by TEXES are not the earliest example of spectroscopy data included in Moses and team’s analysis of Neptune’s temperature. Choice B is incorrect because the table indicates that T -ReCS at the Gemini Observatory collected infrared imaging data, not spectroscopy data. T -ReCS therefore cannot be the source of the earliest example of spectroscopy data that is included in Moses and colleagues’ analysis of Neptune’s temperature. Additionally, the T -ReCS data were collected in 2007, meaning that these data were obtained later than any type of data collected in 2006. Choice D is incorrect. Although the table indicates that data from LWS at the W.M. Keck Observatory were obtained in 2003, making these data the earliest example of any type of data included in the analysis, the table also indicates that LWS collected infrared imaging data, not spectroscopy data. LWS therefore cannot be the source of the earliest example of spectroscopy data included in Moses and team’s analysis of Neptune’s temperature."},{"i":"303bcc41","c":"graph","d":"E","s":"","o":["wild boar.","eastern gray kangaroo.","African bush elephant.","white-tailed deer."],"a":3,"r":"Choice D is the best answer because it accurately identifies the species with the highest global biomass, the white-tailed deer at approximately 2.7 million metric tons. The graph shows the global biomass for four wild land mammal species with the highest global biomass. The graph indicates that the African bush elephant’s global biomass is about 1.3 million metric tons, the eastern gray kangaroo’s is about 0.6 million metric tons, and the wild boar’s is about 1.9 million metric tons. These values are all lower than the global biomass for the white-tailed deer’s approximately 2.7 million metric tons. Thus, the white-tailed deer is the species with the highest global biomass. Choice A is incorrect because although the graph indicates that the wild boar has a relatively high global biomass of about 1.9 million metric tons, it is not the species with the highest value. The white-tailed deer is the species with the highest global biomass at about 2.7 million metric tons. Choice B is incorrect because the eastern gray kangaroo has the lowest global biomass value shown on the graph at about 0.6 million metric tons, not the highest global biomass. The white-tailed deer has the highest at about 2.7 million metric tons. Choice C is incorrect because although the African bush elephant has a substantial global biomass of about 1.3 million metric tons, it is not the species with the highest value according to the graph. The white-tailed deer has the highest global biomass at about 2.7 million metric tons."},{"i":"674e59a3","c":"fss","d":"E","s":"Following her debut album release in 2002, Mexican singer-songwriter Natalia Lafourcade quickly shot to fame. By 2023, she ______ one of the most celebrated musicians in Latin America, having released twelve albums and won seventeen Latin Grammy awards—more than any other female artist in history.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["will become","becomes","will have become","had become"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verbs to express tense in a sentence. The past perfect tense indicates an action that was completed before another past action. In this choice, the past perfect verb “had become,” together with the supplemental phrase “by 2023,” indicates that Lafourcade earned her status as one of the most celebrated musicians in Latin America before 2023. Choice A is incorrect because the future tense “will become” doesn’t indicate that Lafourcade earned her celebrated status before 2023. Choice B is incorrect because the present tense “becomes” doesn’t indicate that Lafourcade earned her celebrated status before 2023. Choice C is incorrect because the future perfect tense “will have become” doesn’t indicate that Lafourcade earned her celebrated status by 2023."},{"i":"bce9910f","c":"fss","d":"E","s":"Light of Truth is a bronze and marble sculpture by artist Richard Hunt. It honors civil rights icon Ida B. Wells. The sculpture ______ in a tree-lined plaza in Chicago, just a few blocks from where Wells lived.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["are standing","have been standing","stands","were standing"],"a":2,"r":"Choice C is the best answer. The convention being tested is subject-verb agreement. The singular verb \"stands\" agrees in number with the singular subject \"sculpture.\" Choice A is incorrect because the plural verb \"are standing\" doesn’t agree in number with the singular subject \"sculpture.\" Choice B is incorrect because the plural verb \"have been standing\" doesn’t agree in number with the singular subject \"sculpture.\" Choice D is incorrect because the plural verb \"were standing\" doesn’t agree in number with the singular subject \"sculpture.\""},{"i":"dc645172","c":"fss","d":"H","s":"The artistic talents of Barbara Chase-Riboud, most known for her 1979 historical novel Sally Hemings and the conversation it inspired, ______ limited to the realm of prose: she first excelled in sculpture, where her affinity for bronze—a material she described as “timeless” due to its use across eras and cultures—became part of her artistic identity.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["hasn’t been","wasn’t","isn’t","aren’t"],"a":3,"r":"Choice D is the best answer. The subject \"talents\" is plural, and so is the verb \"aren’t\": \"the artistic talents…aren’t limited.\" Choice A is incorrect. The subject \"talents\" is plural, but the verb \"hasn’t been\" is singular. Choice B is incorrect. The subject \"talents\" is plural, but the verb \"wasn’t\" is singular. Choice C is incorrect. The subject \"talents\" is plural, but the verb \"isn’t\" is singular."},{"i":"2fd05c15","c":"bound","d":"H","s":"In crafting her fantasy fiction, Nigerian-born British author Helen Oyeyemi has drawn inspiration from the classic nineteenth-century fairy tales of the Brothers Grimm. Her 2014 novel Boy, Snow, Bird, for instance, is a complex retelling of the story of Snow White, while her 2019 novel ______ offers a delicious twist on the classic tale of Hansel and Gretel.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Gingerbread—","Gingerbread,","Gingerbread","Gingerbread:"],"a":2,"r":"Choice C is the best answer. The convention being tested is punctuation between a subject and a verb. When, as in this case, a subject (“her 2019 novel Gingerbread”) is immediately followed by a verb (“offers”), no punctuation is needed. Choice A is incorrect because no punctuation is needed between the subject and the verb. Choice B is incorrect because no punctuation is needed between the subject and the verb. Choice D is incorrect because no punctuation is needed between the subject and the verb."},{"i":"59094d87","c":"bound","d":"H","s":"The Tantaquidgeon Museum in Uncasville, Connecticut, was founded in 1931 with the goal of showcasing the culture and history of the Mohegan ______ today, nearly a century later, it is the oldest Native-owned and -operated museum in the country.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Tribe, and","Tribe","Tribe and","Tribe,"],"a":0,"r":"Choice A is the best answer. This choice uses a comma and a coordinating conjunction (“and”) to join two independent clauses (“The Tantaquidgeon…Tribe” and “Today…country”). Choice B is incorrect. This choice results in a grammar error known as a run-on sentence. The clauses before and after “Tribe” are both independent, so they need to be separated with some sort of punctuation. Choice C is incorrect. This choice results in a grammar error known as a run-on sentence. The clauses before and after “and” are both independent, so they can’t be linked with just a conjunction. A comma would also be required. Choice D is incorrect. This choice results in a grammar error called a comma splice. The clauses before and after “Tribe” are both independent, so they can’t be linked with just a comma. A coordinating conjunction like “and” or “but” would also be required."},{"i":"3150021d","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The Royal Alcázar of Seville is a historic royal palace in Andalucía, Spain. The palace is famous for its intricate tilework. The palace features majolica and arista tiles. In the majolica style, designs are painted directly on the ceramic tiles. In the arista style, designs are stamped into the ceramic tiles. The student wants to contrast the two styles of tiles.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Tiles in the majolica and arista styles can be found in the Royal Alcázar of Seville in Andalucía, Spain.","Featuring tiles in the majolica and arista styles, the Royal Alcázar of Seville in Spain is famous for its intricate tilework.","In the arista style, designs are stamped into the ceramic tiles, whereas in the majolica style, the designs are painted directly on them.","Among the famous tilework of the Royal Alcázar of Seville are majolica style tiles, made by painting designs directly on the ceramic tiles."],"a":2,"r":"Choice C is the best answer. The sentence contrasts the two styles of tiles, noting that tiles in the arista style have designs stamped into them, whereas tiles in the majolica style have designs painted directly on them. Choice A is incorrect because the sentence indicates that the two styles of tile can be found in the same location; it doesn’t contrast the two styles of tile. Choice B is incorrect because the sentence indicates that the Royal Alcázar of Seville features tiles in both the majolica and arista styles; it doesn’t contrast the two styles of tile. Choice D is incorrect because the sentence indicates that the tilework of the Royal Alcázar of Seville includes tiles in the majolica style; it doesn’t contrast tiles in the majolica style with tiles in the arista style."},{"i":"e887dab1","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: “Organ 2 /ASLSP (As Slow as Possible)” is a musical piece by avant-garde composer John Cage. A specially designed automated organ in St. Burchardi Church in Halberstadt, Germany, began playing the piece in 2001. It is scheduled to stop playing the piece in 2640. The performance will last 639 years. It will be the longest continuous musical performance in history. The student wants to indicate how long John Cage’s musical piece will last.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["John Cage is the composer of the musical piece “Organ 2 /ASLSP (As Slow as Possible).”","“Organ 2 /ASLSP (As Slow as Possible)” is a musical piece currently being played in St. Burchardi Church in Halberstadt, Germany.","Lasting 639 years, John Cage’s musical piece will be the longest continuous musical performance in history.","An organ in St. Burchardi Church in Halberstadt, Germany, began playing a musical piece by avant-garde composer John Cage."],"a":2,"r":"Choice C is the best answer. The sentence indicates how long John Cage’s musical piece will last, noting that it will last 639 years and be the longest continuous musical performance in history. Choice A is incorrect. The sentence identifies John Cage as the composer and provides the name of the musical piece; it doesn’t indicate how long the piece will last. Choice B is incorrect. The sentence provides the name of the musical piece and where it is currently being played; it doesn’t indicate how long the piece will last. Choice D is incorrect. The sentence mentions where the musical piece is being played and identifies John Cage as the composer; it doesn’t indicate how long the piece will last."},{"i":"c7e85c0a","c":"trans","d":"E","s":"The envelope-shaped paper bags common in the US 150 years ago were impractical for carrying goods. ______ because they were the only paper bags that could be mass-produced, these bags dominated the market. That all changed in the 1870s, when industrial designer Margaret Knight patented a machine to make flat-bottomed, foldable paper bags.\n\nWhich choice completes the text with the most logical transition?","o":["However,","For instance,","Thus,","In other words,"],"a":0,"r":"Choice A is the best answer. “However” logically signals that the information in this sentence—that envelope-shaped bags dominated the market —contrasts with the previous claim that these bags were impractical for carrying goods. Choice B is incorrect because “for instance” illogically signals that the information in this sentence is an example supporting the previous claim that envelope-shaped bags were impractical for carrying goods. Instead, the sentence contrasts with the previous claim about the bags. Choice C is incorrect because “thus” illogically signals that the information in this sentence is a result of the previous claim that envelope-shaped bags were impractical for carrying goods. Instead, the sentence contrasts with the previous claim about the bags. Choice D is incorrect because “in other words” illogically signals that the information in this sentence is a paraphrase of the previous claim that envelope-shaped bags were impractical for carrying goods. Instead, the sentence contrasts with the previous claim about the bags."},{"i":"d54e16ee","c":"trans","d":"M","s":"Originally coined by economist Joan Robinson to refer to markets with multiple sellers of a product but only one buyer, the term “monopsony” can also refer to markets where demand for labor is limited. In a product monopsony, the single buyer can force sellers to lower their prices. ______ in a labor monopsony, employers can force workers to accept lower wages.\n\nWhich choice completes the text with the most logical transition?","o":["Earlier,","Instead,","Similarly,","In particular,"],"a":2,"r":"Choice C is the best answer. “Similarly” logically signals that the information in this sentence about a labor monopsony is similar to the information in the previous sentence about a product monopsony. In both types of markets, one party (an employer or a buyer) has the power to force another party (a worker or seller) to accept less money (for labor or products). Choice A is incorrect because “earlier” illogically signals that the information in this sentence about a labor monopsony occurs earlier (in a chronological sequence) than the information about a product monopsony. Instead, it is similar to the information about a product monopsony. Choice B is incorrect because “instead” illogically signals that the information in this sentence about a labor monopsony is an alternative to the previous information about a product monopsony. Instead, it is similar to the information about a product monopsony. Choice D is incorrect because “in particular” illogically signals that the information in this sentence about a labor monopsony provides specific details elaborating on the previous information about a product monopsony. Instead, it is similar to the information about a product monopsony."}],"img":{"626a1308":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEHBAMAAAC+cYhbAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABPUUlEQVR42u1dd1xTV/v/nnuTsMkJ4Ba4LOvmAuIeAXfriKu21hG12tqhWKu1wzbWal2taG3dNe6tcW8FZ50Edx0QcFaFnKCiQpL7+wMHYFBQ/L2+b3k+H0hy77lnfM9znvM8z3nuOUAJlVAJlVAJlVAJ/X8Q/Z9oBfefKdYrF3ok0FG9mj25/exNEuAlFK5zgv6X+qrQ5GY7SAEEACConqR7NoXLegoAdA7cHt0NeAp1+SRb/LOwPUGcEEXGo6+fAQBk+n8Z93b6SItaqnEiaSphdlAd+Agc9eZqIQJ8FPgwoOnxjGgEhTEuBuDDENCRGycIPAI7gBdxrdqCJt4iCdTIBD5YgI8QGMZ3kE3zojwXTGsJkiTjERgMEg3JC14k2h7LR/1n function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}
