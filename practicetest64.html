<script>
const D={"t":"Practicetest64","q":[{"i":"97ab5669","c":"vocab","d":"E","s":"Former astronaut Ellen Ochoa says that although she doesn’t have a definite idea of when it might happen, she ______ that humans will someday need to be able to live in other environments than those found on Earth. This conjecture informs her interest in future research missions to the moon.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["demands","speculates","doubts","establishes"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s discussion of Ochoa’s prediction that humans will one day need to live in places other than Earth. As used in this context, “speculates” would mean puts forward an idea without firm evidence. The text states that Ochoa “doesn’t have a definite idea” about when humans might need to live in other environments and characterizes Ochoa’s prediction as a “conjecture,” or a conclusion presented without convincing evidence. This context indicates that Ochoa speculates when she makes this prediction. Choice A is incorrect because saying that Ochoa “demands,” or insists or requires, that humans will one day need to live in other environments than Earth’s would not make sense in context. The text indicates that she’s unsure about the timing but hypothesizes that it will someday happen. Choice C is incorrect because saying that Ochoa “doubts,” or questions or disbelieves, that humans will one day need to live in other environments than Earth’s would not make sense in context. The text indicates that although Ochoa is unsure about the timing, she hypothesizes that humans will need to live in places other than Earth and encourages research into future travel to the moon. Choice D is incorrect because saying that Ochoa “establishes,” or proves, that humans will one day need to live in other environments than Earth’s would not make sense in context. Rather than stating that Ochoa discusses her idea with certainty and supports it with evidence, the text indicates that Ochoa is unsure about when humans might need to live in other environments."},{"i":"d8d1ecaa","c":"vocab","d":"M","s":"Business researcher Melanie Brucks and colleagues found that remote video conference meetings may be less conducive to brainstorming than in-person meetings are. The researchers suspect that video meeting participants are focused on staring at the speaker on the screen and don’t allow their eyes or mind to wander as much, which may ultimately ______ creativity.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["recommend","criticize","impede","construct"],"a":2,"r":"Choice C is the best answer. The first sentence tells us that video meetings are “less conducive to” (meaning less good for) brainstorming. This suggests that the video meeting participants’ focus is bad for their creativity. “Impede” means “delay” or “prevent,” which works perfectly in this context. Choice A is incorrect. This choice is too positive to fit the context. The first sentence tells us that video meetings are “less conducive to” (meaning less good for) brainstorming. This suggests that the video meeting participants’ focus is bad for their creativity. Choice B is incorrect. This choice doesn’t make sense. The participants’ intense focus on the screen is the subject of the missing verb. It wouldn’t make sense to say that their over-focusing “criticizes” their creativity. Choice D is incorrect. “Construct” means “build” or “make,” which is too positive to fit the context. The first sentence tells us that video meetings are “less conducive to” (meaning less good for) brainstorming. This suggests that the video meeting participants’ focus is bad for their creativity."},{"i":"5dce6cab","c":"vocab","d":"H","s":"Given that the conditions in binary star systems should make planetary formation nearly impossible, it’s not surprising that the existence of planets in such systems has lacked ______ explanation. Roman Rafikov and Kedron Silsbee shed light on the subject when they used modeling to determine a complex set of factors that could support planets’ development.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["a discernible","a straightforward","an inconclusive","an unbiased"],"a":1,"r":"Choice B is the best answer because it most logically completes the text’s description of efforts to explain the existence of planets in binary star systems. As used in this context, describing an explanation as “a straightforward” one would mean that the explanation is direct and uncomplicated. The text asserts that since it should be “nearly impossible” for planets to form in binary star systems, it’s “not surprising” that there isn’t a straightforward explanation for the existence of planets in such systems; the fact that one potential approach involves “complex” factors offers further contextual support for this idea. Choice A is incorrect because it would not make sense in context to say that there isn’t “a discernible” explanation—meaning an explanation capable of being perceived—for the existence of planets in binary star systems. The text discusses just such an explanation offered by Roman Rafikov and Kedron Silsbee, which indicates that their explanation can be discerned. Choice C is incorrect because the text emphasizes how difficult it is to explain the existence of planets in binary star systems, suggesting that the situation isn’t marked by the lack of “an inconclusive” explanation—an explanation that does not resolve the issue—but rather that if any explanations have been offered, they’ve likely been inconclusive ones. Choice D is incorrect because nothing in the text suggests that there is a lack of “an unbiased,” or impartial and unprejudiced, explanation for the existence of planets in binary star systems. The text indicates that it’s difficult to explain the existence of planets in such systems and it describes one attempt to do so, but there is no evidence that explanations from Roman Rafikov and Kedron Silsbee or others are biased."},{"i":"d2eb1df1","c":"vocab","d":"E","s":"In recommending Bao Phi’s collection Sông I Sing, a librarian noted that pieces by the spoken-word poet don’t lose their ______ nature when printed: the language has the same pleasant musical quality on the page as it does when performed by Phi.\n\nWhich choice completes the text with the most logical and precise word or phrase?","o":["scholarly","melodic","jarring","personal"],"a":1,"r":"Choice B is the best answer. Based on the text, we’re looking for a word that means something similar to “pleasant musical quality.” That’s exactly what “melodic” means. Choice A is incorrect. This isn’t a logical word choice. Based on the text, we’re looking for a word that means something similar to “pleasant musical quality.” “Scholarly” would suggest something that is academic or well-researched, which doesn’t match the meaning we’re looking for. Choice C is incorrect. This isn’t a logical word choice. Based on the text, we’re looking for a word that means something similar to “pleasant musical quality.” “Jarring” would suggest the opposite: something unpleasant or discordant. Choice D is incorrect. This isn’t a logical word choice. Based on the text, we’re looking for a word that means something similar to “pleasant musical quality.” “Personal” would suggest something that is expressive or intimate, which doesn’t match the meaning we’re looking for."},{"i":"a2dd51c1","c":"purpose","d":"E","s":"In most building demolitions, the building materials are destroyed and sent to landfills. City officials in Portland, Oregon, wanted to reduce this waste. The officials passed a law requiring demolition companies to deconstruct some buildings instead. Deconstruction involves carefully taking buildings apart piece by piece. Damage to the materials is avoided so that they can be reused in new constructions. A 2019 study found that 27 percent of materials from deconstructions in Portland were able to be reused. The remaining materials were processed for recycling instead of going to a landfill.\n\nWhich choice best states the main purpose of the text?","o":["To explain an effort made by the city of Portland to reduce demolition waste and some results of that effort","To show that popular support for measures that reduce demolition waste has increased since 2019","To argue that building deconstruction is not as effective as other measures at reducing demolition waste","To discuss laws aimed to reduce demolition waste in Portland and compare them to similar laws in other cities"],"a":0,"r":"Choice A is the best answer. The author first describes a Portland law aimed at reducing demolition waste, and then goes on to explain that 27% of materials from building deconstructions were able to be reused and the rest were recycled. Choice B is incorrect. The text never discusses the popularity of the law. Choice C is incorrect. The text never compares building deconstruction to other measures designed to reduce demolition waste. Choice D is incorrect. The text never mentions laws in cities other than Portland, Oregon."},{"i":"e5da61f1","c":"purpose","d":"E","s":"The following text is adapted from Charles Chesnutt’s 1899 short story “Mars Jeems’s Nightmare.”The narrator and his wife have recently moved to the southern United States, and Julius is their carriage driver. Julius [was] very useful when we moved to our new residence. He had a thorough knowledge of the neighborhood, was familiar with the roads and the watercourses, knew the qualities of the various soils and what they would produce, and where the best hunting and fishing were to be had. He was a marvelous hand in the management of horses and dogs.\n\nWhich choice best states the main purpose of the text?","o":["To compare the narrator’s reaction to a new home with his wife’s reaction","To give an example of Julius’s knowledge about soil","To show that the narrator and Julius often hunt and fish together","To explain different ways in which Julius was helpful"],"a":3,"r":"Choice D is the best answer because it most accurately describes the main purpose of the text, which is to explain different ways in which Julius was helpful. The text begins with the narrator stating that Julius was very helpful to him and his wife when they moved to their new residence. The narrator then provides a list of examples to illustrate Julius’s helpfulness. For instance, the narrator states that Julius was familiar with the neighborhood’s roads, which suggests that he was helpful in navigating them, and that Julius helped manage the horses and dogs. The text’s many examples of Julius’s usefulness reinforce just how helpful he was and in how many different ways. Choice A is incorrect because the text doesn’t portray either the narrator’s or his wife’s reaction to their new home. Rather, the text focuses on how Julius was useful to the narrator and his wife in their new home. Choice B is incorrect. Although the text states that Julius was knowledgeable about the soil, this is one of several supporting details that illustrate how helpful Julius was. Moreover, the text merely states that Julius was knowledgeable about soil; it doesn’t provide an example of that knowledge. Choice C is incorrect because there’s nothing in the text to suggest the frequency with which the narrator and Julius hunted and fished together. In fact, it’s unclear from the text whether the narrator and Julius hunted and fished together at all. The text merely indicates that Julius knew the best places to hunt and fish—a detail that supports the text’s main purpose by conveying Julius’s usefulness."},{"i":"271a5017","c":"func","d":"E","s":"The following text is adapted from Akwaeke Emezi’s 2019 novel Pet. Jam is a teenager who lives with her father, Aloe, and her mother, Bitter, who is a painter. Bitter finished the painting in the dark morning of a day—it was well past midnight when Jam heard the studio door creak open. She stared into the velvet black of her room and listened to her mother’s footsteps walking in her [mother] and Aloe’s bedroom. There was a weight thrumming through the floorboards in a low song, and that was how Jam knew the painting was done. <u>Bitter’s feet were singing the news.<\/u> ©2019 by Akwaeke Emezi Which choice best states the function of the underlined sentence in the text as a whole?","o":["It indicates that Jam is more interested in music than in art.","It adds to the idea that Bitter’s footsteps reveal something to Jam.","It indicates that Bitter always sings when working on a painting.","It describes Aloe’s reaction upon seeing the painting for the first time."],"a":1,"r":"Choice B is the best answer because it most accurately describes how the underlined sentence functions in the text as a whole. The text establishes that Jam hears Bitter’s studio door open early in the morning, when it is still dark. Jam then listens to her mother’s footsteps, which seem to create a song that runs through the floorboards. The text indicates that the sound of Bitter’s footsteps convey to Jam that Bitter is done painting. The underlined sentence then builds on this idea, stating explicitly that Bitter’s feet sing the news of her completion of a painting. Thus, the sentence stating that “Bitter’s feet were singing the news” further emphasizes that Bitter’s footsteps themselves reveal information to Jam. Choice A is incorrect because the text provides no evidence that Jam prefers music to art. While the underlined sentence uses musical imagery to describe the vibrations Jam feels, this is figurative language that is describing the footsteps’ vibrations; it isn’t an indication of Jam’s personal interests. Choice C is incorrect because the text doesn’t suggest that Bitter herself sings while working on paintings. The references to singing in the text are figurative descriptions of how Bitter’s footsteps sound or feel to Jam, not literal statements about Bitter singing. Choice D is incorrect because the underlined sentence only describes Jam’s perception of her mother’s footsteps. It doesn’t provide any details about Aloe or his reaction to the painting; in fact, the text doesn’t mention Aloe seeing the painting at all."},{"i":"570970cd","c":"func","d":"H","s":"The following text is adapted from Indian Boyhood, a 1902 memoir by Ohiyesa (Charles A. Eastman), a Santee Dakota writer. In the text, Ohiyesa recalls how the women in his tribe harvested maple syrup during his childhood. Now the women began to test the trees—moving leisurely among them, axe in hand, and striking a single quick blow, to see if the sap would appear. <u>The trees, like people, have their individual characters; some were ready to yield up their life-blood, while others were more reluctant.<\/u> Now one of the birchen basins was set under each tree, and a hardwood chip driven deep into the cut which the axe had made. From the corners of this chip—at first drop by drop, then more freely—the sap trickled into the little dishes.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?","o":["It portrays the range of personality traits displayed by the women as they work.","It foregrounds the beneficial relationship between humans and maple trees.","It demonstrates how human behavior can be influenced by the natural environment.","It elaborates on an aspect of the maple trees that the women evaluate."],"a":3,"r":"Choice D is the best answer because it best describes the function of the underlined sentence in the text’s overall portrayal of how the women in Ohiyesa’s tribe harvested maple syrup. The text states that the women used an axe to strike the maple trees in order to find out which ones would produce sap. The underlined sentence compares the trees to people, with the sap described as the trees’ “life-blood.” Some of the trees are ready to give out their sap, while others are unwilling to do so. Using personification, the sentence provides greater detail about the aspect of the maple trees—their potential to give sap—that the women are evaluating. Choice A is incorrect because the personalities of the women are not discussed in the text. Although the underlined sentence does mention “individual characters,” this reference is not to the women in the text but rather to the maple trees, which the sentence compares to people with individual character traits. Choice B is incorrect because the underlined sentence focuses on the trees’ willingness or refusal to yield sap, not on the beneficial relationship between the women and the trees. Additionally, although the text does suggest that the women and their tribe benefit from the maple trees since the trees allow the women to harvest syrup, there is nothing in the text to suggest that the trees benefit from this relationship in turn. Choice C is incorrect because the underlined sentence is comparing maple trees to humans, not addressing the influence of the natural environment on how the actual humans in the text, the women, behave."},{"i":"22105871","c":"cross","d":"E","s":"Text 1 In a study of insect behavior, Samadi Galpayage and colleagues presented bumblebees with small wooden balls and observed many of the bees clinging to, rolling, and dragging the objects. The researchers provided no external rewards (such as food) to encourage these interactions. <u>The bees simply appeared to be playing—and for no other reason than because they were having fun<\/u>.\n\nText 2 Insects do not have cortexes or other brain areas associated with emotions in humans. Still, Galpayage and her team have shown that bumblebees may engage in play, possibly experiencing some kind of positive emotional state. Other studies have suggested that bees experience negative emotional states (for example, stress), but as Galpayage and her team have acknowledged, emotions in insects, if they do indeed exist, are likely very rudimentary.\n\nBased on the texts, how would the author of\n\nText 2 most likely respond to the underlined portion of\n\nText 1?","o":["By objecting that the bees were actually experiencing a negative feeling akin to stress rather than a positive feeling","By arguing that some insects other than bumblebees may be capable of experiencing complex emotional states","By pointing out that even humans sometimes struggle to have fun while engaging in play","By noting that if the bees were truly playing, any positive feelings they may have experienced were probably quite basic"],"a":3,"r":"Choice D is the best answer. The author of Text 2 agrees with the author of Text 1 that bumblebees may engage in play and possibly experience some kind of positive emotional state. However, the author of Text 2 also qualifies this claim by stating that emotions in insects, if they do exist, are “likely very rudimentary.” Choice A is incorrect. While Text 2 states that other studies might indicate “negative emotional states” in bees, it does not contradict the findings from the Galpayage study—that the bees might have been having fun. Choice B is incorrect. The author of Text 2 does not mention or imply that any insects, including bumblebees, are capable of experiencing complex emotional states. The author of Text 2 states that if insects do feel emotions, those emotions are “likely very rudimentary.” Choice C is incorrect. The author of Text 2 does not compare or contrast the behavior or emotions of insects and humans, and neither does the author of Text 1."},{"i":"a66f9b8d","c":"main","d":"M","s":"Cats can judge unseen people’s positions in space by the sound of their voices and thus react with surprise when the same person calls to them from two different locations in a short span of time. Saho Takagi and colleagues reached this conclusion by measuring cats’ levels of surprise based on their ear and head movements while the cats heard recordings of their owners’ voices from two speakers spaced far apart. Cats exhibited a low level of surprise when owners’ voices were played twice from the same speaker, but they showed a high level of surprise when the voice was played once each from the two different speakers.\n\nAccording to the text, how did the researchers determine the level of surprise displayed by the cats in the study?","o":["They watched how each cat moved its ears and head.","They examined how each cat reacted to the voice of a stranger.","They studied how each cat physically interacted with its owner.","They tracked how each cat moved around the room."],"a":0,"r":"Choice A is the best answer because it explains how the researchers determined the level of surprise displayed by the cats in the study. The text states that Saho Takagi and colleagues played recordings of the voice of each cat’s owner and measured how surprised the cat was by the recording based on how it moved its ears and head. Choice B is incorrect because, as the text explains, the recordings played for each cat in the study were of the voice of the cat’s owner, not a stranger’s voice. Choice C is incorrect because the text explains that during the study, the cats didn’t interact directly with their owners; instead, the cats listened to recordings of their owners’ voices. Choice D is incorrect because the text doesn’t indicate that the researchers monitored the cats’ movement around the room in which the study was conducted."},{"i":"8c1be131","c":"main","d":"M","s":"During the World War II era, some Mexican American women adopted a striking new look called pachuca style. They wore altered men’s jackets or zoot suits (wide-legged, long-coated suits) and dramatic makeup, and they combed their hair into high, rounded shapes. Some people criticized pachuca style, saying it was dangerous and women should dress traditionally. But historians see things differently. They see pachuca style as a form of rebellion against the era’s rigid social expectations for women. They say that it showed a desire for self-expression and freedom on the part of women who adopted the style.\n\nAccording to the text, how do historians view pachuca style?","o":["They think that pachuca style was such a popular trend that it continues to influence fashion in the United States to the present day.","They think that pachuca style was a way for some Mexican American women to express themselves and resist strict social expectations.","They think that pachuca style was celebrated because it enabled some Mexican American women to show their support for the United States during World War II.","They think that pachuca style was similar to other fashion trends that different groups of women adopted in the same period."],"a":1,"r":"Choice B is the best answer because it presents a statement about how historians view pachuca style that is supported by the text. The text first describes the distinctive pachuca style of dress adopted by some Mexican American women during World War II, saying that some criticized it and asserted that women should dress traditionally. The text then goes on to contrast this position with that of historians, who \"see things differently\": according to these historians, the pachuca style showed a wish for freedom and self-expression, and it acted as a kind of rebellion against what society expected of women at the time. Therefore, according to the text, historians think that the pachuca style was a way for Mexican women to express themselves and resist strict social expectations. Choice A is incorrect because the text explicitly describes the pachuca style as a distinctive look adopted during the World War II era. It does not indicate that the pachuca style influences fashion in the United States in the present day. Choice C is incorrect because the text does not indicate that Mexican American women wore the pachuca style to show support for the United States during World War II; rather, the style was a means of self-expression and rebellion against social expectations. Choice D is incorrect because the text does not compare the pachuca style to other fashion trends: the pachuca style is the only style mentioned."},{"i":"aaddd60f","c":"infer","d":"H","s":"Scientists studying Mars long thought the history of its crust was relatively simple. One reason for this is that geologic and climate data collected by a spacecraft showed that the crust was largely composed of basalt, likely as a result of intense volcanic activity that brought about a magma ocean, which then cooled to form the planet’s surface. A study led by Valerie Payré focused on additional information—further analysis of data collected by the spacecraft and infrared wavelengths detected from Mars’s surface—that revealed the presence of surprisingly high concentrations of silica in certain regions on Mars. Since a planetary surface that formed in a mostly basaltic environment would be unlikely to contain large amounts of silica, Payré concluded that ______ Which choice most logically completes the text?","o":["the information about silica concentrations collected by the spacecraft is likely more reliable than the silica information gleaned from infrared wavelengths detected from Mars’s surface.","high silica concentrations on Mars likely formed from a different process than that which formed the crusts of other planets.","having a clearer understanding of the composition of Mars’s crust and the processes by which it formed will provide more insight into how Earth’s crust formed.","Mars’s crust likely formed as a result of other major geological events in addition to the cooling of a magma ocean."],"a":3,"r":"Choice D is the best answer. Cooling magma would create basalt, but “a planetary surface that formed in a mostly basaltic environment would be unlikely to contain large amounts of silica.” Since Mars’s crust does contain large amounts of silica, it is unlikely that Mars’s crust was formed exclusively by cooling magma. Therefore, there were likely other major geological events that created the high silica concentrations. Choice A is incorrect. Although the passage discusses these two methods of collecting data about Mars’s crust, it never compares their reliability, so there’s no basis for this inference. Choice B is incorrect. The passage never mentions anything about the crusts of other planets, so there’s no basis for this inference. Choice C is incorrect. The passage never mentions Earth’s crust, so there’s no basis for this inference."},{"i":"575e67df","c":"infer","d":"M","s":"By running computer simulations of the development of our solar system, André Izidoro, Rajdeep Dasgupta, and colleagues concluded that the Sun may have been surrounded by three giant dust rings before the planets started to form. The researchers suggest that the materials in the innermost ring became the four planets closest to the Sun, the materials in the middle ring produced the rest of the planets, and the materials in the outermost ring created the asteroids and other small bodies in the region beyond Neptune. In one simulation, the researchers delayed the initial formation of the middle ring, causing oversized super-Earths to begin developing from the innermost ring. The researchers therefore hypothesize that ______ Which choice most logically completes the text?","o":["the middle ring formed earlier in the solar system’s development than the initial simulations suggested.","the timing of the initial formation of the middle ring played an important role in determining the eventual size of Earth.","if the formation of the outermost ring had occurred earlier in a simulation, all the planets would have become super-Earths.","the innermost ring actually formed into all the planets in our solar system, not just the four closest to the Sun."],"a":1,"r":"Choice B is the best answer because it most logically follows from the text’s discussion of André Izidoro, Rajdeep Dasgupta, and colleagues’ computer simulations of our solar system’s development. The text begins by stating that the simulations led the researchers to conclude that the solar system likely formed from three giant dust rings that encircled the Sun. The text explains that the four inner planets, including Earth, formed from the innermost ring and that the remaining planets formed from the middle ring. It then explains that in one simulation, the researchers delayed the formation of the middle ring—that is, they tested to see what would happen if the middle ring had formed later than it actually did. They found that doing so affected the size of the innermost planets, resulting in oversized super-Earths, planets that are much larger than Earth. Since the delayed timing had the effect of changing the size of Earth in the simulation relative to Earth’s real size, it’s reasonable to conclude that the timing of the middle ring’s formation was important in determining Earth’s eventual size. Choice A is incorrect. Although the text explains that when the researchers delayed the formation of the middle ring in one simulation, the size of the innermost planets was affected (which suggests that the middle ring likely formed earlier than it did in this simulation), the text doesn’t indicate that this was an initial simulation—that is, a simulation that was conducted before other simulations. Moreover, the text makes no reference to the specific results of any other simulations; therefore, there is no basis for comparing any conclusions based on the simulation in which the middle ring’s formation was delayed with conclusions based on other simulations. Choice C is incorrect because the text discusses how altering the timing of the formation of the middle ring, not the outermost ring, affected the four innermost planets’ eventual size in the researchers’ simulation; therefore, the simulation offers no basis for a conclusion about how the outermost ring’s formation affected the size of the planets. Choice D is incorrect because there is nothing in the text to suggest that the innermost ring produced all the solar system’s planets. Rather, the text states that the simulations showed that the innermost planets formed from the innermost ring and that the remaining planets formed from the middle ring."},{"i":"8391a002","c":"claim","d":"H","s":"Black beans (Phaseolus vulgaris) are a nutritionally dense food, but they are difficult to digest in part because of their high levels of soluble fiber and compounds like raffinose. They also contain antinutrients like tannins and trypsin inhibitors, which interfere with the body’s ability to extract nutrients from foods. In a research article, Marisela Granito and Glenda Álvarez from Simón Bolívar University in Venezuela claim that inducing fermentation of black beans using lactic acid bacteria improves the digestibility of the beans and makes them more nutritious.\n\nWhich finding from Granito and Álvarez’s research, if true, would most directly support their claim?","o":["When cooked, fermented beans contained significantly more trypsin inhibitors and tannins but significantly less soluble fiber and raffinose than nonfermented beans.","Fermented beans contained significantly less soluble fiber and raffinose than nonfermented beans, and when cooked, the fermented beans also displayed a significant reduction in trypsin inhibitors and tannins.","When the fermented beans were analyzed, they were found to contain two microorganisms, Lactobacillus casei and Lactobacillus plantarum, that are theorized to increase the amount of nitrogen absorbed by the gut after eating beans.","Both fermented and nonfermented black beans contained significantly fewer trypsin inhibitors and tannins after being cooked at high pressure."],"a":1,"r":"Choice B is the best answer because it presents a finding that would best support Granito and Álvarez’s claim that fermenting black beans makes them easier to digest and more nutritious. The text indicates that high levels of soluble fiber and raffinose in black beans make the beans hard to digest and that tannins and trypsin inhibitors make it harder for the body to extract nutrients from the beans. If it were found that fermenting the beans significantly reduces their levels of soluble fiber, raffinose, trypsin inhibitors, and tannins when cooked, this would directly support the claim that fermentation improves the digestibility of the beans and makes them more nutritious. Choice A is incorrect because the text indicates that trypsin inhibitors and tannins interfere with the body’s ability to extract nutrients from black beans; if fermentation and cooking were found to increase these antinutrients, fermented beans would likely be less nutritious than unfermented ones, not more nutritious (as Granito and Álvarez claim). Choice C is incorrect because the text doesn’t address the idea that greater nitrogen absorption in the gut has an effect on a food’s digestibility or level of nutrition, so the discovery of the presence of microorganisms that may increase nitrogen absorption wouldn’t provide relevant support for the claim that fermentation makes black beans easier to digest and more nutritious. Choice D is incorrect because Granito and Álvarez’s claim focuses on the effect of fermenting black beans, but the finding that nonfermented black beans also have fewer trypsin inhibitors and tannins when cooked at high pressure would suggest that the role of the cooking method could be significant when it comes to nutrition; further, the finding wouldn’t address the beans’ digestibility."},{"i":"73c091d2","c":"claim","d":"E","s":"Many trees produce growth rings as they age, with each ring in a tree’s trunk representing one year in the tree’s life. This often makes it fairly easy to determine how old a tree was when it was cut down. To do so, you look at the tree stump and count the dark rings you see. But a researcher claims that this method often can’t be used to identify the age of olive trees. Which detail, if true, would most directly support the researcher’s claim?","o":["The oldest olive tree in the world is likely over 1,100 years old.","Narrow growth rings can suggest that an olive tree experienced harsh conditions.","Many olive trees have growth rings that are difficult to see.","Olive trees thrive in areas with hot, dry summers."],"a":2,"r":"Choice C is the best answer because it presents a detail that, if true, would most directly support the researcher’s claim about the difficulty of determining olive tree age by ring counting. The text explains that for many trees, counting the dark rings visible in a tree stump is a reliable method for determining the tree’s age. However, if olive trees have growth rings that are difficult to see, it would be hard to count the individual rings. Therefore, the ring-counting method would be challenging or impossible to use for olive trees. This directly supports the researcher’s claim that the ring-counting method often can’t be used for olive trees because it identifies a specific characteristic of olive trees that could render this approach impracticable. Choice A is incorrect because the probable age of the oldest olive tree doesn’t explain why counting rings wouldn’t work for determining olive tree age. The older age of some olive trees might make counting more tedious but doesn’t pose an insurmountable obstacle to adopting the method. The researcher’s claim is about the feasibility of the ring-counting method for olive trees, not about the potential impracticality of employing this method for particularly long-lived trees. Choice B is incorrect because the fact that narrow growth rings might indicate harsh growing conditions has no direct bearing on the claim that counting rings often can’t be used to determine olive tree age. It is possible that growth rings that are too narrowly spaced might be difficult to count, but the researcher’s claim relates to the inapplicability of the ring-counting method to olive trees in general rather than to olive trees that have experienced harsh conditions. Moreover, as long as they are visible, even narrow growth rings might permit the ring-counting method to be used to determine tree age. Choice D is incorrect because the ideal climate conditions for olive trees don’t explain why counting rings wouldn’t work as a method for determining their age. While growing conditions might affect ring formation patterns, the simple fact that olive trees thrive in hot, dry environments doesn’t directly address why the conventional method of counting rings would be ineffective for determining their age."},{"i":"4042ff0b","c":"graph","d":"E","s":"","o":["and they each reported the same level of comfort.","even though each participant’s ratings varied throughout the day.","but participant 20 reported feeling significantly colder than the other two participants did.","but participant 1 reported feeling warmer than the other two participants did."],"a":2,"r":"Choice C is the best answer. The text describes the comfort rating scale: from −3 (very cold) to +3 (very hot), with 0 being neutral. Participant 20 gave a −2 comfort rating, a full three points colder on the scale than the other two participants. Choice A is incorrect. This choice misreads the table. Participant 1 and participant 21 reported the same level of comfort, but participant 20’s comfort level was three points lower. Choice B is incorrect. This choice doesn’t use data from the table. The table only shows us one survey, so we don’t know if the participants’ ratings varied throughout the day. Choice D is incorrect. This choice misreads the table. Participant 1 and participant 21 reported the same level of comfort."},{"i":"742fd8ba","c":"graph","d":"M","s":"","o":["The control plants contained higher levels of zinc than iron, but plants exposed to kanamycin contained higher levels of iron than zinc.","Both groups of plants contained more than 200 parts per million of both iron and zinc.","Zinc levels were around 300 parts per million in the control plants but nearly 400 parts per million in the plants exposed to kanamycin.","The plants exposed to kanamycin showed lower levels of iron and zinc than the control plants did."],"a":3,"r":"Choice D is the best answer because it best describes data in the graph supporting Ayalew and her colleagues’ hypothesis that plants’ response to kanamycin exposure involves altering their uptake of metals. The graph compares the metal content of two groups of plants, one with kanamycin exposure and a control group without such exposure. The amount of zinc in plants without kanamycin exposure is around 400 parts per million, while the amount of zinc in plants with kanamycin exposure is lower, at around 300 parts per million. Similarly, the amount of iron in plants without kanamycin exposure is a little over 600 parts per million, while the amount of iron in plants with kanamycin exposure is lower, at a little over 200 parts per million. Thus, the graph shows that plants with kanamycin exposure have significantly lower levels of both iron and zinc than the plants without kanamycin exposure. This is evidence supporting the hypothesis that kanamycin exposure results in plants altering their uptake of metals. Choice A is incorrect because the graph shows that control plants contained higher levels of iron than zinc, not higher levels of zinc than iron; similarly, the plants exposed to kanamycin contained higher levels of zinc than iron, not higher levels of iron than zinc. Choice B is incorrect. Though the claim that both groups of plants contained more than 200 parts per million of both iron and zinc is supported by the graph, this alone does not state whether plants with kanamycin exposure have a different metal content than plants without kanamycin exposure. Choice C is incorrect. The graph shows that the zinc levels for the control plants (those without kanamycin exposure) were around 400 parts per million, not 300 parts per million, and that the zinc levels for plants with kanamycin exposure were around 300 parts per million, not 400 parts per million."},{"i":"e2759b92","c":"fss","d":"E","s":"Occupying a significant part of modern-day Nigeria, the Kingdom of Benin was one of the major powers in West Africa between the thirteenth and nineteenth centuries. It ______ ruled by Oba Ewuare I from 1440 to 1473.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["is","will be","has been","was"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verbs to express tense in a sentence. In this choice, the past tense verb “was ruled” correctly indicates that Oba Ewuare I ruled the Kingdom of Benin in the distant past (from 1440 to 1473). This past tense verb choice is consistent with the other past tense verb (“was”) used to describe the Kingdom of Benin. Choice A is incorrect because the present tense verb “is ruled” doesn’t indicate that Oba Ewuare I ruled the Kingdom of Benin in the distant past. Choice B is incorrect because the future tense verb “will be ruled” doesn’t indicate that Oba Ewuare I ruled the Kingdom of Benin in the distant past. Choice C is incorrect because the present perfect tense verb “has been ruled” doesn’t indicate that Oba Ewuare I ruled the Kingdom of Benin in the distant past."},{"i":"69f031ab","c":"fss","d":"M","s":"While exploring Nevada’s Gypsum Cave in 1930, Seneca and Abenaki archaeologist Bertha Parker made her most famous discovery: the skull of a now-extinct ground sloth (Nothrotheriops shastensis) alongside human-made tools. Parker’s crucial finding was the first ______ humans in North America as far back as 10,000 years ago.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["places","placed","place","to place"],"a":3,"r":"Choice D is the best answer. The object for the verb \"was\" is \"first,\" and \"to place\" is acting as a modifier for \"first.\" What was the finding? It was \"the first.\" The first to do what? The first \"to place humans in North America\" 10,000 years ago. When a verb serves as a modifier within a noun phrase, it must be nonfinite (i.e., not conjugated to a specific subject). The infinitive form \"to place\" is the only nonfinite option among the choices that makes sense in context. Choice A is incorrect. The object for the verb \"was\" is \"first,\" and \"places\" is acting as a modifier for \"first.\" What was the thing that Parker’s finding did? What was it the first to do? Place humans in North America 10,000 years ago. When a verb acts as a modifier, it must be nonfinite (i.e., not conjugated to a specific subject), but \"places\" is a finite form of the verb. Choice B is incorrect. The object for the verb \"was\" is \"first,\" and \"placed\" is acting to modify \"first.\" What was it that Parker’s finding was the first to do? Place humans in North America 10,000 years ago. When a verb acts as a modifier, it must be nonfinite (i.e., not conjugated to a specific subject), but \"placed\" is a finite form. \"Placed\" can also be a past participle, but that wouldn’t make sense here because the meaning of \"the first placed humans\" would be unclear. Choice C is incorrect. The object for the verb \"was\" is \"first,\" and \"place\" is modifying \"first.\" What was the thing that Parker’s finding did? What was it the first to do? Place humans in North America. When a verb acts as a modifier, it must be nonfinite (i.e., not conjugated to a specific subject), but \"place\" is a finite form of the verb. Additionally, \"place\" can’t serve as a noun here, because it results in an illogical sentence (the \"finding\" wasn’t \"the first place\")."},{"i":"9127635a","c":"fss","d":"H","s":"Star actress Kiki Omeili, who has appeared in 47 Nollywood films, is one of numerous luminaries to be pictured in Nigerian portraitist Iké Udé’s exhibition Nollywood Portraits. ______ referred to Nollywood—Nigeria’s $3 billion film industry—as “Africa’s vivid mirror par excellence,” honors its legacy with his vivid classical portraits of Omeili and her peers.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["Udé, has","Udé has","Udé","Udé, having"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of verb forms and punctuation within a sentence. The sentence’s subject is “Udé,” and its finite main verb is “honors.”This choice correctly uses the nonfinite participle “having referred” to form a supplementary element (“having...excellence”) describing Udé. The comma after “Udé” appropriately marks the boundary before that supplementary element. Choice A is incorrect because using the finite verb “has referred” creates an ungrammatical sentence. The sentence already has the finite main verb “honors,” so “has referred” can’t also function as a second main verb here without additional punctuation or conjunctions. Moreover, no punctuation is needed when a subject (“Udé”) is immediately followed by a finite verb (“has referred”). Choice B is incorrect because using the finite verb “has referred” creates an ungrammatical sentence. The sentence already has the finite main verb “honors,” so “has referred” can’t also function as a second main verb here without additional punctuation or conjunctions. Choice C is incorrect because using the finite verb “referred” creates an ungrammatical sentence. The sentence already has the finite main verb “honors,” so “referred” can’t also function as a second main verb here without additional punctuation or conjunctions."},{"i":"aab78b25","c":"bound","d":"E","s":"Psychophysicist Howard Moskowitz was hired by a soda company to determine how much artificial sweetener ______ After conducting consumer taste tests, he found that no such ideal existed: participants expressed a wide range of preferences for different blends of sweetener, carbonization, and flavoring.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["do most people prefer in a diet drink?","do most people prefer in a diet drink.","most people prefer in a diet drink?","most people prefer in a diet drink."],"a":3,"r":"Choice D is the best answer. This sentence is a statement: “Moskowitz was hired by a soda company to determine how much artificial sweetener most people prefer in a diet drink.” So a period is the most appropriate punctuation mark. Choice A is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This sentence is not a question—it’s a statement. So a question mark is not the appropriate punctuation. Choice B is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. We already have the verbs “was hired…to determine” in this sentence. The verb “do” is not needed and results in a confusing, ungrammatical sentence. Choice C is incorrect. This doesn’t complete the text in a way that conforms to the conventions of Standard English. This sentence is not a question—it’s a statement. So a question mark is not the appropriate punctuation."},{"i":"6d4b2e1e","c":"bound","d":"H","s":"The 1977 play And the Soul Shall Dance depicts two Japanese American farming families in Depression-era Southern California. Critics have noted the way pioneering ______ compares the experiences of issei (Japanese nationals who emigrated to America) and nisei (their American- born children).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?","o":["playwright, Wakako Yamauchi,","playwright, Wakako Yamauchi","playwright Wakako Yamauchi,","playwright Wakako Yamauchi"],"a":3,"r":"Choice D is the best answer. The convention being tested is the use of punctuation between titles and proper nouns. No punctuation is needed to set off the proper noun \"Wakako Yamauchi\" from the title that describes Yamauchi, \"pioneering playwright.\" Because \"Wakako Yamauchi\" is essential information identifying the \"pioneering playwright,\" no punctuation is necessary. Choice A is incorrect because no punctuation is needed before or after the proper noun \"Wakako Yamauchi.\" Setting the playwright’s name off with commas suggests that it could be removed without affecting the coherence of the sentence, which isn’t the case. Choice B is incorrect because no punctuation is needed between the title \"pioneering playwright\" and the proper noun \"Wakako Yamauchi.\" Choice C is incorrect because no punctuation is needed between the proper noun \"Wakako Yamauchi\" and the verb \"compares.\""},{"i":"296801d2","c":"rs","d":"E","s":"While researching a topic, a student has taken the following notes: The Azores is a group of islands about 870 miles off the coast of Portugal. Historians have long believed that in the fifteenth century Portuguese mariners were the first humans to populate the Azores. A 2015 study coauthored by Sofia Gabriel and Maria da Luz Mathias found that Vikings from Scandinavia may have populated the Azores as early as the ninth century. The researchers found a genetic connection between house mice in the Azores and house mice in Scandinavia. House mice may have traveled from Scandinavia to the Azores on Viking ships. The student wants to specify who may have first populated the Azores, according to the 2015 study.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Historians have long believed that the first humans to populate the Azores, a group of islands about 870 miles off the coast of Portugal, arrived in the fifteenth century.","Portuguese mariners may not have been the first humans to populate the Azores.","In their 2015 study, the researchers found a genetic connection between house mice in the Azores and those in Scandinavia.","According to a 2015 study, the first humans to populate the Azores may have been Vikings from Scandinavia, not mariners from Portugal as previously believed."],"a":3,"r":"Choice D is the best answer. This choice effectively specifies who may have first populated the Azores, according to the 2015 study: the Vikings. Choice A is incorrect. This choice doesn’t effectively specify who may have first populated the Azores, according to the 2015 study. It only mentions the historical belief that the Portuguese were first. The 2015 study drew a different conclusion. Choice B is incorrect. This choice casts doubt on the Portuguese claim but doesn’t name the group of people who may have arrived before the Portuguese. Choice C is incorrect. This choice mentions the evidence that the researchers found but not the conclusion they drew from it. It doesn’t name the possible group of people who may have arrived before the Portuguese."},{"i":"1b94a80a","c":"rs","d":"M","s":"While researching a topic, a student has taken the following notes: Wool is a natural—and economically important—fiber that is obtained from animals like sheep. Australia is a leading producer of wool. The thickness of wool fibers varies across sheep breeds. Merino sheep produce fine wool that is used for apparel. Rambouillet sheep produce fine wool that is used for apparel. Romney sheep produce thick wool that is used for rugs and blankets. The student wants to emphasize how Romney wool differs from Merino and Rambouillet wool.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?","o":["Romney wool is just one of the many kinds of wools, each originating from a different breed of sheep.","Sheep wool varies from breed to breed, so Romney wool will be different than other kinds of wool.","The fine wool produced by Merino and Rambouillet sheep is used for apparel, whereas the thicker wool of Romney sheep is used in rugs and blankets.","Wool is an economically important fiber—especially in Australia—that can be used to make apparel or even rugs and blankets."],"a":2,"r":"Choice C is the best answer. This choice most effectively emphasizes how Romney wool differs from Merino and Rambouillet wool. It describes the difference in thickness and the difference in what they’re used for. Choice A is incorrect. This choice doesn’t emphasize how Romney wool differs from Merino and Rambouillet wool. It doesn’t mention Merino or Rambouillet wool at all. Choice B is incorrect. This choice doesn’t emphasize how Romney wool differs from Merino and Rambouillet wool. It doesn’t mention Merino or Rambouillet wool at all. Choice D is incorrect. This choice doesn’t emphasize how Romney wool differs from Merino and Rambouillet wool. It doesn’t mention Romney, Merino or Rambouillet wool at all."},{"i":"74028acf","c":"trans","d":"M","s":"Topographic maps show the elevation of landforms above sea level. Bathymetric maps, ______ show the elevation of landforms below the sea, providing valuable information to marine geophysicists like Claudia Flores, who studies seismic data from the northeastern Caribbean.\n\nWhich choice completes the text with the most logical transition?","o":["in conclusion,","for example,","by contrast,","afterward,"],"a":2,"r":"Choice C is the best answer. “By contrast” logically signals that the information about bathymetric maps in this sentence—that they show landforms’ elevation below the sea—presents a direct contrast to the previous information about topographic maps showing landforms’ elevation above sea level. Choice A is incorrect because “in conclusion” illogically signals that the information about bathymetric maps in this sentence concludes or summarizes the previous information about topographic maps. Instead, the sentence provides contrasting information about bathymetric maps. Choice B is incorrect because “for example” illogically signals that the information about bathymetric maps in this sentence exemplifies the previous information about topographic maps. Instead, the sentence provides contrasting information about bathymetric maps. Choice D is incorrect because “afterward” illogically signals that this sentence describes an event that chronologically follows the previous information about topographic maps. Instead, the sentence provides contrasting information about bathymetric maps."},{"i":"fd24f48f","c":"trans","d":"M","s":"Before California’s 1911 election to approve a proposition granting women the right to vote, activists across the state sold tea to promote the cause of suffrage. In San Francisco, the Woman’s Suffrage Party sold Equality Tea at local fairs. ______ in Los Angeles, activist Nancy Tuttle Craig, who ran one of California’s largest grocery store firms, distributed Votes for Women Tea.\n\nWhich choice completes the text with the most logical transition?","o":["For example,","To conclude,","Similarly,","In other words,"],"a":2,"r":"Choice C is the best answer. “Similarly” logically signals that the activity described in this sentence (Nancy Tuttle Craig distributing Votes for Women Tea in her Los Angeles grocery stores) is like the activity described in the previous sentence (the Woman’s Suffrage Party selling Equality Tea at fairs in San Francisco). Together, the two examples support the preceding claim that “activists across the state sold tea to promote the cause of suffrage.” Choice A is incorrect because “for example” illogically signals that the activity described in this sentence exemplifies the activity described in the previous sentence. Instead, the two activities are similar, and both support the preceding claim about selling tea to promote women’s right to vote. Choice B is incorrect because “to conclude” illogically signals that the activity described in this sentence concludes or summarizes the information in the previous sentences. Instead, the activity is similar to the one described in the previous sentence, and both support the preceding claim about selling tea to promote women’s right to vote. Choice D is incorrect because “in other words” illogically signals that the activity described in this sentence paraphrases the activity described in the previous sentence. Instead, the two activities are similar, and both support the preceding claim about selling tea to promote women’s right to vote."},{"i":"97e2e364","c":"trans","d":"M","s":"Okot p’Bitek’s poem Song of Lawino (1966) explores postcolonial Ugandan life through the eyes of a woman living in a rural village. With its vibrant imagery, bitingly satiric tone, and dexterous use of traditional Acholi song and phraseology, the poem inspired a generation of East African writers. ______ those who adopted its style are often referred to as Okot School poets.\n\nWhich choice completes the text with the most logical transition?","o":["Nevertheless,","Fittingly,","By comparison,","Instead,"],"a":1,"r":"Choice B is the best answer. “Fittingly” is a transition that means “appropriately” or “suitably,” and it is appropriate that writers who adopted their style from Okot p’Bitek would be known as the Okot School poets. Choice A is incorrect. This choice uses a disagreement transition. But this sentence is not disagreeing with anything—rather, it’s discussing how it makes sense for those writers who adopted Okot’s style to be known as the Okot School poets. Choice C is incorrect. This choice uses a transition that compares two ideas. But this sentence is not comparing the Okot School poets and their style to Okot’s style. Choice D is incorrect. This choice uses a disagreement transition. But this sentence is not disagreeing with anything—rather, it’s discussing how it makes sense for those writers who adopted Okot’s style to be known as the Okot School poets."}],"img":{"4042ff0b":"iVBORw0KGgoAAAANSUhEUgAAArwAAAEhBAMAAABvhG5wAAAAMFBMVEX4+Pjo6OjY2NjIyMi4uLioqKiYmJiIiIh4eHhoaGhYWFhISEg4ODgoKCgYGBgICAhiDgEKAABAIUlEQVR42u1dd0AUx9t+Zvfu6Nzsgb2wgL0eYq8ndo161iS2nCmaqElOE0ui/kJMjLEGe49o7MZ4GnuJZ8XY function fb(q){const a=ans[q.i],S=seg(q.r);

function card(q,n){const a=ans[q.i];
 return `<article class="q" data-n="${n}"><p class="n">Question ${n} of ${Q.length}</p>${IM[q.i]?`<img alt="Graph or table that goes with the question" src="data:image/png;base64,${IM[q.i]}">`:`<div class="stem">${q.s}</div>`}<div>${q.o.map((t,k)=>`<button class="o${done?(k===q.a?" ok":a===k?" bad":""):(a===k?" sel":"")}" data-k="${k}"${done?" disabled":""} aria-pressed="${a===k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</div>${done?`<div class="fb">${fb(q)}</div>`:""}</article>`}

function draw(){$("#list").innerHTML=Q.map((q,i)=>miss&&ans[q.i]===q.a?"":card(q,i+1)).join("");$("#end").hidden=done;$("#mi").hidden=!done;$("#mi").textContent=miss?"Show all questions":"Show only missed questions";sum()}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
